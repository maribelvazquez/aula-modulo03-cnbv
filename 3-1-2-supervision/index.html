 Entidad Supervisada"], "x": "El oficio de observaciones se dirige al Representante Legal, Apoderado o funcionario, con copia al director general.", "ref": "Art. 50, fr. IV"}, {"id": "S239", "tema": "des", "tipo": "caso", "q": "La CNBV concluye que ciertos hechos detectados en su vigilancia a una SOFOM regulada ameritan una multa. ¿Qué debe hacer previamente a imponerla?", "a": "Emplazar a la entidad mediante oficio fundado y motivado", "o": ["Emplazar a la entidad mediante oficio fundado y motivado", "Citar a comparecer a su director general", "Ordenar una visita de investigación", "Formularle recomendaciones y esperar 20 días hábiles"], "x": "Cuando los hechos ameriten sanción, la CNBV previamente deberá emplazar a la entidad para que manifieste, ofrezca pruebas y alegue.", "ref": "Art. 62"}, {"id": "S240", "tema": "des", "tipo": "memoria", "q": "¿Cuál de estas irregularidades está expresamente listada en el Reglamento para que el plazo de respuesta a observaciones pueda ser de 3 días hábiles?", "a": "Contravenir normas de registro contable que pudieran llevar a corregir y publicar estados financieros", "o": ["Entregar fuera de plazo un reporte regulatorio periódico exigido por las disposiciones de carácter general", "Omitir la actualización de sus manuales de políticas y procedimientos internos", "Incumplir los plazos de atención de quejas de usuarios de servicios financieros", "Contravenir normas de registro contable que pudieran llevar a corregir y publicar estados financieros"], "x": "El inciso a) prevé las contravenciones a normas de registro contable que eventualmente deriven en corrección y publicación de estados financieros.", "ref": "Art. 50, fr. VII, inc. a)"}, {"id": "S241", "tema": "des", "tipo": "caso", "q": "Vence el plazo de un oficio de observaciones y la unión de crédito no presentó escrito alguno. Si las irregularidades son corregibles, ¿qué ordenará la CNBV mediante oficio?", "a": "La adopción de acciones, medidas correctivas o programas de cumplimiento forzoso", "o": ["La intervención gerencial de la unión de crédito hasta que corrija las irregularidades", "La revocación inmediata de su autorización para operar como unión de crédito", "La adopción de acciones, medidas correctivas o programas de cumplimiento forzoso", "La clausura administrativa de sus oficinas hasta que responda las observaciones"], "x": "Si la entidad no manifiesta nada en plazo, la CNBV ordena medidas para corregir las irregularidades, siempre que sean susceptibles de corrección.", "ref": "Art. 51"}, {"id": "S242", "tema": "des", "tipo": "cifra", "q": "¿Cuántos requisitos (fracciones) enumera el art. 55 para el citatorio de comparecencia?", "a": "11", "o": ["8", "11", "7", "10"], "x": "El art. 55 enumera los requisitos del citatorio en las fracciones I a XI.", "ref": "Art. 55, frs. I a XI"}, {"id": "S243", "tema": "des", "tipo": "caso", "q": "Al leer el acta, un compareciente advierte que la redacción no refleja lo que declaró y pide corregirla. ¿Cuándo procede la corrección?", "a": "Siempre que la corrección no conlleve modificar el sentido de su declaración", "o": ["Nunca; el acta sólo puede combatirse después, por escrito", "Sólo si lo autoriza el Presidente de la CNBV", "En cualquier caso, aunque la corrección cambie el sentido de lo que declaró originalmente", "Siempre que la corrección no conlleve modificar el sentido de su declaración"], "x": "El compareciente puede pedir correcciones cuando el acta no refleje lo declarado y la corrección no modifique el sentido de su declaración.", "ref": "Art. 60, penúltimo párr."}, {"id": "S244", "tema": "des", "tipo": "memoria", "q": "En la fecha de la comparecencia, además de identificarse, ¿qué debe hacer la persona citada?", "a": "Formular protesta de que se conducirá con apego a la verdad", "o": ["Entregar un informe escrito de los hechos investigados", "Exhibir poder notarial vigente otorgado por la entidad", "Designar a los servidores públicos que la atenderán", "Formular protesta de que se conducirá con apego a la verdad"], "x": "El citado se identifica conforme al art. 22 y protesta conducirse con verdad ante los servidores públicos facultados.", "ref": "Art. 58"}, {"id": "S245", "tema": "des", "tipo": "caso", "q": "Al término de la diligencia, el compareciente se niega a firmar el acta. ¿Qué efecto tiene su negativa?", "a": "Se asienta la circunstancia en el acta, sin afectar su validez y valor probatorio", "o": ["Se asienta la circunstancia en el acta, sin afectar su validez y valor probatorio", "Se tiene por no realizada la comparecencia y debe citarse de nuevo", "El acta es nula y la comparecencia debe repetirse con otros testigos", "El acta sólo es válida si la firma su abogado en representación del compareciente"], "x": "Los servidores públicos asientan la negativa en la misma acta, sin que ello afecte su validez y valor probatorio.", "ref": "Art. 60, último párr."}, {"id": "S246", "tema": "des", "tipo": "memoria", "q": "Además de los supuestos contables, de capitalización y de calificación de cartera, ¿qué otro supuesto permite fijar 3 días hábiles para responder observaciones?", "a": "Los demás que, a juicio de la CNBV, se justifiquen en protección de los intereses del público", "o": ["Los que deriven de una visita de investigación a personas que operan sin autorización", "Los demás que, a juicio de la CNBV, se justifiquen en protección de los intereses del público", "Los que soliciten las Autoridades Supervisoras del Exterior conforme a los convenios", "Los que determine la Junta de Gobierno por mayoría calificada de sus miembros"], "x": "El inciso d) abre el plazo reducido a otras irregularidades que la Comisión justifique para proteger al público y preservar la estabilidad.", "ref": "Art. 50, fr. VII, inc. d)"}, {"id": "S247", "tema": "des", "tipo": "caso", "q": "La CNBV ordena a una SOFOM regulada un programa de cumplimiento forzoso. Además de sus términos, condiciones y plazo, ¿qué debe incluir el oficio?", "a": "El apercibimiento de las sanciones que podrían generarse si no adopta lo instruido", "o": ["El apercibimiento de las sanciones que podrían generarse si no adopta lo instruido", "La mención de que su representante puede comparecer acompañado de abogado y dos testigos", "Un derecho de audiencia previo de 15 días hábiles para que manifieste lo que convenga", "La designación de un interventor-gerente"], "x": "El oficio de medidas correctivas debe contener el apercibimiento de las sanciones por no adoptar lo instruido.", "ref": "Art. 53, fr. VI"}, {"id": "S248", "tema": "des", "tipo": "memoria", "q": "Los hechos, actos u omisiones de los que derivan las probables irregularidades, ¿dónde pueden señalarse en el oficio de observaciones?", "a": "En el cuerpo del oficio o en documento anexo", "o": ["En el acta de conclusión de la visita que les dio origen", "En el cuerpo del oficio o en documento anexo", "Únicamente en el cuerpo del oficio", "En un acta circunstanciada firmada ante dos testigos"], "x": "La fr. V permite señalarlos en el cuerpo del oficio o en un documento anexo.", "ref": "Art. 50, fr. V"}, {"id": "S249", "tema": "des", "tipo": "caso", "q": "Un emplazamiento se notifica un viernes y en las semanas siguientes no hay días inhábiles distintos de sábados y domingos. ¿Cuál es el último día del plazo ordinario de 10 días hábiles?", "a": "El viernes de la segunda semana siguiente a la notificación", "o": ["El viernes de la segunda semana siguiente a la notificación", "El lunes de la segunda semana siguiente a la notificación", "El viernes de la semana siguiente a la notificación", "El jueves de la segunda semana siguiente a la notificación"], "x": "Del lunes siguiente (día 1) se cuentan 10 días hábiles, que terminan el viernes de la segunda semana.", "ref": "Art. 62, primer párr."}, {"id": "S250", "tema": "des", "tipo": "caso", "q": "Una casa de bolsa recibe observaciones con plazo de 20 días hábiles (no relacionadas con los incisos a–d) y solicita una prórroga de 15 días hábiles. ¿Qué puede resolver la CNBV?", "a": "Otorgar prórroga, pero sin exceder de 10 días hábiles", "o": ["Otorgar los 15 días hábiles solicitados", "Otorgar una prórroga igual al plazo original de 20 días hábiles", "Otorgar prórroga, pero sin exceder de 10 días hábiles", "Negarla, porque el plazo para responder observaciones es improrrogable"], "x": "La prórroga procede a solicitud de la entidad cuando existan situaciones que le impidan ejercer su derecho, y no debe exceder de 10 días hábiles.", "ref": "Art. 50, penúltimo párr."}, {"id": "S251", "tema": "ext", "tipo": "caso", "q": "Un supervisor extranjero pretende inspeccionar a una Sociedad Controladora Filial en México. ¿Quién notifica a ésta la orden de visita?", "a": "La CNBV, mediante oficio que contenga la orden de visita", "o": ["La Institución Financiera del Exterior que la controla", "La Secretaría de Relaciones Exteriores", "La Autoridad Supervisora del Exterior, directamente", "La CNBV, mediante oficio que contenga la orden de visita"], "x": "Las visitas de supervisores del exterior se notifican por la CNBV mediante oficio fundado y motivado con la orden de visita.", "ref": "Art. 72, primer párr."}, {"id": "S252", "tema": "ext", "tipo": "caso", "q": "Un procedimiento administrativo de la CNBV contra una entidad inició antes de la entrada en vigor del Decreto de reformas de julio de 2021. ¿Conforme a qué disposiciones se concluye?", "a": "Conforme a las disposiciones aplicables vigentes a su inicio", "o": ["Conforme a las que elija la entidad por serle más favorables", "Conforme a las disposiciones reformadas en 2021", "Conforme a las disposiciones aplicables vigentes a su inicio", "Conforme al Reglamento de 1988, por ser anterior"], "x": "El Segundo transitorio del Decreto DOF 21-jul-2021 dispone que los procedimientos administrativos iniciados antes de su entrada en vigor se concluyen conforme a las disposiciones vigentes a su inicio. Ojo: en la compilación, el encabezado de ese bloque dice por errata «21 de julio de 2012»; el Decreto de 2012 sólo tiene un transitorio ÚNICO.", "ref": "Transitorio SEGUNDO (Decreto 2021)"}, {"id": "S253", "tema": "ext", "tipo": "memoria", "q": "Los medios electrónicos que determine la CNBV para notificar actos de supervisión, ¿pueden usarlos también las entidades?", "a": "Sí, para enviar a la CNBV las comunicaciones que requieran durante el proceso de supervisión", "o": ["No; sólo sirven para que la CNBV notifique sus actos de supervisión a las entidades", "Sólo para presentar reportes regulatorios de operaciones, no otras comunicaciones", "Sólo para interponer recursos contra sanciones, conforme a la ley aplicable", "Sí, para enviar a la CNBV las comunicaciones que requieran durante el proceso de supervisión"], "x": "El art. 109 permite a las entidades usar esos medios para enviar comunicaciones durante la supervisión, conforme a la regulación publicada en el DOF.", "ref": "Art. 109"}, {"id": "S254", "tema": "ext", "tipo": "caso", "q": "Se nombra interventor-gerente de una SOFIPO con domicilio social en Guadalajara. ¿Dónde debe inscribirse el oficio de nombramiento?", "a": "En el Registro Público de Comercio correspondiente al domicilio de la entidad intervenida", "o": ["En el Registro Nacional de Valores, en la sección correspondiente a la entidad", "En el Diario Oficial de la Federación y en un periódico de circulación nacional", "En el Registro Público de Comercio correspondiente al domicilio de la entidad intervenida", "En el Registro Público de Comercio de la Ciudad de México, sede de la CNBV"], "x": "El oficio se inscribe en la oficina del Registro Público de Comercio que corresponda al domicilio de la entidad.", "ref": "Art. 89"}, {"id": "S255", "tema": "ext", "tipo": "trampa", "q": "¿En cuántos ejemplares se firma el acta de inicio de la visita a una Filial y quiénes los conservan?", "a": "Dos: uno el Representante Legal o Apoderado de la Filial y otro el Inspector coordinador", "o": ["Dos: uno la Filial y otro la Autoridad Supervisora del Exterior", "Uno, que conserva la CNBV y del que se entrega copia simple", "Tres: uno la Filial, otro la CNBV y otro la Autoridad Supervisora del Exterior que pidió la visita", "Dos: uno el Representante Legal o Apoderado de la Filial y otro el Inspector coordinador"], "x": "El acta de inicio se firma en dos ejemplares autógrafos: uno para el Representante Legal o Apoderado y otro para el Inspector coordinador.", "ref": "Art. 76, párr. segundo"}, {"id": "S256", "tema": "ext", "tipo": "caso", "q": "Una Autoridad Supervisora del Exterior solicita por escrito a la CNBV visitar una Filial en México con 20 días naturales de anticipación. ¿Cumple el Reglamento?", "a": "No; debe solicitarlo cuando menos con 30 días naturales de anticipación", "o": ["No; debe solicitarlo cuando menos con 30 días naturales de anticipación", "Sí; para visitas de Autoridades Supervisoras del Exterior basta con 20 días hábiles", "Sí; el mínimo es de 15 días naturales", "Sí, siempre que se trate de una visita de investigación"], "x": "La solicitud debe presentarse por escrito cuando menos con 30 días naturales de anticipación a la fecha o periodo de la visita.", "ref": "Art. 71, primer párr."}, {"id": "S257", "tema": "ext", "tipo": "caso", "q": "Terminadas las actuaciones en el establecimiento clausurado, ¿con qué concluye la diligencia de clausura?", "a": "Con la colocación de sellos o marcas en accesos, archivos, bóvedas o equipos de cómputo", "o": ["Con la publicación del oficio de clausura en el Diario Oficial de la Federación", "Con la colocación de sellos o marcas en accesos, archivos, bóvedas o equipos de cómputo", "Con la entrega de las llaves del establecimiento a un interventor-gerente", "Con la firma del acta por el Presidente de la CNBV en las oficinas de la Comisión"], "x": "La diligencia concluye con sellos o marcas en accesos, archivos, bóvedas o equipos de cómputo.", "ref": "Art. 105"}, {"id": "S258", "tema": "ext", "tipo": "memoria", "q": "Para el Capítulo II del Título Séptimo, ¿qué es una Filial?", "a": "Entidad Supervisada con capital mayoritario de una Institución Financiera del Exterior o Sociedad Controladora Filial", "o": ["Sociedad constituida en el extranjero cuyo capital mayoritario pertenece a una Entidad Supervisada o a una Sociedad Controladora mexicana", "Entidad Supervisada con capital mayoritario de una Institución Financiera del Exterior o Sociedad Controladora Filial", "Oficina de representación en México de una entidad financiera del exterior", "Sucursal en México de un banco extranjero, sin personalidad jurídica propia distinta"], "x": "La fr. II define Filial como Entidad Supervisada con participación mayoritaria de una Institución Financiera del Exterior o Sociedad Controladora Filial.", "ref": "Art. 70, fr. II"}, {"id": "S259", "tema": "ext", "tipo": "memoria", "q": "Según los transitorios de 2005, ¿qué artículos del reglamento abrogado de 1988 siguieron vigentes y hasta cuándo?", "a": "Los arts. 37, 38 y 39, hasta que la CNBV emitiera disposiciones sobre información periódica", "o": ["Los arts. 1 a 10, hasta la entrada en vigor de la reforma de 2012", "Los arts. 23, 24 y 25, hasta que concluyeran las visitas de inspección ya iniciadas antes de su entrada en vigor", "Los arts. 37, 38 y 39, hasta que la CNBV emitiera disposiciones sobre información periódica", "Los arts. 37, 38 y 39, durante los seis meses siguientes a su publicación"], "x": "El Tercero transitorio mantuvo los arts. 37, 38 y 39 hasta que la Comisión emitiera disposiciones sobre la información periódica.", "ref": "Transitorio TERCERO (2005)"}, {"id": "S260", "tema": "ext", "tipo": "caso", "q": "Una casa de bolsa desea recibir las notificaciones de la CNBV por medios electrónicos. ¿Qué se requiere?", "a": "Que la entidad o su representante lo acepte o solicite expresamente por escrito a la CNBV", "o": ["Que la entidad o su representante lo acepte o solicite expresamente por escrito a la CNBV", "Que lo autorice la Junta de Gobierno de la CNBV mediante acuerdo notificado a la casa de bolsa", "Nada; la CNBV puede imponerlo unilateralmente por oficio", "Que la entidad publique en el Diario Oficial de la Federación su aceptación de ese medio"], "x": "Las notificaciones podrán hacerse por medios electrónicos cuando la entidad o su representante lo hayan aceptado o solicitado expresamente por escrito.", "ref": "Art. 108"}, {"id": "S261", "tema": "ext", "tipo": "caso", "q": "Una sociedad del país de origen es propietaria de acciones con voto que representan sólo el 30% del capital de otra, pero puede nombrar a la mayoría de su consejo de administración. ¿La controla para efectos del art. 70?", "a": "Sí, porque puede nombrar a la mayoría de los miembros del órgano de administración", "o": ["Sí, porque puede nombrar a la mayoría de los miembros del órgano de administración", "No, porque sus acciones con voto no representan el 51% del capital, único criterio de control del art. 70", "No, salvo que además tenga poder decisorio en sus asambleas de accionistas u órganos equivalentes", "Sólo si la CNBV lo declara así mediante oficio"], "x": "El control se da por cualquiera de los supuestos: acciones con voto que representen al menos el 51% del capital, poder decisorio en asambleas, nombrar a la mayoría del órgano de administración u otro medio.", "ref": "Art. 70, fr. VI, último párr."}, {"id": "S262", "tema": "ext", "tipo": "caso", "q": "La CNBV necesita ejecutar una clausura un domingo por la noche para evitar que se sustraigan documentos. ¿Es posible?", "a": "Sí; pueden habilitarse días y horas inhábiles cuando se requiera", "o": ["No; la clausura sólo procede en días y horas hábiles, sin excepción", "Sólo si el interesado consiente por escrito", "Sí; pueden habilitarse días y horas inhábiles cuando se requiera", "Sólo con orden judicial previa"], "x": "La clausura se realiza en días y horas hábiles, pudiendo habilitarse inhábiles para el debido cumplimiento de la facultad.", "ref": "Art. 103"}, {"id": "S263", "tema": "ext", "tipo": "caso", "q": "Un regulador extranjero pide directamente a un banco mexicano información sobre una operación. ¿Por conducto de quién únicamente puede proporcionarse?", "a": "De la CNBV, conforme a los convenios y acuerdos de cooperación celebrados", "o": ["Del auditor externo del banco", "Del propio banco, directamente, si el cliente titular otorga su consentimiento por escrito", "De la embajada del país solicitante", "De la CNBV, conforme a los convenios y acuerdos de cooperación celebrados"], "x": "La información requerida por supervisores de otros países únicamente puede proporcionarse por conducto de la Comisión.", "ref": "Art. 67"}, {"id": "S264", "tema": "ext", "tipo": "caso", "q": "La intervención de una entidad se volvió de imposible cumplimiento y el interventor-gerente pide su levantamiento conforme al art. 95 Bis; como la entidad carece de recursos para el inventario y el dictamen, la CNBV lo exime. ¿Qué documento debe elaborar para justificar el levantamiento?", "a": "Un informe con las causas de hecho y de derecho que justifiquen el levantamiento", "o": ["Un dictamen de los estados financieros de la entidad elaborado por un auditor externo independiente", "Un informe con las causas de hecho y de derecho que justifiquen el levantamiento", "El balance final de liquidación de la entidad intervenida", "Un programa de cumplimiento forzoso para la entidad intervenida"], "x": "En el levantamiento del art. 95 Bis, si se exime del inventario y dictamen, el interventor-gerente elabora un informe con las causas de hecho y de derecho que justifiquen el levantamiento. No confundir con el diagnóstico del art. 92 (exención durante la intervención).", "ref": "Art. 95 Bis"}, {"id": "S265", "tema": "ext", "tipo": "caso", "q": "Durante la intervención, el interventor-gerente acredita imposibilidad material para elaborar el inventario y el dictamen del art. 92, y la CNBV lo exime. ¿Qué debe elaborar en todo caso?", "a": "Un diagnóstico de las causas de revocación, disolución, liquidación o concurso y las acciones a seguir", "o": ["Un informe general como el que se elabora al concluir una visita de inspección", "Un acta de entrega-recepción de la administración y de los bienes de la entidad", "El balance final de liquidación, con el detalle de activos y pasivos, para revisión y aprobación de la CNBV", "Un diagnóstico de las causas de revocación, disolución, liquidación o concurso y las acciones a seguir"], "x": "Art. 92: aun eximido del inventario y del dictamen, el interventor-gerente debe elaborar un diagnóstico de causas y de acciones a seguir. No confundir con el informe de causas de hecho y de derecho del levantamiento del art. 95 Bis.", "ref": "Art. 92, párrs. segundo y tercero"}, {"id": "S266", "tema": "ext", "tipo": "caso", "q": "El oficio que notifica la declaración de intervención se dirige al director general de un banco. ¿A quién debe remitirse copia?", "a": "Al presidente del consejo de administración o al administrador único", "o": ["Al presidente del consejo de administración o al administrador único", "Al oficial de cumplimiento o al contralor normativo de la entidad", "Al auditor externo independiente o al comité de auditoría", "Al comisario de la sociedad o a su órgano de vigilancia"], "x": "A diferencia de los oficios de observaciones (copia al director general), el de intervención se dirige al director general con copia al presidente del consejo o administrador único.", "ref": "Art. 84, fr. IV"}, {"id": "S267", "tema": "ext", "tipo": "caso", "q": "La CNBV verifica que una persona moral capta recursos del público, operación reservada a Entidades Supervisadas, sin contar con autorización. ¿Qué puede ordenar?", "a": "La suspensión inmediata de operaciones o la clausura administrativa del establecimiento", "o": ["La intervención gerencial de la persona moral por conducto de un interventor", "La suspensión inmediata de operaciones o la clausura administrativa del establecimiento", "Medidas precautorias del art. 50 Bis, con derecho de audiencia posterior", "Observaciones con plazo de 20 días hábiles para que regularice su situación"], "x": "Ante operaciones reservadas sin autorización, la CNBV podrá ordenar la suspensión inmediata de operaciones o la clausura administrativa.", "ref": "Art. 101, primer párr."}, {"id": "S268", "tema": "ext", "tipo": "caso", "q": "Concluida la diligencia de intervención de una casa de bolsa, ¿quiénes conservan los tres ejemplares del acta?", "a": "El funcionario o empleado que atendió por la entidad, la CNBV y el interventor", "o": ["El funcionario o empleado que atendió por la entidad, la CNBV y el interventor", "La entidad, la Junta de Gobierno y la SHCP", "La entidad, la CNBV y el Registro Público de Comercio del domicilio de la entidad", "El director general, el presidente del consejo de administración y la CNBV"], "x": "El acta se firma en tres ejemplares: uno para quien atiende por la entidad, otro para la Comisión y otro para el interventor.", "ref": "Art. 87, primer párr."}, {"id": "S269", "tema": "ext", "tipo": "trampa", "q": "¿En cuántos ejemplares se firma el acta de clausura y quiénes los conservan?", "a": "Dos: uno quien atiende la diligencia y otro el servidor público de la CNBV que la realiza", "o": ["Tres: uno quien atiende la diligencia, otro la CNBV y otro los testigos que intervinieron en ella", "Tres: uno el interesado, otro la CNBV y otro el interventor designado", "Uno, que conserva la CNBV, y se entrega copia simple a quien atiende", "Dos: uno quien atiende la diligencia y otro el servidor público de la CNBV que la realiza"], "x": "El acta de clausura se firma en dos ejemplares autógrafos (a diferencia de los tres del acta de intervención).", "ref": "Art. 104, párr. segundo"}, {"id": "S270", "tema": "ext", "tipo": "memoria", "q": "¿Cuál de estos hechos es causa para que la CNBV levante la intervención de una Entidad Supervisada?", "a": "Que la entidad entre en disolución, liquidación o concurso mercantil", "o": ["Que const head = s=>!s.titulo?"":`<div class="sec-head"><h2>${esc(s.titulo)}</h2>${s.intro?`<p>${s.intro}</p>`:""}</div>${s.para?`<div class="para"><b>Para qué sirve</b>${s.para}</div>`:""}`;

const R = {};
let ITEMS = {}; // id -> {item, rama, color}
R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="frac"><button aria-expanded="false" data-ficha="${id}"><span class="rom">${esc(it.etiqueta)}</span><span><span class="nm">${esc(it.nombre)}</span><span class="hookt">${esc([it.verbo,it.gancho].filter(Boolean).join(" · "))}</span></span><span class="cnt">${esc(it.conteo||"")}</span></button><ul class="inc" hidden>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul></li>`}).join("")}</ul>`;
    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};
R.tarjetas = s=>head(s)+`<div class="cards">${s.tarjetas.map((c,i)=>{
  const col = colorDe(c.color,i);
  const top = c.encabezado?`<div class="chead"><div class="t">${esc(c.titulo)}</div>${c.subtitulo?`<div class="a">${esc(c.subtitulo)}</div>`:""}</div>`:(c.barra?`<div class="bar"></div>`:"");
  const body = c.filas? c.filas.map(f=>`<div class="frow"><span class="k">${esc(f.k)}</span>${f.v}</div>`).join("")
    : `<div class="cbody">${c.etiqueta?`<div class="lbl">${esc(c.etiqueta)}</div>`:""}${c.encabezado?"":`<h3>${esc(c.titulo)}</h3>`}${c.ref?`<span class="art">${esc(c.ref)}</span>`:""}${c.html?`<p>${c.html}</p>`:""}${c.lista?`<ul>${c.lista.map(l=>`<li>${l}</li>`).join("")}</ul>`:""}</div>`;
  return `<div class="card ${col}${c.ancho?" wide":""}">${top}${body}</div>`;}).join("")}</div>${s.nota?`<div class="note">${s.nota}</div>`:""}`;
R.escala = s=>{const cols=["var(--principal-linea)","#80bcb5","#a663cc","#ff8361","var(--oscuro)"];
  return head(s)+`<div class="card"><div class="cbody">${s.etiqueta?`<div class="lbl">${esc(s.etiqueta)}</div>`:""}${s.subtitulo?`<h3>${esc(s.subtitulo)}</h3>`:""}<div class="scale">${s.niveles.map((l,i)=>`<div class="lvl" style="--lc:${cols[i%5]}"><div class="n">${i+1}</div><div class="t">${esc(l.t)}</div><div class="d">${esc(l.d||"")}</div>${l.req?`<div class="req">${esc(l.req)}</div>`:""}</div>`).join("")}</div>${s.memo?`<p class="memo">${s.memo}</p>`:""}</div></div>`;};
R.pasos = s=>head(s)+`<ol class="track" style="--n:${s.pasos.length}" role="tablist" data-pasos="${s.id}">${s.pasos.map((p,i)=>`<li><button class="pill" role="tab" aria-selected="${i===0}" data-paso="${s.id}:${i}"><span class="circ">${i+1}</span><span class="nm">${esc(p.nombre)}</span></button></li>`).join("")}</ol><div class="stepd" id="stepd-${s.id}" role="tabpanel" aria-live="polite"></div>`+chant(s.frase);
R.flujo = s=>head(s)+`<div class="lanes">${s.carriles.map((c,i)=>`<div class="lane"><div class="lhead ${colorDe(c.color,i)}"><span class="t">${esc(c.titulo)}</span>${c.sub?`<span class="s">${esc(c.sub)}</span>`:""}</div><div class="flow">${c.nodos.map(n=>`<div class="node"><h4>${esc(n.titulo)}</h4>${n.ref?`<span class="art">${esc(n.ref)}</span>`:""}${n.texto?`<p>${n.texto}</p>`:""}${n.plazo?`<span class="plazo">${esc(n.plazo)}</span>`:""}${n.nota?`<p>${n.nota}</p>`:""}</div>`).join('<div class="arrow" aria-hidden="true">→</div>')}</div></div>`).join("")}</div>`;
R.cifras = s=>head(s)+`<div class="nums">${s.cifras.map(c=>`<div class="numt"><div class="v">${esc(c[0])}<small>${esc(c[1])}</small></div><div class="d">${esc(c[2])}</div><div class="r">${esc(c[3])}</div></div>`).join("")}</div>`;
R.simulador = s=>head({titulo:s.titulo||"Modo examen",para:s.para,intro:s.intro||"Opción múltiple con 4 opciones. Practica por tema en rondas de 10, o haz un simulacro de 30 o 50 que no repite reactivos hasta agotar el banco. Contesta con clic o con las teclas A, B, C, D."})+
  `<div class="simbar">${(s.tamanos||[30,50]).map(n=>`<button class="qsim" data-n="${+n}" aria-pressed="false">Simulacro de ${+n}</button>`).join("")}<span class="bankinfo" id="bankinfo"></span><button class="linkbtn" id="simReset">Reiniciar mi avance</button></div>
   <div class="lbl" style="margin-bottom:6px">O practica por tema (rondas de 10)</div><div class="modes" id="modes" role="group" aria-label="Tipo de práctica"></div><div class="quiz" id="quiz" aria-live="polite"></div>`;
R.repaso = s=>head({titulo:s.titulo||"Repaso",para:s.para,intro:s.intro||"Tandas al azar de un banco de repaso. Lee la pregunta y las cuatro opciones, decide tu respuesta y luego revélala."})+
  (s.fallas&&s.fallas.length?`${s.fallas_titulo?`<div class="lbl" style="margin:0 0 8px">${esc(s.fallas_titulo)}</div>`:""}<div class="cards rp-fallas">${s.fallas.map((f,i)=>`<div class="card ${colorDe(f.color,i)}"><div class="bar"></div><div class="cbody"><h3>${esc(f.titulo)}</h3><p>${f.texto}</p></div></div>`).join("")}</div>`:"")+
  `<div class="lbl" style="margin:22px 0 8px">${s.pool?"Elige cuántas preguntas":"Bloques"}</div><div class="modes" id="rpi-${s.id}" role="group" aria-label="Repaso"></div><div class="quiz rp-box" id="rp-${s.id}" aria-live="polite"></div>`;
$("#secciones").innerHTML = D.secciones.map((s,i)=>`<section class="block${s.tipo==="simulador"?" sim":""}" id="${s.id}">${R[s.tipo](s,i)}</section>`).join("");

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}
document.fonts && document.fonts.ready.then(redraw); redraw();

function showPaso(sid,i){
  const s=D.secciones.find(x=>x.id===sid), n=s.pasos.length; i=(i+n)%n; PASOS[sid]=i; const p=s.pasos[i];
  document.querySelectorAll(`[data-paso^="${sid}:"]`).forEach(b=>b.setAttribute("aria-selected",b.dataset.paso===`${sid}:${i}`));
  $("#stepd-"+sid).innerHTML=`<div class="big">${i+1}</div><div><div class="lbl">Paso ${i+1} de ${n}</div><h3>${esc(p.nombre)}</h3>${p.ref?`<span class="art">${esc(p.ref)}</span>`:""}${p.gancho?`<div class="hook">${esc(p.gancho)}</div>`:""}<ul>${(p.puntos||[]).map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="stepnav"><button class="btn ghost" data-pnav="${sid}:${i-1}">← Anterior</button><button class="btn" data-pnav="${sid}:${i+1}">Siguiente paso →</button></div></div>`;
}

/* ---------- repaso (tandas al azar o secuencia fija) ---------- */
// Con "pool": tandas al azar de 10/20/30 (configurable en "tandas") que no repiten hasta agotar el banco de repaso;
// las opciones se barajan. Con "bloques": secuencia fija, opciones sin barajar (para un guion con letras).
// Clic en una opción = respuesta del alumno; «Revelar respuesta» = la instructora muestra la correcta sin marcar a nadie.
D.secciones.filter(s=>s.tipo==="repaso").forEach(s=>{
  const BK={}; (D.banco||[]).forEach(q=>BK[q.id]=q);
  const TM=D.temas||{}, sim=D.secciones.find(x=>x.tipo==="simulador"), CL=s.claves||{};
  const box=$("#rp-"+s.id), idx=$("#rpi-"+s.id);
  const mix=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const KEY="rp-"+(D.meta.clave||"mapa")+"-"+s.id;
  const POOL=(s.pool||[]).filter(id=>BK[id]);
  let seq=[], i=0, meta=null;
  function fixedSeq(){ const out=[]; (s.bloques||[]).forEach((b,bi)=>b.items.forEach(it=>{if(BK[it.id]) out.push({...BK[it.id],opts:BK[it.id].o.slice(),clave:it.clave||CL[it.id]||"",extra:!!it.extra,bi,bt:b.titulo});})); return out; }
  function tanda(n){
    let used=new Set(st.get(KEY,[])), rest=POOL.filter(id=>!used.has(id)), pick;
    if(rest.length<n){ pick=mix(rest); used=new Set(); const more=mix(POOL.filter(id=>!pick.includes(id))).slice(0,n-pick.length); pick=pick.concat(more); more.forEach(id=>used.add(id)); }
    else { pick=mix(rest).slice(0,n); pick.forEach(id=>used.add(id)); }
    st.set(KEY,[...used]);
    return mix(pick).map(id=>({...BK[id],opts:mix(BK[id].o),clave:CL[id]||""}));
  }
  const sinSalir=()=>`${POOL.length-new Set(st.get(KEY,[])).size} de ${POOL.length} sin salir`;
  function start(n){ seq=n?tanda(n):fixedSeq(); meta={n}; seq.forEach(q=>{q.pick=null;q.shown=false;}); i=0; draw(); box.scrollIntoView({block:"start"}); }
  const fsTxt=()=>document.fullscreenElement?"Salir de pantalla completa":"Pantalla completa";
  if(s.pool){
    idx.innerHTML=(s.tandas||[10,20,30]).map(n=>`<button class="rpb" data-rpn="${n}" aria-pressed="false">${n} preguntas</button>`).join("")+`<span class="bankinfo" id="rpinfo-${s.id}" style="align-self:center">${POOL.length} preguntas en el banco de repaso · ${sinSalir()}</span>`;
    box.innerHTML=`<div class="qtext">Elige una tanda de ${(s.tandas||[10,20,30]).join(", ").replace(/, (\d+)$/," o $1")} preguntas.</div><p style="margin:10px 0 0">Salen al azar y no se repiten hasta agotar las ${POOL.length}; las opciones cambian de orden cada vez.</p>`;
  } else {
    idx.innerHTML=(s.bloques||[]).map((b,bi)=>`<button class="rpb" data-rpb="${bi}" aria-pressed="false">${bi+1} · ${esc(b.titulo)} <small>${b.items.length}</small></button>`).join("");
  }
  function draw(){
    idx.querySelectorAll("[data-rpn]").forEach(b=>b.setAttribute("aria-pressed",String(meta&&+b.dataset.rpn===meta.n)));
    if(!s.pool) idx.querySelectorAll("[data-rpb]").forEach(b=>b.setAttribute("aria-pressed",String(i<seq.length&&+b.dataset.rpb===seq[i].bi)));
    if(i>=seq.length) return fin();
    const q=seq[i], ok=q.opts.indexOf(q.a), lab=s.pool?`Tanda de ${seq.length}`:`Bloque ${q.bi+1} · ${esc(q.bt)}`;
    const good=seq.filter(x=>x.pick!=null&&x.opts[x.pick]===x.a).length;
    box.innerHTML=`<div class="qbar"><span>${lab} · pregunta ${i+1} de ${seq.length}</span><span>Aciertos: ${good}</span></div><div class="qprog"><i style="width:${i/seq.length*100}%"></i></div>
    <div class="qtag"><span>${esc(TM[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}${q.extra?"<span>Extra</span>":""}</div><div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt${q.shown?(k===ok?" right":(k===q.pick?" wrong":"")):""}" data-rpk="${k}"${q.shown?" disabled":""}><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="fb">${q.shown?`${q.pick==null?`<span class="ok">Respuesta ${"ABCD"[ok]}</span>`:(q.pick===ok?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>')}${q.pick!=null?tuHTML(q,q.opts[q.pick]):""} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}${q.clave?`<div class="rp-clave"><div class="lbl">Para no confundirte</div>${q.clave}</div>`:""}`:""}</div>
    <div class="qactions"><button class="btn ghost" data-rpnav="-1"${i===0?" disabled":""}>← Anterior</button>${q.shown?"":`<button class="btn" data-rpshow>Revelar respuesta</button>`}<button class="btn ghost" data-rpnav="1">${i+1===seq.length?"Ver resultado →":"Siguiente →"}</button><button class="btn ghost" data-rpfs>${fsTxt()}</button></div>`;
  }
  function fin(){
    const resp=seq.filter(x=>x.pick!=null), good=resp.filter(x=>x.opts[x.pick]===x.a).length, miss=seq.filter(x=>x.pick!=null&&x.opts[x.pick]!==x.a), c=s.cierre;
    box.innerHTML=`<div class="qbar"><span>${s.pool?`Tanda de ${seq.length} · resultado`:"Cierre"}</span><span>${resp.length?`${good}/${resp.length}`:""}</span></div><div class="qprog"><i style="width:100%"></i></div>
    ${resp.length?`<div class="score"><span class="big">${Math.round(good/resp.length*100)}%</span><span>${good} de ${resp.length} contestadas correctamente.</span></div>`:""}
    ${miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${miss.length})</summary><ul>${miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.opts[m.pick])}</s>${m.d&&m.d[m.opts[m.pick]]?` — ${esc(m.d[m.opts[m.pick]])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
    ${c?`<div class="qtext" style="margin-top:18px">${esc(c.titulo)}</div><ol class="rp-fin">${(c.pasos||[]).map(p=>`<li>${p}</li>`).join("")}</ol>${c.nota?`<div class="rp-clave">${c.nota}</div>`:""}`:""}
    <div class="qactions"><button class="btn ghost" data-rpnav="-1">← Anterior</button>${s.pool?`<button class="btn" data-rpn="${meta.n}">Otra tanda de ${meta.n}</button>`:""}${sim?`<a class="btn ghost" href="#${sim.id}">${esc(sim.nav||"Practicar")}</a>`:""}<button class="btn ghost" data-rpfs>${fsTxt()}</button></div>
    ${s.pool?`<p class="siminfo">${sinSalir()}</p>`:""}`;
    const inf=$("#rpinfo-"+s.id); if(inf) inf.textContent=`${POOL.length} preguntas en el banco de repaso · ${sinSalir()}`;
  }
  function reveal(){ if(!seq.length||i>=seq.length||seq[i].shown) return; seq[i].shown=true; draw(); }
  const go=n=>{ if(!seq.length) return; i=Math.max(0,Math.min(n,seq.length)); draw(); };
  function fs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else if(box.requestFullscreen) box.requestFullscreen(); }catch(e){} }
  document.addEventListener("fullscreenchange",()=>{const f=box.querySelector("[data-rpfs]");if(f)f.textContent=fsTxt();});
  const onClick=e=>{
    const n=e.target.closest("[data-rpn]"); if(n){start(+n.dataset.rpn);return;}
    const b=e.target.closest("[data-rpb]"); if(b){if(!seq.length||s.pool)start(0);go(seq.findIndex(q=>q.bi===+b.dataset.rpb));return;}
    const o=e.target.closest("[data-rpk]"); if(o&&seq[i]&&!seq[i].shown){seq[i].pick=+o.dataset.rpk;reveal();return;}
    if(e.target.closest("[data-rpshow]")){reveal();return;}
    const nv=e.target.closest("[data-rpnav]"); if(nv){go(i+(+nv.dataset.rpnav));return;}
    if(e.target.closest("[data-rpfs]")) fs();
  };
  idx.addEventListener("click",onClick); box.addEventListener("click",onClick);
  document.addEventListener("keydown",e=>{
    if(!seq.length||e.target.closest("input,textarea")||!$("#drawer").hidden) return;
    const r=box.getBoundingClientRect(); if(document.fullscreenElement!==box&&(r.bottom<0||r.top>innerHeight)) return;
    if(e.key==="ArrowRight"){go(i+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(i-1);e.preventDefault();}
    else if(e.key.toLowerCase()==="r"){reveal();e.preventDefault();}
    else if(e.key.toLowerCase()==="f"){fs();e.preventDefault();}
  });
  if(!s.pool) start(0);
});

/* ---------- simulador ---------- */
if(!D.secciones.some(s=>s.tipo==="simulador")) return;
const BANK=D.banco||[], TEMAS=D.temas||{};
const MODOS=[{k:"all",l:"Todo mezclado",f:()=>true}].concat((D.modos||[]).map(m=>({k:m.k,l:m.l,f:x=>(m.tema?x.tema===m.tema:true)&&(m.tipos?m.tipos.includes(x.tipo):true)})));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY=D.meta.clave||"mapa", SEEN="seen-"+KEY, SIM="sim-"+KEY;
let seen=new Set(store.get(SEEN,[])), MODE="all", ST=null;
const poolFor=k=>BANK.filter(MODOS.find(m=>m.k===k).f);
const simInfo=()=>`${BANK.length-store.get(SIM,[]).length} de ${BANK.length} sin salir en simulacro`;
const bankInfo=()=>`${BANK.length} reactivos verificados contra el texto oficial · ${simInfo()}`;
function startRound(){const pool=poolFor(MODE);const fresh=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));start(fresh.concat(old).slice(0,10),{kind:"ronda",label:MODOS.find(m=>m.k===MODE).l});}
const SIMSEC=D.secciones.find(s=>s.tipo==="simulador")||{};
function cuotas(n,pesos){ // reparto por resto mayor; sólo temas con reactivos
  const ks=Object.keys(pesos).filter(k=>pesos[k]>0&&BANK.some(x=>x.tema===k)), tot=ks.reduce((a,k)=>a+pesos[k],0);
  if(!ks.length) return null;
  const raw=ks.map(k=>({k,v:n*pesos[k]/tot})), out={}; let asig=0;
  raw.forEach(r=>{out[r.k]=Math.floor(r.v);asig+=out[r.k];});
  raw.sort((a,b)=>(b.v%1)-(a.v%1)).slice(0,n-asig).forEach(r=>out[r.k]++);
  return out;
}
function startSim(n){
  if(SIMSEC.proporcion){
    const q=cuotas(n,SIMSEC.proporcion);
    if(q){
      let used=new Set(store.get(SIM,[])), pick=[], cycled=false;
      Object.entries(q).forEach(([k,c])=>{
        const delTema=BANK.filter(x=>x.tema===k); let rest=shuffle(delTema.filter(x=>!used.has(x.id)));
        if(rest.length<c){cycled=true;delTema.forEach(x=>used.delete(x.id));rest=rest.concat(shuffle(delTema.filter(x=>!rest.includes(x))));}
        rest=rest.slice(0,c); rest.forEach(x=>used.add(x.id)); pick=pick.concat(rest);
      });
      store.set(SIM,[...used]); return start(shuffle(pick),{kind:"simulacro",label:`Simulacro de ${pick.length}`,n,cycled});
    }
  }
  let used=new Set(store.get(SIM,[])), rest=BANK.filter(x=>!used.has(x.id)), cycled=false;
  if(rest.length<n){cycled=true;const take=shuffle(rest);used=new Set();const more=shuffle(BANK.filter(x=>!take.includes(x))).slice(0,n-take.length);rest=take.concat(more);more.forEach(x=>used.add(x.id));}
  else{rest=shuffle(rest).slice(0,n);rest.forEach(x=>used.add(x.id));}
  store.set(SIM,[...used]); start(shuffle(rest),{kind:"simulacro",label:`Simulacro de ${n}`,n,cycled});
}
function start(list,meta){ST={list:list.map(q=>({...q,opts:shuffle(q.o)})),i:0,ok:0,miss:[],byTema:{},meta};document.querySelectorAll(".qmode,.qsim").forEach(b=>b.setAttribute("aria-pressed","false"));render();}
function render(){
  const box=$("#quiz"),n=ST.list.length; if(ST.i>=n) return renderEnd();
  const q=ST.list[ST.i];
  box.innerHTML=`<div class="qbar"><span>${esc(ST.meta.label)} · reactivo ${ST.i+1} de ${n}</span><span>Aciertos: ${ST.ok}</span></div><div class="qprog"><i style="width:${ST.i/n*100}%"></i></div>
  <div class="qtag"><span>${esc(TEMAS[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}</div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>
  <div class="qactions"><button class="btn" id="qNext" hidden>${ST.i+1===n?"Ver resultado":"Siguiente"}</button><button class="btn ghost" id="qQuit">Terminar aquí</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  $("#qNext").addEventListener("click",()=>{ST.i++;render();});
  $("#qQuit").addEventListener("click",()=>{ST.list=ST.list.slice(0,ST.i);renderEnd();});
}
function answer(k){
  const q=ST.list[ST.i]; if(q.done) return; q.done=true; const good=q.opts[k]===q.a;
  const t=ST.byTema[q.tema]||(ST.byTema[q.tema]={ok:0,n:0}); t.n++; if(good){ST.ok++;t.ok++;} else {q.mine=q.opts[k];ST.miss.push(q);}
  seen.add(q.id); store.set(SEEN,[...seen]);
  $("#quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.a)b.classList.add("right");else if(+b.dataset.k===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`${good?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>'}${good?"":tuHTML(q,q.opts[k])} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}`;
  const nb=$("#qNext"); nb.hidden=false; nb.focus();
}
function renderEnd(){
  const box=$("#quiz"),n=ST.list.length,pct=n?Math.round(ST.ok/n*100):0;
  const msg=pct>=90?"Listos para el examen.":pct>=75?"Muy bien: repasen los temas con menos aciertos.":pct>=60?"Van bien, pero hay que repasar.":"Toca volver al mapa y repasar antes del siguiente intento.";
  const rows=Object.entries(ST.byTema).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>`<div class="trow2"><span>${esc(TEMAS[k]||k)}</span><span class="tb"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></span><span class="tv">${v.ok}/${v.n}</span></div>`).join("");
  box.innerHTML=`<div class="printhead"><b>${esc(D.meta.titulo)}</b> · 360Educa · ${esc(ST.meta.label)} · ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div><div class="qbar"><span>${esc(ST.meta.label)} · resultado</span><span>${ST.ok}/${n}</span></div><div class="qprog"><i style="width:100%"></i></div>
  <div class="score"><span class="big">${pct}%</span><span>${ST.ok} de ${n} correctas. ${msg}</span></div>
  ${rows?`<div class="lbl" style="margin-top:14px">Aciertos por tema (de menor a mayor)</div><div class="trows">${rows}</div>`:""}
  ${ST.miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${ST.miss.length})</summary><ul>${ST.miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.mine||"")}</s>${m.d&&m.d[m.mine]?` — ${esc(m.d[m.mine])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
  <div class="qactions"><button class="btn" id="qAgain">${ST.meta.kind==="simulacro"?"Otro simulacro igual":"Otra ronda"}</button><button class="btn ghost" id="qPrint">Imprimir o guardar en PDF</button><a class="btn ghost" href="#${mapa0?mapa0.id:"top"}">Repasar el mapa</a></div>
  ${ST.meta.kind==="simulacro"?`<p class="siminfo">${simInfo()}${ST.meta.cycled?" · Se completó el banco y empezó una vuelta nueva.":""}</p>`:""}`;
  $("#qAgain").addEventListener("click",()=>ST.meta.kind==="simulacro"?startSim(ST.meta.n):startRound());
  $("#qPrint").addEventListener("click",()=>{const d=box.querySelector("details.miss");if(d)d.open=true;window.print();});
  $("#bankinfo").textContent=bankInfo();
}
document.addEventListener("keydown",e=>{
  if(!ST||e.target.closest("input,textarea")) return;
  const r=$("#quiz").getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
  const k="abcd1234".indexOf(e.key.toLowerCase()); if(k>=0&&ST.i<ST.list.length&&!ST.list[ST.i].done){answer(k%4);e.preventDefault();}
});
$("#modes").innerHTML=MODOS.map(m=>`<button class="qmode" data-m="${m.k}" aria-pressed="false">${esc(m.l)} <small>${poolFor(m.k).length}</small></button>`).join("");
document.querySelectorAll(".qmode").forEach(b=>b.addEventListener("click",()=>{MODE=b.dataset.m;startRound();b.setAttribute("aria-pressed","true");}));
document.querySelectorAll(".qsim").forEach(b=>b.addEventListener("click",()=>{startSim(+b.dataset.n);b.setAttribute("aria-pressed","true");}));
$("#simReset").addEventListener("click",()=>{store.set(SIM,[]);store.set(SEEN,[]);seen=new Set();$("#bankinfo").textContent=bankInfo();});
$("#bankinfo").textContent=bankInfo();
startRound(); document.querySelector('.qmode[data-m="all"]').setAttribute("aria-pressed","true");
})();
</script>
</body>
