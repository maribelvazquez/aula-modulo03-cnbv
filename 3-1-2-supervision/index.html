 Se hace constar en el acta sin afectar su validez.", "ref": "Art. 26, segundo párrafo"}, {"id": "S134", "tema": "gen", "tipo": "caso", "q": "La CNBV revisa sólo una selección aleatoria de expedientes de clientes de una institución de crédito, en lugar de la totalidad. La institución alega que eso no está previsto. ¿Tiene razón?", "a": "No; la supervisión puede realizarse mediante muestras representativas y aleatorias de la información", "o": ["Sí; la supervisión debe abarcar la totalidad de la información de la entidad", "Sí, salvo que se trate de una visita de investigación ordenada por la Junta de Gobierno", "No; la supervisión puede realizarse mediante muestras representativas y aleatorias de la información", "No, pero sólo si la entidad lo solicitó previamente por escrito"], "x": "El art. 1 (y los arts. 4 y 43) permiten ejercer la supervisión mediante el análisis de muestras representativas y aleatorias de información, documentación, sistemas o equipos.", "ref": "Art. 1, cuarto párrafo"}, {"id": "S135", "tema": "vis", "tipo": "caso", "q": "La visita tiene lugar en un solo local. Los Inspectores quieren trabajar sábado y domingo para cumplir en tiempo, aunque la entidad no labora esos días. ¿Pueden hacerlo?", "a": "Sí; pueden actuar en días y horas inhábiles cuando lo estimen necesario para cumplir sus funciones", "o": ["No; siempre deben apegarse estrictamente al horario de la entidad visitada", "Sí; pueden actuar en días y horas inhábiles cuando lo estimen necesario para cumplir sus funciones", "Sólo si la entidad lo autoriza por escrito y la circunstancia se asienta en un acta parcial de la visita", "Sólo en visitas de investigación, nunca en ordinarias o especiales"], "x": "Aunque deben apegarse al horario de la entidad, el art. 28 permite a los Inspectores actuar en días y horas inhábiles cuando lo estimen necesario.", "ref": "Art. 28, primer párrafo"}, {"id": "S136", "tema": "vis", "tipo": "caso", "q": "Un auditor externo contratado por la CNBV para auxiliar en la visita llega a la entidad. ¿Con qué debe identificarse?", "a": "Con identificación oficial vigente con fotografía y el documento de acreditación de su empresa o institución", "o": ["Con identificación oficial vigente con fotografía y el documento de acreditación de su empresa o institución", "Con credencial vigente con fotografía expedida por la CNBV y el oficio de comisión firmado por el Inspector coordinador", "Con identificación oficial y el convenio de confidencialidad firmado con la entidad", "Sólo con su cédula profesional de contador público"], "x": "Los auditores y profesionistas contratados deben presentar identificación oficial vigente con fotografía y el documento de acreditación expedido por la empresa o institución correspondiente.", "ref": "Art. 22, segundo párrafo"}, {"id": "S137", "tema": "vis", "tipo": "caso", "q": "Los expedientes digitales de clientes de una SOFOM regulada están alojados en un proveedor de servicios en la nube. Los Inspectores los requieren y la SOFOM responde que «lo pidan al proveedor». ¿Qué prevé el Reglamento?", "a": "La SOFOM está obligada a solicitar y obtener la información del tercero para entregarla a los Inspectores", "o": ["La SOFOM queda liberada si exhibe el contrato celebrado con el proveedor y le notifica el requerimiento", "La SOFOM está obligada a solicitar y obtener la información del tercero para entregarla a los Inspectores", "Los Inspectores deben requerir la información directamente al proveedor, mediante oficio de la CNBV dirigido a éste", "La información se tiene por no exhibida sin mayor trámite"], "x": "Si la información está almacenada, custodiada o resguardada por un tercero, la entidad está obligada a solicitarla y obtenerla para su entrega a los Inspectores.", "ref": "Art. 32, primer párrafo"}, {"id": "S138", "tema": "vis", "tipo": "caso", "q": "Durante la visita, el Inspector detecta que el banco dejó de reportar de forma sistemática operaciones inusuales, lo que a su juicio implica un incumplimiento grave. ¿Qué debe hacer?", "a": "Levantar un acta parcial", "o": ["Levantar de inmediato el acta de conclusión de la visita", "Levantar un acta parcial", "Girar al oficial de cumplimiento una instrucción correctiva por escrito", "Consignarlo únicamente en el informe general al terminar la visita"], "x": "Los Inspectores deben levantar acta parcial cuando conozcan hechos, actos u omisiones que, a su juicio, puedan implicar incumplimientos graves.", "ref": "Art. 34, fr. I"}, {"id": "S139", "tema": "gen", "tipo": "caso", "q": "Una institución de crédito debe entregar un reporte periódico a la CNBV y la disposición aplicable no señala forma de entrega. ¿Por qué medio debe presentarlo?", "a": "A través de la oficialía de partes de la CNBV", "o": ["Por correo electrónico al supervisor asignado a la institución", "A los Inspectores, en la siguiente visita ordinaria", "A través de la oficialía de partes de la CNBV", "Por el medio electrónico que elija la propia institución"], "x": "La información debe entregarse a través de la oficialía de partes de la CNBV cuando las leyes o disposiciones aplicables no establezcan otra forma de entrega.", "ref": "Art. 44"}, {"id": "S140", "tema": "vis", "tipo": "cifra", "q": "¿Cuántos requisitos enumera el art. 20 del Reglamento para el oficio que contiene la orden de visita?", "a": "10", "o": ["8", "10", "9", "6"], "x": "Además de estar fundado y motivado, el oficio de orden de visita debe cumplir diez requisitos (frs. I a X).", "ref": "Art. 20, frs. I a X"}, {"id": "S141", "tema": "vis", "tipo": "caso", "q": "La orden de visita especial a un banco se lleva a cabo en su matriz y en dos sucursales. Además del acta de inicio, ¿qué actas deben levantarse por los lugares?", "a": "Un acta de constancia de visita en cada uno de los lugares visitados", "o": ["Un acta de inicio independiente en cada uno de los tres lugares", "Una sola acta de inicio que comprenda los tres lugares, sin actas adicionales", "Un acta parcial obligatoria por cada sucursal visitada", "Un acta de constancia de visita en cada uno de los lugares visitados"], "x": "Cuando la orden señala dos o más lugares, además del acta de inicio se levanta un acta de constancia de visita en cada uno de los lugares visitados.", "ref": "Art. 25, primer párrafo"}, {"id": "S142", "tema": "vis", "tipo": "memoria", "q": "¿A quién da a conocer el informe general, una vez concluida la visita, los hechos, actos u omisiones conocidos por el Inspector coordinador?", "a": "Al servidor público de la CNBV competente para conocer de la visita", "o": ["Al servidor público de la CNBV competente para conocer de la visita", "Al pleno de la Junta de Gobierno de la CNBV, para su resolución", "Al comité de auditoría de la entidad visitada, para su atención", "Al consejo de administración de la entidad, con copia al director general"], "x": "El informe general tiene por objeto hacer del conocimiento del servidor público competente de la CNBV los hechos que el Inspector coordinador conoció durante la visita.", "ref": "Art. 12"}, {"id": "S143", "tema": "vis", "tipo": "caso", "q": "El Representante Legal de la entidad se niega a firmar el acta de inicio y a recibir su ejemplar. ¿Qué efecto tiene?", "a": "Se asienta en el acta, sin que ello afecte su validez y valor probatorio", "o": ["Se asienta en el acta, sin que ello afecte su validez y valor probatorio", "El acta carece de valor probatorio y debe levantarse de nuevo", "Se suspende la visita hasta que el Representante firme el acta", "Debe firmar en su lugar uno de los testigos designados"], "x": "La negativa a firmar o a recibir el ejemplar se asienta en la propia acta sin afectar su validez y valor probatorio.", "ref": "Art. 24, último párrafo"}, {"id": "S144", "tema": "vis", "tipo": "caso", "q": "A mitad de la visita, un empleado de la entidad dice que los correos electrónicos y las grabaciones telefónicas «no son documentación» y se niega a mostrarlos. ¿Qué prevé el Reglamento?", "a": "Sí forman parte: la documentación incluye correspondencia y archivos magnéticos, digitalizados o grabados", "o": ["Sólo forman parte si están impresos y firmados por un funcionario", "Sí forman parte: la documentación incluye correspondencia y archivos magnéticos, digitalizados o grabados", "Sólo forman parte si la orden de visita los enumera expresamente en la relación de información inicial", "No forman parte: la documentación sólo comprende libros de actas, registros y auxiliares contables impresos"], "x": "El art. 29 comprende, de manera enunciativa, informes, registros, libros de actas, correspondencia, sistemas automatizados y archivos magnéticos, digitalizados o grabados.", "ref": "Art. 29, segundo párrafo"}, {"id": "S145", "tema": "vis", "tipo": "memoria", "q": "Además de los Inspectores, ¿a quiénes debe nombrar la orden de visita, en su caso, conforme a la fr. IX del art. 20?", "a": "A los auditores y profesionistas acreditados por la CNBV y a los servidores de otras autoridades financieras", "o": ["A los testigos de asistencia y al Representante Legal o Apoderado que atenderá la visita en la entidad", "Al oficial de cumplimiento y al auditor interno de la entidad que atenderán la visita", "A los empleados de la entidad que apoyarán a los Inspectores durante la visita", "A los auditores y profesionistas acreditados por la CNBV y a los servidores de otras autoridades financieras"], "x": "La fr. IX exige el nombre de los Inspectores (indicando al coordinador) y, en su caso, de auditores y profesionistas acreditados y de servidores públicos de las autoridades del art. 18.", "ref": "Art. 20, fr. IX"}, {"id": "S146", "tema": "gen", "tipo": "caso", "q": "Mediante oficio, la CNBV pide a un transmisor de dinero información adicional para su función de vigilancia. ¿Cómo debe entregarla, si no usa medios electrónicos?", "a": "Por la oficialía de partes, dirigida a la unidad administrativa solicitante, en el plazo señalado", "o": ["Por la oficialía de partes, dirigida a la unidad administrativa solicitante, en el plazo señalado", "Directamente al Presidente de la CNBV, dentro de 20 días hábiles", "Por la oficialía de partes, dirigida a la Junta de Gobierno de la CNBV, dentro de los 10 días hábiles", "A los Inspectores de la unidad solicitante, en la siguiente visita"], "x": "La información pedida por oficio en términos del art. 46 se entrega por oficialía de partes, dirigida a la unidad administrativa que la solicitó, dentro del plazo señalado.", "ref": "Art. 46, primer párrafo"}, {"id": "S147", "tema": "vis", "tipo": "caso", "q": "Para completar una visita a una casa de cambio, la CNBV decide incorporar a un Inspector que no figura en la orden de visita. ¿Qué se requiere para que participe?", "a": "Que la CNBV notifique previamente y por escrito a la entidad el aumento de Inspectores", "o": ["Basta con que el Inspector coordinador lo asiente en un acta parcial", "Que la entidad visitada manifieste su conformidad en el acta de inicio", "Basta con que se identifique con credencial vigente con fotografía de la CNBV", "Que la CNBV notifique previamente y por escrito a la entidad el aumento de Inspectores"], "x": "El aumento o sustitución de Inspectores debe notificarse previamente y por escrito a la entidad por el servidor público facultado para emitir la orden.", "ref": "Art. 20, último párrafo"}, {"id": "S148", "tema": "vis", "tipo": "caso", "q": "La entidad visitada dice no tener lugar para los Inspectores y les sugiere trabajar en una cafetería cercana con sus propias computadoras y conexión. ¿Cumple con el Reglamento?", "a": "No; debe proporcionarles espacio físico y equipo de cómputo, de oficina y de comunicación", "o": ["Sí, si la visita se practica en un solo día y así se asienta en el acta de inicio", "Sí, siempre que la entidad reembolse a la CNBV los gastos de conexión y traslado", "Sí, porque el espacio y el equipo de los Inspectores corren por cuenta de la CNBV", "No; debe proporcionarles espacio físico y equipo de cómputo, de oficina y de comunicación"], "x": "El art. 30 obliga a la entidad a proporcionar el espacio físico necesario y a poner a disposición el equipo de cómputo, de oficina y de comunicación que requieran los Inspectores.", "ref": "Art. 30, primer párrafo"}, {"id": "S149", "tema": "vis", "tipo": "trampa", "q": "¿Cuál de los siguientes supuestos NO obliga a los Inspectores a levantar un acta parcial?", "a": "Que el Representante Legal se niegue a firmar el acta de inicio", "o": ["Que no se rinda el informe por escrito sobre un hecho relevante", "Que la entidad realice acciones tendientes a obstaculizar la visita", "Que la entidad no exhiba la información que le fue requerida", "Que el Representante Legal se niegue a firmar el acta de inicio"], "x": "La negativa a firmar el acta de inicio sólo se asienta en ella (art. 24); los otros tres son casos de acta parcial obligatoria del art. 34.", "ref": "Art. 34, frs. II, III y V; Art. 24"}, {"id": "S150", "tema": "vis", "tipo": "caso", "q": "Una visita no pudo iniciar en la fecha prevista en la orden porque la entidad sufrió un corte eléctrico general, causa ajena a la CNBV. ¿Qué prevé el Reglamento?", "a": "Hacerlo constar en un acta circunstanciada que cumpla, en lo conducente, las formalidades del Reglamento", "o": ["Hacerlo constar en un acta circunstanciada que cumpla, en lo conducente, las formalidades del Reglamento", "Asentarlo sólo en el informe general, sin levantar acta alguna en el domicilio", "Levantar un acta parcial obligatoria por obstaculización de la visita a cargo de la entidad", "Tener por concluida la visita y archivar la orden, sin necesidad de levantar acta"], "x": "Cuando por causas ajenas a la CNBV la visita no se inicia en la fecha prevista, la situación se hace constar en un acta circunstanciada con las formalidades conducentes.", "ref": "Art. 25, último párrafo"}, {"id": "S151", "tema": "gen", "tipo": "memoria", "q": "Para efectos del Reglamento, ¿quién se considera «Representante Legal o Apoderado»?", "a": "El director general o quien tenga poder, o facultades por ley, para representarla ante autoridades administrativas", "o": ["El oficial de cumplimiento designado por la entidad y registrado ante la CNBV para atender visitas", "Únicamente el director general, siempre que haya sido designado por el consejo de administración y su poder conste en escritura", "El director general o quien tenga poder, o facultades por ley, para representarla ante autoridades administrativas", "Cualquier empleado que se encuentre en el domicilio de la entidad al momento de iniciar la visita"], "x": "La fr. VI del art. 3 incluye al director general y a cualquier funcionario, empleado o persona física con poder para representar a la entidad ante autoridades administrativas, o con esas facultades por ley.", "ref": "Art. 3, fr. VI"}, {"id": "S152", "tema": "vis", "tipo": "caso", "q": "Tras concluir una visita ordinaria, la CNBV quiere constatar en sitio cómo evolucionaron los hallazgos, sin esperar al siguiente programa anual. ¿Qué tipo de visita puede ordenar?", "a": "Especial, para dar seguimiento a los resultados obtenidos en una visita de inspección", "o": ["Ordinaria, pues deriva de una visita incluida en el programa anual", "Ninguna; el seguimiento sólo puede hacerse por vigilancia", "Especial, para dar seguimiento a los resultados obtenidos en una visita de inspección", "Ninguna nueva; basta reabrir la visita concluida con la misma orden y levantar un acta parcial"], "x": "El art. 8, fr. II, prevé visitas especiales para dar seguimiento a los resultados obtenidos en una visita de inspección.", "ref": "Art. 8, fr. II"}, {"id": "S153", "tema": "vis", "tipo": "caso", "q": "Un Inspector autorizado en la orden de visita se incorpora al tercer día, cuando la visita ya había iniciado. ¿Qué debe ocurrir?", "a": "Identificarse al iniciar su participación y hacerlo constar en el acta de conclusión", "o": ["No puede participar por no haber estado presente al inicio de la visita", "Levantar una nueva acta de inicio con su participación y dos testigos", "Identificarse al iniciar su participación y hacerlo constar en el acta de conclusión", "Identificarse y hacerlo constar en un acta parcial obligatoria"], "x": "Los Inspectores autorizados no presentes al inicio deben identificarse al comenzar su participación, circunstancia que se hace constar en el acta de conclusión.", "ref": "Art. 27"}, {"id": "S154", "tema": "vis", "tipo": "memoria", "q": "¿Qué función tienen los informes parciales de una visita de inspección?", "a": "Informar oportunamente hechos que ameriten observaciones antes de que termine la visita o definir medidas correctivas", "o": ["Dar a conocer a la entidad los hallazgos preliminares para que los desvirtúe antes del acta de conclusión", "Formalizar el emplazamiento para la imposición de sanciones por los hechos detectados", "Sustituir al informe general cuando la visita se prorroga más allá de seis meses", "Informar oportunamente hechos que ameriten observaciones antes de que termine la visita o definir medidas correctivas"], "x": "Los informes parciales dan a conocer oportunamente al servidor público competente hechos que, por sus implicaciones, permiten formular observaciones antes de terminar la visita o definir medidas correctivas.", "ref": "Art. 14"}, {"id": "S155", "tema": "vis", "tipo": "caso", "q": "Un Inspector quiere entrevistar a un cajero de sucursal sobre la operación de depósitos en efectivo. El gerente dice que sólo puede entrevistarse al Representante Legal. ¿Qué prevé el Reglamento?", "a": "Los Inspectores pueden realizar las entrevistas que estimen convenientes a empleados o funcionarios", "o": ["Sólo puede entrevistarse al Representante Legal o Apoderado de la entidad o, en su ausencia, al director general", "La entrevista sólo procede con la presencia del abogado de la entidad", "El cajero debe ser citado a comparecencia mediante citatorio conforme al Título Quinto", "Los Inspectores pueden realizar las entrevistas que estimen convenientes a empleados o funcionarios"], "x": "El art. 29 permite a los Inspectores y a las personas de los arts. 16 y 18 realizar las entrevistas que estimen convenientes a empleados o funcionarios.", "ref": "Art. 29, tercer párrafo"}, {"id": "S156", "tema": "gen", "tipo": "cifra", "q": "¿Cuántos elementos debe contener el oficio por el que la CNBV solicita información a una entidad para su función de vigilancia?", "a": "6", "o": ["5", "10", "6", "8"], "x": "Además de estar fundado y motivado, el oficio de solicitud de información del art. 47 debe contener seis elementos (frs. I a VI).", "ref": "Art. 47, frs. I a VI"}, {"id": "S157", "tema": "vis", "tipo": "caso", "q": "Durante la visita se conoce un acuerdo verbal relevante entre la entidad y un cliente que no consta en ningún documento. ¿Qué pueden hacer los Inspectores para precisarlo?", "a": "Solicitar al Representante o al funcionario competente un informe por escrito que describa o precise el hecho", "o": ["Levantar de forma anticipada el acta de conclusión, asentando el acuerdo verbal como hecho", "Solicitar al Representante o al funcionario competente un informe por escrito que describa o precise el hecho", "Ordenar a la entidad que registre contablemente el acuerdo verbal y exhiba el registro antes del acta de conclusión", "Emplazar de inmediato a la entidad para que manifieste lo que a su derecho convenga"], "x": "Cuando un hecho relevante no puede acreditarse con la información de la entidad, los Inspectores pueden pedir un informe por escrito al Representante o al funcionario competente.", "ref": "Art. 29, último párrafo"}, {"id": "S158", "tema": "vis", "tipo": "caso", "q": "Los Inspectores pidieron el informe por escrito sobre un hecho relevante no documentado y la entidad nunca lo entrega. ¿Qué deben hacer?", "a": "Levantar un acta parcial", "o": ["Suspender la visita hasta que se rinda el informe", "Levantar un acta parcial", "Imponer en el acto la multa correspondiente", "Registrarlo sólo en la relación genérica de documentación"], "x": "El art. 34, fr. III, obliga a levantar acta parcial cuando no se rinda el informe del último párrafo del art. 29.", "ref": "Art. 34, fr. III"}, {"id": "S159", "tema": "vis", "tipo": "trampa", "q": "Durante una visita, ¿respecto de qué información NO rige la obligación de estricta reserva de los servidores públicos de la CNBV?", "a": "La que tenga el carácter de pública", "o": ["La exhibida por la entidad en copias fotostáticas", "La conocida por medio de la vigilancia y no de la visita", "La que tenga el carácter de pública", "La obtenida por auditores externos contratados por la CNBV"], "x": "El art. 17 impone estricta reserva sobre la información de las entidades, siempre que ésta no tenga el carácter de pública.", "ref": "Art. 17, primer párrafo"}, {"id": "S160", "tema": "vis", "tipo": "caso", "q": "Al terminar la revisión documental, la entidad pide constancia de qué información examinaron los Inspectores. ¿Qué prevé el Reglamento?", "a": "Los Inspectores elaboran una relación genérica, entregan copia a la entidad y anexan otra al acta de conclusión", "o": ["La entidad elabora la relación y los Inspectores sólo la firman de conformidad antes del acta de conclusión", "La relación se anexa sólo al informe general, sin copia para la entidad", "Los Inspectores elaboran una relación genérica, entregan copia a la entidad y anexan otra al acta de conclusión", "Se entrega a la entidad copia de los informes parciales en lugar de la relación, al levantar el acta de conclusión"], "x": "Los Inspectores deben elaborar la relación genérica de la información exhibida, entregar copia a la entidad e incluir otra como anexo al acta de conclusión.", "ref": "Art. 31"}, {"id": "S161", "tema": "vis", "tipo": "caso", "q": "Un Inspector encuentra documentación que modifica lo que ya había consignado en un acta parcial previa y de la que no tenía conocimiento. ¿Cómo debe proceder?", "a": "Levantar una nueva acta parcial que complemente o modifique lo consignado en la anterior", "o": ["Esperar al acta de conclusión para asentar la modificación", "Levantar una nueva acta parcial que complemente o modifique lo consignado en la anterior", "Incluir la documentación sólo en la relación genérica del art. 31, sin levantar acta alguna", "Corregir directamente el acta parcial ya firmada por las partes"], "x": "El art. 34, fr. IV, obliga a levantar acta parcial para hacer constar hechos o documentación que complemente o modifique un acta previa, cuando el Inspector no los conocía.", "ref": "Art. 34, fr. IV"}, {"id": "S162", "tema": "gen", "tipo": "caso", "q": "Una entidad entrega en tiempo y forma un reporte regulatorio, pero su contenido no corresponde con las operaciones que realmente celebró. ¿Qué consecuencia prevé el Reglamento?", "a": "Se considera no cumplida la obligación de presentarlo y procede, en su caso, la sanción correspondiente", "o": ["Se considera no cumplida la obligación de presentarlo y procede, en su caso, la sanción correspondiente", "Se tiene por no presentada y la CNBV ya no puede volver a solicitarla ni pedir aclaraciones sobre su contenido", "Se tiene por cumplida, porque se entregó dentro del plazo establecido", "Se tiene por cumplida, pero la CNBV debe emitir observaciones con plazo de 20 días hábiles para que la corrija"], "x": "Si la información no es acorde con la realidad de los hechos que consigna, se considera no cumplida la obligación de presentarla y procede, en su caso, la sanción.", "ref": "Art. 48, primer párrafo"}, {"id": "S163", "tema": "vis", "tipo": "caso", "q": "La entidad pide «pausar» la visita dos semanas por su cierre contable y el Inspector coordinador está de acuerdo. ¿Qué exige el Reglamento para suspenderla?", "a": "Autorización expresa del servidor público de la CNBV facultado para ello", "o": ["Basta una solicitud por escrito de la entidad presentada en oficialía de partes", "Basta el acuerdo del Inspector coordinador asentado en un acta parcial", "Autorización expresa del servidor público de la CNBV facultado para ello", "La visita no puede suspenderse en ningún supuesto una vez iniciada"], "x": "Una vez iniciada, la visita no podrá suspenderse sin autorización expresa del servidor público de la CNBV facultado para ello.", "ref": "Art. 28, primer párrafo"}, {"id": "S164", "tema": "vis", "tipo": "caso", "q": "Un Inspector quiere copiar a un medio magnético la base de datos de clientes de la entidad. El área de sistemas dice que sólo se permiten fotocopias. ¿Qué prevé el Reglamento?", "a": "Los Inspectores pueden obtener copias fotostáticas o por medios magnéticos de la información", "o": ["Los Inspectores pueden obtener copias fotostáticas o por medios magnéticos de la información", "Requieren autorización del consejo de administración de la entidad para copiar bases de datos", "Sólo pueden obtener copias fotostáticas de documentos impresos, y consultar en pantalla lo digital", "Sólo pueden obtener copias en visitas de investigación"], "x": "El art. 33 permite a los Inspectores obtener copias fotostáticas o por medios magnéticos de la información y documentación de la entidad.", "ref": "Art. 33, primer párrafo"}, {"id": "S165", "tema": "vis", "tipo": "cifra", "q": "¿Cuántos casos enumera el art. 34 en los que los Inspectores deben levantar actas parciales de manera obligatoria?", "a": "5", "o": ["4", "6", "5", "3"], "x": "El art. 34 señala cinco supuestos obligatorios: incumplimientos graves, obstaculización, falta del informe del art. 29, hechos que complementan o modifican un acta previa y falta de exhibición de información.", "ref": "Art. 34, frs. I a V"}, {"id": "S166", "tema": "gen", "tipo": "memoria", "q": "¿Mediante qué instrumento determina la CNBV los casos en que las entidades deben entregarle información a través de sistemas electrónicos?", "a": "Reglas de carácter general", "o": ["Reglas de carácter general", "Convenios firmados con cada entidad", "Oficios dirigidos a cada entidad", "Circulares internas de la unidad administrativa"], "x": "El art. 45 dispone que la CNBV, mediante reglas de carácter general, determina los casos de entrega por sistemas electrónicos, que deben generar acuse de recibo electrónico.", "ref": "Art. 45, primer párrafo"}, {"id": "S167", "tema": "vis", "tipo": "caso", "q": "Para un acta de constancia en una sucursal no se encuentra el Representante Legal; atiende la gerente de la sucursal. ¿Con quién puede entenderse y firmarse el acta?", "a": "Con la persona con quien se entienda la diligencia en ese lugar", "o": ["Sólo con el director general de la entidad visitada", "Sólo con los testigos, sin firma de la entidad", "Sólo con el Representante Legal, dejando citatorio para el día hábil siguiente", "Con la persona con quien se entienda la diligencia en ese lugar"], "x": "El acta de constancia puede firmarse por el Representante Legal o Apoderado o por la persona con quien se entienda la diligencia en el lugar respectivo.", "ref": "Art. 25, fr. VI y antepenúltimo párrafo"}, {"id": "S168", "tema": "vis", "tipo": "memoria", "q": "¿Qué dato temporal debe contener el acta de constancia de visita levantada en cada lugar?", "a": "Fecha y hora de entrada y salida", "o": ["El horario de atención al público del lugar", "Fecha y hora de entrada y salida", "Sólo la hora en que se inició la visita", "La fecha en que se dejó el citatorio"], "x": "La fr. II del art. 25 exige que el acta de constancia contenga la fecha y hora de entrada y salida.", "ref": "Art. 25, fr. II"}, {"id": "S169", "tema": "vis", "tipo": "caso", "q": "Otra autoridad financiera facultada por su ley solicita a la CNBV practicar una visita de inspección a una entidad. ¿Qué establece el Reglamento?", "a": "La CNBV la llevará a cabo y podrá efectuarla junto con los servidores públicos que designe la solicitante", "o": ["La solicitante emite la orden de visita y la CNBV sólo acompaña", "La CNBV la llevará a cabo y podrá efectuarla junto con los servidores públicos que designe la solicitante", "La CNBV decide si la incluye en su programa anual del siguiente ejercicio como visita ordinaria", "La CNBV sólo puede autorizar que la solicitante la practique por sí misma con sus propios servidores públicos"], "x": "El art. 18 dispone que la CNBV llevará a cabo las visitas solicitadas por otras autoridades financieras facultadas y podrá efectuarlas con los servidores públicos que éstas designen.", "ref": "Art. 18, primer y segundo párrafos"}, {"id": "S170", "tema": "vis", "tipo": "caso", "q": "Un servidor público de otra autoridad financiera participa en una visita de la CNBV. ¿Con qué debe identificarse?", "a": "Con credencial oficial vigente con fotografía expedida por la autoridad que lo designó", "o": ["Con credencial vigente con fotografía expedida por la CNBV", "Con credencial oficial vigente con fotografía expedida por la autoridad que lo designó", "Con pasaporte vigente y la acreditación de la entidad visitada", "Con su credencial para votar y el oficio de comisión que para esa visita le emita la CNBV"], "x": "Los servidores de las autoridades financieras que participen deben identificarse con credencial oficial vigente con fotografía expedida por la autoridad que los designó.", "ref": "Art. 22, segundo párrafo"}, {"id": "S171", "tema": "gen", "tipo": "trampa", "q": "¿Cuál de los siguientes elementos NO se exige en el oficio de solicitud de información del art. 47 (vigilancia)?", "a": "Nombre de los Inspectores que revisarán la información", "o": ["Número de oficio y de expediente", "Relación de la información requerida, el plazo y la forma de entrega", "Nombre de los Inspectores que revisarán la información", "Lugar y fecha de expedición"], "x": "El art. 47 exige lugar y fecha, número de oficio y expediente, nombre de la entidad, funcionario destinatario, relación de información con plazo y forma, y firma del servidor facultado; no nombres de Inspectores.", "ref": "Art. 47"}, {"id": "S172", "tema": "vis", "tipo": "caso", "q": "Durante la visita, el custodio externo de los expedientes físicos de la entidad no puede trasladar las cajas. ¿Qué debe hacer la entidad?", "a": "Realizar las acciones necesarias para que los Inspectores acudan a las instalaciones del custodio", "o": ["Informarlo en el acta de conclusión, con lo que se da por atendido", "Exhibir los expedientes en la siguiente visita ordinaria de la CNBV", "Realizar las acciones necesarias para que los Inspectores acudan a las instalaciones del custodio", "Nada; los Inspectores deben emitir una orden de visita dirigida al custodio para revisar ahí los expedientes"], "x": "Si no es posible obtener la información del tercero, la entidad debe hacer lo necesario para que los Inspectores acudan a donde se resguarda y gestionar que se les den facilidades.", "ref": "Art. 32, segundo y tercer párrafos"}, {"id": "S173", "tema": "vis", "tipo": "caso", "q": "La CNBV contrata un despacho de auditores para auxiliar en una visita. ¿Dónde debe establecerse la obligación de estos de guardar estricta reserva?", "a": "Expresamente en los contratos que celebre la CNBV con ellos", "o": ["En la orden de visita notificada a la entidad", "En una carta que los auditores entregan a la entidad visitada", "Expresamente en los contratos que celebre la CNBV con ellos", "En el acta de inicio, con la firma de los auditores"], "x": "Tratándose de auditores y profesionistas externos, la CNBV debe establecer expresamente en sus contratos la obligación de estricta reserva.", "ref": "Art. 17, segundo párrafo"}, {"id": "S174", "tema": "vis", "tipo": "caso", "q": "Una entidad recibió un acta parcial y, antes del acta de conclusión, presenta documentación que a su juicio desvirtúa los hechos. ¿Cómo se deja constancia?", "a": "En un acta parcial levantada en términos del art. 34, fr. IV", "o": ["En un acta parcial levantada en términos del art. 34, fr. IV", "En una adenda al acta de inicio de la visita", "En un escrito libre de la entidad que no se integra a las actas de la visita", "Sólo en el informe general, sin levantar acta"], "x": "El art. 38 señala que de la presentación de información para desvirtuar se deja constancia en el acta parcial que se levante conforme al art. 34, fr. IV.", "ref": "Art. 38, primer párrafo"}, {"id": "S175", "tema": "vis", "tipo": "memoria", "q": "¿Qué debe acompañar el Inspector a las actas parciales que levante?", "a": "Copia simple de los documentos que acrediten los hechos, actos u omisiones consignados", "o": ["El original de la orden de visita y del acta de inicio", "La respuesta por escrito de la entidad a cada uno de los hechos, actos u omisiones consignados", "El informe parcial firmado por el Inspector coordinador y por el Representante Legal", "Copia simple de los documentos que acrediten los hechos, actos u omisiones consignados"], "x": "El art. 35 obliga al Inspector a acompañar a las actas parciales copia simple de los documentos que acrediten los hechos consignados.", "ref": "Art. 35, primer párrafo"}, {"id": "S176", "tema": "vis", "tipo": "caso", "q": "Una inundación en el edificio de la entidad hace materialmente imposible continuar la visita en el lugar señalado. ¿Qué prevé el Reglamento?", "a": "Las actas pueden levantarse en oficinas de la CNBV, informándolo a la entidad por medio que deje constancia escrita", "o": ["La visita concluye anticipadamente, sin necesidad de levantar el acta de conclusión", "Debe emitirse una nueva orden de visita que señale otro domicilio de la entidad", "Las actas se levantan en otro domicilio de la entidad que elija el Representante Legal, previa notificación por escrito", "Las actas pueden levantarse en oficinas de la CNBV, informándolo a la entidad por medio que deje constancia escrita"], "x": "Si es material o jurídicamente imposible continuar en el lugar, las actas pueden levantarse en oficinas de la CNBV, informándolo por medio que deje constancia escrita y asentándolo en el acta.", "ref": "Art. 28, segundo párrafo"}, {"id": "S177", "tema": "vis", "tipo": "caso", "q": "Un Inspector de la CNBV se presenta a iniciar la visita con su credencial de la Comisión vencida el mes anterior. ¿Cumple con la identificación requerida?", "a": "No; debe exhibir credencial vigente con fotografía expedida por la CNBV", "o": ["Sí, si el Inspector coordinador da fe de su identidad en el acta", "Sí, si además exhibe su credencial para votar", "Sí, siempre que su nombre aparezca en la orden de visita", "No; debe exhibir credencial vigente con fotografía expedida por la CNBV"], "x": "Los Inspectores deben identificarse previamente ante la persona con quien se entienda la diligencia exhibiendo credencial vigente con fotografía expedida por la CNBV.", "ref": "Art. 22, primer párrafo"}, {"id": "S178", "tema": "vis", "tipo": "cifra", "q": "¿Cuántos requisitos enumera el art. 39 para el acta de conclusión de la visita?", "a": "9", "o": ["6", "10", "9", "8"], "x": "El acta de conclusión, además de ser circunstanciada, debe contener nueve requisitos (frs. I a IX).", "ref": "Art. 39, frs. I a IX"}, {"id": "S179", "tema": "vis", "tipo": "caso", "q": "Una visita se practicó en tres lugares que terminaron de revisarse en fechas distintas. Respecto de esos lugares, ¿qué debe señalar el acta de conclusión?", "a": "Cada lugar donde se realizó la visita y la fecha en que terminó en cada uno", "o": ["Cada lugar donde se realizó la visita y la fecha en que terminó en cada uno", "Sólo la fecha de conclusión en el lugar donde inició la visita", "Sólo el último lugar visitado y la fecha en que se terminó ahí", "Los lugares visitados, sin fechas, pues basta la del acta de inicio"], "x": "La fr. II del art. 39 exige el lugar o lugares donde se realizó la visita y la fecha en que terminó la visita en cada lugar.", "ref": "Art. 39, fr. II"}, {"id": "S180", "tema": "vis", "tipo": "memoria", "q": "¿Qué actas deben acompañarse al acta de conclusión y forman parte de ella?", "a": "Las actas de constancia de visita y las actas parciales que se hubieren levantado", "o": ["El oficio de observaciones y la respuesta de la entidad", "Los informes parciales y el informe general de la visita, suscritos por el Inspector coordinador", "Las actas de comparecencia de los empleados y funcionarios entrevistados durante la visita", "Las actas de constancia de visita y las actas parciales que se hubieren levantado"], "x": "La fr. VIII del art. 39 exige referir el acta de inicio y las actas de constancia y parciales levantadas, que se acompañan al acta de conclusión y forman parte de ella.", "ref": "Art. 39, fr. VIII"}, {"id": "S181", "tema": "vis", "tipo": "caso", "q": "El personal de vigilancia de la entidad retrasa el acceso de los Inspectores al área de sistemas «hasta que llegue el director la próxima semana». ¿Es válido?", "a": "No; debe dar acceso inmediato a sus instalaciones e irrestricto a sus fuentes de información", "o": ["No; debe dar acceso inmediato a sus instalaciones e irrestricto a sus fuentes de información", "Sí, si la circunstancia se asienta en el acta de inicio y el retraso es breve", "Sí, porque el acceso a sistemas requiere un citatorio previo dirigido al director", "Sí, si el director es el único funcionario facultado internamente para autorizarlo"], "x": "El personal de la entidad está obligado a permitir a los Inspectores el acceso inmediato a los lugares, oficinas e instalaciones, y el acceso irrestricto a la documentación y fuentes de información.", "ref": "Art. 29, primer párrafo"}, {"id": "S182", "tema": "vis", "tipo": "caso", "q": "Los Inspectores necesitan que un ingeniero de sistemas de la entidad les ayude a extraer información de sus bases de datos. ¿Pueden pedirlo?", "a": "Sí; pueden requerir el apoyo del personal especializado de la entidad necesario para la visita", "o": ["Sí; pueden requerir el apoyo del personal especializado de la entidad necesario para la visita", "No; deben contratar a un profesionista externo conforme al art. 16", "No; el personal de la entidad no puede apoyar en el desarrollo de la visita para no afectar su independencia", "Sólo mediante un oficio de solicitud de información de vigilancia"], "x": "El art. 30 permite a los Inspectores requerir el apoyo del personal especializado de la entidad que sea necesario para la práctica de la visita.", "ref": "Art. 30, segundo párrafo"}, {"id": "S183", "tema": "vis", "tipo": "trampa", "q": "¿Cuál de los siguientes NO es requisito del acta de conclusión de la visita?", "a": "El monto de la sanción que se propone imponer a la entidad", "o": ["En su caso, la relación genérica del art. 31", "El monto de la sanción que se propone imponer a la entidad", "Nombre, cargo y firma de dos testigos", "La referencia a la orden de visita y al acta de inicio"], "x": "El art. 39 no contempla sanciones; éstas se tramitan mediante emplazamiento (Título Sexto). Los otros tres sí son requisitos del acta de conclusión.", "ref": "Art. 39"}, {"id": "S184", "tema": "vis", "tipo": "caso", "q": "Una entidad no presentó nada durante la visita y, una semana después de firmada el acta de conclusión, quiere desvirtuar lo asentado en las actas parciales. ¿Qué prevé el Reglamento?", "a": "Ya no puede hacerlo dentro de la visita, sin perjuicio de lo previsto en los Títulos Cuarto y Sexto", "o": ["Ya no puede hacerlo dentro de la visita, sin perjuicio de lo previsto en los Títulos Cuarto y Sexto", "Pierde todo derecho a controvertir los hechos ante la CNBV", "Los Inspectores levantan un acta posterior para asentar sus pruebas, conforme al art. 34, fr. IV", "Se reabre la visita con la misma orden para recibir su documentación y levantar un acta parcial adicional"], "x": "Sólo puede desvirtuar hasta antes del acta de conclusión y no cabe acta posterior; queda a salvo lo dispuesto en los Títulos Cuarto (observaciones) y Sexto (emplazamiento).", "ref": "Arts. 38 y 40"}, {"id": "S185", "tema": "vis", "tipo": "caso", "q": "Una visita a un centro cambiario inicia y termina el mismo día. ¿Cómo puede documentarse?", "a": "Su inicio y conclusión pueden constar en una misma acta, cumpliendo las formalidades de los arts. 23, 24, 26 y 39", "o": ["Basta un acta de constancia de visita, cumpliendo sólo las formalidades del art. 25", "Basta una misma acta sin designación de testigos, dada la brevedad de la diligencia, cumpliendo sólo los arts. 23 y 39", "Deben levantarse siempre un acta de inicio y otra de conclusión por separado, arts. 23 y 39", "Su inicio y conclusión pueden constar en una misma acta, cumpliendo las formalidades de los arts. 23, 24, 26 y 39"], "x": "Si la visita se lleva a cabo en un mismo día, inicio y conclusión podrán constar en una misma acta, cumpliendo las formalidades de los arts. 23, 24, 26 y 39.", "ref": "Art. 41"}, {"id": "S186", "tema": "vis", "tipo": "memoria", "q": "¿Qué debe adjuntarse a todas las actas previstas en el Reglamento?", "a": "Copia de las identificaciones de quienes en ellas intervengan", "o": ["Copia certificada de la orden de visita", "Copia del poder notarial de todos los empleados de la entidad", "Copia de las identificaciones de quienes en ellas intervengan", "Copia del programa anual de visitas del ejercicio"], "x": "El art. 42 exige adjuntar a todas las actas copia de las identificaciones de quienes intervengan en ellas.", "ref": "Art. 42"}, {"id": "S187", "tema": "vis", "tipo": "caso", "q": "Días después de levantada el acta de conclusión, un Inspector advierte un error en un dato y propone levantar un «acta complementaria» de esa visita. ¿Es procedente?", "a": "No; levantada el acta de conclusión, la visita concluye y no puede levantarse acta posterior alguna", "o": ["Sí, si lo autoriza el servidor público que emitió la orden de visita y se notifica por escrito a la entidad", "Sí, si la firma el mismo Representante Legal que firmó la conclusión", "Sí, si se trata sólo de corregir datos y no de consignar hechos, actos u omisiones nuevos", "No; levantada el acta de conclusión, la visita concluye y no puede levantarse acta posterior alguna"], "x": "El art. 40 dispone que, una vez levantada el acta de conclusión, se tiene por concluida la visita y no podrá levantarse acta posterior alguna.", "ref": "Art. 40"}, {"id": "S188", "tema": "vis", "tipo": "caso", "q": "Los Inspectores deben designar testigos porque el Representante Legal no lo hizo, y proponen a un compañero de la CNBV que se encuentra en las oficinas centrales. ¿Es válido?", "a": "No; deben ser personas que se encuentren en el lugar donde se levanta el acta", "o": ["Sí, porque ante la omisión del Representante los Inspectores designan libremente", "Sí, siempre que se identifique con credencial vigente expedida por la CNBV", "No; deben ser personas que se encuentren en el lugar donde se levanta el acta", "Sí, si firma el acta en las oficinas de la CNBV ese mismo día hábil"], "x": "Los testigos designados por los Inspectores deben ser personas que se encuentren en el lugar en que se levanta el acta.", "ref": "Art. 26, tercer párrafo"}, {"id": "S189", "tema": "vis", "tipo": "caso", "q": "Un Inspector quiere dejar constancia en acta parcial de un hecho menor que no encuadra en ninguno de los cinco supuestos obligatorios del art. 34. ¿Puede hacerlo?", "a": "Sí; fuera de los supuestos obligatorios, los Inspectores pueden levantar actas parciales", "o": ["Sí; fuera de los supuestos obligatorios, los Inspectores pueden levantar actas parciales", "No; debe consignarlo únicamente en el acta de conclusión", "Sólo si la entidad visitada lo solicita por escrito", "No; las actas parciales sólo se levantan en los cinco supuestos obligatorios"], "x": "El primer párrafo del art. 34 dispone que los Inspectores podrán levantar actas parciales de hechos conocidos en la visita; el segundo enumera los casos en que deben hacerlo.", "ref": "Art. 34, primer párrafo"}, {"id": "S190", "tema": "vis", "tipo": "caso", "q": "Un auditor externo contratado por la CNBV para la visita pide acceso a los libros de actas. La entidad responde que sólo los Inspectores de la Comisión tienen ese acceso. ¿Tiene razón?", "a": "No; la obligación de dar acceso comprende también a los auditores y profesionistas contratados por la CNBV", "o": ["Sí; los libros de actas están excluidos de la revisión en visitas", "No, pero sólo si el auditor firma previamente un convenio de confidencialidad con la entidad visitada", "Sí; sólo los servidores públicos de la CNBV tienen acceso irrestricto a la documentación de la entidad visitada", "No; la obligación de dar acceso comprende también a los auditores y profesionistas contratados por la CNBV"], "x": "El art. 29 obliga a permitir el acceso a los Inspectores y a las personas de los arts. 16 (auditores y profesionistas contratados) y 18 (otras autoridades financieras).", "ref": "Art. 29, primer párrafo"}, {"id": "S191", "tema": "vis", "tipo": "caso", "q": "Una autoridad administrativa pide a la CNBV que recabe documentación de una entidad mediante un requerimiento que carece de fundamentación y motivación. ¿Qué hace la CNBV?", "a": "No le da trámite", "o": ["Lo tramita y solicita después la fundamentación a la autoridad", "No le da trámite", "Lo tramita sólo si se relaciona con PLD/FT", "Lo turna a su Junta de Gobierno para valorarlo"], "x": "Los requerimientos de autoridades para visitas de investigación deben estar fundados y motivados; de lo contrario, la CNBV no les dará trámite.", "ref": "Art. 10, cuarto párrafo"}, {"id": "S192", "tema": "vis", "tipo": "caso", "q": "Un banco recibe una visita ordinaria en materia de PLD/FT y la orden se le notifica en el acto de inicio, argumentando que «en PLD así se permite». ¿Es correcto?", "a": "No; tratándose de un banco en visita ordinaria, la orden se notifica al menos 2 días hábiles antes", "o": ["Sí; toda visita en materia de PLD/FT puede notificarse en el acto de inicio, sin importar el tipo de entidad", "Sí, siempre que la visita se desarrolle en un solo día", "No; tratándose de un banco en visita ordinaria, la orden se notifica al menos 2 días hábiles antes", "Sí, si el banco forma parte de un grupo financiero"], "x": "La notificación en el acto de inicio en cualquier tipo de visita aplica sólo a centros cambiarios, transmisores y SOFOM no reguladas; para las demás, en ordinarias y especiales rigen 2 días hábiles.", "ref": "Art. 21"}, {"id": "S193", "tema": "vis", "tipo": "caso", "q": "La CNBV tiene indicios de que una persona, sin autorización, recibe depósitos del público ostentándose como institución financiera. ¿Qué tipo de visita puede practicarle?", "a": "Visita de investigación", "o": ["Visita ordinaria", "Visita de vigilancia", "Visita especial", "Visita de investigación"], "x": "El art. 10 permite visitas de investigación cuando haya indicios de que alguien, sin autorización, opera o se ostenta como Entidad Supervisada o realiza actividades financieras.", "ref": "Art. 10, fr. I"}, {"id": "S194", "tema": "vis", "tipo": "caso", "q": "La CNBV ordena una visita de investigación a una persona que opera sin autorización, pero desconoce su nombre y domicilio exactos. ¿Qué prevé el Reglamento para la orden?", "a": "Basta mencionar elementos que permitan identificarla y ubicarla, como circunstancias de modo, tiempo y lugar", "o": ["Primero debe solicitarse el auxilio de la fuerza pública para identificar a la persona y después emitir la orden", "No puede emitirse la orden sin el nombre y domicilio del visitado; primero debe identificarse mediante vigilancia", "La orden debe publicarse en el DOF para suplir esos datos", "Basta mencionar elementos que permitan identificarla y ubicarla, como circunstancias de modo, tiempo y lugar"], "x": "Para las personas del art. 10, las frs. III y VII del art. 20 permiten mencionar los elementos que permitan su identificación y ubicación, como circunstancias de modo, tiempo y lugar.", "ref": "Art. 20, frs. III y VII"}, {"id": "S195", "tema": "gen", "tipo": "caso", "q": "Tras recibir un reporte que no cumple las características establecidas, la CNBV lo tiene por no presentado. ¿Puede además pedir a la entidad que lo presente de nuevo o que lo aclare?", "a": "Sí; conserva la facultad de solicitarlo nuevamente o pedir aclaraciones, sin perjuicio de la sanción", "o": ["Sólo si la entidad todavía no ha sido sancionada por ese mismo incumplimiento", "Sí; conserva la facultad de solicitarlo nuevamente o pedir aclaraciones, sin perjuicio de la sanción", "No; una vez tenido por no presentado, lo único que procede es la sanción correspondiente", "Sólo mediante una visita de investigación ordenada específicamente para ese efecto"], "x": "El art. 48 aclara que tener por no cumplida la obligación procede sin perjuicio de la facultad de la CNBV para solicitar nuevamente la información o las aclaraciones pertinentes.", "ref": "Art. 48, segundo párrafo"}, {"id": "S196", "tema": "vis", "tipo": "caso", "q": "La orden de visita a una SOFOM regulada incluye una relación inicial de información. A mitad de la visita, el Inspector pide documentos adicionales no listados. ¿Puede hacerlo?", "a": "Sí; la relación inicial no impide solicitar información y documentación adicional durante la visita", "o": ["Sólo si la entidad acepta ampliar el objeto de la visita", "Sí; la relación inicial no impide solicitar información y documentación adicional durante la visita", "No; para requerir información adicional debe emitirse una nueva orden de visita con la relación ampliada", "Sólo mediante un oficio de solicitud de información de vigilancia, conforme a los arts. 46 y 47"], "x": "La fr. VIII del art. 20 prevé la relación de información inicial sin perjuicio de que durante la visita los Inspectores soliciten información y documentación adicional.", "ref": "Art. 20, fr. VIII"}, {"id": "S197", "tema": "vis", "tipo": "caso", "q": "Un acta parcial la levanta un Inspector distinto del coordinador, quien no se encuentra en el lugar. ¿Quién firma el acta por parte de la CNBV?", "a": "El Inspector coordinador o, en su defecto, el Inspector que la levante", "o": ["El Inspector coordinador o, en su defecto, el Inspector que la levante", "Sólo el Inspector coordinador, por lo que el acta debe esperar su regreso", "Todos los Inspectores autorizados en la orden de visita", "Necesariamente el servidor público que emitió la orden de visita"], "x": "La fr. VI del art. 36 exige la firma del Inspector encargado de coordinar la visita o, en su defecto, del Inspector que levante el acta parcial.", "ref": "Art. 36, fr. VI"}, {"id": "S198", "tema": "vis", "tipo": "caso", "q": "En una visita de la CNBV, otra autoridad financiera pide que participen dos de sus servidores públicos, conforme a las disposiciones que la rigen. ¿Qué prevé el Reglamento?", "a": "La CNBV podrá permitir su participación, siempre que esa autoridad lo solicite conforme a su normativa", "o": ["Está prohibido; en las visitas de la CNBV sólo pueden participar sus Inspectores y los auditores externos que contrate", "La CNBV podrá permitir su participación, siempre que esa autoridad lo solicite conforme a su normativa", "Procede de manera automática, aun sin solicitud de esa autoridad", "Procede sólo si la entidad visitada lo consiente por escrito antes de que se levante el acta de inicio"], "x": "En las visitas que realice la CNBV podrá permitir la participación de servidores de otras autoridades financieras, siempre que éstas lo soliciten conforme a sus disposiciones.", "ref": "Art. 18, tercer párrafo"}, {"id": "S199", "tema": "vis", "tipo": "caso", "q": "Una SOFOM regulada recibe una orden de visita ordinaria que señala una duración de ocho meses. ¿Se ajusta al Reglamento?", "a": "No; la duración no puede superar seis meses, salvo una única prórroga justificada por un periodo igual", "o": ["No; la duración no puede superar seis meses, salvo una única prórroga justificada por un periodo igual", "Sí; la duración la fija libremente el servidor público que emite la orden de visita", "Sí, porque las visitas ordinarias pueden durar hasta un año sin necesidad de prórroga", "Sí, porque el límite de seis meses rige sólo para las visitas especiales y de investigación, no para las ordinarias"], "x": "La fr. V del art. 20 limita la duración de las visitas a seis meses, prorrogables por una única vez por un periodo igual cuando existan causas justificadas.", "ref": "Art. 20, fr. V"}, {"id": "S200", "tema": "vis", "tipo": "trampa", "q": "¿Cuál de los siguientes datos NO es requisito de la orden de visita conforme al art. 20?", "a": "Nombre y firma de los testigos de la visita", "o": ["Lugar o lugares donde se efectuará la visita", "Nombre y firma de los testigos de la visita", "Tipo de visita a realizarse y su objeto", "Nombre de los Inspectores, indicando al responsable de coordinarla"], "x": "Los testigos se designan al levantar las actas (arts. 26 y 37); no forman parte de los diez requisitos de la orden de visita.", "ref": "Art. 20"}, {"id": "S201", "tema": "vis", "tipo": "caso", "q": "Un supervisor extranjero, conforme a un acuerdo de cooperación, pide a la CNBV revisar a una entidad no incluida en el programa anual. Si la CNBV practica la visita, ¿qué tipo de visita es y en qué supuesto del art. 8 encuadra?", "a": "Especial, por derivar de la cooperación internacional del Título Séptimo", "o": ["Especial, por derivar de la cooperación internacional del Título Séptimo", "Ordinaria, por estar prevista en el acuerdo de cooperación", "De investigación, por provenir de una autoridad extranjera", "Ninguna; la CNBV sólo puede visitar entidades incluidas en su programa anual"], "x": "El art. 8, fr. VI, prevé visitas especiales cuando deriven de la cooperación internacional a que se refiere el Título Séptimo.", "ref": "Art. 8, fr. VI"}, {"id": "S202", "tema": "vis", "tipo": "memoria", "q": "¿Dónde debe levantarse el acta de conclusión de una visita practicada en varios lugares?", "a": "En el lugar donde se inició la visita, salvo imposibilidad de continuar prevista en el art. 28", "o": ["En el domicilio fiscal de la entidad, aunque la visita haya iniciado en otro lugar", "En el último de los lugares visitados, por ser donde terminó la revisión", "En el lugar donde se inició la visita, salvo imposibilidad de continuar prevista en el art. 28", "En las oficinas de la CNBV en todos los casos, informándolo a la entidad por escrito"], "x": "El acta de conclusión debe levantarse en el lugar donde se inició la visita, salvo el caso del segundo párrafo del art. 28.", "ref": "Art. 39, penúltimo párrafo"}, {"id": "S203", "tema": "vis", "tipo": "caso", "q": "Para levantar un acta parcial, los Inspectores designan testigos porque la entidad no lo hizo. ¿Qué requisitos deben cumplir esos testigos?", "a": "Encontrarse en el lugar donde se levanta el acta e identificarse conforme al Reglamento", "o": ["Encontrarse en el lugar donde se levanta el acta e identificarse conforme al Reglamento", "Ser empleados de la entidad visitada con poder notarial para representarla ante autoridades administrativas", "Ser servidores públicos de la CNBV acreditados en la orden de visita", "Contar con la aprobación del Representante Legal asentada en el acta"], "x": "Los testigos designados por los Inspectores para actas parciales deben estar en el lugar en que se levanta el acta e identificarse en términos del Reglamento.", "ref": "Art. 37, tercer párrafo"}, {"id": "S204", "tema": "vis", "tipo": "caso", "q": "El gerente de una SOFOM visitada pide al Inspector que le autorice de palabra lanzar un nuevo producto, pues «ya revisaron el proceso en la visita». ¿Qué prevé el Reglamento?", "a": "El Inspector no está facultado para otorgar autorizaciones al personal durante la visita", "o": ["Puede autorizarlo con el visto bueno del Inspector coordinador", "Puede autorizarlo si lo hace constar en un acta parcial", "El Inspector no está facultado para otorgar autorizaciones al personal durante la visita", "Puede autorizarlo si el producto forma parte del objeto de la visita y así lo asienta en el acta"], "x": "El art. 15 niega a los Inspectores la facultad de otorgar autorizaciones al personal de la entidad respecto de los aspectos examinados en la visita.", "ref": "Art. 15, primer párrafo"}, {"id": "S205", "tema": "vis", "tipo": "memoria", "q": "En una visita, la CNBV analiza si el capital de un banco es suficiente frente a los riesgos que asume y si su cartera y demás activos están correctamente valuados. ¿Qué fracción del art. 4 sustenta esa revisión?", "a": "Fracción II", "o": ["Fracción I", "Fracción III", "Fracción II", "Fracción V"], "x": "La fr. II del art. 4 se refiere al patrimonio, la adecuación del capital a los riesgos, la calidad de los activos y la situación financiera.", "ref": "Art. 4, fr. II"}, {"id": "S206", "tema": "des", "tipo": "memoria", "q": "¿Qué mención expresa debe incluir el oficio por el que la CNBV comunica observaciones o recomendaciones?", "a": "Que se formulan sin perjuicio del inicio del procedimiento para imponer las sanciones procedentes", "o": ["Que su atención en tiempo extingue la responsabilidad administrativa de la entidad", "Que se formulan sin perjuicio del inicio del procedimiento para imponer las sanciones procedentes", "Que se impondrán medidas precautorias si no se atienden en 3 días hábiles", "Que la entidad queda emplazada para ofrecer pruebas y formular alegatos"], "x": "La fr. VI exige mencionar que las observaciones o recomendaciones no excluyen el procedimiento sancionador.", "ref": "Art. 50, fr. VI"}, {"id": "S207", "tema": "des", "tipo": "caso", "q": "Un banco recibe observaciones por infringir los requerimientos de capitalización, con plazo de 3 días hábiles, y pide prórroga por carga de trabajo. ¿Qué procede conforme al art. 50?", "a": "No procede la prórroga, porque se trata de una irregularidad de los incisos a) a d)", "o": ["Prórroga de hasta 10 días hábiles, porque así lo permite el penúltimo párrafo del art. 50", "Prórroga automática si la solicita antes del vencimiento", "Prórroga única por un periodo igual de 3 días hábiles, si la solicita antes de que venza el plazo", "No procede la prórroga, porque se trata de una irregularidad de los incisos a) a d)"], "x": "La prórroga del art. 50 sólo cabe cuando no se trate de las irregularidades de los incisos a) a d) de la fr. VII; capitalización es el inciso b).", "ref": "Art. 50, fr. VII, inc. b), y penúltimo párr."}, {"id": "S208", "tema": "des", "tipo": "memoria", "q": "¿Respecto de quiénes debe observar también la CNBV el procedimiento de emplazamiento del Título Sexto?", "a": "Personas físicas o morales distintas a Entidades Supervisadas o Personas, cuando deba sancionarlas", "o": ["Servidores públicos de la propia CNBV, cuando incurran en responsabilidad en la supervisión", "Autoridades Supervisoras del Exterior, cuando participen en visitas a Filiales en México", "Personas físicas o morales distintas a Entidades Supervisadas o Personas, cuando deba sancionarlas", "Únicamente instituciones de crédito y casas de bolsa, cuando se trate de multas"], "x": "El art. 65 extiende el procedimiento a personas distintas a Entidades Supervisadas o Personas a quienes la CNBV deba sancionar.", "ref": "Art. 65"}, {"id": "S209", "tema": "des", "tipo": "memoria", "q": "Si por su extensión se omite transcribir en el acta de comparecencia las preguntas de la CNBV, ¿qué debe hacerse?", "a": "Adjuntar el cuestionario y relacionar en el acta las respuestas con las preguntas", "o": ["Entregar las preguntas al compareciente con 3 días hábiles de anticipación", "Grabar la comparecencia en audio y video", "Adjuntar el cuestionario y relacionar en el acta las respuestas con las preguntas", "Levantar un acta parcial por cada pregunta formulada"], "x": "Puede omitirse la transcripción de los cuestionamientos, adjuntando el cuestionario y relacionando las respuestas con las preguntas.", "ref": "Art. 60, fr. V, párr. segundo"}, {"id": "S210", "tema": "des", "tipo": "caso", "q": "La CNBV detecta que un banco incumple las normas del proceso de calificación de su cartera crediticia y se lo comunica mediante oficio de observaciones. ¿Qué plazo reducido puede señalarle para responder?", "a": "3 días hábiles", "o": ["10 días hábiles", "3 días naturales", "3 días hábiles", "5 días hábiles"], "x": "El plazo máximo general es de 20 días hábiles, pero podrá ser de 3 días hábiles en irregularidades de calificación de cartera (inciso c).", "ref": "Art. 50, fr. VII, inc. c)"}, {"id": "S211", "tema": "des", "tipo": "caso", "q": "El director general de una SOFIPO, citado a comparecer, quiere que su abogado declare en su lugar. ¿Qué papel puede tener el abogado?", "a": "Sólo acompañarlo; el director debe comparecer personalmente", "o": ["Firmar el acta en su lugar como testigo de asistencia", "Declarar en su nombre con poder notarial suficiente", "Sustituirlo si el director acredita causa justificada", "Sólo acompañarlo; el director debe comparecer personalmente"], "x": "La comparecencia es personalísima y no puede substanciarse mediante apoderado; el citatorio sólo prevé que asista acompañado de su abogado.", "ref": "Arts. 55, fr. IX, y 56"}, {"id": "S212", "tema": "des", "tipo": "memoria", "q": "¿Ante qué supuestos puede la CNBV ordenar acciones o medidas precautorias conforme al art. 50 Bis?", "a": "Los previstos en los incisos a) a d) de la fracción VII del art. 50", "o": ["La falta de comparecencia sin causa justificada", "La negativa del representante legal a firmar el acta de conclusión", "Los previstos en los incisos a) a d) de la fracción VII del art. 50", "Cualquier observación no atendida dentro de 20 días hábiles"], "x": "El art. 50 Bis remite a los supuestos de los incisos a) a d) de la fr. VII del art. 50, en protección de los intereses del público.", "ref": "Art. 50 Bis"}, {"id": "S213", "tema": "des", "tipo": "caso", "q": "Tras detectar que un banco infringe los requerimientos de capitalización, la CNBV le ordena de inmediato acciones del Capítulo II del Título Cuarto. ¿Qué carácter tienen esas acciones?", "a": "Precautorio; una vez impuestas, se da derecho de audiencia al banco para resolver en definitiva", "o": ["Provisional por 10 días hábiles, tras los cuales caducan si no se ratifican", "Definitivo, sin audiencia posterior por tratarse de capitalización", "Sancionatorio, equivalente a una multa administrativa, con derecho de audiencia previo a su imposición", "Precautorio; una vez impuestas, se da derecho de audiencia al banco para resolver en definitiva"], "x": "Ante los supuestos de los incisos a) a d), las acciones o medidas tienen carácter precautorio y, ya impuestas, se otorga derecho de audiencia.", "ref": "Art. 50 Bis"}, {"id": "S214", "tema": "des", "tipo": "memoria", "q": "¿Qué advertencia debe contener el citatorio para el caso de que la persona no acuda?", "a": "Que si no comparece sin causa justificada se le impondrán las sanciones aplicables", "o": ["Que la CNBV declarará la intervención gerencial de la entidad donde labora la persona citada", "Que si no comparece sin causa justificada se le impondrán las sanciones aplicables", "Que la diligencia se desahogará con su apoderado legal", "Que se le tendrá por confeso de los hechos investigados"], "x": "La fr. X exige el apercibimiento de sanciones si no comparece sin causa justificada.", "ref": "Art. 55, fr. X"}, {"id": "S215", "tema": "des", "tipo": "memoria", "q": "Según el art. 52, las medidas que determine la CNBV mediante acciones, medidas correctivas o programas de cumplimiento forzoso pueden tener por objeto…", "a": "Corregir las irregularidades que se presenten o prevenir las que puedan presentarse", "o": ["Corregir las irregularidades que se presenten o prevenir las que puedan presentarse", "Sólo corregir irregularidades ya sancionadas en definitiva", "Sólo resarcir a los clientes afectados por la irregularidad", "Sustituir a la administración de la entidad durante la corrección, mediante un interventor designado"], "x": "El segundo párrafo del art. 52 incluye tanto la corrección de irregularidades presentes como la prevención de las que puedan presentarse.", "ref": "Art. 52, párr. segundo"}, {"id": "S216", "tema": "des", "tipo": "memoria", "q": "El oficio de emplazamiento debe señalar los fundamentos legales de…", "a": "Las sanciones administrativas que, en su caso, puedan resultar procedentes", "o": ["Los programas de cumplimiento forzoso que la entidad deberá adoptar", "Las medidas precautorias que se hayan impuesto previamente a la entidad", "La intervención gerencial que podría declararse en caso de reincidencia", "Las sanciones administrativas que, en su caso, puedan resultar procedentes"], "x": "La fr. VI exige incluir los fundamentos legales de las sanciones administrativas que puedan proceder.", "ref": "Art. 62, fr. VI"}, {"id": "S217", "tema": "des", "tipo": "caso", "q": "El director de cumplimiento de un banco desea acudir por iniciativa propia ante la CNBV para aclarar unos hechos. ¿Lo contempla el Reglamento?", "a": "Sí; las comparecencias pueden ser voluntarias o a requerimiento de la CNBV", "o": ["Sí; las comparecencias pueden ser voluntarias o a requerimiento de la CNBV", "Sólo si lo autoriza previamente el consejo de administración", "No; sólo proceden a requerimiento de la CNBV, mediante citatorio fundado y motivado", "Sólo durante una visita de investigación en curso"], "x": "Las comparecencias de personas físicas, representantes, funcionarios o empleados pueden ser voluntarias o a requerimiento.", "ref": "Art. 55, primer párr."}, {"id": "S218", "tema": "des", "tipo": "memoria", "q": "Al inicio de la comparecencia, ¿qué deben hacer del conocimiento de la persona citada los servidores públicos de la CNBV?", "a": "Las penas en que incurren quienes declaran falsamente ante autoridad distinta de la judicial", "o": ["Los plazos y medios de defensa para interponer recurso contra la sanción que en su caso se le imponga", "Las penas en que incurren quienes declaran falsamente ante autoridad distinta de la judicial", "Las sanciones por no designar testigos o por negarse a firmar el acta", "Las medidas precautorias que podrían imponerse a la entidad donde labora"], "x": "El art. 59 obliga a informar al citado las penas por declarar falsamente ante autoridad distinta de la judicial.", "ref": "Art. 59"}, {"id": "S219", "tema": "des", "tipo": "caso", "q": "Uno de los testigos se retira antes de que concluya la comparecencia. ¿Quién debe designar de inmediato a su sustituto?", "a": "El compareciente; ante negativa o impedimento, los servidores públicos de la CNBV", "o": ["El Inspector coordinador de la visita, sin intervención alguna del compareciente ni de su abogado", "Exclusivamente el abogado del compareciente", "El compareciente; ante negativa o impedimento, los servidores públicos de la CNBV", "Nadie; la diligencia continúa con un solo testigo"], "x": "En la comparecencia, el compareciente designa de inmediato otros testigos y, ante negativa o impedimento, lo hacen los servidores públicos facultados.", "ref": "Art. 60, segundo párrafo posterior a la fr. VII"}, {"id": "S220", "tema": "des", "tipo": "caso", "q": "Durante una investigación, la CNBV advierte que un gerente de sucursal de un banco autorizó personalmente las operaciones irregulares investigadas. ¿Puede requerir su comparecencia?", "a": "Sí; puede citarse a funcionarios o empleados a quienes se atribuyan probablemente los actos", "o": ["Sí; puede citarse a funcionarios o empleados a quienes se atribuyan probablemente los actos", "No; sólo pueden ser citados los representantes legales o apoderados de la entidad", "No; en un banco sólo puede citarse al director general como responsable", "Sólo si el gerente solicita por escrito comparecer de manera voluntaria"], "x": "El art. 55 comprende a funcionarios y empleados, y el art. 57, fr. II, permite citar cuando existan actos probablemente imputables a la persona.", "ref": "Arts. 55 y 57, fr. II"}, {"id": "S221", "tema": "des", "tipo": "caso", "q": "Una entidad emplazada presentó un escrito dentro del plazo, pero a juicio de la CNBV no desvirtúa los hechos imputados. ¿Qué consecuencia prevé el Reglamento?", "a": "Los hechos se tienen por acreditados y procede imponer la sanción correspondiente", "o": ["Se archiva el expediente por haber respondido en tiempo", "Se ordenan medidas correctivas en lugar de la sanción", "Los hechos se tienen por acreditados y procede imponer la sanción correspondiente", "Se le concede automáticamente un nuevo plazo de 10 días hábiles para ofrecer más pruebas"], "x": "Si lo manifestado no desvirtúa los hechos, éstos se tienen por acreditados y procede la sanción.", "ref": "Art. 64"}, {"id": "S222", "tema": "des", "tipo": "caso", "q": "Una entidad solicita ampliar el plazo para cumplir un programa de cumplimiento forzoso. Conforme al art. 54, ¿qué considera la CNBV para prorrogarlo?", "a": "La situación de la entidad y sus antecedentes", "o": ["La recomendación de su auditor externo independiente", "La situación de la entidad y sus antecedentes", "El tamaño de su capital contable y su calificación crediticia", "La opinión previa del Banco de México y de la SHCP"], "x": "La CNBV, considerando la situación de la entidad y sus antecedentes, podrá prorrogar el plazo a solicitud de la propia entidad.", "ref": "Art. 54"}, {"id": "S223", "tema": "des", "tipo": "memoria", "q": "Cuando la comparecencia es a requerimiento de la CNBV, ¿cómo debe solicitarse?", "a": "Mediante citatorio emitido por oficio firmado por servidores públicos competentes, fundado y motivado", "o": ["Mediante acta parcial levantada por el Inspector coordinador durante una visita en curso", "Mediante citatorio emitido por oficio firmado por servidores públicos competentes, fundado y motivado", "Mediante requerimiento verbal asentado en el acta de inicio de una visita de inspección", "Mediante aviso por medios electrónicos, aunque la persona no lo haya aceptado por escrito"], "x": "La comparecencia requerida se solicita por citatorio contenido en oficio firmado por los servidores públicos competentes.", "ref": "Art. 55, primer párr."}, {"id": "S224", "tema": "des", "tipo": "memoria", "q": "¿En cuál de estos supuestos puede la CNBV solicitar la comparecencia de una persona?", "a": "Cuando se presuma que tiene conocimiento de los hechos que se deben probar", "o": ["Cuando se presuma que tiene conocimiento de los hechos que se deben probar", "Cuando sea titular de la mayoría del capital social de la entidad", "Cuando lo solicite el auditor externo de la entidad", "Cuando la entidad no haya respondido observaciones en 20 días hábiles"], "x": "El art. 57 prevé tres supuestos: conocimiento de los hechos, actos probablemente imputables y contribución a una investigación.", "ref": "Art. 57, fr. I"}, {"id": "S225", "tema": "des", "tipo": "caso", "q": "La CNBV formulará observaciones a una sociedad de inversión. Según el art. 50, ¿a quién más puede dirigirse el oficio de observaciones?", "a": "A las sociedades que le presten servicios conforme a la ley, si tienen facultades suficientes", "o": ["Al Registro Nacional de Valores, para su anotación en el folio de la sociedad de inversión correspondiente", "A las sociedades que le presten servicios conforme a la ley, si tienen facultades suficientes", "Únicamente a los inversionistas con participación mayoritaria en su capital", "A la CONSAR, como autoridad coordinadora de las sociedades de inversión"], "x": "Tratándose de sociedades de inversión, el oficio podrá dirigirse a las sociedades que les presten servicios, siempre que cuenten con facultades suficientes.", "ref": "Art. 50, último párr."}, {"id": "S226", "tema": "des", "tipo": "caso", "q": "Una SOFIPO que recibió observaciones sostiene que la CNBV ya no puede sancionarla por esos mismos hechos, pues optó por observarlos. ¿Tiene razón?", "a": "No; las observaciones se formulan sin perjuicio del procedimiento sancionador", "o": ["Sólo si las irregularidades no son de los incisos a) a d)", "Sí, siempre que responda dentro del plazo de 20 días hábiles", "No; las observaciones se formulan sin perjuicio del procedimiento sancionador", "Sí; las observaciones sustituyen al procedimiento sancionador por los mismos hechos observados"], "x": "El oficio debe mencionar que las observaciones no impiden iniciar el procedimiento de sanción, y el art. 51 lo reitera.", "ref": "Art. 50, fr. VI; art. 51"}, {"id": "S227", "tema": "des", "tipo": "caso", "q": "La ley aplicable fija un plazo improrrogable para cumplir cierta medida correctiva y la entidad pide prórroga con base en el art. 54. ¿Qué procede?", "a": "No puede prorrogarse, pues el art. 54 exceptúa los plazos específicos o improrrogables de ley", "o": ["Prórroga discrecional, siempre que la apruebe previamente la Junta de Gobierno considerando sus antecedentes", "No puede prorrogarse, pues el art. 54 exceptúa los plazos específicos o improrrogables de ley", "Prórroga única por un periodo igual al original, como en el emplazamiento", "Prórroga de hasta 10 días hábiles, como en el oficio de observaciones"], "x": "La prórroga del art. 54 no aplica cuando las leyes o disposiciones señalan un plazo específico o improrrogable.", "ref": "Art. 54"}, {"id": "S228", "tema": "des", "tipo": "caso", "q": "Una entidad emplazada solicita dos prórrogas sucesivas de 10 días hábiles cada una para preparar sus pruebas. ¿Qué puede otorgarle la CNBV?", "a": "Una sola prórroga, hasta por 10 días hábiles", "o": ["Una sola prórroga, hasta por 10 días hábiles", "Una prórroga de hasta 20 días hábiles", "Las dos prórrogas, si lo justifican las circunstancias", "Una prórroga de hasta 15 días hábiles, a juicio de la Comisión"], "x": "El plazo del emplazamiento se prorroga por una sola ocasión, hasta por un periodo igual (10 días hábiles).", "ref": "Art. 63"}, {"id": "S229", "tema": "des", "tipo": "trampa", "q": "Durante una visita, el Inspector detecta irregularidades. ¿Mediante qué instrumento se comunican formalmente las observaciones a la entidad?", "a": "Mediante oficio fundado y motivado del servidor público facultado", "o": ["Mediante oficio fundado y motivado del servidor público facultado", "Mediante indicación verbal del Inspector coordinador al Representante Legal", "Mediante el informe general de la visita", "Mediante acta parcial firmada por el Inspector"], "x": "Las observaciones se comunican por oficio (art. 50); los Inspectores no pueden girar observaciones durante la visita (art. 15).", "ref": "Art. 50, primer párr.; art. 15"}, {"id": "S230", "tema": "des", "tipo": "caso", "q": "Una entidad respondió en tiempo las observaciones, pero la CNBV estima insuficientes sus argumentos. Además de ordenarle medidas correctivas, ¿qué puede ocurrir?", "a": "Que se inicie el procedimiento para aplicar las sanciones que resulten aplicables", "o": ["Nada más, pues la adopción de medidas correctivas excluye la imposición de cualquier sanción", "Que se otorgue de oficio una prórroga de 10 días hábiles", "Que se reponga el plazo de 20 días hábiles para nuevos argumentos", "Que se inicie el procedimiento para aplicar las sanciones que resulten aplicables"], "x": "Las medidas del art. 51 se ordenan sin perjuicio de que se inicie el procedimiento sancionador.", "ref": "Art. 51"}, {"id": "S231", "tema": "des", "tipo": "caso", "q": "Un citatorio para comparecer indica fecha, tema, servidor público ante quien se acude y apercibimiento, pero no dice nada sobre quién puede acompañar al citado. ¿Qué mención falta?", "a": "Que puede asistir acompañado de su abogado y de dos testigos", "o": ["Que puede asistir con un notario público que dé fe", "Que puede enviar a un apoderado con poder notarial", "Que puede acudir con su auditor externo y su contralor", "Que puede asistir acompañado de su abogado y de dos testigos"], "x": "La fr. IX exige mencionar que el citado podrá asistir con su abogado y dos testigos, y que si éstos no comparecen los designará la CNBV.", "ref": "Art. 55, fr. IX"}, {"id": "S232", "tema": "des", "tipo": "caso", "q": "Tras una revisión, la CNBV quiere sugerir a un banco mejoras en sus sistemas de control sin imputarle un probable incumplimiento. ¿Qué instrumento del art. 49 corresponde?", "a": "Recomendaciones", "o": ["Observaciones", "Programa de cumplimiento forzoso", "Recomendaciones", "Emplazamiento"], "x": "Las observaciones proceden ante un probable incumplimiento; las recomendaciones buscan que la entidad mejore sus sistemas de control o procesos.", "ref": "Art. 49, párr. segundo"}, {"id": "S233", "tema": "des", "tipo": "memoria", "q": "¿Con qué carácter se identifica a la Entidad Supervisada o Persona en el oficio de emplazamiento?", "a": "Presunto infractor", "o": ["Presunto infractor", "Responsable solidario", "Infractor reincidente", "Tercero interesado"], "x": "La fr. III señala el nombre de la entidad a quien se dirige, en su carácter de presunto infractor.", "ref": "Art. 62, fr. III"}, {"id": "S234", "tema": "des", "tipo": "caso", "q": "Termina la comparecencia de un oficial de cumplimiento. Antes de cerrar el acta, ¿qué debe preguntarle el servidor público encargado?", "a": "Si efectuó sus declaraciones y manifestaciones libre de cualquier coacción", "o": ["Si desea nombrar un apoderado que lo represente en las diligencias posteriores de comparecencia", "Si autoriza recibir notificaciones por medios electrónicos", "Si efectuó sus declaraciones y manifestaciones libre de cualquier coacción", "Si acepta las sanciones que resulten aplicables"], "x": "Al finalizar debe preguntarse si declaró libre de coacción, asentando pregunta y respuesta en el acta.", "ref": "Art. 61"}, {"id": "S235", "tema": "des", "tipo": "trampa", "q": "¿Qué límite máximo en días fija el art. 54 a la prórroga del plazo para cumplir medidas correctivas?", "a": "No fija un número de días; atiende a la situación y antecedentes de la entidad", "o": ["Hasta 20 días hábiles, contados a partir del vencimiento del plazo original", "Hasta 10 días hábiles, a solicitud de la entidad y por causa justificada", "Una sola vez, por un periodo igual al originalmente otorgado", "No fija un número de días; atiende a la situación y antecedentes de la entidad"], "x": "A diferencia del art. 50 (10 días hábiles) y del art. 63 (periodo igual), el art. 54 no establece un tope numérico.", "ref": "Art. 54"}, {"id": "S236", "tema": "des", "tipo": "caso", "q": "Una casa de bolsa recibe la notificación de un emplazamiento un viernes (hábil, sin días inhábiles próximos). ¿A partir de cuándo se cuenta el plazo de 10 días hábiles?", "a": "A partir del día hábil siguiente a la notificación: el lunes siguiente", "o": ["Desde el mismo viernes en que se notificó el emplazamiento", "A partir del tercer día hábil siguiente a la notificación: el miércoles", "A partir del día hábil siguiente a la notificación: el lunes siguiente", "Desde el sábado, por ser el día natural siguiente a la notificación"], "x": "El plazo de 10 días hábiles se cuenta a partir del día hábil siguiente al que se reciba la notificación.", "ref": "Art. 62, primer párr."}, {"id": "S237", "tema": "des", "tipo": "caso", "q": "Al responder un oficio de observaciones, una SOFIPO quiere anexar estados de cuenta y manuales que respaldan su postura. ¿Puede hacerlo?", "a": "Sí, puede acompañar la información y documentación que soporte su manifestación", "o": ["Sólo si antes solicita una comparecencia voluntaria para exhibirla", "Sólo si la CNBV le otorga previamente una prórroga para ese efecto", "Sí, puede acompañar la información y documentación que soporte su manifestación", "No; al oficio sólo pueden responderse argumentos por escrito, sin anexos"], "x": "La fr. VII permite acompañar al escrito la información y documentación que soporte su manifestación.", "ref": "Art. 50, fr. VII"}, {"id": "S238", "tema": "des", "tipo": "caso", "q": "La CNBV dirige un oficio de observaciones al contralor normativo de una casa de bolsa. Además de dirigirlo a él, ¿a quién debe remitirse copia?", "a": "Al director general de la Entidad Supervisada", "o": ["Al presidente del consejo de administración", "Al comisario de la sociedad", "Al auditor externo independiente", "Al director general de la
