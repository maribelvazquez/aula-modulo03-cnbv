<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mapa mental interactivo del Reglamento de Supervisión de la CNBV con simulador de reactivos.">
<title>Mapa del Reglamento de Supervisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}
.qactions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accion);color:var(--accion-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600;font-size:17px;margin-top:4px}
.score .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.trows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.trow2{display:grid;grid-template-columns:minmax(0,300px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.trow2 .tb{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow2 .tb i{display:block;height:100%;background:var(--principal-linea)}
.trow2 .tv{font-variant-numeric:tabular-nums;font-weight:700}
.miss{margin-top:16px;background:var(--surface-2);border-radius:12px;padding:12px 16px}
.miss summary{cursor:pointer}
.miss ul{margin:6px 0 0;padding-left:18px} .miss li{margin:8px 0}
.siminfo{font-size:13px;color:var(--muted);margin:12px 0 0}
/* repaso (tandas al azar o secuencia fija) */
.para{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--accion);border-radius:12px;padding:12px 16px;margin:-4px 0 18px;font-size:17px;font-weight:600;max-width:1040px}.para b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accion);margin-bottom:2px}
.tu{margin:10px 0;background:var(--surface);border:2px solid var(--negro);border-left:8px solid var(--coral);border-radius:10px;padding:10px 14px;font-size:16px}.tu b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.dist{margin-top:12px;font-weight:500;font-size:15px}.dist ul{margin:4px 0 0;padding-left:0;list-style:none}.dist li{margin:5px 0;padding-left:26px;text-indent:-26px}.dist li b{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;text-indent:0;margin-right:6px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-display);font-size:12px;background:var(--surface)}
.rp-fallas{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.rp-fallas h3{font-size:18px}
.rp-fallas p{font-size:14.5px}
.rp-box{scroll-margin-top:90px}
.rp-box .qtext{font-size:clamp(22px,2.8vw,34px)}
.rp-box .opt{font-size:17px}
.rp-clave{margin-top:12px;border-left:6px solid var(--principal-linea);background:var(--surface-2);border-radius:8px;padding:10px 14px;font-weight:600}
.rp-clave .lbl{margin-bottom:4px}
.rp-fin{margin:10px 0 0;padding-left:22px;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,26px);line-height:1.35}
.rp-fin li{margin:10px 0}
.rp-fin small{display:block;font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--muted)}
.rp-box:fullscreen{max-width:none;border-radius:0;border:0;padding:40px 6vw;overflow:auto;background:var(--bg)}
.rp-box:fullscreen .qtext{font-size:clamp(26px,3vw,42px)}
.rp-box:fullscreen .opt{font-size:20px}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(27,27,30,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{padding:20px 22px 18px;background:var(--c);color:var(--ci);display:flex;justify-content:space-between;gap:12px;align-items:center}
.dhead h3{font-size:28px;font-weight:700;color:inherit}
.dhead .x{background:rgba(255,255,255,.25);border:0;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:inherit;flex:none}
.dbody{padding:16px 22px 30px;overflow:auto}
.dbody ul{padding-left:18px;margin:0}
.dbody li{margin:8px 0}
.dbody .hook{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 12px}

footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:4px solid var(--membrete);padding-top:14px}
footer b{color:var(--ink)}

@media (max-width:1100px){.track{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:18px}.track::before{display:none}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .map,.map.n2,.map.n3{grid-template-columns:1fr;grid-template-areas:"core" "b1" "b2" "b3" "b4";gap:22px}
  .map.nmany{grid-template-columns:1fr;grid-template-areas:"core" "izq" "der";gap:22px}
  .map .col{gap:22px}
  .map svg.wires{display:none}
  .core{width:230px;justify-self:center}
  .opts{grid-template-columns:1fr}
  .lane{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .arrow{width:auto;height:30px;transform:rotate(90deg)}
  .stepd{grid-template-columns:1fr}
  .stepd ul{columns:1}
  .track{grid-template-columns:repeat(3,minmax(0,1fr))}
  .frac .inc{padding-left:16px}
}
@media (max-width:600px){ .chant p span{white-space:normal} .trow2{grid-template-columns:1fr auto}.trow2 .tb{grid-column:1/-1;order:3} }
@media (max-width:520px){ .rhythm{flex-wrap:wrap} .rh{flex:1 1 40%} }
.printhead{display:none}
/* franja del sitio (modo sitio: sólo si datos.sitio existe) */
.sitebar{display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:8px 16px;background:var(--negro);color:#fff;overflow-x:auto;scrollbar-width:none;font-family:var(--f-display);font-size:13px}
.sitebar::-webkit-scrollbar{display:none}
.sitebar .sb-mod{font-weight:700;letter-spacing:.04em;white-space:nowrap;margin-right:4px;color:#fff;text-decoration:none}
.sitebar .sb-mod:hover{text-decoration:underline}
.sitebar .sb-p{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;text-decoration:none;font-weight:700;white-space:nowrap;flex:none}
.sitebar a.sb-p:hover{border-color:#fff}
.sitebar .sb-p[aria-current="page"]{background:var(--principal);border-color:var(--principal);color:var(--principal-ink)}
.sitebar .sb-p.off{opacity:.45;border-style:dashed;cursor:not-allowed}
.sitebar .sb-sep{width:1px;height:20px;background:rgba(255,255,255,.3);flex:none}
.sitebar .sb-cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.sitebar .sb-ses{white-space:nowrap;color:rgba(255,255,255,.8);margin-left:auto;padding-left:12px;font-weight:600}
@media (max-width:700px){.sitebar .sb-ses{display:none}}
@media print{
  body{background:#fff;padding:0}
  .sitebar,.top,.hero,.traps,section.block:not(.sim),footer,.simbar,.modes,.sim > .lbl,.sim .sec-head,.qactions,.siminfo,.drawer,.scrim{display:none!important}
  .quiz{box-shadow:none;border:0;padding:0;max-width:none}
  .printhead{display:block;font-family:var(--f-display);font-size:14px;margin:0 0 8px}
  .miss{background:none;padding:0} .miss li{break-inside:avoid;margin:10px 0}
  .trow2 .tb{border-color:#999} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="sitebar" id="sitebar" aria-label="Páginas del módulo" hidden></nav>
  <header class="top">
    <div class="brand" id="brand"></div>
    <nav class="tabs" id="nav" aria-label="Secciones"></nav>
    <button class="recite-btn" id="recite" aria-pressed="false">Modo recitar</button>
  </header>
  <section class="hero" id="hero"></section>
  <div class="traps" id="traps"></div>
  <main id="secciones"></main>
  <footer id="pie"></footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="dTitle">

  <div class="dbody" id="dBody"></div>
</aside>

sura", "o": ["De la clausura", "De la intervención", "Observaciones y medidas correctivas", "Inspección, vigilancia, cooperación y asistencia internacional"], "x": "Título Décimo = De la clausura (arts. 101–109).", "ref": "Título Décimo"}, {"id": "S030", "tema": "gen", "tipo": "memoria", "q": "Los artículos 101–109 forman el…", "a": "Título Décimo", "o": ["Título Octavo", "Título Tercero", "Título Séptimo", "Título Décimo"], "x": "Arts. 101–109 = Título Décimo: De la clausura.", "ref": "Título Décimo"}, {"id": "S031", "tema": "gen", "tipo": "memoria", "q": "¿Qué artículo lo establece? La supervisión comprende inspección, vigilancia y prevención y corrección.", "a": "Art. 1", "o": ["Art. 101", "Art. 17", "Art. 3", "Art. 1"], "x": "Art. 1 (Título Primero, Disposiciones generales): la supervisión comprende inspección, vigilancia y prevención y corrección.", "ref": "Art. 1"}, {"id": "S032", "tema": "gen", "tipo": "memoria", "q": "¿Qué artículo lo establece? Define Entidades Supervisadas, Inspectores y Representante Legal o Apoderado.", "a": "Art. 3", "o": ["Art. 43", "Art. 89", "Art. 3", "Art. 1"], "x": "Art. 3 (Título Primero, Disposiciones generales): define Entidades Supervisadas, Inspectores y Representante Legal o Apoderado.", "ref": "Art. 3"}, {"id": "S033", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? La inspección se hace mediante visitas, verificación de operaciones y auditoría de registros y sistemas.", "a": "Art. 4", "o": ["Art. 45", "Art. 32", "Art. 4", "Art. 64"], "x": "Art. 4 (Título Segundo, De la inspección): la inspección se hace mediante visitas, verificación de operaciones y auditoría de registros y sistemas.", "ref": "Art. 4"}, {"id": "S034", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Las visitas pueden ser ordinarias, especiales o de investigación.", "a": "Art. 5", "o": ["Art. 10", "Art. 38", "Art. 81", "Art. 5"], "x": "Art. 5 (Título Segundo, De la inspección): las visitas pueden ser ordinarias, especiales o de investigación.", "ref": "Art. 5"}, {"id": "S035", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Las visitas ordinarias siguen el programa anual de la CNBV.", "a": "Art. 6", "o": ["Art. 20", "Art. 6", "Art. 15", "Art. 81"], "x": "Art. 6 (Título Segundo, De la inspección): las visitas ordinarias siguen el programa anual de la CNBV.", "ref": "Art. 6"}, {"id": "S036", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Visitas no incluidas en el programa anual, por ejemplo cuando la entidad inicia operaciones después.", "a": "Art. 8", "o": ["Art. 64", "Art. 29", "Art. 8", "Art. 62"], "x": "Art. 8 (Título Segundo, De la inspección): visitas no incluidas en el programa anual, por ejemplo cuando la entidad inicia operaciones después.", "ref": "Art. 8"}, {"id": "S037", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Visitas cuando hay indicios de una conducta que contraviene la ley.", "a": "Art. 9", "o": ["Art. 23", "Art. 9", "Art. 11", "Art. 51"], "x": "Art. 9 (Título Segundo, De la inspección): visitas cuando hay indicios de una conducta que contraviene la ley.", "ref": "Art. 9"}, {"id": "S038", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Visitas a quien opera como entidad financiera sin autorización.", "a": "Art. 10", "o": ["Art. 17", "Art. 41", "Art. 63", "Art. 10"], "x": "Art. 10 (Título Segundo, De la inspección): visitas a quien opera como entidad financiera sin autorización.", "ref": "Art. 10"}, {"id": "S039", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Por regla general, el Inspector coordinador elabora un informe general de la visita.", "a": "Art. 11", "o": ["Art. 45", "Art. 11", "Art. 50 Bis", "Art. 30"], "x": "Art. 11 (Título Segundo, De la inspección). Excepción: el art. 10 lo excluye en ciertas visitas de investigación.", "ref": "Art. 11"}, {"id": "S040", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Los Inspectores no pueden ordenar ajustes contables ni girar observaciones durante la visita.", "a": "Art. 15", "o": ["Art. 51", "Art. 108", "Art. 15", "Art. 20"], "x": "Art. 15 (Título Segundo, De la inspección): los Inspectores no pueden ordenar ajustes contables ni girar observaciones durante la visita.", "ref": "Art. 15"}, {"id": "S041", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? La CNBV puede contratar auditores evitando conflictos de interés.", "a": "Art. 16", "o": ["Art. 16", "Art. 32", "Art. 34", "Art. 31"], "x": "Art. 16 (Título Segundo, De la inspección): la CNBV puede contratar auditores evitando conflictos de interés.", "ref": "Art. 16"}, {"id": "S042", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Los servidores públicos deben guardar estricta reserva de la información.", "a": "Art. 17", "o": ["Art. 9", "Art. 25", "Art. 50 Bis", "Art. 17"], "x": "Art. 17 (Título Segundo, De la inspección): los servidores públicos deben guardar estricta reserva de la información.", "ref": "Art. 17"}, {"id": "S043", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Requisitos del oficio de orden de visita y duración máxima de 6 meses.", "a": "Art. 20", "o": ["Art. 31", "Art. 62", "Art. 20", "Art. 39"], "x": "Art. 20 (Título Segundo, De la inspección): requisitos del oficio de orden de visita y duración máxima de 6 meses.", "ref": "Art. 20"}, {"id": "S044", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? La orden se notifica con al menos 2 días hábiles de anticipación.", "a": "Art. 21", "o": ["Art. 108", "Art. 21", "Art. 55", "Art. 40"], "x": "Art. 21 (Título Segundo, De la inspección): la orden se notifica con al menos 2 días hábiles de anticipación.", "ref": "Art. 21"}, {"id": "S045", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Los Inspectores se identifican con credencial vigente con fotografía de la CNBV.", "a": "Art. 22", "o": ["Art. 38", "Art. 41", "Art. 21", "Art. 22"], "x": "Art. 22 (Título Segundo, De la inspección): los Inspectores se identifican con credencial vigente con fotografía de la CNBV.", "ref": "Art. 22"}, {"id": "S046", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Acta de inicio y citatorio para el día hábil siguiente.", "a": "Art. 23", "o": ["Art. 64", "Art. 56", "Art. 15", "Art. 23"], "x": "Art. 23 (Título Segundo, De la inspección): acta de inicio y citatorio para el día hábil siguiente.", "ref": "Art. 23"}, {"id": "S047", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Acta de constancia en cada lugar cuando la orden señala dos o más lugares.", "a": "Art. 25", "o": ["Art. 71", "Art. 25", "Art. 21", "Art. 49"], "x": "Art. 25 (Título Segundo, De la inspección): acta de constancia en cada lugar cuando la orden señala dos o más lugares.", "ref": "Art. 25"}, {"id": "S048", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? En el acta de inicio, el Representante Legal designa a dos testigos; si no lo hace, los designan los Inspectores.", "a": "Art. 26", "o": ["Art. 15", "Art. 26", "Art. 52", "Art. 29"], "x": "Art. 26 (Título Segundo, De la inspección): testigos del acta de inicio. Para las actas parciales, ver art. 37.", "ref": "Art. 26"}, {"id": "S049", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? La visita no puede suspenderse sin autorización expresa; pueden usarse días inhábiles.", "a": "Art. 28", "o": ["Art. 5", "Art. 32", "Art. 31", "Art. 28"], "x": "Art. 28 (Título Segundo, De la inspección): la visita no puede suspenderse sin autorización expresa; pueden usarse días inhábiles.", "ref": "Art. 28"}, {"id": "S050", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Acceso inmediato e irrestricto, entrevistas e informe por escrito de hechos relevantes.", "a": "Art. 29", "o": ["Art. 29", "Art. 16", "Art. 89", "Art. 52"], "x": "Art. 29 (Título Segundo, De la inspección): acceso inmediato e irrestricto, entrevistas e informe por escrito de hechos relevantes.", "ref": "Art. 29"}, {"id": "S051", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? La entidad proporciona espacio físico y equipo de cómputo a los Inspectores.", "a": "Art. 30", "o": ["Art. 4", "Art. 52", "Art. 30", "Art. 25"], "x": "Art. 30 (Título Segundo, De la inspección): la entidad proporciona espacio físico y equipo de cómputo a los Inspectores.", "ref": "Art. 30"}, {"id": "S052", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Relación genérica de la información y documentación exhibida.", "a": "Art. 31", "o": ["Art. 30", "Art. 89", "Art. 50 Bis", "Art. 31"], "x": "Art. 31 (Título Segundo, De la inspección): relación genérica de la información y documentación exhibida.", "ref": "Art. 31"}, {"id": "S053", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? La información en poder de un tercero debe obtenerla la entidad.", "a": "Art. 32", "o": ["Art. 50 Bis", "Art. 32", "Art. 30", "Art. 52"], "x": "Art. 32 (Título Segundo, De la inspección): la información en poder de un tercero debe obtenerla la entidad.", "ref": "Art. 32"}, {"id": "S054", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Casos en que es obligatorio levantar actas parciales.", "a": "Art. 34", "o": ["Art. 34", "Art. 22", "Art. 51", "Art. 101"], "x": "Art. 34 (Título Segundo, De la inspección): casos en que es obligatorio levantar actas parciales.", "ref": "Art. 34"}, {"id": "S055", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? La entidad puede desvirtuar las actas parciales hasta antes del acta de conclusión.", "a": "Art. 38", "o": ["Art. 38", "Art. 5", "Art. 71", "Art. 101"], "x": "Art. 38 (Título Segundo, De la inspección): la entidad puede desvirtuar las actas parciales hasta antes del acta de conclusión.", "ref": "Art. 38"}, {"id": "S056", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Requisitos del acta de conclusión.", "a": "Art. 39", "o": ["Art. 39", "Art. 3", "Art. 10", "Art. 6"], "x": "Art. 39 (Título Segundo, De la inspección): requisitos del acta de conclusión.", "ref": "Art. 39"}, {"id": "S057", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Concluida la visita no hay acta posterior; otra visita requiere nueva orden.", "a": "Art. 40", "o": ["Art. 40", "Art. 6", "Art. 15", "Art. 9"], "x": "Art. 40 (Título Segundo, De la inspección): concluida la visita no hay acta posterior; otra visita requiere nueva orden.", "ref": "Art. 40"}, {"id": "S058", "tema": "vis", "tipo": "memoria", "q": "¿Qué artículo lo establece? Si la visita se realiza en un mismo día, su inicio y conclusión pueden constar en una misma acta.", "a": "Art. 41", "o": ["Art. 39", "Art. 50", "Art. 41", "Art. 17"], "x": "Art. 41 (Título Segundo, De la inspección): posibilidad, no obligación, de usar una sola acta, con las formalidades de los arts. 23, 24, 26 y 39.", "ref": "Art. 41"}, {"id": "S059", "tema": "gen", "tipo": "memoria", "q": "¿Qué artículo lo establece? La vigilancia se hace mediante el análisis de la información.", "a": "Art. 43", "o": ["Art. 47", "Art. 87", "Art. 64", "Art. 43"], "x": "Art. 43 (Título Tercero, De la vigilancia): la vigilancia se hace mediante el análisis de la información.", "ref": "Art. 43"}, {"id": "S060", "tema": "gen", "tipo": "memoria", "q": "¿Qué artículo lo establece? Información entregada por sistemas electrónicos con acuse de recibo.", "a": "Art. 45", "o": ["Art. 4", "Art. 45", "Art. 30", "Art. 48"], "x": "Art. 45 (Título Tercero, De la vigilancia): información entregada por sistemas electrónicos con acuse de recibo.", "ref": "Art. 45"}, {"id": "S061", "tema": "gen", "tipo": "memoria", "q": "¿Qué artículo lo establece? Si la información no reúne requisitos o no es acorde con la realidad, se considera incumplida la obligación de presentarla.", "a": "Art. 48", "o": ["Art. 71", "Art. 43", "Art. 31", "Art. 48"], "x": "Art. 48 (Título Tercero, De la vigilancia): se considera no cumplida la obligación de presentar la información y procede, en su caso, la sanción.", "ref": "Art. 48"}, {"id": "S062", "tema": "des", "tipo": "memoria", "q": "¿Qué artículo lo establece? La CNBV puede formular observaciones y recomendaciones.", "a": "Art. 49", "o": ["Art. 41", "Art. 48", "Art. 54", "Art. 49"], "x": "Art. 49 (Título Cuarto, Observaciones y medidas correctivas): la CNBV puede formular observaciones y recomendaciones.", "ref": "Art. 49"}, {"id": "S063", "tema": "des", "tipo": "memoria", "q": "¿Qué artículo lo establece? Oficio de observaciones con plazo de hasta 20 días hábiles para responder.", "a": "Art. 50", "o": ["Art. 64", "Art. 50", "Art. 38", "Art. 52"], "x": "Art. 50 (Título Cuarto, Observaciones y medidas correctivas): oficio de observaciones con plazo de hasta 20 días hábiles para responder.", "ref": "Art. 50"}, {"id": "S064", "tema": "des", "tipo": "memoria", "q": "¿Qué artículo lo establece? Medidas precautorias con derecho de audiencia posterior.", "a": "Art. 50 Bis", "o": ["Art. 3", "Art. 87", "Art. 54", "Art. 50 Bis"], "x": "Art. 50 Bis (Título Cuarto, Observaciones y medidas correctivas): medidas precautorias con derecho de audiencia posterior.", "ref": "Art. 50 Bis"}, {"id": "S065", "tema": "des", "tipo": "memoria", "q": "¿Qué artículo lo establece? Si no se desvirtúan las observaciones se ordenan medidas correctivas.", "a": "Art. 51", "o": ["Art. 51", "Art. 62", "Art. 49", "Art. 11"], "x": "Art. 51 (Título Cuarto, Observaciones y medidas correctivas): si no se desvirtúan las observaciones se ordenan medidas correctivas.", "ref": "Art. 51"}, {"id": "S066", "tema": "des", "tipo": "memoria", "q": "¿Qué artículo lo establece? Las acciones, medidas correctivas o programas de cumplimiento forzoso pueden tener por objeto corregir irregularidades o prevenir las que puedan presentarse.", "a": "Art. 52", "o": ["Art. 52", "Art. 49", "Art. 40", "Art. 62"], "x": "Art. 52, segundo párrafo (Título Cuarto, Observaciones y medidas correctivas).", "ref": "Art. 52"}, {"id": "S067", "tema": "des", "tipo": "memoria", "q": "¿Qué artículo lo establece? Citatorio para comparecer ante la CNBV.", "a": "Art. 55", "o": ["Art. 55", "Art. 87", "Art. 81", "Art. 59"], "x": "Art. 55 (Título Quinto, De la comparecencia): citatorio para comparecer ante la CNBV.", "ref": "Art. 55"}, {"id": "S068", "tema": "des", "tipo": "memoria", "q": "¿Qué artículo lo establece? La comparecencia es personalísima y no admite apoderado.", "a": "Art. 56", "o": ["Art. 58", "Art. 56", "Art. 29", "Art. 71"], "x": "Art. 56 (Título Quinto, De la comparecencia): la comparecencia es personalísima y no admite apoderado.", "ref": "Art. 56"}, {"id": "S069", "tema": "des", "tipo": "memoria", "q": "¿Qué artículo lo establece? Emplazamiento con 10 días hábiles para manifestar, probar y alegar.", "a": "Art. 62", "o": ["Art. 62", "Art. 52", "Art. 11", "Art. 65"], "x": "Art. 62 (Título Sexto, Emplazamiento para la imposición de sanciones): emplazamiento con 10 días hábiles para manifestar, probar y alegar.", "ref": "Art. 62"}, {"id": "S070", "tema": "des", "tipo": "memoria", "q": "¿Qué artículo lo establece? La prórroga del emplazamiento se da una sola vez por un periodo igual.", "a": "Art. 63", "o": ["Art. 51", "Art. 101", "Art. 63", "Art. 65"], "x": "Art. 63 (Título Sexto, Emplazamiento para la imposición de sanciones): la prórroga del emplazamiento se da una sola vez por un periodo igual.", "ref": "Art. 63"}, {"id": "S071", "tema": "des", "tipo": "memoria", "q": "¿Qué artículo lo establece? Si no se desvirtúa el emplazamiento, los hechos se tienen por acreditados.", "a": "Art. 64", "o": ["Art. 11", "Art. 81", "Art. 64", "Art. 65"], "x": "Art. 64 (Título Sexto, Emplazamiento para la imposición de sanciones): si no se desvirtúa el emplazamiento, los hechos se tienen por acreditados.", "ref": "Art. 64"}, {"id": "S072", "tema": "ext", "tipo": "memoria", "q": "¿Qué artículo lo establece? La autoridad supervisora del exterior solicita por escrito a la CNBV visitar una filial con al menos 30 días naturales de anticipación.", "a": "Art. 71", "o": ["Art. 71", "Art. 101", "Art. 48", "Art. 79"], "x": "Art. 71 (Título Séptimo, Inspección, vigilancia, cooperación y asistencia internacional): supervisores del exterior piden visitar una filial con 30 días naturales de anticipación.", "ref": "Art. 71"}, {"id": "S073", "tema": "ext", "tipo": "memoria", "q": "¿Qué artículo lo establece? La Junta de Gobierno declara la intervención administrativa o gerencial.", "a": "Art. 81", "o": ["Art. 16", "Art. 81", "Art. 89", "Art. 39"], "x": "Art. 81 (Título Octavo, De la intervención): la Junta de Gobierno declara la intervención administrativa o gerencial.", "ref": "Art. 81"}, {"id": "S074", "tema": "ext", "tipo": "memoria", "q": "¿Qué artículo lo establece? El acta de intervención se firma en tres ejemplares.", "a": "Art. 87", "o": ["Art. 43", "Art. 108", "Art. 94", "Art. 87"], "x": "Art. 87 (Título Octavo, De la intervención): el acta de intervención se firma en tres ejemplares.", "ref": "Art. 87"}, {"id": "S075", "tema": "ext", "tipo": "memoria", "q": "¿Qué artículo lo establece? El nombramiento del interventor-gerente se inscribe en el Registro Público de Comercio.", "a": "Art. 89", "o": ["Art. 25", "Art. 86", "Art. 89", "Art. 45"], "x": "Art. 89 (Título Octavo, De la intervención): el nombramiento del interventor-gerente se inscribe en el Registro Público de Comercio.", "ref": "Art. 89"}, {"id": "S076", "tema": "ext", "tipo": "memoria", "q": "¿Qué artículo lo establece? Suspensión o clausura a quien opera sin autorización; 15 días hábiles para exponer.", "a": "Art. 101", "o": ["Art. 3", "Art. 30", "Art. 105", "Art. 101"], "x": "Art. 101 (Título Décimo, De la clausura): suspensión o clausura a quien opera sin autorización; 15 días hábiles para exponer.", "ref": "Art. 101"}, {"id": "S077", "tema": "ext", "tipo": "memoria", "q": "¿Qué artículo lo establece? La clausura se publica en dos periódicos de amplia circulación nacional.", "a": "Art. 105", "o": ["Art. 38", "Art. 17", "Art. 102", "Art. 105"], "x": "Art. 105 (Título Décimo, De la clausura): la clausura se publica en dos periódicos de amplia circulación nacional.", "ref": "Art. 105"}, {"id": "S078", "tema": "ext", "tipo": "memoria", "q": "¿Qué artículo lo establece? Notificaciones por medios electrónicos cuando la entidad lo acepta por escrito.", "a": "Art. 108", "o": ["Art. 4", "Art. 108", "Art. 103", "Art. 21"], "x": "Art. 108 (Título Décimo, De la clausura): notificaciones por medios electrónicos cuando la entidad lo acepta por escrito.", "ref": "Art. 108"}, {"id": "S079", "tema": "vis", "tipo": "memoria", "q": "En una visita ordinaria a un banco, ¿qué paso sigue inmediatamente después de emitir la «Orden de visita»?", "a": "Notificación", "o": ["Identificación", "Desarrollo de la revisión", "Notificación", "Acta de inicio"], "x": "Orden de visita → Notificación, con al menos 2 días hábiles de anticipación (art. 21). En visitas de investigación, y en las del 95 Bis a centros cambiarios, transmisores y SOFOM no reguladas, la notificación puede hacerse en el acto de inicio.", "ref": "Arts. 19 a 21"}, {"id": "S080", "tema": "vis", "tipo": "memoria", "q": "En una visita ordinaria a un banco, ya notificada la orden, ¿qué paso sigue inmediatamente después de la «Notificación»?", "a": "Identificación", "o": ["Informe general", "Acta de inicio", "Actas parciales", "Identificación"], "x": "Al presentarse en el lugar, los Inspectores deben identificarse previamente (art. 22). Si la orden se notifica en el acto de inicio (investigación o 95 Bis), la identificación precede a la notificación.", "ref": "Arts. 21 y 22"}, {"id": "S081", "tema": "vis", "tipo": "memoria", "q": "En la visita de inspección, ¿qué paso sigue inmediatamente después de «Identificación»?", "a": "Acta de inicio", "o": ["Acta de inicio", "Orden de visita", "Actas parciales", "Desarrollo de la revisión"], "x": "Identificación → Acta de inicio.", "ref": "Arts. 23–24 y 26"}, {"id": "S082", "tema": "vis", "tipo": "memoria", "q": "La orden de visita ordinaria a una casa de bolsa señala un solo lugar. Además del acta de inicio, ¿debe levantarse un acta de constancia de visita?", "a": "No; el acta de constancia procede cuando la orden señala dos o más lugares", "o": ["Sí; en toda visita se levanta después del acta de inicio, en el mismo lugar de la visita", "No; el acta de constancia procede cuando la orden señala dos o más lugares", "Sí, pero sólo si la visita dura más de un día", "Sólo si el Representante Legal lo solicita por escrito"], "x": "El art. 25 exige un acta de constancia en cada lugar visitado únicamente cuando la orden señala dos o más lugares. El Reglamento no la ubica como un paso fijo después del acta de inicio.", "ref": "Art. 25, primer párrafo"}, {"id": "S083", "tema": "vis", "tipo": "memoria", "q": "Una visita especial se practica en la matriz y en dos sucursales de un banco. ¿Qué datos de tiempo debe contener el acta de constancia que se levante en cada sucursal?", "a": "Fecha y hora de entrada y salida en ese lugar", "o": ["Sólo la fecha de inicio de toda la visita", "Fecha y hora de entrada y salida en ese lugar", "Fecha de la orden y hora de inicio de la revisión", "Fecha y hora de conclusión de toda la visita"], "x": "El art. 25, fr. II, exige que el acta de constancia de cada lugar contenga la fecha y hora de entrada y salida. La revisión en ese lugar ocurre dentro de ese lapso.", "ref": "Art. 25, fr. II"}, {"id": "S084", "tema": "vis", "tipo": "memoria", "q": "Conforme al art. 34, ¿qué carácter tiene el levantamiento de actas parciales durante la visita?", "a": "Potestativo en general y obligatorio en los casos que enumera el art. 34", "o": ["Obligatorio en toda visita, al terminar la revisión de cada lugar señalado en la orden", "Potestativo en general y obligatorio en los casos que enumera el art. 34", "Sólo procede en visitas de investigación", "Sólo procede a solicitud de la Entidad Supervisada, para asentar sus aclaraciones"], "x": "El art. 34 dice que los Inspectores «podrán» levantar actas parciales de hechos conocidos en el desarrollo de la visita, y que «deberán» hacerlo en los supuestos de las frs. I a V.", "ref": "Art. 34"}, {"id": "S085", "tema": "vis", "tipo": "memoria", "q": "Terminado el desarrollo de la revisión, con las actas parciales que en su caso se hayan levantado, ¿qué acta cierra la visita?", "a": "Acta de conclusión", "o": ["Acta de inicio", "Informe general", "Acta de conclusión", "Acta de entrega-recepción"], "x": "La visita se cierra con el acta de conclusión (art. 39), a la que se acompañan las actas de constancia y parciales que existan (fr. VIII). Levantada ésta, ya no cabe acta posterior (art. 40).", "ref": "Arts. 39 y 40"}, {"id": "S086", "tema": "vis", "tipo": "memoria", "q": "En la visita de inspección, ¿qué paso sigue inmediatamente después de «Acta de conclusión»?", "a": "Informe general", "o": ["Identificación", "Orden de visita", "Desarrollo de la revisión", "Informe general"], "x": "Acta de conclusión → Informe general del Inspector coordinador (arts. 11–14), salvo las visitas de investigación en que el art. 10 excluye el art. 11.", "ref": "Arts. 11–14"}, {"id": "S088", "tema": "vis", "tipo": "cifra", "q": "Como regla general, ¿con cuánta anticipación debe notificarse a un banco la orden de una visita ordinaria o especial?", "a": "Al menos 2 días hábiles", "o": ["Al menos 2 días hábiles", "Al menos 5 días hábiles", "Al menos 10 días naturales", "En el acto de inicio"], "x": "Art. 21: en visitas ordinarias y especiales la orden se notifica al menos 2 días hábiles antes. Excepción: a centros cambiarios, transmisores de dinero y SOFOM no reguladas, por el 95 Bis LGOAAC, puede notificarse en el acto de inicio.", "ref": "Art. 21, primer párrafo"}, {"id": "S089", "tema": "vis", "tipo": "cifra", "q": "A un banco se le practicará una visita de investigación. ¿Qué permite el art. 21 respecto de la notificación de la orden de visita?", "a": "Que se notifique en el acto de inicio de la visita", "o": ["Que se notifique en el acto de inicio de la visita", "Que se notifique sólo con al menos 2 días hábiles de anticipación", "Que se notifique sólo con al menos 5 días hábiles de anticipación", "Que se notifique dentro de los 2 días hábiles posteriores al inicio"], "x": "Art. 21: en visitas de investigación la orden podrá notificarse en el acto de inicio. La anticipación mínima de 2 días hábiles es obligatoria sólo en visitas ordinarias y especiales.", "ref": "Art. 21, primer párrafo"}, {"id": "S091", "tema": "vis", "tipo": "memoria", "q": "¿Cuáles son los tres tipos de visita de inspección?", "a": "Ordinarias, especiales y de investigación", "o": ["Ordinarias, especiales y de investigación", "Ordinarias, extraordinarias y de seguimiento", "Programadas, sorpresa y de investigación", "In situ, extra situ y de investigación"], "x": "Art. 5.", "ref": "Art. 5"}, {"id": "S092", "tema": "vis", "tipo": "cifra", "q": "¿Cuántos supuestos prevé el Reglamento para una visita especial?", "a": "6", "o": ["3", "4", "5", "6"], "x": "Art. 8, fracciones I a VI.", "ref": "Art. 8, frs. I a VI"}, {"id": "S093", "tema": "vis", "tipo": "cifra", "q": "¿Cuántos testigos se requieren en el acta de inicio?", "a": "2", "o": ["1", "2", "3", "4"], "x": "Art. 26: los designa el Representante Legal; si no, los Inspectores.", "ref": "Art. 26, primer párrafo"}, {"id": "S094", "tema": "vis", "tipo": "trampa", "q": "Durante la visita, ¿el Inspector puede girar observaciones o medidas correctivas?", "a": "No; no está facultado, sin perjuicio de pedir la información y documentación necesaria", "o": ["No; no está facultado, sin perjuicio de pedir la información y documentación necesaria", "Sí, verbalmente, cuando la irregularidad sea evidente", "Sí, mediante acta parcial firmada ante dos testigos", "Sólo si detecta incumplimientos graves y los asienta en un acta parcial firmada ante dos testigos"], "x": "Art. 15: los Inspectores no están facultados para ordenar ajustes ni girar observaciones, instrucciones o medidas correctivas durante la visita, sin perjuicio de solicitar la información y documentación necesaria. Las observaciones se comunican por oficio (art. 50).", "ref": "Art. 15"}, {"id": "S095", "tema": "vis", "tipo": "memoria", "q": "¿Qué documentos menciona el art. 22 del Reglamento como identificaciones oficiales?", "a": "Credencial para votar, cédula profesional y pasaporte", "o": ["Credencial para votar, cédula profesional y pasaporte", "Credencial para votar, licencia de conducir y pasaporte", "Sólo la credencial expedida por la CNBV", "Sólo el pasaporte vigente"], "x": "Art. 22.", "ref": "Art. 22, tercer párrafo"}, {"id": "S096", "tema": "vis", "tipo": "trampa", "q": "Ya se levantó el acta de conclusión y la CNBV quiere revisar en sitio un hecho que surgió de esa visita. ¿Qué procede?", "a": "Emitir una nueva orden de visita", "o": ["Emitir una nueva orden de visita", "Levantar un acta complementaria", "Levantar un acta parcial posterior", "Agregarlo al informe parcial"], "x": "Art. 40: concluida la visita no puede levantarse acta posterior alguna. Otra visita requiere nueva orden, aun con el mismo objeto o si deriva de la anterior.", "ref": "Art. 40"}, {"id": "S097", "tema": "vis", "tipo": "cifra", "q": "Dentro de la visita, ¿hasta cuándo puede la entidad desvirtuar lo asentado en actas parciales?", "a": "Hasta antes del acta de conclusión", "o": ["Hasta antes del acta de conclusión", "20 días hábiles después de la visita", "10 días hábiles después del acta parcial", "Hasta que reciba el emplazamiento"], "x": "Art. 38: dentro de la visita, hasta antes del levantamiento del acta de conclusión, dejando constancia en acta parcial (art. 34, fr. IV). Fuera de la visita quedan a salvo el oficio de observaciones (Título Cuarto) y el emplazamiento (Título Sexto), según el segundo párrafo del art. 38.", "ref": "Art. 38, primer párrafo"}, {"id": "S098", "tema": "vis", "tipo": "memoria", "q": "¿Quién debe elaborar el informe general de la visita?", "a": "En el Inspector que coordina la visita", "o": ["En el Inspector que coordina la visita", "En el Representante Legal o Apoderado de la entidad", "En el servidor público que emitió la orden de visita", "En el auditor externo contratado por la CNBV"], "x": "Arts. 11 y 12: el informe general lo elabora el Inspector coordinador, sin intervención del personal de la entidad, y da a conocer los hechos al servidor público competente de la CNBV.", "ref": "Arts. 11 y 12"}, {"id": "S099", "tema": "des", "tipo": "cifra", "q": "Como regla general, ¿de cuántos días hábiles es, como máximo, el plazo para responder un oficio de observaciones?", "a": "Hasta 20 días hábiles", "o": ["Hasta 10 días hábiles", "Hasta 15 días hábiles", "Hasta 20 días hábiles", "Hasta 30 días naturales"], "x": "Art. 50, fr. VII: plazo máximo de 20 días hábiles, que podrá ser de 3 días hábiles en las irregularidades de los incisos a) a d).", "ref": "Art. 50, fr. VII"}, {"id": "S100", "tema": "des", "tipo": "cifra", "q": "Para observaciones por incumplir requerimientos de capitalización, ¿qué plazo reducido permite fijar el art. 50 para que la entidad manifieste lo que a su derecho corresponda?", "a": "3 días hábiles", "o": ["3 días hábiles", "3 días naturales", "5 días naturales", "24 horas"], "x": "Art. 50, fr. VII, inc. b): en lugar del plazo máximo general de 20 días hábiles, podrá fijarse uno de 3 días hábiles. En los incisos a) a d) no procede la prórroga del penúltimo párrafo.", "ref": "Art. 50, fr. VII, segundo párrafo, inc. b)"}, {"id": "S101", "tema": "des", "tipo": "cifra", "q": "Salvo los supuestos del art. 50 que admiten plazo reducido de 3 días hábiles, ¿cuál es la prórroga máxima del plazo para responder observaciones?", "a": "10 días hábiles", "o": ["5 días hábiles", "10 días hábiles", "20 días hábiles", "Un periodo igual al original"], "x": "Art. 50.", "ref": "Art. 50, penúltimo párrafo"}, {"id": "S102", "tema": "des", "tipo": "cifra", "q": "¿Plazo para responder un emplazamiento?", "a": "10 días hábiles", "o": ["3 días hábiles", "10 días hábiles", "15 días hábiles", "20 días hábiles"], "x": "Art. 62.", "ref": "Art. 62, primer párrafo"}, {"id": "S103", "tema": "des", "tipo": "cifra", "q": "¿Cómo se prorroga el plazo del emplazamiento?", "a": "Una sola vez, hasta por un periodo igual", "o": ["Una sola vez, hasta por un periodo igual", "Dos veces, por 5 días hábiles cada una", "No admite prórroga", "Las veces que la CNBV estime"], "x": "Art. 63.", "ref": "Art. 63"}, {"id": "S106", "tema": "ext", "tipo": "memoria", "q": "¿Quién declara la intervención de una Entidad Supervisada?", "a": "La Junta de Gobierno de la CNBV", "o": ["La Junta de Gobierno de la CNBV", "El Presidente de la CNBV", "La SHCP", "El Inspector coordinador"], "x": "Art. 81; el Presidente designa al interventor (art. 82).", "ref": "Arts. 81 y 82"}, {"id": "S107", "tema": "ext", "tipo": "cifra", "q": "¿En cuántos ejemplares se firma el acta de la diligencia de intervención?", "a": "3", "o": ["1", "2", "3", "4"], "x": "Art. 87: un ejemplar para el funcionario o empleado que atiende la diligencia, otro para la CNBV y otro para el interventor. Las actas de inicio, constancia, parciales, conclusión y clausura se firman en 2 (arts. 24, 25, 35, 36, 39 y 104).", "ref": "Art. 87, primer párrafo"}, {"id": "S108", "tema": "ext", "tipo": "cifra", "q": "Tras una clausura, ¿qué plazo tiene el interesado para exponer lo que a su derecho convenga?", "a": "15 días hábiles", "o": ["10 días hábiles", "15 días hábiles", "20 días hábiles", "30 días naturales"], "x": "Art. 101.", "ref": "Art. 101, segundo párrafo"}, {"id": "S109", "tema": "ext", "tipo": "memoria", "q": "¿Cómo se hace pública una clausura?", "a": "Avisos en el exterior y publicación en dos periódicos de circulación nacional", "o": ["Avisos en el exterior y publicación en dos periódicos de circulación nacional", "Publicación en el DOF y notificación personal a los clientes del establecimiento", "Aviso en la página de internet de la CNBV y en el Registro Público de Comercio", "Avisos en el exterior y publicación en un periódico de circulación local"], "x": "Art. 105.", "ref": "Art. 105"}, {"id": "S110", "tema": "ext", "tipo": "cifra", "q": "¿Qué porcentaje del capital de otra sociedad deben representar, por lo menos, las acciones con derecho a voto de que sea propietaria una sociedad para configurar, por sí solo, uno de los supuestos de control del art. 70?", "a": "51%", "o": ["25%", "33%", "40%", "51%"], "x": "Art. 70, fr. VI, último párrafo: acciones con derecho a voto que representen por lo menos el 51% del capital. No es el único supuesto de control: también hay control con poder decisorio en asambleas, al nombrar a la mayoría del órgano de administración o por cualquier otro medio.", "ref": "Art. 70, fr. VI, último párrafo"}, {"id": "S111", "tema": "gen", "tipo": "memoria", "q": "¿Respecto de qué cumplimiento regula el Reglamento la supervisión de centros cambiarios, transmisores de dinero y SOFOM no reguladas?", "a": "Exclusivamente de los preceptos del art. 95 Bis de la LGOAAC y las disposiciones generales que de él deriven", "o": ["De todos los preceptos de la LGOAAC y de la Ley de la CNBV que les resulten aplicables", "Del art. 115 de la Ley de Instituciones de Crédito y de las disposiciones de carácter general que de él deriven", "De las disposiciones de solvencia, liquidez y estabilidad previstas en la LGOAAC", "Exclusivamente de los preceptos del art. 95 Bis de la LGOAAC y las disposiciones generales que de él deriven"], "x": "El Reglamento acota la supervisión de estos tres sujetos al cumplimiento del art. 95 Bis de la LGOAAC y sus disposiciones de carácter general (materia PLD/FT).", "ref": "Art. 1, segundo párrafo; Art. 2, segundo párrafo"}, {"id": "S112", "tema": "vis", "tipo": "caso", "q": "En una visita, la CNBV examina cómo está organizado un banco, cómo operan sus áreas y qué controles tiene para prevenir operaciones con recursos de procedencia ilícita. ¿Qué fracción del art. 4 ejerce?", "a": "Fracción I", "o": ["Fracción IV", "Fracción V", "Fracción II", "Fracción I"], "x": "La fr. I del art. 4 faculta a la CNBV a revisar, verificar, comprobar y evaluar operaciones, organización, funcionamiento, procesos y sistemas de control interno, de riesgos y de información.", "ref": "Art. 4, fr. I"}, {"id": "S113", "tema": "vis", "tipo": "caso", "q": "Inspectores llegan sin aviso previo a un transmisor de dinero para iniciar una visita ordinaria de PLD/FT y ahí le notifican la orden. El transmisor alega que debieron avisarle con 2 días hábiles. ¿Tiene razón?", "a": "No; para verificar el art. 95 Bis LGOAAC, su orden puede notificarse en el acto de inicio de la visita", "o": ["Sí, salvo que la CNBV reclasifique la visita como de investigación antes de iniciarla", "No; para verificar el art. 95 Bis LGOAAC, su orden puede notificarse en el acto de inicio de la visita", "Sí; en toda visita ordinaria, sin importar la entidad, la orden se notifica al menos 2 días hábiles antes", "No; para cualquier entidad basta notificar la orden con 1 día hábil de anticipación"], "x": "Para centros cambiarios, transmisores de dinero y SOFOM no reguladas, en visitas ordinarias, especiales y de investigación sobre el art. 95 Bis LGOAAC, la orden podrá notificarse en el acto de inicio.", "ref": "Art. 21, segundo párrafo"}, {"id": "S114", "tema": "gen", "tipo": "caso", "q": "Una SOFOM no regulada pregunta en cuál de las definiciones del art. 3 del Reglamento queda comprendida para efectos de su supervisión en PLD/FT.", "a": "En «Entidades Supervisadas», únicamente respecto del art. 95 Bis de la LGOAAC", "o": ["En «Personas», únicamente respecto del art. 95 Bis de la LGOAAC", "En «Entidades Supervisadas», únicamente respecto del art. 95 Bis de la LGOAAC", "En «Entidades Supervisadas», respecto de todas las materias de la LGOAAC", "En «Personas», respecto de todas las operaciones de crédito que celebre"], "x": "El segundo párrafo de la fr. II del art. 3 incluye a las SOFOM no reguladas en «Entidades Supervisadas», sólo para verificar el art. 95 Bis LGOAAC y disposiciones derivadas.", "ref": "Art. 3, fr. II, segundo párrafo"}, {"id": "S115", "tema": "vis", "tipo": "caso", "q": "Los Inspectores llegan al domicilio de una casa de bolsa para iniciar la visita, pero su Representante Legal o Apoderado no está presente. ¿Qué procede?", "a": "Dejar citatorio con cualquier persona del domicilio para que espere a hora fija del día hábil siguiente", "o": ["Iniciar de inmediato la visita con cualquier persona que se encuentre en el domicilio, sin dejar citatorio", "Dejar citatorio con cualquier persona para que espere dentro de 2 días hábiles", "Levantar acta circunstanciada y emitir una nueva orden de visita con otra fecha", "Dejar citatorio con cualquier persona del domicilio para que espere a hora fija del día hábil siguiente"], "x": "Si la visita no puede iniciarse por no estar el Representante Legal o Apoderado, se deja citatorio con cualquier persona en el domicilio para que espere a una hora fija del día hábil siguiente.", "ref": "Art. 23, penúltimo párrafo"}, {"id": "S116", "tema": "gen", "tipo": "memoria", "q": "Según el art. 1 del Reglamento, ¿cómo se ejerce la supervisión respecto de las entidades que conforman un grupo financiero?", "a": "De manera consolidada y basada en la medición de riesgos", "o": ["De manera consolidada, pero sólo respecto de la sociedad controladora", "De manera individual y basada en el programa anual de visitas", "De manera consolidada y basada en la medición de riesgos", "De manera individual por cada entidad y basada en su tamaño"], "x": "El art. 1 dispone que la supervisión se ejercerá de manera consolidada respecto de las entidades de un grupo financiero y estará basada en la medición de riesgos.", "ref": "Art. 1, tercer párrafo"}, {"id": "S117", "tema": "vis", "tipo": "trampa", "q": "Un juez ordena asegurar cuentas y la CNBV practica una visita de investigación para agilizar su cumplimiento. ¿Qué artículos del Reglamento NO son aplicables a esa visita?", "a": "Los arts. 11 y 31 (informe general y relación genérica de documentación)", "o": ["Los arts. 39 y 40 (acta de conclusión y prohibición de acta posterior)", "Los arts. 26 y 37 (designación y sustitución de testigos)", "Los arts. 21 y 23 (notificación de la orden y acta de inicio)", "Los arts. 11 y 31 (informe general y relación genérica de documentación)"], "x": "Para visitas de investigación que recaban información pedida por autoridades o agilizan aseguramientos o desbloqueos, el art. 10 excluye expresamente lo señalado en los arts. 11 y 31.", "ref": "Art. 10, segundo y tercer párrafos"}, {"id": "S118", "tema": "vis", "tipo": "caso", "q": "Durante la visita, un Inspector detecta reservas insuficientes y pide al contador de la entidad registrar en ese momento un castigo contable. ¿Es procedente?", "a": "No; los Inspectores no están facultados para ordenar ajustes, castigos ni movimientos contables en la visita", "o": ["Sí, siempre que lo haga constar en un acta parcial firmada por testigos", "No; los Inspectores no están facultados para ordenar ajustes, castigos ni movimientos contables en la visita", "Sí, si cuenta con el visto bueno del Inspector encargado de coordinar la visita", "Sí, pero sólo cuando el hecho implique un incumplimiento grave a juicio del Inspector y lo asiente en acta parcial"], "x": "El art. 15 niega a los Inspectores la facultad de ordenar ajustes, castigos y demás movimientos contables en el curso de la visita; sí pueden pedir la exhibición de información.", "ref": "Art. 15"}, {"id": "S119", "tema": "vis", "tipo": "memoria", "q": "Para el ejercicio de la inspección, ¿qué tipos de información y documentación puede obtener la CNBV conforme al último párrafo del art. 4?", "a": "Contable, legal, económica, financiera y administrativa", "o": ["Legal, fiscal y patrimonial de los accionistas", "Contable y financiera, exclusivamente", "Contable, legal, económica, financiera y administrativa", "Financiera, fiscal, laboral y de mercado"], "x": "El art. 4 permite a la CNBV obtener la información y documentación contable, legal, económica, financiera y administrativa necesaria.", "ref": "Art. 4, último párrafo"}, {"id": "S120", "tema": "vis", "tipo": "caso", "q": "Al llegar al domicilio de una SOFOM regulada para dejar citatorio, los Inspectores encuentran el local cerrado. ¿Con quién deben dejar el citatorio?", "a": "Con el vecino más inmediato", "o": ["Con el Representante Legal, en su domicilio particular", "Con el primer empleado que llegue al día hábil siguiente", "Con el vecino más inmediato", "Con el personal de seguridad del edificio o plaza comercial"], "x": "Si el local ubicado en el domicilio se encuentra cerrado, el citatorio se deja con el vecino más inmediato.", "ref": "Art. 23, penúltimo párrafo"}, {"id": "S121", "tema": "vis", "tipo": "memoria", "q": "Conforme al art. 7, ¿qué debe atender la frecuencia con que el programa anual prevé las visitas ordinarias?", "a": "La experiencia y necesidades, los resultados de la vigilancia y la suficiencia presupuestal de la CNBV", "o": ["Las solicitudes de visita que presenten las propias Entidades Supervisadas al inicio de cada ejercicio", "Un calendario fijo de una visita por año para cada Entidad Supervisada", "La experiencia y necesidades, los resultados de la vigilancia y la suficiencia presupuestal de la CNBV", "El monto de activos, el número de sucursales y el nivel de capitalización de cada una de las Entidades Supervisadas"], "x": "El programa contemplará que las visitas ordinarias se practiquen con la frecuencia que la experiencia y necesidades ameriten, atendiendo a los resultados de la vigilancia y a la suficiencia presupuestal.", "ref": "Art. 7"}, {"id": "S122", "tema": "gen", "tipo": "trampa", "q": "¿Cuál de estos sujetos NO queda comprendido en la definición de «Entidades Supervisadas» del art. 3 del Reglamento?", "a": "Transmisor de dinero", "o": ["Federación a que se refiere la Ley de Ahorro y Crédito Popular", "Oficina de representación de entidad financiera del exterior", "Sociedad financiera de objeto múltiple no regulada", "Transmisor de dinero"], "x": "Transmisores de dinero y centros cambiarios quedan en «Personas» (fr. V) y las SOFOM no reguladas en «Entidades Supervisadas» (fr. II), en ambos casos sólo para verificar el art. 95 Bis LGOAAC.", "ref": "Art. 3, frs. II y V"}, {"id": "S123", "tema": "vis", "tipo": "caso", "q": "Un banco se fusiona con otra institución a mitad del año, lo que modifica su situación legal y financiera. La CNBV quiere visitarlo antes del siguiente programa anual. ¿Con qué fundamento?", "a": "Visita especial por cambios en su situación contable, legal, económica, financiera o administrativa", "o": ["Visita ordinaria, adelantando la del programa anual del año siguiente", "Visita especial por cambios en su situación contable, legal, económica, financiera o administrativa", "Visita especial por derivar de la cooperación internacional prevista en el Título Séptimo del Reglamento", "Visita de investigación por indicios de una conducta contraria a la ley"], "x": "El art. 8, fr. III, prevé visitas especiales cuando se presenten cambios o modificaciones en la situación contable, legal, económica, financiera o administrativa de una Entidad Supervisada.", "ref": "Art. 8, fr. III"}, {"id": "S124", "tema": "vis", "tipo": "caso", "q": "Durante la visita, el director de cumplimiento pide participar en la redacción del informe general «para evitar malentendidos». ¿Qué prevé el Reglamento?", "a": "No puede intervenir, aunque en el informe general pueden considerarse las aclaraciones que haya hecho valer", "o": ["Puede redactar un anexo que la CNBV debe integrar al informe general como parte de él", "Puede revisar y firmar el borrador del informe antes de que se entregue a la CNBV", "No puede intervenir, aunque en el informe general pueden considerarse las aclaraciones que haya hecho valer", "Puede intervenir en la redacción si el Inspector coordinador lo autoriza por escrito y lo asienta en un acta parcial"], "x": "En la preparación de los informes no interviene el personal de la entidad, sin perjuicio de considerar en el informe general las aclaraciones y argumentos que ésta hubiere hecho valer.", "ref": "Art. 11, segundo párrafo"}, {"id": "S125", "tema": "vis", "tipo": "caso", "q": "Durante una visita de investigación a una persona que capta recursos sin autorización, el encargado del local cierra la puerta e impide el paso a los Inspectores. ¿Qué puede hacer la CNBV?", "a": "Solicitar el auxilio de la fuerza pública", "o": ["Suspender la visita y emitir una nueva orden con 2 días hábiles de aviso", "Clausurar en ese acto el establecimiento sin mayor trámite", "Imponer en el acto una multa por obstaculizar la diligencia", "Solicitar el auxilio de la fuerza pública"], "x": "Para el adecuado desarrollo de las visitas de investigación, la CNBV podrá solicitar el auxilio de la fuerza pública cuando se impida u obstaculice la visita o haya elementos para presumirlo.", "ref": "Art. 10, último párrafo"}, {"id": "S126", "tema": "vis", "tipo": "caso", "q": "Al día hábil siguiente de dejado el citatorio, el Representante Legal de la entidad visitada no se presenta a la hora fijada. ¿Qué procede?", "a": "Entender la visita con cualquier persona que se encuentre y hacerlo constar en el acta de inicio", "o": ["Entender la visita con el vecino más inmediato y hacerlo constar en el acta de inicio", "Entender la visita con cualquier persona que se encuentre y hacerlo constar en el acta de inicio", "Suspender la visita, levantar acta circunstanciada y emitir una nueva orden de visita", "Dejar un segundo citatorio para el día hábil siguiente y asentarlo en acta circunstanciada"], "x": "Si el Representante Legal o Apoderado no atiende el citatorio, la visita se entenderá con cualquier persona que se encuentre, circunstancia que se hace constar en el acta de inicio.", "ref": "Art. 23, último párrafo"}, {"id": "S127", "tema": "gen", "tipo": "memoria", "q": "¿Qué finalidad asigna el art. 43 del Reglamento a la función de vigilancia?", "a": "Evaluar el apego a la normatividad y la estabilidad y correcto funcionamiento de las Entidades Supervisadas", "o": ["Dar seguimiento a las medidas correctivas ordenadas, mediante actas parciales y de conclusión levantadas en visitas", "Imponer sanciones por los incumplimientos detectados durante las visitas", "Evaluar el apego a la normatividad y la estabilidad y correcto funcionamiento de las Entidades Supervisadas", "Comprobar en las instalaciones de la entidad su liquidez y solvencia mediante visitas"], "x": "La vigilancia analiza la información que obtiene la CNBV para evaluar el apego a la normatividad y la estabilidad y correcto funcionamiento de las Entidades Supervisadas.", "ref": "Art. 43, primer párrafo"}, {"id": "S128", "tema": "vis", "tipo": "caso", "q": "La orden de visita a un banco señala como lugar de la visita su centro de datos, ubicado en un domicilio distinto al social. ¿Debe la orden incluir también el domicilio del banco?", "a": "Sí; el domicilio se indica con independencia de que sea o no el lugar donde se efectúe la visita", "o": ["Sí; el domicilio se indica con independencia de que sea o no el lugar donde se efectúe la visita", "Sólo si se trata de una visita de investigación", "Sólo si el banco no tiene registrado su domicilio ante la CNBV", "No; basta con señalar el lugar o lugares donde se practicará la visita, aunque sean distintos del domicilio"], "x": "La fr. VII del art. 20 exige el domicilio de la entidad con independencia de que se trate o no del lugar o lugares donde se efectuará la visita.", "ref": "Art. 20, fr. VII"}, {"id": "S129", "tema": "vis", "tipo": "caso", "q": "En un acta de inicio firman el Inspector coordinador y dos de los seis Inspectores autorizados en la orden. La entidad alega que el acta es inválida. ¿Tiene razón?", "a": "No; no es necesario que todos los Inspectores autorizados en la orden suscriban el acta de inicio", "o": ["No; no es necesario que todos los Inspectores autorizados en la orden suscriban el acta de inicio", "Sí; deben firmar el acta todos los Inspectores autorizados en la orden de visita, además de los testigos", "No, pero debe levantarse un acta parcial para subsanar la omisión", "Sí, porque debe firmar al menos la mitad de los Inspectores autorizados"], "x": "La fr. V del art. 23 señala que no será necesario que todos los Inspectores autorizados en la orden suscriban el acta de inicio.", "ref": "Art. 23, fr. V"}, {"id": "S130", "tema": "vis", "tipo": "trampa", "q": "¿Cuál de los siguientes supuestos NO está previsto en el art. 8 para ordenar una visita especial?", "a": "Que la propia entidad solicite ser visitada para acreditar su cumplimiento", "o": ["Hechos no contemplados en el programa anual que, a juicio de la CNBV, la motiven", "Que una Entidad Supervisada inicie operaciones después de elaborado el programa anual", "Que la propia entidad solicite ser visitada para acreditar su cumplimiento", "Dar seguimiento a los resultados obtenidos en una visita de inspección"], "x": "El art. 8 prevé seis supuestos (situaciones especiales operativas, seguimiento, cambios, inicio de operaciones, hechos no contemplados y cooperación internacional); la solicitud de la entidad no es uno de ellos.", "ref": "Art. 8"}, {"id": "S131", "tema": "vis", "tipo": "memoria", "q": "¿Qué debe hacer del conocimiento el Inspector coordinador al Representante Legal que atiende la visita y a las personas que participen en ella?", "a": "De las penas en que incurren quienes declaran falsamente ante autoridad distinta de la judicial", "o": ["De las sanciones por no atender el citatorio dejado el día hábil anterior", "De las penas en que incurren quienes declaran falsamente ante autoridad distinta de la judicial", "De su derecho a abstenerse de firmar cualquier acta de la visita", "De las multas en que incurre la entidad por no proporcionar espacio físico y equipo de cómputo a los Inspectores"], "x": "El art. 24 obliga al Inspector coordinador a informar las penas por declarar falsamente ante autoridad distinta de la judicial en ejercicio de sus atribuciones.", "ref": "Art. 24, primer párrafo"}, {"id": "S132", "tema": "gen", "tipo": "caso", "q": "Un centro cambiario consulta en qué definición del art. 3 del Reglamento queda comprendido cuando la CNBV verifica su cumplimiento del art. 95 Bis de la LGOAAC.", "a": "En «Personas», exclusivamente respecto de esa supervisión", "o": ["En «Entidades Supervisadas», exclusivamente respecto de esa supervisión", "En «Entidades Supervisadas», respecto de todas sus operaciones cambiarias", "En «Personas», respecto de todas sus operaciones cambiarias", "En «Personas», exclusivamente respecto de esa supervisión"], "x": "El segundo párrafo de la fr. V del art. 3 incluye a centros cambiarios y transmisores de dinero en «Personas», exclusivamente para verificar el art. 95 Bis LGOAAC.", "ref": "Art. 3, fr. V, segundo párrafo"}, {"id": "S133", "tema": "vis", "tipo": "caso", "q": "En plena diligencia, uno de los dos testigos del acta avisa que se retira porque ya no desea ser testigo. ¿Qué procede?", "a": "El Representante designa otro de inmediato; ante negativa o impedimento del designado, podrán hacerlo los Inspectores", "o": ["Se continúa con un solo testigo, asentando la circunstancia y su causa en el acta", "El acta pierde validez y debe levantarse de nuevo al día hábil siguiente, con dos testigos que permanezcan hasta el final", "El Representante designa otro de inmediato; ante negativa o impedimento del designado, podrán hacerlo los Inspectores", "Los Inspectores designan al sustituto sin dar intervención al Representante, y lo asientan"], "x": "Los testigos pueden sustituirse en cualquier tiempo, entre otras causas, por manifestar su voluntad de dejar de serlo. El Representante designa otro y, ante la negativa o impedimento del designado, los Inspectores podrán designarlo.
