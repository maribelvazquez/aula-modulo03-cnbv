nco", "Al otorgar la autorización del banco y cuando éste solicite ampliar sus líneas de negocio o su red de sucursales"], "x": "El párr. 37 combina revisión periódica con revisión en todo momento ante cambios o nuevas amenazas. Es la misma lógica que el párr. 57 aplica a la evaluación del propio banco.", "ref": "Párrs. 37 y 57"}, {"id": "G030", "tema": "sup", "tipo": "caso", "q": "La autoridad de Lusardia analiza una solicitud para adquirir una participación mayoritaria de un banco en un sector cuyo riesgo de LA/FT es alto. ¿Qué ajuste del párr. 39 aplica y qué permite?", "a": "El ajuste de la intensidad de los controles de autorización: con riesgo sectorial alto, el supervisor podrá solicitar información adicional", "o": ["El ajuste de la frecuencia de supervisión: con riesgo sectorial alto, el supervisor debe diferir la decisión hasta el siguiente examen periódico", "El ajuste de la intensidad de los controles de autorización: con riesgo sectorial alto, el supervisor podrá solicitar información adicional", "El ajuste de la intensidad de la supervisión: con riesgo sectorial alto, el supervisor debe negar la solicitud sin revisar la documentación", "El ajuste del tipo de supervisión: con riesgo sectorial alto, el supervisor debe sustituir la revisión documental por un análisis extra situ"], "x": "El párr. 39 a) trata la función de autorización: evitar que delincuentes tengan una parte significativa o mayoritaria de un banco. Con riesgo bajo puede bastar un examen de documentación; con riesgo alto «podrá» pedir información adicional, no negar de plano.", "ref": "Párr. 39 a)"}, {"id": "G031", "tema": "sup", "tipo": "caso", "q": "Banco Ambrisa fue clasificado como de mayor riesgo. Un inspector propone supervisarlo en adelante sólo con la información que el banco reporta a gabinete. ¿Qué señala la guía?", "a": "Que la supervisión extra situ por sí sola puede no ser apropiada en situaciones de mayor riesgo, aunque el supervisor define la combinación que el régimen permita", "o": ["Que la supervisión extra situ por sí sola puede no ser apropiada en situaciones de mayor riesgo, aunque el supervisor define la combinación que el régimen permita", "Que es la opción recomendada, porque la guía reserva la supervisión in situ para bancos de menor riesgo que no presentan reportes regulatorios suficientes", "Que es admisible si el banco lo solicita por escrito, porque la combinación de supervisión in situ y extra situ la determina la entidad supervisada según su perfil de riesgo", "Que es la opción obligada, porque en un EBR el supervisor pierde el acceso in situ a la información de los bancos clasificados como de mayor riesgo"], "x": "El párr. 39 b) dice que el supervisor siempre debe tener acceso in situ y extra situ, que podrá determinar la combinación correcta en la medida en que el régimen lo permita y que la extra situ por sí sola puede no ser apropiada con mayor riesgo. La combinación la decide el supervisor, no el banco.", "ref": "Párr. 39 b)"}, {"id": "G032", "tema": "sup", "tipo": "caso", "q": "El supervisor de Banco Irsel tiene programado su siguiente examen periódico dentro de dos años, pero recibe una denuncia de irregularidades sobre el banco. ¿Qué prevé la guía?", "a": "Combinar los exámenes periódicos con una supervisión ALA/CFT con fines específicos, detonada por indicadores como una denuncia de irregularidades", "o": ["Mantener el calendario previsto, pues la frecuencia se fija con el perfil de riesgo al inicio del ciclo y se modifica al concluir el examen periódico", "Combinar los exámenes periódicos con una supervisión ALA/CFT con fines específicos, detonada por indicadores como una denuncia de irregularidades", "Esperar a que la supervisión prudencial confirme la denuncia, ya que la guía reserva a sus hallazgos la posibilidad de adelantar una revisión", "Remitir la denuncia a la UIF y abstenerse de actuar, ya que las denuncias de irregularidades se atienden fuera de la supervisión ALA/CFT"], "x": "El párr. 39 c) pide ajustar la frecuencia al riesgo y combinar exámenes periódicos con supervisión con fines específicos ante denuncias, información de autoridades u otros hallazgos. Los hallazgos prudenciales son uno de esos detonantes, no el único.", "ref": "Párr. 39 c)"}, {"id": "G033", "tema": "sup", "tipo": "memoria", "q": "¿Cuál es un ejemplo de supervisión más estricta que menciona el ajuste de intensidad del párr. 39 d)?", "a": "Realizar pruebas a fondo de sistemas y archivos y entrevistas con personal operativo, alta dirección y consejo de administración", "o": ["Reemplazar la visita por el análisis de reportes regulatorios y cuestionarios que el banco envía de forma periódica a gabinete", "Realizar pruebas a fondo de sistemas y archivos y entrevistas con personal operativo, alta dirección y consejo de administración", "Ampliar el intervalo entre exámenes periódicos y reducir las revisiones de seguimiento a los bancos con buen historial", "Basar la decisión de aprobación sobre accionistas en un examen de la documentación pertinente que presenta el solicitante"], "x": "El párr. 39 d) lista como supervisión más estricta las pruebas a fondo de sistemas y archivos, la revisión de auditoría interna y las entrevistas con personal, alta dirección y consejo. Basarse en documentación es el ejemplo de riesgo bajo del ajuste de autorización (39 a).", "ref": "Párr. 39 a) y d)"}, {"id": "G034", "tema": "sup", "tipo": "cifra", "q": "¿Cuántas y cuáles son las formas de ajuste del enfoque del supervisor que enumera la Sección II · A?", "a": "Cuatro: intensidad de los controles de autorización, y tipo, frecuencia e intensidad de la supervisión ALA/CFT", "o": ["Cinco: autorización, tipo, frecuencia, intensidad y publicación de los resultados de la supervisión a los bancos", "Tres: autorización de accionistas, imposición de sanciones y revocación de la licencia según el riesgo identificado", "Cuatro: identificación, verificación, monitoreo y reporte de las operaciones de los bancos bajo supervisión", "Cuatro: intensidad de los controles de autorización, y tipo, frecuencia e intensidad de la supervisión ALA/CFT"], "x": "El párr. 39 enumera los incisos a) a d): autorización, tipo, frecuencia e intensidad. Identificar, verificar, monitorear y reportar son tareas del banco en la Sección III, no ajustes del supervisor.", "ref": "Párr. 39"}, {"id": "G035", "tema": "sup", "tipo": "caso", "q": "Tras un ciclo de visitas, el supervisor de Nerania detecta debilidades comunes en los programas ALA/CFT de varios bancos. ¿Qué indica la guía sobre esos resultados?", "a": "Usarlos para revisar sus evaluaciones de riesgo y su enfoque y, cuando proceda y respetando la confidencialidad, comunicarlos a los bancos", "o": ["Reservarlos para uso interno de la autoridad, porque darlos a conocer a los bancos compromete la confidencialidad y no contribuye a mejorar su EBR", "Enviarlos a la UIF para que decida si los incorpora a la evaluación nacional de riesgos, sin modificar el enfoque de supervisión vigente", "Difundirlos con el nombre de cada banco evaluado, porque la guía da prioridad a la transparencia sobre los requisitos de confidencialidad pertinentes", "Usarlos para revisar sus evaluaciones de riesgo y su enfoque y, cuando proceda y respetando la confidencialidad, comunicarlos a los bancos"], "x": "El párr. 40 pide usar los resultados para actualizar evaluaciones y considerar si el enfoque, las normas y la guía siguen siendo adecuados; cuando proceda y con confidencialidad, comunicarlos a los bancos para que mejoren su EBR.", "ref": "Párr. 40"}, {"id": "G036", "tema": "sup", "tipo": "memoria", "q": "¿Qué características deben tener las acciones de supervisión, según el enfoque general de la Sección II · B?", "a": "Ser previsibles, coherentes y proporcionales en la mayoría de los casos, con formación del personal y comunicación de expectativas", "o": ["Ser idénticas para todos los bancos, sin atender a su complejidad operativa, para asegurar la igualdad de condiciones", "Ser sorpresivas, uniformes y sancionadoras en todos los casos, para disuadir a los bancos de relajar sus controles internos", "Ser confidenciales y discrecionales, sin sujetarse a las expectativas que el supervisor haya comunicado antes a los bancos mediante sus guías", "Ser previsibles, coherentes y proporcionales en la mayoría de los casos, con formación del personal y comunicación de expectativas"], "x": "El párr. 42 fija el objetivo de acciones previsibles, coherentes y proporcionales «en la mayoría de los casos», apoyadas en la formación del personal supervisor y la comunicación efectiva de expectativas.", "ref": "Párr. 42"}, {"id": "G037", "tema": "sup", "tipo": "caso", "q": "Al comparar los programas ALA/CFT de Banco Calima, de operación compleja, y Banco Terral, de operación sencilla, el supervisor observa controles distintos. ¿Qué debe tener en cuenta?", "a": "Que en un EBR puede haber razones de peso para que los controles no sean iguales, y que debe contar con herramientas para evaluar esas diferencias", "o": ["Que debe pedir al banco sencillo adoptar los controles del complejo, porque las comparaciones entre programas buscan homologar los controles del sector", "Que en un EBR puede haber razones de peso para que los controles no sean iguales, y que debe contar con herramientas para evaluar esas diferencias", "Que debe calificar como deficiente al banco con menos controles, porque en un EBR el número de controles es el indicador de su calidad", "Que debe evitar comparar programas entre bancos de distinta complejidad, porque la guía considera inválidas esas comparaciones para el EBR"], "x": "El párr. 43 recomienda considerar comparaciones entre programas, pero advierte que los controles pueden no ser iguales por razones de peso, sobre todo frente a bancos con distinta complejidad operativa. Comparar sirve para ver la calidad, no para homologar.", "ref": "Párr. 43"}, {"id": "G038", "tema": "sup", "tipo": "trampa", "q": "La Caja 1 cita los lineamientos que el Comité de Basilea publicó en enero de 2014 sobre la gestión de riesgos de LA/FT. ¿Qué precisa la guía sobre ellos?", "a": "Que apoyan la implementación de los estándares del GAFI de 2012 y no deben interpretarse como su modificación, ni para robustecerlos ni para debilitarlos", "o": ["Que fueron emitidos por las Autoridades Supervisoras Europeas e incluyen cuestionamientos de autoevaluación que los supervisores deben hacerse", "Que apoyan la implementación de los estándares del GAFI de 2012 y no deben interpretarse como su modificación, ni para robustecerlos ni para debilitarlos", "Que sustituyen a los estándares del GAFI en la supervisión bancaria, dado que el Comité de Basilea es el emisor especializado para el sector bancario internacional", "Que robustecen los estándares del GAFI, de modo que ante una discrepancia prevalecen los requisitos más estrictos que establece el Comité de Basilea"], "x": "La Caja 1 aclara que los lineamientos del CSBB apoyan los estándares del GAFI y no los modifican. Los cuestionamientos de autoevaluación corresponden al reporte preliminar de las Autoridades Supervisoras Europeas de octubre de 2013, la otra fuente de la misma caja.", "ref": "Caja 1"}, {"id": "G039", "tema": "sup", "tipo": "caso", "q": "La autoridad de Belmira diseña la capacitación de sus inspectores ALA/CFT. Conforme a la NI 26 y la Sección II, ¿qué debe lograr?", "a": "Que entiendan la discrecionalidad del banco y puedan evaluar la calidad de sus evaluaciones de riesgo y la idoneidad y proporcionalidad de sus controles", "o": ["Que entiendan la discrecionalidad del banco y puedan evaluar la calidad de sus evaluaciones de riesgo y la idoneidad y proporcionalidad de sus controles", "Que apliquen listas de verificación cerradas que eviten el juicio del inspector, de modo que ningún banco reciba un trato diferenciado en la visita", "Que dominen las técnicas de investigación penal, pues el propósito central de la visita ALA/CFT es acreditar la comisión del delito de lavado", "Que conozcan a fondo las guías de la industria, que remplazan las expectativas del supervisor cuando éstas se formulan como principios de alto nivel"], "x": "Los párrs. 46–47 piden entender el grado de discrecionalidad del banco, evaluar sus evaluaciones de riesgo y la idoneidad, proporcionalidad y eficacia de sus controles, usando el buen juicio. La guía de la industria puede ser útil, pero no sustituye al supervisor (párr. 49).", "ref": "Párrs. 46–47"}, {"id": "G040", "tema": "sup", "tipo": "memoria", "q": "¿Qué formas puede adoptar la guía que los supervisores dan a los bancos sobre sus obligaciones, según la Sección II · B?", "a": "Requisitos de alto nivel basados en resultados, normas basadas en riesgo, información sobre cómo interpreta las leyes o guía detallada sobre controles específicos", "o": ["Resoluciones sancionadoras publicadas, que ilustran a los bancos qué conductas considera el supervisor incumplimientos y qué sanciones les corresponden en cada caso", "Requisitos de alto nivel basados en resultados, normas basadas en riesgo, información sobre cómo interpreta las leyes o guía detallada sobre controles específicos", "Respuestas a consultas individuales de cada banco, ya que la guía de alcance general debe provenir de las asociaciones del sector privado", "Manuales técnicos de sistemas automatizados elaborados por proveedores certificados, que el supervisor distribuye a los bancos como estándar operativo obligatorio"], "x": "El párr. 48 enumera esas cuatro formas y pide hacerlo tras un proceso de consulta con las partes interesadas; además sugiere que la guía fomente la inclusión financiera.", "ref": "Párr. 48"}, {"id": "G041", "tema": "sup", "tipo": "caso", "q": "La asociación de bancos de Corvania publica una guía operativa; el supervisor sólo emitió principios de alto nivel. Banco Estival quiere apoyarse en la guía de la asociación. ¿Qué indica la guía del GAFI?", "a": "Que podría resultar útil para fines explicativos y operacionales, pero el banco debe cuidar que sea compatible con la legislación nacional", "o": ["Que podría resultar útil para fines explicativos y operacionales, pero el banco debe cuidar que sea compatible con la legislación nacional", "Que la guía de la industria prevalece sobre las expectativas del supervisor, porque refleja con mayor precisión la realidad operativa de los bancos", "Que la guía de la industria es inaplicable, porque sólo puede tomarse en cuenta cuando el supervisor la emite como documento de guía conjunta", "Que la guía de la industria obliga a todos los bancos del país desde su publicación, aun cuando no se fundamente en las normas internacionales"], "x": "El párr. 49 dice que, si la guía del supervisor se basa en principios de alto nivel, la de la industria «podría resultar útil», pero los bancos deben verificar que sea compatible con la legislación nacional. La guía conjunta del párr. 50 es entre autoridades, no con la industria.", "ref": "Párrs. 49–50"}, {"id": "G042", "tema": "sup", "tipo": "caso", "q": "En Idaria, el supervisor prudencial y el supervisor ALA/CFT emiten guías con criterios diferentes sobre la misma obligación. ¿Qué recomienda la guía?", "a": "Coordinarse para interpretar las obligaciones de forma coherente y evitar arbitraje regulatorio, lagunas o confusión y, de ser posible, emitir guía conjunta", "o": ["Dejar que cada banco elija qué guía seguir según su perfil de riesgo, siempre que documente la decisión y la apruebe su alta dirección", "Retirar la guía del supervisor ALA/CFT, ya que cuando existen divisiones separadas corresponde al supervisor prudencial emitir las guías", "Coordinarse para interpretar las obligaciones de forma coherente y evitar arbitraje regulatorio, lagunas o confusión y, de ser posible, emitir guía conjunta", "Mantener ambas guías, porque la pluralidad de criterios da a los bancos margen para elegir el más adecuado a su perfil de riesgo, a su tamaño y a su modelo de negocio"], "x": "El párr. 50 pide coordinación entre autoridades para una interpretación coherente y advierte que la guía de múltiples fuentes no debe ofrecer arbitraje regulatorio, lagunas ni confusión; siempre que sea posible, guía conjunta.", "ref": "Párr. 50"}, {"id": "G043", "tema": "ban", "tipo": "caso", "q": "Banco Almira ofrece a sus clientes productos para administrar su patrimonio; varios de ellos son PEP, usan fideicomisos offshore y operan en jurisdicciones múltiples. ¿Qué línea de negocio es y qué riesgos le asocia la Caja 2?", "a": "Administración patrimonial, con riesgos como la cultura de la confidencialidad, la dificultad para identificar propietarios reales y el secreto bancario", "o": ["Banca de inversión, con riesgos como la estratificación e integración y la transferencia de activos entre partes a cambio de efectivo u otros activos", "Administración patrimonial, con riesgos como la cultura de la confidencialidad, la dificultad para identificar propietarios reales y el secreto bancario", "Banca minorista, con riesgos como los servicios a negocios de alto flujo de efectivo, el volumen de transacciones y la diversidad de servicios", "Servicios de corresponsalía, con riesgos como las transacciones de alto valor, la información limitada del remitente y la posible participación de PEP en la propiedad de un banco"], "x": "El párr. 52 describe la administración patrimonial (a veces llamada banca privada) y la Caja 2 le asocia confidencialidad, propietarios reales difíciles de identificar, fideicomisos offshore, secreto bancario, PEP y jurisdicciones múltiples. Los PEP también aparecen en corresponsalía, pero referidos a la propiedad de un banco.", "ref": "Párr. 52 · Caja 2"}, {"id": "G044", "tema": "ban", "tipo": "caso", "q": "Banco Pradera ofrece cuentas corrientes, hipotecas y servicios de ahorro directamente a individuos y empresas, entre ellas una cadena de lavanderías que maneja mucho efectivo. ¿Qué línea de negocio y qué riesgo de la Caja 2 aplican?", "a": "Banca minorista; la Caja 2 menciona la prestación de servicios a negocios de alto flujo de efectivo y el volumen de transacciones", "o": ["Corresponsalía; la Caja 2 menciona las transacciones de alto valor que se generan cuando varios bancos atienden a una misma cadena comercial", "Banca corporativa y de inversión; la Caja 2 menciona la naturaleza global de los mercados en que operan los negocios que manejan efectivo", "Banca minorista; la Caja 2 menciona la prestación de servicios a negocios de alto flujo de efectivo y el volumen de transacciones", "Administración patrimonial; la Caja 2 menciona el secreto bancario asociado a las empresas familiares que operan principalmente con efectivo"], "x": "El párr. 52 define la banca minorista como productos directos a individuos y empresas (cuentas corrientes, préstamos, ahorro) y la Caja 2 le asocia negocios de alto flujo de efectivo, volumen y alto valor de transacciones y diversidad de servicios.", "ref": "Párr. 52 · Caja 2"}, {"id": "G045", "tema": "ban", "tipo": "caso", "q": "Banco Heredia presta servicios bancarios a otro banco ubicado en una jurisdicción que no cumple lo suficiente con las Recomendaciones del GAFI. ¿Qué riesgo ilustrativo de la Caja 2 corresponde a esta actividad?", "a": "La información limitada sobre el remitente y el origen de los fondos, sobre todo con bancos de jurisdicciones que no cumplen lo suficiente con el GAFI", "o": ["La estratificación e integración, junto con la transferencia de activos entre partes a cambio de efectivo u otros activos en mercados de naturaleza global e interconectada", "La cultura de la confidencialidad y el uso de fideicomisos offshore para encubrir a los propietarios reales de las cuentas de alto patrimonio", "La información limitada sobre el remitente y el origen de los fondos, sobre todo con bancos de jurisdicciones que no cumplen lo suficiente con el GAFI", "La prestación de servicios a negocios de alto flujo de efectivo y la diversidad de servicios ofrecidos a individuos y empresas"], "x": "Los servicios que un banco presta a otro banco son servicios de corresponsalía (párr. 52), y la Caja 2 les asocia alto valor, información limitada del remitente y del origen de los fondos, y posible participación de PEP en la propiedad del banco. La estratificación corresponde a banca de inversión.", "ref": "Párr. 52 · Caja 2"}, {"id": "G046", "tema": "ban", "tipo": "trampa", "q": "¿Qué carácter tienen la categorización de actividades bancarias del párr. 52 y la lista de riesgos de la Caja 2?", "a": "La categorización es puramente indicativa y la lista de riesgos es ilustrativa y no exhaustiva", "o": ["La categorización es obligatoria y la lista de riesgos es exhaustiva, por lo que el banco debe replicarlas en su evaluación", "La categorización es indicativa, pero la lista de riesgos es exhaustiva y el supervisor la verifica punto por punto en la visita", "La categorización es obligatoria para bancos sistémicos y la lista es exhaustiva para efectos de la visita del supervisor", "La categorización es puramente indicativa y la lista de riesgos es ilustrativa y no exhaustiva"], "x": "La nota 1 de la Caja 2 dice que la categorización es puramente indicativa y que la lista es ilustrativa y no exhaustiva; el propio párr. 52 usa «entre otros». El distractor que mezcla ambas calificaciones es el más tentador.", "ref": "Párr. 52 · Caja 2 (nota 1)"}, {"id": "G047", "tema": "ban", "tipo": "caso", "q": "Banco Colina es pequeño: sus clientes se sitúan en categorías similares y su gama de productos es muy limitada. ¿Qué dice la guía sobre la complejidad de su evaluación de riesgos?", "a": "Que una evaluación de riesgos simple podría ser más que suficiente, siempre que sea proporcional a la naturaleza y alcance de sus actividades", "o": ["Que puede prescindir de evaluar sus riesgos si el supervisor ya lo clasificó como de bajo riesgo en su matriz sectorial", "Que puede omitir documentarla y comunicarla al personal, porque las evaluaciones simples no requieren formalizarse por escrito", "Que una evaluación de riesgos simple podría ser más que suficiente, siempre que sea proporcional a la naturaleza y alcance de sus actividades", "Que debe replicar la metodología sofisticada de los bancos con múltiples filiales, porque la guía pide el mismo proceso a todos los bancos"], "x": "El párr. 55 dice que la evaluación no tiene por qué ser compleja pero debe ser proporcional; en bancos pequeños o poco complejos una evaluación simple podría bastar. Aun así, el párr. 54 exige documentarla, guardarla y comunicarla siempre.", "ref": "Párrs. 54–55"}, {"id": "G048", "tema": "ban", "tipo": "memoria", "q": "¿Qué debe ocurrir siempre con la evaluación de riesgos del banco, según la Sección III · A?", "a": "Debe documentarse, guardarse y comunicarse debidamente al personal pertinente del banco", "o": ["Debe enviarse a la UIF antes de iniciar operaciones con cada nueva línea de negocio del banco", "Debe publicarse en el sitio del banco para que clientes y contrapartes conozcan su nivel de riesgo", "Debe documentarse, guardarse y comunicarse debidamente al personal pertinente del banco", "Debe elaborarla un auditor externo independiente y certificarla ante el supervisor cada ejercicio"], "x": "El párr. 54 establece que la evaluación forma la base del EBR del banco y siempre debe documentarse, guardarse y comunicarse al personal pertinente. La guía no pide publicarla ni enviarla a la UIF.", "ref": "Párr. 54"}, {"id": "G049", "tema": "ban", "tipo": "memoria", "q": "¿Cuál de los siguientes es uno de los factores que la guía menciona para que el banco identifique y evalúe su riesgo de LA/FT?", "a": "El número de clientes que ya han sido identificados como de alto riesgo", "o": ["El rendimiento de cada sucursal frente a sus metas comerciales del ejercicio", "La calificación crediticia soberana de los países donde el banco invierte su tesorería", "La antigüedad en el cargo de los integrantes del consejo de administración", "El número de clientes que ya han sido identificados como de alto riesgo"], "x": "El párr. 56 incluye, entre otros, la naturaleza y complejidad del negocio, los mercados, el número de clientes de alto riesgo, las jurisdicciones, los canales de distribución, la auditoría interna y resultados de regulación, y el volumen de operaciones. Las jurisdicciones cuentan por corrupción, crimen organizado o controles ALA/CFT, no por su calificación crediticia.", "ref": "Párr. 56"}, {"id": "G050", "tema": "ban", "tipo": "caso", "q": "Banco Vireo terminó su evaluación de riesgos hace un año. Hoy lanza un servicio digital para clientes no residentes y surgen nuevas tipologías sobre ese canal. ¿Qué corresponde según la guía?", "a": "Revisar su evaluación, que debe actualizarse periódicamente y también cuando cambian sus circunstancias o surgen nuevas amenazas relevantes", "o": ["Esperar la actualización de la evaluación nacional de riesgos, ya que el banco debe revisar la suya después de que lo haga el país", "Esperar al siguiente ciclo, porque la guía fija la revisión de la evaluación de riesgos del banco en intervalos anuales predeterminados", "Revisar su evaluación, que debe actualizarse periódicamente y también cuando cambian sus circunstancias o surgen nuevas amenazas relevantes", "Pedir al supervisor que actualice la evaluación, pues al banco le corresponde elaborarla sólo al inicio de sus operaciones"], "x": "El párr. 57 pide complementar la evaluación con fuentes internas y externas y revisarla periódicamente y cuando cambien las circunstancias o surjan nuevas amenazas. La guía no fija un plazo anual ni subordina la revisión a la evaluación nacional.", "ref": "Párr. 57"}, {"id": "G051", "tema": "ban", "tipo": "memoria", "q": "¿Quién debe aprobar la evaluación de riesgos del banco y qué debe reflejar?", "a": "La alta dirección; debe reflejar el nivel de apetito por el riesgo de la institución y establecer el nivel de riesgo que se considera aceptable", "o": ["La alta dirección; debe reflejar el nivel de apetito por el riesgo de la institución y establecer el nivel de riesgo que se considera aceptable", "El oficial de cumplimiento; debe reflejar los riesgos altos del banco, mientras los riesgos bajos se documentan en un anexo operativo aparte", "El supervisor bancario; debe reflejar la calificación que la autoridad asignó al banco dentro de su matriz de riesgos del sector", "La función de auditoría; debe reflejar el riesgo residual que el supervisor está dispuesto a tolerar para ese banco en su calificación"], "x": "El párr. 58 exige aprobación de la alta dirección y que la evaluación refleje el apetito de riesgo y el nivel aceptable; las políticas y controles deben ser acordes con ella. El oficial de cumplimiento monitorea los controles (párr. 84), no aprueba la evaluación.", "ref": "Párr. 58"}, {"id": "G052", "tema": "ban", "tipo": "memoria", "q": "¿Para qué deben diseñarse las etapas iniciales del proceso de debida diligencia del cliente?", "a": "Para evaluar el riesgo de la relación propuesta, determinar el nivel de DDC aplicable y disuadir a quienes buscan fines ilícitos", "o": ["Para evaluar el riesgo de la relación propuesta, determinar el nivel de DDC aplicable y disuadir a quienes buscan fines ilícitos", "Para estimar la rentabilidad esperada del cliente y decidir si amerita un ejecutivo de relación dedicado dentro del área comercial del banco", "Para sustituir el monitoreo continuo, ya que un expediente inicial completo hace innecesario vigilar después la relación", "Para reportar a la UIF a los solicitantes nuevos antes de abrir la cuenta, con independencia de su nivel de riesgo"], "x": "El párr. 59 señala esos tres fines de las etapas iniciales de la DDC. El monitoreo continuo sigue siendo necesario (párr. 66), y el reporte a la UIF procede ante sospecha (párr. 71).", "ref": "Párrs. 59, 66 y 71"}, {"id": "G053", "tema": "ban", "tipo": "caso", "q": "Banco Mirador atiende dos millones de cuentas de nómina de clientes con niveles de ingreso y operaciones similares. ¿Cómo puede elaborar sus perfiles de riesgo según la guía?", "a": "Puede aplicarlos a grupos de clientes que comparten ciertas características, enfoque particularmente relevante para la banca minorista", "o": ["Puede prescindir de perfiles para esos clientes, porque las cuentas de nómina quedan fuera de la DDC por su bajo riesgo", "Debe usar perfiles grupales para la administración patrimonial, donde los patrones de ingreso de los clientes son más homogéneos", "Puede aplicarlos a grupos de clientes que comparten ciertas características, enfoque particularmente relevante para la banca minorista", "Debe elaborar un perfil individual con entrevista presencial para cada cliente, porque la guía no admite perfiles de riesgo por grupos de clientes"], "x": "El párr. 60 permite perfiles a nivel individual o por grupos con características comunes, como ingresos similares o el mismo tipo de operaciones, y lo considera particularmente relevante en banca minorista.", "ref": "Párr. 60"}, {"id": "G054", "tema": "ban", "tipo": "cifra", "q": "¿Qué tres elementos comprende la DDC inicial, según la Sección III · B?", "a": "Identificar al cliente y, en su caso, al propietario real; verificar su identidad con fuentes confiables e independientes; y entender el propósito de la relación", "o": ["Identificar al cliente; reportarlo a la UIF; y clasificarlo en la matriz de riesgos del supervisor antes de abrir la cuenta o celebrar el contrato", "Identificar al cliente y, en su caso, al propietario real; verificar su identidad con fuentes confiables e independientes; y entender el propósito de la relación", "Identificar al cliente en riesgo alto; verificar al propietario real cuando sea PEP; y monitorear sus operaciones mediante umbrales automatizados", "Verificar el historial crediticio del cliente; solicitar referencias bancarias de otras instituciones; y obtener la aprobación de la alta dirección para la apertura"], "x": "El párr. 61 enumera identificación (con propietario real, en su caso), verificación con fuentes confiables e independientes al menos en la medida del marco legal, y comprensión del propósito, con más información en situaciones de mayor riesgo.", "ref": "Párr. 61"}, {"id": "G055", "tema": "ban", "tipo": "caso", "q": "Banco Arenal identificó a una empresa solicitante y a su propietario real. ¿Qué verificación adicional pide la guía para cumplir con las sanciones nacionales e internacionales?", "a": "Verificar los nombres del cliente y de los propietarios reales en las listas del Consejo de Seguridad de la ONU y otras listas de sanciones pertinentes", "o": ["Solicitar a la UIF una constancia de no inclusión en listas antes de abrir la cuenta de cualquier persona moral que tenga propietarios o directivos extranjeros", "Verificar los nombres del cliente y de los propietarios reales en las listas del Consejo de Seguridad de la ONU y otras listas de sanciones pertinentes", "Cotejar a los propietarios reales cuando la empresa opere en jurisdicciones con controles ALA/CFT poco satisfactorios, y omitirlo en los demás casos", "Verificar el nombre de la empresa en listas nacionales, dado que los propietarios reales se cotejan contra listas de sanciones al renovar el contrato"], "x": "El párr. 62 pide verificar los nombres del cliente y de los propietarios reales en las listas del Consejo de Seguridad de la ONU y otras pertinentes. No condiciona el cotejo a la jurisdicción ni lo traslada a la UIF.", "ref": "Párr. 62"}, {"id": "G056", "tema": "ban", "tipo": "caso", "q": "Un cliente de Banco Lirio fue clasificado como de mayor riesgo. ¿Cuál de las siguientes medidas es un ejemplo de debida diligencia reforzada de la Caja 3?", "a": "Comisionar un reporte de inteligencia sobre el cliente o el propietario real para comprender mejor el riesgo de que participen en actividades criminales", "o": ["Comisionar un reporte de inteligencia sobre el cliente o el propietario real para comprender mejor el riesgo de que participen en actividades criminales", "Obtener menos información del cliente, por ejemplo sin domicilio ni ocupación, y posponer la verificación de su identidad hasta un momento posterior de la relación", "Sustituir la verificación del origen de los fondos por una declaración firmada del cliente sobre la licitud de sus recursos y de su patrimonio", "Aplicar umbrales y baja frecuencia de revisión con sistemas automatizados para reducir la carga operativa que genera la relación comercial"], "x": "La Caja 3 incluye en la DDR obtener más información de fuentes robustas, búsquedas adversas en medios, reportes de inteligencia, verificar origen de fondos o riqueza y más información sobre el propósito. Obtener menos información es DDS, y umbrales con baja frecuencia es monitoreo de bajo riesgo (Caja 5).", "ref": "Caja 3 · Caja 5"}, {"id": "G057", "tema": "ban", "tipo": "trampa", "q": "¿Cuál de las siguientes medidas figura en la Caja 3 como ejemplo de debida diligencia simplificada?", "a": "Obtener menos información o una verificación menos robusta, posponiendo la verificación de la identidad del cliente", "o": ["Obtener menos información o una verificación menos robusta, posponiendo la verificación de la identidad del cliente", "Verificar el origen de los fondos o de la riqueza involucrada en la relación de negocios con el cliente", "Realizar búsquedas adversas verificables en medios para informar la evaluación de riesgos del cliente individual y de su propietario real", "Prescindir de identificar al cliente y admitir cuentas anónimas en productos de bajo monto o de inclusión"], "x": "La Caja 3 describe la DDS como obtener menos información y/o una verificación menos robusta, posponiendo la verificación de identidad. Simplificar no es eliminar: la nota 22 recuerda la prohibición de cuentas anónimas como norma general.", "ref": "Caja 3 · Nota 22"}, {"id": "G058", "tema": "ban", "tipo": "caso", "q": "Un prospecto de Banco Olmeda se niega a proporcionar la información necesaria para identificar al propietario real, de modo que el banco no puede aplicar el nivel apropiado de DDC. ¿Qué indica la guía?", "a": "No participar en la relación comercial o, si ya existe, darla por terminada, conforme a la Recomendación 10", "o": ["Abrir la cuenta con debida diligencia simplificada y reforzar el monitoreo durante los primeros meses de operación de la relación", "No participar en la relación comercial o, si ya existe, darla por terminada, conforme a la Recomendación 10", "Abrir la cuenta y reportar a la UIF, dado que el reporte permite continuar la relación aunque la DDC quede incompleta", "Solicitar al supervisor autorización para abrir la cuenta sin la información faltante y documentar la excepción en el expediente"], "x": "El párr. 64 dice que, cuando los bancos no puedan aplicar el nivel apropiado de DDC, la R. 10 les pide no participar en la relación o darla por terminada. Ningún otro mecanismo sustituye esa consecuencia.", "ref": "Párr. 64"}, {"id": "G059", "tema": "ban", "tipo": "trampa", "q": "Como norma general, ¿cómo deben aplicarse las medidas de DDC según la Sección III · B?", "a": "En todos los casos, ajustando su alcance al riesgo de la relación en la medida permitida o requerida por la regulación", "o": ["Cuando el supervisor lo requiera para un tipo particular de producto, conforme al programa anual de supervisión", "En todos los casos, ajustando su alcance al riesgo de la relación en la medida permitida o requerida por la regulación", "Con la misma cantidad y tipo de información en todos los casos, sin distinguir el riesgo asociado a cada relación comercial", "A clientes de riesgo medio y alto, pues para el riesgo bajo la norma general es la exención de las medidas de DDC"], "x": "El párr. 63 fija la norma general: DDC en todos los casos, aumentando información y verificación con mayor riesgo y pudiendo simplificar con menor riesgo. La exención es excepcional y la decide el país (nota 22).", "ref": "Párr. 63 · Nota 22"}, {"id": "G060", "tema": "ban", "tipo": "caso", "q": "Un cliente de Banco Fénix declaró ser jubilado con ingresos modestos; en los últimos meses recibe transferencias frecuentes de varios terceros y retira efectivo de inmediato. ¿Qué implica el monitoreo permanente según la guía?", "a": "Escrutar si las operaciones son consistentes con lo que se sabe del cliente e identificar el cambio de perfil, que puede requerir DDC nueva o adicional", "o": ["Cancelar la cuenta de inmediato, porque cualquier variación del perfil transaccional obliga al banco a terminar la relación comercial", "Registrar el cambio en la siguiente actualización periódica del expediente, ya que los cambios de perfil se documentan en la revisión anual", "Esperar a que las operaciones rebasen un umbral de reporte, porque el monitoreo permanente consiste en comparar montos contra límites predeterminados por el banco", "Escrutar si las operaciones son consistentes con lo que se sabe del cliente e identificar el cambio de perfil, que puede requerir DDC nueva o adicional"], "x": "El párr. 66 define el monitoreo como el escrutinio de operaciones frente al conocimiento del cliente, e incluye identificar cambios de perfil (comportamiento, uso de productos, montos) y mantener un registro actualizado, lo que puede requerir medidas de DDC nuevas o adicionales.", "ref": "Párr. 66"}, {"id": "G061", "tema": "ban", "tipo": "caso", "q": "Banco Tobías, con pocas operaciones diarias, monitorea a sus clientes de forma manual. Un consultor le dice que la guía exige sistemas electrónicos de monitoreo. ¿Qué dice el texto?", "a": "Que no requiere sistemas electrónicos, aunque con grandes volúmenes regulares de operaciones los automatizados podrían ser el único método realista", "o": ["Que la guía exige sistemas electrónicos a los bancos con servicios de corresponsalía y deja en libertad al resto de las líneas de negocio", "Que no requiere sistemas electrónicos, aunque con grandes volúmenes regulares de operaciones los automatizados podrían ser el único método realista", "Que la guía admite el monitoreo manual en riesgo bajo, pero en situaciones de mayor riesgo exige que el monitoreo se realice con sistemas automatizados", "Que la guía exige sistemas automatizados a todos los bancos y admite el monitoreo manual de forma transitoria mientras se concluye su implementación"], "x": "El párr. 67 dice que el monitoreo no requiere sistemas electrónicos y que con grandes volúmenes los automatizados «podrían» ser el único método realista. La Caja 5 incluso lista el monitoreo de operaciones manuales entre los ejemplos para situaciones de alto riesgo.", "ref": "Párr. 67 · Caja 5"}, {"id": "G062", "tema": "ban", "tipo": "caso", "q": "Banco Umbría usa desde hace años un sistema automatizado de monitoreo cuyas reglas nadie ha revisado. ¿Qué exige la guía cuando se utilizan sistemas automatizados?", "a": "Que el banco conozca las reglas que los rigen, verifique su fiabilidad con regularidad y compruebe que abordan los riesgos de LA/FT identificados", "o": ["Que el banco encargue su revisión al proveedor tecnológico, quien responde ante el supervisor por la eficacia de las reglas configuradas", "Que el banco conozca las reglas que los rigen, verifique su fiabilidad con regularidad y compruebe que abordan los riesgos de LA/FT identificados", "Que el banco lo mantenga sin cambios, dado que un sistema automatizado ya validado garantiza la detección de las operaciones potencialmente sospechosas", "Que el banco lo sustituya por monitoreo manual, porque la guía asocia los sistemas automatizados a situaciones de bajo riesgo"], "x": "El párr. 67 exige que, cuando se usen sistemas automatizados, los bancos conozcan sus reglas, verifiquen su fiabilidad con regularidad y comprueben que atienden los riesgos identificados. La Caja 5 menciona sistemas automatizados en bajo riesgo como ejemplo, no como restricción.", "ref": "Párr. 67 · Caja 5"}, {"id": "G063", "tema": "ban", "tipo": "memoria", "q": "¿Cuál de los siguientes conjuntos corresponde a los ejemplos de monitoreo en situaciones de alto riesgo de la Caja 5?", "a": "Monitoreo de operaciones diarias, análisis frecuente de información, considerar el destino de los fondos y reportar resultados a la alta dirección", "o": ["Umbrales de monitoreo, baja frecuencia de revisión y sistemas automatizados aplicados de forma estándar a todas las cuentas del segmento", "Revisión de las operaciones al actualizar el expediente del cliente, sin considerar el destino de los fondos ni las tipologías vigentes", "Muestreo anual de operaciones por la función de auditoría, con banderas rojas definidas por el área comercial según sus metas", "Monitoreo de operaciones diarias, análisis frecuente de información, considerar el destino de los fondos y reportar resultados a la alta dirección"], "x": "La Caja 5 lista para alto riesgo operaciones diarias, operaciones manuales, análisis frecuente, destino de fondos, banderas rojas basadas en tipologías y reporte a la alta dirección; para bajo riesgo, umbrales, baja frecuencia y sistemas automatizados.", "ref": "Caja 5"}, {"id": "G064", "tema": "ban", "tipo": "caso", "q": "El supervisor pide a Banco Nácar explicar por qué monitorea con menor frecuencia a un segmento de clientes, pero el banco no tiene criterios escritos de segmentación. ¿Qué exige la guía?", "a": "Documentar y establecer claramente los criterios de segmentación y de asignación de riesgo, con criterios transparentes de frecuencia e intensidad", "o": ["Documentar los criterios del segmento de mayor riesgo, dado que en los segmentos de menor riesgo la guía acepta criterios no escritos", "Documentar y establecer claramente los criterios de segmentación y de asignación de riesgo, con criterios transparentes de frecuencia e intensidad", "Eliminar la segmentación y aplicar el mismo monitoreo a todos los clientes, porque segmentar resulta incompatible con un enfoque basado en riesgo proporcional", "Nada en particular, porque la segmentación de clientes es una decisión comercial reservada que el banco no tiene que explicar al supervisor"], "x": "El párr. 69 pide documentar y establecer claramente los criterios de segmentación y asignación de riesgo, y que los de frecuencia e intensidad sean transparentes. El párr. 68 permite reducir el monitoreo con menor riesgo, pero con criterios revisables.", "ref": "Párrs. 68–69"}, {"id": "G065", "tema": "ban", "tipo": "trampa", "q": "Banco Cuarzo propone que, en clientes de bajo riesgo, aun cuando ya surgió la sospecha, el reporte a la UIF se envíe hasta el cierre del ciclo mensual de análisis. ¿Es válido según la guía?", "a": "No: las alertas pueden calibrarse según el tipo de riesgo, pero una vez surgida la sospecha el banco deberá informar a la UIF de inmediato", "o": ["No: en clientes de bajo riesgo la guía indica que, en lugar de reportar, el banco termine la relación comercial antes de que concluya el ciclo", "Sí: con clientes de bajo riesgo el EBR permite diferir el reporte a la UIF hasta completar el ciclo mensual de análisis, siempre que quede documentado", "No: las alertas pueden calibrarse según el tipo de riesgo, pero una vez surgida la sospecha el banco deberá informar a la UIF de inmediato", "Sí, siempre que la alta dirección lo apruebe en la evaluación de riesgos del banco y lo comunique al supervisor antes de aplicarlo en la operación"], "x": "Los párrs. 71–72 permiten calibrar por riesgo las políticas que dan lugar a alertas, pero el reporte procede de inmediato una vez que surge la sospecha. La terminación de la relación es la consecuencia de no poder aplicar la DDC (párr. 64), no un sustituto del reporte.", "ref": "Párrs. 64 y 71–72"}, {"id": "G066", "tema": "ban", "tipo": "memoria", "q": "Además de reportar sospechas a la UIF, ¿qué deben tener los bancos para tratar los movimientos inusuales, según el apartado de Informes?", "a": "Sistemas adecuados de gestión de casos para analizar a tiempo los fondos u operaciones señalados y determinar si son sospechosos", "o": ["Sistemas de reporte masivo a la UIF de las operaciones inusuales, sin análisis interno, para no retrasar la información", "Sistemas adecuados de gestión de casos para analizar a tiempo los fondos u operaciones señalados y determinar si son sospechosos", "Sistemas de bloqueo automático de toda operación inusual, sin análisis previo, hasta que la UIF autorice liberar los fondos retenidos al cliente", "Archivos de operaciones inusuales que se revisan cuando el supervisor los solicita durante sus visitas in situ"], "x": "El párr. 71 permite señalar movimientos inusuales para su análisis posterior y pide sistemas adecuados de gestión de casos para analizarlos a tiempo y determinar si son sospechosos.", "ref": "Párr. 71"}, {"id": "G067", "tema": "ban", "tipo": "trampa", "q": "Sobre la función de auditoría independiente que prueba el programa ALA/CFT del banco, ¿qué afirmación NO es correcta según la guía?", "a": "Que debe concentrar su examen exclusivamente en las determinaciones de riesgo alto del banco", "o": ["Que requiere examinar lo adecuado de todas las determinaciones de riesgo del banco", "Que sus hallazgos deben informar a la alta dirección sobre el diseño e implementación del marco", "Que abarca operaciones, departamentos, sucursales y subsidiarias, y en su caso las del extranjero", "Que debe concentrar su examen exclusivamente en las determinaciones de riesgo alto del banco"], "x": "El párr. 86 dice que la auditoría requiere examinar lo adecuado de todas las determinaciones de riesgos y por lo tanto no debe enfocarse exclusivamente en riesgos altos. Las otras tres afirmaciones reproducen el mismo párrafo.", "ref": "Párr. 86"}, {"id": "G068", "tema": "ban", "tipo": "caso", "q": "En Banco Zafiro se discute quién decide las medidas para mitigar los riesgos de LA/FT identificados y el grado de riesgo residual que el banco está dispuesto a aceptar. ¿A quién lo atribuye la guía?", "a": "A la alta dirección, como una de las maneras de apoyar el ALA/CFT, junto con dotar de recursos a la Unidad ALA/CFT y promover el cumplimiento como valor central", "o": ["Al oficial de cumplimiento, que decide el riesgo residual aceptable y lo comunica a la alta dirección en su informe periódico sobre la efectividad de los controles", "A la alta dirección, como una de las maneras de apoyar el ALA/CFT, junto con dotar de recursos a la Unidad ALA/CFT y promover el cumplimiento como valor central", "A la función de auditoría interna, por ser el área con independencia suficiente para fijar el apetito de riesgo del banco", "Al supervisor bancario, que fija para cada banco el riesgo residual máximo al otorgar la autorización para operar"], "x": "El párr. 76 atribuye a la alta dirección decidir las medidas de mitigación y el riesgo residual aceptable, conformar los recursos de la Unidad ALA/CFT y promover el cumplimiento como valor central. La guía no atribuye esa decisión al oficial de cumplimiento ni a la auditoría, cuyas funciones son monitorear y revisar los controles (párrs. 84–86).", "ref": "Párr. 76"}, {"id": "G069", "tema": "ban", "tipo": "caso", "q": "En Banco Alcor, el departamento de TI y las áreas comerciales no reciben información sobre los riesgos de LA/FT que enfrenta el banco. ¿Qué mecanismos pide la guía a la alta dirección?", "a": "Comunicación interna que interrelacione al Consejo, al oficial de cumplimiento, a los comités relacionados, a TI y a cada área comercial", "o": ["Comunicación entre el Consejo y la auditoría externa, dejando a las áreas operativas y tecnológicas fuera del circuito de información de riesgos", "Comunicación que reserve la información de riesgos al oficial de cumplimiento, para proteger la confidencialidad de los reportes a la UIF", "Comunicación con el supervisor, al que corresponde transmitir a las áreas comerciales los riesgos de LA/FT que detecta en el banco", "Comunicación interna que interrelacione al Consejo, al oficial de cumplimiento, a los comités relacionados, a TI y a cada área comercial"], "x": "El párr. 76 pide mecanismos de comunicación interna sobre riesgos reales o probables que interrelacionen al Consejo, al oficial de cumplimiento, a comités como el de Riesgos o el de Ética y Cumplimiento, al departamento de TI y a cada área comercial.", "ref": "Párr. 76"}, {"id": "G070", "tema": "ban", "tipo": "memoria", "q": "Para comprender cómo opera el marco de control ALA/CFT, ¿qué debe recibir la alta dirección según la Sección III · C?", "a": "Información suficiente, regular y objetiva sobre el riesgo de LA/FT, e información suficiente y objetiva sobre la efectividad de los controles, por ejemplo de cumplimiento o de auditoría", "o": ["Los informes del supervisor posteriores a cada visita in situ, que remplazan a los reportes internos de cumplimiento y de auditoría", "Un resumen anual de los reportes enviados a la UIF, dado que la gestión cotidiana del riesgo de LA/FT corresponde al área operativa y no a la alta dirección", "Información de los clientes clasificados como de alto riesgo, porque los riesgos bajos y medios no requieren la atención de la alta dirección", "Información suficiente, regular y objetiva sobre el riesgo de LA/FT, e información suficiente y objetiva sobre la efectividad de los controles, por ejemplo de cumplimiento o de auditoría"], "x": "El segundo párrafo numerado 76 en la versión en español pide que la alta dirección conozca los riesgos y comprenda cómo opera el control, recibiendo información suficiente, regular y objetiva sobre el riesgo y la efectividad de los controles, y que existan procesos para escalar decisiones importantes.", "ref": "Párr. 76 (segundo)"}, {"id": "G071", "tema": "ban", "tipo": "caso", "q": "Banco Robledo investiga antecedentes sólo de sus directivos, aunque sus cajeros manejan diariamente efectivo de clientes de alto riesgo. ¿Qué dice la guía sobre la investigación del personal?", "a": "Que su nivel debe reflejar los riesgos de LA/FT a los que está expuesto cada empleado y no enfocarse únicamente en los roles de alta dirección", "o": ["Que es correcto, porque la guía circunscribe la investigación de antecedentes a la alta dirección y al oficial de cumplimiento, por su nivel de decisión en el banco", "Que su nivel debe reflejar los riesgos de LA/FT a los que está expuesto cada empleado y no enfocarse únicamente en los roles de alta dirección", "Que la investigación del personal corresponde al supervisor, de modo que el banco no interviene en los antecedentes de sus empleados", "Que debe aplicar la investigación más exhaustiva por igual a todo el personal, sin distinguir su exposición al riesgo de LA/FT"], "x": "El párr. 81 pide que el nivel de investigación refleje los riesgos a los que está expuesto cada empleado y no se enfoque únicamente en la alta dirección; también pide manejar conflictos de interés. Proporcional no es uniforme.", "ref": "Párrs. 80–81"}, {"id": "G072", "tema": "ban", "tipo": "caso", "q": "En Banco Pinar, el oficial de cumplimiento no tiene acceso a la información de las subsidiarias ni a varias líneas de negocio, y carece de recursos propios. ¿Qué exige la guía?", "a": "Que tenga la independencia, autoridad, nivel, recursos y experiencia necesarios, incluida la habilidad de acceder a toda la información interna", "o": ["Que tenga la independencia, autoridad, nivel, recursos y experiencia necesarios, incluida la habilidad de acceder a toda la información interna", "Que acceda a los expedientes de clientes de alto riesgo, pues el resto de la información corresponde a la gestión de cada línea de negocio", "Nada adicional, porque basta con que la función de auditoría tenga ese acceso, ya que el papel del oficial es asesorar al personal", "Que se limite a la información de la matriz, porque las subsidiarias rinden cuentas a su supervisor local y no al oficial de cumplimiento del grupo"], "x": "El párr. 85 (NI 18) pide un oficial de cumplimiento a nivel gerencial con independencia, autoridad, nivel, recursos y experiencia, incluida la habilidad de acceder a toda la información interna, a través de líneas de negocio, sucursales y subsidiarias.", "ref": "Párr. 85"}, {"id": "G073", "tema": "ban", "tipo": "caso", "q": "Banco Lindero imparte un único curso ALA/CFT al contratar a cada empleado, igual para todas las áreas; no aplica pruebas ni da seguimiento a si el personal cumple los controles, aunque envía boletines trimestrales de actualización. ¿Qué rasgos de la capacitación del párr. 82 incumple?", "a": "Los de ser continua, a la medida de las líneas de negocio y efectiva, con un efecto que puede verificarse, por ejemplo, mediante pruebas", "o": ["Los de ser continua, a la medida de las líneas de negocio y efectiva, con un efecto que puede verificarse, por ejemplo, mediante pruebas", "El de haber sido impartida por el supervisor, al que la guía atribuye la capacitación ALA/CFT del personal bancario", "Ninguno, porque la guía pide que la capacitación sea obligatoria para todo el personal relevante al momento de su contratación", "Ninguno, porque la guía desaconseja capacitar de forma diferenciada por línea de negocio para no generar criterios dispares entre las áreas del banco"], "x": "El párr. 82 pide capacitación de alta calidad, obligatoria, a la medida, efectiva, continua (no un ejercicio de una sola vez en la contratación, NI 18) y complementada con actualizaciones. Ser obligatoria es sólo uno de esos rasgos.", "ref": "Párr. 82"}, {"id": "G074", "tema": "ban", "tipo": "caso", "q": "Banco Garza discute cómo repartir la vigilancia de sus controles ALA/CFT entre el oficial de cumplimiento y la auditoría. ¿Qué reparto marca la guía?", "a": "El oficial de cumplimiento monitorea los controles de forma continua y una función de auditoría independiente revisa y prueba el programa", "o": ["El oficial de cumplimiento monitorea y además audita el programa, porque la R. 18 permite concentrar ambas funciones en una misma persona", "La función de auditoría monitorea los controles de forma continua y el oficial de cumplimiento los prueba de manera independiente cada año", "El oficial de cumplimiento monitorea los controles de forma continua y una función de auditoría independiente revisa y prueba el programa", "La alta dirección monitorea los controles de forma continua y el supervisor bancario actúa como la función de auditoría independiente del banco"], "x": "El párr. 84 asigna el monitoreo continuo al oficial de cumplimiento y la revisión a una función de auditoría; el párr. 86 (R. 18) pide que esa auditoría sea independiente. Invertir los papeles es el distractor más tentador.", "ref": "Párrs. 84 y 86"}, {"id": "G075", "tema": "anx", "tipo": "trampa", "q": "¿Qué valor atribuye la propia guía a las prácticas de supervisión de países que presenta el Anexo 1?", "a": "Se presentan únicamente como ejemplos y su inclusión no debe considerarse un respaldo del GAFI", "o": ["Se presentan únicamente como ejemplos y su inclusión no debe considerarse un respaldo del GAFI", "Son buenas prácticas respaldadas por el GAFI, aunque cada país decide voluntariamente si las adopta", "Son estándares mínimos que el GAFI verificó en la Cuarta Ronda y que los demás países deben replicar", "Son prácticas obligatorias para los países que codirigieron el grupo de proyecto que elaboró la guía"], "x": "La introducción del Anexo 1 dice que las prácticas son únicamente ejemplos, que al publicarse no habían sido evaluadas en la Cuarta Ronda y que no deben considerarse un respaldo del GAFI. Que México codirigiera el grupo (párr. 2) no vuelve obligatorio su ejemplo.", "ref": "Anexo 1 · Introducción"}, {"id": "G076", "tema": "anx", "tipo": "caso", "q": "En una clase se explica cómo decide la CNBV, según el Anexo 1, qué instituciones financieras visitar durante el año. ¿Qué descripción es fiel al texto?", "a": "Con base en los riesgos inherentes identificados, determina qué instituciones representan un riesgo mayor y decide cuáles visitar en el año (programa anual)", "o": ["Programa visitas anuales a la totalidad de las instituciones en orden de registro y utiliza la calificación de riesgo para definir la duración de cada visita", "Programa visitas a las instituciones que la UIF le señala en su retroalimentación anual, y la calificación de riesgo se asigna al concluir cada inspección", "Selecciona a las instituciones mediante un sorteo aleatorio y después aplica un diagnóstico para confirmar si coincidieron con las de mayor riesgo inherente", "Con base en los riesgos inherentes identificados, determina qué instituciones representan un riesgo mayor y decide cuáles visitar en el año (programa anual)"], "x": "El Anexo 1 · México describe que la CNBV, con base en los riesgos inherentes identificados con información de las instituciones y otras fuentes, determina cuáles representan mayor riesgo para decidir las visitas del año (programa anual); luego realiza un diagnóstico de cada entidad a visitar.", "ref": "Anexo 1 · México"}, {"id": "G077", "tema": "anx", "tipo": "memoria", "q": "Según el Anexo 1, ¿qué toma en cuenta la CNBV para establecer su estrategia de monitoreo efectivo?", "a": "Los productos o servicios que ofrecen las entidades, sus tipos de usuarios o clientes, sus flujos de fondos y el área geográfica de su operación, entre otros", "o": ["Los productos o servicios que ofrecen las entidades, sus tipos de usuarios o clientes, sus flujos de fondos y el área geográfica de su operación, entre otros", "El capital contable, el índice de morosidad, la rentabilidad y el nivel de reservas preventivas de cada entidad, como únicos factores de la estrategia", "El número de empleados, la antigüedad de la institución, su calificación crediticia y su cotización bursátil, entre otros indicadores de mercado", "La ubicación, el enfoque del negocio y la estructura del producto, del cliente y de distribución, con mayor ponderación a la estructura del cliente"], "x": "El Anexo 1 · México menciona productos o servicios, tipos de usuarios o clientes, flujos de fondos y área geográfica, «entre otros». Los cinco criterios con mayor peso a la estructura del cliente corresponden a BaFin (Alemania).", "ref": "Anexo 1 · México y Alemania"}, {"id": "G078", "tema": "anx", "tipo": "caso", "q": "Antes de visitar a Banco Estribo, la CNBV analiza sus actividades más significativas (productos con riesgos inherentes) y la acción de mitigación que el banco ha aplicado. ¿Qué fase describe el Anexo 1?", "a": "El diagnóstico de la entidad que será visitada, que permite acotar las actividades de mayor riesgo y la efectividad de sus mitigantes específicos", "o": ["La calificación de riesgo posterior a la visita, que se asigna para determinar la periodicidad de las siguientes inspecciones ALA/CFT de la entidad", "El diagnóstico de la entidad que será visitada, que permite acotar las actividades de mayor riesgo y la efectividad de sus mitigantes específicos", "El acto de autoridad preliminar, en el que se emiten observaciones y recomendaciones antes de iniciar formalmente la inspección in situ", "La revisión temática sectorial, en la que se compara a la entidad con una selección de instituciones para identificar prácticas atípicas"], "x": "El Anexo 1 · México describe un diagnóstico de cada entidad a visitar, en sus actividades más significativas y sus mitigantes; en otro pasaje dice que el diagnóstico acota actividades de mayor riesgo y la efectividad de mitigantes específicos. Las revisiones temáticas para detectar prácticas atípicas son del ejemplo de Holanda.", "ref": "Anexo 1 · México y Holanda"}, {"id": "G079", "tema": "anx", "tipo": "caso", "q": "Tras la inspección a Banco Céfiro, la CNBV encontró mitigantes más débiles de lo previsto en su calificación. Según el Anexo 1, ¿qué ocurre con esos resultados?", "a": "Se toman en cuenta para confirmar el nivel de riesgo o asignar uno nuevo, se agregan a la matriz extra situ y ayudan a programar el siguiente monitoreo", "o": ["Se archivan en el expediente de la visita y la calificación previa se mantiene hasta el siguiente programa anual, sin retroalimentar la matriz extra situ", "Se utilizan para imponer sanciones, mientras la calificación de riesgo se determina de nuevo con la información periódica que reporta la entidad", "Se remiten al GAFI para que la entidad se reclasifique dentro del informe de evaluación mutua del país en la siguiente ronda de evaluaciones", "Se toman en cuenta para confirmar el nivel de riesgo o asignar uno nuevo, se agregan a la matriz extra situ y ayudan a programar el siguiente monitoreo"], "x": "El Anexo 1 · México dice que los resultados de la inspección confirman el nivel de riesgo o asignan uno nuevo, y que esa información se agrega a la matriz de supervisión extra situ para programar el siguiente monitoreo (estrategia de supervisión). Los dos carriles se retroalimentan.", "ref": "Anexo 1 · México"}, {"id": "G080", "tema": "anx", "tipo": "memoria", "q": "Según el Anexo 1, ¿qué actos de autoridad pueden derivar de los resultados de las inspecciones ALA/CFT de la CNBV?", "a": "La emisión de observaciones y recomendaciones, así como la implementación de acciones correctivas y/o sanciones", "o": ["Cartas de retroalimentación no vinculantes, que se comentan con la industria en los foros anuales de capacitación", "La revocación de la autorización para operar, como consecuencia prevista para toda deficiencia detectada en la visita", "La emisión de observaciones y recomendaciones, así como la implementación de acciones correctivas y/o sanciones", "La designación directa, por la autoridad, del oficial de cumplimiento y del auditor independiente de la institución"], "x": "El Anexo 1 · México dice que, de acuerdo con los resultados, pueden llevarse a cabo varios actos de autoridad, incluidas observaciones y recomendaciones, acciones correctivas y/o sanciones. Los foros anuales con mejores prácticas son del ejemplo de Hong Kong.", "ref": "Anexo 1 · México"}, {"id": "G081", "tema": "anx", "tipo": "caso", "q": "Durante la inspección a Banco Nogal, con base en el reporte de operaciones, el supervisor detecta una deficiencia en el sistema automatizado del banco, aspecto que no estaba cubierto en el programa de supervisión. ¿Qué describe el Anexo 1?", "a": "Que el supervisor tiene la facultad de conducir una revisión más profunda y debe verificar el sistema para detectar la causa real de la deficiencia", "o": ["Que el supervisor debe ceñirse al programa de supervisión original y registrar la deficiencia para incluirla en el programa del año siguiente", "Que el supervisor debe pedir al banco una autoevaluación del sistema y abstenerse de verificarlo, para respetar su discrecionalidad", "Que el supervisor tiene la facultad de conducir una revisión más profunda y debe verificar el sistema para detectar la causa real de la deficiencia", "Que el supervisor debe suspender la visita y pedir a la UIF que determine si la deficiencia amerita ampliar el alcance de la revisión"], "x": "En el apartado de intensidad, el Anexo 1 · México dice que, si hay evidencia de debilidad en un mitigante no cubierto originalmente, el supervisor tiene la facultad de una revisión más profunda, y pone el ejemplo del sistema automatizado cuya causa real debe verificarse.", "ref": "Anexo 1 · México"}, {"id": "G082", "tema": "anx", "tipo": "caso", "q": "Banco Ribera lanzó una nueva línea de negocio y, en el mismo periodo, sus reportes de operaciones sospechosas y relevantes aumentaron. ¿Qué papel tienen esos hechos en el ejemplo de México del Anexo 1?", "a": "Son factores que, entre otros y junto con la calificación de riesgo, se toman en cuenta para determinar la frecuencia de la supervisión ALA/CFT", "o": ["Son factores que la CNBV considera para imponer sanciones, pero que el Anexo 1 no vincula con la frecuencia de la supervisión ALA/CFT", "Son factores que obligan a la CNBV a visitar a la institución cada mes durante un año, con independencia de su calificación de riesgo y de su historial", "Son factores sin efecto en la frecuencia, porque el Anexo 1 la hace depender del tamaño de los activos de la institución financiera", "Son factores que, entre otros y junto con la calificación de riesgo, se toman en cuenta para determinar la frecuencia de la supervisión ALA/CFT"], "x": "El Anexo 1 · México lista, entre otros, incrementos inusuales de operaciones, incrementos en STR o CTR, cambio del perfil de negocio, nuevos productos o líneas de negocio y nivel de cumplimiento regulatorio; la frecuencia también se sujeta a medidas de seguimiento correctivas.", "ref": "Anexo 1 · México"}, {"id": "G083", "tema": "anx", "tipo": "trampa", "q": "¿Qué documento aplica la CNBV, según el Anexo 1, que describe en detalle los procedimientos para evaluar las actividades significativas de mayor riesgo y la efectividad de los mitigantes?", "a": "El Manual Institucional de Supervisión", "o": ["La Guía de Cumplimiento que consolida el material de guía para entidades reportadoras", "El Manual de Examinación de Prevención de Lavado de Dinero/Ley de Secreto Bancario", "El Marco para el Impacto de la Evaluación de Riesgos de Instituciones Financieras", "El Manual Institucional de Supervisión"], "x": "El Anexo 1 · México menciona el Manual Institucional de Supervisión. Los distractores son documentos de otros países del mismo anexo: el manual FFIEC de Estados Unidos, el marco de la MAS de Singapur y la Guía de Cumplimiento de AUSTRAC de Australia.", "ref": "Anexo 1 · México"}, {"id": "G084", "tema": "anx", "tipo": "cifra", "q": "En el Anexo 1, ¿cómo está integrada la matriz que BaFin (Alemania) usa para determinar la intensidad de la supervisión ALA/CFT?", "a": "12 celdas: 3 niveles de amenaza potencial de LA/FT por 4 niveles de calidad de la prevención ALA/CFT (A a D)", "o": ["16 celdas: 4 categorías de impacto sistémico por 4 categorías de riesgo, con mayor ponderación del impacto", "12 celdas: 4 niveles de amenaza potencial de LA/FT por 3 niveles de calidad de la prevención ALA/CFT (1 a 3)", "12 celdas: 3 niveles de amenaza potencial de LA/FT por 4 niveles de calidad de la prevención ALA/CFT (A a D)", "9 celdas: 3 niveles de riesgo inherente por 3 niveles de calidad de los controles internos (alta, media y baja)"], "x": "La matriz de BaFin cruza amenaza potencial en 3 niveles (1 a 3) con calidad de la prevención en 4 niveles (A a D), para 12 celdas. Las categorías con mayor peso del impacto evocan el modelo de Singapur, y la opción de 4 niveles de amenaza por 3 de calidad invierte las dimensiones.", "ref": "Anexo 1 · Alemania"}, {"id": "G085", "tema": "anx", "tipo": "caso", "q": "AUSTRAC evalúa a un grupo de entidades reportadoras con riesgo alto de LA/FT que, sin embargo, muestra un enfoque fuerte en sus obligaciones regulatorias. ¿Qué dice el ejemplo de Australia del Anexo 1?", "a": "Que la entidad puede tener riesgo alto de LA/FT y, a la vez, una calificación baja de riesgo de cumplimiento, porque son medidas diferentes", "o": ["Que su riesgo de LA/FT pasa a bajo, porque un enfoque fuerte en las obligaciones regulatorias neutraliza el riesgo inherente de la entidad", "Que su riesgo de cumplimiento será alto, porque AUSTRAC lo obtiene directamente de trasladar el riesgo inherente de LA/FT de la entidad", "Que la entidad puede tener riesgo alto de LA/FT y, a la vez, una calificación baja de riesgo de cumplimiento, porque son medidas diferentes", "Que queda fuera de la supervisión de AUSTRAC, que concentra sus actividades en entidades con riesgo alto de LA/FT y de cumplimiento"], "x": "El ejemplo australiano define el riesgo de cumplimiento como el riesgo de no cumplir las obligaciones regulatorias, medida diferente al riesgo de LA/FT, y pone ese mismo caso: riesgo alto de LA/FT con riesgo de cumplimiento bajo.", "ref": "Anexo 1 · Australia"}, {"id": "G086", "tema": "anx", "tipo": "caso", "q": "En Galdria, un inversionista propone adquirir un paquete accionario que le daría el control de un banco existente. ¿Qué Principio Básico de Basilea del Anexo 2 da al supervisor el poder de revisar, rechazar o condicionar esa operación?", "a": "Principio 6, transferencia de propiedad signifi <script>

    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+

/* ---------- secciones ---------- */

    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}
document.fonts && document.fonts.ready.then(redraw); redraw();

}
