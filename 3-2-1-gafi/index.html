<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mapa interactivo del régimen de prevención y de las autoridades nacionales en PLD/FT (temario CNBV 1.3), con fichas de la UIF y la CNBV y simulador de 80 reactivos.">
<title>Mapa de las autoridades nacionales PLD/FT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}
.qactions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accion);color:var(--accion-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600;font-size:17px;margin-top:4px}
.score .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.trows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.trow2{display:grid;grid-template-columns:minmax(0,300px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.trow2 .tb{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow2 .tb i{display:block;height:100%;background:var(--principal-linea)}
.trow2 .tv{font-variant-numeric:tabular-nums;font-weight:700}
.miss{margin-top:16px;background:var(--surface-2);border-radius:12px;padding:12px 16px}
.miss summary{cursor:pointer}
.miss ul{margin:6px 0 0;padding-left:18px} .miss li{margin:8px 0}
.siminfo{font-size:13px;color:var(--muted);margin:12px 0 0}
/* repaso (tandas al azar o secuencia fija) */
.para{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--accion);border-radius:12px;padding:12px 16px;margin:-4px 0 18px;font-size:17px;font-weight:600;max-width:1040px}.para b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accion);margin-bottom:2px}
.tu{margin:10px 0;background:var(--surface);border:2px solid var(--negro);border-left:8px solid var(--coral);border-radius:10px;padding:10px 14px;font-size:16px}.tu b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.dist{margin-top:12px;font-weight:500;font-size:15px}.dist ul{margin:4px 0 0;padding-left:0;list-style:none}.dist li{margin:5px 0;padding-left:26px;text-indent:-26px}.dist li b{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;text-indent:0;margin-right:6px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-display);font-size:12px;background:var(--surface)}
.rp-fallas{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.rp-fallas h3{font-size:18px}
.rp-fallas p{font-size:14.5px}
.rp-box{scroll-margin-top:90px}
.rp-box .qtext{font-size:clamp(22px,2.8vw,34px)}
.rp-box .opt{font-size:17px}
.rp-clave{margin-top:12px;border-left:6px solid var(--principal-linea);background:var(--surface-2);border-radius:8px;padding:10px 14px;font-weight:600}
.rp-clave .lbl{margin-bottom:4px}
.rp-fin{margin:10px 0 0;padding-left:22px;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,26px);line-height:1.35}
.rp-fin li{margin:10px 0}
.rp-fin small{display:block;font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--muted)}
.rp-box:fullscreen{max-width:none;border-radius:0;border:0;padding:40px 6vw;overflow:auto;background:var(--bg)}
.rp-box:fullscreen .qtext{font-size:clamp(26px,3vw,42px)}
.rp-box:fullscreen .opt{font-size:20px}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(27,27,30,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{padding:20px 22px 18px;background:var(--c);color:var(--ci);display:flex;justify-content:space-between;gap:12px;align-items:center}
.dhead h3{font-size:28px;font-weight:700;color:inherit}
.dhead .x{background:rgba(255,255,255,.25);border:0;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:inherit;flex:none}
.dbody{padding:16px 22px 30px;overflow:auto}
.dbody ul{padding-left:18px;margin:0}
.dbody li{margin:8px 0}
.dbody .hook{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 12px}

footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:4px solid var(--membrete);padding-top:14px}
footer b{color:var(--ink)}

@media (max-width:1100px){.track{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:18px}.track::before{display:none}}

  .hero{grid-template-columns:1fr}

  .stepd{grid-template-columns:1fr}

  .frac .inc{padding-left:16px}
}
@media (max-width:600px){ .chant p span{white-space:normal} .trow2{grid-template-columns:1fr auto}.trow2 .tb{grid-column:1/-1;order:3} }
@media (max-width:520px){ .rhythm{flex-wrap:wrap} .rh{flex:1 1 40%} }
.printhead{display:none}
/* franja del sitio (modo sitio: sólo si datos.sitio existe) */
.sitebar{display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:8px 16px;background:var(--negro);color:#fff;overflow-x:auto;scrollbar-width:none;font-family:var(--f-display);font-size:13px}
.sitebar::-webkit-scrollbar{display:none}
.sitebar .sb-mod{font-weight:700;letter-spacing:.04em;white-space:nowrap;margin-right:4px;color:#fff;text-decoration:none}

.sitebar .sb-p{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;text-decoration:none;font-weight:700;white-space:nowrap;flex:none}
.sitebar a.sb-p:hover{border-color:#fff}
.sitebar .sb-p[aria-current="page"]{background:var(--principal);border-color:var(--principal);color:var(--principal-ink)}
.sitebar .sb-p.off{opacity:.45;border-style:dashed;cursor:not-allowed}
.sitebar .sb-sep{width:1px;height:20px;background:rgba(255,255,255,.3);flex:none}
.sitebar .sb-cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.sitebar .sb-ses{white-space:nowrap;color:rgba(255,255,255,.8);margin-left:auto;padding-left:12px;font-weight:600}
@media (max-width:700px){.sitebar .sb-ses{display:none}}
@media print{
  body{background:#fff;padding:0}
  .sitebar,.top,.hero,.traps,section.block:not(.sim),footer,.simbar,.modes,.sim > .lbl,.sim .sec-head,.qactions,.siminfo,.drawer,.scrim{display:none!important}
  .quiz{box-shadow:none;border:0;padding:0;max-width:none}

  .miss{background:none;padding:0} .miss li{break-inside:avoid;margin:10px 0}
  .trow2 .tb{border-color:#999} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

{"meta": {"titulo": "Mapa de la Guía GAFI del EBR para el sector bancario", "descripcion": "Mapa mental interactivo de la Guía del GAFI para un Enfoque Basado en Riesgo en el sector bancario (2014), con simulador de reactivos.", "repo": "mapa-gafi-ebr-bancos", "clave": "gafiebr", "ruta": "financiero", "modulo": "Módulo 3 · Certificación CNBV PLD/FT", "unidad": "apartados", "eyebrow": "GAFI · Plenaria de octubre de 2014", "h1_antes": "Guía GAFI del", "h1_resaltado": "Enfoque Basado en Riesgo", "h1_despues": "para el sector bancario", "intro": "Tres secciones y dos anexos que dicen qué es el EBR, cómo supervisa la autoridad con ese enfoque y qué hace el banco por dentro. Toca cualquier apartado para ver lo que contiene, recorre el trabajo del banco paso a paso y practica con reactivos de opción múltiple.", "fuente": "Fuente: GAFI, Guía para un Enfoque Basado en Riesgo · El sector bancario, octubre de 2014 (versión en español). La guía no tiene efecto jurídico vinculante (párr. 8)."}, "trampas": [{"titulo": "No vinculante ≠ opcional.", "texto": "La guía <b>no tiene efecto jurídico vinculante<\/b> (párr. 8), pero el <b>EBR no es opcional<\/b>: es prerrequisito para aplicar con eficacia los Estándares del GAFI (párr. 15). Una frase habla del documento; la otra, del enfoque."}, {"titulo": "Riesgo bajo ≠ sin medidas.", "texto": "El EBR no exime de mitigar riesgos evaluados como bajos (párr. 11); con menor riesgo las medidas <b>se aplican<\/b>, aunque su grado, frecuencia o intensidad pueden ser menores (párr. 16). Y estar excluido del sistema financiero no equivale automáticamente a menor riesgo (párr. 28)."}, {"titulo": "Calibrar alertas ≠ calibrar el reporte.", "texto": "Las políticas que generan una alerta de sospecha pueden aplicarse según el tipo de riesgo, pero el banco <b>deberá informar a la UIF una vez que haya surgido la sospecha<\/b> (párr. 72; R. 20, párr. 71)."}], "secciones": [{"tipo": "mapa", "id": "mapa", "nav": "El mapa", "titulo": "La guía en 12 apartados", "intro": "Cuatro bloques que responden una pregunta cada uno: 5 · 2 · 3 · 2. La guía va de lo general (qué es el EBR) al supervisor, luego al banco y cierra con ejemplos de países y los Principios de Basilea.", "centro": {"t": "Guía GAFI · EBR sector bancario", "s": "3 secciones + 2 anexos<br>octubre de 2014"}, "ramas": [{"letra": "1", "titulo": "Bloque 1 · Qué es y por qué", "pregunta": "¿Qué es el EBR y es opcional?", "ritmo": "¿Qué es?", "corto": "Bloque 1", "color": "morado", "items": [{"etiqueta": "Párrs. 1–8", "nombre": "Introducción", "sub": "Antecedentes, propósito y estatus", "verbo": "Presento", "desc": "Guía adoptada en la Plenaria del GAFI de octubre de 2014, preparada por un grupo codirigido por Reino Unido y México. Va para países, supervisores y bancos; no es vinculante.", "orden": 1, "panel": "Introducción", "puntos": ["Revisa la guía de EBR para alinearla con los estándares adoptados en <b>2012<\/b>; la versión revisada se centra en el sector bancario (párr. 1).", "Grupo de miembros del GAFI <b>codirigido por el Reino Unido y México<\/b>; el sector privado participó y fue consultado (párr. 2).", "Adoptada en la <b>Sesión Plenaria de octubre de 2014<\/b> (párr. 3).", "Propósito: principios del EBR, ejemplos de prácticas, supervisión efectiva y, <b>sobre todo<\/b>, un entendimiento común del EBR (párr. 4).", "Dirigida a países y autoridades competentes, incluidos los supervisores bancarios, y a los profesionales del sector bancario (párr. 5).", "Tres secciones: I elementos clave del EBR, II guía para supervisores, III guía para bancos (párr. 6).", "Tiene presente que un EBR efectivo parte del marco legal y normativo del país; fija parámetros, pero no anula el campo de acción de las autoridades (párr. 7).", "<b>No tiene efecto jurídico vinculante<\/b> (párr. 8).", "Se consulta junto con las Recomendaciones 1 y 26, sus Notas Interpretativas y el Glosario."], "destacado": false}, {"etiqueta": "Párrs. 9–11", "nombre": "¿Qué es el EBR?", "sub": "Sección I · A", "verbo": "Defino", "desc": "Países, autoridades e instituciones deben identificar, evaluar y entender sus riesgos de LA/FT y mitigarlos. No es infalible, y un riesgo bajo no exime de mitigar.", "orden": 2, "panel": "Sección I · A", "puntos": ["EBR = <b>identificar, evaluar y entender<\/b> los riesgos de LA/FT a los que se está expuesto y adoptar medidas para <b>mitigarlos<\/b> de manera efectiva (párr. 9).", "La evaluación de riesgos da la base para aplicar medidas ALA/CFT de forma sensible al riesgo (párr. 10).", "<b>No es infalible<\/b>: aun tomando todas las medidas razonables, una institución puede ser utilizada para LA/FT (párr. 10).", "No exime de mitigar los riesgos evaluados como <b>bajos<\/b> (párr. 11).", "Nota 11: con riesgo bajo, la NI 1 permite a los países no aplicar algunas Recomendaciones y la NI 10 permite debida diligencia simplificada."], "destacado": false}, {"etiqueta": "Párrs. 12–15", "nombre": "La razón de ser de un nuevo enfoque", "sub": "Sección I · B", "verbo": "Justifico", "desc": "En 2012 el GAFI actualizó sus Recomendaciones y el EBR pasó a ser «fundamento esencial» del marco ALA/CFT de un país. No es opcional: es prerrequisito.", "orden": 3, "panel": "Sección I · B", "puntos": ["2012: el GAFI actualizó sus Recomendaciones para fortalecer las salvaguardas globales (párr. 12).", "Las Recomendaciones de <b>2003<\/b> sugerían el EBR en algunas áreas; las de <b>2012<\/b> lo consideran un «fundamento esencial» del marco jurídico ALA/CFT de un país (párr. 13).", "Permite medidas más flexibles para orientar los recursos y aplicar medidas preventivas acordes con la naturaleza de los riesgos (párr. 14).", "La aplicación del EBR <b>no es opcional<\/b>: es un prerrequisito para aplicar con eficacia los Estándares del GAFI (párr. 15).", "Nota 13: la eficacia de las medidas de prevención y mitigación se evalúa en la evaluación mutua del país."], "destacado": false}, {"etiqueta": "Párr. 16", "nombre": "Aplicación del EBR: la Recomendación 1", "sub": "Sección I · C", "verbo": "Aplico", "desc": "La R. 1 aplica el EBR en tres ámbitos: quién queda sujeto, cómo se le vigila y cómo cumple. Más riesgo, medidas reforzadas; menos riesgo, pueden reducirse, pero se aplican.", "orden": 4, "panel": "Sección I · C", "puntos": ["<b>Quién y qué queda sujeto:<\/b> los países deberían incluir otros sectores o actividades si se sospecha mayor riesgo y podrían considerar exentar a algunos <b>de algunas de sus obligaciones<\/b> si se cumplen ciertas condiciones, como una evaluación que concluya riesgo bajo (nota 15: NI 1, párrafo 6).", "<b>Cómo se vigila:<\/b> el supervisor toma en cuenta la evaluación y mitigación del banco; la NI 26 requiere que el propio supervisor adopte un EBR.", "<b>Cómo se cumple:<\/b> con riesgo mayor se refuerzan el alcance, grado, frecuencia o intensidad de los controles.", "Con riesgo menor las medidas <b>se aplican<\/b>, pero su grado, frecuencia o intensidad puede ser menor."], "ir": "#riesgo", "destacado": false}, {"etiqueta": "Párrs. 17–29", "nombre": "Retos", "sub": "Sección I · D", "verbo": "Enfrento", "desc": "Seis retos: repartir responsabilidades, identificar, evaluar y mitigar el riesgo, lograr un entendimiento común y apoyar la inclusión sin confundir exclusión con bajo riesgo.", "orden": 5, "panel": "Sección I · D", "puntos": ["<b>Asignación de responsabilidades (párrs. 18–20):<\/b> con riesgos mayores, el banco siempre deberá aplicar debida diligencia reforzada, aunque la norma no indique con claridad cómo; países con sectores o marcos incipientes pueden limitar la flexibilidad; ninguna institución debe quedar exenta de supervisión.", "<b>Identificación (párr. 21):<\/b> requiere información precisa, oportuna y objetiva; la NI 1.3 pide mecanismos para compartir los resultados de las evaluaciones de riesgo.", "<b>Evaluación (párrs. 22–23):<\/b> probabilidad e impacto; a menudo en categorías bajo, medio y alto; es la base de la mitigación y debe mantenerse actualizada. Nota 19: no se re len lo suficiente con el GAFI; posible participación de PEP en la propiedad de un banco."}]}], "nota": "<b>Ojo con la traducción:<\/b> el párrafo 52 en español llama «banco corresponsal» a los dos bancos de la relación. Al estudiarlo, distingue al banco que presta el servicio del banco que lo recibe."}, {"tipo": "pasos", "id": "ciclo", "nav": "El banco por dentro", "titulo": "Lo que hace el banco, paso a paso", "intro": "Ocho pasos para recorrer la Sección III en <b>orden didáctico<\/b>: la guía no fija esta secuencia. Aquí el cliente aparece como parte de la mitigación del banco; la clasificación de riesgo cliente por cliente es otro tema del módulo.", "pasos": [{"nombre": "Evaluar el riesgo del banco", "ref": "Párrs. 54–57", "gancho": "¿Qué tan vulnerable soy?", "puntos": ["Es la base del EBR del banco; se documenta, guarda y comunica (párr. 54).", "Proporcional a la naturaleza y alcance de las actividades; en bancos pequeños puede bastar una evaluación simple (párr. 55).", "Factores del párrafo 56: negocio, mercados, clientes de alto riesgo, jurisdicciones, canales, auditoría interna y resultados de regulación, volumen.", "Fuentes internas y externas; revisión periódica y cuando cambian las circunstancias o surgen amenazas (párr. 57)."]}, {"nombre": "Aprobar y fijar el apetito", "ref": "Párr. 58", "gancho": "¿Cuánto riesgo acepto?", "puntos": ["La evaluación de riesgos debe ser <b>aprobada por la alta dirección<\/b>.", "Refleja el apetito por el riesgo y el nivel de riesgo que se considera aceptable.", "Las políticas, procedimientos y controles deben ser acordes con la evaluación; se revisa y actualiza periódicamente."]}, {"nombre": "Conocer al cliente", "ref": "Párrs. 59–65", "gancho": "¿Quién es y para qué quiere el servicio?", "puntos": ["DDC inicial: identificar (y al propietario real, en su caso), verificar con fuentes confiables e independientes y entender el propósito (párr. 61).", "Revisar clientes y propietarios reales en listas de sanciones del Consejo de Seguridad de la ONU y otras (párr. 62).", "Norma general: DDC en todos los casos, reforzada o simplificada según el riesgo (párr. 63; Caja 3).", "Si no puede aplicar el nivel apropiado de DDC: no iniciar la relación o darla por terminada (párr. 64)."]}, {"nombre": "Monitorear", "ref": "Párrs. 66–70", "gancho": "¿Lo que hace cuadra con lo que sé de él?", "puntos": ["Escrutinio de operaciones frente al conocimiento del cliente; identificar cambios de perfil (párr. 66).", "No requiere sistemas electrónicos; con grandes volúmenes los automatizados podrían ser el único método realista, y deben verificarse con regularidad (párr. 67).", "Monitoreo reforzado en situaciones de mayor riesgo; puede reducirse la frecuencia e intensidad cuando el riesgo es menor (párr. 68).", "Criterios de segmentación documentados y transparentes; resultados documentados y comunicados (párrs. 69–70)."]}, {"nombre": "Reportar", "ref": "Párrs. 71–72", "gancho": "¿Surgió la sospecha? A la UIF, de inmediato.", "puntos": ["R. 20: si sospecha o tiene fundamentos razonables para sospechar, informa de inmediato a la UIF (párr. 71).", "Sistemas adecuados de gestión de casos para analizar a tiempo lo inusual (párr. 71).", "Las alertas pueden calibrarse por tipo de riesgo, pero el banco deberá informar una vez surgida la sospecha (párr. 72)."]}, {"nombre": "Gobernar", "ref": "Párrs. 73–79", "gancho": "¿Quién responde por el EBR?", "puntos": ["Controles internos adecuados: condición previa para mitigar (párr. 73).", "Liderazgo sólido de la alta dirección (párr. 75); decide medidas y riesgo residual aceptable (párr. 76).", "La alta dirección recibe información suficiente, regular y objetiva sobre el riesgo y suficiente y objetiva sobre la eficacia de los controles; hay procesos para escalar decisiones importantes (segundo párr. 76).", "Responsable con nivel suficiente y oficial de cumplimiento competente a nivel gerencial (párr. 78)."]}, {"nombre": "Cuidar al personal", "ref": "Párrs. 80–83", "gancho": "¿Es íntegro y está capacitado?", "puntos": ["Personal íntegro, con conocimientos y experiencia suficientes (párr. 80).", "Investigación del personal proporcional al riesgo, no sólo para la alta dirección; manejo de conflictos de interés (párr. 81).", "Capacitación: alta calidad, obligatoria, a la medida, efectiva, continua y complementada con actualizaciones (párr. 82).", "Construir un comportamiento en el que el cumplimiento esté anidado en las decisiones de todo el personal (párr. 83)."]}, {"nombre": "Revisar los controles", "ref": "Párrs. 84–87", "gancho": "¿Funciona? Lo vigila cumplimiento y lo prueba auditoría.", "puntos": ["El oficial de cumplimiento monitorea los controles de forma continua; una función de auditoría los revisa (párr. 84).", "Oficial de cumplimiento a nivel gerencial con independencia, autoridad, nivel, recursos, experiencia y acceso a toda la información interna (párr. 85).", "Auditoría independiente (R. 18) que examina todas las determinaciones de riesgo, no sólo las altas (párr. 86).", "Fuentes: líneas de denuncia, tasas de aprobados de la capacitación, fallas de cumplimiento y consultas del personal (párr. 87)."]}], "frase": {"titulo": "El banco en una frase", "html": "<b>Evalúo, apruebo, conozco, monitoreo y reporto<\/b>; luego <b>gobierno, cuido al personal y reviso<\/b> que todo funcione."}}, {"tipo": "flujo", "id": "mexico", "nav": "México en el Anexo 1", "titulo": "México en el Anexo 1: la supervisión de la CNBV descrita en 2014", "intro": "Dos carriles que se alimentan entre sí: lo que se analiza desde gabinete define a quién y cuándo visitar, y lo que se encuentra en la visita regresa a la matriz. Es el ejemplo que la guía incluyó en 2014.", "carriles": [{"titulo": "Extra situ", "sub": "Análisis de gabinete", "color": "turquesa", "nodos": [{"titulo": "Información periódica", "ref": "Anexo 1 · México", "texto": "La CNBV solicita información periódicamente a las instituciones para el análisis extra situ."}, {"titulo": "Matriz y calificación de riesgo", "ref": "Anexo 1 · México", "texto": "La información se consolida en la matriz de riesgos y se asigna una calificación con el modelo de EBR."}, {"titulo": "Programa y frecuencia de visitas", "ref": "Anexo 1 · México", "texto": "Se decide qué instituciones visitar en el año (programa anual) y con qué frecuencia.", "nota": "Factores, entre otros: incrementos inusuales en el número y umbral de operaciones, incrementos en STR, CTR u otros reportes, cambio de perfil de negocio, nuevos productos o líneas de negocio y nivel de cumplimiento regulatorio; también influyen las medidas de seguimiento correctivas."}]}, {"titulo": "In situ", "sub": "Preparación y visita", "color": "principal", "nodos": [{"titulo": "Estrategia y diagnóstico", "ref": "Anexo 1 · México", "texto": "Antes de la visita: estrategia enfocada en los factores de riesgo más altos y diagnóstico que acota las actividades significativas (productos y servicios) de mayor riesgo y la efectividad de sus mitigantes."}, {"titulo": "Inspección", "ref": "Anexo 1 · México", "texto": "Se confirma si el nivel de riesgo asignado es adecuado, con la metodología del Manual Institucional de Supervisión; si hay evidencia de debilidad en un mitigante no cubierto originalmente en el programa, el supervisor tiene la facultad de revisar más a fondo."}, {"titulo": "Actos de autoridad", "ref": "Anexo 1 · México", "texto": "Según los resultados: observaciones y recomendaciones, acciones correctivas y/o sanciones."}, {"titulo": "De vuelta a la matriz", "ref": "Anexo 1 · México", "texto": "Los resultados confirman el nivel de riesgo o asignan uno nuevo y ayudan a programar la siguiente supervisión."}]}]}, {"tipo": "cifras", "id": "cifras", "nav": "Cifras", "titulo": "Números que preguntan", "intro": "Cada número con su párrafo o anexo.", "cifras": [["2014", "octubre", "Sesión Plenaria del GAFI que adoptó la guía", "Párr. 3"], ["2012", "año", "Recomendaciones que hacen del EBR un «fundamento esencial»", "Párr. 13"], ["3 + 2", "partes", "Tres secciones (I, II, III) y dos anexos", "Párr. 6 e índice"], ["3", "categorías", "En que a menudo se sitúan los riesgos: bajo, medio y alto", "Párr. 22"], ["6", "retos", "Responsabilidades, identificación, evaluación, mitigación, entendimiento común e inclusión", "Sección I · D"], ["4", "ajustes", "Del supervisor: autorización, tipo, frecuencia e intensidad", "Párr. 39"], ["4", "líneas", "De negocio bancario, entre otras", "Párr. 52"], ["3", "elementos", "De la DDC inicial: identificar, verificar y entender el propósito", "Párr. 61"], ["6", "rasgos", "De la capacitación: alta calidad, obligatoria, a la medida, efectiva, continua y complementada", "Párr. 82"], ["15", "PBB", "Principios Básicos de Basilea relevantes para la R. 26", "Anexo 2 · nota 28"], ["12", "celdas", "Matriz de BaFin: 3 niveles de amenaza × 4 de calidad (A a D)", "Anexo 1 · Alemania"], ["4", "años", "Ciclo del programa sistemático de la FCA para las entidades de mayor riesgo", "Anexo 1 · Reino Unido"]]}, {"tipo": "simulador", "id": "examen", "nav": "Practicar ▸"}], "temas": {"gen": "Introducción y Sección I · Qué es el EBR", "sup": "Sección II · Supervisores", "ban": "Sección III · Bancos", "anx": "Anexos · Países y Basilea"}, "modos": [{"k": "gen", "l": "Qué es el EBR", "tema": "gen"}, {"k": "sup", "l": "Supervisores", "tema": "sup"}, {"k": "ban", "l": "Bancos", "tema": "ban"}, {"k": "anx", "l": "Anexos", "tema": "anx"}, {"k": "caso", "l": "Casos prácticos", "tipos": ["caso"]}, {"k": "tr", "l": "Cifras y trampas", "tipos": ["cifra", "trampa"]}], "banco": [{"id": "G001", "tema": "gen", "tipo": "memoria", "q": "Según la Sección I, ¿en qué consiste el enfoque basado en riesgo (EBR) de ALA/CFT?", "a": "En que países, autoridades competentes e instituciones financieras identifiquen, evalúen y entiendan sus riesgos de LA/FT y adopten medidas adecuadas para mitigarlos de manera efectiva", "o": ["En que las instituciones financieras concentren sus medidas ALA/CFT en los clientes y productos de riesgo alto y dejen sin controles a las relaciones que su evaluación haya calificado como de riesgo bajo", "En que países, autoridades competentes e instituciones financieras identifiquen, evalúen y entiendan sus riesgos de LA/FT y adopten medidas adecuadas para mitigarlos de manera efectiva", "En que las instituciones calculen la probabilidad matemática de cada transacción ilícita y fijen con ese cálculo una tolerancia cero frente a cualquier riesgo de LA/FT que llegue a materializarse", "En que el supervisor aplique a todas las instituciones el mismo conjunto de controles ALA/CFT, con independencia de su perfil, para asegurar la igualdad de condiciones entre los proveedores de servicios bancarios"], "x": "El párr. 9 define el EBR como identificar, evaluar y entender los riesgos y mitigarlos de manera efectiva. El distractor más tentador, concentrarse en lo alto y dejar lo bajo sin controles, choca con el párr. 11: un riesgo evaluado como bajo también se mitiga.", "ref": "Párrs. 9 y 11"}, {"id": "G002", "tema": "gen", "tipo": "caso", "q": "En una capacitación de Banco Albora, el director jurídico afirma: «Como la guía del GAFI no es obligatoria, aplicar un EBR queda a criterio del banco». ¿Cuál es la precisión correcta?", "a": "La guía no tiene efecto jurídico vinculante, pero la aplicación del EBR no es opcional: es un prerrequisito para aplicar con eficacia los Estándares del GAFI", "o": ["La guía adquirió efecto jurídico vinculante para los bancos al adoptarse en la Plenaria de octubre de 2014, por lo que el EBR es obligatorio en sus términos literales", "La guía sólo vincula a los países que codirigieron el grupo de proyecto, y en ellos el EBR se vuelve obligatorio a partir de la siguiente evaluación mutua del GAFI", "La guía no tiene efecto jurídico vinculante, pero la aplicación del EBR no es opcional: es un prerrequisito para aplicar con eficacia los Estándares del GAFI", "La guía no es vinculante y el EBR es opcional para los bancos, aunque resulta obligatorio para los supervisores por lo que dispone la Nota Interpretativa de la Recomendación 26"], "x": "Son dos afirmaciones distintas: el documento no es vinculante (párr. 8) y el enfoque no es opcional, pues es prerrequisito de la aplicación efectiva de los Estándares (párr. 15). La NI 26 sí pide que el supervisor adopte un EBR, pero eso no vuelve opcional el EBR para los bancos.", "ref": "Párrs. 8 y 15"}, {"id": "G003", "tema": "gen", "tipo": "cifra", "q": "¿Qué versión de las Recomendaciones del GAFI pasó a considerar el EBR un «fundamento esencial» del marco jurídico ALA/CFT de un país?", "a": "Las Recomendaciones de 2012, que pusieron mayor énfasis en el EBR sobre todo en medidas preventivas y de supervisión", "o": ["La guía adoptada en la Plenaria de octubre de 2014, que elevó el EBR de simple sugerencia a requisito de las Recomendaciones", "Las Recomendaciones de 2012, que pusieron mayor énfasis en el EBR sobre todo en medidas preventivas y de supervisión", "La serie de guías sectoriales adoptada entre 2007 y 2009, que convirtió el EBR en requisito para cada actividad y profesión", "Las Recomendaciones de 2003, que por primera vez exigieron aplicar el EBR en todas las áreas del marco jurídico ALA/CFT del país"], "x": "El párr. 13 contrasta las Recomendaciones de 2003, que sugerían el EBR en algunas áreas, con las de 2012, que lo consideran «fundamento esencial». La guía de 2014 no crea ese requisito: se revisó para guardar relación con los estándares de 2012 (párr. 1).", "ref": "Párrs. 1 y 13"}, {"id": "G004", "tema": "gen", "tipo": "memoria", "q": "¿Quién elaboró la guía de EBR para el sector bancario, según la Introducción?", "a": "Un grupo de miembros del GAFI codirigido por el Reino Unido y México, con participación y consulta del sector privado", "o": ["Un grupo codirigido por el Reino Unido y España, con la Federación Latinoamericana de Bancos como observadora", "Un grupo de miembros del GAFI codirigido por el Reino Unido y México, con participación y consulta del sector privado", "Un grupo de miembros del GAFI codirigido por Estados Unidos y México, sin intervención del sector privado en el borrador", "El Comité de Supervisión Bancaria de Basilea, a petición del GAFI y con comentarios de las federaciones bancarias"], "x": "El párr. 2 señala que el grupo fue codirigido por el Reino Unido y México y que representantes del sector privado estuvieron involucrados y fueron consultados. El CSBB participó como observador (nota 5), no como autor.", "ref": "Párr. 2 · Notas 5–7"}, {"id": "G005", "tema": "gen", "tipo": "memoria", "q": "De los propósitos de la guía que enumera la Introducción, ¿cuál se destaca «sobre todo»?", "a": "Fomentar el desarrollo de un entendimiento común sobre lo que es el EBR de ALA/CFT y lo que implica", "o": ["Fomentar el desarrollo de un entendimiento común sobre lo que es el EBR de ALA/CFT y lo que implica", "Compartir prácticas de supervisión de países para que las autoridades las adopten como estándares respaldados por el GAFI", "Establecer principios que sustituyan las normas nacionales de los países cuando éstas no prevean un enfoque basado en riesgo", "Medir la eficacia de las medidas nacionales de prevención dentro de la Cuarta Ronda de evaluaciones mutuas del GAFI"], "x": "El párr. 4 enumera cuatro propósitos y marca con «sobre todo» el entendimiento común del EBR. Compartir ejemplos es otro propósito, pero el Anexo 1 aclara que esas prácticas no son un respaldo del GAFI.", "ref": "Párr. 4"}, {"id": "G006", "tema": "gen", "tipo": "memoria", "q": "¿A quién está dirigida la guía?", "a": "A los países y sus autoridades competentes, incluidos los supervisores bancarios, y a los profesionales del sector bancario", "o": ["A los países y sus autoridades competentes, incluidos los supervisores bancarios, y a los profesionales del sector bancario", "A los supervisores bancarios y a las unidades de inteligencia financiera, pero no a los profesionales del sector bancario", "A los países y a las actividades y profesiones no financieras designadas que prestan servicios auxiliares a los bancos", "A los bancos y a los intermediarios del sector de valores, ya que ambos sectores se tratan de forma conjunta en esta versión"], "x": "El párr. 5 incluye a países, autoridades competentes (con los supervisores bancarios) y profesionales del sector bancario. El sector de valores queda para una guía por separado (párr. 1).", "ref": "Párrs. 1 y 5"}, {"id": "G007", "tema": "gen", "tipo": "caso", "q": "Banco Cendra tomó todas las medidas razonables para identificar y mitigar sus riesgos; aun así, un cliente logró usarlo para lavar dinero. ¿Qué reconoce la guía sobre esta situación?", "a": "Que el EBR no es infalible: puede haber ocasiones en que, aun con todas las medidas razonables, una institución siga siendo utilizada para LA/FT", "o": ["Que el EBR no es infalible: puede haber ocasiones en que, aun con todas las medidas razonables, una institución siga siendo utilizada para LA/FT", "Que el uso del banco para LA/FT demuestra por sí mismo que su evaluación de riesgos fue deficiente y que sus controles quedan invalidados en su conjunto", "Que el banco debió adoptar controles iguales a los del resto del sector para que el riesgo materializado pudiera considerarse justificado ante el supervisor", "Que, al haber tomado medidas razonables, el banco puede quedar exento de supervisión ALA/CFT en el siguiente ciclo conforme al principio de proporcionalidad"], "x": "El párr. 10 reconoce expresamente que el EBR no es infalible. Tampoco un incidente invalida por sí solo los controles (párr. 26), y ninguna institución debe quedar exenta de supervisión (párr. 20).", "ref": "Párrs. 10, 20 y 26"}, {"id": "G008", "tema": "gen", "tipo": "trampa", "q": "Frente a riesgos de LA/FT evaluados como bajos, ¿qué implica el EBR?", "a": "Que no exime de mitigarlos: las medidas se aplican, aunque su grado, frecuencia o intensidad pueden ser menores", "o": ["Que exime a la institución de mitigarlos, siempre que la evaluación esté documentada y aprobada por la alta dirección", "Que permite al banco decidir por su cuenta no aplicar ciertas Recomendaciones del GAFI a ese producto o actividad", "Que no exime de mitigarlos: las medidas se aplican, aunque su grado, frecuencia o intensidad pueden ser menores", "Que obliga a aplicar las mismas medidas que en riesgo alto, porque el EBR modula la supervisión y no las medidas del banco"], "x": "El párr. 11 dice que el EBR no exime de mitigar riesgos bajos y el párr. 16 aclara que con menor riesgo las medidas se aplican con menor grado, frecuencia o intensidad. No aplicar ciertas Recomendaciones es una decisión del país, no del banco (nota 22).", "ref": "Párrs. 11 y 16 · Nota 22"}, {"id": "G009", "tema": "gen", "tipo": "memoria", "q": "La Recomendación 1 establece el alcance de la aplicación del EBR. ¿Respecto de qué tres cuestiones se aplica, según la Sección I · C?", "a": "Quién y qué debe estar sujeto al régimen ALA/CFT, cómo se vigila a los sujetos y la forma en que éstos cumplen", "o": ["Cómo se tipifica el lavado de activos, cómo se decomisan los bienes y cómo coopera el país con otras jurisdicciones", "Qué productos puede ofrecer un banco, a qué clientes debe rechazar y qué sanciones impone el supervisor por incumplir", "Quién y qué debe estar sujeto al régimen ALA/CFT, cómo se vigila a los sujetos y la forma en que éstos cumplen", "Cómo se evalúa al país, cómo se publica su evaluación mutua y cómo se da seguimiento a sus planes de acción"], "x": "El párr. 16 organiza la R. 1 en tres ámbitos: quién queda sujeto, cómo se le vigila (con la NI 26 pidiendo al supervisor su propio EBR) y cómo cumple (medidas reforzadas o reducidas según el riesgo).", "ref": "Párr. 16"}, {"id": "G010", "tema": "gen", "tipo": "caso", "q": "La República de Valdoria detecta que un tipo de actividad no incluida en el alcance de las Recomendaciones del GAFI podría representar un mayor riesgo de LA/FT. Según la R. 1, ¿qué corresponde?", "a": "Los países deberían incluir en su régimen a otras instituciones, sectores o actividades si se sospecha que representan un mayor riesgo de LA/FT", "o": ["El país puede incorporarla sólo si una evaluación concluye que su riesgo es bajo, para aplicarle desde el inicio medidas simplificadas", "El país debe esperar a la siguiente evaluación mutua para que el GAFI valide la incorporación de esa actividad a su régimen ALA/CFT", "Los países deberían incluir en su régimen a otras instituciones, sectores o actividades si se sospecha que representan un mayor riesgo de LA/FT", "El país debe limitarse a los sectores definidos en el Glosario del GAFI, por lo que esa actividad sólo puede vigilarse mediante la supervisión prudencial"], "x": "El párr. 16 indica que, además de los sectores ya incluidos, los países deberían incluir otros si se sospecha mayor riesgo. La evaluación que concluye riesgo bajo es la condición para considerar exentar, no para incorporar.", "ref": "Párr. 16"}, {"id": "G011", "tema": "gen", "tipo": "caso", "q": "Banco Fidelca identifica un segmento de clientes de mayor riesgo, pero la norma nacional no indica con claridad cómo mitigarlo. ¿Qué debe hacer según la guía?", "a": "Aplicar siempre debida diligencia reforzada, por ejemplo variando el grado de monitoreo continuo reforzado, aunque la norma no lo indique", "o": ["Abstenerse de medidas adicionales hasta que la autoridad emita disposiciones que indiquen expresamente cómo mitigar ese riesgo mayor", "Aplicar debida diligencia estándar, porque ante la falta de norma expresa el banco no puede ir más allá de lo que exige la regulación", "Aplicar siempre debida diligencia reforzada, por ejemplo variando el grado de monitoreo continuo reforzado, aunque la norma no lo indique", "Solicitar al supervisor una exención temporal de las obligaciones de DDC para ese segmento mientras se aclara el marco normativo aplicable"], "x": "El párr. 18 establece que, cuando los riesgos son mayores, los bancos siempre deberán aplicar debida diligencia reforzada, incluso si las leyes o normas no indican de forma clara cómo mitigarlos. La ausencia de norma no justifica esperar ni quedarse en lo estándar.", "ref": "Párr. 18"}, {"id": "G012", "tema": "gen", "tipo": "caso", "q": "El Estado de Marendia tiene un sector de servicios financieros que apenas surge y un marco de supervisión aún en desarrollo. ¿Qué admite la guía sobre la flexibilidad de sus bancos?", "a": "Que puede limitar la flexibilidad de sus bancos y que una aplicación más normativa de los requisitos podría ser apropiada hasta fortalecer la experiencia del sector", "o": ["Que puede limitar la flexibilidad de sus bancos y que una aplicación más normativa de los requisitos podría ser apropiada hasta fortalecer la experiencia del sector", "Que debe exentar a sus bancos de la supervisión ALA/CFT hasta que el sector madure y la autoridad pueda evaluar sus capacidades de gestión del riesgo", "Que debe sustituir el EBR por reglas fijas de manera permanente, sin posibilidad de ampliar la flexibilidad aunque mejore la experiencia del sector", "Que debe conceder a sus bancos la mayor flexibilidad posible del EBR, porque un sector incipiente presenta riesgos de LA/FT bajos por su tamaño reducido"], "x": "El párr. 19 permite limitar la flexibilidad y señala que una aplicación más normativa «podría ser apropiada» hasta fortalecer la comprensión y experiencia del sector, es decir, de forma transitoria. Exentar de supervisión está descartado por el párr. 20.", "ref": "Párrs. 19–20 · Nota 18"}, {"id": "G013", "tema": "gen", "tipo": "trampa", "q": "Aun cuando la capacidad y la observancia de una institución sean buenas, ¿qué NO debe ocurrir según la Sección I · D?", "a": "Que la institución quede exenta de la supervisión en materia de ALA/CFT", "o": ["Que el supervisor combine para ella la supervisión in situ y extra situ que el régimen permita", "Que el supervisor tome en cuenta la evaluación de riesgo y la mitigación del propio banco", "Que la institución quede exenta de la supervisión en materia de ALA/CFT", "Que la autoridad le asigne menos recursos de supervisión que a instituciones de mayor riesgo"], "x": "El párr. 20 prohíbe dejar instituciones exentas de supervisión ALA/CFT, aunque el EBR sí podría llevar a asignar más recursos a las de mayor riesgo. Considerar la evaluación del banco (párr. 16) y combinar in situ y extra situ (párr. 39 b) son prácticas admitidas.", "ref": "Párrs. 16, 20 y 39 b)"}, {"id": "G014", "tema": "gen", "tipo": "memoria", "q": "Para que los bancos puedan identificar correctamente el riesgo de LA/FT, ¿qué requiere la NI 1.3, según la Sección I · D?", "a": "Que los países cuenten con mecanismos para compartir los resultados de las evaluaciones de riesgo con autoridades, instituciones financieras y otras partes interesadas", "o": ["Que las autoridades dejen sin efecto las disposiciones de protección de datos que limiten el acceso de los bancos a la información sobre amenazas de LA/FT", "Que los bancos entreguen al supervisor sus evaluaciones internas de riesgo para que la autoridad las publique junto con la evaluación nacional y puedan compararse entre sí", "Que las unidades de inteligencia financiera compartan con los bancos la información sensible de sus investigaciones, sin reservas derivadas de la confidencialidad o de la seguridad nacional", "Que los países cuenten con mecanismos para compartir los resultados de las evaluaciones de riesgo con autoridades, instituciones financieras y otras partes interesadas"], "x": "El párr. 21 cita la NI 1.3: mecanismos de intercambio de información apropiada sobre los resultados de las evaluaciones de riesgo. La guía menciona la sensibilidad de la información y la protección de datos como obstáculos, no ordena eliminarlos.", "ref": "Párr. 21"}, {"id": "G015", "tema": "gen", "tipo": "caso", "q": "Una analista de Banco Tesalia sostiene que la guía obliga a clasificar los riesgos en exactamente tres categorías y a calcular la probabilidad de las transacciones ilícitas. ¿Qué dice realmente el texto?", "a": "Que a menudo los riesgos se sitúan en bajo, medio y alto, con posibles combinaciones, y que no se requieren necesariamente cálculos de probabilidad", "o": ["Que a menudo los riesgos se sitúan en bajo, medio y alto, con posibles combinaciones, y que no se requieren necesariamente cálculos de probabilidad", "Que la clasificación debe tener exactamente tres categorías sin combinaciones intermedias, y que los cálculos de probabilidad se exigen a bancos sistémicos", "Que la clasificación debe tener cinco categorías fijas y que los cálculos de probabilidad quedan a criterio del banco, salvo en servicios de corresponsalía", "Que la clasificación en categorías debe evitarse, pues la evaluación consiste en recopilar información cuantitativa y cualitativa sin jerarquizarla"], "x": "El párr. 22 usa «a menudo» y admite combinaciones (medio-alto, medio-bajo); la nota 19 aclara que no se requieren necesariamente cálculos de probabilidad, que podrían no ser significativos. Las categorías sirven para organizar los riesgos de forma prioritaria.", "ref": "Párr. 22 · Nota 19"}, {"id": "G016", "tema": "gen", "tipo": "memoria", "q": "¿Cómo caracteriza la guía la evaluación del riesgo de LA/FT frente a la simple recopilación de datos?", "a": "Como mucho más que recopilar información cuantitativa y cualitativa: es la base de una mitigación eficaz y debe mantenerse actualizada", "o": ["Como una estimación del volumen de transacciones ilícitas del sector que hace innecesario clasificar los riesgos por prioridad", "Como un ejercicio de recopilación cuantitativa que se realiza al autorizar al banco y que se repite cuando el supervisor lo requiera", "Como un inventario cualitativo de amenazas cuyo uso principal es informar a la UIF, separado de las decisiones de mitigación", "Como mucho más que recopilar información cuantitativa y cualitativa: es la base de una mitigación eficaz y debe mantenerse actualizada"], "x": "El párr. 22 afirma que la evaluación es mucho más que la mera recopilación de información: es la base de la mitigación y debe mantenerse actualizada para no perder relevancia. La nota 19 advierte, además, que esos volúmenes ilícitos son desconocidos.", "ref": "Párr. 22 · Nota 19"}, {"id": "G017", "tema": "gen", "tipo": "caso", "q": "Banco Rivelta quiere dejar de aplicar ciertas Recomendaciones del GAFI a una cuenta básica que considera de bajo riesgo. ¿Qué precisa la guía sobre las exenciones?", "a": "Que exentar de algunas obligaciones es una decisión del país, que debe evaluar el riesgo, demostrar que es bajo y que se cumplen las condiciones de la NI 1.6", "o": ["Que exentar de algunas obligaciones es una decisión del país, que debe evaluar el riesgo, demostrar que es bajo y que se cumplen las condiciones de la NI 1.6", "Que el banco puede exentarse si el supervisor lo autoriza tras una visita in situ, aunque no exista una evaluación del riesgo de ese producto", "Que el banco puede exentarse si su alta dirección aprueba una evaluación documentada que concluya riesgo bajo y la comunica al oficial de cumplimiento y al supervisor", "Que ninguna autoridad puede conceder exenciones, porque la norma general de aplicar DDC en todos los casos impide cualquier excepción"], "x": "El párr. 24 y la nota 22 sitúan la exención en los países: riesgo bajo comprobado, circunstancias estrictamente limitadas y justificadas, y un tipo particular de institución o actividad. Que la DDC se aplique como norma general no impide que la NI 1 prevea esa excepción.", "ref": "Párr. 24 · Nota 22"}, {"id": "G018", "tema": "gen", "tipo": "memoria", "q": "Según la Sección I · D, ¿qué deben hacer los países y bancos que buscan aplicar medidas simplificadas?", "a": "Evaluar los riesgos de la categoría de clientes o productos, establecer el nivel más bajo de riesgo y definir el alcance y la intensidad de las medidas", "o": ["Aplicarlas a los clientes financieramente excluidos, dado que la exclusión es un indicador suficiente de menor riesgo de LA/FT", "Obtener la autorización previa de la UIF para cada cliente al que se aplicarán medidas simplificadas y conservar la constancia en el expediente", "Demostrar ante el GAFI que el sistema financiero del país en su conjunto tiene riesgo bajo comprobado antes de simplificar cualquier medida de debida diligencia", "Evaluar los riesgos de la categoría de clientes o productos, establecer el nivel más bajo de riesgo y definir el alcance y la intensidad de las medidas"], "x": "El párr. 24 exige evaluar la categoría de clientes o productos, fijar el nivel más bajo de riesgo y definir alcance e intensidad, sujeto al marco jurídico nacional (nota 20). La exclusión financiera no basta para simplificar (párr. 28).", "ref": "Párrs. 24 y 28 · Nota 20"}, {"id": "G019", "tema": "gen", "tipo": "caso", "q": "Durante la revisión de Banco Norvia, el supervisor encuentra un solo incidente, aislado e insignificante, en que un riesgo se materializó. ¿Qué debe tener presente según la guía?", "a": "Que un solo incidente aislado e insignificante no necesariamente invalida la integridad de los controles ALA/CFT del banco", "o": ["Que el incidente obliga a homologar los controles del banco con los de los demás bancos del sector para restablecer su integridad", "Que el incidente carece de relevancia supervisora, porque en un EBR los riesgos materializados se atribuyen al cliente y no al banco", "Que todo riesgo materializado invalida los controles del banco y obliga a rehacer su evaluación de riesgos antes de la siguiente revisión", "Que un solo incidente aislado e insignificante no necesariamente invalida la integridad de los controles ALA/CFT del banco"], "x": "El párr. 26 pide a las autoridades estar conscientes de que no todos los bancos adoptarán controles iguales y de que un incidente aislado e insignificante no necesariamente invalida los controles. «No necesariamente» no equivale a irrelevante: el banco sigue obligado a aplicar controles eficaces.", "ref": "Párr. 26"}, {"id": "G020", "tema": "gen", "tipo": "memoria", "q": "¿Qué deben entender los bancos sobre la flexibilidad que ofrece el EBR, según la Sección I · D?", "a": "Que un EBR flexible no los exime de una aplicación eficaz de controles en materia de ALA/CFT", "o": ["Que un EBR flexible les permite omitir controles en las líneas de negocio que la alta dirección considere estratégicas", "Que un EBR flexible no los exime de una aplicación eficaz de controles en materia de ALA/CFT", "Que la flexibilidad los autoriza a seguir guías del sector privado aunque no sean compatibles con la legislación nacional", "Que la flexibilidad les permite apartarse de sus propias políticas y procedimientos en casos concretos, sin que el supervisor deba verificar que se apeguen a ellos"], "x": "El párr. 26 cierra con esa advertencia a los bancos. La guía de la industria debe ser compatible con la legislación nacional (párr. 49), y ninguna línea de negocio queda fuera de los controles. Y el supervisor verifica que el banco se apegue a sus propias políticas (párr. 42).", "ref": "Párrs. 26, 42 y 49"}, {"id": "G021", "tema": "gen", "tipo": "caso", "q": "En Ostrania, la autoridad supervisa con intensidad a los bancos grandes, pero casi no revisa a otras entidades que también deben cumplir requisitos ALA/CFT. ¿Qué efecto advierte la guía?", "a": "El desplazamiento de las actividades de mayor riesgo hacia instituciones con un nivel de supervisión bajo o inadecuado, afectando la igualdad de condiciones", "o": ["El desplazamiento de las actividades de mayor riesgo hacia instituciones con un nivel de supervisión bajo o inadecuado, afectando la igualdad de condiciones", "El aumento de la exclusión financiera, porque las entidades menos supervisadas tendrían que aplicar debida diligencia reforzada a todos sus clientes", "La pérdida de eficacia del EBR por concentrar recursos en bancos grandes, algo que la guía rechaza porque exige supervisar a todas con igual intensidad", "La invalidez de los controles de los bancos grandes, porque la guía condiciona su eficacia a que el resto del sector reciba idéntica frecuencia de visitas"], "x": "El párr. 27 pide supervisión eficaz de todas las entidades obligadas para apoyar la igualdad de condiciones y evitar el desplazamiento del riesgo. No exige igual intensidad: el párr. 20 admite asignar más recursos a las de mayor riesgo.", "ref": "Párrs. 20 y 27"}, {"id": "G022", "tema": "gen", "tipo": "caso", "q": "Banco Solenta propone aplicar debida diligencia simplificada a todas las personas que otros bancos rechazaron por mala calificación crediticia. ¿Qué indica la guía?", "a": "Que no deben aplicarse medidas simplificadas o exenciones sólo porque el cliente fue financieramente excluido; la exclusión es un factor de una evaluación integral", "o": ["Que debe aplicarles debida diligencia reforzada, porque la mala calificación crediticia constituye por sí sola un indicador de riesgo alto de LA/FT", "Que debe negarles la relación comercial, porque la guía considera incompatible atender a personas con antecedentes penales o con mala calificación crediticia en el sistema financiero", "Que no deben aplicarse medidas simplificadas o exenciones sólo porque el cliente fue financieramente excluido; la exclusión es un factor de una evaluación integral", "Que puede hacerlo, porque estar excluido del sistema financiero equivale a un menor riesgo de LA/FT y justifica medidas simplificadas para ese grupo"], "x": "El párr. 28 dice que la exclusión no equivale automáticamente a menor riesgo y que no se apliquen DDS o exenciones únicamente por esa razón; la Caja 4 pide una decisión informada con base en una evaluación integral. La guía no convierte la mala calificación en riesgo alto ni ordena rechazar.", "ref": "Párr. 28 · Caja 4"}, {"id": "G023", "tema": "gen", "tipo": "memoria", "q": "¿Cómo puede un EBR contribuir a la inclusión financiera, según la Sección I · D?", "a": "Permitiendo que los países establezcan exenciones basadas en bajos riesgos comprobados o que las instituciones flexibilicen la DDC en riesgos menores", "o": ["Permitiendo que los países establezcan exenciones basadas en bajos riesgos comprobados o que las instituciones flexibilicen la DDC en riesgos menores", "Permitiendo que las personas de bajos ingresos que no acreditan su identidad mantengan cuentas anónimas mientras reúnen la documentación requerida por el marco de debida diligencia", "Sustituyendo la supervisión ALA/CFT de los productos de inclusión por mecanismos de autorregulación de las asociaciones bancarias del país", "Autorizando a los bancos a prescindir de la DDC de las personas de bajos ingresos, con independencia del riesgo que represente cada relación"], "x": "El párr. 29 prevé exenciones basadas en bajos riesgos comprobados o mayor flexibilidad de DDC en riesgos menores. La nota 22 recuerda que la prohibición de cuentas anónimas aplica como norma general en todos los casos.", "ref": "Párr. 29 · Nota 22"}, {"id": "G024", "tema": "gen", "tipo": "trampa", "q": "Un alumno resume así la nota 22: «Los países pueden dejar de aplicar Recomendaciones cuando lo consideren conveniente para la inclusión financiera». ¿Qué matiz del texto omite?", "a": "Que procede con un bajo riesgo comprobado, en circunstancias estrictamente limitadas y justificadas, y para un tipo particular de institución o actividad", "o": ["Que procede cuando la exención abarca a todo el sistema financiero del país, de modo que ningún sector obtenga ventajas de arbitraje regulatorio", "Que procede cuando el GAFI aprueba previamente la exención en su Sesión Plenaria y la incorpora a la lista de guías sectoriales publicadas en su sitio", "Que procede para bancos de importancia sistémica, siempre que su supervisor prudencial confirme que sus controles internos son eficaces y suficientes", "Que procede con un bajo riesgo comprobado, en circunstancias estrictamente limitadas y justificadas, y para un tipo particular de institución o actividad"], "x": "La nota 22, citando la NI 1, exige riesgo bajo comprobado, circunstancias estrictamente limitadas y justificadas y un tipo particular de institución, actividad o APNFD. No es una decisión de conveniencia ni requiere aprobación de la Plenaria.", "ref": "Nota 22 · Párr. 29"}, {"id": "G025", "tema": "sup", "tipo": "memoria", "q": "¿Qué establece la NI 26 sobre la asignación de los recursos de supervisión, según la Sección II?", "a": "Que se asignen a las áreas de mayor riesgo de LA/FT, partiendo de que el supervisor comprende esos riesgos y tiene acceso in situ y extra situ a la información", "o": ["Que se concentren en los bancos de mayor tamaño, en el entendido de que el riesgo de LA/FT crece en proporción directa al volumen de activos y de operaciones de cada banco", "Que se destinen en primer término a la supervisión prudencial y que el remanente se aplique a revisiones ALA/CFT de los bancos calificados de alto riesgo", "Que se distribuyan en partes iguales entre todos los bancos autorizados, para garantizar un trato uniforme y evitar el arbitraje regulatorio entre instituciones", "Que se asignen a las áreas de mayor riesgo de LA/FT, partiendo de que el supervisor comprende esos riesgos y tiene acceso in situ y extra situ a la información"], "x": "El párr. 31 resume la NI 26: recursos hacia las áreas de mayor riesgo, sobre la base de que el supervisor entiende el riesgo del país y accede a información in situ y extra situ. El tamaño no se correlaciona necesariamente con el riesgo, como ilustra el ejemplo del Reino Unido en el Anexo 1.", "ref": "Párr. 31 · Anexo 1 · Reino Unido"}, {"id": "G026", "tema": "sup", "tipo": "memoria", "q": "Para entender los riesgos sectoriales, ¿qué fuentes menciona la Sección II de forma no limitativa?", "a": "Las evaluaciones de riesgo nacionales, las tipologías nacionales o internacionales, la experiencia de supervisión y la retroalimentación de la UIF", "o": ["Las evaluaciones de riesgo nacionales, las tipologías nacionales o internacionales, la experiencia de supervisión y la retroalimentación de la UIF", "Los reportes de operaciones sospechosas de los bancos, que la guía presenta como la fuente objetiva a la que deben limitarse los supervisores", "Las autoevaluaciones de riesgo que presentan los bancos, que el supervisor debe tomar como definitivas sin contrastarlas con otras fuentes", "Las calificaciones de agencias crediticias y los estados financieros auditados, que en el sector bancario reemplazan a las tipologías"], "x": "El párr. 33 enumera, «de forma no limitativa», evaluaciones nacionales, tipologías, experiencia de supervisión y retroalimentación de la UIF. El párr. 32 pide recurrir a una variedad de recursos, no a una sola fuente.", "ref": "Párrs. 32–33"}, {"id": "G027", "tema": "sup", "tipo": "caso", "q": "Al perfilar a Banco Quiral, el supervisor analiza dos grupos de elementos: (1) productos, modelo de negocio, canales, perfiles de clientes y países de operación; (2) calidad de la política de gestión de riesgos y funcionamiento de la supervisión interna. ¿Cómo los ubica la guía?", "a": "El primer grupo corresponde al riesgo inherente del banco y el segundo a sus controles vigentes; el supervisor debe tomar en cuenta ambos", "o": ["Ambos grupos integran el riesgo sectorial, que la guía distingue del riesgo individual del banco y que se evalúa con tipologías internacionales", "El primer grupo corresponde a los controles vigentes y el segundo al riesgo inherente, y la prioridad de supervisión se fija con el segundo grupo", "El primer grupo es materia de la supervisión prudencial y el segundo de la ALA/CFT, sin que la guía prevea intercambio de información entre ellas", "El primer grupo corresponde al riesgo inherente del banco y el segundo a sus controles vigentes; el supervisor debe tomar en cuenta ambos"], "x": "El párr. 34 distingue el nivel de riesgo inherente (productos, tamaño, modelo de negocio, gobierno corporativo, canales, clientes, geografía) de los controles vigentes (política de gestión de riesgos, funciones de supervisión interna). Ambos se consideran; y el párr. 35 pide colaboración entre supervisores.", "ref": "Párrs. 34–35"}, {"id": "G028", "tema": "sup", "tipo": "caso", "q": "En Pradonia, un organismo realiza la supervisión prudencial de los bancos y otro distinto la supervisión ALA/CFT. ¿Qué implica esto según la guía?", "a": "Un intercambio de información y colaboración entre ambos supervisores, en especial por pertenecer las responsabilidades a agencias separadas", "o": ["Un intercambio de información y colaboración entre ambos supervisores, en especial por pertenecer las responsabilidades a agencias separadas", "Que cada organismo trabaje con su propia información, porque la confidencialidad prudencial impide compartirla con el supervisor ALA/CFT", "Que el país unifique ambos organismos, pues la guía considera inadecuado que las dos supervisiones recaigan en agencias distintas", "Que el supervisor ALA/CFT deje de considerar la gestión y la función de cumplimiento, pues esos aspectos corresponden al prudencial"], "x": "El párr. 35 dice que parte de la información se obtiene por la supervisión prudencial y que esto implica intercambio y colaboración, en especial con agencias separadas. El párr. 50 admite que haya más de un supervisor y pide coordinación, no fusión.", "ref": "Párrs. 35 y 50"}, {"id": "G029", "tema": "sup", "tipo": "memoria", "q": "¿Cuándo deben los supervisores analizar su evaluación del perfil de riesgo de LA/FT del sector y de los bancos?", "a": "Periódicamente y, en todo momento, cuando cambien las circunstancias del banco o surjan nuevas amenazas relevantes", "o": ["Cada cuatro años, en coincidencia con el calendario de evaluaciones mutuas del GAFI al país correspondiente", "Periódicamente y, en todo momento, cuando cambien las circunstancias del banco o surjan nuevas amenazas relevantes", "Después de cada visita in situ en la que se detecten incumplimientos graves en el programa ALA/CFT del ba
