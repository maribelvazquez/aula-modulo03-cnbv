"tema": "ban", "tipo": "caso", "q": "Un cliente de banca privada de Banco Tilo pide una cuenta numerada para tener mayor confidencialidad. Según el párrafo 44, ¿cómo debe tratarse esa cuenta?", "a": "Con los mismos procedimientos CDD que las demás; la identidad del titular se verifica y la conoce un número suficiente de empleados", "o": ["Con CDD simplificada, porque el número de cuenta sustituye la identidad del titular en toda la documentación posterior del banco", "Como cuenta anónima cuya identidad conoce solo el gerente de relaciones, para preservar la confidencialidad pactada con el cliente", "Con los mismos procedimientos CDD, pero sin que el responsable PBC/FT ni los supervisores puedan acceder a la identidad del titular", "Con los mismos procedimientos CDD que las demás; la identidad del titular se verifica y la conoce un número suficiente de empleados"], "x": "El párr. 44 dice que las cuentas numeradas no deberán funcionar como anónimas: están sujetas a los mismos procedimientos CDD, aunque los lleve personal escogido; la identidad deberá verificarse y ser conocida por un número suficiente de empleados, y control, cumplimiento, auditoría, el responsable PBC/FT y los supervisores deben tener pleno acceso si fuera necesario. La nota 27 aclara que el número sustituye al nombre solo en la documentación posterior.", "ref": "Párr. 44"}, {"id": "B035", "tema": "ban", "tipo": "caso", "q": "Se publica una modificación en un listado de sanciones. Según el párrafo 50, ¿qué deberá hacer Banco Nácar con su base de datos de clientes?", "a": "Cotejarla con motivo de esa modificación en los listados de sanciones", "o": ["Cotejarla en la siguiente revisión anual programada de sus expedientes", "Esperar a que la autoridad le notifique si alguno de sus clientes coincide", "Cotejarla respecto de los clientes de alto riesgo, por ser una medida sensible al riesgo", "Cotejarla con motivo de esa modificación en los listados de sanciones"], "x": "El párr. 50 dice que el banco deberá cotejar su(s) base(s) de datos de clientes «cuando haya modificaciones en los listados de sanciones», y además cotejarlas periódicamente para detectar PEP extranjeras y otras cuentas de alto riesgo. El cotejo con listas no se limita a clientes de alto riesgo: la detección de terroristas no es sensible al riesgo (párr. 62).", "ref": "Párr. 50"}, {"id": "B036", "tema": "ban", "tipo": "cifra", "q": "Conforme al párrafo 52, ¿cuál es el periodo mínimo de conservación de los registros que documentan la diligencia debida?", "a": "Al menos 5 años desde el cese de la relación bancaria o de la transacción ocasional", "o": ["Al menos 3 años desde la última actualización del expediente de identificación del cliente", "Al menos 5 años contados desde la apertura de la cuenta o desde la fecha de cada transacción", "Al menos 10 años desde el cese de la relación o de la transacción ocasional", "Al menos 5 años desde el cese de la relación bancaria o de la transacción ocasional"], "x": "El párr. 52 fija un periodo de conservación de «al menos cinco años desde el cese de la relación bancaria o transacción ocasional» (con referencia al Principio 29, nota 28). Ojo con el punto de partida: es el cese, no la apertura. Y aun con cuentas canceladas, si hay una investigación o litigio en curso, todos los registros se conservan hasta el cierre del procedimiento.", "ref": "Párr. 52"}, {"id": "B037", "tema": "ban", "tipo": "memoria", "q": "¿Qué singularidades de la financiación del terrorismo, frente al blanqueo de capitales, destaca el párrafo 59?", "a": "Sus fondos pueden proceder de actividades delictivas o de fuentes lícitas y los importes pueden ser muy reducidos", "o": ["Sus fondos proceden de actividades delictivas, igual que en el BC, y se mueven en importes elevados", "Sus fondos pueden proceder de actividades delictivas o de fuentes lícitas y los importes pueden ser muy reducidos", "Sus fondos siguen un patrón uniforme en todas las organizaciones, sin importar el tipo de organización terrorista", "Sus fondos proceden solo de fuentes lícitas, por lo que la CDD no resulta útil para detectar transacciones FT"], "x": "El párr. 59 señala que los fondos para financiar actividades terroristas «pueden proceder de actividades delictivas o de fuentes lícitas», que la naturaleza de las fuentes puede variar según el tipo de organización y que los importes «pueden ser muy reducidos». Por eso el párr. 61 insiste en que la CDD sí debe permitir detectar posibles transacciones FT.", "ref": "Párr. 59"}, {"id": "B038", "tema": "ban", "tipo": "trampa", "q": "Sobre la detección de terroristas y de personas o entidades designadas, ¿qué afirmación NO se ajusta al párrafo 62?", "a": "Puede omitirse con los clientes de bajo riesgo, porque es una medida de diligencia debida sensible al riesgo", "o": ["El banco deberá bloquear sin demora y sin previo aviso los fondos u otros activos de personas designadas", "Puede omitirse con los clientes de bajo riesgo, porque es una medida de diligencia debida sensible al riesgo", "Deberá realizarse independientemente del perfil de riesgo que se haya atribuido al cliente", "El banco podrá adoptar sistemas de detección automática, siempre que sean adecuados a sus fines"], "x": "El párr. 62 dice expresamente que «la detección de terroristas no es una medida de diligencia debida sensible al riesgo, por lo que deberá realizarse independientemente del perfil de riesgo atribuido al cliente». El banco podrá usar sistemas automáticos adecuados a sus fines y deberá bloquear sin demora y sin previo aviso los activos de personas o entidades designadas, con arreglo a la legislación aplicable.", "ref": "Párr. 62"}, {"id": "B039", "tema": "int", "tipo": "memoria", "q": "¿Cuál es el propósito de las directrices, tal como lo expresa el párrafo 1?", "a": "Orientar sobre la forma en que los bancos deberán incluir el BC y la FT dentro de su gestión global del riesgo", "o": ["Orientar sobre la forma en que los bancos deberán incluir el BC y la FT dentro de su gestión global del riesgo", "Sustituir las Recomendaciones del GAFI por un régimen propio para los bancos", "Establecer las sanciones mínimas que los supervisores deberán imponer a los bancos que incumplan en materia de PBC/FT", "Definir las atribuciones de las unidades de inteligencia financiera y de las demás autoridades competentes nacionales"], "x": "El párr. 1 dice que el Comité publica estas directrices «sobre la forma en que los bancos deberán incluir el blanqueo de capitales (BC) y la financiación del terrorismo (FT) dentro de su gestión global del riesgo». No sustituyen al GAFI (párr. 3) y el párr. 13 aclara que no tratan la determinación de atribuciones de las autoridades competentes.", "ref": "Párr. 1"}, {"id": "B040", "tema": "int", "tipo": "cifra", "q": "¿En qué año publicó el Comité de Basilea su primer comunicado sobre la prevención del uso delictivo del sistema bancario, según el párrafo 2?", "a": "1988", "o": ["2001", "1988", "2012", "2004"], "x": "El párr. 2 menciona un primer comunicado en 1988 (nota 1: Prevention of criminal use of the banking system for the purpose of money-laundering). 2001 y 2004 son los años de los dos documentos que este texto sustituye (párr. 9) y 2012 es el año de la revisión de los Principios básicos, cuyo Principio 29 trata la utilización abusiva de servicios financieros.", "ref": "Párr. 2"}, {"id": "B041", "tema": "int", "tipo": "memoria", "q": "Según el párrafo 6, ¿qué riesgos plantea en especial a los bancos la insuficiencia o ausencia de una sólida gestión del riesgo BC/FT?", "a": "De reputación, operacional, de cumplimiento y de concentración", "o": ["De reputación, operacional, de cumplimiento y de concentración", "De crédito, de mercado, de liquidez y de tipo de interés estructural", "De reputación, de liquidez, de mercado y de país o de transferencia", "Operacional, de crédito, de contraparte y de liquidez de financiación"], "x": "El párr. 6 enumera cuatro riesgos: reputación, operacional, cumplimiento y concentración. El párr. 7 añade que están relacionados entre sí y que, además de multas y sanciones, pueden ocasionar costes financieros considerables (cese de financiación mayorista, demandas, investigación, embargo de activos, préstamos incobrables). Los distractores mezclan riesgos financieros clásicos que el párrafo no menciona.", "ref": "Párr. 6"}, {"id": "B042", "tema": "int", "tipo": "trampa", "q": "Sobre la relación entre estas directrices y las normas del GAFI, ¿qué afirmación NO es correcta según el párrafo 3?", "a": "Refuerzan las normas GAFI para el sector bancario, por lo que deben interpretarse como una modificación de estas", "o": ["Incorporan las normas GAFI y los Principios Básicos aplicables a bancos con operativa transfronteriza", "Pretenden coadyuvar a la aplicación nacional de las normas GAFI explorando áreas complementarias", "Refuerzan las normas GAFI para el sector bancario, por lo que deben interpretarse como una modificación de estas", "Pretenden complementar y ser congruentes con los objetivos y metas de las normas GAFI"], "x": "El párr. 3 dice que las directrices pretenden complementar y ser congruentes con las normas GAFI y que «en ningún caso deberán interpretarse como modificaciones de dichas normas, ya sea porque las refuercen o debiliten». También incorporan normas GAFI y Principios Básicos y buscan coadyuvar a su aplicación nacional. La trampa está en creer que, por ser más específicas, «refuerzan» o modifican al GAFI.", "ref": "Párr. 3"}, {"id": "B043", "tema": "int", "tipo": "cifra", "q": "¿Qué dos publicaciones previas del Comité fusiona y sustituye este documento, según el párrafo 9?", "a": "Debida diligencia con la clientela de los bancos (2001) y Gestión consolidada del riesgo KYC (2004)", "o": ["Debida diligencia con la clientela de los bancos (2004) y Gestión consolidada del riesgo KYC (2001)", "Debida diligencia con la clientela de los bancos (2001) y Gestión consolidada del riesgo KYC (2004)", "Prevention of criminal use of the banking system (1988) y Principios básicos para una supervisión bancaria eficaz (2012)", "Compliance and the compliance function in banks (2005) y The internal audit function in banks (2012)"], "x": "El párr. 9 dice que el documento fusiona y sustituye a «Debida diligencia con la clientela de los bancos» (octubre de 2001) y «Gestión consolidada del riesgo KYC» (octubre de 2004). El distractor más tentador invierte los años. Los documentos de 2005 y 2012 no se sustituyen: el párr. 8 los cita como documentos que deben leerse conjuntamente.", "ref": "Párr. 9"}, {"id": "B044", "tema": "int", "tipo": "caso", "q": "En un repaso, Tomás afirma: «Basilea 2014 no dice nada sobre PEP; todo lo remite al GAFI». ¿Qué precisión es la correcta?", "a": "No desarrolla específicamente las PEP por tratarlas el GAFI, pero exige diligencia reforzada obligatoria con PEP extranjeras", "o": ["Se equivoca: el documento exige diligencia reforzada obligatoria con toda PEP, sin distinguir en ningún caso su origen ni su cargo", "Tiene razón: el documento omite por completo a las PEP y no establece ninguna medida de diligencia debida referida a ellas", "No desarrolla específicamente las PEP por tratarlas el GAFI, pero exige diligencia reforzada obligatoria con PEP extranjeras", "Se equivoca: el documento dedica un anexo completo a las PEP, junto con la banca privada y las estructuras jurídicas singulares"], "x": "El párr. 9 dice que las PEP, la banca privada y las estructuras jurídicas singulares «no se desarrollan específicamente» porque ya las trata el GAFI; los anexos se dedican a terceros y a corresponsalía. Pero el párr. 34 establece que la diligencia reforzada «podrá ser esencial» con una PEP y «es obligatoria en el caso de PEP extranjeras». Esa obligación expresa se refiere solo a las extranjeras. El párr. 50 también pide cotejar periódicamente las bases de clientes para detectar PEP extranjeras y aplicarles diligencia reforzada.", "ref": "Párr. 9"}, {"id": "B045", "tema": "int", "tipo": "caso", "q": "Banco Sendero, pequeña institución especializada en crédito agrícola, sostiene que las directrices de Basilea no le aplican por su tamaño. Según el párrafo 11:", "a": "Aplican a todos los bancos; algunos requisitos podrán requerir adaptación a su tamaño o a su modelo de negocio", "o": ["Tiene razón: las directrices se dirigen a bancos con actividad internacional y a grupos bancarios, no a entidades pequeñas", "Aplican a todos los bancos, y el propio documento detalla los ajustes específicos para las instituciones pequeñas", "Aplican a todos los bancos; algunos requisitos podrán requerir adaptación a su tamaño o a su modelo de negocio", "Aplican solo si su supervisor así lo determina tras evaluar el riesgo del sector"], "x": "El párr. 11 dice que las directrices «resultan aplicables a todos los bancos» y que algunos requisitos «podrán requerir una adaptación» a instituciones pequeñas o especializadas; pero aclara que «tales ajustes desbordan el alcance de este documento». Por eso es falso que el documento detalle esos ajustes.", "ref": "Párr. 11"}, {"id": "B046", "tema": "int", "tipo": "caso", "q": "En el país de Banco Ceiba, la supervisión PBC/FT se reparte entre el supervisor bancario y la unidad de inteligencia financiera. Para efectos de las directrices, ¿qué señala el párrafo 12?", "a": "La referencia al «supervisor» puede extenderse a esas otras autoridades, y el supervisor bancario coopera con ellas", "o": ["La referencia al «supervisor» comprende solo al supervisor bancario, por lo que la UIF queda fuera de las directrices", "La unidad de inteligencia financiera sustituye al supervisor bancario en todo lo relativo a la Parte IV del documento", "El supervisor bancario debe concentrar toda la supervisión PBC/FT para poder aplicar correctamente las directrices", "La referencia al «supervisor» puede extenderse a esas otras autoridades, y el supervisor bancario coopera con ellas"], "x": "El párr. 12 reconoce la variedad de mecanismos nacionales, en particular el reparto de funciones entre supervisores bancarios y otras autoridades como las UIF; por eso «la referencia al “supervisor” puede extenderse a esas autoridades», y donde la autoridad es compartida, el supervisor bancario coopera con las demás. No exige concentrar la supervisión ni excluye a la UIF.", "ref": "Párr. 12"}, {"id": "B047", "tema": "int", "tipo": "memoria", "q": "Según el párrafo 84, ¿qué gama de sanciones deberán tener la facultad de imponer los supervisores cuando los bancos incumplan sus requisitos PBC/FT?", "a": "Eficaces, proporcionadas y disuasorias", "o": ["Correctivas, confidenciales y negociadas con el banco", "Pecuniarias, graduadas y previamente publicadas", "Eficaces, proporcionadas y disuasorias", "Ejemplares, uniformes y de aplicación inmediata"], "x": "El párr. 84 dice que los supervisores «tendrán la facultad de imponer una gama de sanciones eficaces, proporcionadas y disuasorias». El mismo párrafo cita la Recomendación 26 del GAFI: las medidas prudenciales relevantes para PBC/FT deberían aplicarse de forma similar, incluida la supervisión consolidada de todo el grupo. Ninguna de las otras tríadas aparece en el texto.", "ref": "Párr. 84"}, {"id": "B048", "tema": "int", "tipo": "caso", "q": "Tras evaluar los riesgos de Banco Cobre y sus controles, la supervisora Elena usa esa información para dimensionar el examen y decidir qué especialistas asigna. ¿Qué inciso del enfoque del párrafo 86 está aplicando?", "a": "El inciso (v): utilizar la información para asignar recursos y dimensionar el examen", "o": ["El inciso (iii): evaluar los riesgos en su base de clientes, productos, servicios y geografías", "El inciso (i): conocer los riesgos presentes en la jurisdicción", "El inciso (v): utilizar la información para asignar recursos y dimensionar el examen", "El inciso (iv): evaluar la suficiencia y eficacia de los controles, incluidas las medidas CDD"], "x": "El párr. 86 ordena el enfoque en función del riesgo del supervisor en cinco incisos: (i) conocer los riesgos de la jurisdicción; (ii) evaluar la suficiencia de la evaluación del banco frente a la nacional; (iii) evaluar los riesgos de la entidad; (iv) evaluar la suficiencia y eficacia de los controles; y (v) utilizar la información para asignar recursos, dimensionar el examen e identificar la experiencia y destrezas necesarias. Elena ya hizo (iii) y (iv); ahora aplica (v).", "ref": "Párr. 86"}, {"id": "B049", "tema": "int", "tipo": "caso", "q": "La clientela de Banco Jade presenta perfiles de alto riesgo. Según el párrafo 87, ¿qué implicación tiene esto para el ciclo supervisor?", "a": "Su perfil de riesgo se usa para fijar frecuencia y calendario, y podría requerir análisis más frecuentes", "o": ["Ninguna: la frecuencia del ciclo supervisor es igual para todos los bancos, con independencia de su perfil", "Que el supervisor delegue el examen en auditores externos especializados en las líneas de alto riesgo", "Que el examen se limite a revisar sus políticas y procedimientos escritos, sin muestrear cuentas ni STR", "Su perfil de riesgo se usa para fijar frecuencia y calendario, y podría requerir análisis más frecuentes"], "x": "El párr. 87 dice que el perfil de riesgo del banco deberá utilizarse para determinar la frecuencia y calendario del ciclo supervisor, y que los bancos con clientela de alto riesgo «podrán requerir análisis más frecuentes». Además, el proceso supervisor no solo analiza políticas, sino también, en su caso, documentación de clientes, muestreo de cuentas y transacciones, informes internos y STR.", "ref": "Párr. 87"}, {"id": "B050", "tema": "int", "tipo": "caso", "q": "El supervisor detecta que Banco Ónix y algunos de sus altos cargos incumplen manifiestamente sus propios procedimientos internos PBC/FT. Según el párrafo 88, ¿qué deben dejar claro los supervisores?", "a": "Que adoptarán las medidas oportunas, que podrían ser severas y públicas si las circunstancias lo justifican", "o": ["Que solo actuarán si el incumplimiento genera pérdidas para la propia entidad", "Que las medidas se dirigirán a la entidad y no a sus altos cargos, para no afectar la continuidad del negocio", "Que adoptarán las medidas oportunas, que podrían ser severas y públicas si las circunstancias lo justifican", "Que las medidas serán confidenciales, a fin de proteger la reputación del banco y del sistema bancario nacional"], "x": "El párr. 88 dice que los supervisores deberán dejar claro que adoptarán las medidas oportunas, «que podrían ser severas y públicas si las circunstancias así lo justifican», contra los bancos «y sus altos cargos» que manifiestamente incumplan. El deber supervisor protege no solo la seguridad y solvencia del banco, sino también la integridad del sistema bancario, por lo que no se condiciona a pérdidas.", "ref": "Párr. 88"}, {"id": "B051", "tema": "int", "tipo": "caso", "q": "La filial de Grupo Vértice en un país de acogida no puede aplicar la más estricta entre la norma local y la del grupo. Según el párrafo 89, ¿qué deben garantizar los supervisores?", "a": "Que se documenten los motivos y las diferencias y se apliquen medidas paliativas para mitigar los riesgos", "o": ["Que se documenten los motivos y las diferencias y se apliquen medidas paliativas para mitigar los riesgos", "Que la filial aplique la norma menos estricta sin más trámite, dado que prevalece la legislación de acogida", "Que la oficina central apruebe la excepción sin documentarla, para no generar contingencias con la autoridad", "Que la filial cierre de inmediato sus operaciones, pues no existe alternativa a aplicar la norma más estricta"], "x": "El párr. 89 establece que, cuando haya discrepancia, se aplicarán los requisitos más estrictos; y que, si la sucursal o filial no puede aplicar la más estricta, los supervisores deberán garantizar que «se documentarán los motivos y las diferencias entre ambas» y se aplicarán «las oportunas medidas paliativas». El cierre aparece en otros párrafos (65 y 93) como medida posible «cuando proceda» o «en su caso», no como consecuencia automática.", "ref": "Párr. 89"}, {"id": "B052", "tema": "int", "tipo": "caso", "q": "Los supervisores del país de origen de Banco Cuarzo inspeccionan in situ su filial extranjera y piden examinar archivos de clientes. La filial invoca el secreto bancario local. Según el párrafo 90:", "a": "Ese uso con fines supervisores legítimos, salvaguardado por confidencialidad, no deberá verse entorpecido por el secreto bancario local", "o": ["Ese uso con fines supervisores legítimos, salvaguardado por confidencialidad, no deberá verse entorpecido por el secreto bancario local", "El secreto bancario local prevalece, por lo que el supervisor de origen solo puede consultar información agregada de la filial", "El acceso requiere que cada cliente incluido en la muestra autorice por escrito la entrega de su información al supervisor", "El supervisor de origen debe pedir al de acogida que inspeccione en su lugar, porque no puede muestrear cuentas en el extranjero"], "x": "El párr. 90 dice que los supervisores de origen no deberán sufrir trabas en las inspecciones in situ, que pueden exigir examinar archivos de clientes y muestrear cuentas en la jurisdicción de acogida, y que ese uso con fines supervisores legítimos, salvaguardado por cláusulas de confidencialidad, «no deberá verse entorpecido por la legislación local sobre secreto bancario o protección de datos». El supervisor de acogida conserva su responsabilidad y debe cooperar.", "ref": "Párr. 90"}, {"id": "B053", "tema": "int", "tipo": "caso", "q": "Las trabas al intercambio de información en la jurisdicción de acogida de Banco Granito resultan insuperables y no hay un arreglo alternativo satisfactorio. Según el párrafo 93, ¿qué deberán hacer los supervisores de origen?", "a": "Informar al supervisor de acogida de que el banco podría quedar sujeto a actuaciones supervisoras adicionales", "o": ["Solicitar al GAFI que incluya a esa jurisdicción en su declaración pública de países con deficiencias estratégicas PBC/FT", "Abstenerse de actuar, porque esas filiales solo las supervisa la autoridad local", "Informar al supervisor de acogida de que el banco podría quedar sujeto a actuaciones supervisoras adicionales", "Ordenar al banco que aplique en la jurisdicción de acogida las normas locales, aunque sean menos estrictas que las del grupo"], "x": "El párr. 93 prevé que, si las trabas resultan insuperables y no hay arreglo alternativo satisfactorio, los supervisores de origen deberán informar al supervisor de acogida de que el banco podría quedar sujeto a actuaciones supervisoras adicionales, como reforzar las medidas sobre el grupo, «incluida, en su caso», la exigencia de cerrar operaciones en esa jurisdicción. No se prevé acudir al GAFI ni abstenerse.", "ref": "Párr. 93"}, {"id": "B054", "tema": "int", "tipo": "memoria", "q": "Si la legislación de una jurisdicción de acogida restringe la divulgación de información de clientes a «terceros», ¿qué considera fundamental el Comité según el párrafo 95?", "a": "Que la oficina central o banco matriz y los supervisores de origen queden claramente excluidos de la definición de terceros", "o": ["Que la oficina central obtenga en cada caso el consentimiento expreso del cliente antes de recibir cualquier información suya", "Que la oficina central o banco matriz y los supervisores de origen queden claramente excluidos de la definición de terceros", "Que la sucursal o filial deje de transmitir información a su matriz mientras la legislación local mantenga la restricción", "Que la información se transmita a los supervisores de acogida, quienes decidirán si la comparten con los de origen"], "x": "El párr. 95 dice que no hay razones que justifiquen impedir la transmisión de información de clientes a la oficina central o banco matriz con fines de gestión del riesgo, y que, si la ley local restringe la divulgación a «terceros», «es fundamental» que la oficina central o banco matriz y los supervisores de origen queden claramente excluidos de esa definición. Además, insta a levantar esas restricciones.", "ref": "Párr. 95"}, {"id": "B055", "tema": "gru", "tipo": "caso", "q": "Grupo Estela tiene una filial en un país de acogida cuyos requisitos PBC/FT son más estrictos que los de la política del grupo. Según el párrafo 63:", "a": "La política del grupo deberá permitir a la filial adoptar y aplicar los requisitos locales de la jurisdicción de acogida", "o": ["La filial podrá elegir cada año entre la política del grupo o la local, siempre que documente por escrito su decisión", "La política del grupo deberá permitir a la filial adoptar y aplicar los requisitos locales de la jurisdicción de acogida", "La oficina central deberá pedir al supervisor de acogida una dispensa para que la filial aplique solo la política del grupo", "La filial deberá aplicar la política del grupo, porque la coherencia de todo el grupo prevalece sobre la norma local"], "x": "El párr. 63 pide políticas PBC/FT a escala de grupo coherentes, pero cuando los requisitos de acogida sean más estrictos que los del grupo, «la política del grupo deberá permitir a la sucursal o filial de que se trate adoptar y aplicar los requisitos locales». La coherencia del grupo no se usa para rebajar el estándar local más exigente.", "ref": "Párr. 63"}, {"id": "B056", "tema": "gru", "tipo": "memoria", "q": "Cuando los requisitos reglamentarios o legales mínimos de los países de origen y de acogida difieren, ¿qué normas aplican las oficinas ubicadas en las jurisdicciones de acogida según el párrafo 64?", "a": "Las más estrictas", "o": ["Las más estrictas", "Las del país de origen", "Las del país de acogida", "Las que elija la oficina central"], "x": "El párr. 64 concluye: «Cuando los requisitos reglamentarios o legales mínimos de los países de origen y acogida difieran, las oficinas ubicadas en las jurisdicciones de acogida aplicarán las normas más estrictas». No es siempre la del origen ni siempre la local: es la más exigente de las dos. El párr. 89 retoma la idea desde la óptica del supervisor.", "ref": "Párr. 64"}, {"id": "B057", "tema": "gru", "tipo": "caso", "q": "La sucursal de Banco Cénit en un país de acogida no puede aplicar adecuadamente las normas PBC/FT porque ese país no lo permite. Conforme al párrafo 65, ¿qué procede?", "a": "Que el responsable ejecutivo de PBC/FT informe a los supervisores de origen y se contemplen medidas adicionales", "o": ["Que el responsable ejecutivo de PBC/FT informe a los supervisores de origen y se contemplen medidas adicionales", "Que el auditor externo de la sucursal informe al supervisor de acogida y se suspenda la aplicación de la política del grupo", "Que la sucursal aplique las normas locales y lo informe al grupo en su reporte anual", "Que la oficina central cierre la sucursal, porque el cierre es la medida prevista sin valorar otras alternativas"], "x": "El párr. 65, conforme a las normas GAFI (nota interpretativa a la R. 18), dice que si el país de acogida no permite la adecuada aplicación de las normas, el responsable ejecutivo de PBC/FT deberá informar a los supervisores de origen y deberán contemplarse medidas adicionales, «incluida, cuando proceda, la cancelación de las operaciones». El cierre es una opción posible, no la única ni automática.", "ref": "Párr. 65"}, {"id": "B058", "tema": "gru", "tipo": "memoria", "q": "¿Por qué reconoce el Comité, en el párrafo 66, que aplicar procedimientos PBC/FT en todo el grupo es más difícil que muchos otros procesos de gestión del riesgo?", "a": "Porque algunas jurisdicciones siguen limitando la capacidad de los bancos para comunicar nombres y saldos de clientes a otros países", "o": ["Porque las filiales, a diferencia de las sucursales, no están autorizadas a intercambiar información de clientes con la oficina central", "Porque algunas jurisdicciones siguen limitando la capacidad de los bancos para comunicar nombres y saldos de clientes a otros países", "Porque las normas GAFI prohíben a los grupos bancarios centralizar la información de sus clientes en la jurisdicción de origen del grupo", "Porque las diferencias contables entre países impiden consolidar con suficiente precisión los saldos de los clientes a escala del grupo"], "x": "El párr. 66 explica la dificultad así: «algunas jurisdicciones continúan limitando la capacidad de los bancos para comunicar nombres y saldos de clientes a otros países». Por eso considera fundamental que, con las debidas salvaguardas jurídicas, los bancos puedan intercambiar información con su oficina central o banco matriz, y aclara que «esto es aplicable tanto a sucursales como a filiales».", "ref": "Párr. 66"}, {"id": "B059", "tema": "gru", "tipo": "memoria", "q": "Según el párrafo 67, ¿cuáles pueden ser factores mitigadores del riesgo asociado a los clientes en el grupo?", "a": "Información adicional del cliente, seguimientos más estrechos, actualizaciones más frecuentes y visitas al domicilio", "o": ["Aprobación del supervisor de acogida, cuestionarios del grupo, informes de burós de crédito y confirmaciones de otros bancos", "Información adicional del cliente, seguimientos más estrechos, actualizaciones más frecuentes y visitas al domicilio", "Certificaciones de terceros, seguros de responsabilidad, garantías reales del cliente y auditorías externas de periodicidad anual", "Declaraciones escritas del cliente, cierre de cuentas vinculadas y avisos previos al cliente"], "x": "El párr. 67 dice que los factores mitigadores «pueden incluir información adicional del cliente, seguimientos más estrechos, actualizaciones más frecuentes de datos personales y visitas de personal del banco al domicilio del cliente». Los distractores combinan medidas de otros contextos (certificaciones de terceros del Anexo 1, cuestionarios del Anexo 2) o que no aparecen en el texto.", "ref": "Párr. 67"}, {"id": "B060", "tema": "gru", "tipo": "caso", "q": "Grupo Aurora clasifica a sus clientes con criterios de alto riesgo distintos en cada filial y en sus actividades subcontratadas. Según el párrafo 67, ¿qué deberá corregir?", "a": "Aplicar los mismos criterios en todo el banco, sus filiales, sucursales y actividades subcontratadas", "o": ["Aplicar criterios comunes en la oficina central, dejando libres a las filiales y a las actividades subcontratadas", "Aplicar criterios comunes en filiales y sucursales, excluyendo las actividades subcontratadas por ser de terceros", "Nada: cada filial debe fijar sus propios criterios de alto riesgo", "Aplicar los mismos criterios en todo el banco, sus filiales, sucursales y actividades subcontratadas"], "x": "El párr. 67 dice que los criterios para identificar a clientes de alto riesgo «deberán aplicarse en todo el banco, sus filiales y sucursales y en las actividades subcontratadas» y que los clientes de alto riesgo se identifican con esos mismos criterios en todo el grupo. El distractor tentador se apoya en otra idea real del párrafo: la política del grupo debe reconocer que una misma categoría podría plantear riesgos distintos en distintas jurisdicciones; eso no autoriza criterios propios por filial.", "ref": "Párr. 67"}, {"id": "B061", "tema": "gru", "tipo": "caso", "q": "Banco Delta recibe un cliente recomendado por una filial de su mismo grupo financiero, sujeta a las mismas normas y supervisada a escala del grupo. Según el párrafo 69:", "a": "Podrá sopesar conceder mayor fiabilidad a su información, pero deberá cerciorarse de obtener la información del cliente", "o": ["Deberá repetir íntegramente la CDD, porque no puede otorgar mayor fiabilidad a ningún presentador interno", "Podrá sopesar conceder mayor fiabilidad a su información, pero deberá cerciorarse de obtener la información del cliente", "Podrá prescindir de obtener la información del cliente, porque la filial ya la conserva a escala del grupo", "Deberá rechazar la recomendación, porque no se admite recurrir a presentadores del mismo grupo financiero"], "x": "El párr. 69 permite recurrir a un presentador del mismo grupo y «sopesar conceder un mayor grado de fiabilidad» a su información, siempre que esté sujeto a las mismas normas y su aplicación se supervise a escala del grupo. Pero el banco «deberá cerciorarse de que obtiene la información del cliente», porque podría tener que remitirla a las FIU si una transacción resulta sospechosa.", "ref": "Párr. 69"}, {"id": "B062", "tema": "gru", "tipo": "trampa", "q": "Sobre el recurso a los procedimientos de otros bancos cuando se recomienda un negocio, ¿qué afirmación NO se ajusta al párrafo 69?", "a": "El banco puede recurrir a presentadores sujetos a normas menos estrictas si ya identificaron al cliente", "o": ["La información del cliente recomendado podría tener que remitirse a las FIU si una transacción resultara sospechosa", "El banco puede recurrir a presentadores sujetos a normas menos estrictas si ya identificaron al cliente", "El banco deberá entender el grado en que la legislación PBC/FT le permite recurrir a procedimientos de otros bancos", "Los bancos vigilarán y evaluarán las normas PBC/FT de la jurisdicción del banco que recomienda"], "x": "El párr. 69 es tajante: «El banco no deberá recurrir a presentadores que estén sujetos a normas menos estrictas que las que rigen sus propios procedimientos PBC/FT». Que el presentador ya haya identificado al cliente no cambia esa regla. Las otras tres afirmaciones reproducen el mismo párrafo.", "ref": "Párr. 69"}, {"id": "B063", "tema": "gru", "tipo": "caso", "q": "Banco Horizonte tiene actividad nacional e internacional, con filiales en cuatro países. Según el párrafo 75, ¿qué figura deberá nombrar y cuál es su responsabilidad central?", "a": "Un responsable de PBC/FT del grupo que cree, coordine y evalúe a escala del grupo una única estrategia PBC/FT", "o": ["Un responsable PBC/FT en cada filial, con total autonomía para definir su estrategia sin coordinación central", "Un auditor interno de grupo que apruebe las estrategias PBC/FT que cada filial diseñe para su jurisdicción", "Un comité de filiales que vote cada año las políticas PBC/FT, sin facultades para impartir órdenes a las entidades", "Un responsable de PBC/FT del grupo que cree, coordine y evalúe a escala del grupo una única estrategia PBC/FT"], "x": "El párr. 75 dice que los bancos con actividad nacional e internacional deberán nombrar un responsable ejecutivo de PBC/FT para todo el grupo, con la responsabilidad de «crear, coordinar y evaluar a escala del grupo la aplicación de una única estrategia PBC/FT», que incluye políticas obligatorias y autorización para impartir órdenes a todas las sucursales, filiales y entidades subordinadas.", "ref": "Párr. 75"}, {"id": "B064", "tema": "gru", "tipo": "caso", "q": "El responsable de PBC/FT de Grupo Faro quiere verificar el cumplimiento en una sucursal extranjera del grupo. Según el párrafo 76, ¿qué puede hacer?", "a": "Cerciorarse del cumplimiento, incluso con visitas periódicas in situ, y en caso necesario impartir órdenes en todo el grupo", "o": ["Revisar el cumplimiento de requisitos nacionales, porque los internacionales corresponden a cada jurisdicción de acogida", "Cerciorarse del cumplimiento, incluso con visitas periódicas in situ, y en caso necesario impartir órdenes en todo el grupo", "Emitir recomendaciones no vinculantes, ya que la facultad de impartir órdenes corresponde a cada filial o sucursal", "Pedir informes escritos, porque las visitas in situ corresponden a los supervisores de acogida y no al grupo"], "x": "El párr. 76 dice que la función del responsable de PBC/FT del grupo incluye el seguimiento continuo del cumplimiento de requisitos nacionales e internacionales en todo el grupo; deberá cerciorarse del cumplimiento «incluso realizando visitas periódicas in situ» y, en caso necesario, «deberá estar facultado para impartir órdenes o adoptar las medidas oportunas en todo el grupo».", "ref": "Párr. 76"}, {"id": "B065", "tema": "gru", "tipo": "memoria", "q": "Según el párrafo 77, ¿qué deberían estar obligadas a hacer las filiales y sucursales en materia de intercambio de información dentro del grupo?", "a": "Suministrar de forma proactiva a la oficina central información sobre clientes y actividades de alto riesgo y atender sus solicitudes a tiempo", "o": ["Compartir la información de clientes solo entre sucursales y filiales, sin informar a la oficina central para proteger los datos locales", "Suministrar a la oficina central la información que esta les solicite de forma expresa, sin enviarle nada por iniciativa propia", "Suministrar de forma proactiva a la oficina central información sobre clientes y actividades de alto riesgo y atender sus solicitudes a tiempo", "Remitir directamente a la UIF del país de origen la información de clientes de alto riesgo, sin hacerla pasar por la oficina central"], "x": "El párr. 77 dice que las filiales y sucursales «deberían estar obligadas a suministrar de forma proactiva a la oficina central información sobre clientes y actividades de alto riesgo» relevante para las normas globales, y a responder de manera oportuna a las solicitudes de la oficina central o banco matriz. La clave que confunde es «proactiva»: no basta con esperar a que la oficina central pregunte.", "ref": "Párr. 77"}, {"id": "B066", "tema": "gru", "tipo": "caso", "q": "La sucursal de Banco Brújula en un país de acogida notifica actividad potencialmente sospechosa de un cliente. Según el párrafo 79, ¿qué deberá hacer la función global de gestión del riesgo BC/FT del grupo?", "a": "Evaluar los riesgos y comprobar si otras sucursales o filiales mantienen cuentas del mismo cliente o de partes vinculadas", "o": ["Ordenar el cierre inmediato de todas las cuentas del cliente en el grupo, sin evaluar los riesgos ni valorar otras medidas", "Evaluar los riesgos y comprobar si otras sucursales o filiales mantienen cuentas del mismo cliente o de partes vinculadas", "Limitarse a archivar la notificación, pues evaluar el riesgo del cliente corresponde a la sucursal que lo detectó y no al grupo", "Remitir el caso al supervisor de acogida y abstenerse de consultar a otras entidades del grupo por razones de privacidad"], "x": "El párr. 79 dice que la función global deberá evaluar los posibles riesgos de las actividades notificadas por sucursales y filiales y, cuando proceda, los riesgos en todo el grupo, y contar con procedimientos para comprobar si otras sucursales o filiales mantienen cuentas del mismo cliente, incluidas partes vinculadas o de su mismo grupo. Las restricciones y el cierre de cuentas se prevén «cuando proceda», no en automático.", "ref": "Párr. 79"}, {"id": "B067", "tema": "gru", "tipo": "caso", "q": "La oficina central de Grupo Atlas recibe un listado de individuos sospechosos de colaborar en actividades de FT. Según el párrafo 80, ¿qué puede exigir a sus sucursales y filiales?", "a": "Que cotejen sus archivos con ese listado y notifiquen las coincidencias", "o": ["Que confirmen que cuentan con sistemas automáticos de detección, sin cotejar", "Nada, porque cada filial coteja listados por orden de su autoridad local, no del grupo", "Que bloqueen todas las cuentas de clientes del país señalado en el listado", "Que cotejen sus archivos con ese listado y notifiquen las coincidencias"], "x": "El párr. 80 dice que la oficina central «ha de poder exigir a todas sus sucursales y filiales el cotejo de sus archivos con determinados listados o solicitudes» para comprobar la presencia de individuos u organizaciones sospechosos de colaborar e instigar BC y FT, «y que notifiquen las coincidencias». No se trata de bloquear por país ni de depender solo de la autoridad local.", "ref": "Párr. 80"}, {"id": "B068", "tema": "gru", "tipo": "caso", "q": "Grupo Prisma, que integra un banco, una casa de valores y una aseguradora, ofrece seguros a clientes bancarios mediante ventas cruzadas. Según los párrafos 82 y 83, ¿qué debe cuidar?", "a": "Estar atento a las diferencias entre sectores y aplicar los requisitos PBC/FT oportunos a los correspondientes sectores", "o": ["Aplicar a la aseguradora exactamente los requisitos bancarios, porque no se admiten variaciones entre sectores del grupo", "Estar atento a las diferencias entre sectores y aplicar los requisitos PBC/FT oportunos a los correspondientes sectores", "Tratar cada sector por separado, sin intercambiar información sobre la identidad de los clientes entre sus distintas unidades", "Aplicar a todos los sectores los requisitos del sector con normas menos estrictas, a fin de facilitar las ventas cruzadas"], "x": "El párr. 83 reconoce que las diferencias entre sectores «podrán requerir o justificar variaciones» de los requisitos PBC/FT y pide al grupo estar atento a ellas en las ventas cruzadas, aplicando los requisitos oportunos a cada sector. El párr. 82 añade que los grupos mixtos deberán vigilar e intercambiar información sobre identidad, transacciones y cuentas en todo el grupo, y estar atentos a clientes que usan servicios de diferentes sectores.", "ref": "Párr. 82–83"}, {"id": "B069", "tema": "gru", "tipo": "memoria", "q": "Cuando un gran banco centraliza sistemas de procesamiento y bases de datos, ¿qué deberá hacer según el párrafo 74?", "a": "Documentar e integrar las funciones locales y centralizadas de seguimiento para vigilar patrones en todo el grupo", "o": ["Mantener separados el seguimiento local y el centralizado para que cada uno vigile solo los patrones de su ámbito", "Eliminar el seguimiento local, pues la vigilancia centralizada sustituye por completo a la de cada sucursal o filial", "Solicitar autorización a cada supervisor de acogida antes de trasladar datos de clientes a los sistemas centrales", "Documentar e integrar las funciones locales y centralizadas de seguimiento para vigilar patrones en todo el grupo"], "x": "El párr. 74 dice que, al centralizar sistemas y bases de datos, el banco deberá documentar e integrar adecuadamente las funciones locales y centralizadas de seguimiento de transacciones y cuentas, para vigilar patrones de posibles actividades sospechosas «en todo el grupo y no solo a escala local o centralizada». Integrar es lo opuesto a eliminar o separar.", "ref": "Párr. 74"}, {"id": "B070", "tema": "gru", "tipo": "memoria", "q": "Según el párrafo 73, ¿qué alcance tiene la vigilancia a escala consolidada de las relaciones, saldos y actividades de importancia con clientes?", "a": "Abarca cuentas dentro o fuera del balance, activos en administración o en fideicomiso, sin importar dónde se mantengan", "o": ["Abarca las cuentas que se mantengan en la jurisdicción de origen de la oficina central, no las del extranjero", "Abarca solo las cuentas registradas dentro del balance de la oficina central, sin incluir las de las filiales extranjeras", "Abarca las cuentas dentro y fuera del balance, pero excluye los activos en administración y los fideicomisos del grupo", "Abarca cuentas dentro o fuera del balance, activos en administración o en fideicomiso, sin importar dónde se mantengan"], "x": "El párr. 73 dice que el banco deberá vigilar a escala consolidada las relaciones, saldos y actividades de importancia con clientes, «con independencia de si las cuentas se mantienen dentro del balance, fuera del balance, como activos en administración o en fideicomiso, e independientemente del lugar en que se mantengan». Además, debe integrar la información considerando a los beneficiarios efectivos y los fondos.", "ref": "Párr. 73"}, {"id": "B071", "tema": "anx", "tipo": "memoria", "q": "Según el Anexo 1, ¿qué exigen las normas GAFI a la institución financiera que recurre a un tercero para practicar la CDD?", "a": "Obtener inmediatamente la información necesaria sobre las tres medidas CDD objeto del recurso", "o": ["Obtener la información CDD solo cuando el supervisor la solicite", "Obtener inmediatamente la información necesaria sobre las tres medidas CDD objeto del recurso", "Practicar de nuevo las tres medidas CDD al inicio de la relación, sin poder apoyarse en la CDD del tercero", "Obtener la información de las tres medidas CDD dentro del plazo de conservación de registros de cinco años"], "x": "El Anexo 1, párr. 2, enumera las tres medidas que las normas GAFI permiten confiar a un tercero: (a) identificar y verificar al cliente; (b) identificar al beneficiario efectivo y adoptar medidas razonables para verificarlo; y (c) entender la finalidad y naturaleza prevista de la relación. Y añade que la institución que recurre al tercero debe obtener «inmediatamente» la información necesaria sobre esas tres medidas. El plazo de cinco años es de conservación de registros (párr. 52), no para obtener la información.", "ref": "Anexo 1, párr. 2"}, {"id": "B072", "tema": "anx", "tipo": "caso", "q": "Banco Mirador firma un contrato con una red de agentes hipotecarios para que apliquen, en nombre del banco, sus procedimientos de identificación de clientes. ¿Qué figura del Anexo 1 es esta?", "a": "Subcontratación o agencia", "o": ["Subcontratación o agencia", "Presentador del mismo grupo financiero", "Banca corresponsal anidada", "Recurso a terceros"], "x": "El Anexo 1, párr. 4, describe la subcontratación o agencia: el banco usa terceros, mediante vínculo contractual, para cumplir partes de sus obligaciones CDD, y la entidad subcontratada aplica las medidas en nombre del banco. En el recurso a terceros (párr. 2), en cambio, el banco se apoya en la CDD que ya practicó otra institución supervisada, que normalmente tiene una relación previa con el cliente. Los agentes hipotecarios son ejemplo de terceros usados por los bancos (párr. 13).", "ref": "Anexo 1, párr. 4"}, {"id": "B073", "tema": "anx", "tipo": "caso", "q": "Banco Vereda acepta a un cliente apoyándose en la CDD que ya le practicó otra institución financiera supervisada, con la que el cliente tenía una relación comercial previa. ¿Qué figura del Anexo 1 es esta?", "a": "Recurso a terceros", "o": ["Recurso a terceros", "Relación de agente y principal", "Subcontratación o agencia", "Corresponsalía bancaria"], "x": "El Anexo 1, párr. 2, describe el recurso a terceros: el banco se apoya en la CDD practicada por otras instituciones financieras o determinadas empresas o profesiones no financieras supervisadas; normalmente el tercero tiene una relación previa con el cliente. En la subcontratación o agencia, en cambio, el tercero actúa por contrato en nombre del banco y aplica las políticas de este (párr. 4 y 11).", "ref": "Anexo 1, párr. 2"}, {"id": "B074", "tema": "anx", "tipo": "memoria", "q": "Según el Anexo 1, ¿qué efecto tiene sobre la responsabilidad del banco recurrir a otro banco o institución financiera para practicar la CDD?", "a": "En modo alguno lo libera de su responsabilidad sobre la CDD y los demás requisitos PBC/FT", "o": ["Lo libera de la responsabilidad CDD si el tercero está en su misma jurisdicción y es supervisado", "Traslada al tercero la responsabilidad CDD si hay acuerdo escrito", "En modo alguno lo libera de su responsabilidad sobre la CDD y los demás requisitos PBC/FT", "Hace que la responsabilidad se comparta a partes iguales con el tercero durante toda la relación"], "x": "El Anexo 1, párr. 6, dice que el recurso a otro banco o institución financiera «en modo alguno libera al banco» de la responsabilidad de tener políticas y procedimientos CDD adecuados y de cumplir otros requisitos PBC/FT, como conocer la actividad prevista, si el cliente es de alto riesgo o si hay transacciones sospechosas. El acuerdo escrito es un criterio de evaluación, no una transferencia de responsabilidad.", "ref": "Anexo 1, párr. 6"}, {"id": "B075", "tema": "anx", "tipo": "cifra", "q": "¿Cuántos criterios relevantes enumera el Anexo 1 para evaluar la razonabilidad del recurso a otro banco o institución financiera?", "a": "9 criterios, de (a) a (i)", "o": ["9 criterios, de (a) a (i)", "14 criterios, de (a) a (n)", "4 criterios, de (a) a (d)", "5 criterios, de (i) a (v)"], "x": "El Anexo 1, párr. 7, enumera 9 criterios, de (a) a (i): regulación y supervisión tan exhaustivas y relación previa; acuerdo por escrito; documentación y controles; posible certificación del tercero; información pública desfavorable; riesgo de cadenas; recurso a terceros como factor de riesgo; examen periódico; y contemplar el cese. No lo confundas con los 4 incisos del contrato de subcontratación (párr. 14) ni con los 9 factores de corresponsalía (Anexo 2).", "ref": "Anexo 1, párr. 7"}, {"id": "B076", "tema": "anx", "tipo": "caso", "q": "Banco Sabino evalúa apoyarse en la CDD de otra institución que ha sido sometida a medidas coercitivas por violaciones en materia PBC. Según los criterios del Anexo 1, ¿qué corresponde?", "a": "Tener debidamente en cuenta esa información pública desfavorable sobre el tercero", "o": ["Ignorarla, porque lo único relevante es que el tercero tenga relación previa con el cliente", "Pedir al supervisor del tercero que autorice de forma expresa el recurso del banco a su CDD", "Ignorarla si el tercero certifica por escrito que ya corrigió sus deficiencias en materia PBC", "Tener debidamente en cuenta esa información pública desfavorable sobre el tercero"], "x": "El criterio (e) del Anexo 1, párr. 7, dice que el banco deberá tener debidamente en cuenta informaciones públicas desfavorables sobre el tercero, «como estar sometido a medidas coercitivas por causa de deficiencias o violaciones en materia de PBC». La certificación del criterio (d) («podrá exigirse») es un criterio adicional; no permite ignorar el (e).", "ref": "Anexo 1, párr. 7"}, {"id": "B077", "tema": "anx", "tipo": "caso", "q": "Banco Tejo recibe la CDD de un tercero que, a su vez, se apoyó en la CDD practicada por otras dos entidades. Según los criterios del Anexo 1, ¿qué deberá hacer?", "a": "Identificar y mitigar el riesgo adicional de recurrir a esa cadena de recursos en vez de a una sola entidad", "o": ["Identificar y mitigar el riesgo adicional de recurrir a esa cadena de recursos en vez de a una sola entidad", "Aceptarla sin más, porque una cadena equivale a una relación directa con una sola entidad", "Rechazarla, porque el Anexo 1 prohíbe con carácter general las cadenas de recurso a terceros para la CDD", "Solicitar a cada entidad de la cadena que certifique ante el supervisor su programa PBC/FT de cada ejercicio anual"], "x": "El criterio (f) del Anexo 1, párr. 7, dice que el banco deberá identificar y mitigar cualquier riesgo adicional que plantee recurrir a una multitud de terceros (una cadena de recursos) en vez de mantener una relación directa con una sola entidad. El párr. 3 menciona que algunos países prohíben las cadenas, pero eso es una limitación nacional posible, no una prohibición general del Anexo.", "ref": "Anexo 1, párr. 7"}, {"id": "B078", "tema": "anx", "tipo": "caso", "q": "Banco Lumen opera solo por internet y encarga a una empresa externa la identificación de sus clientes en su nombre. Una revisión detecta fallas en esa CDD. Según el Anexo 1, ¿en quién recae la responsabilidad de satisfacer los requisitos CDD?", "a": "En el banco, aunque las funciones las desarrolle un tercero", "o": ["En la empresa externa, por haber asumido las funciones por contrato", "En el banco, aunque las funciones las desarrolle un tercero", "En ambos por igual, conforme al acuerdo escrito que hayan celebrado", "En el supervisor, que autorizó el modelo de negocio del banco digital"], "x": "El Anexo 1, párr. 9, dice: «Aunque las funciones de cumplimiento de PBC/FT pueden ser desarrolladas por terceros, la responsabilidad de satisfacer los requisitos CDD y PBC/FT continúa recayendo en el banco». También señala que los bancos que operan por teléfono o internet suelen usar terceros en mayor medida. El contrato escrito documenta obligaciones del tercero, pero no traslada la responsabilidad.", "ref": "Anexo 1, párr. 9"}, {"id": "B079", "tema": "anx", "tipo": "caso", "q": "En el contrato de Banco Quetzal con un despacho de abogados que identifica clientes en su nombre, ¿qué debe garantizarse cuando el cliente esté presente en persona, según el Anexo 1?", "a": "Que el tercero inspeccione los documentos de identificación originales cuando la regulación o el banco lo requieran", "o": ["Que el tercero sustituya la identificación por una declaración jurada del cliente, conservando solo una copia simple", "Que el tercero aplique sus propios procedimientos de identificación, aunque difieran de los requisitos del banco", "Que el tercero omita la verificación, pues la presencia física del cliente basta para tener por verificada su identidad", "Que el tercero inspeccione los documentos de identificación originales cuando la regulación o el banco lo requieran"], "x": "El Anexo 1, párr. 14 (b), exige que el acuerdo escrito garantice que, cuando el cliente esté presente en persona, el tercero aplica procedimientos que incluyen «la inspección de los documentos de identificación originales cuando la regulación o el banco así lo requieran». El contrato también debe exigir la aplicación de los requisitos del banco (a), los requisitos para clientes no presentes (c) y la confidencialidad (d).", "ref": "Anexo 1, párr. 14"}, {"id": "B080", "tema": "anx", "tipo": "trampa", "q": "Sobre la relación de subcontratación o agencia descrita en el Anexo 1, ¿qué afirmación NO es correcta?", "a": "El agente es legalmente independiente del banco, por lo que el cliente trata con un tercero ajeno a este", "o": ["Deberá existir un acuerdo por escrito que establezca las obligaciones PBC/FT y cómo las ejecutará el tercero", "El agente suele ser una prolongación legal del banco, y el tercero está obligado a aplicar sus políticas", "El agente es legalmente independiente del banco, por lo que el cliente trata con un tercero ajeno a este", "Los terceros no siempre están sujetos a obligaciones PBC/FT propias, aunque muchos suelen estarlo"], "x": "El Anexo 1, párr. 11, dice que, con arreglo a la legislación sobre agente y principal, «el agente suele ser una prolongación legal del banco» y que, cuando el cliente trata con un agente, «legalmente está tratando con el propio banco»; por eso el tercero debe aplicar las políticas del banco. El acuerdo escrito está en el párr. 10 y la nota de que los terceros no siempre están sujetos a obligaciones PBC/FT, en el párr. 12.", "ref": "Anexo 1, párr. 11"}, {"id": "B081", "tema": "anx", "tipo": "caso", "q": "Banco Norteño presta a Banco Isleño servicios de transferencias internacionales y compensación de cheques, porque Isleño no tiene red internacional. Según el Anexo 2, ¿quién es quién?", "a": "Norteño es el banco corresponsal y su cliente es Isleño, el banco correspondiente", "o": ["Isleño es el banco corresponsal y su cliente es Norteño, el banco correspondiente", "Norteño es el banco correspondiente y los clientes de Isleño son también sus clientes", "Norteño es el banco corresponsal y su cliente es Isleño, el banco correspondiente", "Ambos son corresponsales y los clientes de Isleño son clientes directos de Norteño"], "x": "Conforme al Glosario del GAFI citado en el Anexo 2, párr. 1, la banca corresponsal es la provisión de servicios bancarios por un banco (el «corresponsal») a otro banco (el «correspondiente»). El párr. 3 precisa que el corresponsal no tiene por lo general relaciones directas con los clientes del correspondiente y que «el cliente del banco corresponsal es el banco correspondiente». Regla: el corresponsal presta; el correspondiente recibe.", "ref": "Anexo 2, párr. 3"}, {"id": "B082", "tema": "anx", "tipo": "trampa", "q": "¿Cuál de los siguientes NO figura entre los factores que deberán considerar los bancos corresponsales según el Anexo 2?", "a": "El número de cajeros automáticos que opera el banco correspondiente en su país", "o": ["La posible utilización de la cuenta en una relación anidada", "La situación y calidad de la regulación y supervisión bancaria en el país del banco correspondiente", "El grupo al que pertenece el banco correspondiente y las jurisdicciones de sus filiales y sucursales", "El número de cajeros automáticos que opera el banco correspondiente en su país"], "x": "El Anexo 2, párr. 7, enumera 9 factores: (a) jurisdicción del correspondiente; (b) su grupo y las jurisdicciones de filiales y sucursales; (c) gestión, propiedad (beneficiarios efectivos o PEP), reputación, actividades, clientes y establecimientos; (d) finalidad de los servicios; (e) su negocio, mercados y base de clientes; (f) calidad de regulación y supervisión en su país; (g) sus políticas PBC y su CDD; (h) capacidad de conocer a terceros facultados a usar los servicios; e (i) corresponsalía anidada. La red de cajeros no aparece.", "ref": "Anexo 2, párr. 7"}, {"id": "B083", "tema": "anx", "tipo": "caso", "q": "El director comercial de Banco Faro Sur quiere abrir una relación de corresponsalía con un banco extranjero que recibirá sus servicios. Según el Anexo 2, ¿quién deberá aprobar establecerla?", "a": "La alta dirección del banco corresponsal", "o": ["El supervisor del país en que opera el banco correspondiente", "El responsable de cumplimiento del banco correspondiente", "El director comercial de la línea de negocio del corresponsal", "La alta dirección del banco corresponsal"], "x": "El Anexo 2, párr. 12, dice que «la decisión de establecer (o continuar) una relación de corresponsalía bancaria deberá ser aprobada por la alta dirección del banco corresponsal». Faro Sur presta los servicios, así que es el corresponsal. El párr. 17 añade que la alta dirección deberá ser informada periódicamente de las relaciones de alto riesgo y de su seguimiento.", "ref": "Anexo 2, párr. 12"}, {"id": "B084", "tema": "anx", "tipo": "caso", "q": "Banco Coral recibe una solicitud de corresponsalía de un banco constituido en una jurisdicción donde no tiene presencia física y que no forma parte de un grupo financiero regulado. Según el Anexo 2:", "a": "Debería negarse a establecer la relación, por tratarse de un banco simulado", "o": ["Podría establecerla si el solicitante responde un cuestionario PBC/FT completo", "Debería consultar primero al GAFI si esa jurisdicción está sujeta a medidas correctivas", "Debería negarse a establecer la relación, por tratarse de un banco simulado", "Podría establecerla con diligencia reforzada y aprobación de su alta dirección"], "x": "El Anexo 2, párr. 14, dice que los bancos corresponsales «deberían negarse» a establecer o continuar una relación con un banco constituido en una jurisdicción donde no tenga presencia física y que no forme parte de un grupo financiero regulado, es decir, bancos simulados. Ni la diligencia reforzada ni el cuestionario (párr. 8) sustituyen esa negativa.", "ref": "Anexo 2, párr. 14"}, {"id": "B085", "tema": "anx", "tipo": "caso", "q": "Banco Granada decide permitir que clientes de su banco correspondiente usen directamente la cuenta de corresponsalía para sus propios negocios. Según el Anexo 2, ¿qué deberá hacer?", "a": "Intensificar el seguimiento y verificar que el correspondiente practicó una CDD adecuada a esos clientes", "o": ["Practicar directamente la CDD completa a cada cliente, sustituyendo la que haya aplicado el banco correspondiente", "Aplicar el seguimiento ordinario, porque el cliente del corresponsal sigue siendo solo el banco correspondiente", "Intensificar el seguimiento y verificar que el correspondiente practicó una CDD adecuada a esos clientes", "Informar a la alta dirección una vez al año, sin intensificar el seguimiento"], "x": "El Anexo 2, párr. 16, dice que si el corresponsal permite a terceros el uso directo de cuentas de corresponsalía (por ejemplo, cuentas de transferencia de pagos en otras plazas), deberá intensificar el seguimiento según sus riesgos y verificar que el correspondiente practicó una CDD adecuada a los clientes con acceso directo y que puede ofrecer información CDD relevante a solicitud del corresponsal.", "ref": "Anexo 2, párr. 16"}, {"id": "B086", "tema": "anx", "tipo": "memoria", "q": "Según el Anexo 2, ¿cómo deben entender los bancos el proceso CDD en sus relaciones de corresponsalía bancaria?", "a": "Como una evaluación real del riesgo BC, no como un «ejercicio de recogida de papel»", "o": ["Como un trámite documental que se agota al recibir el cuestionario del banco correspondiente", "Como una tarea delegable por completo en el supervisor del correspondiente", "Como una evaluación real del riesgo BC, no como un «ejercicio de recogida de papel»", "Como una revisión única al inicio de la relación, que no requiere una actualización posterior"], "x": "El Anexo 2, párr. 10, dice que los bancos no deberán considerar el proceso CDD como un «ejercicio de recogida de papel», sino como una evaluación real del riesgo BC; si es necesario, la recogida de información concluye con reuniones con la dirección y el responsable de cumplimiento del correspondiente, su regulador, las UIF y otras agencias. El párr. 11 añade que la información se revisa y actualiza periódicamente con enfoque de riesgo.", "ref": "Anexo 2, párr. 10"}, {"id": "B087", "tema": "anx", "tipo": "caso", "q": "Banco Pampa, como corresponsal, mantiene relaciones con tres filiales de un mismo grupo extranjero ubicadas en distintos países. Según el Anexo 2 (caso 2), ¿cómo debe evaluar el riesgo?", "a": "Tener en cuenta que pertenecen al mismo grupo, pero evaluar también los riesgos de cada relación comercial", "o": ["Tener en cuenta que pertenecen al mismo grupo, pero evaluar también los riesgos de cada relación comercial", "Evaluar cada relación como si fueran bancos sin vínculo, sin considerar que forman parte del mismo grupo", "Delegar la evaluación en la oficina central del grupo extranjero y limitarse a recibir sus conclusiones", "Evaluar a la oficina central del grupo extranjero, cuya evaluación cubre también a todas sus filiales"], "x": "El Anexo 2, párr. 19 (caso 2), dice que si el corresponsal mantiene relaciones con varias entidades de un mismo grupo en distintos países, deberá tener en cuenta que pertenecen al mismo grupo y, «aun así», evaluar los riesgos BC/FT de cada relación comercial. No lo confundas con <script>

    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+

  $("#sitebar").hidden=false;
}
const mapa0 = D.secciones.find(s=>s.tipo==="mapa");
let rhythm = "";
if(Array.isArray(D.meta.ritmo)){ // ritmo puesto a mano: [{n, lb, q, color}]

  rhythm = `<div><div class="rhythm${R0.length>4?" many":""}">${R0.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${esc(r.n)}</span><span class="lb">${esc(r.lb||"")}</span><span class="q">${esc(r.q||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${D.meta.ritmo_cap?esc(D.meta.ritmo_cap):`${R0.map(r=>r.n).join(" · ")} = ${R0.reduce((a,r)=>a+(+r.n||0),0)} ${esc(D.meta.unidad||"")}`}</div></div>`;

  <div class="rh-cap">${counts.join(" · ")} = ${counts.reduce((a,b)=>a+b,0)} ${esc(D.meta.unidad||"")}</div></div>`;
}
$("#hero").innerHTML = `<div><div class="lbl">${esc(D.meta.eyebrow||"")}</div>
  <h1>${esc(D.meta.h1_antes||"")} <mark>${esc(D.meta.h1_resaltado||"")}</mark> ${esc(D.meta.h1_despues||"")}</h1>
  <p>${D.meta.intro||""}</p></div>${rhythm}`;
$("#traps").innerHTML = (D.trampas||[]).map((t,i)=>`<div class="trapc"><span class="tag">Trampa ${D.trampas.length>1?i+1:"de examen"}</span><p><b>${esc(t.titulo)}</b> ${t.texto}</p></div>`).join("");
if(!(D.trampas||[]).length) $("#traps").hidden=true;

/* ---------- secciones ---------- */
const head = s=>!s.titulo?"":`<div class="sec-head"><h2>${esc(s.titulo)}</h2>${s.intro?`<p>${s.intro}</p>`:""}</div>${s.para?`<div class="para"><b>Para qué sirve</b>${s.para}</div>`:""}`;
const chant = f=>f?`<div class="chant"><div class="lbl">${esc(f.titulo||"Para recitar en voz alta")}</div><p>${f.html}</p></div>`:"";
const R = {};
let ITEMS = {}; // id -> {item, rama, color}
R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);

      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};

    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};
R.tarjetas = s=>head(s)+`<div class="cards">${s.tarjetas.map((c,i)=>{
  const col = colorDe(c.color,i);
  const top = c.encabezado?`<div class="chead"><div class="t">${esc(c.titulo)}</div>${c.subtitulo?`<div class="a">${esc(c.subtitulo)}</div>`:""}</div>`:(c.barra?`<div class="bar"></div>`:"");
  const body = c.filas? c.filas.map(f=>`<div class="frow"><span class="k">${esc(f.k)}</span>${f.v}</div>`).join("")

  return `<div class="card ${col}${c.ancho?" wide":""}">${top}${body}</div>`;}).join("")}</div>${s.nota?`<div class="note">${s.nota}</div>`:""}`;

R.pasos = s=>head(s)+`<ol class="track" style="--n:${s.pasos.length}" role="tablist" data-pasos="${s.id}">${s.pasos.map((p,i)=>`<li><button class="pill" role="tab" aria-selected="${i===0}" data-paso="${s.id}:${i}"><span class="circ">${i+1}</span><span class="nm">${esc(p.nombre)}</span></button></li>`).join("")}</ol><div class="stepd" id="stepd-${s.id}" role="tabpanel" aria-live="polite"></div>`+chant(s.frase);
R.flujo = s=>head(s)+`<div class="lanes">${s.carriles.map((c,i)=>`<div class="lane"><div class="lhead ${colorDe(c.color,i)}"><span class="t">${esc(c.titulo)}</span>${c.sub?`<span class="s">${esc(c.sub)}</span>`:""}</div><div class="flow">${c.nodos.map(n=>`<div class="node"><h4>${esc(n.titulo)}</h4>${n.ref?`<span class="art">${esc(n.ref)}</span>`:""}${n.texto?`<p>${n.texto}</p>`:""}${n.plazo?`<span class="plazo">${esc(n.plazo)}</span>`:""}${n.nota?`<p>${n.nota}</p>`:""}</div>`).join('<div class="arrow" aria-hidden="true">→</div>')}</div></div>`).join("")}</div>`;

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
