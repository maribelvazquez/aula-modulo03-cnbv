<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mapa mental interactivo del documento del Comité de Supervisión Bancaria de Basilea sobre la adecuada gestión de los riesgos de BC/FT (enero 2014), con simulador de reactivos.">
<title>Mapa de Basilea · Gestión del riesgo BC/FT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}
.qactions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accion);color:var(--accion-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600;font-size:17px;margin-top:4px}
.score .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.trows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.trow2{display:grid;grid-template-columns:minmax(0,300px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.trow2 .tb{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow2 .tb i{display:block;height:100%;background:var(--principal-linea)}
.trow2 .tv{font-variant-numeric:tabular-nums;font-weight:700}
.miss{margin-top:16px;background:var(--surface-2);border-radius:12px;padding:12px 16px}
.miss summary{cursor:pointer}
.miss ul{margin:6px 0 0;padding-left:18px} .miss li{margin:8px 0}
.siminfo{font-size:13px;color:var(--muted);margin:12px 0 0}
/* repaso (tandas al azar o secuencia fija) */
.para{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--accion);border-radius:12px;padding:12px 16px;margin:-4px 0 18px;font-size:17px;font-weight:600;max-width:1040px}.para b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accion);margin-bottom:2px}
.tu{margin:10px 0;background:var(--surface);border:2px solid var(--negro);border-left:8px solid var(--coral);border-radius:10px;padding:10px 14px;font-size:16px}.tu b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.dist{margin-top:12px;font-weight:500;font-size:15px}.dist ul{margin:4px 0 0;padding-left:0;list-style:none}.dist li{margin:5px 0;padding-left:26px;text-indent:-26px}.dist li b{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;text-indent:0;margin-right:6px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-display);font-size:12px;background:var(--surface)}
.rp-fallas{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.rp-fallas h3{font-size:18px}
.rp-fallas p{font-size:14.5px}
.rp-box{scroll-margin-top:90px}
.rp-box .qtext{font-size:clamp(22px,2.8vw,34px)}
.rp-box .opt{font-size:17px}
.rp-clave{margin-top:12px;border-left:6px solid var(--principal-linea);background:var(--surface-2);border-radius:8px;padding:10px 14px;font-weight:600}
.rp-clave .lbl{margin-bottom:4px}
.rp-fin{margin:10px 0 0;padding-left:22px;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,26px);line-height:1.35}
.rp-fin li{margin:10px 0}
.rp-fin small{display:block;font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--muted)}
.rp-box:fullscreen{max-width:none;border-radius:0;border:0;padding:40px 6vw;overflow:auto;background:var(--bg)}
.rp-box:fullscreen .qtext{font-size:clamp(26px,3vw,42px)}
.rp-box:fullscreen .opt{font-size:20px}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(27,27,30,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{padding:20px 22px 18px;background:var(--c);color:var(--ci);display:flex;justify-content:space-between;gap:12px;align-items:center}
.dhead h3{font-size:28px;font-weight:700;color:inherit}
.dhead .x{background:rgba(255,255,255,.25);border:0;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:inherit;flex:none}
.dbody{padding:16px 22px 30px;overflow:auto}
.dbody ul{padding-left:18px;margin:0}
.dbody li{margin:8px 0}
.dbody .hook{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 12px}

footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:4px solid var(--membrete);padding-top:14px}
footer b{color:var(--ink)}

@media (max-width:1100px){.track{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:18px}.track::before{display:none}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .map,.map.n2,.map.n3{grid-template-columns:1fr;grid-template-areas:"core" "b1" "b2" "b3" "b4";gap:22px}
  .map.nmany{grid-template-columns:1fr;grid-template-areas:"core" "izq" "der";gap:22px}
  .map .col{gap:22px}
  .map svg.wires{display:none}
  .core{width:230px;justify-self:center}
  .opts{grid-template-columns:1fr}
  .lane{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .arrow{width:auto;height:30px;transform:rotate(90deg)}
  .stepd{grid-template-columns:1fr}
  .stepd ul{columns:1}
  .track{grid-template-columns:repeat(3,minmax(0,1fr))}
  .frac .inc{padding-left:16px}
}
@media (max-width:600px){ .chant p span{white-space:normal} .trow2{grid-template-columns:1fr auto}.trow2 .tb{grid-column:1/-1;order:3} }
@media (max-width:520px){ .rhythm{flex-wrap:wrap} .rh{flex:1 1 40%} }
.printhead{display:none}
/* franja del sitio (modo sitio: sólo si datos.sitio existe) */
.sitebar{display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:8px 16px;background:var(--negro);color:#fff;overflow-x:auto;scrollbar-width:none;font-family:var(--f-display);font-size:13px}
.sitebar::-webkit-scrollbar{display:none}
.sitebar .sb-mod{font-weight:700;letter-spacing:.04em;white-space:nowrap;margin-right:4px;color:#fff;text-decoration:none}
.sitebar .sb-mod:hover{text-decoration:underline}
.sitebar .sb-p{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;text-decoration:none;font-weight:700;white-space:nowrap;flex:none}
.sitebar a.sb-p:hover{border-color:#fff}
.sitebar .sb-p[aria-current="page"]{background:var(--principal);border-color:var(--principal);color:var(--principal-ink)}
.sitebar .sb-p.off{opacity:.45;border-style:dashed;cursor:not-allowed}
.sitebar .sb-sep{width:1px;height:20px;background:rgba(255,255,255,.3);flex:none}
.sitebar .sb-cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.sitebar .sb-ses{white-space:nowrap;color:rgba(255,255,255,.8);margin-left:auto;padding-left:12px;font-weight:600}
@media (max-width:700px){.sitebar .sb-ses{display:none}}
@media print{
  body{background:#fff;padding:0}
  .sitebar,.top,.hero,.traps,section.block:not(.sim),footer,.simbar,.modes,.sim > .lbl,.sim .sec-head,.qactions,.siminfo,.drawer,.scrim{display:none!important}
  .quiz{box-shadow:none;border:0;padding:0;max-width:none}
  .printhead{display:block;font-family:var(--f-display);font-size:14px;margin:0 0 8px}
  .miss{background:none;padding:0} .miss li{break-inside:avoid;margin:10px 0}
  .trow2 .tb{border-color:#999} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

 los registros <b>al menos 5 años<\/b> desde el cese de la relación o de la transacción ocasional (párr. 52). Las DCG de Bancos piden <b>no menos de 10 años<\/b> (disposición 59ª). Lee bien qué documento te preguntan."}], "secciones": [{"tipo": "mapa", "id": "mapa", "nav": "4 partes + 3 anexos", "titulo": "4 partes y 3 anexos", "intro": "Cuatro ramas que siguen al banco: por qué existe la guía, qué hace por dentro, qué hace en grupo y quién más participa. Ritmo 3 · 6 · 5 · 4.", "centro": {"t": "Basilea · BC/FT", "s": "4 partes · 3 anexos<br>95 párrafos"}, "ramas": [{"letra": "I", "titulo": "Parte I · Introducción", "pregunta": "¿Por qué? — el marco", "ritmo": "¿Por qué?", "corto": "Parte I", "color": "morado", "items": [{"etiqueta": "Párr. 1–4", "nombre": "Objeto y relación con el GAFI", "sub": "Parte I", "verbo": "Integro", "desc": "Por qué existe: guía a los bancos para incluir el BC y la FT en su gestión global del riesgo, apoyando las normas GAFI sin modificarlas.", "orden": 1, "panel": "Parte I", "puntos": ["Directrices sobre cómo los bancos deberán incluir el BC y la FT dentro de su <b>gestión global del riesgo<\/b> (párr. 1).", "Primer comunicado del Comité en <b>1988<\/b>; en septiembre de <b>2012<\/b> revisó los Principios básicos, cuyo <b>Principio 29<\/b> trata la utilización abusiva de servicios financieros (párr. 2).", "Toma en cuenta la Financial Inclusion Guidance del GAFI (marzo de 2013) (párr. 3).", "Pretende complementar las normas GAFI; <b>en ningún caso<\/b> debe interpretarse como modificación, ni para reforzarlas ni para debilitarlas (párr. 3).", "Incluye referencias cruzadas a las normas GAFI, pero no de forma sistemática (párr. 4)."], "destacado": false}, {"etiqueta": "Párr. 5–7", "nombre": "Por qué importa", "sub": "Parte I", "verbo": "Protejo", "desc": "Sin una sólida gestión del riesgo BC/FT, el banco queda expuesto a riesgos de reputación, operacional, de cumplimiento y de concentración.", "orden": 2, "panel": "Parte I", "puntos": ["Contribuye a proteger la <b>reputación<\/b> de los bancos y de los sistemas bancarios nacionales, y preserva la integridad del sistema financiero internacional (párr. 5).", "Su insuficiencia o ausencia plantea riesgos de <b>reputación, operacional, de cumplimiento y de concentración<\/b> (párr. 6).", "Todos estos riesgos están relacionados entre sí; además de multas y sanciones, pueden generar un considerable coste financiero (párr. 7)."], "destacado": false}, {"etiqueta": "Párr. 8–13", "nombre": "Alcance y documentos relacionados", "sub": "Parte I", "verbo": "Delimito", "desc": "A quién aplica y con qué se lee: todos los bancos; fusiona y sustituye los documentos de 2001 y 2004, y no desarrolla específicamente PEP ni banca privada.", "orden": 3, "panel": "Parte I", "puntos": ["Se lee junto con otros documentos del Comité: Principios básicos (2012), auditoría interna (2012), riesgo operacional (2011), gobierno corporativo (2010), mensajes de cobertura (2009) y función de cumplimiento (2005) (párr. 8).", "<b>Fusiona y sustituye<\/b> «Debida diligencia con la clientela de los bancos» (<b>octubre de 2001<\/b>) y «Gestión consolidada del riesgo KYC» (<b>octubre de 2004<\/b>) (párr. 9).", "Presta mayor atención a los terceros que presentan negocios (Anexo 1) y a la corresponsalía bancaria (Anexo 2) (párr. 9).", "PEP, banca privada y estructuras jurídicas singulares <b>no se desarrollan específicamente<\/b>, por estar tratadas en publicaciones del GAFI (párr. 9).", "Aplica a <b>todos los bancos<\/b>; algunos requisitos podrán requerir adaptación a instituciones pequeñas o especializadas (párr. 11).", "La referencia al «supervisor» puede extenderse a otras autoridades, como las unidades de inteligencia financiera (párr. 12)."], "destacado": false}]}, {"letra": "II", "titulo": "Parte II · Elementos esenciales", "pregunta": "¿Qué hago? — el banco por dentro", "ritmo": "¿Qué hago?", "corto": "Parte II", "color": "principal", "items": [{"etiqueta": "Párr. 15–31", "nombre": "Evaluación, comprensión, gestión y mitigación de riesgos", "sub": "Parte II · 1", "verbo": "Evalúo", "desc": "La base: evaluar los riesgos BC/FT, con gobierno del Consejo, tres líneas de defensa y un sistema de seguimiento de transacciones acorde al riesgo.", "orden": 4, "panel": "Parte II · 1", "puntos": ["<b>(a) Evaluación:<\/b> considerar los factores de riesgo relevantes, inherentes y residuales, a escala nacional, sectorial, bancaria y de relación comercial, entre otras (párr. 15).", "Conocer los riesgos de clientes, productos (incluidos los que están en desarrollo), canales, servicios y jurisdicciones; debe poder demostrarse al supervisor (párr. 16).", "<b>(b) Gobierno:<\/b> el Consejo aprueba y supervisa las políticas de riesgo y debe comprender los riesgos BC/FT; con la alta dirección nombra al responsable ejecutivo de PBC/FT (párr. 17–18).", "<b>(c) Tres líneas de defensa:<\/b> 1ª unidades de negocio; 2ª responsable PBC/FT y cumplimiento, y también RR. HH. y tecnología; 3ª auditoría interna (párr. 19).", "Las auditorías revisan <b>4 aspectos<\/b>: adecuación de las políticas, eficacia de su aplicación por el personal, vigilancia y control de calidad (incluidas las alertas) y formación (párr. 26).", "<b>(d) Seguimiento de transacciones:<\/b> acorde a tamaño, actividades, complejidad y riesgos; si no usa un sistema de TI, documentar la decisión y demostrar una alternativa eficaz (párr. 28)."], "destacado": true, "ir": "#lineas"}, {"etiqueta": "Párr. 32–34", "nombre": "Política de aceptación de clientes", "sub": "Parte II · 2", "verbo": "Acepto", "desc": "Qué clientes son de mayor riesgo y qué hacer con ellos: diligencia básica con todos, simplificada en bajo riesgo probado y reforzada en alto riesgo.", "orden": 5, "panel": "Parte II · 2", "puntos": ["Factores, entre otros: antecedentes, ocupación (incluido un puesto relevante público o privado), fuentes de renta y riqueza, país de origen y residencia, productos, naturaleza y finalidad de las cuentas, cuentas vinculadas y actividades comerciales (párr. 32).", "<b>Diligencia básica<\/b> con todos y proporcional al riesgo; medidas <b>simplificadas<\/b> en situaciones probadas de bajo riesgo, siempre que la legislación lo permita (párr. 33).", "No debe ser tan restrictiva que perjudique el acceso de grupos financiera o socialmente desfavorecidos (párr. 33).", "Diligencia <b>reforzada obligatoria con PEP extranjeras<\/b>; la alta dirección aprueba establecer o continuar relaciones de alto riesgo (párr. 34).", "Debe definir cuándo no se acepta una nueva relación o se cancela una existente (párr. 34)."], "destacado": false, "ir": "#diligencia"}, {"etiqueta": "Párr. 35–44", "nombre": "Identificación, verificación y perfil de riesgo", "sub": "Parte II · 3", "verbo": "Identifico", "desc": "Identificar y verificar con fuentes fiables e independientes al cliente, a quien actúa en su nombre y al beneficiario efectivo, y armar su perfil de riesgo.", "orden": 6, "panel": "Parte II · 3", "puntos": ["Cliente (R. 10 GAFI): persona física, jurídica o estructura jurídica que entabla una relación comercial o realiza una transacción ocasional (párr. 35 y nota 21).", "Beneficiario efectivo: persona(s) física(s) que en último término posee(n) o controla(n) al cliente o en cuyo nombre se realiza la transacción (nota 22).", "En general, no establecer la relación ni realizar transacciones hasta verificar la identidad; medidas razonables para verificar al beneficiario efectivo (párr. 36).", "Clientes no presentes: no son motivo para soslayar la identificación; la declaración escrita sobre el beneficiario efectivo no basta por sí sola (párr. 37).", "Sin CDD completa: no abrir; en ciertas circunstancias cabe verificar después; si los problemas no se resuelven, cerrar o bloquear. <b>En cualquier caso<\/b>, elaborar STR, con sujeción a la legislación nacional (párr. 41 y nota 26).", "Cliente rechazado por otro banco por sospecha: considerar alto riesgo, diligencia reforzada, STR y/o no aceptarlo (párr. 43).  aparece el STR. En las dos primeras (problemas para completar la CDD), el texto lo sujeta a la legislación nacional sobre tratamiento de transacciones sospechosas (nota 26).", "carriles": [{"titulo": "Antes de abrir", "sub": "Párr. 41", "color": "morado", "nodos": [{"titulo": "No se completa la CDD", "ref": "Párr. 41", "texto": "No abrir la cuenta, no iniciar la relación ni realizar la transacción."}, {"titulo": "Elaborar STR", "ref": "Párr. 41 · nota 26", "texto": "En cualquier caso, cuando existan problemas para completar las medidas CDD."}]}, {"titulo": "Cuenta ya abierta", "sub": "Párr. 41", "color": "principal", "nodos": [{"titulo": "Verificación posterior", "ref": "Párr. 41", "texto": "Admisible en ciertas circunstancias, para no interrumpir el curso normal de los negocios.", "nota": "Con condiciones y limitaciones de uso de la relación antes de la verificación."}, {"titulo": "Problemas que no se resuelven", "ref": "Párr. 41", "texto": "Cerrar la cuenta o, si no, bloquear el acceso a ella."}, {"titulo": "Elaborar STR", "ref": "Párr. 41 · nota 26", "texto": "En cualquier caso, por los problemas para completar la CDD."}]}, {"titulo": "Sospecha sobre los fondos", "sub": "Párr. 41", "color": "negro", "nodos": [{"titulo": "Motivos razonables para sospechar", "ref": "Párr. 41", "texto": "No aceptar voluntariamente la apertura de cuentas a esos clientes."}, {"titulo": "STR sin alertar al cliente", "ref": "Párr. 41", "texto": "Notificar a las autoridades competentes y asegurar que el cliente no sepa, ni siquiera indirectamente, del STR."}]}]}, {"tipo": "pasos", "id": "supervisor", "nav": "Supervisor", "titulo": "El supervisor en 5 incisos", "intro": "Párrafo 86: el enfoque en función del riesgo que deben adoptar los supervisores. Es el orden del texto, incisos (i) a (v).", "pasos": [{"nombre": "Conocer la jurisdicción", "ref": "Párr. 86 (i)", "gancho": "¿Qué riesgos hay en mi país?", "puntos": ["Conocimiento exhaustivo de los riesgos presentes en la jurisdicción y de su potencial impacto en las entidades supervisadas.", "Usando la evaluación de países de la nota interpretativa a la R. 1 del GAFI (nota 33)."]}, {"nombre": "Contrastar con la evaluación nacional", "ref": "Párr. 86 (ii)", "gancho": "¿La evaluación del banco cuadra con la del país?", "puntos": ["Evaluar la suficiencia de la evaluación de riesgos del banco en función de la(s) evaluación(es) nacional(es) de la jurisdicción.", "Incluida, cuando proceda, cualquier evaluación supranacional (nota 34)."]}, {"nombre": "Evaluar los riesgos de la entidad", "ref": "Párr. 86 (iii)", "gancho": "¿Qué riesgos tiene este banco?", "puntos": ["Naturaleza y alcance de los riesgos en su base de clientes, productos y servicios, y áreas geográficas donde operan el banco y sus clientes."]}, {"nombre": "Evaluar los controles", "ref": "Párr. 86 (iv)", "gancho": "¿Sus controles funcionan?", "puntos": ["Suficiencia y eficacia de la aplicación de los controles, incluidas las medidas CDD, para cumplir y mitigar riesgos."]}, {"nombre": "Asignar recursos", "ref": "Párr. 86 (v)", "gancho": "¿Dónde pongo a mi gente?", "puntos": ["Usar la información para asignar recursos, dimensionar el examen e identificar la experiencia y destrezas necesarias, según los riesgos."]}], "frase": {"titulo": "El supervisor en una frase", "html": "Conozco el país, contrasto, evalúo riesgos, evalúo controles y asigno recursos."}}, {"tipo": "tarjetas", "id": "terceros", "nav": "Anexos 1 y 2", "titulo": "Terceros y corresponsalía de un vistazo", "intro": "Los dos anexos que el Comité reforzó al actualizar sus documentos anteriores (párr. 9).", "tarjetas": [{"encabezado": true, "color": "turquesa", "titulo": "Recurso a terceros", "subtitulo": "Anexo 1 · párr. 2 y 6–8", "filas": [{"k": "Quién", "v": "Instituciones financieras o determinadas empresas o profesiones no financieras supervisadas, normalmente con relación previa con el cliente."}, {"k": "Qué se obtiene", "v": "De inmediato, la información de las <b>3 medidas CDD<\/b>: identificar y verificar al cliente, identificar al beneficiario efectivo y entender la finalidad de la relación."}, {"k": "Cómo se evalúa", "v": "<b>9 criterios<\/b>, a) a i): regulación comparable, acuerdo escrito, documentación, certificación, información desfavorable, cadenas, riesgo, examen periódico y cese."}]}, {"encabezado": true, "color": "morado", "titulo": "Subcontratación o agencia", "subtitulo": "Anexo 1 · párr. 4 y 9–17", "filas": [{"k": "Qué es", "v": "El tercero aplica la CDD en nombre del banco, por contrato; el agente suele ser una prolongación legal del banco (párr. 4 y 11)."}, {"k": "Responsabilidad", "v": "Sigue recayendo en el banco (párr. 9)."}, {"k": "Contrato", "v": "Por escrito: CDD del banco, clientes presentes y no presentes, y confidencialidad (párr. 14)."}]}, {"encabezado": true, "color": "negro", "titulo": "Corresponsalía", "subtitulo": "Anexo 2", "filas": [{"k": "Partes", "v": "El corresponsal presta; el correspondiente recibe y es su cliente (párr. 1 y 3)."}, {"k": "Conocer", "v": "<b>9 factores<\/b>, a) a i) (párr. 7); la información sobre sus políticas PBC/FT puede venir de un cuestionario o de información pública (párr. 8)."}, {"k": "Decidir", "v": "Aprueba la alta dirección (párr. 12); deberían negarse a bancos simulados (párr. 14)."}]}], "nota": "La Guía GAFI de 2014 en español llama «banco corresponsal» a los dos bancos (párr. 52). Para el examen, usa la distinción de Basilea."}, {"tipo": "cifras", "id": "cifras", "nav": "Cifras", "titulo": "Cifras que preguntan", "intro": "Basilea tiene pocos números, y por eso se memorizan mal. Cada uno con su párrafo.", "cifras": [["1988", "año", "Primer comunicado del Comité sobre el uso delictivo del sistema bancario", "Párr. 2"], ["29", "Principio", "Principio básico (2012) sobre utilización abusiva de servicios financieros", "Párr. 2"], ["2001", "año", "«Debida diligencia con la clientela de los bancos», que este documento sustituye", "Párr. 9"], ["2004", "año", "«Gestión consolidada del riesgo KYC», también sustituido", "Párr. 9"], ["3", "líneas", "De defensa: negocio · PBC/FT y cumplimiento · auditoría interna", "Párr. 19"], ["4", "aspectos", "Que revisan las auditorías PBC/FT", "Párr. 26"], ["5", "años", "Mínimo de conservación de registros desde el cese de la relación", "Párr. 52"], ["5", "incisos", "Del enfoque en función del riesgo del supervisor", "Párr. 86"], ["3", "medidas", "CDD cuya información se obtiene de inmediato al recurrir a terceros", "Anexo 1, párr. 2"], ["9", "criterios", "Para evaluar el recurso a terceros", "Anexo 1, párr. 7"], ["9", "factores", "Para conocer al banco correspondiente", "Anexo 2, párr. 7"], ["14", "Recs.", "Del GAFI enlistadas como relevantes, sin ser exhaustivas", "Anexo 3 · nota 3"]]}, {"tipo": "simulador", "id": "examen", "nav": "Practicar ▸"}], "temas": {"int": "Introducción y supervisores (Partes I y IV)", "ban": "Elementos esenciales del banco (Parte II)", "gru": "Grupo y contexto transfronterizo (Parte III)", "anx": "Anexos: terceros, corresponsalía y GAFI"}, "modos": [{"k": "ban", "l": "Parte II · el banco", "tema": "ban"}, {"k": "gru", "l": "Parte III · el grupo", "tema": "gru"}, {"k": "int", "l": "Partes I y IV", "tema": "int"}, {"k": "anx", "l": "Anexos", "tema": "anx"}, {"k": "caso", "l": "Casos prácticos", "tipos": ["caso"]}, {"k": "tr", "l": "Cifras y trampas", "tipos": ["cifra", "trampa"]}], "banco": [{"id": "B001", "tema": "ban", "tipo": "memoria", "q": "De acuerdo con el párrafo 14, disponer de «políticas y procesos adecuados» en materia de BC/FT exige:", "a": "Aplicar medidas adicionales a unas normas CDD eficaces, proporcionadas, en función del riesgo e informadas por la evaluación del propio banco", "o": ["Aplicar normas CDD eficaces, ya que la diligencia debida con la clientela agota por sí misma el contenido de las políticas y procesos adecuados", "Aplicar medidas adicionales a unas normas CDD eficaces, proporcionadas, en función del riesgo e informadas por la evaluación del propio banco", "Sustituir las normas CDD por la evaluación de riesgos que el supervisor realiza del sistema bancario nacional", "Adoptar un único programa estandarizado de CDD, idéntico para todos los bancos del sistema, con independencia de la evaluación de riesgos de cada uno"], "x": "El párr. 14 señala que disponer de «políticas y procesos adecuados» exige la aplicación de otras medidas adicionales a unas normas CDD eficaces, y que esas medidas deberán ser proporcionadas, estar en función del riesgo e informadas por la propia evaluación que el banco hace de sus riesgos BC/FT. El distractor más tentador reduce todo a la CDD, justo lo que el texto descarta. El requisito deriva del Principio 29 de los Principios básicos (2012).", "ref": "Párr. 14"}, {"id": "B002", "tema": "ban", "tipo": "memoria", "q": "Al realizar un análisis integral del riesgo BC/FT, ¿qué factores de riesgo deberá considerar el banco según el párrafo 15?", "a": "Todos los relevantes, inherentes y residuales, a escala nacional, sectorial, bancaria y de relación comercial, entre otras", "o": ["Solo los inherentes a escala bancaria, porque los residuales se analizan después en la auditoría interna", "Los inherentes a escala nacional y sectorial, dejando los de relación comercial para la política de aceptación de clientes del banco", "Todos los relevantes, inherentes y residuales, a escala nacional, sectorial, bancaria y de relación comercial, entre otras", "Los residuales a escala de relación comercial, pues los factores nacionales y sectoriales los evalúa el supervisor, no el banco"], "x": "El párr. 15 pide considerar todos los factores de riesgo relevantes, tanto inherentes como residuales, a escala nacional, sectorial, bancaria y de relación comercial, «entre otras», para determinar el perfil de riesgo y el nivel de mitigación. Los distractores recortan la lista (solo inherentes, solo residuales o sin la relación comercial). La nota 16 añade que, cuando proceda, se tengan en cuenta evaluaciones supranacionales.", "ref": "Párr. 15"}, {"id": "B003", "tema": "ban", "tipo": "caso", "q": "Banco Altamar desarrolla una billetera digital que lanzará en seis meses. El área comercial propone evaluar sus riesgos BC/FT hasta que tenga clientes. Conforme al párrafo 16, ¿qué procede?", "a": "Evaluarla desde ahora: el conocimiento de los riesgos inherentes incluye los productos en desarrollo o en fase de lanzamiento", "o": ["Evaluar solo las jurisdicciones de los futuros clientes, porque los riesgos de productos y canales se revisan en la auditoría interna", "Evaluarla desde ahora: el conocimiento de los riesgos inherentes incluye los productos en desarrollo o en fase de lanzamiento", "Esperar a que el supervisor autorice el producto, ya que a él le corresponde evaluar los riesgos de los productos nuevos", "Esperar al lanzamiento, porque el conocimiento de los riesgos se construye con datos de operaciones ya realizadas"], "x": "El párr. 16 exige un conocimiento minucioso de los riesgos inherentes a clientes, productos, canales y servicios, «incluidos los productos en desarrollo o en fase de lanzamiento». El distractor más tentador invoca los «datos concretos de operaciones», que el mismo párrafo menciona como base del conocimiento, pero junto con otra información interna y fuentes externas, no como condición para empezar a evaluar.", "ref": "Párr. 16"}, {"id": "B004", "tema": "ban", "tipo": "memoria", "q": "En el contexto del riesgo BC/FT, ¿qué requisito de gobierno señala el párrafo 17 como totalmente relevante?", "a": "Que el Consejo de Administración apruebe y supervise las políticas en materia de riesgos, gestión del riesgo y cumplimiento", "o": ["Que la alta dirección apruebe las políticas de riesgos y cumplimiento sin necesidad de informar al Consejo sobre la evaluación de riesgos BC/FT", "Que el Consejo de Administración apruebe y supervise las políticas en materia de riesgos, gestión del riesgo y cumplimiento", "Que el responsable ejecutivo de PBC/FT apruebe y supervise las políticas de riesgos y cumplimiento", "Que la auditoría interna apruebe las políticas de riesgos y cumplimiento antes de que se sometan al conocimiento del Consejo de Administración"], "x": "El párr. 17 dice que el requisito de que el Consejo de Administración apruebe y supervise las políticas de riesgos, gestión del riesgo y cumplimiento es totalmente relevante para BC/FT. Además, el Consejo deberá comprender claramente esos riesgos y recibir la información de la evaluación de forma puntual, completa, comprensible y precisa. El responsable PBC/FT ejecuta y vigila; no es quien aprueba en última instancia.", "ref": "Párr. 17"}, {"id": "B005", "tema": "ban", "tipo": "caso", "q": "Banco Cordillera debe designar a su responsable ejecutivo de PBC/FT. Según el párrafo 18, ¿a quién corresponde nombrarlo?", "a": "Al Consejo de Administración y a la alta dirección", "o": ["Al Consejo de Administración y a la alta dirección", "A la función de cumplimiento, con la ratificación posterior del supervisor bancario", "Al comité de auditoría del Consejo", "A la unidad de inteligencia financiera, a partir de una terna enviada por el banco"], "x": "El párr. 18 indica que el Consejo de Administración y la alta dirección deberán nombrar un responsable ejecutivo de PBC/FT con preparación adecuada y con la categoría y autoridad necesarias para que sus planteamientos reciban atención del Consejo, la alta dirección y las líneas de negocio. El comité de auditoría aparece en otro contexto: es ante quien rinde cuentas la auditoría interna (párr. 26).", "ref": "Párr. 18"}, {"id": "B006", "tema": "ban", "tipo": "memoria", "q": "Según el párrafo 21, ¿cuándo deberán recibir formación PBC/FT los nuevos empleados del banco?", "a": "Tan pronto como sea posible tras su contratación", "o": ["Tan pronto como sea posible tras su contratación", "Al concluir su periodo de prueba, cuando ya conozcan sus funciones concretas", "Antes de su contratación, como condición del proceso de selección de personal", "En el siguiente curso anual de actualización programado para toda la plantilla"], "x": "El párr. 21 dice que los nuevos empleados deberán recibir formación «tan pronto como sea posible tras su contratación». La selección de personal (con principios éticos y profesionales) es una política distinta, y los cursos de actualización son para que el personal ya formado mantenga al día sus conocimientos. La formación se adapta a funciones, responsabilidades y antigüedad, y su alcance y frecuencia a los factores de riesgo.", "ref": "Párr. 21"}, {"id": "B007", "tema": "ban", "tipo": "caso", "q": "Lucía dirige el área de recursos humanos de Banco Ribera, que selecciona al personal con criterios éticos. Según el párrafo 19, ¿en qué línea de defensa PBC/FT se ubica su área?", "a": "En la segunda línea, junto con el responsable ejecutivo de PBC/FT y cumplimiento", "o": ["En la segunda línea, junto con el responsable ejecutivo de PBC/FT y cumplimiento", "En la primera línea, junto con las unidades de negocio en contacto con los clientes", "En ninguna, porque RR. HH. es una función de apoyo ajena a las líneas de defensa", "En la tercera línea, junto con el departamento de auditoría interna del banco"], "x": "El párr. 19 ubica en la segunda línea al responsable ejecutivo de PBC/FT y a la función de cumplimiento, «así como también las de recursos humanos o tecnología». La primera línea son las unidades de negocio (actividades de cara al público) y la tercera, la auditoría interna. Es fácil pensar que RR. HH. no es línea de defensa, pero el texto la incluye expresamente.", "ref": "Párr. 19"}, {"id": "B008", "tema": "ban", "tipo": "trampa", "q": "Al describir las tres líneas de defensa, ¿cuál de estas figuras NO menciona el párrafo 19 en ninguna de ellas?", "a": "Los auditores externos", "o": ["El área de tecnología del banco", "Las actividades de cara al público", "Los auditores externos", "El departamento de auditoría interna"], "x": "El párr. 19 reparte las líneas así: 1ª, unidades de negocio (actividades de cara al público); 2ª, responsable ejecutivo de PBC/FT, cumplimiento, y también RR. HH. o tecnología; 3ª, auditoría interna. Los auditores externos no aparecen en ese reparto. El párr. 27, dentro del mismo apartado (c), les reconoce una importante función al evaluar controles en sus auditorías financieras, pero no los asigna a ninguna línea.", "ref": "Párr. 19"}, {"id": "B009", "tema": "ban", "tipo": "caso", "q": "Banco Laguna, de tamaño mediano, quiere que su responsable ejecutivo de PBC/FT acumule otra función. ¿Cuál es compatible según el párrafo 24?", "a": "Desempeñar también la función de director de riesgos", "o": ["Encabezar además la función de auditoría interna del banco", "Dirigir a la vez la línea de negocio de banca empresarial", "Desempeñar también la función de director de riesgos", "Asumir también las competencias de protección de datos"], "x": "El párr. 24 prevé que el responsable ejecutivo de PBC/FT también podrá desempeñar la función de director de riesgos, director de cumplimiento o equivalente. En cambio, el párr. 23 señala que, para evitar conflictos de intereses, no deberá, por ejemplo, asumir competencias en las líneas de negocio, en protección de datos ni en la función de auditoría interna.", "ref": "Párr. 23–24"}, {"id": "B010", "tema": "ban", "tipo": "trampa", "q": "¿Qué afirmación NO es congruente con lo que dispone el párrafo 23 sobre el responsable ejecutivo de PBC/FT?", "a": "En bancos pequeños pueden tolerarse sus conflictos de intereses si la alta dirección lo autoriza", "o": ["Para permitir juicios ecuánimes, no deberá, por ejemplo, asumir competencias en la función de auditoría interna", "Ante conflictos con las líneas de negocio, deberá haber procedimientos para una consideración objetiva al más alto nivel", "En bancos pequeños pueden tolerarse sus conflictos de intereses si la alta dirección lo autoriza", "Los intereses comerciales no deberán oponerse al eficaz desempeño de sus atribuciones"], "x": "El párr. 23 dice que los posibles conflictos de intereses deberán evitarse «con independencia del tamaño del banco o de su estructura directiva». Por eso es falsa la idea de tolerarlos en bancos pequeños. Las otras tres afirmaciones reproducen el mismo párrafo: los intereses comerciales no deben oponerse a sus atribuciones, deben existir procedimientos para la consideración objetiva al más alto nivel y no debe asumir, por ejemplo, auditoría interna.", "ref": "Párr. 23"}, {"id": "B011", "tema": "ban", "tipo": "memoria", "q": "Como parte de la segunda línea, el seguimiento continuo del cumplimiento a cargo del responsable ejecutivo de PBC/FT implica, según el párrafo 22:", "a": "Verificar por muestreo el cumplimiento y examinar informes de anomalías para alertar a la alta dirección o al Consejo", "o": ["Evaluar de forma independiente la gestión y los controles, rindiendo cuentas al comité de auditoría", "Aprobar y supervisar las políticas en materia de riesgos, gestión del riesgo y cumplimiento de todas las unidades del banco", "Verificar por muestreo el cumplimiento y examinar informes de anomalías para alertar a la alta dirección o al Consejo", "Identificar, evaluar y controlar directamente los riesgos de las actividades de cara al público y en contacto con los clientes"], "x": "El párr. 22 dice que el seguimiento continuo implica la verificación por muestreo del cumplimiento y el examen de informes de anomalías para alertar a la alta dirección o al Consejo si la dirección no aplica los procedimientos de forma responsable. Cada distractor corresponde a otro sujeto: la evaluación independiente es de la auditoría interna (párr. 26), el control directo es de la primera línea (párr. 19) y la aprobación de políticas es del Consejo (párr. 17).", "ref": "Párr. 22"}, {"id": "B012", "tema": "ban", "tipo": "caso", "q": "La unidad de inteligencia financiera envía a Banco Pradera una consulta sobre las operaciones de un cliente de banca privada. Según el párrafo 22, ¿quién deberá ser el contacto del banco?", "a": "El responsable ejecutivo de PBC/FT", "o": ["El responsable ejecutivo de PBC/FT", "El director de la auditoría interna del banco", "El secretario del Consejo de Administración", "El gerente de relaciones que atiende al cliente"], "x": "El párr. 22 establece que el responsable ejecutivo de PBC/FT deberá ser el contacto para todas las cuestiones en esa materia de las autoridades internas y externas, incluidas las supervisoras y las unidades de inteligencia financiera (FIU). El gerente de relaciones pertenece a la primera línea y la auditoría interna a la tercera; ninguno es el punto de contacto previsto.", "ref": "Párr. 22"}, {"id": "B013", "tema": "ban", "tipo": "cifra", "q": "¿Cuántos aspectos enumera el párrafo 26 que deben cubrir las políticas del banco para realizar auditorías PBC/FT?", "a": "4 aspectos, de (i) a (iv)", "o": ["8 aspectos, de (i) a (viii)", "5 aspectos, de (i) a (v)", "4 aspectos, de (i) a (iv)", "3 aspectos, de (i) a (iii)"], "x": "Son 4: (i) adecuación de las políticas y procedimientos PBC/FT para tratar los riesgos identificados; (ii) eficacia de su aplicación por el personal; (iii) eficacia de la vigilancia del cumplimiento y del control de calidad, incluidos parámetros de alerta automática; y (iv) eficacia de los programas de formación. No lo confundas con los 5 incisos del enfoque del supervisor (párr. 86).", "ref": "Párr. 26"}, {"id": "B014", "tema": "ban", "tipo": "trampa", "q": "¿Cuál de los siguientes aspectos NO figura entre los que deben cubrir las auditorías PBC/FT según el párrafo 26?", "a": "La rentabilidad de las líneas de negocio que atienden a clientes de alto riesgo", "o": ["La eficacia de los programas de formación del personal relevante del banco", "La adecuación de las políticas y procedimientos PBC/FT para tratar los riesgos identificados", "La eficacia de la vigilancia del cumplimiento y del control de calidad, incluidas las alertas automáticas", "La rentabilidad de las líneas de negocio que atienden a clientes de alto riesgo"], "x": "El párr. 26 enumera cuatro aspectos: adecuación de políticas y procedimientos, eficacia de su aplicación por el personal, eficacia de la vigilancia del cumplimiento y control de calidad (con parámetros de alerta automática) y eficacia de la formación. La rentabilidad de las líneas de negocio no aparece: la auditoría PBC/FT evalúa controles y cumplimiento, no resultados comerciales.", "ref": "Párr. 26"}, {"id": "B015", "tema": "ban", "tipo": "caso", "q": "La alta dirección de Banco Ocre fija una auditoría PBC/FT idéntica, con la misma frecuencia y metodología, para todas sus áreas sin considerar su riesgo. ¿Qué exige el párrafo 26?", "a": "Que alcance y metodología se adecuen al perfil de riesgo del banco y que la frecuencia dependa también del riesgo", "o": ["Que alcance y metodología se adecuen al perfil de riesgo del banco y que la frecuencia dependa también del riesgo", "Nada adicional: una frecuencia fija y uniforme es la forma de garantizar la independencia de la tercera línea de defensa", "Que el responsable ejecutivo de PBC/FT defina alcance y metodología, por conocer mejor los riesgos", "Que se auditen las áreas con alertas, ya que no se exige auditar periódicamente todo el banco en materia de PBC/FT"], "x": "El párr. 26 pide a la dirección garantizar que el alcance y la metodología de las auditorías se adecuen al perfil de riesgo del banco y que su frecuencia dependa asimismo del riesgo; también que se asigne personal experto. Es falso que no se audite todo el banco: «periódicamente, los auditores internos deberán realizar auditorías PBC/FT de todo el banco». Y el responsable PBC/FT es 2ª línea, no quien diseña la auditoría.", "ref": "Párr. 26"}, {"id": "B016", "tema": "ban", "tipo": "memoria", "q": "Según el párrafo 26, ¿ante quién rinde cuentas la auditoría interna, como tercera línea de defensa, en materia PBC/FT?", "a": "Ante el comité de auditoría del Consejo o un órgano de vigilancia similar", "o": ["Ante el supervisor bancario, mediante informes periódicos sobre la eficacia de los controles", "Ante el responsable ejecutivo de PBC/FT, cabeza de la segunda línea", "Ante la alta dirección, que es la encargada de aprobar sus programas anuales de trabajo", "Ante el comité de auditoría del Consejo o un órgano de vigilancia similar"], "x": "El párr. 26 dice que la auditoría interna evalúa de forma independiente la gestión y los controles del riesgo, «rindiendo cuentas al comité de auditoría del Consejo de Administración o un órgano de vigilancia similar». No confundas: el responsable ejecutivo de PBC/FT rinde cuentas directamente a la alta dirección o al Consejo (párr. 24); si auditoría le reportara a él, perdería su independencia.", "ref": "Párr. 26"}, {"id": "B017", "tema": "ban", "tipo": "caso", "q": "Banco Nogal contrata a un despacho de auditores externos para evaluar la eficacia de sus políticas y procedimientos PBC/FT. Según el párrafo 27, ¿qué deberá garantizar el banco?", "a": "Que el alcance se adecue a sus riesgos, que los auditores tengan conocimientos y experiencia necesarios y darles seguimiento", "o": ["Que el alcance se adecue a sus riesgos, que los auditores tengan conocimientos y experiencia necesarios y darles seguimiento", "Que el supervisor apruebe previamente el informe del despacho antes de que sea presentado al Consejo de Administración del banco", "Que el despacho sustituya formalmente a la auditoría interna como tercera línea de defensa mientras dure el encargo contratado", "Que la revisión se limite a los estados financieros, dejando la evaluación de los controles PBC/FT a la función de cumplimiento"], "x": "El párr. 27 dice que, cuando el banco utilice auditores externos para evaluar la eficacia de sus políticas PBC/FT, deberá garantizar que el alcance se adecua a sus riesgos, que los auditores disponen de conocimientos y experiencia necesarios, y realizar un adecuado seguimiento de esas labores. Los auditores externos no sustituyen a la auditoría interna, y el párr. 19 no los incluye en ninguna de las tres líneas de defensa.", "ref": "Párr. 27"}, {"id": "B018", "tema": "ban", "tipo": "caso", "q": "Banco Arcilla, pequeño y con operación local sencilla, concluye que no necesita un sistema de seguimiento basado en TI. Según el párrafo 28, ¿qué deberá hacer?", "a": "Documentar su decisión y poder demostrar al supervisor o a los auditores externos que dispone de una alternativa eficaz", "o": ["Contratar el sistema TI de otro banco de su jurisdicción, pues el párrafo 28 no admite alternativas al seguimiento automatizado", "Nada más: los bancos con operación local sencilla están exentos de contar con cualquier sistema de seguimiento de transacciones", "Solicitar una dispensa previa al supervisor, porque el sistema TI es obligatorio para todo banco", "Documentar su decisión y poder demostrar al supervisor o a los auditores externos que dispone de una alternativa eficaz"], "x": "El párr. 28 pide un sistema de seguimiento acorde con tamaño, actividades, complejidad y riesgos; en la mayoría de los bancos la automatización será «probablemente» necesaria. Cuando el banco considere que un sistema TI no es necesario, deberá documentar su decisión y ser capaz de demostrar a su supervisor o a los auditores externos que tiene una alternativa eficaz. No hay exención de seguimiento ni obligación absoluta de TI.", "ref": "Párr. 28"}, {"id": "B019", "tema": "ban", "tipo": "caso", "q": "El proveedor del sistema de seguimiento de Banco Brisa ofrece sus parámetros estándar de alertas. Según el párrafo 29, ¿cómo debe proceder el banco?", "a": "Puede usarlos, pero los parámetros deberán reflejar y tener en cuenta su situación de riesgo específica", "o": ["Puede usarlos sin ajustes, porque se basan en la experiencia nacional e internacional sobre los métodos de BC o FT", "Puede usarlos una vez que el supervisor los certifique, porque fijar parámetros es atribución de la autoridad", "No puede usarlos, porque Basilea prohíbe los parámetros suministrados por el diseñador", "Puede usarlos, pero los parámetros deberán reflejar y tener en cuenta su situación de riesgo específica"], "x": "El párr. 29 dice que el banco «podrá hacer uso de los parámetros estándar suministrados por el diseñador», pero «los parámetros utilizados deberán reflejar y tener en cuenta la situación de riesgo específica del banco». El distractor más tentador toma una idea real del mismo párrafo (parámetros basados en la experiencia nacional e internacional) para concluir, erróneamente, que no requieren ajuste.", "ref": "Párr. 29"}, {"id": "B020", "tema": "ban", "tipo": "memoria", "q": "Según el párrafo 31, ¿a quién corresponde evaluar el sistema TI de seguimiento para garantizar que es adecuado y que la primera y segunda líneas lo utilizan eficazmente?", "a": "A la auditoría interna", "o": ["Al responsable ejecutivo de PBC/FT", "A la auditoría interna", "Al diseñador del sistema de seguimiento", "Al área de tecnología que lo administra"], "x": "El párr. 31 asigna a la auditoría interna (tercera línea) evaluar el sistema TI para garantizar que es adecuado y que la primera y segunda líneas lo usan eficazmente. El responsable ejecutivo de PBC/FT debe tener acceso al sistema y evaluar las alertas (párr. 30), pero el párr. 31 encarga la evaluación del sistema a la auditoría interna, que revisa cómo lo usan la primera y la segunda líneas.", "ref": "Párr. 31"}, {"id": "B021", "tema": "ban", "tipo": "caso", "q": "Andrés, solicitante de una cuenta en Banco Encino, es director general de una gran empresa privada. Al evaluar su riesgo conforme a la política de aceptación de clientes, ¿qué indica el párrafo 32?", "a": "Su ocupación es un factor pertinente, incluido si ocupa un puesto relevante en el sector público o privado", "o": ["Su ocupación es un factor pertinente, incluido si ocupa un puesto relevante en el sector público o privado", "Su ocupación se valora después, cuando el banco ya lo haya clasificado como cliente de alto riesgo", "Su ocupación es irrelevante; solo cuentan los puestos relevantes en el sector público", "Su ocupación no se valora; basta con considerar sus fuentes de renta y riqueza y su país de residencia habitual"], "x": "El párr. 32 enumera, entre los factores pertinentes, la ocupación del cliente «incluido si ocupa un puesto relevante en el sector público o privado», junto con antecedentes, fuentes de renta y riqueza, país de origen y residencia, productos, naturaleza y finalidad de las cuentas, cuentas vinculadas y actividades comerciales. El distractor tentador limita la relevancia al sector público; el texto menciona ambos.", "ref": "Párr. 32"}, {"id": "B022", "tema": "ban", "tipo": "caso", "q": "Rosa, estudiante, quiere abrir una cuenta en Banco Álamo para mantener saldos pequeños y hacer operaciones rutinarias de banca minorista. Es una situación probada de bajo riesgo. Según el párrafo 33:", "a": "Podrían aceptarse medidas simplificadas, como procedimientos básicos de apertura, siempre que la legislación lo permita", "o": ["Podría eximirse de toda identificación y verificación, ya que el bajo riesgo probado sustituye a la diligencia debida básica", "Debería rechazarse la solicitud, porque las cuentas de saldos pequeños quedan fuera de la política de aceptación de clientes", "Podrían aceptarse medidas simplificadas, como procedimientos básicos de apertura, siempre que la legislación lo permita", "Debería aplicarse diligencia debida reforzada, porque la política de aceptación no admite distinciones por nivel de riesgo"], "x": "El párr. 33 prevé que, en situaciones probadas de bajo riesgo, podrán aceptarse medidas simplificadas «siempre que la legislación lo permita», y pone como ejemplo procedimientos básicos de apertura para un particular con pequeños saldos y operaciones rutinarias. Simplificar no es eximir de identificar. Además, la política no debe ser tan restrictiva que perjudique el acceso de grupos financiera o socialmente desfavorecidos.", "ref": "Párr. 33"}, {"id": "B023", "tema": "ban", "tipo": "caso", "q": "Banco Olmo recibe la solicitud de un exministro de otro país, identificado como persona del medio político (PEP) extranjera. Según el párrafo 34, ¿qué aplica?", "a": "La diligencia debida reforzada, que en el caso de PEP extranjeras es obligatoria", "o": ["La diligencia debida reforzada, que en el caso de PEP extranjeras es obligatoria", "La diligencia debida básica, pues el documento remite al GAFI el tratamiento de las PEP sin fijar medidas", "La diligencia debida simplificada, si su país no figura en listados de jurisdicciones con deficiencias", "La diligencia debida reforzada, solo si mantiene un saldo importante"], "x": "El párr. 34 dice que la diligencia reforzada «podrá ser esencial» en el caso de una PEP y que «en particular, esa diligencia debida reforzada es obligatoria en el caso de PEP extranjeras». El distractor tentador mezcla el párr. 9 (las PEP no se desarrollan específicamente por tratarlas el GAFI) para negar cualquier medida; pero el párr. 34 sí fija la obligación para PEP extranjeras, sin condicionarla a saldos ni transferencias.", "ref": "Párr. 34"}, {"id": "B024", "tema": "ban", "tipo": "caso", "q": "El gerente de una sucursal de Banco Sauce quiere continuar la relación con un cliente clasificado como de alto riesgo. Según el párrafo 34, ¿quién deberá aprobar continuar esa relación?", "a": "La alta dirección", "o": ["El comité de auditoría del Consejo", "El gerente regional de sucursales", "El responsable ejecutivo de PBC/FT", "La alta dirección"], "x": "El párr. 34 señala que las decisiones de establecer o proseguir relaciones con clientes de alto riesgo exigen medidas reforzadas, «como la aprobación de establecer o continuar esas relaciones, que deberá adoptar la alta dirección». El responsable ejecutivo de PBC/FT vigila el cumplimiento, pero el texto no le atribuye esta aprobación. La misma lógica aplica a la corresponsalía (Anexo 2, párr. 12).", "ref": "Párr. 34"}, {"id": "B025", "tema": "ban", "tipo": "cifra", "q": "¿Con arreglo a qué Recomendación del GAFI define el documento al «cliente» y pide, en general, no establecer la relación hasta que su identidad esté satisfactoriamente verificada?", "a": "Recomendación 10", "o": ["Recomendación 26", "Recomendación 13", "Recomendación 17", "Recomendación 10"], "x": "Los párr. 35 y 36 remiten a la Recomendación 10 del GAFI: cliente es cualquier persona (física, jurídica o estructura jurídica, nota 21) que entabla una relación comercial o realiza una transacción financiera ocasional con el banco, y, en general, no se establece la relación hasta verificar su identidad. La R. 17 es recurso a terceros, la R. 13 corresponsalía y la R. 26 regulación y supervisión.", "ref": "Párr. 35"}, {"id": "B026", "tema": "ban", "tipo": "caso", "q": "Julián se presenta en Banco Cedro para operar la cuenta de su tía con un poder notarial. Según el párrafo 36, ¿qué deberá hacer el banco?", "a": "Verificar que Julián está autorizado para actuar en nombre de la clienta y verificar su identidad", "o": ["Verificar que Julián está autorizado para actuar en nombre de la clienta y verificar su identidad", "Verificar solo la identidad de la tía, porque la CDD se aplica únicamente al titular", "Verificar el poder notarial y omitir la identidad de Julián, porque no es el titular de la cuenta", "Verificar la identidad de Julián solo si la tía hubiera sido clasificada previamente como de alto riesgo"], "x": "El párr. 36 dice que el banco deberá verificar que cualquier persona que actúe en nombre del cliente está autorizada para hacerlo, y deberá verificar la identidad de esa persona. El párr. 35 confirma que la CDD se aplica no solo a clientes, sino también a quienes actúan por su cuenta y a los beneficiarios efectivos. No depende del nivel de riesgo del titular.", "ref": "Párr. 36"}, {"id": "B027", "tema": "ban", "tipo": "caso", "q": "Para identificar al beneficiario efectivo de una sociedad cliente, Banco Laurel pide al representante una declaración firmada con los datos del beneficiario. Según el párrafo 37:", "a": "El banco puede exigir esa declaración, pero no deberá recurrir únicamente a ella", "o": ["El banco no puede exigir declaraciones escritas; solo puede usar documentos oficiales del cliente", "La declaración firmada es suficiente y releva al banco de otras medidas", "La declaración es válida cuando la certifica un tercero supervisado, y entonces sustituye a la verificación", "El banco puede exigir esa declaración, pero no deberá recurrir únicamente a ella"], "x": "El párr. 37 dice que el banco «podrá exigir» una declaración por escrito sobre la identidad y detalles del beneficiario efectivo, «aunque no deberá recurrir únicamente a esas declaraciones». La verificación debe apoyarse en documentos, datos o informaciones fiables e independientes. El distractor tentador convierte la declaración en suficiente; el texto lo descarta.", "ref": "Párr. 37"}, {"id": "B028", "tema": "ban", "tipo": "memoria", "q": "Cuando el banco recurre a documentos para verificar la identidad, ¿cuáles son los mejores según el párrafo 37?", "a": "Los más difíciles de obtener ilícitamente o de falsificar", "o": ["Los más difíciles de obtener ilícitamente o de falsificar", "Los expedidos más recientemente por cualquier autoridad", "Los que incluyan fotografía y firma autógrafa del titular", "Los presentados en original y en persona en la sucursal"], "x": "El párr. 37 afirma que «los mejores documentos para verificar la identidad son aquéllos más difíciles de obtener ilícitamente o falsificar». Los otros criterios pueden sonar razonables, pero no son los que da el texto. Si se usan otras fuentes distintas de documentos, el banco debe cerciorarse de que métodos y fuentes son adecuados y coherentes con sus políticas y con el perfil de riesgo del cliente.", "ref": "Párr. 37"}, {"id": "B029", "tema": "ban", "tipo": "caso", "q": "Un solicitante de Banco Roble se niega a entregar la información que permitiría completar las medidas CDD. Aún no se ha abierto la cuenta. Según el párrafo 41, ¿qué debe hacer el banco?", "a": "No abrir la cuenta y, en cualquier caso, elaborar un STR, con sujeción a la legislación nacional aplicable", "o": ["No abrir la cuenta y archivar la solicitud, porque el STR requiere que ya exista una relación comercial vigente", "No abrir la cuenta y, en cualquier caso, elaborar un STR, con sujeción a la legislación nacional aplicable", "Abrir la cuenta y clasificar al cliente como de alto riesgo, con seguimiento reforzado", "Abrir la cuenta con limitaciones de uso, porque la verificación posterior es la regla general si el cliente no coopera"], "x": "El párr. 41 dice que, cuando el banco sea incapaz de completar las medidas CDD, no deberá abrir la cuenta, iniciar relaciones ni realizar la transacción, y que «en cualquier caso» deberá elaborar un STR cuando existan problemas para completar la CDD; la nota 26 lo matiza: «con sujeción a la legislación nacional sobre tratamiento de transacciones sospechosas». La verificación posterior es una excepción para ciertas circunstancias, no la regla.", "ref": "Párr. 41"}, {"id": "B030", "tema": "ban", "tipo": "caso", "q": "Banco Pino abrió una cuenta a una empresa, pero durante el establecimiento de la relación surgieron problemas de verificación que no han podido resolverse. Según el párrafo 41:", "a": "Deberá cerrar la cuenta o, si no, bloquear el acceso a ella", "o": ["Deberá esperar a que el supervisor indique si procede el cierre o el bloqueo de la cuenta", "Deberá cerrar la cuenta o, si no, bloquear el acceso a ella", "Deberá transferir la cuenta a otra entidad del grupo con normas CDD menos estrictas", "Deberá mantenerla activa y reclasificarla como de riesgo medio hasta la siguiente revisión"], "x": "El párr. 41 prevé que, si la cuenta ya fue abierta y surgen problemas de verificación que no pueden resolverse, «el banco deberá cerrar la cuenta o, si no, bloquear el acceso a ella»; además, elaborar un STR (con sujeción a la legislación nacional, nota 26). La decisión es del banco, no requiere instrucción del supervisor, y mantener la cuenta activa contradice el texto.", "ref": "Párr. 41"}, {"id": "B031", "tema": "ban", "tipo": "trampa", "q": "Sobre completar la verificación de identidad después de establecer la relación comercial, ¿qué afirmación NO se ajusta al párrafo 41?", "a": "Es la regla general, aplicable a cualquier cliente que prefiera entregar su documentación más tarde", "o": ["Es la regla general, aplicable a cualquier cliente que prefiera entregar su documentación más tarde", "Sería admisible en ciertas circunstancias, cuando resulte esencial no interrumpir el curso normal de los negocios", "Si los problemas de verificación no se resuelven, deberá cerrar la cuenta o bloquear el acceso", "El banco deberá fijar condiciones y limitaciones bajo las cuales el cliente podrá usar la relación antes de verificar"], "x": "La regla del párr. 41 es no abrir la cuenta si no se completa la CDD. La verificación posterior es una excepción: «existen circunstancias» en que sería admisible, porque resultaría esencial no interrumpir el curso normal de los negocios, y entonces el banco fija condiciones y limitaciones de uso. Si luego los problemas no se resuelven, cierra la cuenta o bloquea el acceso. No depende de la preferencia del cliente.", "ref": "Párr. 41"}, {"id": "B032", "tema": "ban", "tipo": "caso", "q": "Durante la CDD de un futuro cliente, el analista de Banco Fresno encuentra motivos razonables para sospechar que sus fondos proceden de delitos. El cliente llama para preguntar por qué se retrasa su cuenta. Según el párrafo 41:", "a": "No aceptar voluntariamente la apertura, elaborar el STR y asegurar que el cliente no sepa, ni indirectamente, del STR", "o": ["Abrir la cuenta para no alertarlo y vigilarla de cerca, dejando el STR para cuando existan movimientos sospechosos", "No aceptar voluntariamente la apertura, elaborar el STR y asegurar que el cliente no sepa, ni indirectamente, del STR", "No abrir la cuenta y omitir el STR, porque la notificación requiere operaciones que ya se hayan realizado", "Rechazar la apertura y explicarle que se debe a una sospecha notificada, para cumplir con el principio de transparencia"], "x": "El párr. 41 dice que, cuando la CDD ofrezca motivos razonables para sospechar que los fondos proceden de BC/FT, los bancos no deberán aceptar voluntariamente la apertura, deberán elaborar un STR notificándolo a las autoridades competentes y asegurarse de que el cliente no esté informado, «ni siquiera de forma indirecta», de que un STR ha sido, está siendo o será elaborado. Abrir la cuenta para no alertarlo contradice la primera parte.", "ref": "Párr. 41"}, {"id": "B033", "tema": "ban", "tipo": "caso", "q": "Banco Arce tiene motivos para pensar que otro banco negó servicios a un solicitante por sospechar actividades ilícitas. Según el párrafo 43, ¿qué deberá hacer Banco Arce?", "a": "Considerar clasificarlo de alto riesgo con diligencia reforzada, elaborar un STR y/o no aceptarlo, según sus procedimientos", "o": ["Rechazarlo, porque la negativa de otro banco obliga a todo el sistema bancario a no aceptar al solicitante", "Considerar clasificarlo de alto riesgo con diligencia reforzada, elaborar un STR y/o no aceptarlo, según sus procedimientos", "Pedir al otro banco copia de su STR y aceptarlo solo si ese banco le confirma que la sospecha ya ha sido descartada", "Aceptarlo con diligencia básica, porque los clientes tienen derecho a cambiar de banco y la negativa ajena no le vincula"], "x": "El párr. 43 reconoce que los clientes tienen derecho a cambiar de banco, pero si un banco tiene motivos para pensar que otro negó servicios por sospecha, deberá considerar clasificarlo como de alto riesgo y aplicar diligencia reforzada, elaborar un STR y/o no aceptarlo «con arreglo a sus propios procedimientos y evaluaciones del riesgo». No es un rechazo automático ni basta la diligencia básica.", "ref": "Párr. 43"}, {"id": "B034",
