<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mapa interactivo del régimen de prevención y de las autoridades nacionales en PLD/FT (temario CNBV 1.3), con fichas de la UIF y la CNBV y simulador de 80 reactivos.">
<title>Mapa de las autoridades nacionales PLD/FT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}
.qactions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accion);color:var(--accion-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600;font-size:17px;margin-top:4px}
.score .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.trows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.trow2{display:grid;grid-template-columns:minmax(0,300px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.trow2 .tb{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow2 .tb i{display:block;height:100%;background:var(--principal-linea)}
.trow2 .tv{font-variant-numeric:tabular-nums;font-weight:700}
.miss{margin-top:16px;background:var(--surface-2);border-radius:12px;padding:12px 16px}
.miss summary{cursor:pointer}
.miss ul{margin:6px 0 0;padding-left:18px} .miss li{margin:8px 0}
.siminfo{font-size:13px;color:var(--muted);margin:12px 0 0}
/* repaso (tandas al azar o secuencia fija) */
.para{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--accion);border-radius:12px;padding:12px 16px;margin:-4px 0 18px;font-size:17px;font-weight:600;max-width:1040px}.para b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accion);margin-bottom:2px}
.tu{margin:10px 0;background:var(--surface);border:2px solid var(--negro);border-left:8px solid var(--coral);border-radius:10px;padding:10px 14px;font-size:16px}.tu b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.dist{margin-top:12px;font-weight:500;font-size:15px}.dist ul{margin:4px 0 0;padding-left:0;list-style:none}.dist li{margin:5px 0;padding-left:26px;text-indent:-26px}.dist li b{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;text-indent:0;margin-right:6px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-display);font-size:12px;background:var(--surface)}
.rp-fallas{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.rp-fallas h3{font-size:18px}
.rp-fallas p{font-size:14.5px}
.rp-box{scroll-margin-top:90px}
.rp-box .qtext{font-size:clamp(22px,2.8vw,34px)}
.rp-box .opt{font-size:17px}
.rp-clave{margin-top:12px;border-left:6px solid var(--principal-linea);background:var(--surface-2);border-radius:8px;padding:10px 14px;font-weight:600}
.rp-clave .lbl{margin-bottom:4px}
.rp-fin{margin:10px 0 0;padding-left:22px;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,26px);line-height:1.35}
.rp-fin li{margin:10px 0}
.rp-fin small{display:block;font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--muted)}
.rp-box:fullscreen{max-width:none;border-radius:0;border:0;padding:40px 6vw;overflow:auto;background:var(--bg)}
.rp-box:fullscreen .qtext{font-size:clamp(26px,3vw,42px)}
.rp-box:fullscreen .opt{font-size:20px}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(27,27,30,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{padding:20px 22px 18px;background:var(--c);color:var(--ci);display:flex;justify-content:space-between;gap:12px;align-items:center}
.dhead h3{font-size:28px;font-weight:700;color:inherit}
.dhead .x{background:rgba(255,255,255,.25);border:0;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:inherit;flex:none}
.dbody{padding:16px 22px 30px;overflow:auto}
.dbody ul{padding-left:18px;margin:0}
.dbody li{margin:8px 0}
.dbody .hook{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 12px}

footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:4px solid var(--membrete);padding-top:14px}
footer b{color:var(--ink)}

@media (max-width:1100px){.track{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:18px}.track::before{display:none}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}

  .map.nmany{grid-template-columns:1fr;grid-template-areas:"core" "izq" "der";gap:22px}

  .map svg.wires{display:none}
  .core{width:230px;justify-self:center}
  .opts{grid-template-columns:1fr}
  .lane{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .arrow{width:auto;height:30px;transform:rotate(90deg)}
  .stepd{grid-template-columns:1fr}
  .stepd ul{columns:1}
  .track{grid-template-columns:repeat(3,minmax(0,1fr))}
  .frac .inc{padding-left:16px}
}
@media (max-width:600px){ .chant p span{white-space:normal} .trow2{grid-template-columns:1fr auto}.trow2 .tb{grid-column:1/-1;order:3} }
@media (max-width:520px){ .rhythm{flex-wrap:wrap} .rh{flex:1 1 40%} }
.printhead{display:none}
/* franja del sitio (modo sitio: sólo si datos.sitio existe) */
.sitebar{display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:8px 16px;background:var(--negro);color:#fff;overflow-x:auto;scrollbar-width:none;font-family:var(--f-display);font-size:13px}
.sitebar::-webkit-scrollbar{display:none}
.sitebar .sb-mod{font-weight:700;letter-spacing:.04em;white-space:nowrap;margin-right:4px;color:#fff;text-decoration:none}

.sitebar a.sb-p:hover{border-color:#fff}
.sitebar .sb-p[aria-current="page"]{background:var(--principal);border-color:var(--principal);color:var(--principal-ink)}
.sitebar .sb-p.off{opacity:.45;border-style:dashed;cursor:not-allowed}
.sitebar .sb-sep{width:1px;height:20px;background:rgba(255,255,255,.3);flex:none}
.sitebar .sb-cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.sitebar .sb-ses{white-space:nowrap;color:rgba(255,255,255,.8);margin-left:auto;padding-left:12px;font-weight:600}
@media (max-width:700px){.sitebar .sb-ses{display:none}}
@media print{
  body{background:#fff;padding:0}
  .sitebar,.top,.hero,.traps,section.block:not(.sim),footer,.simbar,.modes,.sim > .lbl,.sim .sec-head,.qactions,.siminfo,.drawer,.scrim{display:none!important}
  .quiz{box-shadow:none;border:0;padding:0;max-width:none}

  .trow2 .tb{border-color:#999} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

nes y canales de envío o distribución con los que opera la entidad (21ª-2, fr. I, último párrafo).", "Los indicadores pueden ser cualitativos o cuantitativos, y varían de un sujeto supervisado a otro según su Contexto (Guía, C, fase I, proceso 1).", "Obligatorio incluir indicadores específicos del delito del art. <b>400 Bis<\/b> (LD) y del art. <b>139 Quáter<\/b> (FT) del Código Penal Federal, para <b>cada<\/b> elemento de riesgo (21ª-2, último párrafo, adicionado DOF 28-08-2024).", "La Evaluación Nacional de Riesgos y sus actualizaciones son fuente de información externa obligatoria; su análisis debe reflejarse en la valoración de los indicadores y quedar documentado (21ª-1; Guía, C).", "La granularidad la decide cada sujeto supervisado según sus necesidades y su Contexto (Guía, C, fase I, proceso 1)."], "ir": "#elementos", "destacado": true}, {"etiqueta": "Proceso 2", "nombre": "Medición", "sub": "Pesos, escalas y tres niveles", "verbo": "Mido", "desc": "Se cuantifica el riesgo en tres niveles: cada indicador, cada elemento y la entidad completa. Nunca en uno solo ni en algunos.", "orden": 2, "panel": "Proceso 2 · Medición", "puntos": ["Método exhaustivo con <b>al menos tres niveles de detalle<\/b>: indicadores, elementos de riesgo y sujeto supervisado; se cuantifican los tres, no sólo uno o algunos (Guía, C, fase I, proceso 2).", "Se asigna un <b>peso o porcentaje<\/b> a cada indicador dentro de su elemento, y a cada elemento dentro del riesgo de la entidad, de manera consistente (21ª-2, fr. II).", "Se define además la <b>escala o rango<\/b> de calificación. Asignar peso y definir escala son procesos <b>distintos e independientes<\/b> entre sí (Guía, C, fase I, proceso 2).", "Riesgo = probabilidad de ocurrencia de una operación de LD/FT (no frecuencia de eventos) combinada con impacto medido por concentración del negocio (no montos ni multas).", "Ejemplos de escala que da la propia Guía: alto/medio/bajo; valores del 0 al 100; 1, 2, 3, 4 y 5. Los pesos, en cambio, riesgo residual", "verbo": "Implemento", "desc": "Se alimenta la metodología con la operación real de la entidad y se obtiene su grado de exposición al riesgo, ya con los mitigantes aplicados.", "orden": 4, "panel": "Fase II · Implementación", "puntos": ["No debe haber inconsistencias entre la información que se incorpora a la metodología y la que obra en los sistemas automatizados de la entidad (21ª-3, fr. I; esos sistemas son los de la 51ª).", "Se usa, al menos, la información del total de número de clientes, número de operaciones y monto operado de un periodo <b>no menor a doce meses<\/b> (21ª-3, fr. II).", "El resultado, una vez considerados los efectos de los mitigantes existentes, es lo que se conoce como <b>riesgo residual<\/b> (Guía, C, fase II).", "La evaluación final de la implementación es el inicio de la valoración (Guía, C, fase II).", "La entidad debe evaluar riesgos también <b>con antelación<\/b> al lanzamiento o uso de nuevos productos, servicios, tipos de clientes o usuarios, países o áreas geográficas, canales y transacciones (21ª-1, último párrafo)."], "ir": "#cifras", "destacado": false}, {"etiqueta": "Ajustar", "nombre": "Modificar el Manual de Cumplimiento", "sub": "Plazo de 12 meses", "verbo": "Ajusto", "desc": "Si aparecen mayores o nuevos riesgos hay que cambiar políticas y procedimientos, con año y mes identificados, dentro de doce meses.", "orden": 5, "panel": "Fase II · Ajuste de mitigantes", "puntos": ["Cuando de los resultados se detecten <b>mayores o nuevos riesgos<\/b>, deben modificarse las políticas, criterios, medidas y procedimientos del Manual de Cumplimiento o de otro manual (21ª-3).", "Plazo: <b>no mayor a doce meses<\/b> contados a partir de que la entidad cuente con los resultados de su implementación (21ª-3).", "Las modificaciones deben estar claramente identificadas y señaladas, indicando al menos el <b>año y mes<\/b> en que se obtuvieron los resultados que les dieron lugar (21ª-3).", "La Guía añade que esto aplica <b>sin importar<\/b> si el riesgo residual está o no fuera de los niveles de tolerancia definidos por la propia entidad.", "Cuidado con el distractor: los 12 meses son para <b>realizar las modificaciones<\/b>, no el plazo para presentar el Manual a la Comisión."], "destacado": false}]}, {"letra": "III", "titulo": "Fase III · Valoración", "pregunta": "¿Sigue sirviendo?", "ritmo": "2 tareas", "corto": "Valoración", "color": "morado", "items": [{"etiqueta": "Revisar", "nombre": "Revisar y actualizar la metodología", "sub": "Tres disparadores", "verbo": "Valoro", "desc": "La metodología se revisa por tres razones: nuevos riesgos detectados, actualización de la ENR, o el paso de doce meses.", "orden": 6, "panel": "Fase III · Revisión y actualización", "puntos": ["Se revisa y actualiza cuando se detecten nuevos riesgos, cuando se actualice la evaluación nacional de riesgos, <b>o<\/b> en un plazo no mayor a 12 meses desde que se cuente con los resultados de la implementación (21ª-4).", "Las revisiones y actualizaciones deben constar <b>por escrito<\/b> y estar a disposición de la Secretaría y de la Comisión (21ª-4).", "Debe ser un proceso <b>continuo<\/b>, no un ejercicio que se hace una sola vez, y corre <b>con independencia de la auditoría anual<\/b> que se realice conforme a las Disposiciones (Guía, C, fase III).", "Ejemplos que da la Guía de cambios que la disparan: nuevos productos, prácticas, tecnologías y servicios; modificación de los existentes; apertura o cierre de cuentas de clientes de mayor riesgo; fusiones, adquisiciones o escisiones.", "La Comisión <b>podrá<\/b> revisar y, en su caso, ordenar la modificación de la metodología o de los mitigantes, y solicitar un plan de acción con medidas reforzadas (21ª-4, segundo párrafo). Es una facultad, no una revisión automática."], "destacado": false}, {"etiqueta": "Monitorear", "nombre": "Monitoreo y señales de alerta", "sub": "Seguimiento permanente", "verbo": "Monitoreo", "desc": "Se vigila el riesgo indicador por indicador y consolidado por elemento, con alertas que anticipen fuentes de riesgo.", "orden": 7, "panel": "Fase III · Monitoreo", "puntos": ["Se revisa la presencia y el funcionamiento de los procesos mediante actividades permanentes de monitoreo, evaluaciones independientes o una combinación de ambas (Guía, C, fase III).", "Seguimiento que facilite la rápida <b>detección o corrección<\/b> de deficiencias en los procesos de administración del riesgo.", "Seguimiento del riesgo <b>por cada indicador<\/b> y del <b>consolidado por elemento<\/b>, evaluando la efectividad de los criterios, medidas, políticas y procedimientos.", "Establecer señales de alerta <b>descriptiva y prospectiva<\/b> que indiquen potenciales fuentes de riesgo.", "Con eso se desarrollan informes sobre la evolución del riesgo y la eficiencia y eficacia de los controles."], "destacado": false}]}, {"letra": "+", "titulo": "Lo que la envuelve (no es una cuarta fase)", "pregunta": "¿Quién responde y qué se guarda?", "ritmo": "3 obligaciones", "corto": "Gobierno y papeles", "color": "negro", "items": [{"etiqueta": "Grupo", "nombre": "Metodología a nivel grupo financiero", "sub": "Guía, apartado D", "verbo": "Consolido", "desc": "Si la entidad forma parte de un grupo financiero, su diseño debe decir cómo toma en cuenta los resultados de las demás entidades del grupo.", "orden": 8, "panel": "Grupo financiero", "puntos": ["Aplica a entidades que formen parte de grupos financieros en términos de la Ley para Regular las Agrupaciones Financieras (21ª-1, tercer párrafo; Guía, D).", "Deben establecer <b>en el diseño<\/b> de su metodología cómo se tomarán en cuenta los resultados de la metodología que, en su caso, hayan implementado las demás entidades financieras del grupo.", "La Guía además <b>recomienda<\/b> —no obliga— que a nivel grupo exista coordinación y estrategia para la mitigación del riesgo.", "Determinar los riesgos a nivel grupo permite identificarlos por separado y en conjunto, y que la alta dirección del grupo los comprenda y mitigue."], "destacado": false}, {"etiqueta": "Papeles", "nombre": "Documentación y conservación", "sub": "Guía, apartado E · 21ª-4", "verbo": "Documento", "desc": "Todo el diseño, uso y validación se documenta; puede ir en documento distinto al Manual y se conserva al menos cinco años.", "orden": 9, "panel": "Documentación", "puntos": ["El diseño y los procesos de uso y validación <b>podrán<\/b> estar contenidos en un documento <b>distinto<\/b> al Manual de Cumplimiento (Guía, E).", "La documentación describe todos los procesos de identificación, medición y mitigación, incluidos sus detalles operativos, las modificaciones realizadas y las áreas responsables e involucradas.", "Debe tener claridad y detalle suficientes para que el personal de la entidad <b>o un tercero<\/b> comprenda el proceso y evalúe su idoneidad.", "Conservación de toda la información generada para diseño, implementación y valoración: plazo <b>no menor a cinco años<\/b> (21ª-4, último párrafo; Guía, E).", "Se proporciona a la Secretaría y a la Comisión, a requerimiento de esta última, dentro del plazo que la propia Comisión establezca."], "destacado": false}, {"etiqueta": "Quién", "nombre": "Gobernanza: quién somete y quién presenta", "sub": "Guía, apartado E", "verbo": "Apruebo", "desc": "El Oficial de Cumplimiento somete la metodología al Comité; el Comité presenta al consejo los resultados de su implementación.", "orden": 10, "panel": "Gobernanza", "puntos": ["El <b>Oficial de Cumplimiento<\/b> deberá someter la metodología a la aprobación del <b>Comité<\/b>, así como los resultados de su implementación (Guía, E).", "El <b>Comité<\/b> deberá presentar al consejo de administración, directivo o administrador único los <b>resultados de su implementación<\/b> (Guía, E).", "Eso debe ocurrir en un periodo <b>menor a 12 meses<\/b> a partir de la fecha de la última modificación a la metodología (Guía, E).", "Tratándose de Representantes, se ajustarán a lo que establezcan las Disposiciones aplicables (Guía, E).", "Ojo con el contraste: el <b>modelo de riesgos de clientes<\/b> del Anexo 3 lo aprueba el <b>comité de riesgos<\/b>, a propuesta del Comité, y se informa al consejo (25ª Bis). No es el mismo circuito."], "destacado": false}]}], "frase": {"titulo": "Para recitar en voz alta: un verbo por pieza", "html": "<b>Identifico · Mido · Mitigo<\/b> — eso es el diseño.<br><b>Implemento · Ajusto<\/b> — eso es la implementación.<br><b>Valoro · Monitoreo<\/b> — eso es la valoración.<br><b>Consolido · Documento · Apruebo<\/b> — eso es lo que la envuelve."}}, {"tipo": "mapa", "id": "elementos", "nav": "Los 4 elementos", "titulo": "Los 4 elementos de riesgo y sus indicadores", "intro": "El examen pregunta por elemento: «¿el domicilio del cliente en qué elemento va?». Los cuatro se agrupan en dos pares: lo que ofrezco y con quién, y dónde ocurre y por qué vía. Los indicadores que enumera la Guía son enunciativos, mas no limitativos.", "centro": {"t": "4 elementos mínimos", "s": "21ª-2, fr. I<br>Guía, apartado C"}, "ramas": [{"letra": "A", "titulo": "Lo que ofrezco y con quién", "pregunta": "¿Qué vendo y a quién?", "ritmo": "2 elementos", "corto": "Qué y quién", "estilo": "ficha", "color": "principal", "items": [{"etiqueta": "a)", "nombre": "Productos y servicios", "sub": "¿Qué vendo?", "verbo": "Vendo", "orden": 1, "panel": "Elemento a) Productos y servicios", "puntos": ["Características propias de cada servicio y producto que faciliten la realización de operaciones de LD/FT, incluyendo <b>entre otras<\/b>:", "<b>Anonimato<\/b> o falta de identificación del cliente, del usuario o de alguna persona involucrada en la operación.", "Productos o servicios de <b>alto nivel de valor<\/b>.", "Productos o servicios que <b>facilitan la transferencia de valor<\/b>.", "La entidad debe comprender y evaluar el riesgo específico de la <b>totalidad<\/b> de los productos y servicios con los que opera (Guía, C, fase I, proceso 1, inciso i)."]}, {"etiqueta": "b)", "nombre": "Clientes y usuarios", "sub": "¿Con quién opero?", "verbo": "Conozco", "orden": 2, "panel": "Elemento b) Clientes y usuarios", "puntos": ["Características propias del tipo de clientes y usuarios que hagan a la entidad más susceptible de estar vinculada con LD/FT, incluyendo <b>entre otras<\/b>:", "<b>Tipo de persona<\/b>: física, moral o fideicomiso.", "<b>Edad o fecha de constitución<\/b>.", "<b>Nacionalidad<\/b>.", "<b>Domicilio<\/b> — ojo: el domicilio del cliente es indicador de <b>este<\/b> elemento, no del de zonas geográficas.", "<b>Actividad económica o giro mercantil<\/b>."]}]}, {"letra": "B", "titulo": "Dónde y por dónde", "pregunta": "¿Dónde ocurre y por qué vía?", "ritmo": "2 elementos", "corto": "Dónde y cómo", "estilo": "ficha", "color": "turquesa", "items": [{"etiqueta": "c)", "nombre": "Países y áreas geográficas", "sub": "¿Dónde ocurre?", "verbo": "Ubico", "orden": 3, "panel": "Elemento c) Países y áreas geográficas", "puntos": ["<b>Para países:<\/b> regímenes fiscales preferentes; países con medidas deficientes en materia de LD/FT; países con alto nivel de corrupción, economía informal o delincuencia; países identificados por el propio sujeto supervisado como de mayor riesgo.", "<b>Para áreas geográficas nacionales:<\/b> incidencia delictiva; nivel de marginación; lugares de frontera o con puertos de entrada y salida internacionales; áreas identificadas por el propio sujeto supervisado como de mayor riesgo.", "Se refiere a los países y áreas <b>relacionados con las operaciones<\/b> de la entidad, es decir, dónde se realizan.", "Puede coincidir con el domicilio del cliente, pero no es necesariamente lo mismo: el domicilio es indicador del elemento de clientes y usuarios."]}, {"etiqueta": "d)", "nombre": "Transacciones y canales", "sub": "¿Cómo entra y sale el dinero?", "verbo": "Canalizo", "orden": 4, "panel": "Elemento d) Transacciones y canales de envío o distribución", "puntos": ["<b>Para canales:<\/b> canales de envío <b>no presenciales<\/b> (cajeros, medios electrónicos); canales con <b>acceso inmediato<\/b> a los recursos; canales que permitan operaciones por <b>montos altos<\/b>.", "<b>Para transacciones:<\/b> hay que definir una serie de transacciones o <b>escenarios de riesgo<\/b> según el modelo de negocio, que contemplen entre otros: frecuencia y monto de las transacciones; instrumento monetario, moneda o medios de pago de riesgo.", "Se trata de los canales y transacciones vinculados con las operaciones de la entidad, con sus clientes y con sus usuarios (21ª-2, fr. I, inciso d).", "Para las Instituciones de Tecnología Financiera se suma la <b>Infraestructura Tecnológica<\/b> como objeto que la metodología debe abarcar (DCG ITF, art. 3 y art. 4, fr. I, último párrafo), aunque el catálogo de elementos de esa fracción también tiene cuatro incisos. En Bancos y SOFOMES la Infraestructura Tecnológica no aparece."]}]}], "frase": {"titulo": "Los cuatro en una línea", "html": "<b>Qué vendo · Con quién opero · Dónde ocurre · Cómo entra y sale.<\/b><br>Productos y servicios · Clientes y usuarios · Países y áreas geográficas · Transacciones y canales."}}, {"tipo": "escala", "id": "medicion", "titulo": "La medición corre en tres niveles, no en uno", "niveles": [{"t": "Indicador", "d": "Cada característica específica de riesgo dentro de un elemento.", "req": "Se le asigna un peso dentro de su elemento y una calificación según la escala definida."}, {"t": "Elemento de Riesgo", "d": "Cada uno de los factores genéricos —al menos los cuatro mínimos—.", "req": "Se le asigna un peso dentro del riesgo de la entidad en función de su importancia, y por separado se le da una calificación con base en las calificaciones y pesos de sus indicadores y el impacto."}, {"t": "Sujeto Supervisado", "d": "El riesgo de la entidad completa.", "req": "Se califica con base en las calificaciones y pesos asignados a cada elemento de riesgo."}], "memo": "La Guía es explícita: «se deberá contar con una cuantificación de los Riesgos en los tres niveles mencionados y no solo en uno o algunos de ellos». Y aclara que definir la escala es un proceso distinto e independiente de asignar el peso."}, {"tipo": "tarjetas", "id": "mitigantes", "nav": "Mitigantes", "titulo": "Los cuatro mitigantes que enumera la Guía", "tarjetas": [{"barra": true, "color": "principal", "titulo": "Gobierno corporativo", "ref": "Guía, C, fase I, proceso 3", "html": "La cultura de administración a nivel organizacional. La responsabilidad del cumplimiento <b>comienza desde el nivel jerárquico más alto<\/b> y desde ahí se dirigen esfuerzos y recursos humanos y materiales para identificar y mitigar riesgos."}, {"barra": true, "color": "turquesa", "titulo": "Auditoría en materia de PLD/FT", "ref": "Guía, C, fase I, proceso 3", "html": "Revisión <b>independiente<\/b> de la adecuada ejecución de políticas, criterios, medidas y procedimientos. Debe existir <b>constancia documental<\/b>. Además de ser mitigante en sí misma, su resultado sirve de insumo para definir la efectividad de los demás mitigantes."}, {"barra": true, "color": "morado", "titulo": "Estructuras internas", "ref": "Guía, C, fase I, proceso 3", "html": "Comprende el establecimiento del Comité y la designación del Oficial de Cumplimiento o Representante, incluida su capacitación y el cumplimiento de sus funciones. Se <b>diferencia<\/b> de la actividad genérica del gobierno corporativo."}, {"barra": true, "color": "negro", "titulo": "Capacitación", "ref": "Guía, C, fase I, proceso 3", "html": "Programas de capacitación y difusión impartidos <b>al menos una vez al año<\/b>, dirigidos <b>especialmente<\/b> a consejo de administración o administrador único, directivos, funcionarios y empleados, <b>incluidos<\/b> los de áreas de atención al público o de administración de recursos. Los temas deben ser <b>coherentes con los resultados<\/b> de la implementación de la metodología y adecuarse a las responsabilidades de cada destinatario."}], "nota": "La lista es enunciativa, mas no limitativa: la entidad puede considerar otros mitigantes según su estructura y operativa. Lo que no es opcional es tomar en cuenta el 100 % de los que ya tenga al momento del diseño."}, {"tipo": "cifras", "id": "cifras", "nav": "Plazos", "titulo": "Las cifras que sí se preguntan", "cifras": [["3", "fases", "Diseño, implementación y valoración", "Guía, apartado C"], ["3", "procesos", "Identificación, medición y mitigación — dentro del diseño", "21ª-1, 2º párr.; Guía, C, fase I"], ["4", "elementos", "Productos y servicios; clientes y usuarios; países y áreas geográficas; transacciones y canales", "21ª-2, fr. I"], ["3", "niveles", "De detalle en la medición: indicador, elemento y sujeto supervisado", "Guía, C, fase I, proceso 2"], ["2", "delitos", "Indicadores específicos de 400 Bis (LD) y 139 Quáter (FT) en cada elemento", "21ª-2, último párr."], ["12", "meses (mínimo)", "Periodo de datos para implementar: número de clientes, operaciones y monto operado", "21ª-3, fr. II"], ["12", "meses (máximo)", "Para modificar políticas y mitigantes desde que se tienen los resultados", "21ª-3, último párr."], ["12", "meses (máximo)", "Para revisar y actualizar el cumplimiento y resultados del Capítulo II Bis", "21ª-4, 1er párr."], ["12", "meses (menos de)", "Para que el Comité presente al consejo los resultados, desde la última modificación", "Guía, apartado E"], ["5", "años (mínimo)", "Conservación de la información generada por el Capítulo II Bis", "21ª-4, último párr."], ["1", "vez al año", "Capacitación y difusión, como mitigante", "Guía, C, fase I, proceso 3"], ["100", "% de mitigantes", "Los que estén establecidos al momento del diseño se toman todos en cuenta", "Guía, C, fase I, proceso 3"]]}, {"tipo": "simulador", "id": "examen", "nav": "Practicar ▸"}], "temas": {"dis": "Diseño: identificar, medir, mitigar", "imp": "Implementación y valoración", "gob": "Documentación, grupo y gobernanza"}, "modos": [{"k": "dis", "l": "Diseño", "tema": "dis"}, {"k": "imp", "l": "Implementación y valoración", "tema": "imp"}, {"k": "gob", "l": "Papeles y gobernanza", "tema": "gob"}, {"k": "caso", "l": "Casos prácticos", "tipos": ["caso"]}, {"k": "tr", "l": "Plazos y trampas", "tipos": ["cifra", "trampa"]}], "banco": [{"id": "M001", "tema": "dis", "tipo": "caso", "q": "Banco Ribera concluyó el diseño de su metodología de evaluación de Riesgos y su Oficial de Cumplimiento pregunta dónde debe quedar establecido ese diseño. ¿Qué responde la norma?", "a": "En su Manual de Cumplimiento o bien en algún otro documento o manual elaborado por la propia entidad.", "o": ["En su Manual de Cumplimiento o bien en algún otro documento o manual elaborado por la propia entidad.", "Únicamente en el Manual de Cumplimiento, porque la norma no admite que el diseño se documente en un instrumento distinto de ese manual.", "En un anexo del informe anual de auditoría en materia de prevención de LD/FT que la entidad remite a la Comisión cada ejercicio.", "En el acta de la sesión del comité de riesgos en la que se hubiere aprobado el modelo de evaluación de Riesgos de sus Clientes."], "x": "La norma es deliberadamente flexible: el diseño debe estar establecido en el Manual de Cumplimiento o en otro documento o manual de la entidad. El distractor más tentador es el que exige el Manual de manera exclusiva, porque suena más estricto y por tanto más seguro; pero la disposición usa la disyuntiva «o bien», y la Guía lo confirma al señalar que el diseño podrá estar contenido en un documento diferente al Manual. Fundamento: 21ª-1, segundo párrafo, y Guía CNBV, apartado E.", "ref": "21ª-1, 2º párr."}, {"id": "M002", "tema": "dis", "tipo": "memoria", "q": "¿Qué procesos debe establecer y describir el diseño de la metodología de evaluación de Riesgos?", "a": "Los de identificación, medición y mitigación de los Riesgos.", "o": ["Los de identificación, clasificación y calificación por Grado de Riesgo de cada uno de sus Clientes.", "Los de identificación, medición y mitigación de los Riesgos.", "Los de identificación, medición y monitoreo permanente de los Riesgos que se hubieren detectado.", "Los de diseño, implementación y valoración de la metodología de evaluación de Riesgos de la entidad."], "x": "El diseño debe establecer y describir todos los procesos de identificación, medición y mitigación. El distractor más tentador es el que lista diseño, implementación y valoración: eso es cierto, pero son las tres fases del desarrollo de la metodología, no los procesos que el diseño debe describir. Fundamento: 21ª-1, segundo párrafo, y Guía CNBV, apartado C, fase I.", "ref": "21ª-1, 2º párr."}, {"id": "M003", "tema": "dis", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones NO corresponde a la estructura de la metodología de evaluación de Riesgos?", "a": "La valoración es el tercer proceso que integra la fase de diseño de la metodología de evaluación.", "o": ["El diseño, la implementación y la valoración son las tres fases del desarrollo de la metodología.", "La identificación, la medición y la mitigación son los tres procesos que comprende la fase de diseño.", "La valoración es el tercer proceso que integra la fase de diseño de la metodología de evaluación.", "La evaluación final que se realiza al concluir la implementación constituye el inicio de la fase de valoración."], "x": "Fases y procesos no son sinónimos: las fases son tres y van por fuera (diseño, implementación y valoración); los procesos son tres y viven dentro de la primera fase (identificación, medición y mitigación). La opción incorrecta es la que mete la valoración dentro del diseño: resulta tentadora porque el número tres se repite en ambos niveles, pero el tercer proceso del diseño son los mitigantes, y la valoración es la tercera fase, nunca un proceso del diseño. Fundamento: Guía CNBV, apartado C, fases I a III.", "ref": "Guía CNBV, apartado C"}, {"id": "M004", "tema": "dis", "tipo": "caso", "q": "Financiera Altamar propone identificar sus indicadores considerando sólo los tres productos que concentran el mayor volumen de operación. ¿Qué exige la norma en el proceso de identificación?", "a": "Considerar el total de los productos, servicios, tipos de Clientes y Usuarios, países o áreas geográficas, transacciones y canales con los que opera.", "o": ["Considerar la muestra representativa de productos y canales que apruebe el área de auditoría interna al inicio de cada ejercicio social de la entidad.", "Considerar únicamente los productos y servicios que durante el último ejercicio hubieren concentrado el mayor número de operaciones inusuales reportadas.", "Considerar sólo aquellos productos, servicios y canales que la entidad hubiere clasificado previamente con Grado de Riesgo alto conforme a su modelo de Clientes.", "Considerar el total de los productos, servicios, tipos de Clientes y Usuarios, países o áreas geográficas, transacciones y canales con los que opera."], "x": "La identificación es exhaustiva: debe considerarse el total de productos, servicios, tipos de Clientes y Usuarios, países o áreas geográficas, transacciones y canales. El distractor más tentador es el de la muestra representativa, porque suena a buena práctica de auditoría; pero la norma no admite muestreo en este proceso, sino universo completo. Fundamento: 21ª-2, fr. I, último párrafo.", "ref": "21ª-2, fr. I"}, {"id": "M005", "tema": "dis", "tipo": "memoria", "q": "Conforme a las definiciones de la Guía CNBV, ¿qué son los Elementos de Riesgo?", "a": "Los factores genéricos que se observan en el desarrollo de la actividad del sujeto supervisado y que pudieran afectar en mayor o menor medida el Riesgo al que está expuesto.", "o": ["Los factores genéricos que se observan en el desarrollo de la actividad del sujeto supervisado y que pudieran afectar en mayor o menor medida el Riesgo al que está expuesto.", "Las características específicas de riesgo que permiten conocer y evaluar cómo y en qué medida se encuentra expuesto al Riesgo el sujeto supervisado para cada factor genérico identificado.", "El conjunto de circunstancias de tiempo, modo y lugar en las que el sujeto supervisado lleva a cabo sus operaciones y que resultan determinantes para el diseño de la metodología.", "Los controles, políticas, criterios, medidas y procedimientos internos que el sujeto supervisado tiene implementados para administrar y disminuir su exposición al Riesgo."], "x": "Los Elementos de Riesgo son los factores genéricos; los Indicadores son las características específicas dentro de cada elemento. El distractor que define al Indicador en vez de al Elemento de Riesgo es el más tentador porque describe con precisión a los Indicadores, que viven dentro de los elementos: es el nivel de detalle inmediatamente inferior. Fundamento: Guía CNBV, apartado A, fracciones IV y VI.", "ref": "Guía CNBV, apartado A, fr. IV"}, {"id": "M006", "tema": "dis", "tipo": "trampa", "q": "En el diseño de su metodología, Banco del Sauce ubicó el domicilio del Cliente como indicador del elemento «países y áreas geográficas». ¿Cuál afirmación es correcta?", "a": "Es incorrecto: la Guía enumera el domicilio entre los indicadores del elemento de Clientes y Usuarios.", "o": ["Es incorrecto: el domicilio del Cliente sólo puede considerarse como un mitigante dentro del tercer proceso de la fase de diseño de la metodología.", "Es incorrecto: la Guía enumera el domicilio entre los indicadores del elemento de Clientes y Usuarios.", "Es correcto, porque cualquier dato que aluda a una ubicación geográfica pertenece por definición al elemento de países y áreas geográficas.", "Es indistinto, porque la Guía permite que cada sujeto supervisado ubique libremente cualquier indicador en el elemento de riesgo que prefiera."], "x": "El domicilio es una característica del Cliente y la Guía lo lista expresamente entre los indicadores del elemento de Clientes y Usuarios, junto con el tipo de persona, la edad o fecha de constitución, la nacionalidad y la actividad económica. La opción más tentadora es la que da por buena la ubicación porque el domicilio suena geográfico; pero el elemento de países y áreas geográficas se refiere a dónde ocurren las Operaciones de la entidad, no a dónde vive el Cliente. Fundamento: Guía CNBV, apartado C, fase I, proceso 1, tabla de indicadores.", "ref": "Guía CNBV, C, fase I, proceso 1"}, {"id": "M007", "tema": "dis", "tipo": "cifra", "q": "¿Cuántos elementos de Riesgo, como mínimo, debe considerar la entidad al identificar los elementos e indicadores de su metodología?", "a": "Cuatro: productos y servicios; Clientes y Usuarios; países y áreas geográficas; transacciones y canales.", "o": ["Seis: los cuatro elementos mínimos más las estructuras internas y los programas de capacitación y difusión que imparta la entidad.", "Tres: productos y servicios; Clientes y Usuarios; y transacciones y canales de envío o distribución vinculados con sus Operaciones.", "Cuatro: productos y servicios; Clientes y Usuarios; países y áreas geográficas; transacciones y canales.", "Cinco: productos y servicios; Clientes y Usuarios; países y áreas geográficas; transacciones y canales; e Infraestructura Tecnológica."], "x": "La disposición exige considerar al menos cuatro elementos. El distractor de cinco es el más tentador porque la Infraestructura Tecnológica sí es un elemento adicional, pero únicamente para las instituciones de tecnología financiera conforme a sus propias Disposiciones; en Bancos no aparece. Además, el «al menos» permite a la entidad definir más, nunca menos. Fundamento: 21ª-2, fr. I, incisos a) a d).", "ref": "21ª-2, fr. I"}, {"id": "M008", "tema": "dis", "tipo": "memoria", "q": "Según la Guía CNBV, ¿de qué carácter podrán ser los Indicadores que identifique la entidad?", "a": "Podrán ser de carácter cualitativo o cuantitativo y deberán reflejar los atributos que la entidad considere propios de sus Elementos de Riesgo.", "o": ["Podrán ser cualitativos o cuantitativos, pero deberán ser idénticos a los que utilicen las demás entidades del sector conforme a la evaluación nacional de riesgos.", "Deberán ser exclusivamente cuantitativos, de modo que cada uno pueda expresarse como un porcentaje del monto total operado durante el periodo evaluado.", "Deberán ser exclusivamente cualitativos, pues la cuantificación corresponde únicamente al proceso de medición y no al de identificación de los Indicadores.", "Podrán ser de carácter cualitativo o cuantitativo y deberán reflejar los atributos que la entidad considere propios de sus Elementos de Riesgo."], "x": "La Guía admite indicadores cualitativos y cuantitativos, y exige que reflejen los atributos propios de los elementos de Riesgo de esa entidad en particular. El distractor que exige homologar los indicadores entre entidades del mismo sector es el más tentador porque acierta en la primera mitad —admite indicadores cualitativos y cuantitativos— pero falla en la segunda: los indicadores varían de un sujeto supervisado a otro según su Contexto, no se homologan por sector. Fundamento: Guía CNBV, apartado C, fase I, proceso 1.", "ref": "Guía CNBV, C, fase I, proceso 1"}, {"id": "M009", "tema": "dis", "tipo": "caso", "q": "Casa de Bolsa Meridiano incluyó indicadores específicos del delito de operaciones con recursos de procedencia ilícita sólo en el elemento de Clientes y Usuarios, y ninguno de financiamiento al terrorismo. ¿Qué observación procede?", "a": "Debe incluir indicadores específicos del artículo 400 Bis y del 139 Quáter del Código Penal Federal para cada uno de los elementos de Riesgo.", "o": ["Debe incluir indicadores específicos del artículo 400 Bis y del 139 Quáter del Código Penal Federal para cada uno de los elementos de Riesgo.", "Basta con incluir indicadores del artículo 400 Bis, ya que los de financiamiento al terrorismo sólo se exigen a las entidades que operen con países de mayor Riesgo.", "Es correcto, porque la norma permite concentrar los indicadores de ambos delitos en el elemento de Clientes y Usuarios cuando ahí se ubica la mayor exposición.", "Debe incluir indicadores de ambos delitos, pero únicamente en el elemento de transacciones y canales de envío o distribución vinculados con sus Operaciones."], "x": "La reforma de 2024 exige indicadores específicos de los dos delitos —400 Bis para lavado y 139 Quáter para financiamiento al terrorismo— y los exige para cada uno de los elementos de Riesgo, no para uno solo. El distractor que limita los indicadores de ambos delitos al elemento de transacciones y canales es el más tentador porque acierta en los dos delitos, pero se equivoca en el alcance: no es un elemento, son todos. Fundamento: 21ª-2, último párrafo, adicionado por DOF 28-08-2024.", "ref": "21ª-2, último párr."}, {"id": "M010", "tema": "dis", "tipo": "caso", "q": "El área de cumplimiento de Unión de Crédito Los Fresnos pregunta qué tan detallados deben ser sus elementos e indicadores. ¿Qué responde la Guía CNBV?", "a": "Que la granularidad depende de cada sujeto supervisado, de acuerdo con sus propias necesidades y el Contexto en el que se desenvuelve.", "o": ["Que la granularidad depende del número de Clientes clasificados con Grado de Riesgo alto que la entidad hubiere registrado durante los doce meses previos.", "Que la granularidad depende de cada sujeto supervisado, de acuerdo con sus propias necesidades y el Contexto en el que se desenvuelve.", "Que la granularidad depende del tamaño de la entidad, medido por su nivel de capitalización y por el monto total operado en el ejercicio inmediato anterior.", "Que la granularidad la fija una escala uniforme que la Comisión publica anualmente por medios electrónicos para cada sector de sujetos supervisados."], "x": "La Guía deja la granularidad en manos de cada entidad, en función de sus necesidades y de su Contexto. El distractor del tamaño de la entidad es el más tentador porque se parece al principio de proporcionalidad; pero la Guía asocia la proporcionalidad al nivel y complejidad del análisis, y la granularidad al Contexto, no a un indicador financiero. Fundamento: Guía CNBV, apartado C, fase I, proceso 1.", "ref": "Guía CNBV, C, fase I, proceso 1"}, {"id": "M011", "tema": "dis", "tipo": "caso", "q": "Banco Cendal cuantificó el Riesgo de cada indicador y el de cada elemento, pero no obtuvo una calificación del Riesgo de la institución en su conjunto. ¿Cómo se califica esa medición?", "a": "Es deficiente: la medición debe constar de al menos tres niveles de detalle y cuantificarse en los tres, no sólo en uno o algunos.", "o": ["Es correcta, porque el Riesgo de la entidad se obtiene automáticamente del promedio aritmético simple de las calificaciones de sus cuatro elementos de Riesgo.", "Es correcta, siempre que la entidad documente que la calificación institucional se sustituye por la clasificación de sus Clientes por Grado de Riesgo.", "Es deficiente: la medición debe constar de al menos tres niveles de detalle y cuantificarse en los tres, no sólo en uno o algunos.", "Es deficiente, porque la medición debe constar de al menos cinco niveles de detalle, incluidos los mitigantes y el riesgo residual por unidad de negocio."], "x": "La Guía exige un método exhaustivo con al menos tres niveles —indicadores, elementos de Riesgo y sujeto supervisado— y es explícita en que debe haber cuantificación en los tres, no sólo en uno o algunos. El distractor de los cinco niveles es el más tentador porque conserva la idea de niveles y agrega piezas reales de la metodología, pero inventa un número que la Guía no usa. Fundamento: Guía CNBV, apartado C, fase I, proceso 2.", "ref": "Guía CNBV, C, fase I, proceso 2"}, {"id": "M012", "tema": "dis", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre el método de medición NO es correcta?", "a": "Definir la escala o rango de calificación y asignar el peso o porcentaje son el mismo proceso, por lo que basta documentar uno de ellos.", "o": ["Se debe definir la escala o rango que se utilizará para dar una calificación o valoración de Riesgo a cada Indicador, a cada elemento y a la propia entidad.", "La asignación de pesos a los elementos de Riesgo debe hacerse de manera consistente en función de su importancia para describir el Riesgo de la entidad.", "Se debe asignar un peso o porcentaje a cada Indicador en función de su importancia para describir el Riesgo del elemento al que pertenece.", "Definir la escala o rango de calificación y asignar el peso o porcentaje son el mismo proceso, por lo que basta documentar uno de ellos."], "x": "La Guía destaca expresamente que definir la escala o rango es un proceso distinto e independiente de asignar el peso o porcentaje: la escala dice cuánto vale la calificación; el peso dice cuánto pesa esa pieza dentro del conjunto. La confusión es tentadora porque ambos se expresan con números y se documentan juntos, pero son dos decisiones separadas. Fundamento: Guía CNBV, apartado C, fase I, proceso 2, y 21ª-2, fr. II.", "ref": "Guía CNBV, C, fase I, proceso 2"}, {"id": "M013", "tema": "dis", "tipo": "trampa", "q": "Para medir o evaluar el Riesgo del sujeto supervisado, ¿qué combinación exige la Guía CNBV?", "a": "La probabilidad de ocurrencia de que se lleve a cabo una operación de LD/FT y el posible impacto medido en relación con la concentración del negocio.", "o": ["La probabilidad de ocurrencia de que se lleve a cabo una operación de LD/FT y el posible impacto medido en relación con la concentración del negocio.", "La probabilidad de ocurrencia de una operación de LD/FT y el impacto medido en términos financieros, esto es, por el quebranto patrimonial estimado para la entidad.", "La frecuencia de las operaciones inusuales reportadas y el impacto medido por el porcentaje de Clientes clasificados con Grado de Riesgo alto en el periodo evaluado.", "La frecuencia con que se hayan presentado eventos de LD/FT en la entidad durante los últimos doce meses y el monto de las multas impuestas por la Comisión."], "x": "La Guía es literal en los dos paréntesis: probabilidad de ocurrencia «mas no la frecuencia de eventos», e impacto medido por concentración del negocio «y no en términos financieros o de montos de posibles multas». El distractor que mide el impacto en términos financieros o de montos es el más tentador porque acierta en la probabilidad y sólo falla en el impacto, que es justamente donde está la trampa. Fundamento: Guía CNBV, apartado C, fase I, proceso 2.", "ref": "Guía CNBV, C, fase I, proceso 2"}, {"id": "M014", "tema": "dis", "tipo": "memoria", "q": "¿Con qué puede medirse la concentración del negocio a la que se refiere la Guía CNBV al hablar del impacto?", "a": "Con el porcentaje de número de Clientes y Usuarios o contratos, el porcentaje de número de Operaciones y el porcentaje de monto operado.", "o": ["Con el monto de las sanciones económicas que la entidad hubiere pagado por incumplimientos en materia de prevención de lavado de dinero y financiamiento al terrorismo.", "Con el porcentaje de número de Clientes y Usuarios o contratos, el porcentaje de número de Operaciones y el porcentaje de monto operado.", "Con el número de reportes de operaciones inusuales y preocupantes presentados a la Secretaría por conducto de la Comisión durante los últimos doce meses.", "Con el porcentaje del capital contable de la entidad comprometido en los productos y servicios calificados con Riesgo alto durante el ejercicio evaluado."], "x": "La nota al pie de la Guía define la concentración del negocio con tres medidas: porcentaje de número de Clientes o contratos, porcentaje de número de Operaciones y porcentaje de monto operado. La opción de las sanciones es la más tentadora porque suena a impacto real, pero la Guía excluye expresamente los montos de posibles multas del concepto de impacto. Fundamento: Guía CNBV, apartado C, fase I, proceso 2, nota 1.", "ref": "Guía CNBV, C, fase I, proceso 2"}, {"id": "M015", "tema": "dis", "tipo": "cifra", "q": "¿Cuáles son ejemplos de escala o rango de Riesgo que la propia Guía CNBV menciona?", "a": "Alto, medio y bajo; valores del 0 al 100; y 1, 2, 3, 4 y 5.", "o": ["Valores del 0 al 100 y porcentajes, ya que la escala y el peso se expresan siempre en la misma unidad de medida dentro del método seleccionado.", "Únicamente la escala de cinco niveles numerados del 1 al 5, que es la que la Comisión exige para homologar los resultados entre entidades del mismo sector.", "Alto, medio y bajo; valores del 0 al 100; y 1, 2, 3, 4 y 5.", "Alto, medio y bajo; valores del 0 al 10; y porcentajes del 0 % al 100 % asignados a cada uno de los cuatro elementos de Riesgo que se hubieren definido."], "x": "La Guía da tres ejemplos de escala —alto/medio/bajo, valores del 0 al 100, y 1 a 5— y aclara que los pesos, en cambio, se expresan en porcentajes. El distractor que mezcla alto/medio/bajo y valores del 0 al 10 con porcentajes asignados a los elementos es el más tentador porque mezcla una escala verdadera con porcentajes, que pertenecen al terreno del peso y no de la escala. Fundamento: Guía CNBV, apartado C, fase I, proceso 2.", "ref": "Guía CNBV, C, fase I, proceso 2"}, {"id": "M016", "tema": "dis", "tipo": "caso", "q": "El área de sistemas de Banco Nortia eligió por su cuenta el método de medición de Riesgos y lo aplicó sin consultar a nadie más. ¿Qué señala la Guía CNBV sobre la elección del método?", "a": "Exige la participación de la alta dirección o gerencia, del área de cumplimiento y de las estructuras internas de las unidades de negocio.", "o": ["Permite que cualquier área elija el método, siempre que el resultado se informe al consejo de administración dentro de los treinta días naturales siguientes.", "Exige que el método sea elegido exclusivamente por el comité de riesgos de la entidad, con la opinión previa del auditor externo que dictamine el ejercicio.", "Exige que el método sea el que la Comisión dé a conocer por medios electrónicos, a fin de que los resultados de todas las entidades del sector resulten comparables.", "Exige la participación de la alta dirección o gerencia, del área de cumplimiento y de las estructuras internas de las unidades de negocio."], "x": "La elección y adecuación del método exige la participación de la alta dirección o gerencia, del área de cumplimiento y de las estructuras internas de las unidades de negocio operativas y funcionales, además de cualquier otra que se considere conveniente. El distractor del comité de riesgos es el más tentador porque ese órgano sí interviene, pero en el circuito del modelo de Clientes del Anexo 3, no en la elección del método de la metodología institucional. Fundamento: Guía CNBV, apartado C, fase I, proceso 2.", "ref": "Guía CNBV, C, fase I, proceso 2"}, {"id": "M017", "tema": "dis", "tipo": "memoria", "q": "¿Qué características debe reunir el método seleccionado para la medición de los Riesgos?", "a": "Debe ser flexible, para permitir ajustes cuando la operación lo requiera, y proporcional a la naturaleza y alcance de la operación.", "o": ["Debe ser flexible, para permitir ajustes cuando la operación lo requiera, y proporcional a la naturaleza y alcance de la operación.", "Debe ser aprobado previamente por la Comisión antes de su primera aplicación y revalidado cada vez que se actualice la evaluación nacional de riesgos.", "Debe ser rígido e invariable durante al menos cinco años, para que los resultados de cada implementación sean comparables entre ejercicios sucesivos.", "Debe ser idéntico al que utilicen las demás entidades financieras que integren el grupo financiero al que, en su caso, pertenezca la entidad de que se trate."], "x": "La Guía pide un método flexible, que admita ajustes cuando la operación lo requiera, y con un nivel y complejidad de análisis proporcional a la naturaleza y alcance de la operación. El distractor de la aprobación previa de la Comisión es el más tentador porque existe una facultad real de la Comisión, pero es de revisión posterior y eventual, no de autorización previa. Fundamento: Guía CNBV, apartado C, fase I, proceso 2.", "ref": "Guía CNBV, C, fase I, proceso 2"}, {"id": "M018", "tema": "dis", "tipo": "caso", "q": "Financiera Quetzal Azul incluyó en su metodología sólo los tres controles automatizados que considera más eficaces y dejó fuera el resto de sus políticas y procedimientos. ¿Qué exige el proceso de mitigantes?", "a": "Tomar en cuenta el 100 % de los mitigantes establecidos al momento del diseño, incluidas todas las políticas, criterios, medidas y procedimientos internos.", "o": ["Tomar en cuenta los mitigantes que la entidad implemente después de conocer los resultados de la implementación, pues antes de ese momento aún no producen efecto.", "Tomar en cuenta el 100 % de los mitigantes establecidos al momento del diseño, incluidas todas las políticas, criterios, medidas y procedimientos internos.", "Tomar en cuenta al menos la mitad de los mitigantes existentes, siempre que se justifique en el documento del diseño la razón por la que se excluyó a los demás.", "Tomar en cuenta únicamente los mitigantes automatizados, ya que los controles manuales no pueden acreditar efectividad ante la Comisión en una visita de inspección."], "x": "El proceso de mitigantes es exhaustivo: se toma en cuenta el 100 % de los mitigantes establecidos al momento del diseño, incluidas todas las políticas, criterios, medidas y procedimientos internos a que se refiere la 64ª y los de los demás manuales. El distractor que toma en cuenta los mitigantes implementados después de conocer los resultados es el más tentador porque confunde el momento: esos mitigantes pertenecen al ajuste posterior a la implementación, no al diseño. Fundamento: 21ª-2, fr. III, y Guía CNBV, apartado C, fase I, proceso 3.", "ref": "21ª-2, fr. III"}, {"id": "M019", "tema": "dis", "tipo": "trampa", "q": "¿Qué efecto reconoce la Guía CNBV a los mitigantes sobre la exposición al Riesgo?", "a": "Contribuyen a administrar, controlar y disminuir la exposición al Riesgo, pero no a evitarla ni a anularla.", "o": ["Permiten eliminar por completo la exposición al Riesgo cuando se aplican de manera automatizada y con periodicidad diaria en todas las unidades de negocio.", "Permiten anular el Riesgo residual de la entidad, de modo que una entidad con mitigantes suficientes puede reportar una exposición final igual a cero.", "Contribuyen a administrar, controlar y disminuir la exposición al Riesgo, pero no a evitarla ni a anularla.", "Contribuyen a administrar y controlar la exposición al Riesgo, pero nunca pueden modificar la calificación asignada a un indicador o a un elemento de Riesgo."], "x": "La Guía usa un paréntesis que decide la respuesta: los mitigantes contribuyen a administrar, controlar y disminuir «(no evitar o anular)» la exposición al Riesgo. El distractor que niega que los mitigantes puedan modificar la calificación asignada es el más tentador porque empieza bien, pero se pasa al otro extremo: los mitigantes sí modifican la calificación, y de hecho el nivel sobre el que aplican debe definirse expresamente. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3"}, {"id": "M020", "tema": "dis", "tipo": "memoria", "q": "Para determinar el efecto de un mitigante sobre la calificación de Riesgos, ¿qué debe considerarse además de su existencia en el Manual de Cumplimiento?", "a": "La efectividad en su aplicación, tomando en cuenta factores como la periodicidad y el nivel de automatización.", "o": ["El costo anual de operación del control y su proporción respecto del presupuesto total asignado al área de cumplimiento en el ejercicio correspondiente.", "El número de operaciones inusuales que el control hubiere permitido detectar durante el periodo de doce meses considerado en la implementación.", "La antigüedad del control, medida desde la fecha en que se incorporó por primera vez al Manual de Cumplimiento de la entidad de que se trate.", "La efectividad en su aplicación, tomando en cuenta factores como la periodicidad y el nivel de automatización."], "x": "No basta con que el mitigante esté escrito: cuenta su efectiva aplicación, y la Guía nombra dos factores para medirla, la periodicidad y el nivel de automatización. El distractor que mide el mitigante por el número de operaciones inusuales detectadas es el más tentador porque parece una medida objetiva de efectividad, pero esos reportes son un resultado del monitoreo, no el criterio que la Guía fija para ponderar el efecto de un mitigante. Fundamento: 21ª-2, fr. III, y Guía CNBV, apartado C, fase I, proceso 3.", "ref": "21ª-2, fr. III"}, {"id": "M021", "tema": "dis", "tipo": "caso", "q": "Banco Litoral aplicó a todos sus mitigantes el mismo efecto y siempre a nivel de la entidad completa. ¿Qué precisa la Guía CNBV?", "a": "Que no todos los mitigantes deben tener el mismo efecto y que este puede aplicarse a distintos niveles de detalle de la metodología.", "o": ["Que no todos los mitigantes deben tener el mismo efecto y que este puede aplicarse a distintos niveles de detalle de la metodología.", "Que el efecto de los mitigantes se aplica siempre a nivel de indicador, nunca a nivel de elemento de Riesgo ni a nivel de la entidad en su conjunto.", "Que el efecto de cada mitigante debe fijarse en un porcentaje idéntico al peso asignado al elemento de Riesgo sobre el que se pretenda aplicarlo.", "Que todos los mitigantes deben tener el mismo efecto, a fin de evitar que la entidad manipule la calificación final de su exposición al Riesgo."], "x": "La Guía obliga a definir, para cada mitigante, cuál es el nivel adecuado sobre el que aplica —indicador, elemento de Riesgo o sujeto supervisado— y aclara que no todos deben tener el mismo efecto. El distractor que fija el efecto de los mitigantes siempre a nivel de indicador es el más tentador porque el indicador es el nivel más fino y parece el más seguro, pero fija un nivel único donde la norma admite tres. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3"}, {"id": "M022", "tema": "dis", "tipo": "caso", "q": "En una revisión, se detecta que Banco del Sauce tiene documentado un control de monitoreo que en los hechos no se aplica. Conforme a la Guía CNBV, ¿qué efecto puede tener esa falta de aplicación sobre la medición?", "a": "Podrá, en algunos casos, aumentar el nivel de Riesgo de que se trate.", "o": ["Obligará a la entidad a suspender la implementación de la metodología hasta que el control deficiente quede debidamente corregido y documentado.", "Podrá, en algunos casos, aumentar el nivel de Riesgo de que se trate.", "No tendrá efecto alguno sobre la calificación, porque el mitigante ya fue considerado en el momento del diseño de la metodología de evaluación.", "Aumentará siempre y de manera automática el nivel de Riesgo del indicador, del elemento y de la entidad en su conjunto, sin admitir prueba en contrario."], "x": "La Guía usa un modal deliberadamente prudente: la falta de aplicación o las deficiencias en la implementación «podrá, en algunos casos, aumentar» el nivel de Riesgo. El distractor que vuelve automático el aumento del nivel de Riesgo es el más tentador porque parece la consecuencia lógica y severa, pero convierte en automático lo que la Guía plantea como eventual. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3"}, {"id": "M023", "tema": "dis", "tipo": "cifra", "q": "¿Cuáles son los mitigantes que la Guía CNBV enumera de manera enunciativa, mas no limitativa, con efecto a nivel del sujeto supervisado?", "a": "Gobierno corporativo, auditoría en materia de prevención de LD/FT, estructuras internas y capacitación.", "o": ["Gobierno corporativo, auditoría interna, comité de riesgos, sistemas automatizados y el programa de capacitación y difusión anual de la entidad.", "Estructuras internas, capacitación, política de conocimiento del Cliente y el modelo de evaluación de Riesgos de Clientes previsto en el Anexo 3.", "Gobierno corporativo, auditoría en materia de prevención de LD/FT, estructuras internas y capac
