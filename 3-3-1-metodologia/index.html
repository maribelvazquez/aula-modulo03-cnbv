itación.", "Auditoría en materia de prevención de LD/FT, capacitación, monitoreo de operaciones y las señales de alerta descriptiva y prospectiva de la entidad."], "x": "La Guía lista cuatro mitigantes con efecto a nivel de entidad: gobierno corporativo, auditoría en la materia, estructuras internas y capacitación; y advierte que la enumeración es enunciativa, mas no limitativa. El distractor que sustituye la auditoría en materia de PLD/FT por la auditoría interna genérica es el más tentador porque incluye piezas reales de la organización, pero cambia esa pieza y añade órganos que la Guía no lista en ese apartado. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3"}, {"id": "M024", "tema": "dis", "tipo": "caso", "q": "El auditor externo de Banco Tesalia entregó su informe anual en materia de prevención de LD/FT. Además de ser un mitigante en sí misma, ¿para qué puede servir esa auditoría conforme a la Guía CNBV?", "a": "Como insumo para definir la efectividad de los mitigantes con los que cuenta la entidad al momento de realizar la evaluación.", "o": ["Como base para clasificar a los Clientes de la entidad por su Grado de Riesgo durante los doce meses siguientes a la fecha del propio informe.", "Como sustituto del proceso de identificación de mitigantes, de modo que la entidad puede remitirse al informe sin describirlos en su metodología.", "Como documento que acredita ante la Comisión que la metodología de evaluación de Riesgos fue aprobada por el consejo de administración de la entidad.", "Como insumo para definir la efectividad de los mitigantes con los que cuenta la entidad al momento de realizar la evaluación."], "x": "La Guía dice que, además de ser mitigante, el resultado de la auditoría podría utilizarse como insumo para definir la efectividad de los mitigantes al momento de la evaluación. El distractor que convierte la auditoría en sustituto del proceso de identificación de mitigantes es el más tentador porque parte de una verdad —la auditoría revisa los controles—, pero la revisión externa nunca releva a la entidad de identificar y describir sus propios mitigantes en el diseño. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3"}, {"id": "M025", "tema": "dis", "tipo": "memoria", "q": "¿Qué exige la Guía CNBV respecto de la auditoría en materia de prevención de LD/FT considerada como mitigante?", "a": "Que sea una revisión independiente de la adecuada ejecución de las políticas, criterios, medidas y procedimientos, y que exista constancia documental de ella.", "o": ["Que sea una revisión independiente de la adecuada ejecución de las políticas, criterios, medidas y procedimientos, y que exista constancia documental de ella.", "Que verifique exclusivamente la existencia documental de los controles, sin evaluar su aplicación, pues la efectividad se mide en la fase de valoración de la metodología.", "Que la realice invariablemente un auditor externo independiente y que su resultado se presente a la Comisión dentro de los sesenta días naturales siguientes a su conclusión.", "Que se practique cuando menos dos veces al año por el área de auditoría interna y que sus hallazgos se incorporen al Manual de Cumplimiento antes de cerrar el ejercicio."], "x": "La Guía describe la auditoría como una revisión independiente de la adecuada ejecución de las políticas, criterios, medidas y procedimientos, y exige constancia documental de esa revisión; puede practicarla un auditor externo o el área de auditoría interna. El distractor que exige que la auditoría la realice invariablemente un auditor externo es el más tentador porque impone esa figura con exclusividad, cuando la Guía la menciona sólo como una posibilidad. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3"}, {"id": "M026", "tema": "dis", "tipo": "memoria", "q": "¿Qué comprende el mitigante denominado estructuras internas y cómo se distingue del gobierno corporativo?", "a": "Comprende el establecimiento del Comité y la designación del Oficial de Cumplimiento o Representante, y debe diferenciarse de la actividad genérica del gobierno corporativo.", "o": ["Comprende los sistemas automatizados y las bases de datos de la entidad, y se distingue del gobierno corporativo por su carácter exclusivamente tecnológico y operativo.", "Comprende el establecimiento del Comité y la designación del Oficial de Cumplimiento o Representante, y debe diferenciarse de la actividad genérica del gobierno corporativo.", "Comprende las áreas de negocio y de operaciones de la entidad, y forma parte del gobierno corporativo, por lo que ambos mitigantes se evalúan de manera conjunta e indivisible.", "Comprende al consejo de administración y a la dirección general, y sustituye al gobierno corporativo cuando la entidad cuenta con un Representante en lugar de Oficial de Cumplimiento."], "x": "Las estructuras internas son, en su caso, el Comité y el Oficial de Cumplimiento o Representante, incluida su capacitación y el cumplimiento de sus funciones; la Guía pide expresamente diferenciar su evaluación de la actividad genérica del gobierno corporativo. El distractor que funde las estructuras internas dentro del gobierno corporativo es el más tentador porque ambos mitigantes conviven en el mismo tejido organizacional, pero la Guía los separa justamente para que cada uno se evalúe por sí mismo. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3"}, {"id": "M027", "tema": "dis", "tipo": "cifra", "q": "Como mitigante, ¿con qué periodicidad mínima deben impartirse los programas de capacitación y difusión?", "a": "Al menos una vez al año.", "o": ["Al menos una vez cada doce meses contados a partir de la última implementación de la metodología de evaluación de Riesgos.", "Al menos una vez cada seis meses.", "Al menos una vez al año.", "Al menos una vez cada dos años."], "x": "La Guía fija la capacitación y difusión al menos una vez al año. El distractor que cuenta los doce meses a partir de la última implementación es el más tentador porque doce meses y un año coinciden en duración, pero le añade un punto de partida que la norma no establece para la capacitación: ese cómputo pertenece a otras obligaciones. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3"}, {"id": "M028", "tema": "dis", "tipo": "caso", "q": "Sofipo Caja Alondra imparte cada año el mismo curso general de PLD/FT a todo su personal, sin relación con los resultados de su metodología. ¿Qué observa la Guía CNBV?", "a": "Que los temas de la capacitación deben ser coherentes con los resultados de la implementación de la metodología y adecuarse a las responsabilidades de cada destinatario.", "o": ["Que la capacitación debe limitarse al contenido del Manual de Cumplimiento y no puede incorporar los resultados de la metodología, por tratarse de información reservada.", "Que la capacitación en materia de prevención de LD/FT deja de ser obligatoria cuando la entidad obtiene una calificación de Riesgo bajo en la implementación.", "Que la capacitación debe impartirse con contenido idéntico a todos los destinatarios, incluidos los miembros del consejo, para garantizar un mismo nivel de conocimiento.", "Que los temas de la capacitación deben ser coherentes con los resultados de la implementación de la metodología y adecuarse a las responsabilidades de cada destinatario."], "x": "La Guía pide dos cosas a la vez: que los temas sean coherentes con los resultados de la implementación y que se adecuen a las responsabilidades de consejeros, directivos, funcionarios y empleados. El distractor que exige un contenido idéntico para todos los destinatarios es el más tentador porque la uniformidad parece equitativa, pero la propia Guía admite que la alta dirección puede no requerir el mismo nivel de capacitación que el personal operativo. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3"}, {"id": "M029", "tema": "dis", "tipo": "caso", "q": "El área de cumplimiento de Banco Vega Marina propone construir sus indicadores usando exclusivamente el subconjunto de operaciones inusuales reportadas. ¿Qué establece la Guía CNBV sobre las fuentes de información internas?", "a": "Deben incluir la totalidad de productos, servicios, tipos de Clientes y Usuarios, países o áreas, transacciones y canales, y podrán considerar además ese subconjunto.", "o": ["Deben incluir la totalidad de productos, servicios, tipos de Clientes y Usuarios, países o áreas, transacciones y canales, y podrán considerar además ese subconjunto.", "Deben provenir exclusivamente de fuentes externas, como la evaluación nacional de riesgos y las listas emitidas por organismos internacionales en la materia.", "Deben limitarse al subconjunto de operaciones inusuales y preocupantes, ya que sólo esas Operaciones evidencian una exposición real de la entidad a los Riesgos de LD/FT.", "Deben incluir únicamente la información de los Clientes clasificados con Grado de Riesgo alto conforme al modelo de evaluación de Riesgos previsto en el Anexo 3."], "x": "Las fuentes internas deben abarcar el universo completo de la operación; las operaciones inusuales son un subconjunto que la entidad «podrá» considerar además, nunca en sustitución. El distractor que limita las fuentes internas al subconjunto de operaciones inusuales y preocupantes es el más tentador porque esas operaciones son el insumo más rico en señales de riesgo, pero acotarse a ellas dejaría fuera productos y canales nunca alertados. Fundamento: Guía CNBV, apartado C, fase I, proceso 1.", "ref": "Guía CNBV, C, fase I, proceso 1"}, {"id": "M030", "tema": "dis", "tipo": "memoria", "q": "¿Qué papel tiene la evaluación nacional de riesgos en el diseño de la metodología?", "a": "Es una fuente de información externa cuya parte aplicable, dado el Contexto de la entidad, debe tomarse en cuenta y reflejarse en la valoración de los Indicadores.", "o": ["Es la metodología que la entidad debe adoptar íntegramente, ya que sustituye al diseño propio cuando la Secretaría publica una actualización del ejercicio nacional.", "Es una fuente de información externa cuya parte aplicable, dado el Contexto de la entidad, debe tomarse en cuenta y reflejarse en la valoración de los Indicadores.", "Es el instrumento con el que la Comisión califica anualmente el Riesgo de cada entidad y se lo notifica por los medios electrónicos que la propia Comisión establezca.", "Es un documento de consulta potestativa que la entidad podrá considerar sólo cuando opere con países o áreas geográficas identificadas como de mayor Riesgo."], "x": "La evaluación nacional de riesgos es fuente externa obligatoria en la parte que resulte aplicable dado el Contexto de la entidad, y su análisis debe reflejarse en la valoración del grado de Riesgo de cada Indicador y quedar documentado. El distractor que convierte la evaluación nacional de riesgos en un documento de consulta potestativa es el más tentador porque introduce un matiz que la norma no concede: la disposición dice «deberán tomar en cuenta». Fundamento: 21ª-1, segundo párrafo, y Guía CNBV, apartado C.", "ref": "21ª-1, 2º párr."}, {"id": "M031", "tema": "dis", "tipo": "cifra", "q": "¿Respecto de cuántos delitos debe la entidad establecer indicadores específicos, y con qué alcance?", "a": "De dos: el del artículo 400 Bis y el del artículo 139 Quáter del Código Penal Federal, para cada elemento de Riesgo.", "o": ["De tres: operaciones con recursos de procedencia ilícita, financiamiento al terrorismo y financiamiento a la proliferación de armas de destrucción masiva, en cada elemento.", "De uno: el del artículo 400 Bis del Código Penal Federal, para cada uno de los cuatro elementos de Riesgo que como mínimo debe definir la entidad.", "De dos: el del artículo 400 Bis y el del artículo 139 Quáter del Código Penal Federal, para cada elemento de Riesgo.", "De dos: el del artículo 400 Bis y el del artículo 139 Quáter del Código Penal Federal, pero únicamente para el elemento de Clientes y Usuarios."], "x": "Son dos delitos y el alcance es total: indicadores específicos de 400 Bis y de 139 Quáter para cada uno de los elementos de Riesgo. El distractor que agrega el financiamiento a la proliferación de armas como tercer delito es el más tentador porque ese concepto sí aparece en la definición de evaluación nacional de riesgos de la Guía, pero no en la obligación de indicadores específicos del Capítulo II Bis. Fundamento: 21ª-2, último párrafo.", "ref": "21ª-2, último párr."}, {"id": "M032", "tema": "dis", "tipo": "caso", "q": "Banco Almadía debe clasificar sus canales para el elemento correspondiente. ¿Cuál de los siguientes es, conforme a la Guía CNBV, un canal no presencial?", "a": "La banca electrónica o móvil, en la que el Cliente no tiene contacto directo con personal de la entidad.", "o": ["La apertura de cuentas a través de comisionistas facultados para celebrar operaciones a nombre y por cuenta de la propia entidad de que se trate.", "La banca privada, en la que un ejecutivo asignado atiende de manera personalizada al Cliente en las instalaciones de la entidad financiera.", "La ventanilla de sucursal, cuando el Cliente es atendido por un cajero previa identificación biométrica realizada en el propio mostrador.", "La banca electrónica o móvil, en la que el Cliente no tiene contacto directo con personal de la entidad."], "x": "La Guía define canales no presenciales como aquellos en los que el Cliente no tiene contacto directo con personal de la entidad y la operación se ejecuta electrónicamente: cajeros automáticos, banca electrónica o móvil. El distractor de los comisionistas es el más tentador porque el Cliente no pisa una sucursal del banco, pero la Guía los clasifica expresamente como canal presencial, ya que hay atención personalizada. Fundamento: Guía CNBV, apartado C, fase I, proceso 1, inciso iv.", "ref": "Guía CNBV, C, fase I, proceso 1"}, {"id": "M033", "tema": "dis", "tipo": "caso", "q": "Transmisor Correo Austral quiere tratar por separado los canales y las transacciones dentro de su metodología. ¿Qué permite la Guía CNBV?", "a": "Que ese elemento podrá separarse en dos, uno para canales de envío o distribución y otro para transacciones, si el sujeto supervisado así lo determina.", "o": ["Que ese elemento podrá separarse en dos, uno para canales de envío o distribución y otro para transacciones, si el sujeto supervisado así lo determina.", "Que deberá fusionarlos con el elemento de productos y servicios cuando la entidad opere únicamente a través de canales no presenciales electrónicos.", "Que podrá omitir ese elemento cuando la entidad no utilice intermediarios ni comisionistas facultados para celebrar operaciones a su nombre y por su cuenta.", "Que deberá separarlos siempre en dos elementos distintos, de modo que la entidad termine con cinco elementos de Riesgo como mínimo en su metodología."], "x": "La Guía admite que el elemento de transacciones y canales se separe en dos si el sujeto supervisado así lo determina: es una facultad, no una obligación. El distractor que obliga a separar siempre transacciones y canales en dos elementos distintos es el más tentador porque parte del mismo dato verdadero —que la separación es posible— pero la convierte en deber y altera el número mínimo de elementos, que sigue siendo cuatro. Fundamento: Guía CNBV, apartado C, fase I, proceso 1, inciso iv.", "ref": "Guía CNBV, C, fase I, proceso 1"}, {"id": "M034", "tema": "dis", "tipo": "caso", "q": "Para el elemento de transacciones, el Comité de Casa de Cambio Peñasco pregunta qué se espera que defina su metodología. ¿Qué responde la Guía CNBV?", "a": "Una serie de transacciones o escenarios de Riesgo, dado el modelo de negocio, que contemplen entre otros factores la frecuencia, el monto y el instrumento monetario.", "o": ["Un umbral único de monto por operación, a partir del cual toda transacción se califique automáticamente con el Grado de Riesgo más alto de la escala definida.", "Una serie de transacciones o escenarios de Riesgo, dado el modelo de negocio, que contemplen entre otros factores la frecuencia, el monto y el instrumento monetario.", "Una lista cerrada de las operaciones relevantes, inusuales y preocupantes que la entidad haya reportado durante el periodo de doce meses inmediato anterior.", "Un catálogo de las transacciones que la Comisión da a conocer por medios electrónicos para cada sector, a fin de homologar los escenarios entre sujetos supervisados."], "x": "La Guía pide definir una serie de transacciones o escenarios de Riesgo acordes con el modelo de negocio, considerando entre otros el tipo, monto, número, frecuencia, naturaleza, instrumento monetario, moneda o medio de pago. El distractor que reduce los escenarios de Riesgo a la lista cerrada de operaciones ya reportadas es el más tentador porque esos reportes son insumo legítimo, pero un listado cerrado de lo ya reportado mira al pasado y no construye escenarios. Fundamento: Guía CNBV, apartado C, fase I, proceso 1, inciso iv.", "ref": "Guía CNBV, C, fase I, proceso 1"}, {"id": "M035", "tema": "dis", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre el enfoque basado en Riesgo NO es correcta?", "a": "Los Riesgos de LD/FT y los riesgos financieros de la institución son la misma categoría y se miden con la misma metodología.", "o": ["La Guía retoma la definición de enfoque basado en riesgo contenida en la guía emitida por el Grupo de Acción Financiera en octubre de 2014.", "El enfoque basado en Riesgo implica identificar, evaluar y entender los Riesgos a los que se está expuesto y adoptar medidas adecuadas para mitigarlos de manera efectiva.", "Los Riesgos de LD/FT y los riesgos financieros de la institución son la misma categoría y se miden con la misma metodología.", "El enfoque basado en Riesgo debe permitir a la entidad entender cómo y hasta qué punto es vulnerable, para asignar eficientemente sus recursos."], "x": "La Guía advierte de forma expresa que es importante que los sujetos supervisados identifiquen la diferencia entre los riesgos financieros de la institución y los Riesgos de LD/FT. Confundirlos es tentador porque ambos se administran con lenguaje de riesgo —probabilidad, impacto, tolerancia—, pero responden a objetivos y metodologías distintos. Fundamento: Guía CNBV, apartado B.", "ref": "Guía CNBV, apartado B"}, {"id": "M036", "tema": "dis", "tipo": "memoria", "q": "Conforme a la Guía CNBV, ¿qué se entiende por Contexto?", "a": "El conjunto de circunstancias de tiempo, modo y lugar en las que el sujeto supervisado lleva a cabo sus operaciones.", "o": ["El conjunto de circunstancias económicas nacionales que la Secretaría describe en la evaluación nacional de riesgos y en sus respectivas actualizaciones.", "El conjunto de disposiciones legales y administrativas que resultan aplicables al sujeto supervisado según el sector financiero al que pertenezca.", "El conjunto de resultados obtenidos por las demás entidades financieras que integren el grupo financiero del que forme parte el sujeto supervisado.", "El conjunto de circunstancias de tiempo, modo y lugar en las que el sujeto supervisado lleva a cabo sus operaciones."], "x": "El Contexto son las circunstancias de tiempo, modo y lugar en que la entidad opera, y es determinante en el diseño porque forma parte de los supuestos de identificación de los Indicadores. El distractor que define el Contexto como las circunstancias económicas nacionales de la evaluación nacional de riesgos es el más tentador porque esa evaluación sí se lee «dado el Contexto» de la entidad, pero es una fuente de información, no la definición de Contexto. Fundamento: Guía CNBV, apartado A, fracción I.", "ref": "Guía CNBV, apartado A, fr. I"}, {"id": "M037", "tema": "dis", "tipo": "caso", "q": "Banco Orión del Golfo planea lanzar en marzo una billetera digital con apertura remota de cuentas. ¿Qué exige la norma antes del lanzamiento?", "a": "Llevar a cabo una evaluación de los Riesgos a los que se encuentra expuesta, con antelación al lanzamiento o uso del nuevo producto.", "o": ["Llevar a cabo una evaluación de los Riesgos a los que se encuentra expuesta, con antelación al lanzamiento o uso del nuevo producto.", "Clasificar con Grado de Riesgo alto a la totalidad de los Clientes que contraten el producto durante los primeros seis meses de la relación comercial.", "Solicitar a la Comisión la autorización previa del producto y esperar a que se pronuncie dentro del plazo que la propia Comisión establezca al efecto.", "Esperar a que transcurran doce meses de operación del producto para incorporar sus datos a la siguiente implementación de la metodología de evaluación."], "x": "La disposición obliga a evaluar los Riesgos con antelación al lanzamiento o uso de nuevos productos, servicios, tipos de Clientes o Usuarios, países o áreas geográficas, canales y transacciones. El distractor que exige esperar doce meses de operación del producto antes de incorporarlo a la implementación es el más tentador porque ese plazo mínimo sí existe, pero se refiere a los datos que alimentan la implementación, no a una espera antes de lanzar. Fundamento: 21ª-1, último párrafo.", "ref": "21ª-1, último párr."}, {"id": "M038", "tema": "dis", "tipo": "caso", "q": "Financiera Ceibo asignó a sus indicadores pesos elegidos para que sumaran 100 %, sin explicar por qué a cada uno le corresponde ese valor. ¿Qué exige la norma?", "a": "Asignar el peso de manera consistente en función de la importancia de cada indicador para describir el Riesgo del elemento al que pertenece.", "o": ["Asignar el peso en función del número de Operaciones que cada indicador hubiere registrado durante el periodo de doce meses considerado en la implementación.", "Asignar el peso de manera consistente en función de la importancia de cada indicador para describir el Riesgo del elemento al que pertenece.", "Asignar a todos los indicadores de un mismo elemento de Riesgo un peso idéntico, a fin de evitar cualquier discrecionalidad en la medición de la entidad.", "Asignar los pesos conforme a la tabla de ponderaciones que la Comisión dé a conocer por los medios electrónicos que la propia Comisión establezca."], "x": "La fracción II exige una relación entre indicador y elemento y una asignación de pesos consistente en función de la importancia para describir el Riesgo; lo mismo aplica entre elementos y el Riesgo de la entidad. El distractor que asigna a todos los indicadores de un mismo elemento un peso idéntico es el más tentador porque esos pesos iguales parecen neutrales y objetivos, pero renuncian precisamente al juicio de importancia que la norma exige documentar. Fundamento: 21ª-2, fr. II.", "ref": "21ª-2, fr. II"}, {"id": "M039", "tema": "dis", "tipo": "memoria", "q": "¿A qué momento se refiere la 21ª-2, fracción III, cuando obliga a identificar los mitigantes?", "a": "A los que la entidad tenga implementados al momento del diseño de la metodología.", "o": ["A los que la entidad hubiere incorporado a su Manual de Cumplimiento durante los doce meses anteriores a la fecha de la evaluación de Riesgos.", "A los que la entidad implemente una vez que cuente con los resultados de la implementación de su metodología de evaluación de Riesgos.", "A los que la entidad tenga implementados al momento del diseño de la metodología.", "A los que la entidad tenga implementados al cierre del ejercicio social inmediato anterior al de la revisión de la propia metodología."], "x": "La fracción III fija el corte en el momento del diseño: se identifican los mitigantes que la entidad tiene implementados en ese instante, con su efectiva aplicación. El distractor que ubica los mitigantes en los que la entidad implementa después de conocer los resultados es el más tentador porque eso también ocurre, pero pertenece al ajuste posterior de la 21ª-3, no al diseño. Fundamento: 21ª-2, fr. III.", "ref": "21ª-2, fr. III"}, {"id": "M040", "tema": "dis", "tipo": "cifra", "q": "¿Cuántas fases comprende el desarrollo de la metodología y cuántos procesos comprende la primera de ellas?", "a": "Tres fases y tres procesos.", "o": ["Cuatro fases y tres procesos.", "Dos fases y tres procesos, más una etapa posterior de monitoreo permanente a cargo del área de cumplimiento.", "Tres fases y cuatro procesos.", "Tres fases y tres procesos."], "x": "Son tres fases —diseño, implementación y valoración— y tres procesos dentro de la primera fase —identificación, medición y mitigación—. El distractor que añade el monitoreo como una etapa posterior aparte es el más tentador porque el monitoreo existe realmente, pero no es una etapa aparte: vive dentro de la fase de valoración. Fundamento: Guía CNBV, apartado C.", "ref": "Guía CNBV, apartado C"}, {"id": "M041", "tema": "imp", "tipo": "memoria", "q": "¿En qué consiste la fase de implementación de la metodología?", "a": "En poner en funcionamiento la metodología diseñada y obtener sus resultados, a fin de conocer los Riesgos a los que la entidad se encuentra expuesta.", "o": ["En poner en funcionamiento la metodología diseñada y obtener sus resultados, a fin de conocer los Riesgos a los que la entidad se encuentra expuesta.", "En revisar la eficiencia y la eficacia de la metodología ya aplicada, abriendo la posibilidad de realizar actualizaciones o modificaciones en su diseño.", "En clasificar a los Clientes y Usuarios de la entidad por su Grado de Riesgo con base en el modelo de evaluación previsto en el Anexo 3 de las Disposiciones.", "En describir por escrito todos los procesos de identificación, medición y mitigación que la entidad llevará a cabo, incluidos sus detalles operativos y las áreas responsables."], "x": "Implementar es correr la metodología con la operación real y obtener resultados. El distractor que describe la implementación como la revisión de la eficiencia y eficacia de la metodología es el más tentador porque describe con exactitud una fase verdadera, pero es la valoración: llega después y mira hacia la metodología misma, no hacia los Riesgos de la entidad. Fundamento: 21ª-3, primer párrafo, y Guía CNBV, apartado C, fase II.", "ref": "21ª-3"}, {"id": "M042", "tema": "imp", "tipo": "cifra", "q": "Al implementar la metodología, ¿a qué periodo mínimo debe corresponder la información de número de Clientes, número de operaciones y monto operado?", "a": "A un periodo que no podrá ser menor a doce meses.", "o": ["A un periodo que no podrá ser menor a seis meses, contados desde el inicio de la relación comercial con cada uno de los Clientes.", "A un periodo que no podrá ser menor a doce meses.", "A un periodo que no podrá ser mayor a doce meses, a fin de que la información utilizada se mantenga actualizada y sea representativa.", "A un periodo que no podrá ser menor a veinticuatro meses, contados hacia atrás desde la fecha en que se realice la implementación."], "x": "La fracción II fija un piso, no un techo: el periodo no podrá ser menor a doce meses, de modo que usar dieciocho o veinticuatro es válido. El distractor que convierte el piso de doce meses en un techo —«no podrá ser mayor»— es el más tentador porque repite el número correcto y sólo invierte el sentido del modal, que es donde está la trampa. Fundamento: 21ª-3, fr. II.", "ref": "21ª-3, fr. II"}, {"id": "M043", "tema": "imp", "tipo": "caso", "q": "Al implementar su metodología, Banco Ribera capturó un total de Clientes distinto del que arroja su sistema automatizado. ¿Qué obligación se está incumpliendo?", "a": "La de asegurarse de que no existan inconsistencias entre la información que se incorpora a la metodología y la que obra en sus sistemas automatizados.", "o": ["La de utilizar información correspondiente a un periodo no menor a doce meses de número de Clientes, número de operaciones y monto operado de la entidad.", "La de conservar durante un plazo no menor a cinco años toda la información generada con motivo del Capítulo II Bis de las Disposiciones aplicables.", "La de asegurarse de que no existan inconsistencias entre la información que se incorpora a la metodología y la que obra en sus sistemas automatizados.", "La de someter los resultados de la implementación a la aprobación del comité de riesgos de la entidad, con base en la propuesta que formule su Comité."], "x": "La fracción I de la 21ª-3 exige coherencia entre la información que alimenta la metodología y la que obra en los sistemas automatizados. El distractor que describe la obligación del periodo mínimo de doce meses de datos es el más tentador porque también pertenece a la 21ª-3, pero se refiere a la extensión temporal de los datos, no a su consistencia con los sistemas. Fundamento: 21ª-3, fr. I.", "ref": "21ª-3, fr. I"}, {"id": "M044", "tema": "imp", "tipo": "memoria", "q": "¿Cómo se denomina el grado de exposición al Riesgo que resulta una vez considerados los efectos de los mitigantes existentes?", "a": "Riesgo residual.", "o": ["Riesgo de concentración del negocio.", "Grado de Riesgo del Cliente.", "Riesgo inherente.", "Riesgo residual."], "x": "El resultado de la implementación, ya descontado el efecto de los mitigantes, es el riesgo residual. El riesgo inherente es el más tentador porque es el concepto gemelo, pero describe la exposición antes de aplicar los mitigantes. Fundamento: Guía CNBV, apartado C, fase II.", "ref": "Guía CNBV, C, fase II"}, {"id": "M045", "tema": "imp", "tipo": "caso", "q": "De la implementación de su metodología, Financiera Altamar detectó nuevos Riesgos asociados a un canal no presencial. ¿Qué debe hacer?", "a": "Modificar las políticas, criterios, medidas y procedimientos que correspondan, para establecer los mitigantes necesarios.", "o": ["Modificar las políticas, criterios, medidas y procedimientos que correspondan, para establecer los mitigantes necesarios.", "Reclasificar con Grado de Riesgo alto a la totalidad de los Clientes que hubieren utilizado el canal durante el periodo de doce meses considerado en la implementación.", "Suspender de inmediato la comercialización del canal no presencial hasta que la Comisión autorice expresamente la continuación de las operaciones por ese medio.", "Reportar los nuevos Riesgos a la Secretaría por conducto de la Comisión dentro de los quince días hábiles siguientes y esperar a que esta determine los mitigantes."], "x": "Detectar mayores o nuevos Riesgos activa el deber de modificar políticas, criterios, medidas y procedimientos del Manual de Cumplimiento u otro manual, para establecer los mitigantes necesarios y mantener los Riesgos en un nivel de tolerancia aceptable. El distractor que obliga a reportar los nuevos Riesgos a la Secretaría dentro de quince días hábiles es el más tentador porque suena obligatorio, pero la norma no prevé aviso previo: la respuesta es interna y luego revisable por la Comisión. Fundamento: 21ª-3, penúltimo párrafo.", "ref": "21ª-3"}, {"id": "M046", "tema": "imp", "tipo": "cifra", "q": "¿En qué plazo deben realizarse las modificaciones a las políticas, criterios, medidas y procedimientos derivadas de los resultados de la implementación?", "a": "En un plazo no mayor a doce meses contados a partir de que la entidad cuente con los resultados de su implementación.", "o": ["En un plazo no mayor a seis meses contados a partir de que la entidad cuente con los resultados de la implementación de su metodología.", "En un plazo no mayor a doce meses contados a partir de que la entidad cuente con los resultados de su implementación.", "En un plazo no mayor a veinticuatro meses contados a partir de la fecha en que se hubiere actualizado la evaluación nacional de riesgos aplicable.", "En un plazo no mayor a sesenta días naturales contados a partir de que el Comité conozca los resultados de la implementación de la metodología."], "x": "El plazo es de doce meses y corre desde que la entidad cuenta con los resultados de su implementación, no desde su aprobación ni desde la actualización de la evaluación nacional. El distractor que fija el plazo en sesenta días naturales desde que el Comité conoce los resultados es el más tentador porque suena procesal, pero en este Capítulo los plazos están redactados en meses y años. Fundamento: 21ª-3, último párrafo.", "ref": "21ª-3, último párr."}, {"id": "M047", "tema": "imp", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre el plazo de doce meses de la 21ª-3 NO es correcta?", "a": "Es el plazo con el que cuenta la entidad para presentar su Manual de Cumplimiento a la Comisión para su aprobación.", "o": ["Se cuenta a partir de que la entidad cuente con los resultados de la implementación de su metodología de evaluación de Riesgos.", "Las modificaciones realizadas deben identificarse señalando al menos el año y el mes en que se obtuvieron los resultados que les dieron lugar.", "Es el plazo con el que cuenta la entidad para presentar su Manual de Cumplimiento a la Comisión para su aprobación.", "Es el plazo máximo para realizar las modificaciones a las políticas, criterios, medidas y procedimientos derivadas de los resultados de la implementación."], "x": "Los doce meses de la 21ª-3 sirven para realizar las modificaciones internas derivadas de los resultados; no son un plazo para presentar el Manual a la Comisión ni para obtener aprobación alguna. La confusión es frecuente porque el Manual sí se modifica, pero la obligación es de ajuste, no de presentación. Fundamento: 21ª-3, último párrafo.", "ref": "21ª-3, último párr."}, {"id": "M048", "tema": "imp", "tipo": "caso", "q": "Banco Cendal modificó su Manual de Cumplimiento tras su implementación, pero no dejó rastro de qué resultados originaron cada cambio. ¿Qué exige la norma?", "a": "Que las modificaciones estén claramente identificadas y señaladas, indicando al menos el año y el mes en que se obtuvieron los resultados que les dieron lugar.", "o": ["Que las modificaciones se acompañen del dictamen del auditor externo independiente que hubiere revisado los resultados de la implementación de la metodología.", "Que las modificaciones se numeren consecutivamente y se informen a la Comisión dentro de los treinta días hábiles siguientes a la fecha en que se hubieren aprobado.", "Que las modificaciones consten en acta del consejo de administración, indicando el día, mes y año en que se detectaron los nuevos Riesgos que las hubieren motivado.", "Que las modificaciones estén claramente identificadas y señaladas, indicando al menos el año y el mes en que se obtuvieron los resultados que les dieron lugar."], "x": "La norma pide trazabilidad mínima: cada modificación identificada y señalada, con al menos el año y el mes de los resultados que la originaron. El distractor que exige acta del consejo con día, mes y año de detección es el más tentador porque agrega el día y un acta, lo que parece más riguroso; pero exige más de lo que la disposición pide y cambia el hecho que se fecha —los resultados, no la detección—. Fundamento: 21ª-3, último párrafo.", "ref": "21ª-3, último párr."}, {"id": "M049", "tema": "imp", "tipo": "trampa", "q": "Banco Nortia obtuvo un riesgo residual dentro de sus niveles de tolerancia, pero detectó nuevos Riesgos. ¿Qué procede conforme a la Guía CNBV?", "a": "Debe modificar sus políticas y procedimientos, sin importar si el riesgo residual se encuentra o no fuera de los niveles de tolerancia aceptables.", "o": ["Debe modificar sus políticas y procedimientos, sin importar si el riesgo residual se encuentra o no fuera de los niveles de tolerancia aceptables.", "Debe elevar sus niveles de tolerancia en el Manual de Cumplimiento, de modo que los nuevos Riesgos detectados queden comprendidos dentro del umbral aceptado.", "No procede modificación alguna, porque el riesgo residual dentro de tolerancia acredita que los mitigantes existentes son suficientes para la operación de la entidad.", "Debe esperar a la siguiente actualización de la evaluación nacional de riesgos para decidir si resulta necesario modificar sus políticas, criterios y procedimientos."], "x": "La Guía es expresa: sin importar si el riesgo residual está o no fuera de los niveles de tolerancia definidos por la propia entidad, la detección de mayores o nuevos Riesgos obliga a modificar políticas y procedimientos. El distractor que da por buenos los mitigantes existentes sólo porque el riesgo residual está dentro de tolerancia es el más tentador porque la tolerancia parece un semáforo verde, pero el disparador es la detección de nuevos Riesgos, no el semáforo. Fundamento: Guía CNBV, apartado C, fase II.", "ref": "Guía CNBV, C, fase II"}, {"id": "M050", "tema": "imp", "tipo": "memoria", "q": "Conforme a la Guía CNBV, ¿qué se espera de la entidad una vez que cuenta con los resultados de la implementación?", "a": "Que adapte su Manual de Cumplimiento u otros manuales o, en su defecto, que tenga un plan de trabajo para hacerlo.", "o": ["Que suspenda la aplicación de su metodología hasta que el Comité apruebe la totalidad de las modificaciones que resulten necesarias en sus manuales internos.", "Que adapte su Manual de Cumplimiento u otros manuales o, en su defecto, que tenga un plan de trabajo para hacerlo.", "Que sustituya íntegramente su Manual de Cumplimiento por uno nuevo cada vez que obtenga resultados de la implementación de su metodología de evaluación.", "Que presente a la Comisión un plan de acción con medidas reforzadas para gestionar y mitigar sus Riesgos dentro del plazo que la propia Comisión establezca."], "x": "La Guía admite que la adaptación tome tiempo y acepta, en su defecto, un plan de trabajo para realizarla. El distractor que exige presentar un plan de acción con medidas reforzadas a la Comisión es el más tentador porque ese plan existe de verdad, pero es algo que la Comisión puede solicitar en ejercicio de su facultad de revisión, no lo que se espera de forma ordinaria tras una implementación. Fundamento: Guía CNBV, apartado C, fase II, y 21ª-4, segundo párrafo.", "ref": "Guía CNBV, C, fase II"}, {"id": "M051", "tema": "imp", "tipo": "memoria", "q": "Una vez concluida la implementación de la metodología, ¿qué debe ocurrir?", "a": "Verificarse si el resultado obtenido es el adecuado; esa evaluación final será el inicio de la valoración.", "o": ["Remitirse los resultados a la Secretaría por conducto de la Comisión para que esta determine si el resultado obtenido resulta adecuado al Contexto de la entidad.", "Iniciarse de inmediato un nuevo diseño de la metodología, porque cada implementación agota la vigencia del diseño anterior conforme a las Disposiciones aplicables.", "Verificarse si el resultado obtenido es el adecuado; esa evaluación final será el inicio de la valoración.", "Clasificarse nuevamente a la totalidad de los Clientes de la entidad por su Grado de Riesgo, a fin de que el modelo resulte coherente con los resultados obtenidos."], "x": "La Guía une las fases con una bisagra: concluida la implementación se verifica si el resultado es el adecuado, y esa evaluación final es el inicio de la valoración. El distractor que exige reclasificar de inmediato a todos los Clientes por su Grado de Riesgo es el más tentador porque esa coherencia entre el modelo de Clientes y los resultados sí se exige, pero no es el paso inmediato que cierra la implementación. Fundamento: Guía CNBV, apartado C, fase II.", "ref": "Guía CNBV, C, fase II"}, {"id": "M052", "tema": "imp", "tipo": "memoria", "q": "¿Qué comprende la fase de valoración?", "a": "Una revisión de la eficiencia y la eficacia de la metodología, que abre la posibilidad de realizar actualizaciones o modificaciones en el diseño.", "o": ["Una revisión de la información capturada en los sistemas automatizados de la entidad, a fin de descartar inconsistencias antes de obtener los resultados de la metodología.", "Una revisión que realiza la Comisión sobre la metodología de la entidad y que concluye con la orden de modificar los mitigantes que resulten insuficientes.", "Una revisión anual a cargo del auditor externo independiente, cuyo resultado sustituye a la evaluación interna de la eficiencia y eficacia de la metodología.", "Una revisión de la eficiencia y la eficacia de la metodología, que abre la posibilidad de realizar actualizaciones o modificaciones en el diseño."], "x": "La valoración mira a la metodología misma: revisa su eficiencia y eficacia y abre la puerta a actualizar o modificar el diseño. El distractor que describe la valoración como la revisión de consistencia con los sistemas automatizados es el más tentador porque esa revisión también existe, pero pertenece a la implementación y no a la valoración. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III"}, {"id": "M053", "tema": "imp", "tipo": "cifra", "q": "¿Cuáles son los supuestos que obligan a revisar y actualizar el cumplimiento y los resultados de las obligaciones del Capítulo II Bis?", "a": "Cuando se detecten nuevos Riesgos, cuando se actualice la evaluación nacional de riesgos, o en un plazo no mayor a doce meses desde que se cuente con los resultados.", "o": ["Cuando se detecten nuevos Riesgos, cuando se actualice la evaluación nacional de riesgos, o en un plazo no mayor a doce meses desde que se cuente con los resultados.", "Cuando se detecten nuevos Riesgos, cuando cambie el Oficial de Cumplimiento y en un plazo no mayor a veinticuatro meses contados desde el diseño de la metodología.", "Cuando se actualice la evaluación nacional de riesgos, cuando la entidad lance un nuevo producto y en un plazo no mayor a cinco años desde la última implementación.", "Cuando la Comisión lo ordene expresamente, cuando el auditor externo formule observaciones y cuando el Comité lo acuerde en la sesión de cierre del ejercicio."], "x": "Son tres disparadores y operan de forma alternativa: nuevos Riesgos detectados, actualización de la evaluación nacional de riesgos, o el transcurso de doce meses desde que se cuenta con los resultados. El distractor que añade el lanzamiento de un nuevo producto y cinco años como disparadores de la revisión es el más tentador porque el lanzamiento de un producto sí obliga a evaluar, pero por la vía de la 21ª-1, con antelación al lanzamiento, y porque cinco años es el plazo de conservación, no de revisión. Fundamento: 21ª-4, primer párrafo.", "ref": "21ª-4, 1er párr."}, {"id": "M054", "tema": "imp", "tipo": "caso", "q": "La Comisión requiere a Banco Litoral las revisiones y actualizaciones de su metodología. El banco responde que se hicieron en reuniones de trabajo, sin documento alguno. ¿Qué exige la norma?", "a": "Que las revisiones y actualizaciones consten por escrito y estén a disposición de la Secretaría y de la Comisión.", "o": ["Que las revisiones y actualizaciones consten en el acta de la sesión del comité de riesgos que hubiere aprobado el modelo de evaluación de Riesgos de Clientes.", "Que las revisiones y actualizaciones consten por escrito y estén a disposición de la Secretaría y de la Comisión.", "Que las revisiones y actualizaciones se presenten a la Comisión dentro de los treinta días naturales siguientes a la conclusión de cada ejercicio social.", "Que las revisiones y actualizaciones se protocolicen ante fedatario público y se inscriban en el registro que para tal efecto lleve la propia Comisión."], "x": "La 21ª-4 exige que las revisiones y actualizaciones consten por escrito y estén a disposición de la Secretaría y de la Comisión, a requerimiento de esta última y dentro del plazo que la propia Comisión establezca. El distractor que exige presentar las revisiones y actualizaciones a la Comisión dentro de treinta días naturales es el más tentador porque convierte una obligación de disponibilidad en una de presentación periódica con plazo fijo, que la norma no establece. Fundamento: 21ª-4, primer párrafo.", "ref": "21ª-4, 1er párr."}, {"id": "M055", "tema": "imp", "tipo": "caso", "q": "Tras revisar la metodología de Financiera Quetzal Azul, la Comisión considera que sus criterios para terminar relaciones comerciales no reflejan una debida administración de Riesgos. ¿Qué puede hacer?", "a": "Podrá ordenar a la entidad la modificación de su metodología o de sus mitigantes y solicitar un plan de acción con medidas reforzadas.", "o": ["Deberá revocar la autorización del producto o servicio involucrado hasta que la entidad acredite haber corregido los criterios observados en su metodología.", "Deberá sustituir la metodología de la entidad por la que la propia Comisión dé a conocer por los medios electrónicos que establezca para el sector correspondiente.", "Podrá ordenar a la entidad la modificación de su metodología o de sus mitigantes y solicitar un plan de acción con medidas reforzadas.", "Podrá únicamente formular recomendaciones no vinculantes, ya que la modificación de la metodología es una decisión exclusiva del consejo de administración."], "x": "La 21ª-4 faculta a la Comisión para revisar y, en su caso, ordenar la modificación de la metodología o de los mitigantes, y para solicitar un plan de acción con medidas reforzadas; entre los supuestos está justamente que los criterios de apertura, limitación o terminación de relaciones no consideren una debida administración de Riesgos. El distractor que reduce la facultad de la Comisión a recomendaciones no vinculantes es el más tentador porque el verbo «podrá» sugiere discrecionalidad, pero esa facultad incluye órdenes vinculantes. Fundamento: 21ª-4, segundo párrafo.", "ref": "21ª-4, 2º párr."}, {"id": "M056", "tema": "imp", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre la intervención de la Comisión en la metodología NO es correcta?", "a": "La Comisión debe revisar y aprobar la metodología de cada entidad antes de su primera implementación.", "o": ["La Comisión podrá revisar y, en su caso, ordenar a las entidades la modificación de su metodología de evaluación de Riesgos o de sus mitigantes.", "El procedimiento y los criterios para determinar la apertura, limitación o terminación de una relación comercial deben ser congruentes con la metodología.", "La Comisión podrá solicitar un plan de acción para que las entidades adopten medidas reforzadas para gestionar y mitigar sus Riesgos.", "La Comisión debe revisar y aprobar la metodología de cada entidad antes de su primera implementación."], "x": "No existe aprobación previa de la metodología por la Comisión: la disposición usa «podrá revisar», es decir, una facultad de revisión posterior y eventual. Suena razonable exigir un visto bueno previo porque otras figuras del régimen sí se someten a autorización, pero aquí la aprobación interna corresponde al Comité. Fundamento: 21ª-4, segundo párrafo, y Guía CNBV, apartado E.", "ref": "21ª-4, 2º párr."}, {"id": "M057", "tema": "imp", "tipo": "memoria", "q": "¿Qué precisa la Guía CNBV sobre la revisión de la metodología frente a la auditoría anual?", "a": "Que debe ser un proceso continuo y que corre con independencia de la auditoría anual que se realice en términos de las Disposiciones.", "o": ["Que debe ser un proceso continuo y que corre con independencia de la auditoría anual que se realice en términos de las Disposiciones.", "Que la revisión sustituye a la auditoría anual cuando la entidad obtiene una calificación de Riesgo bajo en la implementación de su metodología de evaluación.", "Que la revisión de la metodología queda satisfecha con la auditoría anual, siempre que el auditor externo se pronuncie expresamente sobre los resultados obtenidos.", "Que la revisión debe practicarse en la misma fecha en que concluya la auditoría anual, a fin de que ambos ejercicios compartan la información utilizada."], "x": "La Guía insiste en que una metodología eficaz es un proceso continuo, no un ejercicio de una sola vez, y que su revisión corre con independencia de la auditoría anual. El distractor que da por satisfecha la revisión de la metodología con la sola auditoría anual es el más tentador porque la auditoría sí es un mitigante y sí aporta insumos, pero no absorbe ni sustituye la obligación de revisar y actualizar la metodología. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III"}, {"id": "M058", "tema": "imp", "tipo": "caso", "q": "Banco Zafiro del Bajío se fusionó con otra institución y absorbió una cartera de Clientes de mayor Riesgo. ¿Qué ejemplo de la Guía CNBV se actualiza?", "a": "Un cambio que obliga a revisar y, en su caso, actualizar la metodología para identificar los cambios en el grado de exposición al Riesgo.", "o": ["Un supuesto que permite diferir la revisión de la metodología hasta veinticuatro meses después de que surta efectos la fusión entre ambas instituciones.", "Un cambio que obliga a revisar y, en su caso, actualizar la metodología para identificar los cambios en el grado de exposición al Riesgo.", "Un supuesto que obliga únicamente a reclasificar por Grado de Riesgo a los Clientes absorbidos, sin efecto alguno sobre la metodología de la entidad.", "Un supuesto que obliga a suspender la aplicación de la metodología hasta que la Comisión autorice el nuevo perfil de Riesgo resultante de la operación."], "x": "La Guía enumera entre los cambios que disparan la revisión las fusiones, adquisiciones o escisiones, así como la apertura o cierre de cuentas de Clientes de mayor Riesgo. El distractor que limita el efecto de la fusión a reclasificar por Grado de Riesgo a los Clientes absorbidos es el más tentador porque esa reclasificación también procede, pero se queda en el modelo de Clientes y deja intacta la metodología de la entidad, que es justo lo que debe revisarse. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III"}, {"id": "M059", "tema": "imp", "tipo": "caso", "q": "El Oficial de Cumplimiento de Banco Tesalia propone dar seguimiento al Riesgo sólo a nivel de la entidad en su conjunto. ¿Qué establece la Guía CNBV para el monitoreo?", "a": "Que debe darse seguimiento al Riesgo por cada indicador y al consolidado por elemento de Riesgo, evaluando la efectividad de los controles.", "o": ["Que debe darse seguimiento al Riesgo de cada Cliente clasificado con Grado de Riesgo alto y al consolidado de la cartera del periodo evaluado.", "Que debe darse seguimiento a cada indicador únicamente cuando el auditor externo hubiere formulado observaciones sobre el elemento al que pertenece.", "Que debe darse seguimiento al Riesgo por cada indicador y al consolidado por elemento de Riesgo, evaluando la efectividad de los controles.", "Que debe darse seguimiento únicamente al Riesgo consolidado de la entidad, porque ese es el resultado que se presenta al consejo de administración."], "x": "El monitoreo que describe la Guía es granular: seguimiento del Riesgo por cada indicador y del consolidado por elemento, además de evaluar la efectividad de criterios, medidas, políticas y procedimientos. El distractor que ubica el monitoreo en el Riesgo de cada Cliente y el consolidado de la cartera es el más tentador porque también habla de seguimiento y de consolidado, pero se mueve al terreno del riesgo de cada Cliente, que corresponde a otro ejercicio. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III"}, {"id": "M060", "tema": "imp", "tipo": "caso", "q": "Banco Ribera quiere reforzar el monitoreo de su metodología. ¿Qué tipo de señales de alerta debe establecer conforme a la Guía CNBV?", "a": "Señales de alerta descriptiva y prospectiva que indiquen potenciales fuentes de Riesgo.", "o": ["Señales de alerta automatizadas que bloqueen la operación cuando el Cliente sea clasificado con el Grado de Riesgo más alto de la escala definida.", "Señales de alerta exclusivamente retrospectivas, construidas con las operaciones inusuales reportadas durante el periodo que se hubiere evaluado.", "Señales de alerta que la Comisión dé a conocer por los medios electrónicos que establezca para cada sector de sujetos supervisados del sistema financiero.", "Señales de alerta descriptiva y prospectiva que indiquen potenciales fuentes de Riesgo."], "x": "La Guía pide señales de alerta descriptiva y prospectiva, es decir, que además de describir lo ocurrido anticipen fuentes potenciales de Riesgo; el monitoreo se realiza mediante actividades permanentes, evaluaciones independientes o una combinación de ambas. El distractor que reduce las señales de alerta a lo exclusivamente retrospectivo es el más tentador porque las alertas suelen construirse con historia, pero quedarse en lo retrospectivo elimina justamente la mitad prospectiva que la Guía exige. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III"}, {"id": "M061", "tema": "imp", "tipo": "trampa", "q": "¿Qué relación guarda la metodología de evaluación de Riesgos con el modelo de clasificación de Clientes por Grado de Riesgo?", "a": "La clasificación debe ser coherente con los resultados de la metodología, pero la metodología debe ser distinta e independiente de ese modelo.", "o": ["La clasificación debe ser coherente con los resultados de la metodología, pero la metodología debe ser distinta e independiente de ese modelo.", "La metodología debe derivarse del modelo de clasificación de Clientes, ya que el Riesgo de la entidad es la suma de los Grados de Riesgo de su cartera.", "La metodología y el modelo de clasificación de Clientes son el mismo ejercicio, por lo que basta documentar uno de ellos para acreditar el cumplimiento de ambos.", "La clasificación de Clientes sustituye a la metodología cuando la entidad acredita que su modelo cumple con lo previsto en el Anexo 3 de las Disposiciones."], "x": "Las dos cosas son verdaderas a la vez: la 25ª Bis exige que el modelo de Clientes sea coherente con la metodología del Capítulo II Bis, y la Guía exige que la metodología sea distinta e independiente de ese modelo. La primera mide el Riesgo de la entidad; el segundo, el de cada Cliente en lo particular. El distractor que hace derivar la metodología del modelo de clasificación de Clientes es el más tentador porque la coherencia sugiere derivación, pero coherencia no es dependencia. Fundamento: Guía CNBV, apartado C, fase III, y 25ª Bis.", "ref": "Guía CNBV, C, fase III"}, {"id": "M062", "tema": "imp", "tipo": "caso", "q": "Banco Vega Marina obtuvo resultados que ubican con Riesgo alto a uno de sus canales, pero mantiene para él los mismos controles que para el resto. ¿Qué regla se incumple?", "a": "La de dar cumplimiento a todas las obligaciones de las Disposiciones en concordancia con los resultados que generen sus metodologías.", "o": ["La de asegurarse de que no existan inconsistencias entre la información incorporada a la metodología y la que obre en sus sistemas automatizados.", "La de dar cumplimiento a todas las obligaciones de las Disposiciones en concordancia con los resultados que generen sus metodologías.", "La de someter la metodología y los resultados de su implementación a la aprobación del comité de riesgos, a propuesta del Comité de la entidad.", "La de conservar durante un plazo no menor a cinco años la información generada con motivo del Capítulo II Bis de las Disposiciones aplicables a la entidad."], "x": "La 21ª-5 cierra el Capítulo con una regla de congruencia: todas las obligaciones de las Disposiciones deben cumplirse en concordancia con los resultados de la metodología, de modo que un canal calificado con Riesgo alto exige controles diferenciados. El distractor que describe la obligación de consistencia de los datos con los sistemas automatizados es el más tentador porque también es una obligación de la implementación, pero se refiere a la calidad de los datos de entrada, no al uso de los resultados. Fundamento: 21ª-5.", "ref": "21ª-5"}, {"id": "M063", "tema": "imp", "tipo": "cifra", "q": "Cuando la Comisión requiere a la entidad las revisiones y actualizaciones de su metodología, ¿en qué plazo deben proporcionarse?", "a": "Dentro del plazo que la propia Comisión establezca.", "o": ["Dentro de los doce meses siguientes a la fecha en que la entidad cuente con los resultados de la implementación de su metodología.", "Dentro de los quince días hábiles siguientes a la fecha en que se notifique el requerimiento respectivo a la entidad de que se trate.", "Dentro del plazo que la propia Comisión establezca.", "Dentro de los treinta días naturales siguientes al cierre del ejercicio social en que se hubieren practicado las revisiones correspondientes."], "x": "La norma no fija un número: la información se proporciona dentro del plazo que la propia Comisión establezca en el requerimiento. El distractor que fija quince días hábiles desde la notificación del requerimiento es el más tentador porque ese plazo es habitual en otros ámbitos administrativos, pero el Capítulo II Bis remite al plazo que fije la autoridad caso por caso. Fundamento: 21ª-4, primer y último párrafos.", "ref": "21ª-4"}, {"id": "M064", "tema": "imp", "tipo": "caso", "q": "Casa de Bolsa Meridiano implementó su metodología usando únicamente el número de Clientes de los últimos dieciocho meses. ¿Qué le falta?", "a": "Utilizar también el número de operaciones y el monto operado del periodo, que no podrá ser menor a doce meses.", "o": ["Incorporar el número de reportes de operaciones inusuales y el monto de las sanciones impuestas durante el mismo periodo de dieciocho meses.", "Nada, porque el número de Clientes es el único dato que la norma exige para implementar la metodología de evaluación de Riesgos de la entidad.", "Reducir el periodo a doce meses exactos, ya que la norma no permite utilizar información de un periodo mayor al señalado en las Disposiciones.", "Utilizar también el número de operaciones y el monto operado del periodo, que no podrá ser menor a doce meses."], "x": "La fracción II exige tres datos en conjunto —número de Clientes, número de operaciones y monto operado— por un periodo no menor a doce meses; dieciocho meses es válido porque el plazo es un piso. El distractor que obliga a reducir el periodo a doce meses exactos es el más tentador porque parece corregir un exceso, pero confunde el mínimo con un máximo. Fundamento: 21ª-3, fr. II.", "ref": "21ª-3, fr. II"}, {"id": "M065", "tema": "imp", "tipo": "cifra", "q": "¿Cuál es el plazo máximo para revisar y actualizar el cumplimiento y los resultados del Capítulo II Bis, contado desde que se cuenta con los resultados de la implementación?", "a": "Doce meses.", "o": ["Doce meses.", "Veinticuatro meses.", "Cinco años, que es el mismo plazo previsto para la conservación de la información generada.", "Seis meses."], "x": "La 21ª-4 fija doce meses como plazo máximo, sin perjuicio de que la revisión se adelante si se detectan nuevos Riesgos o si se actualiza la evaluación nacional de riesgos. El distractor de los cinco años es el más tentador porque sí es un plazo real del mismo artículo, pero corresponde a la conservación de la información, no a la revisión. Fundamento: 21ª-4, primer párrafo.", "ref": "21ª-4, 1er párr."}, {"id": "M066", "tema": "imp", "tipo": "caso", "q": "La Secretaría da a conocer, por conducto de la Comisión, una actualización de la evaluación nacional de riesgos. Banco Almadía implementó su metodología hace cuatro meses. ¿Qué procede?", "a": "Debe revisar y, en su caso, actualizar su metodología, porque la actualización de la evaluación nacional de riesgos es uno de los supuestos que lo exigen.", "o": ["No procede nada, porque el plazo de doce meses desde los resultados de su implementación aún no ha transcurrido y ese es el único supuesto de revisión.", "Debe revisar y, en su caso, actualizar su metodología, porque la actualización de la evaluación nacional de riesgos es uno de los supuestos que lo exigen.", "Debe esperar a que la Comisión le ordene expresamente la modificación de su metodología o de sus mitigantes antes de realizar cualquier actualización.", "Debe reclasificar por Grado de Riesgo a la totalidad de sus Clientes dentro de los seis meses siguientes a la publicación de la actualización referida."], "x": "Los tres supuestos de la 21ª-4 son alternativos: basta que se actualice la evaluación nacional de riesgos para que nazca el deber de revisar, aunque no hayan transcurrido los doce meses. El distractor que descarta cualquier obligación porque el plazo de doce meses aún no vence es el más tentador porque ese plazo es el supuesto más recordado, pero leerlo como el único convierte una alternativa en una condición. Fundamento: 21ª-4, primer párrafo.", "ref": "21ª-4, 1er párr."}, {"id": "M067", "tema": "imp", "tipo": "cifra", "q": "¿Cuáles son los datos mínimos del periodo que la entidad debe utilizar al implementar su metodología?", "a": "El total del número de Clientes, el número de operaciones y el monto operado.", "o": ["El número de operaciones inusuales reportadas, el número de Clientes de Grado de Riesgo alto y el monto operado por cada uno de los canales de distribución.", "El monto operado, el número de operaciones y el porcentaje de concentración del negocio por cada uno de los cuatro elementos de Riesgo definidos.", "El total del número de Clientes, el número de operaciones y el monto operado.", "El total del número de Clientes y de Usuarios, el número de contratos celebrados y el número de sucursales en operación durante el periodo evaluado."], "x": "Son tres datos y la fracción II los fija como piso —«al menos»—: total del número de Clientes, número de operaciones y monto operado; la entidad puede incorporar más información, nunca menos. El distractor que añade el porcentaje de concentración del negocio por elemento es el más tentador porque acierta en dos de los tres datos, pero ese porcentaje pertenece a la medición del impacto y no a la información mínima de entrada. Fundamento: 21ª-3, fr. II.", "ref": "21ª-3, fr. II"}, {"id": "M068", "tema": "imp", "tipo": "caso", "q": "El Comité de Sofipo Caja Alondra pide al área de cumplimiento un producto que muestre cómo ha evolucionado el Riesgo y si los controles están funcionando. ¿Qué prevé la Guía CNBV?", "a": "El desarrollo de informes sobre la evolución del Riesgo y la eficiencia y eficacia de los controles implementados.", "o": ["La elaboración de un nuevo diseño de la metodología cada vez que el Comité solicite conocer la evolución del Riesgo y la efectividad de los controles internos.", "La presentación de un dictamen del auditor externo independiente sobre la evolución del Riesgo de la entidad y sobre la suficiencia de los mitigantes implementados.", "La remisión a la Comisión de un reporte trimestral con la evolución del Riesgo por indicador y por elemento, dentro del plazo que la propia Comisión establezca.", "El desarrollo de informes sobre la evolución del Riesgo y la eficiencia y eficacia de los controles implementados."], "x": "El monitoreo permite desarrollar informes que establezcan la evolución del Riesgo y la eficiencia y eficacia de los criterios, medidas, políticas y procedimientos implementados, así como realizar las adecuaciones necesarias. El distractor que exige un dictamen del auditor externo sobre la evolución del Riesgo es el más tentador porque la auditoría aporta una visión global, pero el informe de evolución nace del monitoreo interno y no requiere dictamen externo. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III"}, {"id": "M069", "tema": "gob", "tipo": "memoria", "q": "¿Dónde podrán estar contenidos el diseño de la metodología y los procesos para su uso y validación?", "a": "Podrán estar contenidos en un documento diferente al Manual de Cumplimiento.", "o": ["Podrán estar contenidos en un documento diferente al Manual de Cumplimiento.", "Deberán estar contenidos en el documento que describa el modelo de evaluación de Riesgos de Clientes a que se refiere el Anexo 3 de las Disposiciones.", "Podrán estar en cualquier documento, siempre que este se registre previamente ante la Comisión por los medios electrónicos que esta establezca.", "Deberán estar contenidos invariablemente en el Manual de Cumplimiento, en un apartado específico aprobado por el consejo de administración de la entidad."], "x": "La Guía usa un modal potestativo: el diseño y los procesos de uso y validación «podrán» estar en un documento distinto al Manual de Cumplimiento, dada la actualización periódica de la metodología. El distractor que exige registrar previamente el documento ante la Comisión es el más tentador porque conserva el «podrán», pero le agrega ese registro previo, que no existe. Fundamento: Guía CNBV, apartado E, y 21ª-1, segundo párrafo.", "ref": "Guía CNBV, apartado E"}, {"id": "M070", "tema": "gob", "tipo": "cifra", "q": "¿Por cuánto tiempo debe conservarse la información generada con motivo del Capítulo II Bis?", "a": "Por un plazo no menor a cinco años.", "o": ["Por un plazo no menor a doce meses contados a partir de que se cuente con los resultados de la implementación de la metodología.", "Por un plazo no menor a cinco años.", "Por un plazo no mayor a cinco años, transcurridos los cuales la información deberá destruirse de forma segura por la propia entidad.", "Por un plazo no menor a diez años contados a partir de la fecha de la última implementación de la metodología de evaluación."], "x": "La conservación es de al menos cinco años, y la información debe proporcionarse a la Secretaría y a la Comisión a requerimiento de esta última. El distractor que convierte los cinco años en plazo máximo, tras el cual habría que destruir la información, es el más tentador porque repite el número correcto e invierte el modal: «no menor» fija un piso, «no mayor» ordenaría destruir, que es lo contrario de lo que pide la norma. Fundamento: 21ª-4, último párrafo, y Guía CNBV, apartado E.", "ref": "21ª-4, último párr."}, {"id": "M071", "tema": "gob", "tipo": "caso", "q": "La Comisión requiere a Banco del Sauce la información generada por su metodología de hace tres años. El banco responde que ya la depuró. ¿Qué exige la norma?", "a": "Conservar esa información por un plazo no menor a cinco años y proporcionarla a la Secretaría y a la Comisión, a requerimiento de esta última.", "o": ["Conservar la información únicamente mientras la metodología se encuentre vigente y entregar a la Comisión un resumen ejecutivo de los resultados obtenidos.", "Conservar la información por un plazo no menor a diez años y presentarla anualmente a la Secretaría junto con el dictamen del auditor externo independiente.", "Conservar esa información por un plazo no menor a cinco años y proporcionarla a la Secretaría y a la Comisión, a requerimiento de esta última.", "Conservar la información por doce meses y, transcurrido ese plazo, entregarla al comité de riesgos para su archivo definitivo dentro de la propia entidad."], "x": "El plazo de conservación es de al menos cinco años y abarca toda la información generada para el diseño, la implementación y la valoración; depurarla antes incumple la 21ª-4. El distractor que ata la conservación a la vigencia de la metodología es el más tentador porque ese criterio es razonable en archivo, pero ajeno a la norma, que fija un plazo cierto. Fundamento: 21ª-4, último párrafo.", "ref": "21ª-4, último párr."}, {"id": "M072", "tema": "gob", "tipo": "memoria", "q": "¿Qué debe considerar la documentación del diseño de la metodología de evaluación de Riesgos?", "a": "La descripción de todos los procesos de identificación, medición y mitigación, incluidos sus detalles operativos, las modificaciones realizadas y las áreas responsables.", "o": ["La descripción de los Grados de Riesgo en que la entidad clasifica a sus Clientes y Usuarios, así como los procesos de uso y validación del modelo del Anexo 3.", "Únicamente la descripción del método de medición seleccionado y de los pesos asignados a cada indicador y a cada elemento, por tratarse de la parte cuantitativa del ejercicio.", "Únicamente los resultados de la implementación y las modificaciones al Manual de Cumplimiento, ya que el diseño se acredita con el propio Manual aprobado por el consejo.", "La descripción de todos los procesos de identificación, medición y mitigación, incluidos sus detalles operativos, las modificaciones realizadas y las áreas responsables."], "x": "La documentación debe describir todos los procesos de identificación, medición y mitigación con sus detalles operativos, y además documentar las modificaciones realizadas, las áreas responsables de realizarlas y las áreas involucradas en su operación, incluidas las de control interno. El distractor que reduce la documentación a la descripción del método de medición y los pesos es el más tentador porque esa parte es la más visible del documento, pero dejaría fuera identificación y mitigación. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E"}, {"id": "M073", "tema": "gob", "tipo": "memoria", "q": "¿Qué debe probar la documentación de la metodología de evaluación de Riesgos?", "a": "Que contiene los elementos suficientes para acreditar el cumplimiento de los requisitos mínimos del diseño, conforme a las Disposiciones y a la propia Guía.", "o": ["Que contiene los elementos suficientes para acreditar el cumplimiento de los requisitos mínimos del diseño, conforme a las Disposiciones y a la propia Guía.", "Que la metodología fue aprobada por el consejo de administración de la entidad dentro de los doce meses siguientes a su última modificación relevante.", "Que la entidad obtuvo una calificación de Riesgo dentro de los niveles de tolerancia aceptables definidos en su propio Manual de Cumplimiento vigente.", "Que el modelo de evaluación de Riesgos de Clientes de la entidad cumple con lo señalado en el Anexo 3 de las Disposiciones que le resulten aplicables."], "x": "La Guía pide que la documentación contenga elementos suficientes para probar el cumplimiento de los requisitos mínimos del diseño, en términos de las Disposiciones y de la propia Guía. El distractor que describe el documento probatorio del modelo de Clientes del Anexo 3 es el más tentador porque ese documento sí existe, pero se rige por la 25ª Bis, no por el Capítulo II Bis. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E"}, {"id": "M074", "tema": "gob", "tipo": "caso", "q": "En Banco Cendal, el director de operaciones presentó la metodología directamente al consejo de administración. ¿Cuál es el circuito que prevé la Guía CNBV?", "a": "El Oficial de Cumplimiento somete la metodología a la aprobación del Comité, y el Comité presenta al consejo los resultados de su implementación.", "o": ["El comité de riesgos aprueba la metodología a propuesta del Comité, y el Oficial de Cumplimiento informa al consejo de administración los resultados alcanzados.", "El Oficial de Cumplimiento somete la metodología a la aprobación del Comité, y el Comité presenta al consejo los resultados de su implementación.", "El auditor externo somete la metodología a la aprobación del comité de riesgos, y este informa al consejo de administración los resultados de la implementación.", "El Comité somete la metodología a la aprobación del consejo de administración, y el Oficial de Cumplimiento presenta al comité de riesgos los resultados obtenidos."], "x": "El circuito tiene dos escalones: el Oficial de Cumplimiento somete al Comité la metodología y los resultados de su implementación, y el Comité presenta al consejo de administración, directivo o administrador único los resultados de esa implementación. El distractor que hace aprobar la metodología al comité de riesgos, a propuesta del Comité, es el más tentador porque toma prestado el circuito del modelo de Clientes del Anexo 3; pero incluso ahí quien informa al consejo es el propio comité de riesgos, no el Oficial de Cumplimiento (25ª Bis). Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E"}, {"id": "M075", "tema": "gob", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre los circuitos de aprobación NO es correcta?", "a": "La metodología de evaluación de Riesgos de la entidad debe ser aprobada por el comité de riesgos a propuesta del Comité.", "o": ["El Comité deberá presentar al consejo de administración, directivo o administrador único los resultados de la implementación de la metodología.", "El Oficial de Cumplimiento deberá someter la metodología de evaluación de Riesgos a la aprobación del Comité, así como los resultados de su implementación.", "La metodología de evaluación de Riesgos de la entidad debe ser aprobada por el comité de riesgos a propuesta del Comité.", "El modelo de evaluación de Riesgos de Clientes deberá ser aprobado por el comité de riesgos de la entidad con base en la propuesta que haga su Comité."], "x": "Son dos circuitos distintos que el examen suele cruzar: la metodología institucional la aprueba el Comité a propuesta del Oficial de Cumplimiento; el modelo de Clientes lo aprueba el comité de riesgos a propuesta del Comité, con aviso al consejo. Atribuir al comité de riesgos la aprobación de la metodología es la confusión más frecuente. Fundamento: Guía CNBV, apartado E, y 25ª Bis.", "ref": "Guía CNBV, apartado E"}, {"id": "M076", "tema": "gob", "tipo": "cifra", "q": "¿En qué periodo debe ocurrir que el Oficial de Cumplimiento someta la metodología al Comité y que el Comité presente los resultados al consejo?", "a": "En un periodo menor a doce meses a partir de la fecha de la última modificación a la metodología.", "o": ["En un periodo menor a seis meses a partir de la fecha de la última modificación a la metodología de evaluación de Riesgos de la entidad.", "En un periodo no mayor a veinticuatro meses a partir de la fecha en que se hubiere actualizado la evaluación nacional de riesgos aplicable.", "En un periodo menor a doce meses a partir de la fecha en que se hubiere obtenido el primer resultado de la implementación de la metodología.", "En un periodo menor a doce meses a partir de la fecha de la última modificación a la metodología."], "x": "La Guía ancla este periodo en la fecha de la última modificación a la metodología, no en la fecha de los resultados. El distractor que cuenta los doce meses desde el primer resultado de la implementación es el más tentador porque conserva los doce meses y cambia sólo el punto de partida, que es exactamente donde se juega la pregunta: otros plazos del Capítulo sí corren desde los resultados de la implementación. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E"}, {"id": "M077", "tema": "gob", "tipo": "memoria", "q": "¿Qué prevé la Guía CNBV tratándose de entidades que cuentan con Representante en lugar de Oficial de Cumplimiento?", "a": "Que se ajustarán a lo que establezcan las Disposiciones aplicables.", "o": ["Que se ajustarán a lo que establezcan las Disposiciones aplicables.", "Que quedan exceptuadas de someter la metodología a aprobación, bastando que el Representante conserve la documentación por un plazo de cinco años.", "Que el Representante deberá someter la metodología directamente al consejo de administración, sin que intervenga órgano colegiado alguno de la entidad.", "Que deberán constituir un Comité con las mismas funciones dentro de los doce meses siguientes a la implementación de su metodología de evaluación."], "x": "La Guía no crea un circuito propio para los Representantes: remite a lo que establezcan las Disposiciones aplicables a cada sujeto supervisado. El distractor que hace al Representante someter la metodología directamente al consejo de administración es el más tentador porque, al no haber Comité, parece lógico; pero esa conclusión no está en la Guía, que se limita a remitir. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E"}, {"id": "M078", "tema": "gob", "tipo": "caso", "q": "Banco Ribera pertenece al Grupo Financiero Cumbres, que integra también una casa de bolsa y una aseguradora. ¿Qué debe establecer el banco en el diseño de su metodología?", "a": "Cómo se tomarán en cuenta los resultados de la metodología que, en su caso, hayan implementado las demás entidades financieras que integren el grupo.", "o": ["Que remitirá sus resultados a la sociedad controladora para que esta consolide una sola calificación de Riesgo del grupo ante la Secretaría y la Comisión.", "Cómo se tomarán en cuenta los resultados de la metodología que, en su caso, hayan implementado las demás entidades financieras que integren el grupo.", "Que sus resultados sustituirán a los de las demás entidades del grupo cuando el banco represente más de la mitad de los activos totales del grupo financiero.", "Que adoptará íntegramente la metodología única del grupo financiero, aprobada por la sociedad controladora y aplicable a todas las entidades que lo integren."], "x": "La obligación es de método, no de resultado: en el diseño debe quedar descrito cómo se tomarán en cuenta los resultados de las metodologías que, en su caso, hayan implementado las demás entidades del grupo. El distractor que hace adoptar íntegramente una metodología única del grupo financiero es el más tentador porque suena eficiente, pero la norma preserva la metodología propia de cada entidad y sólo exige articularla con las demás. Fundamento: 21ª-1, tercer párrafo, y Guía CNBV, apartado D.", "ref": "21ª-1, 3er párr."}, {"id": "M079", "tema": "gob", "tipo": "trampa", "q": "Respecto de la coordinación y la estrategia para la mitigación del Riesgo a nivel grupo financiero, la Guía CNBV establece que:", "a": "Es recomendable que exista, sin que se trate de una obligación impuesta por la propia Guía.", "o": ["Es obligatoria y debe acreditarse ante la Comisión mediante un documento suscrito por la sociedad controladora del grupo financiero correspondiente.", "Es obligatoria para los grupos que integren una institución de crédito, y potestativa para los demás grupos financieros que operen en el país.", "Es recomendable que exista, sin que se trate de una obligación impuesta por la propia Guía.", "Está prohibida, porque cada entidad debe evaluar sus Riesgos de manera aislada y sin considerar los resultados obtenidos por las demás del grupo."], "x": "La Guía distingue con cuidado dos modales en el mismo apartado: es obligatorio establecer en el diseño cómo se toman en cuenta los resultados de las demás entidades del grupo, y es apenas «recomendable» que exista coordinación y estrategia a nivel grupo. El distractor que hace obligatoria y acreditable ante la Comisión la coordinación a nivel grupo es el más tentador porque convierte la recomendación en deber, que es el error que la pregunta busca. Fundamento: Guía CNBV, apartado D.", "ref": "Guía CNBV, apartado D"}, {"id": "M080", "tema": "gob", "tipo": "memoria", "q": "Según la Guía CNBV, ¿qué permite la determinación de los Riesgos a nivel grupo financiero?", "a": "Identificar de manera óptima los Riesgos y las exposiciones por rubros de actividad comercial o categorías de productos, por separado y en conjunto.", "o": ["Reducir el plazo de conservación de la información generada por cada entidad, al concentrarse los expedientes en un solo domicilio del grupo financiero.", "Sustituir las evaluaciones individuales de cada entidad del grupo por una sola evaluación consolidada que apruebe la sociedad controladora respectiva.", "Trasladar la responsabilidad del cumplimiento normativo en la materia de cada entidad del grupo a la sociedad controladora y a su consejo de administración.", "Identificar de manera óptima los Riesgos y las exposiciones por rubros de actividad comercial o categorías de productos, por separado y en conjunto."], "x": "La evaluación a nivel grupo permite identificar de manera óptima los Riesgos y exposiciones dentro de rubros específicos de actividad comercial o categorías de productos, por separado y en conjunto, y que la alta dirección del grupo los comprenda y mitigue. El distractor que sustituye las evaluaciones individuales de cada entidad por una sola evaluación consolidada es el más tentador porque esa consolidación parece el paso natural, pero ninguna evaluación de grupo sustituye la de cada entidad. Fundamento: Guía CNBV, apartado D.", "ref":
