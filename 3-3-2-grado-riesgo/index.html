e conforme al Anexo 3?", "a": "El volumen de operación", "o": ["El volumen de operación", "El giro o actividad a que se dedica el Cliente de que se trate", "La ubicación geográfica o Geolocalización del Cliente correspondiente", "Los productos y servicios que el Cliente tenga contratados con la Entidad"], "x": "El volumen de operación encabeza el catálogo de características transaccionales; las otras tres sí son inherentes. La trampa está en que «productos y servicios» suena transaccional, pero el Anexo 3 lo ubica expresamente entre las inherentes. Fundamento: Anexo 3, I.i, a) y b).", "ref": "Anexo 3, I.i"}, {"id": "C028", "tema": "mod", "tipo": "caso", "q": "Banco Ribera desarrolló su Modelo de Riesgos con una muestra formada sólo por Clientes de banca patrimonial. ¿Qué exigencia del Anexo 3 incumple?", "a": "Demostrar que los datos utilizados son representativos del universo de sus Clientes", "o": ["Demostrar que los datos utilizados son representativos del universo de sus Clientes", "Someter la muestra a la aprobación previa de la Comisión antes de implementar el Modelo de Riesgos", "Utilizar información correspondiente a un periodo que no podrá ser menor a doce meses de operación", "Contar con al menos tres Grados de Riesgo claramente diferenciables entre sí dentro del Modelo"], "x": "El Anexo 3 exige demostrar que los datos son representativos del universo de Clientes con los que se mantiene relación comercial y que se incorporaron los productos y servicios contratados. El distractor de los doce meses es real pero pertenece a otro ejercicio: es la implementación de la metodología de evaluación de Riesgos de la Entidad (21ª-3, fr. II). Fundamento: Anexo 3, introducción.", "ref": "Anexo 3, introducción"}, {"id": "C029", "tema": "rel", "tipo": "memoria", "q": "Conforme a la 28ª, ¿en qué momento y con qué herramienta deben las Entidades clasificar a sus Clientes en función de su Grado de Riesgo?", "a": "Al inicio de la relación comercial y con los sistemas automatizados de la 51ª", "o": ["Al inicio de la relación comercial y con los sistemas automatizados de la 51ª", "Dentro de los seis meses siguientes al inicio de la relación, con los sistemas automatizados de la 51ª", "Al inicio de la relación comercial y con el sistema de alertas de comportamiento transaccional de la 25ª Quáter", "Dentro de los primeros 60 días hábiles del año siguiente al inicio de la relación comercial de que se trate"], "x": "La 28ª ordena clasificar al inicio de la relación comercial utilizando los sistemas automatizados de la 51ª. El distractor de los seis meses es el más tentador: ese plazo existe, pero es el periodo durante el cual se considera la información que el Cliente proporcionó al inicio para fijar su Grado inicial, no una prórroga para clasificar. Fundamento: 28ª, 1er párr.", "ref": "28ª, 1er párr."}, {"id": "C030", "tema": "rel", "tipo": "cifra", "q": "¿Durante cuánto tiempo, al menos, debe considerarse la información que el Cliente proporcionó al inicio de la relación comercial para determinar su Grado de Riesgo inicial?", "a": "Los seis primeros meses", "o": ["Los seis primeros meses", "Los tres primeros meses", "Los doce primeros meses", "Los primeros 60 días hábiles"], "x": "La 25ª Bis fija seis meses. El distractor de doce meses corresponde a la evaluación de Riesgos de la Entidad (21ª-3 y 21ª-4) y el de 60 días hábiles a la entrega anual del Anexo 3: tres plazos distintos, tres obligaciones distintas. Fundamento: 25ª Bis, 3er párr.", "ref": "25ª Bis, 3er párr."}, {"id": "C031", "tema": "rel", "tipo": "cifra", "q": "¿Durante cuánto tiempo debe el sistema de alertas considerar, al menos, la información que el Cliente proporcione sobre las Operaciones que estime realizar, para determinar su perfil transaccional inicial?", "a": "Los seis primeros meses", "o": ["Los seis primeros meses", "Los primeros 90 días naturales", "Los doce primeros meses", "Los primeros 60 días hábiles"], "x": "La 25ª Quáter usa el mismo plazo de seis meses que la 25ª Bis: coinciden en el tiempo el Grado de Riesgo inicial y el perfil transaccional inicial, aunque sean cosas distintas. Ninguno de los plazos en días corresponde a esta obligación. Fundamento: 25ª Quáter, 3er párr.", "ref": "25ª Quáter, 3er párr."}, {"id": "C032", "tema": "rel", "tipo": "cifra", "q": "¿Con qué periodicidad mínima deben las Entidades evaluar el Grado de Riesgo de sus Clientes para determinar si procede reclasificarlos?", "a": "Al menos cada seis meses", "o": ["Al menos cada seis meses", "Al menos cada doce meses", "Al menos cada tres meses", "Al menos dos veces por año calendario"], "x": "La 25ª Bis y el Anexo 3 coinciden: al menos cada seis meses, con frecuencia mayor cuando el Grado de Riesgo sea mayor. El distractor de «dos veces por año calendario» es la regla de SOFOMES, no la de Bancos. Fundamento: 25ª Bis, párr. reformado DOF 03-03-2022.", "ref": "25ª Bis; Anexo 3, II"}, {"id": "C033", "tema": "rel", "tipo": "cifra", "q": "¿Cada cuánto, como mínimo, deben las Entidades evaluar el perfil transaccional de sus Clientes para determinar si resulta necesario modificarlo?", "a": "Al menos cada seis meses", "o": ["Al menos cada seis meses", "Al menos cada doce meses", "Al menos cada 60 días hábiles", "Sólo cuando se genere una alerta en el sistema de monitoreo transaccional"], "x": "La 25ª Quáter impone la evaluación del perfil transaccional al menos cada seis meses, con independencia de que se generen alertas. El distractor que condiciona la evaluación del perfil transaccional a que se genere una alerta es el más tentador porque el perfil vive dentro del sistema de alertas, pero la obligación es periódica, no reactiva. Fundamento: 25ª Quáter, último párr.", "ref": "25ª Quáter, último párr."}, {"id": "C034", "tema": "rel", "tipo": "cifra", "q": "El Anexo 3 exige llevar a cabo la evaluación de Riesgos de los Clientes con una frecuencia máxima de:", "a": "Seis meses", "o": ["Seis meses", "Doce meses", "Veinticuatro meses", "Tres meses"], "x": "El Anexo 3 repite el plazo de la 25ª Bis: frecuencia no mayor a seis meses. El de doce meses es el de la revisión y actualización de la metodología de evaluación de Riesgos de la Entidad (21ª-4), que mide a la institución, no al Cliente. Fundamento: Anexo 3, II.", "ref": "Anexo 3, II"}, {"id": "C035", "tema": "rel", "tipo": "cifra", "q": "¿En qué plazo deben las Entidades revisar y actualizar el cumplimiento y resultados de su metodología de evaluación de Riesgos del Capítulo II Bis?", "a": "En un plazo no mayor a 12 meses a partir de que cuenten con los resultados de su implementación", "o": ["En un plazo no mayor a 12 meses a partir de que cuenten con los resultados de su implementación", "En un plazo no mayor a seis meses a partir de que cuenten con los resultados de su implementación", "Dentro de los primeros 60 días hábiles del año inmediato siguiente al de la implementación", "En un plazo no mayor a cinco años, que es el mismo de conservación de la información generada"], "x": "La 21ª-4 fija 12 meses, además de los supuestos de nuevos Riesgos o de actualización de la evaluación nacional de riesgos. El distractor de seis meses es el plazo del Cliente (25ª Bis), y el de cinco años es el de conservación de la información, no el de revisión. Fundamento: 21ª-4, 1er párr.", "ref": "21ª-4, 1er párr."}, {"id": "C036", "tema": "rel", "tipo": "trampa", "q": "¿Cuál de estas equivalencias de plazos NO es correcta?", "a": "La entrega anual de los resultados del uso del Modelo de Riesgos se hace dentro de los primeros 60 días naturales del año", "o": ["La entrega anual de los resultados del uso del Modelo de Riesgos se hace dentro de los primeros 60 días naturales del año", "El Grado de Riesgo del Cliente se evalúa al menos cada seis meses conforme a la 25ª Bis, con frecuencia mayor si el Grado también lo es", "La metodología de evaluación de Riesgos de la Entidad se revisa en un plazo no mayor a 12 meses", "El perfil transaccional del Cliente se evalúa al menos cada seis meses conforme a la 25ª Quáter"], "x": "Los 60 días de la entrega anual del Anexo 3 son hábiles, no naturales; las otras tres afirmaciones son correctas. Aquí se cruzan tres relojes distintos: seis meses para el Cliente, doce meses para la Entidad y 60 días hábiles para la entrega a la Comisión. Fundamento: Anexo 3, Seguimiento de uso.", "ref": "Anexo 3, Seguimiento de uso"}, {"id": "C037", "tema": "rel", "tipo": "trampa", "q": "¿Qué dice la 25ª Bis sobre la frecuencia de evaluación cuando la clasificación del Grado de Riesgo del Cliente es mayor?", "a": "La frecuencia deberá ser mayor", "o": ["La frecuencia deberá ser mayor", "La frecuencia podrá ser mayor, si así lo determina el Comité en el Manual de Cumplimiento", "La frecuencia se mantiene en seis meses en todos los casos, cualquiera que sea el Grado asignado", "La frecuencia deberá ser mensual tratándose de Clientes clasificados en el Grado de Riesgo alto"], "x": "El texto es imperativo: «La frecuencia de la evaluación deberá ser mayor cuando la clasificación del Grado de Riesgo también lo sea». No es facultativo, pero tampoco fija una periodicidad concreta: el distractor mensual inventa una cifra que la norma no tiene. Fundamento: 25ª Bis.", "ref": "25ª Bis"}, {"id": "C038", "tema": "rel", "tipo": "trampa", "q": "Respecto de la reevaluación del Grado de Riesgo de los Clientes, ¿cuál afirmación NO corresponde al sujeto obligado que se indica?", "a": "En Bancos deben realizarse al menos dos evaluaciones por año calendario sobre Clientes con contrato de al menos seis meses de antigüedad", "o": ["En Bancos deben realizarse al menos dos evaluaciones por año calendario sobre Clientes con contrato de al menos seis meses de antigüedad", "En Bancos la evaluación del Grado de Riesgo debe hacerse al menos cada seis meses", "En ITF la evaluación del Grado de Riesgo debe hacerse al menos cada seis meses", "En SOFOMES deben realizarse al menos dos evaluaciones por año calendario sobre Clientes con contrato de al menos seis meses de antigüedad"], "x": "La fórmula de las dos evaluaciones por año calendario sobre Clientes con seis meses de antigüedad de contrato es de SOFOMES, no de Bancos: en Bancos e ITF la regla es «al menos cada seis meses». Parecen lo mismo, pero una cuenta evaluaciones por año y la otra fija un intervalo máximo. Fundamento: 25ª Bis; DCG SOFOMES, 21ª; DCG ITF, art. 30.", "ref": "25ª Bis / SOFOMES 21ª"}, {"id": "C039", "tema": "rel", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre el momento de clasificar al Cliente NO es correcta?", "a": "La clasificación puede diferirse hasta que concluyan los seis primeros meses de la relación comercial", "o": ["La clasificación puede diferirse hasta que concluyan los seis primeros meses de la relación comercial", "La clasificación debe realizarse al inicio de la relación comercial", "La clasificación debe hacerse utilizando los sistemas automatizados a que se refiere la 51ª", "Durante los seis primeros meses se considera la información que el Cliente proporcionó en ese momento"], "x": "Los seis meses no son una prórroga: la clasificación se hace al inicio y lo que dura seis meses es el uso de la información declarada por el Cliente para sostener su Grado inicial. Las otras tres afirmaciones reproducen el texto de la 28ª y de la 25ª Bis. Fundamento: 28ª, 1er párr.; 25ª Bis, 3er párr.", "ref": "28ª, 1er párr."}, {"id": "C040", "tema": "rel", "tipo": "caso", "q": "Banco Ribera abre una cuenta al Sr. Arteaga y su política interna prevé asignarle Grado de Riesgo hasta la primera corrida semestral del Modelo. ¿Es válido?", "a": "No; debe clasificarlo al inicio de la relación comercial", "o": ["No; debe clasificarlo al inicio de la relación comercial", "Sí; la 25ª Bis concede seis meses para determinar el Grado de Riesgo inicial del Cliente nuevo", "Sí; siempre que el Cliente no realice transferencias internacionales durante ese periodo inicial", "No; debe clasificarlo dentro de los 60 días hábiles siguientes a la apertura de la cuenta respectiva"], "x": "La 28ª obliga a clasificar al inicio de la relación comercial; el Anexo 3 remata que por ningún motivo puede haber Clientes sin clasificar. El distractor de los 60 días hábiles usa un plazo que existe pero pertenece a la entrega anual a la Comisión de los resultados del uso del Modelo. Fundamento: 28ª, 1er párr.", "ref": "28ª, 1er párr."}, {"id": "C041", "tema": "rel", "tipo": "caso", "q": "Dos meses después de la última reevaluación semestral, Banco Ribera obtiene datos relevantes nuevos sobre una clienta. ¿Qué procede conforme al Anexo 3?", "a": "Revisar y, en su caso, reclasificarla de inmediato, sin esperar la siguiente evaluación periódica", "o": ["Revisar y, en su caso, reclasificarla de inmediato, sin esperar la siguiente evaluación periódica", "Registrar el dato en el expediente y esperar a la evaluación semestral siguiente para valorarlo", "Reclasificarla sólo si el dato nuevo proviene de los procesos de intercambio del Capítulo XIII", "Someter el dato al comité de riesgos para que autorice una evaluación fuera de calendario"], "x": "El Anexo 3 prevé expresamente que, cuando se obtengan nuevos datos relevantes sobre un Cliente, se debe revisar y en su caso reclasificarlo, al margen del calendario semestral. El distractor de esperar al semestre es el error práctico más común: el plazo de seis meses es un máximo, no un turno. Fundamento: Anexo 3, II.", "ref": "Anexo 3, II"}, {"id": "C042", "tema": "rel", "tipo": "caso", "q": "Al reevaluar, Banco Ribera decide subir a un Cliente de Grado de Riesgo bajo a uno intermedio superior. Conforme al Anexo 3, ¿qué debe ocurrir con la revisión de sus factores de Riesgo?", "a": "Debe intensificarse la revisión de los factores de Riesgo", "o": ["Debe intensificarse la revisión de los factores de Riesgo", "Debe mantenerse en los mismos términos, pues el Anexo 3 sólo diferencia entre Grado bajo y Grado alto", "Debe suspenderse hasta que el comité de riesgos ratifique el nuevo Grado de Riesgo asignado", "Debe sustituirse por la aplicación del cuestionario de identificación previsto en la 25ª Bis"], "x": "El Anexo 3 es claro: cuando el Grado de Riesgo asignado al Cliente incremente, hay que intensificar la revisión de los factores de Riesgo. El distractor del cuestionario es tentador porque también es una medida reforzada, pero éste se aplica a los Clientes catalogados de Grado de Riesgo alto y no sustituye la revisión de factores. Fundamento: Anexo 3, II.", "ref": "Anexo 3, II"}, {"id": "C043", "tema": "rel", "tipo": "caso", "q": "Banco Ribera reevalúa exactamente cada seis meses a todos sus Clientes, incluidos los de Grado de Riesgo alto. ¿Qué observación procede?", "a": "Los de mayor Grado deben reevaluarse con frecuencia mayor", "o": ["Los de mayor Grado deben reevaluarse con frecuencia mayor", "Ninguna; seis meses es el plazo aplicable por igual a todos los Clientes de la Entidad", "Los de mayor Grado deben reevaluarse cada tres meses, conforme al plazo que fija la 25ª Bis", "Los de mayor Grado deben reevaluarse cada vez que el sistema de alertas genere una alerta"], "x": "Los seis meses son un mínimo común; la 25ª Bis añade que la frecuencia deberá ser mayor cuando la clasificación del Grado de Riesgo también lo sea. El distractor de los tres meses inventa una cifra: la norma exige mayor frecuencia, pero deja a la Entidad fijarla en su Manual. Fundamento: 25ª Bis.", "ref": "25ª Bis"}, {"id": "C044", "tema": "rel", "tipo": "caso", "q": "Al abrir su contrato, un cliente declara que operará unos 40 000 pesos mensuales. Conforme a la 25ª Quáter, ¿para qué sirve esa declaración durante los primeros seis meses?", "a": "Para determinar su perfil transaccional inicial dentro del sistema de alertas", "o": ["Para determinar su perfil transaccional inicial dentro del sistema de alertas", "Para fijar el límite máximo de Operaciones que el Cliente podrá realizar durante ese periodo", "Para sustituir la clasificación por Grado de Riesgo durante los seis primeros meses de la relación", "Para eximir a la Entidad de generar alertas mientras el Cliente no exceda el monto declarado"], "x": "La información sobre las Operaciones que el Cliente estime realizar sirve para determinar su perfil transaccional inicial, que debe estar incluido en el sistema de alertas para detectar inconsistencias entre lo declarado y lo efectivamente operado. Los distractores convierten un insumo de monitoreo en un límite o en una exención, que la norma no prevé. Fundamento: 25ª Quáter, 3er párr.", "ref": "25ª Quáter, 3er párr."}, {"id": "C045", "tema": "rel", "tipo": "caso", "q": "Una clienta de Banco Ribera cambió su giro de comercio al menudeo a compraventa de metales, sin que hasta ahora se hayan modificado el volumen ni la frecuencia de sus Operaciones. ¿Qué criterio del Anexo 3 obliga a revisar y, en su caso, actualizar sus factores de Riesgo?", "a": "El cambio en la dimensión de características inherentes del Cliente", "o": ["El cambio en la dimensión de características inherentes del Cliente", "El cambio en la dimensión del perfil transaccional del Cliente de que se trate", "El cambio en la evaluación nacional de riesgos que la Secretaría dé a conocer", "El cambio en los Mitigantes que la Entidad tenga implementados al momento del diseño"], "x": "El giro o actividad es una característica inherente, así que su modificación cae en el primer criterio del Anexo 3, II, aunque el comportamiento transaccional todavía no cambie. El distractor del perfil transaccional se descarta porque el supuesto describe expresamente que el volumen y la frecuencia siguen igual: es el cambio de giro en sí lo que dispara la revisión. Fundamento: Anexo 3, II.", "ref": "Anexo 3, II"}, {"id": "C046", "tema": "rel", "tipo": "caso", "q": "El Oficial de Cumplimiento de Banco Ribera sostiene que, como la metodología de evaluación de Riesgos de la Entidad se revisa cada 12 meses, el Grado de Riesgo de los Clientes puede reevaluarse con esa misma periodicidad. ¿Es correcto?", "a": "No; el Grado de Riesgo del Cliente se evalúa al menos cada seis meses", "o": ["No; el Grado de Riesgo del Cliente se evalúa al menos cada seis meses", "Sí; ambos plazos se homologan cuando la Entidad así lo prevé en su Manual de Cumplimiento", "Sí; el plazo de 12 meses aplica a los Clientes de Grado de Riesgo bajo e intermedio únicamente", "No; el Grado de Riesgo del Cliente debe evaluarse dentro de los primeros 60 días hábiles del año"], "x": "Son dos obligaciones distintas, con objetos distintos: seis meses para el Grado de Riesgo del Cliente (25ª Bis y Anexo 3, II) y hasta 12 meses para revisar y actualizar la metodología de la Entidad (21ª-4). El distractor de los 60 días hábiles introduce un tercer plazo, el de la entrega anual del Anexo 3. Fundamento: 25ª Bis; 21ª-4.", "ref": "25ª Bis; 21ª-4"}, {"id": "C047", "tema": "rel", "tipo": "caso", "q": "Al reevaluar a sus Clientes, Banco Ribera quiere usar información obtenida mediante los procesos de intercambio de información del Capítulo XIII. ¿Qué establece la 25ª Bis?", "a": "Que las Entidades podrán considerarla como parte de la evaluación", "o": ["Que las Entidades podrán considerarla como parte de la evaluación", "Que las Entidades deberán considerarla en todas las evaluaciones semestrales que realicen", "Que las Entidades sólo podrán considerarla respecto de Clientes de Grado de Riesgo alto", "Que las Entidades deberán solicitar autorización de la Comisión antes de incorporarla al Modelo"], "x": "El verbo es «podrán»: es una facultad, no un deber, y no está acotada a un Grado de Riesgo en particular. El distractor del deber es el más tentador porque la reforma de 2022 quiso impulsar ese intercambio, pero no lo volvió obligatorio para este efecto. Fundamento: 25ª Bis, párr. reformado DOF 03-03-2022.", "ref": "25ª Bis, párr. de intercambio"}, {"id": "C048", "tema": "rel", "tipo": "memoria", "q": "Conforme a las DCG de Instituciones de Tecnología Financiera, ¿con qué periodicidad mínima debe evaluarse el Grado de Riesgo de los Clientes?", "a": "Al menos cada seis meses", "o": ["Al menos cada seis meses", "Al menos cada doce meses", "Al menos cada tres meses", "Al menos dos veces por año calendario"], "x": "Las DCG de ITF coinciden con Bancos en el intervalo de seis meses para reevaluar el Grado de Riesgo. Donde ITF sí se aparta de Bancos es en el número mínimo de clasificaciones (tres) y en incorporar la Infraestructura Tecnológica como elemento de Riesgo. Fundamento: DCG ITF, art. 30.", "ref": "DCG ITF, art. 30"}, {"id": "C049", "tema": "alt", "tipo": "memoria", "q": "Conforme a la 28ª, ¿cuáles son los Clientes que se consideran de Grado de Riesgo alto al menos por mandato de la norma?", "a": "Los no residentes asignados a banca privada, las PPE extranjeras y las personas morales que operen dólares en efectivo conforme a la 33ª Bis 1", "o": ["Los no residentes asignados a banca privada, las PPE extranjeras y las personas morales que operen dólares en efectivo conforme a la 33ª Bis 1", "Los no residentes asignados a banca privada, las PPE extranjeras y las PPE de nacionalidad mexicana en funciones", "Las PPE extranjeras, los Fideicomisos con fideicomitentes extranjeros y los Clientes que operen con jurisdicciones de la fracción X de la 38ª", "Los Clientes que abran su cuenta de forma no presencial, las PPE extranjeras y los Clientes con operaciones en efectivo en moneda nacional"], "x": "Son tres supuestos y el párrafo dice «al menos», de modo que el Modelo puede sumar otros. El distractor de las PPE mexicanas es el más tentador: respecto de ellas la 28ª no ordena clasificarlas como alto riesgo, sino desarrollar mecanismos para establecer el Grado de Riesgo de sus Operaciones. Fundamento: 28ª, 2º párr.", "ref": "28ª, 2º párr."}, {"id": "C050", "tema": "alt", "tipo": "memoria", "q": "Según la propia 28ª, ¿cómo se define la banca privada?", "a": "El servicio bancario preferencial con atención y asesoría personalizada, alto nivel de discreción y acceso a instrumentos financieros no disponibles para otros segmentos", "o": ["El servicio bancario preferencial con atención y asesoría personalizada, alto nivel de discreción y acceso a instrumentos financieros no disponibles para otros segmentos", "El servicio ofrecido exclusivamente a Clientes no residentes en el país por conducto de las sucursales, filiales o agencias que la propia Entidad tenga establecidas en el extranjero", "El segmento en que la Entidad agrupa a sus Clientes clasificados con Grado de Riesgo alto por su Modelo", "El servicio de corresponsalía que las Entidades prestan a contrapartes del extranjero previa aprobación directiva"], "x": "La 28ª define banca privada por sus tres rasgos: atención y asesoría personalizada, alto nivel de discreción y acceso a instrumentos no disponibles para Clientes con menor patrimonio. El distractor de los no residentes confunde la definición con el supuesto: lo que dispara el alto riesgo es la suma de no residencia y pertenencia a ese segmento. Fundamento: 28ª, 3er párr.", "ref": "28ª, 3er párr."}, {"id": "C051", "tema": "alt", "tipo": "memoria", "q": "Conforme a la definición de Persona Políticamente Expuesta, ¿a quién comprende?", "a": "A quien desempeña o ha desempeñado funciones públicas destacadas en un país extranjero o en territorio nacional", "o": ["A quien desempeña o ha desempeñado funciones públicas destacadas en un país extranjero o en territorio nacional", "Únicamente a quien desempeña funciones públicas destacadas en un país extranjero, por su mayor exposición", "Únicamente a quien desempeña funciones públicas destacadas en territorio nacional y a sus dependientes económicos", "A cualquier servidor público en activo, sin importar la jerarquía del encargo que desempeñe en la institución"], "x": "La definición abarca funciones públicas destacadas tanto en el extranjero como en territorio nacional: jefes de estado o de gobierno, líderes políticos, funcionarios gubernamentales, judiciales o militares de alta jerarquía, altos ejecutivos de empresas estatales y funcionarios o miembros importantes de partidos y organizaciones internacionales. Ser PPE no equivale a ser alto riesgo: eso se decide después, y sólo la PPE extranjera lo es por mandato. Fundamento: 2ª, fr. XXXI.", "ref": "2ª, fr. XXXI"}, {"id": "C052", "tema": "alt", "tipo": "memoria", "q": "¿Quiénes se asimilan a una Persona Políticamente Expuesta conforme a la definición de las Disposiciones?", "a": "El cónyuge, la concubina o concubinario, los parientes por consanguinidad o afinidad hasta el segundo grado y las personas morales con las que mantenga vínculos patrimoniales", "o": ["El cónyuge, la concubina o concubinario, los parientes por consanguinidad o afinidad hasta el segundo grado y las personas morales con las que mantenga vínculos patrimoniales", "Únicamente el cónyuge y los dependientes económicos declarados por la propia Persona Políticamente Expuesta", "El cónyuge, la concubina o concubinario, los parientes por consanguinidad o afinidad hasta el cuarto grado y los socios de cualquier sociedad que la propia Persona administre o represente", "Los apoderados legales y los representantes con facultades de disposición sobre las cuentas de la Persona"], "x": "El círculo asimilado llega hasta el segundo grado de consanguinidad o afinidad e incluye al cónyuge, concubina o concubinario y a las personas morales con vínculos patrimoniales. El distractor del cuarto grado es el más tentador porque ese grado aparece en otras materias jurídicas, pero no aquí. Fundamento: 2ª, fr. XXXI.", "ref": "2ª, fr. XXXI"}, {"id": "C053", "tema": "alt", "tipo": "memoria", "q": "Conforme a la 27ª, ¿qué se requiere antes de abrir cuentas o celebrar contratos con Clientes clasificados de Grado de Riesgo alto?", "a": "La aprobación por escrito, digital o electrónica, de al menos un directivo con facultades específicas", "o": ["La aprobación por escrito, digital o electrónica, de al menos un directivo con facultades específicas", "La aprobación verbal del Oficial de Cumplimiento, ratificada después por el Comité en su sesión ordinaria", "La aprobación del comité de riesgos de la Entidad, informada al consejo de administración o directivo", "El dictamen previo de un auditor independiente sobre el expediente de identificación del Cliente"], "x": "La 27ª exige aprobación previa, otorgada por escrito, de forma digital o electrónica, por al menos un directivo o equivalente con facultades específicas. El distractor del comité de riesgos es tentador porque ese órgano sí aparece en la 25ª Bis, pero ahí aprueba el Modelo, no la apertura de una cuenta. Fundamento: 27ª.", "ref": "27ª"}, {"id": "C054", "tema": "alt", "tipo": "memoria", "q": "¿Qué supuesto regula la 26ª de las DCG Bancos?", "a": "El del Cliente o pretenso Cliente que reúne los requisitos para ser PPE y además es de Grado de Riesgo alto", "o": ["El del Cliente o pretenso Cliente que reúne los requisitos para ser PPE y además es de Grado de Riesgo alto", "El de todo Cliente clasificado con Grado de Riesgo alto, con independencia de que sea o no PPE", "El de toda Persona Políticamente Expuesta, cualquiera que sea el Grado de Riesgo que le corresponda", "El de los Clientes no residentes asignados al segmento de banca privada dentro de la Entidad"], "x": "La 26ª exige que concurran dos condiciones: reunir los requisitos de PPE y además ser de Grado de Riesgo alto; entonces se requiere la aprobación de un directivo con facultades específicas para iniciar o continuar la relación. El distractor que extiende el supuesto a todo Cliente de Grado de Riesgo alto, sea o no PPE, describe la 27ª, que sí cubre a todo Cliente de alto riesgo pero sólo antes de la apertura. Fundamento: 26ª.", "ref": "26ª"}, {"id": "C055", "tema": "alt", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre las Personas Políticamente Expuestas NO es correcta?", "a": "Las PPE de nacionalidad mexicana deben ser clasificadas en el Grado de Riesgo alto por mandato de la 28ª", "o": ["Las PPE de nacionalidad mexicana deben ser clasificadas en el Grado de Riesgo alto por mandato de la 28ª", "Las PPE extranjeras se consideran Clientes de Grado de Riesgo alto por mandato de la 28ª", "Respecto de las PPE extranjeras las Entidades deberán obtener la documentación del Capítulo II sobre su entorno", "Respecto de las PPE de nacionalidad mexicana las Entidades deberán desarrollar mecanismos para establecer el Grado de Riesgo de sus Operaciones"], "x": "Sólo la PPE extranjera es alto riesgo por mandato. Para la PPE mexicana la 28ª ordena desarrollar mecanismos y determinar si su comportamiento transaccional corresponde razonablemente con sus funciones, nivel y responsabilidad: es una obligación de análisis, no una etiqueta automática. Fundamento: 28ª, 2º y último párrs.", "ref": "28ª, 2º y último párrs."}, {"id": "C056", "tema": "alt", "tipo": "trampa", "q": "Entre la 26ª y la 27ª, ¿cuál afirmación NO es correcta?", "a": "La 27ª alcanza también a la continuación de una relación comercial ya iniciada", "o": ["La 27ª alcanza también a la continuación de una relación comercial ya iniciada", "La 27ª exige la aprobación previamente a la apertura de cuentas o celebración de contratos", "La 26ª cubre el supuesto de quien reúne los requisitos de PPE y además es de Grado de Riesgo alto", "La 26ª permite que el supuesto se detecte previamente o con posterioridad al inicio de la relación comercial"], "x": "La 27ª es previa a la apertura; la que alcanza la continuación de una relación ya iniciada es la 26ª, porque prevé que el supuesto se detecte antes o después del inicio y habla de iniciar o continuar. Ésa es la diferencia fina entre ambas. Fundamento: 26ª y 27ª.", "ref": "26ª y 27ª"}, {"id": "C057", "tema": "alt", "tipo": "trampa", "q": "En las Operaciones de Clientes clasificados de Grado de Riesgo alto, ¿cuál de estas afirmaciones sobre los verbos de la 28ª NO es correcta?", "a": "Las Entidades deberán obtener, en todo caso, los datos del cónyuge y dependientes económicos del Cliente", "o": ["Las Entidades deberán obtener, en todo caso, los datos del cónyuge y dependientes económicos del Cliente", "Las Entidades adoptarán medidas para conocer el origen de los recursos", "Las Entidades procurarán obtener los datos del Capítulo II respecto del cónyuge y dependientes económicos", "Tratándose de PPE extranjeras, las Entidades deberán obtener además la documentación del Capítulo II"], "x": "Para el entorno del Cliente de alto riesgo el verbo es «procurarán», no «deberán obtener»; el deber reforzado de obtener documentación se reserva a las PPE extranjeras. El origen de los recursos tiene su propio verbo: las Entidades «adoptarán medidas» para conocerlo. Fundamento: 28ª, 4º párr.", "ref": "28ª, 4º párr."}, {"id": "C058", "tema": "alt", "tipo": "trampa", "q": "Sobre la excepción de recabar los datos de identificación del entorno prevista en la 28ª, ¿cuál afirmación NO es correcta?", "a": "Alcanza a cualquier subsidiaria de una emisora, cualquiera que sea el porcentaje de participación en su capital social", "o": ["Alcanza a cualquier subsidiaria de una emisora, cualquiera que sea el porcentaje de participación en su capital social", "Alcanza a las personas morales cuyos títulos representativos de su capital social coticen en alguna bolsa de valores del país", "Alcanza a las personas morales cuyos valores coticen en mercados de valores del exterior reconocidos como tales", "Se justifica porque esas personas morales están sujetas a disposiciones en materia bursátil sobre revelación de información"], "x": "La excepción sólo alcanza a las subsidiarias en las que la emisora tenga una participación mayoritaria al cincuenta por ciento de su capital social; borrar ese umbral es la trampa. El fundamento de la excepción es que esas personas morales ya están sujetas a revelación bursátil. Fundamento: 28ª, 5º párr.", "ref": "28ª, 5º párr."}, {"id": "C059", "tema": "alt", "tipo": "trampa", "q": "¿Cuál de los siguientes NO es un supuesto de Grado de Riesgo alto por mandato de la 28ª?", "a": "El Cliente que abre su cuenta de forma no presencial en términos de la 4ª Ter", "o": ["El Cliente que abre su cuenta de forma no presencial en términos de la 4ª Ter", "El Cliente no residente en el país asignado al segmento de banca privada o sector de negocios similar", "La Persona Políticamente Expuesta extranjera", "La persona moral que realice operaciones en efectivo con dólares de los Estados Unidos de América en términos de la 33ª Bis 1"], "x": "La apertura no presencial no convierte al Cliente en alto riesgo: lo que exige es considerar la Geolocalización del Dispositivo dentro del Modelo (25ª Bis). Los otros tres sí son los supuestos automáticos del segundo párrafo de la 28ª. Fundamento: 28ª, 2º párr.; 25ª Bis.", "ref": "28ª, 2º párr."}, {"id": "C060", "tema": "alt", "tipo": "cifra", "q": "¿Qué participación en el capital social debe tener una emisora en su subsidiaria para que opere la excepción de recabar datos de identificación prevista en la 28ª?", "a": "Mayoritaria al cincuenta por ciento", "o": ["Mayoritaria al cincuenta por ciento", "Al menos el veinticinco por ciento", "Al menos el setenta y cinco por ciento", "La totalidad del capital social"], "x": "El texto exige participación mayoritaria al cincuenta por ciento en el capital social de la subsidiaria. El veinticinco por ciento tienta porque es un umbral frecuente en materia de propietario real, pero aquí no aplica. Fundamento: 28ª, 5º párr.", "ref": "28ª, 5º párr."}, {"id": "C061", "tema": "alt", "tipo": "cifra", "q": "¿Hasta qué grado de consanguinidad o afinidad se asimila a una Persona Políticamente Expuesta a sus parientes?", "a": "Hasta el segundo grado", "o": ["Hasta el segundo grado", "Hasta el primer grado", "Hasta el tercer grado", "Hasta el cuarto grado"], "x": "La definición llega hasta el segundo grado de consanguinidad o afinidad, además del cónyuge, la concubina y el concubinario. El cuarto grado corresponde a otras materias jurídicas y es el distractor más socorrido del examen. Fundamento: 2ª, fr. XXXI.", "ref": "2ª, fr. XXXI"}, {"id": "C062", "tema": "alt", "tipo": "cifra", "q": "¿Durante cuánto tiempo se sigue considerando Persona Políticamente Expuesta nacional a quien dejó su encargo?", "a": "Durante el año siguiente a aquel en que dejó el encargo", "o": ["Durante el año siguiente a aquel en que dejó el encargo", "Durante los dos años siguientes a aquel en que dejó el encargo público correspondiente", "Durante los seis meses siguientes a aquel en que dejó el encargo público correspondiente", "De forma indefinida, pues la calidad de PPE no se pierde una vez concluido el encargo"], "x": "El plazo es de un año. Además, si dejó de serlo dentro del año inmediato anterior al inicio de una nueva relación comercial, la Entidad deberá catalogarla como PPE durante el año siguiente a aquel en que se abrió la cuenta o se celebró el contrato. Fundamento: 2ª, fr. XXXI.", "ref": "2ª, fr. XXXI"}, {"id": "C063", "tema": "alt", "tipo": "cifra", "q": "Para que una persona moral pueda recibir dólares en efectivo sin límite conforme a la 33ª Bis 1, ¿con cuánta anterioridad debe estar constituida?", "a": "Al menos tres años", "o": ["Al menos tres años", "Al menos un año", "Al menos cinco años", "Al menos dos años"], "x": "El requisito es de al menos tres años de constitución. Los dos años tientan porque esa cifra también aparece en el mismo supuesto, pero referida a los estados financieros de los últimos dos ejercicios fiscales y a las dos últimas declaraciones anuales presentadas al SAT. Fundamento: 33ª Bis 1, fr. I.", "ref": "33ª Bis 1, fr. I"}, {"id": "C064", "tema": "alt", "tipo": "caso", "q": "El Sr. Arteaga fue viceministro de energía de un país sudamericano y pretende abrir una cuenta en Banco Ribera. ¿Qué tratamiento le corresponde?", "a": "Es Cliente de Grado de Riesgo alto y la Entidad deberá obtener la documentación del Capítulo II sobre su entorno", "o": ["Es Cliente de Grado de Riesgo alto y la Entidad deberá obtener la documentación del Capítulo II sobre su entorno", "Es Cliente de Grado de Riesgo alto y la Entidad solamente procurará obtener los datos del Capítulo II sobre su entorno", "Es Cliente de Grado de Riesgo intermedio mientras el Modelo de Riesgos no arroje un resultado distinto", "La Entidad deberá desarrollar mecanismos para establecer el Grado de Riesgo de sus Operaciones, sin clasificarlo de antemano"], "x": "Como PPE extranjera es de Grado de Riesgo alto por mandato y, además de los datos, la Entidad deberá obtener la documentación del Capítulo II respecto de cónyuge, dependientes económicos y vínculos patrimoniales. El distractor del «procurarán» es el régimen general del alto riesgo; el del «desarrollar mecanismos» es el de la PPE mexicana. Fundamento: 28ª, 2º y 4º párrs.", "ref": "28ª, 2º y 4º párrs."}, {"id": "C065", "tema": "alt", "tipo": "caso", "q": "La Lic. Zavaleta es titular de una dirección general en una dependencia federal mexicana y ya es Cliente de Banco Ribera. ¿Qué obligación surge para la Entidad conforme a la 28ª?", "a": "Desarrollar mecanismos para establecer el Grado de Riesgo de sus Operaciones", "o": ["Desarrollar mecanismos para establecer el Grado de Riesgo de sus Operaciones", "Clasificarla de inmediato en el Grado de Riesgo alto por ser Persona Políticamente Expuesta", "Terminar la relación comercial salvo aprobación expresa del consejo de administración de la Entidad", "Aplicarle el régimen de corresponsalía y obtener la certificación de un auditor independiente"], "x": "Tratándose de PPE de nacionalidad mexicana, la 28ª manda desarrollar mecanismos para establecer el Grado de Riesgo de sus Operaciones y determinar si su comportamiento transaccional corresponde razonablemente con sus funciones, nivel y responsabilidad. El alto riesgo automático es el trato de la PPE extranjera, no el suyo. Fundamento: 28ª, último párr.", "ref": "28ª, último párr."}, {"id": "C066", "tema": "alt", "tipo": "caso", "q": "Banco Ribera asigna a un Cliente no residente al segmento de banca privada. Además de clasificarlo en Grado de Riesgo alto, ¿qué información debe recabar?", "a": "La que permita conocer y asentar las razones por las que eligió abrir una cuenta en territorio nacional", "o": ["La que permita conocer y asentar las razones por las que eligió abrir una cuenta en territorio nacional", "La certificación de un auditor independiente sobre el cumplimiento de obligaciones similares en su jurisdicción", "El dictamen del área de auditoría interna sobre la idoneidad del Grado de Riesgo que le fue asignado", "La documentación que acredite que sus recursos provienen de una jurisdicción distinta de las de la fracción X de la 38ª"], "x": "La 28ª exige recabar la información que permita conocer y asentar las razones por las que el Cliente eligió abrir una cuenta en territorio nacional. El distractor de la certificación del auditor independiente pertenece a la corresponsalía con contrapartes del extranjero, que es otra figura. Fundamento: 28ª, 2º párr.", "ref": "28ª, 2º párr."}, {"id": "C067", "tema": "alt", "tipo": "caso", "q": "Una sociedad mercantil Cliente de Banco Ribera realiza operaciones en efectivo con dólares de los Estados Unidos de América en términos de la 33ª Bis 1. ¿Cómo debe clasificarla la Entidad?", "a": "En Grado de Riesgo alto, por mandato de la 28ª", "o": ["En Grado de Riesgo alto, por mandato de la 28ª", "En el Grado de Riesgo que arroje el Modelo, sin que la operación en dólares incida en la clasificación", "En Grado de Riesgo intermedio, con reevaluación trimestral del perfil transaccional del Cliente", "En el Grado de Riesgo que determine el Oficial de Cumplimiento mediante invalidación documentada"], "x": "El segundo párrafo de la 28ª incluye expresamente a las personas morales que realicen operaciones en efectivo con dólares en términos de la 33ª Bis 1 entre los Clientes de Grado de Riesgo alto. El distractor de la invalidación existe en el Anexo 3, pero sirve para dejar sin efecto el resultado del Modelo, no para desactivar un supuesto legal. Fundamento: 28ª, 2º párr.", "ref": "28ª, 2º párr."}, {"id": "C068", "tema": "alt", "tipo": "caso", "q": "Banco Ribera abrió una cuenta a un Cliente clasificado de Grado de Riesgo alto y sometió la aprobación del directivo facultado tres semanas después de la apertura. ¿Qué incumplió?", "a": "La aprobación debe otorgarse previamente a la apertura", "o": ["La aprobación debe otorgarse previamente a la apertura", "La aprobación debía otorgarla el comité de riesgos y no un directivo con facultades específicas", "La aprobación debía constar en instrumento notarial y no por escrito, de forma digital o electrónica", "La aprobación debía recabarse dentro de los seis meses siguientes al inicio de la relación comercial"], "x": "La 27ª exige que la aprobación de al menos un directivo con facultades específicas sea previa a la apertura o celebración del contrato. La forma sí es flexible —por escrito, digital o electrónica—, de modo que el vicio no está en el soporte sino en la oportunidad. Fundamento: 27ª.", "ref": "27ª"}, {"id": "C069", "tema": "alt", "tipo": "caso", "q": "Dos años después de iniciada la relación, Banco Ribera detecta que un Cliente reúne los requisitos de PPE y, además, su Modelo lo clasifica de Grado de Riesgo alto. ¿Qué procede?", "a": "Obtener la aprobación de un directivo con facultades específicas para continuar la relación comercial", "o": ["Obtener la aprobación de un directivo con facultades específicas para continuar la relación comercial", "Nada adicional, pues la aprobación de la 27ª sólo opera previamente a la apertura de la cuenta", "Terminar la relación comercial dentro de los seis meses siguientes a la detección del supuesto", "Informar el hecho a la Comisión dentro de los primeros 60 días hábiles del año inmediato siguiente"], "x": "La 26ª cubre precisamente este supuesto: PPE más Grado de Riesgo alto, detectado previamente o con posterioridad al inicio de la relación, con aprobación directiva para iniciar o continuar. El distractor que invoca la 27ª es el error clásico: esa disposición sólo mira hacia la apertura. Fundamento: 26ª.", "ref": "26ª"}, {"id": "C070", "tema": "alt", "tipo": "caso", "q": "Un Cliente persona moral de Banco Ribera, clasificado de Grado de Riesgo alto, tiene sus acciones cotizando en una bolsa de valores del país. ¿Qué consecuencia tiene esto conforme a la 28ª?", "a": "La Entidad no está obligada a recabar los datos de identificación de sus principales accionistas o socios", "o": ["La Entidad no está obligada a recabar los datos de identificación de sus principales accionistas o socios", "La Entidad queda relevada de clasificarlo por Grado de Riesgo mientras mantenga esa cotización", "La Entidad queda relevada de recabar la aprobación directiva previa a la apertura de la cuenta", "La Entidad queda relevada de adoptar medidas para conocer el origen de los recursos del Cliente"], "x": "La excepción es puntual: no recabar los datos de identificación del entorno, porque esas personas morales están sujetas a revelación bursátil. No exime de clasificar, ni de la aprobación de la 27ª, ni del deber de adoptar medidas para conocer el origen de los recursos. Fundamento: 28ª, 5º párr.", "ref": "28ª, 5º párr."}, {"id": "C071", "tema": "alt", "tipo": "caso", "q": "Una sociedad Cliente de Banco Ribera es subsidiaria de una emisora que cotiza en bolsa, con una participación del 45 % en su capital social. ¿Aplica la excepción de la 28ª?", "a": "No; se requiere participación mayoritaria al cincuenta por ciento", "o": ["No; se requiere participación mayoritaria al cincuenta por ciento", "Sí; basta con que la controladora sea una emisora inscrita en alguna bolsa de valores del país", "Sí; siempre que la subsidiaria haya sido clasificada en un Grado de Riesgo distinto del alto", "No; la excepción únicamente alcanza a la emisora y nunca a ninguna de sus sociedades subsidiarias"], "x": "La excepción exige que la emisora tenga participación mayoritaria al cincuenta por ciento en el capital social de la subsidiaria; con 45 % no se cumple. El distractor que niega que la excepción alcance alguna vez a las subsidiarias exagera en sentido contrario: las subsidiarias sí están comprendidas, pero sólo con ese umbral. Fundamento: 28ª, 5º párr.", "ref": "28ª, 5º párr."}, {"id": "C072", "tema": "alt", "tipo": "caso", "q": "Banco Ribera quiere aplicar por medios digitales los cuestionarios de identificación a sus Clientes de Grado de Riesgo alto. ¿Es posible?", "a": "Sí, siempre que contengan el consentimiento de la 4ª Ter de quien los suscribe", "o": ["Sí, siempre que contengan el consentimiento de la 4ª Ter de quien los suscribe", "No; los cuestionarios de identificación deben aplicarse invariablemente de forma presencial en sucursal", "Sí, sin requisito adicional, pues la norma no distingue el medio por el que se apliquen", "Sólo respecto de Clientes nuevos, nunca respecto de quienes ya tenían la relación comercial iniciada"], "x": "La 25ª Bis permite que los cuestionarios se realicen vía no presencial, por medios digitales o electrónicos, pero exige en todo caso el consentimiento de la 4ª Ter. El distractor «sin requisito adicional» borra justamente esa condición. Además, los cuestionarios se aplican tanto a Clientes ya catalogados de alto riesgo como a los nuevos que reúnan tal carácter. Fundamento: 25ª Bis, párrs. de cuestionarios.", "ref": "25ª Bis, párrs. de cuestionarios"}, {"id": "C073", "tema": "alt", "tipo": "caso", "q": "En las Operaciones de un Cliente clasificado de Grado de Riesgo alto, ¿qué verbo emplea la 28ª respecto del origen de los recursos?", "a": "Las Entidades adoptarán medidas para conocerlo", "o": ["Las Entidades adoptarán medidas para conocerlo", "Las Entidades procurarán conocerlo, en los términos que prevean en su Manual de Cumplimiento", "Las Entidades podrán conocerlo cuando el sistema de alertas genere una alerta sobre la Operación", "Las Entidades acreditarán documentalmente su licitud ante la Comisión dentro del plazo que ésta establezca"], "x": "Respecto del origen de los recursos el verbo es firme: las Entidades «adoptarán medidas» para conocerlo. El «procurarán» de la misma disposición se refiere a otra cosa: a los datos del entorno del Cliente —cónyuge, dependientes económicos, vínculos patrimoniales—. Fundamento: 28ª, 4º párr.", "ref": "28ª, 4º párr."}, {"id": "C074", "tema": "alt", "tipo": "caso", "q": "Un Fideicomiso Cliente de Banco Ribera fue clasificado de Grado de Riesgo alto. Conforme a la 28ª, ¿respecto de quiénes procurará la Entidad recabar los datos del entorno?", "a": "Del cónyuge y dependientes económicos de los fideicomitentes y fideicomisarios personas físicas y de las sociedades con las que mantengan vínculos patrimoniales", "o": ["Del cónyuge y dependientes económicos de los fideicomitentes y fideicomisarios personas físicas y de las sociedades con las que mantengan vínculos patrimoniales", "Únicamente del fiduciario y de los miembros del comité técnico del Fideicomiso, por ser quienes administran el patrimonio fideicomitido y giran las instrucciones sobre los recursos", "Únicamente de los fideicomisarios, por ser los destinatarios finales de los recursos fideicomitidos", "De los delegados fiduciarios y del personal de la Entidad que participó en la celebración del contrato"], "x": "En Fideicomisos el círculo es el de fideicomitentes y fideicomisarios: cónyuge y dependientes económicos de los que sean personas físicas, sociedades con vínculos patrimoniales y, si son personas morales, su estructura corporativa y principales accionistas o socios. El verbo sigue siendo «procurarán». Fundamento: 28ª, 4º párr.", "ref": "28ª, 4º párr."}, {"id": "C075", "tema": "alt", "tipo": "caso", "q": "Banco Ribera no tiene previsto en su Manual ningún mecanismo para que su Oficial de Cumplimiento conozca a los Clientes clasificados de Grado de Riesgo alto. ¿Qué disposición incumple?", "a": "La 27ª, que obliga a prever esos mecanismos en el Manual de Cumplimiento", "o": ["La 27ª, que obliga a prever esos mecanismos en el Manual de Cumplimiento", "La 26ª, que obliga a informar al Oficial de Cumplimiento de toda relación con Personas Políticamente Expuestas", "La 25ª Quáter, que obliga a que el sistema de alertas notifique al Oficial cada cambio de Grado de Riesgo", "El Anexo 3, que obliga a que el Oficial de Cumplimiento apruebe personalmente cada invalidación registrada"], "x": "La 27ª manda prever en el Manual los mecanismos para que el Oficial de Cumplimiento conozca a los Clientes de alto riesgo y los procedimientos para tramitar la aprobación directiva, en relación con las fracciones IV y V de la 47ª. El distractor del Anexo 3 confunde funciones: la bitácora de invalidaciones identifica al responsable de aprobarlas, que no necesariamente es el Oficial. Fundamento: 27ª.", "ref": "27ª"}, {"id": "C076", "tema": "alt", "tipo": "caso", "q": "Una persona dejó un encargo público federal mexicano hace ocho meses y hoy celebra un contrato con Banco Ribera. ¿Qué debe hacer la Entidad?", "a": "Catalogarla como PPE durante el año siguiente a aquel en que se celebró el contrato", "o": ["Catalogarla como PPE durante el año siguiente a aquel en que se celebró el contrato", "Catalogarla como PPE únicamente durante los cuatro meses que restan del año posterior a su separación", "Abstenerse de catalogarla como PPE, pues ya no desempeña funciones públicas destacadas al contratar", "Catalogarla como PPE extranjera y clasificarla de inmediato en el Grado de Riesgo alto por mandato"], "x": "Cuando la persona dejó de ser PPE dentro del año inmediato anterior al inicio de la relación, la Entidad deberá catalogarla como tal durante el año siguiente a aquel en que se abrió la cuenta o se celebró el contrato: el reloj se reinicia con la contratación. Y es PPE nacional, no extranjera, así que no hay alto riesgo automático. Fundamento: 2ª, fr. XXXI.", "ref": "2ª, fr. XXXI"}, {"id": "C077", "tema": "sos", "tipo": "memoria", "q": "¿Quién debe llevar a cabo el proceso de validación interna del Modelo de Riesgos?", "a": "Un área independiente de aquella que desarrolló el Modelo", "o": ["Un área independiente de aquella que desarrolló el Modelo", "La misma área que desarrolló el Modelo, por ser la que conoce sus supuestos y su calibración", "El comité de riesgos de la Entidad, con base en la propuesta que al efecto formule su Comité", "La Comisión, dentro del plazo que ella misma establezca a partir del requerimiento respectivo"], "x": "El Anexo 3 exige asegurar que la validación interna la realice un área independiente de la que desarrolló el Modelo. El distractor del comité de riesgos es tentador porque ese órgano sí aparece en la 25ª Bis, pero ahí aprueba el Modelo; aprobar y validar son funciones distintas. Fundamento: Anexo 3, III, a).", "ref": "Anexo 3, III, a)"}, {"id": "C078", "tema": "sos", "tipo": "memoria", "q": "Si la Entidad se apoya en auditores externos o consultores para validar su Modelo de Riesgos, ¿qué ocurre con su responsabilidad?", "a": "Es indelegable", "o": ["Es indelegable", "Se transfiere al auditor externo o consultor que suscriba el informe de validación correspondiente", "Se comparte proporcionalmente entre la Entidad y el tercero que haya realizado la validación", "Se suspende mientras esté vigente el contrato de prestación de servicios con el tercero validador"], "x": "El Anexo 3 permite apoyarse en auditores externos o consultores «en el entendido de que su responsabilidad es indelegable». Contratar a un tercero reparte el trabajo, nunca la responsabilidad. Fundamento: Anexo 3, III, a).", "ref": "Anexo 3, III, a)"}, {"id": "C079", "tema": "sos", "tipo": "memoria", "q": "Dentro de la validación del Modelo de Riesgos, ¿qué debe compararse por lo menos anualmente?", "a": "Los criterios de clasificación considerados para establecer los Grados de Riesgo, demostrando que están dentro de los rangos esperados", "o": ["Los criterios de clasificación considerados para establecer los Grados de Riesgo, demostrando que están dentro de los rangos esperados", "El número de Clientes clasificados en cada Grado de Riesgo contra el promedio del sistema bancario que la Comisión difunda por los medios electrónicos que establezca", "Los resultados del Modelo contra los de la evaluación nacional de riesgos que difunda la Secretaría", "El inventario de invalidaciones aprobadas contra el número de alertas generadas en el mismo periodo"], "x": "El Anexo 3 exige comparar por lo menos anualmente los criterios de clasificación y demostrar que se encuentran dentro de los rangos esperados, documentando métodos y datos utilizados. Los distractores proponen comparaciones plausibles pero que la norma no ordena. Fundamento: Anexo 3, III, c).", "ref": "Anexo 3, III, c)"}, {"id": "C080", "tema": "sos", "tipo": "memoria", "q": "¿Qué exige el Anexo 3 respecto de la revisión humana de la clasificación basada en los Modelos de Riesgos?", "a": "Procedimientos de revisión humana y directrices por escrito sobre cómo se combinan el criterio humano y el resultado del Modelo", "o": ["Procedimientos de revisión humana y directrices por escrito sobre cómo se combinan el criterio humano y el resultado del Modelo", "Que el resultado del Modelo de Riesgos prevalezca siempre sobre el criterio humano del personal facultado, salvo invalidación aprobada y registrada en la bitácora", "Que el criterio humano prevalezca siempre sobre el resultado que arroje el Modelo de Riesgos", "Que toda revisión humana sea aprobada previamente por el consejo de administración o directivo"], "x": "La norma no jerarquiza: exige procedimientos de revisión humana que tomen en cuenta información relevante no contemplada en el Modelo, y directrices por escrito que describan de qué modo habrán de combinarse el criterio humano y el resultado del Modelo. Los distractores de prevalencia inventan una regla de jerarquía inexistente. Fundamento: Anexo 3, II.", "ref": "Anexo 3, II"}, {"id": "C081", "tema": "sos", "tipo": "memoria", "q": "¿Qué debe conservar la Entidad respecto de la clasificación de sus Clientes?", "a": "El historial de clasificación, incluidas las primeras clasificaciones asignadas y las fechas de las nuevas", "o": ["El historial de clasificación, incluidas las primeras clasificaciones asignadas y las fechas de las nuevas", "Únicamente el Grado de Riesgo vigente de cada Cliente y la fecha de su última actualización", "Únicamente el historial de los Clientes que hayan sido clasificados en el Grado de Riesgo alto", "Únicamente las clasificaciones que hayan sido objeto de invalidación por el personal facultado"], "x": "El Anexo 3 obliga a conservar el historial completo de clasificación, incluyendo los Grados asignados por primera vez y las fechas en que se realizaron las nuevas clasificaciones. Quedarse con la foto vigente es el error práctico más común: la norma quiere la película. Fundamento: Anexo 3, II.", "ref": "Anexo 3, II"}, {"id": "C082", "tema": "sos", "tipo": "memoria", "q": "¿Cuál de los siguientes elementos debe incluir la documentación del Modelo de Riesgos conforme al Anexo 3?", "a": "La definición de lo que constituye una invalidación y el personal autorizado a aprobarla", "o": ["La definición de lo que constituye una invalidación y el personal autorizado a aprobarla", "El listado nominativo de los Clientes clasificados en cada uno de los Grados de Riesgo establecidos", "La opinión favorable del auditor externo sobre el desempeño del Modelo en el ejercicio anterior", "El acta de la sesión del consejo de administración en que se aprobó el Manual de Cumplimiento"], "x": "La documentación debe incluir los criterios de clasificación y su capacidad de diferenciar el Riesgo, las responsabilidades de las áreas, la definición de invalidación, el personal autorizado a aprobarla, la frecuencia de las revisiones y la vigilancia del proceso por parte del Comité. El listado nominativo de Clientes no es un requisito de documentación del Modelo. Fundamento: Anexo 3, III, Documentación.", "ref": "Anexo 3, Documentación"}, {"id": "C083", "tema": "sos", "tipo": "memoria", "q": "¿Qué debe entregar anualmente la Entidad a la Comisión sobre los resultados del uso del Modelo de Riesgos?", "a": "Cédulas de clasificación, informe de cambios al Modelo y conclusiones sobre su desempeño", "o": ["Cédulas de clasificación, informe de cambios al Modelo y conclusiones sobre su desempeño", "El padrón de Clientes clasificados de Grado de Riesgo alto y las aprobaciones directivas otorgadas", "El Manual de Cumplimiento actualizado y el acta del comité de riesgos que aprobó el Modelo", "El dictamen del auditor externo y la bitácora de invalidaciones registradas durante el ejercicio"], "x": "Son tres documentos: cédulas de clasificación con la descripción de los criterios asignados a cada Grado, informe de cualquier cambio al Modelo en factores o criterios, y las conclusiones de la Entidad sobre el desempeño del Modelo. El distractor de la bitácora es tentador porque sí existe, pero se conserva internamente y no forma parte de esta entrega. Fundamento: Anexo 3, Seguimiento de uso.", "ref": "Anexo 3, Seguimiento de uso"}, {"id": "C084", "tema": "sos", "tipo": "cifra", "q": "¿Dentro de qué plazo debe entregarse anualmente a la Comisión la documentación sobre los resultados del uso del Modelo de Riesgos?", "a": "Dentro de los primeros 60 días hábiles del año", "o": ["Dentro de los primeros 60 días hábiles del año", "Dentro de los primeros 60 días naturales del año que corresponda a la entrega respectiva", "Dentro de los primeros 30 días hábiles del año que corresponda a la entrega respectiva", "Dentro de los seis primeros meses del año que corresponda a la entrega respectiva"], "x": "El Anexo 3 dice «en los primeros 60 días hábiles del año». La distinción entre hábiles y naturales es exactamente lo que se pregunta en el examen, y el distractor de los seis meses cruza este plazo con el de reevaluación del Cliente. Fundamento: Anexo 3, Seguimiento de uso.", "ref": "Anexo 3, Seguimiento de uso"}, {"id": "C085", "tema": "sos", "tipo": "cifra", "q": "¿Con qué frecuencia mínima deben compararse los criterios de clasificación dentro del proceso de validación del Modelo de Riesgos?", "a": "Por lo menos anualmente", "o": ["Por lo menos anualmente", "Por lo menos cada seis meses", "Por lo menos cada dos años", "Por lo menos cada 60 días hábiles"], "x": "El Anexo 3 fija una comparación por lo menos anual de los criterios de clasificación. El distractor de los seis meses es el plazo de reevaluación del Cliente, que es otra obligación: una mira al Cliente, la otra al Modelo. Fundamento: Anexo 3, III, c).", "ref": "Anexo 3, III, c)"}, {"id": "C086", "tema": "sos", "tipo": "trampa", "q": "Sobre los plazos de sostén del Modelo de Riesgos, ¿cuál afirmación NO es correcta?", "a": "La comparación de los criterios de clasificación debe realizarse por lo menos cada seis meses", "o": ["La comparación de los criterios de clasificación debe realizarse por lo menos cada seis meses", "La entrega anual a la Comisión se hace dentro de los primeros 60 días hábiles del año", "Los criterios y procedimientos de clasificación deben examinarse periódicamente para garantizar su vigencia", "La verificación de los procesos operativos para la medición del Riesgo debe ser continua"], "x": "La comparación de criterios es por lo menos anual, no semestral: los seis meses corresponden a la reevaluación del Cliente. Las otras tres afirmaciones reproducen el Anexo 3: 60 días hábiles para la entrega, examen periódico de criterios y verificación continua de los procesos operativos. Fundamento: Anexo 3, III.", "ref": "Anexo 3, III"}, {"id": "C087", "tema": "sos", "tipo": "caso", "q": "En Banco Ribera, el mismo equipo que construyó el Modelo de Riesgos firma cada año el informe de validación interna. ¿Qué observación procede?", "a": "La validación interna debe llevarla a cabo un área independiente de la que desarrolló el Modelo", "o": ["La validación interna debe llevarla a cabo un área independiente de la que desarrolló el Modelo", "Ninguna; el Anexo 3 sólo exige que el informe de validación se presente por lo menos anualmente", "La validación interna debe encargarse necesariamente a un auditor externo ajeno a la Entidad", "La validación interna debe ser aprobada por el consejo de administración antes de su presentación"], "x": "El Anexo 3 exige independencia entre quien desarrolla y quien valida. El distractor del auditor externo obligatorio se pasa de la raya: apoyarse en auditores externos o consultores es una posibilidad, no un deber, y en todo caso la responsabilidad de la Entidad es indelegable. Fundamento: Anexo 3, III, a).", "ref": "Anexo 3, III, a)"}, {"id": "C088", "tema": "sos", "tipo": "caso", "q": "Banco Ribera contrata a una consultoría para validar su Modelo de Riesgos y sostiene que, con ello, la responsabilidad del ejercicio quedó a cargo del proveedor. ¿Es correcto?", "a": "No; la responsabilidad de la Entidad es indelegable", "o": ["No; la responsabilidad de la Entidad es indelegable", "Sí; el Anexo 3 permite trasladar la responsabilidad cuando la validación la realiza un tercero especializado", "Sí; siempre que el contrato con el proveedor se registre ante el comité de riesgos de la Entidad", "No; porque el Anexo 3 prohíbe que la validación la realicen auditores externos o consultores externos"], "x": "La Entidad puede apoyarse en auditores externos o consultores, pero el Anexo 3 precisa que su responsabilidad es indelegable. El distractor que afirma que el Anexo 3 prohíbe que auditores externos o consultores realicen la validación invierte la regla: no hay prohibición de usar terceros, sólo prohibición de desentenderse. Fundamento: Anexo 3, III, a).", "ref": "Anexo 3, III, a)"}, {"id": "C089", "tema": "sos", "tipo": "caso", "q": "El área de cumplimiento de Banco Ribera programa la entrega anual de los resultados del uso del Modelo contando 60 días naturales desde el 1 de enero. ¿Qué error comete?", "a": "El plazo se cuenta en días hábiles, no naturales", "o": ["El plazo se cuenta en días hábiles, no naturales", "El plazo se cuenta desde la fecha de aprobación del Modelo por el comité de riesgos de la Entidad", "El plazo no es de 60 días sino de seis meses contados a partir del inicio del año que corresponda", "El plazo lo fija la Comisión en cada requerimiento y no está previsto en el Anexo 3 de las Disposiciones"], "x": "El Anexo 3 habla de los primeros 60 días hábiles del año, lo que estira el calendario bastante más allá de los 60 naturales. El distractor del plazo fijado por la Comisión confunde esta entrega anual con el documento que acredita el cumplimiento del Anexo 3, que sí se entrega a requerimiento y en el plazo que la Comisión establezca (25ª Bis). Fundamento: Anexo 3, Seguimiento de uso.", "ref": "Anexo 3, Seguimiento de uso"}, {"id": "C090", "tema": "sos", "tipo": "caso", "q": "Un supervisor pide a Banco Ribera reproducir la clasificación de una muestra de Clientes y el banco responde que sus criterios son confidenciales y sólo comprensibles para su área de modelos. ¿Qué estándar del Anexo 3 incumple?", "a": "La documentación debe permitir la réplica por un tercero", "o": ["La documentación debe permitir la réplica por un tercero", "La documentación debe ser aprobada por el comité de riesgos antes de entregarse a la autoridad", "La documentación debe limitarse a los Clientes clasificados en el Grado de Riesgo alto", "La documentación debe conservarse por un plazo no menor a cinco años contados desde su elaboración"], "x": "El Anexo 3 exige que los criterios tengan claridad y detalle suficientes para que un tercero comprenda el proceso, reproduzca la clasificación y evalúe su idoneidad, y que la documentación sobre criterios y mitigantes permita esa réplica. El distractor de los cinco años es un plazo real, pero de conservación de la información del Capítulo II Bis. Fundamento: Anexo 3, I.iii, a) y Documentación.", "ref": "Anexo 3, Documentación"}, {"id": "C091", "tema": "sos", "tipo": "caso", "q": "Banco Ribera emplea un modelo estadístico para medir el Riesgo de sus Clientes. ¿Qué debe incluir adicionalmente en su documentación?", "a": "Un proceso estadístico riguroso que compruebe la bondad de ajuste, con validaciones fuera de la muestra y fuera del periodo de muestra", "o": ["Un proceso estadístico riguroso que compruebe la bondad de ajuste, con validaciones fuera de la muestra y fuera del periodo de muestra", "La autorización previa de la Comisión para emplear métodos estadísticos en la medición del Riesgo", "El dictamen de un actuario independiente sobre la suficiencia y representatividad de la muestra utilizada en el desarrollo del modelo estadístico de que se trate", "La obligación de sustituir el criterio experto por el resultado que arroje el modelo estadístico empleado"], "x": "Para modelos estadísticos el Anexo 3 exige documentar la teoría, supuestos y bases matemáticas y empíricas, las fuentes de datos, un proceso estadístico riguroso de bondad de ajuste con validaciones fuera de muestra y fuera de periodo, y el análisis de las circunstancias que impidan su funcionamiento eficaz. No existe autorización previa de la Comisión para usarlos. Fundamento: Anexo 3, Documentación, b).", "ref": "Anexo 3, Documentación, b)"}, {"id": "C092", "tema": "sos", "tipo": "caso", "q": "Banco Ribera adquirió de un proveedor un Modelo de Riesgos que opera con tecnología propia y alega que por ello no puede documentar su metodología. ¿Qué establece el Anexo 3?", "a": "El uso de un modelo adquirido de un tercero no justifica la exención de documentar", "o": ["El uso de un modelo adquirido de un tercero no justifica la exención de documentar", "La Entidad queda eximida de documentar cuando el proveedor acredite la confidencialidad de su tecnología", "La Entidad puede sustituir la documentación por la certificación que expida el proveedor del modelo", "La Entidad puede diferir la documentación hasta la primera validación anual del modelo adquirido"], "x": "El Anexo 3 cierra esa puerta: el uso de un modelo adquirido de un tercero, que opere con tecnología propia, no justifica la exención del cumplimiento de la documentación ni de los demás requisitos. La confidencialidad del proveedor es un problema contractual de la Entidad, no una excusa regulatoria. Fundamento: Anexo 3, Documentación.", "ref": "Anexo 3, Documentación"}], "sitio": {"nombre": "Módulo 3", "raiz": "../", "actual": "3-3-2-grado-riesgo", "paginas": [{"n": "3.1.1", "carpeta": "3-1-1-auditoria", "pregunta": "Informe de auditoría", "estado": "integrada"}, {"n": "3.1.2", "carpeta": "3-1-2-supervision", "pregunta": "Supervisión CNBV", "estado": "integrada"}, {"n": "3.2.1", "carpeta": "3-2-1-gafi", "pregunta": "Guía GAFI del EBR", "estado": "integrada"}, {"n": "3.2.2", "carpeta": "3-2-2-basilea", "pregunta": "Basilea BCBS 275", "estado": "integrada"}, {"n": "3.3.1", "carpeta": "3-3-1-metodologia", "pregunta": "Metodología de riesgos", "estado": "integrada"}, {"n": "3.3.2", "carpeta": "3-3-2-grado-riesgo", "pregunta": "Grado de riesgo del cliente", "estado": "integrada"}, {"n": "3.3.3", "carpeta": "3-3-3-enr", "pregunta": "ENR 2023", "estado": "integrada"}, {"n": "3.3.4", "carpeta": "3-3-4-anticorrupcion", "pregunta": "Riesgos de corrupción", "estado": "integrada"}], "integrador": "simulacro", "integrador_texto": "Simulacro mixto", "integrador_href": "3-simulacro/index.html"}}
</script>

<script>
(function(){
const D = JSON.parse(document.getElementById("datos").textContent);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// «Por qué no las otras»: q.d = {texto de opción incorrecta: razón}; opts = opciones en el orden en que se muestran
const tuHTML=(q,txt)=>(txt&&txt!==q.a&&q.d&&q.d[txt])?`<div class="tu"><b>Por qué tu respuesta está mal</b>${esc(q.d[txt])}</div>`:"";
const distHTML=(q,opts)=>{ if(!q.d) return ""; const it=opts.map((o,k)=>q.d[o]?`<li><b>${"ABCD"[k]}</b> ${esc(q.d[o])}</li>`:"").join(""); return it?`<div class="dist"><div class="lbl">Por qué no las otras</div><ul>${it}</ul></div>`:""; };
const RUTA = D.meta.ruta||"financiero";
const ACENTOS = {financiero:["morado","turquesa"], av:["turquesa","coral"], transversal:["morado","coral"], gratuito:["morado","turquesa"]}[RUTA]||["morado","turquesa"];
const COLORES = ["c-principal","c-"+ACENTOS[0],"c-"+ACENTOS[1],"c-negro"];
const colorDe = (v,i)=>v?("c-"+v):COLORES[i%4];
document.documentElement.setAttribute("data-ruta", RUTA);
const RUTAS = {financiero:"Ruta Sector financiero", av:"Ruta Actividades vulnerables", transversal:"Transversales", gratuito:"Gratuitos"};

/* ---------- encabezado, portada, trampas, pie ---------- */
$("#brand").innerHTML = `<b>360EDUCA</b><span>${esc(D.meta.modulo||"")}</span><span class="ruta">${esc(RUTAS[D.meta.ruta||"financiero"])}</span>`;
$("#nav").innerHTML = D.secciones.filter(s=>s.nav).map(s=>`<a href="#${s.id}"${s.tipo==="simulador"?' class="cta"':""}>${esc(s.nav)}</a>`).join("");
/* ---------- modo sitio: franja de páginas (opcional) ---------- */
if(D.sitio && Array.isArray(D.sitio.paginas)){
  const S=D.sitio, raiz=S.raiz||"", act=S.actual||"";
  const ETQ={preparacion:"En preparación", proximamente:"Próximamente"};
  const actual=S.paginas.find(p=>p.carpeta===act);
  $("#sitebar").innerHTML = `<a class="sb-mod" href="${esc(raiz)}index.html"${act?"":' aria-current="page"'}>${esc(S.nombre||"Portada")}</a><span class="sb-sep"></span>`+
    S.paginas.map(p=>{
      const tip=`Tema ${p.n} · ${p.pregunta||""}`;
      if(p.estado && p.estado!=="integrada") return `<span class="sb-p off" title="${esc(tip)} · ${esc(ETQ[p.estado]||p.estado)}" aria-disabled="true">${esc(p.n)}</span>`;
      return `<a class="sb-p" href="${esc(raiz+p.carpeta)}/index.html" title="${esc(tip)}"${p.carpeta===act?' aria-current="page"':""}>${esc(p.n)}</a>`;
    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+
    (actual?`<span class="sb-ses">Tema ${esc(actual.n)} · ${esc(actual.pregunta||"")}</span>`:"");
  $("#sitebar").hidden=false;
}
const mapa0 = D.secciones.find(s=>s.tipo==="mapa");
let rhythm = "";
if(Array.isArray(D.meta.ritmo)){ // ritmo puesto a mano: [{n, lb, q, color}]
  const R0=D.meta.ritmo;
  rhythm = `<div><div class="rhythm${R0.length>4?" many":""}">${R0.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${esc(r.n)}</span><span class="lb">${esc(r.lb||"")}</span><span class="q">${esc(r.q||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${D.meta.ritmo_cap?esc(D.meta.ritmo_cap):`${R0.map(r=>r.n).join(" · ")} = ${R0.reduce((a,r)=>a+(+r.n||0),0)} ${esc(D.meta.unidad||"")}`}</div></div>`;
} else if(mapa0 && D.meta.ritmo!==false){
  const counts = mapa0.ramas.map(r=>r.items.length);
  rhythm = `<div><div class="rhythm${mapa0.ramas.length>4?" many":""}">${mapa0.ramas.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${r.items.length}</span><span class="lb">${esc(r.corto||r.letra)}</span><span class="q">${esc(r.ritmo||r.pregunta||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${counts.join(" · ")} = ${counts.reduce((a,b)=>a+b,0)} ${esc(D.meta.unidad||"")}</div></div>`;
}
$("#hero").innerHTML = `<div><div class="lbl">${esc(D.meta.eyebrow||"")}</div>
  <h1>${esc(D.meta.h1_antes||"")} <mark>${esc(D.meta.h1_resaltado||"")}</mark> ${esc(D.meta.h1_despues||"")}</h1>
  <p>${D.meta.intro||""}</p></div>${rhythm}`;
$("#traps").innerHTML = (D.trampas||[]).map((t,i)=>`<div class="trapc"><span class="tag">Trampa ${D.trampas.length>1?i+1:"de examen"}</span><p><b>${esc(t.titulo)}</b> ${t.texto}</p></div>`).join("");
