<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mapa interactivo del régimen de prevención y de las autoridades nacionales en PLD/FT (temario CNBV 1.3), con fichas de la UIF y la CNBV y simulador de 80 reactivos.">
<title>Mapa de las autoridades nacionales PLD/FT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}

.dist{margin-top:12px;font-weight:500;font-size:15px}.dist ul{margin:4px 0 0;padding-left:0;list-style:none}.dist li{margin:5px 0;padding-left:26px;text-indent:-26px}.dist li b{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;text-indent:0;margin-right:6px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-display);font-size:12px;background:var(--surface)}

.rp-fin li{margin:10px 0}

.scrim{position:fixed;inset:0;background:rgba(27,27,30,.45);z-index:50}

.dhead .x{background:rgba(255,255,255,.25);border:0;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:inherit;flex:none}

.dbody .hook{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 12px}

footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:4px solid var(--membrete);padding-top:14px}

{"meta": {"titulo": "Mapa de la Clasificación por Grado de Riesgo del Cliente", "descripcion": "App de estudio del Capítulo III de las DCG Bancos y su Anexo 3: mapa mental, Modo recitar, alto riesgo, PEP, plazos y simulador de reactivos.", "repo": "mapa-grado-riesgo-cliente", "clave": "gradoriesgo", "ruta": "financiero", "modulo": "Módulo 3 · Certificación CNBV PLD/FT · Sesión 14", "unidad": "bloques", "eyebrow": "DCG Bancos, Capítulo III (25ª a 28ª) y Anexo 3 · compilado a DOF 28-08-2024", "h1_antes": "Clasificación por", "h1_resaltado": "Grado de Riesgo", "h1_despues": "del cliente", "intro": "Aquí se mide el riesgo de <b>cada cliente<\/b>, no el de la entidad. El instrumento se llama <b>Modelo de Riesgos<\/b> (25ª Bis) y sus requisitos mínimos están en el <b>Anexo 3<\/b>. Cuatro preguntas ordenan todo: con qué clasifico, cuándo y cada cuándo, quién es de alto riesgo, y cómo sostengo el modelo en el tiempo.", "fuente": "Fuente: Disposiciones de carácter general a que se refiere el artículo 115 de la Ley de Instituciones de Crédito, Capítulo III (25ª, 25ª Bis, 25ª Ter, 25ª Quáter, 26ª, 27ª y 28ª) y Anexo 3, texto compilado hasta la reforma DOF 28-08-2024; por remisión, la 2ª fr. XXXI, la 4ª Ter, la 21ª-4, la 33ª Bis 1 (Capítulo III Bis), la 38ª fr. X, la 47ª, la 51ª, la 62ª Quáter, la 64ª y el Anexo 1. Las comparaciones con ITF y SOFOMES citan sus propias Disposiciones."}, "trampas": [{"titulo": "PEP extranjera sí; PEP nacional no.", "texto": "Las <b>Personas Políticamente Expuestas extranjeras<\/b> son de Grado de Riesgo alto por mandato de la norma, y respecto de ellas la entidad <b>deberá obtener<\/b> además la documentación del Capítulo II sobre cónyuge, dependientes económicos y vínculos patrimoniales. Para las <b>PEP de nacionalidad mexicana<\/b> la 28ª <b>no<\/b> ordena clasificarlas como alto riesgo: obliga a <b>desarrollar mecanismos<\/b> para establecer el grado de riesgo de sus operaciones y determinar si su comportamiento transaccional corresponde razonablemente con sus funciones, nivel y responsabilidad (28ª, párrafos segundo, cuarto y último)."}, {"titulo": "¿Cuántos grados de riesgo? Depende del sujeto obligado.", "texto": "<b>Bancos no fija un número mínimo:<\/b> manda establecer, «entre los Grados de Riesgo bajo y alto, tantos Grados de Riesgo intermedios como consideren necesario» (25ª Bis; Anexo 3, I.iii). <b>ITF sí:<\/b> «al menos, tres clasificaciones, consistentes en Grados de Riesgo bajo, medio y alto» para todos sus clientes (DCG ITF, art. 29). <b>SOFOMES también, y diferenciado:<\/b> mínimo dos para personas físicas (alto y bajo) y tres para personas morales y fideicomisos (alto, medio y bajo) (DCG SOFOMES, 21ª). Mezclar el mínimo de un sector con otro es el error clásico."}, {"titulo": "6 meses es del cliente; 12 meses es de la entidad.", "texto": "El <b>Grado de Riesgo del cliente<\/b> se evalúa <b>al menos cada seis meses<\/b> (25ª Bis y Anexo 3, II), igual que su <b>perfil transaccional<\/b> (25ª Quáter). La <b>metodología de evaluación de riesgos de la entidad<\/b> se revisa y actualiza en un plazo <b>no mayor a 12 meses<\/b> (21ª-4). Son obligaciones distintas, con objetos distintos y plazos distintos. Y ojo con un tercer plazo que no es ninguno de los dos: los <b>60 días hábiles<\/b> del inicio del año para entregar a la Comisión los resultados del uso del Modelo (Anexo 3)."}], "secciones": [{"tipo": "mapa", "id": "mapa", "nav": "Los 4 bloques", "titulo": "El todo antes que el detalle: 3 · 3 · 4 · 3", "intro": "Cada bloque responde una pregunta. El corazón del examen está en el tercero: quién es de alto riesgo y qué exige serlo.", "centro": {"t": "Grado de Riesgo del Cliente", "s": "25ª a 28ª<br>+ Anexo 3"}, "ramas": [{"letra": "1", "titulo": "Bloque 1 · El instrumento", "pregunta": "¿Con qué lo clasifico?", "ritmo": "3 piezas", "corto": "El modelo", "color": "principal", "items": [{"etiqueta": "25ª Bis", "nombre": "El Modelo de Riesgos", "sub": "Coherente con el Capítulo II Bis", "verbo": "Clasifico", "desc": "Es el instrumento obligatorio con el que el banco identifica, mide y clasifica el riesgo de cada cliente. Su diseño debe cumplir el Anexo 3.", "orden": 1, "panel": "25ª Bis · El Modelo de Riesgos", "puntos": ["Las entidades <b>deberán contar<\/b> con un modelo de evaluación de Riesgos que <b>deberá ser coherente<\/b> con la metodología del Capítulo II Bis, para identificar, medir y clasificar los Grados de Riesgo de sus clientes (25ª Bis, 1er párr.).", "El diseño, los detalles del modelo, su metodología y los procesos de uso y validación <b>deberán cumplir con el Anexo 3<\/b> (25ª Bis).", "<b>Quién lo aprueba:<\/b> el <b>comité de riesgos<\/b> de la entidad, con base en la propuesta que haga <b>su Comité<\/b> (de Comunicación y Control); el comité de riesgos debe <b>informarlo<\/b> al consejo de administración o directivo (25ª Bis). Tres órganos, tres papeles: propone, aprueba, se entera.", "Ese documento se proporciona <b>a la Secretaría y a la Comisión<\/b>, a requerimiento de esta última y dentro del plazo que la propia Comisión establezca, y debe describir que el modelo cumple con el Anexo 3 (25ª Bis, 1er párr.).", "Aplica la política de conocimiento del cliente en función del Grado de Riesgo: a mayor grado, más información sobre su actividad económica preponderante y supervisión más estricta por el sistema de alertas de la 25ª Quáter (25ª).", "El Manual de Cumplimiento debe describir qué información adicional se recaba y cómo se supervisa de forma diferenciada por Grado de Riesgo (25ª, último párr., adicionado DOF 28-08-2024)."], "ir": "#factores", "destacado": true}, {"etiqueta": "Anexo 3 · I.i", "nombre": "Los factores de riesgo", "sub": "Inherentes y transaccionales", "verbo": "Mido", "desc": "El cliente se mira en dos dimensiones: lo que es (inherentes) y lo que hace (transaccionales). El Anexo 3 fija el piso mínimo de cada una.", "orden": 2, "panel": "Anexo 3 · Identificación de factores de riesgo", "puntos": ["Los factores de riesgo son los indicadores que explican cómo y en qué medida <b>cada cliente<\/b> representa riesgo para la entidad (Anexo 3, I.i).", "<b>Características inherentes (6):<\/b> tipo de persona; nacionalidad; fecha de nacimiento o de constitución; giro o actividad; ubicación geográfica o Geolocalización; productos y servicios.", "<b>Características transaccionales:<\/b> volumen de operación; frecuencia; origen y destino de los recursos; países de origen y destino; manejo de efectivo en la cuenta; envío o recepción de transferencias internacionales; información de transferencias internacionales en moneda extranjera de la 62ª Quáter; Geolocalización del Dispositivo; y, si la entidad lo determina, la información del intercambio del Capítulo XIII.", "La lista se introduce con «al menos»: es un <b>piso mínimo<\/b>, no una lista cerrada.", "<b>Medición:<\/b> método exhaustivo, que <b>podrá<\/b> ser estadístico, que relacione los factores y asigne el peso de cada uno según su idoneidad para medir el riesgo del cliente (Anexo 3, I.ii).", "La entidad debe demostrar que los datos son representativos del universo de sus clientes y que incorporó los productos y servicios contratados (Anexo 3, introducción)."], "ir": "#factores", "destacado": false}, {"etiqueta": "Anexo 3 · I.iii", "nombre": "Sistema de clasificación e invalidaciones", "sub": "Criterios, criterio experto y bitácora", "verbo": "Justifico", "desc": "Los grados deben diferenciar de verdad, los criterios ser reproducibles por un tercero, y toda invalidación queda registrada con nombre y apellido.", "orden": 3, "panel": "Anexo 3 · Sistema de clasificación", "puntos": ["Los Grados de Riesgo deben permitir diferenciar a los clientes <b>de forma significativa<\/b>; una concentración excesiva en un grado sólo se justifica si esos clientes presentan <b>características homogéneas<\/b> (Anexo 3, I.iii).", "Cada grado resulta de un conjunto claro y detallado de criterios de clasificación, que deben ser reproducibles: un <b>tercero<\/b> debe poder comprender el proceso, replicar la clasificación y evaluar su idoneidad.", "Los criterios deben ser consistentes con el documento a que se refiere la <b>64ª<\/b>.", "El sistema <b>podrá<\/b> incorporar componentes de <b>criterio experto<\/b>, siempre que cuenten con amplia documentación que justifique su consistencia.", "<b>Invalidaciones:<\/b> hay que describir en qué supuestos el personal puede dejar sin efecto el resultado, especificando <b>quién, cómo y en qué medida<\/b>, y documentarlas en un registro o bitácora que identifique al responsable de aprobarlas y les dé seguimiento.", "Regla absoluta, sin excepción ni matiz: «<b>Por ningún motivo<\/b> las Entidades deberán tener Clientes sin clasificar en alguno de los Grados de Riesgo establecidos» (Anexo 3, I.iii, b)."], "destacado": false}]}, {"letra": "2", "titulo": "Bloque 2 · El reloj", "pregunta": "¿Cuándo y cada cuándo?", "ritmo": "3 momentos", "corto": "El reloj", "color": "turquesa", "items": [{"etiqueta": "28ª", "nombre": "Al inicio de la relación comercial", "sub": "Con los sistemas de la 51ª", "verbo": "Arranco", "desc": "La clasificación no es un trámite posterior: se hace al inicio de la relación comercial y con los sistemas automatizados de la entidad.", "orden": 4, "panel": "28ª · Clasificar al inicio", "puntos": ["Las entidades <b>deberán clasificar<\/b> a sus clientes en función a su Grado de Riesgo, <b>utilizando los sistemas automatizados<\/b> de la 51ª, y <b>al inicio de la relación comercial<\/b> (28ª, 1er párr., reformado DOF 28-08-2024).", "En apertura no presencial (4ª Ter) y en operaciones por Dispositivos hay que considerar la <b>Geolocalización del Dispositivo<\/b> (25ª Bis).", "Excepción de Geolocalización: sociedades, dependencias y entidades del <b>Anexo 1<\/b>, siempre que estén clasificadas con Grado de Riesgo <b>bajo<\/b> (25ª Bis).", "Al determinar el grado de clientes que realicen transferencias hay que considerar si involucran países o jurisdicciones de la <b>fracción X de la 38ª<\/b>, que desde la reforma DOF 28-08-2024 son <b>tres<\/b>: a) los que la legislación mexicana considera de <b>régimen fiscal preferente<\/b>; b) los incluidos en la <b>lista de jurisdicciones de alto riesgo sujetas a un llamado de acción<\/b> del GAFI, y c) los incluidos en la <b>lista de jurisdicciones sujetas a un monitoreo intensificado<\/b> del GAFI (25ª Bis; 38ª, fr. X, incisos a, b y c)."], "destacado": false}, {"etiqueta": "6 meses", "nombre": "Los primeros seis meses", "sub": "Grado inicial y perfil inicial", "verbo": "Observo", "desc": "Durante el arranque de la relación se trabaja con lo que el cliente declaró: así se fija su grado inicial y su perfil transaccional inicial.", "orden": 5, "panel": "Los primeros seis meses", "puntos": ["Para determinar el <b>Grado de Riesgo inicial<\/b> se considera, <b>al menos durante los seis primeros meses<\/b> siguientes al inicio de la relación comercial, la información que el cliente proporcione en ese momento (25ª Bis, 3er párr.).", "Para el <b>perfil transaccional inicial<\/b>, el sistema de alertas considera, al menos durante esos mismos seis primeros meses, la información que el cliente proporcione sobre las operaciones que <b>estime realizar<\/b> (25ª Quáter).", "Ese perfil inicial debe estar incluido en el sistema de alertas, con objeto de detectar inconsistencias entre lo que el cliente declaró y lo que efectivamente opera (25ª Quáter).", "Son dos cosas distintas que comparten el mismo plazo: el <b>grado de riesgo<\/b> y el <b>perfil transaccional<\/b>."], "destacado": false}, {"etiqueta": "Cada 6 meses", "nombre": "Reevaluación periódica", "sub": "Y más seguido si el riesgo es mayor", "verbo": "Reevalúo", "desc": "Al menos cada seis meses se revisa si el cliente debe cambiar de grado; a mayor grado, mayor debe ser la frecuencia.", "orden": 6, "panel": "Reevaluación cada seis meses", "puntos": ["Evaluación del <b>Grado de Riesgo al menos cada seis meses<\/b> para determinar si resulta o no necesario clasificar al cliente en un grado diferente (25ª Bis).", "«La frecuencia de la evaluación <b>deberá ser mayor<\/b> cuando la clasificación del Grado de Riesgo también lo sea» (25ª Bis).", "Evaluación del <b>perfil transaccional al menos cada seis meses<\/b>, para determinar si resulta necesario modificarlo (25ª Quáter).", "El Anexo 3 lo repite como frecuencia <b>no mayor a seis meses<\/b>, disparada además por cambios en características inherentes, en el perfil transaccional o en cualquier otra dimensión definida por la entidad (Anexo 3, II).", "Fuera de calendario: cuando se obtengan <b>nuevos datos relevantes<\/b> sobre un cliente hay que revisar y, en su caso, reclasificarlo (Anexo 3, II).", "Como parte de la evaluación, las entidades <b>podrán<\/b> considerar la información del intercambio del Capítulo XIII (25ª Bis, reformado DOF 03-03-2022)."], "destacado": false}]}, {"letra": "3", "titulo": "Bloque 3 · El alto riesgo", "pregunta": "¿Quién lo es y qué exige serlo?", "ritmo": "4 piezas", "corto": "Alto riesgo", "color": "morado", "items": [{"etiqueta": "28ª", "nombre": "Los tres supuestos automáticos", "sub": "«Al menos», no lista cerrada", "verbo": "Detecto", "desc": "La norma fija un piso: tres tipos de cliente que son de alto riesgo por mandato, sin que medie calificación del modelo.", "orden": 7, "panel": "28ª · Alto riesgo por mandato", "puntos": ["<b>1.<\/b> Clientes <b>no residentes<\/b> en el país asignados al segmento conocido como <b>banca privada<\/b> o sector de negocios similar dentro de la entidad.", "<b>2.<\/b> Las <b>Personas Políticamente Expuestas extranjeras<\/b>.", "<b>3.<\/b> Las <b>personas morales<\/b> que realicen operaciones en efectivo con <b>dólares<\/b> de los Estados Unidos de América en términos de la <b>33ª Bis 1<\/b>.", "Hay que recabar la información que permita conocer y <b>asentar las razones<\/b> por las que el cliente eligió abrir una cuenta en territorio nacional. El texto dice «respecto de los Clientes a que se refiere <b>este párrafo<\/b>» y la frase va colocada justo después de los dos primeros supuestos —no residentes en banca privada y PPE extranjeras—, que son a los que se dirige de forma natural; memoriza la fórmula literal, no la paráfrasis (28ª, 2º párr.).", "<b>Banca privada<\/b>, definida por la propia norma: «el servicio bancario preferencial ofrecido por las Entidades a sus Clientes, que se caracteriza por una atención y asesoría personalizada, un alto nivel de discreción, así como por el acceso a instrumentos financieros no disponibles para otros segmentos de Clientes con menor patrimonio» (28ª, 3er párr.).", "El párrafo dice «<b>al menos<\/b>»: el modelo de la entidad puede clasificar como alto riesgo a otros clientes; estos tres son el piso."], "ir": "#altoriesgo", "destacado": true}, {"etiqueta": "28ª", "nombre": "PEP extranjera y PEP nacional", "sub": "Dos tratamientos distintos", "verbo": "Distingo", "desc": "La extranjera es alto riesgo por norma y exige documentación reforzada; la nacional se evalúa con mecanismos propios de la entidad.", "orden": 8, "panel": "PEP: extranjera vs. nacional", "puntos": ["<b>PEP extranjera:<\/b> es cliente de Grado de Riesgo alto por mandato de la 28ª. Además de los datos, la entidad <b>deberá obtener<\/b> la documentación del Capítulo II respecto del cónyuge, dependientes económicos, sociedades y asociaciones con vínculo patrimonial (28ª, 4º párr.).", "<b>PEP nacional:<\/b> la entidad <b>deberá desarrollar mecanismos<\/b> para establecer el grado de riesgo de sus operaciones y determinar si el comportamiento transaccional corresponde razonablemente con sus funciones, nivel y responsabilidad (28ª, último párr.). No es alto riesgo automático.", "<b>Quién es PEP<\/b> (2ª, fr. XXXI): quien desempeña o ha desempeñado funciones públicas destacadas en un país extranjero o en territorio nacional, considerando entre otros a jefes de estado o de gobierno, líderes políticos, funcionarios gubernamentales, judiciales o militares de alta jerarquía, altos ejecutivos de empresas estatales y funcionarios o miembros importantes de partidos políticos y organizaciones internacionales.", "<b>Se asimilan a PEP:<\/b> el cónyuge, la concubina, el concubinario, el parentesco por consanguinidad o afinidad <b>hasta el segundo grado<\/b>, y las personas morales con las que la PEP mantenga vínculos patrimoniales (2ª, fr. XXXI).", "<b>Un año:<\/b> se continúa considerando PEP nacional a quien tuvo ese carácter durante el año siguiente a aquel en que dejó su encargo. Y si dejó de serlo dentro del año inmediato anterior a iniciar una nueva relación comercial, la entidad deberá catalogarla como tal durante el año siguiente a aquel en que se abrió la cuenta o se celebró el contrato (2ª, fr. XXXI)."], "destacado": false}, {"etiqueta": "26ª y 27ª", "nombre": "La aprobación del directivo", "sub": "Dos supuestos que se confunden", "verbo": "Autorizo", "desc": "Alto riesgo no se abre solo: hace falta la aprobación por escrito de un directivo con facultades específicas, antes de abrir.", "orden": 9, "panel": "26ª y 27ª · Aprobación", "puntos": ["<b>27ª:<\/b> <b>previamente<\/b> a la apertura de cuentas o celebración de contratos de clientes clasificados con Grado de Riesgo <b>alto<\/b>, al menos un directivo o equivalente con facultades específicas <b>deberá otorgar por escrito, de forma digital o electrónica, la aprobación<\/b> respectiva.", "<b>26ª:<\/b> cuando la persona reúna los requisitos para ser PPE <b>y además<\/b> de Grado de Riesgo alto —antes o después de iniciada la relación—, se requiere la aprobación de un directivo con facultades específicas para <b>iniciar o continuar<\/b> la relación comercial.", "Diferencia fina: la 27ª es <b>previa a la apertura<\/b> de cualquier cliente de alto riesgo; la 26ª cubre el caso PPE + alto riesgo y alcanza también a la <b>continuación<\/b> de una relación ya iniciada.", "El Manual de Cumplimiento debe prever los mecanismos para que el <b>Oficial de Cumplimiento<\/b> tenga conocimiento de los clientes clasificados de alto riesgo y los procedimientos para tramitar esa aprobación (27ª, en relación con la 47ª, frs. IV y V)."], "destacado": false}, {"etiqueta": "25ª Bis y 28ª", "nombre": "Medidas reforzadas", "sub": "Cuestionarios, origen de recursos y entorno", "verbo": "Refuerzo", "desc": "Al cliente de alto riesgo se le aplican cuestionarios y se indaga el origen de los recursos y su entorno patrimonial y familiar.", "orden": 10, "panel": "Medidas reforzadas", "puntos": ["<b>Cuestionarios de identificación<\/b> a los clientes catalogados de alto riesgo y a los nuevos que reúnan ese carácter, para obtener mayor información sobre el <b>origen y destino<\/b> de los recursos y las actividades y operaciones que realizan o pretenden llevar a cabo (25ª Bis).", "Esos cuestionarios <b>podrán<\/b> realizarse vía no presencial, por medios digitales o electrónicos, y en todo caso deberán contener el consentimiento de la 4ª Ter (25ª Bis).", "En las operaciones de clientes de alto riesgo, las entidades <b>adoptarán<\/b> medidas para conocer el <b>origen de los recursos<\/b> y <b>procurarán<\/b> obtener los datos del Capítulo II respecto del cónyuge y dependientes económicos, sociedades y asociaciones con vínculo patrimonial (personas físicas), de los principales accionistas o socios (personas morales) y de fideicomitentes y fideicomisarios (fideicomisos) (28ª, 4º párr.). Fíjate en el verbo: <b>procurarán<\/b>, no «deberán».", "<b>Excepción:<\/b> tratándose de personas morales cuyos títulos coticen en bolsa nacional o en mercados del exterior reconocidos, y de sus subsidiarias con participación <b>mayoritaria al cincuenta por ciento<\/b>, la entidad <b>no está obligada<\/b> a recabar esos datos de identificación, por estar sujetas a revelación bursátil (28ª, 5º párr.).", "Las <b>condiciones de la 33ª Bis 1<\/b> para recibir dólares en efectivo ilimitadamente de personas morales incluyen, entre otras: que estén constituidas con al menos <b>tres años<\/b> de anterioridad, los estados financieros de los <b>últimos dos<\/b> ejercicios fiscales y las <b>dos últimas<\/b> declaraciones anuales presentadas al SAT."], "destacado": false}]}, {"letra": "4", "titulo": "Bloque 4 · El sostén", "pregunta": "¿Cómo lo mantengo vivo?", "ritmo": "3 obligaciones", "corto": "Sostén", "color": "negro", "items": [{"etiqueta": "Anexo 3 · II", "nombre": "Uso del modelo", "sub": "Revisión humana e historial", "verbo": "Uso", "desc": "El algoritmo no decide solo: debe haber revisión humana por escrito y conservarse el historial completo de clasificaciones.", "orden": 11, "panel": "Anexo 3 · Uso del Modelo", "puntos": ["Se revisan y, <b>en su caso<\/b>, se actualizan los factores de riesgo tomando en consideración tres criterios: cambio en las características inherentes, cambio en el perfil transaccional o cambio en cualquier otra dimensión de Riesgo definida por la entidad (Anexo 3, II).", "Cuando el Grado de Riesgo asignado al cliente <b>incremente<\/b>, hay que <b>intensificar<\/b> la revisión de los factores de riesgo (Anexo 3, II).", "<b>Revisión humana:<\/b> procedimientos de revisión humana de la clasificación basada en el modelo, para tomar en cuenta información relevante no contemplada, con <b>directrices por escrito<\/b> que describan cómo se combinan el criterio humano y el resultado del modelo.", "<b>Historial:<\/b> hay que conservar el historial de clasificación de los clientes, incluidas las clasificaciones asignadas por primera vez y <b>las fechas<\/b> en que se realizaron las nuevas clasificaciones.", "Debe existir un proceso periódico y eficaz para obtener y actualizar la información que alimenta los factores de riesgo."], "destacado": false}, {"etiqueta": "Anexo 3 · III", "nombre": "Validación del modelo", "sub": "Área independiente, comparación anual", "verbo": "Valido", "desc": "Quien valida no puede ser quien desarrolló el modelo, y la responsabilidad no se delega aunque se contrate a un tercero.", "orden": 12, "panel": "Anexo 3 · Validación", "puntos": ["Validación <b>periódica<\/b>: controlando resultados y estabilidad, examinando las relaciones entre los factores de riesgo, y contrastando los resultados pronosticados con los observados en la práctica (Anexo 3, III).", "La validación interna la lleva a cabo un <b>área independiente<\/b> de la que desarrolló el modelo. La entidad <b>podrá<\/b> apoyarse en auditores externos o consultores, «en el entendido de que su responsabilidad es <b>indelegable<\/b>».", "Los criterios y procedimientos de clasificación se examinan <b>periódicamente<\/b> para garantizar su vigencia y aplicabilidad.", "Comparar <b>por lo menos anualmente<\/b> los criterios de clasificación y demostrar que están dentro de los rangos esperados, documentando métodos y datos (Anexo 3, III, c).", "Procedimientos de revisión para detectar y limitar lo que se sabe que el modelo no puede hacer, e intentar continuamente mejorarlo; y verificación continua de los procesos operativos."], "destacado": false}, {"etiqueta": "Anexo 3", "nombre": "Documentación y entrega anual", "sub": "60 días hábiles", "verbo": "Entrego", "desc": "Todo se documenta con detalle suficiente para que un tercero replique la clasificación, y cada año se le entrega a la Comisión el resultado del uso.", "orden": 13, "panel": "Anexo 3 · Documentación y seguimiento", "puntos": ["La documentación debe permitir la <b>réplica por un tercero<\/b> de la clasificación y de los mitigantes asociados a cada grado.", "Debe incluir: criterios de clasificación y su capacidad de diferenciar el riesgo, responsabilidades de las áreas, qué constituye una invalidación, el personal autorizado a aprobarlas, la frecuencia de revisión y la <b>vigilancia del proceso por parte del Comité<\/b>.", "Si se usan modelos estadísticos: descripción de teoría, supuestos y bases matemáticas y empíricas, fuentes de datos, prueba de bondad de ajuste con validaciones fuera de muestra y fuera del periodo, y análisis de las circunstancias que impidan su funcionamiento eficaz.", "«El uso de un modelo adquirido de un tercero, que opere con tecnología propia, <b>no justifica la exención<\/b> del cumplimiento de la documentación, ni de otros requisitos» (Anexo 3, III, Documentación).", "<b>Entrega anual a la Comisión, en los primeros 60 días hábiles del año:<\/b> i) cédulas de clasificación con la descripción de los criterios asignados a cada grado; ii) informe de cualquier cambio al modelo, en factores o en criterios; iii) conclusiones de la entidad sobre el desempeño del modelo (Anexo 3, Seguimiento de uso)."], "ir": "#cifras", "destacado": false}]}], "frase": {"titulo": "Para recitar en voz alta: un verbo por pieza", "html": "<b>Clasifico · Mido · Justifico<\/b> — el instrumento.<br><b>Arranco · Observo · Reevalúo<\/b> — el reloj.<br><b>Detecto · Distingo · Autorizo · Refuerzo<\/b> — el alto riesgo.<br><b>Uso · Valido · Entrego<\/b> — el sostén."}}, {"tipo": "tarjetas", "id": "factores", "nav": "Factores", "titulo": "Las dos dimensiones del cliente", "tarjetas": [{"encabezado": true, "color": "principal", "titulo": "Características inherentes", "subtitulo": "Lo que el cliente es · Anexo 3, I.i, a)", "filas": [{"k": "Tipo de persona", "v": "Física, moral o fideicomiso"}, {"k": "Nacionalidad", "v": "Del cliente"}, {"k": "Fecha", "v": "De nacimiento o de constitución"}, {"k": "Giro o actividad", "v": "A qué se dedica"}, {"k": "Ubicación", "v": "Ubicación geográfica o Geolocalización"}, {"k": "Productos y servicios", "v": "Los que tiene contratados"}]}, {"encabezado": true, "color": "turquesa", "titulo": "Características transaccionales", "subtitulo": "Lo que el cliente hace · Anexo 3, I.i, b)", "filas": [{"k": "Volumen", "v": "De operación"}, {"k": "Frecuencia", "v": "De la operación"}, {"k": "Origen y destino", "v": "De los recursos"}, {"k": "Países", "v": "De origen y destino de los recursos"}, {"k": "Efectivo", "v": "Manejo de efectivo en la cuenta"}, {"k": "Transferencias", "v": "Envío o recepción de transferencias internacionales"}, {"k": "Moneda extranjera", "v": "Información de transferencias internacionales en moneda extranjera (62ª Quáter)"}, {"k": "Geolocalización", "v": "Del Dispositivo desde el que opera"}, {"k": "Intercambio", "v": "Información del Capítulo XIII, si la entidad lo determina"}]}], "nota": "Cuidado con confundir las dimensiones del cliente (Anexo 3) con los elementos de riesgo de la entidad (21ª-2, fr. I). Son dos catálogos distintos, de dos ejercicios distintos."}, {"tipo": "tarjetas", "id": "altoriesgo", "nav": "Bancos · ITF · SOFOM", "titulo": "Lo mismo, con reglas distintas según el sujeto obligado", "tarjetas": [{"encabezado": true, "color": "principal", "titulo": "Bancos", "subtitulo": "DCG art. 115 LIC", "filas": [{"k": "Grados mínimos", "v": "No fija número: bajo y alto como extremos, más los intermedios que se consideren necesarios (25ª Bis; Anexo 3, I.iii)"}, {"k": "Alto riesgo automático", "v": "No residentes en banca privada; PPE extranjeras; personas morales con dólares en efectivo de la 33ª Bis 1 (28ª)"}, {"k": "Anexo del modelo", "v": "Sí: Anexo 3, obligatorio (25ª Bis)"}, {"k": "Reevaluación del grado", "v": "Al menos cada 6 meses (25ª Bis)"}, {"k": "Quién aprueba el modelo", "v": "Comité de riesgos, a propuesta del Comité; se informa al consejo (25ª Bis)"}]}, {"encabezado": true, "color": "morado", "titulo": "ITF", "subtitulo": "DCG art. 58 Ley Fintech", "filas": [{"k": "Grados mínimos", "v": "Al menos tres —bajo, medio y alto— para todos los clientes, más los intermedios que se consideren (art. 29)"}, {"k": "Alto riesgo automático", "v": "No residentes en los supuestos del art. 70, fr. X; y PPE extranjeras (art. 33)"}, {"k": "Anexo del modelo", "v": "No lo trae: ningún anexo fija requisitos mínimos de elaboración, uso, validación y documentación del modelo de clientes. El art. 90 es otra cosa: permite adoptar metodologías y modelos de Riesgo homogéneos para DETECTAR Y REPORTAR operaciones, no para clasificar clientes."}, {"k": "Reevaluación del grado", "v": "Al menos cada 6 meses (art. 30); perfil transaccional, art. 35"}, {"k": "Quién aprueba el modelo", "v": "No se prevé órgano aprobatorio; el modelo debe estar establecido en el Manual de Cumplimiento (art. 29)."}]}, {"encabezado": true, "color": "negro", "titulo": "SOFOMES", "subtitulo": "DCG arts. 115 LIC / 87-D y 95 Bis LGOAAC", "filas": [{"k": "Grados mínimos", "v": "Dos para personas físicas (alto y bajo); tres para personas morales y fideicomisos (alto, medio y bajo) (21ª)"}, {"k": "Alto riesgo automático", "v": "Al menos las PPE extranjeras (24ª). No trae el supuesto de no residentes"}, {"k": "Anexo del modelo", "v": "No lo trae: ningún anexo fija requisitos mínimos del modelo de clientes. La 47ª es otra cosa: permite adoptar metodologías y modelos de Riesgo homogéneos para DETECTAR Y REPORTAR operaciones, no para clasificar clientes."}, {"k": "Reevaluación del grado", "v": "Al menos dos evaluaciones por año calendario, sobre clientes con contrato de al menos 6 meses de antigüedad (21ª)"}, {"k": "Quién aprueba el modelo", "v": "No se prevé órgano aprobatorio; los criterios se fijan en el Manual de Cumplimiento (21ª, último párr.)."}]}], "nota": "Este cuadro existe porque el examen mezcla sectores a propósito. Regla práctica: si la pregunta no dice de qué sujeto obligado habla, fíjate en el ordenamiento que cita. Extras que sólo tiene un sector: la Infraestructura Tecnológica como factor del EBR de las ITF (arts. 3 y 4); en SOFOMES el EBR vive en el Capítulo II Bis, 17ª-1 a 17ª-6, sin Infraestructura Tecnológica."}, {"tipo": "cifras", "id": "cifras", "nav": "Plazos", "titulo": "Las cifras que sí se preguntan", "cifras": [["6", "meses (los primeros)", "Información del cliente que fija su Grado de Riesgo inicial", "25ª Bis, 3er párr."], ["6", "meses (los primeros)", "Información que fija el perfil transaccional inicial", "25ª Quáter"], ["6", "meses (máximo)", "Reevaluación del Grado de Riesgo del cliente", "25ª Bis; Anexo 3, II"], ["6", "meses (máximo)", "Evaluación del perfil transaccional del cliente", "25ª Quáter"], ["60", "días hábiles", "Los primeros del año, para entregar a la Comisión los resultados del uso del Modelo", "Anexo 3, Seguimiento de uso"], ["1", "vez al año (mínimo)", "Comparación de los criterios de clasificación en la validación", "Anexo 3, III, c)"], ["3", "supuestos", "De Grado de Riesgo alto por mandato de la norma en Bancos", "28ª, 2º párr."], ["50", "% del capital", "Participación mayoritaria que la emisora debe tener en el capital social de su subsidiaria, para la excepción de datos", "28ª, 5º párr."], ["2", "grado", "Hasta el segundo grado de consanguinidad o afinidad se asimila a PPE", "2ª, fr. XXXI"], ["1", "año", "Se sigue considerando PPE nacional a quien dejó su encargo", "2ª, fr. XXXI"], ["3", "años (mínimo)", "De constitución de la persona moral, para recibir dólares en efectivo sin límite", "33ª Bis 1, fr. I"], ["2", "declaraciones", "Las dos últimas anuales presentadas al SAT, en el mismo supuesto", "33ª Bis 1, fr. IV"]]}, {"tipo": "simulador", "id": "examen", "nav": "Practicar ▸"}], "temas": {"mod": "El Modelo de Riesgos y sus factores", "rel": "El reloj: cuándo y cada cuándo", "alt": "Alto riesgo, PEP y aprobaciones", "sos": "Uso, validación y documentación"}, "modos": [{"k": "mod", "l": "El modelo", "tema": "mod"}, {"k": "alt", "l": "Alto riesgo y PEP", "tema": "alt"}, {"k": "caso", "l": "Casos prácticos", "tipos": ["caso"]}, {"k": "tr", "l": "Plazos y trampas", "tipos": ["cifra", "trampa"]}], "banco": [{"id": "C001", "tema": "mod", "tipo": "memoria", "q": "Conforme a la 25ª de las DCG Bancos, ¿en qué debe basarse la aplicación de la política de conocimiento del Cliente?", "a": "En el Grado de Riesgo que represente el Cliente", "o": ["En el Grado de Riesgo que represente el Cliente", "En el monto agregado de las operaciones en efectivo que el Cliente realice durante el ejercicio", "En el nivel de Riesgo global que la propia Entidad haya obtenido al implementar su metodología del Capítulo II Bis", "En la antigüedad de la relación comercial y en el número de productos que el Cliente tenga contratados"], "x": "La 25ª ordena que la política de conocimiento del Cliente se aplique con base en el Grado de Riesgo del Cliente: a mayor grado, más información sobre su actividad económica preponderante y supervisión transaccional más estricta. El distractor más tentador es el del Riesgo de la propia Entidad: ése es el ejercicio del Capítulo II Bis (21ª-1 y siguientes), que mide a la institución, no al Cliente. Fundamento: 25ª.", "ref": "25ª, 1er párr."}, {"id": "C002", "tema": "mod", "tipo": "memoria", "q": "¿Con qué instrumento deben contar las Entidades para determinar el Grado de Riesgo en que deba ubicarse a cada Cliente?", "a": "Con un modelo de evaluación de Riesgos coherente con la metodología del Capítulo II Bis", "o": ["Con un modelo de evaluación de Riesgos coherente con la metodología del Capítulo II Bis", "Con el catálogo de indicadores de Riesgo que la Comisión publique cada año en su portal electrónico", "Con la evaluación nacional de riesgos que la Secretaría dé a conocer por conducto de la Comisión", "Con el sistema de alertas de comportamiento transaccional a que se refiere la 25ª Quáter"], "x": "La 25ª Bis obliga a contar con un modelo de evaluación de Riesgos, coherente con la metodología del Capítulo II Bis, para identificar, medir y clasificar los Grados de Riesgo de los Clientes. El distractor del sistema de alertas es el más tentador porque también mira al Cliente, pero ése sirve para vigilar su comportamiento transaccional, no para clasificarlo. Fundamento: 25ª Bis, 1er párr.", "ref": "25ª Bis, 1er párr."}, {"id": "C003", "tema": "mod", "tipo": "memoria", "q": "¿Qué órgano debe aprobar el modelo de evaluación de Riesgos de los Clientes y con base en la propuesta de quién?", "a": "El comité de riesgos, con base en la propuesta de su Comité", "o": ["El comité de riesgos, con base en la propuesta de su Comité", "El Comité de Comunicación y Control, con base en la propuesta del Oficial de Cumplimiento", "El consejo de administración o directivo, con base en la propuesta del área de auditoría interna", "El director general de la Entidad, con base en la propuesta del comité de riesgos"], "x": "La 25ª Bis reparte tres papeles: el Comité propone, el comité de riesgos aprueba y el consejo de administración o directivo es informado por ese comité de riesgos. El distractor del consejo es el más tentador porque el consejo sí interviene, pero sólo para enterarse, no para aprobar. Fundamento: 25ª Bis, 1er párr.", "ref": "25ª Bis, 1er párr."}, {"id": "C004", "tema": "mod", "tipo": "caso", "q": "En Banco Ribera, el Comité de Comunicación y Control formuló la propuesta de un nuevo modelo de evaluación de Riesgos de Clientes. ¿Cuál es la secuencia correcta que sigue?", "a": "Lo aprueba el comité de riesgos, que lo informa al consejo", "o": ["Lo aprueba el comité de riesgos, que lo informa al consejo", "Lo aprueba el consejo de administración y lo informa al comité de riesgos de la propia Entidad", "Lo aprueba el Oficial de Cumplimiento y lo somete a ratificación del comité de riesgos de la Entidad", "Lo aprueba la Comisión dentro del plazo que ella misma establezca para tal efecto en cada ejercicio"], "x": "La propuesta del Comité va al comité de riesgos, que es quien aprueba, y ese comité informa al consejo de administración o directivo. El distractor de la Comisión es tentador porque la 25ª Bis sí la menciona, pero sólo para recibir, a requerimiento, un documento que describa que el modelo cumple el Anexo 3: no lo aprueba. Fundamento: 25ª Bis, 1er párr.", "ref": "25ª Bis, 1er párr."}, {"id": "C005", "tema": "mod", "tipo": "trampa", "q": "Tratándose de Bancos, ¿cuántos Grados de Riesgo intermedios exige la norma entre el bajo y el alto?", "a": "Tantos como las Entidades consideren necesario", "o": ["Tantos como las Entidades consideren necesario", "Al menos uno, de modo que resulten como mínimo tres Grados de Riesgo en el sistema de clasificación", "Al menos tres, consistentes en Grados de Riesgo bajo, medio y alto para todos los Clientes de la Entidad", "Dos para Clientes personas físicas y tres para personas morales y Fideicomisos, según el tipo de persona"], "x": "En Bancos la norma no fija un número: manda establecer entre el bajo y el alto tantos Grados intermedios como las Entidades consideren necesario, siempre que sean claramente diferenciables y homogéneos al interior. Los distractores son los mínimos de OTROS sujetos obligados: las tres clasificaciones son de ITF (DCG ITF, art. 29) y el esquema de dos y tres es de SOFOMES (DCG SOFOMES, 21ª). Fundamento: 25ª Bis, 2º párr.; Anexo 3, I.iii.", "ref": "25ª Bis, 2º párr."}, {"id": "C006", "tema": "mod", "tipo": "memoria", "q": "Según el Anexo 3, ¿cuál de los siguientes corresponde a las características inherentes del Cliente?", "a": "La fecha de nacimiento o de constitución", "o": ["La fecha de nacimiento o de constitución", "El manejo de efectivo en la cuenta durante el periodo que la Entidad determine en su metodología", "La frecuencia con que el Cliente realiza sus Operaciones a través de los canales contratados", "Los países de origen y destino de los recursos que el Cliente mueve en sus Operaciones"], "x": "Las inherentes son lo que el Cliente es: tipo de persona, nacionalidad, fecha de nacimiento o de constitución, giro o actividad, ubicación geográfica o Geolocalización, y productos y servicios. Los tres distractores son transaccionales, es decir, lo que el Cliente hace. Fundamento: Anexo 3, I.i, a).", "ref": "Anexo 3, I.i, a)"}, {"id": "C007", "tema": "mod", "tipo": "caso", "q": "El área de riesgos de Banco Ribera clasificó el factor «manejo de efectivo en la cuenta» dentro de las características inherentes del Cliente. ¿Es correcto conforme al Anexo 3?", "a": "No; es una característica transaccional", "o": ["No; es una característica transaccional", "Sí; es una característica inherente porque describe el producto que el Cliente tiene contratado", "Sí; es inherente cuando se trata de Clientes personas morales y transaccional si son personas físicas", "No; no figura en el Anexo 3 y sólo puede usarse como criterio experto debidamente documentado"], "x": "El manejo de efectivo en la cuenta aparece expresamente en el catálogo de características transaccionales del Anexo 3. El distractor de los productos confunde dos cosas: «productos y servicios» sí es inherente, pero el manejo de efectivo describe cómo opera la cuenta, no qué producto es. Fundamento: Anexo 3, I.i, b).", "ref": "Anexo 3, I.i, b)"}, {"id": "C008", "tema": "mod", "tipo": "cifra", "q": "¿Cuántas características inherentes enumera el Anexo 3 como piso mínimo para identificar los factores de Riesgo del Cliente?", "a": "Seis", "o": ["Seis", "Cuatro", "Ocho", "Nueve"], "x": "Son seis: tipo de persona, nacionalidad, fecha de nacimiento o de constitución, giro o actividad, ubicación geográfica o Geolocalización, y productos y servicios. El nueve tienta porque es el número de características transaccionales vigentes del mismo catálogo. Fundamento: Anexo 3, I.i, a).", "ref": "Anexo 3, I.i, a)"}, {"id": "C009", "tema": "mod", "tipo": "memoria", "q": "Según el Anexo 3, ¿cómo debe ser el método con que las Entidades midan los Riesgos de sus Clientes?", "a": "Exhaustivo, y podrá ser estadístico", "o": ["Exhaustivo, y podrá ser estadístico", "Estadístico en todos los casos, con pruebas de bondad de ajuste dentro y fuera de la muestra", "Cualitativo, basado en el criterio experto del personal que atiende directamente al Cliente", "El que la Comisión apruebe expresamente para cada Entidad dentro del plazo que ella establezca"], "x": "El Anexo 3 pide un método exhaustivo, «que podrá ser estadístico»: lo estadístico es una posibilidad, no una obligación. El distractor más tentador es el que lo vuelve obligatorio, porque el propio Anexo sí impone requisitos extra de documentación cuando de hecho se usan modelos estadísticos. Fundamento: Anexo 3, I.ii.", "ref": "Anexo 3, I.ii"}, {"id": "C010", "tema": "mod", "tipo": "trampa", "q": "¿Qué establece el Anexo 3 respecto de los componentes de criterio experto dentro del sistema de clasificación?", "a": "Podrán incorporarse si cuentan con amplia documentación que justifique su consistencia", "o": ["Podrán incorporarse si cuentan con amplia documentación que justifique su consistencia", "Deberán incorporarse en todo caso, junto con la evidencia de la experiencia del personal facultado", "Podrán incorporarse libremente, sin exigencia adicional de documentación ni de justificación", "Están prohibidos, porque la clasificación debe derivar únicamente del resultado del Modelo de Riesgos"], "x": "El verbo es «podrá»: el criterio experto es facultativo, y sólo procede con amplia documentación que justifique su consistencia. Los dos extremos son falsos: ni es obligatorio ni queda libre de documentación. Fundamento: Anexo 3, I.iii.", "ref": "Anexo 3, I.iii"}, {"id": "C011", "tema": "mod", "tipo": "memoria", "q": "Respecto de las invalidaciones de los resultados del proceso de clasificación, ¿qué deben describir las Entidades?", "a": "Los supuestos en que el personal puede invalidarlos, con quién, cómo y en qué medida", "o": ["Los supuestos en que el personal puede invalidarlos, con quién, cómo y en qué medida", "Únicamente el número máximo de invalidaciones permitido por Grado de Riesgo en cada ejercicio anual", "El monto de las Operaciones a partir del cual el Oficial de Cumplimiento puede dejar sin efecto el resultado", "Sólo el nombre del área independiente que valida el Modelo y que autoriza la invalidación correspondiente"], "x": "El Anexo 3 exige describir los supuestos de invalidación especificando quién, cómo y en qué medida se está facultado, y documentarlas en un registro o bitácora que identifique al responsable de aprobarlas y les dé seguimiento. El distractor del área validadora confunde funciones: quien valida el Modelo es independiente de quien lo desarrolló, y eso es otra obligación. Fundamento: Anexo 3, I.iii, b).", "ref": "Anexo 3, I.iii, b)"}, {"id": "C012", "tema": "mod", "tipo": "caso", "q": "Una falla del sistema de Banco Ribera dejó a 400 Clientes sin Grado de Riesgo asignado. El área de riesgos propone dejarlos «pendientes de clasificar» hasta la siguiente corrida semestral. ¿Qué establece el Anexo 3?", "a": "Por ningún motivo pueden tener Clientes sin clasificar", "o": ["Por ningún motivo pueden tener Clientes sin clasificar", "Pueden permanecer sin clasificar hasta por seis meses, siempre que se documente la falla del sistema", "Pueden permanecer sin clasificar si se les asigna provisionalmente el Grado de Riesgo alto por precaución", "Pueden permanecer sin clasificar si el Comité aprueba la excepción y la informa al comité de riesgos"], "x": "La regla es absoluta y no admite plazo, excepción ni aprobación: «Por ningún motivo las Entidades deberán tener Clientes sin clasificar en alguno de los Grados de Riesgo establecidos». El distractor de asignarles alto riesgo provisional suena prudente, pero no está previsto y sigue dejando al Cliente fuera del sistema de clasificación. Fundamento: Anexo 3, I.iii, b).", "ref": "Anexo 3, I.iii, b)"}, {"id": "C013", "tema": "mod", "tipo": "caso", "q": "En el Modelo de Riesgos de Banco Ribera, el 82 % de los Clientes cae en un mismo Grado de Riesgo. ¿Cuándo puede justificarse esa concentración?", "a": "Cuando esos Clientes presenten características homogéneas", "o": ["Cuando esos Clientes presenten características homogéneas", "Cuando el Grado en que se concentran sea el bajo y ninguno de ellos realice transferencias internacionales", "Cuando la Entidad incremente el número de Grados de Riesgo intermedios en el siguiente ejercicio anual", "Cuando el comité de riesgos autorice la concentración y la informe al consejo de administración"], "x": "El Anexo 3 admite concentraciones excesivas únicamente cuando esos Clientes presenten características homogéneas; lo que exige es diferenciación significativa del Riesgo. Abrir más Grados intermedios es tentador porque parece resolver el problema, pero la norma no condiciona la justificación a ello. Fundamento: Anexo 3, I.iii.", "ref": "Anexo 3, I.iii"}, {"id": "C014", "tema": "mod", "tipo": "memoria", "q": "Según el Anexo 3, los criterios de clasificación deben tener claridad y detalle suficientes para que:", "a": "Un tercero comprenda, reproduzca y evalúe la clasificación", "o": ["Un tercero comprenda, reproduzca y evalúe la clasificación", "El Cliente conozca el Grado de Riesgo que le fue asignado y pueda solicitar su modificación", "La Comisión pueda sustituir el Modelo de Riesgos por el modelo homogéneo que ella misma difunda", "El proveedor del modelo quede relevado de documentar la teoría y los supuestos matemáticos empleados"], "x": "El estándar es la reproducibilidad por un tercero: comprender el proceso, replicar la clasificación y evaluar su idoneidad; además, los criterios deben ser consistentes con el documento de la 64ª. El distractor del proveedor es justamente lo contrario: usar un modelo adquirido de un tercero no exime de documentar. Fundamento: Anexo 3, I.iii, a).", "ref": "Anexo 3, I.iii, a)"}, {"id": "C015", "tema": "mod", "tipo": "caso", "q": "Banco Ribera reclasificó al Sr. Arteaga de un Grado de Riesgo menor a uno mayor. Conforme a la 25ª, ¿qué debe ocurrir con él?", "a": "Recabar más información sobre su actividad económica preponderante y supervisar más estrictamente su comportamiento transaccional", "o": ["Recabar más información sobre su actividad económica preponderante y supervisar más estrictamente su comportamiento transaccional", "Dar por terminada la relación comercial dentro de los seis meses siguientes a la reclasificación, previa aprobación del directivo facultado", "Reportar la reclasificación a la Comisión dentro de los primeros 60 días hábiles del año siguiente", "Solicitar la ratificación del nuevo Grado de Riesgo al área que desarrolló el Modelo de Riesgos"], "x": "La 25ª liga el mayor Grado de Riesgo a dos consecuencias: más información sobre la actividad económica preponderante y supervisión más estricta del comportamiento transaccional por el sistema de alertas de la 25ª Quáter. El distractor de los 60 días hábiles es real, pero corresponde a la entrega anual de los resultados del uso del Modelo, no al aviso de una reclasificación individual. Fundamento: 25ª, 1er párr.", "ref": "25ª, 1er párr."}, {"id": "C016", "tema": "mod", "tipo": "memoria", "q": "¿Qué debe establecer el Manual de Cumplimiento respecto de los Clientes que representen un mayor Grado de Riesgo?", "a": "El procedimiento para obtener información adicional y la forma de supervisarlos de manera diferenciada", "o": ["El procedimiento para obtener información adicional y la forma de supervisarlos de manera diferenciada", "El número máximo de Clientes que pueden ser clasificados en el Grado de Riesgo alto por cada sucursal", "La obligación de dar aviso a la Secretaría cada vez que un Cliente cambie de Grado de Riesgo", "El listado nominativo de los Clientes de Grado de Riesgo alto, actualizado cuando menos cada seis meses"], "x": "La 25ª manda establecer en el Manual el procedimiento o mecanismo para obtener la información adicional, especificando qué información se recaba frente a los Clientes de menor Grado, y cómo se hará la supervisión transaccional diferenciada. El listado nominativo tienta porque la 27ª sí obliga a que el Oficial de Cumplimiento conozca a los Clientes de alto riesgo, pero eso es un mecanismo de conocimiento, no un contenido del Manual con esa forma. Fundamento: 25ª, último párr.", "ref": "25ª, último párr."}, {"id": "C017", "tema": "mod", "tipo": "caso", "q": "El sistema de alertas de Banco Ribera aplica los mismos parámetros de monitoreo a personas físicas, morales y Fideicomisos. ¿Qué observación procede conforme a la 25ª Quáter?", "a": "Debe establecer criterios de monitoreo diferenciados para cada uno de esos tipos de Cliente", "o": ["Debe establecer criterios de monitoreo diferenciados para cada uno de esos tipos de Cliente", "Debe aplicar parámetros uniformes y diferenciar únicamente por el Grado de Riesgo asignado al Cliente", "Debe diferenciar los parámetros solamente respecto de los Fideicomisos y de los Clientes no residentes", "Debe sustituir el sistema de alertas por cuestionarios de identificación aplicados cada seis meses"], "x": "La 25ª Quáter exige criterios de monitoreo transaccional diferenciados para Clientes personas físicas, morales o Fideicomisos. El distractor de diferenciar sólo por Grado de Riesgo es tentador porque la 25ª sí manda supervisión más estricta a mayor grado, pero eso no sustituye la diferenciación por tipo de persona. Fundamento: 25ª Quáter, 2º párr.", "ref": "25ª Quáter, 2º párr."}, {"id": "C018", "tema": "mod", "tipo": "caso", "q": "Banco Ribera ENVÍA una transferencia internacional de fondos por instrucción de su Cliente. Para determinar el Grado de Riesgo con la información de las plataformas de la 62ª Quáter, ¿qué debe considerar?", "a": "Sólo la información y documentación del Cliente o Usuario emisor", "o": ["Sólo la información y documentación del Cliente o Usuario emisor", "La información y documentación tanto del emisor como del receptor de la transferencia de que se trate", "Sólo la información del receptor, por ser quien recibe materialmente los recursos transferidos", "La información de todas las Entidades que hayan intervenido en la cadena de pago de la transferencia"], "x": "La 25ª Ter distingue por el papel de la Entidad: si envía, sólo considera al emisor; si recibe, considera a emisor y receptor. El distractor de emisor y receptor es justamente el supuesto contrario, el de la fracción II. Fundamento: 25ª Ter, fr. I.", "ref": "25ª Ter, fr. I"}, {"id": "C019", "tema": "mod", "tipo": "caso", "q": "Ahora Banco Ribera RECIBE una transferencia de fondos internacional a favor de uno de sus Clientes. ¿Qué información debe considerar para determinar el Grado de Riesgo?", "a": "La del emisor y la del receptor de la transferencia", "o": ["La del emisor y la del receptor de la transferencia", "Únicamente la del receptor, por ser el único con quien mantiene una relación comercial vigente", "Únicamente la del emisor, por ser quien originó la Operación objeto de la evaluación de Riesgo", "La del receptor y, en su caso, la del beneficiario final declarado por la Entidad ordenante extranjera"], "x": "Cuando la Entidad recibe, la 25ª Ter manda considerar la información y documentación del Cliente o Usuario emisor y también del receptor. El distractor de «sólo el receptor» es el más tentador porque es con quien existe la relación comercial, pero la norma amplía expresamente el alcance en este supuesto. Fundamento: 25ª Ter, fr. II.", "ref": "25ª Ter, fr. II"}, {"id": "C020", "tema": "mod", "tipo": "memoria", "q": "Conforme a la 25ª Ter, ¿qué información puede excluir la Entidad al determinar el Grado de Riesgo de quienes envían o reciben transferencias?", "a": "La que, conforme a sus metodologías de evaluación de Riesgos, no aporte valor relevante", "o": ["La que, conforme a sus metodologías de evaluación de Riesgos, no aporte valor relevante", "La correspondiente a Usuarios, por no existir con ellos una relación comercial formalizada", "La relativa a transferencias nacionales denominadas en moneda extranjera de bajo monto", "La que provenga de los procesos de intercambio de información del Capítulo XIII de las Disposiciones"], "x": "La 25ª Ter permite excluir aquella información que, conforme a las metodologías de evaluación de Riesgos que la Entidad desarrolle, no aporte valor relevante para la evaluación. El distractor de los Usuarios es falso: respecto de ellos la propia disposición manda evaluar el Riesgo de sus transferencias conforme a políticas y criterios propios. Fundamento: 25ª Ter, 3er párr.", "ref": "25ª Ter, 3er párr."}, {"id": "C021", "tema": "mod", "tipo": "trampa", "q": "¿En qué caso NO están obligadas las Entidades a considerar la información de Geolocalización prevista en la 25ª Bis?", "a": "Cuando se trate de las sociedades, dependencias y entidades del Anexo 1 clasificadas con Grado de Riesgo bajo", "o": ["Cuando se trate de las sociedades, dependencias y entidades del Anexo 1 clasificadas con Grado de Riesgo bajo", "Cuando se trate de cualquier sociedad, dependencia o entidad listada en el Anexo 1, sea cual sea su Grado", "Cuando el Cliente haya abierto la cuenta de forma presencial en una sucursal de la propia Entidad", "Cuando el Cliente sea una persona moral cuyos títulos coticen en alguna bolsa de valores del país"], "x": "La excepción tiene dos condiciones que van juntas: estar en el Anexo 1 y, además, estar clasificado con Grado de Riesgo bajo. El distractor más tentador es el que se queda sólo con el Anexo 1 y borra el requisito del Grado bajo. Fundamento: 25ª Bis, párr. adicionado DOF 28-08-2024.", "ref": "25ª Bis, párr. adicionado 2024"}, {"id": "C022", "tema": "mod", "tipo": "caso", "q": "Una clienta abre su cuenta con Banco Ribera de forma no presencial, en términos de la 4ª Ter. ¿Qué información adicional debe considerar la Entidad para determinar su Grado de Riesgo?", "a": "La Geolocalización del Dispositivo desde el cual abre la cuenta", "o": ["La Geolocalización del Dispositivo desde el cual abre la cuenta", "La certificación de un auditor independiente sobre los controles del proveedor tecnológico utilizado", "El dictamen del área de auditoría interna sobre la validez del expediente integrado a distancia", "La aprobación por escrito de un directivo con facultades específicas para aprobar aperturas remotas"], "x": "La 25ª Bis manda considerar la Geolocalización del Dispositivo tanto en aperturas no presenciales de la 4ª Ter como en Operaciones realizadas a través de Dispositivos. El distractor de la aprobación directiva es real, pero se activa por el Grado de Riesgo alto (27ª), no por el hecho de que la apertura sea remota. Fundamento: 25ª Bis, párr. adicionado DOF 22-03-2019.", "ref": "25ª Bis, párr. de Geolocalización"}, {"id": "C023", "tema": "mod", "tipo": "caso", "q": "Un Cliente de Banco Ribera realiza transferencias con contrapartes ubicadas en una jurisdicción listada por el GAFI. Conforme a la 25ª Bis, ¿cómo incide eso en su Grado de Riesgo?", "a": "La Entidad debe considerar si las Operaciones involucran países o jurisdicciones de la fracción X de la 38ª", "o": ["La Entidad debe considerar si las Operaciones involucran países o jurisdicciones de la fracción X de la 38ª", "La Entidad debe clasificarlo automáticamente en el Grado de Riesgo alto, sin intervención del Modelo", "La Entidad debe abstenerse de considerarlo, por tratarse de un factor propio de la evaluación de la Entidad", "La Entidad debe elevar la consulta a la Comisión dentro del plazo que ésta establezca al efecto"], "x": "La 25ª Bis obliga a considerar, en todos los casos, si las transferencias involucran los países o jurisdicciones de la fracción X de la 38ª. Considerar no es clasificar: el distractor del alto riesgo automático confunde este factor con los tres supuestos de alto riesgo por mandato de la 28ª, donde ese destino no figura. Fundamento: 25ª Bis, párr. adicionado DOF 28-08-2024.", "ref": "25ª Bis, párr. de transferencias"}, {"id": "C024", "tema": "mod", "tipo": "cifra", "q": "¿En cuántas dimensiones, al menos, manda el Anexo 3 considerar al Cliente para identificar sus factores de Riesgo?", "a": "Dos", "o": ["Dos", "Tres", "Cuatro", "Seis"], "x": "El Anexo 3 dice «al menos en las dimensiones siguientes» y enumera dos: características inherentes y características transaccionales. Son un piso, no un techo: el propio Anexo 3, II admite «cualquier otra dimensión de Riesgo definida por la Entidad». El cuatro tienta porque ése es el número de elementos de Riesgo de la evaluación de la propia Entidad (productos y servicios; Clientes y Usuarios; países y áreas geográficas; transacciones y canales), que es otro ejercicio. Fundamento: Anexo 3, I.i.", "ref": "Anexo 3, I.i"}, {"id": "C025", "tema": "mod", "tipo": "cifra", "q": "Tratándose de Instituciones de Tecnología Financiera, ¿cuántas clasificaciones de Grado de Riesgo exige como mínimo su propia normativa para todos sus Clientes?", "a": "Tres: bajo, medio y alto", "o": ["Tres: bajo, medio y alto", "Dos: bajo y alto, más los intermedios que la Institución considere necesarios", "Cuatro: bajo, medio bajo, medio alto y alto, conforme a su metodología de evaluación", "No fija un número mínimo; sólo exige que los grados sean claramente diferenciables entre sí"], "x": "Las DCG de ITF exigen al menos tres clasificaciones —bajo, medio y alto— para todos sus Clientes. El distractor que dice que ITF no fija un número mínimo de grados es precisamente la regla de Bancos: confundir los mínimos entre sectores es el error clásico del examen. Fundamento: DCG ITF, art. 29.", "ref": "DCG ITF, art. 29"}, {"id": "C026", "tema": "mod", "tipo": "cifra", "q": "En las DCG de SOFOMES, ¿cuántos Grados de Riesgo mínimos se exigen según el tipo de Cliente?", "a": "Dos para personas físicas y tres para personas morales y Fideicomisos", "o": ["Dos para personas físicas y tres para personas morales y Fideicomisos", "Tres para personas físicas y dos para personas morales y Fideicomisos, conforme a su metodología", "Tres para todos los Clientes, sin distinguir entre personas físicas, morales y Fideicomisos", "Dos para todos los Clientes, más los Grados intermedios que la sociedad considere necesarios"], "x": "SOFOMES diferencia por tipo de persona: mínimo dos para personas físicas (alto y bajo) y mínimo tres para personas morales y Fideicomisos (alto, medio y bajo). El distractor de «tres para todos» es el mínimo de ITF, no el de SOFOMES. Fundamento: DCG SOFOMES, 21ª.", "ref": "DCG SOFOMES, 21ª"}, {"id": "C027", "tema": "mod", "tipo": "trampa", "q": "¿Cuál de los siguientes NO es una característica inherente del Client
