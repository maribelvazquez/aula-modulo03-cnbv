<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="App de estudio de la Evaluación Nacional de Riesgos de LD/FT 2023 de México: mapa mental, los 37 factores con sus niveles, Modo recitar, trampas de examen, cifras y simulador de reactivos.">
<title>Mapa de la Evaluación Nacional de Riesgos 2023</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}

.qactions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accion);color:var(--accion-ink);text-decoration:none;display:inline-block}

.score .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.trows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.trow2{display:grid;grid-template-columns:minmax(0,300px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.trow2 .tb{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow2 .tb i{display:block;height:100%;background:var(--principal-linea)}
.trow2 .tv{font-variant-numeric:tabular-nums;font-weight:700}
.miss{margin-top:16px;background:var(--surface-2);border-radius:12px;padding:12px 16px}
.miss summary{cursor:pointer}
.miss ul{margin:6px 0 0;padding-left:18px} .miss li{margin:8px 0}
.siminfo{font-size:13px;color:var(--muted);margin:12px 0 0}
/* repaso (tandas al azar o secuencia fija) */
.para{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--accion);border-radius:12px;padding:12px 16px;margin:-4px 0 18px;font-size:17px;font-weight:600;max-width:1040px}.para b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accion);margin-bottom:2px}
.tu{margin:10px 0;background:var(--surface);border:2px solid var(--negro);border-left:8px solid var(--coral);border-radius:10px;padding:10px 14px;font-size:16px}.tu b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.dist{margin-top:12px;font-weight:500;font-size:15px}.dist ul{margin:4px 0 0;padding-left:0;list-style:none}.dist li{margin:5px 0;padding-left:26px;text-indent:-26px}.dist li b{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;text-indent:0;margin-right:6px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-display);font-size:12px;background:var(--surface)}
.rp-fallas{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.rp-fallas h3{font-size:18px}
.rp-fallas p{font-size:14.5px}
.rp-box{scroll-margin-top:90px}
.rp-box .qtext{font-size:clamp(22px,2.8vw,34px)}
.rp-box .opt{font-size:17px}
.rp-clave{margin-top:12px;border-left:6px solid var(--principal-linea);background:var(--surface-2);border-radius:8px;padding:10px 14px;font-weight:600}
.rp-clave .lbl{margin-bottom:4px}
.rp-fin{margin:10px 0 0;padding-left:22px;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,26px);line-height:1.35}
.rp-fin li{margin:10px 0}
.rp-fin small{display:block;font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--muted)}
.rp-box:fullscreen{max-width:none;border-radius:0;border:0;padding:40px 6vw;overflow:auto;background:var(--bg)}
.rp-box:fullscreen .qtext{font-size:clamp(26px,3vw,42px)}
.rp-box:fullscreen .opt{font-size:20px}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(27,27,30,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{padding:20px 22px 18px;background:var(--c);color:var(--ci);display:flex;justify-content:space-between;gap:12px;align-items:center}
.dhead h3{font-size:28px;font-weight:700;color:inherit}
.dhead .x{background:rgba(255,255,255,.25);border:0;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:inherit;flex:none}
.dbody{padding:16px 22px 30px;overflow:auto}
.dbody ul{padding-left:18px;margin:0}
.dbody li{margin:8px 0}
.dbody .hook{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 12px}

footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:4px solid var(--membrete);padding-top:14px}
footer b{color:var(--ink)}

@media (max-width:1100px){.track{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:18px}.track::before{display:none}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}

  .flow{flex-direction:column}

  .stepd{grid-template-columns:1fr}

  .track{grid-template-columns:repeat(3,minmax(0,1fr))}
  .frac .inc{padding-left:16px}
}
@media (max-width:600px){ .chant p span{white-space:normal} .trow2{grid-template-columns:1fr auto}.trow2 .tb{grid-column:1/-1;order:3} }
@media (max-width:520px){ .rhythm{flex-wrap:wrap} .rh{flex:1 1 40%} }
.printhead{display:none}
/* franja del sitio (modo sitio: sólo si datos.sitio existe) */
.sitebar{display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:8px 16px;background:var(--negro);color:#fff;overflow-x:auto;scrollbar-width:none;font-family:var(--f-display);font-size:13px}
.sitebar::-webkit-scrollbar{display:none}
.sitebar .sb-mod{font-weight:700;letter-spacing:.04em;white-space:nowrap;margin-right:4px;color:#fff;text-decoration:none}

.sitebar a.sb-p:hover{border-color:#fff}
.sitebar .sb-p[aria-current="page"]{background:var(--principal);border-color:var(--principal);color:var(--principal-ink)}
.sitebar .sb-p.off{opacity:.45;border-style:dashed;cursor:not-allowed}
.sitebar .sb-sep{width:1px;height:20px;background:rgba(255,255,255,.3);flex:none}
.sitebar .sb-cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.sitebar .sb-ses{white-space:nowrap;color:rgba(255,255,255,.8);margin-left:auto;padding-left:12px;font-weight:600}

@media print{
  body{background:#fff;padding:0}
  .sitebar,.top,.hero,.traps,section.block:not(.sim),footer,.simbar,.modes,.sim > .lbl,.sim .sec-head,.qactions,.siminfo,.drawer,.scrim{display:none!important}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

es (suman) y mitigantes (restan) (V.3).", "Los tres factores emergentes también se miden como amenazas (V.3; XI.6)."]}, {"etiqueta": "V.3", "nombre": "Vulnerabilidades", "sub": "Facilitación × explotación", "verbo": "Facilita", "desc": "Se califican con el binomio grado de facilitación y probabilidad de explotación. Las del régimen, las de LD y las de FT usan la misma regla.", "orden": 4, "panel": "Cómo se mide una vulnerabilidad", "ir": "#medicion", "puntos": ["Para las vulnerabilidades se usa el binomio «probabilidad de explotación» y «grado de facilitación» (V.3).", "Para ambas (amenazas y vulnerabilidades): cada elemento se califica del 1 al 5 y el resultado se ajusta a un intervalo de 0 a 9 (V.3).", "Niveles de cada dimensión, también en ambas: 0 a 3 Bajo · 3 a 6 Medio · 6 a 9 Alto (V.3).", "Fuente metodológica: Guía del GAFI sobre la Evaluación Nacional de Riesgos de LD y FT, febrero de 2013 (V)."]}]}, {"letra": "3", "titulo": "Los 37 factores · apartados VI a X", "pregunta": "¿Qué se encontró?", "ritmo": "12 · 13 · 6 · 3 · 3", "corto": "Factores", "color": "principal", "items": [{"etiqueta": "12", "nombre": "Vulnerabilidades del régimen PLD/CFT", "sub": "Apartado VI · 12 vulnerabilidades", "verbo": "Fallo", "desc": "Doce huecos del propio sistema antilavado: leyes, reportes, EBR, supervisión y beneficiario final. Todas son vulnerabilidades; ninguna es amenaza.", "orden": 5, "panel": "Rubro 1 · Régimen PLD/CFT", "ir": "#factores", "destacado": false, "puntos": ["Factores 1 a 12, todos vulnerabilidades (XI.2).", "El más alto: Debilidad en el Marco Jurídico de AV (#1), facilitación Alta y explotación Media.", "El único en BAJO/BAJO de toda la ENR: Debilidad en el Marco Jurídico del SF (#2).", "Su valoración entra en las cuatro ecuaciones de la conclusión nacional (y, por tanto, en los seis riesgos finales): 0.1 en LD y FT, 0.2 en FPADM y en cada emergente (XI.7)."]}, {"etiqueta": "13", "nombre": "Lavado de dinero", "sub": "Apartado VII · 3 amenazas + 10 vulnerabilidades", "verbo": "Lavo", "desc": "Tres amenazas (delincuencia organizada, recursos ilícitos y corrupción) y diez vulnerabilidades. Aquí están seis de los ocho factores en ALTO/ALTO.", "orden": 6, "panel": "Rubro 2 · Lavado de dinero", "ir": "#factores", "destacado": true, "puntos": ["Amenazas (13–15), las tres en ALTO/ALTO: delincuencia organizada, volumen de recursos ilícitos generados en México y corrupción (XI.3).", "Vulnerabilidades en ALTO/ALTO: contratación pública (#18), controles transfronterizos en puertos (#23) e impartición de justicia (#24) (XI.3).", "Cultura constitucional (#16): facilitación Alta, explotación Media. Infraestructuras de los mercados financieros (#21): Medio/Bajo.", "Nuevas en 2023 (II): cultura constitucional y contratación pública, que la ENR llama «dos nuevas vulnerabilidades de lavado de dinero». Comercio electrónico aparece en la lista de nuevos factores, pero el mismo apartado lo presenta como «un análisis más detallado» del fraude cibernético."]}, {"etiqueta": "6", "nombre": "Financiamiento al terrorismo", "sub": "Apartado VIII · 3 amenazas + 3 vulnerabilidades", "verbo": "Financio", "desc": "Tres amenazas con probabilidad baja y tres vulnerabilidades. La porosidad de las fronteras es el único factor de FT en ALTO/ALTO.", "orden": 7, "panel": "Rubro 3 · Financiamiento al terrorismo", "ir": "#factores", "puntos": ["Amenazas (26–28): las tres con probabilidad de ocurrencia Baja; impacto Alto en #26 y #28, Medio en #27 (XI.4).", "Vulnerabilidades (29–31): porosidad de fronteras Alto/Alto; capacitación de los SO Medio/Medio; OSFL Medio/Bajo (XI.4).", "Riesgo integral de FT: Bajo (XI.7)."]}, {"etiqueta": "3", "nombre": "Financiamiento a la proliferación de ADM", "sub": "Apartado IX · 3 amenazas", "verbo": "Prolifero", "desc": "Sólo tres amenazas, todas con impacto alto. Su probabilidad es baja, salvo la falta de un sistema de respuesta ante un ataque, que es media.", "orden": 8, "panel": "Rubro 4 · FPADM", "ir": "#factores", "puntos": ["Factores 32 a 34, sólo amenazas: no hay «vulnerabilidades de FPADM» (IX; XI.5).", "En su riesgo final, el 0.2 que no ponen las amenazas lo pone la valoración de las vulnerabilidades del régimen (XI.7).", "Riesgo integral de FPADM: Bajo (XI.7)."]}, {"etiqueta": "3", "nombre": "Factores emergentes", "sub": "Apartado X · 3 amenazas", "verbo": "Emerjo", "desc": "Sólo amenazas: activos virtuales, ransomware y COVID-19. El ransomware está en ALTO/ALTO y, aun así, su riesgo integral es medio.", "orden": 9, "panel": "Rubro 5 · Factores emergentes", "ir": "#factores", "puntos": ["Factores 35 a 37, los tres amenazas (V.3: «amenazas emergentes»; X; XI.6).", "Activos virtuales y ransomware son nuevos en la ENR 2023 (II).", "Riesgo integral: activos virtuales Medio, ransomware Medio y COVID-19 Bajo (XI.7)."]}]}, {"letra": "4", "titulo": "Evaluación integral y plan · XI y XII", "pregunta": "¿Y el veredicto?", "ritmo": "2 cierres", "corto": "Veredicto", "color": "negro", "items": [{"etiqueta": "XI.7", "nombre": "Conclusión nacional", "sub": "6 riesgos finales", "verbo": "Califico", "desc": "El lavado de dinero queda en Medio-Alto; FT y FPADM, en Bajo; activos virtuales y ransomware, en Medio; y la pandemia de COVID-19, en Bajo.", "orden": 10, "panel": "Conclusión nacional", "ir": "#veredicto", "puntos": ["Valoración de cada factor = (1/9) × (impacto × ocurrencia) o (1/9) × (facilitación × explotación) (XI.7).", "La valoración agregada de un grupo es el promedio aritmético de sus factores (XI.7).", "LD y FT = 0.8 amenazas + 0.1 vulnerabilidades propias + 0.1 vulnerabilidades del régimen (XI.7).", "FPADM y cada emergente = 0.8 amenazas + 0.2 vulnerabilidades del régimen (XI.7).", "Escala: 0–3 Bajo · 3–5 Medio · 5–7 Medio-Alto · 7–9 Alto (XI.7)."]}, {"etiqueta": "XII", "nombre": "Plan de Acción Preliminar", "sub": "Propuestas por factor", "verbo": "Mitigo", "desc": "Propuestas preliminares de prevención y mitigación por factor, para reasignar recursos y aplicar medidas intensificadas o simplificadas según el riesgo.", "orden": 11, "panel": "Plan de Acción Preliminar", "ir": "#regimen", "puntos": ["Finalidad: encaminar la reasignación de recursos hacia lo que requiere mayor atención y generar medidas intensificadas y simplificadas según el nivel de riesgo (XII).", "Ejemplos: continuar la Certificación de la UIF para quienes realizan AV; actualizar las DCG del art. 60 de la Ley Orgánica de la Financiera Nacional de Desarrollo Agropecuario, Rural, Forestal y Pesquero, sin cambios desde el 2-abr-2015; revisar las reglas de envío de reportes modificatorios y extemporáneos (XII)."]}]}], "frase": {"titulo": "Para recitar en voz alta: una pregunta, un verbo", "html": "<span>¿Quién? Reporto · Aviso.<\/span> <span>¿Cómo? Ocurre · Facilita.<\/span> <span>¿Qué? Fallo · Lavo · Financio · Prolifero · Emerjo.<\/span> <span>¿Veredicto? Califico · Mitigo.<\/span>"}}, {"tipo": "mapa", "id": "factores", "nav": "Los 37 factores", "titulo": "Los 37 factores: 12 · 13 · 6 · 3 · 3", "intro": "Cada ficha trae el número oficial del factor, si es amenaza o vulnerabilidad, y sus dos grados. FPADM y emergentes van del mismo color porque comparten la regla: <b>sólo traen amenazas<\/b>. En 2016 y 2020 la ENR tenía 26 factores; en 2023 son 37 (II).", "centro": {"t": "37 factores", "s": "Mapas de riesgo<br>XI.2 a XI.6"}, "ramas": [{"letra": "12", "titulo": "Régimen PLD/CFT", "pregunta": "¿Qué falla en casa? Sólo vulnerabilidades", "corto": "Régimen", "estilo": "ficha", "color": "negro", "items": [{"etiqueta": "1", "nombre": "Debilidad en el Marco Jurídico de AV", "gancho": "Vulnerabilidad · facilitación Alto · explotación Medio", "conteo": "Alto / Medio", "puntos": ["La iniciativa de reforma a la LFPIORPI presentada en el Senado el 7-feb-2019 sigue sin aprobarse: FT, PEP, EBR, beneficiario final, operaciones sospechosas, capacitación, auditoría, OSFL y fideicomisos (VI.1).", "La no aprobación de leyes o decretos del régimen se considera, en sí misma, un factor de riesgo (VI.1)."]}, {"etiqueta": "2", "nombre": "Debilidad en el Marco Jurídico del SF", "gancho": "Vulnerabilidad · facilitación Bajo · explotación Bajo", "conteo": "Bajo / Bajo", "puntos": ["La SHCP emite las DCG por medio de la UBD, la UBVA y la USPSS, con opinión de la UIF y los supervisores (VI.2).", "Reforma a la LIC del 11-mar-2022: garantía de audiencia de las personas incluidas en la Lista de Personas Bloqueadas (art. 116 Bis 2) (VI.2).", "Es el único factor de toda la ENR en BAJO/BAJO.", "El Plan de Acción (XII) propone, para fortalecer este factor, actualizar las DCG del art. 60 de la Ley Orgánica de la Financiera Nacional de Desarrollo Agropecuario, Rural, Forestal y Pesquero, sin cambios desde el 2-abr-2015 (XII)."]}, {"etiqueta": "3", "nombre": "Deficiencias en los sistemas de monitoreo y alertamiento de la UIF", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["La UIF recibe ocho tipos de reportes: ROR, ROI, ROIP, FTI, FDE, CHC, MT y avisos de AV (VI.3).", "Los reportes no traen un campo que identifique los de 24 horas, y en el formato F41 no se pueden enviar reportes modificatorios (VI.3).", "Mitigante: Modelo de riesgo de incumplimiento (MORI), actualizado trimestralmente desde junio de 2019, para apoyar el Programa Anual de Supervisión de la CNBV (VI.3)."]}, {"etiqueta": "4", "nombre": "Deficiencias en el Diseño del Aviso y Reporte conforme a Estándares Internacionales", "gancho": "Vulnerabilidad · facilitación Medio · explotación Bajo", "conteo": "Medio / Bajo", "puntos": ["Los layouts cumplen estándares, pero el campo «cuenta» se llena indistintamente con cuenta, contrato, tarjeta, folio, póliza, etc. (VI.4).", "Propuesta: corregir el diseño, pasar de TXT a XML y elaborar formatos oficiales pendientes como FTI y FDE (VI.4)."]}, {"etiqueta": "5", "nombre": "Insuficiente obligatoriedad de la normativa para implementar un EBR por parte de los SO de SF", "gancho": "Vulnerabilidad · facilitación Medio · explotación Bajo", "conteo": "Medio / Bajo", "puntos": ["Reforma a las DCG del art. 115 LIC del 24-feb-2017: Capítulo II Bis, Enfoque Basado en Riesgo (VI.5).", "Los sectores supervisados por la CNBV están obligados a contar con EBR, salvo la Financiera Nacional de Desarrollo Agropecuario, Rural, Forestal y Pesquero (VI.5).", "Seguros, Fianzas y Afores: no hay obligatoriedad, aunque la mayoría ya aplica un EBR (VI.5)."]}, {"etiqueta": "6", "nombre": "Insuficiente obligatoriedad de la normativa para implementar un EBR por parte de los SO de AV", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["Para AV sólo existe la posibilidad de medidas simplificadas de identificación con clientes de bajo riesgo (art. 19 LFPIORPI, art. 15 de su Reglamento y art. 17 de las RCG) (VI.6).", "No es obligatoria una evaluación de riesgos integral; aun así, la mayoría de quienes realizan AV ya la hace (VI.6)."]}, {"etiqueta": "7", "nombre": "Deficiente maduración de los modelos de riesgo de los supervisores de SF para implementar un EBR", "gancho": "Vulnerabilidad · facilitación Medio · explotación Bajo", "conteo": "Medio / Bajo", "puntos": ["CNBV, CNSF y CONSAR tienen matrices de riesgo por sector y programas anuales de supervisión con EBR (VI.7).", "La CNBV tiene un EBR «altamente desarrollado»; en 2020 ajustó su Matriz CEFER. Falta personal para supervisión in situ (VI.7)."]}, {"etiqueta": "8", "nombre": "Deficiente maduración de los modelos de riesgo de los supervisores de AV para implementar un EBR", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["El SAT usa una «Matriz de cálculo de Sujetos Obligados que realizan AV» (VI.8).", "Pasó de dos indicadores (nivel de cumplimiento y facturación) a cinco desde 2019: zona geográfica, tipo de cliente, servicios, pagos e intensificadores (VI.8)."]}, {"etiqueta": "9", "nombre": "Deficiente información sobre las Estructuras Jurídicas", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["La sociedad anónima es más susceptible de uso ilícito que la de responsabilidad limitada, por la transmisión de acciones y la facilidad de cubrir el capital social (VI.9).", "La UIF consulta el Registro Público de Comercio por sujeto, vía SIGER; trabaja con el SAT y la PFF sobre EFOS y EDOS (VI.9).", "Ya existía como capítulo en la ENR 2020; en la ENR 2023 se incluye como vulnerabilidad del régimen y se evalúa a detalle (II)."]}, {"etiqueta": "10", "nombre": "Deficiente información sobre el Beneficiario Final", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["Vulnerabilidades: falta de homologación del término en las distintas normas, base del RPC incompleta, ROI con campos de texto libre y uso de cuentas «mulas» (VI.10).", "La LFPIORPI habla de «beneficiario controlador» y las DCG del art. 115 LIC de «propietario real» (VI.10).", "Ya existía como capítulo en la ENR 2020; en la ENR 2023 se incluye como vulnerabilidad del régimen y se evalúa a detalle (II)."]}, {"etiqueta": "11", "nombre": "Deficiente coordinación efectiva entre autoridades para el intercambio de información", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["Para diseñar el PAS de la CNBV de los sectores tradicionales se pide información a UIF, CNSF, CONSAR, BANXICO y FGR; sólo responden UIF, CNSF y CONSAR (VI.11).", "11-feb-2021: bases del grupo de trabajo de homologación de criterios en supervisión; después, la UIF y la CNBV propusieron incorporar al grupo en la Estrategia Nacional para crear la Estrategia Nacional de Supervisión (ENS) (VI.11)."]}, {"etiqueta": "12", "nombre": "Debilidad del sistema Supervisor y Sancionador", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["Supervisoras: CONSAR, CNBV y CNSF para entidades financieras; SAT para AV (VI.12).", "SF in situ: criterios específicos, visita de inspección ordinaria, vigilancia reforzada y vigilancia reforzada específica. Extra situ: el informe de auditoría anual (VI.12).", "El SAT hace supervisión extra situ a sujetos de riesgo bajo–medio y visitas in situ a los de mayor riesgo (VI.12)."]}]}, {"letra": "13", "titulo": "Lavado de dinero", "pregunta": "3 amenazas + 10 vulnerabilidades", "corto": "LD", "estilo": "ficha", "color": "principal", "items": [{"etiqueta": "13", "nombre": "Aumento de la Delincuencia Organizada", "gancho": "Amenaza · impacto Alto · ocurrencia Alto", "conteo": "Alto / Alto", "puntos": ["Se identificaron 46 organizaciones operando en el país en 2020 y en 2021 (VII.13).", "El delito precedente que más reportes genera es el narcotráfico (VII.13).", "Consecuencias sociales, políticas, financieras y económicas: todas Alto (tabla de VII.13)."]}, {"etiqueta": "14", "nombre": "Incremento del volumen de recursos ilícitos generados en México", "gancho": "Amenaza · impacto Alto · ocurrencia Alto", "conteo": "Alto / Alto", "puntos": ["México no tiene una metodología establecida para medir con precisión el volumen de recursos ilícitos (VII.14).", "Se usaron fuentes oficiales (aseguramientos de FGR, decomisos del CJF, querellas de la PFF, INDEP y montos bloqueados por la UIF) sobre las 21 categorías de delitos determinantes del GAFI (VII.14).", "Monto aproximado 2019–2021: $43,943,618,028.01; no se recomienda sumarlo por posibles duplicidades (VII.14)."]}, {"etiqueta": "15", "nombre": "Aumento de la corrupción", "gancho": "Amenaza · impacto Alto · ocurrencia Alto", "conteo": "Alto / Alto", "puntos": ["Las tasas más altas de corrupción se dan en el contacto con autoridades de seguridad pública (VII.15).", "Peculado y uso ilícito de atribuciones son los delitos más imputados (FEMCC); México no ha sancionado ningún caso de cohecho internacional (VII.15).", "La UIF emitió en 2022 una guía sobre ORPI derivadas del cohecho internacional (VII.15)."]}, {"etiqueta": "16", "nombre": "Deficiente Cultura Constitucional", "gancho": "Vulnerabilidad · facilitación Alto · explotación Medio", "conteo": "Alto / Medio", "puntos": ["Nuevo sistema de jurisprudencia (reforma constitucional publicada el 11-mar-2021): precedentes obligatorios del Pleno de la SCJN por 8 votos y de las Salas por 4 (VII.16).", "Factor nuevo en la ENR 2023 (II)."]}, {"etiqueta": "17", "nombre": "Debilidad regulatoria del Comercio Electrónico", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["La CONDUSEF identifica tipologías como uso indebido de tarjetas, phishing, pharming, spoofing y carding (VII.17).", "El mayor número de reclamaciones se ubica en montos menores a 100 mil pesos (VII.17).", "Ojo: es vulnerabilidad de LD, no factor emergente.", "La lista de nuevos factores de II lo incluye, pero el texto del mismo apartado sólo habla de «un análisis más detallado» del fraude cibernético en comercio electrónico (II)."]}, {"etiqueta": "18", "nombre": "Debilidad en los procesos de contratación pública de bienes y servicios", "gancho": "Vulnerabilidad · facilitación Alto · explotación Alto", "conteo": "Alto / Alto", "puntos": ["La SHCP y la SFP son globalizadoras y reguladoras de las adquisiciones; todas las autoridades son ejecutoras (VII.18).", "Mecanismos de la SFP: órganos internos de control, BESOP, BESA y testigos sociales (VII.18).", "Factor nuevo en la ENR 2023 (II)."]}, {"etiqueta": "19", "nombre": "Aumento de la economía informal", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["Cuarto trimestre de 2021: 31.6 millones de personas en ocupación informal (55.8 %) y 25.0 millones en la formal (44.2 %) (VII.19)."]}, {"etiqueta": "20", "nombre": "Incremento en las operaciones en efectivo en moneda nacional", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["Según la ENIF, el efectivo es el medio de pago más usado para compras (VII.20).", "Existen restricciones al uso de efectivo en la LFPIORPI (VII.20)."]}, {"etiqueta": "21", "nombre": "Deficiencias en las infraestructuras de los mercados financieros", "gancho": "Vulnerabilidad · facilitación Medio · explotación Bajo", "conteo": "Medio / Bajo", "puntos": ["El SPEI es la infraestructura de importancia sistémica; las IdMF están reguladas o supervisadas por BANXICO (VII.21).", "Aunque hay exposición, se considera un «factor controlado» (VII.21)."]}, {"etiqueta": "22", "nombre": "Incremento en las operaciones en dólares de los EE. UU. y otras divisas", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["En 2010 la SHCP modificó las DCG para limitar la captación de dólares en efectivo (VII.22).", "Remesas 2021: cerca del 4 % del PIB; las transferencias electrónicas son cerca del 99 % del total (VII.22)."]}, {"etiqueta": "23", "nombre": "Deficientes controles en los movimientos transfronterizos en puertos de entrada y salida internacional", "gancho": "Vulnerabilidad · facilitación Alto · explotación Alto", "conteo": "Alto / Alto", "puntos": ["La ANAM identifica que el LD en comercio exterior se hace sobre todo con fraude de facturas y modificación de documentos de respaldo (VII.23).", "Lavado basado en comercio (TBML) y en servicios (SBML) (VII.23)."]}, {"etiqueta": "24", "nombre": "Deficiente impartición de justicia", "gancho": "Vulnerabilidad · facilitación Alto · explotación Alto", "conteo": "Alto / Alto", "puntos": ["Del total de resoluciones sobre ORPI dictadas en 2019–2021, el 84 % fueron condenatorias (VII.24).", "Las tesis 2a./J. 46/2018 y 2a./J. 87/2019 limitan las atribuciones de la UIF sobre el bloqueo de cuentas (VII.24)."]}, {"etiqueta": "25", "nombre": "Debilidad regulatoria de las Instituciones de Tecnología Financiera", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["LRITF del 9-mar-2018; DCG del art. 58 LRITF publicadas el 10-sep-2018 (VII.25).", "El marco PLD/CFT de las ITF descansa por completo en conocimiento del cliente no presencial (VII.25).", "Riesgo señalado: delincuentes que se ostentan como ITF sin autorización, como los montadeudas (VII.25)."]}]}, {"letra": "6", "titulo": "Financiamiento al terrorismo", "pregunta": "3 amenazas + 3 vulnerabilidades", "corto": "FT", "estilo": "ficha", "color": "morado", "items": [{"etiqueta": "26", "nombre": "Existencia de grupos terroristas nacionales o internacionales en México", "gancho": "Amenaza · impacto Alto · ocurrencia Bajo", "conteo": "Alto / Bajo", "puntos": ["No hay indicios de presencia de organizaciones terroristas en el país; los casos han sido aislados, retóricos y aspiracionales (VIII.26).", "Foco de atención: radicalización por internet y «lobos solitarios» (VIII.26)."]}, {"etiqueta": "27", "nombre": "Generación de recursos de origen nacional encaminados a grupos terroristas", "gancho": "Amenaza · impacto Medio · ocurrencia Bajo", "conteo": "Medio / Bajo", "puntos": ["Hasta el momento no se ha identificado ninguna operación asociada al FT (VIII.27).", "La UIF emitió el 7-dic-2020 una guía para combatir el FT (VIII.27).", "Es la única amenaza de FT con impacto Medio."]}, {"etiqueta": "28", "nombre": "Existencia de grupos terroristas de nacionalidad mexicana en el extranjero", "gancho": "Amenaza · impacto Alto · ocurrencia Bajo", "conteo": "Alto / Bajo", "puntos": ["No se conoce la movilización de mexicanos reclutados o radicalizados, pero existen redes de reclutamiento en internet para hispanohablantes (VIII.28).", "Los blancos identificados se inscriben en las alertas del INM (VIII.28)."]}, {"etiqueta": "29", "nombre": "Endebles controles ante la posición geográfica y porosidad de las fronteras", "gancho": "Vulnerabilidad · facilitación Alto · explotación Alto", "conteo": "Alto / Alto", "puntos": ["Más de 3,000 km de frontera terrestre con Estados Unidos (VIII.29).", "Cerca del 90 % de los migrantes irregulares con destino a Estados Unidos cruza el territorio nacional (VIII.29).", "Es el único factor de FT en ALTO/ALTO."]}, {"etiqueta": "30", "nombre": "Deficiente conocimiento y capacitación de los SO sobre temas de FT", "gancho": "Vulnerabilidad · facilitación Medio · explotación Medio", "conteo": "Medio / Medio", "puntos": ["Lo detectó la supervisión de la CNBV en 2019, 2020 y 2021 (VIII.30)."]}, {"etiqueta": "31", "nombre": "Incremento de la posibilidad de las OSFL de cometer actos de FT", "gancho": "Vulnerabilidad · facilitación Medio · explotación Bajo", "conteo": "Medio / Bajo", "puntos": ["La UIF emitió en 2020 la Guía para Combatir el FT aplicable a las OSFL (VIII.31).", "Matriz de riesgo de FT de la UIF: 2 OSFL en riesgo Medio, 8 en Medio-Bajo y 5,957 en Bajo, «el 99.93 %» según la ENR (porcentaje tal como lo publica la ENR) (VIII.31)."]}]}, {"letra": "3", "titulo": "FPADM", "pregunta": "Sólo amenazas", "corto": "FPADM", "estilo": "ficha", "color": "turquesa", "items": [{"etiqueta": "32", "nombre": "Desarrollo de ADM dentro del territorio nacional", "gancho": "Amenaza · impacto Alto · ocurrencia Bajo", "conteo": "Alto / Bajo", "puntos": ["México tiene industria que usa material precursor, pero no programas de ADM ni intereses bélicos (IX.32).", "Es parte de la Organización para la Prohibición de las Armas Químicas, del Grupo Australia y del Grupo de Suministradores Nucleares (IX.32)."]}, {"etiqueta": "33", "nombre": "Incremento al financiamiento al desarrollo de ADM desde el territorio nacional", "gancho": "Amenaza · impacto Alto · ocurrencia Bajo", "conteo": "Alto / Bajo", "puntos": ["Las fuentes de financiamiento pueden ser nacionales o internacionales, directas o encubiertas con empresas fachada (IX.33).", "México cuenta con el CANDESTI, que entre sus objetivos tiene prevenir el financiamiento al desarrollo de ADM (IX.33)."]}, {"etiqueta": "34", "nombre": "Deficiente desarrollo e implementación de un sistema de respuesta en caso de un ataque con ADM", "gancho": "Amenaza · impacto Alto · ocurrencia Medio", "conteo": "Alto / Medio", "puntos": ["El principal riesgo nacional es el desvío de insumos de uso dual desde la industria civil (IX.34).", "Por eso se ha retrasado la implementación de un sistema de respuesta completo (IX.34).", "Es la única amenaza de FPADM con probabilidad Media."]}]}, {"letra": "3", "titulo": "Factores emergentes", "pregunta": "Sólo amenazas", "corto": "Emergentes", "estilo": "ficha", "color": "turquesa", "items": [{"etiqueta": "35", "nombre": "Debilidad regulatoria de los Activos Virtuales", "gancho": "Amenaza · impacto Alto · ocurrencia Medio", "conteo": "Alto / Medio", "puntos": ["BANXICO, con las demás autoridades, ha determinado mantener una separación entre los activos virtuales y el sistema financiero nacional (X.35).", "Recalificación de 2021 en la Recomendación 15 del GAFI; las autoridades analizan la Regla de Viaje (X.35).", "Es amenaza emergente, no vulnerabilidad, aunque su nombre diga «debilidad».", "Factor nuevo en la ENR 2023, como factor emergente (II)."]}, {"etiqueta": "36", "nombre": "Incremento de los ataques de Ransomware", "gancho": "Amenaza · impacto Alto · ocurrencia Alto", "conteo": "Alto / Alto", "puntos": ["Según la FGR, el delito creció cerca de 400 % en 2021; el rescate se paga a menudo con activos virtuales (X.36).", "Bases de Coordinación en Materia de Seguridad de la Información (2018) y Grupo de Respuesta a Incidentes (X.36).", "Está en ALTO/ALTO como factor, pero su riesgo integral es Medio (XI.7).", "Factor nuevo en la ENR 2023, como factor emergente (II)."]}, {"etiqueta": "37", "nombre": "Endebles controles de los efectos derivados de la pandemia de COVID-19", "gancho": "Amenaza · impacto Medio · ocurrencia Medio", "conteo": "Medio / Medio", "puntos": ["La pandemia aceleró el uso de tecnologías y con ello el fraude y el delito cibernético (X.37).", "Su riesgo integral es Bajo (XI.7)."]}]}], "frase": {"titulo": "El ritmo de los 37", "html": "<b>12 · 13 · 6 · 3 · 3<\/b> — régimen, lavado, terrorismo, proliferación y emergentes.<br>Ocho en ALTO/ALTO: <b>13, 14, 15<\/b> (amenazas LD) · <b>18, 23, 24<\/b> (vulnerabilidades LD) · <b>29<\/b> (fronteras) · <b>36<\/b> (ransomware)."}}, {"tipo": "tarjetas", "id": "medicion", "nav": "Cómo se mide", "titulo": "Amenaza contra vulnerabilidad: dos binomios", "intro": "La columna de la tabla te dice qué es cada factor: si trae impacto y ocurrencia, es amenaza; si trae facilitación y explotación, es vulnerabilidad (V.3 y XI.2 a XI.6).", "tarjetas": [{"encabezado": true, "color": "morado", "titulo": "Amenazas", "subtitulo": "V.3 · 12 factores", "filas": [{"k": "Dimensiones", "v": "<b>Grado de impacto<\/b> × <b>probabilidad de ocurrencia<\/b>."}, {"k": "Impacto", "v": "Consecuencias sociales, políticas, financieras y económicas, con una tabla al final de cada amenaza. El impacto resultante no es la mayoría de las cuatro consecuencias."}, {"k": "Cuáles", "v": "3 de LD (13–15), 3 de FT (26–28), 3 de FPADM (32–34) y los 3 emergentes (35–37)."}]}, {"encabezado": true, "color": "turquesa", "titulo": "Vulnerabilidades", "subtitulo": "V.3 · 25 factores", "filas": [{"k": "Dimensiones", "v": "<b>Grado de facilitación<\/b> × <b>probabilidad de explotación<\/b>."}, {"k": "Elementos", "v": "La misma tabla de elementos sirve para el grado de impacto y el de facilitación: ¿impacta de forma directa?, ¿es de largo plazo?, ¿afecta al SF?, ¿a las AV?, entre otros."}, {"k": "Cuáles", "v": "Las 12 del régimen (1–12), 10 de LD (16–25) y 3 de FT (29–31)."}]}, {"barra": true, "color": "principal", "titulo": "Cómo se califica cada dimensión", "ref": "V.3", "html": "Cada elemento recibe un valor de <b>1 a 5<\/b>. Se agregan de forma ponderada y el resultado se ajusta a un intervalo de <b>0 a 9<\/b>: 0–3 Bajo · 3–6 Medio · 6–9 Alto. En la probabilidad, los <b>intensificadores suman<\/b> y los <b>mitigantes restan<\/b>."}, {"barra": true, "color": "negro", "titulo": "Cómo se valora cada factor", "ref": "XI.7", "html": "Valoración = <b>(1/9) × (impacto × ocurrencia)<\/b> para amenazas, o <b>(1/9) × (facilitación × explotación)<\/b> para vulnerabilidades. Se divide entre 9 para que el producto vuelva al intervalo de 0 a 9."}], "nota": "Conteo: <b>12 amenazas<\/b> (3 de LD + 3 de FT + 3 de FPADM + 3 emergentes) y <b>25 vulnerabilidades<\/b> (12 del régimen + 10 de LD + 3 de FT). 12 + 25 = 37."}, {"tipo": "tarjetas", "id": "escalas", "nav": "3 escalas", "titulo": "Tres escalas que no son la misma", "intro": "El examen juega con los nombres de los niveles. Fíjate de qué tabla viene la pregunta.", "tarjetas": [{"encabezado": true, "color": "turquesa", "titulo": "Grado de cada factor", "subtitulo": "V.3 · 3 niveles", "filas": [{"k": "Intervalo", "v": "0 a 9"}, {"k": "Niveles", "v": "0–3 <b>Bajo<\/b> · 3–6 <b>Medio<\/b> · 6–9 <b>Alto<\/b>"}, {"k": "Se usa en", "v": "Impacto, ocurrencia, facilitación y explotación de los 37 factores."}]}, {"encabezado": true, "color": "morado", "titulo": "Matriz sectorial", "subtitulo": "IV · 4 niveles", "filas": [{"k": "Intervalo", "v": "Porcentaje de calificación"}, {"k": "Niveles", "v": "0–50 <b>Bajo<\/b> · 51–80 <b>Medio-Bajo<\/b> · 81–90 <b>Medio<\/b> · 91–100 <b>Alto<\/b>"}, {"k": "Se usa en", "v": "Los 23 resultados del SF y los 18 de AV."}]}, {"encabezado": true, "color": "principal", "titulo": "Evaluación integral", "subtitulo": "XI.7 · 4 niveles", "filas": [{"k": "Intervalo", "v": "0 a 9"}, {"k": "Niveles", "v": "0–3 <b>Bajo<\/b> · 3–5 <b>Medio<\/b> · 5–7 <b>Medio-Alto<\/b> · 7–9 <b>Alto<\/b>"}, {"k": "Se usa en", "v": "Los 6 riesgos finales de la conclusión nacional."}]}], "nota": "En el texto del apartado IV el riesgo bajo va «del 1 al 50 por ciento»; en su tabla, de «0 – 50». La diferencia no cambia ningún nivel publicado."}, {"tipo": "tarjetas", "id": "sectores", "nav": "Sectores", "titulo": "Evaluación sectorial 2023 (entre paréntesis, 2020 cuando cambió)", "intro": "Riesgo de cada sector de ser utilizado para lavar dinero (IV.1, IV.2 y XI.1). El examen pregunta sobre todo quién está en ALTO.", "tarjetas": [{"encabezado": true, "color": "morado", "titulo": "Sistema financiero", "subtitulo": "23 resultados", "filas": [{"k": "ALTO (2)", "v": "<ul><li>Banca Múltiple-G7<\/li><li>Banca Múltiple-Cambiarios<\/li><\/ul>"}, {"k": "MEDIO (12)", "v": "<ul><li>Casas de cambio<\/li><li>Banca de desarrollo<\/li><li>Banca Múltiple-Crédito a los hogares<\/li><li>SOCAPS<\/li><li>SOFIPO<\/li><li>Banca Múltiple-Inversión<\/li><li>Transmisores de dinero (2020: Medio-Bajo)<\/li><li>Banca Múltiple-Comercial<\/li><li>SOFOMES reguladas<\/li><li>Casas de bolsa (2020: Medio-Bajo)<\/li><li>ITF/Fintech (nueva)<\/li><li>Centros cambiarios<\/li><\/ul>"}, {"k": "MEDIO-BAJO (5)", "v": "<ul><li>Uniones de crédito (2020: Medio)<\/li><li>SOFI<\/li><li>Almacenes generales de depósito<\/li><li>SOFOMES no reguladas<\/li><li>SODAFI<\/li><\/ul>"}, {"k": "BAJO (4)", "v": "<ul><li>Afores<\/li><li>Seguros (2020: Medio-Bajo)<\/li><li>Fianzas (2020: Medio-Bajo)<\/li><li>Asesores de inversión<\/li><\/ul>"}]}, {"encabezado": true, "color": "turquesa", "titulo": "Actividades vulnerables", "subtitulo": "18 resultados", "filas": [{"k": "ALTO (3)", "v": "<ul><li>Obras de arte<\/li><li>Metales preciosos, piedras preciosas, joyas y relojes<\/li><li>Monederos y certificados de devoluciones o recompensas (2020: Medio)<\/li><\/ul>"}, {"k": "MEDIO (5)", "v": "<ul><li>Tarjetas prepagadas, vales o cupones<\/li><li>Vehículos aéreos, marítimos o terrestres (2020: Alto)<\/li><li>Servidores públicos (2020: sin resultado; sector desglosado)<\/li><li>Fe pública<\/li><li>Mutuo, préstamos o créditos<\/li><\/ul>"}, {"k": "MEDIO-BAJO (10)", "v": "<ul><li>Servicios de blindaje (2020: Alto)<\/li><li>Tarjetas de servicios o de crédito<\/li><li>Juegos con apuesta, concursos o sorteos<\/li><li>Transmisión de derechos sobre bienes inmuebles<\/li><li>Recepción de donativos<\/li><li>Derechos personales de uso o goce de inmuebles (2020: Medio)<\/li><li>Desarrollo inmobiliario (nuevo)<\/li><li>Activos virtuales (nuevo)<\/li><li>Servicios profesionales<\/li><li>Traslado o custodia de dinero o valores<\/li><\/ul>"}, {"k": "BAJO (0)", "v": "Ningún sector de AV quedó en bajo."}]}], "nota": "La narrativa de IV.3 habla de la <b>calificación<\/b> (el porcentaje), no del <b>nivel<\/b>. Por eso varios sectores que «bajaron» o «incrementaron» su calificación conservan su nivel en la tabla, como Centros cambiarios, SOFI, Obras de arte o Afores. El nivel se toma de la tabla."}, {"tipo": "tarjetas", "id": "veredicto", "nav": "Veredicto", "titulo": "La conclusión nacional: 6 riesgos finales", "intro": "Apartado XI.7. Ojo: el nivel de un factor (p. ej., ransomware ALTO/ALTO) no es el riesgo integral (ransomware Medio).", "tarjetas": [{"encabezado": true, "color": "principal", "titulo": "Riesgo integral", "subtitulo": "XI.7", "filas": [{"k": "Lavado de dinero", "v": "<b>Medio-Alto<\/b>"}, {"k": "Financiamiento al terrorismo", "v": "<b>Bajo<\/b>"}, {"k": "FPADM", "v": "<b>Bajo<\/b>"}, {"k": "Activos virtuales", "v": "<b>Medio<\/b>"}, {"k": "Ataques de ransomware", "v": "<b>Medio<\/b>"}, {"k": "Pandemia de COVID-19", "v": "<b>Bajo<\/b>"}]}, {"encabezado": true, "color": "negro", "titulo": "Las ecuaciones", "subtitulo": "XI.7", "filas": [{"k": "LD", "v": "0.8 × amenazas de LD + 0.1 × vulnerabilidades de LD + 0.1 × vulnerabilidades del régimen"}, {"k": "FT", "v": "0.8 × amenazas de FT + 0.1 × vulnerabilidades de FT + 0.1 × vulnerabilidades del régimen"}, {"k": "FPADM", "v": "0.8 × amenazas de FPADM + 0.2 × vulnerabilidades del régimen"}, {"k": "Emergentes", "v": "0.8 × valoración del factor + 0.2 × vulnerabilidades del régimen"}, {"k": "Agregada", "v": "Promedio aritmético de los factores del grupo"}]}]}, {"tipo": "tarjetas", "id": "regimen", "nav": "Régimen y plan", "titulo": "Quién participa y qué se propone", "intro": "Contexto de los apartados III y XII. El núcleo del tema 3.3.3 son los apartados IV a XI; la ENR 2023 también figura en la bibliografía del Área 1 del temario de agosto 2026.", "tarjetas": [{"encabezado": true, "color": "morado", "titulo": "Actores del régimen", "subtitulo": "Apartado III", "filas": [{"k": "Sujetos obligados", "v": "Integrantes del SF (3,549) y quienes realizan AV (107,642), al 30-jun-2022: identifican, monitorean y reportan o dan aviso."}, {"k": "Reguladoras", "v": "SHCP (UBD, UBVA, USPSS y UIF) y BANXICO: crean el marco jurídico."}, {"k": "Supervisoras", "v": "CNBV, CNSF, CONSAR y SAT. BANXICO supervisa además los riesgos adicionales en sistemas de pagos."}, {"k": "UIF", "v": "Recibe reportes y avisos, analiza, disemina inteligencia y, en su caso, presenta denuncias."}, {"k": "Otros", "v": "FGR y fiscalías estatales, Poder Judicial, FEDE, SRE, FECC, ASF, SFP y SSPC."}]}, {"barra": true, "color": "turquesa", "titulo": "Prevenir · Detectar · Combatir", "ref": "Apartado III", "html": "Prevenir que los recursos ilícitos (LD) o con fines ilícitos (FT) entren al sistema; detectar oportunamente su introducción; combatir castigando la conducta y sustrayendo los recursos al delincuente. La UIF coordina la ENR y es coordinadora nacional de México ante el GAFI (I)."}, {"barra": true, "color": "negro", "titulo": "Plan de Acción Preliminar", "ref": "Apartado XII", "html": "Propuestas preliminares por factor para reasignar recursos y aplicar medidas intensificadas o simplificadas según el nivel de riesgo. Ejemplos: continuar la Certificación de la UIF para AV; actualizar las DCG del art. 60 de la Ley Orgánica de la Financiera Nacional de Desarrollo Agropecuario, Rural, Forestal y Pesquero, sin cambios desde el 2-abr-2015; revisar las reglas de envío de reportes modificatorios y extemporáneos."}]}, {"tipo": "cifras", "id": "cifras", "nav": "Cifras", "titulo": "Cifras y niveles que preguntan", "intro": "Cada número con su apartado de la ENR.", "cifras": [["37", "factores", "De riesgo, en 5 rubros: régimen, LD, FT, FPADM y emergentes", "II y V.1"], ["26", "factores", "Tenían la ENR 2016 (5 rubros) y la ENR 2020 (6 rubros)", "II"], ["12·13·6·3·3", "por rubro", "Régimen · LD · FT · FPADM · emergentes", "XI.2 a XI.6"], ["8", "en ALTO/ALTO", "Factores 13, 14, 15, 18, 23, 24, 29 y 36", "XI.3 a XI.6"], ["19 / 23", "sectores / matrices", "Sistema financiero: la Banca Múltiple se divide en 5 subsectores", "IV.1"], ["20 / 18", "sectores / matrices", "AV: sin matriz para Cheques de viajero ni Comercio exterior", "IV y IV.2"], ["91–100", "% = Alto", "Matriz sectorial: 81–90 Medio · 51–80 Medio-Bajo · 0–50 Bajo", "IV"], ["0–9", "por dimensión", "0–3 Bajo · 3–6 Medio · 6–9 Alto; cada elemento vale de 1 a 5", "V.3"], ["0.8", "peso", "De las amenazas en las 4 ecuaciones (6 riesgos finales); el régimen pesa 0.1 (LD, FT) o 0.2 (FPADM, emergentes)", "XI.7"], ["5–7", "Medio-Alto", "Rango del riesgo de LD; integral: 0–3 Bajo · 3–5 Medio · 7–9 Alto", "XI.7"], ["41", "autoridades", "Participaron, coordinadas por la UIF, con 39 personas enlace (2 de ellas representan a dos autoridades cada una)", "II.3"], ["2013", "Guía GAFI", "Guía del GAFI sobre la ENR de LD y FT, febrero de 2013, base de la metodología", "V"]]}, {"tipo": "simulador", "id": "examen", "nav": "Practicar ▸"}], "temas": {"sec": "Sujetos obligados y evaluación sectorial", "met": "Metodología, escalas y conclusión nacional", "fac": "Los 37 factores: amenazas y vulnerabilidades", "reg": "Régimen y plan de acción"}, "modos": [{"k": "fac", "l": "Los 37 factores", "tema": "fac"}, {"k": "sec", "l": "Sectores", "tema": "sec"}, {"k": "met", "l": "Metodología y veredicto", "tema": "met"}, {"k": "reg", "l": "Régimen y plan", "tema": "reg"}, {"k": "caso", "l": "Casos prácticos", "tipos": ["caso"]}, {"k": "tr", "l": "Cifras y trampas", "tipos": ["cifra", "trampa"]}], "banco": [{"id": "E001", "tema": "fac", "tipo": "caso", "q": "La analista Itzel prepara una lámina sobre el factor «Aumento de la corrupción». Según el mapa de riesgo de LD, ¿qué clasificación y qué grados le corresponden?", "a": "Amenaza de LD; grado de impacto Alto y probabilidad de ocurrencia Alto", "o": ["Vulnerabilidad de LD; grado de facilitación Alto y probabilidad de explotación Alto", "Amenaza de LD; grado de impacto Alto y probabilidad de ocurrencia Medio", "Vulnerabilidad del régimen; grado de facilitación Alto y probabilidad de explotación Medio", "Amenaza de LD; grado de impacto Alto y probabilidad de ocurrencia Alto"], "x": "La corrupción es una de las tres amenazas de LD (con delincuencia organizada y recursos ilícitos generados en México) y las tres están en Alto/Alto. Al ser amenaza se mide con impacto y ocurrencia; el distractor más tentador cambia la columna a facilitación/explotación, que es propia de las vulnerabilidades (V.3).", "ref": "XI.3, tabla de amenazas de LD"}, {"id": "E002", "tema": "fac", "tipo": "trampa", "q": "En una sesión de repaso, un alumno afirma: «Debilidad en los procesos de contratación pública de bienes y servicios está en ALTO/ALTO; por eso es una amenaza de LD». ¿Qué es lo correcto?", "a": "Es vulnerabilidad de LD: sus grados son de facilitación y de explotación", "o": ["Es amenaza de LD: todo factor en ALTO/ALTO se mide con impacto y ocurrencia", "Es vulnerabilidad de LD: sus grados son de facilitación y de explotación", "Es amenaza emergente, como el ransomware, por su probabilidad de ocurrencia Alto", "Es vulnerabilidad del régimen PLD/CFT, con facilitación Alto y explotación Medio"], "x": "El nivel no define la clasificación; la define la columna. Contratación pública aparece en la tabla de vulnerabilidades de LD con facilitación Alto y explotación Alto. Estar en ALTO/ALTO no convierte a un factor en amenaza: de los seis factores de LD en ALTO/ALTO, tres son amenazas y tres son vulnerabilidades.", "ref": "XI.3, tabla de vulnerabilidades de LD; VII.18"}, {"id": "E003", "tema": "fac", "tipo": "trampa", "q": "El auditor Fermín revisa una presentación que muestra «Deficiente impartición de justicia» como amenaza de LD con grados Alto/Alto. ¿Cuál es el error?", "a": "El nivel es correcto, pero es vulnerabilidad de LD (facilitación y explotación)", "o": ["El nivel es correcto, pero es vulnerabilidad de LD (facilitación y explotación)", "La clasificación es correcta, pero su probabilidad de ocurrencia es Medio, no Alto", "Es vulnerabilidad del régimen PLD/CFT y sus dos grados son Medio y Medio", "Es amenaza de LD, pero su grado de impacto es Medio y su ocurrencia es Alto"], "x": "Impartición de justicia está en la tabla de vulnerabilidades de LD con grado de facilitación Alto y probabilidad de explotación Alto. Los grados de la presentación son correctos; lo que falla es llamarla amenaza. Las únicas amenazas de LD son delincuencia organizada, recursos ilícitos y corrupción.", "ref": "XI.3, tabla de vulnerabilidades de LD; VII.24"}, {"id": "E004", "tema": "fac", "tipo": "caso", "q": "El oficial de cumplimiento Ramiro quiere ilustrar, con una sola vulnerabilidad de LD, el caso de un factor en ALTO en sus dos dimensiones. ¿Cuál debe elegir?", "a": "Debilidad en los procesos de contratación pública de bienes y servicios", "o": ["Debilidad en los procesos de contratación pública de bienes y servicios", "Deficiente Cultura Constitucional", "Incremento en las operaciones en dólares de los EE. UU. y otras divisas", "Debilidad regulatoria de las Instituciones de Tecnología Financiera"], "x": "Contratación pública tiene facilitación Alto y explotación Alto. Cultura Constitucional es el distractor más tentador porque también tiene facilitación Alto, pero su explotación es Medio. Dólares e ITF están en Medio/Medio.", "ref": "XI.3, tabla de vulnerabilidades de LD"}, {"id": "E005", "tema": "fac", "tipo": "trampa", "q": "¿Cuál de estos factores NO está en ALTO en sus dos dimensiones?", "a": "Deficiente Cultura Constitucional", "o": ["Deficiente impartición de justicia", "Deficiente Cultura Constitucional", "Incremento de los ataques de Ransomware", "Aumento de la Delincuencia Organizada"], "x": "Cultura Constitucional tiene facilitación Alto pero explotación Medio. Delincuencia organizada (amenaza de LD), impartición de justicia (vulnerabilidad de LD) y ransomware (amenaza emergente) están en Alto/Alto; son tres de los ocho factores con ese nivel.", "ref": "XI.3 y XI.6"}, {"id": "E006", "tema": "fac", "tipo": "caso", "q": "Una instructora pide a su grupo identificar el factor de FT que está en ALTO en sus dos dimensiones. ¿Cuál es?", "a": "Endebles controles ante la posición geográfica y porosidad de las fronteras", "o": ["Existencia de grupos terroristas nacionales o internacionales en México", "Endebles controles ante la posición geográfica y porosidad de las fronteras", "Existencia de grupos terroristas de nacionalidad mexicana en el extranjero", "Deficiente conocimiento y capacitación de los SO sobre temas de FT"], "x": "Porosidad de las fronteras es vulnerabilidad de FT con facilitación Alto y explotación Alto, el único factor de FT en ese nivel. Las amenazas de grupos terroristas tienen impacto Alto, pero su probabilidad de ocurrencia es Bajo; capacitación de los SO está en Medio/Medio.", "ref": "XI.4, tabla de vulnerabilidades de FT"}, {"id": "E007", "tema": "fac", "tipo": "caso", "q": "Una autoridad describe este hallazgo: «más de 3,000 km de frontera terrestre con Estados Unidos y cerca del 90 % de los migrantes irregulares con ese destino cruza el territorio nacional». ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad de FT, con facilitación Alto y explotación Alto", "o": ["Vulnerabilidad de LD, con facilitación Alto y explotación Alto, como los puertos", "Vulnerabilidad de FT, con facilitación Alto y explotación Alto", "Amenaza de FT, con grado de impacto Alto y probabilidad de ocurrencia Bajo", "Amenaza de LD, con grado de impacto Alto y probabilidad de ocurrencia Alto"], "x": "El hallazgo corresponde a «Endebles controles ante la posición geográfica y porosidad de las fronteras», vulnerabilidad del rubro de FT en Alto/Alto. El distractor más tentador es el de los puertos de entrada y salida, que también está en Alto/Alto, pero es vulnerabilidad de LD y trata de controles en puertos, no de la frontera terrestre.", "ref": "VIII.29; XI.4, tabla de vulnerabilidades de FT"}, {"id": "E008", "tema": "fac", "tipo": "caso", "q": "Un hallazgo dice: «no hay indicios de presencia de organizaciones terroristas en el país; los casos han sido aislados, retóricos y aspiracionales; el foco son la radicalización por internet y los lobos solitarios». ¿Qué grados tiene el factor al que pertenece?", "a": "Impacto Alto y probabilidad de ocurrencia Bajo", "o": ["Impacto Alto y probabilidad de ocurrencia Bajo", "Impacto Alto y probabilidad de ocurrencia Medio", "Facilitación Alto y probabilidad de explotación Bajo", "Impacto Medio y probabilidad de ocurrencia Bajo"], "x": "Es la amenaza «Existencia de grupos terroristas nacionales o internacionales en México»: impacto Alto (sus cuatro consecuencias son Alto) y ocurrencia Bajo. Impacto Medio corresponde a la generación de recursos de origen nacional; facilitación/explotación sería propio de una vulnerabilidad.", "ref": "VIII.26; XI.4, tabla de amenazas de FT"}, {"id": "E009", "tema": "fac", "tipo": "caso", "q": "Al revisar el mapa de riesgo de FT, el analista Joaquín busca la única amenaza con grado de impacto Medio. ¿Cuál es?", "a": "Generación de recursos de origen nacional encaminados a grupos terroristas", "o": ["Existencia de grupos terroristas nacionales o internacionales en México", "Generación de recursos de origen nacional encaminados a grupos terroristas", "Existencia de grupos terroristas de nacionalidad mexicana en el extranjero", "Incremento de la posibilidad de las OSFL de cometer actos de FT"], "x": "La generación de recursos de origen nacional tiene impacto Medio y ocurrencia Bajo. Las otras dos amenazas de FT tienen impacto Alto y ocurrencia Bajo. OSFL no es amenaza: es vulnerabilidad de FT (facilitación Medio, explotación Bajo).", "ref": "XI.4, tabla de amenazas de FT; VIII.27"}, {"id": "E010", "tema": "fac", "tipo": "caso", "q": "Una organización civil ficticia, «Fundación Mezquite», pregunta a su asesora qué grados tiene en la ENR el factor «Incremento de la posibilidad de las OSFL de cometer actos de FT». ¿Qué le responde?", "a": "Facilitación Medio y probabilidad de explotación Bajo", "o": ["Facilitación Medio y probabilidad de explotación Bajo", "Facilitación Medio y probabilidad de explotación Medio", "Facilitación Bajo y probabilidad de explotación Bajo", "Impacto Medio y probabilidad de ocurrencia Bajo, como amenaza"], "x": "El factor de las OSFL es vulnerabilidad de FT con facilitación Medio y explotación Bajo. Medio/Medio corresponde a la capacitación de los SO sobre FT; impacto/ocurrencia sólo se usa en amenazas; Bajo/Bajo sólo lo tiene el Marco Jurídico del SF.", "ref": "XI.4, tabla de vulnerabilidades de FT; VIII.31"}, {"id": "E011", "tema": "fac", "tipo": "caso", "q": "Un hallazgo de FPADM señala que el principal riesgo nacional es el desvío de insumos de uso dual desde la industria civil, lo que ha retrasado un sistema de respuesta completo. ¿Qué grados tiene ese factor?", "a": "Impacto Alto y probabilidad de ocurrencia Medio", "o": ["Impacto Alto y probabilidad de ocurrencia Bajo", "Impacto Alto y probabilidad de ocurrencia Medio", "Facilitación Alto y probabilidad de explotación Medio", "Impacto Medio y probabilidad de ocurrencia Medio"], "x": "Es «Deficiente desarrollo e implementación de un sistema de respuesta en caso de un ataque con ADM», la única amenaza de FPADM con ocurrencia Medio; las otras dos tienen ocurrencia Bajo. Las tres amenazas de FPADM tienen impacto Alto, y no se miden con facilitación/explotación porque no son vulnerabilidades.", "ref": "IX.34; XI.5"}, {"id": "E012", "tema": "fac", "tipo": "memoria", "q": "¿Qué contiene el rubro de financiamiento a la proliferación de armas de destrucción masiva (FPADM) en la ENR 2023?", "a": "Sólo tres amenazas; no tiene vulnerabilidades propias", "o": ["Dos amenazas y una vulnerabilidad propia de proliferación", "Tres vulnerabilidades, medidas con facilitación y explotación", "Sólo tres amenazas; no tiene vulnerabilidades propias", "Tres amenazas y tres vulnerabilidades, igual que el rubro de FT"], "x": "El apartado IX y el mapa de riesgo de XI.5 presentan sólo amenazas de FPADM (desarrollo de ADM, financiamiento y sistema de respuesta). Por eso su ecuación final no tiene término de vulnerabilidades propias: el 0.2 restante lo aporta el régimen PLD/CFT (XI.7).", "ref": "IX; XI.5"}, {"id": "E013", "tema": "fac", "tipo": "trampa", "q": "El factor «Debilidad regulatoria de los Activos Virtuales» lleva la palabra «debilidad». ¿Cómo lo clasifica la ENR 2023?", "a": "Amenaza emergente, medida con impacto y probabilidad de ocurrencia", "o": ["Vulnerabilidad emergente, medida con facilitación y probabilidad de explotación", "Amenaza emergente, medida con impacto y probabilidad de ocurrencia", "Vulnerabilidad de LD, medida con facilitación y probabilidad de explotación", "Vulnerabilidad del régimen PLD/CFT, por tratarse de una debilidad regulatoria"], "x": "Los tres factores emergentes (activos virtuales, ransomware y COVID-19) son amenazas: V.3 habla de «amenazas emergentes» y su tabla en XI.6 trae grado de impacto (Alto) y probabilidad de ocurrencia (Medio). El nombre engaña: comercio electrónico e ITF, que también dicen «debilidad regulatoria», sí son vulnerabilidades de LD.", "ref": "V.3; X.35; XI.6"}, {"id": "E014", "tema": "fac", "tipo": "trampa", "q": "La instructora Lucía agrupa «Debilidad regulatoria del Comercio Electrónico» con el ransomware y los activos virtuales como factores emergentes. ¿Es correcto?", "a": "No: es vulnerabilidad de LD, con facilitación Medio y explotación Medio", "o": ["No: es vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Bajo", "Sí: es amenaza emergente, con impacto Alto y ocurrencia Medio", "No: es vulnerabilidad de LD, con facilitación Medio y explotación Medio", "Sí: es amenaza emergente, con grado de impacto Medio y probabilidad de ocurrencia Medio"], "x": "Comercio electrónico está en la tabla de vulnerabilidades de LD (apartado VII) con facilitación Medio y explotación Medio. Los únicos emergentes son activos virtuales, ransomware y COVID-19, los tres amenazas. Que el nombre suene a tecnología o a hueco regulatorio no lo vuelve emergente.", "ref": "VII.17; XI.3, tabla de vulnerabilidades de LD"}, {"id": "E015", "tema": "fac", "tipo": "trampa", "q": "La oficial de cumplimiento de una ITF ficticia, «Kuali Pagos», encuentra el factor «Debilidad regulatoria de las Instituciones de Tecnología Financiera». ¿Cómo está clasificado?", "a": "Vulnerabilidad de LD, con facilitación Medio y explotación Medio", "o": ["Amenaza de LD, con grado de impacto Medio y probabilidad de ocurrencia Medio", "Amenaza emergente, con grado de impacto Alto y probabilidad de ocurrencia Medio", "Vulnerabilidad de LD, con facilitación Medio y explotación Medio", "Vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Bajo"], "x": "El factor de las ITF es vulnerabilidad de LD en Medio/Medio. El distractor de amenaza emergente con impacto Alto y ocurrencia Medio describe a los activos virtuales, la tercera «debilidad regulatoria», que sí es amenaza emergente.", "ref": "VII.25; XI.3, tabla de vulnerabilidades de LD"}, {"id": "E016", "tema": "fac", "tipo": "caso", "q": "El auditor Gonzalo verifica una lámina que dice: «el único factor de toda la ENR en Bajo/Bajo es…». ¿Qué factor debe completar la frase?", "a": "Debilidad en el Marco Jurídico del SF", "o": ["Incremento de la posibilidad de las OSFL de cometer actos de FT", "Deficiencias en las infraestructuras de los mercados financieros", "Debilidad en el Marco Jurídico del SF", "Debilidad en el Marco Jurídico de AV"], "x": "El Marco Jurídico del SF es vulnerabilidad del régimen con facilitación Bajo y explotación Bajo. El Marco Jurídico de AV es su opuesto: facilitación Alto y explotación Medio. Infraestructuras de los mercados financieros y OSFL están en Medio/Bajo.", "ref": "XI.2; VI.2"}, {"id": "E017", "tema": "fac", "tipo": "caso", "q": "Una autoridad reporta: «la iniciativa de reforma a la LFPIORPI presentada en el Senado el 7 de febrero de 2019 sigue sin aprobarse; la no aprobación es en sí misma un factor de riesgo». ¿Qué grados tiene ese factor?", "a": "Facilitación Alto y probabilidad de explotación Medio", "o": ["Facilitación Medio y probabilidad de explotación Medio", "Grado de impacto Alto y probabilidad de ocurrencia Medio", "Facilitación Alto y probabilidad de explotación Medio", "Facilitación Bajo y probabilidad de explotación Bajo"], "x": "El hallazgo corresponde a «Debilidad en el Marco Jurídico de AV», vulnerabilidad del régimen con facilitación Alto y explotación Medio, la más alta de las doce del régimen. Bajo/Bajo es el Marco Jurídico del SF; impacto/ocurrencia no aplica porque es vulnerabilidad.", "ref": "VI.1; XI.2"}, {"id": "E018", "tema": "fac", "tipo": "caso", "q": "Un hallazgo indica que el SPEI es la infraestructura de importancia sistémica, que las infraestructuras están reguladas o supervisadas por BANXICO y que, aunque hay exposición, se trata de un «factor controlado». ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad de LD, con facilitación Medio y explotación Bajo", "o": ["Vulnerabilidad del régimen PLD/CFT, con facilitación Bajo y explotación Bajo", "Vulnerabilidad de LD, con facilitación Medio y explotación Medio", "Amenaza de LD, con grado de impacto Medio y probabilidad de ocurrencia Bajo", "Vulnerabilidad de LD, con facilitación Medio y explotación Bajo"], "x": "Es «Deficiencias en las infraestructuras de los mercados financieros», vulnerabilidad de LD en Medio/Bajo, la única de LD con explotación Bajo. Las de Medio/Medio son otras (economía informal, efectivo, dólares, comercio electrónico, ITF).", "ref": "VII.21; XI.3, tabla de vulnerabilidades de
