LD"}, {"id": "E019", "tema": "fac", "tipo": "caso", "q": "Un hallazgo explica que la sociedad anónima es más susceptible de uso ilícito que la de responsabilidad limitada, y que la UIF consulta el Registro Público de Comercio por sujeto vía SIGER. ¿A qué rubro pertenece el factor?", "a": "Vulnerabilidades del régimen PLD/CFT", "o": ["Vulnerabilidades del régimen PLD/CFT", "Factores emergentes de la ENR 2023", "Vulnerabilidades estructurales de lavado de dinero", "Amenazas estructurales de lavado de dinero"], "x": "Es «Deficiente información sobre las Estructuras Jurídicas» (apartado VI), una de las doce vulnerabilidades del régimen, en Medio/Medio. Ya existía como capítulo en la ENR 2020; en la de 2023 se incluye como vulnerabilidad del régimen y se evalúa a detalle (II).", "ref": "VI.9; XI.2"}, {"id": "E020", "tema": "fac", "tipo": "caso", "q": "Un hallazgo describe el nuevo sistema de jurisprudencia por precedentes obligatorios de la SCJN, derivado de la reforma constitucional de 2021. ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad de LD, con facilitación Alto y explotación Medio", "o": ["Vulnerabilidad de LD, con facilitación Alto y explotación Medio", "Amenaza de LD, con grado de impacto Alto y probabilidad de ocurrencia Medio", "Vulnerabilidad del régimen PLD/CFT, con facilitación Alto y explotación Medio", "Vulnerabilidad de LD, con facilitación Alto y explotación Alto"], "x": "Es «Deficiente Cultura Constitucional», vulnerabilidad de LD con facilitación Alto y explotación Medio; no llega a Alto/Alto. El distractor del régimen con Alto/Medio describe al Marco Jurídico de AV, que tiene los mismos grados pero pertenece a otro rubro.", "ref": "VII.16; XI.3, tabla de vulnerabilidades de LD"}, {"id": "E021", "tema": "fac", "tipo": "caso", "q": "Un hallazgo reporta que, al cuarto trimestre de 2021, 31.6 millones de personas estaban en ocupación informal (55.8 %). ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad de LD, con facilitación Medio y explotación Medio", "o": ["Amenaza de LD, con grado de impacto Alto y probabilidad de ocurrencia Alto", "Vulnerabilidad de LD, con facilitación Medio y explotación Bajo", "Vulnerabilidad de LD, con facilitación Alto y explotación Alto", "Vulnerabilidad de LD, con facilitación Medio y explotación Medio"], "x": "«Aumento de la economía informal» es vulnerabilidad de LD en Medio/Medio. La palabra «aumento» no lo vuelve amenaza: la clasificación la da la tabla en la que aparece. Medio/Bajo corresponde a infraestructuras de los mercados financieros.", "ref": "VII.19; XI.3, tabla de vulnerabilidades de LD"}, {"id": "E022", "tema": "fac", "tipo": "caso", "q": "Según la ANAM, el LD en comercio exterior se realiza sobre todo con fraude de facturas y modificación de documentos de respaldo (TBML y SBML). ¿Qué grados tiene el factor al que pertenece este hallazgo?", "a": "Facilitación Alto y probabilidad de explotación Alto", "o": ["Facilitación Alto y probabilidad de explotación Alto", "Facilitación Medio y probabilidad de explotación Medio", "Facilitación Alto y probabilidad de explotación Medio", "Grado de impacto Alto y probabilidad de ocurrencia Alto"], "x": "Es «Deficientes controles en los movimientos transfronterizos en puertos de entrada y salida internacional», vulnerabilidad de LD en Alto/Alto. Como es vulnerabilidad, sus grados son de facilitación y explotación, no de impacto y ocurrencia.", "ref": "VII.23; XI.3, tabla de vulnerabilidades de LD"}, {"id": "E023", "tema": "fac", "tipo": "caso", "q": "Una autoridad documenta que en 2020 y 2021 operaban 46 organizaciones en el país y que el narcotráfico es el delito precedente que más reportes genera. ¿Qué tipo de factor describe?", "a": "Amenaza de lavado de dinero", "o": ["Vulnerabilidad de lavado de dinero", "Amenaza de lavado de dinero", "Amenaza de financiamiento al terrorismo", "Vulnerabilidad del régimen PLD/CFT"], "x": "El hallazgo corresponde a «Aumento de la Delincuencia Organizada», una de las tres amenazas de LD, en Alto/Alto (impacto y ocurrencia). No es vulnerabilidad: aparece en la tabla de amenazas de LD de XI.3 y se mide con impacto y ocurrencia.", "ref": "VII.13; XI.3, tabla de amenazas de LD"}, {"id": "E024", "tema": "fac", "tipo": "caso", "q": "Un hallazgo dice que México no tiene una metodología establecida para medir el volumen de recursos ilícitos y que, con fuentes oficiales, se estimó un monto aproximado para 2019–2021. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Alto", "o": ["Facilitación Alto y probabilidad de explotación Alto", "Grado de impacto Alto y probabilidad de ocurrencia Medio", "Grado de impacto Alto y probabilidad de ocurrencia Alto", "Grado de impacto Medio y probabilidad de ocurrencia Alto"], "x": "«Incremento del volumen de recursos ilícitos generados en México» es amenaza de LD en Alto/Alto, igual que delincuencia organizada y corrupción. Al ser amenaza se mide con impacto y ocurrencia; facilitación/explotación es de vulnerabilidades.", "ref": "VII.14; XI.3, tabla de amenazas de LD"}, {"id": "E025", "tema": "fac", "tipo": "cifra", "q": "¿Cómo se reparten los 37 factores de la ENR 2023 entre amenazas y vulnerabilidades?", "a": "12 amenazas y 25 vulnerabilidades", "o": ["25 amenazas y 12 vulnerabilidades", "12 amenazas y 25 vulnerabilidades", "9 amenazas y 28 vulnerabilidades", "15 amenazas y 22 vulnerabilidades"], "x": "Amenazas: 3 de LD, 3 de FT, 3 de FPADM y 3 emergentes = 12. Vulnerabilidades: 12 del régimen, 10 de LD y 3 de FT = 25. El 9/28 olvida que los emergentes también son amenazas.", "ref": "XI.2 a XI.6"}, {"id": "E026", "tema": "fac", "tipo": "cifra", "q": "¿Cuántos de los 37 factores quedaron en ALTO en sus dos dimensiones?", "a": "Ocho", "o": ["Ocho", "Tres", "Diez", "Seis"], "x": "Son ocho: las tres amenazas de LD, tres vulnerabilidades de LD (contratación pública, controles transfronterizos en puertos e impartición de justicia), la porosidad de las fronteras (FT) y el ransomware (emergente). Seis es sólo el conteo de LD.", "ref": "XI.3 a XI.6"}, {"id": "E027", "tema": "fac", "tipo": "memoria", "q": "¿Cuántos factores integran el rubro de lavado de dinero y cómo se componen?", "a": "13: tres amenazas y diez vulnerabilidades", "o": ["6: tres amenazas y tres vulnerabilidades", "10: tres amenazas y siete vulnerabilidades", "13: tres amenazas y diez vulnerabilidades", "12: todas vulnerabilidades"], "x": "El ritmo de los rubros es 12 · 13 · 6 · 3 · 3. LD tiene 13 factores: amenazas 13 a 15 y vulnerabilidades 16 a 25. Doce, todas vulnerabilidades, es el régimen; seis (3 + 3) es FT.", "ref": "XI.3"}, {"id": "E028", "tema": "fac", "tipo": "caso", "q": "El instructor Víctor pide a su grupo nombrar los tres factores emergentes de la ENR 2023. ¿Qué respuesta es correcta?", "a": "Activos virtuales, ransomware y efectos de la pandemia de COVID-19", "o": ["Ransomware, comercio electrónico e Instituciones de Tecnología Financiera", "Activos virtuales, Instituciones de Tecnología Financiera y COVID-19", "Activos virtuales, ransomware y comercio electrónico", "Activos virtuales, ransomware y efectos de la pandemia de COVID-19"], "x": "Los emergentes son activos virtuales, ataques de ransomware y endebles controles de los efectos de la pandemia de COVID-19, los tres amenazas. Comercio electrónico e ITF son vulnerabilidades de LD, aunque su tema sea tecnológico.", "ref": "X; XI.6"}, {"id": "E029", "tema": "fac", "tipo": "caso", "q": "La analista Itzel debe anotar los grados del factor «Incremento de los ataques de Ransomware». ¿Cuáles son?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Alto", "o": ["Grado de impacto Medio y probabilidad de ocurrencia Medio", "Grado de impacto Alto y probabilidad de ocurrencia Alto", "Grado de impacto Alto y probabilidad de ocurrencia Medio", "Facilitación Alto y probabilidad de explotación Alto"], "x": "El ransomware es amenaza emergente en Alto/Alto. Alto/Medio corresponde a activos virtuales y Medio/Medio a COVID-19. Ojo: aunque el factor esté en Alto/Alto, su riesgo integral es Medio (XI.7).", "ref": "XI.6; X.36"}, {"id": "E030", "tema": "fac", "tipo": "caso", "q": "Un hallazgo dice que la pandemia aceleró el uso de tecnologías y con ello el fraude y el delito cibernético. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Medio y probabilidad de ocurrencia Medio", "o": ["Grado de impacto Alto y probabilidad de ocurrencia Medio", "Grado de impacto Medio y probabilidad de ocurrencia Medio", "Facilitación Medio y probabilidad de explotación Medio", "Grado de impacto Alto y probabilidad de ocurrencia Alto"], "x": "«Endebles controles de los efectos derivados de la pandemia de COVID-19» es amenaza emergente en Medio/Medio; es el único emergente con impacto Medio (sus cuatro consecuencias son Medio). Facilitación/explotación no aplica a los emergentes porque son amenazas.", "ref": "X.37; XI.6"}, {"id": "E031", "tema": "fac", "tipo": "caso", "q": "Un hallazgo dice que BANXICO, con las demás autoridades, ha decidido mantener una separación entre los activos virtuales y el sistema financiero, y que se analiza la Regla de Viaje. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Medio", "o": ["Grado de impacto Alto y probabilidad de ocurrencia Medio", "Facilitación Alto y probabilidad de explotación Medio", "Grado de impacto Alto y probabilidad de ocurrencia Alto", "Grado de impacto Medio y probabilidad de ocurrencia Medio"], "x": "«Debilidad regulatoria de los Activos Virtuales» es amenaza emergente con impacto Alto y ocurrencia Medio. Alto/Alto corresponde al ransomware; Medio/Medio, a COVID-19. No se mide con facilitación porque, pese a su nombre, no es vulnerabilidad.", "ref": "X.35; XI.6"}, {"id": "E032", "tema": "fac", "tipo": "caso", "q": "Un hallazgo dice: «para el Programa Anual de Supervisión de la CNBV se solicita información a UIF, CNSF, CONSAR, BANXICO y FGR, pero sólo responden UIF, CNSF y CONSAR». ¿A qué factor corresponde?", "a": "Deficiente coordinación efectiva entre autoridades para el intercambio de información", "o": ["Debilidad del sistema Supervisor y Sancionador", "Deficiente coordinación efectiva entre autoridades para el intercambio de información", "Deficiente maduración de los modelos de riesgo de los supervisores de SF para implementar un EBR", "Deficiencias en los sistemas de monitoreo y alertamiento de la UIF"], "x": "Es una falla de intercambio entre autoridades: vulnerabilidad del régimen, en Medio/Medio. El sistema supervisor y sancionador trata de cómo se supervisa y sanciona, no de la respuesta a solicitudes entre autoridades.", "ref": "VI.11; XI.2"}, {"id": "E033", "tema": "fac", "tipo": "caso", "q": "Un hallazgo señala que el campo «cuenta» de los reportes se llena indistintamente con número de cuenta, contrato, tarjeta, folio o póliza, y propone migrar de TXT a XML. ¿A qué factor pertenece?", "a": "Deficiencias en el Diseño del Aviso y Reporte conforme a Estándares Internacionales", "o": ["Deficiencias en el Diseño del Aviso y Reporte conforme a Estándares Internacionales", "Deficiente información sobre el Beneficiario Final", "Insuficiente obligatoriedad de la normativa para implementar un EBR por parte de los SO de SF", "Deficiencias en los sistemas de monitoreo y alertamiento de la UIF"], "x": "Es un problema de diseño del formato de reporte: vulnerabilidad del régimen con facilitación Medio y explotación Bajo. El de monitoreo y alertamiento de la UIF (Medio/Medio) trata, entre otros, de que no haya campo para identificar reportes de 24 horas.", "ref": "VI.4; XI.2"}, {"id": "E034", "tema": "fac", "tipo": "caso", "q": "Un hallazgo describe la falta de homologación del término (la LFPIORPI habla de «beneficiario controlador» y las DCG de «propietario real») y el uso de cuentas «mulas». ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio", "o": ["Vulnerabilidad del régimen PLD/CFT, con facilitación Bajo y explotación Bajo", "Vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio", "Amenaza de LD, con grado de impacto Medio y probabilidad de ocurrencia Medio", "Vulnerabilidad de LD, con facilitación Alto y probabilidad de explotación Alto"], "x": "Es «Deficiente información sobre el Beneficiario Final», vulnerabilidad del régimen en Medio/Medio. Bajo/Bajo sólo lo tiene el Marco Jurídico del SF; y no es amenaza porque aparece en la tabla de vulnerabilidades del régimen (XI.2), medida con facilitación y explotación.", "ref": "VI.10; XI.2"}, {"id": "E035", "tema": "fac", "tipo": "caso", "q": "El oficial de cumplimiento de un banco ficticio, «Banco Ceibal», compara los dos factores sobre la obligatoriedad del EBR. ¿Qué grados tiene el de los SO del SF?", "a": "Facilitación Medio y probabilidad de explotación Bajo", "o": ["Facilitación Medio y probabilidad de explotación Medio", "Facilitación Bajo y probabilidad de explotación Bajo", "Facilitación Alto y probabilidad de explotación Medio", "Facilitación Medio y probabilidad de explotación Bajo"], "x": "«Insuficiente obligatoriedad de la normativa para implementar un EBR por parte de los SO de SF» está en Medio/Bajo. El de los SO de AV está en Medio/Medio: para AV sólo existe la posibilidad de medidas simplificadas y no es obligatoria una evaluación integral de riesgos.", "ref": "VI.5; VI.6; XI.2"}, {"id": "E036", "tema": "fac", "tipo": "memoria", "q": "¿Cuál de estas vulnerabilidades del régimen tiene probabilidad de explotación Bajo?", "a": "Deficiente maduración de los modelos de riesgo de los supervisores de SF para implementar un EBR", "o": ["Deficiente información sobre el Beneficiario Final", "Deficiente maduración de los modelos de riesgo de los supervisores de SF para implementar un EBR", "Debilidad del sistema Supervisor y Sancionador", "Deficiente maduración de los modelos de riesgo de los supervisores de AV para implementar un EBR"], "x": "La maduración de los modelos de los supervisores de SF está en Medio/Bajo (la CNBV tiene un EBR «altamente desarrollado»). La de los supervisores de AV está en Medio/Medio. Beneficiario final y sistema supervisor y sancionador también están en Medio/Medio.", "ref": "XI.2; VI.7"}, {"id": "E037", "tema": "fac", "tipo": "trampa", "q": "¿Cuál de estos factores NO es una amenaza?", "a": "Endebles controles ante la posición geográfica y porosidad de las fronteras", "o": ["Incremento de los ataques de Ransomware", "Desarrollo de ADM dentro del territorio nacional", "Existencia de grupos terroristas de nacionalidad mexicana en el extranjero", "Endebles controles ante la posición geográfica y porosidad de las fronteras"], "x": "La porosidad de las fronteras es vulnerabilidad de FT (facilitación y explotación). El ransomware es amenaza emergente, los grupos terroristas en el extranjero son amenaza de FT y el desarrollo de ADM es amenaza de FPADM.", "ref": "XI.4; XI.5; XI.6"}, {"id": "E038", "tema": "fac", "tipo": "trampa", "q": "Para una lámina de «amenazas de LD en ALTO/ALTO», un instructor anota: delincuencia organizada, corrupción y contratación pública. ¿Qué corrección procede?", "a": "Cambiar contratación pública por el volumen de recursos ilícitos generados en México", "o": ["Cambiar contratación pública por el volumen de recursos ilícitos generados en México", "Cambiar corrupción por la deficiente impartición de justicia", "Cambiar contratación pública por los controles transfronterizos en puertos de entrada", "Cambiar delincuencia organizada por la deficiente Cultura Constitucional"], "x": "Las tres amenazas de LD son delincuencia organizada, recursos ilícitos generados en México y corrupción, todas en Alto/Alto. Contratación pública, impartición de justicia y controles en puertos están en Alto/Alto, pero son vulnerabilidades de LD: el nivel no cambia la clasificación.", "ref": "XI.3, tabla de amenazas de LD"}, {"id": "E039", "tema": "fac", "tipo": "memoria", "q": "¿Qué tienen en común las tres amenazas de financiamiento al terrorismo?", "a": "Las tres tienen probabilidad de ocurrencia Bajo", "o": ["Las tres tienen probabilidad de ocurrencia Bajo", "Las tres están en Alto en sus dos dimensiones", "Las tres tienen grado de impacto Alto", "Las tres tienen probabilidad de ocurrencia Medio"], "x": "Grupos terroristas en México (Alto/Bajo), recursos de origen nacional (Medio/Bajo) y grupos de nacionalidad mexicana en el extranjero (Alto/Bajo) comparten la ocurrencia Bajo. No todas tienen impacto Alto: la de recursos de origen nacional tiene impacto Medio.", "ref": "XI.4, tabla de amenazas de FT"}, {"id": "E040", "tema": "fac", "tipo": "caso", "q": "Un hallazgo de FPADM dice que México tiene industria que usa material precursor, pero no programas de ADM ni intereses bélicos, y que participa en el Grupo Australia. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Bajo", "o": ["Grado de impacto Alto y probabilidad de ocurrencia Medio", "Grado de impacto Alto y probabilidad de ocurrencia Bajo", "Facilitación Alto y probabilidad de explotación Bajo", "Grado de impacto Medio y probabilidad de ocurrencia Bajo"], "x": "Es «Desarrollo de ADM dentro del territorio nacional», amenaza de FPADM en Alto/Bajo. Ocurrencia Medio sólo la tiene el sistema de respuesta ante un ataque con ADM. Las tres amenazas de FPADM tienen impacto Alto.", "ref": "IX.32; XI.5"}, {"id": "E041", "tema": "met", "tipo": "caso", "q": "El analista Joaquín va a calificar un factor nuevo que la ENR clasificará como amenaza, no como vulnerabilidad. Según la ENR, ¿con qué binomio debe evaluarlo?", "a": "Grado de impacto y probabilidad de ocurrencia", "o": ["Grado de impacto y probabilidad de explotación", "Grado de impacto y probabilidad de ocurrencia", "Grado de facilitación y probabilidad de ocurrencia", "Grado de facilitación y probabilidad de explotación"], "x": "El esquema probabilidad de ocurrencia y grado de impacto sólo se usa respecto de las amenazas. Facilitación y explotación es el binomio de las vulnerabilidades. Las combinaciones cruzadas no existen en la ENR.", "ref": "V.3"}, {"id": "E042", "tema": "met", "tipo": "caso", "q": "La instructora Lucía evalúa una vulnerabilidad del régimen PLD/CFT. ¿Qué dos dimensiones debe usar?", "a": "Grado de facilitación y probabilidad de explotación", "o": ["Grado de facilitación y probabilidad de ocurrencia", "Concentración del negocio y probabilidad de explotación", "Grado de impacto y probabilidad de ocurrencia", "Grado de facilitación y probabilidad de explotación"], "x": "Para los juicios sobre vulnerabilidades, la ENR usa el binomio «probabilidad de explotación» y «grado de facilitación», sean del régimen, de LD o de FT. Impacto y ocurrencia es exclusivo de amenazas.", "ref": "V.3"}, {"id": "E043", "tema": "met", "tipo": "memoria", "q": "¿En qué intervalo se expresa cada dimensión de un factor y cuáles son sus niveles?", "a": "0 a 9: 0–3 Bajo, 3–6 Medio y 6–9 Alto", "o": ["1 a 5: 1–2 Bajo, 3 Medio y 4–5 Alto", "0 a 9: 0–3 Bajo, 3–5 Medio, 5–7 Medio-Alto y 7–9 Alto", "0 a 9: 0–3 Bajo, 3–6 Medio y 6–9 Alto", "0 a 100: 0–50 Bajo, 51–80 Medio y 81–100 Alto"], "x": "Cada dimensión se ajusta a un intervalo de 0 a 9 con tres niveles: Bajo, Medio y Alto. La escala de cuatro niveles con Medio-Alto es la de la evaluación integral (XI.7); la de porcentaje es la matriz sectorial (IV); 1 a 5 es el valor de cada elemento, no el de la dimensión.", "ref": "V.3"}, {"id": "E044", "tema": "met", "tipo": "cifra", "q": "Al calcular el grado de impacto o de facilitación, ¿qué valor se asigna a cada elemento?", "a": "Un valor de 1 a 5", "o": ["Un valor de 1 a 5", "Un valor de 1 a 10", "Un valor de 0 a 3", "Un valor de 0 a 9"], "x": "A cada elemento se le asigna un valor dentro del intervalo de 1 a 5; después se agregan de forma ponderada y el resultado se ajusta al intervalo de 0 a 9. No confundas el valor del elemento (1–5) con el de la dimensión (0–9).", "ref": "V.3"}, {"id": "E045", "tema": "met", "tipo": "caso", "q": "Un evaluador obtiene 4.5 en el grado de facilitación de una vulnerabilidad. Según la escala de cada dimensión, ¿qué nivel le corresponde?", "a": "Medio", "o": ["Alto", "Bajo", "Medio-Alto", "Medio"], "x": "La escala de cada dimensión es 0–3 Bajo, 3–6 Medio y 6–9 Alto, así que 4.5 es Medio. Medio-Alto no existe para una dimensión: sólo aparece en la escala integral de los riesgos finales (XI.7).", "ref": "V.3"}, {"id": "E046", "tema": "met", "tipo": "trampa", "q": "Al aplicar las ecuaciones de la conclusión nacional, la analista Itzel obtiene 6.2 para un riesgo final. ¿Qué nivel le corresponde?", "a": "Medio-Alto", "o": ["Medio", "Medio-Alto", "Medio-Bajo", "Alto"], "x": "La escala integral tiene cuatro niveles: 0–3 Bajo, 3–5 Medio, 5–7 Medio-Alto y 7–9 Alto. Con 6.2 es Medio-Alto. Si se usara por error la escala de una dimensión (6–9 Alto) saldría Alto; Medio-Bajo no existe en la escala integral (es de la matriz sectorial).", "ref": "XI.7"}, {"id": "E047", "tema": "met", "tipo": "trampa", "q": "¿En qué escala de la ENR existe el nivel «Medio-Bajo»?", "a": "En la matriz de riesgo sectorial de los sujetos obligados", "o": ["En el grado de cada dimensión de los 37 factores de riesgo", "En la evaluación integral de los riesgos finales de LD, FT y FPADM", "En la probabilidad de ocurrencia de las amenazas emergentes", "En la matriz de riesgo sectorial de los sujetos obligados"], "x": "Medio-Bajo (51–80 %) es un nivel de la matriz sectorial (IV); la ENR también lo usa en la matriz de FT de las OSFL (VIII.31), que no está entre las opciones. La evaluación integral usa Medio-Alto, no Medio-Bajo (XI.7), y cada dimensión de un factor sólo tiene Bajo, Medio y Alto (V.3).", "ref": "IV"}, {"id": "E048", "tema": "met", "tipo": "trampa", "q": "El auditor Fermín revisa una presentación que dice: «Riesgo integral de LD: Medio-Bajo». ¿Qué corrección procede?", "a": "Debe decir Medio-Alto: en la escala integral no existe Medio-Bajo", "o": ["Debe decir Medio, como la mayoría de los sectores del sistema financiero", "Debe decir Alto, porque sus tres amenazas están en Alto/Alto", "Debe decir Medio-Alto: en la escala integral no existe Medio-Bajo", "Es correcto, porque coincide con el nivel más frecuente en la matriz de AV"], "x": "El riesgo integral de LD es Medio-Alto (XI.7). Medio-Bajo pertenece a la matriz sectorial. Que las tres amenazas estén en Alto/Alto no hace Alto el riesgo final: entran ponderadas con las vulnerabilidades de LD y del régimen.", "ref": "XI.7"}, {"id": "E049", "tema": "met", "tipo": "memoria", "q": "¿Cuál es la fórmula de valoración de una amenaza?", "a": "(1/9) × (impacto × ocurrencia)", "o": ["(1/5) × (impacto × ocurrencia)", "(1/9) × (facilitación × explotación)", "(impacto + ocurrencia) ÷ 2, sin ajuste", "(1/9) × (impacto × ocurrencia)"], "x": "La valoración de amenazas es (1/9) × (impacto × ocurrencia). La de facilitación × explotación es la fórmula de las vulnerabilidades. Se divide entre 9, no entre 5, porque ambas variables están en 0–9.", "ref": "XI.7"}, {"id": "E050", "tema": "met", "tipo": "memoria", "q": "En la valoración de los factores, ¿por qué el producto de las dos dimensiones se divide entre 9?", "a": "Para que el resultado quede acotado en el mismo intervalo de 0 a 9", "o": ["Para convertir el resultado a la escala porcentual de la matriz sectorial", "Para ponderar por igual a los nueve factores en Alto de cada rubro", "Para promediar los nueve elementos que integran el grado de impacto", "Para que el resultado quede acotado en el mismo intervalo de 0 a 9"], "x": "Como impacto/facilitación y ocurrencia/explotación están en 0–9, su producto llega hasta 81; dividir entre 9 lo regresa a 0–9. Así, la valoración es el grado matizado por su probabilidad.", "ref": "XI.7"}, {"id": "E051", "tema": "met", "tipo": "memoria", "q": "¿Cómo se calcula el riesgo de lavado de dinero en la conclusión nacional?", "a": "0.8 amenazas de LD + 0.1 vulnerabilidades de LD + 0.1 vulnerabilidades del régimen", "o": ["0.8 amenazas de LD + 0.1 vulnerabilidades de LD + 0.1 vulnerabilidades del régimen", "0.8 amenazas de LD + 0.2 vulnerabilidades del régimen, sin vulnerabilidades de LD", "0.6 amenazas de LD + 0.2 vulnerabilidades de LD + 0.2 vulnerabilidades del régimen", "0.8 amenazas de LD + 0.2 vulnerabilidades de LD, sin el régimen PLD/CFT"], "x": "LD y FT usan 0.8 / 0.1 / 0.1: amenazas propias, vulnerabilidades propias y vulnerabilidades del régimen. La forma 0.8 + 0.2 del régimen es la de FPADM y los emergentes, que no tienen vulnerabilidades propias.", "ref": "XI.7"}, {"id": "E052", "tema": "met", "tipo": "caso", "q": "Un alumno pregunta a la instructora Lucía por qué la ecuación del riesgo de FPADM sólo tiene dos términos. ¿Qué le responde?", "a": "Porque el rubro no tiene vulnerabilidades propias: el régimen pesa 0.2", "o": ["Porque el rubro no tiene vulnerabilidades propias: el régimen pesa 0.2", "Porque el régimen PLD/CFT no se considera en los riesgos de proliferación", "Porque las vulnerabilidades de FT sustituyen a las de FPADM con un peso de 0.2", "Porque sus amenazas están en Bajo y no hace falta ponderarlas"], "x": "FPADM = 0.8 × amenazas de FPADM + 0.2 × vulnerabilidades del régimen. Como el rubro sólo trae amenazas, el 0.2 que en LD y FT se reparte entre vulnerabilidades propias y del régimen lo pone por completo el régimen.", "ref": "XI.7"}, {"id": "E053", "tema": "met", "tipo": "cifra", "q": "En la ecuación de cada factor emergente, ¿qué peso tiene la valoración agregada de las vulnerabilidades del régimen PLD/CFT?", "a": "0.2", "o": ["0.1", "0.2", "0.5", "0.8"], "x": "Factor emergente = 0.8 × valoración del factor + 0.2 × vulnerabilidades del régimen. El 0.1 del régimen sólo aplica en LD y FT, donde el otro 0.1 lo ponen las vulnerabilidades propias.", "ref": "XI.7"}, {"id": "E054", "tema": "met", "tipo": "memoria", "q": "¿Cómo se obtiene la valoración agregada de las amenazas o de las vulnerabilidades de un grupo?", "a": "Con el promedio aritmético de las valoraciones de los factores del grupo", "o": ["Con el producto de las valoraciones del grupo dividido entre 9", "Con la suma simple de las valoraciones de los factores del grupo", "Con el promedio aritmético de las valoraciones de los factores del grupo", "Con la valoración más alta del grupo, por criterio de prudencia del evaluador"], "x": "La ENR define la valoración agregada como el promedio aritmético de los factores de ese grupo. La división entre 9 se aplica a cada factor, no al agregado; y no se toma el máximo ni la suma.", "ref": "XI.7"}, {"id": "E055", "tema": "met", "tipo": "caso", "q": "Un consultor ficticio, Arturo Ledesma, redacta el marco de referencia de un cliente y debe citar el riesgo integral de lavado de dinero de la ENR 2023. ¿Qué nivel debe escribir?", "a": "Medio-Alto", "o": ["Medio-Alto", "Medio-Bajo", "Medio", "Alto"], "x": "El riesgo de LD quedó en Medio-Alto, el único de los seis riesgos finales en ese nivel. Medio-Bajo no existe en la escala integral (es de la matriz sectorial).", "ref": "XI.7"}, {"id": "E056", "tema": "met", "tipo": "caso", "q": "La oficial de cumplimiento de una casa de cambio ficticia actualiza su metodología y quiere citar el riesgo integral de financiamiento al terrorismo de la ENR 2023. ¿Cuál es?", "a": "Bajo", "o": ["Medio", "Medio-Bajo", "Bajo", "Medio-Alto"], "x": "El riesgo de FT quedó en Bajo, igual que FPADM y la pandemia de COVID-19. Que la porosidad de las fronteras esté en Alto/Alto no lo sube: las amenazas de FT, que pesan 0.8, tienen ocurrencia Bajo.", "ref": "XI.7"}, {"id": "E057", "tema": "met", "tipo": "trampa", "q": "¿Cuál de estos riesgos finales NO quedó en nivel Bajo?", "a": "Ataques de ransomware", "o": ["Financiamiento al terrorismo", "Financiamiento a la proliferación de ADM", "Ataques de ransomware", "Pandemia de COVID-19"], "x": "El ransomware quedó en Medio, igual que los activos virtuales. FT, FPADM y COVID-19 quedaron en Bajo; LD es el único en Medio-Alto.", "ref": "XI.7"}, {"id": "E058", "tema": "met", "tipo": "caso", "q": "En una clase, un alumno sostiene: «el riesgo integral del ransomware es Alto, porque su factor está en Alto/Alto». ¿Qué le corrige el instructor?", "a": "Su riesgo integral es Medio: el factor pesa 0.8 y el régimen 0.2", "o": ["Su riesgo integral es Medio: el factor pesa 0.8 y el régimen 0.2", "Su riesgo integral es Medio-Alto, el mismo nivel que el del riesgo de LD", "Su riesgo integral es Bajo, el mismo nivel que el de la pandemia", "Es correcto: el riesgo integral repite los grados del factor"], "x": "El nivel del factor no es el riesgo integral. Para cada emergente, riesgo = 0.8 × valoración del factor + 0.2 × vulnerabilidades del régimen, y el ransomware queda en Medio.", "ref": "XI.7; XI.6"}, {"id": "E059", "tema": "met", "tipo": "caso", "q": "Una SOFOM ficticia, «Crédito Ahuehuete», evalúa si permitir operaciones vinculadas con activos virtuales y quiere citar el riesgo integral de ese factor emergente. ¿Cuál es?", "a": "Medio", "o": ["Bajo", "Medio", "Alto", "Medio-Alto"], "x": "El riesgo integral de los activos virtuales es Medio, igual que el del ransomware. No confundas este resultado con sus grados como factor (impacto Alto, ocurrencia Medio) ni con el nivel del sector de AV de activos virtuales en la matriz sectorial (Medio-Bajo).", "ref": "XI.7"}, {"id": "E060", "tema": "met", "tipo": "trampa", "q": "En la ENR, ¿con qué se arma el grado de impacto de cada amenaza?", "a": "Con sus consecuencias sociales, políticas, financieras y económicas", "o": ["Con la concentración del negocio de la entidad, no en términos financieros", "Con los intensificadores y los mitigantes que se registran para cada amenaza", "Con el porcentaje que obtiene el sector en la matriz sectorial de riesgos", "Con sus consecuencias sociales, políticas, financieras y económicas"], "x": "Para las amenazas, el impacto se evalúa a partir de sus consecuencias sociales, políticas, financieras y económicas, y al final de cada amenaza hay una tabla con esos grados. La concentración del negocio sin términos financieros es el impacto de la Guía CNBV de 2019 para la metodología de la entidad; los intensificadores y mitigantes forman la probabilidad.", "ref": "V.3"}, {"id": "E061", "tema": "met", "tipo": "trampa", "q": "La oficial Itzel copia en la metodología de su entidad la definición de impacto de la ENR, con sus consecuencias financieras. Su auditor la remite a la Guía CNBV de 2019. ¿Qué observación procede?", "a": "En la Guía CNBV el impacto se mide por concentración del negocio, no en términos financieros", "o": ["Debe medir el impacto sólo con consecuencias sociales y políticas, como hace la ENR", "Es correcto: la Guía CNBV adopta íntegro el impacto de la ENR con sus cuatro consecuencias", "En la Guía CNBV el impacto se mide por concentración del negocio, no en términos financieros", "Debe usar el binomio facilitación y explotación, que es el que exige la Guía CNBV para el impacto"], "x": "Son dos ejercicios distintos: la ENR mide al país e incluye consecuencias financieras en el impacto de cada amenaza (V.3); la Guía CNBV de 2019 mide a la entidad y su impacto se basa en la concentración del negocio, no en términos financieros. No se cruzan las definiciones.", "ref": "V.3 (contraste con la Guía CNBV de 2019)"}, {"id": "E062", "tema": "met", "tipo": "trampa", "q": "El auditor Gonzalo lee en un resumen de la ENR: «el grado de impacto de las amenazas no se mide en términos financieros». ¿Cómo lo califica?", "a": "Error: en la ENR las consecuencias financieras sí forman parte del impacto", "o": ["Error: la ENR mide el impacto sólo con las consecuencias financieras del delito", "Correcto: la ENR mide el impacto por concentración del negocio del país", "Error: en la ENR las consecuencias financieras sí forman parte del impacto", "Correcto: en la ENR el grado de impacto sólo se aplica a las vulnerabilidades"], "x": "La frase confunde la ENR con la Guía CNBV de 2019. En la ENR, el impacto de cada amenaza se construye con consecuencias sociales, políticas, financieras y económicas; la tabla al final de cada amenaza trae las cuatro. Lo de «no en términos financieros» es la Guía CNBV para la entidad.", "ref": "V.3"}, {"id": "E063", "tema": "met", "tipo": "memoria", "q": "En la probabilidad de ocurrencia o de explotación, ¿cómo intervienen los dos grupos de elementos?", "a": "Los intensificadores suman y los mitigantes restan", "o": ["Sólo cuentan los mitigantes; los intensificadores son informativos", "Ambos grupos se promedian sin distinguir su efecto", "Los intensificadores suman y los mitigantes restan", "Los mitigantes suman y los intensificadores restan"], "x": "Los intensificadores incrementan la probabilidad de que se materialice el factor y los mitigantes la reducen. Al agregarse de forma ponderada se suman los primeros y se restan los segundos, y el resultado se ajusta a 0–9.", "ref": "V.3"}, {"id": "E064", "tema": "met", "tipo": "memoria", "q": "¿Qué documento usó la ENR 2023 para identificar, analizar y evaluar los riesgos finales?", "a": "La Guía del GAFI sobre la Evaluación Nacional de Riesgos de LD y FT, de febrero de 2013", "o": ["La Recomendación 15 del GAFI sobre nuevas tecnologías, recalificada en el año 2021", "La Guía del GAFI sobre la Evaluación Nacional de Riesgos de LD y FT, de febrero de 2013", "La Guía de la UIF para combatir el financiamiento al terrorismo, emitida el 7 de diciembre de 2020", "La Guía CNBV para la elaboración de una metodología de evaluación de riesgos, de 2019"], "x": "El apartado V dice que se utilizó la Guía del GAFI sobre la ENR de LD y FT publicada en febrero de 2013. La Guía CNBV de 2019 es para la metodología de la entidad; la R. 15 y la guía de FT de la UIF se citan en otros apartados, no como base metodológica.", "ref": "V"}, {"id": "E065", "tema": "met", "tipo": "cifra", "q": "En la evaluación integral de los riesgos, ¿qué rango de calificación corresponde al nivel Medio-Alto?", "a": "De 5 a 7", "o": ["De 3 a 5", "De 6 a 9", "De 81 a 90", "De 5 a 7"], "x": "Escala integral: 0–3 Bajo, 3–5 Medio, 5–7 Medio-Alto y 7–9 Alto. De 6 a 9 es el nivel Alto de cada dimensión (V.3) y de 81 a 90 % es el nivel Medio de la matriz sectorial (IV).", "ref": "XI.7"}, {"id": "E066", "tema": "sec", "tipo": "caso", "q": "El oficial de cumplimiento de un grupo financiero ficticio supervisa cuatro subsectores de Banca Múltiple y quiere saber cuál quedó en riesgo ALTO en la ENR 2023. ¿Cuál es?", "a": "Banca Múltiple-Cambiarios", "o": ["Banca Múltiple-Comercial", "Banca Múltiple-Inversión", "Banca Múltiple-Cambiarios", "Banca Múltiple-Crédito a los hogares"], "x": "En el SF sólo dos resultados quedaron en ALTO: Banca Múltiple-G7 y Banca Múltiple-Cambiarios. Inversión, Comercial y Crédito a los hogares quedaron en MEDIO.", "ref": "IV.1, tabla de riesgo de LD del SF; XI.1"}, {"id": "E067", "tema": "sec", "tipo": "caso", "q": "Una instructora pide a su grupo los sectores del sistema financiero que quedaron en ALTO en la matriz sectorial 2023. ¿Qué respuesta es correcta?", "a": "Banca Múltiple-G7 y Banca Múltiple-Cambiarios", "o": ["Banca Múltiple-G7 y Banca Múltiple-Cambiarios", "Banca Múltiple-G7 y Casas de cambio", "Casas de cambio y Centros cambiarios", "Banca Múltiple-Cambiarios y Transmisores de dinero"], "x": "Los únicos dos sectores del SF en ALTO son Banca Múltiple-G7 y Banca Múltiple-Cambiarios. Casas de cambio, Centros cambiarios y Transmisores de dinero quedaron en MEDIO: el componente cambiario en ALTO es el subsector bancario, no las casas ni los centros.", "ref": "IV.1, tabla de riesgo de LD del SF; XI.1"}, {"id": "E068", "tema": "sec", "tipo": "memoria", "q": "¿Qué sectores de actividades vulnerables quedaron en ALTO en la matriz sectorial 2023?", "a": "Obras de arte; metales y joyas; monederos y certificados de recompensas", "o": ["Obras de arte; metales y joyas; vehículos aéreos, marítimos o terrestres", "Obras de arte; servicios de blindaje; metales preciosos y joyas", "Metales y joyas; tarjetas prepagadas; operaciones con activos virtuales", "Obras de arte; metales y joyas; monederos y certificados de recompensas"], "x": "En ALTO están Obras de arte; Metales preciosos, piedras preciosas, joyas y relojes; y Monederos y certificados de devoluciones o recompensas. Vehículos y tarjetas prepagadas quedaron en MEDIO; blindaje y activos virtuales, en MEDIO-BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1"}, {"id": "E069", "tema": "sec", "tipo": "trampa", "q": "¿Cuál de estos sectores de actividades vulnerables NO quedó en ALTO en 2023?", "a": "Vehículos aéreos, marítimos o terrestres", "o": ["Monederos y certificados de devoluciones o recompensas", "Metales preciosos, piedras preciosas, joyas y relojes", "Obras de arte", "Vehículos aéreos, marítimos o terrestres"], "x": "Vehículos aéreos, marítimos o terrestres quedó en MEDIO. Los otros tres son exactamente los tres sectores de AV en ALTO.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1"}, {"id": "E070", "tema": "sec", "tipo": "caso", "q": "«Casa de Empeño Robledal» realiza la actividad vulnerable de mutuo, préstamos o créditos y actualiza su evaluación de riesgos. ¿Qué nivel tiene su sector en la matriz sectorial 2023?", "a": "Medio", "o": ["Bajo", "Alto", "Medio", "Medio-Bajo"], "x": "Mutuo, préstamos o créditos quedó en MEDIO, junto con tarjetas prepagadas, vehículos, servidores públicos y fe pública. Ningún sector de AV quedó en BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV"}, {"id": "E071", "tema": "sec", "tipo": "caso", "q": "El «Despacho Contable Arrieta» realiza la actividad vulnerable de servicios profesionales y quiere el nivel de su sector en la matriz sectorial 2023. ¿Cuál es?", "a": "Medio-Bajo", "o": ["Bajo", "Medio", "Medio-Alto", "Medio-Bajo"], "x": "Servicios profesionales quedó en MEDIO-BAJO, uno de los diez sectores de AV en ese nivel. Medio-Alto no existe en la matriz sectorial (es de la escala integral) y ningún sector de AV quedó en BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV"}, {"id": "E072", "tema": "sec", "tipo": "caso", "q": "La plataforma ficticia «Criptonodo» realiza la actividad vulnerable de operaciones con activos virtuales. ¿En qué nivel quedó su sector en la matriz sectorial 2023?", "a": "Medio-Bajo", "o": ["Alto", "Medio", "Medio-Bajo", "Medio-Alto"], "x": "El sector de AV de activos virtuales quedó en MEDIO-BAJO. No lo confundas con el factor emergente «Debilidad regulatoria de los Activos Virtuales», cuyo riesgo integral es Medio (XI.7): son dos mediciones distintas.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1"}, {"id": "E073", "tema": "sec", "tipo": "caso", "q": "Un auditor revisa la cartera de un conglomerado ficticio y quiere listar los sectores del sistema financiero en BAJO. ¿Qué lista es correcta?", "a": "Afores, Seguros, Fianzas y Asesores de inversión", "o": ["Afores, Seguros, Fianzas y Asesores de inversión", "Seguros, Fianzas, Almacenes generales de depósito y Afores", "Afores, SOFI, Uniones de crédito y Asesores de inversión", "Afores, Seguros, Fianzas y SODAFI"], "x": "Los cuatro del SF en BAJO son Afores, Seguros, Fianzas y Asesores de inversión. SODAFI, SOFI, Uniones de crédito y Almacenes generales de depósito quedaron en MEDIO-BAJO.", "ref": "IV.1, tabla de riesgo de LD del SF; XI.1"}, {"id": "E074", "tema": "sec", "tipo": "cifra", "q": "¿Cuántos sectores de actividades vulnerables quedaron en BAJO en la matriz sectorial 2023?", "a": "Ninguno", "o": ["Cuatro", "Ninguno", "Dos", "Diez"], "x": "Ningún sector de AV quedó en BAJO: hay 3 en ALTO, 5 en MEDIO y 10 en MEDIO-BAJO (18 resultados). Cuatro es el número de sectores del SF en BAJO; diez es el de AV en MEDIO-BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV"}, {"id": "E075", "tema": "sec", "tipo": "cifra", "q": "¿Cuántos sectores del sistema financiero se evaluaron y cuántas matrices se aplicaron?", "a": "19 sectores y 23 matrices, por los 5 subsectores de la Banca Múltiple", "o": ["20 sectores y 18 matrices, sin Cheques de viajero ni Comercio exterior", "19 sectores y 19 matrices, una por cada sector del sistema financiero", "23 sectores y 19 matrices, por los 5 subsectores de la Banca Múltiple", "19 sectores y 23 matrices, por los 5 subsectores de la Banca Múltiple"], "x": "El SF tiene 19 sectores, pero la Banca Múltiple se subdivide en 5 subsectores (G7, Cambiarios, Inversión, Comercial y Crédito a los hogares), así que se aplicaron 23 matrices. 20 sectores y 18 matrices es el caso de las AV.", "ref": "IV, nota 6; IV.1, nota 10"}, {"id": "E076", "tema": "sec", "tipo": "cifra", "q": "En la evaluación sectorial de quienes realizan actividades vulnerables, ¿cuántos sectores hay y cuántas matrices se aplicaron?", "a": "20 sectores y 18 matrices", "o": ["19 sectores y 23 matrices", "18 sectores y 20 matrices", "20 sectores y 20 matrices", "20 sectores y 18 matrices"], "x": "Son 20 sectores de AV, pero sólo 18 matrices: Cheques de viajero y Comercio exterior no fueron susceptibles de aplicarles la matriz. 19 y 23 son las cifras del SF.", "ref": "IV, nota 7; IV.2, nota 15"}, {"id": "E077", "tema": "sec", "tipo": "memoria", "q": "¿Por qué no se aplicó la matriz sectorial al sector de Cheques de viajero?", "a": "No hay registros de su emisión y comercialización habitual o profesional", "o": ["No hay registros de su emisión y comercialización habitual o profesional", "Porque la LFPIORPI lo excluyó del catálogo de actividades vulnerables", "Porque el sector ya se evalúa dentro de la Banca Múltiple-Cambiarios", "Porque sus avisos se presentan con el pedimento que se transmite electrónicamente al SAT"], "x": "Para Cheques de viajero no existen registros de emisión y comercialización habitual o profesional. El pedimento transmitido al SAT es la razón de Comercio exterior (agente o apoderado aduanal), el otro sector de AV sin matriz.", "ref": "IV, nota 7"}, {"id": "E078", "tema": "sec", "tipo": "caso", "q": "Para explicar la matriz sectorial, un instructor pone el ejemplo de un sector hipotético con 85 % de calificación. ¿Qué nivel de riesgo le corresponde?", "a": "Medio", "o": ["Medio-Bajo", "Medio-Alto", "Alto", "Medio"], "x": "La matriz sectorial clasifica: 0–50 Bajo, 51–80 Medio-Bajo, 81–90 Medio y 91–100 Alto. Con 85 % es Medio. Medio-Alto no existe en esta escala.", "ref": "IV"}, {"id": "E079", "tema": "sec", "tipo": "trampa", "q": "En la matriz sectorial, ¿qué rango de calificación corresponde al nivel Medio-Bajo?", "a": "De 51 a 80 %", "o": ["De 51 a 80 %", "De 5 a 7 puntos", "De 0 a 50 %", "De 81 a 90 %"], "x": "Medio-Bajo va de 51 a 80 %. De 81 a 90 % es Medio y de 0 a 50 % es Bajo. De 5 a 7 es Medio-Alto, pero en la escala integral de 0 a 9 (XI.7), no en la sectorial.", "ref": "IV"}, {"id": "E080", "tema": "sec", "tipo": "caso", "q": "La oficial de cumplimiento de una ITF ficticia, «Kuali Pagos», necesita el nivel de su sector en la matriz sectorial 2023 del sistema financiero. ¿Cuál es?", "a": "Medio", "o": ["Medio-Bajo", "Bajo", "Alto", "Medio"], "x": "ITF/Fintech quedó en MEDIO en la matriz del SF. No lo mezcles con el factor «Debilidad regulatoria de las ITF», vulnerabilidad de LD en Medio/Medio de facilitación y explotación (VII.25): son mediciones distintas.", "ref": "IV.1, tabla de riesgo de LD del SF"}, {"id": "E081", "tema": "sec", "tipo": "caso", "q": "La «Unión de Crédito Sierra Alta», entidad ficticia, revisa la ENR para su evaluación de riesgos. ¿Qué nivel tiene el sector de uniones de crédito en la matriz sectorial 2023?", "a": "Medio-Bajo", "o": ["Alto", "Medio", "Medio-Bajo", "Bajo"], "x": "Uniones de crédito quedó en MEDIO-BAJO, con SOFI, Almacenes generales de depósito, SOFOMES no reguladas y SODAFI.", "ref": "IV.1, tabla de riesgo de LD del SF"}, {"id": "E082", "tema": "sec", "tipo": "caso", "q": "Un grupo financiero ficticio tiene cuatro filiales. Según la matriz sectorial 2023, ¿cuál de ellas pertenece a un sector en nivel MEDIO?", "a": "Casas de bolsa", "o": ["SOFI", "Almacenes generales de depósito", "Casas de bolsa", "Afore os de Percepción de Riesgos aplicados; 70,083 eran los SO de AV registrados en 2018.", "ref": "III; IV.1; IV.2; IV.3"}, {"id": "E089", "tema": "reg", "tipo": "memoria", "q": "¿Cuál es la finalidad del Plan de Acción Preliminar de la ENR 2023?", "a": "Encaminar recursos a lo que requiere más atención y generar medidas intensificadas o simplificadas según el riesgo", "o": ["Sustituir las DCG vigentes por un régimen único de PLD/CFT para el SF y para quienes realizan actividades vulnerables", "Sancionar a los sujetos obligados de los sectores que quedaron en ALTO en la matriz sectorial de riesgos", "Reclasificar los 37 factores para la siguiente ENR conforme a la Guía CNBV de 2019 para la metodología de las entidades", "Encaminar recursos a lo que requiere más atención y generar medidas intensificadas o simplificadas según el riesgo"], "x": "El apartado XII plantea propuestas preliminares de prevención y mitigación por factor, para encaminar la reasignación de recursos hacia lo que requiere mayor atención y generar las medidas intensificadas y simplificadas que correspondan según su nivel de riesgo.", "ref": "XII"}, {"id": "E090", "tema": "reg", "tipo": "caso", "q": "El plan de acción propone modificar las DCG del artículo 60 de la Ley Orgánica de la Financiera Nacional de Desarrollo Agropecuario, Rural, Forestal y Pesquero, sin actualizar desde el 2 de abril de 2015. ¿A qué factor atiende esa propuesta?", "a": "Debilidad en el Marco Jurídico del SF", "o": ["Deficiente información sobre el Beneficiario Final", "Debilidad en el Marco Jurídico del SF", "Debilidad en el Marco Jurídico de AV", "Debilidad del sistema Supervisor y Sancionador"], "x": "El apartado XII la presenta como propuesta para el fortalecimiento del Marco Jurídico del SF. Las DCG son normativa financiera; el Marco Jurídico de AV se refiere a la LFPIORPI y su reforma pendiente.", "ref": "XII; VI.2"}], "sitio": {"nombre": "Módulo 3", "raiz": "../", "actual": "3-3-3-enr", "paginas": [{"n": "3.1.1", "carpet <script>
(function(){
const D = JSON.parse(document.getElementById("datos").textContent);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// «Por qué no las otras»: q.d = {texto de opción incorrecta: razón}; opts = opciones en el orden en que se muestran
const tuHTML=(q,txt)=>(txt&&txt!==q.a&&q.d&&q.d[txt])?`<div class="tu"><b>Por qué tu respuesta está mal</b>${esc(q.d[txt])}</div>`:"";
const distHTML=(q,opts)=>{ if(!q.d) return ""; const it=opts.map((o,k)=>q.d[o]?`<li><b>${"ABCD"[k]}</b> ${esc(q.d[o])}</li>`:"").join(""); return it?`<div class="dist"><div class="lbl">Por qué no las otras</div><ul>${it}</ul></div>`:""; };
const RUTA = D.meta.ruta||"financiero";
const ACENTOS = {financiero:["morado","turquesa"], av:["turquesa","coral"], transversal:["morado","coral"], gratuito:["morado","turquesa"]}[RUTA]||["morado","turquesa"];
const COLORES = ["c-principal","c-"+ACENTOS[0],"c-"+ACENTOS[1],"c-negro"];
const colorDe = (v,i)=>v?("c-"+v):COLORES[i%4];
document.documentElement.setAttribute("data-ruta", RUTA);
const RUTAS = {financiero:"Ruta Sector financiero", av:"Ruta Actividades vulnerables", transversal:"Transversales", gratuito:"Gratuitos"};

/* ---------- encabezado, portada, trampas, pie ---------- */
$("#brand").innerHTML = `<b>360EDUCA</b><span>${esc(D.meta.modulo||"")}</span><span class="ruta">${esc(RUTAS[D.meta.ruta||"financiero"])}</span>`;
$("#nav").innerHTML = D.secciones.filter(s=>s.nav).map(s=>`<a href="#${s.id}"${s.tipo==="simulador"?' class="cta"':""}>${esc(s.nav)}</a>`).join("");
/* ---------- modo sitio: franja de páginas (opcional) ---------- */
if(D.sitio && Array.isArray(D.sitio.paginas)){
  const S=D.sitio, raiz=S.raiz||"", act=S.actual||"";
  const ETQ={preparacion:"En preparación", proximamente:"Próximamente"};
  const actual=S.paginas.find(p=>p.carpeta===act);
  $("#sitebar").innerHTML = `<a class="sb-mod" href="${esc(raiz)}index.html"${act?"":' aria-current="page"'}>${esc(S.nombre||"Portada")}</a><span class="sb-sep"></span>`+
    S.paginas.map(p=>{
      const tip=`Tema ${p.n} · ${p.pregunta||""}`;
      if(p.estado && p.estado!=="integrada") return `<span class="sb-p off" title="${esc(tip)} · ${esc(ETQ[p.estado]||p.estado)}" aria-disabled="true">${esc(p.n)}</span>`;
      return `<a class="sb-p" href="${esc(raiz+p.carpeta)}/index.html" title="${esc(tip)}"${p.carpeta===act?' aria-current="page"':""}>${esc(p.n)}</a>`;
    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+
    (actual?`<span class="sb-ses">Tema ${esc(actual.n)} · ${esc(actual.pregunta||"")}</span>`:"");
  $("#sitebar").hidden=false;
}
const mapa0 = D.secciones.find(s=>s.tipo==="mapa");
let rhythm = "";
if(Array.isArray(D.meta.ritmo)){ // ritmo puesto a mano: [{n, lb, q, color}]
  const R0=D.meta.ritmo;
  rhythm = `<div><div class="rhythm${R0.length>4?" many":""}">${R0.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${esc(r.n)}</span><span class="lb">${esc(r.lb||"")}</span><span class="q">${esc(r.q||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${D.meta.ritmo_cap?esc(D.meta.ritmo_cap):`${R0.map(r=>r.n).join(" · ")} = ${R0.reduce((a,r)=>a+(+r.n||0),0)} ${esc(D.meta.unidad||"")}`}</div></div>`;
} else if(mapa0 && D.meta.ritmo!==false){
  const counts = mapa0.ramas.map(r=>r.items.length);
  rhythm = `<div><div class="rhythm${mapa0.ramas.length>4?" many":""}">${mapa0.ramas.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${r.items.length}</span><span class="lb">${esc(r.corto||r.letra)}</span><span class="q">${esc(r.ritmo||r.pregunta||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${counts.join(" · ")} = ${counts.reduce((a,b)=>a+b,0)} ${esc(D.meta.unidad||"")}</div></div>`;
}
$("#hero").innerHTML = `<div><div class="lbl">${esc(D.meta.eyebrow||"")}</div>
  <h1>${esc(D.meta.h1_antes||"")} <mark>${esc(D.meta.h1_resaltado||"")}</mark> ${esc(D.meta.h1_despues||"")}</h1>
  <p>${D.meta.intro||""}</p></div>${rhythm}`;
$("#traps").innerHTML = (D.trampas||[]).map((t,i)=>`<div class="trapc"><span class="tag">Trampa ${D.trampas.length>1?i+1:"de examen"}</span><p><b>${esc(t.titulo)}</b> ${t.texto}</p></div>`).join("");
if(!(D.trampas||[]).length) $("#traps").hidden=true;
$("#pie").innerHTML = `<b>GMC360 · 360Educa</b> — ${D.meta.fuente||""} Material didáctico; los textos están resumidos, consulta la publicación oficial para la redacción íntegra.`;

/* ---------- secciones ---------- */
const head = s=>!s.titulo?"":`<div class="sec-head"><h2>${esc(s.titulo)}</h2>${s.intro?`<p>${s.intro}</p>`:""}</div>${s.para?`<div class="para"><b>Para qué sirve</b>${s.para}</div>`:""}`;
const chant = f=>f?`<div class="chant"><div class="lbl">${esc(f.titulo||"Para recitar en voz alta")}</div><p>${f.html}</p></div>`:"";
const R = {};
let ITEMS = {}; // id -> {item, rama, color}
R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="frac"><button aria-expanded="false" data-ficha="${id}"><span class="rom">${esc(it.etiqueta)}</span><span><span class="nm">${esc(it.nombre)}</span><span class="hookt">${esc([it.verbo,it.gancho].filter(Boolean).join(" · "))}</span></span><span class="cnt">${esc(it.conteo||"")}</span></button><ul class="inc" hidden>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul></li>`}).join("")}</ul>`;
    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};
R.tarjetas = s=>head(s)+`<div class="cards">${s.tarjetas.map((c,i)=>{
  const col = colorDe(c.color,i);
  const top = c.encabezado?`<div class="chead"><div class="t">${esc(c.titulo)}</div>${c.subtitulo?`<div class="a">${esc(c.subtitulo)}</div>`:""}</div>`:(c.barra?`<div class="bar"></div>`:"");
  const body = c.filas? c.filas.map(f=>`<div class="frow"><span class="k">${esc(f.k)}</span>${f.v}</div>`).join("")
    : `<div class="cbody">${c.etiqueta?`<div class="lbl">${esc(c.etiqueta)}</div>`:""}${c.encabezado?"":`<h3>${esc(c.titulo)}</h3>`}${c.ref?`<span class="art">${esc(c.ref)}</span>`:""}${c.html?`<p>${c.html}</p>`:""}${c.lista?`<ul>${c.lista.map(l=>`<li>${l}</li>`).join("")}</ul>`:""}</div>`;
  return `<div class="card ${col}${c.ancho?" wide":""}">${top}${body}</div>`;}).join("")}</div>${s.nota?`<div class="note">${s.nota}</div>`:""}`;
R.escala = s=>{const cols=["var(--principal-linea)","#80bcb5","#a663cc","#ff8361","var(--oscuro)"];

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);

/* ---------- repaso (tandas al azar o secuencia fija) ---------- */
// Con "pool": tandas al azar de 10/20/30 (configurable en "tandas") que no repiten hasta agotar el banco de repaso;
// las opciones se barajan. Con "bloques": secuencia fija, opciones sin barajar (para un guion con letras).
// Clic en una opción = respuesta del alumno; «Revelar respuesta» = la instructora muestra la correcta sin marcar a nadie.
D.secciones.filter(s=>s.tipo==="repaso").forEach(s=>{
  const BK={}; (D.banco||[]).forEach(q=>BK[q.id]=q);
  const TM=D.temas||{}, sim=D.secciones.find(x=>x.tipo==="simulador"), CL=s.claves||{};
  const box=$("#rp-"+s.id), idx=$("#rpi-"+s.id);
  const mix=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const KEY="rp-"+(D.meta.clave||"mapa")+"-"+s.id;
  const POOL=(s.pool||[]).filter(id=>BK[id]);
  let seq=[], i=0, meta=null;
  function fixedSeq(){ const out=[]; (s.bloques||[]).forEach((b,bi)=>b.items.forEach(it=>{if(BK[it.id]) out.push({...BK[it.id],opts:BK[it.id].o.slice(),clave:it.clave||CL[it.id]||"",extra:!!it.extra,bi,bt:b.titulo});})); return out; }
  function tanda(n){
    let used=new Set(st.get(KEY,[])), rest=POOL.filter(id=>!used.has(id)), pick;
    if(rest.length<n){ pick=mix(rest); used=new Set(); const more=mix(POOL.filter(id=>!pick.includes(id))).slice(0,n-pick.length); pick=pick.concat(more); more.forEach(id=>used.add(id)); }
    else { pick=mix(rest).slice(0,n); pick.forEach(id=>used.add(id)); }
    st.set(KEY,[...used]);
    return mix(pick).map(id=>({...BK[id],opts:mix(BK[id].o),clave:CL[id]||""}));
  }
  const sinSalir=()=>`${POOL.length-new Set(st.get(KEY,[])).size} de ${POOL.length} sin salir`;
  function start(n){ seq=n?tanda(n):fixedSeq(); meta={n}; seq.forEach(q=>{q.pick=null;q.shown=false;}); i=0; draw(); box.scrollIntoView({block:"start"}); }
  const fsTxt=()=>document.fullscreenElement?"Salir de pantalla completa":"Pantalla completa";
  if(s.pool){
    idx.innerHTML=(s.tandas||[10,20,30]).map(n=>`<button class="rpb" data-rpn="${n}" aria-pressed="false">${n} preguntas</button>`).join("")+`<span class="bankinfo" id="rpinfo-${s.id}" style="align-self:center">${POOL.length} preguntas en el banco de repaso · ${sinSalir()}</span>`;
    box.innerHTML=`<div class="qtext">Elige una tanda de ${(s.tandas||[10,20,30]).join(", ").replace(/, (\d+)$/," o $1")} preguntas.</div><p style="margin:10px 0 0">Salen al azar y no se repiten hasta agotar las ${POOL.length}; las opciones cambian de orden cada vez.</p>`;
  } else {
    idx.innerHTML=(s.bloques||[]).map((b,bi)=>`<button class="rpb" data-rpb="${bi}" aria-pressed="false">${bi+1} · ${esc(b.titulo)} <small>${b.items.length}</small></button>`).join("");
  }
  function draw(){
    idx.querySelectorAll("[data-rpn]").forEach(b=>b.setAttribute("aria-pressed",String(meta&&+b.dataset.rpn===meta.n)));
    if(!s.pool) idx.querySelectorAll("[data-rpb]").forEach(b=>b.setAttribute("aria-pressed",String(i<seq.length&&+b.dataset.rpb===seq[i].bi)));
    if(i>=seq.length) return fin();
    const q=seq[i], ok=q.opts.indexOf(q.a), lab=s.pool?`Tanda de ${seq.length}`:`Bloque ${q.bi+1} · ${esc(q.bt)}`;
    const good=seq.filter(x=>x.pick!=null&&x.opts[x.pick]===x.a).length;
    box.innerHTML=`<div class="qbar"><span>${lab} · pregunta ${i+1} de ${seq.length}</span><span>Aciertos: ${good}</span></div><div class="qprog"><i style="width:${i/seq.length*100}%"></i></div>
    <div class="qtag"><span>${esc(TM[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}${q.extra?"<span>Extra</span>":""}</div><div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt${q.shown?(k===ok?" right":(k===q.pick?" wrong":"")):""}" data-rpk="${k}"${q.shown?" disabled":""}><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="fb">${q.shown?`${q.pick==null?`<span class="ok">Respuesta ${"ABCD"[ok]}</span>`:(q.pick===ok?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>')}${q.pick!=null?tuHTML(q,q.opts[q.pick]):""} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}${q.clave?`<div class="rp-clave"><div class="lbl">Para no confundirte</div>${q.clave}</div>`:""}`:""}</div>
    <div class="qactions"><button class="btn ghost" data-rpnav="-1"${i===0?" disabled":""}>← Anterior</button>${q.shown?"":`<button class="btn" data-rpshow>Revelar respuesta</button>`}<button class="btn ghost" data-rpnav="1">${i+1===seq.length?"Ver resultado →":"Siguiente →"}</button><button class="btn ghost" data-rpfs>${fsTxt()}</button></div>`;
  }
  function fin(){
    const resp=seq.filter(x=>x.pick!=null), good=resp.filter(x=>x.opts[x.pick]===x.a).length, miss=seq.filter(x=>x.pick!=null&&x.opts[x.pick]!==x.a), c=s.cierre;
    box.innerHTML=`<div class="qbar"><span>${s.pool?`Tanda de ${seq.length} · resultado`:"Cierre"}</span><span>${resp.length?`${good}/${resp.length}`:""}</span></div><div class="qprog"><i style="width:100%"></i></div>
    ${resp.length?`<div class="score"><span class="big">${Math.round(good/resp.length*100)}%</span><span>${good} de ${resp.length} contestadas correctamente.</span></div>`:""}
    ${miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${miss.length})</summary><ul>${miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.opts[m.pick])}</s>${m.d&&m.d[m.opts[m.pick]]?` — ${esc(m.d[m.opts[m.pick]])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
    ${c?`<div class="qtext" style="margin-top:18px">${esc(c.titulo)}</div><ol class="rp-fin">${(c.pasos||[]).map(p=>`<li>${p}</li>`).join("")}</ol>${c.nota?`<div class="rp-clave">${c.nota}</div>`:""}`:""}
    <div class="qactions"><button class="btn ghost" data-rpnav="-1">← Anterior</button>${s.pool?`<button class="btn" data-rpn="${meta.n}">Otra tanda de ${meta.n}</button>`:""}${sim?`<a class="btn ghost" href="#${sim.id}">${esc(sim.nav||"Practicar")}</a>`:""}<button class="btn ghost" data-rpfs>${fsTxt()}</button></div>
    ${s.pool?`<p class="siminfo">${sinSalir()}</p>`:""}`;
    const inf=$("#rpinfo-"+s.id); if(inf) inf.textContent=`${POOL.length} preguntas en el banco de repaso · ${sinSalir()}`;
  }
  function reveal(){ if(!seq.length||i>=seq.length||seq[i].shown) return; seq[i].shown=true; draw(); }
  const go=n=>{ if(!seq.length) return; i=Math.max(0,Math.min(n,seq.length)); draw(); };
  function fs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else if(box.requestFullscreen) box.requestFullscreen(); }catch(e){} }
  document.addEventListener("fullscreenchange",()=>{const f=box.querySelector("[data-rpfs]");if(f)f.textContent=fsTxt();});
  const onClick=e=>{
    const n=e.target.closest("[data-rpn]"); if(n){start(+n.dataset.rpn);return;}
    const b=e.target.closest("[data-rpb]"); if(b){if(!seq.length||s.pool)start(0);go(seq.findIndex(q=>q.bi===+b.dataset.rpb));return;}
    const o=e.target.closest("[data-rpk]"); if(o&&seq[i]&&!seq[i].shown){seq[i].pick=+o.dataset.rpk;reveal();return;}
    if(e.target.closest("[data-rpshow]")){reveal();return;}
    const nv=e.target.closest("[data-rpnav]"); if(nv){go(i+(+nv.dataset.rpnav));return;}
    if(e.target.closest("[data-rpfs]")) fs();
  };
  idx.addEventListener("click",onClick); box.addEventListener("click",onClick);
  document.addEventListener("keydown",e=>{
    if(!seq.length||e.target.closest("input,textarea")||!$("#drawer").hidden) return;
    const r=box.getBoundingClientRect(); if(document.fullscreenElement!==box&&(r.bottom<0||r.top>innerHeight)) return;
    if(e.key==="ArrowRight"){go(i+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(i-1);e.preventDefault();}
    else if(e.key.toLowerCase()==="r"){reveal();e.preventDefault();}
    else if(e.key.toLowerCase()==="f"){fs();e.preventDefault();}
  });
  if(!s.pool) start(0);
});

/* ---------- simulador ---------- */
if(!D.secciones.some(s=>s.tipo==="simulador")) return;
const BANK=D.banco||[], TEMAS=D.temas||{};
const MODOS=[{k:"all",l:"Todo mezclado",f:()=>true}].concat((D.modos||[]).map(m=>({k:m.k,l:m.l,f:x=>(m.tema?x.tema===m.tema:true)&&(m.tipos?m.tipos.includes(x.tipo):true)})));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY=D.meta.clave||"mapa", SEEN="seen-"+KEY, SIM="sim-"+KEY;
let seen=new Set(store.get(SEEN,[])), MODE="all", ST=null;
const poolFor=k=>BANK.filter(MODOS.find(m=>m.k===k).f);
const simInfo=()=>`${BANK.length-store.get(SIM,[]).length} de ${BANK.length} sin salir en simulacro`;
const bankInfo=()=>`${BANK.length} reactivos verificados contra el texto oficial · ${simInfo()}`;
function startRound(){const pool=poolFor(MODE);const fresh=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));start(fresh.concat(old).slice(0,10),{kind:"ronda",label:MODOS.find(m=>m.k===MODE).l});}
const SIMSEC=D.secciones.find(s=>s.tipo==="simulador")||{};
function cuotas(n,pesos){ // reparto por resto mayor; sólo temas con reactivos
  const ks=Object.keys(pesos).filter(k=>pesos[k]>0&&BANK.some(x=>x.tema===k)), tot=ks.reduce((a,k)=>a+pesos[k],0);
  if(!ks.length) return null;
  const raw=ks.map(k=>({k,v:n*pesos[k]/tot})), out={}; let asig=0;
  raw.forEach(r=>{out[r.k]=Math.floor(r.v);asig+=out[r.k];});
  raw.sort((a,b)=>(b.v%1)-(a.v%1)).slice(0,n-asig).forEach(r=>out[r.k]++);
  return out;
}
function startSim(n){
  if(SIMSEC.proporcion){
    const q=cuotas(n,SIMSEC.proporcion);
    if(q){
      let used=new Set(store.get(SIM,[])), pick=[], cycled=false;
      Object.entries(q).forEach(([k,c])=>{
        const delTema=BANK.filter(x=>x.tema===k); let rest=shuffle(delTema.filter(x=>!used.has(x.id)));
        if(rest.length<c){cycled=true;delTema.forEach(x=>used.delete(x.id));rest=rest.concat(shuffle(delTema.filter(x=>!rest.includes(x))));}
        rest=rest.slice(0,c); rest.forEach(x=>used.add(x.id)); pick=pick.concat(rest);
      });
      store.set(SIM,[...used]); return start(shuffle(pick),{kind:"simulacro",label:`Simulacro de ${pick.length}`,n,cycled});
    }
  }
  let used=new Set(store.get(SIM,[])), rest=BANK.filter(x=>!used.has(x.id)), cycled=false;
  if(rest.length<n){cycled=true;const take=shuffle(rest);used=new Set();const more=shuffle(BANK.filter(x=>!take.includes(x))).slice(0,n-take.length);rest=take.concat(more);more.forEach(x=>used.add(x.id));}
  else{rest=shuffle(rest).slice(0,n);rest.forEach(x=>used.add(x.id));}
  store.set(SIM,[...used]); start(shuffle(rest),{kind:"simulacro",label:`Simulacro de ${n}`,n,cycled});
}
function start(list,meta){ST={list:list.map(q=>({...q,opts:shuffle(q.o)})),i:0,ok:0,miss:[],byTema:{},meta};document.querySelectorAll(".qmode,.qsim").forEach(b=>b.setAttribute("aria-pressed","false"));render();}
function render(){
  const box=$("#quiz"),n=ST.list.length; if(ST.i>=n) return renderEnd();
  const q=ST.list[ST.i];
  box.innerHTML=`<div class="qbar"><span>${esc(ST.meta.label)} · reactivo ${ST.i+1} de ${n}</span><span>Aciertos: ${ST.ok}</span></div><div class="qprog"><i style="width:${ST.i/n*100}%"></i></div>
  <div class="qtag"><span>${esc(TEMAS[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}</div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>
  <div class="qactions"><button class="btn" id="qNext" hidden>${ST.i+1===n?"Ver resultado":"Siguiente"}</button><button class="btn ghost" id="qQuit">Terminar aquí</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  $("#qNext").addEventListener("click",()=>{ST.i++;render();});
  $("#qQuit").addEventListener("click",()=>{ST.list=ST.list.slice(0,ST.i);renderEnd();});
}
function answer(k){
  const q=ST.list[ST.i]; if(q.done) return; q.done=true; const good=q.opts[k]===q.a;
  const t=ST.byTema[q.tema]||(ST.byTema[q.tema]={ok:0,n:0}); t.n++; if(good){ST.ok++;t.ok++;} else {q.mine=q.opts[k];ST.miss.push(q);}
  seen.add(q.id); store.set(SEEN,[...seen]);
  $("#quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.a)b.classList.add("right");else if(+b.dataset.k===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`${good?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>'}${good?"":tuHTML(q,q.opts[k])} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}`;
  const nb=$("#qNext"); nb.hidden=false; nb.focus();
}
function renderEnd(){
  const box=$("#quiz"),n=ST.list.length,pct=n?Math.round(ST.ok/n*100):0;
  const msg=pct>=90?"Listos para el examen.":pct>=75?"Muy bien: repasen los temas con menos aciertos.":pct>=60?"Van bien, pero hay que repasar.":"Toca volver al mapa y repasar antes del siguiente intento.";
  const rows=Object.entries(ST.byTema).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>`<div class="trow2"><span>${esc(TEMAS[k]||k)}</span><span class="tb"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></span><span class="tv">${v.ok}/${v.n}</span></div>`).join("");
  box.innerHTML=`<div class="printhead"><b>${esc(D.meta.titulo)}</b> · 360Educa · ${esc(ST.meta.label)} · ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div><div class="qbar"><span>${esc(ST.meta.label)} · resultado</span><span>${ST.ok}/${n}</span></div><div class="qprog"><i style="width:100%"></i></div>
  <div class="score"><span class="big">${pct}%</span><span>${ST.ok} de ${n} correctas. ${msg}</span></div>
  ${rows?`<div class="lbl" style="margin-top:14px">Aciertos por tema (de menor a mayor)</div><div class="trows">${rows}</div>`:""}
  ${ST.miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${ST.miss.length})</summary><ul>${ST.miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.mine||"")}</s>${m.d&&m.d[m.mine]?` — ${esc(m.d[m.mine])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
  <div class="qactions"><button class="btn" id="qAgain">${ST.meta.kind==="simulacro"?"Otro simulacro igual":"Otra ronda"}</button><button class="btn ghost" id="qPrint">Imprimir o guardar en PDF</button><a class="btn ghost" href="#${mapa0?mapa0.id:"top"}">Repasar el mapa</a></div>
  ${ST.meta.kind==="simulacro"?`<p class="siminfo">${simInfo()}${ST.meta.cycled?" · Se completó el banco y empezó una vuelta nueva.":""}</p>`:""}`;
  $("#qAgain").addEventListener("click",()=>ST.meta.kind==="simulacro"?startSim(ST.meta.n):startRound());
  $("#qPrint").addEventListener("click",()=>{const d=box.querySelector("details.miss");if(d)d.open=true;window.print();});
  $("#bankinfo").textContent=bankInfo();
}
document.addEventListener("keydown",e=>{
  if(!ST||e.target.closest("input,textarea")) return;
  const r=$("#quiz").getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
  const k="abcd1234".indexOf(e.key.toLowerCase()); if(k>=0&&ST.i<ST.list.length&&!ST.list[ST.i].done){answer(k%4);e.preventDefault();}
});
$("#modes").innerHTML=MODOS.map(m=>`<button class="qmode" data-m="${m.k}" aria-pressed="false">${esc(m.l)} <small>${poolFor(m.k).length}</small></button>`).join("");
document.querySelectorAll(".qmode").forEach(b=>b.addEventListener("click",()=>{MODE=b.dataset.m;startRound();b.setAttribute("aria-pressed","true");}));
document.querySelectorAll(".qsim").forEach(b=>b.addEventListener("click",()=>{startSim(+b.dataset.n);b.setAttribute("aria-pressed","true");}));
$("#simReset").addEventListener("click",()=>{store.set(SIM,[]);store.set(SEEN,[]);seen=new Set();$("#bankinfo").textContent=bankInfo();});
$("#bankinfo").textContent=bankInfo();
startRound(); document.querySelector('.qmode[data-m="all"]').setAttribute("aria-pressed","true");
})();
</script>
</body>
</html>
