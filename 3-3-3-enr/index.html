B<\/li><\/ul>"}]}, {"encabezado": true, "color": "turquesa", "titulo": "FPADM y emergentes", "subtitulo": "XI.5 y XI.6 · 3 + 3", "filas": [{"k": "Amenazas (6)", "v": "<ul><li>F32 ADM en México AB<\/li><li>F33 Financiamiento de ADM AB<\/li><li>F34 Respuesta a un ataque con ADM AM<\/li><li>F35 Activos virtuales AM<\/li><li>F36 Ransomware AA<\/li><li>F37 COVID-19 MM<\/li><\/ul>"}]}, {"encabezado": true, "color": "morado", "titulo": "Sistema financiero", "subtitulo": "XI.1 · 23", "filas": [{"k": "Alto (2)", "v": "<ul><li>BM-G7 A<\/li><li>BM-Cambiarios A<\/li><\/ul>"}, {"k": "Medio (12)", "v": "<ul><li>Casas de cambio M<\/li><li>Banca de desarrollo M<\/li><li>BM-Crédito a los hogares M<\/li><li>SOCAPS M<\/li><li>SOFIPO M<\/li><li>BM-Inversión M<\/li><li>Transmisores de dinero M<\/li><li>BM-Comercial M<\/li><li>SOFOMES reguladas M<\/li><li>Casas de bolsa M<\/li><li>ITF/Fintech M<\/li><li>Centros cambiarios M<\/li><\/ul>"}, {"k": "Medio-Bajo (5)", "v": "<ul><li>Uniones de crédito M‑B<\/li><li>SOFI M‑B<\/li><li>Almacenes generales de depósito M‑B<\/li><li>SOFOMES no reguladas M‑B<\/li><li>SODAFI M‑B<\/li><\/ul>"}, {"k": "Bajo (4)", "v": "<ul><li>Afores B<\/li><li>Seguros B<\/li><li>Fianzas B<\/li><li>Asesores de inversión B<\/li><\/ul>"}]}, {"encabezado": true, "color": "turquesa", "titulo": "Actividades vulnerables", "subtitulo": "XI.1 · 18", "filas": [{"k": "Alto (3)", "v": "<ul><li>Obras de arte A<\/li><li>Metales, piedras, joyas y relojes A<\/li><li>Monederos y recompensas A<\/li><\/ul>"}, {"k": "Medio (5)", "v": "<ul><li>Tarjetas prepagadas, vales o cupones M<\/li><li>Vehículos M<\/li><li>Servidores públicos M<\/li><li>Fe pública M<\/li><li>Mutuo, préstamos o créditos M<\/li><\/ul>"}, {"k": "Medio-Bajo (10)", "v": "<ul><li>Blindaje M‑B<\/li><li>Tarjetas de servicios o de crédito M‑B<\/li><li>Juegos con apuesta y sorteos M‑B<\/li><li>Transmisión de inmuebles M‑B<\/li><li>Recepción de donativos M‑B<\/li><li>Uso o goce de inmuebles M‑B<\/li><li>Desarrollo inmobiliario M‑B<\/li><li>Activos virtuales (sector de AV) M‑B<\/li><li>Servicios profesionales M‑B<\/li><li>Traslado o custodia de dinero o valores M‑B<\/li><\/ul>"}, {"k": "Bajo (0)", "v": "Ninguno"}]}, {"encabezado": true, "color": "negro", "titulo": "Riesgos finales", "subtitulo": "XI.7 · 6", "filas": [{"k": "Nivel", "v": "<ul><li>LD M‑A<\/li><li>FT B<\/li><li>FPADM B<\/li><li>Activos virtuales M<\/li><li>Ransomware M<\/li><li>COVID-19 B<\/li><\/ul>"}]}], "nota": "Criterio de clase: las abreviaturas y los códigos son ayuda para memorizar; los nombres oficiales están en las fichas y en la tarjeta de sectores."}, {"tipo": "repaso", "id": "ejercicio", "nav": "Ejercicio", "titulo": "Ejercicio de niveles", "intro": "Nombre → grado y grado → lista, en tandas al azar. Di la respuesta en voz alta antes de tocar una opción; luego revela. Los códigos son los de la calca: «F18 Contratación pública AA», «SOFIPO M».", "pool": ["E091", "E092", "E093", "E094", "E095", "E096", "E097", "E098", "E099", "E100", "E101", "E102", "E103", "E104", "E105", "E106", "E107", "E108", "E109", "E110", "E111", "E112", "E113", "E114", "E115", "E116", "E117", "E118", "E119", "E120", "E121", "E122", "E123", "E124", "E125", "E126"], "tandas": [10, 20, 30]}, {"tipo": "cifras", "id": "cifras", "nav": "Cifras", "titulo": "Niveles y conteos que preguntan", "intro": "Cada número con su apartado de la ENR.", "cifras": [["37", "factores", "De riesgo, en 5 rubros: régimen, LD, FT, FPADM y emergentes", "II y V.1"], ["26", "factores", "Tenían la ENR 2016 (5 rubros) y la ENR 2020 (6 rubros)", "II"], ["12·13·6·3·3", "por rubro", "Régimen · LD · FT · FPADM · emergentes", "XI.2 a XI.6"], ["8", "en ALTO/ALTO", "Factores 13, 14, 15, 18, 23, 24, 29 y 36", "XI.3 a XI.6"], ["19 / 23", "sectores / matrices", "Sistema financiero: la Banca Múltiple se divide en 5 subsectores", "IV.1"], ["20 / 18", "sectores / matrices", "AV: sin matriz para Cheques de viajero ni Comercio exterior", "IV y IV.2"], ["91–100", "% = Alto", "Matriz sectorial: 81–90 Medio · 51–80 Medio-Bajo · 0–50 Bajo", "IV"], ["5–7", "Medio-Alto", "Rango del riesgo de LD; integral: 0–3 Bajo · 3–5 Medio · 7–9 Alto", "XI.7"], ["2 / 3", "en ALTO", "Sectores en ALTO: 2 del SF (BM-G7 y BM-Cambiarios) y 3 de AV", "XI.1"], ["12 / 10", "SF en MEDIO / AV en MEDIO-BAJO", "12 del SF en MEDIO (AV en MEDIO: 5) y 10 de AV en MEDIO-BAJO (SF en MEDIO-BAJO: 5)", "XI.1"], ["4 / 0", "en BAJO", "SF en BAJO: Afores, Seguros, Fianzas y Asesores de inversión · AV en BAJO: ninguno", "XI.1"], ["12 / 25", "A / V", "12 amenazas y 25 vulnerabilidades", "XI.2 a XI.6"]]}, {"tipo": "tarjetas", "id": "medicion", "nav": "Cómo se mide", "titulo": "Cómo se mide, en corto", "intro": "Lo único de metodología que hace falta para los niveles: qué binomio lleva cada factor y qué escala usa cada tabla.", "tarjetas": [{"encabezado": true, "color": "morado", "titulo": "Amenaza o vulnerabilidad", "subtitulo": "V.3", "filas": [{"k": "Amenazas (12)", "v": "<b>Grado de impacto<\/b> y <b>probabilidad de ocurrencia<\/b>: 3 de LD, 3 de FT, 3 de FPADM y los 3 emergentes."}, {"k": "Vulnerabilidades (25)", "v": "<b>Grado de facilitación<\/b> y <b>probabilidad de explotación<\/b>: 12 del régimen, 10 de LD y 3 de FT."}, {"k": "Regla", "v": "La columna de la tabla dice qué es el factor; el nivel no. Estar en ALTO no lo vuelve amenaza."}]}, {"encabezado": true, "color": "turquesa", "titulo": "Tres escalas", "subtitulo": "V.3 · IV · XI.7", "filas": [{"k": "Cada dimensión de un factor", "v": "0 a 9: 0–3 <b>Bajo<\/b> · 3–6 <b>Medio<\/b> · 6–9 <b>Alto<\/b>, igual para impacto/facilitación y para ocurrencia/explotación (V.3)"}, {"k": "Sectores", "v": "%: 0–50 <b>Bajo<\/b> · 51–80 <b>Medio-Bajo<\/b> · 81–90 <b>Medio<\/b> · 91–100 <b>Alto<\/b> (IV)"}, {"k": "Riesgos finales", "v": "0 a 9: 0–3 <b>Bajo<\/b> · 3–5 <b>Medio<\/b> · 5–7 <b>Medio-Alto<\/b> · 7–9 <b>Alto<\/b> (XI.7)"}]}, {"barra": true, "color": "negro", "titulo": "Régimen y plan de acción", "ref": "Apartados III y XII", "html": "Supervisoras: CNBV, CNSF, CONSAR y SAT. Reguladoras: SHCP (UBD, UBVA, USPSS y UIF) y BANXICO. La UIF recibe reportes y avisos, analiza, disemina inteligencia y, en su caso, denuncia. El Plan de Acción Preliminar propone medidas por factor para encaminar recursos a lo que requiere más atención, con medidas intensificadas o simplificadas según el riesgo; por ejemplo, actualizar las DCG del art. 60 de la Ley Orgánica de la Financiera Nacional de Desarrollo Agropecuario, Rural, Forestal y Pesquero, sin cambios desde el 2-abr-2015."}]}, {"tipo": "simulador", "id": "examen", "nav": "Practicar ▸"}], "temas": {"fac": "Los 37 factores y sus grados", "sec": "Sectores del SF y de AV", "fin": "Riesgos finales", "met": "Escalas y amenaza contra vulnerabilidad", "otr": "Rubros, conteos y régimen"}, "modos": [{"k": "fac", "l": "Los 37 factores", "tema": "fac"}, {"k": "sec", "l": "Sectores", "tema": "sec"}, {"k": "fin", "l": "Riesgos finales", "tema": "fin"}, {"k": "met", "l": "Escalas y trampas", "tema": "met"}, {"k": "otr", "l": "Rubros y régimen", "tema": "otr"}, {"k": "caso", "l": "Casos prácticos", "tipos": ["caso"]}], "banco": [{"id": "E001", "tema": "fac", "tipo": "caso", "q": "La analista Itzel prepara una lámina sobre el factor «Aumento de la corrupción». Según el mapa de riesgo de LD, ¿qué clasificación y qué grados le corresponden?", "a": "Amenaza de LD; grado de impacto Alto y probabilidad de ocurrencia Alto", "o": ["Vulnerabilidad del régimen; grado de facilitación Alto y probabilidad de explotación Medio", "Amenaza de LD; grado de impacto Alto y probabilidad de ocurrencia Medio", "Amenaza de LD; grado de impacto Alto y probabilidad de ocurrencia Alto", "Vulnerabilidad de LD; grado de facilitación Alto y probabilidad de explotación Alto"], "x": "La corrupción es una de las tres amenazas de LD (con delincuencia organizada y recursos ilícitos generados en México) y las tres están en Alto/Alto. Al ser amenaza se mide con impacto y ocurrencia; el distractor más tentador cambia la columna a facilitación/explotación, que es propia de las vulnerabilidades (V.3).", "ref": "XI.3, tabla de amenazas de LD"}, {"id": "E004", "tema": "fac", "tipo": "caso", "q": "El oficial de cumplimiento Ramiro quiere ilustrar, con una sola vulnerabilidad de LD, el caso de un factor en ALTO en sus dos dimensiones. ¿Cuál debe elegir?", "a": "Debilidad en los procesos de contratación pública de bienes y servicios", "o": ["Debilidad regulatoria de las Instituciones de Tecnología Financiera", "Deficiente Cultura Constitucional", "Debilidad en los procesos de contratación pública de bienes y servicios", "Incremento en las operaciones en dólares de los EE. UU. y otras divisas"], "x": "Contratación pública tiene facilitación Alto y explotación Alto. Cultura Constitucional es el distractor más tentador porque también tiene facilitación Alto, pero su explotación es Medio. Dólares e ITF están en Medio/Medio.", "ref": "XI.3, tabla de vulnerabilidades de LD"}, {"id": "E005", "tema": "fac", "tipo": "trampa", "q": "¿Cuál de estos factores NO está en ALTO en sus dos dimensiones?", "a": "Deficiente Cultura Constitucional", "o": ["Incremento de los ataques de Ransomware", "Deficiente Cultura Constitucional", "Aumento de la Delincuencia Organizada", "Deficiente impartición de justicia"], "x": "Cultura Constitucional tiene facilitación Alto pero explotación Medio. Delincuencia organizada (amenaza de LD), impartición de justicia (vulnerabilidad de LD) y ransomware (amenaza emergente) están en Alto/Alto; son tres de los ocho factores con ese nivel.", "ref": "XI.3 y XI.6"}, {"id": "E006", "tema": "fac", "tipo": "caso", "q": "Una instructora pide a su grupo identificar el factor de FT que está en ALTO en sus dos dimensiones. ¿Cuál es?", "a": "Endebles controles ante la posición geográfica y porosidad de las fronteras", "o": ["Existencia de grupos terroristas nacionales o internacionales en México", "Endebles controles ante la posición geográfica y porosidad de las fronteras", "Existencia de grupos terroristas de nacionalidad mexicana en el extranjero", "Deficiente conocimiento y capacitación de los SO sobre temas de FT"], "x": "Porosidad de las fronteras es vulnerabilidad de FT con facilitación Alto y explotación Alto, el único factor de FT en ese nivel. Las amenazas de grupos terroristas tienen impacto Alto, pero su probabilidad de ocurrencia es Bajo; capacitación de los SO está en Medio/Medio.", "ref": "XI.4, tabla de vulnerabilidades de FT"}, {"id": "E007", "tema": "fac", "tipo": "caso", "q": "Una autoridad describe este hallazgo: «más de 3,000 km de frontera terrestre con Estados Unidos y cerca del 90 % de los migrantes irregulares con ese destino cruza el territorio nacional». ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad de FT, con facilitación Alto y explotación Alto", "o": ["Vulnerabilidad de LD, con facilitación Alto y explotación Alto, como los puertos", "Amenaza de FT, con grado de impacto Alto y probabilidad de ocurrencia Bajo", "Vulnerabilidad de FT, con facilitación Alto y explotación Alto", "Amenaza de LD, con grado de impacto Alto y probabilidad de ocurrencia Alto"], "x": "El hallazgo corresponde a «Endebles controles ante la posición geográfica y porosidad de las fronteras», vulnerabilidad del rubro de FT en Alto/Alto. El distractor más tentador es el de los puertos de entrada y salida, que también está en Alto/Alto, pero es vulnerabilidad de LD y trata de controles en puertos, no de la frontera terrestre.", "ref": "VIII.29; XI.4, tabla de vulnerabilidades de FT"}, {"id": "E008", "tema": "fac", "tipo": "caso", "q": "Un hallazgo dice: «no hay indicios de presencia de organizaciones terroristas en el país; los casos han sido aislados, retóricos y aspiracionales; el foco son la radicalización por internet y los lobos solitarios». ¿Qué grados tiene el factor al que pertenece?", "a": "Impacto Alto y probabilidad de ocurrencia Bajo", "o": ["Impacto Medio y probabilidad de ocurrencia Bajo", "Impacto Alto y probabilidad de ocurrencia Medio", "Impacto Alto y probabilidad de ocurrencia Bajo", "Facilitación Alto y probabilidad de explotación Bajo"], "x": "Es la amenaza «Existencia de grupos terroristas nacionales o internacionales en México»: impacto Alto (sus cuatro consecuencias son Alto) y ocurrencia Bajo. Impacto Medio corresponde a la generación de recursos de origen nacional; facilitación/explotación sería propio de una vulnerabilidad.", "ref": "VIII.26; XI.4, tabla de amenazas de FT"}, {"id": "E009", "tema": "fac", "tipo": "caso", "q": "Al revisar el mapa de riesgo de FT, el analista Joaquín busca la única amenaza con grado de impacto Medio. ¿Cuál es?", "a": "Generación de recursos de origen nacional encaminados a grupos terroristas", "o": ["Generación de recursos de origen nacional encaminados a grupos terroristas", "Existencia de grupos terroristas nacionales o internacionales en México", "Incremento de la posibilidad de las OSFL de cometer actos de FT", "Existencia de grupos terroristas de nacionalidad mexicana en el extranjero"], "x": "La generación de recursos de origen nacional tiene impacto Medio y ocurrencia Bajo. Las otras dos amenazas de FT tienen impacto Alto y ocurrencia Bajo. OSFL no es amenaza: es vulnerabilidad de FT (facilitación Medio, explotación Bajo).", "ref": "XI.4, tabla de amenazas de FT; VIII.27"}, {"id": "E010", "tema": "fac", "tipo": "caso", "q": "Una organización civil ficticia, «Fundación Mezquite», pregunta a su asesora qué grados tiene en la ENR el factor «Incremento de la posibilidad de las OSFL de cometer actos de FT». ¿Qué le responde?", "a": "Facilitación Medio y probabilidad de explotación Bajo", "o": ["Facilitación Medio y probabilidad de explotación Medio", "Facilitación Medio y probabilidad de explotación Bajo", "Impacto Medio y probabilidad de ocurrencia Bajo, como amenaza", "Facilitación Bajo y probabilidad de explotación Bajo"], "x": "El factor de las OSFL es vulnerabilidad de FT con facilitación Medio y explotación Bajo. Medio/Medio corresponde a la capacitación de los SO sobre FT; impacto/ocurrencia sólo se usa en amenazas; Bajo/Bajo sólo lo tiene el Marco Jurídico del SF.", "ref": "XI.4, tabla de vulnerabilidades de FT; VIII.31"}, {"id": "E011", "tema": "fac", "tipo": "caso", "q": "Un hallazgo de FPADM señala que el principal riesgo nacional es el desvío de insumos de uso dual desde la industria civil, lo que ha retrasado un sistema de respuesta completo. ¿Qué grados tiene ese factor?", "a": "Impacto Alto y probabilidad de ocurrencia Medio", "o": ["Impacto Alto y probabilidad de ocurrencia Medio", "Impacto Medio y probabilidad de ocurrencia Medio", "Impacto Alto y probabilidad de ocurrencia Bajo", "Facilitación Alto y probabilidad de explotación Medio"], "x": "Es «Deficiente desarrollo e implementación de un sistema de respuesta en caso de un ataque con ADM», la única amenaza de FPADM con ocurrencia Medio; las otras dos tienen ocurrencia Bajo. Las tres amenazas de FPADM tienen impacto Alto, y no se miden con facilitación/explotación porque no son vulnerabilidades.", "ref": "IX.34; XI.5"}, {"id": "E016", "tema": "fac", "tipo": "caso", "q": "El auditor Gonzalo verifica una lámina que dice: «el único factor de toda la ENR en Bajo/Bajo es…». ¿Qué factor debe completar la frase?", "a": "Debilidad en el Marco Jurídico del SF", "o": ["Incremento de la posibilidad de las OSFL de cometer actos de FT", "Debilidad en el Marco Jurídico de AV", "Deficiencias en las infraestructuras de los mercados financieros", "Debilidad en el Marco Jurídico del SF"], "x": "El Marco Jurídico del SF es vulnerabilidad del régimen con facilitación Bajo y explotación Bajo. Su gemelo, el Marco Jurídico de AV, está en facilitación Alto y explotación Medio. Infraestructuras de los mercados financieros y OSFL están en Medio/Bajo.", "ref": "XI.2; VI.2"}, {"id": "E017", "tema": "fac", "tipo": "caso", "q": "Una autoridad reporta: «la iniciativa de reforma a la LFPIORPI presentada en el Senado el 7 de febrero de 2019 sigue sin aprobarse; la no aprobación es en sí misma un factor de riesgo». ¿Qué grados tiene ese factor?", "a": "Facilitación Alto y probabilidad de explotación Medio", "o": ["Facilitación Bajo y probabilidad de explotación Bajo", "Facilitación Alto y probabilidad de explotación Medio", "Facilitación Medio y probabilidad de explotación Medio", "Grado de impacto Alto y probabilidad de ocurrencia Medio"], "x": "El hallazgo corresponde a «Debilidad en el Marco Jurídico de AV», vulnerabilidad del régimen con facilitación Alto y explotación Medio, la más alta de las doce del régimen. Bajo/Bajo es el Marco Jurídico del SF; impacto/ocurrencia no aplica porque es vulnerabilidad.", "ref": "VI.1; XI.2"}, {"id": "E018", "tema": "fac", "tipo": "caso", "q": "Un hallazgo indica que el SPEI es la infraestructura de importancia sistémica, que las infraestructuras están reguladas o supervisadas por BANXICO y que, aunque hay exposición, se trata de un «factor controlado». ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad de LD, con facilitación Medio y explotación Bajo", "o": ["Vulnerabilidad de LD, con facilitación Medio y explotación Bajo", "Vulnerabilidad del régimen PLD/CFT, con facilitación Bajo y explotación Bajo", "Amenaza de LD, con grado de impacto Medio y probabilidad de ocurrencia Bajo", "Vulnerabilidad de LD, con facilitación Medio y explotación Medio"], "x": "Es «Deficiencias en las infraestructuras de los mercados financieros», vulnerabilidad de LD en Medio/Bajo, la única de LD con explotación Bajo. Las de Medio/Medio son otras (economía informal, efectivo, dólares, comercio electrónico, ITF).", "ref": "VII.21; XI.3, tabla de vulnerabilidades de LD"}, {"id": "E020", "tema": "fac", "tipo": "caso", "q": "Un hallazgo describe el nuevo sistema de jurisprudencia por precedentes obligatorios de la SCJN, derivado de la reforma constitucional de 2021. ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad de LD, con facilitación Alto y explotación Medio", "o": ["Vulnerabilidad de LD, con facilitación Alto y explotación Alto", "Amenaza de LD, con grado de impacto Alto y probabilidad de ocurrencia Medio", "Vulnerabilidad de LD, con facilitación Alto y explotación Medio", "Vulnerabilidad del régimen PLD/CFT, con facilitación Alto y explotación Medio"], "x": "Es «Deficiente Cultura Constitucional», vulnerabilidad de LD con facilitación Alto y explotación Medio; no llega a Alto/Alto. El distractor del régimen con Alto/Medio describe al Marco Jurídico de AV, que tiene los mismos grados pero pertenece a otro rubro.", "ref": "VII.16; XI.3, tabla de vulnerabilidades de LD"}, {"id": "E021", "tema": "fac", "tipo": "caso", "q": "Un hallazgo reporta que, al cuarto trimestre de 2021, 31.6 millones de personas estaban en ocupación informal (55.8 %). ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad de LD, con facilitación Medio y explotación Medio", "o": ["Vulnerabilidad de LD, con facilitación Medio y explotación Medio", "Amenaza de LD, con grado de impacto Alto y probabilidad de ocurrencia Alto", "Vulnerabilidad de LD, con facilitación Alto y explotación Alto", "Vulnerabilidad de LD, con facilitación Medio y explotación Bajo"], "x": "«Aumento de la economía informal» es vulnerabilidad de LD en Medio/Medio. La palabra «aumento» no lo vuelve amenaza: la clasificación la da la tabla en la que aparece. Medio/Bajo corresponde a infraestructuras de los mercados financieros.", "ref": "VII.19; XI.3, tabla de vulnerabilidades de LD"}, {"id": "E022", "tema": "fac", "tipo": "caso", "q": "Según la ANAM, el LD en comercio exterior se realiza sobre todo con fraude de facturas y modificación de documentos de respaldo (TBML y SBML). ¿Qué grados tiene el factor al que pertenece este hallazgo?", "a": "Facilitación Alto y probabilidad de explotación Alto", "o": ["Grado de impacto Alto y probabilidad de ocurrencia Alto", "Facilitación Alto y probabilidad de explotación Medio", "Facilitación Medio y probabilidad de explotación Medio", "Facilitación Alto y probabilidad de explotación Alto"], "x": "Es «Deficientes controles en los movimientos transfronterizos en puertos de entrada y salida internacional», vulnerabilidad de LD en Alto/Alto. Como es vulnerabilidad, sus grados son de facilitación y explotación, no de impacto y ocurrencia.", "ref": "VII.23; XI.3, tabla de vulnerabilidades de LD"}, {"id": "E024", "tema": "fac", "tipo": "caso", "q": "Un hallazgo dice que México no tiene una metodología establecida para medir el volumen de recursos ilícitos y que, con fuentes oficiales, se estimó un monto aproximado para 2019–2021. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Alto", "o": ["Facilitación Alto y probabilidad de explotación Alto", "Grado de impacto Alto y probabilidad de ocurrencia Alto", "Grado de impacto Medio y probabilidad de ocurrencia Alto", "Grado de impacto Alto y probabilidad de ocurrencia Medio"], "x": "«Incremento del volumen de recursos ilícitos generados en México» es amenaza de LD en Alto/Alto, igual que delincuencia organizada y corrupción. Al ser amenaza se mide con impacto y ocurrencia; facilitación/explotación es de vulnerabilidades.", "ref": "VII.14; XI.3, tabla de amenazas de LD"}, {"id": "E026", "tema": "fac", "tipo": "cifra", "q": "¿Cuántos de los 37 factores quedaron en ALTO en sus dos dimensiones?", "a": "Ocho", "o": ["Diez", "Seis", "Tres", "Ocho"], "x": "Son ocho: las tres amenazas de LD, tres vulnerabilidades de LD (contratación pública, controles transfronterizos en puertos e impartición de justicia), la porosidad de las fronteras (FT) y el ransomware (emergente). Seis es sólo el conteo de LD.", "ref": "XI.3 a XI.6"}, {"id": "E029", "tema": "fac", "tipo": "caso", "q": "La analista Itzel debe anotar los grados del factor «Incremento de los ataques de Ransomware». ¿Cuáles son?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Alto", "o": ["Grado de impacto Medio y probabilidad de ocurrencia Medio", "Grado de impacto Alto y probabilidad de ocurrencia Medio", "Facilitación Alto y probabilidad de explotación Alto", "Grado de impacto Alto y probabilidad de ocurrencia Alto"], "x": "El ransomware es amenaza emergente en Alto/Alto. Alto/Medio corresponde a activos virtuales y Medio/Medio a COVID-19. Ojo: aunque el factor esté en Alto/Alto, su riesgo integral es Medio (XI.7).", "ref": "XI.6; X.36"}, {"id": "E030", "tema": "fac", "tipo": "caso", "q": "Un hallazgo dice que la pandemia aceleró el uso de tecnologías y con ello el fraude y el delito cibernético. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Medio y probabilidad de ocurrencia Medio", "o": ["Grado de impacto Alto y probabilidad de ocurrencia Alto", "Facilitación Medio y probabilidad de explotación Medio", "Grado de impacto Medio y probabilidad de ocurrencia Medio", "Grado de impacto Alto y probabilidad de ocurrencia Medio"], "x": "«Endebles controles de los efectos derivados de la pandemia de COVID-19» es amenaza emergente en Medio/Medio; es el único emergente con impacto Medio (sus cuatro consecuencias son Medio). Facilitación/explotación no aplica a los emergentes porque son amenazas.", "ref": "X.37; XI.6"}, {"id": "E031", "tema": "fac", "tipo": "caso", "q": "Un hallazgo dice que BANXICO, con las demás autoridades, ha decidido mantener una separación entre los activos virtuales y el sistema financiero, y que se analiza la Regla de Viaje. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Medio", "o": ["Grado de impacto Alto y probabilidad de ocurrencia Alto", "Grado de impacto Medio y probabilidad de ocurrencia Medio", "Facilitación Alto y probabilidad de explotación Medio", "Grado de impacto Alto y probabilidad de ocurrencia Medio"], "x": "«Debilidad regulatoria de los Activos Virtuales» es amenaza emergente con impacto Alto y ocurrencia Medio. Alto/Alto corresponde al ransomware; Medio/Medio, a COVID-19. No se mide con facilitación porque, pese a su nombre, no es vulnerabilidad.", "ref": "X.35; XI.6"}, {"id": "E034", "tema": "fac", "tipo": "caso", "q": "Un hallazgo describe la falta de homologación del término (la LFPIORPI habla de «beneficiario controlador» y las DCG de «propietario real») y el uso de cuentas «mulas». ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio", "o": ["Vulnerabilidad de LD, con facilitación Alto y probabilidad de explotación Alto", "Amenaza de LD, con grado de impacto Medio y probabilidad de ocurrencia Medio", "Vulnerabilidad del régimen PLD/CFT, con facilitación Bajo y explotación Bajo", "Vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio"], "x": "Es «Deficiente información sobre el Beneficiario Final», vulnerabilidad del régimen en Medio/Medio. Bajo/Bajo sólo lo tiene el Marco Jurídico del SF; y no es amenaza porque aparece en la tabla de vulnerabilidades del régimen (XI.2), medida con facilitación y explotación.", "ref": "VI.10; XI.2"}, {"id": "E035", "tema": "fac", "tipo": "caso", "q": "El oficial de cumplimiento de un banco ficticio, «Banco Ceibal», compara los dos factores sobre la obligatoriedad del EBR. ¿Qué grados tiene el de los SO del SF?", "a": "Facilitación Medio y probabilidad de explotación Bajo", "o": ["Facilitación Bajo y probabilidad de explotación Bajo", "Facilitación Medio y probabilidad de explotación Medio", "Facilitación Medio y probabilidad de explotación Bajo", "Facilitación Alto y probabilidad de explotación Medio"], "x": "«Insuficiente obligatoriedad de la normativa para implementar un EBR por parte de los SO de SF» está en Medio/Bajo. El de los SO de AV está en Medio/Medio: para AV sólo existe la posibilidad de medidas simplificadas y no es obligatoria una evaluación integral de riesgos.", "ref": "VI.5; VI.6; XI.2"}, {"id": "E036", "tema": "fac", "tipo": "memoria", "q": "¿Cuál de estas vulnerabilidades del régimen tiene probabilidad de explotación Bajo?", "a": "Deficiente maduración de los modelos de riesgo de los supervisores de SF para implementar un EBR", "o": ["Debilidad del sistema Supervisor y Sancionador", "Deficiente información sobre el Beneficiario Final", "Deficiente maduración de los modelos de riesgo de los supervisores de SF para implementar un EBR", "Deficiente maduración de los modelos de riesgo de los supervisores de AV para implementar un EBR"], "x": "La maduración de los modelos de los supervisores de SF está en Medio/Bajo (la CNBV tiene un EBR «altamente desarrollado»). La de los supervisores de AV está en Medio/Medio. Beneficiario final y sistema supervisor y sancionador también están en Medio/Medio.", "ref": "XI.2; VI.7"}, {"id": "E038", "tema": "fac", "tipo": "trampa", "q": "Para una lámina de «amenazas de LD en ALTO/ALTO», un instructor anota: delincuencia organizada, corrupción y contratación pública. ¿Qué corrección procede?", "a": "Cambiar contratación pública por el volumen de recursos ilícitos generados en México", "o": ["Cambiar contratación pública por el volumen de recursos ilícitos generados en México", "Cambiar contratación pública por los controles transfronterizos en puertos de entrada", "Cambiar delincuencia organizada por la deficiente Cultura Constitucional", "Cambiar corrupción por la deficiente impartición de justicia"], "x": "Las tres amenazas de LD son delincuencia organizada, recursos ilícitos generados en México y corrupción, todas en Alto/Alto. Contratación pública, impartición de justicia y controles en puertos están en Alto/Alto, pero son vulnerabilidades de LD: el nivel no cambia la clasificación.", "ref": "XI.3, tabla de amenazas de LD"}, {"id": "E039", "tema": "fac", "tipo": "memoria", "q": "¿Qué tienen en común las tres amenazas de financiamiento al terrorismo?", "a": "Las tres tienen probabilidad de ocurrencia Bajo", "o": ["Las tres tienen probabilidad de ocurrencia Bajo", "Las tres tienen grado de impacto Alto", "Las tres están en Alto en sus dos dimensiones", "Las tres tienen probabilidad de ocurrencia Medio"], "x": "Grupos terroristas en México (Alto/Bajo), recursos de origen nacional (Medio/Bajo) y grupos de nacionalidad mexicana en el extranjero (Alto/Bajo) comparten la ocurrencia Bajo. No todas tienen impacto Alto: la de recursos de origen nacional tiene impacto Medio.", "ref": "XI.4, tabla de amenazas de FT"}, {"id": "E040", "tema": "fac", "tipo": "caso", "q": "Un hallazgo de FPADM dice que México tiene industria que usa material precursor, pero no programas de ADM ni intereses bélicos, y que participa en el Grupo Australia. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Bajo", "o": ["Grado de impacto Alto y probabilidad de ocurrencia Medio", "Facilitación Alto y probabilidad de explotación Bajo", "Grado de impacto Medio y probabilidad de ocurrencia Bajo", "Grado de impacto Alto y probabilidad de ocurrencia Bajo"], "x": "Es «Desarrollo de ADM dentro del territorio nacional», amenaza de FPADM en Alto/Bajo. Ocurrencia Medio sólo la tiene el sistema de respuesta ante un ataque con ADM. Las tres amenazas de FPADM tienen impacto Alto.", "ref": "IX.32; XI.5"}, {"id": "E066", "tema": "sec", "tipo": "caso", "q": "El oficial de cumplimiento de un grupo financiero ficticio supervisa cuatro subsectores de Banca Múltiple y quiere saber cuál quedó en riesgo ALTO en la ENR 2023. ¿Cuál es?", "a": "Banca Múltiple-Cambiarios", "o": ["Banca Múltiple-Comercial", "Banca Múltiple-Inversión", "Banca Múltiple-Crédito a los hogares", "Banca Múltiple-Cambiarios"], "x": "En el SF sólo dos resultados quedaron en ALTO: Banca Múltiple-G7 y Banca Múltiple-Cambiarios. Inversión, Comercial y Crédito a los hogares quedaron en MEDIO.", "ref": "IV.1, tabla de riesgo de LD del SF; XI.1"}, {"id": "E067", "tema": "sec", "tipo": "caso", "q": "Una instructora pide a su grupo los sectores del sistema financiero que quedaron en ALTO en la matriz sectorial 2023. ¿Qué respuesta es correcta?", "a": "Banca Múltiple-G7 y Banca Múltiple-Cambiarios", "o": ["Casas de cambio y Centros cambiarios", "Banca Múltiple-Cambiarios y Transmisores de dinero", "Banca Múltiple-G7 y Casas de cambio", "Banca Múltiple-G7 y Banca Múltiple-Cambiarios"], "x": "Los únicos dos sectores del SF en ALTO son Banca Múltiple-G7 y Banca Múltiple-Cambiarios. Casas de cambio, Centros cambiarios y Transmisores de dinero quedaron en MEDIO: el componente cambiario en ALTO es el subsector bancario, no las casas ni los centros.", "ref": "IV.1, tabla de riesgo de LD del SF; XI.1"}, {"id": "E073", "tema": "sec", "tipo": "caso", "q": "Un auditor revisa la cartera de un conglomerado ficticio y quiere listar los sectores del sistema financiero en BAJO. ¿Qué lista es correcta?", "a": "Afores, Seguros, Fianzas y Asesores de inversión", "o": ["Seguros, Fianzas, Almacenes generales de depósito y Afores", "Afores, Seguros, Fianzas y SODAFI", "Afores, SOFI, Uniones de crédito y Asesores de inversión", "Afores, Seguros, Fianzas y Asesores de inversión"], "x": "Los cuatro del SF en BAJO son Afores, Seguros, Fianzas y Asesores de inversión. SODAFI, SOFI, Uniones de crédito y Almacenes generales de depósito quedaron en MEDIO-BAJO.", "ref": "IV.1, tabla de riesgo de LD del SF; XI.1"}, {"id": "E080", "tema": "sec", "tipo": "caso", "q": "La oficial de cumplimiento de una ITF ficticia, «Kuali Pagos», necesita el nivel de su sector en la matriz sectorial 2023 del sistema financiero. ¿Cuál es?", "a": "Medio", "o": ["Medio", "Bajo", "Medio-Bajo", "Alto"], "x": "ITF/Fintech quedó en MEDIO en la matriz del SF. No lo mezcles con el factor «Debilidad regulatoria de las ITF», vulnerabilidad de LD en Medio/Medio de facilitación y explotación (VII.25): son mediciones distintas.", "ref": "IV.1, tabla de riesgo de LD del SF"}, {"id": "E081", "tema": "sec", "tipo": "caso", "q": "La «Unión de Crédito Sierra Alta», entidad ficticia, revisa la ENR para su evaluación de riesgos. ¿Qué nivel tiene el sector de uniones de crédito en la matriz sectorial 2023?", "a": "Medio-Bajo", "o": ["Medio", "Medio-Bajo", "Alto", "Bajo"], "x": "Uniones de crédito quedó en MEDIO-BAJO, con SOFI, Almacenes generales de depósito, SOFOMES no reguladas y SODAFI. En 2020 era MEDIO: ese es el cruce que hay que evitar; el examen pregunta 2023.", "ref": "IV.1, tabla de riesgo de LD del SF"}, {"id": "E082", "tema": "sec", "tipo": "caso", "q": "Un grupo financiero ficticio tiene cuatro filiales. Según la matriz sectorial 2023, ¿cuál de ellas pertenece a un sector en nivel MEDIO?", "a": "Casas de bolsa", "o": ["Afores", "SOFI", "Almacenes generales de depósito", "Casas de bolsa"], "x": "Casas de bolsa quedó en MEDIO. Afores quedó en BAJO; SOFI y Almacenes generales de depósito, en MEDIO-BAJO.", "ref": "IV.1, tabla de riesgo de LD del SF"}, {"id": "E068", "tema": "sec", "tipo": "memoria", "q": "¿Qué sectores de actividades vulnerables quedaron en ALTO en la matriz sectorial 2023?", "a": "Obras de arte; metales y joyas; monederos y certificados de recompensas", "o": ["Obras de arte; metales y joyas; monederos y certificados de recompensas", "Obras de arte; metales y joyas; vehículos aéreos, marítimos o terrestres", "Obras de arte; servicios de blindaje; metales preciosos y joyas", "Metales y joyas; tarjetas prepagadas; operaciones con activos virtuales"], "x": "En ALTO están Obras de arte; Metales preciosos, piedras preciosas, joyas y relojes; y Monederos y certificados de devoluciones o recompensas. Vehículos y tarjetas prepagadas quedaron en MEDIO; blindaje y activos virtuales, en MEDIO-BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1"}, {"id": "E069", "tema": "sec", "tipo": "trampa", "q": "¿Cuál de estos sectores de actividades vulnerables NO quedó en ALTO en 2023?", "a": "Vehículos aéreos, marítimos o terrestres", "o": ["Vehículos aéreos, marítimos o terrestres", "Obras de arte", "Metales preciosos, piedras preciosas, joyas y relojes", "Monederos y certificados de devoluciones o recompensas"], "x": "Vehículos aéreos, marítimos o terrestres quedó en MEDIO. Los otros tres son exactamente los tres sectores de AV en ALTO.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1"}, {"id": "E070", "tema": "sec", "tipo": "caso", "q": "«Casa de Empeño Robledal» realiza la actividad vulnerable de mutuo, préstamos o créditos y actualiza su evaluación de riesgos. ¿Qué nivel tiene su sector en la matriz sectorial 2023?", "a": "Medio", "o": ["Alto", "Medio", "Bajo", "Medio-Bajo"], "x": "Mutuo, préstamos o créditos quedó en MEDIO, junto con tarjetas prepagadas, vehículos, servidores públicos y fe pública. Ningún sector de AV quedó en BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV"}, {"id": "E071", "tema": "sec", "tipo": "caso", "q": "El «Despacho Contable Arrieta» realiza la actividad vulnerable de servicios profesionales y quiere el nivel de su sector en la matriz sectorial 2023. ¿Cuál es?", "a": "Medio-Bajo", "o": ["Medio-Alto", "Medio-Bajo", "Medio", "Bajo"], "x": "Servicios profesionales quedó en MEDIO-BAJO, uno de los diez sectores de AV en ese nivel. Medio-Alto no existe en la matriz sectorial (es de la escala integral) y ningún sector de AV quedó en BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV"}, {"id": "E072", "tema": "sec", "tipo": "caso", "q": "La plataforma ficticia «Criptonodo» realiza la actividad vulnerable de operaciones con activos virtuales. ¿En qué nivel quedó su sector en la matriz sectorial 2023?", "a": "Medio-Bajo", "o": ["Medio-Bajo", "Alto", "Medio", "Medio-Alto"], "x": "El sector de AV de activos virtuales quedó en MEDIO-BAJO. No lo confundas con el factor emergente «Debilidad regulatoria de los Activos Virtuales», cuyo riesgo integral es Medio (XI.7): son dos mediciones distintas.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1"}, {"id": "E074", "tema": "sec", "tipo": "cifra", "q": "¿Cuántos sectores de actividades vulnerables quedaron en BAJO en la matriz sectorial 2023?", "a": "Ninguno", "o": ["Diez", "Cuatro", "Dos", "Ninguno"], "x": "Ningún sector de AV quedó en BAJO: hay 3 en ALTO, 5 en MEDIO y 10 en MEDIO-BAJO (18 resultados). Cuatro es el número de sectores del SF en BAJO; diez es el de AV en MEDIO-BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV"}, {"id": "E085", "tema": "sec", "tipo": "caso", "q": "«Puntos Lealtad Ocotlán», empresa ficticia, emite monederos y certificados de devoluciones o recompensas. ¿Qué nivel tiene su sector en la matriz sectorial 2023?", "a": "Alto", "o": ["Medio-Bajo", "Alto", "Medio-Alto", "Medio"], "x": "Monederos y certificados de devoluciones o recompensas es uno de los tres sectores de AV en ALTO, con Obras de arte y Metales preciosos, piedras preciosas, joyas y relojes. En 2020 era MEDIO; subió a ALTO en 2023.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1"}, {"id": "E048", "tema": "fin", "tipo": "trampa", "q": "El auditor Fermín revisa una presentación que dice: «Riesgo integral de LD: Medio-Bajo». ¿Qué corrección procede?", "a": "Debe decir Medio-Alto: en la escala integral no existe Medio-Bajo", "o": ["Es correcto, porque coincide con el nivel más frecuente en la matriz de AV", "Debe decir Medio, como la mayoría de los sectores del sistema financiero", "Debe decir Alto, porque sus tres amenazas están en Alto/Alto", "Debe decir Medio-Alto: en la escala integral no existe Medio-Bajo"], "x": "El riesgo integral de LD es Medio-Alto (XI.7). Medio-Bajo pertenece a la matriz sectorial. Que las tres amenazas estén en Alto/Alto no hace Alto el riesgo final: entran ponderadas con las vulnerabilidades de LD y del régimen.", "ref": "XI.7"}, {"id": "E056", "tema": "fin", "tipo": "caso", "q": "La oficial de cumplimiento de una casa de cambio ficticia actualiza su metodología y quiere citar el riesgo integral de financiamiento al terrorismo de la ENR 2023. ¿Cuál es?", "a": "Bajo", "o": ["Medio-Alto", "Medio-Bajo", "Medio", "Bajo"], "x": "El riesgo de FT quedó en Bajo, igual que FPADM y la pandemia de COVID-19. Que la porosidad de las fronteras esté en Alto/Alto no lo sube: las amenazas de FT, que pesan 0.8, tienen ocurrencia Bajo.", "ref": "XI.7"}, {"id": "E057", "tema": "fin", "tipo": "trampa", "q": "¿Cuál de estos riesgos finales NO quedó en nivel Bajo?", "a": "Ataques de ransomware", "o": ["Financiamiento a la proliferación de ADM", "Pandemia de COVID-19", "Ataques de ransomware", "Financiamiento al terrorismo"], "x": "El ransomware quedó en Medio, igual que los activos virtuales. FT, FPADM y COVID-19 quedaron en Bajo; LD es el único en Medio-Alto.", "ref": "XI.7"}, {"id": "E058", "tema": "fin", "tipo": "caso", "q": "En una clase, un alumno sostiene: «el riesgo integral del ransomware es Alto, porque su factor está en Alto/Alto». ¿Qué le corrige el instructor?", "a": "Su riesgo integral es Medio: el factor pesa 0.8 y el régimen 0.2", "o": ["Su riesgo integral es Medio-Alto, el mismo nivel que el del riesgo de LD", "Su riesgo integral es Medio: el factor pesa 0.8 y el régimen 0.2", "Es correcto: el riesgo integral repite los grados del factor", "Su riesgo integral es Bajo, el mismo nivel que el de la pandemia"], "x": "El nivel del factor no es el riesgo integral. Para cada emergente, riesgo = 0.8 × valoración del factor + 0.2 × vulnerabilidades del régimen, y el ransomware queda en Medio.", "ref": "XI.7; XI.6"}, {"id": "E059", "tema": "fin", "tipo": "caso", "q": "Una SOFOM ficticia, «Crédito Ahuehuete», evalúa si permitir operaciones vinculadas con activos virtuales y quiere citar el riesgo integral de ese factor emergente. ¿Cuál es?", "a": "Medio", "o": ["Alto", "Medio", "Medio-Alto", "Bajo"], "x": "El riesgo integral de los activos virtuales es Medio, igual que el del ransomware. No confundas este resultado con sus grados como factor (impacto Alto, ocurrencia Medio) ni con el nivel del sector de AV de activos virtuales en la matriz sectorial (Medio-Bajo).", "ref": "XI.7"}, {"id": "E002", "tema": "met", "tipo": "trampa", "q": "En una sesión de repaso, un alumno afirma: «Debilidad en los procesos de contratación pública de bienes y servicios está en ALTO/ALTO; por eso es una amenaza de LD». ¿Qué es lo correcto?", "a": "Es vulnerabilidad de LD: sus grados son de facilitación y de explotación", "o": ["Es amenaza de LD: todo factor en ALTO/ALTO se mide con impacto y ocurrencia", "Es vulnerabilidad de LD: sus grados son de facilitación y de explotación", "Es amenaza emergente, como el ransomware, por su probabilidad de ocurrencia Alto", "Es vulnerabilidad del régimen PLD/CFT, con facilitación Alto y explotación Medio"], "x": "El nivel no define la clasificación; la define la columna. Contratación pública aparece en la tabla de vulnerabilidades de LD con facilitación Alto y explotación Alto. Estar en ALTO/ALTO no convierte a un factor en amenaza: de los seis factores de LD en ALTO/ALTO, tres son amenazas y tres son vulnerabilidades.", "ref": "XI.3, tabla de vulnerabilidades de LD; VII.18"}, {"id": "E013", "tema": "met", "tipo": "trampa", "q": "El factor «Debilidad regulatoria de los Activos Virtuales» lleva la palabra «debilidad». ¿Cómo lo clasifica la ENR 2023?", "a": "Amenaza emergente, medida con impacto y probabilidad de ocurrencia", "o": ["Vulnerabilidad emergente, medida con facilitación y probabilidad de explotación", "Vulnerabilidad del régimen PLD/CFT, por tratarse de una debilidad regulatoria", "Vulnerabilidad de LD, medida con facilitación y probabilidad de explotación", "Amenaza emergente, medida con impacto y probabilidad de ocurrencia"], "x": "Los tres factores emergentes (activos virtuales, ransomware y COVID-19) son amenazas: V.3 habla de «amenazas emergentes» y su tabla en XI.6 trae grado de impacto (Alto) y probabilidad de ocurrencia (Medio). El nombre engaña: comercio electrónico e ITF, que también dicen «debilidad regulatoria», sí son vulnerabilidades de LD.", "ref": "V.3; X.35; XI.6"}, {"id": "E041", "tema": "met", "tipo": "caso", "q": "El analista Joaquín va a calificar un factor nuevo que la ENR clasificará como amenaza, no como vulnerabilidad. Según la ENR, ¿con qué binomio debe evaluarlo?", "a": "Grado de impacto y probabilidad de ocurrencia", "o": ["Grado de impacto y probabilidad de explotación", "Grado de facilitación y probabilidad de explotación", "Grado de impacto y probabilidad de ocurrencia", "Grado de facilitación y probabilidad de ocurrencia"], "x": "El esquema probabilidad de ocurrencia y grado de impacto sólo se usa respecto de las amenazas. Facilitación y explotación es el binomio de las vulnerabilidades. Las combinaciones cruzadas no existen en la ENR.", "ref": "V.3"}, {"id": "E043", "tema": "met", "tipo": "memoria", "q": "¿En qué intervalo se expresa cada dimensión de un factor y cuáles son sus niveles?", "a": "0 a 9: 0–3 Bajo, 3–6 Medio y 6–9 Alto", "o": ["0 a 100: 0–50 Bajo, 51–80 Medio y 81–100 Alto", "0 a 9: 0–3 Bajo, 3–5 Medio, 5–7 Medio-Alto y 7–9 Alto", "0 a 9: 0–4 Bajo, 4–7 Medio y 7–9 Alto", "0 a 9: 0–3 Bajo, 3–6 Medio y 6–9 Alto"], "x": "Cada dimensión se ajusta a un intervalo de 0 a 9 con tres niveles: Bajo, Medio y Alto. La escala de cuatro niveles con Medio-Alto es la de la evaluación integral (XI.7); la de porcentaje es la matriz sectorial (IV). Los cortes son 3 y 6, no 4 y 7.", "ref": "V.3"}, {"id": "E046", "tema": "met", "tipo": "trampa", "q": "Al aplicar las ecuaciones de la conclusión nacional, la analista Itzel obtiene 6.2 para un riesgo final. ¿Qué nivel le corresponde?", "a": "Medio-Alto", "o": ["Alto", "Medio", "Medio-Bajo", "Medio-Alto"], "x": "La escala integral tiene cuatro niveles: 0–3 Bajo, 3–5 Medio, 5–7 Medio-Alto y 7–9 Alto. Con 6.2 es Medio-Alto. Si se usara por error la escala de una dimensión (6–9 Alto) saldría Alto; Medio-Bajo no existe en la escala integral (es de la matriz sectorial).", "ref": "XI.7"}, {"id": "E047", "tema": "met", "tipo": "trampa", "q": "¿En qué escala de la ENR existe el nivel «Medio-Bajo»?", "a": "En la matriz de riesgo sectorial de los sujetos obligados", "o": ["En la evaluación integral de los riesgos finales de LD, FT y FPADM", "En la matriz de riesgo sectorial de los sujetos obligados", "En la probabilidad de ocurrencia de las amenazas emergentes", "En el grado de cada dimensión de los 37 factores de riesgo"], "x": "Medio-Bajo (51–80 %) es un nivel de la matriz sectorial (IV); la ENR también lo usa en la matriz de FT de las OSFL (VIII.31), que no está entre las opciones. La evaluación integral usa Medio-Alto, no Medio-Bajo (XI.7), y cada dimensión de un factor sólo tiene Bajo, Medio y Alto (V.3).", "ref": "IV"}, {"id": "E079", "tema": "met", "tipo": "trampa", "q": "En la matriz sectorial, ¿qué rango de calificación corresponde al nivel Medio-Bajo?", "a": "De 51 a 80 %", "o": ["De 5 a 7 puntos", "De 51 a 80 %", "De 81 a 90 %", "De 0 a 50 %"], "x": "Medio-Bajo va de 51 a 80 %. De 81 a 90 % es Medio y de 0 a 50 % es Bajo. De 5 a 7 es Medio-Alto, pero en la escala integral de 0 a 9 (XI.7), no en la sectorial.", "ref": "IV"}, {"id": "E060", "tema": "met", "tipo": "trampa", "q": "En la ENR, ¿con qué se arma el grado de impacto de cada amenaza?", "a": "Con sus consecuencias sociales, políticas, financieras y económicas", "o": ["Con el porcentaje que obtiene el sector en la matriz sectorial de riesgos", "Con la concentración del negocio de la entidad, no en términos financieros", "Con los intensificadores y los mitigantes que se registran para cada amenaza", "Con sus consecuencias sociales, políticas, financieras y económicas"], "x": "Para las amenazas, el impacto se evalúa a partir de sus consecuencias sociales, políticas, financieras y económicas, y al final de cada amenaza hay una tabla con esos grados. La concentración del negocio sin términos financieros es el impacto de la Guía CNBV de 2019 para la metodología de la entidad; los intensificadores y mitigantes forman la probabilidad.", "ref": "V.3"}, {"id": "E061", "tema": "met", "tipo": "trampa", "q": "La oficial Itzel copia en la metodología de su entidad la definición de impacto de la ENR, con sus consecuencias financieras. Su auditor la remite a la Guía CNBV de 2019. ¿Qué observación procede?", "a": "En la Guía CNBV el impacto se mide por concentración del negocio, no en términos financieros", "o": ["Es correcto: la Guía CNBV adopta íntegro el impacto de la ENR con sus cuatro consecuencias", "En la Guía CNBV el impacto se mide por concentración del negocio, no en términos financieros", "Debe medir el impacto sólo con consecuencias sociales y políticas, como hace la ENR", "Debe usar el binomio facilitación y explotación, que es el que exige la Guía CNBV para el impacto"], "x": "Son dos ejercicios distintos: la ENR mide al país e incluye consecuencias financieras en el impacto de cada amenaza (V.3); la Guía CNBV de 2019 mide a la entidad y su impacto se basa en la concentración del negocio, no en términos financieros. No se cruzan las definiciones.", "ref": "V.3 (contraste con la Guía CNBV de 2019)"}, {"id": "E062", "tema": "met", "tipo": "trampa", "q": "El auditor Gonzalo lee en un resumen de la ENR: «el grado de impacto de las amenazas no se mide en términos financieros». ¿Cómo lo califica?", "a": "Error: en la ENR las consecuencias financieras sí forman parte del impacto", "o": ["Error: la ENR mide el impacto sólo con las consecuencias financieras del delito", "Correcto: la ENR mide el impacto por concentración del negocio del país", "Error: en la ENR las consecuencias financieras sí forman parte del impacto", "Correcto: en la ENR el grado de impacto sólo se aplica a las vulnerabilidades"], "x": "La frase confunde la ENR con la Guía CNBV de 2019. En la ENR, el impacto de cada amenaza se construye con consecuencias sociales, políticas, financieras y económicas; la tabla al final de cada amenaza trae las cuatro. Lo de «no en términos financieros» es la Guía CNBV para la entidad.", "ref": "V.3"}, {"id": "E012", "tema": "otr", "tipo": "memoria", "q": "¿Qué contiene el rubro de financiamiento a la proliferación de armas de destrucción masiva (FPADM) en la ENR 2023?", "a": "Sólo tres amenazas; no tiene vulnerabilidades propias", "o": ["Sólo tres amenazas; no tiene vulnerabilidades propias", "Tres vulnerabilidades, medidas con facilitación y explotación", "Tres amenazas y tres vulnerabilidades, igual que el rubro de FT", "Dos amenazas y una vulnerabilidad propia de proliferación"], "x": "El apartado IX y el mapa de riesgo de XI.5 presentan sólo amenazas de FPADM (desarrollo de ADM, financiamiento y sistema de respuesta). Por eso su ecuación final no tiene término de vulnerabilidades propias: el 0.2 restante lo aporta el régimen PLD/CFT (XI.7).", "ref": "IX; XI.5"}, {"id": "E019", "tema": "otr", "tipo": "caso", "q": "Un hallazgo explica que la sociedad anónima es más susceptible de uso ilícito que la de responsabilidad limitada, y que la UIF consulta el Registro Público de Comercio por sujeto vía SIGER. ¿A qué rubro pertenece el factor?", "a": "Vulnerabilidades del régimen PLD/CFT", "o": ["Vulnerabilidades estructurales de lavado de dinero", "Vulnerabilidades del régimen PLD/CFT", "Factores emergentes de la ENR 2023", "Amenazas estructurales de lavado de dinero"], "x": "Es «Deficiente información sobre las Estructuras Jurídicas» (apartado VI), una de las doce vulnerabilidades del régimen, en Medio/Medio. Ya existía como capítulo en la ENR 2020; en la de 2023 se incluye como vulnerabilidad del régimen y se evalúa a detalle (II).", "ref": "VI.9; XI.2"}, {"id": "E028", "tema": "otr", "tipo": "caso", "q": "El instructor Víctor pide a su grupo nombrar los tres factores emergentes de la ENR 2023. ¿Qué respuesta es correcta?", "a": "Activos virtuales, ransomware y efectos de la pandemia de COVID-19", "o": ["Activos virtuales, ransomware y efectos de la pandemia de COVID-19", "Activos virtuales, Instituciones de Tecnología Financiera y COVID-19", "Activos virtuales, ransomware y comercio electrónico", "Ransomware, comercio electrónico e Instituciones de Tecnología Financiera"], "x": "Los emergentes son activos virtuales, ataques de ransomware y endebles controles de los efectos de la pandemia de COVID-19, los tres amenazas. Comercio electrónico e ITF son vulnerabilidades de LD, aunque su tema sea tecnológico.", "ref": "X; XI.6"}, {"id": "E014", "tema": "otr", "tipo": "trampa", "q": "La instructora Lucía agrupa «Debilidad regulatoria del Comercio Electrónico» con el ransomware y los activos virtuales como factores emergentes. ¿Es correcto?", "a": "No: es vulnerabilidad de LD, con facilitación Medio y explotación Medio", "o": ["Sí: es amenaza emergente, con grado de impacto Medio y probabilidad de ocurrencia Medio", "No: es vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Bajo", "No: es vulnerabilidad de LD, con facilitación Medio y explotación Medio", "Sí: es amenaza emergente, con impacto Alto y ocurrencia Medio"], "x": "Comercio electrónico está en la tabla de vulnerabilidades de LD (apartado VII) con facilitación Medio y explotación Medio. Los únicos emergentes son activos virtuales, ransomware y COVID-19, los tres amenazas. Que el nombre suene a tecnología o a hueco regulatorio no lo vuelve emergente.", "ref": "VII.17; XI.3, tabla de vulnerabilidades de LD"}, {"id": "E025", "tema": "otr", "tipo": "cifra", "q": "¿Cómo se reparten los 37 factores de la ENR 2023 entre amenazas y vulnerabilidades?", "a": "12 amenazas y 25 vulnerabilidades", "o": ["15 amenazas y 22 vulnerabilidades", "12 amenazas y 25 vulnerabilidades", "25 amenazas y 12 vulnerabilidades", "9 amenazas y 28 vulnerabilidades"], "x": "Amenazas: 3 de LD, 3 de FT, 3 de FPADM y 3 emergentes = 12. Vulnerabilidades: 12 del régimen, 10 de LD y 3 de FT = 25. El 9/28 olvida que los emergentes también son amenazas.", "ref": "XI.2 a XI.6"}, {"id": "E027", "tema": "otr", "tipo": "memoria", "q": "¿Cuántos factores integran el rubro de lavado de dinero y cómo se componen?", "a": "13: tres amenazas y diez vulnerabilidades", "o": ["13: tres amenazas y diez vulnerabilidades", "10: tres amenazas y siete vulnerabilidades", "12: todas vulnerabilidades", "6: tres amenazas y tres vulnerabilidades"], "x": "El ritmo de los rubros es 12 · 13 · 6 · 3 · 3. LD tiene 13 factores: amenazas 13 a 15 y vulnerabilidades 16 a 25. Doce, todas vulnerabilidades, es el régimen; seis (3 + 3) es FT.", "ref": "XI.3"}, {"id": "E075", "tema": "otr", "tipo": "cifra", "q": "¿Cuántos sectores del sistema financiero se evaluaron y cuántas matrices se aplicaron?", "a": "19 sectores y 23 matrices, por los 5 subsectores de la Banca Múltiple", "o": ["19 sectores y 19 matrices, una por cada sector del sistema financiero", "20 sectores y 18 matrices, sin Cheques de viajero ni Comercio exterior", "19 sectores y 23 matrices, por los 5 subsectores de la Banca Múltiple", "23 sectores y 19 matrices, por los 5 subsectores de la Banca Múltiple"], "x": "El SF tiene 19 sectores, pero la Banca Múltiple se subdivide en 5 subsectores (G7, Cambiarios, Inversión, Comercial y Crédito a los hogares), así que se aplicaron 23 matrices. 20 sectores y 18 matrices es el caso de las AV.", "ref": "IV, nota 6; IV.1, nota 10"}, {"id": "E086", "tema": "otr", "tipo": "caso", "q": "En una clase sobre los actores del régimen, la instructora pide nombrar a las autoridades supervisoras. ¿Qué lista es correcta?", "a": "CNBV, CNSF, CONSAR y SAT", "o": ["SHCP, BANXICO, UIF y CNBV", "CNBV, SAT, FGR y CONSAR", "CNBV, CNSF, CONSAR y SAT", "CNBV, CNSF, CONSAR y UIF"], "x": "Las supervisoras son CNBV, CNSF, CONSAR y SAT; vigilan e inspeccionan que los SO cumplan. SHCP (con UBD, UBVA, USPSS y UIF) y BANXICO son reguladoras; la UIF recibe y analiza reportes; la FGR investiga y persigue delitos. BANXICO supervisa además los riesgos adicionales en sistemas de pagos.", "ref": "III"}, {"id": "E089", "tema": "otr", "tipo": "memoria", "q": "¿Cuál es la finalidad del Plan de Acción Preliminar de la ENR 2023?", "a": "Encaminar recursos a lo que requiere más atención y generar medidas intensificadas o simplificadas según el riesgo", "o": ["Sustituir las DCG vigentes por un régimen único de PLD/CFT para el SF y para quienes realizan actividades vulnerables", "Reclasificar los 37 factores para la siguiente ENR conforme a la Guía CNBV de 2019 para la metodología de las entidades", "Sancionar a los sujetos obligados de los sectores que quedaron en ALTO en la matriz sectorial de riesgos", "Encaminar recursos a lo que requiere más atención y generar medidas intensificadas o simplificadas según el riesgo"], "x": "El apartado XII plantea propuestas preliminares de prevención y mitigación por factor, para encaminar la reasignación de recursos hacia lo que requiere mayor atención y generar las medidas intensificadas y simplificadas que correspondan según su nivel de riesgo.", "ref": "XII"}, {"id": "E090", "tema": "otr", "tipo": "caso", "q": "El plan de acción propone modificar las DCG del artículo 60 de la Ley Orgánica de la Financiera Nacional de Desarrollo Agropecuario, Rural, Forestal y Pesquero, sin actualizar desde el 2 de abril de 2015. ¿A qué factor atiende esa propuesta?", "a": "Debilidad en el Marco Jurídico del SF", "o": ["Deficiente información sobre el Beneficiario Final", "Debilidad del sistema Supervisor y Sancionador", "Debilidad en el Marco Jurídico de AV", "Debilidad en el Marco Jurídico del SF"], "x": "El apartado XII la presenta como propuesta para el fortalecimiento del Marco Jurídico del SF. Las DCG son normativa financiera; el Marco Jurídico de AV se refiere a la LFPIORPI y su reforma pendiente.", "ref": "XII; VI.2"}, {"tema": "fac", "tipo": "memoria", "q": "F3 · Deficiencias en los sistemas de monitoreo y alertamiento de la UIF (vulnerabilidad del régimen PLD/CFT). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["MB", "AA", "AM", "MM"], "x": "Calca: F3 Monitoreo y alertamiento de la UIF MM. Es vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio. Comparte MM con 13 factores más.", "ref": "XI.2", "id": "E091"}, {"tema": "fac", "tipo": "memoria", "q": "F4 · Deficiencias en el Diseño del Aviso y Reporte conforme a Estándares Internacionales (vulnerabilidad del régimen PLD/CFT). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MB", "o": ["AM", "MB", "AB", "BB"], "x": "Calca: F4 Diseño del aviso y reporte MB. Es vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Bajo. Como F5, F7, F21, F27 y F31, está en MB.", "ref": "XI.2", "id": "E092"}, {"tema": "fac", "tipo": "memoria", "q": "F6 · Insuficiente obligatoriedad de la normativa para implementar un EBR por parte de los SO de AV (vulnerabilidad del régimen PLD/CFT). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["MM", "AA", "AM", "MB"], "x": "Calca: F6 EBR de los SO de AV MM. Es vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio. Comparte MM con 13 factores más.", "ref": "XI.2", "id": "E093"}, {"tema": "fac", "tipo": "memoria", "q": "F8 · Deficiente maduración de los modelos de riesgo de los supervisores de AV para implementar un EBR (vulnerabilidad del régimen PLD/CFT). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["MM", "AM", "AA", "BB"], "x": "Calca: F8 Modelos de supervisores de AV MM. Es vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio. Comparte MM con 13 factores más.", "ref": "XI.2", "id": "E094"}, {"tema": "fac", "tipo": "memoria", "q": "F9 · Deficiente información sobre las Estructuras Jurídicas (vulnerabilidad del régimen PLD/CFT). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["MB", "MM", "AA", "BB"], "x": "Calca: F9 Estructuras jurídicas MM. Es vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio. Comparte MM con 13 factores más.", "ref": "XI.2", "id": "E095"}, {"tema": "fac", "tipo": "memoria", "q": "F11 · Deficiente coordinación efectiva entre autoridades para el intercambio de información (vulnerabilidad del régimen PLD/CFT). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["MM", "MB", "AA", "AB"], "x": "Calca: F11 Coordinación entre autoridades MM. Es vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio. Comparte MM con 13 factores más.", "ref": "XI.2", "id": "E096"}, {"tema": "fac", "tipo": "memoria", "q": "F12 · Debilidad del sistema Supervisor y Sancionador (vulnerabilidad del régimen PLD/CFT). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["MM", "AM", "AA", "MB"], "x": "Calca: F12 Sistema supervisor y sancionador MM. Es vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio. Comparte MM con 13 factores más.", "ref": "XI.2", "id": "E097"}, {"tema": "fac", "tipo": "memoria", "q": "F13 · Aumento de la Delincuencia Organizada (amenaza de LD). ¿Con qué grados quedó? (primera letra: impacto; segunda: ocurrencia)", "a": "AA", "o": ["AB", "MM", "AA", "AM"], "x": "Calca: F13 Delincuencia organizada AA. Es amenaza de LD, con impacto Alto y ocurrencia Alto. Las tres amenazas de LD están en AA.", "ref": "XI.3, tabla de amenazas de LD", "id": "E098"}, {"tema": "fac", "tipo": "memoria", "q": "F17 · Debilidad regulatoria del Comercio Electrónico (vulnerabilidad de LD). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["BB", "MB", "MM", "AA"], "x": "Calca: F17 Comercio electrónico MM. Es vulnerabilidad de LD, con facilitación Medio y explotación Medio. No es emergente, aunque diga «debilidad regulatoria».", "ref": "XI.3, tabla de vulnerabilidades de LD", "id": "E099"}, {"tema": "fac", "tipo": "memoria", "q": "F20 · Incremento en las operaciones en efectivo en moneda nacional (vulnerabilidad de LD). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["AM", "AB", "MM", "AA"], "x": "Calca: F20 Efectivo en moneda nacional MM. Es vulnerabilidad de LD, con facilitación Medio y explotación Medio. Comparte MM con 13 factores más.", "ref": "XI.3, tabla de vulnerabilidades de LD", "id": "E100"}, {"tema": "fac", "tipo": "memoria", "q": "F22 · Incremento en las operaciones en dólares de los EE. UU. y otras divisas (vulnerabilidad de LD). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["MB", "BB", "MM", "AM"], "x": "Calca: F22 Dólares y otras divisas MM. Es vulnerabilidad de LD, con facilitación Medio y explotación Medio. Comparte MM con 13 factores más.", "ref": "XI.3, tabla de vulnerabilidades de LD", "id": "E101"}, {"tema": "fac", "tipo": "memoria", "q": "F24 · Deficiente impartición de justicia (vulnerabilidad de LD). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "AA", "o": ["BB", "AA", "MB", "AB"], "x": "Calca: F24 Impartición de justicia AA. Es vulnerabilidad de LD, con facilitación Alto y explotación Alto. Es una de las tres vulnerabilidades de LD en AA, con contratación pública y controles en puertos.", "ref": "XI.3, tabla de vulnerabilidades de LD", "id": "E102"}, {"tema": "fac", "tipo": "memoria", "q": "F25 · Debilidad regulatoria de las Instituciones de Tecnología Financiera (vulnerabilidad de LD). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["AM", "MM", "AB", "MB"], "x": "Calca: F25 ITF MM. Es vulnerabilidad de LD, con facilitación Medio y explotación Medio. No es emergente, aunque diga «debilidad regulatoria».", "ref": "XI.3, tabla de vulnerabilidades de LD", "id": "E103"}, {"tema": "fac", "tipo": "memoria", "q": "F28 · Existencia de grupos terroristas de nacionalidad mexicana en el extranjero (amenaza de FT). ¿Con qué grados quedó? (primera letra: impacto; segunda: ocurrencia)", "a": "AB", "o": ["AB", "AA", "BB", "AM"], "x": "Calca: F28 Terroristas mexicanos en el extranjero AB. Es amenaza de FT, con impacto Alto y ocurrencia Bajo. Las tres amenazas de FT tienen ocurrencia Baja.", "ref": "XI.4, tabla de amenazas de FT", "id": "E104"}, {"tema": "fac", "tipo": "memoria", "q": "F30 · Deficiente conocimiento y capacitación de los SO sobre temas de FT (vulnerabilidad de FT). ¿Con qué grados quedó? (primera letra: facilitación; segunda: explotación)", "a": "MM", "o": ["MM", "BB", "MB", "AM"], "x": "Calca: F30 Capacitación de los SO en FT MM. Es vulnerabilidad de FT, con facilitación Medio y explotación Medio. Comparte MM con 13 factores más.", "ref": "XI.4, tabla de vulnerabilidades de FT", "id": "E105"}, {"tema": "fac", "tipo": "memoria", "q": "F33 · Incremento al financiamiento al desarrollo de ADM desde el territorio nacional (amenaza de FPADM). ¿Con qué grados quedó? (primera letra: impacto; segunda: ocurrencia)", "a": "AB", "o": ["MB", "AA", "AB", "AM"], "x": "Calca: F33 Financiamiento de ADM AB. Es amenaza de FPADM, con impacto Alto y ocurrencia Bajo. Las tres amenazas de FPADM tienen impacto Alto; sólo la respuesta a un ataque tiene ocurrencia Media.", "ref": "XI.5", "id": "E106"}, {"tema": "fac", "tipo": "memoria", "q": "¿Cuál de estos factores está en BB?", "a": "F2 Marco jurídico del SF", "o": ["F31 OSFL", "F21 Infraestructuras de los mercados", "F2 Marco jurídico del SF", "F1 Marco jurídico de AV"], "x": "Calca: F2 Marco jurídico del SF BB, el único factor de toda la ENR en Bajo/Bajo. F1, su gemelo de AV, está en AM; F21 y F31 están en MB.", "ref": "XI.2", "id": "E107"}, {"tema": "fac", "tipo": "memoria", "q": "¿Cuál de estos factores está en AM?", "a": "F16 Cultura constitucional", "o": ["F19 Economía informal", "F18 Contratación pública", "F16 Cultura constitucional", "F27 Recursos nacionales para terroristas"], "x": "Calca: AM = F1, F16, F34 y F35. F18 está en AA; F19 en MM; F27 en MB, la única amenaza de FT con impacto Medio.", "ref": "XI.2 a XI.6", "id": "E108"}, {"tema": "sec", "tipo": "memoria", "q": "SF · SOFIPO. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO", "o": ["MEDIO", "BAJO", "MEDIO-BAJO", "ALTO"], "x": "Calca: SOFIPO M. En la matriz sectorial 2023 quedó en MEDIO, con 11 sectores más del SF en ese nivel.", "ref": "XI.1, tabla de riesgo de LD del SF", "id": "E109"}, {"tema": "sec", "tipo": "memoria", "q": "SF · SOCAPS. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO", "o": ["MEDIO-BAJO", "ALTO", "MEDIO", "BAJO"], "x": "Calca: SOCAPS M. En la matriz sectorial 2023 quedó en MEDIO, con 11 sectores más del SF en ese nivel.", "ref": "XI.1, tabla de riesgo de LD del SF", "id": "E110"}, {"tema": "sec", "tipo": "memoria", "q": "SF · Casas de cambio. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO", "o": ["MEDIO", "ALTO", "MEDIO-BAJO", "BAJO"], "x": "Calca: Casas de cambio M. En la matriz sectorial 2023 quedó en MEDIO, con 11 sectores más del SF en ese nivel.", "ref": "XI.1, tabla de riesgo de LD del SF", "id": "E111"}, {"tema": "sec", "tipo": "memoria", "q": "SF · Centros cambiarios. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO", "o": ["ALTO", "MEDIO-BAJO", "BAJO", "MEDIO"], "x": "Calca: Centros cambiarios M. En la matriz sectorial 2023 quedó en MEDIO, con 11 sectores más del SF en ese nivel.", "ref": "XI.1, tabla de riesgo de LD del SF", "id": "E112"}, {"tema": "sec", "tipo": "memoria", "q": "SF · Transmisores de dinero. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO", "o": ["MEDIO-BAJO", "ALTO", "MEDIO", "BAJO"], "x": "Calca: Transmisores de dinero M. En la matriz sectorial 2023 quedó en MEDIO, con 11 sectores más del SF en ese nivel. En 2020 era MEDIO-BAJO: ese es el nivel que se cruza; el examen pregunta 2023.", "ref": "XI.1, tabla de riesgo de LD del SF", "id": "E113"}, {"tema": "sec", "tipo": "memoria", "q": "SF · SOFOMES reguladas. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO", "o": ["BAJO", "MEDIO-BAJO", "MEDIO", "ALTO"], "x": "Calca: SOFOMES reguladas M. En la matriz sectorial 2023 quedó en MEDIO, con 11 sectores más del SF en ese nivel.", "ref": "XI.1, tabla de riesgo de LD del SF", "id": "E114"}, {"tema": "sec", "tipo": "memoria", "q": "SF · SOFOMES no reguladas. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO-BAJO", "o": ["BAJO", "MEDIO-BAJO", "MEDIO", "ALTO"], "x": "Calca: SOFOMES no reguladas M-B. En la matriz sectorial 2023 quedó en MEDIO-BAJO, con 4 sectores más del SF en ese nivel.", "ref": "XI.1, tabla de riesgo de LD del SF", "id": "E115"}, {"tema": "sec", "tipo": "memoria", "q": "SF · Seguros. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "BAJO", "o": ["MEDIO", "BAJO", "MEDIO-BAJO", "ALTO"], "x": "Calca: Seguros B. En la matriz sectorial 2023 quedó en BAJO, con 3 sectores más del SF en ese nivel. En 2020 era MEDIO-BAJO: ese es el nivel que se cruza; el examen pregunta 2023.", "ref": "XI.1, tabla de riesgo de LD del SF", "id": "E116"}, {"tema": "sec", "tipo": "memoria", "q": "¿Cuál de estos sectores del SF está en MEDIO?", "a": "Banca de desarrollo", "o": ["SOFI", "Uniones de crédito", "Seguros", "Banca de desarrollo"], "x": "Calca: Banca de desarrollo M. Uniones de crédito y SOFI están en M-B (Uniones de crédito era MEDIO en 2020: ese es el cruce); Seguros está en B.", "ref": "XI.1, tabla de riesgo de LD del SF", "id": "E117"}, {"tema": "sec", "tipo": "memoria", "q": "¿Cuál de estos sectores del SF NO está en MEDIO?", "a": "Almacenes generales de depósito", "o": ["BM-Comercial", "Centros cambiarios", "BM-Inversión", "Almacenes generales de depósito"], "x": "Calca: Almacenes generales de depósito M-B. Centros cambiarios, BM-Inversión y BM-Comercial están en M, como otros 9 sectores del SF.", "ref": "XI.1, tabla de riesgo de LD del SF", "id": "E118"}, {"tema": "sec", "tipo": "memoria", "q": "AV · Fe pública. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO", "o": ["MEDIO", "MEDIO-BAJO", "ALTO", "BAJO"], "x": "Calca: Fe pública M. En la matriz sectorial 2023 quedó en MEDIO, con 4 sectores más de AV en ese nivel.", "ref": "XI.1, tabla de riesgo de LD de AV", "id": "E119"}, {"tema": "sec", "tipo": "memoria", "q": "AV · Blindaje. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO-BAJO", "o": ["MEDIO-BAJO", "ALTO", "MEDIO", "BAJO"], "x": "Calca: Blindaje M-B. En la matriz sectorial 2023 quedó en MEDIO-BAJO, con 9 sectores más de AV en ese nivel. En 2020 era ALTO: ese es el nivel que se cruza; el examen pregunta 2023.", "ref": "XI.1, tabla de riesgo de LD de AV", "id": "E120"}, {"tema": "sec", "tipo": "memoria", "q": "AV · Uso o goce de inmuebles. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO-BAJO", "o": ["BAJO", "MEDIO-BAJO", "ALTO", "MEDIO"], "x": "Calca: Uso o goce de inmuebles M-B. En la matriz sectorial 2023 quedó en MEDIO-BAJO, con 9 sectores más de AV en ese nivel. En 2020 era MEDIO: ese es el nivel que se cruza; el examen pregunta 2023.", "ref": "XI.1, tabla de riesgo de LD de AV", "id": "E121"}, {"tema": "sec", "tipo": "memoria", "q": "AV · Juegos con apuesta y sorteos. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO-BAJO", "o": ["ALTO", "BAJO", "MEDIO-BAJO", "MEDIO"], "x": "Calca: Juegos con apuesta y sorteos M-B. En la matriz sectorial 2023 quedó en MEDIO-BAJO, con 9 sectores más de AV en ese nivel.", "ref": "XI.1, tabla de riesgo de LD de AV", "id": "E122"}, {"tema": "sec", "tipo": "memoria", "q": "AV · Tarjetas prepagadas, vales o cupones. ¿Qué nivel tiene en la matriz sectorial 2023?", "a": "MEDIO", "o": ["BAJO", "MEDIO", "MEDIO-BAJO", "ALTO"], "x": "Calca: Tarjetas prepagadas, vales o cupones M. En la matriz sectorial 2023 quedó en MEDIO, con 4 sectores más de AV en ese nivel.", "ref": "XI.1, tabla de riesgo de LD de AV", "id": "E123"}, {"tema": "sec", "tipo": "memoria", "q": "¿Cuál de estos sectores de AV está en MEDIO-BAJO?", "a": "Recepción de donativos", "o": ["Recepción de donativos", "Mutuo, préstamos o créditos", "Servidores públicos", "Vehículos"], "x": "Calca: Recepción de donativos M-B, uno de los 10 sectores de AV en ese nivel. Servidores públicos, Vehículos y Mutuo están en M.", "ref": "XI.1, tabla de riesgo de LD de AV", "id": "E124"}, {"tema": "sec", "tipo": "memoria", "q": "¿Cuál de estos sectores de AV está en MEDIO?", "a": "Servidores públicos", "o": ["Servidores públicos", "Traslado o custodia de dinero o valores", "Transmisión de inmuebles", "Desarrollo inmobiliario"], "x": "Calca: Servidores públicos M (en 2020 no tenía resultado; el sector se desglosó). Desarrollo inmobiliario, Transmisión de inmuebles y Traslado o custodia están en M-B.", "ref": "XI.1, tabla de riesgo de LD de AV", "id": "E125"}, {"tema": "fin", "tipo": "memoria", "q": "Riesgo integral · Pandemia de COVID-19. ¿Qué nivel tiene en la conclusión nacional?", "a": "Bajo", "o": ["Medio", "Alto", "Medio-Alto", "Bajo"], "x": "Calca: COVID-19 B. Como factor (F37) está en MM, pero su riesgo integral es Bajo; Medio es el de activos virtuales y ransomware, y Medio-Alto sólo el de LD.", "ref": "XI.7", "id": "E126"}], "sitio": {"nombre": "Módulo 3", "raiz": "../", "actual": "3-3-3-enr", "paginas": [{"n": "3.1.1", "carpeta": "3-1-1-auditoria", "pregunta": "Informe de auditoría", "estado": "integrada"}, {"n": "3.1.2", "carpeta": "3-1-2-supervision", "pregunta": "Supervisión CNBV", "estado": "integrada"}, {"n": "3.2.1", "carpeta": "3-2-1-gafi", "pregunta": "Guía GAFI del EBR", "estado": "integrada"}, {"n": "3.2.2", "carpeta": "3-2-2-basilea", "pregunta": "Basilea BCBS 275", "estado": "integrada"}, {"n": "3.3.1", "carpeta": "3-3-1-metodologia", "pregunta": "Metodología de riesgos", "estado": "integrada"}, {"n": "3.3.2", "carpeta": "3-3-2-grado-riesgo", "pregunta": "Grado de riesgo del cliente", "estado": "integrada"}, {"n": "3.3.3", "carpeta": "3-3-3-enr", "pregunta": "ENR 2023", "estado": "integrada"}, {"n": "3.3.4", "carpeta": "3-3-4-anticorrupcion", "pregunta": "Riesgos de corrupción", "estado": "integrada"}], "integrador": "simulacro", "integrador_texto": "Simulacro mixto", "integrador_href": "3-simulacro/index.html"}}

<script>

  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");

    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }

};

  `<div class="simbar">${(s.tamanos||[30,50]).map(n=>`<button class="qsim" data-n="${+n}" aria-pressed="false">Simulacro de ${+n}</button>`).join("")}<span class="bankinfo" id="bankinfo"></span><button class="linkbtn" id="simReset">Reiniciar mi avance</button></div>

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}
