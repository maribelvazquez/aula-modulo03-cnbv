pdo. III.1"}, {"id": "C021", "tema": "ocu", "tipo": "caso", "q": "La hermana de un presidente municipal aparece como Propietaria Real de una sociedad que abrió cuenta en Banco Alcázar; los ejecutivos saben que quien decide sobre los recursos es el presidente municipal y que ella nunca interviene. ¿Qué grupo de factores se actualiza?", "a": "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "La familia usada como Propietario Real para ocultar a la PEP es factor del III.1. La familia aparece también en el III.2 (familiar que de repente emprende o por quien se compra y revende) y en el III.4 (varios familiares manejan los recursos), pero aquí el detalle decisivo es que figura como Propietaria Real en lugar de la PEP. Fundamento: Apdo. III.1.", "ref": "Apdo. III.1"}, {"id": "C022", "tema": "ocu", "tipo": "caso", "q": "Banco Alcázar revisa cuatro esquemas corporativos vinculados con PEP nacionales. Según el III.1, ¿cuál es particularmente relevante?", "a": "Un esquema que contiene empresas ubicadas en una o varias jurisdicciones extranjeras", "o": ["Un fideicomiso de administración constituido en México con justificación comercial documentada", "Una persona moral de un solo nivel con actividad comercial verificada y Propietario Real identificado", "Un esquema de dos niveles, todo en México, que cuenta con una opinión legal que lo justifica", "Un esquema que contiene empresas ubicadas en una o varias jurisdicciones extranjeras"], "x": "El III.1 dice que es particularmente relevante el esquema que contiene empresas o esquemas corporativos ubicados en una o varias jurisdicciones extranjeras, y/o el que tiene más de tres niveles sin opinión profesional que lo justifique. Los demás esquemas tienen justificación o una estructura simple. Fundamento: Apdo. III.1, factor de vehículos corporativos.", "ref": "Apdo. III.1"}, {"id": "C023", "tema": "ocu", "tipo": "trampa", "q": "Según el III.1, ¿cuál de los siguientes NO es un ejemplo de vehículo corporativo?", "a": "Intermediarios profesionales en servicios financieros y legales («gatekeepers»)", "o": ["Mandatos sin representación sin una justificación comercial válida", "Intermediarios profesionales en servicios financieros y legales («gatekeepers»)", "Fideicomisos con esquemas ubicados en jurisdicciones extranjeras", "Personas morales con esquemas corporativos de varios niveles"], "x": "El III.1 enumera como vehículos corporativos a las personas morales, los mandatos sin representación y los Fideicomisos. Los «gatekeepers» pertenecen a otro factor del mismo apartado: el uso de intermediarios. Fundamento: Apdo. III.1.", "ref": "Apdo. III.1"}, {"id": "C024", "tema": "ocu", "tipo": "caso", "q": "El compadre de una secretaria de Estado figura como accionista único y Propietario Real de una empresa que recibe los recursos de la funcionaria; ella da todas las instrucciones y él sólo firma. ¿Qué factor se actualiza?", "a": "Uso de familiares, asociados cercanos o empleados como Propietarios Reales", "o": ["Uso de familiares, asociados cercanos o empleados como Propietarios Reales", "Cliente o allegado que de repente ejerce actividades económicas a las que era ajeno", "Uso de intermediarios que no concuerda con las prácticas comerciales normales", "Involucramiento de varios familiares para el manejo de los recursos en cuentas bancarias"], "x": "Un asociado cercano que aparece como Propietario Real para que la PEP no figure actualiza el tercer factor del III.1. No es el factor del III.2 del allegado que de repente emprende, porque el compadre no opera un negocio propio: sólo presta su nombre. Fundamento: Apdo. III.1, factor de Propietarios Reales.", "ref": "Apdo. III.1"}, {"id": "C025", "tema": "ocu", "tipo": "memoria", "q": "Según el III.1, ¿por qué las PEP pueden intentar ocultar su identidad?", "a": "Porque saben que su estado como PEP puede facilitar la detección de algún eventual comportamiento ilícito", "o": ["Porque saben que su estado como PEP puede facilitar la detección de algún eventual comportamiento ilícito", "Porque la Guía obliga a reportar como inusual cualquier operación de un Cliente que sea PEP nacional", "Porque las Disposiciones les impiden abrir cuentas a su nombre mientras se encuentren en funciones", "Porque su declaración patrimonial es pública y en ella aparecen todas sus cuentas e inversiones bancarias"], "x": "El III.1 abre con esa premisa: las PEP saben que su estado como PEP puede facilitar la detección de algún eventual comportamiento ilícito, por lo que pueden intentar ocultar su identidad. Ni las Disposiciones les prohíben tener cuentas ni la Guía convierte en reportable cualquier operación de una PEP. Fundamento: Apdo. III.1.", "ref": "Apdo. III.1"}, {"id": "C026", "tema": "ocu", "tipo": "caso", "q": "Un despacho contable abre a su nombre una cuenta en Casa de Bolsa Ébano para invertir, dice, recursos de «un cliente reservado», que resulta ser el titular de una secretaría estatal. El despacho no acostumbra manejar recursos de terceros. ¿Qué grupo de factores se actualiza?", "a": "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "Interponer a un profesional para que la PEP no aparezca, fuera de las prácticas comerciales normales, es el factor de intermediarios del III.1. No es III.3, porque los recursos no salen de una cuenta a nombre de la dependencia, ni III.4, porque no hay una red de empresas fachada. Fundamento: Apdo. III.1, factor de intermediarios.", "ref": "Apdo. III.1"}, {"id": "C027", "tema": "ati", "tipo": "caso", "q": "Cada quincena, el Congreso local deposita su sueldo a la diputada Ana en Banco Alcázar; ella lo pasa íntegro a un fondo de inversión y la cuenta no registra pago de gasto alguno. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Que el sueldo pagado por la dependencia se deje o se transfiera en su totalidad, sin usarse para gasto alguno, es un factor del III.2. No es III.3: la cuenta es personal de la diputada, no de la dependencia que paga la nómina. Fundamento: Apdo. III.2, factor del sueldo intacto.", "ref": "Apdo. III.2"}, {"id": "C028", "tema": "ati", "tipo": "caso", "q": "Un juez federal, Cliente de Banco Alcázar, recibe su nómina del Poder Judicial y la mantiene completa en la cuenta: en dos años no ha pagado con ella ni un servicio, ni una compra, ni un retiro. ¿Qué factor se actualiza?", "a": "Sueldos dejados o transferidos en su totalidad sin pagar gasto alguno", "o": ["Incremento injustificado de los ingresos y patrimonio del Cliente o Usuario", "Transferencias repetidas hacia y desde países con los que no parece estar relacionado", "Sueldos dejados o transferidos en su totalidad sin pagar gasto alguno", "Alto índice de uso de efectivo en las cuentas del Cliente sin justificación aparente"], "x": "El III.2 señala como factor que los fondos recibidos por sueldos y salarios de la dependencia se dejen en su totalidad en la cuenta de depósito, o se transfieran en su totalidad a inversión, sin pagar gasto alguno. No es un incremento injustificado de patrimonio: el ingreso sí está justificado; lo atípico es que no lo use para vivir. Fundamento: Apdo. III.2, factor del sueldo intacto.", "ref": "Apdo. III.2"}, {"id": "C029", "tema": "ati", "tipo": "caso", "q": "En redes sociales, un regidor, Cliente PEP nacional con un sueldo modesto, publica viajes en primera clase, relojes de lujo y autos deportivos; el cambio empezó hace un año. ¿Qué factor se actualiza?", "a": "Estilo de vida, o cambios repentinos en este, no acorde con su salario", "o": ["Estilo de vida, o cambios repentinos en este, no acorde con su salario", "Adquiere bienes, directamente o por terceros, y los vuelve a negociar en corto plazo", "Realiza consultas sobre la política PLD/FT de la institución o la aplicable a las PEP", "Busca un Sujeto Supervisado que normalmente no atendería a Clientes de alto nivel patrimonial"], "x": "El III.2 incluye el estilo de vida del Cliente, o los cambios repentinos en él, no acorde con su salario, y pone como ejemplo el consumo de bienes de lujo. Las redes sociales son justo la Fuente Abierta que el preámbulo menciona para detectar bienes fuera del alcance de la persona. Fundamento: Apdo. III.2, factor del estilo de vida.", "ref": "Apdo. III.2"}, {"id": "C030", "tema": "ati", "tipo": "caso", "q": "El hermano de un presidente municipal, Cliente PEP nacional de Banco Alcázar, que hasta el año pasado era empleado de una papelería, ahora opera él mismo una distribuidora de maquinaria agrícola y abrió cuenta empresarial en Banco Alcázar. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El familiar que de repente ejerce, directamente o por terceros, actividades económicas a las que era ajeno es un factor del III.2. No es III.1: el hermano no figura como Propietario Real para ocultar a la PEP; es él quien emprende un negocio nuevo y ajeno a su trayectoria. Fundamento: Apdo. III.2, factor del familiar que emprende de repente.", "ref": "Apdo. III.2"}, {"id": "C031", "tema": "ati", "tipo": "caso", "q": "Al actualizar su expediente, un subsecretario pregunta a su ejecutivo de Banco Alcázar qué controles aplica el banco a las PEP y a partir de qué montos revisa las operaciones. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "Las consultas del Cliente sobre la política PLD/FT de la institución o sobre la política aplicable a las PEP son un factor del III.2, dentro de lo que la conducta del propio Cliente delata. No es III.1: el subsecretario no se esconde detrás de un vehículo, un intermediario o un Propietario Real; pregunta él mismo por los controles. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C032", "tema": "ati", "tipo": "caso", "q": "Cuando el ejecutivo de Casa de Bolsa Ébano le pide documentar de dónde proviene su patrimonio, una directora general de una entidad paraestatal cambia de tema, se molesta y pospone la entrega. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos"], "x": "Parecer incómodo o renuente a proporcionar información sobre la fuente de riqueza u origen de los recursos es un factor del III.2. No es III.3: aunque trabaja en una entidad paraestatal, el caso no describe la operación de una cuenta a nombre de la entidad, sino la conducta personal de la funcionaria. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C033", "tema": "ati", "tipo": "caso", "q": "Un Cliente PEP nacional declaró a Banco Alcázar un ingreso mensual que es el doble del salario oficial publicado para su cargo y que no coincide con su declaración de activos difundida públicamente. ¿Qué factor se actualiza?", "a": "Su información es inconsistente con información públicamente disponible", "o": ["Estilo de vida, o cambios repentinos en este, no acorde con su salario", "Su información es inconsistente con información públicamente disponible", "Realiza consultas sobre la política PLD/FT de la institución o la aplicable a las PEP", "Parece incómodo o renuente a informar sobre la fuente de riqueza u origen de los recursos"], "x": "El III.2 señala como factor que la información del Cliente sea inconsistente con otra información públicamente disponible, como declaraciones de activos y salarios oficiales publicados. El detalle decisivo es la comparación con la fuente pública; no hay renuencia ni gasto de lujo descrito. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C034", "tema": "ati", "tipo": "caso", "q": "En la apertura de su cuenta, un oficial mayor deja en blanco su actividad adicional y da un domicilio en el que nadie lo conoce; el banco no lo ha comparado con ninguna fuente pública. ¿Qué factor se actualiza?", "a": "Proporciona al Sujeto Supervisado información inexacta o incompleta", "o": ["Realiza consultas sobre la política PLD/FT de la institución o la aplicable a las PEP", "Proporciona al Sujeto Supervisado información inexacta o incompleta", "No puede o es reacio a explicar por qué hace negocios en lugares distintos a donde radica", "Parece incómodo o renuente a informar sobre la fuente de riqueza u origen de los recursos"], "x": "Proporcionar información inexacta o incompleta es un factor propio del III.2. A diferencia del factor de la información inconsistente con la pública, aquí el problema está en los datos mismos, no en el contraste con declaraciones o salarios publicados. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C035", "tema": "ati", "tipo": "caso", "q": "Una presidenta municipal de Zacatecas compra, vende y renta inmuebles en Cancún, donde no radica, y opera esos negocios desde ahí; cuando el ejecutivo le pregunta el motivo, no da ninguna explicación. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos"], "x": "El Cliente que no puede o es reacio a explicar por qué hace negocios en lugares distintos a donde radica actualiza un factor del III.2. No es III.4: comprar inmuebles fuera es parte de la dispersión de recursos públicos a otros países en los casos mexicanos, mientras que aquí se trata de la propia funcionaria operando en otra ciudad del país. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C036", "tema": "ati", "tipo": "caso", "q": "Un senador de alto nivel patrimonial, que reside y opera en su propia ciudad, busca abrir varias inversiones en una pequeña Sociedad Cooperativa de Ahorro y Préstamo de esa ciudad, cuyos socios son, en su mayoría, trabajadores de bajos ingresos. ¿Qué factor se actualiza?", "a": "Busca un Sujeto Supervisado que normalmente no atendería a Clientes de alto nivel patrimonial", "o": ["No puede o es reacio a explicar por qué hace negocios en lugares distintos a donde radica", "Transferencias repetidas hacia y desde países con los que no parece estar relacionado", "Estilo de vida, o cambios repentinos en este, no acorde con su salario", "Busca un Sujeto Supervisado que normalmente no atendería a Clientes de alto nivel patrimonial"], "x": "El III.2 señala al Cliente que busca los servicios de un Sujeto Supervisado que normalmente no atendería a Clientes de alto nivel patrimonial. No aplica el factor de los negocios lejos de donde radica, porque la cooperativa está en su propia ciudad. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C037", "tema": "ati", "tipo": "caso", "q": "Rodrigo, Persona Vulnerable vinculada con una PEP nacional, recibe y envía desde su cuenta personal transferencias repetidas con dos países con los que no tiene negocios, familia ni residencia. No hay recursos públicos ni sociedades de por medio. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "Los fondos transferidos repetidamente hacia y desde países con los que el Cliente parece no estar relacionado son un factor del III.2. No es III.4, que describe la dispersión de recursos públicos de la red de fachadas a otros países, ni III.1, que habla de esquemas corporativos en jurisdicciones extranjeras. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C038", "tema": "ati", "tipo": "caso", "q": "Un director general de una dependencia federal compra, a través de su cuñado, dos departamentos y los revende en menos de tres meses; las operaciones se hacen a nombre del propio director y el cuñado sólo gestiona la compra. ¿Qué factor se actualiza?", "a": "Adquiere bienes, directamente o por terceros, y los vuelve a negociar en corto plazo", "o": ["Cliente o allegado que de repente ejerce actividades económicas a las que era ajeno", "Adquiere bienes, directamente o por terceros, y los vuelve a negociar en corto plazo", "Involucramiento de varios familiares para el manejo de los recursos en cuentas bancarias", "Uso de familiares, asociados cercanos o empleados como Propietarios Reales"], "x": "El III.2 incluye al Cliente que adquiere, directamente o a través de terceros (por ejemplo, su grupo familiar o su círculo de amistades), bienes muebles e inmuebles y los vuelve a negociar en un corto plazo. El cuñado no aparece como Propietario Real ni emprende un negocio propio: es la vía para comprar y revender. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C039", "tema": "ati", "tipo": "caso", "q": "La cuenta personal de un director de área, Cliente PEP nacional de Banco Alcázar, recibe depósitos frecuentes en efectivo y registra retiros en efectivo, sin justificación aparente. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El alto índice de uso de efectivo, en depósitos y/o retiros, en las cuentas del Cliente sin justificación aparente es un factor del III.2. El III.3 también habla de efectivo, pero de retiros en cuentas a nombre de Dependencias, Entidades u Órganos Públicos; aquí la cuenta es del funcionario. Fundamento: Apdo. III.2, factor del efectivo.", "ref": "Apdo. III.2"}, {"id": "C040", "tema": "ati", "tipo": "caso", "q": "En dos años, el patrimonio que un Cliente PEP nacional reporta a Banco Alcázar se triplicó, sin cambio de empleo ni otra fuente de ingresos que lo justifique; no se le conocen gastos ostentosos. ¿Qué factor se actualiza?", "a": "Incremento injustificado de los ingresos y patrimonio del Cliente o Usuario", "o": ["Incremento injustificado de los ingresos y patrimonio del Cliente o Usuario", "Sueldos dejados o transferidos en su totalidad sin pagar gasto alguno", "Adquiere bienes, directamente o por terceros, y los vuelve a negociar en corto plazo", "Estilo de vida, o cambios repentinos en este, no acorde con su salario"], "x": "El incremento injustificado de los ingresos y patrimonio del Cliente o Usuario es un factor del III.2. No es el del estilo de vida, porque el caso no describe consumo de lujo, sino crecimiento del patrimonio sin explicación. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C041", "tema": "ati", "tipo": "memoria", "q": "Según la introducción del III.2, ¿en qué proceso también pueden considerarse esos comportamientos y características individuales?", "a": "Durante el proceso de investigación de posibles Operaciones Inusuales que surjan a partir de alertas", "o": ["Durante el proceso de investigación de posibles Operaciones Inusuales que surjan a partir de alertas", "Sólo al elaborar la evaluación de los riesgos de LD/FT a los que se encuentra expuesta toda la entidad", "Únicamente al clasificar al Cliente por Grado de Riesgo al inicio de la relación comercial, y no después", "Sólo cuando la UIF requiere información adicional sobre la PEP nacional o sobre la Persona Vulnerable"], "x": "La introducción del III.2 dice que esos comportamientos y características también pueden considerarse durante el proceso de investigación de posibles Operaciones Inusuales que surjan a partir de alertas. El Apartado III está pensado para el análisis de operaciones durante la relación comercial, no sólo para la clasificación inicial. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C042", "tema": "gen", "tipo": "trampa", "q": "¿En qué grupo de factores NO aparece la familia de la PEP como parte de algún factor?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Dentro del Apartado III, la familia aparece en tres subapartados: como Propietario Real en el III.1, como familiar que emprende de repente o como vía para comprar y revender en el III.2, y como varios familiares que manejan los recursos en el III.4. El III.3 se refiere sólo a cómo operan las cuentas a nombre de Dependencias, Entidades u Órganos Públicos. Fundamento: Apdo. III.1 a III.4.", "ref": "Apdo. III.1 a III.4"}, {"id": "C043", "tema": "ati", "tipo": "trampa", "q": "¿Cuál de los siguientes factores NO pertenece al III.2?", "a": "Alto índice de retiros en efectivo de cuentas públicas durante los procesos electorales", "o": ["Alto índice de uso de efectivo en las cuentas del Cliente sin justificación aparente", "Parece incómodo o renuente a informar sobre la fuente de riqueza u origen de los recursos", "Realiza consultas sobre la política PLD/FT de la institución o la aplicable a las PEP", "Alto índice de retiros en efectivo de cuentas públicas durante los procesos electorales"], "x": "Los retiros en efectivo sin justificación o durante los procesos electorales son factor del III.3, porque se refieren a cuentas a nombre de Dependencias, Entidades u Órganos Públicos. El efectivo del III.2 es el de las cuentas del propio Cliente. Fundamento: Apdo. III.2 y III.3.", "ref": "Apdo. III.2 y III.3"}, {"id": "C044", "tema": "ati", "tipo": "caso", "q": "Al analizar una posible Operación Inusual de un Cliente PEP nacional de Banco Alcázar se identifica que Rodrigo, otro Cliente que no es PEP, recibe de él transferencias frecuentes; en un año, los ingresos y el patrimonio de Rodrigo crecen sin explicación que lo justifique. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos"], "x": "El III.2 aplica a PEP nacionales y a Personas Vulnerables, y entre sus factores está el incremento injustificado de los ingresos y patrimonio del Cliente. Rodrigo es Persona Vulnerable porque sus vínculos financieros con la PEP se identificaron en una posible Operación Inusual (Def. XIV), y no hay ocultamiento corporativo ni cuentas públicas en el caso. Fundamento: Apdo. III.2 y Def. XIV.", "ref": "Apdo. III.2"}, {"id": "C045", "tema": "ati", "tipo": "caso", "q": "Un Cliente PEP nacional, que vive y trabaja en Puebla, recibe cada semana transferencias desde un país europeo y las regresa al mismo país días después; no tiene negocios, familia ni vínculo alguno allá. No hay recursos públicos ni sociedades involucradas. ¿Qué factor se actualiza?", "a": "Transferencias repetidas hacia y desde países con los que no parece estar relacionado", "o": ["Dispersión de recursos a otros países, incluidos los de baja imposición fiscal", "Esquemas corporativos con empresas ubicadas en jurisdicciones extranjeras", "Alto índice de uso de efectivo en las cuentas del Cliente sin justificación aparente", "Transferencias repetidas hacia y desde países con los que no parece estar relacionado"], "x": "El III.2 señala los fondos que se transfieren repetidamente hacia y desde países con los que el Cliente parece no estar relacionado. La dispersión a otros países es del III.4 y se refiere a recursos públicos que salen de la red de fachadas; los esquemas en jurisdicciones extranjeras son del III.1. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C046", "tema": "ati", "tipo": "caso", "q": "La mejor amiga de la secretaria de Salud estatal, Cliente PEP nacional de Banco Alcázar, que hasta hace poco era maestra, de pronto dirige, a través de un socio, una comercializadora de insumos médicos y abre cuenta en Banco Alcázar. ¿Qué factor se actualiza?", "a": "Cliente o allegado que de repente ejerce actividades económicas a las que era ajeno", "o": ["Cliente o allegado que de repente ejerce actividades económicas a las que era ajeno", "Adquiere bienes, directamente o por terceros, y los vuelve a negociar en corto plazo", "Incremento injustificado de los ingresos y patrimonio del Cliente o Usuario", "Uso de familiares, asociados cercanos o empleados como Propietarios Reales"], "x": "El III.2 incluye al Cliente, familiar o persona cercana que de repente ejerce, directamente o a través de terceros, actividades económicas a las que era ajeno hasta hacía poco tiempo. La amiga no aparece como Propietaria Real que oculte a la PEP: es ella quien de pronto ejerce una actividad nueva. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2"}, {"id": "C047", "tema": "gen", "tipo": "trampa", "q": "¿En qué grupo de factores NO aparece ningún elemento vinculado con el extranjero, como países o jurisdicciones extranjeras?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El extranjero aparece en el III.1 (esquemas en jurisdicciones extranjeras), en el III.2 (fondos con países sin relación aparente) y en el III.4 (fachadas constituidas en el extranjero y dispersión a otros países). Los factores del III.3 se limitan a la operación de las cuentas públicas. Fundamento: Apdo. III.1 a III.4.", "ref": "Apdo. III.1 a III.4"}, {"id": "C048", "tema": "pub", "tipo": "caso", "q": "La cuenta de la Secretaría de Desarrollo Social de un municipio, en Banco Alcázar, registra un alto número de retiros en efectivo durante las semanas de la campaña electoral local. ¿Qué grupo de factores se actualiza?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El alto índice de retiros en efectivo sin justificación aparente o durante los procesos electorales, en cuentas a nombre de Dependencias, Entidades u Órganos Públicos, es factor del III.3. El efectivo del III.2 es el de las cuentas personales del Cliente; aquí la titular es la dependencia. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3"}, {"id": "C049", "tema": "pub", "tipo": "caso", "q": "Desde la cuenta de un instituto estatal de vivienda se transfieren recursos a varias personas físicas sin contrato, programa ni concepto que explique los pagos. ¿Qué factor se actualiza?", "a": "Transferencias a personas físicas o morales sin que exista una razón aparente", "o": ["Facturas de Operaciones de alto valor con cargos injustificados, sobreprecios o documentación muy simple", "Transferencias justificadas con un contrato asignado a quien opera en un giro distinto", "Transferencias a personas físicas o morales sin que exista una razón aparente", "Alto índice de retiros en efectivo sin justificación aparente o durante procesos electorales"], "x": "El III.3 señala las transferencias a personas físicas o morales desde cuentas de Dependencias, Entidades u Órganos Públicos sin que exista una razón aparente. No es el factor del contrato de giro distinto ni el de las facturas, porque aquí no hay contrato ni facturas que justifiquen los pagos. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3"}, {"id": "C050", "tema": "pub", "tipo": "memoria", "q": "¿Qué ejemplo da la Guía de un contrato asignado a quien opera en un giro distinto al servicio contratado?", "a": "Contratos de construcción de obra civil con una compañía que produce textiles", "o": ["Contratos de construcción de obra civil con una compañía que produce textiles", "Contratos de limpieza de oficinas públicas con una compañía que desarrolla software", "Compras de papelería a una compañía dedicada al transporte de carga", "Compras de medicamentos para hospitales a una compañía constructora de caminos rurales"], "x": "El ejemplo literal del III.3 es el de contratos para la construcción de obra civil hacia una compañía que se dedica a la producción de textiles. Sirve para recordar que el factor está en las cuentas públicas (III.3), no en la red de fachadas del III.4. Fundamento: Apdo. III.3, factor del contrato de giro distinto.", "ref": "Apdo. III.3"}, {"id": "C051", "tema": "pub", "tipo": "caso", "q": "Un organismo público estatal paga desde su cuenta facturas de alto valor por mantenimiento de equipo a una empresa que sí se dedica a ese servicio; el precio triplica el de mercado y el reporte de cumplimiento es de media página, sin detalle. ¿Qué grupo de factores se actualiza?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "Las facturas de alto valor que cobran precios muy por arriba del mercado o cuya documentación de cumplimiento es muy simple son factor del III.3, por pagarse desde la cuenta del organismo público. No es III.4: el servicio sí existe y la empresa sí se dedica a él; no se describen bienes o servicios que nunca se prestan ni una red de fachadas. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3"}, {"id": "C052", "tema": "pub", "tipo": "caso", "q": "Desde la cuenta de un hospital público estatal se transfieren recursos a Textiles del Bajío, S.A., con base en un contrato para construir una nueva ala del hospital. La empresa sólo produce telas. ¿Qué grupo de factores se actualiza?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Las transferencias desde cuentas públicas justificadas con un contrato asignado a quien opera en un giro distinto al servicio contratado son factor del III.3; es justo el ejemplo de la Guía de obra civil y textiles. No es III.4, porque el caso no describe una red de fachadas ni bienes o servicios inexistentes. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3"}, {"id": "C053", "tema": "pub", "tipo": "caso", "q": "La cuenta de una dependencia federal registra un alto índice de retiros en efectivo sin justificación aparente, en un año sin ningún proceso electoral. ¿Se actualiza el factor del III.3 sobre retiros en efectivo?", "a": "Sí: el factor comprende los retiros sin justificación aparente o los que ocurren durante los procesos electorales", "o": ["No: los retiros en efectivo de las cuentas públicas se analizan con el factor de efectivo del III.2, y no con el del III.3", "No: el factor sólo se actualiza cuando los retiros en efectivo de la cuenta coinciden con un proceso electoral local o federal", "Sí: el factor comprende los retiros sin justificación aparente o los que ocurren durante los procesos electorales", "Sólo si los retiros rebasan el umbral de efectivo que la Guía fija para las cuentas de dependencias y entidades públicas"], "x": "El factor del III.3 tiene dos supuestos alternativos: alto índice de retiros en efectivo sin una justificación aparente, o durante los procesos electorales. Basta el primero. La Guía no fija umbrales de efectivo para este factor. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3"}, {"id": "C054", "tema": "pub", "tipo": "memoria", "q": "¿Qué tienen en común los cuatro factores del III.3?", "a": "Se refieren a la forma de operar de cuentas a nombre de Dependencias, Entidades u Órganos Públicos", "o": ["Se refieren a vehículos corporativos que ocultan la identidad de la PEP en una o varias jurisdicciones", "Se refieren a las cuentas personales de los servidores públicos de alta jerarquía y sus familiares", "Se refieren a la forma de operar de cuentas a nombre de Dependencias, Entidades u Órganos Públicos", "Se identificaron en Fuentes Abiertas sobre casos recientes de corrupción ocurridos en México"], "x": "El III.3 dice que la forma de operar de las cuentas a nombre de Dependencias, Entidades u Órganos Públicos puede ser indicativa de factores de Riesgo. Los factores tomados de casos mexicanos en Fuentes Abiertas son los del III.4; las cuentas personales de las PEP se analizan con el III.2. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3"}, {"id": "C055", "tema": "pub", "tipo": "caso", "q": "Constructora Mezquite, S.A., recibe varias transferencias desde la cuenta de la Secretaría de Obras de un estado, sin contrato ni concepto que las explique. No se identifican otras empresas relacionadas con ella. ¿Qué grupo de factores se actualiza?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "Las transferencias a personas físicas o morales desde cuentas a nombre de Dependencias, Entidades u Órganos Públicos sin una razón aparente son factor del III.3. Que la receptora sea persona moral no lo vuelve III.1: no hay un vehículo que oculte a una PEP, y tampoco una red de fachadas del III.4. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3"}, {"id": "C056", "tema": "pub", "tipo": "trampa", "q": "Respecto de las facturas que justifican Operaciones de alto valor en cuentas públicas, ¿cuál de las siguientes características NO menciona el III.3?", "a": "Que las emita una empresa listada por el SAT en términos del artículo 69-B del CFF", "o": ["Que incorporen cargos injustificados en las facturas de alto valor", "Que cobren precios muy por arriba del precio de mercado del bien o servicio", "Que la documentación sobre el cumplimiento del contrato sea muy simple o sin el detalle usual", "Que las emita una empresa listada por el SAT en términos del artículo 69-B del CFF"], "x": "El III.3 menciona cargos injustificados, precios muy por arriba del mercado y documentación de cumplimiento muy simple o sin el nivel de detalle usual. El artículo 69-B del CFF aparece en el III.4, respecto de algunas empresas fachada listadas por el SAT como simuladoras de Operaciones. Fundamento: Apdo. III.3 y III.4.", "ref": "Apdo. III.3 y III.4"}, {"id": "C057", "tema": "pub", "tipo": "trampa", "q": "¿En qué grupo de factores menciona la Guía los «procesos electorales»?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "Los procesos electorales aparecen en el primer factor del III.3: alto índice de retiros en efectivo, en cuentas públicas, sin justificación aparente o durante los procesos electorales. No están en el III.2, cuyo factor de efectivo se refiere a las cuentas del propio Cliente. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3"}, {"id": "C058", "tema": "mex", "tipo": "caso", "q": "Banco Alcázar identifica que doce sociedades Clientes suyas, constituidas en México y en el extranjero, comparten representante legal, comisario, notario que las constituyó, domicilio fiscal y empleados, y todas reciben pagos de gobiernos estatales. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El uso de numerosas empresas fachada, constituidas en México y en el extranjero, en las que coinciden dueños, prestanombres, representantes legales, comisarios, notarios, direcciones fiscales y empleados es el primer factor del III.4. No es III.1: el rasgo decisivo es la red de fachadas con coincidencias que recibe recursos públicos, no una estructura para ocultar a una PEP. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C059", "tema": "mex", "tipo": "caso", "q": "En el análisis de una red de sociedades, Banco Alcázar advierte que todas tienen el mismo domicilio fiscal, los mismos empleados registrados y fueron constituidas ante el mismo notario, con el mismo comisario. ¿Qué factor describe ese hallazgo?", "a": "Numerosas empresas fachada en las que coinciden dueños, notarios, domicilios y empleados", "o": ["Actas con múltiples actividades sin relación entre sí; algunas, listadas en el 69-B del CFF", "Numerosas empresas fachada en las que coinciden dueños, notarios, domicilios y empleados", "Triangulación compleja entre la red de fachadas y personas físicas, sin destino claro", "Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias"], "x": "Las coincidencias de dueños, prestanombres, representantes, comisarios, notarios, direcciones fiscales y empleados entre numerosas empresas fachada son el primer factor del III.4. El caso no describe movimientos de recursos, licitaciones ni el contenido de las actas constitutivas. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C060", "tema": "mex", "tipo": "cifra", "q": "Dentro del Apartado III, ¿en qué grupo de factores aparece el artículo 69-B del Código Fiscal de la Federación?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "En el III.4, algunas empresas fachada se encuentran listadas por el SAT como simuladoras de Operaciones, en términos del artículo 69-B del CFF. El artículo también se menciona en el Apartado II.1 como medida para PEP socias de empresas, pero dentro del Apartado III sólo está en el III.4. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C061", "tema": "mex", "tipo": "caso", "q": "En un caso de desvío de recursos, el tesorero de la Secretaría de Finanzas municipal autorizó, uno tras otro, los pagos a las empresas fachada de la red. ¿Qué factor describe su participación?", "a": "Complicidad de otros funcionarios públicos que autorizan los pagos a las empresas fachada", "o": ["Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias", "Desvío de recursos que debieron destinarse a obra pública o a planes asistenciales", "Triangulación compleja entre la red de fachadas y personas físicas, sin destino claro", "Complicidad de otros funcionarios públicos que autorizan los pagos a las empresas fachada"], "x": "El III.4 señala que, para los desvíos, comúnmente se cuenta con la complicidad de otro u otros funcionarios públicos, como el tesorero de la Secretaría de Finanzas estatal o municipal o los encargados de adquisiciones, que autorizan los pagos a las fachadas. El caso describe quién autoriza, no cómo se mueve el dinero después. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C062", "tema": "mex", "tipo": "caso", "q": "Tres empresas de una misma red se presentan a las licitaciones de la Secretaría de Obras y de la Secretaría de Salud de un estado; simulan competir entre sí y una de ellas siempre gana. ¿Qué factor describe esa conducta en los concursos?", "a": "Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias", "o": ["Complicidad de otros funcionarios públicos que autorizan los pagos a las empresas fachada", "Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias", "Recursos públicos pagados, con o sin contrato, por bienes o servicios que nunca se prestan", "Actas con múltiples actividades sin relación entre sí; algunas, listadas en el 69-B del CFF"], "x": "El III.4 describe que varias empresas fachada simulan competir en los concursos de licitación por los contratos, y que el patrón se replica en varias dependencias estatales. La pregunta se centra en la conducta en los concursos, no en quién autoriza los pagos ni en si los servicios se prestan. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C063", "tema": "mex", "tipo": "caso", "q": "El acta constitutiva de Comercializadora Nopal, S.A., que recibe contratos de un gobierno estatal, declara como objeto la venta de abarrotes, la consultoría en tecnología, la renta de maquinaria pesada y los cursos de superación personal. ¿Qué factor se actualiza?", "a": "Actas con múltiples actividades sin relación entre sí; algunas, listadas en el 69-B del CFF", "o": ["Numerosas empresas fachada en las que coinciden dueños, notarios, domicilios y empleados", "Triangulación compleja entre la red de fachadas y personas físicas, sin destino claro", "Dispersión de recursos a otros países, incluidos los de baja imposición fiscal", "Actas con múltiples actividades sin relación entre sí; algunas, listadas en el 69-B del CFF"], "x": "El III.4 señala que las empresas fachada declaran en sus actas constitutivas múltiples actividades sin relación entre sí, desde el comercio de todo tipo de producto legal hasta dar cursos de superación personal; algunas, además, están listadas en el 69-B. El caso se basa en el objeto social, no en coincidencias de socios ni en movimientos de recursos. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C064", "tema": "mex", "tipo": "caso", "q": "Una vez que la empresa fachada recibe el pago del gobierno estatal, los recursos pasan por cinco sociedades de la red y por varias personas físicas, y el destino final no queda claro. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos"], "x": "La triangulación compleja de los recursos del gobierno entre la red de empresas fachada y algunas personas físicas, sin destino claro, es factor del III.4. No es III.1: el caso no describe una estructura corporativa para ocultar a una PEP, sino el movimiento de recursos públicos ya recibidos por la red. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C065", "tema": "mex", "tipo": "caso", "q": "Los recursos públicos que recibió una red de empresas fachada se envían a cuentas en un país de baja imposición fiscal y se usan para comprar un departamento allá. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "La dispersión de recursos a otros países, incluidos los de baja imposición fiscal, a veces para comprar bienes inmuebles, es factor del III.4. Se distingue del III.2, cuyo factor habla de fondos que van y vienen de países sin relación con el Cliente, porque aquí son recursos públicos que salen de la red de fachadas. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C066", "tema": "mex", "tipo": "caso", "q": "En un caso de desvío de recursos públicos, la esposa, dos hijos y un sobrino del exfuncionario operan las cuentas bancarias donde terminan los recursos de la red de fachadas. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "El involucramiento de varios familiares para el manejo de los recursos en cuentas bancarias es factor del III.4. No es III.1, porque no se trata de un familiar puesto como Propietario Real, ni III.2, porque nadie emprende de repente ni compra y revende bienes. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C067", "tema": "mex", "tipo": "caso", "q": "Los recursos que un gobierno estatal tenía etiquetados para comedores comunitarios de zonas marginadas terminan en cuentas de particulares. ¿Qué factor del III.4 describe el caso?", "a": "Desvío de recursos que debieron destinarse a obra pública o a planes asistenciales", "o": ["Dispersión de recursos a otros países, incluidos los de baja imposición fiscal", "Triangulación compleja entre la red de fachadas y personas físicas, sin destino claro", "Desvío de recursos que debieron destinarse a obra pública o a planes asistenciales", "Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias"], "x": "El III.4 incluye el desvío de recursos que debieron destinarse a obra pública o a planes asistenciales dirigidos a los sectores más desfavorecidos de la población. La pregunta se refiere a qué recursos se desvían, no a cómo se dispersan o se triangulan. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C068", "tema": "mex", "tipo": "caso", "q": "Un gobierno estatal pagó a Consultores Tule, S.A., una de las empresas fachada de una red, por cuarenta estudios técnicos que nunca se elaboraron ni se entregaron; no se cuestiona el precio ni hay facturas observadas. ¿Qué factor se actualiza?", "a": "Recursos públicos pagados, con o sin contrato, por bienes o servicios que nunca se prestan", "o": ["Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias", "Facturas de Operaciones de alto valor con cargos injustificados, sobreprecios o documentación muy simple", "Transferencias justificadas con un contrato asignado a quien opera en un giro distinto", "Recursos públicos pagados, con o sin contrato, por bienes o servicios que nunca se prestan"], "x": "El III.4 señala que los recursos públicos se envían a las empresas fachada por medio de contratos, y en ocasiones sin ellos, para la supuesta adquisición de bienes o prestación de servicios que nunca se llevan a cabo. No es el factor del giro distinto, porque la empresa sí se dedica a la consultoría, ni el de las facturas del III.3, que se refiere a facturas de alto valor con cargos injustificados, sobreprecio o documentación pobre: aquí lo decisivo es que el servicio nunca existió y que la receptora es una fachada. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C069", "tema": "mex", "tipo": "memoria", "q": "Según el III.4, ¿cómo llegan los recursos públicos a las empresas fachada?", "a": "Por medio de contratos y, en ocasiones, sin la existencia de estos", "o": ["Por medio de contratos y, en ocasiones, sin la existencia de estos", "Sólo mediante subsidios directos, sin que medie contrato alguno", "Sólo por medio de contratos adjudicados mediante licitación pública", "Sólo por adjudicación directa, siempre con un contrato firmado"], "x": "El III.4 dice que los recursos públicos son enviados a las fachadas por medio de contratos, y en ocasiones sin la existencia de estos, para bienes o servicios que nunca se llevan a cabo. Las tres opciones con «sólo» cierran un supuesto que la Guía deja abierto. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C070", "tema": "gen", "tipo": "trampa", "q": "¿En qué grupo de factores el texto de la Guía NO menciona expresamente personas morales, empresas ni vehículos corporativos?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "El texto menciona personas morales en el III.1 (como vehículos corporativos), en el III.3 (personas físicas o morales que reciben transferencias desde cuentas públicas; una compañía textil) y en el III.4 (red de empresas fachada). El texto del III.2 no las nombra: describe la conducta de la PEP nacional o de la Persona Vulnerable. Eso no impide que, en un caso concreto, el tercero por el que se ejerce u "}, {"id": "C073", "tema": "mex", "tipo": "caso", "q": "Una auditoría revela que los recursos que un municipio debió destinar a pavimentar calles y construir un puente nunca se aplicaron a esas obras: se desviaron por medio de empresas fachada. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El desvío de recursos que debieron destinarse a obra pública o a planes asistenciales es factor del III.4. La obra civil también aparece en el III.3, pero ahí el factor es el contrato asignado a una empresa de giro distinto, como una textilera; aquí lo decisivo es el desvío de los recursos de obra. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C074", "tema": "mex", "tipo": "caso", "q": "Banco Alcázar detecta que tres proveedoras de un gobierno estatal, con cuentas en el banco, aparecen en el listado del SAT de empresas que simulan Operaciones y declaran en sus actas actividades sin relación entre sí. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "Las empresas fachada con objeto social de múltiples actividades sin relación entre sí, algunas listadas por el SAT como simuladoras de Operaciones en términos del artículo 69-B del CFF, son factor del III.4. No es III.1, porque el caso no describe una estructura para ocultar <script>
(function(){

/* ---------- encabezado, portada, trampas, pie ---------- */
$("#brand").innerHTML = `<b>360EDUCA</b><span>${esc(D.meta.modulo||"")}</span><span class="ruta">${esc(RUTAS[D.meta.ruta||"financiero"])}</span>`;

if(D.sitio && Array.isArray(D.sitio.paginas)){
  const S=D.sitio, raiz=S.raiz||"", act=S.actual||"";

    S.paginas.map(p=>{
      const tip=`Tema ${p.n} · ${p.pregunta||""}`;
      if(p.estado && p.estado!=="integrada") return `<span class="sb-p off" title="${esc(tip)} · ${esc(ETQ[p.estado]||p.estado)}" aria-disabled="true">${esc(p.n)}</span>`;
      return `<a class="sb-p" href="${esc(raiz+p.carpeta)}/index.html" title="${esc(tip)}"${p.carpeta===act?' aria-current="page"':""}>${esc(p.n)}</a>`;
    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+
    (actual?`<span class="sb-ses">Tema ${esc(actual.n)} · ${esc(actual.pregunta||"")}</span>`:"");
  $("#sitebar").hidden=false;
}
const mapa0 = D.secciones.find(s=>s.tipo==="mapa");
let rhythm = "";
if(Array.isArray(D.meta.ritmo)){ // ritmo puesto a mano: [{n, lb, q, color}]
  const R0=D.meta.ritmo;
  rhythm = `<div><div class="rhythm${R0.length>4?" many":""}">${R0.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${esc(r.n)}</span><span class="lb">${esc(r.lb||"")}</span><span class="q">${esc(r.q||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${D.meta.ritmo_cap?esc(D.meta.ritmo_cap):`${R0.map(r=>r.n).join(" · ")} = ${R0.reduce((a,r)=>a+(+r.n||0),0)} ${esc(D.meta.unidad||"")}`}</div></div>`;
} else if(mapa0 && D.meta.ritmo!==false){
  const counts = mapa0.ramas.map(r=>r.items.length);
  rhythm = `<div><div class="rhythm${mapa0.ramas.length>4?" many":""}">${mapa0.ramas.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${r.items.length}</span><span class="lb">${esc(r.corto||r.letra)}</span><span class="q">${esc(r.ritmo||r.pregunta||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${counts.join(" · ")} = ${counts.reduce((a,b)=>a+b,0)} ${esc(D.meta.unidad||"")}</div></div>`;
}

  <h1>${esc(D.meta.h1_antes||"")} <mark>${esc(D.meta.h1_resaltado||"")}</mark> ${esc(D.meta.h1_despues||"")}</h1>
  <p>${D.meta.intro||""}</p></div>${rhythm}`;
$("#traps").innerHTML = (D.trampas||[]).map((t,i)=>`<div class="trapc"><span class="tag">Trampa ${D.trampas.length>1?i+1:"de examen"}</span><p><b>${esc(t.titulo)}</b> ${t.texto}</p></div>`).join("");
if(!(D.trampas||[]).length) $("#traps").hidden=true;
$("#pie").innerHTML = `<b>GMC360 · 360Educa</b> — ${D.meta.fuente||""} Material didáctico; los textos están resumidos, consulta la publicación oficial para la redacción íntegra.`;

/* ---------- secciones ---------- */
const head = s=>!s.titulo?"":`<div class="sec-head"><h2>${esc(s.titulo)}</h2>${s.intro?`<p>${s.intro}</p>`:""}</div>${s.para?`<div class="para"><b>Para qué sirve</b>${s.para}</div>`:""}`;
const chant = f=>f?`<div class="chant"><div class="lbl">${esc(f.titulo||"Para recitar en voz alta")}</div><p>${f.html}</p></div>`:"";
const R = {};
let ITEMS = {}; // id -> {item, rama, color}
R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="frac"><button aria-expanded="false" data-ficha="${id}"><span class="rom">${esc(it.etiqueta)}</span><span><span class="nm">${esc(it.nombre)}</span><span class="hookt">${esc([it.verbo,it.gancho].filter(Boolean).join(" · "))}</span></span><span class="cnt">${esc(it.conteo||"")}</span></button><ul class="inc" hidden>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul></li>`}).join("")}</ul>`;
    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};
R.tarjetas = s=>head(s)+`<div class="cards">${s.tarjetas.map((c,i)=>{
  const col = colorDe(c.color,i);
  const top = c.encabezado?`<div class="chead"><div class="t">${esc(c.titulo)}</div>${c.subtitulo?`<div class="a">${esc(c.subtitulo)}</div>`:""}</div>`:(c.barra?`<div class="bar"></div>`:"");
  const body = c.filas? c.filas.map(f=>`<div class="frow"><span class="k">${esc(f.k)}</span>${f.v}</div>`).join("")

  return `<div class="card ${col}${c.ancho?" wide":""}">${top}${body}</div>`;}).join("")}</div>${s.nota?`<div class="note">${s.nota}</div>`:""}`;
R.escala = s=>{const cols=["var(--principal-linea)","#80bcb5","#a663cc","#ff8361","var(--oscuro)"];
  return head(s)+`<div class="card"><div class="cbody">${s.etiqueta?`<div class="lbl">${esc(s.etiqueta)}</div>`:""}${s.subtitulo?`<h3>${esc(s.subtitulo)}</h3>`:""}<div class="scale">${s.niveles.map((l,i)=>`<div class="lvl" style="--lc:${cols[i%5]}"><div class="n">${i+1}</div><div class="t">${esc(l.t)}</div><div class="d">${esc(l.d||"")}</div>${l.req?`<div class="req">${esc(l.req)}</div>`:""}</div>`).join("")}</div>${s.memo?`<p class="memo">${s.memo}</p>`:""}</div></div>`;};
R.pasos = s=>head(s)+`<ol class="track" style="--n:${s.pasos.length}" role="tablist" data-pasos="${s.id}">${s.pasos.map((p,i)=>`<li><button class="pill" role="tab" aria-selected="${i===0}" data-paso="${s.id}:${i}"><span class="circ">${i+1}</span><span class="nm">${esc(p.nombre)}</span></button></li>`).join("")}</ol><div class="stepd" id="stepd-${s.id}" role="tabpanel" aria-live="polite"></div>`+chant(s.frase);
R.flujo = s=>head(s)+`<div class="lanes">${s.carriles.map((c,i)=>`<div class="lane"><div class="lhead ${colorDe(c.color,i)}"><span class="t">${esc(c.titulo)}</span>${c.sub?`<span class="s">${esc(c.sub)}</span>`:""}</div><div class="flow">${c.nodos.map(n=>`<div class="node"><h4>${esc(n.titulo)}</h4>${n.ref?`<span class="art">${esc(n.ref)}</span>`:""}${n.texto?`<p>${n.texto}</p>`:""}${n.plazo?`<span class="plazo">${esc(n.plazo)}</span>`:""}${n.nota?`<p>${n.nota}</p>`:""}</div>`).join('<div class="arrow" aria-hidden="true">→</div>')}</div></div>`).join("")}</div>`;

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}
document.fonts && document.fonts.ready.then(redraw); redraw();

    <div class="stepnav"><button class="btn ghost" data-pnav="${sid}:${i-1}">← Anterior</button><button class="btn" data-pnav="${sid}:${i+1}">Siguiente paso →</button></div></div>`;
}

/* ---------- repaso (tandas al azar o secuencia fija) ---------- */
// Con "pool": tandas al azar de 10/20/30 (configurable en "tandas") que no repiten hasta agotar el banco de repaso;
// las opciones se barajan. Con "bloques": secuencia fija, opciones sin barajar (para un guion con letras).
// Clic en una opción = respuesta del alumno; «Revelar respuesta» = la instructora muestra la correcta sin marcar a nadie.
D.secciones.filter(s=>s.tipo==="repaso").forEach(s=>{
  const BK={}; (D.banco||[]).forEach(q=>BK[q.id]=q);
  const TM=D.temas||{}, sim=D.secciones.find(x=>x.tipo==="simulador"), CL=s.claves||{};
  const box=$("#rp-"+s.id), idx=$("#rpi-"+s.id);
  const mix=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const KEY="rp-"+(D.meta.clave||"mapa")+"-"+s.id;
  const POOL=(s.pool||[]).filter(id=>BK[id]);
  let seq=[], i=0, meta=null;
  function fixedSeq(){ const out=[]; (s.bloques||[]).forEach((b,bi)=>b.items.forEach(it=>{if(BK[it.id]) out.push({...BK[it.id],opts:BK[it.id].o.slice(),clave:it.clave||CL[it.id]||"",extra:!!it.extra,bi,bt:b.titulo});})); return out; }
  function tanda(n){
    let used=new Set(st.get(KEY,[])), rest=POOL.filter(id=>!used.has(id)), pick;
    if(rest.length<n){ pick=mix(rest); used=new Set(); const more=mix(POOL.filter(id=>!pick.includes(id))).slice(0,n-pick.length); pick=pick.concat(more); more.forEach(id=>used.add(id)); }
    else { pick=mix(rest).slice(0,n); pick.forEach(id=>used.add(id)); }
    st.set(KEY,[...used]);
    return mix(pick).map(id=>({...BK[id],opts:mix(BK[id].o),clave:CL[id]||""}));
  }
  const sinSalir=()=>`${POOL.length-new Set(st.get(KEY,[])).size} de ${POOL.length} sin salir`;
  function start(n){ seq=n?tanda(n):fixedSeq(); meta={n}; seq.forEach(q=>{q.pick=null;q.shown=false;}); i=0; draw(); box.scrollIntoView({block:"start"}); }
  const fsTxt=()=>document.fullscreenElement?"Salir de pantalla completa":"Pantalla completa";
  if(s.pool){
    idx.innerHTML=(s.tandas||[10,20,30]).map(n=>`<button class="rpb" data-rpn="${n}" aria-pressed="false">${n} preguntas</button>`).join("")+`<span class="bankinfo" id="rpinfo-${s.id}" style="align-self:center">${POOL.length} preguntas en el banco de repaso · ${sinSalir()}</span>`;
    box.innerHTML=`<div class="qtext">Elige una tanda de ${(s.tandas||[10,20,30]).join(", ").replace(/, (\d+)$/," o $1")} preguntas.</div><p style="margin:10px 0 0">Salen al azar y no se repiten hasta agotar las ${POOL.length}; las opciones cambian de orden cada vez.</p>`;
  } else {
    idx.innerHTML=(s.bloques||[]).map((b,bi)=>`<button class="rpb" data-rpb="${bi}" aria-pressed="false">${bi+1} · ${esc(b.titulo)} <small>${b.items.length}</small></button>`).join("");
  }
  function draw(){
    idx.querySelectorAll("[data-rpn]").forEach(b=>b.setAttribute("aria-pressed",String(meta&&+b.dataset.rpn===meta.n)));
    if(!s.pool) idx.querySelectorAll("[data-rpb]").forEach(b=>b.setAttribute("aria-pressed",String(i<seq.length&&+b.dataset.rpb===seq[i].bi)));
    if(i>=seq.length) return fin();
    const q=seq[i], ok=q.opts.indexOf(q.a), lab=s.pool?`Tanda de ${seq.length}`:`Bloque ${q.bi+1} · ${esc(q.bt)}`;
    const good=seq.filter(x=>x.pick!=null&&x.opts[x.pick]===x.a).length;
    box.innerHTML=`<div class="qbar"><span>${lab} · pregunta ${i+1} de ${seq.length}</span><span>Aciertos: ${good}</span></div><div class="qprog"><i style="width:${i/seq.length*100}%"></i></div>
    <div class="qtag"><span>${esc(TM[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}${q.extra?"<span>Extra</span>":""}</div><div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt${q.shown?(k===ok?" right":(k===q.pick?" wrong":"")):""}" data-rpk="${k}"${q.shown?" disabled":""}><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="fb">${q.shown?`${q.pick==null?`<span class="ok">Respuesta ${"ABCD"[ok]}</span>`:(q.pick===ok?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>')}${q.pick!=null?tuHTML(q,q.opts[q.pick]):""} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}${q.clave?`<div class="rp-clave"><div class="lbl">Para no confundirte</div>${q.clave}</div>`:""}`:""}</div>
    <div class="qactions"><button class="btn ghost" data-rpnav="-1"${i===0?" disabled":""}>← Anterior</button>${q.shown?"":`<button class="btn" data-rpshow>Revelar respuesta</button>`}<button class="btn ghost" data-rpnav="1">${i+1===seq.length?"Ver resultado →":"Siguiente →"}</button><button class="btn ghost" data-rpfs>${fsTxt()}</button></div>`;
  }
  function fin(){
    const resp=seq.filter(x=>x.pick!=null), good=resp.filter(x=>x.opts[x.pick]===x.a).length, miss=seq.filter(x=>x.pick!=null&&x.opts[x.pick]!==x.a), c=s.cierre;
    box.innerHTML=`<div class="qbar"><span>${s.pool?`Tanda de ${seq.length} · resultado`:"Cierre"}</span><span>${resp.length?`${good}/${resp.length}`:""}</span></div><div class="qprog"><i style="width:100%"></i></div>
    ${resp.length?`<div class="score"><span class="big">${Math.round(good/resp.length*100)}%</span><span>${good} de ${resp.length} contestadas correctamente.</span></div>`:""}
    ${miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${miss.length})</summary><ul>${miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.opts[m.pick])}</s>${m.d&&m.d[m.opts[m.pick]]?` — ${esc(m.d[m.opts[m.pick]])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
    ${c?`<div class="qtext" style="margin-top:18px">${esc(c.titulo)}</div><ol class="rp-fin">${(c.pasos||[]).map(p=>`<li>${p}</li>`).join("")}</ol>${c.nota?`<div class="rp-clave">${c.nota}</div>`:""}`:""}
    <div class="qactions"><button class="btn ghost" data-rpnav="-1">← Anterior</button>${s.pool?`<button class="btn" data-rpn="${meta.n}">Otra tanda de ${meta.n}</button>`:""}${sim?`<a class="btn ghost" href="#${sim.id}">${esc(sim.nav||"Practicar")}</a>`:""}<button class="btn ghost" data-rpfs>${fsTxt()}</button></div>
    ${s.pool?`<p class="siminfo">${sinSalir()}</p>`:""}`;
    const inf=$("#rpinfo-"+s.id); if(inf) inf.textContent=`${POOL.length} preguntas en el banco de repaso · ${sinSalir()}`;
  }
  function reveal(){ if(!seq.length||i>=seq.length||seq[i].shown) return; seq[i].shown=true; draw(); }
  const go=n=>{ if(!seq.length) return; i=Math.max(0,Math.min(n,seq.length)); draw(); };
  function fs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else if(box.requestFullscreen) box.requestFullscreen(); }catch(e){} }
  document.addEventListener("fullscreenchange",()=>{const f=box.querySelector("[data-rpfs]");if(f)f.textContent=fsTxt();});
  const onClick=e=>{
    const n=e.target.closest("[data-rpn]"); if(n){start(+n.dataset.rpn);return;}
    const b=e.target.closest("[data-rpb]"); if(b){if(!seq.length||s.pool)start(0);go(seq.findIndex(q=>q.bi===+b.dataset.rpb));return;}
    const o=e.target.closest("[data-rpk]"); if(o&&seq[i]&&!seq[i].shown){seq[i].pick=+o.dataset.rpk;reveal();return;}
    if(e.target.closest("[data-rpshow]")){reveal();return;}
    const nv=e.target.closest("[data-rpnav]"); if(nv){go(i+(+nv.dataset.rpnav));return;}
    if(e.target.closest("[data-rpfs]")) fs();
  };
  idx.addEventListener("click",onClick); box.addEventListener("click",onClick);
  document.addEventListener("keydown",e=>{
    if(!seq.length||e.target.closest("input,textarea")||!$("#drawer").hidden) return;
    const r=box.getBoundingClientRect(); if(document.fullscreenElement!==box&&(r.bottom<0||r.top>innerHeight)) return;
    if(e.key==="ArrowRight"){go(i+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(i-1);e.preventDefault();}
    else if(e.key.toLowerCase()==="r"){reveal();e.preventDefault();}
    else if(e.key.toLowerCase()==="f"){fs();e.preventDefault();}
  });
  if(!s.pool) start(0);
});

/* ---------- simulador ---------- */
if(!D.secciones.some(s=>s.tipo==="simulador")) return;
const BANK=D.banco||[], TEMAS=D.temas||{};
const MODOS=[{k:"all",l:"Todo mezclado",f:()=>true}].concat((D.modos||[]).map(m=>({k:m.k,l:m.l,f:x=>(m.tema?x.tema===m.tema:true)&&(m.tipos?m.tipos.includes(x.tipo):true)})));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY=D.meta.clave||"mapa", SEEN="seen-"+KEY, SIM="sim-"+KEY;
let seen=new Set(store.get(SEEN,[])), MODE="all", ST=null;
const poolFor=k=>BANK.filter(MODOS.find(m=>m.k===k).f);
const simInfo=()=>`${BANK.length-store.get(SIM,[]).length} de ${BANK.length} sin salir en simulacro`;
const bankInfo=()=>`${BANK.length} reactivos verificados contra el texto oficial · ${simInfo()}`;
function startRound(){const pool=poolFor(MODE);const fresh=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));start(fresh.concat(old).slice(0,10),{kind:"ronda",label:MODOS.find(m=>m.k===MODE).l});}
const SIMSEC=D.secciones.find(s=>s.tipo==="simulador")||{};
function cuotas(n,pesos){ // reparto por resto mayor; sólo temas con reactivos
  const ks=Object.keys(pesos).filter(k=>pesos[k]>0&&BANK.some(x=>x.tema===k)), tot=ks.reduce((a,k)=>a+pesos[k],0);
  if(!ks.length) return null;
  const raw=ks.map(k=>({k,v:n*pesos[k]/tot})), out={}; let asig=0;
  raw.forEach(r=>{out[r.k]=Math.floor(r.v);asig+=out[r.k];});
  raw.sort((a,b)=>(b.v%1)-(a.v%1)).slice(0,n-asig).forEach(r=>out[r.k]++);
  return out;
}
function startSim(n){
  if(SIMSEC.proporcion){
    const q=cuotas(n,SIMSEC.proporcion);
    if(q){
      let used=new Set(store.get(SIM,[])), pick=[], cycled=false;
      Object.entries(q).forEach(([k,c])=>{
        const delTema=BANK.filter(x=>x.tema===k); let rest=shuffle(delTema.filter(x=>!used.has(x.id)));
        if(rest.length<c){cycled=true;delTema.forEach(x=>used.delete(x.id));rest=rest.concat(shuffle(delTema.filter(x=>!rest.includes(x))));}
        rest=rest.slice(0,c); rest.forEach(x=>used.add(x.id)); pick=pick.concat(rest);
      });
      store.set(SIM,[...used]); return start(shuffle(pick),{kind:"simulacro",label:`Simulacro de ${pick.length}`,n,cycled});
    }
  }
  let used=new Set(store.get(SIM,[])), rest=BANK.filter(x=>!used.has(x.id)), cycled=false;
  if(rest.length<n){cycled=true;const take=shuffle(rest);used=new Set();const more=shuffle(BANK.filter(x=>!take.includes(x))).slice(0,n-take.length);rest=take.concat(more);more.forEach(x=>used.add(x.id));}
  else{rest=shuffle(rest).slice(0,n);rest.forEach(x=>used.add(x.id));}
  store.set(SIM,[...used]); start(shuffle(rest),{kind:"simulacro",label:`Simulacro de ${n}`,n,cycled});
}
function start(list,meta){ST={list:list.map(q=>({...q,opts:shuffle(q.o)})),i:0,ok:0,miss:[],byTema:{},meta};document.querySelectorAll(".qmode,.qsim").forEach(b=>b.setAttribute("aria-pressed","false"));render();}
function render(){
  const box=$("#quiz"),n=ST.list.length; if(ST.i>=n) return renderEnd();
  const q=ST.list[ST.i];
  box.innerHTML=`<div class="qbar"><span>${esc(ST.meta.label)} · reactivo ${ST.i+1} de ${n}</span><span>Aciertos: ${ST.ok}</span></div><div class="qprog"><i style="width:${ST.i/n*100}%"></i></div>
  <div class="qtag"><span>${esc(TEMAS[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}</div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>
  <div class="qactions"><button class="btn" id="qNext" hidden>${ST.i+1===n?"Ver resultado":"Siguiente"}</button><button class="btn ghost" id="qQuit">Terminar aquí</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  $("#qNext").addEventListener("click",()=>{ST.i++;render();});
  $("#qQuit").addEventListener("click",()=>{ST.list=ST.list.slice(0,ST.i);renderEnd();});
}
function answer(k){
  const q=ST.list[ST.i]; if(q.done) return; q.done=true; const good=q.opts[k]===q.a;
  const t=ST.byTema[q.tema]||(ST.byTema[q.tema]={ok:0,n:0}); t.n++; if(good){ST.ok++;t.ok++;} else {q.mine=q.opts[k];ST.miss.push(q);}
  seen.add(q.id); store.set(SEEN,[...seen]);
  $("#quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.a)b.classList.add("right");else if(+b.dataset.k===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`${good?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>'}${good?"":tuHTML(q,q.opts[k])} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}`;
  const nb=$("#qNext"); nb.hidden=false; nb.focus();
}
function renderEnd(){
  const box=$("#quiz"),n=ST.list.length,pct=n?Math.round(ST.ok/n*100):0;
  const msg=pct>=90?"Listos para el examen.":pct>=75?"Muy bien: repasen los temas con menos aciertos.":pct>=60?"Van bien, pero hay que repasar.":"Toca volver al mapa y repasar antes del siguiente intento.";
  const rows=Object.entries(ST.byTema).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>`<div class="trow2"><span>${esc(TEMAS[k]||k)}</span><span class="tb"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></span><span class="tv">${v.ok}/${v.n}</span></div>`).join("");
  box.innerHTML=`<div class="printhead"><b>${esc(D.meta.titulo)}</b> · 360Educa · ${esc(ST.meta.label)} · ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div><div class="qbar"><span>${esc(ST.meta.label)} · resultado</span><span>${ST.ok}/${n}</span></div><div class="qprog"><i style="width:100%"></i></div>
  <div class="score"><span class="big">${pct}%</span><span>${ST.ok} de ${n} correctas. ${msg}</span></div>
  ${rows?`<div class="lbl" style="margin-top:14px">Aciertos por tema (de menor a mayor)</div><div class="trows">${rows}</div>`:""}
  ${ST.miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${ST.miss.length})</summary><ul>${ST.miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.mine||"")}</s>${m.d&&m.d[m.mine]?` — ${esc(m.d[m.mine])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
  <div class="qactions"><button class="btn" id="qAgain">${ST.meta.kind==="simulacro"?"Otro simulacro igual":"Otra ronda"}</button><button class="btn ghost" id="qPrint">Imprimir o guardar en PDF</button><a class="btn ghost" href="#${mapa0?mapa0.id:"top"}">Repasar el mapa</a></div>
  ${ST.meta.kind==="simulacro"?`<p class="siminfo">${simInfo()}${ST.meta.cycled?" · Se completó el banco y empezó una vuelta nueva.":""}</p>`:""}`;
  $("#qAgain").addEventListener("click",()=>ST.meta.kind==="simulacro"?startSim(ST.meta.n):startRound());
  $("#qPrint").addEventListener("click",()=>{const d=box.querySelector("details.miss");if(d)d.open=true;window.print();});
  $("#bankinfo").textContent=bankInfo();
}
document.addEventListener("keydown",e=>{
  if(!ST||e.target.closest("input,textarea")) return;
  const r=$("#quiz").getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
  const k="abcd1234".indexOf(e.key.toLowerCase()); if(k>=0&&ST.i<ST.list.length&&!ST.list[ST.i].done){answer(k%4);e.preventDefault();}
});
$("#modes").innerHTML=MODOS.map(m=>`<button class="qmode" data-m="${m.k}" aria-pressed="false">${esc(m.l)} <small>${poolFor(m.k).length}</small></button>`).join("");
document.querySelectorAll(".qmode").forEach(b=>b.addEventListener("click",()=>{MODE=b.dataset.m;startRound();b.setAttribute("aria-pressed","true");}));
document.querySelectorAll(".qsim").forEach(b=>b.addEventListener("click",()=>{startSim(+b.dataset.n);b.setAttribute("aria-pressed","true");}));
$("#simReset").addEventListener("click",()=>{store.set(SIM,[]);store.set(SEEN,[]);seen=new Set();$("#bankinfo").textContent=bankInfo();});
$("#bankinfo").textContent=bankInfo();
startRound(); document.querySelector('.qmode[data-m="all"]').setAttribute("aria-pressed","true");
})();
</script>
</body>
</html>
