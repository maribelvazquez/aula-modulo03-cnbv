<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mapa mental interactivo del Apartado III de la Guía Anticorrupción de la CNBV (2020): factores de riesgo indicativos de una posible operación inusual vinculada con PEP nacionales y Personas Vulnerables, con simulador de reactivos.">
<title>Mapa de la Guía Anticorrupción · Apartado III</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}
.qactions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accion);color:var(--accion-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600;font-size:17px;margin-top:4px}
.score .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.trows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.trow2{display:grid;grid-template-columns:minmax(0,300px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.trow2 .tb{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow2 .tb i{display:block;height:100%;background:var(--principal-linea)}
.trow2 .tv{font-variant-numeric:tabular-nums;font-weight:700}
.miss{margin-top:16px;background:var(--surface-2);border-radius:12px;padding:12px 16px}
.miss summary{cursor:pointer}
.miss ul{margin:6px 0 0;padding-left:18px} .miss li{margin:8px 0}
.siminfo{font-size:13px;color:var(--muted);margin:12px 0 0}
/* repaso (tandas al azar o secuencia fija) */
.para{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--accion);border-radius:12px;padding:12px 16px;margin:-4px 0 18px;font-size:17px;font-weight:600;max-width:1040px}.para b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accion);margin-bottom:2px}
.tu{margin:10px 0;background:var(--surface);border:2px solid var(--negro);border-left:8px solid var(--coral);border-radius:10px;padding:10px 14px;font-size:16px}.tu b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.dist{margin-top:12px;font-weight:500;font-size:15px}.dist ul{margin:4px 0 0;padding-left:0;list-style:none}.dist li{margin:5px 0;padding-left:26px;text-indent:-26px}.dist li b{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;text-indent:0;margin-right:6px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-display);font-size:12px;background:var(--surface)}
.rp-fallas{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.rp-fallas h3{font-size:18px}
.rp-fallas p{font-size:14.5px}
.rp-box{scroll-margin-top:90px}
.rp-box .qtext{font-size:clamp(22px,2.8vw,34px)}
.rp-box .opt{font-size:17px}
.rp-clave{margin-top:12px;border-left:6px solid var(--principal-linea);background:var(--surface-2);border-radius:8px;padding:10px 14px;font-weight:600}
.rp-clave .lbl{margin-bottom:4px}
.rp-fin{margin:10px 0 0;padding-left:22px;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,26px);line-height:1.35}
.rp-fin li{margin:10px 0}
.rp-fin small{display:block;font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--muted)}
.rp-box:fullscreen{max-width:none;border-radius:0;border:0;padding:40px 6vw;overflow:auto;background:var(--bg)}
.rp-box:fullscreen .qtext{font-size:clamp(26px,3vw,42px)}
.rp-box:fullscreen .opt{font-size:20px}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(27,27,30,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{padding:20px 22px 18px;background:var(--c);color:var(--ci);display:flex;justify-content:space-between;gap:12px;align-items:center}
.dhead h3{font-size:28px;font-weight:700;color:inherit}
.dhead .x{background:rgba(255,255,255,.25);border:0;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:inherit;flex:none}
.dbody{padding:16px 22px 30px;overflow:auto}
.dbody ul{padding-left:18px;margin:0}
.dbody li{margin:8px 0}
.dbody .hook{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 12px}

footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:4px solid var(--membrete);padding-top:14px}
footer b{color:var(--ink)}

@media (max-width:1100px){.track{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:18px}.track::before{display:none}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .map,.map.n2,.map.n3{grid-template-columns:1fr;grid-template-areas:"core" "b1" "b2" "b3" "b4";gap:22px}
  .map.nmany{grid-template-columns:1fr;grid-template-areas:"core" "izq" "der";gap:22px}
  .map .col{gap:22px}
  .map svg.wires{display:none}
  .core{width:230px;justify-self:center}
  .opts{grid-template-columns:1fr}
  .lane{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .arrow{width:auto;height:30px;transform:rotate(90deg)}
  .stepd{grid-template-columns:1fr}
  .stepd ul{columns:1}
  .track{grid-template-columns:repeat(3,minmax(0,1fr))}
  .frac .inc{padding-left:16px}
}
@media (max-width:600px){ .chant p span{white-space:normal} .trow2{grid-template-columns:1fr auto}.trow2 .tb{grid-column:1/-1;order:3} }
@media (max-width:520px){ .rhythm{flex-wrap:wrap} .rh{flex:1 1 40%} }
.printhead{display:none}
/* franja del sitio (modo sitio: sólo si datos.sitio existe) */
.sitebar{display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:8px 16px;background:var(--negro);color:#fff;overflow-x:auto;scrollbar-width:none;font-family:var(--f-display);font-size:13px}
.sitebar::-webkit-scrollbar{display:none}
.sitebar .sb-mod{font-weight:700;letter-spacing:.04em;white-space:nowrap;margin-right:4px;color:#fff;text-decoration:none}
.sitebar .sb-mod:hover{text-decoration:underline}
.sitebar .sb-p{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;text-decoration:none;font-weight:700;white-space:nowrap;flex:none}
.sitebar a.sb-p:hover{border-color:#fff}
.sitebar .sb-p[aria-current="page"]{background:var(--principal);border-color:var(--principal);color:var(--principal-ink)}
.sitebar .sb-p.off{opacity:.45;border-style:dashed;cursor:not-allowed}
.sitebar .sb-sep{width:1px;height:20px;background:rgba(255,255,255,.3);flex:none}
.sitebar .sb-cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.sitebar .sb-ses{white-space:nowrap;color:rgba(255,255,255,.8);margin-left:auto;padding-left:12px;font-weight:600}
@media (max-width:700px){.sitebar .sb-ses{display:none}}
@media print{
  body{background:#fff;padding:0}
  .sitebar,.top,.hero,.traps,section.block:not(.sim),footer,.simbar,.modes,.sim > .lbl,.sim .sec-head,.qactions,.siminfo,.drawer,.scrim{display:none!important}
  .quiz{box-shadow:none;border:0;padding:0;max-width:none}
  .printhead{display:block;font-family:var(--f-display);font-size:14px;margin:0 0 8px}
  .miss{background:none;padding:0} .miss li{break-inside:avoid;margin:10px 0}
  .trow2 .tb{border-color:#999} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

rvicios financieros y legales, conocidos como <b>«gatekeepers»<\/b> (III.1)."], "destacado": false}, {"etiqueta": "III.1 · 3", "nombre": "Parientes, asociados o empleados como Propietarios Reales", "sub": "P de prestanombres (pariente, asociado o empleado)", "verbo": "Presto", "desc": "Poner como Propietario Real a un miembro de la familia, a un asociado cercano o a un empleado para que el nombre de la PEP no aparezca.", "orden": 3, "panel": "III.1 · Ocultamiento de identidad", "puntos": ["Uso de <b>miembros de la familia, asociados cercanos o empleados<\/b> como <b>Propietarios Reales<\/b> (III.1).", "Distínguelo: familiar que <b>de repente emprende<\/b> actividades ajenas → III.2; varios familiares que <b>manejan los recursos<\/b> en cuentas → III.4."], "destacado": false}]}, {"letra": "III.2", "titulo": "Comportamiento atípico · persona", "pregunta": "¿Qué lo delata? — Dinero · Tiene · Dice · Dónde (criterio de clase)", "ritmo": "¿Lo delata?", "corto": "III.2", "color": "principal", "items": [{"etiqueta": "III.2 · 1", "nombre": "El sueldo se queda intacto", "sub": "Dinero", "verbo": "Atesoro", "desc": "El salario que paga la dependencia se deja completo en la cuenta o se pasa completo a inversión, sin usarse para pagar gasto alguno.", "orden": 4, "panel": "III.2 · Comportamiento atípico", "puntos": ["Los fondos transferidos al Cliente por concepto de <b>sueldos y salarios<\/b> de la Dependencia, Entidad u Órgano Público donde labora son <b>dejados en su totalidad<\/b> en la cuenta de depósito o <b>transferidos en su totalidad<\/b> a cuentas de inversión, <b>sin<\/b> que se usen para el pago de gasto alguno (III.2).", "La lógica: si no usa su sueldo para vivir, ¿con qué paga sus gastos?", "Introducción del III.2: estos factores también pueden considerarse durante la investigación de posibles Operaciones Inusuales que surjan a partir de alertas."], "destacado": true}, {"etiqueta": "III.2 · 2", "nombre": "Alto uso de efectivo", "sub": "Dinero", "verbo": "Deposito", "desc": "Alto índice de uso de efectivo en las cuentas del Cliente, en depósitos y/o en retiros, sin una justificación aparente.", "orden": 5, "panel": "III.2 · Comportamiento atípico", "puntos": ["<b>Alto índice de uso de efectivo<\/b> en las cuentas del Cliente, ya sea en <b>depósitos y/o en retiros<\/b>, sin una justificación aparente (III.2).", "Distínguelo: retiros en efectivo de una cuenta a nombre de una <b>dependencia<\/b> → III.3."], "destacado": false}, {"etiqueta": "III.2 · 3", "nombre": "Compra y revende bienes en corto plazo", "sub": "Dinero", "verbo": "Revendo", "desc": "Adquiere bienes muebles e inmuebles, directamente o a través de familia o amistades, y los vuelve a negociar en poco tiempo.", "orden": 6, "panel": "III.2 · Comportamiento atípico", "puntos": ["El Cliente o Usuario adquiere, directamente o <b>a través de terceros<\/b> (grupo familiar o círculo de amistades, por ejemplo), <b>bienes muebles e inmuebles<\/b> y los <b>vuelve a negociar en un corto plazo<\/b> (III.2)."], "destacado": false}, {"etiqueta": "III.2 · 4", "nombre": "Ingresos y patrimonio crecen sin justificación", "sub": "Tiene", "verbo": "Engordo", "desc": "El ingreso y el patrimonio del Cliente o Usuario aumentan sin una explicación que lo justifique.", "orden": 7, "panel": "III.2 · Comportamiento atípico", "puntos": ["<b>Incremento injustificado<\/b> de los <b>ingresos y patrimonio<\/b> del Cliente o Usuario (III.2)."], "destacado": false}, {"etiqueta": "III.2 · 5", "nombre": "Estilo de vida no acorde con su salario", "sub": "Tiene", "verbo": "Ostento", "desc": "Su estilo de vida, o un cambio repentino en él, no corresponde a su salario; por ejemplo, consumo de bienes de lujo.", "orden": 8, "panel": "III.2 · Comportamiento atípico", "puntos": ["<b>Estilo de vida<\/b> del Cliente o Usuario, o <b>cambios repentinos<\/b> en este, <b>no acorde con su salario<\/b> (ej. consumo de bienes de lujo) (III.2).", "Las redes sociales, como Fuente Abierta, pueden mostrar viajes, autos, bienes de lujo o inmuebles fuera de su alcance (preámbulo del III)."], "destacado": false}, {"etiqueta": "III.2 · 6", "nombre": "Emprende de repente actividades ajenas", "sub": "Tiene", "verbo": "Emprendo", "desc": "El Cliente, un familiar o una persona cercana empieza de repente, directamente o por terceros, actividades económicas que le eran ajenas.", "orden": 9, "panel": "III.2 · Comportamiento atípico", "puntos": ["El Cliente, <b>familiar o persona cercana<\/b> a éste, que <b>de repente ejerce<\/b> directamente o a través de terceros <b>actividades económicas a las que era ajeno<\/b> hasta hacía poco tiempo (III.2)."], "destacado": false}, {"etiqueta": "III.2 · 7", "nombre": "Pregunta por la política PLD/FT o de PEP", "sub": "Dice", "verbo": "Pregunto", "desc": "Hace consultas sobre la política PLD/FT de la institución o sobre la política que se aplica a las PEP.", "orden": 10, "panel": "III.2 · Comportamiento atípico", "puntos": ["El Cliente o Usuario realiza <b>consultas sobre la política PLD/FT<\/b> de la institución o la <b>política aplicable a las PEP<\/b> (III.2)."], "destacado": false}, {"etiqueta": "III.2 · 8", "nombre": "Renuente a explicar el origen de sus recursos", "sub": "Dice", "verbo": "Evado", "desc": "Parece incómodo o renuente para dar información sobre la fuente de su riqueza o el origen de los recursos.", "orden": 11, "panel": "III.2 · Comportamiento atípico", "puntos": ["El Cliente o Usuario parece <b>incómodo o renuente<\/b> para proporcionar información sobre la <b>fuente de riqueza u origen de los recursos<\/b> (III.2)."], "destacado": false}, {"etiqueta": "III.2 · 9", "nombre": "Su información choca con la pública", "sub": "Dice", "verbo": "Contradigo", "desc": "Lo que declara al Sujeto Supervisado no cuadra con información públicamente disponible, como declaraciones de activos y salarios oficiales.", "orden": 12, "panel": "III.2 · Comportamiento atípico", "puntos": ["La información que proporciona el Cliente o Usuario es <b>inconsistente con otra información públicamente disponible<\/b>, como <b>declaraciones de activos<\/b> y <b>salarios oficiales publicados<\/b> (III.2)."], "destacado": false}, {"etiqueta": "III.2 · 10", "nombre": "Información inexacta o incompleta", "sub": "Dice", "verbo": "Omito", "desc": "El Cliente o Usuario proporciona información inexacta o incompleta.", "orden": 13, "panel": "III.2 · Comportamiento atípico", "puntos": ["El Cliente o Usuario proporciona <b>información inexacta o incompleta<\/b> (III.2).", "Distínguelo del factor 9: allí el problema es que choca con información <b>pública<\/b>; aquí, que está mal o le falta algo."], "destacado": false}, {"etiqueta": "III.2 · 11", "nombre": "No explica por qué opera lejos de donde radica", "sub": "Dónde", "verbo": "Me alejo", "desc": "No puede, o es reacio a, explicar por qué hace negocios en lugares distintos a donde radica.", "orden": 14, "panel": "III.2 · Comportamiento atípico", "puntos": ["El Cliente o Usuario <b>no puede o es reacio a explicar<\/b> la razón por la cual hace <b>negocios en lugares distintos a donde radica<\/b> (III.2)."], "destacado": false}, {"etiqueta": "III.2 · 12", "nombre": "Busca una entidad que no atiende alto patrimonio", "sub": "Dónde", "verbo": "Desentono", "desc": "Busca los servicios de un Sujeto Supervisado que normalmente no atendería a Clientes de alto nivel patrimonial.", "orden": 15, "panel": "III.2 · Comportamiento atípico", "puntos": ["El Cliente o Usuario busca hacer uso de los servicios de un Sujeto Supervisado que <b>normalmente no atenderían a Clientes de alto nivel patrimonial<\/b> (III.2)."], "destacado": false}, {"etiqueta": "III.2 · 13", "nombre": "Fondos con países sin relación aparente", "sub": "Dónde", "verbo": "Envío", "desc": "Los fondos se transfieren repetidamente hacia y desde países con los que el Cliente o Usuario parece no estar relacionado.", "orden": 16, "panel": "III.2 · Comportamiento atípico", "puntos": ["Los fondos se transfieren <b>repetidamente hacia y desde países<\/b> con los que el Cliente o Usuario <b>parece no estar relacionado<\/b> (III.2).", "Distínguelo: dispersión de recursos públicos a otros países, incluidos los de baja imposición fiscal, dentro de la red de fachadas → III.4."], "destacado": false}]}, {"letra": "III.3", "titulo": "Comportamiento atípico · cuenta pública", "pregunta": "¿Cómo se mueve la cuenta pública? — Retiro · Transfiero · Contrato · Facturo", "ritmo": "¿Cuenta pública?", "corto": "III.3", "color": "turquesa", "items": [{"etiqueta": "III.3 · 1", "nombre": "Retiros en efectivo sin justificación o en elecciones", "sub": "Cuenta pública", "verbo": "Retiro", "desc": "Alto índice de retiros en efectivo de la cuenta pública sin justificación aparente o durante los procesos electorales.", "orden": 17, "panel": "III.3 · Cuentas públicas", "puntos": ["La forma de operar de las cuentas a nombre de Dependencias, Entidades u Órganos Públicos puede ser indicativa de factores de Riesgo (III.3).", "<b>Alto índice de retiros en efectivo<\/b> sin una justificación aparente <b>o durante los procesos electorales<\/b> (III.3)."], "destacado": false}, {"etiqueta": "III.3 · 2", "nombre": "Transferencias a particulares sin razón aparente", "sub": "Cuenta pública", "verbo": "Transfiero", "desc": "Desde la cuenta de la dependencia se transfiere a personas físicas o morales sin que exista una razón aparente.", "orden": 18, "panel": "III.3 · Cuentas públicas", "puntos": ["Se realizan <b>transferencias a personas físicas o morales<\/b> desde cuentas a nombre de Dependencias, Entidades u Órganos Públicos <b>sin que exista una razón aparente<\/b> (III.3)."], "destacado": false}, {"etiqueta": "III.3 · 3", "nombre": "Contrato con un giro distinto al servicio", "sub": "Cuenta pública", "verbo": "Contrato", "desc": "La transferencia se justifica con un contrato asignado a quien opera en un giro distinto: obra civil pagada a una textilera.", "orden": 19, "panel": "III.3 · Cuentas públicas", "puntos": ["Transferencias de fondos desde cuentas públicas hacia personas físicas o morales que tienen como justificación la asignación de un contrato que <b>opera en un giro distinto al servicio contratado<\/b> (III.3).", "Ejemplo de la Guía: contratos para la <b>construcción de obra civil<\/b> hacia una compañía que se dedica a la <b>producción de textiles<\/b> (III.3)."], "destacado": false}, {"etiqueta": "III.3 · 4", "nombre": "Facturas infladas o con detalle pobre", "sub": "Cuenta pública", "verbo": "Facturo", "desc": "Facturas que justifican Operaciones de alto valor con cargos injustificados, precios muy por arriba del mercado, o documentación de cumplimiento muy simple o sin el detalle usual.", "orden": 20, "panel": "III.3 · Cuentas públicas", "puntos": ["Las facturas que justifican ciertas Operaciones por <b>alto valor<\/b> denotan que se incorporan <b>cargos injustificados<\/b>, se cobran <b>precios muy por arriba del precio de mercado<\/b>, o la documentación sobre el cumplimiento del contrato es <b>muy simple o no posee el nivel de detalle usual<\/b> (III.3)."], "destacado": false}]}, {"letra": "III.4", "titulo": "Casos recientes en México", "pregunta": "¿Cómo se arma el caso mexicano? — de la fachada al desvío", "ritmo": "¿Caso México?", "corto": "III.4", "color": "negro", "items": [{"etiqueta": "III.4 · 1", "nombre": "Red de empresas fachada que coinciden", "sub": "Casos México", "verbo": "Constituyo", "desc": "Numerosas empresas fachada, en México y en el extranjero, con los mismos dueños, prestanombres, representantes, comisarios, notarios, domicilios y empleados.", "orden": 21, "panel": "III.4 · Casos recientes en México", "puntos": ["Estos factores se identificaron a partir de <b>Fuentes Abiertas<\/b> sobre varios casos recientes de corrupción en México (III.4).", "El uso de <b>numerosas empresas fachada<\/b> (constituidas en México y en el extranjero), entre las cuales <b>coinciden<\/b> dueños, prestanombres, representantes legales, comisarios y notarios que avalaron su creación, y coinciden también direcciones fiscales y empleados (III.4)."], "destacado": false}, {"etiqueta": "III.4 · 2", "nombre": "Contratos por bienes o servicios que nunca existen", "sub": "Casos México", "verbo": "Pago", "desc": "Los recursos públicos llegan a las fachadas por contratos, o aun sin ellos, para bienes o servicios que nunca se entregan.", "orden": 22, "panel": "III.4 · Casos recientes en México", "puntos": ["Los recursos públicos son enviados a dichas empresas <b>por medio de contratos, y en ocasiones sin la existencia de estos<\/b>, para la supuesta adquisición de bienes o prestación de servicios que <b>nunca se llevan a cabo<\/b> (III.4)."], "destacado": false}, {"etiqueta": "III.4 · 3", "nombre": "Funcionarios cómplices autorizan los pagos", "sub": "Casos México", "verbo": "Autorizo", "desc": "Otros servidores públicos, como el tesorero de Finanzas estatal o municipal, autorizan los pagos a las fachadas.", "orden": 23, "panel": "III.4 · Casos recientes en México", "puntos": ["Para los desvíos, comúnmente se cuenta con la <b>complicidad de otro u otros funcionarios públicos<\/b> «(comúnmente el <b>tesorero<\/b> de la Secretaría de Finanzas estatal o municipal, encargado de las áreas de recursos materiales, adquisiciones y asuntos jurídicos, etc.)», a fin de <b>autorizar los pagos<\/b> a las empresas fachada (III.4)."], "destacado": false}, {"etiqueta": "III.4 · 4", "nombre": "Fachadas que simulan competir en licitaciones", "sub": "Casos México", "verbo": "Simulo", "desc": "Varias empresas fachada simulan competir en los concursos de licitación, y el patrón se repite en varias dependencias estatales.", "orden": 24, "panel": "III.4 · Casos recientes en México", "puntos": ["Para la asignación de contratos, varias de las empresas fachada <b>simulan competir en los concursos de licitación<\/b>. Este patrón <b>se replica en varias dependencias estatales<\/b> (III.4)."], "destacado": false}, {"etiqueta": "III.4 · 5", "nombre": "Objeto social de todo y listadas en el 69-B", "sub": "Casos México", "verbo": "Disfrazo", "desc": "Actas constitutivas con múltiples actividades sin relación entre sí; algunas están listadas por el SAT como simuladoras (art. 69-B del CFF).", "orden": 25, "panel": "III.4 · Casos recientes en México", "puntos": ["Las empresas fachada, en sus actas constitutivas, declaran dedicarse a <b>múltiples actividades sin relación entre sí<\/b> (desde el comercio de todo tipo de producto legal hasta dar cursos de superación personal) (III.4).", "Además, algunas están <b>listadas por el SAT como simuladoras de Operaciones<\/b>, según el <b>artículo 69-B del Código Fiscal de la Federación<\/b> (III.4)."], "destacado": false}, {"etiqueta": "III.4 · 6", "nombre": "Triangulación compleja sin destino claro", "sub": "Casos México", "verbo": "Triangulo", "desc": "Ya recibidos los recursos de gobierno, se triangulan entre la red de fachadas y algunas personas físicas, sin que el destino quede claro.", "orden": 26, "panel": "III.4 · Casos recientes en México", "puntos": ["Una vez recibidos los recursos del gobierno en alguna de las empresas fachada, inicia un <b>proceso complejo de triangulación<\/b> entre la red de empresas fachada y algunas personas físicas, <b>sin que el destino de los recursos quede del todo claro<\/b> (III.4)."], "destacado": false}, {"etiqueta": "III.4 · 7", "nombre": "Dispersión a otros países e inmuebles fuera", "sub": "Casos México", "verbo": "Disperso", "desc": "En ocasiones los recursos se dispersan a otros países, incluidos los de baja imposición fiscal, a veces para comprar inmuebles allá.", "orden": 27, "panel": "III.4 · Casos recientes en México", "puntos": ["En ocasiones se realiza la <b>dispersión de recursos a otros países<\/b>, incluidos <b>países de baja imposición fiscal<\/b>. Algunas dispersiones se hacen para la <b>compra de bienes inmuebles en otros países<\/b> (III.4)."], "destacado": false}, {"etiqueta": "III.4 · 8", "nombre": "Varios familiares manejan los recursos", "sub": "Casos México", "verbo": "Involucro", "desc": "Involucramiento de varios familiares para el manejo de los recursos en cuentas bancarias.", "orden": 28, "panel": "III.4 · Casos recientes en México", "puntos": ["<b>Involucramiento de varios familiares<\/b> para el <b>manejo de los recursos en cuentas bancarias<\/b> (III.4).", "Dentro del Apartado III es el tercer subapartado donde aparece la familia: III.1 (como Propietario Real), III.2 (emprende de repente, o el tercero por quien se compra y revende) y III.4 (maneja las cuentas)."], "destacado": false}, {"etiqueta": "III.4 · 9", "nombre": "Desvío de obra pública y programas asistenciales", "sub": "Casos México", "verbo": "Desvío", "desc": "Se desvían recursos que debían ir a obra pública o a planes asistenciales para los sectores de la población más desfavorecidos.", "orden": 29, "panel": "III.4 · Casos recientes en México", "puntos": ["<b>Desvío de recursos<\/b> que debieron ser destinados a <b>obra pública<\/b> o a <b>planes asistenciales<\/b> dirigidos a los sectores de la población más desfavorecidos (III.4)."], "destacado": false}]}], "frase": {"titulo": "Para recitar en voz alta (criterio de clase)", "html": "<span>¿Se esconde? <b>V · I · P<\/b>: Estructuro, Interpongo, Presto.<\/span> <span>¿Lo delata? <b>Dinero<\/b>: Atesoro, Deposito, Revendo. <b>Tiene<\/b>: Engordo, Ostento, Emprendo. <b>Dice<\/b>: Pregunto, Evado, Contradigo, Omito. <b>Dónde<\/b>: Me alejo, Desentono, Envío.<\/span> <span>¿Cuenta pública? Retiro, Transfiero, Contrato, Facturo.<\/span> <span>¿Caso México? Constituyo, Pago, Autorizo, Simulo, Disfrazo, Triangulo, Disperso, Involucro y Desvío.<\/span>"}}, {"tipo": "tarjetas", "id": "uso", "nav": "Cómo se usan", "titulo": "Antes de los factores: cómo se usan", "intro": "El párrafo con el que abre el Apartado III dice cómo leer la lista. El examen lo pregunta tanto como los factores.", "tarjetas": [{"encabezado": true, "color": "principal", "titulo": "Fuentes Abiertas", "subtitulo": "Preámbulo del III", "filas": [{"k": "Qué dice", "v": "La búsqueda de información en <b>Fuentes Abiertas<\/b> es «un factor de Riesgo importante» al analizar Operaciones posiblemente inusuales."}, {"k": "Para qué", "v": "Es información adicional para determinar la procedencia de emitir o no el <b>Reporte de Operaciones Inusuales<\/b>."}, {"k": "Ejemplos", "v": "Notas periodísticas sobre la persona, sus relacionados o su dependencia; redes sociales con viajes, autos, bienes de lujo o inmuebles fuera de su alcance."}, {"k": "Definición", "v": "Información digital o impresa disponible al público en general, que el Sujeto Supervisado consulte para robustecer su análisis, en términos de su Manual de Cumplimiento u otro documento interno (Def. VII)."}]}, {"encabezado": true, "color": "morado", "titulo": "¿Cuántos factores hacen falta?", "subtitulo": "Preámbulo del III", "filas": [{"k": "Regla", "v": "Es posible que tengan que presentarse <b>varios factores<\/b> para crear un escenario inusual."}, {"k": "Excepción", "v": "En algunos casos, según las circunstancias específicas, <b>uno solo<\/b> de estos factores puede ser indicativo de una inusualidad."}, {"k": "Uso", "v": "Los factores «podrán» tomarse en cuenta para fortalecer el análisis de la existencia o no de una Operación Inusual."}]}, {"encabezado": true, "color": "turquesa", "titulo": "Una lista abierta", "subtitulo": "Preámbulo del III", "filas": [{"k": "No exhaustiva", "v": "La lista <b>no es exhaustiva<\/b> y <b>solo complementa<\/b> los factores de Riesgo habituales de cada Sujeto Supervisado."}, {"k": "Cambiante", "v": "Los métodos de LD derivados de actos de corrupción pueden cambiar, y sus indicadores también."}, {"k": "Local", "v": "Puede haber otros factores igual de importantes propios de la <b>zona geográfica<\/b> donde opere la PEP nacional o Persona Vulnerable."}]}, {"encabezado": true, "color": "negro", "titulo": "¿De dónde salen?", "subtitulo": "Preámbulo del III y III.4", "filas": [{"k": "Compendio", "v": "El preámbulo presenta el compendio como factores identificados en documentos de <b>organismos internacionales<\/b>."}, {"k": "III.4", "v": "Precisa que los suyos salen de <b>Fuentes Abiertas<\/b> sobre <b>casos recientes de corrupción en México<\/b>."}, {"k": "Momento", "v": "Ayudan a detectar el uso indebido del Sistema Financiero por PEP nacionales y Personas Vulnerables <b>durante una relación comercial<\/b>."}]}], "nota": "El Apartado III presenta los factores para fortalecer el análisis de la existencia o no de una Operación Inusual. Para la clasificación por Grado de Riesgo de la PEP nacional, la Guía (Apdo. II) orienta a considerar sus características inherentes y transaccionales de manera individual, no per se; la obligación de clasificar está en las DCG (28ª)."}, {"tipo": "tarjetas", "id": "quien", "nav": "PEP y Persona Vulnerable", "titulo": "Lo mínimo para entender el Apartado III", "intro": "Contexto que el Apartado III da por sabido. Sale del Objeto, de las Definiciones VII, XIII y XIV, del Apartado II y de menciones puntuales del I.1.3 y I.1.4; lo marcado <b>DCG<\/b> no es de la Guía.", "tarjetas": [{"encabezado": true, "color": "principal", "titulo": "PEP", "subtitulo": "Definición XIII", "filas": [{"k": "Quién", "v": "Quien desempeña o <b>ha desempeñado<\/b> funciones públicas destacadas en un país extranjero o en territorio nacional."}, {"k": "Ejemplos", "v": "Jefes de estado o de gobierno, líderes políticos, funcionarios gubernamentales, judiciales o militares de alta jerarquía, altos ejecutivos de empresas estatales, funcionarios o miembros importantes de partidos políticos y organizaciones internacionales, entre otros."}, {"k": "Datos", "v": "La Secretaría podrá dar a conocer Datos que permitan identificarlas en lo individual."}]}, {"encabezado": true, "color": "morado", "titulo": "Persona Vulnerable", "subtitulo": "Definición XIV", "filas": [{"k": "Quién", "v": "Clientes o Usuarios que <b>no son clasificados como PEP<\/b>, pero pueden representar un Riesgo de LD relacionado con la corrupción."}, {"k": "Por qué", "v": "Por los <b>vínculos financieros<\/b> identificados en una posible Operación Inusual en la que está involucrado un Cliente o Usuario <b>PEP nacional<\/b>, con otros Clientes o Usuarios del propio Sujeto Supervisado."}, {"k": "Datos", "v": "La Secretaría también podrá dar a conocer Datos para identificarlas en lo individual."}]}, {"encabezado": true, "color": "turquesa", "titulo": "PEP nacional: caso por caso", "subtitulo": "Guía · Apartado II", "filas": [{"k": "Regla", "v": "Para clasificar a las PEP nacionales y a las Personas Vulnerables en un grado de riesgo se toman en cuenta sus características <b>inherentes y transaccionales de manera individual<\/b>, de modo que no sean clasificadas <b>per se<\/b> como de alto ni de bajo Riesgo."}, {"k": "Aunque", "v": "La ENR considera la corrupción una amenaza importante para el LD; eso no vuelve automáticamente alto riesgo a la PEP nacional."}, {"k": "Deseable", "v": "Considerar en su Grado de Riesgo el nivel de exposición a un acto de corrupción, con los Datos de la Secretaría y los del Sujeto Supervisado."}]}, {"encabezado": true, "color": "negro", "titulo": "PEP extranjera: alto riesgo", "subtitulo": "DCG Bancos, 28ª y 2ª fr. XXXI — no es Guía", "filas": [{"k": "Regla", "v": "Se consideran Clientes de <b>Grado de Riesgo alto<\/b>, al menos, los no residentes en el país asignados a banca privada o sector similar y las <b>Personas Políticamente Expuestas extranjeras<\/b>; también, las personas morales que operan efectivo en dólares conforme a la 33ª Bis 1 (DCG Bancos, 28ª, 2º párr.)."}, {"k": "Nombre", "v": "La Guía (Def. XIII) y las DCG (2ª, fr. XXXI) usan la misma definición base de Persona Políticamente Expuesta; la Guía la abrevia «PEP». Sólo las DCG añaden a los asimilados (cónyuge, concubina o concubinario, parientes hasta segundo grado y personas morales con vínculos patrimoniales) y la regla del año siguiente a dejar el encargo (DCG, 2ª, fr. XXXI)."}, {"k": "Ojo", "v": "En examen, si la pregunta dice «según la Guía», la clasificación de la PEP extranjera como alto riesgo no sale de la Guía (la Guía sólo la menciona al describir la Recomendación 12 del GAFI, I.1.4)."}]}, {"encabezado": true, "color": "oscuro", "titulo": "Naturaleza de la Guía", "subtitulo": "Objeto", "filas": [{"k": "Finalidad", "v": "Ayudar a los Sujetos Supervisados a comprender los factores de Riesgo de corrupción de sus relaciones con PEP nacionales y Personas Vulnerables."}, {"k": "Fuerza", "v": "<b>No vinculante<\/b>; su grado de adopción <b>no será objeto de sanción<\/b>; no establece obligaciones más allá de las Disposiciones."}, {"k": "Medidas", "v": "Enunciativas y no exhaustivas: pueden adoptarse u optar por medidas distintas."}]}, {"encabezado": true, "color": "amarillo", "titulo": "¿Qué corrupción importa?", "subtitulo": "Guía · Apartado II", "filas": [{"k": "Enfoque", "v": "La identificación y gestión de Riesgos de PEP nacionales y Personas Vulnerables debe centrarse en la <b>«corrupción a gran escala»<\/b>."}, {"k": "Delitos", "v": "Algunos son el <b>cohecho<\/b>, el <b>tráfico de influencia<\/b>, el <b>peculado<\/b>, el <b>enriquecimiento ilícito<\/b> y el <b>financiamiento ilícito<\/b>."}, {"k": "Manual", "v": "La decisión de adoptar medidas adicionales con PEP nacionales o Personas Vulnerables debe estar documentada en el Manual de Cumplimiento."}]}], "nota": "El I.1.3 (Transparencia Internacional y su clasificación de la corrupción) es materia del Área 1 del temario; aquí sólo se usa la expresión «corrupción a gran escala» porque el Apartado II la toma como enfoque."}, {"tipo": "tarjetas", "id": "ubicar", "nav": "¿En qué apartado cae?", "titulo": "¿En qué apartado cae? Los que se confunden", "intro": "En un caso, ubica primero la pregunta del grupo y luego el factor. Estos son los cruces que más se confunden.", "tarjetas": [{"encabezado": true, "color": "morado", "titulo": "La familia", "subtitulo": "Tres subapartados del III", "filas": [{"k": "III.1", "v": "Como <b>Propietario Real<\/b>, para que no aparezca la PEP."}, {"k": "III.2", "v": "El familiar que <b>de repente emprende<\/b> actividades ajenas, o por quien el cliente <b>compra y revende<\/b> bienes."}, {"k": "III.4", "v": "<b>Varios familiares<\/b> que manejan los recursos en cuentas bancarias."}]}, {"encabezado": true, "color": "principal", "titulo": "Las personas morales", "subtitulo": "No todas son III.1", "filas": [{"k": "III.1", "v": "Vehículo corporativo <b>sin justificación comercial<\/b> que oculta a la PEP (también mandatos y fideicomisos)."}, {"k": "III.3", "v": "Persona moral que <b>recibe<\/b> de la cuenta pública sin razón aparente o con un contrato de giro distinto."}, {"k": "III.4", "v": "<b>Red de fachadas<\/b> que coinciden en dueños, notarios, domicilios y empleados."}]}, {"encabezado": true, "color": "turquesa", "titulo": "El efectivo", "subtitulo": "¿Cuenta de quién?", "filas": [{"k": "III.2", "v": "Alto uso de efectivo en las cuentas <b>del Cliente<\/b>, depósitos y/o retiros."}, {"k": "III.3", "v": "Alto índice de retiros en efectivo de la cuenta <b>de la dependencia<\/b>, sin justificación o en procesos electorales."}]}, {"encabezado": true, "color": "negro", "titulo": "El extranjero", "subtitulo": "¿Quién mueve?", "filas": [{"k": "III.1", "v": "Esquemas corporativos en <b>jurisdicciones extranjeras<\/b> que ocultan identidad."}, {"k": "III.2", "v": "Fondos que van y vienen de <b>países sin relación<\/b> aparente con el cliente."}, {"k": "III.4", "v": "Empresas fachada <b>constituidas en el extranjero<\/b> y dispersión de recursos a otros países, incluidos los de <b>baja imposición fiscal<\/b>, a veces para comprar inmuebles."}]}], "nota": "Criterio de clase: las cuatro preguntas no son texto de la Guía, pero respetan su agrupación. Si un caso encaja en dos apartados, busca el detalle que decide: quién es el titular de la cuenta y qué está haciendo."}, {"tipo": "cifras", "id": "cifras", "nav": "Cifras", "titulo": "Cifras y referencias que preguntan", "intro": "Pocas cifras, pero muy preguntables. El conteo de factores es por viñetas del texto.", "cifras": [["29", "factores", "En el Apartado III, ritmo 3 · 13 · 4 · 9", "Apdo. III"], ["4", "grupos", "Ocultamiento · comportamiento atípico (persona) · comportamiento atípico (cuenta pública) · casos México", "III.1 a III.4"], ["13", "factores", "El grupo más largo: comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.2"], ["> 3", "niveles", "Estructuración corporativa sin opinión profesional que la justifique", "III.1"], ["1", "factor", "En algunos casos, según las circunstancias específicas, uno solo puede ser indicativo de una inusualidad", "Preámbulo del III"], ["69-B", "CFF", "Empresas listadas por el SAT como simuladoras de Operaciones", "III.4"], ["XIII", "Def.", "PEP: funciones públicas destacadas, en el extranjero o en territorio nacional", "Definiciones"], ["XIV", "Def.", "Persona Vulnerable: no es PEP; sus vínculos financieros con un Cliente PEP nacional se identifican en una posible Operación Inusual", "Definiciones"], ["No", "vinculante", "Su grado de adopción no será objeto de sanción por la CNBV", "Objeto"], ["28ª", "DCG", "PEP extranjera: entre los Clientes que, al menos, se consideran de Grado de Riesgo alto (DCG Bancos, no Guía)", "DCG Bancos, 28ª"]]}, {"tipo": "simulador", "id": "examen", "nav": "Practicar ▸"}], "temas": {"gen": "Cómo se usan los factores, PEP y naturaleza de la Guía", "ocu": "III.1 · Ocultamiento de identidad", "ati": "III.2 · Comportamiento atípico (PEP nacional o Persona Vulnerable)", "pub": "III.3 · Comportamiento atípico (cuenta pública)", "mex": "III.4 · Casos recientes de corrupción en México"}, "modos": [{"k": "ati", "l": "III.2 · persona", "tema": "ati"}, {"k": "ocu", "l": "III.1 · ocultamiento", "tema": "ocu"}, {"k": "pub", "l": "III.3 · cuenta pública", "tema": "pub"}, {"k": "mex", "l": "III.4 · casos México", "tema": "mex"}, {"k": "gen", "l": "Uso, PEP y la Guía", "tema": "gen"}, {"k": "caso", "l": "Casos prácticos", "tipos": ["caso"]}, {"k": "tr", "l": "Cifras y trampas", "tipos": ["cifra", "trampa"]}], "banco": [{"id": "C001", "tema": "gen", "tipo": "memoria", "q": "Según el Objeto de la Guía Anticorrupción, ¿qué fuerza jurídica tiene frente a los Sujetos Supervisados?", "a": "No tiene efectos vinculantes y su grado de adopción no será objeto de sanción por parte de la CNBV", "o": ["No tiene efectos vinculantes y su grado de adopción no será objeto de sanción por parte de la CNBV", "Es obligatoria para todos los Sujetos Supervisados y su incumplimiento se sanciona conforme a las Disposiciones", "Es vinculante sólo para las instituciones de crédito y meramente orientadora para el resto de los Sujetos Supervisados", "Se vuelve vinculante a partir de que el Sujeto Supervisado la incorpora a su Manual de Cumplimiento interno"], "x": "La Guía declara expresamente que no tendrá efectos vinculantes y que su grado de adopción no será objeto de sanción. El distractor más tentador es pensar que se vuelve obligatoria al incorporarla al Manual: la Guía no prevé ese efecto. Fundamento: Objeto de la Guía.", "ref": "Objeto"}, {"id": "C002", "tema": "gen", "tipo": "caso", "q": "El oficial de cumplimiento de Sofom Arrayán decide no aplicar las medidas de mitigación que describe la Guía y, en su lugar, documenta medidas propias distintas para sus Clientes PEP nacionales. Conforme a la Guía, ¿cómo se valora esa decisión?", "a": "Es válida: las medidas de la Guía son enunciativas y no exhaustivas, y podrán adoptarse otras distintas", "o": ["Es inválida: la Guía amplía las obligaciones de las Disposiciones y exige adoptar todas sus medidas", "Sólo es válida si obtiene autorización previa de la CNBV para apartarse de las medidas que la Guía describe", "Es válida: las medidas de la Guía son enunciativas y no exhaustivas, y podrán adoptarse otras distintas", "Es inválida: debe adoptar al menos las medidas del Apartado II.1 para evitar una sanción de la CNBV"], "x": "El Objeto dice que las medidas de mitigación son de carácter enunciativo y no exhaustivo, y que los Sujetos Supervisados podrán adoptar cualquiera de ellas o tomar medidas distintas. No existe autorización previa ni sanción por apartarse de ellas, porque la Guía no establece obligaciones más allá de las Disposiciones. Fundamento: Objeto de la Guía.", "ref": "Objeto"}, {"id": "C003", "tema": "gen", "tipo": "caso", "q": "Al analizar una alerta de la diputada local Ana, Cliente de Banco Alcázar, el analista localiza una nota periodística sobre irregularidades en la dependencia donde ella trabaja. Según el preámbulo del Apartado III, ¿qué papel tiene esa búsqueda en Fuentes Abiertas?", "a": "Es un factor importante que aporta información adicional para decidir si procede o no emitir el Reporte de Operaciones Inusuales", "o": ["Sólo puede usarse si la nota periodística menciona a la diputada por su nombre, y no cuando se refiere sólo a la dependencia", "Basta por sí sola para emitir el Reporte de Operaciones Inusuales, sin necesidad de analizar las operaciones de la diputada ni su perfil", "Es un factor importante que aporta información adicional para decidir si procede o no emitir el Reporte de Operaciones Inusuales", "No debe considerarse, porque la Guía limita el análisis de las alertas a la información transaccional que el Cliente genera"], "x": "El preámbulo del III califica la búsqueda en Fuentes Abiertas como un factor de Riesgo importante, que puede ser información adicional para determinar la procedencia de emitir o no el Reporte de Operaciones Inusuales. Entre los ejemplos incluye notas que mencionen a la persona, a sus relacionados o a la Dependencia, Entidad u Órgano Público para la que trabaja. Fundamento: Apdo. III, preámbulo.", "ref": "Apdo. III, preámbulo"}, {"id": "C004", "tema": "gen", "tipo": "caso", "q": "En el análisis de una posible Operación Inusual de un Cliente PEP nacional sólo se identificó un factor de los que enumera la Guía. El analista concluye: «con un solo factor no puede haber inusualidad». Según la Guía, ¿es correcta su conclusión?", "a": "No: aunque pueden requerirse varios factores, en algunos casos un solo factor puede ser indicativo de una inusualidad", "o": ["Sí: la Guía exige que concurran al menos dos factores del Apartado III para considerar que existe una Operación Inusual", "Sí: la Guía exige al menos tres factores, y además que provengan de distintos grupos del Apartado III de la Guía", "No: cualquier factor de la lista obliga, en todos los casos y sin más análisis, a emitir el Reporte de Operaciones Inusuales", "No: aunque pueden requerirse varios factores, en algunos casos un solo factor puede ser indicativo de una inusualidad"], "x": "El preámbulo del III dice que es posible que se tengan que presentar varios factores para crear un escenario inusual, pero que en algunos casos, según las circunstancias específicas, uno solo puede ser indicativo de una inusualidad. No fija un mínimo, y tampoco convierte un factor aislado en reporte automático: usa «puede». Fundamento: Apdo. III, preámbulo.", "ref": "Apdo. III, preámbulo"}, {"id": "C005", "tema": "gen", "tipo": "memoria", "q": "Según el preámbulo del Apartado III, ¿cómo se relaciona la lista de factores de la Guía con los factores de Riesgo que ya usa cada Sujeto Supervisado?", "a": "No es exhaustiva y solo complementa los factores de Riesgo habituales de cada Sujeto Supervisado", "o": ["No es exhaustiva y solo complementa los factores de Riesgo habituales de cada Sujeto Supervisado", "Es una lista cerrada que no admite factores adicionales a los que enumera el Apartado III de la Guía", "Sustituye a los factores habituales, que deben ajustarse a la lista de la Guía en la siguiente revisión", "Prevalece sobre los factores habituales siempre que el Cliente analizado sea una PEP nacional"], "x": "La Guía aclara que su lista de factores no es exhaustiva y solo complementa los factores habituales de cada Sujeto Supervisado; además advierte que los métodos de LD por corrupción cambian y con ellos sus indicadores. No sustituye ni prevalece sobre la matriz propia de la entidad. Fundamento: Apdo. III, preámbulo.", "ref": "Apdo. III, preámbulo"}, {"id": "C006", "tema": "gen", "tipo": "caso", "q": "Caja Popular Huizache opera en una región fronteriza y ha detectado un patrón de operación local, ligado a PEP nacionales de la zona, que no aparece en la lista de la Guía. ¿Qué dice la Guía sobre considerarlo?", "a": "Puede haber otros factores igual de importantes, propios de la zona geográfica donde opere la PEP nacional o Persona Vulnerable", "o": ["Puede haber otros factores igual de importantes, propios de la zona geográfica donde opere la PEP nacional o Persona Vulnerable", "Sólo puede considerarse si lo documenta antes algún organismo internacional en la materia, como el GAFI o el Grupo Egmont", "Sólo pueden usarse los factores enumerados en el Apartado III, porque la Guía los fija de manera limitativa para todo el país", "Sólo puede considerarse si la UIF lo publica antes como tipología o la Secretaría lo da a conocer como Dato a los Sujetos Supervisados"], "x": "El preámbulo del III reconoce que puede haber otros factores que deberían considerarse igualmente importantes, propios de la zona geográfica donde opere la PEP nacional o Persona Vulnerable. La lista es abierta y complementaria, así que no exige publicación previa de la UIF ni respaldo de un organismo internacional. Fundamento: Apdo. III, preámbulo.", "ref": "Apdo. III, preámbulo"}, {"id": "C007", "tema": "gen", "tipo": "memoria", "q": "Según el propio III.4, ¿de dónde provienen sus factores?", "a": "De Fuentes Abiertas relacionadas con varios casos recientes de corrupción en México", "o": ["De Fuentes Abiertas relacionadas con varios casos recientes de corrupción en México", "De documentos elaborados por organismos internacionales en la materia, como el GAFI", "De las tipologías que la UIF publica periódicamente sobre lavado de dinero y corrupción", "De las observaciones que la CNBV formuló en sus visitas de inspección a Sujetos Supervisados"], "x": "El III.4 dice que sus factores derivan de información encontrada en Fuentes Abiertas relacionada con varios casos recientes de corrupción en México. El preámbulo del Apartado III atribuye a organismos internacionales el compendio en general, pero el III.4 es el único que precisa su propio origen. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4"}, {"id": "C008", "tema": "gen", "tipo": "caso", "q": "El modelo de Grado de Riesgo de Banco Alcázar asigna en automático «alto Riesgo» a todo Cliente que sea PEP nacional, sin considerar nada más. ¿Cómo se valora ese criterio a la luz del Apartado II de la Guía?", "a": "No se ajusta: la PEP nacional se clasifica por sus características inherentes y transaccionales, no per se", "o": ["Se ajusta: la Guía ordena clasificar a toda PEP nacional como de alto Riesgo, por la amenaza que señala la ENR", "No se ajusta: la Guía ordena clasificar a toda PEP nacional en Riesgo medio hasta que se analicen sus operaciones", "Se ajusta mientras la PEP siga en funciones; al dejar el cargo la Guía ordena reclasificarla como de bajo Riesgo", "No se ajusta: la PEP nacional se clasifica por sus características inherentes y transaccionales, no per se"], "x": "El Apartado II pide tomar en cuenta las características inherentes y transaccionales de la PEP nacional de manera individual, de modo que no sea clasificada per se como de alto ni de bajo Riesgo. Que la ENR considere la corrupción una amenaza importante no vuelve automático el alto Riesgo. Fundamento: Apdo. II.", "ref": "Apdo. II"}, {"id": "C009", "tema": "gen", "tipo": "caso", "q": "Banco Alcázar inicia relación comercial con un ministro en funciones de otro país. ¿En qué Grado de Riesgo debe clasificarlo y qué norma lo establece?", "a": "Grado de Riesgo alto, al estar entre los Clientes que la DCG Bancos, 28ª, considera al menos de alto riesgo", "o": ["Grado de Riesgo alto, por disposición del Apartado II de la Guía Anticorrupción", "Grado de Riesgo alto, al estar entre los Clientes que la DCG Bancos, 28ª, considera al menos de alto riesgo", "Una evaluación individual sin presumir alto ni bajo Riesgo, igual que a una PEP nacional, según la Guía", "Grado de Riesgo medio, mientras no se analice su perfil transaccional, conforme a la Definición XIII de la Guía"], "x": "La 28ª de las DCG Bancos incluye a las Personas Políticamente Expuestas extranjeras entre los Clientes que, al menos, se consideran de Grado de Riesgo alto. La Guía no lo dice: su regla del «no per se» es para PEP nacionales y Personas Vulnerables. Fundamento: DCG Bancos, 28ª.", "ref": "DCG Bancos, 28ª"}, {"id": "C010", "tema": "gen", "tipo": "caso", "q": "Al analizar una posible Operación Inusual de la senadora Lucía, Cliente PEP nacional de Banco Alcázar, se identifica que Rodrigo, otro Cliente del banco que no es PEP, recibe de ella transferencias recurrentes. ¿Qué figura de la Guía describe a Rodrigo?", "a": "Persona Vulnerable", "o": ["Cliente de bajo Riesgo per se", "PEP nacional por asociación", "Persona Vulnerable", "PEP extranjera"], "x": "La Definición XIV llama Personas Vulnerables a los Clientes o Usuarios que no son PEP, pero que pueden representar un Riesgo de LD relacionado con la corrupción por los vínculos financieros identificados en una posible Operación Inusual con un Cliente PEP nacional. La Guía no crea una «PEP por asociación»; quien no es PEP y tiene ese vínculo es Persona Vulnerable. Fundamento: Def. XIV.", "ref": "Def. XIV"}, {"id": "C011", "tema": "gen", "tipo": "memoria", "q": "Según la Definición XIV, ¿qué caracteriza a una Persona Vulnerable?", "a": "No es PEP, pero puede representar Riesgo de LD por sus vínculos financieros con un Cliente PEP nacional en una posible Operación Inusual", "o": ["Es una PEP nacional que dejó el cargo hace menos de un año y que todavía conserva vínculos políticos con la dependencia en la que laboró", "Es familiar en primer grado de una PEP nacional o extranjera, aunque no tenga ninguna operación ni vínculo financiero alguno con ella", "Es un Cliente en situación económica precaria que, precisamente por esa razón, puede ser utilizado como prestanombres por una PEP nacional", "No es PEP, pero puede representar Riesgo de LD por sus vínculos financieros con un Cliente PEP nacional en una posible Operación Inusual"], "x": "La Definición XIV describe a Clientes o Usuarios que no son clasificados como PEP, pero que pueden representar un Riesgo de LD relacionado con la corrupción por los vínculos financieros identificados en una posible Operación Inusual con un Cliente o Usuario PEP nacional. El criterio es el vínculo financiero, no el parentesco ni la situación económica. Fundamento: Def. XIV.", "ref": "Def. XIV"}, {"id": "C012", "tema": "gen", "tipo": "caso", "q": "Casa de Bolsa Ébano recibe como Cliente a un exgobernador que dejó el cargo hace varios años. ¿Encaja en la definición de PEP de la Guía?", "a": "Sí: la definición incluye a quien desempeña o ha desempeñado funciones públicas destacadas", "o": ["Sólo si la Secretaría lo incluye en los Datos que da a conocer a los Sujetos Supervisados sobre las PEP", "Sí: la definición incluye a quien desempeña o ha desempeñado funciones públicas destacadas", "No: la definición sólo comprende a quien ejerce funciones públicas destacadas al momento de la operación", "No: la definición sólo comprende a jefes de estado o de gobierno, y no a los titulares de gobiernos estatales"], "x": "La Definición XIII considera PEP a quien desempeña o ha desempeñado funciones públicas destacadas, en el extranjero o en territorio nacional, y su lista de ejemplos es abierta («entre otros»). Los Datos de la Secretaría ayudan a identificarlas en lo individual, pero no son condición para que alguien sea PEP. Fundamento: Def. XIII. Ojo: la respuesta vale sólo para la definición de la Guía. Las DCG (2ª, fr. XXXI) sólo siguen considerando PEP nacional a quien dejó el encargo durante el año siguiente a aquel en que lo dejó. Un exgobernador que salió hace varios años ya no se catalogaría como PEP nacional conforme a las DCG.", "ref": "Def. XIII"}, {"id": "C013", "tema": "gen", "tipo": "caso", "q": "Casa de Bolsa Ébano decide adoptar medidas de mitigación adicionales para sus Clientes PEP nacionales y Personas Vulnerables, como pedir la declaración patrimonial más reciente. Según el Apartado II, ¿dónde debe quedar documentada esa decisión?", "a": "En su Manual de Cumplimiento, como lo indica el Apartado II", "o": ["En el informe anual del área de auditoría interna", "En su Manual de Cumplimiento, como lo indica el Apartado II", "En el expediente de identificación de cada Cliente PEP", "En un aviso dirigido a la CNBV antes de aplicarlas"], "x": "El Apartado II dice que la decisión de adoptar medidas de mitigación adicionales para PEP nacionales o Personas Vulnerables debe estar documentada en el Manual de Cumplimiento. La Guía no prevé avisos previos a la CNBV para ello. Fundamento: Apdo. II.", "ref": "Apdo. II"}, {"id": "C014", "tema": "gen", "tipo": "memoria", "q": "Según el Apartado II, ¿en qué tipo de corrupción debe centrarse el enfoque de identificación y gestión de Riesgos de las PEP nacionales y Personas Vulnerables?", "a": "En la «corrupción a gran escala», con delitos como el cohecho, el peculado y el enriquecimiento ilícito", "o": ["En la corrupción política, entendida sólo como delitos electorales cometidos durante las campañas", "En los actos de corrupción menores que cometen servidores públicos de bajo y mediano rango en trámites cotidianos", "En la «corrupción a gran escala», con delitos como el cohecho, el peculado y el enriquecimiento ilícito", "En los delitos fiscales que cometen las personas morales que son proveedoras del Estado o de los municipios"], "x": "El Apartado II pide centrar el enfoque en la «corrupción a gran escala» y menciona como algunos de sus delitos el cohecho, el tráfico de influencia, el peculado, el enriquecimiento ilícito y el financiamiento ilícito. Los actos menores de servidores de bajo rango no son el foco que fija la Guía. Fundamento: Apdo. II.", "ref": "Apdo. II"}, {"id": "C015", "tema": "ocu", "tipo": "caso", "q": "El senador Tomás invierte en Casa de Bolsa Ébano a través de Inversiones Cedro, S.A., cuyas acciones pertenecen a otra sociedad, que a su vez es propiedad de un fideicomiso extranjero, y éste de una cuarta sociedad. No entrega ninguna opinión profesional que explique el fundamento legal o económico de la estructura. ¿Qué grupo de factores se actualiza?", "a": "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Una estructura de varios niveles, con vehículos en el extranjero y sin opinión profesional que la justifique, sirve para que el nombre de la PEP no aparezca: es el primer factor del III.1. No es III.4, porque no hay recursos públicos ni una red de fachadas con dueños, notarios o domicilios coincidentes. Fundamento: Apdo. III.1, factor de vehículos corporativos.", "ref": "Apdo. III.1"}, {"id": "C016", "tema": "ocu", "tipo": "caso", "q": "Un abogado litigante abre a su nombre, como persona física, una cuenta de inversión en Banco Alcázar y la opera con recursos de un secretario de Estado, aunque nunca había administrado patrimonio de clientes. Todo indica que se usa para que el nombre del secretario no aparezca. ¿Qué factor se actualiza?", "a": "Uso de intermediarios que no concuerda con las prácticas comerciales normales", "o": ["Numerosas empresas fachada en las que coinciden dueños, notarios, domicilios y empleados", "Uso de vehículos corporativos sin una justificación comercial válida", "Uso de intermediarios que no concuerda con las prácticas comerciales normales", "Uso de familiares, asociados cercanos o empleados como Propietarios Reales"], "x": "El III.1 señala el uso de intermediarios cuando no concuerda con las prácticas comerciales normales o parece usarse para proteger la identidad de la PEP; con frecuencia son profesionales de servicios financieros y legales («gatekeepers»). No es un vehículo corporativo creado para la PEP ni un familiar como Propietario Real: es un tercero profesional interpuesto. Fundamento: Apdo. III.1, factor de intermediarios.", "ref": "Apdo. III.1"}, {"id": "C017", "tema": "ocu", "tipo": "cifra", "q": "En el III.1, ¿qué número de niveles de estructuración corporativa, sin una opinión profesional que justifique un fundamento legal o económico subyacente, vuelve particularmente relevante un esquema?", "a": "Más de tres niveles", "o": ["Tres o más niveles", "Más de cinco niveles", "Más de tres niveles", "Más de dos niveles"], "x": "El III.1 habla de esquemas con más de tres niveles de estructuración corporativa que no pueden proporcionar una opinión profesional que justifique un fundamento legal o económico subyacente. «Tres o más» no es lo mismo: tres niveles todavía no rebasan el umbral del texto. Fundamento: Apdo. III.1, factor de vehículos corporativos.", "ref": "Apdo. III.1"}, {"id": "C018", "tema": "ocu", "tipo": "caso", "q": "En una cuenta de Banco Alcázar que recibe depósitos cuantiosos, el chofer de una magistrada figura como Propietario Real, aunque quien da las instrucciones sobre los recursos es la propia magistrada. ¿Qué grupo de factores se actualiza?", "a": "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "Poner a un empleado como Propietario Real para que no aparezca la PEP es un factor del III.1: uso de miembros de la familia, asociados cercanos o empleados como Propietarios Reales. No es III.2, porque el detalle decisivo no es una conducta de la PEP ante el banco sino quién aparece en su lugar. Fundamento: Apdo. III.1.", "ref": "Apdo. III.1"}, {"id": "C019", "tema": "ocu", "tipo": "memoria", "q": "¿En qué grupo de factores menciona la Guía a los profesionales especializados en servicios financieros y legales conocidos como «gatekeepers»?", "a": "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Los «gatekeepers» aparecen en el III.1 como ejemplo de intermediarios que pueden usarse para proteger la identidad de la PEP. El III.4 menciona notarios y comisarios, pero como coincidencias dentro de la red de empresas fachada, no como «gatekeepers». Fundamento: Apdo. III.1, factor de intermediarios.", "ref": "Apdo. III.1"}, {"id": "C020", "tema": "ocu", "tipo": "memoria", "q": "En el III.1, los mandatos sin representación se mencionan, junto con las personas morales y los Fideicomisos, como ejemplo de:", "a": "Vehículos corporativos", "o": ["Empresas fachada de la red", "Propietarios Reales interpuestos", "Vehículos corporativos", "Intermediarios o «gatekeepers»"], "x": "El III.1 define los vehículos corporativos como personas morales, mandatos sin representación y Fideicomisos, cuyo uso sin justificación comercial válida es indicativo de ocultamiento. Los «gatekeepers» son otro factor del mismo apartado: profesionales que actúan como intermediarios. Fundamento: Apdo. III.1, factor de vehículos corporativos.", "ref": "A
