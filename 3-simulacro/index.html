ente en un instrumento distinto de ese manual.", "En un anexo del informe anual de auditoría en materia de prevención de LD/FT que la entidad remite a la Comisión cada ejercicio.", "En el acta de la sesión del comité de riesgos en la que se hubiere aprobado el modelo de evaluación de Riesgos de sus Clientes."], "x": "La norma es deliberadamente flexible: el diseño debe estar establecido en el Manual de Cumplimiento o en otro documento o manual de la entidad. El distractor más tentador es el que exige el Manual de manera exclusiva, porque suena más estricto y por tanto más seguro; pero la disposición usa la disyuntiva «o bien», y la Guía lo confirma al señalar que el diseño podrá estar contenido en un documento diferente al Manual. Fundamento: 21ª-1, segundo párrafo, y Guía CNBV, apartado E.", "ref": "21ª-1, 2º párr. · Tema 3.3.1"}, {"id": "M002", "tema": "metriesgo", "tipo": "memoria", "q": "¿Qué procesos debe establecer y describir el diseño de la metodología de evaluación de Riesgos?", "a": "Los de identificación, medición y mitigación de los Riesgos.", "o": ["Los de identificación, clasificación y calificación por Grado de Riesgo de cada uno de sus Clientes.", "Los de identificación, medición y mitigación de los Riesgos.", "Los de identificación, medición y monitoreo permanente de los Riesgos que se hubieren detectado.", "Los de diseño, implementación y valoración de la metodología de evaluación de Riesgos de la entidad."], "x": "El diseño debe establecer y describir todos los procesos de identificación, medición y mitigación. El distractor más tentador es el que lista diseño, implementación y valoración: eso es cierto, pero son las tres fases del desarrollo de la metodología, no los procesos que el diseño debe describir. Fundamento: 21ª-1, segundo párrafo, y Guía CNBV, apartado C, fase I.", "ref": "21ª-1, 2º párr. · Tema 3.3.1"}, {"id": "M003", "tema": "metriesgo", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones NO corresponde a la estructura de la metodología de evaluación de Riesgos?", "a": "La valoración es el tercer proceso que integra la fase de diseño de la metodología de evaluación.", "o": ["El diseño, la implementación y la valoración son las tres fases del desarrollo de la metodología.", "La identificación, la medición y la mitigación son los tres procesos que comprende la fase de diseño.", "La valoración es el tercer proceso que integra la fase de diseño de la metodología de evaluación.", "La evaluación final que se realiza al concluir la implementación constituye el inicio de la fase de valoración."], "x": "Fases y procesos no son sinónimos: las fases son tres y van por fuera (diseño, implementación y valoración); los procesos son tres y viven dentro de la primera fase (identificación, medición y mitigación). La opción incorrecta es la que mete la valoración dentro del diseño: resulta tentadora porque el número tres se repite en ambos niveles, pero el tercer proceso del diseño son los mitigantes, y la valoración es la tercera fase, nunca un proceso del diseño. Fundamento: Guía CNBV, apartado C, fases I a III.", "ref": "Guía CNBV, apartado C · Tema 3.3.1"}, {"id": "M004", "tema": "metriesgo", "tipo": "caso", "q": "Financiera Altamar propone identificar sus indicadores considerando sólo los tres productos que concentran el mayor volumen de operación. ¿Qué exige la norma en el proceso de identificación?", "a": "Considerar el total de los productos, servicios, tipos de Clientes y Usuarios, países o áreas geográficas, transacciones y canales con los que opera.", "o": ["Considerar la muestra representativa de productos y canales que apruebe el área de auditoría interna al inicio de cada ejercicio social de la entidad.", "Considerar únicamente los productos y servicios que durante el último ejercicio hubieren concentrado el mayor número de operaciones inusuales reportadas.", "Considerar sólo aquellos productos, servicios y canales que la entidad hubiere clasificado previamente con Grado de Riesgo alto conforme a su modelo de Clientes.", "Considerar el total de los productos, servicios, tipos de Clientes y Usuarios, países o áreas geográficas, transacciones y canales con los que opera."], "x": "La identificación es exhaustiva: debe considerarse el total de productos, servicios, tipos de Clientes y Usuarios, países o áreas geográficas, transacciones y canales. El distractor más tentador es el de la muestra representativa, porque suena a buena práctica de auditoría; pero la norma no admite muestreo en este proceso, sino universo completo. Fundamento: 21ª-2, fr. I, último párrafo.", "ref": "21ª-2, fr. I · Tema 3.3.1"}, {"id": "M005", "tema": "metriesgo", "tipo": "memoria", "q": "Conforme a las definiciones de la Guía CNBV, ¿qué son los Elementos de Riesgo?", "a": "Los factores genéricos que se observan en el desarrollo de la actividad del sujeto supervisado y que pudieran afectar en mayor o menor medida el Riesgo al que está expuesto.", "o": ["Los factores genéricos que se observan en el desarrollo de la actividad del sujeto supervisado y que pudieran afectar en mayor o menor medida el Riesgo al que está expuesto.", "Las características específicas de riesgo que permiten conocer y evaluar cómo y en qué medida se encuentra expuesto al Riesgo el sujeto supervisado para cada factor genérico identificado.", "El conjunto de circunstancias de tiempo, modo y lugar en las que el sujeto supervisado lleva a cabo sus operaciones y que resultan determinantes para el diseño de la metodología.", "Los controles, políticas, criterios, medidas y procedimientos internos que el sujeto supervisado tiene implementados para administrar y disminuir su exposición al Riesgo."], "x": "Los Elementos de Riesgo son los factores genéricos; los Indicadores son las características específicas dentro de cada elemento. El distractor que define al Indicador en vez de al Elemento de Riesgo es el más tentador porque describe con precisión a los Indicadores, que viven dentro de los elementos: es el nivel de detalle inmediatamente inferior. Fundamento: Guía CNBV, apartado A, fracciones IV y VI.", "ref": "Guía CNBV, apartado A, fr. IV · Tema 3.3.1"}, {"id": "M006", "tema": "metriesgo", "tipo": "trampa", "q": "En el diseño de su metodología, Banco del Sauce ubicó el domicilio del Cliente como indicador del elemento «países y áreas geográficas». ¿Cuál afirmación es correcta?", "a": "Es incorrecto: la Guía enumera el domicilio entre los indicadores del elemento de Clientes y Usuarios.", "o": ["Es incorrecto: el domicilio del Cliente sólo puede considerarse como un mitigante dentro del tercer proceso de la fase de diseño de la metodología.", "Es incorrecto: la Guía enumera el domicilio entre los indicadores del elemento de Clientes y Usuarios.", "Es correcto, porque cualquier dato que aluda a una ubicación geográfica pertenece por definición al elemento de países y áreas geográficas.", "Es indistinto, porque la Guía permite que cada sujeto supervisado ubique libremente cualquier indicador en el elemento de riesgo que prefiera."], "x": "El domicilio es una característica del Cliente y la Guía lo lista expresamente entre los indicadores del elemento de Clientes y Usuarios, junto con el tipo de persona, la edad o fecha de constitución, la nacionalidad y la actividad económica. La opción más tentadora es la que da por buena la ubicación porque el domicilio suena geográfico; pero el elemento de países y áreas geográficas se refiere a dónde ocurren las Operaciones de la entidad, no a dónde vive el Cliente. Fundamento: Guía CNBV, apartado C, fase I, proceso 1, tabla de indicadores.", "ref": "Guía CNBV, C, fase I, proceso 1 · Tema 3.3.1"}, {"id": "M007", "tema": "metriesgo", "tipo": "cifra", "q": "¿Cuántos elementos de Riesgo, como mínimo, debe considerar la entidad al identificar los elementos e indicadores de su metodología?", "a": "Cuatro: productos y servicios; Clientes y Usuarios; países y áreas geográficas; transacciones y canales.", "o": ["Seis: los cuatro elementos mínimos más las estructuras internas y los programas de capacitación y difusión que imparta la entidad.", "Tres: productos y servicios; Clientes y Usuarios; y transacciones y canales de envío o distribución vinculados con sus Operaciones.", "Cuatro: productos y servicios; Clientes y Usuarios; países y áreas geográficas; transacciones y canales.", "Cinco: productos y servicios; Clientes y Usuarios; países y áreas geográficas; transacciones y canales; e Infraestructura Tecnológica."], "x": "La disposición exige considerar al menos cuatro elementos. El distractor de cinco es el más tentador porque la Infraestructura Tecnológica sí es un elemento adicional, pero únicamente para las instituciones de tecnología financiera conforme a sus propias Disposiciones; en Bancos no aparece. Además, el «al menos» permite a la entidad definir más, nunca menos. Fundamento: 21ª-2, fr. I, incisos a) a d).", "ref": "21ª-2, fr. I · Tema 3.3.1"}, {"id": "M008", "tema": "metriesgo", "tipo": "memoria", "q": "Según la Guía CNBV, ¿de qué carácter podrán ser los Indicadores que identifique la entidad?", "a": "Podrán ser de carácter cualitativo o cuantitativo y deberán reflejar los atributos que la entidad considere propios de sus Elementos de Riesgo.", "o": ["Podrán ser cualitativos o cuantitativos, pero deberán ser idénticos a los que utilicen las demás entidades del sector conforme a la evaluación nacional de riesgos.", "Deberán ser exclusivamente cuantitativos, de modo que cada uno pueda expresarse como un porcentaje del monto total operado durante el periodo evaluado.", "Deberán ser exclusivamente cualitativos, pues la cuantificación corresponde únicamente al proceso de medición y no al de identificación de los Indicadores.", "Podrán ser de carácter cualitativo o cuantitativo y deberán reflejar los atributos que la entidad considere propios de sus Elementos de Riesgo."], "x": "La Guía admite indicadores cualitativos y cuantitativos, y exige que reflejen los atributos propios de los elementos de Riesgo de esa entidad en particular. El distractor que exige homologar los indicadores entre entidades del mismo sector es el más tentador porque acierta en la primera mitad —admite indicadores cualitativos y cuantitativos— pero falla en la segunda: los indicadores varían de un sujeto supervisado a otro según su Contexto, no se homologan por sector. Fundamento: Guía CNBV, apartado C, fase I, proceso 1.", "ref": "Guía CNBV, C, fase I, proceso 1 · Tema 3.3.1"}, {"id": "M009", "tema": "metriesgo", "tipo": "caso", "q": "Casa de Bolsa Meridiano incluyó indicadores específicos del delito de operaciones con recursos de procedencia ilícita sólo en el elemento de Clientes y Usuarios, y ninguno de financiamiento al terrorismo. ¿Qué observación procede?", "a": "Debe incluir indicadores específicos del artículo 400 Bis y del 139 Quáter del Código Penal Federal para cada uno de los elementos de Riesgo.", "o": ["Debe incluir indicadores específicos del artículo 400 Bis y del 139 Quáter del Código Penal Federal para cada uno de los elementos de Riesgo.", "Basta con incluir indicadores del artículo 400 Bis, ya que los de financiamiento al terrorismo sólo se exigen a las entidades que operen con países de mayor Riesgo.", "Es correcto, porque la norma permite concentrar los indicadores de ambos delitos en el elemento de Clientes y Usuarios cuando ahí se ubica la mayor exposición.", "Debe incluir indicadores de ambos delitos, pero únicamente en el elemento de transacciones y canales de envío o distribución vinculados con sus Operaciones."], "x": "La reforma de 2024 exige indicadores específicos de los dos delitos —400 Bis para lavado y 139 Quáter para financiamiento al terrorismo— y los exige para cada uno de los elementos de Riesgo, no para uno solo. El distractor que limita los indicadores de ambos delitos al elemento de transacciones y canales es el más tentador porque acierta en los dos delitos, pero se equivoca en el alcance: no es un elemento, son todos. Fundamento: 21ª-2, último párrafo, adicionado por DOF 28-08-2024.", "ref": "21ª-2, último párr. · Tema 3.3.1"}, {"id": "M010", "tema": "metriesgo", "tipo": "caso", "q": "El área de cumplimiento de Unión de Crédito Los Fresnos pregunta qué tan detallados deben ser sus elementos e indicadores. ¿Qué responde la Guía CNBV?", "a": "Que la granularidad depende de cada sujeto supervisado, de acuerdo con sus propias necesidades y el Contexto en el que se desenvuelve.", "o": ["Que la granularidad depende del número de Clientes clasificados con Grado de Riesgo alto que la entidad hubiere registrado durante los doce meses previos.", "Que la granularidad depende de cada sujeto supervisado, de acuerdo con sus propias necesidades y el Contexto en el que se desenvuelve.", "Que la granularidad depende del tamaño de la entidad, medido por su nivel de capitalización y por el monto total operado en el ejercicio inmediato anterior.", "Que la granularidad la fija una escala uniforme que la Comisión publica anualmente por medios electrónicos para cada sector de sujetos supervisados."], "x": "La Guía deja la granularidad en manos de cada entidad, en función de sus necesidades y de su Contexto. El distractor del tamaño de la entidad es el más tentador porque se parece al principio de proporcionalidad; pero la Guía asocia la proporcionalidad al nivel y complejidad del análisis, y la granularidad al Contexto, no a un indicador financiero. Fundamento: Guía CNBV, apartado C, fase I, proceso 1.", "ref": "Guía CNBV, C, fase I, proceso 1 · Tema 3.3.1"}, {"id": "M011", "tema": "metriesgo", "tipo": "caso", "q": "Banco Cendal cuantificó el Riesgo de cada indicador y el de cada elemento, pero no obtuvo una calificación del Riesgo de la institución en su conjunto. ¿Cómo se califica esa medición?", "a": "Es deficiente: la medición debe constar de al menos tres niveles de detalle y cuantificarse en los tres, no sólo en uno o algunos.", "o": ["Es correcta, porque el Riesgo de la entidad se obtiene automáticamente del promedio aritmético simple de las calificaciones de sus cuatro elementos de Riesgo.", "Es correcta, siempre que la entidad documente que la calificación institucional se sustituye por la clasificación de sus Clientes por Grado de Riesgo.", "Es deficiente: la medición debe constar de al menos tres niveles de detalle y cuantificarse en los tres, no sólo en uno o algunos.", "Es deficiente, porque la medición debe constar de al menos cinco niveles de detalle, incluidos los mitigantes y el riesgo residual por unidad de negocio."], "x": "La Guía exige un método exhaustivo con al menos tres niveles —indicadores, elementos de Riesgo y sujeto supervisado— y es explícita en que debe haber cuantificación en los tres, no sólo en uno o algunos. El distractor de los cinco niveles es el más tentador porque conserva la idea de niveles y agrega piezas reales de la metodología, pero inventa un número que la Guía no usa. Fundamento: Guía CNBV, apartado C, fase I, proceso 2.", "ref": "Guía CNBV, C, fase I, proceso 2 · Tema 3.3.1"}, {"id": "M012", "tema": "metriesgo", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre el método de medición NO es correcta?", "a": "Definir la escala o rango de calificación y asignar el peso o porcentaje son el mismo proceso, por lo que basta documentar uno de ellos.", "o": ["Se debe definir la escala o rango que se utilizará para dar una calificación o valoración de Riesgo a cada Indicador, a cada elemento y a la propia entidad.", "La asignación de pesos a los elementos de Riesgo debe hacerse de manera consistente en función de su importancia para describir el Riesgo de la entidad.", "Se debe asignar un peso o porcentaje a cada Indicador en función de su importancia para describir el Riesgo del elemento al que pertenece.", "Definir la escala o rango de calificación y asignar el peso o porcentaje son el mismo proceso, por lo que basta documentar uno de ellos."], "x": "La Guía destaca expresamente que definir la escala o rango es un proceso distinto e independiente de asignar el peso o porcentaje: la escala dice cuánto vale la calificación; el peso dice cuánto pesa esa pieza dentro del conjunto. La confusión es tentadora porque ambos se expresan con números y se documentan juntos, pero son dos decisiones separadas. Fundamento: Guía CNBV, apartado C, fase I, proceso 2, y 21ª-2, fr. II.", "ref": "Guía CNBV, C, fase I, proceso 2 · Tema 3.3.1"}, {"id": "M013", "tema": "metriesgo", "tipo": "trampa", "q": "Para medir o evaluar el Riesgo del sujeto supervisado, ¿qué combinación exige la Guía CNBV?", "a": "La probabilidad de ocurrencia de que se lleve a cabo una operación de LD/FT y el posible impacto medido en relación con la concentración del negocio.", "o": ["La probabilidad de ocurrencia de que se lleve a cabo una operación de LD/FT y el posible impacto medido en relación con la concentración del negocio.", "La probabilidad de ocurrencia de una operación de LD/FT y el impacto medido en términos financieros, esto es, por el quebranto patrimonial estimado para la entidad.", "La frecuencia de las operaciones inusuales reportadas y el impacto medido por el porcentaje de Clientes clasificados con Grado de Riesgo alto en el periodo evaluado.", "La frecuencia con que se hayan presentado eventos de LD/FT en la entidad durante los últimos doce meses y el monto de las multas impuestas por la Comisión."], "x": "La Guía es literal en los dos paréntesis: probabilidad de ocurrencia «mas no la frecuencia de eventos», e impacto medido por concentración del negocio «y no en términos financieros o de montos de posibles multas». El distractor que mide el impacto en términos financieros o de montos es el más tentador porque acierta en la probabilidad y sólo falla en el impacto, que es justamente donde está la trampa. Fundamento: Guía CNBV, apartado C, fase I, proceso 2.", "ref": "Guía CNBV, C, fase I, proceso 2 · Tema 3.3.1"}, {"id": "M014", "tema": "metriesgo", "tipo": "memoria", "q": "¿Con qué puede medirse la concentración del negocio a la que se refiere la Guía CNBV al hablar del impacto?", "a": "Con el porcentaje de número de Clientes y Usuarios o contratos, el porcentaje de número de Operaciones y el porcentaje de monto operado.", "o": ["Con el monto de las sanciones económicas que la entidad hubiere pagado por incumplimientos en materia de prevención de lavado de dinero y financiamiento al terrorismo.", "Con el porcentaje de número de Clientes y Usuarios o contratos, el porcentaje de número de Operaciones y el porcentaje de monto operado.", "Con el número de reportes de operaciones inusuales y preocupantes presentados a la Secretaría por conducto de la Comisión durante los últimos doce meses.", "Con el porcentaje del capital contable de la entidad comprometido en los productos y servicios calificados con Riesgo alto durante el ejercicio evaluado."], "x": "La nota al pie de la Guía define la concentración del negocio con tres medidas: porcentaje de número de Clientes o contratos, porcentaje de número de Operaciones y porcentaje de monto operado. La opción de las sanciones es la más tentadora porque suena a impacto real, pero la Guía excluye expresamente los montos de posibles multas del concepto de impacto. Fundamento: Guía CNBV, apartado C, fase I, proceso 2, nota 1.", "ref": "Guía CNBV, C, fase I, proceso 2 · Tema 3.3.1"}, {"id": "M015", "tema": "metriesgo", "tipo": "cifra", "q": "¿Cuáles son ejemplos de escala o rango de Riesgo que la propia Guía CNBV menciona?", "a": "Alto, medio y bajo; valores del 0 al 100; y 1, 2, 3, 4 y 5.", "o": ["Valores del 0 al 100 y porcentajes, ya que la escala y el peso se expresan siempre en la misma unidad de medida dentro del método seleccionado.", "Únicamente la escala de cinco niveles numerados del 1 al 5, que es la que la Comisión exige para homologar los resultados entre entidades del mismo sector.", "Alto, medio y bajo; valores del 0 al 100; y 1, 2, 3, 4 y 5.", "Alto, medio y bajo; valores del 0 al 10; y porcentajes del 0 % al 100 % asignados a cada uno de los cuatro elementos de Riesgo que se hubieren definido."], "x": "La Guía da tres ejemplos de escala —alto/medio/bajo, valores del 0 al 100, y 1 a 5— y aclara que los pesos, en cambio, se expresan en porcentajes. El distractor que mezcla alto/medio/bajo y valores del 0 al 10 con porcentajes asignados a los elementos es el más tentador porque mezcla una escala verdadera con porcentajes, que pertenecen al terreno del peso y no de la escala. Fundamento: Guía CNBV, apartado C, fase I, proceso 2.", "ref": "Guía CNBV, C, fase I, proceso 2 · Tema 3.3.1"}, {"id": "M016", "tema": "metriesgo", "tipo": "caso", "q": "El área de sistemas de Banco Nortia eligió por su cuenta el método de medición de Riesgos y lo aplicó sin consultar a nadie más. ¿Qué señala la Guía CNBV sobre la elección del método?", "a": "Exige la participación de la alta dirección o gerencia, del área de cumplimiento y de las estructuras internas de las unidades de negocio.", "o": ["Permite que cualquier área elija el método, siempre que el resultado se informe al consejo de administración dentro de los treinta días naturales siguientes.", "Exige que el método sea elegido exclusivamente por el comité de riesgos de la entidad, con la opinión previa del auditor externo que dictamine el ejercicio.", "Exige que el método sea el que la Comisión dé a conocer por medios electrónicos, a fin de que los resultados de todas las entidades del sector resulten comparables.", "Exige la participación de la alta dirección o gerencia, del área de cumplimiento y de las estructuras internas de las unidades de negocio."], "x": "La elección y adecuación del método exige la participación de la alta dirección o gerencia, del área de cumplimiento y de las estructuras internas de las unidades de negocio operativas y funcionales, además de cualquier otra que se considere conveniente. El distractor del comité de riesgos es el más tentador porque ese órgano sí interviene, pero en el circuito del modelo de Clientes del Anexo 3, no en la elección del método de la metodología institucional. Fundamento: Guía CNBV, apartado C, fase I, proceso 2.", "ref": "Guía CNBV, C, fase I, proceso 2 · Tema 3.3.1"}, {"id": "M017", "tema": "metriesgo", "tipo": "memoria", "q": "¿Qué características debe reunir el método seleccionado para la medición de los Riesgos?", "a": "Debe ser flexible, para permitir ajustes cuando la operación lo requiera, y proporcional a la naturaleza y alcance de la operación.", "o": ["Debe ser flexible, para permitir ajustes cuando la operación lo requiera, y proporcional a la naturaleza y alcance de la operación.", "Debe ser aprobado previamente por la Comisión antes de su primera aplicación y revalidado cada vez que se actualice la evaluación nacional de riesgos.", "Debe ser rígido e invariable durante al menos cinco años, para que los resultados de cada implementación sean comparables entre ejercicios sucesivos.", "Debe ser idéntico al que utilicen las demás entidades financieras que integren el grupo financiero al que, en su caso, pertenezca la entidad de que se trate."], "x": "La Guía pide un método flexible, que admita ajustes cuando la operación lo requiera, y con un nivel y complejidad de análisis proporcional a la naturaleza y alcance de la operación. El distractor de la aprobación previa de la Comisión es el más tentador porque existe una facultad real de la Comisión, pero es de revisión posterior y eventual, no de autorización previa. Fundamento: Guía CNBV, apartado C, fase I, proceso 2.", "ref": "Guía CNBV, C, fase I, proceso 2 · Tema 3.3.1"}, {"id": "M018", "tema": "metriesgo", "tipo": "caso", "q": "Financiera Quetzal Azul incluyó en su metodología sólo los tres controles automatizados que considera más eficaces y dejó fuera el resto de sus políticas y procedimientos. ¿Qué exige el proceso de mitigantes?", "a": "Tomar en cuenta el 100 % de los mitigantes establecidos al momento del diseño, incluidas todas las políticas, criterios, medidas y procedimientos internos.", "o": ["Tomar en cuenta los mitigantes que la entidad implemente después de conocer los resultados de la implementación, pues antes de ese momento aún no producen efecto.", "Tomar en cuenta el 100 % de los mitigantes establecidos al momento del diseño, incluidas todas las políticas, criterios, medidas y procedimientos internos.", "Tomar en cuenta al menos la mitad de los mitigantes existentes, siempre que se justifique en el documento del diseño la razón por la que se excluyó a los demás.", "Tomar en cuenta únicamente los mitigantes automatizados, ya que los controles manuales no pueden acreditar efectividad ante la Comisión en una visita de inspección."], "x": "El proceso de mitigantes es exhaustivo: se toma en cuenta el 100 % de los mitigantes establecidos al momento del diseño, incluidas todas las políticas, criterios, medidas y procedimientos internos a que se refiere la 64ª y los de los demás manuales. El distractor que toma en cuenta los mitigantes implementados después de conocer los resultados es el más tentador porque confunde el momento: esos mitigantes pertenecen al ajuste posterior a la implementación, no al diseño. Fundamento: 21ª-2, fr. III, y Guía CNBV, apartado C, fase I, proceso 3.", "ref": "21ª-2, fr. III · Tema 3.3.1"}, {"id": "M019", "tema": "metriesgo", "tipo": "trampa", "q": "¿Qué efecto reconoce la Guía CNBV a los mitigantes sobre la exposición al Riesgo?", "a": "Contribuyen a administrar, controlar y disminuir la exposición al Riesgo, pero no a evitarla ni a anularla.", "o": ["Permiten eliminar por completo la exposición al Riesgo cuando se aplican de manera automatizada y con periodicidad diaria en todas las unidades de negocio.", "Permiten anular el Riesgo residual de la entidad, de modo que una entidad con mitigantes suficientes puede reportar una exposición final igual a cero.", "Contribuyen a administrar, controlar y disminuir la exposición al Riesgo, pero no a evitarla ni a anularla.", "Contribuyen a administrar y controlar la exposición al Riesgo, pero nunca pueden modificar la calificación asignada a un indicador o a un elemento de Riesgo."], "x": "La Guía usa un paréntesis que decide la respuesta: los mitigantes contribuyen a administrar, controlar y disminuir «(no evitar o anular)» la exposición al Riesgo. El distractor que niega que los mitigantes puedan modificar la calificación asignada es el más tentador porque empieza bien, pero se pasa al otro extremo: los mitigantes sí modifican la calificación, y de hecho el nivel sobre el que aplican debe definirse expresamente. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3 · Tema 3.3.1"}, {"id": "M020", "tema": "metriesgo", "tipo": "memoria", "q": "Para determinar el efecto de un mitigante sobre la calificación de Riesgos, ¿qué debe considerarse además de su existencia en el Manual de Cumplimiento?", "a": "La efectividad en su aplicación, tomando en cuenta factores como la periodicidad y el nivel de automatización.", "o": ["El costo anual de operación del control y su proporción respecto del presupuesto total asignado al área de cumplimiento en el ejercicio correspondiente.", "El número de operaciones inusuales que el control hubiere permitido detectar durante el periodo de doce meses considerado en la implementación.", "La antigüedad del control, medida desde la fecha en que se incorporó por primera vez al Manual de Cumplimiento de la entidad de que se trate.", "La efectividad en su aplicación, tomando en cuenta factores como la periodicidad y el nivel de automatización."], "x": "No basta con que el mitigante esté escrito: cuenta su efectiva aplicación, y la Guía nombra dos factores para medirla, la periodicidad y el nivel de automatización. El distractor que mide el mitigante por el número de operaciones inusuales detectadas es el más tentador porque parece una medida objetiva de efectividad, pero esos reportes son un resultado del monitoreo, no el criterio que la Guía fija para ponderar el efecto de un mitigante. Fundamento: 21ª-2, fr. III, y Guía CNBV, apartado C, fase I, proceso 3.", "ref": "21ª-2, fr. III · Tema 3.3.1"}, {"id": "M021", "tema": "metriesgo", "tipo": "caso", "q": "Banco Litoral aplicó a todos sus mitigantes el mismo efecto y siempre a nivel de la entidad completa. ¿Qué precisa la Guía CNBV?", "a": "Que no todos los mitigantes deben tener el mismo efecto y que este puede aplicarse a distintos niveles de detalle de la metodología.", "o": ["Que no todos los mitigantes deben tener el mismo efecto y que este puede aplicarse a distintos niveles de detalle de la metodología.", "Que el efecto de los mitigantes se aplica siempre a nivel de indicador, nunca a nivel de elemento de Riesgo ni a nivel de la entidad en su conjunto.", "Que el efecto de cada mitigante debe fijarse en un porcentaje idéntico al peso asignado al elemento de Riesgo sobre el que se pretenda aplicarlo.", "Que todos los mitigantes deben tener el mismo efecto, a fin de evitar que la entidad manipule la calificación final de su exposición al Riesgo."], "x": "La Guía obliga a definir, para cada mitigante, cuál es el nivel adecuado sobre el que aplica —indicador, elemento de Riesgo o sujeto supervisado— y aclara que no todos deben tener el mismo efecto. El distractor que fija el efecto de los mitigantes siempre a nivel de indicador es el más tentador porque el indicador es el nivel más fino y parece el más seguro, pero fija un nivel único donde la norma admite tres. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3 · Tema 3.3.1"}, {"id": "M022", "tema": "metriesgo", "tipo": "caso", "q": "En una revisión, se detecta que Banco del Sauce tiene documentado un control de monitoreo que en los hechos no se aplica. Conforme a la Guía CNBV, ¿qué efecto puede tener esa falta de aplicación sobre la medición?", "a": "Podrá, en algunos casos, aumentar el nivel de Riesgo de que se trate.", "o": ["Obligará a la entidad a suspender la implementación de la metodología hasta que el control deficiente quede debidamente corregido y documentado.", "Podrá, en algunos casos, aumentar el nivel de Riesgo de que se trate.", "No tendrá efecto alguno sobre la calificación, porque el mitigante ya fue considerado en el momento del diseño de la metodología de evaluación.", "Aumentará siempre y de manera automática el nivel de Riesgo del indicador, del elemento y de la entidad en su conjunto, sin admitir prueba en contrario."], "x": "La Guía usa un modal deliberadamente prudente: la falta de aplicación o las deficiencias en la implementación «podrá, en algunos casos, aumentar» el nivel de Riesgo. El distractor que vuelve automático el aumento del nivel de Riesgo es el más tentador porque parece la consecuencia lógica y severa, pero convierte en automático lo que la Guía plantea como eventual. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3 · Tema 3.3.1"}, {"id": "M023", "tema": "metriesgo", "tipo": "cifra", "q": "¿Cuáles son los mitigantes que la Guía CNBV enumera de manera enunciativa, mas no limitativa, con efecto a nivel del sujeto supervisado?", "a": "Gobierno corporativo, auditoría en materia de prevención de LD/FT, estructuras internas y capacitación.", "o": ["Gobierno corporativo, auditoría interna, comité de riesgos, sistemas automatizados y el programa de capacitación y difusión anual de la entidad.", "Estructuras internas, capacitación, política de conocimiento del Cliente y el modelo de evaluación de Riesgos de Clientes previsto en el Anexo 3.", "Gobierno corporativo, auditoría en materia de prevención de LD/FT, estructuras internas y capacitación.", "Auditoría en materia de prevención de LD/FT, capacitación, monitoreo de operaciones y las señales de alerta descriptiva y prospectiva de la entidad."], "x": "La Guía lista cuatro mitigantes con efecto a nivel de entidad: gobierno corporativo, auditoría en la materia, estructuras internas y capacitación; y advierte que la enumeración es enunciativa, mas no limitativa. El distractor que sustituye la auditoría en materia de PLD/FT por la auditoría interna genérica es el más tentador porque incluye piezas reales de la organización, pero cambia esa pieza y añade órganos que la Guía no lista en ese apartado. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3 · Tema 3.3.1"}, {"id": "M024", "tema": "metriesgo", "tipo": "caso", "q": "El auditor externo de Banco Tesalia entregó su informe anual en materia de prevención de LD/FT. Además de ser un mitigante en sí misma, ¿para qué puede servir esa auditoría conforme a la Guía CNBV?", "a": "Como insumo para definir la efectividad de los mitigantes con los que cuenta la entidad al momento de realizar la evaluación.", "o": ["Como base para clasificar a los Clientes de la entidad por su Grado de Riesgo durante los doce meses siguientes a la fecha del propio informe.", "Como sustituto del proceso de identificación de mitigantes, de modo que la entidad puede remitirse al informe sin describirlos en su metodología.", "Como documento que acredita ante la Comisión que la metodología de evaluación de Riesgos fue aprobada por el consejo de administración de la entidad.", "Como insumo para definir la efectividad de los mitigantes con los que cuenta la entidad al momento de realizar la evaluación."], "x": "La Guía dice que, además de ser mitigante, el resultado de la auditoría podría utilizarse como insumo para definir la efectividad de los mitigantes al momento de la evaluación. El distractor que convierte la auditoría en sustituto del proceso de identificación de mitigantes es el más tentador porque parte de una verdad —la auditoría revisa los controles—, pero la revisión externa nunca releva a la entidad de identificar y describir sus propios mitigantes en el diseño. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3 · Tema 3.3.1"}, {"id": "M025", "tema": "metriesgo", "tipo": "memoria", "q": "¿Qué exige la Guía CNBV respecto de la auditoría en materia de prevención de LD/FT considerada como mitigante?", "a": "Que sea una revisión independiente de la adecuada ejecución de las políticas, criterios, medidas y procedimientos, y que exista constancia documental de ella.", "o": ["Que sea una revisión independiente de la adecuada ejecución de las políticas, criterios, medidas y procedimientos, y que exista constancia documental de ella.", "Que verifique exclusivamente la existencia documental de los controles, sin evaluar su aplicación, pues la efectividad se mide en la fase de valoración de la metodología.", "Que la realice invariablemente un auditor externo independiente y que su resultado se presente a la Comisión dentro de los sesenta días naturales siguientes a su conclusión.", "Que se practique cuando menos dos veces al año por el área de auditoría interna y que sus hallazgos se incorporen al Manual de Cumplimiento antes de cerrar el ejercicio."], "x": "La Guía describe la auditoría como una revisión independiente de la adecuada ejecución de las políticas, criterios, medidas y procedimientos, y exige constancia documental de esa revisión; puede practicarla un auditor externo o el área de auditoría interna. El distractor que exige que la auditoría la realice invariablemente un auditor externo es el más tentador porque impone esa figura con exclusividad, cuando la Guía la menciona sólo como una posibilidad. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3 · Tema 3.3.1"}, {"id": "M026", "tema": "metriesgo", "tipo": "memoria", "q": "¿Qué comprende el mitigante denominado estructuras internas y cómo se distingue del gobierno corporativo?", "a": "Comprende el establecimiento del Comité y la designación del Oficial de Cumplimiento o Representante, y debe diferenciarse de la actividad genérica del gobierno corporativo.", "o": ["Comprende los sistemas automatizados y las bases de datos de la entidad, y se distingue del gobierno corporativo por su carácter exclusivamente tecnológico y operativo.", "Comprende el establecimiento del Comité y la designación del Oficial de Cumplimiento o Representante, y debe diferenciarse de la actividad genérica del gobierno corporativo.", "Comprende las áreas de negocio y de operaciones de la entidad, y forma parte del gobierno corporativo, por lo que ambos mitigantes se evalúan de manera conjunta e indivisible.", "Comprende al consejo de administración y a la dirección general, y sustituye al gobierno corporativo cuando la entidad cuenta con un Representante en lugar de Oficial de Cumplimiento."], "x": "Las estructuras internas son, en su caso, el Comité y el Oficial de Cumplimiento o Representante, incluida su capacitación y el cumplimiento de sus funciones; la Guía pide expresamente diferenciar su evaluación de la actividad genérica del gobierno corporativo. El distractor que funde las estructuras internas dentro del gobierno corporativo es el más tentador porque ambos mitigantes conviven en el mismo tejido organizacional, pero la Guía los separa justamente para que cada uno se evalúe por sí mismo. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3 · Tema 3.3.1"}, {"id": "M027", "tema": "metriesgo", "tipo": "cifra", "q": "Como mitigante, ¿con qué periodicidad mínima deben impartirse los programas de capacitación y difusión?", "a": "Al menos una vez al año.", "o": ["Al menos una vez cada doce meses contados a partir de la última implementación de la metodología de evaluación de Riesgos.", "Al menos una vez cada seis meses.", "Al menos una vez al año.", "Al menos una vez cada dos años."], "x": "La Guía fija la capacitación y difusión al menos una vez al año. El distractor que cuenta los doce meses a partir de la última implementación es el más tentador porque doce meses y un año coinciden en duración, pero le añade un punto de partida que la norma no establece para la capacitación: ese cómputo pertenece a otras obligaciones. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3 · Tema 3.3.1"}, {"id": "M028", "tema": "metriesgo", "tipo": "caso", "q": "Sofipo Caja Alondra imparte cada año el mismo curso general de PLD/FT a todo su personal, sin relación con los resultados de su metodología. ¿Qué observa la Guía CNBV?", "a": "Que los temas de la capacitación deben ser coherentes con los resultados de la implementación de la metodología y adecuarse a las responsabilidades de cada destinatario.", "o": ["Que la capacitación debe limitarse al contenido del Manual de Cumplimiento y no puede incorporar los resultados de la metodología, por tratarse de información reservada.", "Que la capacitación en materia de prevención de LD/FT deja de ser obligatoria cuando la entidad obtiene una calificación de Riesgo bajo en la implementación.", "Que la capacitación debe impartirse con contenido idéntico a todos los destinatarios, incluidos los miembros del consejo, para garantizar un mismo nivel de conocimiento.", "Que los temas de la capacitación deben ser coherentes con los resultados de la implementación de la metodología y adecuarse a las responsabilidades de cada destinatario."], "x": "La Guía pide dos cosas a la vez: que los temas sean coherentes con los resultados de la implementación y que se adecuen a las responsabilidades de consejeros, directivos, funcionarios y empleados. El distractor que exige un contenido idéntico para todos los destinatarios es el más tentador porque la uniformidad parece equitativa, pero la propia Guía admite que la alta dirección puede no requerir el mismo nivel de capacitación que el personal operativo. Fundamento: Guía CNBV, apartado C, fase I, proceso 3.", "ref": "Guía CNBV, C, fase I, proceso 3 · Tema 3.3.1"}, {"id": "M029", "tema": "metriesgo", "tipo": "caso", "q": "El área de cumplimiento de Banco Vega Marina propone construir sus indicadores usando exclusivamente el subconjunto de operaciones inusuales reportadas. ¿Qué establece la Guía CNBV sobre las fuentes de información internas?", "a": "Deben incluir la totalidad de productos, servicios, tipos de Clientes y Usuarios, países o áreas, transacciones y canales, y podrán considerar además ese subconjunto.", "o": ["Deben incluir la totalidad de productos, servicios, tipos de Clientes y Usuarios, países o áreas, transacciones y canales, y podrán considerar además ese subconjunto.", "Deben provenir exclusivamente de fuentes externas, como la evaluación nacional de riesgos y las listas emitidas por organismos internacionales en la materia.", "Deben limitarse al subconjunto de operaciones inusuales y preocupantes, ya que sólo esas Operaciones evidencian una exposición real de la entidad a los Riesgos de LD/FT.", "Deben incluir únicamente la información de los Clientes clasificados con Grado de Riesgo alto conforme al modelo de evaluación de Riesgos previsto en el Anexo 3."], "x": "Las fuentes internas deben abarcar el universo completo de la operación; las operaciones inusuales son un subconjunto que la entidad «podrá» considerar además, nunca en sustitución. El distractor que limita las fuentes internas al subconjunto de operaciones inusuales y preocupantes es el más tentador porque esas operaciones son el insumo más rico en señales de riesgo, pero acotarse a ellas dejaría fuera productos y canales nunca alertados. Fundamento: Guía CNBV, apartado C, fase I, proceso 1.", "ref": "Guía CNBV, C, fase I, proceso 1 · Tema 3.3.1"}, {"id": "M030", "tema": "metriesgo", "tipo": "memoria", "q": "¿Qué papel tiene la evaluación nacional de riesgos en el diseño de la metodología?", "a": "Es una fuente de información externa cuya parte aplicable, dado el Contexto de la entidad, debe tomarse en cuenta y reflejarse en la valoración de los Indicadores.", "o": ["Es la metodología que la entidad debe adoptar íntegramente, ya que sustituye al diseño propio cuando la Secretaría publica una actualización del ejercicio nacional.", "Es una fuente de información externa cuya parte aplicable, dado el Contexto de la entidad, debe tomarse en cuenta y reflejarse en la valoración de los Indicadores.", "Es el instrumento con el que la Comisión califica anualmente el Riesgo de cada entidad y se lo notifica por los medios electrónicos que la propia Comisión establezca.", "Es un documento de consulta potestativa que la entidad podrá considerar sólo cuando opere con países o áreas geográficas identificadas como de mayor Riesgo."], "x": "La evaluación nacional de riesgos es fuente externa obligatoria en la parte que resulte aplicable dado el Contexto de la entidad, y su análisis debe reflejarse en la valoración del grado de Riesgo de cada Indicador y quedar documentado. El distractor que convierte la evaluación nacional de riesgos en un documento de consulta potestativa es el más tentador porque introduce un matiz que la norma no concede: la disposición dice «deberán tomar en cuenta». Fundamento: 21ª-1, segundo párrafo, y Guía CNBV, apartado C.", "ref": "21ª-1, 2º párr. · Tema 3.3.1"}, {"id": "M031", "tema": "metriesgo", "tipo": "cifra", "q": "¿Respecto de cuántos delitos debe la entidad establecer indicadores específicos, y con qué alcance?", "a": "De dos: el del artículo 400 Bis y el del artículo 139 Quáter del Código Penal Federal, para cada elemento de Riesgo.", "o": ["De tres: operaciones con recursos de procedencia ilícita, financiamiento al terrorismo y financiamiento a la proliferación de armas de destrucción masiva, en cada elemento.", "De uno: el del artículo 400 Bis del Código Penal Federal, para cada uno de los cuatro elementos de Riesgo que como mínimo debe definir la entidad.", "De dos: el del artículo 400 Bis y el del artículo 139 Quáter del Código Penal Federal, para cada elemento de Riesgo.", "De dos: el del artículo 400 Bis y el del artículo 139 Quáter del Código Penal Federal, pero únicamente para el elemento de Clientes y Usuarios."], "x": "Son dos delitos y el alcance es total: indicadores específicos de 400 Bis y de 139 Quáter para cada uno de los elementos de Riesgo. El distractor que agrega el financiamiento a la proliferación de armas como tercer delito es el más tentador porque ese concepto sí aparece en la definición de evaluación nacional de riesgos de la Guía, pero no en la obligación de indicadores específicos del Capítulo II Bis. Fundamento: 21ª-2, último párrafo.", "ref": "21ª-2, último párr. · Tema 3.3.1"}, {"id": "M032", "tema": "metriesgo", "tipo": "caso", "q": "Banco Almadía debe clasificar sus canales para el elemento correspondiente. ¿Cuál de los siguientes es, conforme a la Guía CNBV, un canal no presencial?", "a": "La banca electrónica o móvil, en la que el Cliente no tiene contacto directo con personal de la entidad.", "o": ["La apertura de cuentas a través de comisionistas facultados para celebrar operaciones a nombre y por cuenta de la propia entidad de que se trate.", "La banca privada, en la que un ejecutivo asignado atiende de manera personalizada al Cliente en las instalaciones de la entidad financiera.", "La ventanilla de sucursal, cuando el Cliente es atendido por un cajero previa identificación biométrica realizada en el propio mostrador.", "La banca electrónica o móvil, en la que el Cliente no tiene contacto directo con personal de la entidad."], "x": "La Guía define canales no presenciales como aquellos en los que el Cliente no tiene contacto directo con personal de la entidad y la operación se ejecuta electrónicamente: cajeros automáticos, banca electrónica o móvil. El distractor de los comisionistas es el más tentador porque el Cliente no pisa una sucursal del banco, pero la Guía los clasifica expresamente como canal presencial, ya que hay atención personalizada. Fundamento: Guía CNBV, apartado C, fase I, proceso 1, inciso iv.", "ref": "Guía CNBV, C, fase I, proceso 1 · Tema 3.3.1"}, {"id": "M033", "tema": "metriesgo", "tipo": "caso", "q": "Transmisor Correo Austral quiere tratar por separado los canales y las transacciones dentro de su metodología. ¿Qué permite la Guía CNBV?", "a": "Que ese elemento podrá separarse en dos, uno para canales de envío o distribución y otro para transacciones, si el sujeto supervisado así lo determina.", "o": ["Que ese elemento podrá separarse en dos, uno para canales de envío o distribución y otro para transacciones, si el sujeto supervisado así lo determina.", "Que deberá fusionarlos con el elemento de productos y servicios cuando la entidad opere únicamente a través de canales no presenciales electrónicos.", "Que podrá omitir ese elemento cuando la entidad no utilice intermediarios ni comisionistas facultados para celebrar operaciones a su nombre y por su cuenta.", "Que deberá separarlos siempre en dos elementos distintos, de modo que la entidad termine con cinco elementos de Riesgo como mínimo en su metodología."], "x": "La Guía admite que el elemento de transacciones y canales se separe en dos si el sujeto supervisado así lo determina: es una facultad, no una obligación. El distractor que obliga a separar siempre transacciones y canales en dos elementos distintos es el más tentador porque parte del mismo dato verdadero —que la separación es posible— pero la convierte en deber y altera el número mínimo de elementos, que sigue siendo cuatro. Fundamento: Guía CNBV, apartado C, fase I, proceso 1, inciso iv.", "ref": "Guía CNBV, C, fase I, proceso 1 · Tema 3.3.1"}, {"id": "M034", "tema": "metriesgo", "tipo": "caso", "q": "Para el elemento de transacciones, el Comité de Casa de Cambio Peñasco pregunta qué se espera que defina su metodología. ¿Qué responde la Guía CNBV?", "a": "Una serie de transacciones o escenarios de Riesgo, dado el modelo de negocio, que contemplen entre otros factores la frecuencia, el monto y el instrumento monetario.", "o": ["Un umbral único de monto por operación, a partir del cual toda transacción se califique automáticamente con el Grado de Riesgo más alto de la escala definida.", "Una serie de transacciones o escenarios de Riesgo, dado el modelo de negocio, que contemplen entre otros factores la frecuencia, el monto y el instrumento monetario.", "Una lista cerrada de las operaciones relevantes, inusuales y preocupantes que la entidad haya reportado durante el periodo de doce meses inmediato anterior.", "Un catálogo de las transacciones que la Comisión da a conocer por medios electrónicos para cada sector, a fin de homologar los escenarios entre sujetos supervisados."], "x": "La Guía pide definir una serie de transacciones o escenarios de Riesgo acordes con el modelo de negocio, considerando entre otros el tipo, monto, número, frecuencia, naturaleza, instrumento monetario, moneda o medio de pago. El distractor que reduce los escenarios de Riesgo a la lista cerrada de operaciones ya reportadas es el más tentador porque esos reportes son insumo legítimo, pero un listado cerrado de lo ya reportado mira al pasado y no construye escenarios. Fundamento: Guía CNBV, apartado C, fase I, proceso 1, inciso iv.", "ref": "Guía CNBV, C, fase I, proceso 1 · Tema 3.3.1"}, {"id": "M035", "tema": "metriesgo", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre el enfoque basado en Riesgo NO es correcta?", "a": "Los Riesgos de LD/FT y los riesgos financieros de la institución son la misma categoría y se miden con la misma metodología.", "o": ["La Guía retoma la definición de enfoque basado en riesgo contenida en la guía emitida por el Grupo de Acción Financiera en octubre de 2014.", "El enfoque basado en Riesgo implica identificar, evaluar y entender los Riesgos a los que se está expuesto y adoptar medidas adecuadas para mitigarlos de manera efectiva.", "Los Riesgos de LD/FT y los riesgos financieros de la institución son la misma categoría y se miden con la misma metodología.", "El enfoque basado en Riesgo debe permitir a la entidad entender cómo y hasta qué punto es vulnerable, para asignar eficientemente sus recursos."], "x": "La Guía advierte de forma expresa que es importante que los sujetos supervisados identifiquen la diferencia entre los riesgos financieros de la institución y los Riesgos de LD/FT. Confundirlos es tentador porque ambos se administran con lenguaje de riesgo —probabilidad, impacto, tolerancia—, pero responden a objetivos y metodologías distintos. Fundamento: Guía CNBV, apartado B.", "ref": "Guía CNBV, apartado B · Tema 3.3.1"}, {"id": "M036", "tema": "metriesgo", "tipo": "memoria", "q": "Conforme a la Guía CNBV, ¿qué se entiende por Contexto?", "a": "El conjunto de circunstancias de tiempo, modo y lugar en las que el sujeto supervisado lleva a cabo sus operaciones.", "o": ["El conjunto de circunstancias económicas nacionales que la Secretaría describe en la evaluación nacional de riesgos y en sus respectivas actualizaciones.", "El conjunto de disposiciones legales y administrativas que resultan aplicables al sujeto supervisado según el sector financiero al que pertenezca.", "El conjunto de resultados obtenidos por las demás entidades financieras que integren el grupo financiero del que forme parte el sujeto supervisado.", "El conjunto de circunstancias de tiempo, modo y lugar en las que el sujeto supervisado lleva a cabo sus operaciones."], "x": "El Contexto son las circunstancias de tiempo, modo y lugar en que la entidad opera, y es determinante en el diseño porque forma parte de los supuestos de identificación de los Indicadores. El distractor que define el Contexto como las circunstancias económicas nacionales de la evaluación nacional de riesgos es el más tentador porque esa evaluación sí se lee «dado el Contexto» de la entidad, pero es una fuente de información, no la definición de Contexto. Fundamento: Guía CNBV, apartado A, fracción I.", "ref": "Guía CNBV, apartado A, fr. I · Tema 3.3.1"}, {"id": "M037", "tema": "metriesgo", "tipo": "caso", "q": "Banco Orión del Golfo planea lanzar en marzo una billetera digital con apertura remota de cuentas. ¿Qué exige la norma antes del lanzamiento?", "a": "Llevar a cabo una evaluación de los Riesgos a los que se encuentra expuesta, con antelación al lanzamiento o uso del nuevo producto.", "o": ["Llevar a cabo una evaluación de los Riesgos a los que se encuentra expuesta, con antelación al lanzamiento o uso del nuevo producto.", "Clasificar con Grado de Riesgo alto a la totalidad de los Clientes que contraten el producto durante los primeros seis meses de la relación comercial.", "Solicitar a la Comisión la autorización previa del producto y esperar a que se pronuncie dentro del plazo que la propia Comisión establezca al efecto.", "Esperar a que transcurran doce meses de operación del producto para incorporar sus datos a la siguiente implementación de la metodología de evaluación."], "x": "La disposición obliga a evaluar los Riesgos con antelación al lanzamiento o uso de nuevos productos, servicios, tipos de Clientes o Usuarios, países o áreas geográficas, canales y transacciones. El distractor que exige esperar doce meses de operación del producto antes de incorporarlo a la implementación es el más tentador porque ese plazo mínimo sí existe, pero se refiere a los datos que alimentan la implementación, no a una espera antes de lanzar. Fundamento: 21ª-1, último párrafo.", "ref": "21ª-1, último párr. · Tema 3.3.1"}, {"id": "M038", "tema": "metriesgo", "tipo": "caso", "q": "Financiera Ceibo asignó a sus indicadores pesos elegidos para que sumaran 100 %, sin explicar por qué a cada uno le corresponde ese valor. ¿Qué exige la norma?", "a": "Asignar el peso de manera consistente en función de la importancia de cada indicador para describir el Riesgo del elemento al que pertenece.", "o": ["Asignar el peso en función del número de Operaciones que cada indicador hubiere registrado durante el periodo de doce meses considerado en la implementación.", "Asignar el peso de manera consistente en función de la importancia de cada indicador para describir el Riesgo del elemento al que pertenece.", "Asignar a todos los indicadores de un mismo elemento de Riesgo un peso idéntico, a fin de evitar cualquier discrecionalidad en la medición de la entidad.", "Asignar los pesos conforme a la tabla de ponderaciones que la Comisión dé a conocer por los medios electrónicos que la propia Comisión establezca."], "x": "La fracción II exige una relación entre indicador y elemento y una asignación de pesos consistente en función de la importancia para describir el Riesgo; lo mismo aplica entre elementos y el Riesgo de la entidad. El distractor que asigna a todos los indicadores de un mismo elemento un peso idéntico es el más tentador porque esos pesos iguales parecen neutrales y objetivos, pero renuncian precisamente al juicio de importancia que la norma exige documentar. Fundamento: 21ª-2, fr. II.", "ref": "21ª-2, fr. II · Tema 3.3.1"}, {"id": "M039", "tema": "metriesgo", "tipo": "memoria", "q": "¿A qué momento se refiere la 21ª-2, fracción III, cuando obliga a identificar los mitigantes?", "a": "A los que la entidad tenga implementados al momento del diseño de la metodología.", "o": ["A los que la entidad hubiere incorporado a su Manual de Cumplimiento durante los doce meses anteriores a la fecha de la evaluación de Riesgos.", "A los que la entidad implemente una vez que cuente con los resultados de la implementación de su metodología de evaluación de Riesgos.", "A los que la entidad tenga implementados al momento del diseño de la metodología.", "A los que la entidad tenga implementados al cierre del ejercicio social inmediato anterior al de la revisión de la propia metodología."], "x": "La fracción III fija el corte en el momento del diseño: se identifican los mitigantes que la entidad tiene implementados en ese instante, con su efectiva aplicación. El distractor que ubica los mitigantes en los que la entidad implementa después de conocer los resultados es el más tentador porque eso también ocurre, pero pertenece al ajuste posterior de la 21ª-3, no al diseño. Fundamento: 21ª-2, fr. III.", "ref": "21ª-2, fr. III · Tema 3.3.1"}, {"id": "M040", "tema": "metriesgo", "tipo": "cifra", "q": "¿Cuántas fases comprende el desarrollo de la metodología y cuántos procesos comprende la primera de ellas?", "a": "Tres fases y tres procesos.", "o": ["Cuatro fases y tres procesos.", "Dos fases y tres procesos, más una etapa posterior de monitoreo permanente a cargo del área de cumplimiento.", "Tres fases y cuatro procesos.", "Tres fases y tres procesos."], "x": "Son tres fases —diseño, implementación y valoración— y tres procesos dentro de la primera fase —identificación, medición y mitigación—. El distractor que añade el monitoreo como una etapa posterior aparte es el más tentador porque el monitoreo existe realmente, pero no es una etapa aparte: vive dentro de la fase de valoración. Fundamento: Guía CNBV, apartado C.", "ref": "Guía CNBV, apartado C · Tema 3.3.1"}, {"id": "M041", "tema": "metriesgo", "tipo": "memoria", "q": "¿En qué consiste la fase de implementación de la metodología?", "a": "En poner en funcionamiento la metodología diseñada y obtener sus resultados, a fin de conocer los Riesgos a los que la entidad se encuentra expuesta.", "o": ["En poner en funcionamiento la metodología diseñada y obtener sus resultados, a fin de conocer los Riesgos a los que la entidad se encuentra expuesta.", "En revisar la eficiencia y la eficacia de la metodología ya aplicada, abriendo la posibilidad de realizar actualizaciones o modificaciones en su diseño.", "En clasificar a los Clientes y Usuarios de la entidad por su Grado de Riesgo con base en el modelo de evaluación previsto en el Anexo 3 de las Disposiciones.", "En describir por escrito todos los procesos de identificación, medición y mitigación que la entidad llevará a cabo, incluidos sus detalles operativos y las áreas responsables."], "x": "Implementar es correr la metodología con la operación real y obtener resultados. El distractor que describe la implementación como la revisión de la eficiencia y eficacia de la metodología es el más tentador porque describe con exactitud una fase verdadera, pero es la valoración: llega después y mira hacia la metodología misma, no hacia los Riesgos de la entidad. Fundamento: 21ª-3, primer párrafo, y Guía CNBV, apartado C, fase II.", "ref": "21ª-3 · Tema 3.3.1"}, {"id": "M042", "tema": "metriesgo", "tipo": "cifra", "q": "Al implementar la metodología, ¿a qué periodo mínimo debe corresponder la información de número de Clientes, número de operaciones y monto operado?", "a": "A un periodo que no podrá ser menor a doce meses.", "o": ["A un periodo que no podrá ser menor a seis meses, contados desde el inicio de la relación comercial con cada uno de los Clientes.", "A un periodo que no podrá ser menor a doce meses.", "A un periodo que no podrá ser mayor a doce meses, a fin de que la información utilizada se mantenga actualizada y sea representativa.", "A un periodo que no podrá ser menor a veinticuatro meses, contados hacia atrás desde la fecha en que se realice la implementación."], "x": "La fracción II fija un piso, no un techo: el periodo no podrá ser menor a doce meses, de modo que usar dieciocho o veinticuatro es válido. El distractor que convierte el piso de doce meses en un techo —«no podrá ser mayor»— es el más tentador porque repite el número correcto y sólo invierte el sentido del modal, que es donde está la trampa. Fundamento: 21ª-3, fr. II.", "ref": "21ª-3, fr. II · Tema 3.3.1"}, {"id": "M043", "tema": "metriesgo", "tipo": "caso", "q": "Al implementar su metodología, Banco Ribera capturó un total de Clientes distinto del que arroja su sistema automatizado. ¿Qué obligación se está incumpliendo?", "a": "La de asegurarse de que no existan inconsistencias entre la información que se incorpora a la metodología y la que obra en sus sistemas automatizados.", "o": ["La de utilizar información correspondiente a un periodo no menor a doce meses de número de Clientes, número de operaciones y monto operado de la entidad.", "La de conservar durante un plazo no menor a cinco años toda la información generada con motivo del Capítulo II Bis de las Disposiciones aplicables.", "La de asegurarse de que no existan inconsistencias entre la información que se incorpora a la metodología y la que obra en sus sistemas automatizados.", "La de someter los resultados de la implementación a la aprobación del comité de riesgos de la entidad, con base en la propuesta que formule su Comité."], "x": "La fracción I de la 21ª-3 exige coherencia entre la información que alimenta la metodología y la que obra en los sistemas automatizados. El distractor que describe la obligación del periodo mínimo de doce meses de datos es el más tentador porque también pertenece a la 21ª-3, pero se refiere a la extensión temporal de los datos, no a su consistencia con los sistemas. Fundamento: 21ª-3, fr. I.", "ref": "21ª-3, fr. I · Tema 3.3.1"}, {"id": "M044", "tema": "metriesgo", "tipo": "memoria", "q": "¿Cómo se denomina el grado de exposición al Riesgo que resulta una vez considerados los efectos de los mitigantes existentes?", "a": "Riesgo residual.", "o": ["Riesgo de concentración del negocio.", "Grado de Riesgo del Cliente.", "Riesgo inherente.", "Riesgo residual."], "x": "El resultado de la implementación, ya descontado el efecto de los mitigantes, es el riesgo residual. El riesgo inherente es el más tentador porque es el concepto gemelo, pero describe la exposición antes de aplicar los mitigantes. Fundamento: Guía CNBV, apartado C, fase II.", "ref": "Guía CNBV, C, fase II · Tema 3.3.1"}, {"id": "M045", "tema": "metriesgo", "tipo": "caso", "q": "De la implementación de su metodología, Financiera Altamar detectó nuevos Riesgos asociados a un canal no presencial. ¿Qué debe hacer?", "a": "Modificar las políticas, criterios, medidas y procedimientos que correspondan, para establecer los mitigantes necesarios.", "o": ["Modificar las políticas, criterios, medidas y procedimientos que correspondan, para establecer los mitigantes necesarios.", "Reclasificar con Grado de Riesgo alto a la totalidad de los Clientes que hubieren utilizado el canal durante el periodo de doce meses considerado en la implementación.", "Suspender de inmediato la comercialización del canal no presencial hasta que la Comisión autorice expresamente la continuación de las operaciones por ese medio.", "Reportar los nuevos Riesgos a la Secretaría por conducto de la Comisión dentro de los quince días hábiles siguientes y esperar a que esta determine los mitigantes."], "x": "Detectar mayores o nuevos Riesgos activa el deber de modificar políticas, criterios, medidas y procedimientos del Manual de Cumplimiento u otro manual, para establecer los mitigantes necesarios y mantener los Riesgos en un nivel de tolerancia aceptable. El distractor que obliga a reportar los nuevos Riesgos a la Secretaría dentro de quince días hábiles es el más tentador porque suena obligatorio, pero la norma no prevé aviso previo: la respuesta es interna y luego revisable por la Comisión. Fundamento: 21ª-3, penúltimo párrafo.", "ref": "21ª-3 · Tema 3.3.1"}, {"id": "M046", "tema": "metriesgo", "tipo": "cifra", "q": "¿En qué plazo deben realizarse las modificaciones a las políticas, criterios, medidas y procedimientos derivadas de los resultados de la implementación?", "a": "En un plazo no mayor a doce meses contados a partir de que la entidad cuente con los resultados de su implementación.", "o": ["En un plazo no mayor a seis meses contados a partir de que la entidad cuente con los resultados de la implementación de su metodología.", "En un plazo no mayor a doce meses contados a partir de que la entidad cuente con los resultados de su implementación.", "En un plazo no mayor a veinticuatro meses contados a partir de la fecha en que se hubiere actualizado la evaluación nacional de riesgos aplicable.", "En un plazo no mayor a sesenta días naturales contados a partir de que el Comité conozca los resultados de la implementación de la metodología."], "x": "El plazo es de doce meses y corre desde que la entidad cuenta con los resultados de su implementación, no desde su aprobación ni desde la actualización de la evaluación nacional. El distractor que fija el plazo en sesenta días naturales desde que el Comité conoce los resultados es el más tentador porque suena procesal, pero en este Capítulo los plazos están redactados en meses y años. Fundamento: 21ª-3, último párrafo.", "ref": "21ª-3, último párr. · Tema 3.3.1"}, {"id": "M047", "tema": "metriesgo", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre el plazo de doce meses de la 21ª-3 NO es correcta?", "a": "Es el plazo con el que cuenta la entidad para presentar su Manual de Cumplimiento a la Comisión para su aprobación.", "o": ["Se cuenta a partir de que la entidad cuente con los resultados de la implementación de su metodología de evaluación de Riesgos.", "Las modificaciones realizadas deben identificarse señalando al menos el año y el mes en que se obtuvieron los resultados que les dieron lugar.", "Es el plazo con el que cuenta la entidad para presentar su Manual de Cumplimiento a la Comisión para su aprobación.", "Es el plazo máximo para realizar las modificaciones a las políticas, criterios, medidas y procedimientos derivadas de los resultados de la implementación."], "x": "Los doce meses de la 21ª-3 sirven para realizar las modificaciones internas derivadas de los resultados; no son un plazo para presentar el Manual a la Comisión ni para obtener aprobación alguna. La confusión es frecuente porque el Manual sí se modifica, pero la obligación es de ajuste, no de presentación. Fundamento: 21ª-3, último párrafo.", "ref": "21ª-3, último párr. · Tema 3.3.1"}, {"id": "M048", "tema": "metriesgo", "tipo": "caso", "q": "Banco Cendal modificó su Manual de Cumplimiento tras su implementación, pero no dejó rastro de qué resultados originaron cada cambio. ¿Qué exige la norma?", "a": "Que las modificaciones estén claramente identificadas y señaladas, indicando al menos el año y el mes en que se obtuvieron los resultados que les dieron lugar.", "o": ["Que las modificaciones se acompañen del dictamen del auditor externo independiente que hubiere revisado los resultados de la implementación de la metodología.", "Que las modificaciones se numeren consecutivamente y se informen a la Comisión dentro de los treinta días hábiles siguientes a la fecha en que se hubieren aprobado.", "Que las modificaciones consten en acta del consejo de administración, indicando el día, mes y año en que se detectaron los nuevos Riesgos que las hubieren motivado.", "Que las modificaciones estén claramente identificadas y señaladas, indicando al menos el año y el mes en que se obtuvieron los resultados que les dieron lugar."], "x": "La norma pide trazabilidad mínima: cada modificación identificada y señalada, con al menos el año y el mes de los resultados que la originaron. El distractor que exige acta del consejo con día, mes y año de detección es el más tentador porque agrega el día y un acta, lo que parece más riguroso; pero exige más de lo que la disposición pide y cambia el hecho que se fecha —los resultados, no la detección—. Fundamento: 21ª-3, último párrafo.", "ref": "21ª-3, último párr. · Tema 3.3.1"}, {"id": "M049", "tema": "metriesgo", "tipo": "trampa", "q": "Banco Nortia obtuvo un riesgo residual dentro de sus niveles de tolerancia, pero detectó nuevos Riesgos. ¿Qué procede conforme a la Guía CNBV?", "a": "Debe modificar sus políticas y procedimientos, sin importar si el riesgo residual se encuentra o no fuera de los niveles de tolerancia aceptables.", "o": ["Debe modificar sus políticas y procedimientos, sin importar si el riesgo residual se encuentra o no fuera de los niveles de tolerancia aceptables.", "Debe elevar sus niveles de tolerancia en el Manual de Cumplimiento, de modo que los nuevos Riesgos detectados queden comprendidos dentro del umbral aceptado.", "No procede modificación alguna, porque el riesgo residual dentro de tolerancia acredita que los mitigantes existentes son suficientes para la operación de la entidad.", "Debe esperar a la siguiente actualización de la evaluación nacional de riesgos para decidir si resulta necesario modificar sus políticas, criterios y procedimientos."], "x": "La Guía es expresa: sin importar si el riesgo residual está o no fuera de los niveles de tolerancia definidos por la propia entidad, la detección de mayores o nuevos Riesgos obliga a modificar políticas y procedimientos. El distractor que da por buenos los mitigantes existentes sólo porque el riesgo residual está dentro de tolerancia es el más tentador porque la tolerancia parece un semáforo verde, pero el disparador es la detección de nuevos Riesgos, no el semáforo. Fundamento: Guía CNBV, apartado C, fase II.", "ref": "Guía CNBV, C, fase II · Tema 3.3.1"}, {"id": "M050", "tema": "metriesgo", "tipo": "memoria", "q": "Conforme a la Guía CNBV, ¿qué se espera de la entidad una vez que cuenta con los resultados de la implementación?", "a": "Que adapte su Manual de Cumplimiento u otros manuales o, en su defecto, que tenga un plan de trabajo para hacerlo.", "o": ["Que suspenda la aplicación de su metodología hasta que el Comité apruebe la totalidad de las modificaciones que resulten necesarias en sus manuales internos.", "Que adapte su Manual de Cumplimiento u otros manuales o, en su defecto, que tenga un plan de trabajo para hacerlo.", "Que sustituya íntegramente su Manual de Cumplimiento por uno nuevo cada vez que obtenga resultados de la implementación de su metodología de evaluación.", "Que presente a la Comisión un plan de acción con medidas reforzadas para gestionar y mitigar sus Riesgos dentro del plazo que la propia Comisión establezca."], "x": "La Guía admite que la adaptación tome tiempo y acepta, en su defecto, un plan de trabajo para realizarla. El distractor que exige presentar un plan de acción con medidas reforzadas a la Comisión es el más tentador porque ese plan existe de verdad, pero es algo que la Comisión puede solicitar en ejercicio de su facultad de revisión, no lo que se espera de forma ordinaria tras una implementación. Fundamento: Guía CNBV, apartado C, fase II, y 21ª-4, segundo párrafo.", "ref": "Guía CNBV, C, fase II · Tema 3.3.1"}, {"id": "M051", "tema": "metriesgo", "tipo": "memoria", "q": "Una vez concluida la implementación de la metodología, ¿qué debe ocurrir?", "a": "Verificarse si el resultado obtenido es el adecuado; esa evaluación final será el inicio de la valoración.", "o": ["Remitirse los resultados a la Secretaría por conducto de la Comisión para que esta determine si el resultado obtenido resulta adecuado al Contexto de la entidad.", "Iniciarse de inmediato un nuevo diseño de la metodología, porque cada implementación agota la vigencia del diseño anterior conforme a las Disposiciones aplicables.", "Verificarse si el resultado obtenido es el adecuado; esa evaluación final será el inicio de la valoración.", "Clasificarse nuevamente a la totalidad de los Clientes de la entidad por su Grado de Riesgo, a fin de que el modelo resulte coherente con los resultados obtenidos."], "x": "La Guía une las fases con una bisagra: concluida la implementación se verifica si el resultado es el adecuado, y esa evaluación final es el inicio de la valoración. El distractor que exige reclasificar de inmediato a todos los Clientes por su Grado de Riesgo es el más tentador porque esa coherencia entre el modelo de Clientes y los resultados sí se exige, pero no es el paso inmediato que cierra la implementación. Fundamento: Guía CNBV, apartado C, fase II.", "ref": "Guía CNBV, C, fase II · Tema 3.3.1"}, {"id": "M052", "tema": "metriesgo", "tipo": "memoria", "q": "¿Qué comprende la fase de valoración?", "a": "Una revisión de la eficiencia y la eficacia de la metodología, que abre la posibilidad de realizar actualizaciones o modificaciones en el diseño.", "o": ["Una revisión de la información capturada en los sistemas automatizados de la entidad, a fin de descartar inconsistencias antes de obtener los resultados de la metodología.", "Una revisión que realiza la Comisión sobre la metodología de la entidad y que concluye con la orden de modificar los mitigantes que resulten insuficientes.", "Una revisión anual a cargo del auditor externo independiente, cuyo resultado sustituye a la evaluación interna de la eficiencia y eficacia de la metodología.", "Una revisión de la eficiencia y la eficacia de la metodología, que abre la posibilidad de realizar actualizaciones o modificaciones en el diseño."], "x": "La valoración mira a la metodología misma: revisa su eficiencia y eficacia y abre la puerta a actualizar o modificar el diseño. El distractor que describe la valoración como la revisión de consistencia con los sistemas automatizados es el más tentador porque esa revisión también existe, pero pertenece a la implementación y no a la valoración. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III · Tema 3.3.1"}, {"id": "M053", "tema": "metriesgo", "tipo": "cifra", "q": "¿Cuáles son los supuestos que obligan a revisar y actualizar el cumplimiento y los resultados de las obligaciones del Capítulo II Bis?", "a": "Cuando se detecten nuevos Riesgos, cuando se actualice la evaluación nacional de riesgos, o en un plazo no mayor a doce meses desde que se cuente con los resultados.", "o": ["Cuando se detecten nuevos Riesgos, cuando se actualice la evaluación nacional de riesgos, o en un plazo no mayor a doce meses desde que se cuente con los resultados.", "Cuando se detecten nuevos Riesgos, cuando cambie el Oficial de Cumplimiento y en un plazo no mayor a veinticuatro meses contados desde el diseño de la metodología.", "Cuando se actualice la evaluación nacional de riesgos, cuando la entidad lance un nuevo producto y en un plazo no mayor a cinco años desde la última implementación.", "Cuando la Comisión lo ordene expresamente, cuando el auditor externo formule observaciones y cuando el Comité lo acuerde en la sesión de cierre del ejercicio."], "x": "Son tres disparadores y operan de forma alternativa: nuevos Riesgos detectados, actualización de la evaluación nacional de riesgos, o el transcurso de doce meses desde que se cuenta con los resultados. El distractor que añade el lanzamiento de un nuevo producto y cinco años como disparadores de la revisión es el más tentador porque el lanzamiento de un producto sí obliga a evaluar, pero por la vía de la 21ª-1, con antelación al lanzamiento, y porque cinco años es el plazo de conservación, no de revisión. Fundamento: 21ª-4, primer párrafo.", "ref": "21ª-4, 1er párr. · Tema 3.3.1"}, {"id": "M054", "tema": "metriesgo", "tipo": "caso", "q": "La Comisión requiere a Banco Litoral las revisiones y actualizaciones de su metodología. El banco responde que se hicieron en reuniones de trabajo, sin documento alguno. ¿Qué exige la norma?", "a": "Que las revisiones y actualizaciones consten por escrito y estén a disposición de la Secretaría y de la Comisión.", "o": ["Que las revisiones y actualizaciones consten en el acta de la sesión del comité de riesgos que hubiere aprobado el modelo de evaluación de Riesgos de Clientes.", "Que las revisiones y actualizaciones consten por escrito y estén a disposición de la Secretaría y de la Comisión.", "Que las revisiones y actualizaciones se presenten a la Comisión dentro de los treinta días naturales siguientes a la conclusión de cada ejercicio social.", "Que las revisiones y actualizaciones se protocolicen ante fedatario público y se inscriban en el registro que para tal efecto lleve la propia Comisión."], "x": "La 21ª-4 exige que las revisiones y actualizaciones consten por escrito y estén a disposición de la Secretaría y de la Comisión, a requerimiento de esta última y dentro del plazo que la propia Comisión establezca. El distractor que exige presentar las revisiones y actualizaciones a la Comisión dentro de treinta días naturales es el más tentador porque convierte una obligación de disponibilidad en una de presentación periódica con plazo fijo, que la norma no establece. Fundamento: 21ª-4, primer párrafo.", "ref": "21ª-4, 1er párr. · Tema 3.3.1"}, {"id": "M055", "tema": "metriesgo", "tipo": "caso", "q": "Tras revisar la metodología de Financiera Quetzal Azul, la Comisión considera que sus criterios para terminar relaciones comerciales no reflejan una debida administración de Riesgos. ¿Qué puede hacer?", "a": "Podrá ordenar a la entidad la modificación de su metodología o de sus mitigantes y solicitar un plan de acción con medidas reforzadas.", "o": ["Deberá revocar la autorización del producto o servicio involucrado hasta que la entidad acredite haber corregido los criterios observados en su metodología.", "Deberá sustituir la metodología de la entidad por la que la propia Comisión dé a conocer por los medios electrónicos que establezca para el sector correspondiente.", "Podrá ordenar a la entidad la modificación de su metodología o de sus mitigantes y solicitar un plan de acción con medidas reforzadas.", "Podrá únicamente formular recomendaciones no vinculantes, ya que la modificación de la metodología es una decisión exclusiva del consejo de administración."], "x": "La 21ª-4 faculta a la Comisión para revisar y, en su caso, ordenar la modificación de la metodología o de los mitigantes, y para solicitar un plan de acción con medidas reforzadas; entre los supuestos está justamente que los criterios de apertura, limitación o terminación de relaciones no consideren una debida administración de Riesgos. El distractor que reduce la facultad de la Comisión a recomendaciones no vinculantes es el más tentador porque el verbo «podrá» sugiere discrecionalidad, pero esa facultad incluye órdenes vinculantes. Fundamento: 21ª-4, segundo párrafo.", "ref": "21ª-4, 2º párr. · Tema 3.3.1"}, {"id": "M056", "tema": "metriesgo", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre la intervención de la Comisión en la metodología NO es correcta?", "a": "La Comisión debe revisar y aprobar la metodología de cada entidad antes de su primera implementación.", "o": ["La Comisión podrá revisar y, en su caso, ordenar a las entidades la modificación de su metodología de evaluación de Riesgos o de sus mitigantes.", "El procedimiento y los criterios para determinar la apertura, limitación o terminación de una relación comercial deben ser congruentes con la metodología.", "La Comisión podrá solicitar un plan de acción para que las entidades adopten medidas reforzadas para gestionar y mitigar sus Riesgos.", "La Comisión debe revisar y aprobar la metodología de cada entidad antes de su primera implementación."], "x": "No existe aprobación previa de la metodología por la Comisión: la disposición usa «podrá revisar», es decir, una facultad de revisión posterior y eventual. Suena razonable exigir un visto bueno previo porque otras figuras del régimen sí se someten a autorización, pero aquí la aprobación interna corresponde al Comité. Fundamento: 21ª-4, segundo párrafo, y Guía CNBV, apartado E.", "ref": "21ª-4, 2º párr. · Tema 3.3.1"}, {"id": "M057", "tema": "metriesgo", "tipo": "memoria", "q": "¿Qué precisa la Guía CNBV sobre la revisión de la metodología frente a la auditoría anual?", "a": "Que debe ser un proceso continuo y que corre con independencia de la auditoría anual que se realice en términos de las Disposiciones.", "o": ["Que debe ser un proceso continuo y que corre con independencia de la auditoría anual que se realice en términos de las Disposiciones.", "Que la revisión sustituye a la auditoría anual cuando la entidad obtiene una calificación de Riesgo bajo en la implementación de su metodología de evaluación.", "Que la revisión de la metodología queda satisfecha con la auditoría anual, siempre que el auditor externo se pronuncie expresamente sobre los resultados obtenidos.", "Que la revisión debe practicarse en la misma fecha en que concluya la auditoría anual, a fin de que ambos ejercicios compartan la información utilizada."], "x": "La Guía insiste en que una metodología eficaz
