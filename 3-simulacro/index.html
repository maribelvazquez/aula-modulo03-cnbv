ctor tentador limita la relevancia al sector público; el texto menciona ambos.", "ref": "Párr. 32 · Tema 3.2.2"}, {"id": "B022", "tema": "bcbs2014", "tipo": "caso", "q": "Rosa, estudiante, quiere abrir una cuenta en Banco Álamo para mantener saldos pequeños y hacer operaciones rutinarias de banca minorista. Es una situación probada de bajo riesgo. Según el párrafo 33:", "a": "Podrían aceptarse medidas simplificadas, como procedimientos básicos de apertura, siempre que la legislación lo permita", "o": ["Podría eximirse de toda identificación y verificación, ya que el bajo riesgo probado sustituye a la diligencia debida básica", "Debería rechazarse la solicitud, porque las cuentas de saldos pequeños quedan fuera de la política de aceptación de clientes", "Podrían aceptarse medidas simplificadas, como procedimientos básicos de apertura, siempre que la legislación lo permita", "Debería aplicarse diligencia debida reforzada, porque la política de aceptación no admite distinciones por nivel de riesgo"], "x": "El párr. 33 prevé que, en situaciones probadas de bajo riesgo, podrán aceptarse medidas simplificadas «siempre que la legislación lo permita», y pone como ejemplo procedimientos básicos de apertura para un particular con pequeños saldos y operaciones rutinarias. Simplificar no es eximir de identificar. Además, la política no debe ser tan restrictiva que perjudique el acceso de grupos financiera o socialmente desfavorecidos.", "ref": "Párr. 33 · Tema 3.2.2"}, {"id": "B023", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Olmo recibe la solicitud de un exministro de otro país, identificado como persona del medio político (PEP) extranjera. Según el párrafo 34, ¿qué aplica?", "a": "La diligencia debida reforzada, que en el caso de PEP extranjeras es obligatoria", "o": ["La diligencia debida reforzada, que en el caso de PEP extranjeras es obligatoria", "La diligencia debida básica, pues el documento remite al GAFI el tratamiento de las PEP sin fijar medidas", "La diligencia debida simplificada, si su país no figura en listados de jurisdicciones con deficiencias", "La diligencia debida reforzada, solo si mantiene un saldo importante"], "x": "El párr. 34 dice que la diligencia reforzada «podrá ser esencial» en el caso de una PEP y que «en particular, esa diligencia debida reforzada es obligatoria en el caso de PEP extranjeras». El distractor tentador mezcla el párr. 9 (las PEP no se desarrollan específicamente por tratarlas el GAFI) para negar cualquier medida; pero el párr. 34 sí fija la obligación para PEP extranjeras, sin condicionarla a saldos ni transferencias.", "ref": "Párr. 34 · Tema 3.2.2"}, {"id": "B024", "tema": "bcbs2014", "tipo": "caso", "q": "El gerente de una sucursal de Banco Sauce quiere continuar la relación con un cliente clasificado como de alto riesgo. Según el párrafo 34, ¿quién deberá aprobar continuar esa relación?", "a": "La alta dirección", "o": ["El comité de auditoría del Consejo", "El gerente regional de sucursales", "El responsable ejecutivo de PBC/FT", "La alta dirección"], "x": "El párr. 34 señala que las decisiones de establecer o proseguir relaciones con clientes de alto riesgo exigen medidas reforzadas, «como la aprobación de establecer o continuar esas relaciones, que deberá adoptar la alta dirección». El responsable ejecutivo de PBC/FT vigila el cumplimiento, pero el texto no le atribuye esta aprobación. La misma lógica aplica a la corresponsalía (Anexo 2, párr. 12).", "ref": "Párr. 34 · Tema 3.2.2"}, {"id": "B025", "tema": "bcbs2014", "tipo": "cifra", "q": "¿Con arreglo a qué Recomendación del GAFI define el documento al «cliente» y pide, en general, no establecer la relación hasta que su identidad esté satisfactoriamente verificada?", "a": "Recomendación 10", "o": ["Recomendación 26", "Recomendación 13", "Recomendación 17", "Recomendación 10"], "x": "Los párr. 35 y 36 remiten a la Recomendación 10 del GAFI: cliente es cualquier persona (física, jurídica o estructura jurídica, nota 21) que entabla una relación comercial o realiza una transacción financiera ocasional con el banco, y, en general, no se establece la relación hasta verificar su identidad. La R. 17 es recurso a terceros, la R. 13 corresponsalía y la R. 26 regulación y supervisión.", "ref": "Párr. 35 · Tema 3.2.2"}, {"id": "B026", "tema": "bcbs2014", "tipo": "caso", "q": "Julián se presenta en Banco Cedro para operar la cuenta de su tía con un poder notarial. Según el párrafo 36, ¿qué deberá hacer el banco?", "a": "Verificar que Julián está autorizado para actuar en nombre de la clienta y verificar su identidad", "o": ["Verificar que Julián está autorizado para actuar en nombre de la clienta y verificar su identidad", "Verificar solo la identidad de la tía, porque la CDD se aplica únicamente al titular", "Verificar el poder notarial y omitir la identidad de Julián, porque no es el titular de la cuenta", "Verificar la identidad de Julián solo si la tía hubiera sido clasificada previamente como de alto riesgo"], "x": "El párr. 36 dice que el banco deberá verificar que cualquier persona que actúe en nombre del cliente está autorizada para hacerlo, y deberá verificar la identidad de esa persona. El párr. 35 confirma que la CDD se aplica no solo a clientes, sino también a quienes actúan por su cuenta y a los beneficiarios efectivos. No depende del nivel de riesgo del titular.", "ref": "Párr. 36 · Tema 3.2.2"}, {"id": "B027", "tema": "bcbs2014", "tipo": "caso", "q": "Para identificar al beneficiario efectivo de una sociedad cliente, Banco Laurel pide al representante una declaración firmada con los datos del beneficiario. Según el párrafo 37:", "a": "El banco puede exigir esa declaración, pero no deberá recurrir únicamente a ella", "o": ["El banco no puede exigir declaraciones escritas; solo puede usar documentos oficiales del cliente", "La declaración firmada es suficiente y releva al banco de otras medidas", "La declaración es válida cuando la certifica un tercero supervisado, y entonces sustituye a la verificación", "El banco puede exigir esa declaración, pero no deberá recurrir únicamente a ella"], "x": "El párr. 37 dice que el banco «podrá exigir» una declaración por escrito sobre la identidad y detalles del beneficiario efectivo, «aunque no deberá recurrir únicamente a esas declaraciones». La verificación debe apoyarse en documentos, datos o informaciones fiables e independientes. El distractor tentador convierte la declaración en suficiente; el texto lo descarta.", "ref": "Párr. 37 · Tema 3.2.2"}, {"id": "B028", "tema": "bcbs2014", "tipo": "memoria", "q": "Cuando el banco recurre a documentos para verificar la identidad, ¿cuáles son los mejores según el párrafo 37?", "a": "Los más difíciles de obtener ilícitamente o de falsificar", "o": ["Los más difíciles de obtener ilícitamente o de falsificar", "Los expedidos más recientemente por cualquier autoridad", "Los que incluyan fotografía y firma autógrafa del titular", "Los presentados en original y en persona en la sucursal"], "x": "El párr. 37 afirma que «los mejores documentos para verificar la identidad son aquéllos más difíciles de obtener ilícitamente o falsificar». Los otros criterios pueden sonar razonables, pero no son los que da el texto. Si se usan otras fuentes distintas de documentos, el banco debe cerciorarse de que métodos y fuentes son adecuados y coherentes con sus políticas y con el perfil de riesgo del cliente.", "ref": "Párr. 37 · Tema 3.2.2"}, {"id": "B029", "tema": "bcbs2014", "tipo": "caso", "q": "Un solicitante de Banco Roble se niega a entregar la información que permitiría completar las medidas CDD. Aún no se ha abierto la cuenta. Según el párrafo 41, ¿qué debe hacer el banco?", "a": "No abrir la cuenta y, en cualquier caso, elaborar un STR, con sujeción a la legislación nacional aplicable", "o": ["No abrir la cuenta y archivar la solicitud, porque el STR requiere que ya exista una relación comercial vigente", "No abrir la cuenta y, en cualquier caso, elaborar un STR, con sujeción a la legislación nacional aplicable", "Abrir la cuenta y clasificar al cliente como de alto riesgo, con seguimiento reforzado", "Abrir la cuenta con limitaciones de uso, porque la verificación posterior es la regla general si el cliente no coopera"], "x": "El párr. 41 dice que, cuando el banco sea incapaz de completar las medidas CDD, no deberá abrir la cuenta, iniciar relaciones ni realizar la transacción, y que «en cualquier caso» deberá elaborar un STR cuando existan problemas para completar la CDD; la nota 26 lo matiza: «con sujeción a la legislación nacional sobre tratamiento de transacciones sospechosas». La verificación posterior es una excepción para ciertas circunstancias, no la regla.", "ref": "Párr. 41 · Tema 3.2.2"}, {"id": "B030", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Pino abrió una cuenta a una empresa, pero durante el establecimiento de la relación surgieron problemas de verificación que no han podido resolverse. Según el párrafo 41:", "a": "Deberá cerrar la cuenta o, si no, bloquear el acceso a ella", "o": ["Deberá esperar a que el supervisor indique si procede el cierre o el bloqueo de la cuenta", "Deberá cerrar la cuenta o, si no, bloquear el acceso a ella", "Deberá transferir la cuenta a otra entidad del grupo con normas CDD menos estrictas", "Deberá mantenerla activa y reclasificarla como de riesgo medio hasta la siguiente revisión"], "x": "El párr. 41 prevé que, si la cuenta ya fue abierta y surgen problemas de verificación que no pueden resolverse, «el banco deberá cerrar la cuenta o, si no, bloquear el acceso a ella»; además, elaborar un STR (con sujeción a la legislación nacional, nota 26). La decisión es del banco, no requiere instrucción del supervisor, y mantener la cuenta activa contradice el texto.", "ref": "Párr. 41 · Tema 3.2.2"}, {"id": "B031", "tema": "bcbs2014", "tipo": "trampa", "q": "Sobre completar la verificación de identidad después de establecer la relación comercial, ¿qué afirmación NO se ajusta al párrafo 41?", "a": "Es la regla general, aplicable a cualquier cliente que prefiera entregar su documentación más tarde", "o": ["Es la regla general, aplicable a cualquier cliente que prefiera entregar su documentación más tarde", "Sería admisible en ciertas circunstancias, cuando resulte esencial no interrumpir el curso normal de los negocios", "Si los problemas de verificación no se resuelven, deberá cerrar la cuenta o bloquear el acceso", "El banco deberá fijar condiciones y limitaciones bajo las cuales el cliente podrá usar la relación antes de verificar"], "x": "La regla del párr. 41 es no abrir la cuenta si no se completa la CDD. La verificación posterior es una excepción: «existen circunstancias» en que sería admisible, porque resultaría esencial no interrumpir el curso normal de los negocios, y entonces el banco fija condiciones y limitaciones de uso. Si luego los problemas no se resuelven, cierra la cuenta o bloquea el acceso. No depende de la preferencia del cliente.", "ref": "Párr. 41 · Tema 3.2.2"}, {"id": "B032", "tema": "bcbs2014", "tipo": "caso", "q": "Durante la CDD de un futuro cliente, el analista de Banco Fresno encuentra motivos razonables para sospechar que sus fondos proceden de delitos. El cliente llama para preguntar por qué se retrasa su cuenta. Según el párrafo 41:", "a": "No aceptar voluntariamente la apertura, elaborar el STR y asegurar que el cliente no sepa, ni indirectamente, del STR", "o": ["Abrir la cuenta para no alertarlo y vigilarla de cerca, dejando el STR para cuando existan movimientos sospechosos", "No aceptar voluntariamente la apertura, elaborar el STR y asegurar que el cliente no sepa, ni indirectamente, del STR", "No abrir la cuenta y omitir el STR, porque la notificación requiere operaciones que ya se hayan realizado", "Rechazar la apertura y explicarle que se debe a una sospecha notificada, para cumplir con el principio de transparencia"], "x": "El párr. 41 dice que, cuando la CDD ofrezca motivos razonables para sospechar que los fondos proceden de BC/FT, los bancos no deberán aceptar voluntariamente la apertura, deberán elaborar un STR notificándolo a las autoridades competentes y asegurarse de que el cliente no esté informado, «ni siquiera de forma indirecta», de que un STR ha sido, está siendo o será elaborado. Abrir la cuenta para no alertarlo contradice la primera parte.", "ref": "Párr. 41 · Tema 3.2.2"}, {"id": "B033", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Arce tiene motivos para pensar que otro banco negó servicios a un solicitante por sospechar actividades ilícitas. Según el párrafo 43, ¿qué deberá hacer Banco Arce?", "a": "Considerar clasificarlo de alto riesgo con diligencia reforzada, elaborar un STR y/o no aceptarlo, según sus procedimientos", "o": ["Rechazarlo, porque la negativa de otro banco obliga a todo el sistema bancario a no aceptar al solicitante", "Considerar clasificarlo de alto riesgo con diligencia reforzada, elaborar un STR y/o no aceptarlo, según sus procedimientos", "Pedir al otro banco copia de su STR y aceptarlo solo si ese banco le confirma que la sospecha ya ha sido descartada", "Aceptarlo con diligencia básica, porque los clientes tienen derecho a cambiar de banco y la negativa ajena no le vincula"], "x": "El párr. 43 reconoce que los clientes tienen derecho a cambiar de banco, pero si un banco tiene motivos para pensar que otro negó servicios por sospecha, deberá considerar clasificarlo como de alto riesgo y aplicar diligencia reforzada, elaborar un STR y/o no aceptarlo «con arreglo a sus propios procedimientos y evaluaciones del riesgo». No es un rechazo automático ni basta la diligencia básica.", "ref": "Párr. 43 · Tema 3.2.2"}, {"id": "B034", "tema": "bcbs2014", "tipo": "caso", "q": "Un cliente de banca privada de Banco Tilo pide una cuenta numerada para tener mayor confidencialidad. Según el párrafo 44, ¿cómo debe tratarse esa cuenta?", "a": "Con los mismos procedimientos CDD que las demás; la identidad del titular se verifica y la conoce un número suficiente de empleados", "o": ["Con CDD simplificada, porque el número de cuenta sustituye la identidad del titular en toda la documentación posterior del banco", "Como cuenta anónima cuya identidad conoce solo el gerente de relaciones, para preservar la confidencialidad pactada con el cliente", "Con los mismos procedimientos CDD, pero sin que el responsable PBC/FT ni los supervisores puedan acceder a la identidad del titular", "Con los mismos procedimientos CDD que las demás; la identidad del titular se verifica y la conoce un número suficiente de empleados"], "x": "El párr. 44 dice que las cuentas numeradas no deberán funcionar como anónimas: están sujetas a los mismos procedimientos CDD, aunque los lleve personal escogido; la identidad deberá verificarse y ser conocida por un número suficiente de empleados, y control, cumplimiento, auditoría, el responsable PBC/FT y los supervisores deben tener pleno acceso si fuera necesario. La nota 27 aclara que el número sustituye al nombre solo en la documentación posterior.", "ref": "Párr. 44 · Tema 3.2.2"}, {"id": "B035", "tema": "bcbs2014", "tipo": "caso", "q": "Se publica una modificación en un listado de sanciones. Según el párrafo 50, ¿qué deberá hacer Banco Nácar con su base de datos de clientes?", "a": "Cotejarla con motivo de esa modificación en los listados de sanciones", "o": ["Cotejarla en la siguiente revisión anual programada de sus expedientes", "Esperar a que la autoridad le notifique si alguno de sus clientes coincide", "Cotejarla respecto de los clientes de alto riesgo, por ser una medida sensible al riesgo", "Cotejarla con motivo de esa modificación en los listados de sanciones"], "x": "El párr. 50 dice que el banco deberá cotejar su(s) base(s) de datos de clientes «cuando haya modificaciones en los listados de sanciones», y además cotejarlas periódicamente para detectar PEP extranjeras y otras cuentas de alto riesgo. El cotejo con listas no se limita a clientes de alto riesgo: la detección de terroristas no es sensible al riesgo (párr. 62).", "ref": "Párr. 50 · Tema 3.2.2"}, {"id": "B036", "tema": "bcbs2014", "tipo": "cifra", "q": "Conforme al párrafo 52, ¿cuál es el periodo mínimo de conservación de los registros que documentan la diligencia debida?", "a": "Al menos 5 años desde el cese de la relación bancaria o de la transacción ocasional", "o": ["Al menos 3 años desde la última actualización del expediente de identificación del cliente", "Al menos 5 años contados desde la apertura de la cuenta o desde la fecha de cada transacción", "Al menos 10 años desde el cese de la relación o de la transacción ocasional", "Al menos 5 años desde el cese de la relación bancaria o de la transacción ocasional"], "x": "El párr. 52 fija un periodo de conservación de «al menos cinco años desde el cese de la relación bancaria o transacción ocasional» (con referencia al Principio 29, nota 28). Ojo con el punto de partida: es el cese, no la apertura. Y aun con cuentas canceladas, si hay una investigación o litigio en curso, todos los registros se conservan hasta el cierre del procedimiento.", "ref": "Párr. 52 · Tema 3.2.2"}, {"id": "B037", "tema": "bcbs2014", "tipo": "memoria", "q": "¿Qué singularidades de la financiación del terrorismo, frente al blanqueo de capitales, destaca el párrafo 59?", "a": "Sus fondos pueden proceder de actividades delictivas o de fuentes lícitas y los importes pueden ser muy reducidos", "o": ["Sus fondos proceden de actividades delictivas, igual que en el BC, y se mueven en importes elevados", "Sus fondos pueden proceder de actividades delictivas o de fuentes lícitas y los importes pueden ser muy reducidos", "Sus fondos siguen un patrón uniforme en todas las organizaciones, sin importar el tipo de organización terrorista", "Sus fondos proceden solo de fuentes lícitas, por lo que la CDD no resulta útil para detectar transacciones FT"], "x": "El párr. 59 señala que los fondos para financiar actividades terroristas «pueden proceder de actividades delictivas o de fuentes lícitas», que la naturaleza de las fuentes puede variar según el tipo de organización y que los importes «pueden ser muy reducidos». Por eso el párr. 61 insiste en que la CDD sí debe permitir detectar posibles transacciones FT.", "ref": "Párr. 59 · Tema 3.2.2"}, {"id": "B038", "tema": "bcbs2014", "tipo": "trampa", "q": "Sobre la detección de terroristas y de personas o entidades designadas, ¿qué afirmación NO se ajusta al párrafo 62?", "a": "Puede omitirse con los clientes de bajo riesgo, porque es una medida de diligencia debida sensible al riesgo", "o": ["El banco deberá bloquear sin demora y sin previo aviso los fondos u otros activos de personas designadas", "Puede omitirse con los clientes de bajo riesgo, porque es una medida de diligencia debida sensible al riesgo", "Deberá realizarse independientemente del perfil de riesgo que se haya atribuido al cliente", "El banco podrá adoptar sistemas de detección automática, siempre que sean adecuados a sus fines"], "x": "El párr. 62 dice expresamente que «la detección de terroristas no es una medida de diligencia debida sensible al riesgo, por lo que deberá realizarse independientemente del perfil de riesgo atribuido al cliente». El banco podrá usar sistemas automáticos adecuados a sus fines y deberá bloquear sin demora y sin previo aviso los activos de personas o entidades designadas, con arreglo a la legislación aplicable.", "ref": "Párr. 62 · Tema 3.2.2"}, {"id": "B039", "tema": "bcbs2014", "tipo": "memoria", "q": "¿Cuál es el propósito de las directrices, tal como lo expresa el párrafo 1?", "a": "Orientar sobre la forma en que los bancos deberán incluir el BC y la FT dentro de su gestión global del riesgo", "o": ["Orientar sobre la forma en que los bancos deberán incluir el BC y la FT dentro de su gestión global del riesgo", "Sustituir las Recomendaciones del GAFI por un régimen propio para los bancos", "Establecer las sanciones mínimas que los supervisores deberán imponer a los bancos que incumplan en materia de PBC/FT", "Definir las atribuciones de las unidades de inteligencia financiera y de las demás autoridades competentes nacionales"], "x": "El párr. 1 dice que el Comité publica estas directrices «sobre la forma en que los bancos deberán incluir el blanqueo de capitales (BC) y la financiación del terrorismo (FT) dentro de su gestión global del riesgo». No sustituyen al GAFI (párr. 3) y el párr. 13 aclara que no tratan la determinación de atribuciones de las autoridades competentes.", "ref": "Párr. 1 · Tema 3.2.2"}, {"id": "B040", "tema": "bcbs2014", "tipo": "cifra", "q": "¿En qué año publicó el Comité de Basilea su primer comunicado sobre la prevención del uso delictivo del sistema bancario, según el párrafo 2?", "a": "1988", "o": ["2001", "1988", "2012", "2004"], "x": "El párr. 2 menciona un primer comunicado en 1988 (nota 1: Prevention of criminal use of the banking system for the purpose of money-laundering). 2001 y 2004 son los años de los dos documentos que este texto sustituye (párr. 9) y 2012 es el año de la revisión de los Principios básicos, cuyo Principio 29 trata la utilización abusiva de servicios financieros.", "ref": "Párr. 2 · Tema 3.2.2"}, {"id": "B041", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el párrafo 6, ¿qué riesgos plantea en especial a los bancos la insuficiencia o ausencia de una sólida gestión del riesgo BC/FT?", "a": "De reputación, operacional, de cumplimiento y de concentración", "o": ["De reputación, operacional, de cumplimiento y de concentración", "De crédito, de mercado, de liquidez y de tipo de interés estructural", "De reputación, de liquidez, de mercado y de país o de transferencia", "Operacional, de crédito, de contraparte y de liquidez de financiación"], "x": "El párr. 6 enumera cuatro riesgos: reputación, operacional, cumplimiento y concentración. El párr. 7 añade que están relacionados entre sí y que, además de multas y sanciones, pueden ocasionar costes financieros considerables (cese de financiación mayorista, demandas, investigación, embargo de activos, préstamos incobrables). Los distractores mezclan riesgos financieros clásicos que el párrafo no menciona.", "ref": "Párr. 6 · Tema 3.2.2"}, {"id": "B042", "tema": "bcbs2014", "tipo": "trampa", "q": "Sobre la relación entre estas directrices y las normas del GAFI, ¿qué afirmación NO es correcta según el párrafo 3?", "a": "Refuerzan las normas GAFI para el sector bancario, por lo que deben interpretarse como una modificación de estas", "o": ["Incorporan las normas GAFI y los Principios Básicos aplicables a bancos con operativa transfronteriza", "Pretenden coadyuvar a la aplicación nacional de las normas GAFI explorando áreas complementarias", "Refuerzan las normas GAFI para el sector bancario, por lo que deben interpretarse como una modificación de estas", "Pretenden complementar y ser congruentes con los objetivos y metas de las normas GAFI"], "x": "El párr. 3 dice que las directrices pretenden complementar y ser congruentes con las normas GAFI y que «en ningún caso deberán interpretarse como modificaciones de dichas normas, ya sea porque las refuercen o debiliten». También incorporan normas GAFI y Principios Básicos y buscan coadyuvar a su aplicación nacional. La trampa está en creer que, por ser más específicas, «refuerzan» o modifican al GAFI.", "ref": "Párr. 3 · Tema 3.2.2"}, {"id": "B043", "tema": "bcbs2014", "tipo": "cifra", "q": "¿Qué dos publicaciones previas del Comité fusiona y sustituye este documento, según el párrafo 9?", "a": "Debida diligencia con la clientela de los bancos (2001) y Gestión consolidada del riesgo KYC (2004)", "o": ["Debida diligencia con la clientela de los bancos (2004) y Gestión consolidada del riesgo KYC (2001)", "Debida diligencia con la clientela de los bancos (2001) y Gestión consolidada del riesgo KYC (2004)", "Prevention of criminal use of the banking system (1988) y Principios básicos para una supervisión bancaria eficaz (2012)", "Compliance and the compliance function in banks (2005) y The internal audit function in banks (2012)"], "x": "El párr. 9 dice que el documento fusiona y sustituye a «Debida diligencia con la clientela de los bancos» (octubre de 2001) y «Gestión consolidada del riesgo KYC» (octubre de 2004). El distractor más tentador invierte los años. Los documentos de 2005 y 2012 no se sustituyen: el párr. 8 los cita como documentos que deben leerse conjuntamente.", "ref": "Párr. 9 · Tema 3.2.2"}, {"id": "B044", "tema": "bcbs2014", "tipo": "caso", "q": "En un repaso, Tomás afirma: «Basilea 2014 no dice nada sobre PEP; todo lo remite al GAFI». ¿Qué precisión es la correcta?", "a": "No desarrolla específicamente las PEP por tratarlas el GAFI, pero exige diligencia reforzada obligatoria con PEP extranjeras", "o": ["Se equivoca: el documento exige diligencia reforzada obligatoria con toda PEP, sin distinguir en ningún caso su origen ni su cargo", "Tiene razón: el documento omite por completo a las PEP y no establece ninguna medida de diligencia debida referida a ellas", "No desarrolla específicamente las PEP por tratarlas el GAFI, pero exige diligencia reforzada obligatoria con PEP extranjeras", "Se equivoca: el documento dedica un anexo completo a las PEP, junto con la banca privada y las estructuras jurídicas singulares"], "x": "El párr. 9 dice que las PEP, la banca privada y las estructuras jurídicas singulares «no se desarrollan específicamente» porque ya las trata el GAFI; los anexos se dedican a terceros y a corresponsalía. Pero el párr. 34 establece que la diligencia reforzada «podrá ser esencial» con una PEP y «es obligatoria en el caso de PEP extranjeras». Esa obligación expresa se refiere solo a las extranjeras. El párr. 50 también pide cotejar periódicamente las bases de clientes para detectar PEP extranjeras y aplicarles diligencia reforzada.", "ref": "Párr. 9 · Tema 3.2.2"}, {"id": "B045", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Sendero, pequeña institución especializada en crédito agrícola, sostiene que las directrices de Basilea no le aplican por su tamaño. Según el párrafo 11:", "a": "Aplican a todos los bancos; algunos requisitos podrán requerir adaptación a su tamaño o a su modelo de negocio", "o": ["Tiene razón: las directrices se dirigen a bancos con actividad internacional y a grupos bancarios, no a entidades pequeñas", "Aplican a todos los bancos, y el propio documento detalla los ajustes específicos para las instituciones pequeñas", "Aplican a todos los bancos; algunos requisitos podrán requerir adaptación a su tamaño o a su modelo de negocio", "Aplican solo si su supervisor así lo determina tras evaluar el riesgo del sector"], "x": "El párr. 11 dice que las directrices «resultan aplicables a todos los bancos» y que algunos requisitos «podrán requerir una adaptación» a instituciones pequeñas o especializadas; pero aclara que «tales ajustes desbordan el alcance de este documento». Por eso es falso que el documento detalle esos ajustes.", "ref": "Párr. 11 · Tema 3.2.2"}, {"id": "B046", "tema": "bcbs2014", "tipo": "caso", "q": "En el país de Banco Ceiba, la supervisión PBC/FT se reparte entre el supervisor bancario y la unidad de inteligencia financiera. Para efectos de las directrices, ¿qué señala el párrafo 12?", "a": "La referencia al «supervisor» puede extenderse a esas otras autoridades, y el supervisor bancario coopera con ellas", "o": ["La referencia al «supervisor» comprende solo al supervisor bancario, por lo que la UIF queda fuera de las directrices", "La unidad de inteligencia financiera sustituye al supervisor bancario en todo lo relativo a la Parte IV del documento", "El supervisor bancario debe concentrar toda la supervisión PBC/FT para poder aplicar correctamente las directrices", "La referencia al «supervisor» puede extenderse a esas otras autoridades, y el supervisor bancario coopera con ellas"], "x": "El párr. 12 reconoce la variedad de mecanismos nacionales, en particular el reparto de funciones entre supervisores bancarios y otras autoridades como las UIF; por eso «la referencia al “supervisor” puede extenderse a esas autoridades», y donde la autoridad es compartida, el supervisor bancario coopera con las demás. No exige concentrar la supervisión ni excluye a la UIF.", "ref": "Párr. 12 · Tema 3.2.2"}, {"id": "B047", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el párrafo 84, ¿qué gama de sanciones deberán tener la facultad de imponer los supervisores cuando los bancos incumplan sus requisitos PBC/FT?", "a": "Eficaces, proporcionadas y disuasorias", "o": ["Correctivas, confidenciales y negociadas con el banco", "Pecuniarias, graduadas y previamente publicadas", "Eficaces, proporcionadas y disuasorias", "Ejemplares, uniformes y de aplicación inmediata"], "x": "El párr. 84 dice que los supervisores «tendrán la facultad de imponer una gama de sanciones eficaces, proporcionadas y disuasorias». El mismo párrafo cita la Recomendación 26 del GAFI: las medidas prudenciales relevantes para PBC/FT deberían aplicarse de forma similar, incluida la supervisión consolidada de todo el grupo. Ninguna de las otras tríadas aparece en el texto.", "ref": "Párr. 84 · Tema 3.2.2"}, {"id": "B048", "tema": "bcbs2014", "tipo": "caso", "q": "Tras evaluar los riesgos de Banco Cobre y sus controles, la supervisora Elena usa esa información para dimensionar el examen y decidir qué especialistas asigna. ¿Qué inciso del enfoque del párrafo 86 está aplicando?", "a": "El inciso (v): utilizar la información para asignar recursos y dimensionar el examen", "o": ["El inciso (iii): evaluar los riesgos en su base de clientes, productos, servicios y geografías", "El inciso (i): conocer los riesgos presentes en la jurisdicción", "El inciso (v): utilizar la información para asignar recursos y dimensionar el examen", "El inciso (iv): evaluar la suficiencia y eficacia de los controles, incluidas las medidas CDD"], "x": "El párr. 86 ordena el enfoque en función del riesgo del supervisor en cinco incisos: (i) conocer los riesgos de la jurisdicción; (ii) evaluar la suficiencia de la evaluación del banco frente a la nacional; (iii) evaluar los riesgos de la entidad; (iv) evaluar la suficiencia y eficacia de los controles; y (v) utilizar la información para asignar recursos, dimensionar el examen e identificar la experiencia y destrezas necesarias. Elena ya hizo (iii) y (iv); ahora aplica (v).", "ref": "Párr. 86 · Tema 3.2.2"}, {"id": "B049", "tema": "bcbs2014", "tipo": "caso", "q": "La clientela de Banco Jade presenta perfiles de alto riesgo. Según el párrafo 87, ¿qué implicación tiene esto para el ciclo supervisor?", "a": "Su perfil de riesgo se usa para fijar frecuencia y calendario, y podría requerir análisis más frecuentes", "o": ["Ninguna: la frecuencia del ciclo supervisor es igual para todos los bancos, con independencia de su perfil", "Que el supervisor delegue el examen en auditores externos especializados en las líneas de alto riesgo", "Que el examen se limite a revisar sus políticas y procedimientos escritos, sin muestrear cuentas ni STR", "Su perfil de riesgo se usa para fijar frecuencia y calendario, y podría requerir análisis más frecuentes"], "x": "El párr. 87 dice que el perfil de riesgo del banco deberá utilizarse para determinar la frecuencia y calendario del ciclo supervisor, y que los bancos con clientela de alto riesgo «podrán requerir análisis más frecuentes». Además, el proceso supervisor no solo analiza políticas, sino también, en su caso, documentación de clientes, muestreo de cuentas y transacciones, informes internos y STR.", "ref": "Párr. 87 · Tema 3.2.2"}, {"id": "B050", "tema": "bcbs2014", "tipo": "caso", "q": "El supervisor detecta que Banco Ónix y algunos de sus altos cargos incumplen manifiestamente sus propios procedimientos internos PBC/FT. Según el párrafo 88, ¿qué deben dejar claro los supervisores?", "a": "Que adoptarán las medidas oportunas, que podrían ser severas y públicas si las circunstancias lo justifican", "o": ["Que solo actuarán si el incumplimiento genera pérdidas para la propia entidad", "Que las medidas se dirigirán a la entidad y no a sus altos cargos, para no afectar la continuidad del negocio", "Que adoptarán las medidas oportunas, que podrían ser severas y públicas si las circunstancias lo justifican", "Que las medidas serán confidenciales, a fin de proteger la reputación del banco y del sistema bancario nacional"], "x": "El párr. 88 dice que los supervisores deberán dejar claro que adoptarán las medidas oportunas, «que podrían ser severas y públicas si las circunstancias así lo justifican», contra los bancos «y sus altos cargos» que manifiestamente incumplan. El deber supervisor protege no solo la seguridad y solvencia del banco, sino también la integridad del sistema bancario, por lo que no se condiciona a pérdidas.", "ref": "Párr. 88 · Tema 3.2.2"}, {"id": "B051", "tema": "bcbs2014", "tipo": "caso", "q": "La filial de Grupo Vértice en un país de acogida no puede aplicar la más estricta entre la norma local y la del grupo. Según el párrafo 89, ¿qué deben garantizar los supervisores?", "a": "Que se documenten los motivos y las diferencias y se apliquen medidas paliativas para mitigar los riesgos", "o": ["Que se documenten los motivos y las diferencias y se apliquen medidas paliativas para mitigar los riesgos", "Que la filial aplique la norma menos estricta sin más trámite, dado que prevalece la legislación de acogida", "Que la oficina central apruebe la excepción sin documentarla, para no generar contingencias con la autoridad", "Que la filial cierre de inmediato sus operaciones, pues no existe alternativa a aplicar la norma más estricta"], "x": "El párr. 89 establece que, cuando haya discrepancia, se aplicarán los requisitos más estrictos; y que, si la sucursal o filial no puede aplicar la más estricta, los supervisores deberán garantizar que «se documentarán los motivos y las diferencias entre ambas» y se aplicarán «las oportunas medidas paliativas». El cierre aparece en otros párrafos (65 y 93) como medida posible «cuando proceda» o «en su caso», no como consecuencia automática.", "ref": "Párr. 89 · Tema 3.2.2"}, {"id": "B052", "tema": "bcbs2014", "tipo": "caso", "q": "Los supervisores del país de origen de Banco Cuarzo inspeccionan in situ su filial extranjera y piden examinar archivos de clientes. La filial invoca el secreto bancario local. Según el párrafo 90:", "a": "Ese uso con fines supervisores legítimos, salvaguardado por confidencialidad, no deberá verse entorpecido por el secreto bancario local", "o": ["Ese uso con fines supervisores legítimos, salvaguardado por confidencialidad, no deberá verse entorpecido por el secreto bancario local", "El secreto bancario local prevalece, por lo que el supervisor de origen solo puede consultar información agregada de la filial", "El acceso requiere que cada cliente incluido en la muestra autorice por escrito la entrega de su información al supervisor", "El supervisor de origen debe pedir al de acogida que inspeccione en su lugar, porque no puede muestrear cuentas en el extranjero"], "x": "El párr. 90 dice que los supervisores de origen no deberán sufrir trabas en las inspecciones in situ, que pueden exigir examinar archivos de clientes y muestrear cuentas en la jurisdicción de acogida, y que ese uso con fines supervisores legítimos, salvaguardado por cláusulas de confidencialidad, «no deberá verse entorpecido por la legislación local sobre secreto bancario o protección de datos». El supervisor de acogida conserva su responsabilidad y debe cooperar.", "ref": "Párr. 90 · Tema 3.2.2"}, {"id": "B053", "tema": "bcbs2014", "tipo": "caso", "q": "Las trabas al intercambio de información en la jurisdicción de acogida de Banco Granito resultan insuperables y no hay un arreglo alternativo satisfactorio. Según el párrafo 93, ¿qué deberán hacer los supervisores de origen?", "a": "Informar al supervisor de acogida de que el banco podría quedar sujeto a actuaciones supervisoras adicionales", "o": ["Solicitar al GAFI que incluya a esa jurisdicción en su declaración pública de países con deficiencias estratégicas PBC/FT", "Abstenerse de actuar, porque esas filiales solo las supervisa la autoridad local", "Informar al supervisor de acogida de que el banco podría quedar sujeto a actuaciones supervisoras adicionales", "Ordenar al banco que aplique en la jurisdicción de acogida las normas locales, aunque sean menos estrictas que las del grupo"], "x": "El párr. 93 prevé que, si las trabas resultan insuperables y no hay arreglo alternativo satisfactorio, los supervisores de origen deberán informar al supervisor de acogida de que el banco podría quedar sujeto a actuaciones supervisoras adicionales, como reforzar las medidas sobre el grupo, «incluida, en su caso», la exigencia de cerrar operaciones en esa jurisdicción. No se prevé acudir al GAFI ni abstenerse.", "ref": "Párr. 93 · Tema 3.2.2"}, {"id": "B054", "tema": "bcbs2014", "tipo": "memoria", "q": "Si la legislación de una jurisdicción de acogida restringe la divulgación de información de clientes a «terceros», ¿qué considera fundamental el Comité según el párrafo 95?", "a": "Que la oficina central o banco matriz y los supervisores de origen queden claramente excluidos de la definición de terceros", "o": ["Que la oficina central obtenga en cada caso el consentimiento expreso del cliente antes de recibir cualquier información suya", "Que la oficina central o banco matriz y los supervisores de origen queden claramente excluidos de la definición de terceros", "Que la sucursal o filial deje de transmitir información a su matriz mientras la legislación local mantenga la restricción", "Que la información se transmita a los supervisores de acogida, quienes decidirán si la comparten con los de origen"], "x": "El párr. 95 dice que no hay razones que justifiquen impedir la transmisión de información de clientes a la oficina central o banco matriz con fines de gestión del riesgo, y que, si la ley local restringe la divulgación a «terceros», «es fundamental» que la oficina central o banco matriz y los supervisores de origen queden claramente excluidos de esa definición. Además, insta a levantar esas restricciones.", "ref": "Párr. 95 · Tema 3.2.2"}, {"id": "B055", "tema": "bcbs2014", "tipo": "caso", "q": "Grupo Estela tiene una filial en un país de acogida cuyos requisitos PBC/FT son más estrictos que los de la política del grupo. Según el párrafo 63:", "a": "La política del grupo deberá permitir a la filial adoptar y aplicar los requisitos locales de la jurisdicción de acogida", "o": ["La filial podrá elegir cada año entre la política del grupo o la local, siempre que documente por escrito su decisión", "La política del grupo deberá permitir a la filial adoptar y aplicar los requisitos locales de la jurisdicción de acogida", "La oficina central deberá pedir al supervisor de acogida una dispensa para que la filial aplique solo la política del grupo", "La filial deberá aplicar la política del grupo, porque la coherencia de todo el grupo prevalece sobre la norma local"], "x": "El párr. 63 pide políticas PBC/FT a escala de grupo coherentes, pero cuando los requisitos de acogida sean más estrictos que los del grupo, «la política del grupo deberá permitir a la sucursal o filial de que se trate adoptar y aplicar los requisitos locales». La coherencia del grupo no se usa para rebajar el estándar local más exigente.", "ref": "Párr. 63 · Tema 3.2.2"}, {"id": "B056", "tema": "bcbs2014", "tipo": "memoria", "q": "Cuando los requisitos reglamentarios o legales mínimos de los países de origen y de acogida difieren, ¿qué normas aplican las oficinas ubicadas en las jurisdicciones de acogida según el párrafo 64?", "a": "Las más estrictas", "o": ["Las más estrictas", "Las del país de origen", "Las del país de acogida", "Las que elija la oficina central"], "x": "El párr. 64 concluye: «Cuando los requisitos reglamentarios o legales mínimos de los países de origen y acogida difieran, las oficinas ubicadas en las jurisdicciones de acogida aplicarán las normas más estrictas». No es siempre la del origen ni siempre la local: es la más exigente de las dos. El párr. 89 retoma la idea desde la óptica del supervisor.", "ref": "Párr. 64 · Tema 3.2.2"}, {"id": "B057", "tema": "bcbs2014", "tipo": "caso", "q": "La sucursal de Banco Cénit en un país de acogida no puede aplicar adecuadamente las normas PBC/FT porque ese país no lo permite. Conforme al párrafo 65, ¿qué procede?", "a": "Que el responsable ejecutivo de PBC/FT informe a los supervisores de origen y se contemplen medidas adicionales", "o": ["Que el responsable ejecutivo de PBC/FT informe a los supervisores de origen y se contemplen medidas adicionales", "Que el auditor externo de la sucursal informe al supervisor de acogida y se suspenda la aplicación de la política del grupo", "Que la sucursal aplique las normas locales y lo informe al grupo en su reporte anual", "Que la oficina central cierre la sucursal, porque el cierre es la medida prevista sin valorar otras alternativas"], "x": "El párr. 65, conforme a las normas GAFI (nota interpretativa a la R. 18), dice que si el país de acogida no permite la adecuada aplicación de las normas, el responsable ejecutivo de PBC/FT deberá informar a los supervisores de origen y deberán contemplarse medidas adicionales, «incluida, cuando proceda, la cancelación de las operaciones». El cierre es una opción posible, no la única ni automática.", "ref": "Párr. 65 · Tema 3.2.2"}, {"id": "B058", "tema": "bcbs2014", "tipo": "memoria", "q": "¿Por qué reconoce el Comité, en el párrafo 66, que aplicar procedimientos PBC/FT en todo el grupo es más difícil que muchos otros procesos de gestión del riesgo?", "a": "Porque algunas jurisdicciones siguen limitando la capacidad de los bancos para comunicar nombres y saldos de clientes a otros países", "o": ["Porque las filiales, a diferencia de las sucursales, no están autorizadas a intercambiar información de clientes con la oficina central", "Porque algunas jurisdicciones siguen limitando la capacidad de los bancos para comunicar nombres y saldos de clientes a otros países", "Porque las normas GAFI prohíben a los grupos bancarios centralizar la información de sus clientes en la jurisdicción de origen del grupo", "Porque las diferencias contables entre países impiden consolidar con suficiente precisión los saldos de los clientes a escala del grupo"], "x": "El párr. 66 explica la dificultad así: «algunas jurisdicciones continúan limitando la capacidad de los bancos para comunicar nombres y saldos de clientes a otros países». Por eso considera fundamental que, con las debidas salvaguardas jurídicas, los bancos puedan intercambiar información con su oficina central o banco matriz, y aclara que «esto es aplicable tanto a sucursales como a filiales».", "ref": "Párr. 66 · Tema 3.2.2"}, {"id": "B059", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el párrafo 67, ¿cuáles pueden ser factores mitigadores del riesgo asociado a los clientes en el grupo?", "a": "Información adicional del cliente, seguimientos más estrechos, actualizaciones más frecuentes y visitas al domicilio", "o": ["Aprobación del supervisor de acogida, cuestionarios del grupo, informes de burós de crédito y confirmaciones de otros bancos", "Información adicional del cliente, seguimientos más estrechos, actualizaciones más frecuentes y visitas al domicilio", "Certificaciones de terceros, seguros de responsabilidad, garantías reales del cliente y auditorías externas de periodicidad anual", "Declaraciones escritas del cliente, cierre de cuentas vinculadas y avisos previos al cliente"], "x": "El párr. 67 dice que los factores mitigadores «pueden incluir información adicional del cliente, seguimientos más estrechos, actualizaciones más frecuentes de datos personales y visitas de personal del banco al domicilio del cliente». Los distractores combinan medidas de otros contextos (certificaciones de terceros del Anexo 1, cuestionarios del Anexo 2) o que no aparecen en el texto.", "ref": "Párr. 67 · Tema 3.2.2"}, {"id": "B060", "tema": "bcbs2014", "tipo": "caso", "q": "Grupo Aurora clasifica a sus clientes con criterios de alto riesgo distintos en cada filial y en sus actividades subcontratadas. Según el párrafo 67, ¿qué deberá corregir?", "a": "Aplicar los mismos criterios en todo el banco, sus filiales, sucursales y actividades subcontratadas", "o": ["Aplicar criterios comunes en la oficina central, dejando libres a las filiales y a las actividades subcontratadas", "Aplicar criterios comunes en filiales y sucursales, excluyendo las actividades subcontratadas por ser de terceros", "Nada: cada filial debe fijar sus propios criterios de alto riesgo", "Aplicar los mismos criterios en todo el banco, sus filiales, sucursales y actividades subcontratadas"], "x": "El párr. 67 dice que los criterios para identificar a clientes de alto riesgo «deberán aplicarse en todo el banco, sus filiales y sucursales y en las actividades subcontratadas» y que los clientes de alto riesgo se identifican con esos mismos criterios en todo el grupo. El distractor tentador se apoya en otra idea real del párrafo: la política del grupo debe reconocer que una misma categoría podría plantear riesgos distintos en distintas jurisdicciones; eso no autoriza criterios propios por filial.", "ref": "Párr. 67 · Tema 3.2.2"}, {"id": "B061", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Delta recibe un cliente recomendado por una filial de su mismo grupo financiero, sujeta a las mismas normas y supervisada a escala del grupo. Según el párrafo 69:", "a": "Podrá sopesar conceder mayor fiabilidad a su información, pero deberá cerciorarse de obtener la información del cliente", "o": ["Deberá repetir íntegramente la CDD, porque no puede otorgar mayor fiabilidad a ningún presentador interno", "Podrá sopesar conceder mayor fiabilidad a su información, pero deberá cerciorarse de obtener la información del cliente", "Podrá prescindir de obtener la información del cliente, porque la filial ya la conserva a escala del grupo", "Deberá rechazar la recomendación, porque no se admite recurrir a presentadores del mismo grupo financiero"], "x": "El párr. 69 permite recurrir a un presentador del mismo grupo y «sopesar conceder un mayor grado de fiabilidad» a su información, siempre que esté sujeto a las mismas normas y su aplicación se supervise a escala del grupo. Pero el banco «deberá cerciorarse de que obtiene la información del cliente», porque podría tener que remitirla a las FIU si una transacción resulta sospechosa.", "ref": "Párr. 69 · Tema 3.2.2"}, {"id": "B062", "tema": "bcbs2014", "tipo": "trampa", "q": "Sobre el recurso a los procedimientos de otros bancos cuando se recomienda un negocio, ¿qué afirmación NO se ajusta al párrafo 69?", "a": "El banco puede recurrir a presentadores sujetos a normas menos estrictas si ya identificaron al cliente", "o": ["La información del cliente recomendado podría tener que remitirse a las FIU si una transacción resultara sospechosa", "El banco puede recurrir a presentadores sujetos a normas menos estrictas si ya identificaron al cliente", "El banco deberá entender el grado en que la legislación PBC/FT le permite recurrir a procedimientos de otros bancos", "Los bancos vigilarán y evaluarán las normas PBC/FT de la jurisdicción del banco que recomienda"], "x": "El párr. 69 es tajante: «El banco no deberá recurrir a presentadores que estén sujetos a normas menos estrictas que las que rigen sus propios procedimientos PBC/FT». Que el presentador ya haya identificado al cliente no cambia esa regla. Las otras tres afirmaciones reproducen el mismo párrafo.", "ref": "Párr. 69 · Tema 3.2.2"}, {"id": "B063", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Horizonte tiene actividad nacional e internacional, con filiales en cuatro países. Según el párrafo 75, ¿qué figura deberá nombrar y cuál es su responsabilidad central?", "a": "Un responsable de PBC/FT del grupo que cree, coordine y evalúe a escala del grupo una única estrategia PBC/FT", "o": ["Un responsable PBC/FT en cada filial, con total autonomía para definir su estrategia sin coordinación central", "Un auditor interno de grupo que apruebe las estrategias PBC/FT que cada filial diseñe para su jurisdicción", "Un comité de filiales que vote cada año las políticas PBC/FT, sin facultades para impartir órdenes a las entidades", "Un responsable de PBC/FT del grupo que cree, coordine y evalúe a escala del grupo una única estrategia PBC/FT"], "x": "El párr. 75 dice que los bancos con actividad nacional e internacional deberán nombrar un responsable ejecutivo de PBC/FT para todo el grupo, con la responsabilidad de «crear, coordinar y evaluar a escala del grupo la aplicación de una única estrategia PBC/FT», que incluye políticas obligatorias y autorización para impartir órdenes a todas las sucursales, filiales y entidades subordinadas.", "ref": "Párr. 75 · Tema 3.2.2"}, {"id": "B064", "tema": "bcbs2014", "tipo": "caso", "q": "El responsable de PBC/FT de Grupo Faro quiere verificar el cumplimiento en una sucursal extranjera del grupo. Según el párrafo 76, ¿qué puede hacer?", "a": "Cerciorarse del cumplimiento, incluso con visitas periódicas in situ, y en caso necesario impartir órdenes en todo el grupo", "o": ["Revisar el cumplimiento de requisitos nacionales, porque los internacionales corresponden a cada jurisdicción de acogida", "Cerciorarse del cumplimiento, incluso con visitas periódicas in situ, y en caso necesario impartir órdenes en todo el grupo", "Emitir recomendaciones no vinculantes, ya que la facultad de impartir órdenes corresponde a cada filial o sucursal", "Pedir informes escritos, porque las visitas in situ corresponden a los supervisores de acogida y no al grupo"], "x": "El párr. 76 dice que la función del responsable de PBC/FT del grupo incluye el seguimiento continuo del cumplimiento de requisitos nacionales e internacionales en todo el grupo; deberá cerciorarse del cumplimiento «incluso realizando visitas periódicas in situ» y, en caso necesario, «deberá estar facultado para impartir órdenes o adoptar las medidas oportunas en todo el grupo».", "ref": "Párr. 76 · Tema 3.2.2"}, {"id": "B065", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el párrafo 77, ¿qué deberían estar obligadas a hacer las filiales y sucursales en materia de intercambio de información dentro del grupo?", "a": "Suministrar de forma proactiva a la oficina central información sobre clientes y actividades de alto riesgo y atender sus solicitudes a tiempo", "o": ["Compartir la información de clientes solo entre sucursales y filiales, sin informar a la oficina central para proteger los datos locales", "Suministrar a la oficina central la información que esta les solicite de forma expresa, sin enviarle nada por iniciativa propia", "Suministrar de forma proactiva a la oficina central información sobre clientes y actividades de alto riesgo y atender sus solicitudes a tiempo", "Remitir directamente a la UIF del país de origen la información de clientes de alto riesgo, sin hacerla pasar por la oficina central"], "x": "El párr. 77 dice que las filiales y sucursales «deberían estar obligadas a suministrar de forma proactiva a la oficina central información sobre clientes y actividades de alto riesgo» relevante para las normas globales, y a responder de manera oportuna a las solicitudes de la oficina central o banco matriz. La clave que confunde es «proactiva»: no basta con esperar a que la oficina central pregunte.", "ref": "Párr. 77 · Tema 3.2.2"}, {"id": "B066", "tema": "bcbs2014", "tipo": "caso", "q": "La sucursal de Banco Brújula en un país de acogida notifica actividad potencialmente sospechosa de un cliente. Según el párrafo 79, ¿qué deberá hacer la función global de gestión del riesgo BC/FT del grupo?", "a": "Evaluar los riesgos y comprobar si otras sucursales o filiales mantienen cuentas del mismo cliente o de partes vinculadas", "o": ["Ordenar el cierre inmediato de todas las cuentas del cliente en el grupo, sin evaluar los riesgos ni valorar otras medidas", "Evaluar los riesgos y comprobar si otras sucursales o filiales mantienen cuentas del mismo cliente o de partes vinculadas", "Limitarse a archivar la notificación, pues evaluar el riesgo del cliente corresponde a la sucursal que lo detectó y no al grupo", "Remitir el caso al supervisor de acogida y abstenerse de consultar a otras entidades del grupo por razones de privacidad"], "x": "El párr. 79 dice que la función global deberá evaluar los posibles riesgos de las actividades notificadas por sucursales y filiales y, cuando proceda, los riesgos en todo el grupo, y contar con procedimientos para comprobar si otras sucursales o filiales mantienen cuentas del mismo cliente, incluidas partes vinculadas o de su mismo grupo. Las restricciones y el cierre de cuentas se prevén «cuando proceda», no en automático.", "ref": "Párr. 79 · Tema 3.2.2"}, {"id": "B067", "tema": "bcbs2014", "tipo": "caso", "q": "La oficina central de Grupo Atlas recibe un listado de individuos sospechosos de colaborar en actividades de FT. Según el párrafo 80, ¿qué puede exigir a sus sucursales y filiales?", "a": "Que cotejen sus archivos con ese listado y notifiquen las coincidencias", "o": ["Que confirmen que cuentan con sistemas automáticos de detección, sin cotejar", "Nada, porque cada filial coteja listados por orden de su autoridad local, no del grupo", "Que bloqueen todas las cuentas de clientes del país señalado en el listado", "Que cotejen sus archivos con ese listado y notifiquen las coincidencias"], "x": "El párr. 80 dice que la oficina central «ha de poder exigir a todas sus sucursales y filiales el cotejo de sus archivos con determinados listados o solicitudes» para comprobar la presencia de individuos u organizaciones sospechosos de colaborar e instigar BC y FT, «y que notifiquen las coincidencias». No se trata de bloquear por país ni de depender solo de la autoridad local.", "ref": "Párr. 80 · Tema 3.2.2"}, {"id": "B068", "tema": "bcbs2014", "tipo": "caso", "q": "Grupo Prisma, que integra un banco, una casa de valores y una aseguradora, ofrece seguros a clientes bancarios mediante ventas cruzadas. Según los párrafos 82 y 83, ¿qué debe cuidar?", "a": "Estar atento a las diferencias entre sectores y aplicar los requisitos PBC/FT oportunos a los correspondientes sectores", "o": ["Aplicar a la aseguradora exactamente los requisitos bancarios, porque no se admiten variaciones entre sectores del grupo", "Estar atento a las diferencias entre sectores y aplicar los requisitos PBC/FT oportunos a los correspondientes sectores", "Tratar cada sector por separado, sin intercambiar información sobre la identidad de los clientes entre sus distintas unidades", "Aplicar a todos los sectores los requisitos del sector con normas menos estrictas, a fin de facilitar las ventas cruzadas"], "x": "El párr. 83 reconoce que las diferencias entre sectores «podrán requerir o justificar variaciones» de los requisitos PBC/FT y pide al grupo estar atento a ellas en las ventas cruzadas, aplicando los requisitos oportunos a cada sector. El párr. 82 añade que los grupos mixtos deberán vigilar e intercambiar información sobre identidad, transacciones y cuentas en todo el grupo, y estar atentos a clientes que usan servicios de diferentes sectores.", "ref": "Párr. 82–83 · Tema 3.2.2"}, {"id": "B069", "tema": "bcbs2014", "tipo": "memoria", "q": "Cuando un gran banco centraliza sistemas de procesamiento y bases de datos, ¿qué deberá hacer según el párrafo 74?", "a": "Documentar e integrar las funciones locales y centralizadas de seguimiento para vigilar patrones en todo el grupo", "o": ["Mantener separados el seguimiento local y el centralizado para que cada uno vigile solo los patrones de su ámbito", "Eliminar el seguimiento local, pues la vigilancia centralizada sustituye por completo a la de cada sucursal o filial", "Solicitar autorización a cada supervisor de acogida antes de trasladar datos de clientes a los sistemas centrales", "Documentar e integrar las funciones locales y centralizadas de seguimiento para vigilar patrones en todo el grupo"], "x": "El párr. 74 dice que, al centralizar sistemas y bases de datos, el banco deberá documentar e integrar adecuadamente las funciones locales y centralizadas de seguimiento de transacciones y cuentas, para vigilar patrones de posibles actividades sospechosas «en todo el grupo y no solo a escala local o centralizada». Integrar es lo opuesto a eliminar o separar.", "ref": "Párr. 74 · Tema 3.2.2"}, {"id": "B070", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el párrafo 73, ¿qué alcance tiene la vigilancia a escala consolidada de las relaciones, saldos y actividades de importancia con clientes?", "a": "Abarca cuentas dentro o fuera del balance, activos en administración o en fideicomiso, sin importar dónde se mantengan", "o": ["Abarca las cuentas que se mantengan en la jurisdicción de origen de la oficina central, no las del extranjero", "Abarca solo las cuentas registradas dentro del balance de la oficina central, sin incluir las de las filiales extranjeras", "Abarca las cuentas dentro y fuera del balance, pero excluye los activos en administración y los fideicomisos del grupo", "Abarca cuentas dentro o fuera del balance, activos en administración o en fideicomiso, sin importar dónde se mantengan"], "x": "El párr. 73 dice que el banco deberá vigilar a escala consolidada las relaciones, saldos y actividades de importancia con clientes, «con independencia de si las cuentas se mantienen dentro del balance, fuera del balance, como activos en administración o en fideicomiso, e independientemente del lugar en que se mantengan». Además, debe integrar la información considerando a los beneficiarios efectivos y los fondos.", "ref": "Párr. 73 · Tema 3.2.2"}, {"id": "B071", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el Anexo 1, ¿qué exigen las normas GAFI a la institución financiera que recurre a un tercero para practicar la CDD?", "a": "Obtener inmediatamente la información necesaria sobre las tres medidas CDD objeto del recurso", "o": ["Obtener la información CDD solo cuando el supervisor la solicite", "Obtener inmediatamente la información necesaria sobre las tres medidas CDD objeto del recurso", "Practicar de nuevo las tres medidas CDD al inicio de la relación, sin poder apoyarse en la CDD del tercero", "Obtener la información de las tres medidas CDD dentro del plazo de conservación de registros de cinco años"], "x": "El Anexo 1, párr. 2, enumera las tres medidas que las normas GAFI permiten confiar a un tercero: (a) identificar y verificar al cliente; (b) identificar al beneficiario efectivo y adoptar medidas razonables para verificarlo; y (c) entender la finalidad y naturaleza prevista de la relación. Y añade que la institución que recurre al tercero debe obtener «inmediatamente» la información necesaria sobre esas tres medidas. El plazo de cinco años es de conservación de registros (párr. 52), no para obtener la información.", "ref": "Anexo 1, párr. 2 · Tema 3.2.2"}, {"id": "B072", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Mirador firma un contrato con una red de agentes hipotecarios para que apliquen, en nombre del banco, sus procedimientos de identificación de clientes. ¿Qué figura del Anexo 1 es esta?", "a": "Subcontratación o agencia", "o": ["Subcontratación o agencia", "Presentador del mismo grupo financiero", "Banca corresponsal anidada", "Recurso a terceros"], "x": "El Anexo 1, párr. 4, describe la subcontratación o agencia: el banco usa terceros, mediante vínculo contractual, para cumplir partes de sus obligaciones CDD, y la entidad subcontratada aplica las medidas en nombre del banco. En el recurso a terceros (párr. 2), en cambio, el banco se apoya en la CDD que ya practicó otra institución supervisada, que normalmente tiene una relación previa con el cliente. Los agentes hipotecarios son ejemplo de terceros usados por los bancos (párr. 13).", "ref": "Anexo 1, párr. 4 · Tema 3.2.2"}, {"id": "B073", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Vereda acepta a un cliente apoyándose en la CDD que ya le practicó otra institución financiera supervisada, con la que el cliente tenía una relación comercial previa. ¿Qué figura del Anexo 1 es esta?", "a": "Recurso a terceros", "o": ["Recurso a terceros", "Relación de agente y principal", "Subcontratación o agencia", "Corresponsalía bancaria"], "x": "El Anexo 1, párr. 2, describe el recurso a terceros: el banco se apoya en la CDD practicada por otras instituciones financieras o determinadas empresas o profesiones no financieras supervisadas; normalmente el tercero tiene una relación previa con el cliente. En la subcontratación o agencia, en cambio, el tercero actúa por contrato en nombre del banco y aplica las políticas de este (párr. 4 y 11).", "ref": "Anexo 1, párr. 2 · Tema 3.2.2"}, {"id": "B074", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el Anexo 1, ¿qué efecto tiene sobre la responsabilidad del banco recurrir a otro banco o institución financiera para practicar la CDD?", "a": "En modo alguno lo libera de su responsabilidad sobre la CDD y los demás requisitos PBC/FT", "o": ["Lo libera de la responsabilidad CDD si el tercero está en su misma jurisdicción y es supervisado", "Traslada al tercero la responsabilidad CDD si hay acuerdo escrito", "En modo alguno lo libera de su responsabilidad sobre la CDD y los demás requisitos PBC/FT", "Hace que la responsabilidad se comparta a partes iguales con el tercero durante toda la relación"], "x": "El Anexo 1, párr. 6, dice que el recurso a otro banco o institución financiera «en modo alguno libera al banco» de la responsabilidad de tener políticas y procedimientos CDD adecuados y de cumplir otros requisitos PBC/FT, como conocer la actividad prevista, si el cliente es de alto riesgo o si hay transacciones sospechosas. El acuerdo escrito es un criterio de evaluación, no una transferencia de responsabilidad.", "ref": "Anexo 1, párr. 6 · Tema 3.2.2"}, {"id": "B075", "tema": "bcbs2014", "tipo": "cifra", "q": "¿Cuántos criterios relevantes enumera el Anexo 1 para evaluar la razonabilidad del recurso a otro banco o institución financiera?", "a": "9 criterios, de (a) a (i)", "o": ["9 criterios, de (a) a (i)", "14 criterios, de (a) a (n)", "4 criterios, de (a) a (d)", "5 criterios, de (i) a (v)"], "x": "El Anexo 1, párr. 7, enumera 9 criterios, de (a) a (i): regulación y supervisión tan exhaustivas y relación previa; acuerdo por escrito; documentación y controles; posible certificación del tercero; información pública desfavorable; riesgo de cadenas; recurso a terceros como factor de riesgo; examen periódico; y contemplar el cese. No lo confundas con los 4 incisos del contrato de subcontratación (párr. 14) ni con los 9 factores de corresponsalía (Anexo 2).", "ref": "Anexo 1, párr. 7 · Tema 3.2.2"}, {"id": "B076", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Sabino evalúa apoyarse en la CDD de otra institución que ha sido sometida a medidas coercitivas por violaciones en materia PBC. Según los criterios del Anexo 1, ¿qué corresponde?", "a": "Tener debidamente en cuenta esa información pública desfavorable sobre el tercero", "o": ["Ignorarla, porque lo único relevante es que el tercero tenga relación previa con el cliente", "Pedir al supervisor del tercero que autorice de forma expresa el recurso del banco a su CDD", "Ignorarla si el tercero certifica por escrito que ya corrigió sus deficiencias en materia PBC", "Tener debidamente en cuenta esa información pública desfavorable sobre el tercero"], "x": "El criterio (e) del Anexo 1, párr. 7, dice que el banco deberá tener debidamente en cuenta informaciones públicas desfavorables sobre el tercero, «como estar sometido a medidas coercitivas por causa de deficiencias o violaciones en materia de PBC». La certificación del criterio (d) («podrá exigirse») es un criterio adicional; no permite ignorar el (e).", "ref": "Anexo 1, párr. 7 · Tema 3.2.2"}, {"id": "B077", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Tejo recibe la CDD de un tercero que, a su vez, se apoyó en la CDD practicada por otras dos entidades. Según los criterios del Anexo 1, ¿qué deberá hacer?", "a": "Identificar y mitigar el riesgo adicional de recurrir a esa cadena de recursos en vez de a una sola entidad", "o": ["Identificar y mitigar el riesgo adicional de recurrir a esa cadena de recursos en vez de a una sola entidad", "Aceptarla sin más, porque una cadena equivale a una relación directa con una sola entidad", "Rechazarla, porque el Anexo 1 prohíbe con carácter general las cadenas de recurso a terceros para la CDD", "Solicitar a cada entidad de la cadena que certifique ante el supervisor su programa PBC/FT de cada ejercicio anual"], "x": "El criterio (f) del Anexo 1, párr. 7, dice que el banco deberá identificar y mitigar cualquier riesgo adicional que plantee recurrir a una multitud de terceros (una cadena de recursos) en vez de mantener una relación directa con una sola entidad. El párr. 3 menciona que algunos países prohíben las cadenas, pero eso es una limitación nacional posible, no una prohibición general del Anexo.", "ref": "Anexo 1, párr. 7 · Tema 3.2.2"}, {"id": "B078", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Lumen opera solo por internet y encarga a una empresa externa la identificación de sus clientes en su nombre. Una revisión detecta fallas en esa CDD. Según el Anexo 1, ¿en quién recae la responsabilidad de satisfacer los requisitos CDD?", "a": "En el banco, aunque las funciones las desarrolle un tercero", "o": ["En la empresa externa, por haber asumido las funciones por contrato", "En el banco, aunque las funciones las desarrolle un tercero", "En ambos por igual, conforme al acuerdo escrito que hayan celebrado", "En el supervisor, que autorizó el modelo de negocio del banco digital"], "x": "El Anexo 1, párr. 9, dice: «Aunque las funciones de cumplimiento de PBC/FT pueden ser desarrolladas por terceros, la responsabilidad de satisfacer los requisitos CDD y PBC/FT continúa recayendo en el banco». También señala que los bancos que operan por teléfono o internet suelen usar terceros en mayor medida. El contrato escrito documenta obligaciones del tercero, pero no traslada la responsabilidad.", "ref": "Anexo 1, párr. 9 · Tema 3.2.2"}, {"id": "B079", "tema": "bcbs2014", "tipo": "caso", "q": "En el contrato de Banco Quetzal con un despacho de abogados que identifica clientes en su nombre, ¿qué debe garantizarse cuando el cliente esté presente en persona, según el Anexo 1?", "a": "Que el tercero inspeccione los documentos de identificación originales cuando la regulación o el banco lo requieran", "o": ["Que el tercero sustituya la identificación por una declaración jurada del cliente, conservando solo una copia simple", "Que el tercero aplique sus propios procedimientos de identificación, aunque difieran de los requisitos del banco", "Que el tercero omita la verificación, pues la presencia física del cliente basta para tener por verificada su identidad", "Que el tercero inspeccione los documentos de identificación originales cuando la regulación o el banco lo requieran"], "x": "El Anexo 1, párr. 14 (b), exige que el acuerdo escrito garantice que, cuando el cliente esté presente en persona, el tercero aplica procedimientos que incluyen «la inspección de los documentos de identificación originales cuando la regulación o el banco así lo requieran». El contrato también debe exigir la aplicación de los requisitos del banco (a), los requisitos para clientes no presentes (c) y la confidencialidad (d).", "ref": "Anexo 1, párr. 14 · Tema 3.2.2"}, {"id": "B080", "tema": "bcbs2014", "tipo": "trampa", "q": "Sobre la relación de subcontratación o agencia descrita en el Anexo 1, ¿qué afirmación NO es correcta?", "a": "El agente es legalmente independiente del banco, por lo que el cliente trata con un tercero ajeno a este", "o": ["Deberá existir un acuerdo por escrito que establezca las obligaciones PBC/FT y cómo las ejecutará el tercero", "El agente suele ser una prolongación legal del banco, y el tercero está obligado a aplicar sus políticas", "El agente es legalmente independiente del banco, por lo que el cliente trata con un tercero ajeno a este", "Los terceros no siempre están sujetos a obligaciones PBC/FT propias, aunque muchos suelen estarlo"], "x": "El Anexo 1, párr. 11, dice que, con arreglo a la legislación sobre agente y principal, «el agente suele ser una prolongación legal del banco» y que, cuando el cliente trata con un agente, «legalmente está tratando con el propio banco»; por eso el tercero debe aplicar las políticas del banco. El acuerdo escrito está en el párr. 10 y la nota de que los terceros no siempre están sujetos a obligaciones PBC/FT, en el párr. 12.", "ref": "Anexo 1, párr. 11 · Tema 3.2.2"}, {"id": "B081", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Norteño presta a Banco Isleño servicios de transferencias internacionales y compensación de cheques, porque Isleño no tiene red internacional. Según el Anexo 2, ¿quién es quién?", "a": "Norteño es el banco corresponsal y su cliente es Isleño, el banco correspondiente", "o": ["Isleño es el banco corresponsal y su cliente es Norteño, el banco correspondiente", "Norteño es el banco correspondiente y los clientes de Isleño son también sus clientes", "Norteño es el banco corresponsal y su cliente es Isleño, el banco correspondiente", "Ambos son corresponsales y los clientes de Isleño son clientes directos de Norteño"], "x": "Conforme al Glosario del GAFI citado en el Anexo 2, párr. 1, la banca corresponsal es la provisión de servicios bancarios por un banco (el «corresponsal») a otro banco (el «correspondiente»). El párr. 3 precisa que el corresponsal no tiene por lo general relaciones directas con los clientes del correspondiente y que «el cliente del banco corresponsal es el banco correspondiente». Regla: el corresponsal presta; el correspondiente recibe.", "ref": "Anexo 2, párr. 3 · Tema 3.2.2"}, {"id": "B082", "tema": "bcbs2014", "tipo": "trampa", "q": "¿Cuál de los siguientes NO figura entre los factores que deberán considerar los bancos corresponsales según el Anexo 2?", "a": "El número de cajeros automáticos que opera el banco correspondiente en su país", "o": ["La posible utilización de la cuenta en una relación anidada", "La situación y calidad de la regulación y supervisión bancaria en el país del banco correspondiente", "El grupo al que pertenece el banco correspondiente y las jurisdicciones de sus filiales y sucursales", "El número de cajeros automáticos que opera el banco correspondiente en su país"], "x": "El Anexo 2, párr. 7, enumera 9 factores: (a) jurisdicción del correspondiente; (b) su grupo y las jurisdicciones de filiales y sucursales; (c) gestión, propiedad (beneficiarios efectivos o PEP), reputación, actividades, clientes y establecimientos; (d) finalidad de los servicios; (e) su negocio, mercados y base de clientes; (f) calidad de regulación y supervisión en su país; (g) sus políticas PBC y su CDD; (h) capacidad de conocer a terceros facultados a usar los servicios; e (i) corresponsalía anidada. La red de cajeros no aparece.", "ref": "Anexo 2, párr. 7 · Tema 3.2.2"}, {"id": "B083", "tema": "bcbs2014", "tipo": "caso", "q": "El director comercial de Banco Faro Sur quiere abrir una relación de corresponsalía con un banco extranjero que recibirá sus servicios. Según el Anexo 2, ¿quién deberá aprobar establecerla?", "a": "La alta dirección del banco corresponsal", "o": ["El supervisor del país en que opera el banco correspondiente", "El responsable de cumplimiento del banco correspondiente", "El director comercial de la línea de negocio del corresponsal", "La alta dirección del banco corresponsal"], "x": "El Anexo 2, párr. 12, dice que «la decisión de establecer (o continuar) una relación de corresponsalía bancaria deberá ser aprobada por la alta dirección del banco corresponsal». Faro Sur presta los servicios, así que es el corresponsal. El párr. 17 añade que la alta dirección deberá ser informada periódicamente de las relaciones de alto riesgo y de su seguimiento.", "ref": "Anexo 2, párr. 12 · Tema 3.2.2"}, {"id": "B084", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Coral recibe una solicitud de corresponsalía de un banco constituido en una jurisdicción donde no tiene presencia física y que no forma parte de un grupo financiero regulado. Según el Anexo 2:", "a": "Debería negarse a establecer la relación, por tratarse de un banco simulado", "o": ["Podría establecerla si el solicitante responde un cuestionario PBC/FT completo", "Debería consultar primero al GAFI si esa jurisdicción está sujeta a medidas correctivas", "Debería negarse a establecer la relación, por tratarse de un banco simulado", "Podría establecerla con diligencia reforzada y aprobación de su alta dirección"], "x": "El Anexo 2, párr. 14, dice que los bancos corresponsales «deberían negarse» a establecer o continuar una relación con un banco constituido en una jurisdicción donde no tenga presencia física y que no forme parte de un grupo financiero regulado, es decir, bancos simulados. Ni la diligencia reforzada ni el cuestionario (párr. 8) sustituyen esa negativa.", "ref": "Anexo 2, párr. 14 · Tema 3.2.2"}, {"id": "B085", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Granada decide permitir que clientes de su banco correspondiente usen directamente la cuenta de corresponsalía para sus propios negocios. Según el Anexo 2, ¿qué deberá hacer?", "a": "Intensificar el seguimiento y verificar que el correspondiente practicó una CDD adecuada a esos clientes", "o": ["Practicar directamente la CDD completa a cada cliente, sustituyendo la que haya aplicado el banco correspondiente", "Aplicar el seguimiento ordinario, porque el cliente del corresponsal sigue siendo solo el banco correspondiente", "Intensificar el seguimiento y verificar que el correspondiente practicó una CDD adecuada a esos clientes", "Informar a la alta dirección una vez al año, sin intensificar el seguimiento"], "x": "El Anexo 2, párr. 16, dice que si el corresponsal permite a terceros el uso directo de cuentas de corresponsalía (por ejemplo, cuentas de transferencia de pagos en otras plazas), deberá intensificar el seguimiento según sus riesgos y verificar que el correspondiente practicó una CDD adecuada a los clientes con acceso directo y que puede ofrecer información CDD relevante a solicitud del corresponsal.", "ref": "Anexo 2, párr. 16 · Tema 3.2.2"}, {"id": "B086", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el Anexo 2, ¿cómo deben entender los bancos el proceso CDD en sus relaciones de corresponsalía bancaria?", "a": "Como una evaluación real del riesgo BC, no como un «ejercicio de recogida de papel»", "o": ["Como un trámite documental que se agota al recibir el cuestionario del banco correspondiente", "Como una tarea delegable por completo en el supervisor del correspondiente", "Como una evaluación real del riesgo BC, no como un «ejercicio de recogida de papel»", "Como una revisión única al inicio de la relación, que no requiere una actualización posterior"], "x": "El Anexo 2, párr. 10, dice que los bancos no deberán considerar el proceso CDD como un «ejercicio de recogida de papel», sino como una evaluación real del riesgo BC; si es necesario, la recogida de información concluye con reuniones con la dirección y el responsable de cumplimiento del correspondiente, su regulador, las UIF y otras agencias. El párr. 11 añade que la información se revisa y actualiza periódicamente con enfoque de riesgo.", "ref": "Anexo 2, párr. 10 · Tema 3.2.2"}, {"id": "B087", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Pampa, como corresponsal, mantiene relaciones con tres filiales de un mismo grupo extranjero ubicadas en distintos países. Según el Anexo 2 (caso 2), ¿cómo debe evaluar el riesgo?", "a": "Tener en cuenta que pertenecen al mismo grupo, pero evaluar también los riesgos de cada relación comercial", "o": ["Tener en cuenta que pertenecen al mismo grupo, pero evaluar también los riesgos de cada relación comercial", "Evaluar cada relación como si fueran bancos sin vínculo, sin considerar que forman parte del mismo grupo", "Delegar la evaluación en la oficina central del grupo extranjero y limitarse a recibir sus conclusiones", "Evaluar a la oficina central del grupo extranjero, cuya evaluación cubre también a todas sus filiales"], "x": "El Anexo 2, párr. 19 (caso 2), dice que si el corresponsal mantiene relaciones con varias entidades de un mismo grupo en distintos países, deberá tener en cuenta que pertenecen al mismo grupo y, «aun así», evaluar los riesgos BC/FT de cada relación comercial. No lo confundas con el caso 1 (párr. 18): varias entidades de un mismo grupo corresponsal atienden a un mismo correspondiente, y la oficina central coordina.", "ref": "Anexo 2, párr. 19 · Tema 3.2.2"}, {"id": "B088", "tema": "bcbs2014", "tipo": "memoria", "q": "¿A qué se refiere la banca corresponsal «anidada» mencionada en el Anexo 2?", "a": "Al uso de una relación de corresponsalía por una serie de bancos correspondientes, a través de su relación con el directamente correspondiente", "o": ["A la relación que mantiene un mismo banco corresponsal con varias filiales de un grupo extranjero ubicadas en distintos países de acogida", "A la cadena en la que un banco se apoya en la CDD de un tercero que, a su vez, se apoyó en la CDD practicada por otros terceros distintos", "Al uso directo de las cuentas de corresponsalía por clientes del banco correspondiente para realizar sus propios negocios en otras plazas", "Al uso de una relación de corresponsalía por una serie de bancos correspondientes, a través de su relación con el directamente correspondiente"], "x": "La nota 43 define la banca corresponsal anidada como la utilización de una relación de corresponsalía por parte de una serie de bancos correspondientes mediante sus relaciones con el banco directamente correspondiente, para realizar transacciones y acceder a otros servicios. Es el factor (i) del Anexo 2, párr. 7. Los distractores describen el caso 2 (párr. 19), las cuentas de uso directo (párr. 16) y la cadena de recursos del Anexo 1.", "ref": "Nota 43 · Tema 3.2.2"}, {"id": "B089", "tema": "bcbs2014", "tipo": "cifra", "q": "¿Cuántas Recomendaciones del GAFI enlista el Anexo 3 como relevantes y qué carácter tiene ese listado?", "a": "14, en un listado no exhaustivo", "o": ["40, en un listado exhaustivo", "9, en un listado no exhaustivo", "14, en un listado no exhaustivo", "14, en un listado exhaustivo y cerrado"], "x": "El Anexo 3 enlista 14 Recomendaciones: 1, 2, 9, 10, 11, 12, 13, 15, 16, 17, 18, 20, 26 y 40. La nota 3 aclara que el listado «no es exhaustivo», por lo que otras Recomendaciones, incluidas las Notas Interpretativas, podrían ser pertinentes. El GAFI tiene 40 Recomendaciones, y el Anexo enlista algunas de las más relevantes para bancos y supervisores.", "ref": "Anexo 3 · Tema 3.2.2"}, {"id": "B090", "tema": "bcbs2014", "tipo": "cifra", "q": "En el listado del Anexo 3, ¿qué Recomendación del GAFI corresponde a la corresponsalía bancaria?", "a": "R. 13", "o": ["R. 13", "R. 16", "R. 17", "R. 12"], "x": "En el Anexo 3, la R. 13 es corresponsalía bancaria. Las vecinas se confunden con facilidad: R. 12, personas políticamente expuestas; R. 16, transferencias electrónicas; R. 17, recurso a terceros (la base del Anexo 1). Truco: 12 PEP, 13 corresponsalía, 16 transferencias, 17 terceros.", "ref": "Anexo 3 · Tema 3.2.2"}, {"id": "M001", "tema": "metriesgo", "tipo": "caso", "q": "Banco Ribera concluyó el diseño de su metodología de evaluación de Riesgos y su Oficial de Cumplimiento pregunta dónde debe quedar establecido ese diseño. ¿Qué responde la norma?", "a": "En su Manual de Cumplimiento o bien en algún otro documento o manual elaborado por la propia entidad.", "o": ["En su Manual de Cumplimiento o bien en algún otro documento o manual elaborado por la propia entidad.", "Únicamente en el Manual de Cumplimiento, porque la norma no admite que el diseño se docum
