 casos recientes de corrupción en México"], "x": "Las consultas del Cliente sobre la política PLD/FT de la institución o sobre la política aplicable a las PEP son un factor del III.2, dentro de lo que la conducta del propio Cliente delata. No es III.1: el subsecretario no se esconde detrás de un vehículo, un intermediario o un Propietario Real; pregunta él mismo por los controles. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C032", "tema": "anticor", "tipo": "caso", "q": "Cuando el ejecutivo de Casa de Bolsa Ébano le pide documentar de dónde proviene su patrimonio, una directora general de una entidad paraestatal cambia de tema, se molesta y pospone la entrega. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos"], "x": "Parecer incómodo o renuente a proporcionar información sobre la fuente de riqueza u origen de los recursos es un factor del III.2. No es III.3: aunque trabaja en una entidad paraestatal, el caso no describe la operación de una cuenta a nombre de la entidad, sino la conducta personal de la funcionaria. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C033", "tema": "anticor", "tipo": "caso", "q": "Un Cliente PEP nacional declaró a Banco Alcázar un ingreso mensual que es el doble del salario oficial publicado para su cargo y que no coincide con su declaración de activos difundida públicamente. ¿Qué factor se actualiza?", "a": "Su información es inconsistente con información públicamente disponible", "o": ["Estilo de vida, o cambios repentinos en este, no acorde con su salario", "Su información es inconsistente con información públicamente disponible", "Realiza consultas sobre la política PLD/FT de la institución o la aplicable a las PEP", "Parece incómodo o renuente a informar sobre la fuente de riqueza u origen de los recursos"], "x": "El III.2 señala como factor que la información del Cliente sea inconsistente con otra información públicamente disponible, como declaraciones de activos y salarios oficiales publicados. El detalle decisivo es la comparación con la fuente pública; no hay renuencia ni gasto de lujo descrito. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C034", "tema": "anticor", "tipo": "caso", "q": "En la apertura de su cuenta, un oficial mayor deja en blanco su actividad adicional y da un domicilio en el que nadie lo conoce; el banco no lo ha comparado con ninguna fuente pública. ¿Qué factor se actualiza?", "a": "Proporciona al Sujeto Supervisado información inexacta o incompleta", "o": ["Realiza consultas sobre la política PLD/FT de la institución o la aplicable a las PEP", "Proporciona al Sujeto Supervisado información inexacta o incompleta", "No puede o es reacio a explicar por qué hace negocios en lugares distintos a donde radica", "Parece incómodo o renuente a informar sobre la fuente de riqueza u origen de los recursos"], "x": "Proporcionar información inexacta o incompleta es un factor propio del III.2. A diferencia del factor de la información inconsistente con la pública, aquí el problema está en los datos mismos, no en el contraste con declaraciones o salarios publicados. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C035", "tema": "anticor", "tipo": "caso", "q": "Una presidenta municipal de Zacatecas compra, vende y renta inmuebles en Cancún, donde no radica, y opera esos negocios desde ahí; cuando el ejecutivo le pregunta el motivo, no da ninguna explicación. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos"], "x": "El Cliente que no puede o es reacio a explicar por qué hace negocios en lugares distintos a donde radica actualiza un factor del III.2. No es III.4: comprar inmuebles fuera es parte de la dispersión de recursos públicos a otros países en los casos mexicanos, mientras que aquí se trata de la propia funcionaria operando en otra ciudad del país. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C036", "tema": "anticor", "tipo": "caso", "q": "Un senador de alto nivel patrimonial, que reside y opera en su propia ciudad, busca abrir varias inversiones en una pequeña Sociedad Cooperativa de Ahorro y Préstamo de esa ciudad, cuyos socios son, en su mayoría, trabajadores de bajos ingresos. ¿Qué factor se actualiza?", "a": "Busca un Sujeto Supervisado que normalmente no atendería a Clientes de alto nivel patrimonial", "o": ["No puede o es reacio a explicar por qué hace negocios en lugares distintos a donde radica", "Transferencias repetidas hacia y desde países con los que no parece estar relacionado", "Estilo de vida, o cambios repentinos en este, no acorde con su salario", "Busca un Sujeto Supervisado que normalmente no atendería a Clientes de alto nivel patrimonial"], "x": "El III.2 señala al Cliente que busca los servicios de un Sujeto Supervisado que normalmente no atendería a Clientes de alto nivel patrimonial. No aplica el factor de los negocios lejos de donde radica, porque la cooperativa está en su propia ciudad. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C037", "tema": "anticor", "tipo": "caso", "q": "Rodrigo, Persona Vulnerable vinculada con una PEP nacional, recibe y envía desde su cuenta personal transferencias repetidas con dos países con los que no tiene negocios, familia ni residencia. No hay recursos públicos ni sociedades de por medio. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "Los fondos transferidos repetidamente hacia y desde países con los que el Cliente parece no estar relacionado son un factor del III.2. No es III.4, que describe la dispersión de recursos públicos de la red de fachadas a otros países, ni III.1, que habla de esquemas corporativos en jurisdicciones extranjeras. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C038", "tema": "anticor", "tipo": "caso", "q": "Un director general de una dependencia federal compra, a través de su cuñado, dos departamentos y los revende en menos de tres meses; las operaciones se hacen a nombre del propio director y el cuñado sólo gestiona la compra. ¿Qué factor se actualiza?", "a": "Adquiere bienes, directamente o por terceros, y los vuelve a negociar en corto plazo", "o": ["Cliente o allegado que de repente ejerce actividades económicas a las que era ajeno", "Adquiere bienes, directamente o por terceros, y los vuelve a negociar en corto plazo", "Involucramiento de varios familiares para el manejo de los recursos en cuentas bancarias", "Uso de familiares, asociados cercanos o empleados como Propietarios Reales"], "x": "El III.2 incluye al Cliente que adquiere, directamente o a través de terceros (por ejemplo, su grupo familiar o su círculo de amistades), bienes muebles e inmuebles y los vuelve a negociar en un corto plazo. El cuñado no aparece como Propietario Real ni emprende un negocio propio: es la vía para comprar y revender. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C039", "tema": "anticor", "tipo": "caso", "q": "La cuenta personal de un director de área, Cliente PEP nacional de Banco Alcázar, recibe depósitos frecuentes en efectivo y registra retiros en efectivo, sin justificación aparente. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El alto índice de uso de efectivo, en depósitos y/o retiros, en las cuentas del Cliente sin justificación aparente es un factor del III.2. El III.3 también habla de efectivo, pero de retiros en cuentas a nombre de Dependencias, Entidades u Órganos Públicos; aquí la cuenta es del funcionario. Fundamento: Apdo. III.2, factor del efectivo.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C040", "tema": "anticor", "tipo": "caso", "q": "En dos años, el patrimonio que un Cliente PEP nacional reporta a Banco Alcázar se triplicó, sin cambio de empleo ni otra fuente de ingresos que lo justifique; no se le conocen gastos ostentosos. ¿Qué factor se actualiza?", "a": "Incremento injustificado de los ingresos y patrimonio del Cliente o Usuario", "o": ["Incremento injustificado de los ingresos y patrimonio del Cliente o Usuario", "Sueldos dejados o transferidos en su totalidad sin pagar gasto alguno", "Adquiere bienes, directamente o por terceros, y los vuelve a negociar en corto plazo", "Estilo de vida, o cambios repentinos en este, no acorde con su salario"], "x": "El incremento injustificado de los ingresos y patrimonio del Cliente o Usuario es un factor del III.2. No es el del estilo de vida, porque el caso no describe consumo de lujo, sino crecimiento del patrimonio sin explicación. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C041", "tema": "anticor", "tipo": "memoria", "q": "Según la introducción del III.2, ¿en qué proceso también pueden considerarse esos comportamientos y características individuales?", "a": "Durante el proceso de investigación de posibles Operaciones Inusuales que surjan a partir de alertas", "o": ["Durante el proceso de investigación de posibles Operaciones Inusuales que surjan a partir de alertas", "Sólo al elaborar la evaluación de los riesgos de LD/FT a los que se encuentra expuesta toda la entidad", "Únicamente al clasificar al Cliente por Grado de Riesgo al inicio de la relación comercial, y no después", "Sólo cuando la UIF requiere información adicional sobre la PEP nacional o sobre la Persona Vulnerable"], "x": "La introducción del III.2 dice que esos comportamientos y características también pueden considerarse durante el proceso de investigación de posibles Operaciones Inusuales que surjan a partir de alertas. El Apartado III está pensado para el análisis de operaciones durante la relación comercial, no sólo para la clasificación inicial. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C042", "tema": "anticor", "tipo": "trampa", "q": "¿En qué grupo de factores NO aparece la familia de la PEP como parte de algún factor?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Dentro del Apartado III, la familia aparece en tres subapartados: como Propietario Real en el III.1, como familiar que emprende de repente o como vía para comprar y revender en el III.2, y como varios familiares que manejan los recursos en el III.4. El III.3 se refiere sólo a cómo operan las cuentas a nombre de Dependencias, Entidades u Órganos Públicos. Fundamento: Apdo. III.1 a III.4.", "ref": "Apdo. III.1 a III.4 · Tema 3.3.4"}, {"id": "anticor-C043", "tema": "anticor", "tipo": "trampa", "q": "¿Cuál de los siguientes factores NO pertenece al III.2?", "a": "Alto índice de retiros en efectivo de cuentas públicas durante los procesos electorales", "o": ["Alto índice de uso de efectivo en las cuentas del Cliente sin justificación aparente", "Parece incómodo o renuente a informar sobre la fuente de riqueza u origen de los recursos", "Realiza consultas sobre la política PLD/FT de la institución o la aplicable a las PEP", "Alto índice de retiros en efectivo de cuentas públicas durante los procesos electorales"], "x": "Los retiros en efectivo sin justificación o durante los procesos electorales son factor del III.3, porque se refieren a cuentas a nombre de Dependencias, Entidades u Órganos Públicos. El efectivo del III.2 es el de las cuentas del propio Cliente. Fundamento: Apdo. III.2 y III.3.", "ref": "Apdo. III.2 y III.3 · Tema 3.3.4"}, {"id": "anticor-C044", "tema": "anticor", "tipo": "caso", "q": "Al analizar una posible Operación Inusual de un Cliente PEP nacional de Banco Alcázar se identifica que Rodrigo, otro Cliente que no es PEP, recibe de él transferencias frecuentes; en un año, los ingresos y el patrimonio de Rodrigo crecen sin explicación que lo justifique. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos"], "x": "El III.2 aplica a PEP nacionales y a Personas Vulnerables, y entre sus factores está el incremento injustificado de los ingresos y patrimonio del Cliente. Rodrigo es Persona Vulnerable porque sus vínculos financieros con la PEP se identificaron en una posible Operación Inusual (Def. XIV), y no hay ocultamiento corporativo ni cuentas públicas en el caso. Fundamento: Apdo. III.2 y Def. XIV.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C045", "tema": "anticor", "tipo": "caso", "q": "Un Cliente PEP nacional, que vive y trabaja en Puebla, recibe cada semana transferencias desde un país europeo y las regresa al mismo país días después; no tiene negocios, familia ni vínculo alguno allá. No hay recursos públicos ni sociedades involucradas. ¿Qué factor se actualiza?", "a": "Transferencias repetidas hacia y desde países con los que no parece estar relacionado", "o": ["Dispersión de recursos a otros países, incluidos los de baja imposición fiscal", "Esquemas corporativos con empresas ubicadas en jurisdicciones extranjeras", "Alto índice de uso de efectivo en las cuentas del Cliente sin justificación aparente", "Transferencias repetidas hacia y desde países con los que no parece estar relacionado"], "x": "El III.2 señala los fondos que se transfieren repetidamente hacia y desde países con los que el Cliente parece no estar relacionado. La dispersión a otros países es del III.4 y se refiere a recursos públicos que salen de la red de fachadas; los esquemas en jurisdicciones extranjeras son del III.1. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C046", "tema": "anticor", "tipo": "caso", "q": "La mejor amiga de la secretaria de Salud estatal, Cliente PEP nacional de Banco Alcázar, que hasta hace poco era maestra, de pronto dirige, a través de un socio, una comercializadora de insumos médicos y abre cuenta en Banco Alcázar. ¿Qué factor se actualiza?", "a": "Cliente o allegado que de repente ejerce actividades económicas a las que era ajeno", "o": ["Cliente o allegado que de repente ejerce actividades económicas a las que era ajeno", "Adquiere bienes, directamente o por terceros, y los vuelve a negociar en corto plazo", "Incremento injustificado de los ingresos y patrimonio del Cliente o Usuario", "Uso de familiares, asociados cercanos o empleados como Propietarios Reales"], "x": "El III.2 incluye al Cliente, familiar o persona cercana que de repente ejerce, directamente o a través de terceros, actividades económicas a las que era ajeno hasta hacía poco tiempo. La amiga no aparece como Propietaria Real que oculte a la PEP: es ella quien de pronto ejerce una actividad nueva. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C047", "tema": "anticor", "tipo": "trampa", "q": "¿En qué grupo de factores NO aparece ningún elemento vinculado con el extranjero, como países o jurisdicciones extranjeras?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El extranjero aparece en el III.1 (esquemas en jurisdicciones extranjeras), en el III.2 (fondos con países sin relación aparente) y en el III.4 (fachadas constituidas en el extranjero y dispersión a otros países). Los factores del III.3 se limitan a la operación de las cuentas públicas. Fundamento: Apdo. III.1 a III.4.", "ref": "Apdo. III.1 a III.4 · Tema 3.3.4"}, {"id": "anticor-C048", "tema": "anticor", "tipo": "caso", "q": "La cuenta de la Secretaría de Desarrollo Social de un municipio, en Banco Alcázar, registra un alto número de retiros en efectivo durante las semanas de la campaña electoral local. ¿Qué grupo de factores se actualiza?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El alto índice de retiros en efectivo sin justificación aparente o durante los procesos electorales, en cuentas a nombre de Dependencias, Entidades u Órganos Públicos, es factor del III.3. El efectivo del III.2 es el de las cuentas personales del Cliente; aquí la titular es la dependencia. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3 · Tema 3.3.4"}, {"id": "anticor-C049", "tema": "anticor", "tipo": "caso", "q": "Desde la cuenta de un instituto estatal de vivienda se transfieren recursos a varias personas físicas sin contrato, programa ni concepto que explique los pagos. ¿Qué factor se actualiza?", "a": "Transferencias a personas físicas o morales sin que exista una razón aparente", "o": ["Facturas de Operaciones de alto valor con cargos injustificados, sobreprecios o documentación muy simple", "Transferencias justificadas con un contrato asignado a quien opera en un giro distinto", "Transferencias a personas físicas o morales sin que exista una razón aparente", "Alto índice de retiros en efectivo sin justificación aparente o durante procesos electorales"], "x": "El III.3 señala las transferencias a personas físicas o morales desde cuentas de Dependencias, Entidades u Órganos Públicos sin que exista una razón aparente. No es el factor del contrato de giro distinto ni el de las facturas, porque aquí no hay contrato ni facturas que justifiquen los pagos. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3 · Tema 3.3.4"}, {"id": "anticor-C050", "tema": "anticor", "tipo": "memoria", "q": "¿Qué ejemplo da la Guía de un contrato asignado a quien opera en un giro distinto al servicio contratado?", "a": "Contratos de construcción de obra civil con una compañía que produce textiles", "o": ["Contratos de construcción de obra civil con una compañía que produce textiles", "Contratos de limpieza de oficinas públicas con una compañía que desarrolla software", "Compras de papelería a una compañía dedicada al transporte de carga", "Compras de medicamentos para hospitales a una compañía constructora de caminos rurales"], "x": "El ejemplo literal del III.3 es el de contratos para la construcción de obra civil hacia una compañía que se dedica a la producción de textiles. Sirve para recordar que el factor está en las cuentas públicas (III.3), no en la red de fachadas del III.4. Fundamento: Apdo. III.3, factor del contrato de giro distinto.", "ref": "Apdo. III.3 · Tema 3.3.4"}, {"id": "anticor-C051", "tema": "anticor", "tipo": "caso", "q": "Un organismo público estatal paga desde su cuenta facturas de alto valor por mantenimiento de equipo a una empresa que sí se dedica a ese servicio; el precio triplica el de mercado y el reporte de cumplimiento es de media página, sin detalle. ¿Qué grupo de factores se actualiza?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "Las facturas de alto valor que cobran precios muy por arriba del mercado o cuya documentación de cumplimiento es muy simple son factor del III.3, por pagarse desde la cuenta del organismo público. No es III.4: el servicio sí existe y la empresa sí se dedica a él; no se describen bienes o servicios que nunca se prestan ni una red de fachadas. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3 · Tema 3.3.4"}, {"id": "anticor-C052", "tema": "anticor", "tipo": "caso", "q": "Desde la cuenta de un hospital público estatal se transfieren recursos a Textiles del Bajío, S.A., con base en un contrato para construir una nueva ala del hospital. La empresa sólo produce telas. ¿Qué grupo de factores se actualiza?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Las transferencias desde cuentas públicas justificadas con un contrato asignado a quien opera en un giro distinto al servicio contratado son factor del III.3; es justo el ejemplo de la Guía de obra civil y textiles. No es III.4, porque el caso no describe una red de fachadas ni bienes o servicios inexistentes. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3 · Tema 3.3.4"}, {"id": "anticor-C053", "tema": "anticor", "tipo": "caso", "q": "La cuenta de una dependencia federal registra un alto índice de retiros en efectivo sin justificación aparente, en un año sin ningún proceso electoral. ¿Se actualiza el factor del III.3 sobre retiros en efectivo?", "a": "Sí: el factor comprende los retiros sin justificación aparente o los que ocurren durante los procesos electorales", "o": ["No: los retiros en efectivo de las cuentas públicas se analizan con el factor de efectivo del III.2, y no con el del III.3", "No: el factor sólo se actualiza cuando los retiros en efectivo de la cuenta coinciden con un proceso electoral local o federal", "Sí: el factor comprende los retiros sin justificación aparente o los que ocurren durante los procesos electorales", "Sólo si los retiros rebasan el umbral de efectivo que la Guía fija para las cuentas de dependencias y entidades públicas"], "x": "El factor del III.3 tiene dos supuestos alternativos: alto índice de retiros en efectivo sin una justificación aparente, o durante los procesos electorales. Basta el primero. La Guía no fija umbrales de efectivo para este factor. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3 · Tema 3.3.4"}, {"id": "anticor-C054", "tema": "anticor", "tipo": "memoria", "q": "¿Qué tienen en común los cuatro factores del III.3?", "a": "Se refieren a la forma de operar de cuentas a nombre de Dependencias, Entidades u Órganos Públicos", "o": ["Se refieren a vehículos corporativos que ocultan la identidad de la PEP en una o varias jurisdicciones", "Se refieren a las cuentas personales de los servidores públicos de alta jerarquía y sus familiares", "Se refieren a la forma de operar de cuentas a nombre de Dependencias, Entidades u Órganos Públicos", "Se identificaron en Fuentes Abiertas sobre casos recientes de corrupción ocurridos en México"], "x": "El III.3 dice que la forma de operar de las cuentas a nombre de Dependencias, Entidades u Órganos Públicos puede ser indicativa de factores de Riesgo. Los factores tomados de casos mexicanos en Fuentes Abiertas son los del III.4; las cuentas personales de las PEP se analizan con el III.2. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3 · Tema 3.3.4"}, {"id": "anticor-C055", "tema": "anticor", "tipo": "caso", "q": "Constructora Mezquite, S.A., recibe varias transferencias desde la cuenta de la Secretaría de Obras de un estado, sin contrato ni concepto que las explique. No se identifican otras empresas relacionadas con ella. ¿Qué grupo de factores se actualiza?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "Las transferencias a personas físicas o morales desde cuentas a nombre de Dependencias, Entidades u Órganos Públicos sin una razón aparente son factor del III.3. Que la receptora sea persona moral no lo vuelve III.1: no hay un vehículo que oculte a una PEP, y tampoco una red de fachadas del III.4. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3 · Tema 3.3.4"}, {"id": "anticor-C056", "tema": "anticor", "tipo": "trampa", "q": "Respecto de las facturas que justifican Operaciones de alto valor en cuentas públicas, ¿cuál de las siguientes características NO menciona el III.3?", "a": "Que las emita una empresa listada por el SAT en términos del artículo 69-B del CFF", "o": ["Que incorporen cargos injustificados en las facturas de alto valor", "Que cobren precios muy por arriba del precio de mercado del bien o servicio", "Que la documentación sobre el cumplimiento del contrato sea muy simple o sin el detalle usual", "Que las emita una empresa listada por el SAT en términos del artículo 69-B del CFF"], "x": "El III.3 menciona cargos injustificados, precios muy por arriba del mercado y documentación de cumplimiento muy simple o sin el nivel de detalle usual. El artículo 69-B del CFF aparece en el III.4, respecto de algunas empresas fachada listadas por el SAT como simuladoras de Operaciones. Fundamento: Apdo. III.3 y III.4.", "ref": "Apdo. III.3 y III.4 · Tema 3.3.4"}, {"id": "anticor-C057", "tema": "anticor", "tipo": "trampa", "q": "¿En qué grupo de factores menciona la Guía los «procesos electorales»?", "a": "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "Los procesos electorales aparecen en el primer factor del III.3: alto índice de retiros en efectivo, en cuentas públicas, sin justificación aparente o durante los procesos electorales. No están en el III.2, cuyo factor de efectivo se refiere a las cuentas del propio Cliente. Fundamento: Apdo. III.3.", "ref": "Apdo. III.3 · Tema 3.3.4"}, {"id": "anticor-C058", "tema": "anticor", "tipo": "caso", "q": "Banco Alcázar identifica que doce sociedades Clientes suyas, constituidas en México y en el extranjero, comparten representante legal, comisario, notario que las constituyó, domicilio fiscal y empleados, y todas reciben pagos de gobiernos estatales. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El uso de numerosas empresas fachada, constituidas en México y en el extranjero, en las que coinciden dueños, prestanombres, representantes legales, comisarios, notarios, direcciones fiscales y empleados es el primer factor del III.4. No es III.1: el rasgo decisivo es la red de fachadas con coincidencias que recibe recursos públicos, no una estructura para ocultar a una PEP. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C059", "tema": "anticor", "tipo": "caso", "q": "En el análisis de una red de sociedades, Banco Alcázar advierte que todas tienen el mismo domicilio fiscal, los mismos empleados registrados y fueron constituidas ante el mismo notario, con el mismo comisario. ¿Qué factor describe ese hallazgo?", "a": "Numerosas empresas fachada en las que coinciden dueños, notarios, domicilios y empleados", "o": ["Actas con múltiples actividades sin relación entre sí; algunas, listadas en el 69-B del CFF", "Numerosas empresas fachada en las que coinciden dueños, notarios, domicilios y empleados", "Triangulación compleja entre la red de fachadas y personas físicas, sin destino claro", "Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias"], "x": "Las coincidencias de dueños, prestanombres, representantes, comisarios, notarios, direcciones fiscales y empleados entre numerosas empresas fachada son el primer factor del III.4. El caso no describe movimientos de recursos, licitaciones ni el contenido de las actas constitutivas. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C060", "tema": "anticor", "tipo": "cifra", "q": "Dentro del Apartado III, ¿en qué grupo de factores aparece el artículo 69-B del Código Fiscal de la Federación?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "En el III.4, algunas empresas fachada se encuentran listadas por el SAT como simuladoras de Operaciones, en términos del artículo 69-B del CFF. El artículo también se menciona en el Apartado II.1 como medida para PEP socias de empresas, pero dentro del Apartado III sólo está en el III.4. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C061", "tema": "anticor", "tipo": "caso", "q": "En un caso de desvío de recursos, el tesorero de la Secretaría de Finanzas municipal autorizó, uno tras otro, los pagos a las empresas fachada de la red. ¿Qué factor describe su participación?", "a": "Complicidad de otros funcionarios públicos que autorizan los pagos a las empresas fachada", "o": ["Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias", "Desvío de recursos que debieron destinarse a obra pública o a planes asistenciales", "Triangulación compleja entre la red de fachadas y personas físicas, sin destino claro", "Complicidad de otros funcionarios públicos que autorizan los pagos a las empresas fachada"], "x": "El III.4 señala que, para los desvíos, comúnmente se cuenta con la complicidad de otro u otros funcionarios públicos, como el tesorero de la Secretaría de Finanzas estatal o municipal o los encargados de adquisiciones, que autorizan los pagos a las fachadas. El caso describe quién autoriza, no cómo se mueve el dinero después. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C062", "tema": "anticor", "tipo": "caso", "q": "Tres empresas de una misma red se presentan a las licitaciones de la Secretaría de Obras y de la Secretaría de Salud de un estado; simulan competir entre sí y una de ellas siempre gana. ¿Qué factor describe esa conducta en los concursos?", "a": "Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias", "o": ["Complicidad de otros funcionarios públicos que autorizan los pagos a las empresas fachada", "Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias", "Recursos públicos pagados, con o sin contrato, por bienes o servicios que nunca se prestan", "Actas con múltiples actividades sin relación entre sí; algunas, listadas en el 69-B del CFF"], "x": "El III.4 describe que varias empresas fachada simulan competir en los concursos de licitación por los contratos, y que el patrón se replica en varias dependencias estatales. La pregunta se centra en la conducta en los concursos, no en quién autoriza los pagos ni en si los servicios se prestan. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C063", "tema": "anticor", "tipo": "caso", "q": "El acta constitutiva de Comercializadora Nopal, S.A., que recibe contratos de un gobierno estatal, declara como objeto la venta de abarrotes, la consultoría en tecnología, la renta de maquinaria pesada y los cursos de superación personal. ¿Qué factor se actualiza?", "a": "Actas con múltiples actividades sin relación entre sí; algunas, listadas en el 69-B del CFF", "o": ["Numerosas empresas fachada en las que coinciden dueños, notarios, domicilios y empleados", "Triangulación compleja entre la red de fachadas y personas físicas, sin destino claro", "Dispersión de recursos a otros países, incluidos los de baja imposición fiscal", "Actas con múltiples actividades sin relación entre sí; algunas, listadas en el 69-B del CFF"], "x": "El III.4 señala que las empresas fachada declaran en sus actas constitutivas múltiples actividades sin relación entre sí, desde el comercio de todo tipo de producto legal hasta dar cursos de superación personal; algunas, además, están listadas en el 69-B. El caso se basa en el objeto social, no en coincidencias de socios ni en movimientos de recursos. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C064", "tema": "anticor", "tipo": "caso", "q": "Una vez que la empresa fachada recibe el pago del gobierno estatal, los recursos pasan por cinco sociedades de la red y por varias personas físicas, y el destino final no queda claro. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos"], "x": "La triangulación compleja de los recursos del gobierno entre la red de empresas fachada y algunas personas físicas, sin destino claro, es factor del III.4. No es III.1: el caso no describe una estructura corporativa para ocultar a una PEP, sino el movimiento de recursos públicos ya recibidos por la red. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C065", "tema": "anticor", "tipo": "caso", "q": "Los recursos públicos que recibió una red de empresas fachada se envían a cuentas en un país de baja imposición fiscal y se usan para comprar un departamento allá. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "La dispersión de recursos a otros países, incluidos los de baja imposición fiscal, a veces para comprar bienes inmuebles, es factor del III.4. Se distingue del III.2, cuyo factor habla de fondos que van y vienen de países sin relación con el Cliente, porque aquí son recursos públicos que salen de la red de fachadas. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C066", "tema": "anticor", "tipo": "caso", "q": "En un caso de desvío de recursos públicos, la esposa, dos hijos y un sobrino del exfuncionario operan las cuentas bancarias donde terminan los recursos de la red de fachadas. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "El involucramiento de varios familiares para el manejo de los recursos en cuentas bancarias es factor del III.4. No es III.1, porque no se trata de un familiar puesto como Propietario Real, ni III.2, porque nadie emprende de repente ni compra y revende bienes. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C067", "tema": "anticor", "tipo": "caso", "q": "Los recursos que un gobierno estatal tenía etiquetados para comedores comunitarios de zonas marginadas terminan en cuentas de particulares. ¿Qué factor del III.4 describe el caso?", "a": "Desvío de recursos que debieron destinarse a obra pública o a planes asistenciales", "o": ["Dispersión de recursos a otros países, incluidos los de baja imposición fiscal", "Triangulación compleja entre la red de fachadas y personas físicas, sin destino claro", "Desvío de recursos que debieron destinarse a obra pública o a planes asistenciales", "Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias"], "x": "El III.4 incluye el desvío de recursos que debieron destinarse a obra pública o a planes asistenciales dirigidos a los sectores más desfavorecidos de la población. La pregunta se refiere a qué recursos se desvían, no a cómo se dispersan o se triangulan. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C068", "tema": "anticor", "tipo": "caso", "q": "Un gobierno estatal pagó a Consultores Tule, S.A., una de las empresas fachada de una red, por cuarenta estudios técnicos que nunca se elaboraron ni se entregaron; no se cuestiona el precio ni hay facturas observadas. ¿Qué factor se actualiza?", "a": "Recursos públicos pagados, con o sin contrato, por bienes o servicios que nunca se prestan", "o": ["Empresas fachada que simulan competir en licitaciones, patrón replicado en varias dependencias", "Facturas de Operaciones de alto valor con cargos injustificados, sobreprecios o documentación muy simple", "Transferencias justificadas con un contrato asignado a quien opera en un giro distinto", "Recursos públicos pagados, con o sin contrato, por bienes o servicios que nunca se prestan"], "x": "El III.4 señala que los recursos públicos se envían a las empresas fachada por medio de contratos, y en ocasiones sin ellos, para la supuesta adquisición de bienes o prestación de servicios que nunca se llevan a cabo. No es el factor del giro distinto, porque la empresa sí se dedica a la consultoría, ni el de las facturas del III.3, que se refiere a facturas de alto valor con cargos injustificados, sobreprecio o documentación pobre: aquí lo decisivo es que el servicio nunca existió y que la receptora es una fachada. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C069", "tema": "anticor", "tipo": "memoria", "q": "Según el III.4, ¿cómo llegan los recursos públicos a las empresas fachada?", "a": "Por medio de contratos y, en ocasiones, sin la existencia de estos", "o": ["Por medio de contratos y, en ocasiones, sin la existencia de estos", "Sólo mediante subsidios directos, sin que medie contrato alguno", "Sólo por medio de contratos adjudicados mediante licitación pública", "Sólo por adjudicación directa, siempre con un contrato firmado"], "x": "El III.4 dice que los recursos públicos son enviados a las fachadas por medio de contratos, y en ocasiones sin la existencia de estos, para bienes o servicios que nunca se llevan a cabo. Las tres opciones con «sólo» cierran un supuesto que la Guía deja abierto. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C070", "tema": "anticor", "tipo": "trampa", "q": "¿En qué grupo de factores el texto de la Guía NO menciona expresamente personas morales, empresas ni vehículos corporativos?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "El texto menciona personas morales en el III.1 (como vehículos corporativos), en el III.3 (personas físicas o morales que reciben transferencias desde cuentas públicas; una compañía textil) y en el III.4 (red de empresas fachada). El texto del III.2 no las nombra: describe la conducta de la PEP nacional o de la Persona Vulnerable. Eso no impide que, en un caso concreto, el tercero por el que se ejerce una actividad nueva sea una empresa. Fundamento: Apdo. III.1 a III.4.", "ref": "Apdo. III.1 a III.4 · Tema 3.3.4"}, {"id": "anticor-C071", "tema": "anticor", "tipo": "trampa", "q": "¿Cuál de los siguientes NO aparece entre los factores del III.4?", "a": "Uso de familiares como Propietarios Reales para ocultar la identidad de la PEP", "o": ["Involucramiento de varios familiares para el manejo de los recursos en cuentas bancarias", "Uso de familiares como Propietarios Reales para ocultar la identidad de la PEP", "Empresas fachada listadas por el SAT como simuladoras de Operaciones", "Dispersión de recursos a otros países, incluidos los de baja imposición fiscal"], "x": "El uso de miembros de la familia como Propietarios Reales es factor del III.1, porque sirve para ocultar la identidad de la PEP. En el III.4 la familia aparece de otra forma: varios familiares que manejan los recursos en cuentas bancarias. Fundamento: Apdo. III.1 y III.4.", "ref": "Apdo. III.1 y III.4 · Tema 3.3.4"}, {"id": "anticor-C072", "tema": "anticor", "tipo": "caso", "q": "El encargado de adquisiciones de la Secretaría de Finanzas de un estado autoriza pagos a empresas de una misma red de fachadas por despensas que, según los contratos, debían entregarse y nunca se entregaron. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "La complicidad de funcionarios que autorizan pagos a empresas fachada por bienes que nunca se entregan reúne dos factores del III.4. No es III.3: el caso no describe la operación atípica de la cuenta pública (retiros, transferencias sin razón, giro distinto o facturas infladas), sino el esquema de la red. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C073", "tema": "anticor", "tipo": "caso", "q": "Una auditoría revela que los recursos que un municipio debió destinar a pavimentar calles y construir un puente nunca se aplicaron a esas obras: se desviaron por medio de empresas fachada. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.4 · Factores identificados en casos recientes de corrupción en México", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El desvío de recursos que debieron destinarse a obra pública o a planes asistenciales es factor del III.4. La obra civil también aparece en el III.3, pero ahí el factor es el contrato asignado a una empresa de giro distinto, como una textilera; aquí lo decisivo es el desvío de los recursos de obra. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C074", "tema": "anticor", "tipo": "caso", "q": "Banco Alcázar detecta que tres proveedoras de un gobierno estatal, con cuentas en el banco, aparecen en el listado del SAT de empresas que simulan Operaciones y declaran en sus actas actividades sin relación entre sí. ¿Qué grupo de factores se actualiza?", "a": "III.4 · Factores identificados en casos recientes de corrupción en México", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México"], "x": "Las empresas fachada con objeto social de múltiples actividades sin relación entre sí, algunas listadas por el SAT como simuladoras de Operaciones en términos del artículo 69-B del CFF, son factor del III.4. No es III.1, porque el caso no describe una estructura para ocultar a una PEP, sino proveedoras del gobierno con rasgos de fachada. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C075", "tema": "anticor", "tipo": "caso", "q": "La secretaria de Turismo de un estado, Cliente PEP nacional de Banco Alcázar, compra a través de su hijo seis camionetas de lujo y las revende en pocas semanas; las camionetas quedan a nombre de la propia secretaria y el hijo, que no tiene ningún negocio de autos, sólo gestiona la compra. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Adquirir bienes, directamente o a través de terceros como el grupo familiar, y volver a negociarlos en un corto plazo es factor del III.2. No es III.1, porque el hijo no figura como Propietario Real de un vehículo corporativo, ni III.4, porque no hay varios familiares manejando recursos públicos desviados. Fundamento: Apdo. III.2.", "ref": "Apdo. III.2 · Tema 3.3.4"}], "sitio": {"nombre": "Módulo 3", "raiz": "../", "actual": "3-simulacro", "paginas": [{"n": "3.1.1", "carpeta": "3-1-1-auditoria", "pregunta": "Informe de auditoría", "estado": "integrada"}, {"n": "3.1.2", "carpeta": "3-1-2-supervision", "pregunta": "Supervisión CNBV", "estado": "integrada"}, {"n": "3.2.1", "carpeta": "3-2-1-gafi", "pregunta": "Guía GAFI del EBR", "estado": "integrada"}, {"n": "3.2.2", "carpeta": "3-2-2-basilea", "pregunta": "Basilea BCBS 275", "estado": "integrada"}, {"n": "3.3.1", "carpeta": "3-3-1-metodologia", "pregunta": "Metodología de riesgos", "estado": "integrada"}, {"n": "3.3.2", "carpeta": "3-3-2-grado-riesgo", "pregunta": "Grado de riesgo del cliente", "estado": "integrada"}, {"n": "3.3.3", "carpeta": "3-3-3-enr", "pregunta": "ENR 2023", "estado": "integrada"}, {"n": "3.3.4", "carpeta": "3-3-4-anticorrupcion", "pregunta": "Riesgos de corrupción", "estado": "integrada"}], "integrador": "simulacro", "integrador_texto": "Simulacro mixto", "integrador_href": "3-simulacro/index.html"}}

<script>
(function(){
const D = JSON.parse(document.getElementById("datos").textContent);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// «Por qué no las otras»: q.d = {texto de opción incorrecta: razón}; opts = opciones en el orden en que se muestran
const tuHTML=(q,txt)=>(txt&&txt!==q.a&&q.d&&q.d[txt])?`<div class="tu"><b>Por qué tu respuesta está mal</b>${esc(q.d[txt])}</div>`:"";
const distHTML=(q,opts)=>{ if(!q.d) return ""; const it=opts.map((o,k)=>q.d[o]?`<li><b>${"ABCD"[k]}</b> ${esc(q.d[o])}</li>`:"").join(""); return it?`<div class="dist"><div class="lbl">Por qué no las otras</div><ul>${it}</ul></div>`:""; };
const RUTA = D.meta.ruta||"financiero";
const ACENTOS = {financiero:["morado","turquesa"], av:["turquesa","coral"], transversal:["morado","coral"], gratuito:["morado","turquesa"]}[RUTA]||["morado","turquesa"];
const COLORES = ["c-principal","c-"+ACENTOS[0],"c-"+ACENTOS[1],"c-negro"];
const colorDe = (v,i)=>v?("c-"+v):COLORES[i%4];
document.documentElement.setAttribute("data-ruta", RUTA);
const RUTAS = {financiero:"Ruta Sector financiero", av:"Ruta Actividades vulnerables", transversal:"Transversales", gratuito:"Gratuitos"};

/* ---------- encabezado, portada, trampas, pie ---------- */
$("#brand").innerHTML = `<b>360EDUCA</b><span>${esc(D.meta.modulo||"")}</span><span class="ruta">${esc(RUTAS[D.meta.ruta||"financiero"])}</span>`;
$("#nav").innerHTML = D.secciones.filter(s=>s.nav).map(s=>`<a href="#${s.id}"${s.tipo==="simulador"?' class="cta"':""}>${esc(s.nav)}</a>`).join("");
/* ---------- modo sitio: franja de páginas (opcional) ---------- */
if(D.sitio && Array.isArray(D.sitio.paginas)){
  const S=D.sitio, raiz=S.raiz||"", act=S.actual||"";
  const ETQ={preparacion:"En preparación", proximamente:"Próximamente"};
  const actual=S.paginas.find(p=>p.carpeta===act);
  $("#sitebar").innerHTML = `<a class="sb-mod" href="${esc(raiz)}index.html"${act?"":' aria-current="page"'}>${esc(S.nombre||"Portada")}</a><span class="sb-sep"></span>`+
    S.paginas.map(p=>{
      const tip=`Tema ${p.n} · ${p.pregunta||""}`;
      if(p.estado && p.estado!=="integrada") return `<span class="sb-p off" title="${esc(tip)} · ${esc(ETQ[p.estado]||p.estado)}" aria-disabled="true">${esc(p.n)}</span>`;
      return `<a class="sb-p" href="${esc(raiz+p.carpeta)}/index.html" title="${esc(tip)}"${p.carpeta===act?' aria-current="page"':""}>${esc(p.n)}</a>`;
    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+
    (actual?`<span class="sb-ses">Tema ${esc(actual.n)} · ${esc(actual.pregunta||"")}</span>`:"");
  $("#sitebar").hidden=false;
}
const mapa0 = D.secciones.find(s=>s.tipo==="mapa");
let rhythm = "";
if(Array.isArray(D.meta.ritmo)){ // ritmo puesto a mano: [{n, lb, q, color}]
  const R0=D.meta.ritmo;
  rhythm = `<div><div class="rhythm${R0.length>4?" many":""}">${R0.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${esc(r.n)}</span><span class="lb">${esc(r.lb||"")}</span><span class="q">${esc(r.q||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${D.meta.ritmo_cap?esc(D.meta.ritmo_cap):`${R0.map(r=>r.n).join(" · ")} = ${R0.reduce((a,r)=>a+(+r.n||0),0)} ${esc(D.meta.unidad||"")}`}</div></div>`;
} else if(mapa0 && D.meta.ritmo!==false){
  const counts = mapa0.ramas.map(r=>r.items.length);
  rhythm = `<div><div class="rhythm${mapa0.ramas.length>4?" many":""}">${mapa0.ramas.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${r.items.length}</span><span class="lb">${esc(r.corto||r.letra)}</span><span class="q">${esc(r.ritmo||r.pregunta||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${counts.join(" · ")} = ${counts.reduce((a,b)=>a+b,0)} ${esc(D.meta.unidad||"")}</div></div>`;
}
$("#hero").innerHTML = `<div><div class="lbl">${esc(D.meta.eyebrow||"")}</div>
  <h1>${esc(D.meta.h1_antes||"")} <mark>${esc(D.meta.h1_resaltado||"")}</mark> ${esc(D.meta.h1_despues||"")}</h1>
  <p>${D.meta.intro||""}</p></div>${rhythm}`;
$("#traps").innerHTML = (D.trampas||[]).map((t,i)=>`<div class="trapc"><span class="tag">Trampa ${D.trampas.length>1?i+1:"de examen"}</span><p><b>${esc(t.titulo)}</b> ${t.texto}</p></div>`).join("");
if(!(D.trampas||[]).length) $("#traps").hidden=true;
