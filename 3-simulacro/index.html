e negocio y qué riesgo de la Caja 2 aplican?", "a": "Banca minorista; la Caja 2 menciona la prestación de servicios a negocios de alto flujo de efectivo y el volumen de transacciones", "o": ["Corresponsalía; la Caja 2 menciona las transacciones de alto valor que se generan cuando varios bancos atienden a una misma cadena comercial", "Banca corporativa y de inversión; la Caja 2 menciona la naturaleza global de los mercados en que operan los negocios que manejan efectivo", "Banca minorista; la Caja 2 menciona la prestación de servicios a negocios de alto flujo de efectivo y el volumen de transacciones", "Administración patrimonial; la Caja 2 menciona el secreto bancario asociado a las empresas familiares que operan principalmente con efectivo"], "x": "El párr. 52 define la banca minorista como productos directos a individuos y empresas (cuentas corrientes, préstamos, ahorro) y la Caja 2 le asocia negocios de alto flujo de efectivo, volumen y alto valor de transacciones y diversidad de servicios.", "ref": "Párr. 52 · Caja 2 · Tema 3.2.1"}, {"id": "G045", "tema": "gafiebr", "tipo": "caso", "q": "Banco Heredia presta servicios bancarios a otro banco ubicado en una jurisdicción que no cumple lo suficiente con las Recomendaciones del GAFI. ¿Qué riesgo ilustrativo de la Caja 2 corresponde a esta actividad?", "a": "La información limitada sobre el remitente y el origen de los fondos, sobre todo con bancos de jurisdicciones que no cumplen lo suficiente con el GAFI", "o": ["La estratificación e integración, junto con la transferencia de activos entre partes a cambio de efectivo u otros activos en mercados de naturaleza global e interconectada", "La cultura de la confidencialidad y el uso de fideicomisos offshore para encubrir a los propietarios reales de las cuentas de alto patrimonio", "La información limitada sobre el remitente y el origen de los fondos, sobre todo con bancos de jurisdicciones que no cumplen lo suficiente con el GAFI", "La prestación de servicios a negocios de alto flujo de efectivo y la diversidad de servicios ofrecidos a individuos y empresas"], "x": "Los servicios que un banco presta a otro banco son servicios de corresponsalía (párr. 52), y la Caja 2 les asocia alto valor, información limitada del remitente y del origen de los fondos, y posible participación de PEP en la propiedad del banco. La estratificación corresponde a banca de inversión.", "ref": "Párr. 52 · Caja 2 · Tema 3.2.1"}, {"id": "G046", "tema": "gafiebr", "tipo": "trampa", "q": "¿Qué carácter tienen la categorización de actividades bancarias del párr. 52 y la lista de riesgos de la Caja 2?", "a": "La categorización es puramente indicativa y la lista de riesgos es ilustrativa y no exhaustiva", "o": ["La categorización es obligatoria y la lista de riesgos es exhaustiva, por lo que el banco debe replicarlas en su evaluación", "La categorización es indicativa, pero la lista de riesgos es exhaustiva y el supervisor la verifica punto por punto en la visita", "La categorización es obligatoria para bancos sistémicos y la lista es exhaustiva para efectos de la visita del supervisor", "La categorización es puramente indicativa y la lista de riesgos es ilustrativa y no exhaustiva"], "x": "La nota 1 de la Caja 2 dice que la categorización es puramente indicativa y que la lista es ilustrativa y no exhaustiva; el propio párr. 52 usa «entre otros». El distractor que mezcla ambas calificaciones es el más tentador.", "ref": "Párr. 52 · Caja 2 (nota 1) · Tema 3.2.1"}, {"id": "G047", "tema": "gafiebr", "tipo": "caso", "q": "Banco Colina es pequeño: sus clientes se sitúan en categorías similares y su gama de productos es muy limitada. ¿Qué dice la guía sobre la complejidad de su evaluación de riesgos?", "a": "Que una evaluación de riesgos simple podría ser más que suficiente, siempre que sea proporcional a la naturaleza y alcance de sus actividades", "o": ["Que puede prescindir de evaluar sus riesgos si el supervisor ya lo clasificó como de bajo riesgo en su matriz sectorial", "Que puede omitir documentarla y comunicarla al personal, porque las evaluaciones simples no requieren formalizarse por escrito", "Que una evaluación de riesgos simple podría ser más que suficiente, siempre que sea proporcional a la naturaleza y alcance de sus actividades", "Que debe replicar la metodología sofisticada de los bancos con múltiples filiales, porque la guía pide el mismo proceso a todos los bancos"], "x": "El párr. 55 dice que la evaluación no tiene por qué ser compleja pero debe ser proporcional; en bancos pequeños o poco complejos una evaluación simple podría bastar. Aun así, el párr. 54 exige documentarla, guardarla y comunicarla siempre.", "ref": "Párrs. 54–55 · Tema 3.2.1"}, {"id": "G048", "tema": "gafiebr", "tipo": "memoria", "q": "¿Qué debe ocurrir siempre con la evaluación de riesgos del banco, según la Sección III · A?", "a": "Debe documentarse, guardarse y comunicarse debidamente al personal pertinente del banco", "o": ["Debe enviarse a la UIF antes de iniciar operaciones con cada nueva línea de negocio del banco", "Debe publicarse en el sitio del banco para que clientes y contrapartes conozcan su nivel de riesgo", "Debe documentarse, guardarse y comunicarse debidamente al personal pertinente del banco", "Debe elaborarla un auditor externo independiente y certificarla ante el supervisor cada ejercicio"], "x": "El párr. 54 establece que la evaluación forma la base del EBR del banco y siempre debe documentarse, guardarse y comunicarse al personal pertinente. La guía no pide publicarla ni enviarla a la UIF.", "ref": "Párr. 54 · Tema 3.2.1"}, {"id": "G049", "tema": "gafiebr", "tipo": "memoria", "q": "¿Cuál de los siguientes es uno de los factores que la guía menciona para que el banco identifique y evalúe su riesgo de LA/FT?", "a": "El número de clientes que ya han sido identificados como de alto riesgo", "o": ["El rendimiento de cada sucursal frente a sus metas comerciales del ejercicio", "La calificación crediticia soberana de los países donde el banco invierte su tesorería", "La antigüedad en el cargo de los integrantes del consejo de administración", "El número de clientes que ya han sido identificados como de alto riesgo"], "x": "El párr. 56 incluye, entre otros, la naturaleza y complejidad del negocio, los mercados, el número de clientes de alto riesgo, las jurisdicciones, los canales de distribución, la auditoría interna y resultados de regulación, y el volumen de operaciones. Las jurisdicciones cuentan por corrupción, crimen organizado o controles ALA/CFT, no por su calificación crediticia.", "ref": "Párr. 56 · Tema 3.2.1"}, {"id": "G050", "tema": "gafiebr", "tipo": "caso", "q": "Banco Vireo terminó su evaluación de riesgos hace un año. Hoy lanza un servicio digital para clientes no residentes y surgen nuevas tipologías sobre ese canal. ¿Qué corresponde según la guía?", "a": "Revisar su evaluación, que debe actualizarse periódicamente y también cuando cambian sus circunstancias o surgen nuevas amenazas relevantes", "o": ["Esperar la actualización de la evaluación nacional de riesgos, ya que el banco debe revisar la suya después de que lo haga el país", "Esperar al siguiente ciclo, porque la guía fija la revisión de la evaluación de riesgos del banco en intervalos anuales predeterminados", "Revisar su evaluación, que debe actualizarse periódicamente y también cuando cambian sus circunstancias o surgen nuevas amenazas relevantes", "Pedir al supervisor que actualice la evaluación, pues al banco le corresponde elaborarla sólo al inicio de sus operaciones"], "x": "El párr. 57 pide complementar la evaluación con fuentes internas y externas y revisarla periódicamente y cuando cambien las circunstancias o surjan nuevas amenazas. La guía no fija un plazo anual ni subordina la revisión a la evaluación nacional.", "ref": "Párr. 57 · Tema 3.2.1"}, {"id": "G051", "tema": "gafiebr", "tipo": "memoria", "q": "¿Quién debe aprobar la evaluación de riesgos del banco y qué debe reflejar?", "a": "La alta dirección; debe reflejar el nivel de apetito por el riesgo de la institución y establecer el nivel de riesgo que se considera aceptable", "o": ["La alta dirección; debe reflejar el nivel de apetito por el riesgo de la institución y establecer el nivel de riesgo que se considera aceptable", "El oficial de cumplimiento; debe reflejar los riesgos altos del banco, mientras los riesgos bajos se documentan en un anexo operativo aparte", "El supervisor bancario; debe reflejar la calificación que la autoridad asignó al banco dentro de su matriz de riesgos del sector", "La función de auditoría; debe reflejar el riesgo residual que el supervisor está dispuesto a tolerar para ese banco en su calificación"], "x": "El párr. 58 exige aprobación de la alta dirección y que la evaluación refleje el apetito de riesgo y el nivel aceptable; las políticas y controles deben ser acordes con ella. El oficial de cumplimiento monitorea los controles (párr. 84), no aprueba la evaluación.", "ref": "Párr. 58 · Tema 3.2.1"}, {"id": "G052", "tema": "gafiebr", "tipo": "memoria", "q": "¿Para qué deben diseñarse las etapas iniciales del proceso de debida diligencia del cliente?", "a": "Para evaluar el riesgo de la relación propuesta, determinar el nivel de DDC aplicable y disuadir a quienes buscan fines ilícitos", "o": ["Para evaluar el riesgo de la relación propuesta, determinar el nivel de DDC aplicable y disuadir a quienes buscan fines ilícitos", "Para estimar la rentabilidad esperada del cliente y decidir si amerita un ejecutivo de relación dedicado dentro del área comercial del banco", "Para sustituir el monitoreo continuo, ya que un expediente inicial completo hace innecesario vigilar después la relación", "Para reportar a la UIF a los solicitantes nuevos antes de abrir la cuenta, con independencia de su nivel de riesgo"], "x": "El párr. 59 señala esos tres fines de las etapas iniciales de la DDC. El monitoreo continuo sigue siendo necesario (párr. 66), y el reporte a la UIF procede ante sospecha (párr. 71).", "ref": "Párrs. 59, 66 y 71 · Tema 3.2.1"}, {"id": "G053", "tema": "gafiebr", "tipo": "caso", "q": "Banco Mirador atiende dos millones de cuentas de nómina de clientes con niveles de ingreso y operaciones similares. ¿Cómo puede elaborar sus perfiles de riesgo según la guía?", "a": "Puede aplicarlos a grupos de clientes que comparten ciertas características, enfoque particularmente relevante para la banca minorista", "o": ["Puede prescindir de perfiles para esos clientes, porque las cuentas de nómina quedan fuera de la DDC por su bajo riesgo", "Debe usar perfiles grupales para la administración patrimonial, donde los patrones de ingreso de los clientes son más homogéneos", "Puede aplicarlos a grupos de clientes que comparten ciertas características, enfoque particularmente relevante para la banca minorista", "Debe elaborar un perfil individual con entrevista presencial para cada cliente, porque la guía no admite perfiles de riesgo por grupos de clientes"], "x": "El párr. 60 permite perfiles a nivel individual o por grupos con características comunes, como ingresos similares o el mismo tipo de operaciones, y lo considera particularmente relevante en banca minorista.", "ref": "Párr. 60 · Tema 3.2.1"}, {"id": "G054", "tema": "gafiebr", "tipo": "cifra", "q": "¿Qué tres elementos comprende la DDC inicial, según la Sección III · B?", "a": "Identificar al cliente y, en su caso, al propietario real; verificar su identidad con fuentes confiables e independientes; y entender el propósito de la relación", "o": ["Identificar al cliente; reportarlo a la UIF; y clasificarlo en la matriz de riesgos del supervisor antes de abrir la cuenta o celebrar el contrato", "Identificar al cliente y, en su caso, al propietario real; verificar su identidad con fuentes confiables e independientes; y entender el propósito de la relación", "Identificar al cliente en riesgo alto; verificar al propietario real cuando sea PEP; y monitorear sus operaciones mediante umbrales automatizados", "Verificar el historial crediticio del cliente; solicitar referencias bancarias de otras instituciones; y obtener la aprobación de la alta dirección para la apertura"], "x": "El párr. 61 enumera identificación (con propietario real, en su caso), verificación con fuentes confiables e independientes al menos en la medida del marco legal, y comprensión del propósito, con más información en situaciones de mayor riesgo.", "ref": "Párr. 61 · Tema 3.2.1"}, {"id": "G055", "tema": "gafiebr", "tipo": "caso", "q": "Banco Arenal identificó a una empresa solicitante y a su propietario real. ¿Qué verificación adicional pide la guía para cumplir con las sanciones nacionales e internacionales?", "a": "Verificar los nombres del cliente y de los propietarios reales en las listas del Consejo de Seguridad de la ONU y otras listas de sanciones pertinentes", "o": ["Solicitar a la UIF una constancia de no inclusión en listas antes de abrir la cuenta de cualquier persona moral que tenga propietarios o directivos extranjeros", "Verificar los nombres del cliente y de los propietarios reales en las listas del Consejo de Seguridad de la ONU y otras listas de sanciones pertinentes", "Cotejar a los propietarios reales cuando la empresa opere en jurisdicciones con controles ALA/CFT poco satisfactorios, y omitirlo en los demás casos", "Verificar el nombre de la empresa en listas nacionales, dado que los propietarios reales se cotejan contra listas de sanciones al renovar el contrato"], "x": "El párr. 62 pide verificar los nombres del cliente y de los propietarios reales en las listas del Consejo de Seguridad de la ONU y otras pertinentes. No condiciona el cotejo a la jurisdicción ni lo traslada a la UIF.", "ref": "Párr. 62 · Tema 3.2.1"}, {"id": "G056", "tema": "gafiebr", "tipo": "caso", "q": "Un cliente de Banco Lirio fue clasificado como de mayor riesgo. ¿Cuál de las siguientes medidas es un ejemplo de debida diligencia reforzada de la Caja 3?", "a": "Comisionar un reporte de inteligencia sobre el cliente o el propietario real para comprender mejor el riesgo de que participen en actividades criminales", "o": ["Comisionar un reporte de inteligencia sobre el cliente o el propietario real para comprender mejor el riesgo de que participen en actividades criminales", "Obtener menos información del cliente, por ejemplo sin domicilio ni ocupación, y posponer la verificación de su identidad hasta un momento posterior de la relación", "Sustituir la verificación del origen de los fondos por una declaración firmada del cliente sobre la licitud de sus recursos y de su patrimonio", "Aplicar umbrales y baja frecuencia de revisión con sistemas automatizados para reducir la carga operativa que genera la relación comercial"], "x": "La Caja 3 incluye en la DDR obtener más información de fuentes robustas, búsquedas adversas en medios, reportes de inteligencia, verificar origen de fondos o riqueza y más información sobre el propósito. Obtener menos información es DDS, y umbrales con baja frecuencia es monitoreo de bajo riesgo (Caja 5).", "ref": "Caja 3 · Caja 5 · Tema 3.2.1"}, {"id": "G057", "tema": "gafiebr", "tipo": "trampa", "q": "¿Cuál de las siguientes medidas figura en la Caja 3 como ejemplo de debida diligencia simplificada?", "a": "Obtener menos información o una verificación menos robusta, posponiendo la verificación de la identidad del cliente", "o": ["Obtener menos información o una verificación menos robusta, posponiendo la verificación de la identidad del cliente", "Verificar el origen de los fondos o de la riqueza involucrada en la relación de negocios con el cliente", "Realizar búsquedas adversas verificables en medios para informar la evaluación de riesgos del cliente individual y de su propietario real", "Prescindir de identificar al cliente y admitir cuentas anónimas en productos de bajo monto o de inclusión"], "x": "La Caja 3 describe la DDS como obtener menos información y/o una verificación menos robusta, posponiendo la verificación de identidad. Simplificar no es eliminar: la nota 22 recuerda la prohibición de cuentas anónimas como norma general.", "ref": "Caja 3 · Nota 22 · Tema 3.2.1"}, {"id": "G058", "tema": "gafiebr", "tipo": "caso", "q": "Un prospecto de Banco Olmeda se niega a proporcionar la información necesaria para identificar al propietario real, de modo que el banco no puede aplicar el nivel apropiado de DDC. ¿Qué indica la guía?", "a": "No participar en la relación comercial o, si ya existe, darla por terminada, conforme a la Recomendación 10", "o": ["Abrir la cuenta con debida diligencia simplificada y reforzar el monitoreo durante los primeros meses de operación de la relación", "No participar en la relación comercial o, si ya existe, darla por terminada, conforme a la Recomendación 10", "Abrir la cuenta y reportar a la UIF, dado que el reporte permite continuar la relación aunque la DDC quede incompleta", "Solicitar al supervisor autorización para abrir la cuenta sin la información faltante y documentar la excepción en el expediente"], "x": "El párr. 64 dice que, cuando los bancos no puedan aplicar el nivel apropiado de DDC, la R. 10 les pide no participar en la relación o darla por terminada. Ningún otro mecanismo sustituye esa consecuencia.", "ref": "Párr. 64 · Tema 3.2.1"}, {"id": "G059", "tema": "gafiebr", "tipo": "trampa", "q": "Como norma general, ¿cómo deben aplicarse las medidas de DDC según la Sección III · B?", "a": "En todos los casos, ajustando su alcance al riesgo de la relación en la medida permitida o requerida por la regulación", "o": ["Cuando el supervisor lo requiera para un tipo particular de producto, conforme al programa anual de supervisión", "En todos los casos, ajustando su alcance al riesgo de la relación en la medida permitida o requerida por la regulación", "Con la misma cantidad y tipo de información en todos los casos, sin distinguir el riesgo asociado a cada relación comercial", "A clientes de riesgo medio y alto, pues para el riesgo bajo la norma general es la exención de las medidas de DDC"], "x": "El párr. 63 fija la norma general: DDC en todos los casos, aumentando información y verificación con mayor riesgo y pudiendo simplificar con menor riesgo. La exención es excepcional y la decide el país (nota 22).", "ref": "Párr. 63 · Nota 22 · Tema 3.2.1"}, {"id": "G060", "tema": "gafiebr", "tipo": "caso", "q": "Un cliente de Banco Fénix declaró ser jubilado con ingresos modestos; en los últimos meses recibe transferencias frecuentes de varios terceros y retira efectivo de inmediato. ¿Qué implica el monitoreo permanente según la guía?", "a": "Escrutar si las operaciones son consistentes con lo que se sabe del cliente e identificar el cambio de perfil, que puede requerir DDC nueva o adicional", "o": ["Cancelar la cuenta de inmediato, porque cualquier variación del perfil transaccional obliga al banco a terminar la relación comercial", "Registrar el cambio en la siguiente actualización periódica del expediente, ya que los cambios de perfil se documentan en la revisión anual", "Esperar a que las operaciones rebasen un umbral de reporte, porque el monitoreo permanente consiste en comparar montos contra límites predeterminados por el banco", "Escrutar si las operaciones son consistentes con lo que se sabe del cliente e identificar el cambio de perfil, que puede requerir DDC nueva o adicional"], "x": "El párr. 66 define el monitoreo como el escrutinio de operaciones frente al conocimiento del cliente, e incluye identificar cambios de perfil (comportamiento, uso de productos, montos) y mantener un registro actualizado, lo que puede requerir medidas de DDC nuevas o adicionales.", "ref": "Párr. 66 · Tema 3.2.1"}, {"id": "G061", "tema": "gafiebr", "tipo": "caso", "q": "Banco Tobías, con pocas operaciones diarias, monitorea a sus clientes de forma manual. Un consultor le dice que la guía exige sistemas electrónicos de monitoreo. ¿Qué dice el texto?", "a": "Que no requiere sistemas electrónicos, aunque con grandes volúmenes regulares de operaciones los automatizados podrían ser el único método realista", "o": ["Que la guía exige sistemas electrónicos a los bancos con servicios de corresponsalía y deja en libertad al resto de las líneas de negocio", "Que no requiere sistemas electrónicos, aunque con grandes volúmenes regulares de operaciones los automatizados podrían ser el único método realista", "Que la guía admite el monitoreo manual en riesgo bajo, pero en situaciones de mayor riesgo exige que el monitoreo se realice con sistemas automatizados", "Que la guía exige sistemas automatizados a todos los bancos y admite el monitoreo manual de forma transitoria mientras se concluye su implementación"], "x": "El párr. 67 dice que el monitoreo no requiere sistemas electrónicos y que con grandes volúmenes los automatizados «podrían» ser el único método realista. La Caja 5 incluso lista el monitoreo de operaciones manuales entre los ejemplos para situaciones de alto riesgo.", "ref": "Párr. 67 · Caja 5 · Tema 3.2.1"}, {"id": "G062", "tema": "gafiebr", "tipo": "caso", "q": "Banco Umbría usa desde hace años un sistema automatizado de monitoreo cuyas reglas nadie ha revisado. ¿Qué exige la guía cuando se utilizan sistemas automatizados?", "a": "Que el banco conozca las reglas que los rigen, verifique su fiabilidad con regularidad y compruebe que abordan los riesgos de LA/FT identificados", "o": ["Que el banco encargue su revisión al proveedor tecnológico, quien responde ante el supervisor por la eficacia de las reglas configuradas", "Que el banco conozca las reglas que los rigen, verifique su fiabilidad con regularidad y compruebe que abordan los riesgos de LA/FT identificados", "Que el banco lo mantenga sin cambios, dado que un sistema automatizado ya validado garantiza la detección de las operaciones potencialmente sospechosas", "Que el banco lo sustituya por monitoreo manual, porque la guía asocia los sistemas automatizados a situaciones de bajo riesgo"], "x": "El párr. 67 exige que, cuando se usen sistemas automatizados, los bancos conozcan sus reglas, verifiquen su fiabilidad con regularidad y comprueben que atienden los riesgos identificados. La Caja 5 menciona sistemas automatizados en bajo riesgo como ejemplo, no como restricción.", "ref": "Párr. 67 · Caja 5 · Tema 3.2.1"}, {"id": "G063", "tema": "gafiebr", "tipo": "memoria", "q": "¿Cuál de los siguientes conjuntos corresponde a los ejemplos de monitoreo en situaciones de alto riesgo de la Caja 5?", "a": "Monitoreo de operaciones diarias, análisis frecuente de información, considerar el destino de los fondos y reportar resultados a la alta dirección", "o": ["Umbrales de monitoreo, baja frecuencia de revisión y sistemas automatizados aplicados de forma estándar a todas las cuentas del segmento", "Revisión de las operaciones al actualizar el expediente del cliente, sin considerar el destino de los fondos ni las tipologías vigentes", "Muestreo anual de operaciones por la función de auditoría, con banderas rojas definidas por el área comercial según sus metas", "Monitoreo de operaciones diarias, análisis frecuente de información, considerar el destino de los fondos y reportar resultados a la alta dirección"], "x": "La Caja 5 lista para alto riesgo operaciones diarias, operaciones manuales, análisis frecuente, destino de fondos, banderas rojas basadas en tipologías y reporte a la alta dirección; para bajo riesgo, umbrales, baja frecuencia y sistemas automatizados.", "ref": "Caja 5 · Tema 3.2.1"}, {"id": "G064", "tema": "gafiebr", "tipo": "caso", "q": "El supervisor pide a Banco Nácar explicar por qué monitorea con menor frecuencia a un segmento de clientes, pero el banco no tiene criterios escritos de segmentación. ¿Qué exige la guía?", "a": "Documentar y establecer claramente los criterios de segmentación y de asignación de riesgo, con criterios transparentes de frecuencia e intensidad", "o": ["Documentar los criterios del segmento de mayor riesgo, dado que en los segmentos de menor riesgo la guía acepta criterios no escritos", "Documentar y establecer claramente los criterios de segmentación y de asignación de riesgo, con criterios transparentes de frecuencia e intensidad", "Eliminar la segmentación y aplicar el mismo monitoreo a todos los clientes, porque segmentar resulta incompatible con un enfoque basado en riesgo proporcional", "Nada en particular, porque la segmentación de clientes es una decisión comercial reservada que el banco no tiene que explicar al supervisor"], "x": "El párr. 69 pide documentar y establecer claramente los criterios de segmentación y asignación de riesgo, y que los de frecuencia e intensidad sean transparentes. El párr. 68 permite reducir el monitoreo con menor riesgo, pero con criterios revisables.", "ref": "Párrs. 68–69 · Tema 3.2.1"}, {"id": "G065", "tema": "gafiebr", "tipo": "trampa", "q": "Banco Cuarzo propone que, en clientes de bajo riesgo, aun cuando ya surgió la sospecha, el reporte a la UIF se envíe hasta el cierre del ciclo mensual de análisis. ¿Es válido según la guía?", "a": "No: las alertas pueden calibrarse según el tipo de riesgo, pero una vez surgida la sospecha el banco deberá informar a la UIF de inmediato", "o": ["No: en clientes de bajo riesgo la guía indica que, en lugar de reportar, el banco termine la relación comercial antes de que concluya el ciclo", "Sí: con clientes de bajo riesgo el EBR permite diferir el reporte a la UIF hasta completar el ciclo mensual de análisis, siempre que quede documentado", "No: las alertas pueden calibrarse según el tipo de riesgo, pero una vez surgida la sospecha el banco deberá informar a la UIF de inmediato", "Sí, siempre que la alta dirección lo apruebe en la evaluación de riesgos del banco y lo comunique al supervisor antes de aplicarlo en la operación"], "x": "Los párrs. 71–72 permiten calibrar por riesgo las políticas que dan lugar a alertas, pero el reporte procede de inmediato una vez que surge la sospecha. La terminación de la relación es la consecuencia de no poder aplicar la DDC (párr. 64), no un sustituto del reporte.", "ref": "Párrs. 64 y 71–72 · Tema 3.2.1"}, {"id": "G066", "tema": "gafiebr", "tipo": "memoria", "q": "Además de reportar sospechas a la UIF, ¿qué deben tener los bancos para tratar los movimientos inusuales, según el apartado de Informes?", "a": "Sistemas adecuados de gestión de casos para analizar a tiempo los fondos u operaciones señalados y determinar si son sospechosos", "o": ["Sistemas de reporte masivo a la UIF de las operaciones inusuales, sin análisis interno, para no retrasar la información", "Sistemas adecuados de gestión de casos para analizar a tiempo los fondos u operaciones señalados y determinar si son sospechosos", "Sistemas de bloqueo automático de toda operación inusual, sin análisis previo, hasta que la UIF autorice liberar los fondos retenidos al cliente", "Archivos de operaciones inusuales que se revisan cuando el supervisor los solicita durante sus visitas in situ"], "x": "El párr. 71 permite señalar movimientos inusuales para su análisis posterior y pide sistemas adecuados de gestión de casos para analizarlos a tiempo y determinar si son sospechosos.", "ref": "Párr. 71 · Tema 3.2.1"}, {"id": "G067", "tema": "gafiebr", "tipo": "trampa", "q": "Sobre la función de auditoría independiente que prueba el programa ALA/CFT del banco, ¿qué afirmación NO es correcta según la guía?", "a": "Que debe concentrar su examen exclusivamente en las determinaciones de riesgo alto del banco", "o": ["Que requiere examinar lo adecuado de todas las determinaciones de riesgo del banco", "Que sus hallazgos deben informar a la alta dirección sobre el diseño e implementación del marco", "Que abarca operaciones, departamentos, sucursales y subsidiarias, y en su caso las del extranjero", "Que debe concentrar su examen exclusivamente en las determinaciones de riesgo alto del banco"], "x": "El párr. 86 dice que la auditoría requiere examinar lo adecuado de todas las determinaciones de riesgos y por lo tanto no debe enfocarse exclusivamente en riesgos altos. Las otras tres afirmaciones reproducen el mismo párrafo.", "ref": "Párr. 86 · Tema 3.2.1"}, {"id": "G068", "tema": "gafiebr", "tipo": "caso", "q": "En Banco Zafiro se discute quién decide las medidas para mitigar los riesgos de LA/FT identificados y el grado de riesgo residual que el banco está dispuesto a aceptar. ¿A quién lo atribuye la guía?", "a": "A la alta dirección, como una de las maneras de apoyar el ALA/CFT, junto con dotar de recursos a la Unidad ALA/CFT y promover el cumplimiento como valor central", "o": ["Al oficial de cumplimiento, que decide el riesgo residual aceptable y lo comunica a la alta dirección en su informe periódico sobre la efectividad de los controles", "A la alta dirección, como una de las maneras de apoyar el ALA/CFT, junto con dotar de recursos a la Unidad ALA/CFT y promover el cumplimiento como valor central", "A la función de auditoría interna, por ser el área con independencia suficiente para fijar el apetito de riesgo del banco", "Al supervisor bancario, que fija para cada banco el riesgo residual máximo al otorgar la autorización para operar"], "x": "El párr. 76 atribuye a la alta dirección decidir las medidas de mitigación y el riesgo residual aceptable, conformar los recursos de la Unidad ALA/CFT y promover el cumplimiento como valor central. La guía no atribuye esa decisión al oficial de cumplimiento ni a la auditoría, cuyas funciones son monitorear y revisar los controles (párrs. 84–86).", "ref": "Párr. 76 · Tema 3.2.1"}, {"id": "G069", "tema": "gafiebr", "tipo": "caso", "q": "En Banco Alcor, el departamento de TI y las áreas comerciales no reciben información sobre los riesgos de LA/FT que enfrenta el banco. ¿Qué mecanismos pide la guía a la alta dirección?", "a": "Comunicación interna que interrelacione al Consejo, al oficial de cumplimiento, a los comités relacionados, a TI y a cada área comercial", "o": ["Comunicación entre el Consejo y la auditoría externa, dejando a las áreas operativas y tecnológicas fuera del circuito de información de riesgos", "Comunicación que reserve la información de riesgos al oficial de cumplimiento, para proteger la confidencialidad de los reportes a la UIF", "Comunicación con el supervisor, al que corresponde transmitir a las áreas comerciales los riesgos de LA/FT que detecta en el banco", "Comunicación interna que interrelacione al Consejo, al oficial de cumplimiento, a los comités relacionados, a TI y a cada área comercial"], "x": "El párr. 76 pide mecanismos de comunicación interna sobre riesgos reales o probables que interrelacionen al Consejo, al oficial de cumplimiento, a comités como el de Riesgos o el de Ética y Cumplimiento, al departamento de TI y a cada área comercial.", "ref": "Párr. 76 · Tema 3.2.1"}, {"id": "G070", "tema": "gafiebr", "tipo": "memoria", "q": "Para comprender cómo opera el marco de control ALA/CFT, ¿qué debe recibir la alta dirección según la Sección III · C?", "a": "Información suficiente, regular y objetiva sobre el riesgo de LA/FT, e información suficiente y objetiva sobre la efectividad de los controles, por ejemplo de cumplimiento o de auditoría", "o": ["Los informes del supervisor posteriores a cada visita in situ, que remplazan a los reportes internos de cumplimiento y de auditoría", "Un resumen anual de los reportes enviados a la UIF, dado que la gestión cotidiana del riesgo de LA/FT corresponde al área operativa y no a la alta dirección", "Información de los clientes clasificados como de alto riesgo, porque los riesgos bajos y medios no requieren la atención de la alta dirección", "Información suficiente, regular y objetiva sobre el riesgo de LA/FT, e información suficiente y objetiva sobre la efectividad de los controles, por ejemplo de cumplimiento o de auditoría"], "x": "El segundo párrafo numerado 76 en la versión en español pide que la alta dirección conozca los riesgos y comprenda cómo opera el control, recibiendo información suficiente, regular y objetiva sobre el riesgo y la efectividad de los controles, y que existan procesos para escalar decisiones importantes.", "ref": "Párr. 76 (segundo) · Tema 3.2.1"}, {"id": "G071", "tema": "gafiebr", "tipo": "caso", "q": "Banco Robledo investiga antecedentes sólo de sus directivos, aunque sus cajeros manejan diariamente efectivo de clientes de alto riesgo. ¿Qué dice la guía sobre la investigación del personal?", "a": "Que su nivel debe reflejar los riesgos de LA/FT a los que está expuesto cada empleado y no enfocarse únicamente en los roles de alta dirección", "o": ["Que es correcto, porque la guía circunscribe la investigación de antecedentes a la alta dirección y al oficial de cumplimiento, por su nivel de decisión en el banco", "Que su nivel debe reflejar los riesgos de LA/FT a los que está expuesto cada empleado y no enfocarse únicamente en los roles de alta dirección", "Que la investigación del personal corresponde al supervisor, de modo que el banco no interviene en los antecedentes de sus empleados", "Que debe aplicar la investigación más exhaustiva por igual a todo el personal, sin distinguir su exposición al riesgo de LA/FT"], "x": "El párr. 81 pide que el nivel de investigación refleje los riesgos a los que está expuesto cada empleado y no se enfoque únicamente en la alta dirección; también pide manejar conflictos de interés. Proporcional no es uniforme.", "ref": "Párrs. 80–81 · Tema 3.2.1"}, {"id": "G072", "tema": "gafiebr", "tipo": "caso", "q": "En Banco Pinar, el oficial de cumplimiento no tiene acceso a la información de las subsidiarias ni a varias líneas de negocio, y carece de recursos propios. ¿Qué exige la guía?", "a": "Que tenga la independencia, autoridad, nivel, recursos y experiencia necesarios, incluida la habilidad de acceder a toda la información interna", "o": ["Que tenga la independencia, autoridad, nivel, recursos y experiencia necesarios, incluida la habilidad de acceder a toda la información interna", "Que acceda a los expedientes de clientes de alto riesgo, pues el resto de la información corresponde a la gestión de cada línea de negocio", "Nada adicional, porque basta con que la función de auditoría tenga ese acceso, ya que el papel del oficial es asesorar al personal", "Que se limite a la información de la matriz, porque las subsidiarias rinden cuentas a su supervisor local y no al oficial de cumplimiento del grupo"], "x": "El párr. 85 (NI 18) pide un oficial de cumplimiento a nivel gerencial con independencia, autoridad, nivel, recursos y experiencia, incluida la habilidad de acceder a toda la información interna, a través de líneas de negocio, sucursales y subsidiarias.", "ref": "Párr. 85 · Tema 3.2.1"}, {"id": "G073", "tema": "gafiebr", "tipo": "caso", "q": "Banco Lindero imparte un único curso ALA/CFT al contratar a cada empleado, igual para todas las áreas; no aplica pruebas ni da seguimiento a si el personal cumple los controles, aunque envía boletines trimestrales de actualización. ¿Qué rasgos de la capacitación del párr. 82 incumple?", "a": "Los de ser continua, a la medida de las líneas de negocio y efectiva, con un efecto que puede verificarse, por ejemplo, mediante pruebas", "o": ["Los de ser continua, a la medida de las líneas de negocio y efectiva, con un efecto que puede verificarse, por ejemplo, mediante pruebas", "El de haber sido impartida por el supervisor, al que la guía atribuye la capacitación ALA/CFT del personal bancario", "Ninguno, porque la guía pide que la capacitación sea obligatoria para todo el personal relevante al momento de su contratación", "Ninguno, porque la guía desaconseja capacitar de forma diferenciada por línea de negocio para no generar criterios dispares entre las áreas del banco"], "x": "El párr. 82 pide capacitación de alta calidad, obligatoria, a la medida, efectiva, continua (no un ejercicio de una sola vez en la contratación, NI 18) y complementada con actualizaciones. Ser obligatoria es sólo uno de esos rasgos.", "ref": "Párr. 82 · Tema 3.2.1"}, {"id": "G074", "tema": "gafiebr", "tipo": "caso", "q": "Banco Garza discute cómo repartir la vigilancia de sus controles ALA/CFT entre el oficial de cumplimiento y la auditoría. ¿Qué reparto marca la guía?", "a": "El oficial de cumplimiento monitorea los controles de forma continua y una función de auditoría independiente revisa y prueba el programa", "o": ["El oficial de cumplimiento monitorea y además audita el programa, porque la R. 18 permite concentrar ambas funciones en una misma persona", "La función de auditoría monitorea los controles de forma continua y el oficial de cumplimiento los prueba de manera independiente cada año", "El oficial de cumplimiento monitorea los controles de forma continua y una función de auditoría independiente revisa y prueba el programa", "La alta dirección monitorea los controles de forma continua y el supervisor bancario actúa como la función de auditoría independiente del banco"], "x": "El párr. 84 asigna el monitoreo continuo al oficial de cumplimiento y la revisión a una función de auditoría; el párr. 86 (R. 18) pide que esa auditoría sea independiente. Invertir los papeles es el distractor más tentador.", "ref": "Párrs. 84 y 86 · Tema 3.2.1"}, {"id": "G075", "tema": "gafiebr", "tipo": "trampa", "q": "¿Qué valor atribuye la propia guía a las prácticas de supervisión de países que presenta el Anexo 1?", "a": "Se presentan únicamente como ejemplos y su inclusión no debe considerarse un respaldo del GAFI", "o": ["Se presentan únicamente como ejemplos y su inclusión no debe considerarse un respaldo del GAFI", "Son buenas prácticas respaldadas por el GAFI, aunque cada país decide voluntariamente si las adopta", "Son estándares mínimos que el GAFI verificó en la Cuarta Ronda y que los demás países deben replicar", "Son prácticas obligatorias para los países que codirigieron el grupo de proyecto que elaboró la guía"], "x": "La introducción del Anexo 1 dice que las prácticas son únicamente ejemplos, que al publicarse no habían sido evaluadas en la Cuarta Ronda y que no deben considerarse un respaldo del GAFI. Que México codirigiera el grupo (párr. 2) no vuelve obligatorio su ejemplo.", "ref": "Anexo 1 · Introducción · Tema 3.2.1"}, {"id": "G076", "tema": "gafiebr", "tipo": "caso", "q": "En una clase se explica cómo decide la CNBV, según el Anexo 1, qué instituciones financieras visitar durante el año. ¿Qué descripción es fiel al texto?", "a": "Con base en los riesgos inherentes identificados, determina qué instituciones representan un riesgo mayor y decide cuáles visitar en el año (programa anual)", "o": ["Programa visitas anuales a la totalidad de las instituciones en orden de registro y utiliza la calificación de riesgo para definir la duración de cada visita", "Programa visitas a las instituciones que la UIF le señala en su retroalimentación anual, y la calificación de riesgo se asigna al concluir cada inspección", "Selecciona a las instituciones mediante un sorteo aleatorio y después aplica un diagnóstico para confirmar si coincidieron con las de mayor riesgo inherente", "Con base en los riesgos inherentes identificados, determina qué instituciones representan un riesgo mayor y decide cuáles visitar en el año (programa anual)"], "x": "El Anexo 1 · México describe que la CNBV, con base en los riesgos inherentes identificados con información de las instituciones y otras fuentes, determina cuáles representan mayor riesgo para decidir las visitas del año (programa anual); luego realiza un diagnóstico de cada entidad a visitar.", "ref": "Anexo 1 · México · Tema 3.2.1"}, {"id": "G077", "tema": "gafiebr", "tipo": "memoria", "q": "Según el Anexo 1, ¿qué toma en cuenta la CNBV para establecer su estrategia de monitoreo efectivo?", "a": "Los productos o servicios que ofrecen las entidades, sus tipos de usuarios o clientes, sus flujos de fondos y el área geográfica de su operación, entre otros", "o": ["Los productos o servicios que ofrecen las entidades, sus tipos de usuarios o clientes, sus flujos de fondos y el área geográfica de su operación, entre otros", "El capital contable, el índice de morosidad, la rentabilidad y el nivel de reservas preventivas de cada entidad, como únicos factores de la estrategia", "El número de empleados, la antigüedad de la institución, su calificación crediticia y su cotización bursátil, entre otros indicadores de mercado", "La ubicación, el enfoque del negocio y la estructura del producto, del cliente y de distribución, con mayor ponderación a la estructura del cliente"], "x": "El Anexo 1 · México menciona productos o servicios, tipos de usuarios o clientes, flujos de fondos y área geográfica, «entre otros». Los cinco criterios con mayor peso a la estructura del cliente corresponden a BaFin (Alemania).", "ref": "Anexo 1 · México y Alemania · Tema 3.2.1"}, {"id": "G078", "tema": "gafiebr", "tipo": "caso", "q": "Antes de visitar a Banco Estribo, la CNBV analiza sus actividades más significativas (productos con riesgos inherentes) y la acción de mitigación que el banco ha aplicado. ¿Qué fase describe el Anexo 1?", "a": "El diagnóstico de la entidad que será visitada, que permite acotar las actividades de mayor riesgo y la efectividad de sus mitigantes específicos", "o": ["La calificación de riesgo posterior a la visita, que se asigna para determinar la periodicidad de las siguientes inspecciones ALA/CFT de la entidad", "El diagnóstico de la entidad que será visitada, que permite acotar las actividades de mayor riesgo y la efectividad de sus mitigantes específicos", "El acto de autoridad preliminar, en el que se emiten observaciones y recomendaciones antes de iniciar formalmente la inspección in situ", "La revisión temática sectorial, en la que se compara a la entidad con una selección de instituciones para identificar prácticas atípicas"], "x": "El Anexo 1 · México describe un diagnóstico de cada entidad a visitar, en sus actividades más significativas y sus mitigantes; en otro pasaje dice que el diagnóstico acota actividades de mayor riesgo y la efectividad de mitigantes específicos. Las revisiones temáticas para detectar prácticas atípicas son del ejemplo de Holanda.", "ref": "Anexo 1 · México y Holanda · Tema 3.2.1"}, {"id": "G079", "tema": "gafiebr", "tipo": "caso", "q": "Tras la inspección a Banco Céfiro, la CNBV encontró mitigantes más débiles de lo previsto en su calificación. Según el Anexo 1, ¿qué ocurre con esos resultados?", "a": "Se toman en cuenta para confirmar el nivel de riesgo o asignar uno nuevo, se agregan a la matriz extra situ y ayudan a programar el siguiente monitoreo", "o": ["Se archivan en el expediente de la visita y la calificación previa se mantiene hasta el siguiente programa anual, sin retroalimentar la matriz extra situ", "Se utilizan para imponer sanciones, mientras la calificación de riesgo se determina de nuevo con la información periódica que reporta la entidad", "Se remiten al GAFI para que la entidad se reclasifique dentro del informe de evaluación mutua del país en la siguiente ronda de evaluaciones", "Se toman en cuenta para confirmar el nivel de riesgo o asignar uno nuevo, se agregan a la matriz extra situ y ayudan a programar el siguiente monitoreo"], "x": "El Anexo 1 · México dice que los resultados de la inspección confirman el nivel de riesgo o asignan uno nuevo, y que esa información se agrega a la matriz de supervisión extra situ para programar el siguiente monitoreo (estrategia de supervisión). Los dos carriles se retroalimentan.", "ref": "Anexo 1 · México · Tema 3.2.1"}, {"id": "G080", "tema": "gafiebr", "tipo": "memoria", "q": "Según el Anexo 1, ¿qué actos de autoridad pueden derivar de los resultados de las inspecciones ALA/CFT de la CNBV?", "a": "La emisión de observaciones y recomendaciones, así como la implementación de acciones correctivas y/o sanciones", "o": ["Cartas de retroalimentación no vinculantes, que se comentan con la industria en los foros anuales de capacitación", "La revocación de la autorización para operar, como consecuencia prevista para toda deficiencia detectada en la visita", "La emisión de observaciones y recomendaciones, así como la implementación de acciones correctivas y/o sanciones", "La designación directa, por la autoridad, del oficial de cumplimiento y del auditor independiente de la institución"], "x": "El Anexo 1 · México dice que, de acuerdo con los resultados, pueden llevarse a cabo varios actos de autoridad, incluidas observaciones y recomendaciones, acciones correctivas y/o sanciones. Los foros anuales con mejores prácticas son del ejemplo de Hong Kong.", "ref": "Anexo 1 · México · Tema 3.2.1"}, {"id": "G081", "tema": "gafiebr", "tipo": "caso", "q": "Durante la inspección a Banco Nogal, con base en el reporte de operaciones, el supervisor detecta una deficiencia en el sistema automatizado del banco, aspecto que no estaba cubierto en el programa de supervisión. ¿Qué describe el Anexo 1?", "a": "Que el supervisor tiene la facultad de conducir una revisión más profunda y debe verificar el sistema para detectar la causa real de la deficiencia", "o": ["Que el supervisor debe ceñirse al programa de supervisión original y registrar la deficiencia para incluirla en el programa del año siguiente", "Que el supervisor debe pedir al banco una autoevaluación del sistema y abstenerse de verificarlo, para respetar su discrecionalidad", "Que el supervisor tiene la facultad de conducir una revisión más profunda y debe verificar el sistema para detectar la causa real de la deficiencia", "Que el supervisor debe suspender la visita y pedir a la UIF que determine si la deficiencia amerita ampliar el alcance de la revisión"], "x": "En el apartado de intensidad, el Anexo 1 · México dice que, si hay evidencia de debilidad en un mitigante no cubierto originalmente, el supervisor tiene la facultad de una revisión más profunda, y pone el ejemplo del sistema automatizado cuya causa real debe verificarse.", "ref": "Anexo 1 · México · Tema 3.2.1"}, {"id": "G082", "tema": "gafiebr", "tipo": "caso", "q": "Banco Ribera lanzó una nueva línea de negocio y, en el mismo periodo, sus reportes de operaciones sospechosas y relevantes aumentaron. ¿Qué papel tienen esos hechos en el ejemplo de México del Anexo 1?", "a": "Son factores que, entre otros y junto con la calificación de riesgo, se toman en cuenta para determinar la frecuencia de la supervisión ALA/CFT", "o": ["Son factores que la CNBV considera para imponer sanciones, pero que el Anexo 1 no vincula con la frecuencia de la supervisión ALA/CFT", "Son factores que obligan a la CNBV a visitar a la institución cada mes durante un año, con independencia de su calificación de riesgo y de su historial", "Son factores sin efecto en la frecuencia, porque el Anexo 1 la hace depender del tamaño de los activos de la institución financiera", "Son factores que, entre otros y junto con la calificación de riesgo, se toman en cuenta para determinar la frecuencia de la supervisión ALA/CFT"], "x": "El Anexo 1 · México lista, entre otros, incrementos inusuales de operaciones, incrementos en STR o CTR, cambio del perfil de negocio, nuevos productos o líneas de negocio y nivel de cumplimiento regulatorio; la frecuencia también se sujeta a medidas de seguimiento correctivas.", "ref": "Anexo 1 · México · Tema 3.2.1"}, {"id": "G083", "tema": "gafiebr", "tipo": "trampa", "q": "¿Qué documento aplica la CNBV, según el Anexo 1, que describe en detalle los procedimientos para evaluar las actividades significativas de mayor riesgo y la efectividad de los mitigantes?", "a": "El Manual Institucional de Supervisión", "o": ["La Guía de Cumplimiento que consolida el material de guía para entidades reportadoras", "El Manual de Examinación de Prevención de Lavado de Dinero/Ley de Secreto Bancario", "El Marco para el Impacto de la Evaluación de Riesgos de Instituciones Financieras", "El Manual Institucional de Supervisión"], "x": "El Anexo 1 · México menciona el Manual Institucional de Supervisión. Los distractores son documentos de otros países del mismo anexo: el manual FFIEC de Estados Unidos, el marco de la MAS de Singapur y la Guía de Cumplimiento de AUSTRAC de Australia.", "ref": "Anexo 1 · México · Tema 3.2.1"}, {"id": "G084", "tema": "gafiebr", "tipo": "cifra", "q": "En el Anexo 1, ¿cómo está integrada la matriz que BaFin (Alemania) usa para determinar la intensidad de la supervisión ALA/CFT?", "a": "12 celdas: 3 niveles de amenaza potencial de LA/FT por 4 niveles de calidad de la prevención ALA/CFT (A a D)", "o": ["16 celdas: 4 categorías de impacto sistémico por 4 categorías de riesgo, con mayor ponderación del impacto", "12 celdas: 4 niveles de amenaza potencial de LA/FT por 3 niveles de calidad de la prevención ALA/CFT (1 a 3)", "12 celdas: 3 niveles de amenaza potencial de LA/FT por 4 niveles de calidad de la prevención ALA/CFT (A a D)", "9 celdas: 3 niveles de riesgo inherente por 3 niveles de calidad de los controles internos (alta, media y baja)"], "x": "La matriz de BaFin cruza amenaza potencial en 3 niveles (1 a 3) con calidad de la prevención en 4 niveles (A a D), para 12 celdas. Las categorías con mayor peso del impacto evocan el modelo de Singapur, y la opción de 4 niveles de amenaza por 3 de calidad invierte las dimensiones.", "ref": "Anexo 1 · Alemania · Tema 3.2.1"}, {"id": "G085", "tema": "gafiebr", "tipo": "caso", "q": "AUSTRAC evalúa a un grupo de entidades reportadoras con riesgo alto de LA/FT que, sin embargo, muestra un enfoque fuerte en sus obligaciones regulatorias. ¿Qué dice el ejemplo de Australia del Anexo 1?", "a": "Que la entidad puede tener riesgo alto de LA/FT y, a la vez, una calificación baja de riesgo de cumplimiento, porque son medidas diferentes", "o": ["Que su riesgo de LA/FT pasa a bajo, porque un enfoque fuerte en las obligaciones regulatorias neutraliza el riesgo inherente de la entidad", "Que su riesgo de cumplimiento será alto, porque AUSTRAC lo obtiene directamente de trasladar el riesgo inherente de LA/FT de la entidad", "Que la entidad puede tener riesgo alto de LA/FT y, a la vez, una calificación baja de riesgo de cumplimiento, porque son medidas diferentes", "Que queda fuera de la supervisión de AUSTRAC, que concentra sus actividades en entidades con riesgo alto de LA/FT y de cumplimiento"], "x": "El ejemplo australiano define el riesgo de cumplimiento como el riesgo de no cumplir las obligaciones regulatorias, medida diferente al riesgo de LA/FT, y pone ese mismo caso: riesgo alto de LA/FT con riesgo de cumplimiento bajo.", "ref": "Anexo 1 · Australia · Tema 3.2.1"}, {"id": "G086", "tema": "gafiebr", "tipo": "caso", "q": "En Galdria, un inversionista propone adquirir un paquete accionario que le daría el control de un banco existente. ¿Qué Principio Básico de Basilea del Anexo 2 da al supervisor el poder de revisar, rechazar o condicionar esa operación?", "a": "Principio 6, transferencia de propiedad significativa: revisar, rechazar e imponer condiciones prudenciales a la propuesta de transferencia", "o": ["Principio 7, adquisiciones mayores: aprobar o rechazar inversiones del propio banco, incluido el establecimiento de operaciones transfronterizas", "Principio 13, relaciones bilaterales: compartir información entre supervisores de grupos transfronterizos y cooperar en situaciones de crisis", "Principio 6, transferencia de propiedad significativa: revisar, rechazar e imponer condiciones prudenciales a la propuesta de transferencia", "Principio 12, supervisión consolidada: supervisar al grupo bancario en una base consolidada y aplicar estándares prudenciales a nivel mundial"], "x": "El PBB 6 se refiere a propuestas de transferencia de propiedad significativa o control en bancos existentes. El PBB 7 trata adquisiciones o inversiones que hace el propio banco, que es el distractor más cercano.", "ref": "Anexo 2 · PBB 6 y 7 · Tema 3.2.1"}, {"id": "G087", "tema": "gafiebr", "tipo": "cifra", "q": "Según el Anexo 1, ¿cómo organiza la FCA del Reino Unido la frecuencia de supervisión para sus dos categorías de mayor riesgo de lavado de dinero?", "a": "Programa sistemático de varios meses que se repite cada cuatro años, y visitas in situ de dos o tres días cada dos años para la segunda categoría", "o": ["Programa sistemático de varios meses que se repite cada cuatro años, y visitas in situ de dos o tres días cada dos años para la segunda categoría", "Programa sistemático de varios meses que se repite cada dos años, y visitas por evento sin periodicidad fija para la segunda categoría", "Examinaciones en ciclos de 12 a 18 meses para ambas categorías, con examinadores residentes in situ en las entidades más complejas", "Programa sistemático de dos o tres días cada año, y visitas in situ de varios meses de duración cada cuatro años para la segunda categoría"], "x": "El ejemplo del Reino Unido describe el Programa Sistemático de ALA (varios meses, cada cuatro años) y la segunda categoría con visitas de dos o tres días cada dos años; las de menor riesgo se visitan por eventos o revisiones temáticas. Los ciclos de 12 a 18 meses y los examinadores residentes son de Estados Unidos.", "ref": "Anexo 1 · Reino Unido y Estados Unidos · Tema 3.2.1"}, {"id": "G088", "tema": "gafiebr", "tipo": "caso", "q": "El Equipo de Revisión de ALA del supervisor sudafricano inspecciona a un banco que no cuenta con evaluación de riesgos de LA. ¿Qué describe el Anexo 1?", "a": "Que el equipo debe realizar su propia evaluación con base en la estructura que proporcione el banco y en los riesgos inherentes de sus actividades", "o": ["Que el equipo debe suspender la inspección hasta que el banco elabore su evaluación de riesgos y la haga aprobar por su alta dirección", "Que el equipo debe aplicar al banco la evaluación nacional de riesgos del país sin atender a su estructura ni a sus actividades particulares ni a sus clientes", "Que el equipo debe asignar al banco la categoría de riesgo más alta y recomendar de inmediato la revocación de su licencia bancaria", "Que el equipo debe realizar su propia evaluación con base en la estructura que proporcione el banco y en los riesgos inherentes de sus actividades"], "x": "El ejemplo de Sudáfrica dice que, ante la ausencia de evaluación de riesgos del banco, o si ésta es inadecuada, el equipo debe realizar su propia evaluación con base en la estructura del banco y los factores de riesgo inherentes, y después enfocar la inspección en las actividades de alto riesgo.", "ref": "Anexo 1 · Sudáfrica · Tema 3.2.1"}, {"id": "G089", "tema": "gafiebr", "tipo": "caso", "q": "La autoridad de Almendria verifica que los bancos tengan políticas y procesos adecuados, incluidas reglas estrictas de debida diligencia de clientes, para evitar que sean utilizados, intencionalmente o no, para actividades criminales. ¿Con qué Principio Básico del Anexo 2 se relaciona?", "a": "Principio 29, abuso de servicios bancarios, que además busca promover altos estándares éticos y profesionales en el sector financiero", "o": ["Principio 26, control y auditorías internas, que exige separación de funciones y funciones de cumplimiento y auditoría independientes", "Principio 5, criterios de licenciamiento, que exige evaluar la estructura de propiedad y el gobierno corporativo del banco solicitante", "Principio 29, abuso de servicios bancarios, que además busca promover altos estándares éticos y profesionales en el sector financiero", "Principio 15, proceso de administración de riesgos, que exige identificar, medir, monitorear y controlar todos los riesgos materiales"], "x": "El PBB 29 (abuso de servicios bancarios) menciona políticas y procesos adecuados con reglas estrictas de DDC para evitar el uso del banco para actividades criminales; la nota 27 lo vincula con el ajuste de intensidad del párr. 39 d). El PBB 26 trata el control interno en general.", "ref": "Anexo 2 · PBB 29 · Nota 27 · Tema 3.2.1"}, {"id": "G090", "tema": "gafiebr", "tipo": "cifra", "q": "¿Qué Principios Básicos de Basilea designa el GAFI como relevantes para la supervisión ALA/CFT (R. 26), según el Anexo 2 y la nota 28?", "a": "Los principios 1 a 3, 5 a 9, 11 a 15, 26 y 29, que suman quince", "o": ["Los principios 1 a 3, 5 a 9, 11 a 15, 26 y 29, que suman quince", "Los principios 2 a 9, 12 a 15, 26 y 28, que suman catorce", "Los principios 1 a 29 en su totalidad, que la guía considera relevantes", "Los principios 1 a 5, 8, 11 a 13, 25 y 29, que suman once"], "x": "La nota 28 y el Anexo 2 enumeran los PBB 1–3, 5–9, 11–15, 26 y 29: quince principios. No se incluyen, por ejemplo, el 4 ni el 10.", "ref": "Anexo 2 · Nota 28 · Tema 3.2.1"}, {"id": "B001", "tema": "bcbs2014", "tipo": "memoria", "q": "De acuerdo con el párrafo 14, disponer de «políticas y procesos adecuados» en materia de BC/FT exige:", "a": "Aplicar medidas adicionales a unas normas CDD eficaces, proporcionadas, en función del riesgo e informadas por la evaluación del propio banco", "o": ["Aplicar normas CDD eficaces, ya que la diligencia debida con la clientela agota por sí misma el contenido de las políticas y procesos adecuados", "Aplicar medidas adicionales a unas normas CDD eficaces, proporcionadas, en función del riesgo e informadas por la evaluación del propio banco", "Sustituir las normas CDD por la evaluación de riesgos que el supervisor realiza del sistema bancario nacional", "Adoptar un único programa estandarizado de CDD, idéntico para todos los bancos del sistema, con independencia de la evaluación de riesgos de cada uno"], "x": "El párr. 14 señala que disponer de «políticas y procesos adecuados» exige la aplicación de otras medidas adicionales a unas normas CDD eficaces, y que esas medidas deberán ser proporcionadas, estar en función del riesgo e informadas por la propia evaluación que el banco hace de sus riesgos BC/FT. El distractor más tentador reduce todo a la CDD, justo lo que el texto descarta. El requisito deriva del Principio 29 de los Principios básicos (2012).", "ref": "Párr. 14 · Tema 3.2.2"}, {"id": "B002", "tema": "bcbs2014", "tipo": "memoria", "q": "Al realizar un análisis integral del riesgo BC/FT, ¿qué factores de riesgo deberá considerar el banco según el párrafo 15?", "a": "Todos los relevantes, inherentes y residuales, a escala nacional, sectorial, bancaria y de relación comercial, entre otras", "o": ["Solo los inherentes a escala bancaria, porque los residuales se analizan después en la auditoría interna", "Los inherentes a escala nacional y sectorial, dejando los de relación comercial para la política de aceptación de clientes del banco", "Todos los relevantes, inherentes y residuales, a escala nacional, sectorial, bancaria y de relación comercial, entre otras", "Los residuales a escala de relación comercial, pues los factores nacionales y sectoriales los evalúa el supervisor, no el banco"], "x": "El párr. 15 pide considerar todos los factores de riesgo relevantes, tanto inherentes como residuales, a escala nacional, sectorial, bancaria y de relación comercial, «entre otras», para determinar el perfil de riesgo y el nivel de mitigación. Los distractores recortan la lista (solo inherentes, solo residuales o sin la relación comercial). La nota 16 añade que, cuando proceda, se tengan en cuenta evaluaciones supranacionales.", "ref": "Párr. 15 · Tema 3.2.2"}, {"id": "B003", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Altamar desarrolla una billetera digital que lanzará en seis meses. El área comercial propone evaluar sus riesgos BC/FT hasta que tenga clientes. Conforme al párrafo 16, ¿qué procede?", "a": "Evaluarla desde ahora: el conocimiento de los riesgos inherentes incluye los productos en desarrollo o en fase de lanzamiento", "o": ["Evaluar solo las jurisdicciones de los futuros clientes, porque los riesgos de productos y canales se revisan en la auditoría interna", "Evaluarla desde ahora: el conocimiento de los riesgos inherentes incluye los productos en desarrollo o en fase de lanzamiento", "Esperar a que el supervisor autorice el producto, ya que a él le corresponde evaluar los riesgos de los productos nuevos", "Esperar al lanzamiento, porque el conocimiento de los riesgos se construye con datos de operaciones ya realizadas"], "x": "El párr. 16 exige un conocimiento minucioso de los riesgos inherentes a clientes, productos, canales y servicios, «incluidos los productos en desarrollo o en fase de lanzamiento». El distractor más tentador invoca los «datos concretos de operaciones», que el mismo párrafo menciona como base del conocimiento, pero junto con otra información interna y fuentes externas, no como condición para empezar a evaluar.", "ref": "Párr. 16 · Tema 3.2.2"}, {"id": "B004", "tema": "bcbs2014", "tipo": "memoria", "q": "En el contexto del riesgo BC/FT, ¿qué requisito de gobierno señala el párrafo 17 como totalmente relevante?", "a": "Que el Consejo de Administración apruebe y supervise las políticas en materia de riesgos, gestión del riesgo y cumplimiento", "o": ["Que la alta dirección apruebe las políticas de riesgos y cumplimiento sin necesidad de informar al Consejo sobre la evaluación de riesgos BC/FT", "Que el Consejo de Administración apruebe y supervise las políticas en materia de riesgos, gestión del riesgo y cumplimiento", "Que el responsable ejecutivo de PBC/FT apruebe y supervise las políticas de riesgos y cumplimiento", "Que la auditoría interna apruebe las políticas de riesgos y cumplimiento antes de que se sometan al conocimiento del Consejo de Administración"], "x": "El párr. 17 dice que el requisito de que el Consejo de Administración apruebe y supervise las políticas de riesgos, gestión del riesgo y cumplimiento es totalmente relevante para BC/FT. Además, el Consejo deberá comprender claramente esos riesgos y recibir la información de la evaluación de forma puntual, completa, comprensible y precisa. El responsable PBC/FT ejecuta y vigila; no es quien aprueba en última instancia.", "ref": "Párr. 17 · Tema 3.2.2"}, {"id": "B005", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Cordillera debe designar a su responsable ejecutivo de PBC/FT. Según el párrafo 18, ¿a quién corresponde nombrarlo?", "a": "Al Consejo de Administración y a la alta dirección", "o": ["Al Consejo de Administración y a la alta dirección", "A la función de cumplimiento, con la ratificación posterior del supervisor bancario", "Al comité de auditoría del Consejo", "A la unidad de inteligencia financiera, a partir de una terna enviada por el banco"], "x": "El párr. 18 indica que el Consejo de Administración y la alta dirección deberán nombrar un responsable ejecutivo de PBC/FT con preparación adecuada y con la categoría y autoridad necesarias para que sus planteamientos reciban atención del Consejo, la alta dirección y las líneas de negocio. El comité de auditoría aparece en otro contexto: es ante quien rinde cuentas la auditoría interna (párr. 26).", "ref": "Párr. 18 · Tema 3.2.2"}, {"id": "B006", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el párrafo 21, ¿cuándo deberán recibir formación PBC/FT los nuevos empleados del banco?", "a": "Tan pronto como sea posible tras su contratación", "o": ["Tan pronto como sea posible tras su contratación", "Al concluir su periodo de prueba, cuando ya conozcan sus funciones concretas", "Antes de su contratación, como condición del proceso de selección de personal", "En el siguiente curso anual de actualización programado para toda la plantilla"], "x": "El párr. 21 dice que los nuevos empleados deberán recibir formación «tan pronto como sea posible tras su contratación». La selección de personal (con principios éticos y profesionales) es una política distinta, y los cursos de actualización son para que el personal ya formado mantenga al día sus conocimientos. La formación se adapta a funciones, responsabilidades y antigüedad, y su alcance y frecuencia a los factores de riesgo.", "ref": "Párr. 21 · Tema 3.2.2"}, {"id": "B007", "tema": "bcbs2014", "tipo": "caso", "q": "Lucía dirige el área de recursos humanos de Banco Ribera, que selecciona al personal con criterios éticos. Según el párrafo 19, ¿en qué línea de defensa PBC/FT se ubica su área?", "a": "En la segunda línea, junto con el responsable ejecutivo de PBC/FT y cumplimiento", "o": ["En la segunda línea, junto con el responsable ejecutivo de PBC/FT y cumplimiento", "En la primera línea, junto con las unidades de negocio en contacto con los clientes", "En ninguna, porque RR. HH. es una función de apoyo ajena a las líneas de defensa", "En la tercera línea, junto con el departamento de auditoría interna del banco"], "x": "El párr. 19 ubica en la segunda línea al responsable ejecutivo de PBC/FT y a la función de cumplimiento, «así como también las de recursos humanos o tecnología». La primera línea son las unidades de negocio (actividades de cara al público) y la tercera, la auditoría interna. Es fácil pensar que RR. HH. no es línea de defensa, pero el texto la incluye expresamente.", "ref": "Párr. 19 · Tema 3.2.2"}, {"id": "B008", "tema": "bcbs2014", "tipo": "trampa", "q": "Al describir las tres líneas de defensa, ¿cuál de estas figuras NO menciona el párrafo 19 en ninguna de ellas?", "a": "Los auditores externos", "o": ["El área de tecnología del banco", "Las actividades de cara al público", "Los auditores externos", "El departamento de auditoría interna"], "x": "El párr. 19 reparte las líneas así: 1ª, unidades de negocio (actividades de cara al público); 2ª, responsable ejecutivo de PBC/FT, cumplimiento, y también RR. HH. o tecnología; 3ª, auditoría interna. Los auditores externos no aparecen en ese reparto. El párr. 27, dentro del mismo apartado (c), les reconoce una importante función al evaluar controles en sus auditorías financieras, pero no los asigna a ninguna línea.", "ref": "Párr. 19 · Tema 3.2.2"}, {"id": "B009", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Laguna, de tamaño mediano, quiere que su responsable ejecutivo de PBC/FT acumule otra función. ¿Cuál es compatible según el párrafo 24?", "a": "Desempeñar también la función de director de riesgos", "o": ["Encabezar además la función de auditoría interna del banco", "Dirigir a la vez la línea de negocio de banca empresarial", "Desempeñar también la función de director de riesgos", "Asumir también las competencias de protección de datos"], "x": "El párr. 24 prevé que el responsable ejecutivo de PBC/FT también podrá desempeñar la función de director de riesgos, director de cumplimiento o equivalente. En cambio, el párr. 23 señala que, para evitar conflictos de intereses, no deberá, por ejemplo, asumir competencias en las líneas de negocio, en protección de datos ni en la función de auditoría interna.", "ref": "Párr. 23–24 · Tema 3.2.2"}, {"id": "B010", "tema": "bcbs2014", "tipo": "trampa", "q": "¿Qué afirmación NO es congruente con lo que dispone el párrafo 23 sobre el responsable ejecutivo de PBC/FT?", "a": "En bancos pequeños pueden tolerarse sus conflictos de intereses si la alta dirección lo autoriza", "o": ["Para permitir juicios ecuánimes, no deberá, por ejemplo, asumir competencias en la función de auditoría interna", "Ante conflictos con las líneas de negocio, deberá haber procedimientos para una consideración objetiva al más alto nivel", "En bancos pequeños pueden tolerarse sus conflictos de intereses si la alta dirección lo autoriza", "Los intereses comerciales no deberán oponerse al eficaz desempeño de sus atribuciones"], "x": "El párr. 23 dice que los posibles conflictos de intereses deberán evitarse «con independencia del tamaño del banco o de su estructura directiva». Por eso es falsa la idea de tolerarlos en bancos pequeños. Las otras tres afirmaciones reproducen el mismo párrafo: los intereses comerciales no deben oponerse a sus atribuciones, deben existir procedimientos para la consideración objetiva al más alto nivel y no debe asumir, por ejemplo, auditoría interna.", "ref": "Párr. 23 · Tema 3.2.2"}, {"id": "B011", "tema": "bcbs2014", "tipo": "memoria", "q": "Como parte de la segunda línea, el seguimiento continuo del cumplimiento a cargo del responsable ejecutivo de PBC/FT implica, según el párrafo 22:", "a": "Verificar por muestreo el cumplimiento y examinar informes de anomalías para alertar a la alta dirección o al Consejo", "o": ["Evaluar de forma independiente la gestión y los controles, rindiendo cuentas al comité de auditoría", "Aprobar y supervisar las políticas en materia de riesgos, gestión del riesgo y cumplimiento de todas las unidades del banco", "Verificar por muestreo el cumplimiento y examinar informes de anomalías para alertar a la alta dirección o al Consejo", "Identificar, evaluar y controlar directamente los riesgos de las actividades de cara al público y en contacto con los clientes"], "x": "El párr. 22 dice que el seguimiento continuo implica la verificación por muestreo del cumplimiento y el examen de informes de anomalías para alertar a la alta dirección o al Consejo si la dirección no aplica los procedimientos de forma responsable. Cada distractor corresponde a otro sujeto: la evaluación independiente es de la auditoría interna (párr. 26), el control directo es de la primera línea (párr. 19) y la aprobación de políticas es del Consejo (párr. 17).", "ref": "Párr. 22 · Tema 3.2.2"}, {"id": "B012", "tema": "bcbs2014", "tipo": "caso", "q": "La unidad de inteligencia financiera envía a Banco Pradera una consulta sobre las operaciones de un cliente de banca privada. Según el párrafo 22, ¿quién deberá ser el contacto del banco?", "a": "El responsable ejecutivo de PBC/FT", "o": ["El responsable ejecutivo de PBC/FT", "El director de la auditoría interna del banco", "El secretario del Consejo de Administración", "El gerente de relaciones que atiende al cliente"], "x": "El párr. 22 establece que el responsable ejecutivo de PBC/FT deberá ser el contacto para todas las cuestiones en esa materia de las autoridades internas y externas, incluidas las supervisoras y las unidades de inteligencia financiera (FIU). El gerente de relaciones pertenece a la primera línea y la auditoría interna a la tercera; ninguno es el punto de contacto previsto.", "ref": "Párr. 22 · Tema 3.2.2"}, {"id": "B013", "tema": "bcbs2014", "tipo": "cifra", "q": "¿Cuántos aspectos enumera el párrafo 26 que deben cubrir las políticas del banco para realizar auditorías PBC/FT?", "a": "4 aspectos, de (i) a (iv)", "o": ["8 aspectos, de (i) a (viii)", "5 aspectos, de (i) a (v)", "4 aspectos, de (i) a (iv)", "3 aspectos, de (i) a (iii)"], "x": "Son 4: (i) adecuación de las políticas y procedimientos PBC/FT para tratar los riesgos identificados; (ii) eficacia de su aplicación por el personal; (iii) eficacia de la vigilancia del cumplimiento y del control de calidad, incluidos parámetros de alerta automática; y (iv) eficacia de los programas de formación. No lo confundas con los 5 incisos del enfoque del supervisor (párr. 86).", "ref": "Párr. 26 · Tema 3.2.2"}, {"id": "B014", "tema": "bcbs2014", "tipo": "trampa", "q": "¿Cuál de los siguientes aspectos NO figura entre los que deben cubrir las auditorías PBC/FT según el párrafo 26?", "a": "La rentabilidad de las líneas de negocio que atienden a clientes de alto riesgo", "o": ["La eficacia de los programas de formación del personal relevante del banco", "La adecuación de las políticas y procedimientos PBC/FT para tratar los riesgos identificados", "La eficacia de la vigilancia del cumplimiento y del control de calidad, incluidas las alertas automáticas", "La rentabilidad de las líneas de negocio que atienden a clientes de alto riesgo"], "x": "El párr. 26 enumera cuatro aspectos: adecuación de políticas y procedimientos, eficacia de su aplicación por el personal, eficacia de la vigilancia del cumplimiento y control de calidad (con parámetros de alerta automática) y eficacia de la formación. La rentabilidad de las líneas de negocio no aparece: la auditoría PBC/FT evalúa controles y cumplimiento, no resultados comerciales.", "ref": "Párr. 26 · Tema 3.2.2"}, {"id": "B015", "tema": "bcbs2014", "tipo": "caso", "q": "La alta dirección de Banco Ocre fija una auditoría PBC/FT idéntica, con la misma frecuencia y metodología, para todas sus áreas sin considerar su riesgo. ¿Qué exige el párrafo 26?", "a": "Que alcance y metodología se adecuen al perfil de riesgo del banco y que la frecuencia dependa también del riesgo", "o": ["Que alcance y metodología se adecuen al perfil de riesgo del banco y que la frecuencia dependa también del riesgo", "Nada adicional: una frecuencia fija y uniforme es la forma de garantizar la independencia de la tercera línea de defensa", "Que el responsable ejecutivo de PBC/FT defina alcance y metodología, por conocer mejor los riesgos", "Que se auditen las áreas con alertas, ya que no se exige auditar periódicamente todo el banco en materia de PBC/FT"], "x": "El párr. 26 pide a la dirección garantizar que el alcance y la metodología de las auditorías se adecuen al perfil de riesgo del banco y que su frecuencia dependa asimismo del riesgo; también que se asigne personal experto. Es falso que no se audite todo el banco: «periódicamente, los auditores internos deberán realizar auditorías PBC/FT de todo el banco». Y el responsable PBC/FT es 2ª línea, no quien diseña la auditoría.", "ref": "Párr. 26 · Tema 3.2.2"}, {"id": "B016", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el párrafo 26, ¿ante quién rinde cuentas la auditoría interna, como tercera línea de defensa, en materia PBC/FT?", "a": "Ante el comité de auditoría del Consejo o un órgano de vigilancia similar", "o": ["Ante el supervisor bancario, mediante informes periódicos sobre la eficacia de los controles", "Ante el responsable ejecutivo de PBC/FT, cabeza de la segunda línea", "Ante la alta dirección, que es la encargada de aprobar sus programas anuales de trabajo", "Ante el comité de auditoría del Consejo o un órgano de vigilancia similar"], "x": "El párr. 26 dice que la auditoría interna evalúa de forma independiente la gestión y los controles del riesgo, «rindiendo cuentas al comité de auditoría del Consejo de Administración o un órgano de vigilancia similar». No confundas: el responsable ejecutivo de PBC/FT rinde cuentas directamente a la alta dirección o al Consejo (párr. 24); si auditoría le reportara a él, perdería su independencia.", "ref": "Párr. 26 · Tema 3.2.2"}, {"id": "B017", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Nogal contrata a un despacho de auditores externos para evaluar la eficacia de sus políticas y procedimientos PBC/FT. Según el párrafo 27, ¿qué deberá garantizar el banco?", "a": "Que el alcance se adecue a sus riesgos, que los auditores tengan conocimientos y experiencia necesarios y darles seguimiento", "o": ["Que el alcance se adecue a sus riesgos, que los auditores tengan conocimientos y experiencia necesarios y darles seguimiento", "Que el supervisor apruebe previamente el informe del despacho antes de que sea presentado al Consejo de Administración del banco", "Que el despacho sustituya formalmente a la auditoría interna como tercera línea de defensa mientras dure el encargo contratado", "Que la revisión se limite a los estados financieros, dejando la evaluación de los controles PBC/FT a la función de cumplimiento"], "x": "El párr. 27 dice que, cuando el banco utilice auditores externos para evaluar la eficacia de sus políticas PBC/FT, deberá garantizar que el alcance se adecua a sus riesgos, que los auditores disponen de conocimientos y experiencia necesarios, y realizar un adecuado seguimiento de esas labores. Los auditores externos no sustituyen a la auditoría interna, y el párr. 19 no los incluye en ninguna de las tres líneas de defensa.", "ref": "Párr. 27 · Tema 3.2.2"}, {"id": "B018", "tema": "bcbs2014", "tipo": "caso", "q": "Banco Arcilla, pequeño y con operación local sencilla, concluye que no necesita un sistema de seguimiento basado en TI. Según el párrafo 28, ¿qué deberá hacer?", "a": "Documentar su decisión y poder demostrar al supervisor o a los auditores externos que dispone de una alternativa eficaz", "o": ["Contratar el sistema TI de otro banco de su jurisdicción, pues el párrafo 28 no admite alternativas al seguimiento automatizado", "Nada más: los bancos con operación local sencilla están exentos de contar con cualquier sistema de seguimiento de transacciones", "Solicitar una dispensa previa al supervisor, porque el sistema TI es obligatorio para todo banco", "Documentar su decisión y poder demostrar al supervisor o a los auditores externos que dispone de una alternativa eficaz"], "x": "El párr. 28 pide un sistema de seguimiento acorde con tamaño, actividades, complejidad y riesgos; en la mayoría de los bancos la automatización será «probablemente» necesaria. Cuando el banco considere que un sistema TI no es necesario, deberá documentar su decisión y ser capaz de demostrar a su supervisor o a los auditores externos que tiene una alternativa eficaz. No hay exención de seguimiento ni obligación absoluta de TI.", "ref": "Párr. 28 · Tema 3.2.2"}, {"id": "B019", "tema": "bcbs2014", "tipo": "caso", "q": "El proveedor del sistema de seguimiento de Banco Brisa ofrece sus parámetros estándar de alertas. Según el párrafo 29, ¿cómo debe proceder el banco?", "a": "Puede usarlos, pero los parámetros deberán reflejar y tener en cuenta su situación de riesgo específica", "o": ["Puede usarlos sin ajustes, porque se basan en la experiencia nacional e internacional sobre los métodos de BC o FT", "Puede usarlos una vez que el supervisor los certifique, porque fijar parámetros es atribución de la autoridad", "No puede usarlos, porque Basilea prohíbe los parámetros suministrados por el diseñador", "Puede usarlos, pero los parámetros deberán reflejar y tener en cuenta su situación de riesgo específica"], "x": "El párr. 29 dice que el banco «podrá hacer uso de los parámetros estándar suministrados por el diseñador», pero «los parámetros utilizados deberán reflejar y tener en cuenta la situación de riesgo específica del banco». El distractor más tentador toma una idea real del mismo párrafo (parámetros basados en la experiencia nacional e internacional) para concluir, erróneamente, que no requieren ajuste.", "ref": "Párr. 29 · Tema 3.2.2"}, {"id": "B020", "tema": "bcbs2014", "tipo": "memoria", "q": "Según el párrafo 31, ¿a quién corresponde evaluar el sistema TI de seguimiento para garantizar que es adecuado y que la primera y segunda líneas lo utilizan eficazmente?", "a": "A la auditoría interna", "o": ["Al responsable ejecutivo de PBC/FT", "A la auditoría interna", "Al diseñador del sistema de seguimiento", "Al área de tecnología que lo administra"], "x": "El párr. 31 asigna a la auditoría interna (tercera línea) evaluar el sistema TI para garantizar que es adecuado y que la primera y segunda líneas lo usan eficazmente. El responsable ejecutivo de PBC/FT debe tener acceso al sistema y evaluar las alertas (párr. 30), pero el párr. 31 encarga la evaluación del sistema a la auditoría interna, que revisa cómo lo usan la primera y la segunda líneas.", "ref": "Párr. 31 · Tema 3.2.2"}, {"id": "B021", "tema": "bcbs2014", "tipo": "caso", "q": "Andrés, solicitante de una cuenta en Banco Encino, es director general de una gran empresa privada. Al evaluar su riesgo conforme a la política de aceptación de clientes, ¿qué indica el párrafo 32?", "a": "Su ocupación es un factor pertinente, incluido si ocupa un puesto relevante en el sector público o privado", "o": ["Su ocupación es un factor pertinente, incluido si ocupa un puesto relevante en el sector público o privado", "Su ocupación se valora después, cuando el banco ya lo haya clasificado como cliente de alto riesgo", "Su ocupación es irrelevante; solo cuentan los puestos relevantes en el sector público", "Su ocupación no se valora; basta con considerar sus fuentes de renta y riqueza y su país de residencia habitual"], "x": "El párr. 32 enumera, entre los factores pertinentes, la ocupación del cliente «incluido si ocupa un puesto relevante en el sector público o privado», junto con antecedentes, fuentes de renta y riqueza, país de origen y residencia, productos, naturaleza y finalidad de las cuentas, cuentas vinculadas y actividades comerciales. El distra
