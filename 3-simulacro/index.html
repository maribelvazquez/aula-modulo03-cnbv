as del Exterior basta con 20 días hábiles", "Sí; el mínimo es de 15 días naturales", "Sí, siempre que se trate de una visita de investigación"], "x": "La solicitud debe presentarse por escrito cuando menos con 30 días naturales de anticipación a la fecha o periodo de la visita.", "ref": "Art. 71, primer párr. · Tema 3.1.2"}, {"id": "S257", "tema": "regsup", "tipo": "caso", "q": "Terminadas las actuaciones en el establecimiento clausurado, ¿con qué concluye la diligencia de clausura?", "a": "Con la colocación de sellos o marcas en accesos, archivos, bóvedas o equipos de cómputo", "o": ["Con la publicación del oficio de clausura en el Diario Oficial de la Federación", "Con la colocación de sellos o marcas en accesos, archivos, bóvedas o equipos de cómputo", "Con la entrega de las llaves del establecimiento a un interventor-gerente", "Con la firma del acta por el Presidente de la CNBV en las oficinas de la Comisión"], "x": "La diligencia concluye con sellos o marcas en accesos, archivos, bóvedas o equipos de cómputo.", "ref": "Art. 105 · Tema 3.1.2"}, {"id": "S258", "tema": "regsup", "tipo": "memoria", "q": "Para el Capítulo II del Título Séptimo, ¿qué es una Filial?", "a": "Entidad Supervisada con capital mayoritario de una Institución Financiera del Exterior o Sociedad Controladora Filial", "o": ["Sociedad constituida en el extranjero cuyo capital mayoritario pertenece a una Entidad Supervisada o a una Sociedad Controladora mexicana", "Entidad Supervisada con capital mayoritario de una Institución Financiera del Exterior o Sociedad Controladora Filial", "Oficina de representación en México de una entidad financiera del exterior", "Sucursal en México de un banco extranjero, sin personalidad jurídica propia distinta"], "x": "La fr. II define Filial como Entidad Supervisada con participación mayoritaria de una Institución Financiera del Exterior o Sociedad Controladora Filial.", "ref": "Art. 70, fr. II · Tema 3.1.2"}, {"id": "S259", "tema": "regsup", "tipo": "memoria", "q": "Según los transitorios de 2005, ¿qué artículos del reglamento abrogado de 1988 siguieron vigentes y hasta cuándo?", "a": "Los arts. 37, 38 y 39, hasta que la CNBV emitiera disposiciones sobre información periódica", "o": ["Los arts. 1 a 10, hasta la entrada en vigor de la reforma de 2012", "Los arts. 23, 24 y 25, hasta que concluyeran las visitas de inspección ya iniciadas antes de su entrada en vigor", "Los arts. 37, 38 y 39, hasta que la CNBV emitiera disposiciones sobre información periódica", "Los arts. 37, 38 y 39, durante los seis meses siguientes a su publicación"], "x": "El Tercero transitorio mantuvo los arts. 37, 38 y 39 hasta que la Comisión emitiera disposiciones sobre la información periódica.", "ref": "Transitorio TERCERO (2005) · Tema 3.1.2"}, {"id": "S260", "tema": "regsup", "tipo": "caso", "q": "Una casa de bolsa desea recibir las notificaciones de la CNBV por medios electrónicos. ¿Qué se requiere?", "a": "Que la entidad o su representante lo acepte o solicite expresamente por escrito a la CNBV", "o": ["Que la entidad o su representante lo acepte o solicite expresamente por escrito a la CNBV", "Que lo autorice la Junta de Gobierno de la CNBV mediante acuerdo notificado a la casa de bolsa", "Nada; la CNBV puede imponerlo unilateralmente por oficio", "Que la entidad publique en el Diario Oficial de la Federación su aceptación de ese medio"], "x": "Las notificaciones podrán hacerse por medios electrónicos cuando la entidad o su representante lo hayan aceptado o solicitado expresamente por escrito.", "ref": "Art. 108 · Tema 3.1.2"}, {"id": "S261", "tema": "regsup", "tipo": "caso", "q": "Una sociedad del país de origen es propietaria de acciones con voto que representan sólo el 30% del capital de otra, pero puede nombrar a la mayoría de su consejo de administración. ¿La controla para efectos del art. 70?", "a": "Sí, porque puede nombrar a la mayoría de los miembros del órgano de administración", "o": ["Sí, porque puede nombrar a la mayoría de los miembros del órgano de administración", "No, porque sus acciones con voto no representan el 51% del capital, único criterio de control del art. 70", "No, salvo que además tenga poder decisorio en sus asambleas de accionistas u órganos equivalentes", "Sólo si la CNBV lo declara así mediante oficio"], "x": "El control se da por cualquiera de los supuestos: acciones con voto que representen al menos el 51% del capital, poder decisorio en asambleas, nombrar a la mayoría del órgano de administración u otro medio.", "ref": "Art. 70, fr. VI, último párr. · Tema 3.1.2"}, {"id": "S262", "tema": "regsup", "tipo": "caso", "q": "La CNBV necesita ejecutar una clausura un domingo por la noche para evitar que se sustraigan documentos. ¿Es posible?", "a": "Sí; pueden habilitarse días y horas inhábiles cuando se requiera", "o": ["No; la clausura sólo procede en días y horas hábiles, sin excepción", "Sólo si el interesado consiente por escrito", "Sí; pueden habilitarse días y horas inhábiles cuando se requiera", "Sólo con orden judicial previa"], "x": "La clausura se realiza en días y horas hábiles, pudiendo habilitarse inhábiles para el debido cumplimiento de la facultad.", "ref": "Art. 103 · Tema 3.1.2"}, {"id": "S263", "tema": "regsup", "tipo": "caso", "q": "Un regulador extranjero pide directamente a un banco mexicano información sobre una operación. ¿Por conducto de quién únicamente puede proporcionarse?", "a": "De la CNBV, conforme a los convenios y acuerdos de cooperación celebrados", "o": ["Del auditor externo del banco", "Del propio banco, directamente, si el cliente titular otorga su consentimiento por escrito", "De la embajada del país solicitante", "De la CNBV, conforme a los convenios y acuerdos de cooperación celebrados"], "x": "La información requerida por supervisores de otros países únicamente puede proporcionarse por conducto de la Comisión.", "ref": "Art. 67 · Tema 3.1.2"}, {"id": "S264", "tema": "regsup", "tipo": "caso", "q": "La intervención de una entidad se volvió de imposible cumplimiento y el interventor-gerente pide su levantamiento conforme al art. 95 Bis; como la entidad carece de recursos para el inventario y el dictamen, la CNBV lo exime. ¿Qué documento debe elaborar para justificar el levantamiento?", "a": "Un informe con las causas de hecho y de derecho que justifiquen el levantamiento", "o": ["Un dictamen de los estados financieros de la entidad elaborado por un auditor externo independiente", "Un informe con las causas de hecho y de derecho que justifiquen el levantamiento", "El balance final de liquidación de la entidad intervenida", "Un programa de cumplimiento forzoso para la entidad intervenida"], "x": "En el levantamiento del art. 95 Bis, si se exime del inventario y dictamen, el interventor-gerente elabora un informe con las causas de hecho y de derecho que justifiquen el levantamiento. No confundir con el diagnóstico del art. 92 (exención durante la intervención).", "ref": "Art. 95 Bis · Tema 3.1.2"}, {"id": "S265", "tema": "regsup", "tipo": "caso", "q": "Durante la intervención, el interventor-gerente acredita imposibilidad material para elaborar el inventario y el dictamen del art. 92, y la CNBV lo exime. ¿Qué debe elaborar en todo caso?", "a": "Un diagnóstico de las causas de revocación, disolución, liquidación o concurso y las acciones a seguir", "o": ["Un informe general como el que se elabora al concluir una visita de inspección", "Un acta de entrega-recepción de la administración y de los bienes de la entidad", "El balance final de liquidación, con el detalle de activos y pasivos, para revisión y aprobación de la CNBV", "Un diagnóstico de las causas de revocación, disolución, liquidación o concurso y las acciones a seguir"], "x": "Art. 92: aun eximido del inventario y del dictamen, el interventor-gerente debe elaborar un diagnóstico de causas y de acciones a seguir. No confundir con el informe de causas de hecho y de derecho del levantamiento del art. 95 Bis.", "ref": "Art. 92, párrs. segundo y tercero · Tema 3.1.2"}, {"id": "S266", "tema": "regsup", "tipo": "caso", "q": "El oficio que notifica la declaración de intervención se dirige al director general de un banco. ¿A quién debe remitirse copia?", "a": "Al presidente del consejo de administración o al administrador único", "o": ["Al presidente del consejo de administración o al administrador único", "Al oficial de cumplimiento o al contralor normativo de la entidad", "Al auditor externo independiente o al comité de auditoría", "Al comisario de la sociedad o a su órgano de vigilancia"], "x": "A diferencia de los oficios de observaciones (copia al director general), el de intervención se dirige al director general con copia al presidente del consejo o administrador único.", "ref": "Art. 84, fr. IV · Tema 3.1.2"}, {"id": "S267", "tema": "regsup", "tipo": "caso", "q": "La CNBV verifica que una persona moral capta recursos del público, operación reservada a Entidades Supervisadas, sin contar con autorización. ¿Qué puede ordenar?", "a": "La suspensión inmediata de operaciones o la clausura administrativa del establecimiento", "o": ["La intervención gerencial de la persona moral por conducto de un interventor", "La suspensión inmediata de operaciones o la clausura administrativa del establecimiento", "Medidas precautorias del art. 50 Bis, con derecho de audiencia posterior", "Observaciones con plazo de 20 días hábiles para que regularice su situación"], "x": "Ante operaciones reservadas sin autorización, la CNBV podrá ordenar la suspensión inmediata de operaciones o la clausura administrativa.", "ref": "Art. 101, primer párr. · Tema 3.1.2"}, {"id": "S268", "tema": "regsup", "tipo": "caso", "q": "Concluida la diligencia de intervención de una casa de bolsa, ¿quiénes conservan los tres ejemplares del acta?", "a": "El funcionario o empleado que atendió por la entidad, la CNBV y el interventor", "o": ["El funcionario o empleado que atendió por la entidad, la CNBV y el interventor", "La entidad, la Junta de Gobierno y la SHCP", "La entidad, la CNBV y el Registro Público de Comercio del domicilio de la entidad", "El director general, el presidente del consejo de administración y la CNBV"], "x": "El acta se firma en tres ejemplares: uno para quien atiende por la entidad, otro para la Comisión y otro para el interventor.", "ref": "Art. 87, primer párr. · Tema 3.1.2"}, {"id": "S269", "tema": "regsup", "tipo": "trampa", "q": "¿En cuántos ejemplares se firma el acta de clausura y quiénes los conservan?", "a": "Dos: uno quien atiende la diligencia y otro el servidor público de la CNBV que la realiza", "o": ["Tres: uno quien atiende la diligencia, otro la CNBV y otro los testigos que intervinieron en ella", "Tres: uno el interesado, otro la CNBV y otro el interventor designado", "Uno, que conserva la CNBV, y se entrega copia simple a quien atiende", "Dos: uno quien atiende la diligencia y otro el servidor público de la CNBV que la realiza"], "x": "El acta de clausura se firma en dos ejemplares autógrafos (a diferencia de los tres del acta de intervención).", "ref": "Art. 104, párr. segundo · Tema 3.1.2"}, {"id": "S270", "tema": "regsup", "tipo": "memoria", "q": "¿Cuál de estos hechos es causa para que la CNBV levante la intervención de una Entidad Supervisada?", "a": "Que la entidad entre en disolución, liquidación o concurso mercantil", "o": ["Que la entidad lo solicite por escrito, con acuerdo de su consejo de administración", "Que la entidad entre en disolución, liquidación o concurso mercantil", "Que la entidad pague la multa que se le impuso por las irregularidades que motivaron la intervención", "Que el director general presente su renuncia"], "x": "Son causas: objetivos satisfechos e irregularidades corregidas, vencimiento del plazo legal, o disolución, liquidación o concurso mercantil.", "ref": "Art. 93, primer párr. · Tema 3.1.2"}, {"id": "S271", "tema": "regsup", "tipo": "caso", "q": "Al levantar el acta de conclusión de la visita a una Filial, ¿qué debe asentarse respecto de los Supervisores del Exterior?", "a": "El nombre de los que estén presentes al momento de levantarse el acta", "o": ["Nombre, cargo y firma de todos los designados en la orden de visita, estén o no presentes", "Su credencial y la firma de la autoridad que los designó", "Nada; su participación consta sólo en el acta de inicio", "El nombre de los que estén presentes al momento de levantarse el acta"], "x": "La fr. VII del art. 79 pide el nombre de los Supervisores del Exterior presentes al levantarse el acta.", "ref": "Art. 79, fr. VII · Tema 3.1.2"}, {"id": "S272", "tema": "regsup", "tipo": "caso", "q": "La ley que rige a cierto tipo de Entidad Supervisada prevé la clausura de sus sucursales, pero no establece un procedimiento específico. ¿Qué procedimiento sigue la CNBV?", "a": "El previsto en el Título Décimo del Reglamento", "o": ["El de intervención del Título Octavo", "El previsto en el Título Décimo del Reglamento", "El de emplazamiento del Título Sexto", "El que determine el Código de Comercio para el cierre de establecimientos"], "x": "La CNBV se sujeta al procedimiento de la ley; si ésta no contempla uno específico, aplica el Título Décimo.", "ref": "Art. 107 · Tema 3.1.2"}, {"id": "S273", "tema": "regsup", "tipo": "caso", "q": "Los objetivos de una intervención se cumplieron, pero aún no se nombra a quienes tendrán a su cargo la administración. ¿Puede levantarse la intervención?", "a": "No, hasta que se hagan los nuevos nombramientos y éstos tomen posesión efectiva", "o": ["Sí, basta el acuerdo de la Junta de Gobierno", "No, hasta que se hagan los nuevos nombramientos y éstos tomen posesión efectiva", "Sí, si el interventor-gerente entrega el inventario del activo y pasivo y el dictamen", "Sí, y el interventor-gerente queda como administrador provisional hasta los nombramientos"], "x": "La intervención no se levanta mientras no se hagan los nuevos nombramientos (o del liquidador o síndico) y tomen posesión efectiva.", "ref": "Art. 94 · Tema 3.1.2"}, {"id": "S274", "tema": "regsup", "tipo": "caso", "q": "La CNBV acuerda levantar una intervención gerencial. ¿A quién lo comunica para que se cancele la inscripción del nombramiento del interventor-gerente?", "a": "Al encargado de la oficina del Registro Público de Comercio donde se hizo la anotación", "o": ["Al notario público que protocolizó el oficio de nombramiento del interventor", "Al Diario Oficial de la Federación, para que publique el levantamiento", "Al encargado de la oficina del Registro Público de Comercio donde se hizo la anotación", "Al Registro Nacional de Valores, para cancelar la anotación correspondiente"], "x": "La CNBV comunica el levantamiento a la oficina del Registro Público de Comercio donde se inscribió el nombramiento, para cancelar la inscripción.", "ref": "Art. 96 · Tema 3.1.2"}, {"id": "S275", "tema": "regsup", "tipo": "caso", "q": "Los servidores públicos de la CNBV llegan a practicar la intervención de un banco y el director general no se encuentra. ¿Con quién se entiende la diligencia?", "a": "Con el principal funcionario que se encuentre presente", "o": ["Con el principal funcionario que se encuentre presente", "Con cualquier persona que se encuentre en el domicilio", "Se deja citatorio para el día hábil siguiente", "Con el vecino más inmediato"], "x": "En ausencia del director general, se entiende con el principal funcionario presente o, a falta de éste, con el funcionario o empleado de mayor nivel presente.", "ref": "Art. 85, primer párr. · Tema 3.1.2"}, {"id": "S276", "tema": "regsup", "tipo": "memoria", "q": "¿Qué debe manifestar por escrito y bajo protesta de decir verdad la persona designada interventor-gerente?", "a": "No sancionada en definitiva, ni condenada por delito intencional con pena corporal, ni inhabilitada o suspendida", "o": ["Que no es accionista ni consejero de otra entidad del mismo grupo financiero", "No sancionada en definitiva, ni condenada por delito intencional con pena corporal, ni inhabilitada o suspendida", "Que tiene al menos 10 años de experiencia en puestos directivos del sistema financiero y conocimientos en la materia", "Que no tiene créditos vencidos con la entidad intervenida ni con sus partes relacionadas"], "x": "El art. 88 exige manifestar que no ha sido sancionado por responsabilidad administrativa, condenado por delito intencional con pena corporal, ni inhabilitado o suspendido.", "ref": "Art. 88, párr. segundo · Tema 3.1.2"}, {"id": "S277", "tema": "regsup", "tipo": "memoria", "q": "Al levantarse la intervención, ¿qué se hace constar en el acta de entrega-recepción?", "a": "La situación de la entidad, el monto de sus activos y pasivos y su situación corporativa", "o": ["La situación de la entidad, el monto de sus activos y pasivos y su situación corporativa", "Las sanciones impuestas a la entidad durante la intervención y el estado de su cumplimiento", "La relación de clientes con operaciones inusuales detectadas por el interventor-gerente", "Las observaciones pendientes de atender"], "x": "El acta de entrega-recepción hace constar la situación de la entidad, sus activos, pasivos y situación corporativa.", "ref": "Art. 95, párr. segundo · Tema 3.1.2"}, {"id": "S278", "tema": "regsup", "tipo": "caso", "q": "La CNBV desconoce el nombre de quien opera sin autorización en un local. ¿Qué basta mencionar en el oficio de clausura para identificarlo?", "a": "Los elementos que permitan su identificación, como circunstancias de modo, tiempo y lugar", "o": ["Los elementos que permitan su identificación, como circunstancias de modo, tiempo y lugar", "Únicamente su clave del RFC, obtenida del SAT mediante requerimiento", "El nombre del propietario o arrendador del inmueble, obtenido previamente del Registro Público de la Propiedad", "Nada: sin el nombre del infractor no puede emitirse el oficio de clausura"], "x": "A falta del nombre, basta mencionar los elementos que permitan su identificación, como circunstancias de modo, tiempo y lugar.", "ref": "Art. 102, fr. III · Tema 3.1.2"}, {"id": "S279", "tema": "regsup", "tipo": "caso", "q": "Tras la clausura de un establecimiento, el interesado acude en tiempo a exponer su defensa y aporta pruebas. ¿En qué término se desahogan?", "a": "En 10 días hábiles posteriores a su presentación", "o": ["En 10 días naturales posteriores a su presentación", "En 5 días hábiles posteriores a su presentación", "En 15 días hábiles posteriores a su presentación", "En 10 días hábiles posteriores a su presentación"], "x": "Si aporta pruebas, se desahogan en el término de 10 días hábiles posteriores a su presentación.", "ref": "Art. 101, párr. segundo · Tema 3.1.2"}, {"id": "S280", "tema": "regsup", "tipo": "memoria", "q": "¿Qué órgano o servidor público designa, mediante oficio, a la persona que desempeñará la intervención administrativa o gerencial?", "a": "El Presidente de la CNBV", "o": ["El consejo de administración de la entidad", "La Secretaría de Hacienda y Crédito Público", "La Junta de Gobierno, por votación", "El Presidente de la CNBV"], "x": "La Junta de Gobierno declara la intervención (art. 81), pero el Presidente designa mediante oficio al interventor.", "ref": "Art. 82; art. 84, último párr. · Tema 3.1.2"}, {"id": "S281", "tema": "regsup", "tipo": "caso", "q": "La intervención de una entidad se volvió de imposible cumplimiento y no hay forma de nombrar administrador ni liquidador. ¿Qué puede hacer el interventor-gerente?", "a": "Solicitar a la CNBV el levantamiento de la intervención, con la documentación con que cuente", "o": ["Asumir el cargo de liquidador", "Solicitar a la CNBV el levantamiento de la intervención, con la documentación con que cuente", "Pedir directamente al Registro Público de Comercio la cancelación de la inscripción de su nombramiento", "Declarar por sí mismo el concurso mercantil de la entidad y asumir el cargo de síndico"], "x": "El art. 95 Bis permite al interventor-gerente solicitar el levantamiento cuando la intervención deje de cumplir su objeto o sea de imposible cumplimiento.", "ref": "Art. 95 Bis · Tema 3.1.2"}, {"id": "S282", "tema": "regsup", "tipo": "memoria", "q": "¿Dónde debe levantarse, por regla general, el acta de inicio de una visita a una Filial realizada con Supervisores del Exterior?", "a": "En el lugar donde la Filial tenga el asiento principal de su administración", "o": ["En la representación diplomática del país de origen de la Institución Financiera del Exterior", "En el lugar donde la Filial tenga el asiento principal de su administración", "En la sucursal que elija el Supervisor del Exterior, previa conformidad por escrito de la CNBV", "En las oficinas centrales de la CNBV"], "x": "La regla es el asiento principal de la administración; si la visita se realiza en otro lugar, el acta podrá levantarse donde efectivamente se realice.", "ref": "Art. 75 · Tema 3.1.2"}, {"id": "S283", "tema": "regsup", "tipo": "memoria", "q": "Conforme a su Segundo transitorio, ¿qué ordenamiento quedó abrogado (salvo lo dispuesto en los transitorios siguientes) al expedirse el Reglamento de Supervisión de la CNBV de 2005?", "a": "El Reglamento de la CNBS en materia de Inspección, Vigilancia y Contabilidad (DOF 24-nov-1988)", "o": ["El Reglamento Interior de la CNBV (DOF 2001)", "El Reglamento de la CNBS en materia de Inspección, Vigilancia y Contabilidad (DOF 24-nov-1988)", "El Reglamento de la Comisión Nacional de Valores en materia de inspección (DOF 1990)", "La Ley de la Comisión Nacional Bancaria y de Valores (DOF 1995)"], "x": "El Segundo transitorio del Reglamento de 2005 abroga el Reglamento de la Comisión Nacional Bancaria y de Seguros en materia de Inspección, Vigilancia y Contabilidad (DOF 24-nov-1988), salvo lo previsto en los transitorios Tercero y Cuarto. El Reglamento de 2005 sigue vigente, con reformas de 2012 y 2021.", "ref": "Transitorio SEGUNDO (2005) · Tema 3.1.2"}, {"id": "S284", "tema": "regsup", "tipo": "memoria", "q": "¿En qué supuestos puede la CNBV declarar la intervención administrativa o gerencial de una Entidad Supervisada?", "a": "Cuando peligre su solvencia, estabilidad o liquidez, o haya violaciones a las leyes o disposiciones", "o": ["Únicamente cuando haya sido declarada en concurso mercantil por la autoridad judicial", "Cuando no responda un oficio de observaciones dentro de los 20 días hábiles ni solicite la prórroga correspondiente", "Cuando lo solicite una Autoridad Supervisora del Exterior respecto de una Filial", "Cuando peligre su solvencia, estabilidad o liquidez, o haya violaciones a las leyes o disposiciones"], "x": "El art. 81 prevé la intervención ante peligro para la solvencia, estabilidad o liquidez, o violaciones a las leyes y disposiciones.", "ref": "Art. 81 · Tema 3.1.2"}, {"id": "S285", "tema": "regsup", "tipo": "caso", "q": "La CNBV ya notificó a una Filial la orden de visita solicitada por un supervisor extranjero, pero aún no conoce los nombres de los Supervisores del Exterior. ¿Hasta cuándo puede comunicarlos por escrito?", "a": "Hasta la diligencia de inicio de la visita", "o": ["Hasta el levantamiento del acta de conclusión", "Dentro de los 30 días naturales siguientes a la notificación", "No puede; deben constar en la orden original", "Hasta la diligencia de inicio de la visita"], "x": "La CNBV puede dar a conocer los nombres en cualquier momento posterior a la notificación de la orden y hasta la diligencia de inicio.", "ref": "Art. 72, penúltimo párr. · Tema 3.1.2"}, {"id": "S286", "tema": "regsup", "tipo": "caso", "q": "Al revisar el balance final de liquidación de una Entidad Supervisada, en un caso previsto por la ley, la CNBV encuentra deficiencias. ¿Qué puede hacer?", "a": "Ordenar las correcciones que, a su juicio, considere fundamentales", "o": ["Declarar la intervención gerencial de la entidad", "Sustituir al liquidador por un interventor-gerente designado por el Presidente", "Ordenar las correcciones que, a su juicio, considere fundamentales", "Declarar la nulidad del proceso de liquidación"], "x": "Cuando las leyes lo prevean, la CNBV puede revisar el balance final de liquidación y ordenar las correcciones fundamentales.", "ref": "Art. 100, primer párr. · Tema 3.1.2"}, {"id": "S287", "tema": "regsup", "tipo": "caso", "q": "La CNBV quiere revisar la sucursal en el extranjero de una Entidad Supervisada mexicana. ¿Puede practicar ahí visitas de inspección?", "a": "Sí, conforme a los acuerdos de cooperación e instrumentos internacionales celebrados", "o": ["Sí, conforme a los acuerdos de cooperación e instrumentos internacionales celebrados", "No; su competencia se limita al territorio nacional y sólo puede solicitar información por oficio", "Sólo si la Junta de Gobierno declara antes la intervención gerencial de la Entidad Supervisada", "Sólo a través del auditor externo de la entidad"], "x": "El art. 69 permite visitas a sucursales, agencias, subsidiarias u oficinas fuera del territorio nacional conforme a los acuerdos celebrados.", "ref": "Art. 69 · Tema 3.1.2"}, {"id": "S288", "tema": "regsup", "tipo": "caso", "q": "Durante la diligencia de intervención gerencial, empleados de la entidad bloquean el acceso a las instalaciones. ¿Qué pueden hacer los servidores públicos de la CNBV?", "a": "Solicitar, en todo momento, el auxilio de la fuerza pública", "o": ["Reprogramar la diligencia con 2 días hábiles de aviso", "Solicitar, en todo momento, el auxilio de la fuerza pública", "Declarar la clausura administrativa del establecimiento", "Suspender la intervención y citar a comparecer a los empleados"], "x": "Cuando se obstaculice o impida la diligencia de intervención, pueden solicitar en todo momento el auxilio de la fuerza pública.", "ref": "Art. 91 · Tema 3.1.2"}, {"id": "S289", "tema": "regsup", "tipo": "caso", "q": "Vencen los 15 días hábiles tras notificarse la suspensión de operaciones y el interesado no comparece ni aporta pruebas. ¿Qué ocurre?", "a": "La medida aplicada queda firme", "o": ["La medida se convierte en intervención gerencial", "La medida se levanta por falta de audiencia", "La medida aplicada queda firme", "Se abre un nuevo plazo por un periodo igual"], "x": "Si no comparece, no aporta pruebas o éstas no desvirtúan los hechos, la medida queda firme.", "ref": "Art. 101, párr. tercero · Tema 3.1.2"}, {"id": "S290", "tema": "regsup", "tipo": "caso", "q": "Durante la diligencia de intervención, el funcionario con quien se entendió se niega a firmar el acta y a recibir su ejemplar. ¿Qué efecto tiene?", "a": "Se asienta en el acta, sin que ello afecte su validez y valor probatorio", "o": ["La intervención queda suspendida hasta obtener su firma ante dos testigos", "El acta debe ratificarse ante notario para ser válida", "Se asienta en el acta, sin que ello afecte su validez y valor probatorio", "Se levanta una nueva acta al día hábil siguiente"], "x": "La negativa a firmar o recibir el ejemplar se asienta en la propia acta sin afectar su validez.", "ref": "Art. 87, párr. segundo · Tema 3.1.2"}, {"id": "G001", "tema": "gafiebr", "tipo": "memoria", "q": "Según la Sección I, ¿en qué consiste el enfoque basado en riesgo (EBR) de ALA/CFT?", "a": "En que países, autoridades competentes e instituciones financieras identifiquen, evalúen y entiendan sus riesgos de LA/FT y adopten medidas adecuadas para mitigarlos de manera efectiva", "o": ["En que las instituciones financieras concentren sus medidas ALA/CFT en los clientes y productos de riesgo alto y dejen sin controles a las relaciones que su evaluación haya calificado como de riesgo bajo", "En que países, autoridades competentes e instituciones financieras identifiquen, evalúen y entiendan sus riesgos de LA/FT y adopten medidas adecuadas para mitigarlos de manera efectiva", "En que las instituciones calculen la probabilidad matemática de cada transacción ilícita y fijen con ese cálculo una tolerancia cero frente a cualquier riesgo de LA/FT que llegue a materializarse", "En que el supervisor aplique a todas las instituciones el mismo conjunto de controles ALA/CFT, con independencia de su perfil, para asegurar la igualdad de condiciones entre los proveedores de servicios bancarios"], "x": "El párr. 9 define el EBR como identificar, evaluar y entender los riesgos y mitigarlos de manera efectiva. El distractor más tentador, concentrarse en lo alto y dejar lo bajo sin controles, choca con el párr. 11: un riesgo evaluado como bajo también se mitiga.", "ref": "Párrs. 9 y 11 · Tema 3.2.1"}, {"id": "G002", "tema": "gafiebr", "tipo": "caso", "q": "En una capacitación de Banco Albora, el director jurídico afirma: «Como la guía del GAFI no es obligatoria, aplicar un EBR queda a criterio del banco». ¿Cuál es la precisión correcta?", "a": "La guía no tiene efecto jurídico vinculante, pero la aplicación del EBR no es opcional: es un prerrequisito para aplicar con eficacia los Estándares del GAFI", "o": ["La guía adquirió efecto jurídico vinculante para los bancos al adoptarse en la Plenaria de octubre de 2014, por lo que el EBR es obligatorio en sus términos literales", "La guía sólo vincula a los países que codirigieron el grupo de proyecto, y en ellos el EBR se vuelve obligatorio a partir de la siguiente evaluación mutua del GAFI", "La guía no tiene efecto jurídico vinculante, pero la aplicación del EBR no es opcional: es un prerrequisito para aplicar con eficacia los Estándares del GAFI", "La guía no es vinculante y el EBR es opcional para los bancos, aunque resulta obligatorio para los supervisores por lo que dispone la Nota Interpretativa de la Recomendación 26"], "x": "Son dos afirmaciones distintas: el documento no es vinculante (párr. 8) y el enfoque no es opcional, pues es prerrequisito de la aplicación efectiva de los Estándares (párr. 15). La NI 26 sí pide que el supervisor adopte un EBR, pero eso no vuelve opcional el EBR para los bancos.", "ref": "Párrs. 8 y 15 · Tema 3.2.1"}, {"id": "G003", "tema": "gafiebr", "tipo": "cifra", "q": "¿Qué versión de las Recomendaciones del GAFI pasó a considerar el EBR un «fundamento esencial» del marco jurídico ALA/CFT de un país?", "a": "Las Recomendaciones de 2012, que pusieron mayor énfasis en el EBR sobre todo en medidas preventivas y de supervisión", "o": ["La guía adoptada en la Plenaria de octubre de 2014, que elevó el EBR de simple sugerencia a requisito de las Recomendaciones", "Las Recomendaciones de 2012, que pusieron mayor énfasis en el EBR sobre todo en medidas preventivas y de supervisión", "La serie de guías sectoriales adoptada entre 2007 y 2009, que convirtió el EBR en requisito para cada actividad y profesión", "Las Recomendaciones de 2003, que por primera vez exigieron aplicar el EBR en todas las áreas del marco jurídico ALA/CFT del país"], "x": "El párr. 13 contrasta las Recomendaciones de 2003, que sugerían el EBR en algunas áreas, con las de 2012, que lo consideran «fundamento esencial». La guía de 2014 no crea ese requisito: se revisó para guardar relación con los estándares de 2012 (párr. 1).", "ref": "Párrs. 1 y 13 · Tema 3.2.1"}, {"id": "G004", "tema": "gafiebr", "tipo": "memoria", "q": "¿Quién elaboró la guía de EBR para el sector bancario, según la Introducción?", "a": "Un grupo de miembros del GAFI codirigido por el Reino Unido y México, con participación y consulta del sector privado", "o": ["Un grupo codirigido por el Reino Unido y España, con la Federación Latinoamericana de Bancos como observadora", "Un grupo de miembros del GAFI codirigido por el Reino Unido y México, con participación y consulta del sector privado", "Un grupo de miembros del GAFI codirigido por Estados Unidos y México, sin intervención del sector privado en el borrador", "El Comité de Supervisión Bancaria de Basilea, a petición del GAFI y con comentarios de las federaciones bancarias"], "x": "El párr. 2 señala que el grupo fue codirigido por el Reino Unido y México y que representantes del sector privado estuvieron involucrados y fueron consultados. El CSBB participó como observador (nota 5), no como autor.", "ref": "Párr. 2 · Notas 5–7 · Tema 3.2.1"}, {"id": "G005", "tema": "gafiebr", "tipo": "memoria", "q": "De los propósitos de la guía que enumera la Introducción, ¿cuál se destaca «sobre todo»?", "a": "Fomentar el desarrollo de un entendimiento común sobre lo que es el EBR de ALA/CFT y lo que implica", "o": ["Fomentar el desarrollo de un entendimiento común sobre lo que es el EBR de ALA/CFT y lo que implica", "Compartir prácticas de supervisión de países para que las autoridades las adopten como estándares respaldados por el GAFI", "Establecer principios que sustituyan las normas nacionales de los países cuando éstas no prevean un enfoque basado en riesgo", "Medir la eficacia de las medidas nacionales de prevención dentro de la Cuarta Ronda de evaluaciones mutuas del GAFI"], "x": "El párr. 4 enumera cuatro propósitos y marca con «sobre todo» el entendimiento común del EBR. Compartir ejemplos es otro propósito, pero el Anexo 1 aclara que esas prácticas no son un respaldo del GAFI.", "ref": "Párr. 4 · Tema 3.2.1"}, {"id": "G006", "tema": "gafiebr", "tipo": "memoria", "q": "¿A quién está dirigida la guía?", "a": "A los países y sus autoridades competentes, incluidos los supervisores bancarios, y a los profesionales del sector bancario", "o": ["A los países y sus autoridades competentes, incluidos los supervisores bancarios, y a los profesionales del sector bancario", "A los supervisores bancarios y a las unidades de inteligencia financiera, pero no a los profesionales del sector bancario", "A los países y a las actividades y profesiones no financieras designadas que prestan servicios auxiliares a los bancos", "A los bancos y a los intermediarios del sector de valores, ya que ambos sectores se tratan de forma conjunta en esta versión"], "x": "El párr. 5 incluye a países, autoridades competentes (con los supervisores bancarios) y profesionales del sector bancario. El sector de valores queda para una guía por separado (párr. 1).", "ref": "Párrs. 1 y 5 · Tema 3.2.1"}, {"id": "G007", "tema": "gafiebr", "tipo": "caso", "q": "Banco Cendra tomó todas las medidas razonables para identificar y mitigar sus riesgos; aun así, un cliente logró usarlo para lavar dinero. ¿Qué reconoce la guía sobre esta situación?", "a": "Que el EBR no es infalible: puede haber ocasiones en que, aun con todas las medidas razonables, una institución siga siendo utilizada para LA/FT", "o": ["Que el EBR no es infalible: puede haber ocasiones en que, aun con todas las medidas razonables, una institución siga siendo utilizada para LA/FT", "Que el uso del banco para LA/FT demuestra por sí mismo que su evaluación de riesgos fue deficiente y que sus controles quedan invalidados en su conjunto", "Que el banco debió adoptar controles iguales a los del resto del sector para que el riesgo materializado pudiera considerarse justificado ante el supervisor", "Que, al haber tomado medidas razonables, el banco puede quedar exento de supervisión ALA/CFT en el siguiente ciclo conforme al principio de proporcionalidad"], "x": "El párr. 10 reconoce expresamente que el EBR no es infalible. Tampoco un incidente invalida por sí solo los controles (párr. 26), y ninguna institución debe quedar exenta de supervisión (párr. 20).", "ref": "Párrs. 10, 20 y 26 · Tema 3.2.1"}, {"id": "G008", "tema": "gafiebr", "tipo": "trampa", "q": "Frente a riesgos de LA/FT evaluados como bajos, ¿qué implica el EBR?", "a": "Que no exime de mitigarlos: las medidas se aplican, aunque su grado, frecuencia o intensidad pueden ser menores", "o": ["Que exime a la institución de mitigarlos, siempre que la evaluación esté documentada y aprobada por la alta dirección", "Que permite al banco decidir por su cuenta no aplicar ciertas Recomendaciones del GAFI a ese producto o actividad", "Que no exime de mitigarlos: las medidas se aplican, aunque su grado, frecuencia o intensidad pueden ser menores", "Que obliga a aplicar las mismas medidas que en riesgo alto, porque el EBR modula la supervisión y no las medidas del banco"], "x": "El párr. 11 dice que el EBR no exime de mitigar riesgos bajos y el párr. 16 aclara que con menor riesgo las medidas se aplican con menor grado, frecuencia o intensidad. No aplicar ciertas Recomendaciones es una decisión del país, no del banco (nota 22).", "ref": "Párrs. 11 y 16 · Nota 22 · Tema 3.2.1"}, {"id": "G009", "tema": "gafiebr", "tipo": "memoria", "q": "La Recomendación 1 establece el alcance de la aplicación del EBR. ¿Respecto de qué tres cuestiones se aplica, según la Sección I · C?", "a": "Quién y qué debe estar sujeto al régimen ALA/CFT, cómo se vigila a los sujetos y la forma en que éstos cumplen", "o": ["Cómo se tipifica el lavado de activos, cómo se decomisan los bienes y cómo coopera el país con otras jurisdicciones", "Qué productos puede ofrecer un banco, a qué clientes debe rechazar y qué sanciones impone el supervisor por incumplir", "Quién y qué debe estar sujeto al régimen ALA/CFT, cómo se vigila a los sujetos y la forma en que éstos cumplen", "Cómo se evalúa al país, cómo se publica su evaluación mutua y cómo se da seguimiento a sus planes de acción"], "x": "El párr. 16 organiza la R. 1 en tres ámbitos: quién queda sujeto, cómo se le vigila (con la NI 26 pidiendo al supervisor su propio EBR) y cómo cumple (medidas reforzadas o reducidas según el riesgo).", "ref": "Párr. 16 · Tema 3.2.1"}, {"id": "G010", "tema": "gafiebr", "tipo": "caso", "q": "La República de Valdoria detecta que un tipo de actividad no incluida en el alcance de las Recomendaciones del GAFI podría representar un mayor riesgo de LA/FT. Según la R. 1, ¿qué corresponde?", "a": "Los países deberían incluir en su régimen a otras instituciones, sectores o actividades si se sospecha que representan un mayor riesgo de LA/FT", "o": ["El país puede incorporarla sólo si una evaluación concluye que su riesgo es bajo, para aplicarle desde el inicio medidas simplificadas", "El país debe esperar a la siguiente evaluación mutua para que el GAFI valide la incorporación de esa actividad a su régimen ALA/CFT", "Los países deberían incluir en su régimen a otras instituciones, sectores o actividades si se sospecha que representan un mayor riesgo de LA/FT", "El país debe limitarse a los sectores definidos en el Glosario del GAFI, por lo que esa actividad sólo puede vigilarse mediante la supervisión prudencial"], "x": "El párr. 16 indica que, además de los sectores ya incluidos, los países deberían incluir otros si se sospecha mayor riesgo. La evaluación que concluye riesgo bajo es la condición para considerar exentar, no para incorporar.", "ref": "Párr. 16 · Tema 3.2.1"}, {"id": "G011", "tema": "gafiebr", "tipo": "caso", "q": "Banco Fidelca identifica un segmento de clientes de mayor riesgo, pero la norma nacional no indica con claridad cómo mitigarlo. ¿Qué debe hacer según la guía?", "a": "Aplicar siempre debida diligencia reforzada, por ejemplo variando el grado de monitoreo continuo reforzado, aunque la norma no lo indique", "o": ["Abstenerse de medidas adicionales hasta que la autoridad emita disposiciones que indiquen expresamente cómo mitigar ese riesgo mayor", "Aplicar debida diligencia estándar, porque ante la falta de norma expresa el banco no puede ir más allá de lo que exige la regulación", "Aplicar siempre debida diligencia reforzada, por ejemplo variando el grado de monitoreo continuo reforzado, aunque la norma no lo indique", "Solicitar al supervisor una exención temporal de las obligaciones de DDC para ese segmento mientras se aclara el marco normativo aplicable"], "x": "El párr. 18 establece que, cuando los riesgos son mayores, los bancos siempre deberán aplicar debida diligencia reforzada, incluso si las leyes o normas no indican de forma clara cómo mitigarlos. La ausencia de norma no justifica esperar ni quedarse en lo estándar.", "ref": "Párr. 18 · Tema 3.2.1"}, {"id": "G012", "tema": "gafiebr", "tipo": "caso", "q": "El Estado de Marendia tiene un sector de servicios financieros que apenas surge y un marco de supervisión aún en desarrollo. ¿Qué admite la guía sobre la flexibilidad de sus bancos?", "a": "Que puede limitar la flexibilidad de sus bancos y que una aplicación más normativa de los requisitos podría ser apropiada hasta fortalecer la experiencia del sector", "o": ["Que puede limitar la flexibilidad de sus bancos y que una aplicación más normativa de los requisitos podría ser apropiada hasta fortalecer la experiencia del sector", "Que debe exentar a sus bancos de la supervisión ALA/CFT hasta que el sector madure y la autoridad pueda evaluar sus capacidades de gestión del riesgo", "Que debe sustituir el EBR por reglas fijas de manera permanente, sin posibilidad de ampliar la flexibilidad aunque mejore la experiencia del sector", "Que debe conceder a sus bancos la mayor flexibilidad posible del EBR, porque un sector incipiente presenta riesgos de LA/FT bajos por su tamaño reducido"], "x": "El párr. 19 permite limitar la flexibilidad y señala que una aplicación más normativa «podría ser apropiada» hasta fortalecer la comprensión y experiencia del sector, es decir, de forma transitoria. Exentar de supervisión está descartado por el párr. 20.", "ref": "Párrs. 19–20 · Nota 18 · Tema 3.2.1"}, {"id": "G013", "tema": "gafiebr", "tipo": "trampa", "q": "Aun cuando la capacidad y la observancia de una institución sean buenas, ¿qué NO debe ocurrir según la Sección I · D?", "a": "Que la institución quede exenta de la supervisión en materia de ALA/CFT", "o": ["Que el supervisor combine para ella la supervisión in situ y extra situ que el régimen permita", "Que el supervisor tome en cuenta la evaluación de riesgo y la mitigación del propio banco", "Que la institución quede exenta de la supervisión en materia de ALA/CFT", "Que la autoridad le asigne menos recursos de supervisión que a instituciones de mayor riesgo"], "x": "El párr. 20 prohíbe dejar instituciones exentas de supervisión ALA/CFT, aunque el EBR sí podría llevar a asignar más recursos a las de mayor riesgo. Considerar la evaluación del banco (párr. 16) y combinar in situ y extra situ (párr. 39 b) son prácticas admitidas.", "ref": "Párrs. 16, 20 y 39 b) · Tema 3.2.1"}, {"id": "G014", "tema": "gafiebr", "tipo": "memoria", "q": "Para que los bancos puedan identificar correctamente el riesgo de LA/FT, ¿qué requiere la NI 1.3, según la Sección I · D?", "a": "Que los países cuenten con mecanismos para compartir los resultados de las evaluaciones de riesgo con autoridades, instituciones financieras y otras partes interesadas", "o": ["Que las autoridades dejen sin efecto las disposiciones de protección de datos que limiten el acceso de los bancos a la información sobre amenazas de LA/FT", "Que los bancos entreguen al supervisor sus evaluaciones internas de riesgo para que la autoridad las publique junto con la evaluación nacional y puedan compararse entre sí", "Que las unidades de inteligencia financiera compartan con los bancos la información sensible de sus investigaciones, sin reservas derivadas de la confidencialidad o de la seguridad nacional", "Que los países cuenten con mecanismos para compartir los resultados de las evaluaciones de riesgo con autoridades, instituciones financieras y otras partes interesadas"], "x": "El párr. 21 cita la NI 1.3: mecanismos de intercambio de información apropiada sobre los resultados de las evaluaciones de riesgo. La guía menciona la sensibilidad de la información y la protección de datos como obstáculos, no ordena eliminarlos.", "ref": "Párr. 21 · Tema 3.2.1"}, {"id": "G015", "tema": "gafiebr", "tipo": "caso", "q": "Una analista de Banco Tesalia sostiene que la guía obliga a clasificar los riesgos en exactamente tres categorías y a calcular la probabilidad de las transacciones ilícitas. ¿Qué dice realmente el texto?", "a": "Que a menudo los riesgos se sitúan en bajo, medio y alto, con posibles combinaciones, y que no se requieren necesariamente cálculos de probabilidad", "o": ["Que a menudo los riesgos se sitúan en bajo, medio y alto, con posibles combinaciones, y que no se requieren necesariamente cálculos de probabilidad", "Que la clasificación debe tener exactamente tres categorías sin combinaciones intermedias, y que los cálculos de probabilidad se exigen a bancos sistémicos", "Que la clasificación debe tener cinco categorías fijas y que los cálculos de probabilidad quedan a criterio del banco, salvo en servicios de corresponsalía", "Que la clasificación en categorías debe evitarse, pues la evaluación consiste en recopilar información cuantitativa y cualitativa sin jerarquizarla"], "x": "El párr. 22 usa «a menudo» y admite combinaciones (medio-alto, medio-bajo); la nota 19 aclara que no se requieren necesariamente cálculos de probabilidad, que podrían no ser significativos. Las categorías sirven para organizar los riesgos de forma prioritaria.", "ref": "Párr. 22 · Nota 19 · Tema 3.2.1"}, {"id": "G016", "tema": "gafiebr", "tipo": "memoria", "q": "¿Cómo caracteriza la guía la evaluación del riesgo de LA/FT frente a la simple recopilación de datos?", "a": "Como mucho más que recopilar información cuantitativa y cualitativa: es la base de una mitigación eficaz y debe mantenerse actualizada", "o": ["Como una estimación del volumen de transacciones ilícitas del sector que hace innecesario clasificar los riesgos por prioridad", "Como un ejercicio de recopilación cuantitativa que se realiza al autorizar al banco y que se repite cuando el supervisor lo requiera", "Como un inventario cualitativo de amenazas cuyo uso principal es informar a la UIF, separado de las decisiones de mitigación", "Como mucho más que recopilar información cuantitativa y cualitativa: es la base de una mitigación eficaz y debe mantenerse actualizada"], "x": "El párr. 22 afirma que la evaluación es mucho más que la mera recopilación de información: es la base de la mitigación y debe mantenerse actualizada para no perder relevancia. La nota 19 advierte, además, que esos volúmenes ilícitos son desconocidos.", "ref": "Párr. 22 · Nota 19 · Tema 3.2.1"}, {"id": "G017", "tema": "gafiebr", "tipo": "caso", "q": "Banco Rivelta quiere dejar de aplicar ciertas Recomendaciones del GAFI a una cuenta básica que considera de bajo riesgo. ¿Qué precisa la guía sobre las exenciones?", "a": "Que exentar de algunas obligaciones es una decisión del país, que debe evaluar el riesgo, demostrar que es bajo y que se cumplen las condiciones de la NI 1.6", "o": ["Que exentar de algunas obligaciones es una decisión del país, que debe evaluar el riesgo, demostrar que es bajo y que se cumplen las condiciones de la NI 1.6", "Que el banco puede exentarse si el supervisor lo autoriza tras una visita in situ, aunque no exista una evaluación del riesgo de ese producto", "Que el banco puede exentarse si su alta dirección aprueba una evaluación documentada que concluya riesgo bajo y la comunica al oficial de cumplimiento y al supervisor", "Que ninguna autoridad puede conceder exenciones, porque la norma general de aplicar DDC en todos los casos impide cualquier excepción"], "x": "El párr. 24 y la nota 22 sitúan la exención en los países: riesgo bajo comprobado, circunstancias estrictamente limitadas y justificadas, y un tipo particular de institución o actividad. Que la DDC se aplique como norma general no impide que la NI 1 prevea esa excepción.", "ref": "Párr. 24 · Nota 22 · Tema 3.2.1"}, {"id": "G018", "tema": "gafiebr", "tipo": "memoria", "q": "Según la Sección I · D, ¿qué deben hacer los países y bancos que buscan aplicar medidas simplificadas?", "a": "Evaluar los riesgos de la categoría de clientes o productos, establecer el nivel más bajo de riesgo y definir el alcance y la intensidad de las medidas", "o": ["Aplicarlas a los clientes financieramente excluidos, dado que la exclusión es un indicador suficiente de menor riesgo de LA/FT", "Obtener la autorización previa de la UIF para cada cliente al que se aplicarán medidas simplificadas y conservar la constancia en el expediente", "Demostrar ante el GAFI que el sistema financiero del país en su conjunto tiene riesgo bajo comprobado antes de simplificar cualquier medida de debida diligencia", "Evaluar los riesgos de la categoría de clientes o productos, establecer el nivel más bajo de riesgo y definir el alcance y la intensidad de las medidas"], "x": "El párr. 24 exige evaluar la categoría de clientes o productos, fijar el nivel más bajo de riesgo y definir alcance e intensidad, sujeto al marco jurídico nacional (nota 20). La exclusión financiera no basta para simplificar (párr. 28).", "ref": "Párrs. 24 y 28 · Nota 20 · Tema 3.2.1"}, {"id": "G019", "tema": "gafiebr", "tipo": "caso", "q": "Durante la revisión de Banco Norvia, el supervisor encuentra un solo incidente, aislado e insignificante, en que un riesgo se materializó. ¿Qué debe tener presente según la guía?", "a": "Que un solo incidente aislado e insignificante no necesariamente invalida la integridad de los controles ALA/CFT del banco", "o": ["Que el incidente obliga a homologar los controles del banco con los de los demás bancos del sector para restablecer su integridad", "Que el incidente carece de relevancia supervisora, porque en un EBR los riesgos materializados se atribuyen al cliente y no al banco", "Que todo riesgo materializado invalida los controles del banco y obliga a rehacer su evaluación de riesgos antes de la siguiente revisión", "Que un solo incidente aislado e insignificante no necesariamente invalida la integridad de los controles ALA/CFT del banco"], "x": "El párr. 26 pide a las autoridades estar conscientes de que no todos los bancos adoptarán controles iguales y de que un incidente aislado e insignificante no necesariamente invalida los controles. «No necesariamente» no equivale a irrelevante: el banco sigue obligado a aplicar controles eficaces.", "ref": "Párr. 26 · Tema 3.2.1"}, {"id": "G020", "tema": "gafiebr", "tipo": "memoria", "q": "¿Qué deben entender los bancos sobre la flexibilidad que ofrece el EBR, según la Sección I · D?", "a": "Que un EBR flexible no los exime de una aplicación eficaz de controles en materia de ALA/CFT", "o": ["Que un EBR flexible les permite omitir controles en las líneas de negocio que la alta dirección considere estratégicas", "Que un EBR flexible no los exime de una aplicación eficaz de controles en materia de ALA/CFT", "Que la flexibilidad los autoriza a seguir guías del sector privado aunque no sean compatibles con la legislación nacional", "Que la flexibilidad les permite apartarse de sus propias políticas y procedimientos en casos concretos, sin que el supervisor deba verificar que se apeguen a ellos"], "x": "El párr. 26 cierra con esa advertencia a los bancos. La guía de la industria debe ser compatible con la legislación nacional (párr. 49), y ninguna línea de negocio queda fuera de los controles. Y el supervisor verifica que el banco se apegue a sus propias políticas (párr. 42).", "ref": "Párrs. 26, 42 y 49 · Tema 3.2.1"}, {"id": "G021", "tema": "gafiebr", "tipo": "caso", "q": "En Ostrania, la autoridad supervisa con intensidad a los bancos grandes, pero casi no revisa a otras entidades que también deben cumplir requisitos ALA/CFT. ¿Qué efecto advierte la guía?", "a": "El desplazamiento de las actividades de mayor riesgo hacia instituciones con un nivel de supervisión bajo o inadecuado, afectando la igualdad de condiciones", "o": ["El desplazamiento de las actividades de mayor riesgo hacia instituciones con un nivel de supervisión bajo o inadecuado, afectando la igualdad de condiciones", "El aumento de la exclusión financiera, porque las entidades menos supervisadas tendrían que aplicar debida diligencia reforzada a todos sus clientes", "La pérdida de eficacia del EBR por concentrar recursos en bancos grandes, algo que la guía rechaza porque exige supervisar a todas con igual intensidad", "La invalidez de los controles de los bancos grandes, porque la guía condiciona su eficacia a que el resto del sector reciba idéntica frecuencia de visitas"], "x": "El párr. 27 pide supervisión eficaz de todas las entidades obligadas para apoyar la igualdad de condiciones y evitar el desplazamiento del riesgo. No exige igual intensidad: el párr. 20 admite asignar más recursos a las de mayor riesgo.", "ref": "Párrs. 20 y 27 · Tema 3.2.1"}, {"id": "G022", "tema": "gafiebr", "tipo": "caso", "q": "Banco Solenta propone aplicar debida diligencia simplificada a todas las personas que otros bancos rechazaron por mala calificación crediticia. ¿Qué indica la guía?", "a": "Que no deben aplicarse medidas simplificadas o exenciones sólo porque el cliente fue financieramente excluido; la exclusión es un factor de una evaluación integral", "o": ["Que debe aplicarles debida diligencia reforzada, porque la mala calificación crediticia constituye por sí sola un indicador de riesgo alto de LA/FT", "Que debe negarles la relación comercial, porque la guía considera incompatible atender a personas con antecedentes penales o con mala calificación crediticia en el sistema financiero", "Que no deben aplicarse medidas simplificadas o exenciones sólo porque el cliente fue financieramente excluido; la exclusión es un factor de una evaluación integral", "Que puede hacerlo, porque estar excluido del sistema financiero equivale a un menor riesgo de LA/FT y justifica medidas simplificadas para ese grupo"], "x": "El párr. 28 dice que la exclusión no equivale automáticamente a menor riesgo y que no se apliquen DDS o exenciones únicamente por esa razón; la Caja 4 pide una decisión informada con base en una evaluación integral. La guía no convierte la mala calificación en riesgo alto ni ordena rechazar.", "ref": "Párr. 28 · Caja 4 · Tema 3.2.1"}, {"id": "G023", "tema": "gafiebr", "tipo": "memoria", "q": "¿Cómo puede un EBR contribuir a la inclusión financiera, según la Sección I · D?", "a": "Permitiendo que los países establezcan exenciones basadas en bajos riesgos comprobados o que las instituciones flexibilicen la DDC en riesgos menores", "o": ["Permitiendo que los países establezcan exenciones basadas en bajos riesgos comprobados o que las instituciones flexibilicen la DDC en riesgos menores", "Permitiendo que las personas de bajos ingresos que no acreditan su identidad mantengan cuentas anónimas mientras reúnen la documentación requerida por el marco de debida diligencia", "Sustituyendo la supervisión ALA/CFT de los productos de inclusión por mecanismos de autorregulación de las asociaciones bancarias del país", "Autorizando a los bancos a prescindir de la DDC de las personas de bajos ingresos, con independencia del riesgo que represente cada relación"], "x": "El párr. 29 prevé exenciones basadas en bajos riesgos comprobados o mayor flexibilidad de DDC en riesgos menores. La nota 22 recuerda que la prohibición de cuentas anónimas aplica como norma general en todos los casos.", "ref": "Párr. 29 · Nota 22 · Tema 3.2.1"}, {"id": "G024", "tema": "gafiebr", "tipo": "trampa", "q": "Un alumno resume así la nota 22: «Los países pueden dejar de aplicar Recomendaciones cuando lo consideren conveniente para la inclusión financiera». ¿Qué matiz del texto omite?", "a": "Que procede con un bajo riesgo comprobado, en circunstancias estrictamente limitadas y justificadas, y para un tipo particular de institución o actividad", "o": ["Que procede cuando la exención abarca a todo el sistema financiero del país, de modo que ningún sector obtenga ventajas de arbitraje regulatorio", "Que procede cuando el GAFI aprueba previamente la exención en su Sesión Plenaria y la incorpora a la lista de guías sectoriales publicadas en su sitio", "Que procede para bancos de importancia sistémica, siempre que su supervisor prudencial confirme que sus controles internos son eficaces y suficientes", "Que procede con un bajo riesgo comprobado, en circunstancias estrictamente limitadas y justificadas, y para un tipo particular de institución o actividad"], "x": "La nota 22, citando la NI 1, exige riesgo bajo comprobado, circunstancias estrictamente limitadas y justificadas y un tipo particular de institución, actividad o APNFD. No es una decisión de conveniencia ni requiere aprobación de la Plenaria.", "ref": "Nota 22 · Párr. 29 · Tema 3.2.1"}, {"id": "G025", "tema": "gafiebr", "tipo": "memoria", "q": "¿Qué establece la NI 26 sobre la asignación de los recursos de supervisión, según la Sección II?", "a": "Que se asignen a las áreas de mayor riesgo de LA/FT, partiendo de que el supervisor comprende esos riesgos y tiene acceso in situ y extra situ a la información", "o": ["Que se concentren en los bancos de mayor tamaño, en el entendido de que el riesgo de LA/FT crece en proporción directa al volumen de activos y de operaciones de cada banco", "Que se destinen en primer término a la supervisión prudencial y que el remanente se aplique a revisiones ALA/CFT de los bancos calificados de alto riesgo", "Que se distribuyan en partes iguales entre todos los bancos autorizados, para garantizar un trato uniforme y evitar el arbitraje regulatorio entre instituciones", "Que se asignen a las áreas de mayor riesgo de LA/FT, partiendo de que el supervisor comprende esos riesgos y tiene acceso in situ y extra situ a la información"], "x": "El párr. 31 resume la NI 26: recursos hacia las áreas de mayor riesgo, sobre la base de que el supervisor entiende el riesgo del país y accede a información in situ y extra situ. El tamaño no se correlaciona necesariamente con el riesgo, como ilustra el ejemplo del Reino Unido en el Anexo 1.", "ref": "Párr. 31 · Anexo 1 · Reino Unido · Tema 3.2.1"}, {"id": "G026", "tema": "gafiebr", "tipo": "memoria", "q": "Para entender los riesgos sectoriales, ¿qué fuentes menciona la Sección II de forma no limitativa?", "a": "Las evaluaciones de riesgo nacionales, las tipologías nacionales o internacionales, la experiencia de supervisión y la retroalimentación de la UIF", "o": ["Las evaluaciones de riesgo nacionales, las tipologías nacionales o internacionales, la experiencia de supervisión y la retroalimentación de la UIF", "Los reportes de operaciones sospechosas de los bancos, que la guía presenta como la fuente objetiva a la que deben limitarse los supervisores", "Las autoevaluaciones de riesgo que presentan los bancos, que el supervisor debe tomar como definitivas sin contrastarlas con otras fuentes", "Las calificaciones de agencias crediticias y los estados financieros auditados, que en el sector bancario reemplazan a las tipologías"], "x": "El párr. 33 enumera, «de forma no limitativa», evaluaciones nacionales, tipologías, experiencia de supervisión y retroalimentación de la UIF. El párr. 32 pide recurrir a una variedad de recursos, no a una sola fuente.", "ref": "Párrs. 32–33 · Tema 3.2.1"}, {"id": "G027", "tema": "gafiebr", "tipo": "caso", "q": "Al perfilar a Banco Quiral, el supervisor analiza dos grupos de elementos: (1) productos, modelo de negocio, canales, perfiles de clientes y países de operación; (2) calidad de la política de gestión de riesgos y funcionamiento de la supervisión interna. ¿Cómo los ubica la guía?", "a": "El primer grupo corresponde al riesgo inherente del banco y el segundo a sus controles vigentes; el supervisor debe tomar en cuenta ambos", "o": ["Ambos grupos integran el riesgo sectorial, que la guía distingue del riesgo individual del banco y que se evalúa con tipologías internacionales", "El primer grupo corresponde a los controles vigentes y el segundo al riesgo inherente, y la prioridad de supervisión se fija con el segundo grupo", "El primer grupo es materia de la supervisión prudencial y el segundo de la ALA/CFT, sin que la guía prevea intercambio de información entre ellas", "El primer grupo corresponde al riesgo inherente del banco y el segundo a sus controles vigentes; el supervisor debe tomar en cuenta ambos"], "x": "El párr. 34 distingue el nivel de riesgo inherente (productos, tamaño, modelo de negocio, gobierno corporativo, canales, clientes, geografía) de los controles vigentes (política de gestión de riesgos, funciones de supervisión interna). Ambos se consideran; y el párr. 35 pide colaboración entre supervisores.", "ref": "Párrs. 34–35 · Tema 3.2.1"}, {"id": "G028", "tema": "gafiebr", "tipo": "caso", "q": "En Pradonia, un organismo realiza la supervisión prudencial de los bancos y otro distinto la supervisión ALA/CFT. ¿Qué implica esto según la guía?", "a": "Un intercambio de información y colaboración entre ambos supervisores, en especial por pertenecer las responsabilidades a agencias separadas", "o": ["Un intercambio de información y colaboración entre ambos supervisores, en especial por pertenecer las responsabilidades a agencias separadas", "Que cada organismo trabaje con su propia información, porque la confidencialidad prudencial impide compartirla con el supervisor ALA/CFT", "Que el país unifique ambos organismos, pues la guía considera inadecuado que las dos supervisiones recaigan en agencias distintas", "Que el supervisor ALA/CFT deje de considerar la gestión y la función de cumplimiento, pues esos aspectos corresponden al prudencial"], "x": "El párr. 35 dice que parte de la información se obtiene por la supervisión prudencial y que esto implica intercambio y colaboración, en especial con agencias separadas. El párr. 50 admite que haya más de un supervisor y pide coordinación, no fusión.", "ref": "Párrs. 35 y 50 · Tema 3.2.1"}, {"id": "G029", "tema": "gafiebr", "tipo": "memoria", "q": "¿Cuándo deben los supervisores analizar su evaluación del perfil de riesgo de LA/FT del sector y de los bancos?", "a": "Periódicamente y, en todo momento, cuando cambien las circunstancias del banco o surjan nuevas amenazas relevantes", "o": ["Cada cuatro años, en coincidencia con el calendario de evaluaciones mutuas del GAFI al país correspondiente", "Periódicamente y, en todo momento, cuando cambien las circunstancias del banco o surjan nuevas amenazas relevantes", "Después de cada visita in situ en la que se detecten incumplimientos graves en el programa ALA/CFT del banco", "Al otorgar la autorización del banco y cuando éste solicite ampliar sus líneas de negocio o su red de sucursales"], "x": "El párr. 37 combina revisión periódica con revisión en todo momento ante cambios o nuevas amenazas. Es la misma lógica que el párr. 57 aplica a la evaluación del propio banco.", "ref": "Párrs. 37 y 57 · Tema 3.2.1"}, {"id": "G030", "tema": "gafiebr", "tipo": "caso", "q": "La autoridad de Lusardia analiza una solicitud para adquirir una participación mayoritaria de un banco en un sector cuyo riesgo de LA/FT es alto. ¿Qué ajuste del párr. 39 aplica y qué permite?", "a": "El ajuste de la intensidad de los controles de autorización: con riesgo sectorial alto, el supervisor podrá solicitar información adicional", "o": ["El ajuste de la frecuencia de supervisión: con riesgo sectorial alto, el supervisor debe diferir la decisión hasta el siguiente examen periódico", "El ajuste de la intensidad de los controles de autorización: con riesgo sectorial alto, el supervisor podrá solicitar información adicional", "El ajuste de la intensidad de la supervisión: con riesgo sectorial alto, el supervisor debe negar la solicitud sin revisar la documentación", "El ajuste del tipo de supervisión: con riesgo sectorial alto, el supervisor debe sustituir la revisión documental por un análisis extra situ"], "x": "El párr. 39 a) trata la función de autorización: evitar que delincuentes tengan una parte significativa o mayoritaria de un banco. Con riesgo bajo puede bastar un examen de documentación; con riesgo alto «podrá» pedir información adicional, no negar de plano.", "ref": "Párr. 39 a) · Tema 3.2.1"}, {"id": "G031", "tema": "gafiebr", "tipo": "caso", "q": "Banco Ambrisa fue clasificado como de mayor riesgo. Un inspector propone supervisarlo en adelante sólo con la información que el banco reporta a gabinete. ¿Qué señala la guía?", "a": "Que la supervisión extra situ por sí sola puede no ser apropiada en situaciones de mayor riesgo, aunque el supervisor define la combinación que el régimen permita", "o": ["Que la supervisión extra situ por sí sola puede no ser apropiada en situaciones de mayor riesgo, aunque el supervisor define la combinación que el régimen permita", "Que es la opción recomendada, porque la guía reserva la supervisión in situ para bancos de menor riesgo que no presentan reportes regulatorios suficientes", "Que es admisible si el banco lo solicita por escrito, porque la combinación de supervisión in situ y extra situ la determina la entidad supervisada según su perfil de riesgo", "Que es la opción obligada, porque en un EBR el supervisor pierde el acceso in situ a la información de los bancos clasificados como de mayor riesgo"], "x": "El párr. 39 b) dice que el supervisor siempre debe tener acceso in situ y extra situ, que podrá determinar la combinación correcta en la medida en que el régimen lo permita y que la extra situ por sí sola puede no ser apropiada con mayor riesgo. La combinación la decide el supervisor, no el banco.", "ref": "Párr. 39 b) · Tema 3.2.1"}, {"id": "G032", "tema": "gafiebr", "tipo": "caso", "q": "El supervisor de Banco Irsel tiene programado su siguiente examen periódico dentro de dos años, pero recibe una denuncia de irregularidades sobre el banco. ¿Qué prevé la guía?", "a": "Combinar los exámenes periódicos con una supervisión ALA/CFT con fines específicos, detonada por indicadores como una denuncia de irregularidades", "o": ["Mantener el calendario previsto, pues la frecuencia se fija con el perfil de riesgo al inicio del ciclo y se modifica al concluir el examen periódico", "Combinar los exámenes periódicos con una supervisión ALA/CFT con fines específicos, detonada por indicadores como una denuncia de irregularidades", "Esperar a que la supervisión prudencial confirme la denuncia, ya que la guía reserva a sus hallazgos la posibilidad de adelantar una revisión", "Remitir la denuncia a la UIF y abstenerse de actuar, ya que las denuncias de irregularidades se atienden fuera de la supervisión ALA/CFT"], "x": "El párr. 39 c) pide ajustar la frecuencia al riesgo y combinar exámenes periódicos con supervisión con fines específicos ante denuncias, información de autoridades u otros hallazgos. Los hallazgos prudenciales son uno de esos detonantes, no el único.", "ref": "Párr. 39 c) · Tema 3.2.1"}, {"id": "G033", "tema": "gafiebr", "tipo": "memoria", "q": "¿Cuál es un ejemplo de supervisión más estricta que menciona el ajuste de intensidad del párr. 39 d)?", "a": "Realizar pruebas a fondo de sistemas y archivos y entrevistas con personal operativo, alta dirección y consejo de administración", "o": ["Reemplazar la visita por el análisis de reportes regulatorios y cuestionarios que el banco envía de forma periódica a gabinete", "Realizar pruebas a fondo de sistemas y archivos y entrevistas con personal operativo, alta dirección y consejo de administración", "Ampliar el intervalo entre exámenes periódicos y reducir las revisiones de seguimiento a los bancos con buen historial", "Basar la decisión de aprobación sobre accionistas en un examen de la documentación pertinente que presenta el solicitante"], "x": "El párr. 39 d) lista como supervisión más estricta las pruebas a fondo de sistemas y archivos, la revisión de auditoría interna y las entrevistas con personal, alta dirección y consejo. Basarse en documentación es el ejemplo de riesgo bajo del ajuste de autorización (39 a).", "ref": "Párr. 39 a) y d) · Tema 3.2.1"}, {"id": "G034", "tema": "gafiebr", "tipo": "cifra", "q": "¿Cuántas y cuáles son las formas de ajuste del enfoque del supervisor que enumera la Sección II · A?", "a": "Cuatro: intensidad de los controles de autorización, y tipo, frecuencia e intensidad de la supervisión ALA/CFT", "o": ["Cinco: autorización, tipo, frecuencia, intensidad y publicación de los resultados de la supervisión a los bancos", "Tres: autorización de accionistas, imposición de sanciones y revocación de la licencia según el riesgo identificado", "Cuatro: identificación, verificación, monitoreo y reporte de las operaciones de los bancos bajo supervisión", "Cuatro: intensidad de los controles de autorización, y tipo, frecuencia e intensidad de la supervisión ALA/CFT"], "x": "El párr. 39 enumera los incisos a) a d): autorización, tipo, frecuencia e intensidad. Identificar, verificar, monitorear y reportar son tareas del banco en la Sección III, no ajustes del supervisor.", "ref": "Párr. 39 · Tema 3.2.1"}, {"id": "G035", "tema": "gafiebr", "tipo": "caso", "q": "Tras un ciclo de visitas, el supervisor de Nerania detecta debilidades comunes en los programas ALA/CFT de varios bancos. ¿Qué indica la guía sobre esos resultados?", "a": "Usarlos para revisar sus evaluaciones de riesgo y su enfoque y, cuando proceda y respetando la confidencialidad, comunicarlos a los bancos", "o": ["Reservarlos para uso interno de la autoridad, porque darlos a conocer a los bancos compromete la confidencialidad y no contribuye a mejorar su EBR", "Enviarlos a la UIF para que decida si los incorpora a la evaluación nacional de riesgos, sin modificar el enfoque de supervisión vigente", "Difundirlos con el nombre de cada banco evaluado, porque la guía da prioridad a la transparencia sobre los requisitos de confidencialidad pertinentes", "Usarlos para revisar sus evaluaciones de riesgo y su enfoque y, cuando proceda y respetando la confidencialidad, comunicarlos a los bancos"], "x": "El párr. 40 pide usar los resultados para actualizar evaluaciones y considerar si el enfoque, las normas y la guía siguen siendo adecuados; cuando proceda y con confidencialidad, comunicarlos a los bancos para que mejoren su EBR.", "ref": "Párr. 40 · Tema 3.2.1"}, {"id": "G036", "tema": "gafiebr", "tipo": "memoria", "q": "¿Qué características deben tener las acciones de supervisión, según el enfoque general de la Sección II · B?", "a": "Ser previsibles, coherentes y proporcionales en la mayoría de los casos, con formación del personal y comunicación de expectativas", "o": ["Ser idénticas para todos los bancos, sin atender a su complejidad operativa, para asegurar la igualdad de condiciones", "Ser sorpresivas, uniformes y sancionadoras en todos los casos, para disuadir a los bancos de relajar sus controles internos", "Ser confidenciales y discrecionales, sin sujetarse a las expectativas que el supervisor haya comunicado antes a los bancos mediante sus guías", "Ser previsibles, coherentes y proporcionales en la mayoría de los casos, con formación del personal y comunicación de expectativas"], "x": "El párr. 42 fija el objetivo de acciones previsibles, coherentes y proporcionales «en la mayoría de los casos», apoyadas en la formación del personal supervisor y la comunicación efectiva de expectativas.", "ref": "Párr. 42 · Tema 3.2.1"}, {"id": "G037", "tema": "gafiebr", "tipo": "caso", "q": "Al comparar los programas ALA/CFT de Banco Calima, de operación compleja, y Banco Terral, de operación sencilla, el supervisor observa controles distintos. ¿Qué debe tener en cuenta?", "a": "Que en un EBR puede haber razones de peso para que los controles no sean iguales, y que debe contar con herramientas para evaluar esas diferencias", "o": ["Que debe pedir al banco sencillo adoptar los controles del complejo, porque las comparaciones entre programas buscan homologar los controles del sector", "Que en un EBR puede haber razones de peso para que los controles no sean iguales, y que debe contar con herramientas para evaluar esas diferencias", "Que debe calificar como deficiente al banco con menos controles, porque en un EBR el número de controles es el indicador de su calidad", "Que debe evitar comparar programas entre bancos de distinta complejidad, porque la guía considera inválidas esas comparaciones para el EBR"], "x": "El párr. 43 recomienda considerar comparaciones entre programas, pero advierte que los controles pueden no ser iguales por razones de peso, sobre todo frente a bancos con distinta complejidad operativa. Comparar sirve para ver la calidad, no para homologar.", "ref": "Párr. 43 · Tema 3.2.1"}, {"id": "G038", "tema": "gafiebr", "tipo": "trampa", "q": "La Caja 1 cita los lineamientos que el Comité de Basilea publicó en enero de 2014 sobre la gestión de riesgos de LA/FT. ¿Qué precisa la guía sobre ellos?", "a": "Que apoyan la implementación de los estándares del GAFI de 2012 y no deben interpretarse como su modificación, ni para robustecerlos ni para debilitarlos", "o": ["Que fueron emitidos por las Autoridades Supervisoras Europeas e incluyen cuestionamientos de autoevaluación que los supervisores deben hacerse", "Que apoyan la implementación de los estándares del GAFI de 2012 y no deben interpretarse como su modificación, ni para robustecerlos ni para debilitarlos", "Que sustituyen a los estándares del GAFI en la supervisión bancaria, dado que el Comité de Basilea es el emisor especializado para el sector bancario internacional", "Que robustecen los estándares del GAFI, de modo que ante una discrepancia prevalecen los requisitos más estrictos que establece el Comité de Basilea"], "x": "La Caja 1 aclara que los lineamientos del CSBB apoyan los estándares del GAFI y no los modifican. Los cuestionamientos de autoevaluación corresponden al reporte preliminar de las Autoridades Supervisoras Europeas de octubre de 2013, la otra fuente de la misma caja.", "ref": "Caja 1 · Tema 3.2.1"}, {"id": "G039", "tema": "gafiebr", "tipo": "caso", "q": "La autoridad de Belmira diseña la capacitación de sus inspectores ALA/CFT. Conforme a la NI 26 y la Sección II, ¿qué debe lograr?", "a": "Que entiendan la discrecionalidad del banco y puedan evaluar la calidad de sus evaluaciones de riesgo y la idoneidad y proporcionalidad de sus controles", "o": ["Que entiendan la discrecionalidad del banco y puedan evaluar la calidad de sus evaluaciones de riesgo y la idoneidad y proporcionalidad de sus controles", "Que apliquen listas de verificación cerradas que eviten el juicio del inspector, de modo que ningún banco reciba un trato diferenciado en la visita", "Que dominen las técnicas de investigación penal, pues el propósito central de la visita ALA/CFT es acreditar la comisión del delito de lavado", "Que conozcan a fondo las guías de la industria, que remplazan las expectativas del supervisor cuando éstas se formulan como principios de alto nivel"], "x": "Los párrs. 46–47 piden entender el grado de discrecionalidad del banco, evaluar sus evaluaciones de riesgo y la idoneidad, proporcionalidad y eficacia de sus controles, usando el buen juicio. La guía de la industria puede ser útil, pero no sustituye al supervisor (párr. 49).", "ref": "Párrs. 46–47 · Tema 3.2.1"}, {"id": "G040", "tema": "gafiebr", "tipo": "memoria", "q": "¿Qué formas puede adoptar la guía que los supervisores dan a los bancos sobre sus obligaciones, según la Sección II · B?", "a": "Requisitos de alto nivel basados en resultados, normas basadas en riesgo, información sobre cómo interpreta las leyes o guía detallada sobre controles específicos", "o": ["Resoluciones sancionadoras publicadas, que ilustran a los bancos qué conductas considera el supervisor incumplimientos y qué sanciones les corresponden en cada caso", "Requisitos de alto nivel basados en resultados, normas basadas en riesgo, información sobre cómo interpreta las leyes o guía detallada sobre controles específicos", "Respuestas a consultas individuales de cada banco, ya que la guía de alcance general debe provenir de las asociaciones del sector privado", "Manuales técnicos de sistemas automatizados elaborados por proveedores certificados, que el supervisor distribuye a los bancos como estándar operativo obligatorio"], "x": "El párr. 48 enumera esas cuatro formas y pide hacerlo tras un proceso de consulta con las partes interesadas; además sugiere que la guía fomente la inclusión financiera.", "ref": "Párr. 48 · Tema 3.2.1"}, {"id": "G041", "tema": "gafiebr", "tipo": "caso", "q": "La asociación de bancos de Corvania publica una guía operativa; el supervisor sólo emitió principios de alto nivel. Banco Estival quiere apoyarse en la guía de la asociación. ¿Qué indica la guía del GAFI?", "a": "Que podría resultar útil para fines explicativos y operacionales, pero el banco debe cuidar que sea compatible con la legislación nacional", "o": ["Que podría resultar útil para fines explicativos y operacionales, pero el banco debe cuidar que sea compatible con la legislación nacional", "Que la guía de la industria prevalece sobre las expectativas del supervisor, porque refleja con mayor precisión la realidad operativa de los bancos", "Que la guía de la industria es inaplicable, porque sólo puede tomarse en cuenta cuando el supervisor la emite como documento de guía conjunta", "Que la guía de la industria obliga a todos los bancos del país desde su publicación, aun cuando no se fundamente en las normas internacionales"], "x": "El párr. 49 dice que, si la guía del supervisor se basa en principios de alto nivel, la de la industria «podría resultar útil», pero los bancos deben verificar que sea compatible con la legislación nacional. La guía conjunta del párr. 50 es entre autoridades, no con la industria.", "ref": "Párrs. 49–50 · Tema 3.2.1"}, {"id": "G042", "tema": "gafiebr", "tipo": "caso", "q": "En Idaria, el supervisor prudencial y el supervisor ALA/CFT emiten guías con criterios diferentes sobre la misma obligación. ¿Qué recomienda la guía?", "a": "Coordinarse para interpretar las obligaciones de forma coherente y evitar arbitraje regulatorio, lagunas o confusión y, de ser posible, emitir guía conjunta", "o": ["Dejar que cada banco elija qué guía seguir según su perfil de riesgo, siempre que documente la decisión y la apruebe su alta dirección", "Retirar la guía del supervisor ALA/CFT, ya que cuando existen divisiones separadas corresponde al supervisor prudencial emitir las guías", "Coordinarse para interpretar las obligaciones de forma coherente y evitar arbitraje regulatorio, lagunas o confusión y, de ser posible, emitir guía conjunta", "Mantener ambas guías, porque la pluralidad de criterios da a los bancos margen para elegir el más adecuado a su perfil de riesgo, a su tamaño y a su modelo de negocio"], "x": "El párr. 50 pide coordinación entre autoridades para una interpretación coherente y advierte que la guía de múltiples fuentes no debe ofrecer arbitraje regulatorio, lagunas ni confusión; siempre que sea posible, guía conjunta.", "ref": "Párr. 50 · Tema 3.2.1"}, {"id": "G043", "tema": "gafiebr", "tipo": "caso", "q": "Banco Almira ofrece a sus clientes productos para administrar su patrimonio; varios de ellos son PEP, usan fideicomisos offshore y operan en jurisdicciones múltiples. ¿Qué línea de negocio es y qué riesgos le asocia la Caja 2?", "a": "Administración patrimonial, con riesgos como la cultura de la confidencialidad, la dificultad para identificar propietarios reales y el secreto bancario", "o": ["Banca de inversión, con riesgos como la estratificación e integración y la transferencia de activos entre partes a cambio de efectivo u otros activos", "Administración patrimonial, con riesgos como la cultura de la confidencialidad, la dificultad para identificar propietarios reales y el secreto bancario", "Banca minorista, con riesgos como los servicios a negocios de alto flujo de efectivo, el volumen de transacciones y la diversidad de servicios", "Servicios de corresponsalía, con riesgos como las transacciones de alto valor, la información limitada del remitente y la posible participación de PEP en la propiedad de un banco"], "x": "El párr. 52 describe la administración patrimonial (a veces llamada banca privada) y la Caja 2 le asocia confidencialidad, propietarios reales difíciles de identificar, fideicomisos offshore, secreto bancario, PEP y jurisdicciones múltiples. Los PEP también aparecen en corresponsalía, pero referidos a la propiedad de un banco.", "ref": "Párr. 52 · Caja 2 · Tema 3.2.1"}, {"id": "G044", "tema": "gafiebr", "tipo": "caso", "q": "Banco Pradera ofrece cuentas corrientes, hipotecas y servicios de ahorro directamente a individuos y empresas, entre ellas una cadena de lavanderías que maneja mucho efectivo. ¿Qué línea d
