independencia: los ingresos dependen del resultado del propio Informe", "o": ["Es válido si el Comité aprueba el esquema de honorarios", "No hay independencia: los ingresos dependen del resultado del propio Informe", "Sólo afecta la independencia si el bono se paga antes de emitir el Informe", "Es válido si el bono no excede los honorarios base pactados"], "x": "El QUINTO, fr. I, inc. b), considera que no hay independencia si los ingresos de la Persona Moral dependen del resultado del propio Informe.", "ref": "QUINTO, fr. I, inc. b) · Tema 3.1.1"}, {"id": "L154", "tema": "lin2021", "tipo": "trampa", "q": "¿Cuál de las siguientes situaciones NO está prevista en el OCTAVO C como supuesto preocupante?", "a": "Que el Sujeto Supervisado cambie de Persona Moral auditora respecto del año anterior", "o": ["Que existan hallazgos que se sitúen en alguna infracción grave en términos de las Leyes aplicables", "Que las medidas implementadas no sean acordes a los servicios, productos u Operaciones que ofrece", "Que operativamente no haya eficacia en los controles", "Que el Sujeto Supervisado cambie de Persona Moral auditora respecto del año anterior"], "x": "El OCTAVO C prevé cuatro supuestos: medidas no acordes, controles no eficaces, hallazgos de infracción grave e irregularidades que pudieran favorecer los delitos.", "ref": "OCTAVO C, párr. segundo · Tema 3.1.1"}, {"id": "L156", "tema": "lin2021", "tipo": "caso", "q": "Una casa de bolsa escanea el Informe firmado y lo sube a SITI PLD/FT como PDF de imagen, en el que no se puede seleccionar ni buscar texto. ¿Cumple el DÉCIMO PRIMERO?", "a": "No, el PDF debe permitir la selección del texto y la búsqueda de datos", "o": ["No, el Informe debe enviarse en formato de procesador de textos", "Sí, siempre que el escaneo conserve la firma autógrafa", "No, el PDF debe permitir la selección del texto y la búsqueda de datos", "Sí, cualquier PDF es válido siempre que se cargue a través del SITI PLD/FT"], "x": "El DÉCIMO PRIMERO exige PDF con configuración de accesibilidad que permita la selección del texto y búsqueda de datos en el contenido.", "ref": "DÉCIMO PRIMERO, párr. cuarto · Tema 3.1.1"}, {"id": "L157", "tema": "lin2021", "tipo": "caso", "q": "En una obligación calificada «Cumple Parcialmente», el auditor sólo formuló dos recomendaciones de mejora, sin hallazgo. ¿Qué falta según el OCTAVO B?", "a": "Al menos un hallazgo identificado en la obligación evaluada", "o": ["Nada, las recomendaciones de mejora son suficientes", "La opinión del Oficial de Cumplimiento sobre la obligación", "Al menos un hallazgo identificado en la obligación evaluada", "Una tercera recomendación de mejora"], "x": "El OCTAVO B, num. 3, obliga a incluir al menos un hallazgo y, en su caso, una o más recomendaciones de mejora.", "ref": "OCTAVO B, num. 3 · Tema 3.1.1"}, {"id": "L158", "tema": "lin2021", "tipo": "caso", "q": "Un auditor externo presta servicios profesionales por honorarios, sin relación laboral, como apoderado de la misma casa de cambio que auditará. ¿Cumple la fr. VI del CUARTO?", "a": "No, la prohibición aplica con independencia del régimen laboral", "o": ["No, la prohibición aplica con independencia del régimen laboral", "Sí, porque un apoderado no forma parte de los órganos de gobierno", "Sí, porque sólo se prohíbe a quien tenga relación laboral subordinada", "No, pero sólo si además es accionista de la casa de cambio"], "x": "La fr. VI del CUARTO impide ser apoderado o empleado del Sujeto Supervisado con independencia del régimen laboral bajo el que se presten los servicios.", "ref": "CUARTO, fr. VI · Tema 3.1.1"}, {"id": "L159", "tema": "lin2021", "tipo": "caso", "q": "Un despacho pacta con una institución de financiamiento colectivo cobrar un porcentaje adicional si esta obtiene una línea de fondeo que solicitará con base en el Informe de Auditoría. ¿Hay independencia?", "a": "No, sus ingresos dependerían del éxito de una actividad sustentada en el Informe", "o": ["Sí, porque el fondeo es una actividad ajena al régimen PLD/FT", "No, sus ingresos dependerían del éxito de una actividad sustentada en el Informe", "No, pero sólo si el porcentaje supera la mitad de los honorarios", "Sí, porque los honorarios no dependen del resultado del Informe en sí, sino de una actividad posterior"], "x": "El QUINTO, fr. I, inc. b), incluye ingresos que dependan del éxito de cualquier actividad del Sujeto Supervisado que tenga como sustento el Informe.", "ref": "QUINTO, fr. I, inc. b) · Tema 3.1.1"}, {"id": "L160", "tema": "lin2021", "tipo": "memoria", "q": "En el supuesto de irregularidades que pudieran favorecer delitos, ¿con base en qué las detecta el Auditor según el OCTAVO C?", "a": "Con base en su juicio profesional", "o": ["Con base en su juicio profesional", "Con base en una resolución previa de la UIF", "Con base en la opinión del Oficial de Cumplimiento", "Con base en una denuncia presentada ante el Ministerio Público"], "x": "El OCTAVO C se refiere a irregularidades que, con base en el juicio profesional del Auditor, pudieran favorecer la comisión de los delitos.", "ref": "OCTAVO C, párr. segundo · Tema 3.1.1"}, {"id": "L161", "tema": "lin2021", "tipo": "cifra", "q": "¿De qué periodo son las observaciones de la Comisión cuyo seguimiento debe reportarse, en su caso, en la sección D?", "a": "Del año inmediato anterior", "o": ["Del año inmediato anterior", "De los últimos dos años", "Del periodo desde la última visita, sin límite", "De los últimos cinco años"], "x": "El OCTAVO D se refiere a observaciones, recomendaciones o acciones correctivas formuladas por la Comisión en el año inmediato anterior.", "ref": "OCTAVO D, párr. tercero · Tema 3.1.1"}, {"id": "L162", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué distingue la evaluación «Cumple Parcialmente» de «Cumple Mayoritariamente» en el OCTAVO B?", "a": "En Cumple Parcialmente la eficacia no se demuestra por falta de evidencia objetiva", "o": ["En Cumple Parcialmente la obligación no surte vigencia para el sujeto", "En Cumple Parcialmente no se permite incluir recomendaciones de mejora, sólo hallazgos identificados", "En Cumple Parcialmente el incumplimiento siempre actualiza una sanción", "En Cumple Parcialmente la eficacia no se demuestra por falta de evidencia objetiva"], "x": "El num. 2 se refiere a eficacia no completamente demostrada; el num. 3, a eficacia no demostrada por no contar con evidencia objetiva.", "ref": "OCTAVO B, num. 2 y 3 · Tema 3.1.1"}, {"id": "L163", "tema": "lin2021", "tipo": "caso", "q": "Un auditor tiene en curso una demanda contra la SOFIPO que lo contrata, por un adeudo de honorarios de otro servicio. ¿Qué requisito del CUARTO se incumple?", "a": "Fr. VII: no tener litigio pendiente con el Sujeto Supervisado", "o": ["Fr. III: no haber sido sentenciado por delitos patrimoniales", "Fr. IX: no estar en listas oficiales de personas vinculadas", "Fr. V: no tener ofrecimiento para ser directivo", "Fr. VII: no tener litigio pendiente con el Sujeto Supervisado"], "x": "La fr. VII del CUARTO exige no tener litigio pendiente con el Sujeto Supervisado.", "ref": "CUARTO, fr. VII · Tema 3.1.1"}, {"id": "L164", "tema": "lin2021", "tipo": "memoria", "q": "¿Quién es responsable del cumplimiento de los requisitos de independencia del QUINTO, fr. I?", "a": "El Sujeto Supervisado", "o": ["La Persona Moral contratada", "La Comisión, al recibir el Informe", "El Auditor que firma el Informe", "El Sujeto Supervisado"], "x": "La fr. I del QUINTO dispone que el Sujeto Supervisado será responsable del cumplimiento de los requisitos de independencia.", "ref": "QUINTO, fr. I, último párrafo · Tema 3.1.1"}, {"id": "L165", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué sentido de evaluación el OCTAVO B prevé expresamente incluir al menos un hallazgo y, en su caso, una o más recomendaciones de mejora?", "a": "Cumple Parcialmente", "o": ["No aplica", "Cumple", "Cumple Parcialmente", "Cumple Mayoritariamente"], "x": "El num. 3 (Cumple Parcialmente) exige al menos un hallazgo y, en su caso, recomendaciones; Cumple Mayoritariamente exige al menos una recomendación y, en su caso, hallazgo.", "ref": "OCTAVO B, num. 3 · Tema 3.1.1"}, {"id": "L166", "tema": "lin2021", "tipo": "caso", "q": "Un auditor tiene suspendido, con suspensión vigente, su registro para fungir como auditor externo independiente, aunque su Certificado CNBV sigue vigente. ¿Puede firmar el Informe?", "a": "No, la fr. VIII del CUARTO exige no tener suspensión vigente de dicho registro", "o": ["No, pero sólo si la suspensión la impuso la propia Comisión", "Sí, el Certificado vigente de la Comisión subsana la suspensión del registro", "Sí, la fr. VIII sólo se refiere a cancelaciones o revocaciones", "No, la fr. VIII del CUARTO exige no tener suspensión vigente de dicho registro"], "x": "La fr. VIII del CUARTO exige no tener suspensión vigente, cancelación o revocación de registro de auditor externo independiente o de certificación de organismo autorregulatorio.", "ref": "CUARTO, fr. VIII · Tema 3.1.1"}, {"id": "L167", "tema": "lin2021", "tipo": "trampa", "q": "La fr. II del QUINTO exige que la Persona Moral cuente con recursos suficientes. ¿Cuál tipo de recurso NO menciona esa fracción?", "a": "Materiales", "o": ["Técnicos", "Financieros", "Administrativos", "Materiales"], "x": "La fr. II del QUINTO menciona recursos técnicos, humanos, financieros y administrativos; los «materiales» aparecen en el SÉPTIMO, referidos al Sujeto Supervisado.", "ref": "QUINTO, fr. II · Tema 3.1.1"}, {"id": "L168", "tema": "lin2021", "tipo": "caso", "q": "Un auditor detecta que una casa de cambio incurrió en un incumplimiento que actualiza una sanción conforme a la normativa aplicable. ¿Cómo debe evaluar esa obligación?", "a": "No cumple, con al menos un hallazgo identificado en la obligación", "o": ["Cumple Mayoritariamente, con una recomendación de mejora", "No aplica, si la sanción aún no ha sido impuesta", "Cumple Parcialmente, con al menos un hallazgo y una recomendación", "No cumple, con al menos un hallazgo identificado en la obligación"], "x": "El OCTAVO B, num. 4, prevé No cumple cuando se trata de un incumplimiento que actualiza una sanción, con al menos un hallazgo.", "ref": "OCTAVO B, num. 4 · Tema 3.1.1"}, {"id": "L169", "tema": "lin2021", "tipo": "cifra", "q": "La carta bajo protesta de decir verdad que recaba el Sujeto Supervisado debe manifestar el cumplimiento de los requisitos de las fracciones ____ del CUARTO.", "a": "III a VIII", "o": ["III a VIII", "V a IX", "I a IX", "III a IX"], "x": "El inciso d) del CUARTO se refiere a la carta sobre las fracciones III a VIII y a que la documentación proporcionada es veraz.", "ref": "CUARTO, párr. segundo, inc. d) · Tema 3.1.1"}, {"id": "L170", "tema": "lin2021", "tipo": "caso", "q": "Un despacho de consultoría forma parte del grupo de personas que ejercen el Control de la SOFOM a la que ofrece elaborar el Informe PLD/FT. ¿Puede contratarse?", "a": "No, la Persona Moral no debe ejercer el Control en el Sujeto Supervisado", "o": ["No, la Persona Moral no debe ejercer el Control en el Sujeto Supervisado", "Sí, si el Auditor que firma no es socio del despacho", "No, salvo que su participación sea menor al dos por ciento del capital", "Sí, si lo informa en el escrito de remisión a la Comisión"], "x": "La fr. III del QUINTO dispone que la Persona Moral no deberá ejercer el Control en el Sujeto Supervisado al que preste sus servicios.", "ref": "QUINTO, fr. III · Tema 3.1.1"}, {"id": "L171", "tema": "lin2021", "tipo": "caso", "q": "Con evidencia objetiva, el auditor comprueba que el procedimiento de un banco para Clientes de Grado de Riesgo alto omite elementos que exigen las Disposiciones. ¿Qué evaluación corresponde?", "a": "No cumple, porque el cumplimiento no cubre los elementos necesarios", "o": ["No cumple, porque el cumplimiento no cubre los elementos necesarios", "Cumple Mayoritariamente, porque el procedimiento existe", "Cumple Parcialmente, porque no hay evidencia objetiva que demuestre la eficacia", "No aplica, porque el procedimiento es interno del banco"], "x": "El OCTAVO B, num. 4, prevé No cumple cuando el cumplimiento no cubre los elementos necesarios conforme a las Disposiciones.", "ref": "OCTAVO B, num. 4 · Tema 3.1.1"}, {"id": "L172", "tema": "lin2021", "tipo": "memoria", "q": "¿A quién corresponde recabar la documentación del Auditor prevista en el CUARTO (título o cédula, experiencia, Certificado y carta)?", "a": "Al Sujeto Supervisado", "o": ["A la Vicepresidencia de Supervisión de Procesos Preventivos", "A la Persona Moral que emplea al Auditor", "Al Sujeto Supervisado", "Al Comité de Comunicación y Control"], "x": "El CUARTO señala que será responsabilidad del Sujeto Supervisado recabar dichos documentos.", "ref": "CUARTO, párr. segundo · Tema 3.1.1"}, {"id": "L173", "tema": "lin2021", "tipo": "memoria", "q": "El plazo mínimo de cinco años que el Sujeto Supervisado debe convenir con la Persona Moral para conservar los papeles de trabajo se cuenta a partir de…", "a": "La presentación ante la Comisión del Informe de Auditoría", "o": ["La conclusión del periodo revisado", "La fecha en que la dirección general y el Comité conocieron el Informe", "La presentación ante la Comisión del Informe de Auditoría", "La firma del contrato de prestación de servicios"], "x": "El párrafo final del QUINTO fija un plazo mínimo de cinco años contado a partir de la presentación ante la Comisión del Informe.", "ref": "QUINTO, párr. final (posterior a la fr. III) · Tema 3.1.1"}, {"id": "L174", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué contenido mínimo exige el OCTAVO B cuando una obligación se evalúa como «No cumple»?", "a": "Al menos un hallazgo, identificado en la obligación evaluada", "o": ["Al menos un hallazgo y una recomendación de mejora", "Al menos una recomendación de mejora", "Al menos un hallazgo y su descripción en la sección de Asuntos clave de la auditoría", "Al menos un hallazgo, identificado en la obligación evaluada"], "x": "El num. 4 dispone que en No cumple el Auditor deberá incluir al menos un hallazgo, identificado en la obligación evaluada.", "ref": "OCTAVO B, num. 4 · Tema 3.1.1"}, {"id": "L175", "tema": "lin2021", "tipo": "caso", "q": "Un auditor sin licenciatura acredita siete años de experiencia en PLD/FT. Además de su carta bajo protesta, ¿qué documentos debe recabar el Sujeto Supervisado según el CUARTO?", "a": "El documento que acredite su experiencia y copia de su Certificado", "o": ["El documento que acredite su experiencia y copia de su Certificado", "Copia de su título profesional y copia de su Certificado", "Sólo copia de su Certificado, pues la experiencia se presume con la carta bajo protesta", "Copia de su cédula profesional y documento de experiencia"], "x": "El inciso a) (título o cédula) aplica «en su caso»; siempre deben recabarse el documento de experiencia (b), copia del Certificado (c) y la carta (d).", "ref": "CUARTO, párr. segundo, incs. a) a d) · Tema 3.1.1"}, {"id": "L176", "tema": "lin2021", "tipo": "caso", "q": "Tres años después de presentado el Informe, la Comisión requiere al banco los papeles de trabajo. El despacho alega que son de su propiedad y ya no los tiene. ¿Qué debió pactarse?", "a": "Que se conservaran y mantuvieran a disposición del banco, para presentarlos a la Comisión, al menos cinco años", "o": ["Que la Persona Moral los conservara únicamente durante el desarrollo de la auditoría y hasta la emisión del Informe", "Que la Persona Moral los entregara a la Comisión junto con el Informe", "Nada, pues los papeles de la Persona Moral no pueden ser requeridos", "Que se conservaran y mantuvieran a disposición del banco, para presentarlos a la Comisión, al menos cinco años"], "x": "El QUINTO obliga al Sujeto Supervisado a convenir que los papeles de trabajo de la Persona Moral se conserven y estén a disposición, y se presenten a la Comisión cuando lo requiera, mínimo cinco años.", "ref": "QUINTO, párr. final (posterior a la fr. III) · Tema 3.1.1"}, {"id": "L177", "tema": "lin2021", "tipo": "memoria", "q": "Según el OCTAVO B, la evaluación «No aplica» procede cuando el requisito no surte vigencia debido a características…", "a": "Estructurales, legales o institucionales del Sujeto Supervisado", "o": ["Temporales, por haberse cumplido en el ejercicio anterior", "Estructurales, legales o institucionales del Sujeto Supervisado", "Operativas, por falta de personal en el área de cumplimiento", "Financieras, contables o fiscales del Sujeto Supervisado"], "x": "El num. 5 prevé No aplica cuando el requisito no surte vigencia por características estructurales, legales o institucionales del sujeto.", "ref": "OCTAVO B, num. 5 · Tema 3.1.1"}, {"id": "L178", "tema": "lin2021", "tipo": "caso", "q": "Un banco no opera con comisionistas y el auditor pretende calificar «No aplica» esa obligación. Según el OCTAVO B, ¿qué debe hacer antes?", "a": "Verificar que la exclusión no actualice un incumplimiento y sea consistente con su análisis de Riesgos", "o": ["Obtener del Comité o del Oficial de Cumplimiento una carta bajo protesta que confirme que no opera con comisionistas", "Verificar que la exclusión no actualice un incumplimiento y sea consistente con su análisis de Riesgos", "Incluir al menos una recomendación de mejora y describir la exclusión en Asuntos clave de la auditoría", "Nada, basta la manifestación del Sujeto Supervisado"], "x": "El num. 5 exige al Auditor verificar que la exclusión no actualice incumplimiento y que sea consistente con su análisis de Riesgos.", "ref": "OCTAVO B, num. 5 · Tema 3.1.1"}, {"id": "L179", "tema": "lin2021", "tipo": "caso", "q": "Un auditor califica «No aplica» el reporte de transferencias internacionales de fondos, aunque su propio análisis de Riesgos registró transferencias internacionales entre los canales del sujeto. ¿Es correcto?", "a": "No, la calificación No aplica debe ser consistente con el análisis de Riesgos del Auditor", "o": ["Sí, si el Sujeto Supervisado así lo solicita por escrito", "No, la calificación No aplica debe ser consistente con el análisis de Riesgos del Auditor", "Sí, porque el análisis de Riesgos del Auditor sólo sirve para definir el alcance del programa de trabajo", "No, porque No aplica sólo procede para Modelos Novedosos"], "x": "El OCTAVO B, num. 5, exige que la exclusión sea consistente con el análisis de Riesgos elaborado por el Auditor.", "ref": "OCTAVO B, num. 5 · Tema 3.1.1"}, {"id": "L180", "tema": "lin2021", "tipo": "caso", "q": "En un Informe, las recomendaciones y hallazgos se agrupan al final, sin indicar a qué obligación de la sección A corresponden. ¿Qué exige la sección B?", "a": "Que se identifiquen en la obligación evaluada", "o": ["Que se agrupen por área responsable del sujeto", "Que se identifiquen sólo en el escrito de remisión", "Que se ordenen por monto de la posible sanción", "Que se identifiquen en la obligación evaluada"], "x": "Los numerales 2, 3 y 4 del OCTAVO B señalan que hallazgos y recomendaciones deberán ser identificados en la obligación evaluada.", "ref": "OCTAVO B, num. 2 a 4 · Tema 3.1.1"}, {"id": "L181", "tema": "lin2021", "tipo": "caso", "q": "Una casa de bolsa no es transmisor de dinero. Al revisar el aviso sobre agentes relacionados, ¿qué evaluación resulta acorde con la sección B, previa verificación del Auditor?", "a": "No aplica", "o": ["No aplica", "No cumple", "Cumple Mayoritariamente", "Cumple"], "x": "El OCTAVO B, num. 5, prevé No aplica cuando el requisito no surte vigencia por características legales o institucionales, verificado por el Auditor.", "ref": "OCTAVO B, num. 5 · Tema 3.1.1"}, {"id": "L182", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué fracción e inciso del OCTAVO A se revisa si el Sujeto Supervisado tiene políticas para identificar a Clientes que estén en la Lista de Personas Bloqueadas, a terceros que actúen por su cuenta y las Operaciones que realizaron?", "a": "fr. III, inc. k)", "o": ["fr. X, inc. a)", "fr. III, inc. k)", "fr. X, inc. f)", "fr. X, inc. e)"], "x": "Las políticas y procedimientos para identificar a Clientes bloqueados, terceros y sus Operaciones están en la fr. III, inc. k); la X e) revisa contar con la Lista y mecanismos efectivos.", "ref": "OCTAVO A, fr. III, inc. k) · Tema 3.1.1"}, {"id": "L183", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. II, inc. b)?", "a": "Si diseñó e implementó una metodología para evaluar los Riesgos a los que está expuesto", "o": ["Si identificó y evaluó el Riesgo previo al lanzamiento de un producto con Modelos Novedosos", "Si realizó la valoración de la metodología revisando su eficiencia y eficacia", "Si cuenta con un modelo para determinar el Grado de Riesgo de sus Clientes o Usuarios", "Si diseñó e implementó una metodología para evaluar los Riesgos a los que está expuesto"], "x": "La fr. II, inc. b) revisa el diseño e implementación de la metodología de evaluación de Riesgos por productos, servicios, Clientes, países, transacciones y canales.", "ref": "OCTAVO A, fr. II, inc. b) · Tema 3.1.1"}, {"id": "L184", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué fracción e inciso del OCTAVO A se revisa si el Sujeto Supervisado aplica políticas de identificación y conocimiento a quien opera en Cuentas Concentradoras de las que es titular, abiertas en otro Sujeto Supervisado?", "a": "fr. I, inc. c)", "o": ["fr. I, inc. c)", "fr. X, inc. a)", "fr. III, inc. j)", "fr. IV, inc. a)"], "x": "La fr. I, inc. c) revisa esas políticas sobre quien opera en las Cuentas Concentradoras; la fr. IV, inc. a) sólo verifica que los reportes de Operaciones Relevantes incluyan las realizadas por esas cuentas.", "ref": "OCTAVO A, fr. I, inc. c) · Tema 3.1.1"}, {"id": "L185", "tema": "lin2021", "tipo": "caso", "q": "El auditor comprueba si la entidad cuenta con las listas que emiten autoridades de otros países sobre personas vinculadas con Financiamiento al Terrorismo y si su mecanismo de búsqueda es efectivo. ¿Qué fracción e inciso?", "a": "fr. X, inc. a)", "o": ["fr. X, inc. e)", "fr. X, inc. d)", "fr. X, inc. a)", "fr. III, inc. k)"], "x": "La fr. X, inc. a) revisa las listas oficialmente reconocidas de autoridades mexicanas, agrupaciones intergubernamentales o de otros países sobre personas vinculadas, y sus mecanismos.", "ref": "OCTAVO A, fr. X, inc. a) · Tema 3.1.1"}, {"id": "L186", "tema": "lin2021", "tipo": "caso", "q": "El Comité de un banco recibió 40 Operaciones para su valoración y dictaminó 12 como Inusuales. Además de revisar el reporte de esas 12, ¿qué debe señalar el auditor conforme a la fr. IV del OCTAVO A?", "a": "Si el Comité analizó las 28 que no dictaminó como Inusuales, conforme a Disposiciones y Manual", "o": ["Si las 28 no dictaminadas se incluyeron en el siguiente reporte de Operaciones Relevantes", "Si las 28 no dictaminadas se notificaron a los Clientes involucrados", "Si el Comité analizó las 28 que no dictaminó como Inusuales, conforme a Disposiciones y Manual", "Si las 28 no dictaminadas se presentaron a la Secretaría como Reportes de 24 horas"], "x": "El inciso b) pide señalar si el Comité o, en su caso, el Oficial de Cumplimiento analizó las Operaciones presentadas para valoración que no fueron dictaminadas como Inusuales.", "ref": "OCTAVO A, fr. IV, inc. b) · Tema 3.1.1"}, {"id": "L187", "tema": "lin2021", "tipo": "memoria", "q": "Según el OCTAVO A, fr. XII, inc. b), ¿en qué momento debió el Sujeto Supervisado identificar y evaluar el Riesgo al que está expuesto?", "a": "Previo al lanzamiento del producto o servicio a través de Modelos Novedosos", "o": ["Previo al lanzamiento del producto o servicio a través de Modelos Novedosos", "Al presentar su primer Informe de Auditoría tras el lanzamiento", "Cuando la Comisión se lo requiera durante una visita de inspección", "Dentro de los doce meses posteriores al lanzamiento del producto o servicio"], "x": "El inciso b) revisa si identificó y evaluó el Riesgo «previo al lanzamiento del producto o servicio» a través de Modelos Novedosos.", "ref": "OCTAVO A, fr. XII, inc. b) · Tema 3.1.1"}, {"id": "L188", "tema": "lin2021", "tipo": "caso", "q": "El auditor verifica si la entidad comunicó en tiempo y forma a la Secretaría, por conducto de la Comisión, la identidad de la persona o grupo de personas que ejercen el Control y sus cambios. ¿Qué fracción e inciso?", "a": "fr. XIII, inc. a)", "o": ["fr. XIII, inc. b)", "fr. III, inc. i)", "fr. V, inc. c)", "fr. XIII, inc. a)"], "x": "La fr. XIII, inc. a) revisa la comunicación de quienes ejercen el Control y sus cambios; el Propietario Real de los recursos es la III i).", "ref": "OCTAVO A, fr. XIII, inc. a) · Tema 3.1.1"}, {"id": "L189", "tema": "lin2021", "tipo": "caso", "q": "Una entidad no constituyó Comité. Conforme al OCTAVO A, fr. V, ¿qué debe verificar el auditor?", "a": "Que cumple las excepciones de las Disposiciones para no constituirlo y que lo comunicó en tiempo y forma", "o": ["Nada: sin Comité, la fr. V se califica automáticamente como «No aplica»", "Que cumple las excepciones de las Disposiciones para no constituirlo y que lo comunicó en tiempo y forma", "Que el consejo de administración aprobó no constituirlo y que así lo registró en su Manual de Cumplimiento", "Que la Comisión ratificó al Oficial de Cumplimiento para asumir las funciones del Comité"], "x": "El párrafo del inciso b) ordena verificar que cumple las excepciones para no constituir Comité y que lo comunicó en tiempo y forma a la Secretaría por conducto de la Comisión.", "ref": "OCTAVO A, fr. V, inc. b) · Tema 3.1.1"}, {"id": "L190", "tema": "lin2021", "tipo": "caso", "q": "El programa anual de capacitación de un banco repite los mismos temas desde hace años, aunque su metodología identificó nuevos Riesgos en canales digitales. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. VI, inc. a)", "o": ["fr. VI, inc. b)", "fr. VI, inc. a)", "fr. II, inc. f)", "fr. VI, inc. c)"], "x": "La fr. VI, inc. a) pide precisar si los temas del programa anual son coherentes con los resultados de la metodología de evaluación de Riesgos.", "ref": "OCTAVO A, fr. VI, inc. a) · Tema 3.1.1"}, {"id": "L191", "tema": "lin2021", "tipo": "caso", "q": "El Manual de una casa de cambio establece conservar los reportes de Operaciones y los expedientes de identificación sólo durante cinco años. ¿En qué inciso de la fr. IX del OCTAVO A se ubica la deficiencia de ese mecanismo?", "a": "fr. IX, inc. a)", "o": ["fr. IX, inc. b)", "fr. IX, inc. d)", "fr. IX, inc. c)", "fr. IX, inc. a)"], "x": "La fr. IX, inc. a) revisa mecanismos para conservar reportes y expedientes por un periodo no menor a diez años; el plazo de cinco años es el de los Informes de Auditoría (inc. c)).", "ref": "OCTAVO A, fr. IX, inc. a) · Tema 3.1.1"}, {"id": "L192", "tema": "lin2021", "tipo": "caso", "q": "El auditor revisa si las Operaciones con un cliente que es Persona Políticamente Expuesta y además de Grado de Riesgo alto se aprobaron conforme a las Disposiciones, y cómo se aplicó ese procedimiento. ¿Qué fracción e inciso?", "a": "fr. III, inc. g)", "o": ["fr. III, inc. g)", "fr. III, inc. f)", "fr. X, inc. b)", "fr. III, inc. h)"], "x": "La fr. III, inc. g) revisa las Operaciones con PEP de Grado de Riesgo alto aprobadas conforme a las Disposiciones, en qué consiste la aprobación y si se aplicó adecuadamente.", "ref": "OCTAVO A, fr. III, inc. g) · Tema 3.1.1"}, {"id": "L193", "tema": "lin2021", "tipo": "caso", "q": "Un cajero empezó a atender en ventanilla y recibió su primera capacitación PLD/FT seis meses después de su ingreso. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. VIII, inc. c)", "o": ["fr. VIII, inc. a)", "fr. VI, inc. e)", "fr. VIII, inc. c)", "fr. VI, inc. d)"], "x": "La fr. VIII, inc. c) revisa constancias de que los empleados de atención al público recibieron capacitación previa o simultánea a su ingreso o inicio de actividades; es el único inciso que se refiere a ese momento.", "ref": "OCTAVO A, fr. VIII, inc. c) · Tema 3.1.1"}, {"id": "L194", "tema": "lin2021", "tipo": "caso", "q": "Un banco opera con comisionistas, pero el auditor decidió no revisar a ninguno de ellos. Conforme al OCTAVO A, fr. XIV, inc. c), ¿qué debe incorporar en el Informe?", "a": "La justificación que exponga las razones por las que no consideró necesaria esa revisión", "o": ["Una carta del Oficial de Cumplimiento que asuma la responsabilidad por la omisión de esa revisión", "Copia de los contratos de comisión y la lista de comisionistas activos en el periodo", "La justificación que exponga las razones por las que no consideró necesaria esa revisión", "La calificación «No aplica» para toda la fracción XIV"], "x": "El inciso c) prevé que, si no se lleva a cabo la revisión a comisionistas, se incorpore en su lugar la justificación con las razones por las que el Auditor no la consideró necesaria.", "ref": "OCTAVO A, fr. XIV, inc. c) · Tema 3.1.1"}, {"id": "L195", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué inciso de la fr. II del OCTAVO A se revisa si el Sujeto Supervisado revisó la eficiencia y eficacia de su metodología?", "a": "fr. II, inc. h)", "o": ["fr. II, inc. h)", "fr. II, inc. b)", "fr. II, inc. f)", "fr. II, inc. g)"], "x": "El inciso h) revisa si «realizó la valoración de la Metodología, revisando la eficiencia y eficacia de esta».", "ref": "OCTAVO A, fr. II, inc. h) · Tema 3.1.1"}, {"id": "L196", "tema": "lin2021", "tipo": "caso", "q": "Un auditor comprueba, en una muestra de clientes, que los datos de identificación estén capturados en el sistema automatizado y que los documentos estén integrados en cada expediente. ¿Qué fracción e inciso del OCTAVO A está evaluando?", "a": "fr. I, inc. b)", "o": ["fr. III, inc. a)", "fr. I, inc. e)", "fr. IX, inc. b)", "fr. I, inc. b)"], "x": "La fr. I, inc. b) ordena revisar por muestreo que los datos estén capturados en sistemas automatizados y los documentos integrados en el expediente.", "ref": "OCTAVO A, fr. I, inc. b) · Tema 3.1.1"}, {"id": "L197", "tema": "lin2021", "tipo": "caso", "q": "El auditor verifica que la entidad cuente con criterios, medidas y procedimientos sobre clientes que son Personas Políticamente Expuestas y que se hayan implementado conforme al Manual; no revisa aprobaciones de Operaciones. ¿Qué fracción e inciso?", "a": "fr. III, inc. f)", "o": ["fr. III, inc. g)", "fr. III, inc. f)", "fr. X, inc. b)", "fr. III, inc. e)"], "x": "La fr. III, inc. f) revisa los criterios sobre PEP y su implementación conforme al Manual; la g) añade la aprobación de Operaciones con PEP de riesgo alto y la X b) la lista de PEP.", "ref": "OCTAVO A, fr. III, inc. f) · Tema 3.1.1"}, {"id": "L198", "tema": "lin2021", "tipo": "caso", "q": "El auditor revisa si la entidad cuenta con las listas de países que, a juicio de organismos internacionales de los que México es miembro, aplican deficientemente medidas para prevenir operaciones ilícitas. ¿Qué fracción e inciso?", "a": "fr. X, inc. d)", "o": ["fr. II, inc. c)", "fr. X, inc. d)", "fr. X, inc. a)", "fr. X, inc. c)"], "x": "La fr. X, inc. d) cubre países o jurisdicciones sin medidas o con aplicación deficiente; la X c) son países con regímenes fiscales preferentes.", "ref": "OCTAVO A, fr. X, inc. d) · Tema 3.1.1"}, {"id": "L199", "tema": "lin2021", "tipo": "caso", "q": "El auditor encuentra que un banco presentó 5 reportes de Operaciones Inusuales fuera del plazo de las Disposiciones y omitió reportar otras 2. ¿Qué debe hacer conforme a la fr. IV del OCTAVO A?", "a": "Señalar las omitidas, las presentadas fuera de plazo y las que en su opinión contravengan las Disposiciones", "o": ["Presentar él mismo, por conducto de la Comisión, los 2 reportes omitidos en el formato oficial", "Calificar la obligación como «No cumple» sin detallar en el Informe cuáles Operaciones fueron omitidas o extemporáneas", "Señalar sólo las 2 omitidas, pues las 5 extemporáneas sí fueron presentadas a la Secretaría", "Señalar las omitidas, las presentadas fuera de plazo y las que en su opinión contravengan las Disposiciones"], "x": "El último párrafo de la fr. IV obliga a señalar las Operaciones omitidas, las presentadas fuera de plazo y las que en su opinión pudieran contravenir las Disposiciones.", "ref": "OCTAVO A, fr. IV, último párrafo · Tema 3.1.1"}, {"id": "L200", "tema": "lin2021", "tipo": "caso", "q": "Una sociedad solicitó autorización para operar con un Modelo Novedoso, pero entregó a la Comisión el resultado de su evaluación de Riesgos meses después de presentar la solicitud. ¿Qué inciso de la fr. XII del OCTAVO A aplica?", "a": "fr. XII, inc. d)", "o": ["fr. XII, inc. d)", "fr. XII, inc. c)", "fr. XII, inc. a)", "fr. XII, inc. b)"], "x": "La fr. XII, inc. d) revisa si presentó el resultado de la evaluación «junto con su solicitud de autorización».", "ref": "OCTAVO A, fr. XII, inc. d) · Tema 3.1.1"}, {"id": "L201", "tema": "lin2021", "tipo": "caso", "q": "Un accionista vendió acciones equivalentes al 1.5% del capital social pagado de la entidad. ¿Esa transmisión encuadra en el supuesto que revisa el OCTAVO A, fr. XIII, inc. b)?", "a": "No; el inciso se refiere a transmisiones por más del dos por ciento del capital social pagado", "o": ["No; el inciso se refiere sólo a transmisiones por más del cinco por ciento del capital social", "Sí; el inciso se refiere a transmisiones por más del uno por ciento del capital social pagado", "No; el inciso se refiere a transmisiones por más del dos por ciento del capital social pagado", "Sí; el inciso se refiere a cualquier transmisión de acciones, sin importar el porcentaje"], "x": "El inciso b) revisa la comunicación de la transmisión de acciones o partes sociales «por más del dos por ciento de su capital social pagado».", "ref": "OCTAVO A, fr. XIII, inc. b) · Tema 3.1.1"}, {"id": "L202", "tema": "lin2021", "tipo": "caso", "q": "Una entidad designó a su Oficial de Cumplimiento atendiendo los requisitos de las Disposiciones, pero lo comunicó a la Secretaría, por conducto de la Comisión, fuera de plazo. ¿Qué inciso de la fr. V del OCTAVO A recoge la deficiencia?", "a": "fr. V, inc. e)", "o": ["fr. V, inc. d)", "fr. V, inc. b)", "fr. V, inc. e)", "fr. V, inc. c)"], "x": "El inciso d) revisa la designación conforme a requisitos; el e) revisa que la designación o revocación se haya comunicado en tiempo y forma.", "ref": "OCTAVO A, fr. V, inc. e) · Tema 3.1.1"}, {"id": "L203", "tema": "lin2021", "tipo": "memoria", "q": "Respecto del programa anual de capacitación, ¿qué debe precisar el Auditor conforme a la fr. VI del OCTAVO A?", "a": "Si sus temas son coherentes con la metodología de Riesgos y adecuados a las responsabilidades", "o": ["Si sus temas son coherentes con la metodología de Riesgos y adecuados a las responsabilidades", "Si su costo y calendario fueron autorizados por el consejo de administración", "Si lo imparte un instructor que cuente con Certificado vigente expedido por la Comisión", "Si su contenido lo elaboró un instructor externo al Sujeto Supervisado"], "x": "El inciso a) pide precisar la coherencia de los temas con la metodología y su adecuación a las responsabilidades de consejeros, directivos, funcionarios y empleados.", "ref": "OCTAVO A, fr. VI, inc. a) · Tema 3.1.1"}, {"id": "L204", "tema": "lin2021", "tipo": "caso", "q": "El auditor observa que, al identificar los indicadores de Riesgo, un banco omitió su producto de tarjeta prepagada y dos de sus canales de distribución. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. II, inc. c)", "o": ["fr. II, inc. b)", "fr. III, inc. d)", "fr. II, inc. d)", "fr. II, inc. c)"], "x": "La fr. II, inc. c) revisa si consideró, dentro de la identificación de indicadores, el total de productos, servicios, Clientes, países, transacciones y canales.", "ref": "OCTAVO A, fr. II, inc. c) · Tema 3.1.1"}, {"id": "L205", "tema": "lin2021", "tipo": "caso", "q": "Un banco celebró una Operación que por sus características podría generar un alto Riesgo para el propio banco. El auditor revisa en qué consiste el procedimiento de aprobación y si se aplicó adecuadamente. ¿Qué fracción e inciso?", "a": "fr. III, inc. h)", "o": ["fr. III, inc. e)", "fr. III, inc. h)", "fr. I, inc. d)", "fr. III, inc. g)"], "x": "La fr. III, inc. h) revisa Operaciones que pudieran generar alto Riesgo para el propio Sujeto Supervisado aprobadas conforme a las Disposiciones.", "ref": "OCTAVO A, fr. III, inc. h) · Tema 3.1.1"}, {"id": "L206", "tema": "lin2021", "tipo": "memoria", "q": "Además de si cuenta con sistemas automatizados que desarrollen la totalidad de las funciones de las Disposiciones, ¿qué debe incluir el OCTAVO A, fr. VII?", "a": "La forma en que se cercioró de que el sistema desarrolla sus funciones", "o": ["El nombre del proveedor del sistema, su versión vigente y el costo de su licencia", "La forma en que se cercioró de que el sistema desarrolla sus funciones", "Que un tercero independiente audite el sistema cada año", "El número de alertas que generó el sistema por cada Cliente durante el periodo revisado"], "x": "La fr. VII pide incluir si cuenta con sistemas automatizados que desarrollen la totalidad de funciones y la forma en que se cercioró de que el sistema las desarrolla.", "ref": "OCTAVO A, fr. VII · Tema 3.1.1"}, {"id": "L207", "tema": "lin2021", "tipo": "caso", "q": "La entidad tiene mecanismos de conservación adecuados, pero al solicitar expedientes de clientes de hace siete años el auditor descubre que fueron destruidos. ¿Qué inciso de la fr. IX del OCTAVO A aplica?", "a": "fr. IX, inc. b)", "o": ["fr. IX, inc. a)", "fr. IX, inc. c)", "fr. IX, inc. d)", "fr. IX, inc. b)"], "x": "El inciso a) revisa que cuente con mecanismos; el b) que efectivamente conserve reportes y expedientes por el periodo no menor a diez años.", "ref": "OCTAVO A, fr. IX, inc. b) · Tema 3.1.1"}, {"id": "L208", "tema": "lin2021", "tipo": "caso", "q": "Un banco compartió información con otra entidad financiera en términos de las Disposiciones. Conforme al OCTAVO A, fr. XI, inc. a), ¿qué más debe revisar el auditor además de la forma y términos del intercambio?", "a": "Si comunicó o presentó, según corresponda, la documentación que acredite ese intercambio", "o": ["Si comunicó o presentó, según corresponda, la documentación que acredite ese intercambio", "Si obtuvo el consentimiento por escrito de cada Cliente cuyos datos fueron compartidos", "Si la otra entidad financiera pertenece al mismo grupo financiero que el banco", "Si el Comité aprobó previamente cada intercambio mediante acta de sesión"], "x": "El inciso a) revisa el intercambio conforme a las Disposiciones y si comunicó o presentó, según corresponda, la información y documentación que lo acredite.", "ref": "OCTAVO A, fr. XI, inc. a) · Tema 3.1.1"}, {"id": "L209", "tema": "lin2021", "tipo": "caso", "q": "En su borrador, el auditor escribe: «Se revisó una muestra de expedientes y se encontraron deficiencias». Para cumplir la fr. I del OCTAVO A, ¿qué debe precisar como mínimo sobre esa muestra?", "a": "Criterios de selección, número de expedientes, porcentaje del total y faltantes en cada uno", "o": ["Número de expedientes revisados y Grado de Riesgo promedio de la muestra, sin indicar porcentaje", "Nombre del empleado que integró cada expediente, fecha de apertura y sucursal de origen", "Criterios de selección, número de expedientes, porcentaje del total y faltantes en cada uno", "Método estadístico usado y aprobación del Comité sobre el tamaño de la muestra"], "x": "«En todos los casos» el Auditor debe explicar los criterios de selección, el número de registros, el porcentaje que representan del total y los datos y documentos faltantes.", "ref": "OCTAVO A, fr. I, inc. b) · Tema 3.1.1"}, {"id": "L210", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. X, inc. c)?", "a": "Listas de países con regímenes fiscales preferentes según la legislación mexicana", "o": ["Listas oficialmente reconocidas de personas vinculadas con operaciones ilícitas", "Listas de países sin medidas o con medidas deficientes para prevenir operaciones ilícitas", "Listas de países con regímenes fiscales preferentes según la legislación mexicana", "Lista de Personas Políticamente Expuestas que elabora el propio Sujeto Supervisado"], "x": "La fr. X, inc. c) revisa las listas de regímenes fiscales preferentes y si hay mecanismos efectivos para identificar esos países y jurisdicciones.", "ref": "OCTAVO A, fr. X, inc. c) · Tema 3.1.1"}, {"id": "L211", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. III, inc. j)?", "a": "Criterios para identificar número, monto y frecuencia de Operaciones con Sujetos Supervisados que sean sus Clientes", "o": ["Criterios para identificar número, monto y frecuencia de Operaciones con Sujetos Supervisados que sean sus Clientes", "Intercambio de información con otros Sujetos Supervisados conforme a las Disposiciones", "Obligaciones relacionadas con los comisionistas que operan a nombre del Sujeto Supervisado", "Políticas de identificación de quien realiza Operaciones en Cuentas Concentradoras abiertas en otro Sujeto Supervisado"], "x": "La fr. III, inc. j) revisa, en su caso, los criterios para identificar número, monto y frecuencia de Operaciones con Sujetos Supervisados que tengan calidad de Cliente o Usuario.", "ref": "OCTAVO A, fr. III, inc. j) · Tema 3.1.1"}, {"id": "L212", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué fracción e inciso del OCTAVO A se verifica si los reportes de Operaciones Relevantes incluyeron las realizadas a través de las Cuentas Concentradoras del Sujeto Supervisado?", "a": "fr. IV, inc. a)", "o": ["fr. IV, inc. e)", "fr. I, inc. c)", "fr. III, inc. j)", "fr. IV, inc. a)"], "x": "La fr. IV, inc. a) pide indicar si los reportes de Relevantes incluyeron todas las del periodo y las hechas por Cuentas Concentradoras; la I c) trata la identificación de quien opera en ellas.", "ref": "OCTAVO A, fr. IV, inc. a) · Tema 3.1.1"}, {"id": "L213", "tema": "lin2021", "tipo": "caso", "q": "El auditor encuentra que la evaluación previa de Riesgos de un Modelo Novedoso se hizo sin seguir el enfoque basado en Riesgo de las Disposiciones aplicables. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. XII, inc. c)", "o": ["fr. XII, inc. b)", "fr. XII, inc. c)", "fr. II, inc. b)", "fr. XII, inc. e)"], "x": "La fr. XII, inc. c) revisa que la evaluación del inciso b) se haya realizado conforme al enfoque basado en Riesgo de las Disposiciones aplicables.", "ref": "OCTAVO A, fr. XII, inc. c) · Tema 3.1.1"}, {"id": "L214", "tema": "lin2021", "tipo": "caso", "q": "En la auditoría a un transmisor de dinero, el auditor verifica el aviso con la lista de sus agentes relacionados y personas jurídicas coadyuvantes. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. XIII, inc. c)", "o": ["fr. XIV, inc. c)", "fr. XIII, inc. c)", "fr. XIV, inc. a)", "fr. XIII, inc. f)"], "x": "El aviso de agentes relacionados y personas jurídicas coadyuvantes de los transmisores de dinero está en la fr. XIII, inc. c), no en la fr. XIV de comisionistas.", "ref": "OCTAVO A, fr. XIII, inc. c) · Tema 3.1.1"}, {"id": "L215", "tema": "lin2021", "tipo": "caso", "q": "Al poner en funcionamiento su metodología, una unión de crédito cargó datos que no coinciden con los de sus sistemas automatizados y usó sólo nueve meses de información. ¿Qué inciso de la fr. II del OCTAVO A se incumple?", "a": "fr. II, inc. g)", "o": ["fr. II, inc. b)", "fr. II, inc. h)", "fr. II, inc. e)", "fr. II, inc. g)"], "x": "El inciso g) exige que en la implementación no haya inconsistencias con los sistemas automatizados y que la información cubra un periodo no menor a doce meses.", "ref": "OCTAVO A, fr. II, inc. g) · Tema 3.1.1"}, {"id": "L216", "tema": "lin2021", "tipo": "caso", "q": "El auditor detecta que la persona designada como Oficial de Cumplimiento interino no reúne los requisitos que señalan las Disposiciones. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. V, inc. d)", "o": ["fr. V, inc. d)", "fr. VIII, inc. a)", "fr. V, inc. a)", "fr. V, inc. e)"], "x": "La fr. V, inc. d) revisa si la designación o revocación del Oficial de Cumplimiento o del interino se hizo conforme a las Disposiciones y atendiendo sus requisitos.", "ref": "OCTAVO A, fr. V, inc. d) · Tema 3.1.1"}, {"id": "L217", "tema": "lin2021", "tipo": "caso", "q": "El auditor verifica que la entidad hizo llegar a su personal las modificaciones a las Disposiciones y boletines sobre técnicas y tendencias para prevenir y detectar operaciones ilícitas. ¿Qué fracción e inciso?", "a": "fr. VI, inc. c)", "o": ["fr. VI, inc. b)", "fr. VI, inc. a)", "fr. VI, inc. c)", "fr. XI, inc. a)"], "x": "La fr. VI, inc. c) revisa la difusión de las Disposiciones, sus modificaciones y la información sobre técnicas, métodos, procedimientos y tendencias.", "ref": "OCTAVO A, fr. VI, inc. c) · Tema 3.1.1"}, {"id": "L218", "tema": "lin2021", "tipo": "caso", "q": "Una casa de bolsa tiene como clientes a una casa de cambio y a una sociedad financiera popular. El auditor revisa cómo identifica el número, monto y frecuencia de las Operaciones que realiza con ellas. ¿Qué fracción e inciso?", "a": "fr. III, inc. j)", "o": ["fr. XI, inc. a)", "fr. I, inc. c)", "fr. III, inc. j)", "fr. III, inc. i)"], "x": "Cuando otros Sujetos Supervisados son Clientes, la fr. III, inc. j) revisa los criterios para identificar número, monto y frecuencia de esas Operaciones y su implementación.", "ref": "OCTAVO A, fr. III, inc. j) · Tema 3.1.1"}, {"id": "L219", "tema": "lin2021", "tipo": "memoria", "q": "Conforme a la fr. VIII del OCTAVO A, ¿qué debe indicar el Auditor sobre los expedientes de los empleados de atención al público o administración de recursos?", "a": "Si están integrados de acuerdo con sus procedimientos de selección", "o": ["Si están integrados de acuerdo con sus procedimientos de selección", "Si se digitalizaron y resguardan en el sistema automatizado del Sujeto Supervisado", "Si se conservan por un periodo no menor a diez años", "Si incluyen la evaluación anual de conocimientos de cada empleado"], "x": "El inciso b) revisa si hay expediente de cada empleado y si está integrado de acuerdo con sus procedimientos de selección.", "ref": "OCTAVO A, fr. VIII, inc. b) · Tema 3.1.1"}, {"id": "L220", "tema": "lin2021", "tipo": "memoria", "q": "Según el OCTAVO A, fr. XIV, inc. c), ¿con qué fin revisa el Auditor, en su caso, a uno o más comisionistas?", "a": "Conocer su régimen de prevención en materia de PLD/FT", "o": ["Emitir un dictamen de cumplimiento PLD/FT sobre cada comisionista", "Reportar a la Comisión las Operaciones Inusuales de cada comisionista", "Calificar a cada comisionista en los cinco sentidos del OCTAVO B", "Conocer su régimen de prevención en materia de PLD/FT"], "x": "El inciso c) se refiere a la revisión a comisionistas «a fin de conocer su régimen de prevención» de Operaciones con Recursos de Procedencia Ilícita y Financiamiento al Terrorismo.", "ref": "OCTAVO A, fr. XIV, inc. c) · Tema 3.1.1"}, {"id": "L221", "tema": "lin2021", "tipo": "memoria", "q": "Respecto de los expedientes de Clientes o Usuarios clasificados como de Grado de Riesgo alto, ¿qué prevé la fr. I del OCTAVO A para el Auditor?", "a": "Deberá considerar verificar, por muestreo, su integración e incluir el resultado en el Informe", "o": ["Deberá revisar la totalidad de esos expedientes sin excepción y anexar copia de cada uno al Informe", "Deberá considerar verificar, por muestreo, su integración e incluir el resultado en el Informe", "Podrá excluirlos de la muestra cuando el Comité ya los haya revisado en el año", "Deberá remitirlos a la Comisión para que ésta verifique su integración"], "x": "El inciso b) dice que el auditor «deberá considerar llevar a cabo una verificación, con base en el método de muestreo» de esos expedientes e incluir el resultado.", "ref": "OCTAVO A, fr. I, inc. b) · Tema 3.1.1"}, {"id": "L222", "tema": "lin2021", "tipo": "memoria", "q": "Para las listas de los incisos a) a e) de la fr. X del OCTAVO A, ¿qué debe indicar el informe además de si el Sujeto Supervisado cuenta con ellas?", "a": "Si tiene mecanismos para identificar a personas o países listados y si son efectivos", "o": ["El número de coincidencias detectadas en cada lista durante el periodo revisado", "Si tiene mecanismos para identificar a personas o países listados y si son efectivos", "La fecha de su última actualización y el proveedor que la suministra", "Si el Oficial de Cumplimiento firmó cada lista al incorporarla al sistema"], "x": "En cada uno de los incisos a) a e), el informe debe indicar si existen mecanismos para identificar a quienes estén en las listas y si dichos mecanismos son efectivos.", "ref": "OCTAVO A, fr. X, incs. a) a e) · Tema 3.1.1"}, {"id": "L223", "tema": "lin2021", "tipo": "cifra", "q": "Según el OCTAVO A, fr. II, inc. g), ¿qué información mínima debió usar el Sujeto Supervisado al poner en funcionamiento su metodología?", "a": "Total del número de Clientes, número de operaciones y monto operado de un periodo no menor a doce meses", "o": ["Total de Operaciones Inusuales reportadas y monto operado de un periodo no menor a veinticuatro meses", "Muestra representativa de Clientes y Operaciones Relevantes de un periodo no menor a doce meses", "Número de Clientes de Grado de Riesgo alto y monto operado de un periodo no menor a seis meses", "Total del número de Clientes, número de operaciones y monto operado de un periodo no menor a doce meses"], "x": "El inciso g) pide, al menos, el total del número de Clientes, número de operaciones y monto operado, de un periodo que no podrá ser menor a doce meses.", "ref": "OCTAVO A, fr. II, inc. g) · Tema 3.1.1"}, {"id": "L224", "tema": "lin2021", "tipo": "caso", "q": "Una entidad destruye los reportes de Operaciones con más de siete años de antigüedad y conserva sus Informes de Auditoría durante cinco años. ¿Qué concluye el auditor conforme a la fr. IX del OCTAVO A?", "a": "Cumple con los Informes de Auditoría, pero no con los reportes, que se conservan no menos de diez años", "o": ["Cumple con los Informes de Auditoría, pero no con los reportes, que se conservan no menos de diez años", "Cumple con los reportes, pero no con los Informes de Auditoría, que deben conservarse no menos de diez años", "Incumple ambos plazos, pues todo se conserva por un periodo no menor a diez años", "Cumple ambos plazos, pues todo se conserva por un periodo no menor a cinco años"], "x": "La fr. IX fija no menos de diez años para reportes y expedientes (incs. a) y b)) y no menos de cinco años para Informes de Auditoría (incs. c) y d)).", "ref": "OCTAVO A, fr. IX, incs. a) a d) · Tema 3.1.1"}, {"id": "L225", "tema": "lin2021", "tipo": "memoria", "q": "Conforme a la fr. III del OCTAVO A, ¿qué debe señalar el Auditor sobre el sistema de alertas del Sujeto Supervisado?", "a": "Si es acorde a sus productos, servicios, Clientes, países, transacciones y canales", "o": ["Si fue aprobado por el Comité antes de su puesta en operación en sucursales", "Si genera al menos una alerta por cada Operación Relevante del periodo", "Si es acorde a sus productos, servicios, Clientes, países, transacciones y canales", "Si fue desarrollado internamente o adquirido a un proveedor externo certificado"], "x": "El inciso d) pide señalar si el sistema de alertas es acorde a productos, servicios, tipos de Clientes, países o áreas geográficas, transacciones y canales con los que opera.", "ref": "OCTAVO A, fr. III, inc. d) · Tema 3.1.1"}, {"id": "L226", "tema": "lin2021", "tipo": "caso", "q": "Un banco presenta reportes de transferencias internacionales de fondos y de cheques de caja. ¿En qué fracción e inciso manifiesta el auditor si esos reportes cumplieron las Disposiciones y se presentaron en el formato oficial?", "a": "fr. IV, inc. e)", "o": ["fr. IV, inc. a)", "fr. IV, inc. c)", "fr. IV, inc. e)", "fr. XI, inc. a)"], "x": "La fr. IV, inc. e) cubre «los demás reportes», como transferencias internacionales de fondos y cheques de caja, y pide manifestar su cumplimiento y formato.", "ref": "OCTAVO A, fr. IV, inc. e) · Tema 3.1.1"}, {"id": "L227", "tema": "lin2021", "tipo": "caso", "q": "La autorización de la Comisión para un Modelo Novedoso fijó casos, plazos, condiciones y excepciones. El auditor verifica que la entidad se ajustó a ellos. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. XII, inc. e)", "o": ["fr. XII, inc. e)", "fr. XII, inc. a)", "fr. XII, inc. f)", "fr. XIII, inc. d)"], "x": "La fr. XII, inc. e) revisa si se ajustó a las Disposiciones conforme a los casos, formas, términos, plazos, condiciones y excepciones señalados en su autorización.", "ref": "OCTAVO A, fr. XII, inc. e) · Tema 3.1.1"}, {"id": "L228", "tema": "lin2021", "tipo": "caso", "q": "Tras una visita, la Comisión notificó a una entidad observaciones, recomendaciones y acciones correctivas. ¿En qué fracción e inciso del OCTAVO A informa el Auditor si fueron subsanadas?", "a": "fr. XIII, inc. e)", "o": ["fr. V, inc. e)", "fr. XIII, inc. d)", "fr. II, inc. f)", "fr. XIII, inc. e)"], "x": "La fr. XIII, inc. e) pide informar si el Sujeto Supervisado subsanó las observaciones, recomendaciones y acciones correctivas que la Comisión le notificó.", "ref": "OCTAVO A, fr. XIII, inc. e) · Tema 3.1.1"}, {"id": "L229", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. I, inc. f)?", "a": "Las visitas al domicilio del Cliente o Usuario: casos, resultados y programación de futuras visitas", "o": ["Las oficinas, sucursales, agencias y filiales del Sujeto Supervisado en México o el extranjero", "Las visitas al domicilio del Cliente o Usuario: casos, resultados y programación de futuras visitas", "La verificación de expedientes según Grado de Riesgo y su reclasificación al grado superior", "La revisión del Auditor a comisionistas para conocer su régimen de prevención"], "x": "La fr. I, inc. f) revisa si realizó visitas domiciliarias conforme a las Disposiciones, los casos, sus resultados y la programación de futuras visitas.", "ref": "OCTAVO A, fr. I, inc. f) · Tema 3.1.1"}, {"id": "L230", "tema": "lin2021", "tipo": "caso", "q": "Tras aplicar su metodología, un banco detecta Riesgos por encima de su nivel de tolerancia aceptable, pero no ajusta ninguna política ni procedimiento de su Manual. ¿Qué fracción e inciso debe analizar el auditor?", "a": "fr. II, inc. f)", "o": ["fr. II, inc. e)", "fr. II, inc. f)", "fr. VI, inc. a)", "fr. II, inc. h)"], "x": "La fr. II, inc. f) revisa si modificó políticas y procedimientos para establecer los Mitigantes necesarios y mantener los Riesgos en un nivel de tolerancia aceptable.", "ref": "OCTAVO A, fr. II, inc. f) · Tema 3.1.1"}, {"id": "L231", "tema": "lin2021", "tipo": "caso", "q": "El auditor evalúa si el modelo de la entidad permite ubicar adecuadamente a cada Cliente o Usuario en el Grado de Riesgo que le corresponde, conforme a las Disposiciones. ¿Qué fracción e inciso?", "a": "fr. III, inc. c)", "o": ["fr. III, inc. e)", "fr. I, inc. e)", "fr. II, inc. b)", "fr. III, inc. c)"], "x": "La fr. III, inc. c) revisa el modelo o criterios para clasificar a los Clientes por Grado de Riesgo y pide señalar si permiten una adecuada clasificación.", "ref": "OCTAVO A, fr. III, inc. c) · Tema 3.1.1"}, {"id": "L232", "tema": "lin2021", "tipo": "memoria", "q": "Además de lo revisado en los incisos a) a e), ¿qué reporte debe incluir el Auditor en la fr. V del OCTAVO A?", "a": "Las funciones y obligaciones que realizaron el Comité y el Oficial de Cumplimiento", "o": ["Las funciones y obligaciones que realizaron el Comité y el Oficial de Cumplimiento", "La evaluación de desempeño individual de cada miembro del Comité y su remuneración", "La relación de personal que el Oficial de Cumplimiento capacitó en el año", "Las actas de todas las sesiones del Comité celebradas en los últimos cinco años"], "x": "Tras el inciso e), la fr. V pide un reporte de las funciones y obligaciones del Comité, del Oficial de Cumplimiento o del interino conforme a Disposiciones y Manual.", "ref": "OCTAVO A, fr. V, párrafo posterior al inc. e) · Tema 3.1.1"}, {"id": "L233", "tema": "lin2021", "tipo": "caso", "q": "Dos empleados obtuvieron calificación no satisfactoria en la evaluación de conocimientos. Conforme al OCTAVO A, fr. VI, inc. e), ¿qué debe indicar el Auditor?", "a": "Cuáles son las medidas previstas para ese supuesto y si las aplicó conforme a su Manual", "o": ["El monto de la sanción económica que se impuso a cada uno de ellos", "Los nombres de esos empleados y la fecha en que fueron dados de baja", "Cuáles son las medidas previstas para ese supuesto y si las aplicó conforme a su Manual", "Si se les aplicó una segunda evaluación de conocimientos en un plazo máximo de treinta días naturales"], "x": "El inciso e) pide indicar cuáles son las medidas para quienes no obtienen calificación satisfactoria y si se aplicaron conforme al Manual.", "ref": "OCTAVO A, fr. VI, inc. e) · Tema 3.1.1"}, {"id": "L234", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué fracción e inciso del OCTAVO A se revisa si el Sujeto Supervisado cuenta con la Lista de Personas Bloqueadas y con mecanismos efectivos para identificar a quienes estén en ella?", "a": "fr. X, inc. e)", "o": ["fr. III, inc. k)", "fr. X, inc. f)", "fr. X, inc. e)", "fr. X, inc. a)"], "x": "Contar con la Lista de Personas Bloqueadas y mecanismos efectivos es la fr. X, inc. e); las políticas para identificar Clientes, terceros y Operaciones son la III k).", "ref": "OCTAVO A, fr. X, inc. e) · Tema 3.1.1"}, {"id": "L235", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. IV, inc. d)?", "a": "Reporte de Operaciones Internas Preocupantes, su dictamen y el análisis de las no dictaminadas como tales", "o": ["Reporte de Operaciones Internas Preocupantes, su dictamen y el análisis de las no dictaminadas como tales", "Posibles incumplimientos del Comité y del Oficial de Cumplimiento y sus razones", "Reporte de Operaciones Inusuales, su dictamen por el Comité y el análisis de las no dictaminadas como tales", "Presentación en tiempo y forma de los Reportes de 24 horas en el formato oficial"], "x": "La fr. IV, inc. d) revisa las Operaciones Internas Preocupantes, si fueron dictaminadas por el Comité u Oficial de Cumplimiento y el análisis de las no dictaminadas.", "ref": "OCTAVO A, fr. IV, inc. d) · Tema 3.1.1"}, {"id": "L236", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. XII, inc. f)?", "a": "Que realiza sus Operaciones a través del Modelo Novedoso autorizado", "o": ["Que obtuvo autorización de la Comisión para operar con Modelos Novedosos", "Que presentó con su solicitud el resultado de su evaluación", "Que evaluó su Riesgo antes de lanzar el producto o servicio", "Que realiza sus Operaciones a través del Modelo Novedoso autorizado"], "x": "La fr. XII, inc. f) revisa que las Operaciones se realicen a través del Modelo Novedoso autorizado; a), b) y d) tratan autorización, evaluación previa y su presentación.", "ref": "OCTAVO A, fr. XII, inc. f) · Tema 3.1.1"}, {"id": "L237", "tema": "lin2021", "tipo": "caso", "q": "Un banco tiene tres sucursales en el extranjero. Conforme a la fr. XIII del OCTAVO A, ¿qué debe hacer el Auditor?", "a": "Verificar si cumple las obligaciones de las Disposiciones en cada una de ellas", "o": ["Revisarlas únicamente si la Comisión lo requiere de forma expresa", "Verificar si cumple las obligaciones de las Disposiciones en cada una de ellas", "Solicitar a la autoridad del país sede que emita su propio dictamen de cumplimiento", "Excluirlas del Informe, pues sólo se revisan las oficinas en territorio nacional"], "x": "El inciso f) revisa oficinas, sucursales, agencias y filiales en territorio nacional o en el extranjero y pide verificar el cumplimiento de las Disposiciones en cada una.", "ref": "OCTAVO A, fr. XIII, inc. f) · Tema 3.1.1"}, {"id": "L238", "tema": "lin2021", "tipo": "caso", "q": "Para los clientes clasificados como de Grado de Riesgo alto, el auditor pide que le expliquen los criterios con que se supervisa su comportamiento transaccional y cómo se han implementado. ¿Qué fracción e inciso?", "a": "fr. III, inc. e)", "o": ["fr. I, inc. b)", "fr. III, inc. e)", "fr. III, inc. g)", "fr. III, inc. c)"], "x": "La fr. III, inc. e) revisa los criterios para supervisar el comportamiento transaccional de Clientes de riesgo alto; la I b) trata la integración de sus expedientes.", "ref": "OCTAVO A, fr. III, inc. e) · Tema 3.1.1"}, {"id": "L239", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. IX, inc. d)?", "a": "Que conserva los Informes de Auditoría por el periodo señalado en el inciso anterior", "o": ["Que conserva reportes de Operaciones y expedientes por el periodo del inciso anterior", "Que cuenta con mecanismos para conservar reportes y expedientes no menos de diez años", "Que cuenta con mecanismos para conservar los Informes de Auditoría no menos de cinco años", "Que conserva los Informes de Auditoría por el periodo señalado en el inciso anterior"], "x": "La fr. IX, inc. d) revisa la conservación efectiva de los Informes de Auditoría por el periodo del inc. c); el c) revisa los mecanismos.", "ref": "OCTAVO A, fr. IX, inc. d) · Tema 3.1.1"}, {"id": "L240", "tema": "lin2021", "tipo": "caso", "q": "El auditor pide evidencia de qué políticas y procedimientos del Manual ya operaban como Mitigantes cuando la entidad diseñó su metodología, y de su efectiva aplicación. ¿Qué fracción e inciso revisa?", "a": "fr. II, inc. e)", "o": ["fr. II, inc. e)", "fr. II, inc. f)", "fr. II, inc. a)", "fr. I, inc. a)"], "x": "El inciso e) revisa si identificó los Mitigantes implementados al momento del diseño y su efectiva aplicación; el f) trata los que modificó o agregó después.", "ref": "OCTAVO A, fr. II, inc. e) · Tema 3.1.1"}, {"id": "L241", "tema": "lin2021", "tipo": "caso", "q": "El comportamiento transaccional de un cliente de riesgo bajo cambió significativamente. El auditor revisa si la entidad tiene políticas para verificar su expediente y subirlo al Grado de Riesgo superior, y si las aplica según su Manual. ¿Qué fracción e inciso?", "a": "fr. I, inc. e)", "o": ["fr. III, inc. e)", "fr. III, inc. c)", "fr. I, inc. e)", "fr. III, inc. d)"], "x": "La fr. I, inc. e) revisa políticas para verificar expedientes según Grado de Riesgo y reclasificarlos al grado superior ante cambios significativos; la III d) es el sistema de alertas.", "ref": "OCTAVO A, fr. I, inc. e) · Tema 3.1.1"}, {"id": "L242", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. X, inc. a)?", "a": "Si cuenta con listas oficialmente reconocidas de personas vinculadas con ORPI o FT y si sus mecanismos son efectivos", "o": ["Si implementó las medidas de las Disposiciones al identificar a un Cliente en dichas listas", "Si tiene políticas para identificar terceros que actúen por cuenta de personas bloqueadas", "Si cuenta con listas oficialmente reconocidas de personas vinculadas con ORPI o FT y si sus mecanismos son efectivos", "Si cuenta con listas de países o jurisdicciones con regímenes fiscales preferentes y si sus mecanismos son efectivos"], "x": "La fr. X, inc. a) revisa las listas oficialmente reconocidas de autoridades mexicanas, agrupaciones intergubernamentales o autoridades de otros países, y la efectividad de sus mecanismos.", "ref": "OCTAVO A, fr. X, inc. a) · Tema 3.1.1"}, {"id": "L243", "tema": "lin2021", "tipo": "caso", "q": "Una entidad contrató ejecutivos de sucursal para atención al público sin aplicar el procedimiento de selección que exigen las Disposiciones. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. VIII, inc. a)", "o": ["fr. VIII, inc. a)", "fr. VI, inc. a)", "fr. V, inc. d)", "fr. VIII, inc. b)"], "x": "La fr. VIII, inc. a) revisa los procedimientos de selección de empleados de atención al público o administración de recursos y su implementación.", "ref": "OCTAVO A, fr. VIII, inc. a) · Tema 3.1.1"}, {"id": "L244", "tema": "lin2021", "tipo": "caso", "q": "Una sociedad financiera popular no realiza Operaciones a través de comisionistas. ¿Qué debe contener el Informe respecto de la fr. XIV del OCTAVO A?", "a": "Manifestar que no opera con comisionistas; los incisos a) a c) sólo aplican en caso afirmativo", "o": ["Los resultados de la revisión a por lo menos un comisionista, aunque no opere con ellos", "La justificación del inc. c) por no haber revisado a ningún comisionista del Sujeto Supervisado", "Nada; la fr. XIV se omite del Informe sin necesidad de manifestación alguna", "Manifestar que no opera con comisionistas; los incisos a) a c) sólo aplican en caso afirmativo"], "x": "La fr. XIV pide manifestar si opera a través de comisionistas y sólo «en caso afirmativo» exige los incisos a) a c).", "ref": "OCTAVO A, fr. XIV, proemio · Tema 3.1.1"}, {"id": "L245", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. III, inc. b)?", "a": "Criterios para determinar el perfil y el comportamiento transaccional del Cliente o Usuario", "o": ["Sistema de alertas para detectar oportunamente cambios en el comportamiento transaccional", "Criterios para determinar el perfil y el comportamiento transaccional del Cliente o Usuario", "Identificación del Cliente conforme a su perfil y tipo, revisando expedientes por muestreo", "Supervisión del comportamiento transaccional de Clientes de Grado de Riesgo alto"], "x": "La fr. III, inc. b) revisa los criterios para determinar perfil y comportamiento transaccional; la I b) es identificación por muestreo, la III d) alertas y la III e) riesgo alto.", "ref": "OCTAVO A, fr. III, inc. b) · Tema 3.1.1"}, {"id": "L246", "tema": "lin2021", "tipo": "caso", "q": "La entidad sustituyó a dos miembros de su Comité y no presentó esa información a la Secretaría por conducto de la Comisión. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. V, inc. c)", "o": ["fr. V, inc. e)", "fr. V, inc. c)", "fr. XIII, inc. a)", "fr. V, inc. b)"], "x": "El inciso b) se refiere a la integración inicial del Comité; el c) a la información sobre su integración y cambios.", "ref": "OCTAVO A, fr. V, inc. c) · Tema 3.1.1"}, {"id": "L247", "tema": "lin2021", "tipo": "caso", "q": "La entidad impartió su curso anual PLD/FT al personal de áreas corporativas (sin atención al público ni administración de recursos), pero no expidió ningún documento que acredite su participación. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. VI, inc. d)", "o": ["fr. VI, inc. b)", "fr. VIII, inc. c)", "fr. IX, inc. b)", "fr. VI, inc. d)"], "x": "La fr. VI, inc. d) revisa si expidió constancias de participación en los cursos; la VIII c) se refiere sólo a empleados de atención al público o administración de recursos y a su capacitación previa o simultánea al ingreso.", "ref": "OCTAVO A, fr. VI, inc. d) · Tema 3.1.1"}, {"id": "L248", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. II, inc. a)?", "a": "Que el Manual u otro documento prevea los procesos para identificar, medir y mitigar Riesgos", "o": ["Que el Manual u otro documento prevea los procesos para identificar, medir y mitigar Riesgos", "Que el Manual contenga criterios para el debido conocimiento del Cliente o Usuario", "Que el Manual sea adecuado para los servicios, productos u Operaciones que se ofrecen", "Que el programa anual de capacitación sea coherente con la metodología de Riesgos"], "x": "La fr. II, inc. a) revisa si el Manual u otro documento establece todos los procesos de identificación, medición y mitigación de los Riesgos.", "ref": "OCTAVO A, fr. II, inc. a) · Tema 3.1.1"}, {"id": "L249", "tema": "lin2021", "tipo": "trampa", "q": "¿Cuál de los siguientes reportes NO se menciona como ejemplo en el OCTAVO A, fr. IV, inc. e)?", "a": "Reporte de Operaciones con Personas Políticamente Expuestas", "o": ["Reporte de transferencias internacionales de fondos", "Reporte de operaciones en efectivo en moneda extranjera", "Reporte de Operaciones con Personas Políticamente Expuestas", "Reporte de montos totales de divisas extranjeras"], "x": "El inciso e) menciona transferencias internacionales de fondos, efectivo en dólares, cheques de caja, Activos Virtuales, efectivo en moneda extranjera y montos totales de divisas.", "ref": "OCTAVO A, fr. IV, inc. e) · Tema 3.1.1"}, {"id": "L251", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. XIII, inc. d)?", "a": "Cualquier otra información que la Comisión haya requerido al Sujeto Supervisado", "o": ["Cualquier otra información que la Comisión haya requerido al Sujeto Supervisado", "Si subsanó las observaciones y acciones correctivas notificadas por la Comisión", "Si comunicó la identidad de quienes ejercen el Control y sus cambios", "Si intercambió información conforme a las Disposiciones"], "x": "La fr. XIII, inc. d) cubre «cualquier otra información que haya sido requerida al Sujeto Supervisado por la Comisión».", "ref": "OCTAVO A, fr. XIII, inc. d) · Tema 3.1.1"}, {"id": "L252", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. III, inc. i)?", "a": "Políticas para identificar al Propietario Real y al beneficiario de los recursos, y su implementación", "o": ["Comunicación de la identidad de quienes ejercen el Control y de sus cambios", "Políticas para identificar a Clientes en la Lista de Personas Bloqueadas y a terceros por su cuenta", "Comunicación de la transmisión de acciones por más del dos por ciento del capital social pagado", "Políticas para identificar al Propietario Real y al beneficiario de los recursos, y su implementación"], "x": "La fr. III, inc. i) revisa Propietario Real y beneficiario; quienes ejercen el Control se revisan en la fr. XIII, inc. a).", "ref": "OCTAVO A, fr. III, inc. i) · Tema 3.1.1"}, {"id": "L253", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué debe indicar el Auditor, conforme a la fr. I del OCTAVO A, respecto de los mecanismos de seguimiento y de agrupación de Operaciones?", "a": "En qué consisten esos mecanismos y la forma en que fueron implementados", "o": ["Si fueron aprobados por el consejo de administración y registrados ante la Comisión", "En qué consisten esos mecanismos y la forma en que fueron implementados", "El número de alertas generadas y el porcentaje que representan del total de Operaciones", "Si son coherentes con los temas del programa anual de capacitación"], "x": "El inciso d) exige indicar en qué consisten los mecanismos (incluido, en su caso, el escalamiento de aprobación interna) y determinar cómo se implementaron.", "ref": "OCTAVO A, fr. I, inc. d) · Tema 3.1.1"}, {"id": "L256", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué fracción e inciso del OCTAVO A se revisa si el Sujeto Supervisado cuenta con mecanismos para conservar los Informes de Auditoría?", "a": "fr. IX, inc. c)", "o": ["fr. IX, inc. c)", "fr. XIII, inc. d)", "fr. IX, inc. d)", "fr. IX, inc. a)"], "x": "Los mecanismos para conservar Informes de Auditoría por no menos de cinco años están en la fr. IX, inc. c); el d) revisa que efectivamente se conserven.", "ref": "OCTAVO A, fr. IX, inc. c) · Tema 3.1.1"}, {"id": "L257", "tema": "lin2021", "tipo": "caso", "q": "El auditor verifica que la entidad presentó, según correspondía, la documentación que acredita haber intercambiado información con otras entidades en la forma y términos de las Disposiciones. ¿Cómo se cita?", "a": "fr. XI, inc. a)", "o": ["fr. III, inc. j)", "fr. XIII, inc. d)", "fr. XI, inc. a)", "fr. IV, inc. e)"], "x": "La fr. XI tiene un único inciso a), dedicado al intercambio de información y a la documentación que lo acredita.", "ref": "OCTAVO A, fr. XI, inc. a) · Tema 3.1.1"}, {"id": "L258", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. III, inc. a)?", "a": "Que el Manual contenga criterios para el debido conocimiento del Cliente o Usuario", "o": ["Que el Manual prevea medidas para empleados con calificación no satisfactoria", "Que el Manual establezca procesos de identificación, medición y mitigación de Riesgos", "Que el Manual contenga criterios para el debido conocimiento del Cliente o Usuario", "Que el Manual contenga criterios internos para la debida identificación del Cliente o Usuario"], "x": "La fr. III, inc. a) es el Manual para el conocimiento del Cliente; el de identificación está en la I a), los procesos de Riesgo en la II a) y las medidas a reprobados en la VI e).", "ref": "OCTAVO A, fr. III, inc. a) · Tema 3.1.1"}, {"id": "L259", "tema": "lin2021", "tipo": "caso", "q": "Una sociedad financiera popular describe en su Manual los procesos de identificación, medición y mitigación de Riesgos, pero nunca diseñó ni implementó una metodología para evaluarlos. ¿Qué inciso de la fr. II del OCTAVO A se incumple?", "a": "fr. II, inc. b)", "o": ["fr. II, inc. b)", "fr. II, inc. a)", "fr. II, inc. h)", "fr. II, inc. d)"], "x": "Tener los procesos en el Manual satisface el inciso a); diseñar e implementar la metodología de evaluación de Riesgos es el inciso b).", "ref": "OCTAVO A, fr. II, inc. b) · Tema 3.1.1"}, {"id": "L260", "tema": "lin2021", "tipo": "memoria", "q": "Si el Auditor detecta que el Sujeto Supervisado no se apegó a la fr. V del OCTAVO A o a las Disposiciones, ¿qué debe incluir en su informe?", "a": "Los posibles incumplimientos y las razones por las que se dan", "o": ["Sólo la calificación de la fracción, sin exponer razones", "Una propuesta de sanción para el Oficial de Cumplimiento", "La designación de un Oficial de Cumplimiento interino", "Los posibles incumplimientos y las razones por las que se dan"], "x": "El último párrafo de la fr. V obliga a incluir los posibles incumplimientos y las razones por las que el Auditor considera que se dan.", "ref": "OCTAVO A, fr. V, último párrafo · Tema 3.1.1"}, {"id": "L261", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. VI, inc. b)?", "a": "Que impartió cursos al Comité, Oficial de Cumplimiento, directivos, funcionarios y empleados", "o": ["Que expidió constancias de participación de funcionarios o empleados en los cursos", "Que impartió cursos al Comité, Oficial de Cumplimiento, directivos, funcionarios y empleados", "Que difundió al personal las Disposiciones, sus modificaciones y las técnicas, métodos y tendencias", "Que cuenta con un programa anual de capacitación coherente con su metodología"], "x": "La fr. VI, inc. b) revisa la impartición de cursos a los miembros del Comité, Oficial de Cumplimiento, directivos, funcionarios, empleados, apoderados y demás personas.", "ref": "OCTAVO A, fr. VI, inc. b) · Tema 3.1.1"}, {"id": "L262", "tema": "lin2021", "tipo": "caso", "q": "Un empleado alertó una posible Operación Interna Preocupante; el Oficial de Cumplimiento la dictaminó y se reportó. El auditor revisa si se presentó en tiempo y forma y quién la dictaminó. ¿Qué fracción e inciso del OCTAVO A aplica?", "a": "fr. IV, inc. d)", "o": ["fr. V, inc. d)", "fr. IV, inc. d)", "fr. IV, inc. b)", "fr. VIII, inc. b)"], "x": "La fr. IV, inc. d) revisa el reporte en tiempo y forma de cada Operación Interna Preocupante y si fue dictaminada por el Comité o, en su caso, el Oficial de Cumplimiento; la IV b) es para Inusuales.", "ref": "OCTAVO A, fr. IV, inc. d) · Tema 3.1.1"}, {"id": "L263", "tema": "lin2021", "tipo": "memoria", "q": "Según el OCTAVO A, fr. XII, inc. e), ¿quién emite opinión previa sobre los casos, términos, plazos, condiciones y excepciones que la Comisión señala en la autorización del Modelo Novedoso?", "a": "La Secretaría", "o": ["El Auditor", "El Banco de México", "El Comité del Sujeto Supervisado", "La Secretaría"], "x": "El inciso e) se refiere a lo que «en su autorización señaló la Comisión, previa opinión de la Secretaría».", "ref": "OCTAVO A, fr. XII, inc. e) · Tema 3.1.1"}, {"id": "L264", "tema": "lin2021", "tipo": "memoria", "q": "Además de los agentes relacionados y las personas jurídicas coadyuvantes, ¿a quiénes debe incluir el aviso del transmisor de dinero que revisa la fr. XIII del OCTAVO A?", "a": "A los terceros con los que operen sus agentes relacionados y personas jurídicas coadyuvantes", "o": ["A los terceros con los que operen sus agentes relacionados y personas jurídicas coadyuvantes", "A los beneficiarios de las órdenes de transferencia pagadas durante el periodo revisado", "A los Clientes clasificados de Grado de Riesgo alto de cada agente relacionado", "A los comisionistas facultados para celebrar Operaciones a nombre del transmisor de dinero"], "x": "El inciso c) se refiere a la lista de agentes relacionados y personas jurídicas coadyuvantes con relación contractual, y a los terceros con los que estos operen.", "ref": "OCTAVO A, fr. XIII, inc. c) · Tema 3.1.1"}, {"id": "L265", "tema": "lin2021", "tipo": "caso", "q": "Una entidad lanzó un crédito 100% digital, pero su Manual de Cumplimiento no prevé criterios para identificar a los clientes de ese producto. ¿En qué fracción e inciso manifiesta el auditor si el contenido y aplicación del Manual son adecuados a sus productos?", "a": "fr. I, inc. a)", "o": ["fr. III, inc. a)", "fr. XII, inc. b)", "fr. I, inc. a)", "fr. II, inc. f)"], "x": "La fr. I, inc. a) revisa el Manual con criterios para la debida identificación y obliga a manifestar si es adecuado a los servicios, productos u Operaciones; la III a) se refiere al conocimiento del Cliente.", "ref": "OCTAVO A, fr. I, inc. a) · Tema 3.1.1"}, {"id": "L266", "tema": "lin2021", "tipo": "trampa", "q": "Según el OCTAVO A, fr. III, inc. k), ¿qué elemento NO forma parte de lo que las políticas y procedimientos deben permitir identificar?", "a": "Operaciones de Clientes con países de regímenes fiscales preferentes", "o": ["Terceros que actúen en nombre o por cuenta de las personas bloqueadas", "Operaciones que hayan realizado las personas de la Lista de Personas Bloqueadas", "Operaciones de Clientes con países de regímenes fiscales preferentes", "Clientes o Usuarios que se encuentren dentro de la Lista de Personas Bloqueadas"], "x": "El inciso k) abarca Clientes en la Lista de Personas Bloqueadas, terceros que actúen por su cuenta y sus Operaciones; los regímenes fiscales preferentes son la fr. X, inc. c).", "ref": "OCTAVO A, fr. III, inc. k) · Tema 3.1.1"}, {"id": "L267", "tema": "lin2021", "tipo": "caso", "q": "El auditor verifica si la entidad cuenta con la lista de Personas Políticamente Expuestas que debe elaborar conforme a las Disposiciones y si sus mecanismos para identificarlas son efectivos. ¿Qué fracción e inciso?", "a": "fr. X, inc. b)", "o": ["fr. X, inc. b)", "fr. III, inc. f)", "fr. III, inc. g)", "fr. X, inc. a)"], "x": "La lista de PEP y la efectividad de los mecanismos para identificarlas se revisan en la fr. X, inc. b); la III f) son criterios sobre PEP y la III g) aprobación de sus Operaciones.", "ref": "OCTAVO A, fr. X, inc. b) · Tema 3.1.1"}, {"id": "L268", "tema": "lin2021", "tipo": "caso", "q": "El auditor encuentra que la metodología asigna el mismo peso a todos los indicadores de Riesgo, sin atender a su importancia ni vincularlos con el elemento al que pertenecen. ¿Qué fracción e inciso cita?", "a": "fr. II, inc. d)", "o": ["fr. II, inc. c)", "fr. II, inc. g)", "fr. III, inc. c)", "fr. II, inc. d)"], "x": "La fr. II, inc. d) revisa el método de medición que relaciona indicadores con su elemento y asigna pesos consistentes según su importancia.", "ref": "OCTAVO A, fr. II, inc. d) · Tema 3.1.1"}, {"id": "L269", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué fracción e inciso del OCTAVO A se revisa si existe expediente de cada empleado que labora en áreas de atención al público o de administración de recursos?", "a": "fr. VIII, inc. b)", "o": ["fr. IX, inc. b)", "fr. VIII, inc. b)", "fr. I, inc. b)", "fr. VIII, inc. a)"], "x": "Los expedientes de empleados están en la fr. VIII, inc. b); la IX b) y la I b) se refieren a expedientes de Clientes o Usuarios.", "ref": "OCTAVO A, fr. VIII, inc. b) · Tema 3.1.1"}, {"id": "L270", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. XIV, inc. a)?", "a": "Los resultados de revisar las obligaciones sobre comisionistas previstas en las Disposiciones", "o": ["El aviso con l
