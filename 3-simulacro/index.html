n monto aproximado para 2019–2021. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Alto", "o": ["Facilitación Alto y probabilidad de explotación Alto", "Grado de impacto Alto y probabilidad de ocurrencia Medio", "Grado de impacto Alto y probabilidad de ocurrencia Alto", "Grado de impacto Medio y probabilidad de ocurrencia Alto"], "x": "«Incremento del volumen de recursos ilícitos generados en México» es amenaza de LD en Alto/Alto, igual que delincuencia organizada y corrupción. Al ser amenaza se mide con impacto y ocurrencia; facilitación/explotación es de vulnerabilidades.", "ref": "VII.14; XI.3, tabla de amenazas de LD · Tema 3.3.3"}, {"id": "E025", "tema": "enr23", "tipo": "cifra", "q": "¿Cómo se reparten los 37 factores de la ENR 2023 entre amenazas y vulnerabilidades?", "a": "12 amenazas y 25 vulnerabilidades", "o": ["25 amenazas y 12 vulnerabilidades", "12 amenazas y 25 vulnerabilidades", "9 amenazas y 28 vulnerabilidades", "15 amenazas y 22 vulnerabilidades"], "x": "Amenazas: 3 de LD, 3 de FT, 3 de FPADM y 3 emergentes = 12. Vulnerabilidades: 12 del régimen, 10 de LD y 3 de FT = 25. El 9/28 olvida que los emergentes también son amenazas.", "ref": "XI.2 a XI.6 · Tema 3.3.3"}, {"id": "E026", "tema": "enr23", "tipo": "cifra", "q": "¿Cuántos de los 37 factores quedaron en ALTO en sus dos dimensiones?", "a": "Ocho", "o": ["Ocho", "Tres", "Diez", "Seis"], "x": "Son ocho: las tres amenazas de LD, tres vulnerabilidades de LD (contratación pública, controles transfronterizos en puertos e impartición de justicia), la porosidad de las fronteras (FT) y el ransomware (emergente). Seis es sólo el conteo de LD.", "ref": "XI.3 a XI.6 · Tema 3.3.3"}, {"id": "E027", "tema": "enr23", "tipo": "memoria", "q": "¿Cuántos factores integran el rubro de lavado de dinero y cómo se componen?", "a": "13: tres amenazas y diez vulnerabilidades", "o": ["6: tres amenazas y tres vulnerabilidades", "10: tres amenazas y siete vulnerabilidades", "13: tres amenazas y diez vulnerabilidades", "12: todas vulnerabilidades"], "x": "El ritmo de los rubros es 12 · 13 · 6 · 3 · 3. LD tiene 13 factores: amenazas 13 a 15 y vulnerabilidades 16 a 25. Doce, todas vulnerabilidades, es el régimen; seis (3 + 3) es FT.", "ref": "XI.3 · Tema 3.3.3"}, {"id": "E028", "tema": "enr23", "tipo": "caso", "q": "El instructor Víctor pide a su grupo nombrar los tres factores emergentes de la ENR 2023. ¿Qué respuesta es correcta?", "a": "Activos virtuales, ransomware y efectos de la pandemia de COVID-19", "o": ["Ransomware, comercio electrónico e Instituciones de Tecnología Financiera", "Activos virtuales, Instituciones de Tecnología Financiera y COVID-19", "Activos virtuales, ransomware y comercio electrónico", "Activos virtuales, ransomware y efectos de la pandemia de COVID-19"], "x": "Los emergentes son activos virtuales, ataques de ransomware y endebles controles de los efectos de la pandemia de COVID-19, los tres amenazas. Comercio electrónico e ITF son vulnerabilidades de LD, aunque su tema sea tecnológico.", "ref": "X; XI.6 · Tema 3.3.3"}, {"id": "E029", "tema": "enr23", "tipo": "caso", "q": "La analista Itzel debe anotar los grados del factor «Incremento de los ataques de Ransomware». ¿Cuáles son?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Alto", "o": ["Grado de impacto Medio y probabilidad de ocurrencia Medio", "Grado de impacto Alto y probabilidad de ocurrencia Alto", "Grado de impacto Alto y probabilidad de ocurrencia Medio", "Facilitación Alto y probabilidad de explotación Alto"], "x": "El ransomware es amenaza emergente en Alto/Alto. Alto/Medio corresponde a activos virtuales y Medio/Medio a COVID-19. Ojo: aunque el factor esté en Alto/Alto, su riesgo integral es Medio (XI.7).", "ref": "XI.6; X.36 · Tema 3.3.3"}, {"id": "E030", "tema": "enr23", "tipo": "caso", "q": "Un hallazgo dice que la pandemia aceleró el uso de tecnologías y con ello el fraude y el delito cibernético. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Medio y probabilidad de ocurrencia Medio", "o": ["Grado de impacto Alto y probabilidad de ocurrencia Medio", "Grado de impacto Medio y probabilidad de ocurrencia Medio", "Facilitación Medio y probabilidad de explotación Medio", "Grado de impacto Alto y probabilidad de ocurrencia Alto"], "x": "«Endebles controles de los efectos derivados de la pandemia de COVID-19» es amenaza emergente en Medio/Medio; es el único emergente con impacto Medio (sus cuatro consecuencias son Medio). Facilitación/explotación no aplica a los emergentes porque son amenazas.", "ref": "X.37; XI.6 · Tema 3.3.3"}, {"id": "E031", "tema": "enr23", "tipo": "caso", "q": "Un hallazgo dice que BANXICO, con las demás autoridades, ha decidido mantener una separación entre los activos virtuales y el sistema financiero, y que se analiza la Regla de Viaje. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Medio", "o": ["Grado de impacto Alto y probabilidad de ocurrencia Medio", "Facilitación Alto y probabilidad de explotación Medio", "Grado de impacto Alto y probabilidad de ocurrencia Alto", "Grado de impacto Medio y probabilidad de ocurrencia Medio"], "x": "«Debilidad regulatoria de los Activos Virtuales» es amenaza emergente con impacto Alto y ocurrencia Medio. Alto/Alto corresponde al ransomware; Medio/Medio, a COVID-19. No se mide con facilitación porque, pese a su nombre, no es vulnerabilidad.", "ref": "X.35; XI.6 · Tema 3.3.3"}, {"id": "E032", "tema": "enr23", "tipo": "caso", "q": "Un hallazgo dice: «para el Programa Anual de Supervisión de la CNBV se solicita información a UIF, CNSF, CONSAR, BANXICO y FGR, pero sólo responden UIF, CNSF y CONSAR». ¿A qué factor corresponde?", "a": "Deficiente coordinación efectiva entre autoridades para el intercambio de información", "o": ["Debilidad del sistema Supervisor y Sancionador", "Deficiente coordinación efectiva entre autoridades para el intercambio de información", "Deficiente maduración de los modelos de riesgo de los supervisores de SF para implementar un EBR", "Deficiencias en los sistemas de monitoreo y alertamiento de la UIF"], "x": "Es una falla de intercambio entre autoridades: vulnerabilidad del régimen, en Medio/Medio. El sistema supervisor y sancionador trata de cómo se supervisa y sanciona, no de la respuesta a solicitudes entre autoridades.", "ref": "VI.11; XI.2 · Tema 3.3.3"}, {"id": "E033", "tema": "enr23", "tipo": "caso", "q": "Un hallazgo señala que el campo «cuenta» de los reportes se llena indistintamente con número de cuenta, contrato, tarjeta, folio o póliza, y propone migrar de TXT a XML. ¿A qué factor pertenece?", "a": "Deficiencias en el Diseño del Aviso y Reporte conforme a Estándares Internacionales", "o": ["Deficiencias en el Diseño del Aviso y Reporte conforme a Estándares Internacionales", "Deficiente información sobre el Beneficiario Final", "Insuficiente obligatoriedad de la normativa para implementar un EBR por parte de los SO de SF", "Deficiencias en los sistemas de monitoreo y alertamiento de la UIF"], "x": "Es un problema de diseño del formato de reporte: vulnerabilidad del régimen con facilitación Medio y explotación Bajo. El de monitoreo y alertamiento de la UIF (Medio/Medio) trata, entre otros, de que no haya campo para identificar reportes de 24 horas.", "ref": "VI.4; XI.2 · Tema 3.3.3"}, {"id": "E034", "tema": "enr23", "tipo": "caso", "q": "Un hallazgo describe la falta de homologación del término (la LFPIORPI habla de «beneficiario controlador» y las DCG de «propietario real») y el uso de cuentas «mulas». ¿Qué tipo de factor es y con qué grados quedó?", "a": "Vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio", "o": ["Vulnerabilidad del régimen PLD/CFT, con facilitación Bajo y explotación Bajo", "Vulnerabilidad del régimen PLD/CFT, con facilitación Medio y explotación Medio", "Amenaza de LD, con grado de impacto Medio y probabilidad de ocurrencia Medio", "Vulnerabilidad de LD, con facilitación Alto y probabilidad de explotación Alto"], "x": "Es «Deficiente información sobre el Beneficiario Final», vulnerabilidad del régimen en Medio/Medio. Bajo/Bajo sólo lo tiene el Marco Jurídico del SF; y no es amenaza porque aparece en la tabla de vulnerabilidades del régimen (XI.2), medida con facilitación y explotación.", "ref": "VI.10; XI.2 · Tema 3.3.3"}, {"id": "E035", "tema": "enr23", "tipo": "caso", "q": "El oficial de cumplimiento de un banco ficticio, «Banco Ceibal», compara los dos factores sobre la obligatoriedad del EBR. ¿Qué grados tiene el de los SO del SF?", "a": "Facilitación Medio y probabilidad de explotación Bajo", "o": ["Facilitación Medio y probabilidad de explotación Medio", "Facilitación Bajo y probabilidad de explotación Bajo", "Facilitación Alto y probabilidad de explotación Medio", "Facilitación Medio y probabilidad de explotación Bajo"], "x": "«Insuficiente obligatoriedad de la normativa para implementar un EBR por parte de los SO de SF» está en Medio/Bajo. El de los SO de AV está en Medio/Medio: para AV sólo existe la posibilidad de medidas simplificadas y no es obligatoria una evaluación integral de riesgos.", "ref": "VI.5; VI.6; XI.2 · Tema 3.3.3"}, {"id": "E036", "tema": "enr23", "tipo": "memoria", "q": "¿Cuál de estas vulnerabilidades del régimen tiene probabilidad de explotación Bajo?", "a": "Deficiente maduración de los modelos de riesgo de los supervisores de SF para implementar un EBR", "o": ["Deficiente información sobre el Beneficiario Final", "Deficiente maduración de los modelos de riesgo de los supervisores de SF para implementar un EBR", "Debilidad del sistema Supervisor y Sancionador", "Deficiente maduración de los modelos de riesgo de los supervisores de AV para implementar un EBR"], "x": "La maduración de los modelos de los supervisores de SF está en Medio/Bajo (la CNBV tiene un EBR «altamente desarrollado»). La de los supervisores de AV está en Medio/Medio. Beneficiario final y sistema supervisor y sancionador también están en Medio/Medio.", "ref": "XI.2; VI.7 · Tema 3.3.3"}, {"id": "E037", "tema": "enr23", "tipo": "trampa", "q": "¿Cuál de estos factores NO es una amenaza?", "a": "Endebles controles ante la posición geográfica y porosidad de las fronteras", "o": ["Incremento de los ataques de Ransomware", "Desarrollo de ADM dentro del territorio nacional", "Existencia de grupos terroristas de nacionalidad mexicana en el extranjero", "Endebles controles ante la posición geográfica y porosidad de las fronteras"], "x": "La porosidad de las fronteras es vulnerabilidad de FT (facilitación y explotación). El ransomware es amenaza emergente, los grupos terroristas en el extranjero son amenaza de FT y el desarrollo de ADM es amenaza de FPADM.", "ref": "XI.4; XI.5; XI.6 · Tema 3.3.3"}, {"id": "E038", "tema": "enr23", "tipo": "trampa", "q": "Para una lámina de «amenazas de LD en ALTO/ALTO», un instructor anota: delincuencia organizada, corrupción y contratación pública. ¿Qué corrección procede?", "a": "Cambiar contratación pública por el volumen de recursos ilícitos generados en México", "o": ["Cambiar contratación pública por el volumen de recursos ilícitos generados en México", "Cambiar corrupción por la deficiente impartición de justicia", "Cambiar contratación pública por los controles transfronterizos en puertos de entrada", "Cambiar delincuencia organizada por la deficiente Cultura Constitucional"], "x": "Las tres amenazas de LD son delincuencia organizada, recursos ilícitos generados en México y corrupción, todas en Alto/Alto. Contratación pública, impartición de justicia y controles en puertos están en Alto/Alto, pero son vulnerabilidades de LD: el nivel no cambia la clasificación.", "ref": "XI.3, tabla de amenazas de LD · Tema 3.3.3"}, {"id": "E039", "tema": "enr23", "tipo": "memoria", "q": "¿Qué tienen en común las tres amenazas de financiamiento al terrorismo?", "a": "Las tres tienen probabilidad de ocurrencia Bajo", "o": ["Las tres tienen probabilidad de ocurrencia Bajo", "Las tres están en Alto en sus dos dimensiones", "Las tres tienen grado de impacto Alto", "Las tres tienen probabilidad de ocurrencia Medio"], "x": "Grupos terroristas en México (Alto/Bajo), recursos de origen nacional (Medio/Bajo) y grupos de nacionalidad mexicana en el extranjero (Alto/Bajo) comparten la ocurrencia Bajo. No todas tienen impacto Alto: la de recursos de origen nacional tiene impacto Medio.", "ref": "XI.4, tabla de amenazas de FT · Tema 3.3.3"}, {"id": "E040", "tema": "enr23", "tipo": "caso", "q": "Un hallazgo de FPADM dice que México tiene industria que usa material precursor, pero no programas de ADM ni intereses bélicos, y que participa en el Grupo Australia. ¿Qué grados tiene ese factor?", "a": "Grado de impacto Alto y probabilidad de ocurrencia Bajo", "o": ["Grado de impacto Alto y probabilidad de ocurrencia Medio", "Grado de impacto Alto y probabilidad de ocurrencia Bajo", "Facilitación Alto y probabilidad de explotación Bajo", "Grado de impacto Medio y probabilidad de ocurrencia Bajo"], "x": "Es «Desarrollo de ADM dentro del territorio nacional», amenaza de FPADM en Alto/Bajo. Ocurrencia Medio sólo la tiene el sistema de respuesta ante un ataque con ADM. Las tres amenazas de FPADM tienen impacto Alto.", "ref": "IX.32; XI.5 · Tema 3.3.3"}, {"id": "E041", "tema": "enr23", "tipo": "caso", "q": "El analista Joaquín va a calificar un factor nuevo que la ENR clasificará como amenaza, no como vulnerabilidad. Según la ENR, ¿con qué binomio debe evaluarlo?", "a": "Grado de impacto y probabilidad de ocurrencia", "o": ["Grado de impacto y probabilidad de explotación", "Grado de impacto y probabilidad de ocurrencia", "Grado de facilitación y probabilidad de ocurrencia", "Grado de facilitación y probabilidad de explotación"], "x": "El esquema probabilidad de ocurrencia y grado de impacto sólo se usa respecto de las amenazas. Facilitación y explotación es el binomio de las vulnerabilidades. Las combinaciones cruzadas no existen en la ENR.", "ref": "V.3 · Tema 3.3.3"}, {"id": "E042", "tema": "enr23", "tipo": "caso", "q": "La instructora Lucía evalúa una vulnerabilidad del régimen PLD/CFT. ¿Qué dos dimensiones debe usar?", "a": "Grado de facilitación y probabilidad de explotación", "o": ["Grado de facilitación y probabilidad de ocurrencia", "Concentración del negocio y probabilidad de explotación", "Grado de impacto y probabilidad de ocurrencia", "Grado de facilitación y probabilidad de explotación"], "x": "Para los juicios sobre vulnerabilidades, la ENR usa el binomio «probabilidad de explotación» y «grado de facilitación», sean del régimen, de LD o de FT. Impacto y ocurrencia es exclusivo de amenazas.", "ref": "V.3 · Tema 3.3.3"}, {"id": "E043", "tema": "enr23", "tipo": "memoria", "q": "¿En qué intervalo se expresa cada dimensión de un factor y cuáles son sus niveles?", "a": "0 a 9: 0–3 Bajo, 3–6 Medio y 6–9 Alto", "o": ["1 a 5: 1–2 Bajo, 3 Medio y 4–5 Alto", "0 a 9: 0–3 Bajo, 3–5 Medio, 5–7 Medio-Alto y 7–9 Alto", "0 a 9: 0–3 Bajo, 3–6 Medio y 6–9 Alto", "0 a 100: 0–50 Bajo, 51–80 Medio y 81–100 Alto"], "x": "Cada dimensión se ajusta a un intervalo de 0 a 9 con tres niveles: Bajo, Medio y Alto. La escala de cuatro niveles con Medio-Alto es la de la evaluación integral (XI.7); la de porcentaje es la matriz sectorial (IV); 1 a 5 es el valor de cada elemento, no el de la dimensión.", "ref": "V.3 · Tema 3.3.3"}, {"id": "E044", "tema": "enr23", "tipo": "cifra", "q": "Al calcular el grado de impacto o de facilitación, ¿qué valor se asigna a cada elemento?", "a": "Un valor de 1 a 5", "o": ["Un valor de 1 a 5", "Un valor de 1 a 10", "Un valor de 0 a 3", "Un valor de 0 a 9"], "x": "A cada elemento se le asigna un valor dentro del intervalo de 1 a 5; después se agregan de forma ponderada y el resultado se ajusta al intervalo de 0 a 9. No confundas el valor del elemento (1–5) con el de la dimensión (0–9).", "ref": "V.3 · Tema 3.3.3"}, {"id": "E045", "tema": "enr23", "tipo": "caso", "q": "Un evaluador obtiene 4.5 en el grado de facilitación de una vulnerabilidad. Según la escala de cada dimensión, ¿qué nivel le corresponde?", "a": "Medio", "o": ["Alto", "Bajo", "Medio-Alto", "Medio"], "x": "La escala de cada dimensión es 0–3 Bajo, 3–6 Medio y 6–9 Alto, así que 4.5 es Medio. Medio-Alto no existe para una dimensión: sólo aparece en la escala integral de los riesgos finales (XI.7).", "ref": "V.3 · Tema 3.3.3"}, {"id": "E046", "tema": "enr23", "tipo": "trampa", "q": "Al aplicar las ecuaciones de la conclusión nacional, la analista Itzel obtiene 6.2 para un riesgo final. ¿Qué nivel le corresponde?", "a": "Medio-Alto", "o": ["Medio", "Medio-Alto", "Medio-Bajo", "Alto"], "x": "La escala integral tiene cuatro niveles: 0–3 Bajo, 3–5 Medio, 5–7 Medio-Alto y 7–9 Alto. Con 6.2 es Medio-Alto. Si se usara por error la escala de una dimensión (6–9 Alto) saldría Alto; Medio-Bajo no existe en la escala integral (es de la matriz sectorial).", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E047", "tema": "enr23", "tipo": "trampa", "q": "¿En qué escala de la ENR existe el nivel «Medio-Bajo»?", "a": "En la matriz de riesgo sectorial de los sujetos obligados", "o": ["En el grado de cada dimensión de los 37 factores de riesgo", "En la evaluación integral de los riesgos finales de LD, FT y FPADM", "En la probabilidad de ocurrencia de las amenazas emergentes", "En la matriz de riesgo sectorial de los sujetos obligados"], "x": "Medio-Bajo (51–80 %) es un nivel de la matriz sectorial (IV); la ENR también lo usa en la matriz de FT de las OSFL (VIII.31), que no está entre las opciones. La evaluación integral usa Medio-Alto, no Medio-Bajo (XI.7), y cada dimensión de un factor sólo tiene Bajo, Medio y Alto (V.3).", "ref": "IV · Tema 3.3.3"}, {"id": "E048", "tema": "enr23", "tipo": "trampa", "q": "El auditor Fermín revisa una presentación que dice: «Riesgo integral de LD: Medio-Bajo». ¿Qué corrección procede?", "a": "Debe decir Medio-Alto: en la escala integral no existe Medio-Bajo", "o": ["Debe decir Medio, como la mayoría de los sectores del sistema financiero", "Debe decir Alto, porque sus tres amenazas están en Alto/Alto", "Debe decir Medio-Alto: en la escala integral no existe Medio-Bajo", "Es correcto, porque coincide con el nivel más frecuente en la matriz de AV"], "x": "El riesgo integral de LD es Medio-Alto (XI.7). Medio-Bajo pertenece a la matriz sectorial. Que las tres amenazas estén en Alto/Alto no hace Alto el riesgo final: entran ponderadas con las vulnerabilidades de LD y del régimen.", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E049", "tema": "enr23", "tipo": "memoria", "q": "¿Cuál es la fórmula de valoración de una amenaza?", "a": "(1/9) × (impacto × ocurrencia)", "o": ["(1/5) × (impacto × ocurrencia)", "(1/9) × (facilitación × explotación)", "(impacto + ocurrencia) ÷ 2, sin ajuste", "(1/9) × (impacto × ocurrencia)"], "x": "La valoración de amenazas es (1/9) × (impacto × ocurrencia). La de facilitación × explotación es la fórmula de las vulnerabilidades. Se divide entre 9, no entre 5, porque ambas variables están en 0–9.", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E050", "tema": "enr23", "tipo": "memoria", "q": "En la valoración de los factores, ¿por qué el producto de las dos dimensiones se divide entre 9?", "a": "Para que el resultado quede acotado en el mismo intervalo de 0 a 9", "o": ["Para convertir el resultado a la escala porcentual de la matriz sectorial", "Para ponderar por igual a los nueve factores en Alto de cada rubro", "Para promediar los nueve elementos que integran el grado de impacto", "Para que el resultado quede acotado en el mismo intervalo de 0 a 9"], "x": "Como impacto/facilitación y ocurrencia/explotación están en 0–9, su producto llega hasta 81; dividir entre 9 lo regresa a 0–9. Así, la valoración es el grado matizado por su probabilidad.", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E051", "tema": "enr23", "tipo": "memoria", "q": "¿Cómo se calcula el riesgo de lavado de dinero en la conclusión nacional?", "a": "0.8 amenazas de LD + 0.1 vulnerabilidades de LD + 0.1 vulnerabilidades del régimen", "o": ["0.8 amenazas de LD + 0.1 vulnerabilidades de LD + 0.1 vulnerabilidades del régimen", "0.8 amenazas de LD + 0.2 vulnerabilidades del régimen, sin vulnerabilidades de LD", "0.6 amenazas de LD + 0.2 vulnerabilidades de LD + 0.2 vulnerabilidades del régimen", "0.8 amenazas de LD + 0.2 vulnerabilidades de LD, sin el régimen PLD/CFT"], "x": "LD y FT usan 0.8 / 0.1 / 0.1: amenazas propias, vulnerabilidades propias y vulnerabilidades del régimen. La forma 0.8 + 0.2 del régimen es la de FPADM y los emergentes, que no tienen vulnerabilidades propias.", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E052", "tema": "enr23", "tipo": "caso", "q": "Un alumno pregunta a la instructora Lucía por qué la ecuación del riesgo de FPADM sólo tiene dos términos. ¿Qué le responde?", "a": "Porque el rubro no tiene vulnerabilidades propias: el régimen pesa 0.2", "o": ["Porque el rubro no tiene vulnerabilidades propias: el régimen pesa 0.2", "Porque el régimen PLD/CFT no se considera en los riesgos de proliferación", "Porque las vulnerabilidades de FT sustituyen a las de FPADM con un peso de 0.2", "Porque sus amenazas están en Bajo y no hace falta ponderarlas"], "x": "FPADM = 0.8 × amenazas de FPADM + 0.2 × vulnerabilidades del régimen. Como el rubro sólo trae amenazas, el 0.2 que en LD y FT se reparte entre vulnerabilidades propias y del régimen lo pone por completo el régimen.", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E053", "tema": "enr23", "tipo": "cifra", "q": "En la ecuación de cada factor emergente, ¿qué peso tiene la valoración agregada de las vulnerabilidades del régimen PLD/CFT?", "a": "0.2", "o": ["0.1", "0.2", "0.5", "0.8"], "x": "Factor emergente = 0.8 × valoración del factor + 0.2 × vulnerabilidades del régimen. El 0.1 del régimen sólo aplica en LD y FT, donde el otro 0.1 lo ponen las vulnerabilidades propias.", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E054", "tema": "enr23", "tipo": "memoria", "q": "¿Cómo se obtiene la valoración agregada de las amenazas o de las vulnerabilidades de un grupo?", "a": "Con el promedio aritmético de las valoraciones de los factores del grupo", "o": ["Con el producto de las valoraciones del grupo dividido entre 9", "Con la suma simple de las valoraciones de los factores del grupo", "Con el promedio aritmético de las valoraciones de los factores del grupo", "Con la valoración más alta del grupo, por criterio de prudencia del evaluador"], "x": "La ENR define la valoración agregada como el promedio aritmético de los factores de ese grupo. La división entre 9 se aplica a cada factor, no al agregado; y no se toma el máximo ni la suma.", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E055", "tema": "enr23", "tipo": "caso", "q": "Un consultor ficticio, Arturo Ledesma, redacta el marco de referencia de un cliente y debe citar el riesgo integral de lavado de dinero de la ENR 2023. ¿Qué nivel debe escribir?", "a": "Medio-Alto", "o": ["Medio-Alto", "Medio-Bajo", "Medio", "Alto"], "x": "El riesgo de LD quedó en Medio-Alto, el único de los seis riesgos finales en ese nivel. Medio-Bajo no existe en la escala integral (es de la matriz sectorial).", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E056", "tema": "enr23", "tipo": "caso", "q": "La oficial de cumplimiento de una casa de cambio ficticia actualiza su metodología y quiere citar el riesgo integral de financiamiento al terrorismo de la ENR 2023. ¿Cuál es?", "a": "Bajo", "o": ["Medio", "Medio-Bajo", "Bajo", "Medio-Alto"], "x": "El riesgo de FT quedó en Bajo, igual que FPADM y la pandemia de COVID-19. Que la porosidad de las fronteras esté en Alto/Alto no lo sube: las amenazas de FT, que pesan 0.8, tienen ocurrencia Bajo.", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E057", "tema": "enr23", "tipo": "trampa", "q": "¿Cuál de estos riesgos finales NO quedó en nivel Bajo?", "a": "Ataques de ransomware", "o": ["Financiamiento al terrorismo", "Financiamiento a la proliferación de ADM", "Ataques de ransomware", "Pandemia de COVID-19"], "x": "El ransomware quedó en Medio, igual que los activos virtuales. FT, FPADM y COVID-19 quedaron en Bajo; LD es el único en Medio-Alto.", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E058", "tema": "enr23", "tipo": "caso", "q": "En una clase, un alumno sostiene: «el riesgo integral del ransomware es Alto, porque su factor está en Alto/Alto». ¿Qué le corrige el instructor?", "a": "Su riesgo integral es Medio: el factor pesa 0.8 y el régimen 0.2", "o": ["Su riesgo integral es Medio: el factor pesa 0.8 y el régimen 0.2", "Su riesgo integral es Medio-Alto, el mismo nivel que el del riesgo de LD", "Su riesgo integral es Bajo, el mismo nivel que el de la pandemia", "Es correcto: el riesgo integral repite los grados del factor"], "x": "El nivel del factor no es el riesgo integral. Para cada emergente, riesgo = 0.8 × valoración del factor + 0.2 × vulnerabilidades del régimen, y el ransomware queda en Medio.", "ref": "XI.7; XI.6 · Tema 3.3.3"}, {"id": "E059", "tema": "enr23", "tipo": "caso", "q": "Una SOFOM ficticia, «Crédito Ahuehuete», evalúa si permitir operaciones vinculadas con activos virtuales y quiere citar el riesgo integral de ese factor emergente. ¿Cuál es?", "a": "Medio", "o": ["Bajo", "Medio", "Alto", "Medio-Alto"], "x": "El riesgo integral de los activos virtuales es Medio, igual que el del ransomware. No confundas este resultado con sus grados como factor (impacto Alto, ocurrencia Medio) ni con el nivel del sector de AV de activos virtuales en la matriz sectorial (Medio-Bajo).", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E060", "tema": "enr23", "tipo": "trampa", "q": "En la ENR, ¿con qué se arma el grado de impacto de cada amenaza?", "a": "Con sus consecuencias sociales, políticas, financieras y económicas", "o": ["Con la concentración del negocio de la entidad, no en términos financieros", "Con los intensificadores y los mitigantes que se registran para cada amenaza", "Con el porcentaje que obtiene el sector en la matriz sectorial de riesgos", "Con sus consecuencias sociales, políticas, financieras y económicas"], "x": "Para las amenazas, el impacto se evalúa a partir de sus consecuencias sociales, políticas, financieras y económicas, y al final de cada amenaza hay una tabla con esos grados. La concentración del negocio sin términos financieros es el impacto de la Guía CNBV de 2019 para la metodología de la entidad; los intensificadores y mitigantes forman la probabilidad.", "ref": "V.3 · Tema 3.3.3"}, {"id": "E061", "tema": "enr23", "tipo": "trampa", "q": "La oficial Itzel copia en la metodología de su entidad la definición de impacto de la ENR, con sus consecuencias financieras. Su auditor la remite a la Guía CNBV de 2019. ¿Qué observación procede?", "a": "En la Guía CNBV el impacto se mide por concentración del negocio, no en términos financieros", "o": ["Debe medir el impacto sólo con consecuencias sociales y políticas, como hace la ENR", "Es correcto: la Guía CNBV adopta íntegro el impacto de la ENR con sus cuatro consecuencias", "En la Guía CNBV el impacto se mide por concentración del negocio, no en términos financieros", "Debe usar el binomio facilitación y explotación, que es el que exige la Guía CNBV para el impacto"], "x": "Son dos ejercicios distintos: la ENR mide al país e incluye consecuencias financieras en el impacto de cada amenaza (V.3); la Guía CNBV de 2019 mide a la entidad y su impacto se basa en la concentración del negocio, no en términos financieros. No se cruzan las definiciones.", "ref": "V.3 (contraste con la Guía CNBV de 2019) · Tema 3.3.3"}, {"id": "E062", "tema": "enr23", "tipo": "trampa", "q": "El auditor Gonzalo lee en un resumen de la ENR: «el grado de impacto de las amenazas no se mide en términos financieros». ¿Cómo lo califica?", "a": "Error: en la ENR las consecuencias financieras sí forman parte del impacto", "o": ["Error: la ENR mide el impacto sólo con las consecuencias financieras del delito", "Correcto: la ENR mide el impacto por concentración del negocio del país", "Error: en la ENR las consecuencias financieras sí forman parte del impacto", "Correcto: en la ENR el grado de impacto sólo se aplica a las vulnerabilidades"], "x": "La frase confunde la ENR con la Guía CNBV de 2019. En la ENR, el impacto de cada amenaza se construye con consecuencias sociales, políticas, financieras y económicas; la tabla al final de cada amenaza trae las cuatro. Lo de «no en términos financieros» es la Guía CNBV para la entidad.", "ref": "V.3 · Tema 3.3.3"}, {"id": "E063", "tema": "enr23", "tipo": "memoria", "q": "En la probabilidad de ocurrencia o de explotación, ¿cómo intervienen los dos grupos de elementos?", "a": "Los intensificadores suman y los mitigantes restan", "o": ["Sólo cuentan los mitigantes; los intensificadores son informativos", "Ambos grupos se promedian sin distinguir su efecto", "Los intensificadores suman y los mitigantes restan", "Los mitigantes suman y los intensificadores restan"], "x": "Los intensificadores incrementan la probabilidad de que se materialice el factor y los mitigantes la reducen. Al agregarse de forma ponderada se suman los primeros y se restan los segundos, y el resultado se ajusta a 0–9.", "ref": "V.3 · Tema 3.3.3"}, {"id": "E064", "tema": "enr23", "tipo": "memoria", "q": "¿Qué documento usó la ENR 2023 para identificar, analizar y evaluar los riesgos finales?", "a": "La Guía del GAFI sobre la Evaluación Nacional de Riesgos de LD y FT, de febrero de 2013", "o": ["La Recomendación 15 del GAFI sobre nuevas tecnologías, recalificada en el año 2021", "La Guía del GAFI sobre la Evaluación Nacional de Riesgos de LD y FT, de febrero de 2013", "La Guía de la UIF para combatir el financiamiento al terrorismo, emitida el 7 de diciembre de 2020", "La Guía CNBV para la elaboración de una metodología de evaluación de riesgos, de 2019"], "x": "El apartado V dice que se utilizó la Guía del GAFI sobre la ENR de LD y FT publicada en febrero de 2013. La Guía CNBV de 2019 es para la metodología de la entidad; la R. 15 y la guía de FT de la UIF se citan en otros apartados, no como base metodológica.", "ref": "V · Tema 3.3.3"}, {"id": "E065", "tema": "enr23", "tipo": "cifra", "q": "En la evaluación integral de los riesgos, ¿qué rango de calificación corresponde al nivel Medio-Alto?", "a": "De 5 a 7", "o": ["De 3 a 5", "De 6 a 9", "De 81 a 90", "De 5 a 7"], "x": "Escala integral: 0–3 Bajo, 3–5 Medio, 5–7 Medio-Alto y 7–9 Alto. De 6 a 9 es el nivel Alto de cada dimensión (V.3) y de 81 a 90 % es el nivel Medio de la matriz sectorial (IV).", "ref": "XI.7 · Tema 3.3.3"}, {"id": "E066", "tema": "enr23", "tipo": "caso", "q": "El oficial de cumplimiento de un grupo financiero ficticio supervisa cuatro subsectores de Banca Múltiple y quiere saber cuál quedó en riesgo ALTO en la ENR 2023. ¿Cuál es?", "a": "Banca Múltiple-Cambiarios", "o": ["Banca Múltiple-Comercial", "Banca Múltiple-Inversión", "Banca Múltiple-Cambiarios", "Banca Múltiple-Crédito a los hogares"], "x": "En el SF sólo dos resultados quedaron en ALTO: Banca Múltiple-G7 y Banca Múltiple-Cambiarios. Inversión, Comercial y Crédito a los hogares quedaron en MEDIO.", "ref": "IV.1, tabla de riesgo de LD del SF; XI.1 · Tema 3.3.3"}, {"id": "E067", "tema": "enr23", "tipo": "caso", "q": "Una instructora pide a su grupo los sectores del sistema financiero que quedaron en ALTO en la matriz sectorial 2023. ¿Qué respuesta es correcta?", "a": "Banca Múltiple-G7 y Banca Múltiple-Cambiarios", "o": ["Banca Múltiple-G7 y Banca Múltiple-Cambiarios", "Banca Múltiple-G7 y Casas de cambio", "Casas de cambio y Centros cambiarios", "Banca Múltiple-Cambiarios y Transmisores de dinero"], "x": "Los únicos dos sectores del SF en ALTO son Banca Múltiple-G7 y Banca Múltiple-Cambiarios. Casas de cambio, Centros cambiarios y Transmisores de dinero quedaron en MEDIO: el componente cambiario en ALTO es el subsector bancario, no las casas ni los centros.", "ref": "IV.1, tabla de riesgo de LD del SF; XI.1 · Tema 3.3.3"}, {"id": "E068", "tema": "enr23", "tipo": "memoria", "q": "¿Qué sectores de actividades vulnerables quedaron en ALTO en la matriz sectorial 2023?", "a": "Obras de arte; metales y joyas; monederos y certificados de recompensas", "o": ["Obras de arte; metales y joyas; vehículos aéreos, marítimos o terrestres", "Obras de arte; servicios de blindaje; metales preciosos y joyas", "Metales y joyas; tarjetas prepagadas; operaciones con activos virtuales", "Obras de arte; metales y joyas; monederos y certificados de recompensas"], "x": "En ALTO están Obras de arte; Metales preciosos, piedras preciosas, joyas y relojes; y Monederos y certificados de devoluciones o recompensas. Vehículos y tarjetas prepagadas quedaron en MEDIO; blindaje y activos virtuales, en MEDIO-BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1 · Tema 3.3.3"}, {"id": "E069", "tema": "enr23", "tipo": "trampa", "q": "¿Cuál de estos sectores de actividades vulnerables NO quedó en ALTO en 2023?", "a": "Vehículos aéreos, marítimos o terrestres", "o": ["Monederos y certificados de devoluciones o recompensas", "Metales preciosos, piedras preciosas, joyas y relojes", "Obras de arte", "Vehículos aéreos, marítimos o terrestres"], "x": "Vehículos aéreos, marítimos o terrestres quedó en MEDIO. Los otros tres son exactamente los tres sectores de AV en ALTO.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1 · Tema 3.3.3"}, {"id": "E070", "tema": "enr23", "tipo": "caso", "q": "«Casa de Empeño Robledal» realiza la actividad vulnerable de mutuo, préstamos o créditos y actualiza su evaluación de riesgos. ¿Qué nivel tiene su sector en la matriz sectorial 2023?", "a": "Medio", "o": ["Bajo", "Alto", "Medio", "Medio-Bajo"], "x": "Mutuo, préstamos o créditos quedó en MEDIO, junto con tarjetas prepagadas, vehículos, servidores públicos y fe pública. Ningún sector de AV quedó en BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV · Tema 3.3.3"}, {"id": "E071", "tema": "enr23", "tipo": "caso", "q": "El «Despacho Contable Arrieta» realiza la actividad vulnerable de servicios profesionales y quiere el nivel de su sector en la matriz sectorial 2023. ¿Cuál es?", "a": "Medio-Bajo", "o": ["Bajo", "Medio", "Medio-Alto", "Medio-Bajo"], "x": "Servicios profesionales quedó en MEDIO-BAJO, uno de los diez sectores de AV en ese nivel. Medio-Alto no existe en la matriz sectorial (es de la escala integral) y ningún sector de AV quedó en BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV · Tema 3.3.3"}, {"id": "E072", "tema": "enr23", "tipo": "caso", "q": "La plataforma ficticia «Criptonodo» realiza la actividad vulnerable de operaciones con activos virtuales. ¿En qué nivel quedó su sector en la matriz sectorial 2023?", "a": "Medio-Bajo", "o": ["Alto", "Medio", "Medio-Bajo", "Medio-Alto"], "x": "El sector de AV de activos virtuales quedó en MEDIO-BAJO. No lo confundas con el factor emergente «Debilidad regulatoria de los Activos Virtuales», cuyo riesgo integral es Medio (XI.7): son dos mediciones distintas.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1 · Tema 3.3.3"}, {"id": "E073", "tema": "enr23", "tipo": "caso", "q": "Un auditor revisa la cartera de un conglomerado ficticio y quiere listar los sectores del sistema financiero en BAJO. ¿Qué lista es correcta?", "a": "Afores, Seguros, Fianzas y Asesores de inversión", "o": ["Afores, Seguros, Fianzas y Asesores de inversión", "Seguros, Fianzas, Almacenes generales de depósito y Afores", "Afores, SOFI, Uniones de crédito y Asesores de inversión", "Afores, Seguros, Fianzas y SODAFI"], "x": "Los cuatro del SF en BAJO son Afores, Seguros, Fianzas y Asesores de inversión. SODAFI, SOFI, Uniones de crédito y Almacenes generales de depósito quedaron en MEDIO-BAJO.", "ref": "IV.1, tabla de riesgo de LD del SF; XI.1 · Tema 3.3.3"}, {"id": "E074", "tema": "enr23", "tipo": "cifra", "q": "¿Cuántos sectores de actividades vulnerables quedaron en BAJO en la matriz sectorial 2023?", "a": "Ninguno", "o": ["Cuatro", "Ninguno", "Dos", "Diez"], "x": "Ningún sector de AV quedó en BAJO: hay 3 en ALTO, 5 en MEDIO y 10 en MEDIO-BAJO (18 resultados). Cuatro es el número de sectores del SF en BAJO; diez es el de AV en MEDIO-BAJO.", "ref": "IV.2, tabla de riesgo de LD de AV · Tema 3.3.3"}, {"id": "E075", "tema": "enr23", "tipo": "cifra", "q": "¿Cuántos sectores del sistema financiero se evaluaron y cuántas matrices se aplicaron?", "a": "19 sectores y 23 matrices, por los 5 subsectores de la Banca Múltiple", "o": ["20 sectores y 18 matrices, sin Cheques de viajero ni Comercio exterior", "19 sectores y 19 matrices, una por cada sector del sistema financiero", "23 sectores y 19 matrices, por los 5 subsectores de la Banca Múltiple", "19 sectores y 23 matrices, por los 5 subsectores de la Banca Múltiple"], "x": "El SF tiene 19 sectores, pero la Banca Múltiple se subdivide en 5 subsectores (G7, Cambiarios, Inversión, Comercial y Crédito a los hogares), así que se aplicaron 23 matrices. 20 sectores y 18 matrices es el caso de las AV.", "ref": "IV, nota 6; IV.1, nota 10 · Tema 3.3.3"}, {"id": "E076", "tema": "enr23", "tipo": "cifra", "q": "En la evaluación sectorial de quienes realizan actividades vulnerables, ¿cuántos sectores hay y cuántas matrices se aplicaron?", "a": "20 sectores y 18 matrices", "o": ["19 sectores y 23 matrices", "18 sectores y 20 matrices", "20 sectores y 20 matrices", "20 sectores y 18 matrices"], "x": "Son 20 sectores de AV, pero sólo 18 matrices: Cheques de viajero y Comercio exterior no fueron susceptibles de aplicarles la matriz. 19 y 23 son las cifras del SF.", "ref": "IV, nota 7; IV.2, nota 15 · Tema 3.3.3"}, {"id": "E077", "tema": "enr23", "tipo": "memoria", "q": "¿Por qué no se aplicó la matriz sectorial al sector de Cheques de viajero?", "a": "No hay registros de su emisión y comercialización habitual o profesional", "o": ["No hay registros de su emisión y comercialización habitual o profesional", "Porque la LFPIORPI lo excluyó del catálogo de actividades vulnerables", "Porque el sector ya se evalúa dentro de la Banca Múltiple-Cambiarios", "Porque sus avisos se presentan con el pedimento que se transmite electrónicamente al SAT"], "x": "Para Cheques de viajero no existen registros de emisión y comercialización habitual o profesional. El pedimento transmitido al SAT es la razón de Comercio exterior (agente o apoderado aduanal), el otro sector de AV sin matriz.", "ref": "IV, nota 7 · Tema 3.3.3"}, {"id": "E078", "tema": "enr23", "tipo": "caso", "q": "Para explicar la matriz sectorial, un instructor pone el ejemplo de un sector hipotético con 85 % de calificación. ¿Qué nivel de riesgo le corresponde?", "a": "Medio", "o": ["Medio-Bajo", "Medio-Alto", "Alto", "Medio"], "x": "La matriz sectorial clasifica: 0–50 Bajo, 51–80 Medio-Bajo, 81–90 Medio y 91–100 Alto. Con 85 % es Medio. Medio-Alto no existe en esta escala.", "ref": "IV · Tema 3.3.3"}, {"id": "E079", "tema": "enr23", "tipo": "trampa", "q": "En la matriz sectorial, ¿qué rango de calificación corresponde al nivel Medio-Bajo?", "a": "De 51 a 80 %", "o": ["De 51 a 80 %", "De 5 a 7 puntos", "De 0 a 50 %", "De 81 a 90 %"], "x": "Medio-Bajo va de 51 a 80 %. De 81 a 90 % es Medio y de 0 a 50 % es Bajo. De 5 a 7 es Medio-Alto, pero en la escala integral de 0 a 9 (XI.7), no en la sectorial.", "ref": "IV · Tema 3.3.3"}, {"id": "E080", "tema": "enr23", "tipo": "caso", "q": "La oficial de cumplimiento de una ITF ficticia, «Kuali Pagos», necesita el nivel de su sector en la matriz sectorial 2023 del sistema financiero. ¿Cuál es?", "a": "Medio", "o": ["Medio-Bajo", "Bajo", "Alto", "Medio"], "x": "ITF/Fintech quedó en MEDIO en la matriz del SF. No lo mezcles con el factor «Debilidad regulatoria de las ITF», vulnerabilidad de LD en Medio/Medio de facilitación y explotación (VII.25): son mediciones distintas.", "ref": "IV.1, tabla de riesgo de LD del SF · Tema 3.3.3"}, {"id": "E081", "tema": "enr23", "tipo": "caso", "q": "La «Unión de Crédito Sierra Alta», entidad ficticia, revisa la ENR para su evaluación de riesgos. ¿Qué nivel tiene el sector de uniones de crédito en la matriz sectorial 2023?", "a": "Medio-Bajo", "o": ["Alto", "Medio", "Medio-Bajo", "Bajo"], "x": "Uniones de crédito quedó en MEDIO-BAJO, con SOFI, Almacenes generales de depósito, SOFOMES no reguladas y SODAFI.", "ref": "IV.1, tabla de riesgo de LD del SF · Tema 3.3.3"}, {"id": "E082", "tema": "enr23", "tipo": "caso", "q": "Un grupo financiero ficticio tiene cuatro filiales. Según la matriz sectorial 2023, ¿cuál de ellas pertenece a un sector en nivel MEDIO?", "a": "Casas de bolsa", "o": ["SOFI", "Almacenes generales de depósito", "Casas de bolsa", "Afores"], "x": "Casas de bolsa quedó en MEDIO. Afores quedó en BAJO; SOFI y Almacenes generales de depósito, en MEDIO-BAJO.", "ref": "IV.1, tabla de riesgo de LD del SF · Tema 3.3.3"}, {"id": "E083", "tema": "enr23", "tipo": "memoria", "q": "¿Qué información usó la matriz de riesgo sectorial del sistema financiero?", "a": "ROR, ROI y ROIP de 2019 al primer semestre de 2022", "o": ["ROR, ROI y ROIP de 2019 al primer semestre de 2022", "Sólo los Cuestionarios de Percepción de Riesgos aplicados en 2022", "ROR, ROI y ROIP de 2016 a 2020, tomados de la ENR anterior", "Avisos de actividades vulnerables de 2019 al primer semestre de 2022"], "x": "La matriz del SF analizó ROR, ROI y ROIP del periodo 2019 al primer semestre de 2022, junto con factores aportados por la UIF y los supervisores, los Informes de Calidad Sectorial y los Cuestionarios de Percepción de Riesgos. Los avisos son el insumo de la matriz de AV.", "ref": "IV.1 · Tema 3.3.3"}, {"id": "E084", "tema": "enr23", "tipo": "memoria", "q": "¿Qué tipos de factores considera la matriz para evaluar el riesgo de cada sector?", "a": "Los que reflejan el riesgo inherente, los que lo intensifican y los que lo mitigan", "o": ["Los que reflejan el riesgo inherente, los que lo intensifican y los que lo mitigan", "Clientes y usuarios, productos y servicios, zona geográfica y canales, sin mitigantes", "Amenazas, vulnerabilidades y consecuencias sociales del sector", "Grado de impacto, probabilidad de ocurrencia y concentración del negocio del sector"], "x": "El apartado IV enumera tres tipos: los que reflejan el riesgo inherente del sector, los que lo intensifican y los que lo mitigan. Impacto/ocurrencia es el binomio de las amenazas en el análisis de factores, no la matriz sectorial.", "ref": "IV · Tema 3.3.3"}, {"id": "E085", "tema": "enr23", "tipo": "caso", "q": "«Puntos Lealtad Ocotlán», empresa ficticia, emite monederos y certificados de devoluciones o recompensas. ¿Qué nivel tiene su sector en la matriz sectorial 2023?", "a": "Alto", "o": ["Medio-Alto", "Alto", "Medio-Bajo", "Medio"], "x": "Monederos y certificados de devoluciones o recompensas es uno de los tres sectores de AV en ALTO, con Obras de arte y Metales preciosos, piedras preciosas, joyas y relojes.", "ref": "IV.2, tabla de riesgo de LD de AV; XI.1 · Tema 3.3.3"}, {"id": "E086", "tema": "enr23", "tipo": "caso", "q": "En una clase sobre los actores del régimen, la instructora pide nombrar a las autoridades supervisoras. ¿Qué lista es correcta?", "a": "CNBV, CNSF, CONSAR y SAT", "o": ["CNBV, CNSF, CONSAR y UIF", "SHCP, BANXICO, UIF y CNBV", "CNBV, CNSF, CONSAR y SAT", "CNBV, SAT, FGR y CONSAR"], "x": "Las supervisoras son CNBV, CNSF, CONSAR y SAT; vigilan e inspeccionan que los SO cumplan. SHCP (con UBD, UBVA, USPSS y UIF) y BANXICO son reguladoras; la UIF recibe y analiza reportes; la FGR investiga y persigue delitos. BANXICO supervisa además los riesgos adicionales en sistemas de pagos.", "ref": "III · Tema 3.3.3"}, {"id": "E087", "tema": "enr23", "tipo": "caso", "q": "Un instructor describe a una autoridad que recibe reportes y avisos de los SO, analiza la información, disemina productos de inteligencia y, en su caso, presenta denuncias. ¿Cuál es?", "a": "Unidad de Inteligencia Financiera", "o": ["Comisión Nacional Bancaria y de Valores", "Fiscalía General de la República", "Servicio de Administración Tributaria", "Unidad de Inteligencia Financiera"], "x": "Esas son las funciones de la UIF en el régimen. La CNBV y el SAT supervisan el cumplimiento de los SO; la FGR investiga y persigue los delitos de LD/FT.", "ref": "III · Tema 3.3.3"}, {"id": "E088", "tema": "enr23", "tipo": "cifra", "q": "Al 30 de junio de 2022, ¿cuántos sujetos obligados tenía el régimen PLD/CFT?", "a": "3,549 del SF y 107,642 que realizan AV", "o": ["2,886 del SF y 6,307 que realizan AV", "107,642 del SF y 3,549 que realizan AV", "3,549 del SF y 107,642 que realizan AV", "3,549 del SF y 70,083 que realizan AV"], "x": "Eran 3,549 integrantes del SF y 107,642 sujetos que realizan AV. 2,886 (2,873 en la tabla de IV.1) y 6,307 son los Cuestionarios de Percepción de Riesgos aplicados; 70,083 eran los SO de AV registrados en 2018.", "ref": "III; IV.1; IV.2; IV.3 · Tema 3.3.3"}, {"id": "E089", "tema": "enr23", "tipo": "memoria", "q": "¿Cuál es la finalidad del Plan de Acción Preliminar de la ENR 2023?", "a": "Encaminar recursos a lo que requiere más atención y generar medidas intensificadas o simplificadas según el riesgo", "o": ["Sustituir las DCG vigentes por un régimen único de PLD/CFT para el SF y para quienes realizan actividades vulnerables", "Sancionar a los sujetos obligados de los sectores que quedaron en ALTO en la matriz sectorial de riesgos", "Reclasificar los 37 factores para la siguiente ENR conforme a la Guía CNBV de 2019 para la metodología de las entidades", "Encaminar recursos a lo que requiere más atención y generar medidas intensificadas o simplificadas según el riesgo"], "x": "El apartado XII plantea propuestas preliminares de prevención y mitigación por factor, para encaminar la reasignación de recursos hacia lo que requiere mayor atención y generar las medidas intensificadas y simplificadas que correspondan según su nivel de riesgo.", "ref": "XII · Tema 3.3.3"}, {"id": "E090", "tema": "enr23", "tipo": "caso", "q": "El plan de acción propone modificar las DCG del artículo 60 de la Ley Orgánica de la Financiera Nacional de Desarrollo Agropecuario, Rural, Forestal y Pesquero, sin actualizar desde el 2 de abril de 2015. ¿A qué factor atiende esa propuesta?", "a": "Debilidad en el Marco Jurídico del SF", "o": ["Deficiente información sobre el Beneficiario Final", "Debilidad en el Marco Jurídico del SF", "Debilidad en el Marco Jurídico de AV", "Debilidad del sistema Supervisor y Sancionador"], "x": "El apartado XII la presenta como propuesta para el fortalecimiento del Marco Jurídico del SF. Las DCG son normativa financiera; el Marco Jurídico de AV se refiere a la LFPIORPI y su reforma pendiente.", "ref": "XII; VI.2 · Tema 3.3.3"}, {"id": "anticor-C001", "tema": "anticor", "tipo": "memoria", "q": "Según el Objeto de la Guía Anticorrupción, ¿qué fuerza jurídica tiene frente a los Sujetos Supervisados?", "a": "No tiene efectos vinculantes y su grado de adopción no será objeto de sanción por parte de la CNBV", "o": ["No tiene efectos vinculantes y su grado de adopción no será objeto de sanción por parte de la CNBV", "Es obligatoria para todos los Sujetos Supervisados y su incumplimiento se sanciona conforme a las Disposiciones", "Es vinculante sólo para las instituciones de crédito y meramente orientadora para el resto de los Sujetos Supervisados", "Se vuelve vinculante a partir de que el Sujeto Supervisado la incorpora a su Manual de Cumplimiento interno"], "x": "La Guía declara expresamente que no tendrá efectos vinculantes y que su grado de adopción no será objeto de sanción. El distractor más tentador es pensar que se vuelve obligatoria al incorporarla al Manual: la Guía no prevé ese efecto. Fundamento: Objeto de la Guía.", "ref": "Objeto · Tema 3.3.4"}, {"id": "anticor-C002", "tema": "anticor", "tipo": "caso", "q": "El oficial de cumplimiento de Sofom Arrayán decide no aplicar las medidas de mitigación que describe la Guía y, en su lugar, documenta medidas propias distintas para sus Clientes PEP nacionales. Conforme a la Guía, ¿cómo se valora esa decisión?", "a": "Es válida: las medidas de la Guía son enunciativas y no exhaustivas, y podrán adoptarse otras distintas", "o": ["Es inválida: la Guía amplía las obligaciones de las Disposiciones y exige adoptar todas sus medidas", "Sólo es válida si obtiene autorización previa de la CNBV para apartarse de las medidas que la Guía describe", "Es válida: las medidas de la Guía son enunciativas y no exhaustivas, y podrán adoptarse otras distintas", "Es inválida: debe adoptar al menos las medidas del Apartado II.1 para evitar una sanción de la CNBV"], "x": "El Objeto dice que las medidas de mitigación son de carácter enunciativo y no exhaustivo, y que los Sujetos Supervisados podrán adoptar cualquiera de ellas o tomar medidas distintas. No existe autorización previa ni sanción por apartarse de ellas, porque la Guía no establece obligaciones más allá de las Disposiciones. Fundamento: Objeto de la Guía.", "ref": "Objeto · Tema 3.3.4"}, {"id": "anticor-C003", "tema": "anticor", "tipo": "caso", "q": "Al analizar una alerta de la diputada local Ana, Cliente de Banco Alcázar, el analista localiza una nota periodística sobre irregularidades en la dependencia donde ella trabaja. Según el preámbulo del Apartado III, ¿qué papel tiene esa búsqueda en Fuentes Abiertas?", "a": "Es un factor importante que aporta información adicional para decidir si procede o no emitir el Reporte de Operaciones Inusuales", "o": ["Sólo puede usarse si la nota periodística menciona a la diputada por su nombre, y no cuando se refiere sólo a la dependencia", "Basta por sí sola para emitir el Reporte de Operaciones Inusuales, sin necesidad de analizar las operaciones de la diputada ni su perfil", "Es un factor importante que aporta información adicional para decidir si procede o no emitir el Reporte de Operaciones Inusuales", "No debe considerarse, porque la Guía limita el análisis de las alertas a la información transaccional que el Cliente genera"], "x": "El preámbulo del III califica la búsqueda en Fuentes Abiertas como un factor de Riesgo importante, que puede ser información adicional para determinar la procedencia de emitir o no el Reporte de Operaciones Inusuales. Entre los ejemplos incluye notas que mencionen a la persona, a sus relacionados o a la Dependencia, Entidad u Órgano Público para la que trabaja. Fundamento: Apdo. III, preámbulo.", "ref": "Apdo. III, preámbulo · Tema 3.3.4"}, {"id": "anticor-C004", "tema": "anticor", "tipo": "caso", "q": "En el análisis de una posible Operación Inusual de un Cliente PEP nacional sólo se identificó un factor de los que enumera la Guía. El analista concluye: «con un solo factor no puede haber inusualidad». Según la Guía, ¿es correcta su conclusión?", "a": "No: aunque pueden requerirse varios factores, en algunos casos un solo factor puede ser indicativo de una inusualidad", "o": ["Sí: la Guía exige que concurran al menos dos factores del Apartado III para considerar que existe una Operación Inusual", "Sí: la Guía exige al menos tres factores, y además que provengan de distintos grupos del Apartado III de la Guía", "No: cualquier factor de la lista obliga, en todos los casos y sin más análisis, a emitir el Reporte de Operaciones Inusuales", "No: aunque pueden requerirse varios factores, en algunos casos un solo factor puede ser indicativo de una inusualidad"], "x": "El preámbulo del III dice que es posible que se tengan que presentar varios factores para crear un escenario inusual, pero que en algunos casos, según las circunstancias específicas, uno solo puede ser indicativo de una inusualidad. No fija un mínimo, y tampoco convierte un factor aislado en reporte automático: usa «puede». Fundamento: Apdo. III, preámbulo.", "ref": "Apdo. III, preámbulo · Tema 3.3.4"}, {"id": "anticor-C005", "tema": "anticor", "tipo": "memoria", "q": "Según el preámbulo del Apartado III, ¿cómo se relaciona la lista de factores de la Guía con los factores de Riesgo que ya usa cada Sujeto Supervisado?", "a": "No es exhaustiva y solo complementa los factores de Riesgo habituales de cada Sujeto Supervisado", "o": ["No es exhaustiva y solo complementa los factores de Riesgo habituales de cada Sujeto Supervisado", "Es una lista cerrada que no admite factores adicionales a los que enumera el Apartado III de la Guía", "Sustituye a los factores habituales, que deben ajustarse a la lista de la Guía en la siguiente revisión", "Prevalece sobre los factores habituales siempre que el Cliente analizado sea una PEP nacional"], "x": "La Guía aclara que su lista de factores no es exhaustiva y solo complementa los factores habituales de cada Sujeto Supervisado; además advierte que los métodos de LD por corrupción cambian y con ellos sus indicadores. No sustituye ni prevalece sobre la matriz propia de la entidad. Fundamento: Apdo. III, preámbulo.", "ref": "Apdo. III, preámbulo · Tema 3.3.4"}, {"id": "anticor-C006", "tema": "anticor", "tipo": "caso", "q": "Caja Popular Huizache opera en una región fronteriza y ha detectado un patrón de operación local, ligado a PEP nacionales de la zona, que no aparece en la lista de la Guía. ¿Qué dice la Guía sobre considerarlo?", "a": "Puede haber otros factores igual de importantes, propios de la zona geográfica donde opere la PEP nacional o Persona Vulnerable", "o": ["Puede haber otros factores igual de importantes, propios de la zona geográfica donde opere la PEP nacional o Persona Vulnerable", "Sólo puede considerarse si lo documenta antes algún organismo internacional en la materia, como el GAFI o el Grupo Egmont", "Sólo pueden usarse los factores enumerados en el Apartado III, porque la Guía los fija de manera limitativa para todo el país", "Sólo puede considerarse si la UIF lo publica antes como tipología o la Secretaría lo da a conocer como Dato a los Sujetos Supervisados"], "x": "El preámbulo del III reconoce que puede haber otros factores que deberían considerarse igualmente importantes, propios de la zona geográfica donde opere la PEP nacional o Persona Vulnerable. La lista es abierta y complementaria, así que no exige publicación previa de la UIF ni respaldo de un organismo internacional. Fundamento: Apdo. III, preámbulo.", "ref": "Apdo. III, preámbulo · Tema 3.3.4"}, {"id": "anticor-C007", "tema": "anticor", "tipo": "memoria", "q": "Según el propio III.4, ¿de dónde provienen sus factores?", "a": "De Fuentes Abiertas relacionadas con varios casos recientes de corrupción en México", "o": ["De Fuentes Abiertas relacionadas con varios casos recientes de corrupción en México", "De documentos elaborados por organismos internacionales en la materia, como el GAFI", "De las tipologías que la UIF publica periódicamente sobre lavado de dinero y corrupción", "De las observaciones que la CNBV formuló en sus visitas de inspección a Sujetos Supervisados"], "x": "El III.4 dice que sus factores derivan de información encontrada en Fuentes Abiertas relacionada con varios casos recientes de corrupción en México. El preámbulo del Apartado III atribuye a organismos internacionales el compendio en general, pero el III.4 es el único que precisa su propio origen. Fundamento: Apdo. III.4.", "ref": "Apdo. III.4 · Tema 3.3.4"}, {"id": "anticor-C008", "tema": "anticor", "tipo": "caso", "q": "El modelo de Grado de Riesgo de Banco Alcázar asigna en automático «alto Riesgo» a todo Cliente que sea PEP nacional, sin considerar nada más. ¿Cómo se valora ese criterio a la luz del Apartado II de la Guía?", "a": "No se ajusta: la PEP nacional se clasifica por sus características inherentes y transaccionales, no per se", "o": ["Se ajusta: la Guía ordena clasificar a toda PEP nacional como de alto Riesgo, por la amenaza que señala la ENR", "No se ajusta: la Guía ordena clasificar a toda PEP nacional en Riesgo medio hasta que se analicen sus operaciones", "Se ajusta mientras la PEP siga en funciones; al dejar el cargo la Guía ordena reclasificarla como de bajo Riesgo", "No se ajusta: la PEP nacional se clasifica por sus características inherentes y transaccionales, no per se"], "x": "El Apartado II pide tomar en cuenta las características inherentes y transaccionales de la PEP nacional de manera individual, de modo que no sea clasificada per se como de alto ni de bajo Riesgo. Que la ENR considere la corrupción una amenaza importante no vuelve automático el alto Riesgo. Fundamento: Apdo. II.", "ref": "Apdo. II · Tema 3.3.4"}, {"id": "anticor-C009", "tema": "anticor", "tipo": "caso", "q": "Banco Alcázar inicia relación comercial con un ministro en funciones de otro país. ¿En qué Grado de Riesgo debe clasificarlo y qué norma lo establece?", "a": "Grado de Riesgo alto, al estar entre los Clientes que la DCG Bancos, 28ª, considera al menos de alto riesgo", "o": ["Grado de Riesgo alto, por disposición del Apartado II de la Guía Anticorrupción", "Grado de Riesgo alto, al estar entre los Clientes que la DCG Bancos, 28ª, considera al menos de alto riesgo", "Una evaluación individual sin presumir alto ni bajo Riesgo, igual que a una PEP nacional, según la Guía", "Grado de Riesgo medio, mientras no se analice su perfil transaccional, conforme a la Definición XIII de la Guía"], "x": "La 28ª de las DCG Bancos incluye a las Personas Políticamente Expuestas extranjeras entre los Clientes que, al menos, se consideran de Grado de Riesgo alto. La Guía no lo dice: su regla del «no per se» es para PEP nacionales y Personas Vulnerables. Fundamento: DCG Bancos, 28ª.", "ref": "DCG Bancos, 28ª · Tema 3.3.4"}, {"id": "anticor-C010", "tema": "anticor", "tipo": "caso", "q": "Al analizar una posible Operación Inusual de la senadora Lucía, Cliente PEP nacional de Banco Alcázar, se identifica que Rodrigo, otro Cliente del banco que no es PEP, recibe de ella transferencias recurrentes. ¿Qué figura de la Guía describe a Rodrigo?", "a": "Persona Vulnerable", "o": ["Cliente de bajo Riesgo per se", "PEP nacional por asociación", "Persona Vulnerable", "PEP extranjera"], "x": "La Definición XIV llama Personas Vulnerables a los Clientes o Usuarios que no son PEP, pero que pueden representar un Riesgo de LD relacionado con la corrupción por los vínculos financieros identificados en una posible Operación Inusual con un Cliente PEP nacional. La Guía no crea una «PEP por asociación»; quien no es PEP y tiene ese vínculo es Persona Vulnerable. Fundamento: Def. XIV.", "ref": "Def. XIV · Tema 3.3.4"}, {"id": "anticor-C011", "tema": "anticor", "tipo": "memoria", "q": "Según la Definición XIV, ¿qué caracteriza a una Persona Vulnerable?", "a": "No es PEP, pero puede representar Riesgo de LD por sus vínculos financieros con un Cliente PEP nacional en una posible Operación Inusual", "o": ["Es una PEP nacional que dejó el cargo hace menos de un año y que todavía conserva vínculos políticos con la dependencia en la que laboró", "Es familiar en primer grado de una PEP nacional o extranjera, aunque no tenga ninguna operación ni vínculo financiero alguno con ella", "Es un Cliente en situación económica precaria que, precisamente por esa razón, puede ser utilizado como prestanombres por una PEP nacional", "No es PEP, pero puede representar Riesgo de LD por sus vínculos financieros con un Cliente PEP nacional en una posible Operación Inusual"], "x": "La Definición XIV describe a Clientes o Usuarios que no son clasificados como PEP, pero que pueden representar un Riesgo de LD relacionado con la corrupción por los vínculos financieros identificados en una posible Operación Inusual con un Cliente o Usuario PEP nacional. El criterio es el vínculo financiero, no el parentesco ni la situación económica. Fundamento: Def. XIV.", "ref": "Def. XIV · Tema 3.3.4"}, {"id": "anticor-C012", "tema": "anticor", "tipo": "caso", "q": "Casa de Bolsa Ébano recibe como Cliente a un exgobernador que dejó el cargo hace varios años. ¿Encaja en la definición de PEP de la Guía?", "a": "Sí: la definición incluye a quien desempeña o ha desempeñado funciones públicas destacadas", "o": ["Sólo si la Secretaría lo incluye en los Datos que da a conocer a los Sujetos Supervisados sobre las PEP", "Sí: la definición incluye a quien desempeña o ha desempeñado funciones públicas destacadas", "No: la definición sólo comprende a quien ejerce funciones públicas destacadas al momento de la operación", "No: la definición sólo comprende a jefes de estado o de gobierno, y no a los titulares de gobiernos estatales"], "x": "La Definición XIII considera PEP a quien desempeña o ha desempeñado funciones públicas destacadas, en el extranjero o en territorio nacional, y su lista de ejemplos es abierta («entre otros»). Los Datos de la Secretaría ayudan a identificarlas en lo individual, pero no son condición para que alguien sea PEP. Fundamento: Def. XIII. Ojo: la respuesta vale sólo para la definición de la Guía. Las DCG (2ª, fr. XXXI) sólo siguen considerando PEP nacional a quien dejó el encargo durante el año siguiente a aquel en que lo dejó. Un exgobernador que salió hace varios años ya no se catalogaría como PEP nacional conforme a las DCG.", "ref": "Def. XIII · Tema 3.3.4"}, {"id": "anticor-C013", "tema": "anticor", "tipo": "caso", "q": "Casa de Bolsa Ébano decide adoptar medidas de mitigación adicionales para sus Clientes PEP nacionales y Personas Vulnerables, como pedir la declaración patrimonial más reciente. Según el Apartado II, ¿dónde debe quedar documentada esa decisión?", "a": "En su Manual de Cumplimiento, como lo indica el Apartado II", "o": ["En el informe anual del área de auditoría interna", "En su Manual de Cumplimiento, como lo indica el Apartado II", "En el expediente de identificación de cada Cliente PEP", "En un aviso dirigido a la CNBV antes de aplicarlas"], "x": "El Apartado II dice que la decisión de adoptar medidas de mitigación adicionales para PEP nacionales o Personas Vulnerables debe estar documentada en el Manual de Cumplimiento. La Guía no prevé avisos previos a la CNBV para ello. Fundamento: Apdo. II.", "ref": "Apdo. II · Tema 3.3.4"}, {"id": "anticor-C014", "tema": "anticor", "tipo": "memoria", "q": "Según el Apartado II, ¿en qué tipo de corrupción debe centrarse el enfoque de identificación y gestión de Riesgos de las PEP nacionales y Personas Vulnerables?", "a": "En la «corrupción a gran escala», con delitos como el cohecho, el peculado y el enriquecimiento ilícito", "o": ["En la corrupción política, entendida sólo como delitos electorales cometidos durante las campañas", "En los actos de corrupción menores que cometen servidores públicos de bajo y mediano rango en trámites cotidianos", "En la «corrupción a gran escala», con delitos como el cohecho, el peculado y el enriquecimiento ilícito", "En los delitos fiscales que cometen las personas morales que son proveedoras del Estado o de los municipios"], "x": "El Apartado II pide centrar el enfoque en la «corrupción a gran escala» y menciona como algunos de sus delitos el cohecho, el tráfico de influencia, el peculado, el enriquecimiento ilícito y el financiamiento ilícito. Los actos menores de servidores de bajo rango no son el foco que fija la Guía. Fundamento: Apdo. II.", "ref": "Apdo. II · Tema 3.3.4"}, {"id": "anticor-C015", "tema": "anticor", "tipo": "caso", "q": "El senador Tomás invierte en Casa de Bolsa Ébano a través de Inversiones Cedro, S.A., cuyas acciones pertenecen a otra sociedad, que a su vez es propiedad de un fideicomiso extranjero, y éste de una cuarta sociedad. No entrega ninguna opinión profesional que explique el fundamento legal o económico de la estructura. ¿Qué grupo de factores se actualiza?", "a": "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Una estructura de varios niveles, con vehículos en el extranjero y sin opinión profesional que la justifique, sirve para que el nombre de la PEP no aparezca: es el primer factor del III.1. No es III.4, porque no hay recursos públicos ni una red de fachadas con dueños, notarios o domicilios coincidentes. Fundamento: Apdo. III.1, factor de vehículos corporativos.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C016", "tema": "anticor", "tipo": "caso", "q": "Un abogado litigante abre a su nombre, como persona física, una cuenta de inversión en Banco Alcázar y la opera con recursos de un secretario de Estado, aunque nunca había administrado patrimonio de clientes. Todo indica que se usa para que el nombre del secretario no aparezca. ¿Qué factor se actualiza?", "a": "Uso de intermediarios que no concuerda con las prácticas comerciales normales", "o": ["Numerosas empresas fachada en las que coinciden dueños, notarios, domicilios y empleados", "Uso de vehículos corporativos sin una justificación comercial válida", "Uso de intermediarios que no concuerda con las prácticas comerciales normales", "Uso de familiares, asociados cercanos o empleados como Propietarios Reales"], "x": "El III.1 señala el uso de intermediarios cuando no concuerda con las prácticas comerciales normales o parece usarse para proteger la identidad de la PEP; con frecuencia son profesionales de servicios financieros y legales («gatekeepers»). No es un vehículo corporativo creado para la PEP ni un familiar como Propietario Real: es un tercero profesional interpuesto. Fundamento: Apdo. III.1, factor de intermediarios.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C017", "tema": "anticor", "tipo": "cifra", "q": "En el III.1, ¿qué número de niveles de estructuración corporativa, sin una opinión profesional que justifique un fundamento legal o económico subyacente, vuelve particularmente relevante un esquema?", "a": "Más de tres niveles", "o": ["Tres o más niveles", "Más de cinco niveles", "Más de tres niveles", "Más de dos niveles"], "x": "El III.1 habla de esquemas con más de tres niveles de estructuración corporativa que no pueden proporcionar una opinión profesional que justifique un fundamento legal o económico subyacente. «Tres o más» no es lo mismo: tres niveles todavía no rebasan el umbral del texto. Fundamento: Apdo. III.1, factor de vehículos corporativos.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C018", "tema": "anticor", "tipo": "caso", "q": "En una cuenta de Banco Alcázar que recibe depósitos cuantiosos, el chofer de una magistrada figura como Propietario Real, aunque quien da las instrucciones sobre los recursos es la propia magistrada. ¿Qué grupo de factores se actualiza?", "a": "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "Poner a un empleado como Propietario Real para que no aparezca la PEP es un factor del III.1: uso de miembros de la familia, asociados cercanos o empleados como Propietarios Reales. No es III.2, porque el detalle decisivo no es una conducta de la PEP ante el banco sino quién aparece en su lugar. Fundamento: Apdo. III.1.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C019", "tema": "anticor", "tipo": "memoria", "q": "¿En qué grupo de factores menciona la Guía a los profesionales especializados en servicios financieros y legales conocidos como «gatekeepers»?", "a": "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "o": ["III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Los «gatekeepers» aparecen en el III.1 como ejemplo de intermediarios que pueden usarse para proteger la identidad de la PEP. El III.4 menciona notarios y comisarios, pero como coincidencias dentro de la red de empresas fachada, no como «gatekeepers». Fundamento: Apdo. III.1, factor de intermediarios.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C020", "tema": "anticor", "tipo": "memoria", "q": "En el III.1, los mandatos sin representación se mencionan, junto con las personas morales y los Fideicomisos, como ejemplo de:", "a": "Vehículos corporativos", "o": ["Empresas fachada de la red", "Propietarios Reales interpuestos", "Vehículos corporativos", "Intermediarios o «gatekeepers»"], "x": "El III.1 define los vehículos corporativos como personas morales, mandatos sin representación y Fideicomisos, cuyo uso sin justificación comercial válida es indicativo de ocultamiento. Los «gatekeepers» son otro factor del mismo apartado: profesionales que actúan como intermediarios. Fundamento: Apdo. III.1, factor de vehículos corporativos.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C021", "tema": "anticor", "tipo": "caso", "q": "La hermana de un presidente municipal aparece como Propietaria Real de una sociedad que abrió cuenta en Banco Alcázar; los ejecutivos saben que quien decide sobre los recursos es el presidente municipal y que ella nunca interviene. ¿Qué grupo de factores se actualiza?", "a": "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "La familia usada como Propietario Real para ocultar a la PEP es factor del III.1. La familia aparece también en el III.2 (familiar que de repente emprende o por quien se compra y revende) y en el III.4 (varios familiares manejan los recursos), pero aquí el detalle decisivo es que figura como Propietaria Real en lugar de la PEP. Fundamento: Apdo. III.1.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C022", "tema": "anticor", "tipo": "caso", "q": "Banco Alcázar revisa cuatro esquemas corporativos vinculados con PEP nacionales. Según el III.1, ¿cuál es particularmente relevante?", "a": "Un esquema que contiene empresas ubicadas en una o varias jurisdicciones extranjeras", "o": ["Un fideicomiso de administración constituido en México con justificación comercial documentada", "Una persona moral de un solo nivel con actividad comercial verificada y Propietario Real identificado", "Un esquema de dos niveles, todo en México, que cuenta con una opinión legal que lo justifica", "Un esquema que contiene empresas ubicadas en una o varias jurisdicciones extranjeras"], "x": "El III.1 dice que es particularmente relevante el esquema que contiene empresas o esquemas corporativos ubicados en una o varias jurisdicciones extranjeras, y/o el que tiene más de tres niveles sin opinión profesional que lo justifique. Los demás esquemas tienen justificación o una estructura simple. Fundamento: Apdo. III.1, factor de vehículos corporativos.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C023", "tema": "anticor", "tipo": "trampa", "q": "Según el III.1, ¿cuál de los siguientes NO es un ejemplo de vehículo corporativo?", "a": "Intermediarios profesionales en servicios financieros y legales («gatekeepers»)", "o": ["Mandatos sin representación sin una justificación comercial válida", "Intermediarios profesionales en servicios financieros y legales («gatekeepers»)", "Fideicomisos con esquemas ubicados en jurisdicciones extranjeras", "Personas morales con esquemas corporativos de varios niveles"], "x": "El III.1 enumera como vehículos corporativos a las personas morales, los mandatos sin representación y los Fideicomisos. Los «gatekeepers» pertenecen a otro factor del mismo apartado: el uso de intermediarios. Fundamento: Apdo. III.1.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C024", "tema": "anticor", "tipo": "caso", "q": "El compadre de una secretaria de Estado figura como accionista único y Propietario Real de una empresa que recibe los recursos de la funcionaria; ella da todas las instrucciones y él sólo firma. ¿Qué factor se actualiza?", "a": "Uso de familiares, asociados cercanos o empleados como Propietarios Reales", "o": ["Uso de familiares, asociados cercanos o empleados como Propietarios Reales", "Cliente o allegado que de repente ejerce actividades económicas a las que era ajeno", "Uso de intermediarios que no concuerda con las prácticas comerciales normales", "Involucramiento de varios familiares para el manejo de los recursos en cuentas bancarias"], "x": "Un asociado cercano que aparece como Propietario Real para que la PEP no figure actualiza el tercer factor del III.1. No es el factor del III.2 del allegado que de repente emprende, porque el compadre no opera un negocio propio: sólo presta su nombre. Fundamento: Apdo. III.1, factor de Propietarios Reales.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C025", "tema": "anticor", "tipo": "memoria", "q": "Según el III.1, ¿por qué las PEP pueden intentar ocultar su identidad?", "a": "Porque saben que su estado como PEP puede facilitar la detección de algún eventual comportamiento ilícito", "o": ["Porque saben que su estado como PEP puede facilitar la detección de algún eventual comportamiento ilícito", "Porque la Guía obliga a reportar como inusual cualquier operación de un Cliente que sea PEP nacional", "Porque las Disposiciones les impiden abrir cuentas a su nombre mientras se encuentren en funciones", "Porque su declaración patrimonial es pública y en ella aparecen todas sus cuentas e inversiones bancarias"], "x": "El III.1 abre con esa premisa: las PEP saben que su estado como PEP puede facilitar la detección de algún eventual comportamiento ilícito, por lo que pueden intentar ocultar su identidad. Ni las Disposiciones les prohíben tener cuentas ni la Guía convierte en reportable cualquier operación de una PEP. Fundamento: Apdo. III.1.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C026", "tema": "anticor", "tipo": "caso", "q": "Un despacho contable abre a su nombre una cuenta en Casa de Bolsa Ébano para invertir, dice, recursos de «un cliente reservado», que resulta ser el titular de una secretaría estatal. El despacho no acostumbra manejar recursos de terceros. ¿Qué grupo de factores se actualiza?", "a": "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección"], "x": "Interponer a un profesional para que la PEP no aparezca, fuera de las prácticas comerciales normales, es el factor de intermediarios del III.1. No es III.3, porque los recursos no salen de una cuenta a nombre de la dependencia, ni III.4, porque no hay una red de empresas fachada. Fundamento: Apdo. III.1, factor de intermediarios.", "ref": "Apdo. III.1 · Tema 3.3.4"}, {"id": "anticor-C027", "tema": "anticor", "tipo": "caso", "q": "Cada quincena, el Congreso local deposita su sueldo a la diputada Ana en Banco Alcázar; ella lo pasa íntegro a un fondo de inversión y la cuenta no registra pago de gasto alguno. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "Que el sueldo pagado por la dependencia se deje o se transfiera en su totalidad, sin usarse para gasto alguno, es un factor del III.2. No es III.3: la cuenta es personal de la diputada, no de la dependencia que paga la nómina. Fundamento: Apdo. III.2, factor del sueldo intacto.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C028", "tema": "anticor", "tipo": "caso", "q": "Un juez federal, Cliente de Banco Alcázar, recibe su nómina del Poder Judicial y la mantiene completa en la cuenta: en dos años no ha pagado con ella ni un servicio, ni una compra, ni un retiro. ¿Qué factor se actualiza?", "a": "Sueldos dejados o transferidos en su totalidad sin pagar gasto alguno", "o": ["Incremento injustificado de los ingresos y patrimonio del Cliente o Usuario", "Transferencias repetidas hacia y desde países con los que no parece estar relacionado", "Sueldos dejados o transferidos en su totalidad sin pagar gasto alguno", "Alto índice de uso de efectivo en las cuentas del Cliente sin justificación aparente"], "x": "El III.2 señala como factor que los fondos recibidos por sueldos y salarios de la dependencia se dejen en su totalidad en la cuenta de depósito, o se transfieran en su totalidad a inversión, sin pagar gasto alguno. No es un incremento injustificado de patrimonio: el ingreso sí está justificado; lo atípico es que no lo use para vivir. Fundamento: Apdo. III.2, factor del sueldo intacto.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C029", "tema": "anticor", "tipo": "caso", "q": "En redes sociales, un regidor, Cliente PEP nacional con un sueldo modesto, publica viajes en primera clase, relojes de lujo y autos deportivos; el cambio empezó hace un año. ¿Qué factor se actualiza?", "a": "Estilo de vida, o cambios repentinos en este, no acorde con su salario", "o": ["Estilo de vida, o cambios repentinos en este, no acorde con su salario", "Adquiere bienes, directamente o por terceros, y los vuelve a negociar en corto plazo", "Realiza consultas sobre la política PLD/FT de la institución o la aplicable a las PEP", "Busca un Sujeto Supervisado que normalmente no atendería a Clientes de alto nivel patrimonial"], "x": "El III.2 incluye el estilo de vida del Cliente, o los cambios repentinos en él, no acorde con su salario, y pone como ejemplo el consumo de bienes de lujo. Las redes sociales son justo la Fuente Abierta que el preámbulo menciona para detectar bienes fuera del alcance de la persona. Fundamento: Apdo. III.2, factor del estilo de vida.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C030", "tema": "anticor", "tipo": "caso", "q": "El hermano de un presidente municipal, Cliente PEP nacional de Banco Alcázar, que hasta el año pasado era empleado de una papelería, ahora opera él mismo una distribuidora de maquinaria agrícola y abrió cuenta empresarial en Banco Alcázar. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.4 · Factores identificados en casos recientes de corrupción en México", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables"], "x": "El familiar que de repente ejerce, directamente o por terceros, actividades económicas a las que era ajeno es un factor del III.2. No es III.1: el hermano no figura como Propietario Real para ocultar a la PEP; es él quien emprende un negocio nuevo y ajeno a su trayectoria. Fundamento: Apdo. III.2, factor del familiar que emprende de repente.", "ref": "Apdo. III.2 · Tema 3.3.4"}, {"id": "anticor-C031", "tema": "anticor", "tipo": "caso", "q": "Al actualizar su expediente, un subsecretario pregunta a su ejecutivo de Banco Alcázar qué controles aplica el banco a las PEP y a partir de qué montos revisa las operaciones. ¿Qué grupo de factores se actualiza?", "a": "III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "o": ["III.2 · Comportamiento atípico de PEP nacionales y Personas Vulnerables", "III.3 · Comportamiento atípico de cuentas a nombre de entes públicos", "III.1 · Ocultamiento de identidad de la PEP para evitar la detección", "III.4 · Factores identificados en
