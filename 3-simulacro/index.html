 es un proceso continuo, no un ejercicio de una sola vez, y que su revisión corre con independencia de la auditoría anual. El distractor que da por satisfecha la revisión de la metodología con la sola auditoría anual es el más tentador porque la auditoría sí es un mitigante y sí aporta insumos, pero no absorbe ni sustituye la obligación de revisar y actualizar la metodología. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III · Tema 3.3.1"}, {"id": "M058", "tema": "metriesgo", "tipo": "caso", "q": "Banco Zafiro del Bajío se fusionó con otra institución y absorbió una cartera de Clientes de mayor Riesgo. ¿Qué ejemplo de la Guía CNBV se actualiza?", "a": "Un cambio que obliga a revisar y, en su caso, actualizar la metodología para identificar los cambios en el grado de exposición al Riesgo.", "o": ["Un supuesto que permite diferir la revisión de la metodología hasta veinticuatro meses después de que surta efectos la fusión entre ambas instituciones.", "Un cambio que obliga a revisar y, en su caso, actualizar la metodología para identificar los cambios en el grado de exposición al Riesgo.", "Un supuesto que obliga únicamente a reclasificar por Grado de Riesgo a los Clientes absorbidos, sin efecto alguno sobre la metodología de la entidad.", "Un supuesto que obliga a suspender la aplicación de la metodología hasta que la Comisión autorice el nuevo perfil de Riesgo resultante de la operación."], "x": "La Guía enumera entre los cambios que disparan la revisión las fusiones, adquisiciones o escisiones, así como la apertura o cierre de cuentas de Clientes de mayor Riesgo. El distractor que limita el efecto de la fusión a reclasificar por Grado de Riesgo a los Clientes absorbidos es el más tentador porque esa reclasificación también procede, pero se queda en el modelo de Clientes y deja intacta la metodología de la entidad, que es justo lo que debe revisarse. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III · Tema 3.3.1"}, {"id": "M059", "tema": "metriesgo", "tipo": "caso", "q": "El Oficial de Cumplimiento de Banco Tesalia propone dar seguimiento al Riesgo sólo a nivel de la entidad en su conjunto. ¿Qué establece la Guía CNBV para el monitoreo?", "a": "Que debe darse seguimiento al Riesgo por cada indicador y al consolidado por elemento de Riesgo, evaluando la efectividad de los controles.", "o": ["Que debe darse seguimiento al Riesgo de cada Cliente clasificado con Grado de Riesgo alto y al consolidado de la cartera del periodo evaluado.", "Que debe darse seguimiento a cada indicador únicamente cuando el auditor externo hubiere formulado observaciones sobre el elemento al que pertenece.", "Que debe darse seguimiento al Riesgo por cada indicador y al consolidado por elemento de Riesgo, evaluando la efectividad de los controles.", "Que debe darse seguimiento únicamente al Riesgo consolidado de la entidad, porque ese es el resultado que se presenta al consejo de administración."], "x": "El monitoreo que describe la Guía es granular: seguimiento del Riesgo por cada indicador y del consolidado por elemento, además de evaluar la efectividad de criterios, medidas, políticas y procedimientos. El distractor que ubica el monitoreo en el Riesgo de cada Cliente y el consolidado de la cartera es el más tentador porque también habla de seguimiento y de consolidado, pero se mueve al terreno del riesgo de cada Cliente, que corresponde a otro ejercicio. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III · Tema 3.3.1"}, {"id": "M060", "tema": "metriesgo", "tipo": "caso", "q": "Banco Ribera quiere reforzar el monitoreo de su metodología. ¿Qué tipo de señales de alerta debe establecer conforme a la Guía CNBV?", "a": "Señales de alerta descriptiva y prospectiva que indiquen potenciales fuentes de Riesgo.", "o": ["Señales de alerta automatizadas que bloqueen la operación cuando el Cliente sea clasificado con el Grado de Riesgo más alto de la escala definida.", "Señales de alerta exclusivamente retrospectivas, construidas con las operaciones inusuales reportadas durante el periodo que se hubiere evaluado.", "Señales de alerta que la Comisión dé a conocer por los medios electrónicos que establezca para cada sector de sujetos supervisados del sistema financiero.", "Señales de alerta descriptiva y prospectiva que indiquen potenciales fuentes de Riesgo."], "x": "La Guía pide señales de alerta descriptiva y prospectiva, es decir, que además de describir lo ocurrido anticipen fuentes potenciales de Riesgo; el monitoreo se realiza mediante actividades permanentes, evaluaciones independientes o una combinación de ambas. El distractor que reduce las señales de alerta a lo exclusivamente retrospectivo es el más tentador porque las alertas suelen construirse con historia, pero quedarse en lo retrospectivo elimina justamente la mitad prospectiva que la Guía exige. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III · Tema 3.3.1"}, {"id": "M061", "tema": "metriesgo", "tipo": "trampa", "q": "¿Qué relación guarda la metodología de evaluación de Riesgos con el modelo de clasificación de Clientes por Grado de Riesgo?", "a": "La clasificación debe ser coherente con los resultados de la metodología, pero la metodología debe ser distinta e independiente de ese modelo.", "o": ["La clasificación debe ser coherente con los resultados de la metodología, pero la metodología debe ser distinta e independiente de ese modelo.", "La metodología debe derivarse del modelo de clasificación de Clientes, ya que el Riesgo de la entidad es la suma de los Grados de Riesgo de su cartera.", "La metodología y el modelo de clasificación de Clientes son el mismo ejercicio, por lo que basta documentar uno de ellos para acreditar el cumplimiento de ambos.", "La clasificación de Clientes sustituye a la metodología cuando la entidad acredita que su modelo cumple con lo previsto en el Anexo 3 de las Disposiciones."], "x": "Las dos cosas son verdaderas a la vez: la 25ª Bis exige que el modelo de Clientes sea coherente con la metodología del Capítulo II Bis, y la Guía exige que la metodología sea distinta e independiente de ese modelo. La primera mide el Riesgo de la entidad; el segundo, el de cada Cliente en lo particular. El distractor que hace derivar la metodología del modelo de clasificación de Clientes es el más tentador porque la coherencia sugiere derivación, pero coherencia no es dependencia. Fundamento: Guía CNBV, apartado C, fase III, y 25ª Bis.", "ref": "Guía CNBV, C, fase III · Tema 3.3.1"}, {"id": "M062", "tema": "metriesgo", "tipo": "caso", "q": "Banco Vega Marina obtuvo resultados que ubican con Riesgo alto a uno de sus canales, pero mantiene para él los mismos controles que para el resto. ¿Qué regla se incumple?", "a": "La de dar cumplimiento a todas las obligaciones de las Disposiciones en concordancia con los resultados que generen sus metodologías.", "o": ["La de asegurarse de que no existan inconsistencias entre la información incorporada a la metodología y la que obre en sus sistemas automatizados.", "La de dar cumplimiento a todas las obligaciones de las Disposiciones en concordancia con los resultados que generen sus metodologías.", "La de someter la metodología y los resultados de su implementación a la aprobación del comité de riesgos, a propuesta del Comité de la entidad.", "La de conservar durante un plazo no menor a cinco años la información generada con motivo del Capítulo II Bis de las Disposiciones aplicables a la entidad."], "x": "La 21ª-5 cierra el Capítulo con una regla de congruencia: todas las obligaciones de las Disposiciones deben cumplirse en concordancia con los resultados de la metodología, de modo que un canal calificado con Riesgo alto exige controles diferenciados. El distractor que describe la obligación de consistencia de los datos con los sistemas automatizados es el más tentador porque también es una obligación de la implementación, pero se refiere a la calidad de los datos de entrada, no al uso de los resultados. Fundamento: 21ª-5.", "ref": "21ª-5 · Tema 3.3.1"}, {"id": "M063", "tema": "metriesgo", "tipo": "cifra", "q": "Cuando la Comisión requiere a la entidad las revisiones y actualizaciones de su metodología, ¿en qué plazo deben proporcionarse?", "a": "Dentro del plazo que la propia Comisión establezca.", "o": ["Dentro de los doce meses siguientes a la fecha en que la entidad cuente con los resultados de la implementación de su metodología.", "Dentro de los quince días hábiles siguientes a la fecha en que se notifique el requerimiento respectivo a la entidad de que se trate.", "Dentro del plazo que la propia Comisión establezca.", "Dentro de los treinta días naturales siguientes al cierre del ejercicio social en que se hubieren practicado las revisiones correspondientes."], "x": "La norma no fija un número: la información se proporciona dentro del plazo que la propia Comisión establezca en el requerimiento. El distractor que fija quince días hábiles desde la notificación del requerimiento es el más tentador porque ese plazo es habitual en otros ámbitos administrativos, pero el Capítulo II Bis remite al plazo que fije la autoridad caso por caso. Fundamento: 21ª-4, primer y último párrafos.", "ref": "21ª-4 · Tema 3.3.1"}, {"id": "M064", "tema": "metriesgo", "tipo": "caso", "q": "Casa de Bolsa Meridiano implementó su metodología usando únicamente el número de Clientes de los últimos dieciocho meses. ¿Qué le falta?", "a": "Utilizar también el número de operaciones y el monto operado del periodo, que no podrá ser menor a doce meses.", "o": ["Incorporar el número de reportes de operaciones inusuales y el monto de las sanciones impuestas durante el mismo periodo de dieciocho meses.", "Nada, porque el número de Clientes es el único dato que la norma exige para implementar la metodología de evaluación de Riesgos de la entidad.", "Reducir el periodo a doce meses exactos, ya que la norma no permite utilizar información de un periodo mayor al señalado en las Disposiciones.", "Utilizar también el número de operaciones y el monto operado del periodo, que no podrá ser menor a doce meses."], "x": "La fracción II exige tres datos en conjunto —número de Clientes, número de operaciones y monto operado— por un periodo no menor a doce meses; dieciocho meses es válido porque el plazo es un piso. El distractor que obliga a reducir el periodo a doce meses exactos es el más tentador porque parece corregir un exceso, pero confunde el mínimo con un máximo. Fundamento: 21ª-3, fr. II.", "ref": "21ª-3, fr. II · Tema 3.3.1"}, {"id": "M065", "tema": "metriesgo", "tipo": "cifra", "q": "¿Cuál es el plazo máximo para revisar y actualizar el cumplimiento y los resultados del Capítulo II Bis, contado desde que se cuenta con los resultados de la implementación?", "a": "Doce meses.", "o": ["Doce meses.", "Veinticuatro meses.", "Cinco años, que es el mismo plazo previsto para la conservación de la información generada.", "Seis meses."], "x": "La 21ª-4 fija doce meses como plazo máximo, sin perjuicio de que la revisión se adelante si se detectan nuevos Riesgos o si se actualiza la evaluación nacional de riesgos. El distractor de los cinco años es el más tentador porque sí es un plazo real del mismo artículo, pero corresponde a la conservación de la información, no a la revisión. Fundamento: 21ª-4, primer párrafo.", "ref": "21ª-4, 1er párr. · Tema 3.3.1"}, {"id": "M066", "tema": "metriesgo", "tipo": "caso", "q": "La Secretaría da a conocer, por conducto de la Comisión, una actualización de la evaluación nacional de riesgos. Banco Almadía implementó su metodología hace cuatro meses. ¿Qué procede?", "a": "Debe revisar y, en su caso, actualizar su metodología, porque la actualización de la evaluación nacional de riesgos es uno de los supuestos que lo exigen.", "o": ["No procede nada, porque el plazo de doce meses desde los resultados de su implementación aún no ha transcurrido y ese es el único supuesto de revisión.", "Debe revisar y, en su caso, actualizar su metodología, porque la actualización de la evaluación nacional de riesgos es uno de los supuestos que lo exigen.", "Debe esperar a que la Comisión le ordene expresamente la modificación de su metodología o de sus mitigantes antes de realizar cualquier actualización.", "Debe reclasificar por Grado de Riesgo a la totalidad de sus Clientes dentro de los seis meses siguientes a la publicación de la actualización referida."], "x": "Los tres supuestos de la 21ª-4 son alternativos: basta que se actualice la evaluación nacional de riesgos para que nazca el deber de revisar, aunque no hayan transcurrido los doce meses. El distractor que descarta cualquier obligación porque el plazo de doce meses aún no vence es el más tentador porque ese plazo es el supuesto más recordado, pero leerlo como el único convierte una alternativa en una condición. Fundamento: 21ª-4, primer párrafo.", "ref": "21ª-4, 1er párr. · Tema 3.3.1"}, {"id": "M067", "tema": "metriesgo", "tipo": "cifra", "q": "¿Cuáles son los datos mínimos del periodo que la entidad debe utilizar al implementar su metodología?", "a": "El total del número de Clientes, el número de operaciones y el monto operado.", "o": ["El número de operaciones inusuales reportadas, el número de Clientes de Grado de Riesgo alto y el monto operado por cada uno de los canales de distribución.", "El monto operado, el número de operaciones y el porcentaje de concentración del negocio por cada uno de los cuatro elementos de Riesgo definidos.", "El total del número de Clientes, el número de operaciones y el monto operado.", "El total del número de Clientes y de Usuarios, el número de contratos celebrados y el número de sucursales en operación durante el periodo evaluado."], "x": "Son tres datos y la fracción II los fija como piso —«al menos»—: total del número de Clientes, número de operaciones y monto operado; la entidad puede incorporar más información, nunca menos. El distractor que añade el porcentaje de concentración del negocio por elemento es el más tentador porque acierta en dos de los tres datos, pero ese porcentaje pertenece a la medición del impacto y no a la información mínima de entrada. Fundamento: 21ª-3, fr. II.", "ref": "21ª-3, fr. II · Tema 3.3.1"}, {"id": "M068", "tema": "metriesgo", "tipo": "caso", "q": "El Comité de Sofipo Caja Alondra pide al área de cumplimiento un producto que muestre cómo ha evolucionado el Riesgo y si los controles están funcionando. ¿Qué prevé la Guía CNBV?", "a": "El desarrollo de informes sobre la evolución del Riesgo y la eficiencia y eficacia de los controles implementados.", "o": ["La elaboración de un nuevo diseño de la metodología cada vez que el Comité solicite conocer la evolución del Riesgo y la efectividad de los controles internos.", "La presentación de un dictamen del auditor externo independiente sobre la evolución del Riesgo de la entidad y sobre la suficiencia de los mitigantes implementados.", "La remisión a la Comisión de un reporte trimestral con la evolución del Riesgo por indicador y por elemento, dentro del plazo que la propia Comisión establezca.", "El desarrollo de informes sobre la evolución del Riesgo y la eficiencia y eficacia de los controles implementados."], "x": "El monitoreo permite desarrollar informes que establezcan la evolución del Riesgo y la eficiencia y eficacia de los criterios, medidas, políticas y procedimientos implementados, así como realizar las adecuaciones necesarias. El distractor que exige un dictamen del auditor externo sobre la evolución del Riesgo es el más tentador porque la auditoría aporta una visión global, pero el informe de evolución nace del monitoreo interno y no requiere dictamen externo. Fundamento: Guía CNBV, apartado C, fase III.", "ref": "Guía CNBV, C, fase III · Tema 3.3.1"}, {"id": "M069", "tema": "metriesgo", "tipo": "memoria", "q": "¿Dónde podrán estar contenidos el diseño de la metodología y los procesos para su uso y validación?", "a": "Podrán estar contenidos en un documento diferente al Manual de Cumplimiento.", "o": ["Podrán estar contenidos en un documento diferente al Manual de Cumplimiento.", "Deberán estar contenidos en el documento que describa el modelo de evaluación de Riesgos de Clientes a que se refiere el Anexo 3 de las Disposiciones.", "Podrán estar en cualquier documento, siempre que este se registre previamente ante la Comisión por los medios electrónicos que esta establezca.", "Deberán estar contenidos invariablemente en el Manual de Cumplimiento, en un apartado específico aprobado por el consejo de administración de la entidad."], "x": "La Guía usa un modal potestativo: el diseño y los procesos de uso y validación «podrán» estar en un documento distinto al Manual de Cumplimiento, dada la actualización periódica de la metodología. El distractor que exige registrar previamente el documento ante la Comisión es el más tentador porque conserva el «podrán», pero le agrega ese registro previo, que no existe. Fundamento: Guía CNBV, apartado E, y 21ª-1, segundo párrafo.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "M070", "tema": "metriesgo", "tipo": "cifra", "q": "¿Por cuánto tiempo debe conservarse la información generada con motivo del Capítulo II Bis?", "a": "Por un plazo no menor a cinco años.", "o": ["Por un plazo no menor a doce meses contados a partir de que se cuente con los resultados de la implementación de la metodología.", "Por un plazo no menor a cinco años.", "Por un plazo no mayor a cinco años, transcurridos los cuales la información deberá destruirse de forma segura por la propia entidad.", "Por un plazo no menor a diez años contados a partir de la fecha de la última implementación de la metodología de evaluación."], "x": "La conservación es de al menos cinco años, y la información debe proporcionarse a la Secretaría y a la Comisión a requerimiento de esta última. El distractor que convierte los cinco años en plazo máximo, tras el cual habría que destruir la información, es el más tentador porque repite el número correcto e invierte el modal: «no menor» fija un piso, «no mayor» ordenaría destruir, que es lo contrario de lo que pide la norma. Fundamento: 21ª-4, último párrafo, y Guía CNBV, apartado E.", "ref": "21ª-4, último párr. · Tema 3.3.1"}, {"id": "M071", "tema": "metriesgo", "tipo": "caso", "q": "La Comisión requiere a Banco del Sauce la información generada por su metodología de hace tres años. El banco responde que ya la depuró. ¿Qué exige la norma?", "a": "Conservar esa información por un plazo no menor a cinco años y proporcionarla a la Secretaría y a la Comisión, a requerimiento de esta última.", "o": ["Conservar la información únicamente mientras la metodología se encuentre vigente y entregar a la Comisión un resumen ejecutivo de los resultados obtenidos.", "Conservar la información por un plazo no menor a diez años y presentarla anualmente a la Secretaría junto con el dictamen del auditor externo independiente.", "Conservar esa información por un plazo no menor a cinco años y proporcionarla a la Secretaría y a la Comisión, a requerimiento de esta última.", "Conservar la información por doce meses y, transcurrido ese plazo, entregarla al comité de riesgos para su archivo definitivo dentro de la propia entidad."], "x": "El plazo de conservación es de al menos cinco años y abarca toda la información generada para el diseño, la implementación y la valoración; depurarla antes incumple la 21ª-4. El distractor que ata la conservación a la vigencia de la metodología es el más tentador porque ese criterio es razonable en archivo, pero ajeno a la norma, que fija un plazo cierto. Fundamento: 21ª-4, último párrafo.", "ref": "21ª-4, último párr. · Tema 3.3.1"}, {"id": "M072", "tema": "metriesgo", "tipo": "memoria", "q": "¿Qué debe considerar la documentación del diseño de la metodología de evaluación de Riesgos?", "a": "La descripción de todos los procesos de identificación, medición y mitigación, incluidos sus detalles operativos, las modificaciones realizadas y las áreas responsables.", "o": ["La descripción de los Grados de Riesgo en que la entidad clasifica a sus Clientes y Usuarios, así como los procesos de uso y validación del modelo del Anexo 3.", "Únicamente la descripción del método de medición seleccionado y de los pesos asignados a cada indicador y a cada elemento, por tratarse de la parte cuantitativa del ejercicio.", "Únicamente los resultados de la implementación y las modificaciones al Manual de Cumplimiento, ya que el diseño se acredita con el propio Manual aprobado por el consejo.", "La descripción de todos los procesos de identificación, medición y mitigación, incluidos sus detalles operativos, las modificaciones realizadas y las áreas responsables."], "x": "La documentación debe describir todos los procesos de identificación, medición y mitigación con sus detalles operativos, y además documentar las modificaciones realizadas, las áreas responsables de realizarlas y las áreas involucradas en su operación, incluidas las de control interno. El distractor que reduce la documentación a la descripción del método de medición y los pesos es el más tentador porque esa parte es la más visible del documento, pero dejaría fuera identificación y mitigación. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "M073", "tema": "metriesgo", "tipo": "memoria", "q": "¿Qué debe probar la documentación de la metodología de evaluación de Riesgos?", "a": "Que contiene los elementos suficientes para acreditar el cumplimiento de los requisitos mínimos del diseño, conforme a las Disposiciones y a la propia Guía.", "o": ["Que contiene los elementos suficientes para acreditar el cumplimiento de los requisitos mínimos del diseño, conforme a las Disposiciones y a la propia Guía.", "Que la metodología fue aprobada por el consejo de administración de la entidad dentro de los doce meses siguientes a su última modificación relevante.", "Que la entidad obtuvo una calificación de Riesgo dentro de los niveles de tolerancia aceptables definidos en su propio Manual de Cumplimiento vigente.", "Que el modelo de evaluación de Riesgos de Clientes de la entidad cumple con lo señalado en el Anexo 3 de las Disposiciones que le resulten aplicables."], "x": "La Guía pide que la documentación contenga elementos suficientes para probar el cumplimiento de los requisitos mínimos del diseño, en términos de las Disposiciones y de la propia Guía. El distractor que describe el documento probatorio del modelo de Clientes del Anexo 3 es el más tentador porque ese documento sí existe, pero se rige por la 25ª Bis, no por el Capítulo II Bis. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "M074", "tema": "metriesgo", "tipo": "caso", "q": "En Banco Cendal, el director de operaciones presentó la metodología directamente al consejo de administración. ¿Cuál es el circuito que prevé la Guía CNBV?", "a": "El Oficial de Cumplimiento somete la metodología a la aprobación del Comité, y el Comité presenta al consejo los resultados de su implementación.", "o": ["El comité de riesgos aprueba la metodología a propuesta del Comité, y el Oficial de Cumplimiento informa al consejo de administración los resultados alcanzados.", "El Oficial de Cumplimiento somete la metodología a la aprobación del Comité, y el Comité presenta al consejo los resultados de su implementación.", "El auditor externo somete la metodología a la aprobación del comité de riesgos, y este informa al consejo de administración los resultados de la implementación.", "El Comité somete la metodología a la aprobación del consejo de administración, y el Oficial de Cumplimiento presenta al comité de riesgos los resultados obtenidos."], "x": "El circuito tiene dos escalones: el Oficial de Cumplimiento somete al Comité la metodología y los resultados de su implementación, y el Comité presenta al consejo de administración, directivo o administrador único los resultados de esa implementación. El distractor que hace aprobar la metodología al comité de riesgos, a propuesta del Comité, es el más tentador porque toma prestado el circuito del modelo de Clientes del Anexo 3; pero incluso ahí quien informa al consejo es el propio comité de riesgos, no el Oficial de Cumplimiento (25ª Bis). Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "M075", "tema": "metriesgo", "tipo": "trampa", "q": "¿Cuál de las siguientes afirmaciones sobre los circuitos de aprobación NO es correcta?", "a": "La metodología de evaluación de Riesgos de la entidad debe ser aprobada por el comité de riesgos a propuesta del Comité.", "o": ["El Comité deberá presentar al consejo de administración, directivo o administrador único los resultados de la implementación de la metodología.", "El Oficial de Cumplimiento deberá someter la metodología de evaluación de Riesgos a la aprobación del Comité, así como los resultados de su implementación.", "La metodología de evaluación de Riesgos de la entidad debe ser aprobada por el comité de riesgos a propuesta del Comité.", "El modelo de evaluación de Riesgos de Clientes deberá ser aprobado por el comité de riesgos de la entidad con base en la propuesta que haga su Comité."], "x": "Son dos circuitos distintos que el examen suele cruzar: la metodología institucional la aprueba el Comité a propuesta del Oficial de Cumplimiento; el modelo de Clientes lo aprueba el comité de riesgos a propuesta del Comité, con aviso al consejo. Atribuir al comité de riesgos la aprobación de la metodología es la confusión más frecuente. Fundamento: Guía CNBV, apartado E, y 25ª Bis.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "M076", "tema": "metriesgo", "tipo": "cifra", "q": "¿En qué periodo debe ocurrir que el Oficial de Cumplimiento someta la metodología al Comité y que el Comité presente los resultados al consejo?", "a": "En un periodo menor a doce meses a partir de la fecha de la última modificación a la metodología.", "o": ["En un periodo menor a seis meses a partir de la fecha de la última modificación a la metodología de evaluación de Riesgos de la entidad.", "En un periodo no mayor a veinticuatro meses a partir de la fecha en que se hubiere actualizado la evaluación nacional de riesgos aplicable.", "En un periodo menor a doce meses a partir de la fecha en que se hubiere obtenido el primer resultado de la implementación de la metodología.", "En un periodo menor a doce meses a partir de la fecha de la última modificación a la metodología."], "x": "La Guía ancla este periodo en la fecha de la última modificación a la metodología, no en la fecha de los resultados. El distractor que cuenta los doce meses desde el primer resultado de la implementación es el más tentador porque conserva los doce meses y cambia sólo el punto de partida, que es exactamente donde se juega la pregunta: otros plazos del Capítulo sí corren desde los resultados de la implementación. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "M077", "tema": "metriesgo", "tipo": "memoria", "q": "¿Qué prevé la Guía CNBV tratándose de entidades que cuentan con Representante en lugar de Oficial de Cumplimiento?", "a": "Que se ajustarán a lo que establezcan las Disposiciones aplicables.", "o": ["Que se ajustarán a lo que establezcan las Disposiciones aplicables.", "Que quedan exceptuadas de someter la metodología a aprobación, bastando que el Representante conserve la documentación por un plazo de cinco años.", "Que el Representante deberá someter la metodología directamente al consejo de administración, sin que intervenga órgano colegiado alguno de la entidad.", "Que deberán constituir un Comité con las mismas funciones dentro de los doce meses siguientes a la implementación de su metodología de evaluación."], "x": "La Guía no crea un circuito propio para los Representantes: remite a lo que establezcan las Disposiciones aplicables a cada sujeto supervisado. El distractor que hace al Representante someter la metodología directamente al consejo de administración es el más tentador porque, al no haber Comité, parece lógico; pero esa conclusión no está en la Guía, que se limita a remitir. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "M078", "tema": "metriesgo", "tipo": "caso", "q": "Banco Ribera pertenece al Grupo Financiero Cumbres, que integra también una casa de bolsa y una aseguradora. ¿Qué debe establecer el banco en el diseño de su metodología?", "a": "Cómo se tomarán en cuenta los resultados de la metodología que, en su caso, hayan implementado las demás entidades financieras que integren el grupo.", "o": ["Que remitirá sus resultados a la sociedad controladora para que esta consolide una sola calificación de Riesgo del grupo ante la Secretaría y la Comisión.", "Cómo se tomarán en cuenta los resultados de la metodología que, en su caso, hayan implementado las demás entidades financieras que integren el grupo.", "Que sus resultados sustituirán a los de las demás entidades del grupo cuando el banco represente más de la mitad de los activos totales del grupo financiero.", "Que adoptará íntegramente la metodología única del grupo financiero, aprobada por la sociedad controladora y aplicable a todas las entidades que lo integren."], "x": "La obligación es de método, no de resultado: en el diseño debe quedar descrito cómo se tomarán en cuenta los resultados de las metodologías que, en su caso, hayan implementado las demás entidades del grupo. El distractor que hace adoptar íntegramente una metodología única del grupo financiero es el más tentador porque suena eficiente, pero la norma preserva la metodología propia de cada entidad y sólo exige articularla con las demás. Fundamento: 21ª-1, tercer párrafo, y Guía CNBV, apartado D.", "ref": "21ª-1, 3er párr. · Tema 3.3.1"}, {"id": "M079", "tema": "metriesgo", "tipo": "trampa", "q": "Respecto de la coordinación y la estrategia para la mitigación del Riesgo a nivel grupo financiero, la Guía CNBV establece que:", "a": "Es recomendable que exista, sin que se trate de una obligación impuesta por la propia Guía.", "o": ["Es obligatoria y debe acreditarse ante la Comisión mediante un documento suscrito por la sociedad controladora del grupo financiero correspondiente.", "Es obligatoria para los grupos que integren una institución de crédito, y potestativa para los demás grupos financieros que operen en el país.", "Es recomendable que exista, sin que se trate de una obligación impuesta por la propia Guía.", "Está prohibida, porque cada entidad debe evaluar sus Riesgos de manera aislada y sin considerar los resultados obtenidos por las demás del grupo."], "x": "La Guía distingue con cuidado dos modales en el mismo apartado: es obligatorio establecer en el diseño cómo se toman en cuenta los resultados de las demás entidades del grupo, y es apenas «recomendable» que exista coordinación y estrategia a nivel grupo. El distractor que hace obligatoria y acreditable ante la Comisión la coordinación a nivel grupo es el más tentador porque convierte la recomendación en deber, que es el error que la pregunta busca. Fundamento: Guía CNBV, apartado D.", "ref": "Guía CNBV, apartado D · Tema 3.3.1"}, {"id": "M080", "tema": "metriesgo", "tipo": "memoria", "q": "Según la Guía CNBV, ¿qué permite la determinación de los Riesgos a nivel grupo financiero?", "a": "Identificar de manera óptima los Riesgos y las exposiciones por rubros de actividad comercial o categorías de productos, por separado y en conjunto.", "o": ["Reducir el plazo de conservación de la información generada por cada entidad, al concentrarse los expedientes en un solo domicilio del grupo financiero.", "Sustituir las evaluaciones individuales de cada entidad del grupo por una sola evaluación consolidada que apruebe la sociedad controladora respectiva.", "Trasladar la responsabilidad del cumplimiento normativo en la materia de cada entidad del grupo a la sociedad controladora y a su consejo de administración.", "Identificar de manera óptima los Riesgos y las exposiciones por rubros de actividad comercial o categorías de productos, por separado y en conjunto."], "x": "La evaluación a nivel grupo permite identificar de manera óptima los Riesgos y exposiciones dentro de rubros específicos de actividad comercial o categorías de productos, por separado y en conjunto, y que la alta dirección del grupo los comprenda y mitigue. El distractor que sustituye las evaluaciones individuales de cada entidad por una sola evaluación consolidada es el más tentador porque esa consolidación parece el paso natural, pero ninguna evaluación de grupo sustituye la de cada entidad. Fundamento: Guía CNBV, apartado D.", "ref": "Guía CNBV, apartado D · Tema 3.3.1"}, {"id": "M081", "tema": "metriesgo", "tipo": "cifra", "q": "Una entidad debe conservar la información del Capítulo II Bis y, además, revisar y actualizar sus obligaciones. ¿Qué par de cifras corresponde?", "a": "Conservación: no menor a cinco años; revisión y actualización: no mayor a doce meses.", "o": ["Conservación: no menor a cinco años; revisión y actualización: no mayor a doce meses.", "Conservación: no menor a cinco años; revisión y actualización: no mayor a seis meses desde los resultados obtenidos por la entidad.", "Conservación: no menor a doce meses; revisión y actualización: no mayor a cinco años desde la última modificación a la metodología.", "Conservación: no menor a diez años; revisión y actualización: no mayor a veinticuatro meses desde los resultados de la implementación."], "x": "Las dos cifras clave de la 21ª-4 son cinco años de conservación y doce meses para revisar y actualizar. El distractor que intercambia las dos cifras —doce meses de conservación y cinco años de revisión— es el más tentador porque usa los números correctos pero los intercambia, que es la forma más común en que se presenta esta pregunta en el examen. Fundamento: 21ª-4, primer y último párrafos.", "ref": "21ª-4 · Tema 3.3.1"}, {"id": "M082", "tema": "metriesgo", "tipo": "caso", "q": "Financiera Altamar forma parte de un grupo financiero en el que dos entidades aún no han implementado su propia metodología. ¿Qué debe hacer en el diseño de la suya?", "a": "Establecer cómo tomará en cuenta los resultados de las metodologías que, en su caso, hayan implementado las demás entidades del grupo.", "o": ["Solicitar a la Comisión una prórroga para diseñar su metodología hasta que las demás entidades del grupo concluyan la implementación de las suyas.", "Establecer cómo tomará en cuenta los resultados de las metodologías que, en su caso, hayan implementado las demás entidades del grupo.", "Abstenerse de considerar cualquier resultado del grupo hasta que la totalidad de las entidades que lo integran hayan implementado su propia metodología.", "Elaborar una metodología conjunta que sustituya la de las entidades del grupo que aún no cuenten con ella, previa aprobación de la sociedad controladora."], "x": "La expresión «en su caso» resuelve el problema: la obligación de Financiera Altamar es describir el mecanismo por el que incorporará los resultados que existan, sin quedar paralizada por las entidades que aún no implementan. El distractor que obliga a abstenerse de considerar cualquier resultado hasta que todo el grupo haya implementado su metodología es el más tentador porque parece prudente esperar, pero convierte una condición eventual en un requisito suspensivo. Fundamento: 21ª-1, tercer párrafo, y Guía CNBV, apartado D.", "ref": "21ª-1, 3er párr. · Tema 3.3.1"}, {"id": "M083", "tema": "metriesgo", "tipo": "memoria", "q": "Conforme a la 21ª-6, ¿quién elabora los lineamientos, guías o mejores prácticas para el mejor cumplimiento del Capítulo II Bis, y bajo qué condición?", "a": "La Comisión, previa opinión de la Secretaría, y se dan a conocer a través de los medios electrónicos que la misma establezca.", "o": ["La Secretaría, previa opinión de la Comisión, y se publican en el Diario Oficial de la Federación dentro de los sesenta días naturales siguientes a su emisión.", "El Grupo de Acción Financiera, y la Comisión los incorpora a las Disposiciones mediante resoluciones modificatorias publicadas en el Diario Oficial de la Federación.", "La Comisión, previa opinión de la Secretaría, y se dan a conocer a través de los medios electrónicos que la misma establezca.", "El comité de riesgos de cada entidad, con base en la propuesta que formule su Comité, y se informan al consejo de administración o directivo que corresponda."], "x": "La 21ª-6 es la habilitación legal de la propia Guía de 2019: la Comisión los elabora previa opinión de la Secretaría y los da a conocer por medios electrónicos. El distractor que invierte los papeles y hace elaborar los criterios a la Secretaría, previa opinión de la Comisión, es el más tentador porque ese es el error más común, y además añade una publicación en el Diario Oficial que la norma no exige para estos instrumentos. Fundamento: 21ª-6.", "ref": "21ª-6 · Tema 3.3.1"}, {"id": "M084", "tema": "metriesgo", "tipo": "caso", "q": "Banco Litoral documentó su metodología, pero no dejó constancia de quién realizó las modificaciones ni de qué áreas participan en su operación. ¿Qué falta conforme a la Guía CNBV?", "a": "Documentar las modificaciones realizadas y las áreas responsables de realizarlas, así como las áreas involucradas en su operación.", "o": ["Documentar la aprobación del comité de riesgos respecto de cada modificación, así como su comunicación al consejo de administración de la entidad.", "Documentar el nombre y la firma autógrafa de cada funcionario que hubiere intervenido en la elaboración del documento que describe el diseño de la metodología.", "Documentar el organigrama completo de la entidad y el presupuesto asignado al área de cumplimiento durante cada uno de los ejercicios que se hubieren revisado.", "Documentar las modificaciones realizadas y las áreas responsables de realizarlas, así como las áreas involucradas en su operación."], "x": "La Guía pide documentar las modificaciones, las áreas responsables de realizarlas y las áreas involucradas en la operación de la metodología, incluidas las estructuras internas y las de control interno. El distractor que exige el nombre y la firma autógrafa de cada funcionario es el más tentador porque parece la versión más exigente de lo mismo, pero la norma habla de áreas responsables, no de firmas autógrafas de personas. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "M085", "tema": "metriesgo", "tipo": "cifra", "q": "¿Respecto de qué fases y por cuánto tiempo debe conservarse toda la información generada de la metodología?", "a": "Del diseño, la implementación y la valoración, por un plazo no menor a cinco años.", "o": ["Del diseño, la implementación y la valoración, por un plazo no menor a cinco años.", "De todas las fases, por un plazo no mayor a cinco años, al término del cual la información deberá remitirse a la Comisión para su resguardo definitivo.", "Únicamente de la implementación y la valoración, por un plazo no menor a diez años contados desde la obtención de los resultados correspondientes.", "Del diseño y de la implementación, por un plazo no menor a doce meses contados a partir de la última modificación de la metodología de la entidad."], "x": "La Guía abarca las tres fases y fija un plazo de conservación no menor a cinco años. El distractor que fija un plazo no mayor a cinco años y una remisión automática a la Comisión es el más tentador porque acierta en las tres fases y en el número, pero cambia el modal y añade esa remisión, que no existe: la información se conserva y se proporciona a requerimiento. Fundamento: Guía CNBV, apartado E, y 21ª-4, último párrafo.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "M086", "tema": "metriesgo", "tipo": "caso", "q": "El Oficial de Cumplimiento de Banco Tesalia sometió al Comité el documento de diseño de la metodología, pero no los resultados de su implementación. ¿Qué observa la Guía CNBV?", "a": "Que debe someter a la aprobación del Comité tanto la metodología como los resultados de su implementación.", "o": ["Que es correcto, porque los resultados de la implementación sólo se presentan al consejo de administración, sin pasar por el Comité de la entidad.", "Que debe someter a la aprobación del Comité tanto la metodología como los resultados de su implementación.", "Que los resultados de la implementación deben remitirse directamente a la Comisión dentro del plazo que la propia Comisión establezca al efecto.", "Que los resultados de la implementación se someten al comité de riesgos y no al Comité, por tratarse de información de carácter cuantitativo de la entidad."], "x": "La Guía somete al Comité dos cosas, no una: la metodología y los resultados de su implementación; sólo después el Comité presenta al consejo esos resultados. El distractor que salta directo al consejo de administración sin pasar por el Comité es el más tentador porque el consejo sí recibe los resultados, pero los recibe del Comité y no en sustitución de la aprobación previa. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "M087", "tema": "metriesgo", "tipo": "memoria", "q": "¿Cuál es el objetivo declarado de la Guía CNBV de 6 de septiembre de 2019?", "a": "Señalar los criterios mínimos que los sujetos supervisados podrán considerar para un mejor cumplimiento de lo previsto en el Capítulo II Bis.", "o": ["Establecer la metodología obligatoria y uniforme que todos los sujetos supervisados deberán aplicar para evaluar sus Riesgos en materia de prevención de LD/FT.", "Sustituir lo previsto en el Capítulo II Bis de las Disposiciones en todo aquello que resulte incompatible con las mejores prácticas internacionales en la materia.", "Señalar los criterios mínimos que los sujetos supervisados podrán considerar para un mejor cumplimiento de lo previsto en el Capítulo II Bis.", "Definir los Grados de Riesgo en que los sujetos supervisados deberán clasificar a sus Clientes y Usuarios conforme al Anexo 3 de las Disposiciones aplicables."], "x": "La Guía se autodefine con un modal suave: señala criterios mínimos que los sujetos supervisados «podrán» considerar para un mejor cumplimiento del Capítulo II Bis o del Título Segundo, según corresponda. El distractor que hace de la Guía una metodología obligatoria y uniforme para todos los sujetos supervisados es el más tentador porque la Guía sí describe con detalle fases y procesos, pero no impone una metodología uniforme: la metodología la diseña cada entidad según su Contexto. Fundamento: Guía CNBV, apartado B.", "ref": "Guía CNBV, apartado B · Tema 3.3.1"}, {"id": "M088", "tema": "metriesgo", "tipo": "caso", "q": "Un auditor ajeno a Banco Vega Marina revisa el documento de la metodología y no logra entender cómo se calculó la calificación de un elemento de Riesgo. ¿Qué estándar documental se incumple?", "a": "El de dar claridad y detalle suficientes para que el personal de la entidad o un tercero comprenda el proceso y evalúe su idoneidad.", "o": ["El de conservar la información generada por el Capítulo II Bis durante un plazo no menor a cinco años y proporcionarla a requerimiento de la Comisión.", "El de incorporar el diseño de la metodología al Manual de Cumplimiento, ya que la norma no admite documentarlo en un instrumento distinto de ese manual.", "El de someter el documento a la aprobación del comité de riesgos de la entidad con base en la propuesta que al efecto formule su Comité de Comunicación.", "El de dar claridad y detalle suficientes para que el personal de la entidad o un tercero comprenda el proceso y evalúe su idoneidad."], "x": "La Guía fija un estándar de comprensibilidad orientado a un lector externo: la documentación debe permitir que el personal de la entidad o un tercero comprenda el proceso y evalúe su idoneidad. El distractor que describe la obligación de conservar la información por cinco años es el más tentador porque también es una obligación documental real, pero se refiere a la permanencia de la información, no a su claridad. Fundamento: Guía CNBV, apartado E.", "ref": "Guía CNBV, apartado E · Tema 3.3.1"}, {"id": "C001", "tema": "gradoriesgo", "tipo": "memoria", "q": "Conforme a la 25ª de las DCG Bancos, ¿en qué debe basarse la aplicación de la política de conocimiento del Cliente?", "a": "En el Grado de Riesgo que represente el Cliente", "o": ["En el Grado de Riesgo que represente el Cliente", "En el monto agregado de las operaciones en efectivo que el Cliente realice durante el ejercicio", "En el nivel de Riesgo global que la propia Entidad haya obtenido al implementar su metodología del Capítulo II Bis", "En la antigüedad de la relación comercial y en el número de productos que el Cliente tenga contratados"], "x": "La 25ª ordena que la política de conocimiento del Cliente se aplique con base en el Grado de Riesgo del Cliente: a mayor grado, más información sobre su actividad económica preponderante y supervisión transaccional más estricta. El distractor más tentador es el del Riesgo de la propia Entidad: ése es el ejercicio del Capítulo II Bis (21ª-1 y siguientes), que mide a la institución, no al Cliente. Fundamento: 25ª.", "ref": "25ª, 1er párr. · Tema 3.3.2"}, {"id": "C002", "tema": "gradoriesgo", "tipo": "memoria", "q": "¿Con qué instrumento deben contar las Entidades para determinar el Grado de Riesgo en que deba ubicarse a cada Cliente?", "a": "Con un modelo de evaluación de Riesgos coherente con la metodología del Capítulo II Bis", "o": ["Con un modelo de evaluación de Riesgos coherente con la metodología del Capítulo II Bis", "Con el catálogo de indicadores de Riesgo que la Comisión publique cada año en su portal electrónico", "Con la evaluación nacional de riesgos que la Secretaría dé a conocer por conducto de la Comisión", "Con el sistema de alertas de comportamiento transaccional a que se refiere la 25ª Quáter"], "x": "La 25ª Bis obliga a contar con un modelo de evaluación de Riesgos, coherente con la metodología del Capítulo II Bis, para identificar, medir y clasificar los Grados de Riesgo de los Clientes. El distractor del sistema de alertas es el más tentador porque también mira al Cliente, pero ése sirve para vigilar su comportamiento transaccional, no para clasificarlo. Fundamento: 25ª Bis, 1er párr.", "ref": "25ª Bis, 1er párr. · Tema 3.3.2"}, {"id": "C003", "tema": "gradoriesgo", "tipo": "memoria", "q": "¿Qué órgano debe aprobar el modelo de evaluación de Riesgos de los Clientes y con base en la propuesta de quién?", "a": "El comité de riesgos, con base en la propuesta de su Comité", "o": ["El comité de riesgos, con base en la propuesta de su Comité", "El Comité de Comunicación y Control, con base en la propuesta del Oficial de Cumplimiento", "El consejo de administración o directivo, con base en la propuesta del área de auditoría interna", "El director general de la Entidad, con base en la propuesta del comité de riesgos"], "x": "La 25ª Bis reparte tres papeles: el Comité propone, el comité de riesgos aprueba y el consejo de administración o directivo es informado por ese comité de riesgos. El distractor del consejo es el más tentador porque el consejo sí interviene, pero sólo para enterarse, no para aprobar. Fundamento: 25ª Bis, 1er párr.", "ref": "25ª Bis, 1er párr. · Tema 3.3.2"}, {"id": "C004", "tema": "gradoriesgo", "tipo": "caso", "q": "En Banco Ribera, el Comité de Comunicación y Control formuló la propuesta de un nuevo modelo de evaluación de Riesgos de Clientes. ¿Cuál es la secuencia correcta que sigue?", "a": "Lo aprueba el comité de riesgos, que lo informa al consejo", "o": ["Lo aprueba el comité de riesgos, que lo informa al consejo", "Lo aprueba el consejo de administración y lo informa al comité de riesgos de la propia Entidad", "Lo aprueba el Oficial de Cumplimiento y lo somete a ratificación del comité de riesgos de la Entidad", "Lo aprueba la Comisión dentro del plazo que ella misma establezca para tal efecto en cada ejercicio"], "x": "La propuesta del Comité va al comité de riesgos, que es quien aprueba, y ese comité informa al consejo de administración o directivo. El distractor de la Comisión es tentador porque la 25ª Bis sí la menciona, pero sólo para recibir, a requerimiento, un documento que describa que el modelo cumple el Anexo 3: no lo aprueba. Fundamento: 25ª Bis, 1er párr.", "ref": "25ª Bis, 1er párr. · Tema 3.3.2"}, {"id": "C005", "tema": "gradoriesgo", "tipo": "trampa", "q": "Tratándose de Bancos, ¿cuántos Grados de Riesgo intermedios exige la norma entre el bajo y el alto?", "a": "Tantos como las Entidades consideren necesario", "o": ["Tantos como las Entidades consideren necesario", "Al menos uno, de modo que resulten como mínimo tres Grados de Riesgo en el sistema de clasificación", "Al menos tres, consistentes en Grados de Riesgo bajo, medio y alto para todos los Clientes de la Entidad", "Dos para Clientes personas físicas y tres para personas morales y Fideicomisos, según el tipo de persona"], "x": "En Bancos la norma no fija un número: manda establecer entre el bajo y el alto tantos Grados intermedios como las Entidades consideren necesario, siempre que sean claramente diferenciables y homogéneos al interior. Los distractores son los mínimos de OTROS sujetos obligados: las tres clasificaciones son de ITF (DCG ITF, art. 29) y el esquema de dos y tres es de SOFOMES (DCG SOFOMES, 21ª). Fundamento: 25ª Bis, 2º párr.; Anexo 3, I.iii.", "ref": "25ª Bis, 2º párr. · Tema 3.3.2"}, {"id": "C006", "tema": "gradoriesgo", "tipo": "memoria", "q": "Según el Anexo 3, ¿cuál de los siguientes corresponde a las características inherentes del Cliente?", "a": "La fecha de nacimiento o de constitución", "o": ["La fecha de nacimiento o de constitución", "El manejo de efectivo en la cuenta durante el periodo que la Entidad determine en su metodología", "La frecuencia con que el Cliente realiza sus Operaciones a través de los canales contratados", "Los países de origen y destino de los recursos que el Cliente mueve en sus Operaciones"], "x": "Las inherentes son lo que el Cliente es: tipo de persona, nacionalidad, fecha de nacimiento o de constitución, giro o actividad, ubicación geográfica o Geolocalización, y productos y servicios. Los tres distractores son transaccionales, es decir, lo que el Cliente hace. Fundamento: Anexo 3, I.i, a).", "ref": "Anexo 3, I.i, a) · Tema 3.3.2"}, {"id": "C007", "tema": "gradoriesgo", "tipo": "caso", "q": "El área de riesgos de Banco Ribera clasificó el factor «manejo de efectivo en la cuenta» dentro de las características inherentes del Cliente. ¿Es correcto conforme al Anexo 3?", "a": "No; es una característica transaccional", "o": ["No; es una característica transaccional", "Sí; es una característica inherente porque describe el producto que el Cliente tiene contratado", "Sí; es inherente cuando se trata de Clientes personas morales y transaccional si son personas físicas", "No; no figura en el Anexo 3 y sólo puede usarse como criterio experto debidamente documentado"], "x": "El manejo de efectivo en la cuenta aparece expresamente en el catálogo de características transaccionales del Anexo 3. El distractor de los productos confunde dos cosas: «productos y servicios» sí es inherente, pero el manejo de efectivo describe cómo opera la cuenta, no qué producto es. Fundamento: Anexo 3, I.i, b).", "ref": "Anexo 3, I.i, b) · Tema 3.3.2"}, {"id": "C008", "tema": "gradoriesgo", "tipo": "cifra", "q": "¿Cuántas características inherentes enumera el Anexo 3 como piso mínimo para identificar los factores de Riesgo del Cliente?", "a": "Seis", "o": ["Seis", "Cuatro", "Ocho", "Nueve"], "x": "Son seis: tipo de persona, nacionalidad, fecha de nacimiento o de constitución, giro o actividad, ubicación geográfica o Geolocalización, y productos y servicios. El nueve tienta porque es el número de características transaccionales vigentes del mismo catálogo. Fundamento: Anexo 3, I.i, a).", "ref": "Anexo 3, I.i, a) · Tema 3.3.2"}, {"id": "C009", "tema": "gradoriesgo", "tipo": "memoria", "q": "Según el Anexo 3, ¿cómo debe ser el método con que las Entidades midan los Riesgos de sus Clientes?", "a": "Exhaustivo, y podrá ser estadístico", "o": ["Exhaustivo, y podrá ser estadístico", "Estadístico en todos los casos, con pruebas de bondad de ajuste dentro y fuera de la muestra", "Cualitativo, basado en el criterio experto del personal que atiende directamente al Cliente", "El que la Comisión apruebe expresamente para cada Entidad dentro del plazo que ella establezca"], "x": "El Anexo 3 pide un método exhaustivo, «que podrá ser estadístico»: lo estadístico es una posibilidad, no una obligación. El distractor más tentador es el que lo vuelve obligatorio, porque el propio Anexo sí impone requisitos extra de documentación cuando de hecho se usan modelos estadísticos. Fundamento: Anexo 3, I.ii.", "ref": "Anexo 3, I.ii · Tema 3.3.2"}, {"id": "C010", "tema": "gradoriesgo", "tipo": "trampa", "q": "¿Qué establece el Anexo 3 respecto de los componentes de criterio experto dentro del sistema de clasificación?", "a": "Podrán incorporarse si cuentan con amplia documentación que justifique su consistencia", "o": ["Podrán incorporarse si cuentan con amplia documentación que justifique su consistencia", "Deberán incorporarse en todo caso, junto con la evidencia de la experiencia del personal facultado", "Podrán incorporarse libremente, sin exigencia adicional de documentación ni de justificación", "Están prohibidos, porque la clasificación debe derivar únicamente del resultado del Modelo de Riesgos"], "x": "El verbo es «podrá»: el criterio experto es facultativo, y sólo procede con amplia documentación que justifique su consistencia. Los dos extremos son falsos: ni es obligatorio ni queda libre de documentación. Fundamento: Anexo 3, I.iii.", "ref": "Anexo 3, I.iii · Tema 3.3.2"}, {"id": "C011", "tema": "gradoriesgo", "tipo": "memoria", "q": "Respecto de las invalidaciones de los resultados del proceso de clasificación, ¿qué deben describir las Entidades?", "a": "Los supuestos en que el personal puede invalidarlos, con quién, cómo y en qué medida", "o": ["Los supuestos en que el personal puede invalidarlos, con quién, cómo y en qué medida", "Únicamente el número máximo de invalidaciones permitido por Grado de Riesgo en cada ejercicio anual", "El monto de las Operaciones a partir del cual el Oficial de Cumplimiento puede dejar sin efecto el resultado", "Sólo el nombre del área independiente que valida el Modelo y que autoriza la invalidación correspondiente"], "x": "El Anexo 3 exige describir los supuestos de invalidación especificando quién, cómo y en qué medida se está facultado, y documentarlas en un registro o bitácora que identifique al responsable de aprobarlas y les dé seguimiento. El distractor del área validadora confunde funciones: quien valida el Modelo es independiente de quien lo desarrolló, y eso es otra obligación. Fundamento: Anexo 3, I.iii, b).", "ref": "Anexo 3, I.iii, b) · Tema 3.3.2"}, {"id": "C012", "tema": "gradoriesgo", "tipo": "caso", "q": "Una falla del sistema de Banco Ribera dejó a 400 Clientes sin Grado de Riesgo asignado. El área de riesgos propone dejarlos «pendientes de clasificar» hasta la siguiente corrida semestral. ¿Qué establece el Anexo 3?", "a": "Por ningún motivo pueden tener Clientes sin clasificar", "o": ["Por ningún motivo pueden tener Clientes sin clasificar", "Pueden permanecer sin clasificar hasta por seis meses, siempre que se documente la falla del sistema", "Pueden permanecer sin clasificar si se les asigna provisionalmente el Grado de Riesgo alto por precaución", "Pueden permanecer sin clasificar si el Comité aprueba la excepción y la informa al comité de riesgos"], "x": "La regla es absoluta y no admite plazo, excepción ni aprobación: «Por ningún motivo las Entidades deberán tener Clientes sin clasificar en alguno de los Grados de Riesgo establecidos». El distractor de asignarles alto riesgo provisional suena prudente, pero no está previsto y sigue dejando al Cliente fuera del sistema de clasificación. Fundamento: Anexo 3, I.iii, b).", "ref": "Anexo 3, I.iii, b) · Tema 3.3.2"}, {"id": "C013", "tema": "gradoriesgo", "tipo": "caso", "q": "En el Modelo de Riesgos de Banco Ribera, el 82 % de los Clientes cae en un mismo Grado de Riesgo. ¿Cuándo puede justificarse esa concentración?", "a": "Cuando esos Clientes presenten características homogéneas", "o": ["Cuando esos Clientes presenten características homogéneas", "Cuando el Grado en que se concentran sea el bajo y ninguno de ellos realice transferencias internacionales", "Cuando la Entidad incremente el número de Grados de Riesgo intermedios en el siguiente ejercicio anual", "Cuando el comité de riesgos autorice la concentración y la informe al consejo de administración"], "x": "El Anexo 3 admite concentraciones excesivas únicamente cuando esos Clientes presenten características homogéneas; lo que exige es diferenciación significativa del Riesgo. Abrir más Grados intermedios es tentador porque parece resolver el problema, pero la norma no condiciona la justificación a ello. Fundamento: Anexo 3, I.iii.", "ref": "Anexo 3, I.iii · Tema 3.3.2"}, {"id": "C014", "tema": "gradoriesgo", "tipo": "memoria", "q": "Según el Anexo 3, los criterios de clasificación deben tener claridad y detalle suficientes para que:", "a": "Un tercero comprenda, reproduzca y evalúe la clasificación", "o": ["Un tercero comprenda, reproduzca y evalúe la clasificación", "El Cliente conozca el Grado de Riesgo que le fue asignado y pueda solicitar su modificación", "La Comisión pueda sustituir el Modelo de Riesgos por el modelo homogéneo que ella misma difunda", "El proveedor del modelo quede relevado de documentar la teoría y los supuestos matemáticos empleados"], "x": "El estándar es la reproducibilidad por un tercero: comprender el proceso, replicar la clasificación y evaluar su idoneidad; además, los criterios deben ser consistentes con el documento de la 64ª. El distractor del proveedor es justamente lo contrario: usar un modelo adquirido de un tercero no exime de documentar. Fundamento: Anexo 3, I.iii, a).", "ref": "Anexo 3, I.iii, a) · Tema 3.3.2"}, {"id": "C015", "tema": "gradoriesgo", "tipo": "caso", "q": "Banco Ribera reclasificó al Sr. Arteaga de un Grado de Riesgo menor a uno mayor. Conforme a la 25ª, ¿qué debe ocurrir con él?", "a": "Recabar más información sobre su actividad económica preponderante y supervisar más estrictamente su comportamiento transaccional", "o": ["Recabar más información sobre su actividad económica preponderante y supervisar más estrictamente su comportamiento transaccional", "Dar por terminada la relación comercial dentro de los seis meses siguientes a la reclasificación, previa aprobación del directivo facultado", "Reportar la reclasificación a la Comisión dentro de los primeros 60 días hábiles del año siguiente", "Solicitar la ratificación del nuevo Grado de Riesgo al área que desarrolló el Modelo de Riesgos"], "x": "La 25ª liga el mayor Grado de Riesgo a dos consecuencias: más información sobre la actividad económica preponderante y supervisión más estricta del comportamiento transaccional por el sistema de alertas de la 25ª Quáter. El distractor de los 60 días hábiles es real, pero corresponde a la entrega anual de los resultados del uso del Modelo, no al aviso de una reclasificación individual. Fundamento: 25ª, 1er párr.", "ref": "25ª, 1er párr. · Tema 3.3.2"}, {"id": "C016", "tema": "gradoriesgo", "tipo": "memoria", "q": "¿Qué debe establecer el Manual de Cumplimiento respecto de los Clientes que representen un mayor Grado de Riesgo?", "a": "El procedimiento para obtener información adicional y la forma de supervisarlos de manera diferenciada", "o": ["El procedimiento para obtener información adicional y la forma de supervisarlos de manera diferenciada", "El número máximo de Clientes que pueden ser clasificados en el Grado de Riesgo alto por cada sucursal", "La obligación de dar aviso a la Secretaría cada vez que un Cliente cambie de Grado de Riesgo", "El listado nominativo de los Clientes de Grado de Riesgo alto, actualizado cuando menos cada seis meses"], "x": "La 25ª manda establecer en el Manual el procedimiento o mecanismo para obtener la información adicional, especificando qué información se recaba frente a los Clientes de menor Grado, y cómo se hará la supervisión transaccional diferenciada. El listado nominativo tienta porque la 27ª sí obliga a que el Oficial de Cumplimiento conozca a los Clientes de alto riesgo, pero eso es un mecanismo de conocimiento, no un contenido del Manual con esa forma. Fundamento: 25ª, último párr.", "ref": "25ª, último párr. · Tema 3.3.2"}, {"id": "C017", "tema": "gradoriesgo", "tipo": "caso", "q": "El sistema de alertas de Banco Ribera aplica los mismos parámetros de monitoreo a personas físicas, morales y Fideicomisos. ¿Qué observación procede conforme a la 25ª Quáter?", "a": "Debe establecer criterios de monitoreo diferenciados para cada uno de esos tipos de Cliente", "o": ["Debe establecer criterios de monitoreo diferenciados para cada uno de esos tipos de Cliente", "Debe aplicar parámetros uniformes y diferenciar únicamente por el Grado de Riesgo asignado al Cliente", "Debe diferenciar los parámetros solamente respecto de los Fideicomisos y de los Clientes no residentes", "Debe sustituir el sistema de alertas por cuestionarios de identificación aplicados cada seis meses"], "x": "La 25ª Quáter exige criterios de monitoreo transaccional diferenciados para Clientes personas físicas, morales o Fideicomisos. El distractor de diferenciar sólo por Grado de Riesgo es tentador porque la 25ª sí manda supervisión más estricta a mayor grado, pero eso no sustituye la diferenciación por tipo de persona. Fundamento: 25ª Quáter, 2º párr.", "ref": "25ª Quáter, 2º párr. · Tema 3.3.2"}, {"id": "C018", "tema": "gradoriesgo", "tipo": "caso", "q": "Banco Ribera ENVÍA una transferencia internacional de fondos por instrucción de su Cliente. Para determinar el Grado de Riesgo con la información de las plataformas de la 62ª Quáter, ¿qué debe considerar?", "a": "Sólo la información y documentación del Cliente o Usuario emisor", "o": ["Sólo la información y documentación del Cliente o Usuario emisor", "La información y documentación tanto del emisor como del receptor de la transferencia de que se trate", "Sólo la información del receptor, por ser quien recibe materialmente los recursos transferidos", "La información de todas las Entidades que hayan intervenido en la cadena de pago de la transferencia"], "x": "La 25ª Ter distingue por el papel de la Entidad: si envía, sólo considera al emisor; si recibe, considera a emisor y receptor. El distractor de emisor y receptor es justamente el supuesto contrario, el de la fracción II. Fundamento: 25ª Ter, fr. I.", "ref": "25ª Ter, fr. I · Tema 3.3.2"}, {"id": "C019", "tema": "gradoriesgo", "tipo": "caso", "q": "Ahora Banco Ribera RECIBE una transferencia de fondos internacional a favor de uno de sus Clientes. ¿Qué información debe considerar para determinar el Grado de Riesgo?", "a": "La del emisor y la del receptor de la transferencia", "o": ["La del emisor y la del receptor de la transferencia", "Únicamente la del receptor, por ser el único con quien mantiene una relación comercial vigente", "Únicamente la del emisor, por ser quien originó la Operación objeto de la evaluación de Riesgo", "La del receptor y, en su caso, la del beneficiario final declarado por la Entidad ordenante extranjera"], "x": "Cuando la Entidad recibe, la 25ª Ter manda considerar la información y documentación del Cliente o Usuario emisor y también del receptor. El distractor de «sólo el receptor» es el más tentador porque es con quien existe la relación comercial, pero la norma amplía expresamente el alcance en este supuesto. Fundamento: 25ª Ter, fr. II.", "ref": "25ª Ter, fr. II · Tema 3.3.2"}, {"id": "C020", "tema": "gradoriesgo", "tipo": "memoria", "q": "Conforme a la 25ª Ter, ¿qué información puede excluir la Entidad al determinar el Grado de Riesgo de quienes envían o reciben transferencias?", "a": "La que, conforme a sus metodologías de evaluación de Riesgos, no aporte valor relevante", "o": ["La que, conforme a sus metodologías de evaluación de Riesgos, no aporte valor relevante", "La correspondiente a Usuarios, por no existir con ellos una relación comercial formalizada", "La relativa a transferencias nacionales denominadas en moneda extranjera de bajo monto", "La que provenga de los procesos de intercambio de información del Capítulo XIII de las Disposiciones"], "x": "La 25ª Ter permite excluir aquella información que, conforme a las metodologías de evaluación de Riesgos que la Entidad desarrolle, no aporte valor relevante para la evaluación. El distractor de los Usuarios es falso: respecto de ellos la propia disposición manda evaluar el Riesgo de sus transferencias conforme a políticas y criterios propios. Fundamento: 25ª Ter, 3er párr.", "ref": "25ª Ter, 3er párr. · Tema 3.3.2"}, {"id": "C021", "tema": "gradoriesgo", "tipo": "trampa", "q": "¿En qué caso NO están obligadas las Entidades a considerar la información de Geolocalización prevista en la 25ª Bis?", "a": "Cuando se trate de las sociedades, dependencias y entidades del Anexo 1 clasificadas con Grado de Riesgo bajo", "o": ["Cuando se trate de las sociedades, dependencias y entidades del Anexo 1 clasificadas con Grado de Riesgo bajo", "Cuando se trate de cualquier sociedad, dependencia o entidad listada en el Anexo 1, sea cual sea su Grado", "Cuando el Cliente haya abierto la cuenta de forma presencial en una sucursal de la propia Entidad", "Cuando el Cliente sea una persona moral cuyos títulos coticen en alguna bolsa de valores del país"], "x": "La excepción tiene dos condiciones que van juntas: estar en el Anexo 1 y, además, estar clasificado con Grado de Riesgo bajo. El distractor más tentador es el que se queda sólo con el Anexo 1 y borra el requisito del Grado bajo. Fundamento: 25ª Bis, párr. adicionado DOF 28-08-2024.", "ref": "25ª Bis, párr. adicionado 2024 · Tema 3.3.2"}, {"id": "C022", "tema": "gradoriesgo", "tipo": "caso", "q": "Una clienta abre su cuenta con Banco Ribera de forma no presencial, en términos de la 4ª Ter. ¿Qué información adicional debe considerar la Entidad para determinar su Grado de Riesgo?", "a": "La Geolocalización del Dispositivo desde el cual abre la cuenta", "o": ["La Geolocalización del Dispositivo desde el cual abre la cuenta", "La certificación de un auditor independiente sobre los controles del proveedor tecnológico utilizado", "El dictamen del área de auditoría interna sobre la validez del expediente integrado a distancia", "La aprobación por escrito de un directivo con facultades específicas para aprobar aperturas remotas"], "x": "La 25ª Bis manda considerar la Geolocalización del Dispositivo tanto en aperturas no presenciales de la 4ª Ter como en Operaciones realizadas a través de Dispositivos. El distractor de la aprobación directiva es real, pero se activa por el Grado de Riesgo alto (27ª), no por el hecho de que la apertura sea remota. Fundamento: 25ª Bis, párr. adicionado DOF 22-03-2019.", "ref": "25ª Bis, párr. de Geolocalización · Tema 3.3.2"}, {"id": "C023", "tema": "gradoriesgo", "tipo": "caso", "q": "Un Cliente de Banco Ribera realiza transferencias con contrapartes ubicadas en una jurisdicción listada por el GAFI. Conforme a la 25ª Bis, ¿cómo incide eso en su Grado de Riesgo?", "a": "La Entidad debe considerar si las Operaciones involucran países o jurisdicciones de la fracción X de la 38ª", "o": ["La Entidad debe considerar si las Operaciones involucran países o jurisdicciones de la fracción X de la 38ª", "La Entidad debe clasificarlo automáticamente en el Grado de Riesgo alto, sin intervención del Modelo", "La Entidad debe abstenerse de considerarlo, por tratarse de un factor propio de la evaluación de la Entidad", "La Entidad debe elevar la consulta a la Comisión dentro del plazo que ésta establezca al efecto"], "x": "La 25ª Bis obliga a considerar, en todos los casos, si las transferencias involucran los países o jurisdicciones de la fracción X de la 38ª. Considerar no es clasificar: el distractor del alto riesgo automático confunde este factor con los tres supuestos de alto riesgo por mandato de la 28ª, donde ese destino no figura. Fundamento: 25ª Bis, párr. adicionado DOF 28-08-2024.", "ref": "25ª Bis, párr. de transferencias · Tema 3.3.2"}, {"id": "C024", "tema": "gradoriesgo", "tipo": "cifra", "q": "¿En cuántas dimensiones, al menos, manda el Anexo 3 considerar al Cliente para identificar sus factores de Riesgo?", "a": "Dos", "o": ["Dos", "Tres", "Cuatro", "Seis"], "x": "El Anexo 3 dice «al menos en las dimensiones siguientes» y enumera dos: características inherentes y características transaccionales. Son un piso, no un techo: el propio Anexo 3, II admite «cualquier otra dimensión de Riesgo definida por la Entidad». El cuatro tienta porque ése es el número de elementos de Riesgo de la evaluación de la propia Entidad (productos y servicios; Clientes y Usuarios; países y áreas geográficas; transacciones y canales), que es otro ejercicio. Fundamento: Anexo 3, I.i.", "ref": "Anexo 3, I.i · Tema 3.3.2"}, {"id": "C025", "tema": "gradoriesgo", "tipo": "cifra", "q": "Tratándose de Instituciones de Tecnología Financiera, ¿cuántas clasificaciones de Grado de Riesgo exige como mínimo su propia normativa para todos sus Clientes?", "a": "Tres: bajo, medio y alto", "o": ["Tres: bajo, medio y alto", "Dos: bajo y alto, más los intermedios que la Institución considere necesarios", "Cuatro: bajo, medio bajo, medio alto y alto, conforme a su metodología de evaluación", "No fija un número mínimo; sólo exige que los grados sean claramente diferenciables entre sí"], "x": "Las DCG de ITF exigen al menos tres clasificaciones —bajo, medio y alto— para todos sus Clientes. El distractor que dice que ITF no fija un número mínimo de grados es precisamente la regla de Bancos: confundir los mínimos entre sectores es el error clásico del examen. Fundamento: DCG ITF, art. 29.", "ref": "DCG ITF, art. 29 · Tema 3.3.2"}, {"id": "C026", "tema": "gradoriesgo", "tipo": "cifra", "q": "En las DCG de SOFOMES, ¿cuántos Grados de Riesgo mínimos se exigen según el tipo de Cliente?", "a": "Dos para personas físicas y tres para personas morales y Fideicomisos", "o": ["Dos para personas físicas y tres para personas morales y Fideicomisos", "Tres para personas físicas y dos para personas morales y Fideicomisos, conforme a su metodología", "Tres para todos los Clientes, sin distinguir entre personas físicas, morales y Fideicomisos", "Dos para todos los Clientes, más los Grados intermedios que la sociedad considere necesarios"], "x": "SOFOMES diferencia por tipo de persona: mínimo dos para personas físicas (alto y bajo) y mínimo tres para personas morales y Fideicomisos (alto, medio y bajo). El distractor de «tres para todos» es el mínimo de ITF, no el de SOFOMES. Fundamento: DCG SOFOMES, 21ª.", "ref": "DCG SOFOMES, 21ª · Tema 3.3.2"}, {"id": "C027", "tema": "gradoriesgo", "tipo": "trampa", "q": "¿Cuál de los siguientes NO es una característica inherente del Cliente conforme al Anexo 3?", "a": "El volumen de operación", "o": ["El volumen de operación", "El giro o actividad a que se dedica el Cliente de que se trate", "La ubicación geográfica o Geolocalización del Cliente correspondiente", "Los productos y servicios que el Cliente tenga contratados con la Entidad"], "x": "El volumen de operación encabeza el catálogo de características transaccionales; las otras tres sí son inherentes. La trampa está en que «productos y servicios» suena transaccional, pero el Anexo 3 lo ubica expresamente entre las inherentes. Fundamento: Anexo 3, I.i, a) y b).", "ref": "Anexo 3, I.i · Tema 3.3.2"}, {"id": "C028", "tema": "gradoriesgo", "tipo": "caso", "q": "Banco Ribera desarrolló su Modelo de Riesgos con una muestra formada sólo por Clientes de banca patrimonial. ¿Qué exigencia del Anexo 3 incumple?", "a": "Demostrar que los datos utilizados son representativos del universo de sus Clientes", "o": ["Demostrar que los datos utilizados son representativos del universo de sus Clientes", "Someter la muestra a la aprobación previa de la Comisión antes de implementar el Modelo de Riesgos", "Utilizar información correspondiente a un periodo que no podrá ser menor a doce meses de operación", "Contar con al menos tres Grados de Riesgo claramente diferenciables entre sí dentro del Modelo"], "x": "El Anexo 3 exige demostrar que los datos son representativos del universo de Clientes con los que se mantiene relación comercial y que se incorporaron los productos y servicios contratados. El distractor de los doce meses es real pero pertenece a otro ejercicio: es la implementación de la metodología de evaluación de Riesgos de la Entidad (21ª-3, fr. II). Fundamento: Anexo 3, introducción.", "ref": "Anexo 3, introducción · Tema 3.3.2"}, {"id": "C029", "tema": "gradoriesgo", "tipo": "memoria", "q": "Conforme a la 28ª, ¿en qué momento y con qué herramienta deben las Entidades clasificar a sus Clientes en función de su Grado de Riesgo?", "a": "Al inicio de la relación comercial y con los sistemas automatizados de la 51ª", "o": ["Al inicio de la relación comercial y con los sistemas automatizados de la 51ª", "Dentro de los seis meses siguientes al inicio de la relación, con los sistemas automatizados de la 51ª", "Al inicio de la relación comercial y con el sistema de alertas de comportamiento transaccional de la 25ª Quáter", "Dentro de los primeros 60 días hábiles del año siguiente al inicio de la relación comercial de que se trate"], "x": "La 28ª ordena clasificar al inicio de la relación comercial utilizando los sistemas automatizados de la 51ª. El distractor de los seis meses es el más tentador: ese plazo existe, pero es el periodo durante el cual se considera la información que el Cliente proporcionó al inicio para fijar su Grado inicial, no una prórroga para clasificar. Fundamento: 28ª, 1er párr.", "ref": "28ª, 1er párr. · Tema 3.3.2"}, {"id": "C030", "tema": "gradoriesgo", "tipo": "cifra", "q": "¿Durante cuánto tiempo, al menos, debe considerarse la información que el Cliente proporcionó al inicio de la relación comercial para determinar su Grado de Riesgo inicial?", "a": "Los seis primeros meses", "o": ["Los seis primeros meses", "Los tres primeros meses", "Los doce primeros meses", "Los primeros 60 días hábiles"], "x": "La 25ª Bis fija seis meses. El distractor de doce meses corresponde a la evaluación de Riesgos de la Entidad (21ª-3 y 21ª-4) y el de 60 días hábiles a la entrega anual del Anexo 3: tres plazos distintos, tres obligaciones distintas. Fundamento: 25ª Bis, 3er párr.", "ref": "25ª Bis, 3er párr. · Tema 3.3.2"}, {"id": "C031", "tema": "gradoriesgo", "tipo": "cifra", "q": "¿Durante cuánto tiempo debe el sistema de alertas considerar, al menos, la información que el Cliente proporcione sobre las Operaciones que estime realizar, para determinar su perfil transaccional inicial?", "a": "Los seis primeros meses", "o": ["Los seis primeros meses", "Los primeros 90 días naturales", "Los doce primeros meses", "Los primeros 60 días hábiles"], "x": "La 25ª Quáter usa el mismo plazo de seis meses que la 25ª Bis: coinciden en el tiempo el Grado de Riesgo inicial y el perfil transaccional inicial, aunque sean cosas distintas. Ninguno de los plazos en días corresponde a esta obligación. Fundamento: 25ª Quáter, 3er párr.", "ref": "25ª Quáter, 3er párr. · Tema 3.3.2"}, {"id": "C032", "tema": "gradoriesgo", "tipo": "cifra", "q": "¿Con qué periodicidad mínima deben las Entidades evaluar el Grado de Riesgo de sus Clientes para determinar si procede reclasificarlos?", "a": "Al menos cada seis meses", "o": ["Al menos cada seis meses", "Al menos cada doce meses", "Al menos cada tres meses", "Al menos dos veces por año calendario"], "x": "La 25ª Bis y el Anexo 3 coinciden: al menos cada seis meses, con frecuencia mayor cuando el Grado de Riesgo sea mayor. El distractor de «dos veces por año calendario» es la regla de SOFOMES, no la de Bancos. Fundamento: 25ª Bis, párr. reformado DOF 03-03-2022.", "ref": "25ª Bis; Anexo 3, II · Tema 3.3.2"}, {"id": "C033", "tema": "gradoriesgo", "tipo": "cifra", "q": "¿Cada cuánto, como mínimo, deben las Entidades evaluar el perfil transaccional de sus Clientes para determinar si resulta necesario modificarlo?", "a": "Al menos cada seis meses", "o": ["Al menos cada seis meses", "Al menos cada doce meses", "Al menos cada 60 días hábiles", "Sólo cuando se genere una alerta en el sistema de monitoreo transaccional"], "x": "La 25ª Quáter impone la evaluación del perfil transaccional al menos cada seis meses, con independencia de que se generen alertas. El distractor que condiciona la evaluación del perfil transaccional a que se genere una alerta es el más tentador porque el perfil vive dentro del sistema de alertas, pero la obligación es periódica, no reactiva. Fundamento: 25ª Quáter, último párr.", "ref": "25ª Quáter, último párr. · Tema 3.3.2"}, {"id": "C034", "tema": "gradoriesgo", "tipo": "cifra", "q": "El Anexo 3 exige llevar a cabo la evaluación de Riesgos de los Clientes con una frecuencia máxima de:", "a": "Seis meses", "o": ["Seis meses", "Doce meses", "Veinticuatro meses", "Tres meses"], "x": "El Anexo 3 repite el plazo de la 25ª Bis: frecuencia no mayor a seis meses. El de doce meses es el de la revisión y actualización de la metodología de evaluación de Riesgos de la Entidad (21ª-4), que mide a la institución, no al Cliente. Fundamento: Anexo 3, II.", "ref": "Anexo 3, II · Tema 3.3.2"}, {"id": "C035", "tema": "gradoriesgo", "tipo": "cifra", "q": "¿En qué plazo deben las Entidades revisar y actualizar el cumplimiento y resultados de su metodología de evaluación de Riesgos del Capítulo II Bis?", "a": "En un plazo no mayor a 12 meses a partir de que cuenten con los resultados de su implementación", "o": ["En un plazo no mayor a 12 meses a partir de que cuenten con los resultados de su implementación", "En un plazo no mayor a seis meses a partir de que cuenten con los resultados de su implementación", "Dentro de los primeros 60 días hábiles del año inmediato siguiente al de la implementación", "En un plazo no mayor a cinco años, que es el mismo de conservación de la información generada"], "x": "La 21ª-4 fija 12 meses, además de los supuestos de nuevos Riesgos o de actualización de la evaluación nacional de riesgos. El distractor de seis meses es el plazo del Cliente (25ª Bis), y el de cinco años es el de conservación de la información, no el de revisión. Fundamento: 21ª-4, 1er párr.", "ref": "21ª-4, 1er párr. · Tema 3.3.2"}, {"id": "C036", "tema": "gradoriesgo", "tipo": "trampa", "q": "¿Cuál de estas equivalencias de plazos NO es correcta?", "a": "La entrega anual de los resultados del uso del Modelo de Riesgos se hace dentro de los primeros 60 días naturales del año", "o": ["La entrega anual de los resultados del uso del Modelo de Riesgos se hace dentro de los primeros 60 días naturales del año", "El Grado de Riesgo del Cliente se evalúa al menos cada seis meses conforme a la 25ª Bis, con frecuencia mayor si el Grado también lo es", "La metodología de evaluación de Riesgos de la Entidad se revisa en un plazo no mayor a 12 meses", "El perfil transaccional del Cliente se evalúa al menos cada seis meses conforme a la 25ª Quáter"], "x": "Los 60 días de la entrega anual del Anexo 3 son hábiles, no naturales; las otras tres afirmaciones son correctas. Aquí se cruzan tres relojes distintos: seis meses para el Cliente, doce meses para la Entidad y 60 días hábiles para la entrega a la Comisión. Fundamento: Anexo 3, Seguimiento de uso.", "ref": "Anexo 3, Seguimiento de uso · Tema 3.3.2"}, {"id": "C037", "tema": "gradoriesgo", "tipo": "trampa", "q": "¿Qué dice la 25ª Bis sobre la frecuencia de evaluación cuando la clasificación del Grado de Riesgo del Cliente es m
