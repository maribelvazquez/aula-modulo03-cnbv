a lista de agentes relacionados y personas jurídicas coadyuvantes", "Los resultados de revisar las obligaciones sobre comisionistas previstas en las Disposiciones", "La revisión del Auditor a comisionistas para conocer su régimen de prevención", "Si permite que los comisionistas integren y conserven los expedientes de identificación"], "x": "La fr. XIV, inc. a) son los resultados de revisar las obligaciones sobre comisionistas; b) trata expedientes en poder de comisionistas y c) la revisión directa del Auditor.", "ref": "OCTAVO A, fr. XIV, inc. a) · Tema 3.1.1"}, {"id": "L271", "tema": "lin2021", "tipo": "caso", "q": "En la muestra, el auditor detecta que un apoderado operaba por cuenta de una persona incluida en la Lista de Personas Bloqueadas y la entidad no tenía procedimiento para identificar a terceros en esa situación. ¿Dónde ubica la deficiencia de políticas?", "a": "fr. III, inc. k)", "o": ["fr. I, inc. b)", "fr. X, inc. e)", "fr. X, inc. f)", "fr. III, inc. k)"], "x": "Identificar a terceros que actúen por cuenta de personas bloqueadas es parte de las políticas de la fr. III, inc. k); la X e) revisa contar con la Lista y mecanismos, y la X f) las medidas aplicadas.", "ref": "OCTAVO A, fr. III, inc. k) · Tema 3.1.1"}, {"id": "L273", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. V, inc. a)?", "a": "Que el Sujeto Supervisado constituyó el Comité de conformidad con las Disposiciones", "o": ["Que comunicó en tiempo y forma la integración inicial de su Comité", "Que designó al Oficial de Cumplimiento atendiendo los requisitos de las Disposiciones", "Que el Sujeto Supervisado constituyó el Comité de conformidad con las Disposiciones", "Que presentó la información sobre la integración y cambios del Comité"], "x": "La fr. V, inc. a) revisa si «integró el Comité de conformidad con las Disposiciones»; b) y c) tratan comunicaciones, y d) al Oficial de Cumplimiento.", "ref": "OCTAVO A, fr. V, inc. a) · Tema 3.1.1"}, {"id": "L274", "tema": "lin2021", "tipo": "trampa", "q": "¿A quién NO menciona el OCTAVO A, fr. VI, inc. b) entre los destinatarios de los cursos de capacitación?", "a": "A los Clientes o Usuarios", "o": ["A los directivos", "A los miembros del Comité", "A los Clientes o Usuarios", "A los apoderados"], "x": "El inciso b) menciona al Comité, Oficial de Cumplimiento, directivos, funcionarios, empleados, apoderados y demás personas; no a los Clientes o Usuarios.", "ref": "OCTAVO A, fr. VI, inc. b) · Tema 3.1.1"}, {"id": "L275", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué fracción e inciso del OCTAVO A debe el Auditor indicar si las Operaciones Inusuales fueron dictaminadas por el Comité o, en su caso, por el Oficial de Cumplimiento?", "a": "fr. IV, inc. b)", "o": ["fr. IV, inc. b)", "fr. V, inc. a)", "fr. IV, inc. d)", "fr. IV, inc. a)"], "x": "El dictamen de las Operaciones Inusuales se revisa en la fr. IV, inc. b); el de las Internas Preocupantes en la IV d).", "ref": "OCTAVO A, fr. IV, inc. b) · Tema 3.1.1"}, {"id": "L276", "tema": "lin2021", "tipo": "trampa", "q": "¿Cuál de los siguientes aspectos NO está previsto en la fr. XII del OCTAVO A?", "a": "Que el Auditor pruebe el Modelo Novedoso en un ambiente de pruebas controlado", "o": ["Que obtuvo autorización de la Comisión para operar con Modelos Novedosos", "Que presentó a la Comisión, con su solicitud, el resultado de su evaluación de Riesgos", "Que lleva a cabo sus Operaciones a través del Modelo Novedoso autorizado", "Que el Auditor pruebe el Modelo Novedoso en un ambiente de pruebas controlado"], "x": "La fr. XII (incs. a) a f)) revisa autorización, evaluación previa de Riesgos, su enfoque y presentación, apego a la autorización y operación por el Modelo; no prevé pruebas del Auditor.", "ref": "OCTAVO A, fr. XII · Tema 3.1.1"}, {"id": "L277", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué fracción e inciso del OCTAVO A se revisa si el Sujeto Supervisado tiene oficinas, sucursales, agencias y filiales en territorio nacional o en el extranjero?", "a": "fr. XIII, inc. f)", "o": ["fr. XIII, inc. c)", "fr. XIII, inc. f)", "fr. VIII, inc. a)", "fr. XIV, inc. a)"], "x": "Oficinas, sucursales, agencias y filiales, nacionales o en el extranjero, se revisan en la fr. XIII, inc. f).", "ref": "OCTAVO A, fr. XIII, inc. f) · Tema 3.1.1"}, {"id": "L278", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué fracción e inciso del OCTAVO A se revisa si el Sujeto Supervisado cuenta con mecanismos de agrupación de Operaciones y, en su caso, con los relativos al escalamiento de aprobación interna?", "a": "fr. I, inc. d)", "o": ["fr. III, inc. g)", "fr. I, inc. d)", "fr. III, inc. h)", "fr. IV, inc. b)"], "x": "Seguimiento, agrupación y escalamiento de aprobación interna están en la fr. I, inc. d); III g) y h) tratan la aprobación de Operaciones con PEP de riesgo alto y de alto Riesgo.", "ref": "OCTAVO A, fr. I, inc. d) · Tema 3.1.1"}, {"id": "L279", "tema": "lin2021", "tipo": "caso", "q": "La entidad sí tiene la Lista de Personas Bloqueadas y un buscador efectivo, pero cuando detectó a un cliente en ella no aplicó las medidas que establecen las Disposiciones. ¿Qué fracción e inciso refleja el incumplimiento?", "a": "fr. X, inc. f)", "o": ["fr. III, inc. k)", "fr. IV, inc. b)", "fr. X, inc. e)", "fr. X, inc. f)"], "x": "La fr. X, inc. f) revisa si implementó las medidas de las Disposiciones al identificar a un Cliente o Usuario en las listas; la X e) se limita a contar con la lista y mecanismos.", "ref": "OCTAVO A, fr. X, inc. f) · Tema 3.1.1"}, {"id": "L280", "tema": "lin2021", "tipo": "memoria", "q": "¿Qué revisa el OCTAVO A, fr. II, inc. f)?", "a": "Si modificó políticas para fijar Mitigantes y mantener un nivel de tolerancia aceptable", "o": ["Si modificó políticas para fijar Mitigantes y mantener un nivel de tolerancia aceptable", "Si difundió al personal las Disposiciones y sus modificaciones", "Si identificó los Mitigantes que tenía implementados al momento de diseñar la metodología", "Si subsanó las observaciones y acciones correctivas que la Comisión le notificó"], "x": "El inciso f) revisa si, derivado de los resultados de la metodología, modificó políticas y procedimientos para establecer Mitigantes y mantener un nivel de tolerancia aceptable.", "ref": "OCTAVO A, fr. II, inc. f) · Tema 3.1.1"}, {"id": "L281", "tema": "lin2021", "tipo": "memoria", "q": "¿En qué fracción e inciso del OCTAVO A se revisa si el Sujeto Supervisado cuenta con un sistema que le permita detectar oportunamente cambios en el comportamiento transaccional del Cliente o Usuario?", "a": "fr. III, inc. d)", "o": ["fr. III, inc. e)", "fr. I, inc. e)", "fr. III, inc. d)", "fr. III, inc. b)"], "x": "El sistema de alertas para dar seguimiento y detectar oportunamente cambios en el comportamiento transaccional está en la fr. III, inc. d).", "ref": "OCTAVO A, fr. III, inc. d) · Tema 3.1.1"}, {"id": "S001", "tema": "regsup", "tipo": "memoria", "q": "¿De qué trata el Título Primero del Reglamento de Supervisión?", "a": "Disposiciones generales", "o": ["De la inspección", "Disposiciones generales", "De la vigilancia", "Observaciones y medidas correctivas"], "x": "Título Primero = Disposiciones generales (arts. 1–3).", "ref": "Título Primero · Tema 3.1.2"}, {"id": "S003", "tema": "regsup", "tipo": "memoria", "q": "Los artículos 1–3 forman el…", "a": "Título Primero", "o": ["Título Primero", "Título Quinto", "Título Cuarto", "Título Sexto"], "x": "Arts. 1–3 = Título Primero: Disposiciones generales.", "ref": "Título Primero · Tema 3.1.2"}, {"id": "S004", "tema": "regsup", "tipo": "memoria", "q": "¿De qué trata el Título Segundo del Reglamento de Supervisión?", "a": "De la inspección", "o": ["Inspección, vigilancia, cooperación y asistencia internacional", "Disposiciones generales", "Entidades en liquidación o concurso mercantil", "De la inspección"], "x": "Título Segundo = De la inspección (arts. 4–42).", "ref": "Título Segundo · Tema 3.1.2"}, {"id": "S006", "tema": "regsup", "tipo": "memoria", "q": "Los artículos 4–42 forman el…", "a": "Título Segundo", "o": ["Título Segundo", "Título Sexto", "Título Octavo", "Título Décimo"], "x": "Arts. 4–42 = Título Segundo: De la inspección.", "ref": "Título Segundo · Tema 3.1.2"}, {"id": "S007", "tema": "regsup", "tipo": "memoria", "q": "¿De qué trata el Título Tercero del Reglamento de Supervisión?", "a": "De la vigilancia", "o": ["Disposiciones generales", "Inspección, vigilancia, cooperación y asistencia internacional", "De la vigilancia", "De la comparecencia"], "x": "Título Tercero = De la vigilancia (arts. 43–48).", "ref": "Título Tercero · Tema 3.1.2"}, {"id": "S009", "tema": "regsup", "tipo": "memoria", "q": "Los artículos 43–48 forman el…", "a": "Título Tercero", "o": ["Título Tercero", "Título Noveno", "Título Segundo", "Título Octavo"], "x": "Arts. 43–48 = Título Tercero: De la vigilancia.", "ref": "Título Tercero · Tema 3.1.2"}, {"id": "S010", "tema": "regsup", "tipo": "memoria", "q": "¿De qué trata el Título Cuarto del Reglamento de Supervisión?", "a": "Observaciones y medidas correctivas", "o": ["De la intervención", "Emplazamiento para la imposición de sanciones", "Inspección, vigilancia, cooperación y asistencia internacional", "Observaciones y medidas correctivas"], "x": "Título Cuarto = Observaciones y medidas correctivas (arts. 49–54).", "ref": "Título Cuarto · Tema 3.1.2"}, {"id": "S012", "tema": "regsup", "tipo": "memoria", "q": "Los artículos 49–54 forman el…", "a": "Título Cuarto", "o": ["Título Cuarto", "Título Segundo", "Título Séptimo", "Título Quinto"], "x": "Arts. 49–54 = Título Cuarto: Observaciones y medidas correctivas.", "ref": "Título Cuarto · Tema 3.1.2"}, {"id": "S013", "tema": "regsup", "tipo": "memoria", "q": "¿De qué trata el Título Quinto del Reglamento de Supervisión?", "a": "De la comparecencia", "o": ["Observaciones y medidas correctivas", "Disposiciones generales", "De la comparecencia", "Entidades en liquidación o concurso mercantil"], "x": "Título Quinto = De la comparecencia ( sup", "tipo": "memoria", "q": "¿De qué trata el Título Octavo del Reglamento de Supervisión?", "a": "De la intervención", "o": ["De la intervención", "De la vigilancia", "Entidades en liquidación o concurso mercantil", "Observaciones y medidas correctivas"], "x": "Título Octavo = De la intervención (arts. 81–96).", "ref": "Título Octavo · Tema 3.1.2"}, {"id": "S024", "tema": "regsup", "tipo": "memoria", "q": "Los artículos 81–96 forman el…", "a": "Título Octavo", "o": ["Título Segundo", "Título Cuarto", "Título Séptimo", "Título Octavo"], "x": "Arts. 81–96 = Título Octavo: De la intervención.", "ref": "Título Octavo · Tema 3.1.2"}, {"id": "S025", "tema": "regsup", "tipo": "memoria", "q": "¿De qué trata el Título Noveno del Reglamento de Supervisión?", "a": "Entidades en liquidación o concurso mercantil", "o": ["Observaciones y medidas correctivas", "Emplazamiento para la imposición de sanciones", "De la vigilancia", "Entidades en liquidación o concurso mercantil"], "x": "Título Noveno = Entidades en liquidación o concurso mercantil (arts. 97–100).", "ref": "Título Noveno · Tema 3.1.2"}, {"id": "S027", "tema": "regsup", "tipo": "memoria", "q": "Los artículos 97–100 forman el…", "a": "Título Noveno", "o": ["Título Segundo", "Título Séptimo", "Título Noveno", "Título Octavo"], "x": "Arts. 97–100 = Título Noveno: Entidades en liquidación o concurso mercantil.", "ref": "Título Noveno · Tema 3.1.2"}, {"id": "S028", "tema": "regsup", "tipo": "memoria", "q": "¿De qué trata el Título Décimo del Reglamento de Supervisión?", "a": "De la clausura", "o": ["De la clausura", "De la intervención", "Observaciones y medidas correctivas", "Inspección, vigilancia, cooperación y asistencia internacional"], "x": "Título Décimo = De la clausura (arts. 101–109).", "ref": "Título Décimo · Tema 3.1.2"}, {"id": "S030", "tema": "regsup", "tipo": "memoria", "q": "Los artículos 101–109 forman el…", "a": "Título Décimo", "o": ["Título Octavo", "Título Tercero", "Título Séptimo", "Título Décimo"], "x": "Arts. 101–109 = Título Décimo: De la clausura.", "ref": "Título Décimo · Tema 3.1.2"}, {"id": "S031", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La supervisión comprende inspección, vigilancia y prevención y corrección.", "a": "Art. 1", "o": ["Art. 101", "Art. 17", "Art. 3", "Art. 1"], "x": "Art. 1 (Título Primero, Disposiciones generales): la supervisión comprende inspección, vigilancia y prevención y corrección.", "ref": "Art. 1 · Tema 3.1.2"}, {"id": "S032", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Define Entidades Supervisadas, Inspectores y Representante Legal o Apoderado.", "a": "Art. 3", "o": ["Art. 43", "Art. 89", "Art. 3", "Art. 1"], "x": "Art. 3 (Título Primero, Disposiciones generales): define Entidades Supervisadas, Inspectores y Representante Legal o Apoderado.", "ref": "Art. 3 · Tema 3.1.2"}, {"id": "S033", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La inspección se hace mediante visitas, verificación de operaciones y auditoría de registros y sistemas.", "a": "Art. 4", "o": ["Art. 45", "Art. 32", "Art. 4", "Art. 64"], "x": "Art. 4 (Título Segundo, De la inspección): la inspección se hace mediante visitas, verificación de operaciones y auditoría de registros y sistemas.", "ref": "Art. 4 · Tema 3.1.2"}, {"id": "S034", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Las visitas pueden ser ordinarias, especiales o de investigación.", "a": "Art. 5", "o": ["Art. 10", "Art. 38", "Art. 81", "Art. 5"], "x": "Art. 5 (Título Segundo, De la inspección): las visitas pueden ser ordinarias, especiales o de investigación.", "ref": "Art. 5 · Tema 3.1.2"}, {"id": "S035", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Las visitas ordinarias siguen el programa anual de la CNBV.", "a": "Art. 6", "o": ["Art. 20", "Art. 6", "Art. 15", "Art. 81"], "x": "Art. 6 (Título Segundo, De la inspección): las visitas ordinarias siguen el programa anual de la CNBV.", "ref": "Art. 6 · Tema 3.1.2"}, {"id": "S036", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Visitas no incluidas en el programa anual, por ejemplo cuando la entidad inicia operaciones después.", "a": "Art. 8", "o": ["Art. 64", "Art. 29", "Art. 8", "Art. 62"], "x": "Art. 8 (Título Segundo, De la inspección): visitas no incluidas en el programa anual, por ejemplo cuando la entidad inicia operaciones después.", "ref": "Art. 8 · Tema 3.1.2"}, {"id": "S037", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Visitas cuando hay indicios de una conducta que contraviene la ley.", "a": "Art. 9", "o": ["Art. 23", "Art. 9", "Art. 11", "Art. 51"], "x": "Art. 9 (Título Segundo, De la inspección): visitas cuando hay indicios de una conducta que contraviene la ley.", "ref": "Art. 9 · Tema 3.1.2"}, {"id": "S038", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Visitas a quien opera como entidad financiera sin autorización.", "a": "Art. 10", "o": ["Art. 17", "Art. 41", "Art. 63", "Art. 10"], "x": "Art. 10 (Título Segundo, De la inspección): visitas a quien opera como entidad financiera sin autorización.", "ref": "Art. 10 · Tema 3.1.2"}, {"id": "S039", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Por regla general, el Inspector coordinador elabora un informe general de la visita.", "a": "Art. 11", "o": ["Art. 45", "Art. 11", "Art. 50 Bis", "Art. 30"], "x": "Art. 11 (Título Segundo, De la inspección). Excepción: el art. 10 lo excluye en ciertas visitas de investigación.", "ref": "Art. 11 · Tema 3.1.2"}, {"id": "S040", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Los Inspectores no pueden ordenar ajustes contables ni girar observaciones durante la visita.", "a": "Art. 15", "o": ["Art. 51", "Art. 108", "Art. 15", "Art. 20"], "x": "Art. 15 (Título Segundo, De la inspección): los Inspectores no pueden ordenar ajustes contables ni girar observaciones durante la visita.", "ref": "Art. 15 · Tema 3.1.2"}, {"id": "S041", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La CNBV puede contratar auditores evitando conflictos de interés.", "a": "Art. 16", "o": ["Art. 16", "Art. 32", "Art. 34", "Art. 31"], "x": "Art. 16 (Título Segundo, De la inspección): la CNBV puede contratar auditores evitando conflictos de interés.", "ref": "Art. 16 · Tema 3.1.2"}, {"id": "S042", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Los servidores públicos deben guardar estricta reserva de la información.", "a": "Art. 17", "o": ["Art. 9", "Art. 25", "Art. 50 Bis", "Art. 17"], "x": "Art. 17 (Título Segundo, De la inspección): los servidores públicos deben guardar estricta reserva de la información.", "ref": "Art. 17 · Tema 3.1.2"}, {"id": "S043", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Requisitos del oficio de orden de visita y duración máxima de 6 meses.", "a": "Art. 20", "o": ["Art. 31", "Art. 62", "Art. 20", "Art. 39"], "x": "Art. 20 (Título Segundo, De la inspección): requisitos del oficio de orden de visita y duración máxima de 6 meses.", "ref": "Art. 20 · Tema 3.1.2"}, {"id": "S044", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La orden se notifica con al menos 2 días hábiles de anticipación.", "a": "Art. 21", "o": ["Art. 108", "Art. 21", "Art. 55", "Art. 40"], "x": "Art. 21 (Título Segundo, De la inspección): la orden se notifica con al menos 2 días hábiles de anticipación.", "ref": "Art. 21 · Tema 3.1.2"}, {"id": "S045", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Los Inspectores se identifican con credencial vigente con fotografía de la CNBV.", "a": "Art. 22", "o": ["Art. 38", "Art. 41", "Art. 21", "Art. 22"], "x": "Art. 22 (Título Segundo, De la inspección): los Inspectores se identifican con credencial vigente con fotografía de la CNBV.", "ref": "Art. 22 · Tema 3.1.2"}, {"id": "S046", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Acta de inicio y citatorio para el día hábil siguiente.", "a": "Art. 23", "o": ["Art. 64", "Art. 56", "Art. 15", "Art. 23"], "x": "Art. 23 (Título Segundo, De la inspección): acta de inicio y citatorio para el día hábil siguiente.", "ref": "Art. 23 · Tema 3.1.2"}, {"id": "S047", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Acta de constancia en cada lugar cuando la orden señala dos o más lugares.", "a": "Art. 25", "o": ["Art. 71", "Art. 25", "Art. 21", "Art. 49"], "x": "Art. 25 (Título Segundo, De la inspección): acta de constancia en cada lugar cuando la orden señala dos o más lugares.", "ref": "Art. 25 · Tema 3.1.2"}, {"id": "S048", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? En el acta de inicio, el Representante Legal designa a dos testigos; si no lo hace, los designan los Inspectores.", "a": "Art. 26", "o": ["Art. 15", "Art. 26", "Art. 52", "Art. 29"], "x": "Art. 26 (Título Segundo, De la inspección): testigos del acta de inicio. Para las actas parciales, ver art. 37.", "ref": "Art. 26 · Tema 3.1.2"}, {"id": "S049", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La visita no puede suspenderse sin autorización expresa; pueden usarse días inhábiles.", "a": "Art. 28", "o": ["Art. 5", "Art. 32", "Art. 31", "Art. 28"], "x": "Art. 28 (Título Segundo, De la inspección): la visita no puede suspenderse sin autorización expresa; pueden usarse días inhábiles.", "ref": "Art. 28 · Tema 3.1.2"}, {"id": "S050", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Acceso inmediato e irrestricto, entrevistas e informe por escrito de hechos relevantes.", "a": "Art. 29", "o": ["Art. 29", "Art. 16", "Art. 89", "Art. 52"], "x": "Art. 29 (Título Segundo, De la inspección): acceso inmediato e irrestricto, entrevistas e informe por escrito de hechos relevantes.", "ref": "Art. 29 · Tema 3.1.2"}, {"id": "S051", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La entidad proporciona espacio físico y equipo de cómputo a los Inspectores.", "a": "Art. 30", "o": ["Art. 4", "Art. 52", "Art. 30", "Art. 25"], "x": "Art. 30 (Título Segundo, De la inspección): la entidad proporciona espacio físico y equipo de cómputo a los Inspectores.", "ref": "Art. 30 · Tema 3.1.2"}, {"id": "S052", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Relación genérica de la información y documentación exhibida.", "a": "Art. 31", "o": ["Art. 30", "Art. 89", "Art. 50 Bis", "Art. 31"], "x": "Art. 31 (Título Segundo, De la inspección): relación genérica de la información y documentación exhibida.", "ref": "Art. 31 · Tema 3.1.2"}, {"id": "S053", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La información en poder de un tercero debe obtenerla la entidad.", "a": "Art. 32", "o": ["Art. 50 Bis", "Art. 32", "Art. 30", "Art. 52"], "x": "Art. 32 (Título Segundo, De la inspección): la información en poder de un tercero debe obtenerla la entidad.", "ref": "Art. 32 · Tema 3.1.2"}, {"id": "S054", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Casos en que es obligatorio levantar actas parciales.", "a": "Art. 34", "o": ["Art. 34", "Art. 22", "Art. 51", "Art. 101"], "x": "Art. 34 (Título Segundo, De la inspección): casos en que es obligatorio levantar actas parciales.", "ref": "Art. 34 · Tema 3.1.2"}, {"id": "S055", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La entidad puede desvirtuar las actas parciales hasta antes del acta de conclusión.", "a": "Art. 38", "o": ["Art. 38", "Art. 5", "Art. 71", "Art. 101"], "x": "Art. 38 (Título Segundo, De la inspección): la entidad puede desvirtuar las actas parciales hasta antes del acta de conclusión.", "ref": "Art. 38 · Tema 3.1.2"}, {"id": "S056", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Requisitos del acta de conclusión.", "a": "Art. 39", "o": ["Art. 39", "Art. 3", "Art. 10", "Art. 6"], "x": "Art. 39 (Título Segundo, De la inspección): requisitos del acta de conclusión.", "ref": "Art. 39 · Tema 3.1.2"}, {"id": "S057", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Concluida la visita no hay acta posterior; otra visita requiere nueva orden.", "a": "Art. 40", "o": ["Art. 40", "Art. 6", "Art. 15", "Art. 9"], "x": "Art. 40 (Título Segundo, De la inspección): concluida la visita no hay acta posterior; otra visita requiere nueva orden.", "ref": "Art. 40 · Tema 3.1.2"}, {"id": "S058", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Si la visita se realiza en un mismo día, su inicio y conclusión pueden constar en una misma acta.", "a": "Art. 41", "o": ["Art. 39", "Art. 50", "Art. 41", "Art. 17"], "x": "Art. 41 (Título Segundo, De la inspección): posibilidad, no obligación, de usar una sola acta, con las formalidades de los arts. 23, 24, 26 y 39.", "ref": "Art. 41 · Tema 3.1.2"}, {"id": "S059", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La vigilancia se hace mediante el análisis de la información.", "a": "Art. 43", "o": ["Art. 47", "Art. 87", "Art. 64", "Art. 43"], "x": "Art. 43 (Título Tercero, De la vigilancia): la vigilancia se hace mediante el análisis de la información.", "ref": "Art. 43 · Tema 3.1.2"}, {"id": "S060", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Información entregada por sistemas electrónicos con acuse de recibo.", "a": "Art. 45", "o": ["Art. 4", "Art. 45", "Art. 30", "Art. 48"], "x": "Art. 45 (Título Tercero, De la vigilancia): información entregada por sistemas electrónicos con acuse de recibo.", "ref": "Art. 45 · Tema 3.1.2"}, {"id": "S061", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Si la información no reúne requisitos o no es acorde con la realidad, se considera incumplida la obligación de presentarla.", "a": "Art. 48", "o": ["Art. 71", "Art. 43", "Art. 31", "Art. 48"], "x": "Art. 48 (Título Tercero, De la vigilancia): se considera no cumplida la obligación de presentar la información y procede, en su caso, la sanción.", "ref": "Art. 48 · Tema 3.1.2"}, {"id": "S062", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La CNBV puede formular observaciones y recomendaciones.", "a": "Art. 49", "o": ["Art. 41", "Art. 48", "Art. 54", "Art. 49"], "x": "Art. 49 (Título Cuarto, Observaciones y medidas correctivas): la CNBV puede formular observaciones y recomendaciones.", "ref": "Art. 49 · Tema 3.1.2"}, {"id": "S063", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Oficio de observaciones con plazo de hasta 20 días hábiles para responder.", "a": "Art. 50", "o": ["Art. 64", "Art. 50", "Art. 38", "Art. 52"], "x": "Art. 50 (Título Cuarto, Observaciones y medidas correctivas): oficio de observaciones con plazo de hasta 20 días hábiles para responder.", "ref": "Art. 50 · Tema 3.1.2"}, {"id": "S064", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Medidas precautorias con derecho de audiencia posterior.", "a": "Art. 50 Bis", "o": ["Art. 3", "Art. 87", "Art. 54", "Art. 50 Bis"], "x": "Art. 50 Bis (Título Cuarto, Observaciones y medidas correctivas): medidas precautorias con derecho de audiencia posterior.", "ref": "Art. 50 Bis · Tema 3.1.2"}, {"id": "S065", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Si no se desvirtúan las observaciones se ordenan medidas correctivas.", "a": "Art. 51", "o": ["Art. 51", "Art. 62", "Art. 49", "Art. 11"], "x": "Art. 51 (Título Cuarto, Observaciones y medidas correctivas): si no se desvirtúan las observaciones se ordenan medidas correctivas.", "ref": "Art. 51 · Tema 3.1.2"}, {"id": "S066", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Las acciones, medidas correctivas o programas de cumplimiento forzoso pueden tener por objeto corregir irregularidades o prevenir las que puedan presentarse.", "a": "Art. 52", "o": ["Art. 52", "Art. 49", "Art. 40", "Art. 62"], "x": "Art. 52, segundo párrafo (Título Cuarto, Observaciones y medidas correctivas).", "ref": "Art. 52 · Tema 3.1.2"}, {"id": "S067", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Citatorio para comparecer ante la CNBV.", "a": "Art. 55", "o": ["Art. 55", "Art. 87", "Art. 81", "Art. 59"], "x": "Art. 55 (Título Quinto, De la comparecencia): citatorio para comparecer ante la CNBV.", "ref": "Art. 55 · Tema 3.1.2"}, {"id": "S068", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La comparecencia es personalísima y no admite apoderado.", "a": "Art. 56", "o": ["Art. 58", "Art. 56", "Art. 29", "Art. 71"], "x": "Art. 56 (Título Quinto, De la comparecencia): la comparecencia es personalísima y no admite apoderado.", "ref": "Art. 56 · Tema 3.1.2"}, {"id": "S069", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Emplazamiento con 10 días hábiles para manifestar, probar y alegar.", "a": "Art. 62", "o": ["Art. 62", "Art. 52", "Art. 11", "Art. 65"], "x": "Art. 62 (Título Sexto, Emplazamiento para la imposición de sanciones): emplazamiento con 10 días hábiles para manifestar, probar y alegar.", "ref": "Art. 62 · Tema 3.1.2"}, {"id": "S070", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La prórroga del emplazamiento se da una sola vez por un periodo igual.", "a": "Art. 63", "o": ["Art. 51", "Art. 101", "Art. 63", "Art. 65"], "x": "Art. 63 (Título Sexto, Emplazamiento para la imposición de sanciones): la prórroga del emplazamiento se da una sola vez por un periodo igual.", "ref": "Art. 63 · Tema 3.1.2"}, {"id": "S071", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Si no se desvirtúa el emplazamiento, los hechos se tienen por acreditados.", "a": "Art. 64", "o": ["Art. 11", "Art. 81", "Art. 64", "Art. 65"], "x": "Art. 64 (Título Sexto, Emplazamiento para la imposición de sanciones): si no se desvirtúa el emplazamiento, los hechos se tienen por acreditados.", "ref": "Art. 64 · Tema 3.1.2"}, {"id": "S072", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La autoridad supervisora del exterior solicita por escrito a la CNBV visitar una filial con al menos 30 días naturales de anticipación.", "a": "Art. 71", "o": ["Art. 71", "Art. 101", "Art. 48", "Art. 79"], "x": "Art. 71 (Título Séptimo, Inspección, vigilancia, cooperación y asistencia internacional): supervisores del exterior piden visitar una filial con 30 días naturales de anticipación.", "ref": "Art. 71 · Tema 3.1.2"}, {"id": "S073", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La Junta de Gobierno declara la intervención administrativa o gerencial.", "a": "Art. 81", "o": ["Art. 16", "Art. 81", "Art. 89", "Art. 39"], "x": "Art. 81 (Título Octavo, De la intervención): la Junta de Gobierno declara la intervención administrativa o gerencial.", "ref": "Art. 81 · Tema 3.1.2"}, {"id": "S074", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? El acta de intervención se firma en tres ejemplares.", "a": "Art. 87", "o": ["Art. 43", "Art. 108", "Art. 94", "Art. 87"], "x": "Art. 87 (Título Octavo, De la intervención): el acta de intervención se firma en tres ejemplares.", "ref": "Art. 87 · Tema 3.1.2"}, {"id": "S075", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? El nombramiento del interventor-gerente se inscribe en el Registro Público de Comercio.", "a": "Art. 89", "o": ["Art. 25", "Art. 86", "Art. 89", "Art. 45"], "x": "Art. 89 (Título Octavo, De la intervención): el nombramiento del interventor-gerente se inscribe en el Registro Público de Comercio.", "ref": "Art. 89 · Tema 3.1.2"}, {"id": "S076", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Suspensión o clausura a quien opera sin autorización; 15 días hábiles para exponer.", "a": "Art. 101", "o": ["Art. 3", "Art. 30", "Art. 105", "Art. 101"], "x": "Art. 101 (Título Décimo, De la clausura): suspensión o clausura a quien opera sin autorización; 15 días hábiles para exponer.", "ref": "Art. 101 · Tema 3.1.2"}, {"id": "S077", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? La clausura se publica en dos periódicos de amplia circulación nacional.", "a": "Art. 105", "o": ["Art. 38", "Art. 17", "Art. 102", "Art. 105"], "x": "Art. 105 (Título Décimo, De la clausura): la clausura se publica en dos periódicos de amplia circulación nacional.", "ref": "Art. 105 · Tema 3.1.2"}, {"id": "S078", "tema": "regsup", "tipo": "memoria", "q": "¿Qué artículo lo establece? Notificaciones por medios electrónicos cuando la entidad lo acepta por escrito.", "a": "Art. 108", "o": ["Art. 4", "Art. 108", "Art. 103", "Art. 21"], "x": "Art. 108 (Título Décimo, De la clausura): notificaciones por medios electrónicos cuando la entidad lo acepta por escrito.", "ref": "Art. 108 · Tema 3.1.2"}, {"id": "S079", "tema": "regsup", "tipo": "memoria", "q": "En una visita ordinaria a un banco, ¿qué paso sigue inmediatamente después de emitir la «Orden de visita»?", "a": "Notificación", "o": ["Identificación", "Desarrollo de la revisión", "Notificación", "Acta de inicio"], "x": "Orden de visita → Notificación, con al menos 2 días hábiles de anticipación (art. 21). En visitas de investigación, y en las del 95 Bis a centros cambiarios, transmisores y SOFOM no reguladas, la notificación puede hacerse en el acto de inicio.", "ref": "Arts. 19 a 21 · Tema 3.1.2"}, {"id": "S080", "tema": "regsup", "tipo": "memoria", "q": "En una visita ordinaria a un banco, ya notificada la orden, ¿qué paso sigue inmediatamente después de la «Notificación»?", "a": "Identificación", "o": ["Informe general", "Acta de inicio", "Actas parciales", "Identificación"], "x": "Al presentarse en el lugar, los Inspectores deben identificarse previamente (art. 22). Si la orden se notifica en el acto de inicio (investigación o 95 Bis), la identificación precede a la notificación.", "ref": "Arts. 21 y 22 · Tema 3.1.2"}, {"id": "S081", "tema": "regsup", "tipo": "memoria", "q": "En la visita de inspección, ¿qué paso sigue inmediatamente después de «Identificación»?", "a": "Acta de inicio", "o": ["Acta de inicio", "Orden de visita", "Actas parciales", "Desarrollo de la revisión"], "x": "Identificación → Acta de inicio.", "ref": "Arts. 23–24 y 26 · Tema 3.1.2"}, {"id": "S082", "tema": "regsup", "tipo": "memoria", "q": "La orden de visita ordinaria a una casa de bolsa señala un solo lugar. Además del acta de inicio, ¿debe levantarse un acta de constancia de visita?", "a": "No; el acta de constancia procede cuando la orden señala dos o más lugares", "o": ["Sí; en toda visita se levanta después del acta de inicio, en el mismo lugar de la visita", "No; el acta de constancia procede cuando la orden señala dos o más lugares", "Sí, pero sólo si la visita dura más de un día", "Sólo si el Representante Legal lo solicita por escrito"], "x": "El art. 25 exige un acta de constancia en cada lugar visitado únicamente cuando la orden señala dos o más lugares. El Reglamento no la ubica como un paso fijo después del acta de inicio.", "ref": "Art. 25, primer párrafo · Tema 3.1.2"}, {"id": "S083", "tema": "regsup", "tipo": "memoria", "q": "Una visita especial se practica en la matriz y en dos sucursales de un banco. ¿Qué datos de tiempo debe contener el acta de constancia que se levante en cada sucursal?", "a": "Fecha y hora de entrada y salida en ese lugar", "o": ["Sólo la fecha de inicio de toda la visita", "Fecha y hora de entrada y salida en ese lugar", "Fecha de la orden y hora de inicio de la revisión", "Fecha y hora de conclusión de toda la visita"], "x": "El art. 25, fr. II, exige que el acta de constancia de cada lugar contenga la fecha y hora de entrada y salida. La revisión en ese lugar ocurre dentro de ese lapso.", "ref": "Art. 25, fr. II · Tema 3.1.2"}, {"id": "S084", "tema": "regsup", "tipo": "memoria", "q": "Conforme al art. 34, ¿qué carácter tiene el levantamiento de actas parciales durante la visita?", "a": "Potestativo en general y obligatorio en los casos que enumera el art. 34", "o": ["Obligatorio en toda visita, al terminar la revisión de cada lugar señalado en la orden", "Potestativo en general y obligatorio en los casos que enumera el art. 34", "Sólo procede en visitas de investigación", "Sólo procede a solicitud de la Entidad Supervisada, para asentar sus aclaraciones"], "x": "El art. 34 dice que los Inspectores «podrán» levantar actas parciales de hechos conocidos en el desarrollo de la visita, y que «deberán» hacerlo en los supuestos de las frs. I a V.", "ref": "Art. 34 · Tema 3.1.2"}, {"id": "S085", "tema": "regsup", "tipo": "memoria", "q": "Terminado el desarrollo de la revisión, con las actas parciales que en su caso se hayan levantado, ¿qué acta cierra la visita?", "a": "Acta de conclusión", "o": ["Acta de inicio", "Informe general", "Acta de conclusión", "Acta de entrega-recepción"], "x": "La visita se cierra con el acta de conclusión (art. 39), a la que se acompañan las actas de constancia y parciales que existan (fr. VIII). Levantada ésta, ya no cabe acta posterior (art. 40).", "ref": "Arts. 39 y 40 · Tema 3.1.2"}, {"id": "S086", "tema": "regsup", "tipo": "memoria", "q": "En la visita de inspección, ¿qué paso sigue inmediatamente después de «Acta de conclusión»?", "a": "Informe general", "o": ["Identificación", "Orden de visita", "Desarrollo de la revisión", "Informe general"], "x": "Acta de conclusión → Informe general del Inspector coordinador (arts. 11–14), salvo las visitas de investigación en que el art. 10 excluye el art. 11.", "ref": "Arts. 11–14 · Tema 3.1.2"}, {"id": "S088", "tema": "regsup", "tipo": "cifra", "q": "Como regla general, ¿con cuánta anticipación debe notificarse a un banco la orden de una visita ordinaria o especial?", "a": "Al menos 2 días hábiles", "o": ["Al menos 2 días hábiles", "Al menos 5 días hábiles", "Al menos 10 días naturales", "En el acto de inicio"], "x": "Art. 21: en visitas ordinarias y especiales la orden se notifica al menos 2 días hábiles antes. Excepción: a centros cambiarios, transmisores de dinero y SOFOM no reguladas, por el 95 Bis LGOAAC, puede notificarse en el acto de inicio.", "ref": "Art. 21, primer párrafo · Tema 3.1.2"}, {"id": "S089", "tema": "regsup", "tipo": "cifra", "q": "A un banco se le practicará una visita de investigación. ¿Qué permite el art. 21 respecto de la notificación de la orden de visita?", "a": "Que se notifique en el acto de inicio de la visita", "o": ["Que se notifique en el acto de inicio de la visita", "Que se notifique sólo con al menos 2 días hábiles de anticipación", "Que se notifique sólo con al menos 5 días hábiles de anticipación", "Que se notifique dentro de los 2 días hábiles posteriores al inicio"], "x": "Art. 21: en visitas de investigación la orden podrá notificarse en el acto de inicio. La anticipación mínima de 2 días hábiles es obligatoria sólo en visitas ordinarias y especiales.", "ref": "Art. 21, primer párrafo · Tema 3.1.2"}, {"id": "S091", "tema": "regsup", "tipo": "memoria", "q": "¿Cuáles son los tres tipos de visita de inspección?", "a": "Ordinarias, especiales y de investigación", "o": ["Ordinarias, especiales y de investigación", "Ordinarias, extraordinarias y de seguimiento", "Programadas, sorpresa y de investigación", "In situ, extra situ y de investigación"], "x": "Art. 5.", "ref": "Art. 5 · Tema 3.1.2"}, {"id": "S092", "tema": "regsup", "tipo": "cifra", "q": "¿Cuántos supuestos prevé el Reglamento para una visita especial?", "a": "6", "o": ["3", "4", "5", "6"], "x": "Art. 8, fracciones I a VI.", "ref": "Art. 8, frs. I a VI · Tema 3.1.2"}, {"id": "S093", "tema": "regsup", "tipo": "cifra", "q": "¿Cuántos testigos se requieren en el acta de inicio?", "a": "2", "o": ["1", "2", "3", "4"], "x": "Art. 26: los designa el Representante Legal; si no, los Inspectores.", "ref": "Art. 26, primer párrafo · Tema 3.1.2"}, {"id": "S094", "tema": "regsup", "tipo": "trampa", "q": "Durante la visita, ¿el Inspector puede girar observaciones o medidas correctivas?", "a": "No; no está facultado, sin perjuicio de pedir la información y documentación necesaria", "o": ["No; no está facultado, sin perjuicio de pedir la información y documentación necesaria", "Sí, verbalmente, cuando la irregularidad sea evidente", "Sí, mediante acta parcial firmada ante dos testigos", "Sólo si detecta incumplimientos graves y los asienta en un acta parcial firmada ante dos testigos"], "x": "Art. 15: los Inspectores no están facultados para ordenar ajustes ni girar observaciones, instrucciones o medidas correctivas durante la visita, sin perjuicio de solicitar la información y documentación necesaria. Las observaciones se comunican por oficio (art. 50).", "ref": "Art. 15 · Tema 3.1.2"}, {"id": "S095", "tema": "regsup", "tipo": "memoria", "q": "¿Qué documentos menciona el art. 22 del Reglamento como identificaciones oficiales?", "a": "Credencial para votar, cédula profesional y pasaporte", "o": ["Credencial para votar, cédula profesional y pasaporte", "Credencial para votar, licencia de conducir y pasaporte", "Sólo la credencial expedida por la CNBV", "Sólo el pasaporte vigente"], "x": "Art. 22.", "ref": "Art. 22, tercer párrafo · Tema 3.1.2"}, {"id": "S096", "tema": "regsup", "tipo": "trampa", "q": "Ya se levantó el acta de conclusión y la CNBV quiere revisar en sitio un hecho que surgió de esa visita. ¿Qué procede?", "a": "Emitir una nueva orden de visita", "o": ["Emitir una nueva orden de visita", "Levantar un acta complementaria", "Levantar un acta parcial posterior", "Agregarlo al informe parcial"], "x": "Art. 40: concluida la visita no puede levantarse acta posterior alguna. Otra visita requiere nueva orden, aun con el mismo objeto o si deriva de la anterior.", "ref": "Art. 40 · Tema 3.1.2"}, {"id": "S097", "tema": "regsup", "tipo": "cifra", "q": "Dentro de la visita, ¿hasta cuándo puede la entidad desvirtuar lo asentado en actas parciales?", "a": "Hasta antes del acta de conclusión", "o": ["Hasta antes del acta de conclusión", "20 días hábiles después de la visita", "10 días hábiles después del acta parcial", "Hasta que reciba el emplazamiento"], "x": "Art. 38: dentro de la visita, hasta antes del levantamiento del acta de conclusión, dejando constancia en acta parcial (art. 34, fr. IV). Fuera de la visita quedan a salvo el oficio de observaciones (Título Cuarto) y el emplazamiento (Título Sexto), según el segundo párrafo del art. 38.", "ref": "Art. 38, primer párrafo · Tema 3.1.2"}, {"id": "S098", "tema": "regsup", "tipo": "memoria", "q": "¿Quién debe elaborar el informe general de la visita?", "a": "En el Inspector que coordina la visita", "o": ["En el Inspector que coordina la visita", "En el Representante Legal o Apoderado de la entidad", "En el servidor público que emitió la orden de visita", "En el auditor externo contratado por la CNBV"], "x": "Arts. 11 y 12: el informe general lo elabora el Inspector coordinador, sin intervención del personal de la entidad, y da a conocer los hechos al servidor público competente de la CNBV.", "ref": "Arts. 11 y 12 · Tema 3.1.2"}, {"id": "S099", "tema": "regsup", "tipo": "cifra", "q": "Como regla general, ¿de cuántos días hábiles es, como máximo, el plazo para responder un oficio de observaciones?", "a": "Hasta 20 días hábiles", "o": ["Hasta 10 días hábiles", "Hasta 15 días hábiles", "Hasta 20 días hábiles", "Hasta 30 días naturales"], "x": "Art. 50, fr. VII: plazo máximo de 20 días hábiles, que podrá ser de 3 días hábiles en las irregularidades de los incisos a) a d).", "ref": "Art. 50, fr. VII · Tema 3.1.2"}, {"id": "S100", "tema": "regsup", "tipo": "cifra", "q": "Para observaciones por incumplir requerimientos de capitalización, ¿qué plazo reducido permite fijar el art. 50 para que la entidad manifieste lo que a su derecho corresponda?", "a": "3 días hábiles", "o": ["3 días hábiles", "3 días naturales", "5 días naturales", "24 horas"], "x": "Art. 50, fr. VII, inc. b): en lugar del plazo máximo general de 20 días hábiles, podrá fijarse uno de 3 días hábiles. En los incisos a) a d) no procede la prórroga del penúltimo párrafo.", "ref": "Art. 50, fr. VII, segundo párrafo, inc. b) · Tema 3.1.2"}, {"id": "S101", "tema": "regsup", "tipo": "cifra", "q": "Salvo los supuestos del art. 50 que admiten plazo reducido de 3 días hábiles, ¿cuál es la prórroga máxima del plazo para responder observaciones?", "a": "10 días hábiles", "o": ["5 días hábiles", "10 días hábiles", "20 días hábiles", "Un periodo igual al original"], "x": "Art. 50.", "ref": "Art. 50, penúltimo párrafo · Tema 3.1.2"}, {"id": "S102", "tema": "regsup", "tipo": "cifra", "q": "¿Plazo para responder un emplazamiento?", "a": "10 días hábiles", "o": ["3 días hábiles", "10 días hábiles", "15 días hábiles", "20 días hábiles"], "x": "Art. 62.", "ref": "Art. 62, primer párrafo · Tema 3.1.2"}, {"id": "S103", "tema": "regsup", "tipo": "cifra", "q": "¿Cómo se prorroga el plazo del emplazamiento?", "a": "Una sola vez, hasta por un periodo igual", "o": ["Una sola vez, hasta por un periodo igual", "Dos veces, por 5 días hábiles cada una", "No admite prórroga", "Las veces que la CNBV estime"], "x": "Art. 63.", "ref": "Art. 63 · Tema 3.1.2"}, {"id": "S106", "tema": "regsup", "tipo": "memoria", "q": "¿Quién declara la intervención de una Entidad Supervisada?", "a": "La Junta de Gobierno de la CNBV", "o": ["La Junta de Gobierno de la CNBV", "El Presidente de la CNBV", "La SHCP", "El Inspector coordinador"], "x": "Art. 81; el Presidente designa al interventor (art. 82).", "ref": "Arts. 81 y 82 · Tema 3.1.2"}, {"id": "S107", "tema": "regsup", "tipo": "cifra", "q": "¿En cuántos ejemplares se firma el acta de la diligencia de intervención?", "a": "3", "o": ["1", "2", "3", "4"], "x": "Art. 87: un ejemplar para el funcionario o empleado que atiende la diligencia, otro para la CNBV y otro para el interventor. Las actas de inicio, constancia, parciales, conclusión y clausura se firman en 2 (arts. 24, 25, 35, 36, 39 y 104).", "ref": "Art. 87, primer párrafo · Tema 3.1.2"}, {"id": "S108", "tema": "regsup", "tipo": "cifra", "q": "Tras una clausura, ¿qué plazo tiene el interesado para exponer lo que a su derecho convenga?", "a": "15 días hábiles", "o": ["10 días hábiles", "15 días hábiles", "20 días hábiles", "30 días naturales"], "x": "Art. 101.", "ref": "Art. 101, segundo párrafo · Tema 3.1.2"}, {"id": "S109", "tema": "regsup", "tipo": "memoria", "q": "¿Cómo se hace pública una clausura?", "a": "Avisos en el exterior y publicación en dos periódicos de circulación nacional", "o": ["Avisos en el exterior y publicación en dos periódicos de circulación nacional", "Publicación en el DOF y notificación personal a los clientes del establecimiento", "Aviso en la página de internet de la CNBV y en el Registro Público de Comercio", "Avisos en el exterior y publicación en un periódico de circulación local"], "x": "Art. 105.", "ref": "Art. 105 · Tema 3.1.2"}, {"id": "S110", "tema": "regsup", "tipo": "cifra", "q": "¿Qué porcentaje del capital de otra sociedad deben representar, por lo menos, las acciones con derecho a voto de que sea propietaria una sociedad para configurar, por sí solo, uno de los supuestos de control del art. 70?", "a": "51%", "o": ["25%", "33%", "40%", "51%"], "x": "Art. 70, fr. VI, último párrafo: acciones con derecho a voto que representen por lo menos el 51% del capital. No es el único supuesto de control: también hay control con poder decisorio en asambleas, al nombrar a la mayoría del órgano de administración o por cualquier otro medio.", "ref": "Art. 70, fr. VI, último párrafo · Tema 3.1.2"}, {"id": "S111", "tema": "regsup", "tipo": "memoria", "q": "¿Respecto de qué cumplimiento regula el Reglamento la supervisión de centros cambiarios, transmisores de dinero y SOFOM no reguladas?", "a": "Exclusivamente de los preceptos del art. 95 Bis de la LGOAAC y las disposiciones generales que de él deriven", "o": ["De todos los preceptos de la LGOAAC y de la Ley de la CNBV que les resulten aplicables", "Del art. 115 de la Ley de Instituciones de Crédito y de las disposiciones de carácter general que de él deriven", "De las disposiciones de solvencia, liquidez y estabilidad previstas en la LGOAAC", "Exclusivamente de los preceptos del art. 95 Bis de la LGOAAC y las disposiciones generales que de él deriven"], "x": "El Reglamento acota la supervisión de estos tres sujetos al cumplimiento del art. 95 Bis de la LGOAAC y sus disposiciones de carácter general (materia PLD/FT).", "ref": "Art. 1, segundo párrafo; Art. 2, segundo párrafo · Tema 3.1.2"}, {"id": "S112", "tema": "regsup", "tipo": "caso", "q": "En una visita, la CNBV examina cómo está organizado un banco, cómo operan sus áreas y qué controles tiene para prevenir operaciones con recursos de procedencia ilícita. ¿Qué fracción del art. 4 ejerce?", "a": "Fracción I", "o": ["Fracción IV", "Fracción V", "Fracción II", "Fracción I"], "x": "La fr. I del art. 4 faculta a la CNBV a revisar, verificar, comprobar y evaluar operaciones, organización, funcionamiento, procesos y sistemas de control interno, de riesgos y de información.", "ref": "Art. 4, fr. I · Tema 3.1.2"}, {"id": "S113", "tema": "regsup", "tipo": "caso", "q": "Inspectores llegan sin aviso previo a un transmisor de dinero para iniciar una visita ordinaria de PLD/FT y ahí le notifican la orden. El transmisor alega que debieron avisarle con 2 días hábiles. ¿Tiene razón?", "a": "No; para verificar el art. 95 Bis LGOAAC, su orden puede notificarse en el acto de inicio de la visita", "o": ["Sí, salvo que la CNBV reclasifique la visita como de investigación antes de iniciarla", "No; para verificar el art. 95 Bis LGOAAC, su orden puede notificarse en el acto de inicio de la visita", "Sí; en toda visita ordinaria, sin importar la entidad, la orden se notifica al menos 2 días hábiles antes", "No; para cualquier entidad basta notificar la orden con 1 día hábil de anticipación"], "x": "Para centros cambiarios, transmisores de dinero y SOFOM no reguladas, en visitas ordinarias, especiales y de investigación sobre el art. 95 Bis LGOAAC, la orden podrá notificarse en el acto de inicio.", "ref": "Art. 21, segundo párrafo · Tema 3.1.2"}, {"id": "S114", "tema": "regsup", "tipo": "caso", "q": "Una SOFOM no regulada pregunta en cuál de las definiciones del art. 3 del Reglamento queda comprendida para efectos de su supervisión en PLD/FT.", "a": "En «Entidades Supervisadas», únicamente respecto del art. 95 Bis de la LGOAAC", "o": ["En «Personas», únicamente respecto del art. 95 Bis de la LGOAAC", "En «Entidades Supervisadas», únicamente respecto del art. 95 Bis de la LGOAAC", "En «Entidades Supervisadas», respecto de todas las materias de la LGOAAC", "En «Personas», respecto de todas las operaciones de crédito que celebre"], "x": "El segundo párrafo de la fr. II del art. 3 incluye a las SOFOM no reguladas en «Entidades Supervisadas», sólo para verificar el art. 95 Bis LGOAAC y disposiciones derivadas.", "ref": "Art. 3, fr. II, segundo párrafo · Tema 3.1.2"}, {"id": "S115", "tema": "regsup", "tipo": "caso", "q": "Los Inspectores llegan al domicilio de una casa de bolsa para iniciar la visita, pero su Representante Legal o Apoderado no está presente. ¿Qué procede?", "a": "Dejar citatorio con cualquier persona del domicilio para que espere a hora fija del día hábil siguiente", "o": ["Iniciar de inmediato la visita con cualquier persona que se encuentre en el domicilio, sin dejar citatorio", "Dejar citatorio con cualquier persona para que espere dentro de 2 días hábiles", "Levantar acta circunstanciada y emitir una nueva orden de visita con otra fecha", "Dejar citatorio con cualquier persona del domicilio para que espere a hora fija del día hábil siguiente"], "x": "Si la visita no puede iniciarse por no estar el Representante Legal o Apoderado, se deja citatorio con cualquier persona en el domicilio para que espere a una hora fija del día hábil siguiente.", "ref": "Art. 23, penúltimo párrafo · Tema 3.1.2"}, {"id": "S116", "tema": "regsup", "tipo": "memoria", "q": "Según el art. 1 del Reglamento, ¿cómo se ejerce la supervisión respecto de las entidades que conforman un grupo financiero?", "a": "De manera consolidada y basada en la medición de riesgos", "o": ["De manera consolidada, pero sólo respecto de la sociedad controladora", "De manera individual y basada en el programa anual de visitas", "De manera consolidada y basada en la medición de riesgos", "De manera individual por cada entidad y basada en su tamaño"], "x": "El art. 1 dispone que la supervisión se ejercerá de manera consolidada respecto de las entidades de un grupo financiero y estará basada en la medición de riesgos.", "ref": "Art. 1, tercer párrafo · Tema 3.1.2"}, {"id": "S117", "tema": "regsup", "tipo": "trampa", "q": "Un juez ordena asegurar cuentas y la CNBV practica una visita de investigación para agilizar su cumplimiento. ¿Qué artículos del Reglamento NO son aplicables a esa visita?", "a": "Los arts. 11 y 31 (informe general y relación genérica de documentación)", "o": ["Los arts. 39 y 40 (acta de conclusión y prohibición de acta posterior)", "Los arts. 26 y 37 (designación y sustitución de testigos)", "Los arts. 21 y 23 (notificación de la orden y acta de inicio)", "Los arts. 11 y 31 (informe general y relación genérica de documentación)"], "x": "Para visitas de investigación que recaban información pedida por autoridades o agilizan aseguramientos o desbloqueos, el art. 10 excluye expresamente lo señalado en los arts. 11 y 31.", "ref": "Art. 10, segundo y tercer párrafos · Tema 3.1.2"}, {"id": "S118", "tema": "regsup", "tipo": "caso", "q": "Durante la visita, un Inspector detecta reservas insuficientes y pide al contador de la entidad registrar en ese momento un castigo contable. ¿Es procedente?", "a": "No; los Inspectores no están facultados para ordenar ajustes, castigos ni movimientos contables en la visita", "o": ["Sí, siempre que lo haga constar en un acta parcial firmada por testigos", "No; los Inspectores no están facultados para ordenar ajustes, castigos ni movimientos contables en la visita", "Sí, si cuenta con el visto bueno del Inspector encargado de coordinar la visita", "Sí, pero sólo cuando el hecho implique un incumplimiento grave a juicio del Inspector y lo asiente en acta parcial"], "x": "El art. 15 niega a los Inspectores la facultad de ordenar ajustes, castigos y demás movimientos contables en el curso de la visita; sí pueden pedir la exhibición de información.", "ref": "Art. 15 · Tema 3.1.2"}, {"id": "S119", "tema": "regsup", "tipo": "memoria", "q": "Para el ejercicio de la inspección, ¿qué tipos de información y documentación puede obtener la CNBV conforme al último párrafo del art. 4?", "a": "Contable, legal, económica, financiera y administrativa", "o": ["Legal, fiscal y patrimonial de los accionistas", "Contable y financiera, exclusivamente", "Contable, legal, económica, financiera y administrativa", "Financiera, fiscal, laboral y de mercado"], "x": "El art. 4 permite a la CNBV obtener la información y documentación contable, legal, económica, financiera y administrativa necesaria.", "ref": "Art. 4, último párrafo · Tema 3.1.2"}, {"id": "S120", "tema": "regsup", "tipo": "caso", "q": "Al llegar al domicilio de una SOFOM regulada para dejar citatorio, los Inspectores encuentran el local cerrado. ¿Con quién deben dejar el citatorio?", "a": "Con el vecino más inmediato", "o": ["Con el Representante Legal, en su domicilio particular", "Con el primer empleado que llegue al día hábil siguiente", "Con el vecino más inmediato", "Con el personal de seguridad del edificio o plaza comercial"], "x": "Si el local ubicado en el domicilio se encuentra cerrado, el citatorio se deja con el vecino más inmediato.", "ref": "Art. 23, penúltimo párrafo · Tema 3.1.2"}, {"id": "S121", "tema": "regsup", "tipo": "memoria", "q": "Conforme al art. 7, ¿qué debe atender la frecuencia con que el programa anual prevé las visitas ordinarias?", "a": "La experiencia y necesidades, los resultados de la vigilancia y la suficiencia presupuestal de la CNBV", "o": ["Las solicitudes de visita que presenten las propias Entidades Supervisadas al inicio de cada ejercicio", "Un calendario fijo de una visita por año para cada Entidad Supervisada", "La experiencia y necesidades, los resultados de la vigilancia y la suficiencia presupuestal de la CNBV", "El monto de activos, el número de sucursales y el nivel de capitalización de cada una de las Entidades Supervisadas"], "x": "El programa contemplará que las visitas ordinarias se practiquen con la frecuencia que la experiencia y necesidades ameriten, atendiendo a los resultados de la vigilancia y a la suficiencia presupuestal.", "ref": "Art. 7 · Tema 3.1.2"}, {"id": "S122", "tema": "regsup", "tipo": "trampa", "q": "¿Cuál de estos sujetos NO queda comprendido en la definición de «Entidades Supervisadas» del art. 3 del Reglamento?", "a": "Transmisor de dinero", "o": ["Federación a que se refiere la Ley de Ahorro y Crédito Popular", "Oficina de representación de entidad financiera del exterior", "Sociedad financiera de objeto múltiple no regulada", "Transmisor de dinero"], "x": "Transmisores de dinero y centros cambiarios quedan en «Personas» (fr. V) y las SOFOM no reguladas en «Entidades Supervisadas» (fr. II), en ambos casos sólo para verificar el art. 95 Bis LGOAAC.", "ref": "Art. 3, frs. II y V · Tema 3.1.2"}, {"id": "S123", "tema": "regsup", "tipo": "caso", "q": "Un banco se fusiona con otra institución a mitad del año, lo que modifica su situación legal y financiera. La CNBV quiere visitarlo antes del siguiente programa anual. ¿Con qué fundamento?", "a": "Visita especial por cambios en su situación contable, legal, económica, financiera o administrativa", "o": ["Visita ordinaria, adelantando la del programa anual del año siguiente", "Visita especial por cambios en su situación contable, legal, económica, financiera o administrativa", "Visita especial por derivar de la cooperación internacional prevista en el Título Séptimo del Reglamento", "Visita de investigación por indicios de una conducta contraria a la ley"], "x": "El art. 8, fr. III, prevé visitas especiales cuando se presenten cambios o modificaciones en la situación contable, legal, económica, financiera o administrativa de una Entidad Supervisada.", "ref": "Art. 8, fr. III · Tema 3.1.2"}, {"id": "S124", "tema": "regsup", "tipo": "caso", "q": "Durante la visita, el director de cumplimiento pide participar en la redacción del informe general «para evitar malentendidos». ¿Qué prevé el Reglamento?", "a": "No puede intervenir, aunque en el informe general pueden considerarse las aclaraciones que haya hecho valer", "o": ["Puede redactar un anexo que la CNBV debe integrar al informe general como parte de él", "Puede revisar y firmar el borrador del informe antes de que se entregue a la CNBV", "No puede intervenir, aunque en el informe general pueden considerarse las aclaraciones que haya hecho valer", "Puede intervenir en la redacción si el Inspector coordinador lo autoriza por escrito y lo asienta en un acta parcial"], "x": "En la preparación de los informes no interviene el personal de la entidad, sin perjuicio de considerar en el informe general las aclaraciones y argumentos que ésta hubiere hecho valer.", "ref": "Art. 11, segundo párrafo · Tema 3.1.2"}, {"id": "S125", "tema": "regsup", "tipo": "caso", "q": "Durante una visita de investigación a una persona que capta recursos sin autorización, el encargado del local cierra la puerta e impide el paso a los Inspectores. ¿Qué puede hacer la CNBV?", "a": "Solicitar el auxilio de la fuerza pública", "o": ["Suspender la visita y emitir una nueva orden con 2 días hábiles de aviso", "Clausurar en ese acto el establecimiento sin mayor trámite", "Imponer en el acto una multa por obstaculizar la diligencia", "Solicitar el auxilio de la fuerza pública"], "x": "Para el adecuado desarrollo de las visitas de investigación, la CNBV podrá solicitar el auxilio de la fuerza pública cuando se impida u obstaculice la visita o haya elementos para presumirlo.", "ref": "Art. 10, último párrafo · Tema 3.1.2"}, {"id": "S126", "tema": "regsup", "tipo": "caso", "q": "Al día hábil siguiente de dejado el citatorio, el Representante Legal de la entidad visitada no se presenta a la hora fijada. ¿Qué procede?", "a": "Entender la visita con cualquier persona que se encuentre y hacerlo constar en el acta de inicio", "o": ["Entender la visita con el vecino más inmediato y hacerlo constar en el acta de inicio", "Entender la visita con cualquier persona que se encuentre y hacerlo constar en el acta de inicio", "Suspender la visita, levantar acta circunstanciada y emitir una nueva orden de visita", "Dejar un segundo citatorio para el día hábil siguiente y asentarlo en acta circunstanciada"], "x": "Si el Representante Legal o Apoderado no atiende el citatorio, la visita se entenderá con cualquier persona que se encuentre, circunstancia que se hace constar en el acta de inicio.", "ref": "Art. 23, último párrafo · Tema 3.1.2"}, {"id": "S127", "tema": "regsup", "tipo": "memoria", "q": "¿Qué finalidad asigna el art. 43 del Reglamento a la función de vigilancia?", "a": "Evaluar el apego a la normatividad y la estabilidad y correcto funcionamiento de las Entidades Supervisadas", "o": ["Dar seguimiento a las medidas correctivas ordenadas, mediante actas parciales y de conclusión levantadas en visitas", "Imponer sanciones por los incumplimientos detectados durante las visitas", "Evaluar el apego a la normatividad y la estabilidad y correcto funcionamiento de las Entidades Supervisadas", "Comprobar en las instalaciones de la entidad su liquidez y solvencia mediante visitas"], "x": "La vigilancia analiza la información que obtiene la CNBV para evaluar el apego a la normatividad y la estabilidad y correcto funcionamiento de las Entidades Supervisadas.", "ref": "Art. 43, primer párrafo · Tema 3.1.2"}, {"id": "S128", "tema": "regsup", "tipo": "caso", "q": "La orden de visita a un banco señala como lugar de la visita su centro de datos, ubicado en un domicilio distinto al social. ¿Debe la orden incluir también el domicilio del banco?", "a": "Sí; el domicilio se indica con independencia de que sea o no el lugar donde se efectúe la visita", "o": ["Sí; el domicilio se indica con independencia de que sea o no el lugar donde se efectúe la visita", "Sólo si se trata de una visita de investigación", "Sólo si el banco no tiene registrado su domicilio ante la CNBV", "No; basta con señalar el lugar o lugares donde se practicará la visita, aunque sean distintos del domicilio"], "x": "La fr. VII del art. 20 exige el domicilio de la entidad con independencia de que se trate o no del lugar o lugares donde se efectuará la visita.", "ref": "Art. 20, fr. VII · Tema 3.1.2"}, {"id": "S129", "tema": "regsup", "tipo": "caso", "q": "En un acta de inicio firman el Inspector coordinador y dos de los seis Inspectores autorizados en la orden. La entidad alega que el acta es inválida. ¿Tiene razón?", "a": "No; no es necesario que todos los Inspectores autorizados en la orden suscriban el acta de inicio", "o": ["No; no es necesario que todos los Inspectores autorizados en la orden suscriban el acta de inicio", "Sí; deben firmar el acta todos los Inspectores autorizados en la orden de visita, además de los testigos", "No, pero debe levantarse un acta parcial para subsanar la omisión", "Sí, porque debe firmar al menos la mitad de los Inspectores autorizados"], "x": "La fr. V del art. 23 señala que no será necesario que todos los Inspectores autorizados en la orden suscriban el acta de inicio.", "ref": "Art. 23, fr. V · Tema 3.1.2"}, {"id": "S130", "tema": "regsup", "tipo": "trampa", "q": "¿Cuál de los siguientes supuestos NO está previsto en el art. 8 para ordenar una visita especial?", "a": "Que la propia entidad solicite ser visitada para acreditar su cumplimiento", "o": ["Hechos no contemplados en el programa anual que, a juicio de la CNBV, la motiven", "Que una Entidad Supervisada inicie operaciones después de elaborado el programa anual", "Que la propia entidad solicite ser visitada para acreditar su cumplimiento", "Dar seguimiento a los resultados obtenidos en una visita de inspección"], "x": "El art. 8 prevé seis supuestos (situaciones especiales operativas, seguimiento, cambios, inicio de operaciones, hechos no contemplados y cooperación internacional); la solicitud de la entidad no es uno de ellos.", "ref": "Art. 8 · Tema 3.1.2"}, {"id": "S131", "tema": "regsup", "tipo": "memoria", "q": "¿Qué debe hacer del conocimiento el Inspector coordinador al Representante Legal que atiende la visita y a las personas que participen en ella?", "a": "De las penas en que incurren quienes declaran falsamente ante autoridad distinta de la judicial", "o": ["De las sanciones por no atender el citatorio dejado el día hábil anterior", "De las penas en que incurren quienes declaran falsamente ante autoridad distinta de la judicial", "De su derecho a abstenerse de firmar cualquier acta de la visita", "De las multas en que incurre la entidad por no proporcionar espacio físico y equipo de cómputo a los Inspectores"], "x": "El art. 24 obliga al Inspector coordinador a informar las penas por declarar falsamente ante autoridad distinta de la judicial en ejercicio de sus atribuciones.", "ref": "Art. 24, primer párrafo · Tema 3.1.2"}, {"id": "S132", "tema": "regsup", "tipo": "caso", "q": "Un centro cambiario consulta en qué definición del art. 3 del Reglamento queda comprendido cuando la CNBV verifica su cumplimiento del art. 95 Bis de la LGOAAC.", "a": "En «Personas», exclusivamente respecto de esa supervisión", "o": ["En «Entidades Supervisadas», exclusivamente respecto de esa supervisión", "En «Entidades Supervisadas», respecto de todas sus operaciones cambiarias", "En «Personas», respecto de todas sus operaciones cambiarias", "En «Personas», exclusivamente respecto de esa supervisión"], "x": "El segundo párrafo de la fr. V del art. 3 incluye a centros cambiarios y transmisores de dinero en «Personas», exclusivamente para verificar el art. 95 Bis LGOAAC.", "ref": "Art. 3, fr. V, segundo párrafo · Tema 3.1.2"}, {"id": "S133", "tema": "regsup", "tipo": "caso", "q": "En plena diligencia, uno de los dos testigos del acta avisa que se retira porque ya no desea ser testigo. ¿Qué procede?", "a": "El Representante designa otro de inmediato; ante negativa o impedimento del designado, podrán hacerlo los Inspectores", "o": ["Se continúa con un solo testigo, asentando la circunstancia y su causa en el acta", "El acta pierde validez y debe levantarse de nuevo al día hábil siguiente, con dos testigos que permanezcan hasta el final", "El Representante designa otro de inmediato; ante negativa o impedimento del designado, podrán hacerlo los Inspectores", "Los Inspectores designan al sustituto sin dar intervención al Representante, y lo asientan"], "x": "Los testigos pueden sustituirse en cualquier tiempo, entre otras causas, por manifestar su voluntad de dejar de serlo. El Representante designa otro y, ante la negativa o impedimento del designado, los Inspectores podrán designarlo. Se hace constar en el acta sin afectar su validez.", "ref": "Art. 26, segundo párrafo · Tema 3.1.2"}, {"id": "S134", "tema": "regsup", "tipo": "caso", "q": "La CNBV revisa sólo una selección aleatoria de expedientes de clientes de una institución de crédito, en lugar de la totalidad. La institución alega que eso no está previsto. ¿Tiene razón?", "a": "No; la supervisión puede realizarse mediante muestras representativas y aleatorias de la información", "o": ["Sí; la supervisión debe abarcar la totalidad de la información de la entidad", "Sí, salvo que se trate de una visita de investigación ordenada por la Junta de Gobierno", "No; la supervisión puede realizarse mediante muestras representativas y aleatorias de la información", "No, pero sólo si la entidad lo solicitó previamente por escrito"], "x": "El art. 1 (y los arts. 4 y 43) permiten ejercer la supervisión mediante el análisis de muestras representativas y aleatorias de información, documentación, sistemas o equipos.", "ref": "Art. 1, cuarto párrafo · Tema 3.1.2"}, {"id": "S135", "tema": "regsup", "tipo": "caso", "q": "La visita tiene lugar en un solo local. Los Inspectores quieren trabajar sábado y domingo para cumplir en tiempo, aunque la entidad no labora esos días. ¿Pueden hacerlo?", "a": "Sí; pueden actuar en días y horas inhábiles cuando lo estimen necesario para cumplir sus funciones", "o": ["No; siempre deben apegarse estrictamente al horario de la entidad visitada", "Sí; pueden actuar en días y horas inhábiles cuando lo estimen necesario para cumplir sus funciones", "Sólo si la entidad lo autoriza por escrito y la circunstancia se asienta en un acta parcial de la visita", "Sólo en visitas de investigación, nunca en ordinarias o especiales"], "x": "Aunque deben apegarse al horario de la entidad, el art. 28 permite a los Inspectores actuar en días y horas inhábiles cuando lo estimen necesario.", "ref": "Art. 28, primer párrafo · Tema 3.1.2"}, {"id": "S136", "tema": "regsup", "tipo": "caso", "q": "Un auditor externo contratado por la CNBV para auxiliar en la visita llega a la entidad. ¿Con qué debe identificarse?", "a": "Con identificación oficial vigente con fotografía y el documento de acreditación de su empresa o institución", "o": ["Con identificación oficial vigente con fotografía y el documento de acreditación de su empresa o institución", "Con credencial vigente con fotografía expedida por la CNBV y el oficio de comisión firmado por el Inspector coordinador", "Con identificación oficial y el convenio de confidencialidad firmado con la entidad", "Sólo con su cédula profesional de contador público"], "x": "Los auditores y profesionistas contratados deben presentar identificación oficial vigente con fotografía y el documento de acreditación expedido por la empresa o institución correspondiente.", "ref": "Art. 22, segundo párrafo · Tema 3.1.2"}, {"id": "S137", "tema": "regsup", "tipo": "caso", "q": "Los expedientes digitales de clientes de una SOFOM regulada están alojados en un proveedor de servicios en la nube. Los Inspectores los requieren y la SOFOM responde que «lo pidan al proveedor». ¿Qué prevé el Reglamento?", "a": "La SOFOM está obligada a solicitar y obtener la información del tercero para entregarla a los Inspectores", "o": ["La SOFOM queda liberada si exhibe el contrato celebrado con el proveedor y le notifica el requerimiento", "La SOFOM está obligada a solicitar y obtener la información del tercero para entregarla a los Inspectores", "Los Inspectores deben requerir la información directamente al proveedor, mediante oficio de la CNBV dirigido a éste", "La información se tiene por no exhibida sin mayor trámite"], "x": "Si la información está almacenada, custodiada o resguardada por un tercero, la entidad está obligada a solicitarla y obtenerla para su entrega a los Inspectores.", "ref": "Art. 32, primer párrafo · Tema 3.1.2"}, {"id": "S138", "tema": "regsup", "tipo": "caso", "q": "Durante la visita, el Inspector detecta que el banco dejó de reportar de forma sistemática operaciones inusuales, lo que a su juicio implica un incumplimiento grave. ¿Qué debe hacer?", "a": "Levantar un acta parcial", "o": ["Levantar de inmediato el acta de conclusión de la visita", "Levantar un acta parcial", "Girar al oficial de cumplimiento una instrucción correctiva por escrito", "Consignarlo únicamente en el informe general al terminar la visita"], "x": "Los Inspectores deben levantar acta parcial cuando conozcan hechos, actos u omisiones que, a su juicio, puedan implicar incumplimientos graves.", "ref": "Art. 34, fr. I · Tema 3.1.2"}, {"id": "S139", "tema": "regsup", "tipo": "caso", "q": "Una institución de crédito debe entregar un reporte periódico a la CNBV y la disposición aplicable no señala forma de entrega. ¿Por qué medio debe presentarlo?", "a": "A través de la oficialía de partes de la CNBV", "o": ["Por correo electrónico al supervisor asignado a la institución", "A los Inspectores, en la siguiente visita ordinaria", "A través de la oficialía de partes de la CNBV", "Por el medio electrónico que elija la propia institución"], "x": "La información debe entregarse a través de la oficialía de partes de la CNBV cuando las leyes o disposiciones aplicables no establezcan otra forma de entrega.", "ref": "Art. 44 · Tema 3.1.2"}, {"id": "S140", "tema": "regsup", "tipo": "cifra", "q": "¿Cuántos requisitos enumera el art. 20 del Reglamento para el oficio que contiene la orden de visita?", "a": "10", "o": ["8", "10", "9", "6"], "x": "Además de estar fundado y motivado, el oficio de orden de visita debe cumplir diez requisitos (frs. I a X).", "ref": "Art. 20, frs. I a X · Tema 3.1.2"}, {"id": "S141", "tema": "regsup", "tipo": "caso", "q": "La orden de visita especial a un banco se lleva a cabo en su matriz y en dos sucursales. Además del acta de inicio, ¿qué actas deben levantarse por los lugares?", "a": "Un acta de constancia de visita en cada uno de los lugares visitados", "o": ["Un acta de inicio independiente en cada uno de los tres lugares", "Una sola acta de inicio que comprenda los tres lugares, sin actas adicionales", "Un acta parcial obligatoria por cada sucursal visitada", "Un acta de constancia de visita en cada uno de los lugares visitados"], "x": "Cuando la orden señala dos o más lugares, además del acta de inicio se levanta un acta de constancia de visita en cada uno de los lugares visitados.", "ref": "Art. 25, primer párrafo · Tema 3.1.2"}, {"id": "S142", "tema": "regsup", "tipo": "memoria", "q": "¿A quién da a conocer el informe general, una vez concluida la visita, los hechos, actos u omisiones conocidos por el Inspector coordinador?", "a": "Al servidor público de la CNBV competente para conocer de la visita", "o": ["Al servidor público de la CNBV competente para conocer de la visita", "Al pleno de la Junta de Gobierno de la CNBV, para su resolución", "Al comité de auditoría de la entidad visitada, para su atención", "Al consejo de administración de la entidad, con copia al director general"], "x": "El informe general tiene por objeto hacer del conocimiento del servidor público competente de la CNBV los hechos que el Inspector coordinador conoció durante la visita.", "ref": "Art. 12 · Tema 3.1.2"}, {"id": "S143", "tema": "regsup", "tipo": "caso", "q": "El Representante Legal de la entidad se niega a firmar el acta de inicio y a recibir su ejemplar. ¿Qué efecto tiene?", "a": "Se asienta en el acta, sin que ello afecte su validez y valor probatorio", "o": ["Se asienta en el acta, sin que ello afecte su validez y valor probatorio", "El acta carece de valor probatorio y debe levantarse de nuevo", "Se suspende la visita hasta que el Representante firme el acta", "Debe firmar en su lugar uno de los testigos designados"], "x": "La negativa a firmar o a recibir el ejemplar se asienta en la propia acta sin afectar su validez y valor probatorio.", "ref": "Art. 24, último párrafo · Tema 3.1.2"}, {"id": "S144", "tema": "regsup", "tipo": "caso", "q": "A mitad de la visita, un empleado de la entidad dice que los correos electrónicos y las grabaciones telefónicas «no son documentación» y se niega a mostrarlos. ¿Qué prevé el Reglamento?", "a": "Sí forman parte: la documentación incluye correspondencia y archivos magnéticos, digitalizados o grabados", "o": ["Sólo forman parte si están impresos y firmados por un funcionario", "Sí forman parte: la documentación incluye correspondencia y archivos magnéticos, digitalizados o grabados", "Sólo forman parte si la orden de visita los enumera expresamente en la relación de información inicial", "No forman parte: la documentación sólo comprende libros de actas, registros y auxiliares contables impresos"], "x": "El art. 29 comprende, de manera enunciativa, informes, registros, libros de actas, correspondencia, sistemas automatizados y archivos magnéticos, digitalizados o grabados.", "ref": "Art. 29, segundo párrafo · Tema 3.1.2"}, {"id": "S145", "tema": "regsup", "tipo": "memoria", "q": "Además de los Inspectores, ¿a quiénes debe nombrar la orden de visita, en su caso, conforme a la fr. IX del art. 20?", "a": "A los auditores y profesionistas acreditados por la CNBV y a los servidores de otras autoridades financieras", "o": ["A los testigos de asistencia y al Representante Legal o Apoderado que atenderá la visita en la entidad", "Al oficial de cumplimiento y al auditor interno de la entidad que atenderán la visita", "A los empleados de la entidad que apoyarán a los Inspectores durante la visita", "A los auditores y profesionistas acreditados por la CNBV y a los servidores de otras autoridades financieras"], "x": "La fr. IX exige el nombre de los Inspectores (indicando al coordinador) y, en su caso, de auditores y profesionistas acreditados y de servidores públicos de las autoridades del art. 18.", "ref": "Art. 20, fr. IX · Tema 3.1.2"}, {"id": "S146", "tema": "regsup", "tipo": "caso", "q": "Mediante oficio, la CNBV pide a un transmisor de dinero información adicional para su función de vigilancia. ¿Cómo debe entregarla, si no usa medios electrónicos?", "a": "Por la oficialía de partes, dirigida a la unidad administrativa solicitante, en el plazo señalado", "o": ["Por la oficialía de partes, dirigida a la unidad administrativa solicitante, en el plazo señalado", "Directamente al Presidente de la CNBV, dentro de 20 días hábiles", "Por la oficialía de partes, dirigida a la Junta de Gobierno de la CNBV, dentro de los 10 días hábiles", "A los Inspectores de la unidad solicitante, en la siguiente visita"], "x": "La información pedida por oficio en términos del art. 46 se entrega por oficialía de partes, dirigida a la unidad administrativa que la solicitó, dentro del plazo señalado.", "ref": "Art. 46, primer párrafo · Tema 3.1.2"}, {"id": "S147", "tema": "regsup", "tipo": "caso", "q": "Para completar una visita a una casa de cambio, la CNBV decide incorporar a un Inspector que no figura en la orden de visita. ¿Qué se requiere para que participe?", "a": "Que la CNBV notifique previamente y por escrito a la entidad el aumento de Inspectores", "o": ["Basta con que el Inspector coordinador lo asiente en un acta parcial", "Que la entidad visitada manifieste su conformidad en el acta de inicio", "Basta con que se identifique con credencial vigente con fotografía de la CNBV", "Que la CNBV notifique previamente y por escrito a la entidad el aumento de Inspectores"], "x": "El aumento o sustitución de Inspectores debe notificarse previamente y por escrito a la entidad por el servidor público facultado para emitir la orden.", "ref": "Art. 20, último párrafo · Tema 3.1.2"}, {"id": "S148", "tema": "regsup", "tipo": "caso", "q": "La entidad visitada dice no tener lugar para los Inspectores y les sugiere trabajar en una cafetería cercana con sus propias computadoras y conexión. ¿Cumple con el Reglamento?", "a": "No; debe proporcionarles espacio físico y equipo de cómputo, de oficina y de comunicación", "o": ["Sí, si la visita se practica en un solo día y así se asienta en el acta de inicio", "Sí, siempre que la entidad reembolse a la CNBV los gastos de conexión y traslado", "Sí, porque el espacio y el equipo de los Inspectores corren por cuenta de la CNBV", "No; debe proporcionarles espacio físico y equipo de cómputo, de oficina y de comunicación"], "x": "El art. 30 obliga a la entidad a proporcionar el espacio físico necesario y a poner a disposición el equipo de cómputo, de oficina y de comunicación que requieran los Inspectores.", "ref": "Art. 30, primer párrafo · Tema 3.1.2"}, {"id": "S149", "tema": "regsup", "tipo": "trampa", "q": "¿Cuál de los siguientes supuestos NO obliga a los Inspectores a levantar un acta parcial?", "a": "Que el Representante Legal se niegue a firmar el acta de inicio", "o": ["Que no se rinda el informe por escrito sobre un hecho relevante", "Que la entidad realice acciones tendientes a obstaculizar la visita", "Que la entidad no exhiba la información que le fue requerida", "Que el Representante Legal se niegue a firmar el acta de inicio"], "x": "La negativa a firmar el acta de inicio sólo se asienta en ella (art. 24); los otros tres son casos de acta parcial obligatoria del art. 34.", "ref": "Art. 34, frs. II, III y V; Art. 24 · Tema 3.1.2"}, {"id": "S150", "tema": "regsup", "tipo": "caso", "q": "Una visita no pudo iniciar en la fecha prevista en la orden porque la entidad sufrió un corte eléctrico general, causa ajena a la CNBV. ¿Qué prevé el Reglamento?", "a": "Hacerlo constar en un acta circunstanciada que cumpla, en lo conducente, las formalidades del Reglamento", "o": ["Hacerlo constar en un acta circunstanciada que cumpla, en lo conducente, las formalidades del Reglamento", "Asentarlo sólo en el informe general, sin levantar acta alguna en el domicilio", "Levantar un acta parcial obligatoria por obstaculización de la visita a cargo de la entidad", "Tener por concluida la visita y archivar la orden, sin necesidad de levantar acta"], "x": "Cuando por causas ajenas a la CNBV la visita no se inicia en la fecha prevista, la situación se hace constar en un acta circunstanciada con las formalidades conducentes.", "ref": "Art. 25, último párrafo · Tema 3.1.2"}, {"id": "S151", "tema": "regsup", "tipo": "memoria", "q": "Para efectos del Reglamento, ¿quién se considera «Representante Legal o Apoderado»?", "a": "El director general o quien tenga poder, o facultades por ley, para representarla ante autoridades administrativas", "o": ["El oficial de cumplimiento designado por la entidad y registrado ante la CNBV para atender visitas", "Únicamente el director general, siempre que haya sido designado por el consejo de administración y su poder conste en escritura", "El director general o quien tenga poder, o facultades por ley, para representarla ante autoridades administrativas", "Cualquier empleado que se encuentre en el domicilio de la entidad al momento de iniciar
